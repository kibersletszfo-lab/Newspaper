l_english:
 NFP46_GOOD_LABEL:0 "[ScriptContainer.MakeScope.Var('nfp46_good').GetGoods.GetNameNoIcon]"
 NFP46_METRICS:0 "Good: [ScriptContainer.MakeScope.Var('nfp46_good').GetGoods.GetNameNoIcon]. Buy orders: [ScriptContainer.GetVariableValue('nfp46_buy_before')|1] → [ScriptContainer.GetVariableValue('nfp46_buy_after')|1]; sell orders: [ScriptContainer.GetVariableValue('nfp46_sell_before')|1] → [ScriptContainer.GetVariableValue('nfp46_sell_after')|1]. Gap relative to demand: [ScriptContainer.GetVariableValue('nfp46_gap_before')|1]% → [ScriptContainer.GetVariableValue('nfp46_gap_after')|1]%. On the left is the first saved snapshot in this series; on the right, the latest monthly observation.\nEditorial threshold: supply below 80% of demand in two consecutive monthly snapshots, or the game’s direct shortage flag. Local services, transportation and electricity require separate regional observation."
 NFP46_SHORTAGE_BODY_1:0 "The game directly flags a goods shortage in our market. A supply problem has persisted in two consecutive monthly observations: either a direct shortage flag or a substantial gap between orders.\n\nGood: [ScriptContainer.MakeScope.Var('nfp46_good').GetGoods.GetNameNoIcon]. Buy orders: [ScriptContainer.GetVariableValue('nfp46_buy_before')|1] → [ScriptContainer.GetVariableValue('nfp46_buy_after')|1]; sell orders: [ScriptContainer.GetVariableValue('nfp46_sell_before')|1] → [ScriptContainer.GetVariableValue('nfp46_sell_after')|1]. Gap relative to demand: [ScriptContainer.GetVariableValue('nfp46_gap_before')|1]% → [ScriptContainer.GetVariableValue('nfp46_gap_after')|1]%. On the left is the first saved snapshot in this series; on the right, the latest monthly observation.\n\nThis compares market orders, not the amount of goods people have gone without. These figures do not establish the causes of the gap, any particular construction projects or consequences for the Standard of Living."
 NFP46_SHORTAGE_BODY_2:0 "The latest snapshot directly flags a market shortage. A supply problem has been observed for two months running; the previous snapshot may have qualified through the order gap. This does not establish two months of production penalties.\n\nGood: [ScriptContainer.MakeScope.Var('nfp46_good').GetGoods.GetNameNoIcon]. Buy orders: [ScriptContainer.GetVariableValue('nfp46_buy_before')|1] → [ScriptContainer.GetVariableValue('nfp46_buy_after')|1]; sell orders: [ScriptContainer.GetVariableValue('nfp46_sell_before')|1] → [ScriptContainer.GetVariableValue('nfp46_sell_after')|1]. Gap relative to demand: [ScriptContainer.GetVariableValue('nfp46_gap_before')|1]% → [ScriptContainer.GetVariableValue('nfp46_gap_after')|1]%. On the left is the first saved snapshot in this series; on the right, the latest monthly observation.\n\nThis compares market orders, not the amount of goods people have gone without. These figures do not establish the causes of the gap, any particular construction projects or consequences for the Standard of Living."
 NFP46_SHORTAGE_LEAD_1:0 "The goods shortage has not disappeared from our market observations. We raise the question of supply."
 NFP46_SHORTAGE_LEAD_2:0 "A direct shortage flag has appeared in our market. The problem deserves attention."
 NFP46_SHORTAGE_RECOVERY_BODY_1:0 "Following our warning, the direct shortage flag has been absent in two consecutive monthly observations; supply in both snapshots is also at least 80% of demand. This promises neither a low price nor recovery at every enterprise.\n\nGood: [ScriptContainer.MakeScope.Var('nfp46_good').GetGoods.GetNameNoIcon]. Buy orders: [ScriptContainer.GetVariableValue('nfp46_buy_before')|1] → [ScriptContainer.GetVariableValue('nfp46_buy_after')|1]; sell orders: [ScriptContainer.GetVariableValue('nfp46_sell_before')|1] → [ScriptContainer.GetVariableValue('nfp46_sell_after')|1]. Gap relative to demand: [ScriptContainer.GetVariableValue('nfp46_gap_before')|1]% → [ScriptContainer.GetVariableValue('nfp46_gap_after')|1]%. On the left is the first saved snapshot in this series; on the right, the latest monthly observation.\n\nThis compares market orders, not the amount of goods people have gone without. These figures do not establish the causes of the gap, any particular construction projects or consequences for the Standard of Living."
 NFP46_SHORTAGE_RECOVERY_BODY_2:0 "Two consecutive monthly snapshots show neither the earlier direct shortage flag nor an order gap beyond the editorial threshold. We record the change in observations while keeping availability and price distinct.\n\nGood: [ScriptContainer.MakeScope.Var('nfp46_good').GetGoods.GetNameNoIcon]. Buy orders: [ScriptContainer.GetVariableValue('nfp46_buy_before')|1] → [ScriptContainer.GetVariableValue('nfp46_buy_after')|1]; sell orders: [ScriptContainer.GetVariableValue('nfp46_sell_before')|1] → [ScriptContainer.GetVariableValue('nfp46_sell_after')|1]. Gap relative to demand: [ScriptContainer.GetVariableValue('nfp46_gap_before')|1]% → [ScriptContainer.GetVariableValue('nfp46_gap_after')|1]%. On the left is the first saved snapshot in this series; on the right, the latest monthly observation.\n\nThis compares market orders, not the amount of goods people have gone without. These figures do not establish the causes of the gap, any particular construction projects or consequences for the Standard of Living."
 NFP46_SHORTAGE_RECOVERY_LEAD_1:0 "We return to a published supply story: two observations no longer show the earlier problem."
 NFP46_SHORTAGE_RECOVERY_LEAD_2:0 "There is encouraging news in the market-shortage story."
 NFP46_SHORTAGE_RECOVERY_TITLE_1:0 "The earlier shortage is easing"
 NFP46_SHORTAGE_RECOVERY_TITLE_2:0 "A welcome turn in supply"
 NFP46_SHORTAGE_TITLE_1:0 "Our market: the shortage needs attention"
 NFP46_SHORTAGE_TITLE_2:0 "The supply question remains open"
 NFP46_SUPPLY_GAP_BODY_1:0 "In the latest monthly snapshot, sell orders amount to less than 80% of buy orders. A problem was recorded in the previous month too: either a substantial order gap or the game’s direct shortage flag. The editorial imbalance threshold does not automatically mean a production penalty.\n\nGood: [ScriptContainer.MakeScope.Var('nfp46_good').GetGoods.GetNameNoIcon]. Buy orders: [ScriptContainer.GetVariableValue('nfp46_buy_before')|1] → [ScriptContainer.GetVariableValue('nfp46_buy_after')|1]; sell orders: [ScriptContainer.GetVariableValue('nfp46_sell_before')|1] → [ScriptContainer.GetVariableValue('nfp46_sell_after')|1]. Gap relative to demand: [ScriptContainer.GetVariableValue('nfp46_gap_before')|1]% → [ScriptContainer.GetVariableValue('nfp46_gap_after')|1]%. On the left is the first saved snapshot in this series; on the right, the latest monthly observation.\n\nThis compares market orders, not the amount of goods people have gone without. These figures do not establish the causes of the gap, any particular construction projects or consequences for the Standard of Living."
 NFP46_SUPPLY_GAP_BODY_2:0 "Two consecutive monthly snapshots record a supply problem. Supply is now below 80% of demand; the earlier snapshot showed either such a gap or a direct shortage flag. This is not a conclusion about production penalties or the effects of a high price.\n\nGood: [ScriptContainer.MakeScope.Var('nfp46_good').GetGoods.GetNameNoIcon]. Buy orders: [ScriptContainer.GetVariableValue('nfp46_buy_before')|1] → [ScriptContainer.GetVariableValue('nfp46_buy_after')|1]; sell orders: [ScriptContainer.GetVariableValue('nfp46_sell_before')|1] → [ScriptContainer.GetVariableValue('nfp46_sell_after')|1]. Gap relative to demand: [ScriptContainer.GetVariableValue('nfp46_gap_before')|1]% → [ScriptContainer.GetVariableValue('nfp46_gap_after')|1]%. On the left is the first saved snapshot in this series; on the right, the latest monthly observation.\n\nThis compares market orders, not the amount of goods people have gone without. These figures do not establish the causes of the gap, any particular construction projects or consequences for the Standard of Living."
 NFP46_SUPPLY_GAP_LEAD_1:0 "Supply observations have shown a problem for two months running. In the latest snapshot, supply trails demand substantially."
 NFP46_SUPPLY_GAP_LEAD_2:0 "We draw attention to a persistent supply problem: supply is now substantially below demand."
 NFP46_SUPPLY_GAP_RECOVERY_BODY_1:0 "For two monthly snapshots running, supply has been at least 80% of buy orders and no direct shortage flag has been recorded. A gap may remain below that threshold: the newspaper promises neither complete balance nor low prices.\n\nGood: [ScriptContainer.MakeScope.Var('nfp46_good').GetGoods.GetNameNoIcon]. Buy orders: [ScriptContainer.GetVariableValue('nfp46_buy_before')|1] → [ScriptContainer.GetVariableValue('nfp46_buy_after')|1]; sell orders: [ScriptContainer.GetVariableValue('nfp46_sell_before')|1] → [ScriptContainer.GetVariableValue('nfp46_sell_after')|1]. Gap relative to demand: [ScriptContainer.GetVariableValue('nfp46_gap_before')|1]% → [ScriptContainer.GetVariableValue('nfp46_gap_after')|1]%. On the left is the first saved snapshot in this series; on the right, the latest monthly observation.\n\nThis compares market orders, not the amount of goods people have gone without. These figures do not establish the causes of the gap, any particular construction projects or consequences for the Standard of Living."
 NFP46_SUPPLY_GAP_RECOVERY_BODY_2:0 "Following our warning, the market has remained outside the editorial problem threshold for two months: supply is at least 80% of demand and the direct shortage flag is absent. This is a limited improvement in the indicators, not a ready-made explanation of causes and consequences.\n\nGood: [ScriptContainer.MakeScope.Var('nfp46_good').GetGoods.GetNameNoIcon]. Buy orders: [ScriptContainer.GetVariableValue('nfp46_buy_before')|1] → [ScriptContainer.GetVariableValue('nfp46_buy_after')|1]; sell orders: [ScriptContainer.GetVariableValue('nfp46_sell_before')|1] → [ScriptContainer.GetVariableValue('nfp46_sell_after')|1]. Gap relative to demand: [ScriptContainer.GetVariableValue('nfp46_gap_before')|1]% → [ScriptContainer.GetVariableValue('nfp46_gap_after')|1]%. On the left is the first saved snapshot in this series; on the right, the latest monthly observation.\n\nThis compares market orders, not the amount of goods people have gone without. These figures do not establish the causes of the gap, any particular construction projects or consequences for the Standard of Living."
 NFP46_SUPPLY_GAP_RECOVERY_LEAD_1:0 "We return to the published problem: supply no longer trails demand quite so far."
 NFP46_SUPPLY_GAP_RECOVERY_LEAD_2:0 "Two observations no longer confirm the earlier substantial gap between orders."
 NFP46_SUPPLY_GAP_RECOVERY_TITLE_1:0 "The market gap has narrowed"
 NFP46_SUPPLY_GAP_RECOVERY_TITLE_2:0 "Signs of improvement in supply"
 NFP46_SUPPLY_GAP_TITLE_1:0 "Demand outpaces supply"
 NFP46_SUPPLY_GAP_TITLE_2:0 "The market gap cannot be ignored"
