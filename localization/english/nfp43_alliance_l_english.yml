l_english:
 NFP43_GAINED:0 "A new alliance connection has been observed between our country and [ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName]."
 NFP43_GAINED_ALLIANCE_1_BODY:0 "Our circle of allies has changed. The latest observation confirms an alliance with [ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName].\n\nThis is important news for our diplomacy. The scope of the agreement and participation in any particular conflict must be assessed against the alliance’s current terms."
 NFP43_GAINED_ALLIANCE_1_LEAD:0 "A formal alliance with [ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName] is now in force."
 NFP43_GAINED_ALLIANCE_1_TITLE:0 "Our country has a new ally"
 NFP43_GAINED_ALLIANCE_2_BODY:0 "This alliance was not previously observed; it is now in force. [ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName] belongs among our formal allies.\n\nThe newspaper records a change in diplomatic relations. It does not replace the actual obligations with a promise of unconditional military assistance."
 NFP43_GAINED_ALLIANCE_2_LEAD:0 "The editors note a new alliance between our country and [ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName]."
 NFP43_GAINED_ALLIANCE_2_TITLE:0 "Our network of alliances grows"
 NFP43_GAINED_BLOC_1_BODY:0 "Our shared diplomatic circle has changed: the latest observation confirms that we and [ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName] belong to the same power bloc.\n\nThis reports the bloc’s membership. It does not by itself mean a bilateral alliance has been concluded or that we must participate in every war our partner fights."
 NFP43_GAINED_BLOC_1_LEAD:0 "[ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName] now belongs to the same power bloc as our country."
 NFP43_GAINED_BLOC_1_TITLE:0 "A new partner in our power bloc"
 NFP43_GAINED_BLOC_2_BODY:0 "A new shared connection appeared between observations: our country and [ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName] belong to the same bloc. Either side may have changed its affiliation.\n\nThe newspaper records the new relationship without attributing it to an unconfirmed invitation or military assistance treaty."
 NFP43_GAINED_BLOC_2_LEAD:0 "We and [ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName] now belong to the same power bloc."
 NFP43_GAINED_BLOC_2_TITLE:0 "Our circle of bloc partners has changed"
 NFP43_GAINED_METRICS:0 "New strategic connection involving our country between observations. Type: [SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp20_extra'), '(CFixedPoint)1'), 'NFP43_KIND_ALLIANCE', 'NFP43_KIND_BLOC')]. The first snapshot is created silently. Checks run weekly and before printing; short-lived changes between them may be missed. The article month is the month of detection, not an established signing date. Priority 160; domestic reader only, without the foreign geographical filter."
 NFP43_KIND_ALLIANCE:0 "formal alliance"
 NFP43_KIND_BLOC:0 "shared power bloc membership"
 NFP43_LOST:0 "Our former alliance connection with [ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName] is no longer observed."
 NFP43_LOST_ALLIANCE_1_BODY:0 "Our list of allies has changed: the previously active alliance with [ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName] is absent from the latest observation.\n\nThis is a reason to reconsider plans built on the former relationship. The editors have not established who ended the connection or why."
 NFP43_LOST_ALLIANCE_1_LEAD:0 "[ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName] is no longer linked to us by an observed formal alliance."
 NFP43_LOST_ALLIANCE_1_TITLE:0 "The former alliance is no longer in force"
 NFP43_LOST_ALLIANCE_2_BODY:0 "Our former alliance with [ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName] is absent from the latest snapshot of relations.\n\nThe circumstances require separate examination: without evidence, a country’s disappearance and a diplomatic rupture cannot be treated as the same cause."
 NFP43_LOST_ALLIANCE_2_LEAD:0 "The formal alliance with [ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName] is no longer observed."
 NFP43_LOST_ALLIANCE_2_TITLE:0 "A gap in our network of alliances"
 NFP43_LOST_BLOC_1_BODY:0 "We previously shared a power bloc with [ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName]. The latest snapshot no longer confirms this connection.\n\nEither country’s position may have changed, or the bloc itself. The editors record the result without claiming, in the absence of evidence, which party left."
 NFP43_LOST_BLOC_1_LEAD:0 "[ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName] is no longer observed in the same power bloc as our country."
 NFP43_LOST_BLOC_1_TITLE:0 "Our shared bloc membership has ended"
 NFP43_LOST_BLOC_2_BODY:0 "Our country and [ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName] are no longer observed sharing bloc membership. This change concerns our immediate diplomatic surroundings.\n\nIts cause and initiator have not been established here. This report does not contradict a bilateral alliance, if one exists separately."
 NFP43_LOST_BLOC_2_LEAD:0 "Our former bloc connection with [ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName] is no longer confirmed."
 NFP43_LOST_BLOC_2_TITLE:0 "A change in our shared bloc"
 NFP43_LOST_METRICS:0 "A strategic connection involving our country is no longer observed. Type: [SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp20_extra'), '(CFixedPoint)1'), 'NFP43_KIND_ALLIANCE', 'NFP43_KIND_BLOC')]. Checks run weekly and before printing. The party responsible and exact date have not been established. A country’s disappearance also ends the connection. Priority 170; domestic reader only."
 NFP43_RELATION:0 "our country’s alliance connection"
 NFP43_WAR:0 "War has begun: [ScriptContainer.MakeScope.Var('nfp20_extra_detail').GetCountryDefinition.GetName] is the attacking side; [ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName] is the defending side."
 NFP43_WAR_ALLIANCE_1_BODY:0 "War has begun: [ScriptContainer.MakeScope.Var('nfp20_extra_detail').GetCountryDefinition.GetName] is the initiator and [ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName] the target of the Diplomatic Play. At the outbreak of war, our country had a formal alliance with the defending power.\n\nThe editors give this news prominence. An alliance alone does not permit us to announce that our country has already entered the conflict."
 NFP43_WAR_ALLIANCE_1_LEAD:0 "[ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName] has become the defending side in a new war."
 NFP43_WAR_ALLIANCE_1_TITLE:0 "Our ally is under attack"
 NFP43_WAR_ALLIANCE_2_BODY:0 "The initiator of the new war is [ScriptContainer.MakeScope.Var('nfp20_extra_detail').GetCountryDefinition.GetName]; the defending side is [ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName]. Our alliance connection with the target was confirmed at the time of the event.\n\nThis directly concerns our diplomatic position. Participation and the fulfilment of obligations cannot be inferred from a single report that war has begun."
 NFP43_WAR_ALLIANCE_2_LEAD:0 "War has begun against [ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName], with whom our alliance is in force."
 NFP43_WAR_ALLIANCE_2_TITLE:0 "War reaches our ally"
 NFP43_WAR_BLOC_1_BODY:0 "War has begun: [ScriptContainer.MakeScope.Var('nfp20_extra_detail').GetCountryDefinition.GetName] is the initiator and [ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName] the defending side. At the outbreak of the conflict, the target belonged to our power bloc.\n\nThe news deserves our government’s attention. A shared bloc alone establishes neither a military alliance nor an obligation to enter the war."
 NFP43_WAR_BLOC_1_LEAD:0 "[ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName], a member of our power bloc, has become the target of a new war."
 NFP43_WAR_BLOC_1_TITLE:0 "War against our bloc partner"
 NFP43_WAR_BLOC_2_BODY:0 "War has begun between initiator [ScriptContainer.MakeScope.Var('nfp20_extra_detail').GetCountryDefinition.GetName] and target [ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName]. At the time of the event, the latter shared power bloc membership with our country.\n\nThe newspaper reports a diplomatic event close to home without declaring our country a participant or assigning unconfirmed obligations to the bloc."
 NFP43_WAR_BLOC_2_LEAD:0 "Our fellow power bloc member, [ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName], is now the defending side."
 NFP43_WAR_BLOC_2_TITLE:0 "War touches our diplomatic circle"
 NFP43_WAR_METRICS:0 "Source: on_diplo_play_war_start. Records the initiator and target of the Diplomatic Play and the reader’s alliance connection with the target at that moment. Initiator: [ScriptContainer.MakeScope.Var('nfp20_extra_detail').GetCountryDefinition.GetName]. Target: [ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName]. Priority 190; urgent candidate for the War section. Shared power bloc membership does not by itself confirm an obligation to enter the war."
