l_english:
 NFP89_LAW_COLD:0 "We have little affection for this country. That alone makes its law neither better nor worse. Let us consider what changes for people: a dispute with a foreign government is easier to judge when one understands what is at stake."
 NFP89_LAW_DEPENDENT:0 "Our countries are linked by dependency. That brings this domestic change closer to our affairs, but disagreements there are not simply copies of our own. The new rule deserves to be judged on its own terms."
 NFP89_LAW_NEIGHBOR:0 "For neighbours, this is hardly distant news. Comparison with our own arrangements is useful; treating a foreign law as a ready-made prescription would be hasty. The house next door may have different walls."
 NFP89_LAW_PARTNER:0 "The change concerns a partner. Our shared plans remain, but a country is worth knowing beyond its signature on an agreement. We shall see how the new rule takes root."
 NFP89_LAW_THREAT:0 "Relations with this country give us reason for caution. The new law itself is not necessarily aimed at us. Understanding how that country now works is more useful than greeting every change with a sneer."
 NFP89_WORLD_ACW_DISTANT:0 "From afar, America’s war can look like an argument between two camps. That convenient view can obscure the central fact: the country has entered an internal armed struggle whose outcome remains unknown."
 NFP89_WORLD_ACW_NEIGHBOR:0 "For neighbours, the American Civil War is too close to file among distant dispatches. Proximity deserves attention, although it does not by itself prove a threat to our border."
 NFP89_WORLD_ACW_OWN:0 "When civil war is at home, the word “internal” offers little comfort. America’s division is now being fought over; today’s news does not yet tell us who will win or at what cost."
 NFP89_WORLD_ACW_PARTNER:0 "Our American connections must now be considered against a civil war. Existing agreements deserve a careful rereading: friendship with a country supplies no ready answer to its internal division."
 NFP89_WORLD_ACW_RIVAL:0 "Dislike of the American government does not make civil war harmless entertainment. The conflict changes the position of a country we must reckon with; the editors will not appoint a winner in advance."
 NFP89_WORLD_AUS_DISTANT:0 "Australia appears in the news as a united state. How it uses that arrangement belongs to future editions; today’s report does not yet contain that story."
 NFP89_WORLD_AUS_NEIGHBOR:0 "Australian union has occurred in a part of the world close to us. Proximity makes the new political setting important, but without further facts it does not explain what our residents will gain or lose."
 NFP89_WORLD_AUS_OWN:0 "Australian union is our readers’ own news. A unified state has emerged; how well it connects the everyday affairs of different places remains to be seen."
 NFP89_WORLD_AUS_PARTNER:0 "Our Australian partner has a new common arrangement. Shared plans should take the change into account, without automatically attributing wealth or ready-made new commitments to union."
 NFP89_WORLD_AUS_RIVAL:0 "Our relations with Australia are difficult. That does not reduce its union to an empty formality: understanding the change is more useful than declaring it insignificant in advance."
 NFP89_WORLD_CAN_DISTANT:0 "Canada’s formation changes the North American map. That is what this report establishes; an account of specific economic consequences for us requires further evidence."
 NFP89_WORLD_CAN_NEIGHBOR:0 "Canadian union has taken shape nearby. For neighbours this changes the immediate political map; announcing new Canadian intentions along with it would be speculation."
 NFP89_WORLD_CAN_OWN:0 "Canada has formed, giving our readers a new political arrangement of their own. A common map now exists; everyday life will show how familiar local questions are handled within it."
 NFP89_WORLD_CAN_PARTNER:0 "Canadian union concerns a country to which we have commitments. Shared calculations deserve a check against the new arrangement, not merely a change of name in old papers."
 NFP89_WORLD_CAN_RIVAL:0 "Canadian union matters even where relations are difficult. A new political arrangement need not please our editors to deserve a serious examination."
 NFP89_WORLD_CHINA_DISTANT:0 "Even from afar, China’s fragmentation deserves a full page. But a newspaper’s speculation cannot bridge the distance between a world event and a change on our own shop counters."
 NFP89_WORLD_CHINA_NEIGHBOR:0 "For neighbours, China’s fragmentation is a change across a nearby border. The old map no longer tells us whose authority operates nearby; specific consequences must be assessed separately."
 NFP89_WORLD_CHINA_OWN:0 "For our readers, China’s fragmentation is part of their own story. Who now makes decisions, and which authority can carry them out, matters more than an elegant explanation of the new map."
 NFP89_WORLD_CHINA_PARTNER:0 "Our plans involved China. Its familiar name can no longer automatically stand for the former unified state: before continuing the conversation, we must establish whom to address."
 NFP89_WORLD_CHINA_RIVAL:0 "The fragmentation of a country with which relations are difficult may invite satisfaction. Yet a multitude of new authorities promises neither a convenient neighbour nor simpler negotiations."
 NFP89_WORLD_COMMUNE_DISTANT:0 "The Paris Commune will be debated far beyond France. This edition distinguishes the established event from conclusions about who elsewhere should expect a repetition."
 NFP89_WORLD_COMMUNE_NEIGHBOR:0 "For France’s neighbours, news of the Commune comes from a nearby capital. That proximity deserves attention, but does not tell us whether anything similar will happen at home."
 NFP89_WORLD_COMMUNE_OWN:0 "The Paris Commune concerns authority in our own country. Behind the grand political name are events still unfolding; today’s edition has no convenient final resolution."
 NFP89_WORLD_COMMUNE_PARTNER:0 "News of the Commune comes from France, to which we have commitments. Existing diplomatic calculations must now be set beside a new question of authority, rather than merely a partner’s familiar name."
 NFP89_WORLD_COMMUNE_RIVAL:0 "Difficult relations with France invite pointed comments. Yet the Paris Commune first requires an understanding of what is happening to authority; a clever jibe is no substitute."
 NFP89_WORLD_ETH_DISTANT:0 "Ethiopian unification deserves a place in the world chronicle. Its effect on specific international affairs remains to be observed; a new map does not contain every future answer."
 NFP89_WORLD_ETH_NEIGHBOR:0 "Ethiopia has united nearby. Its neighbours should establish the new political setting before continuing to discuss the region as though this news had never arrived."
 NFP89_WORLD_ETH_OWN:0 "Ethiopian unification belongs to our readers’ own story. A united political arrangement is established news; accounts of how it improves life must rest on what happens next."
 NFP89_WORLD_ETH_PARTNER:0 "Our Ethiopian partner’s political arrangement has changed. Shared plans should be checked against unification, rather than treating the new situation as merely another form of old agreements."
 NFP89_WORLD_ETH_RIVAL:0 "Even where relations are difficult, Ethiopian unification cannot be crossed out of our calculations. The country’s arrangement has changed; whether we welcome it is another question, and does not erase the fact."
 NFP89_WORLD_FLU_DISTANT:0 "Influenza has reached the world news. That is not an account of conditions in every country: where and how severely people are affected must be established separately, without relying on a sweeping headline."
 NFP89_WORLD_FLU_NEIGHBOR:0 "News of influenza comes from neighbours. Proximity deserves attention, but the editors will not declare that the illness has already spread here without evidence."
 NFP89_WORLD_FLU_OWN:0 "The influenza report concerns the country covered by our edition. It is a reason to follow confirmed information about the illness; this dispatch gives neither a case count nor the extent of its spread."
 NFP89_WORLD_FLU_PARTNER:0 "News of influenza comes from a state to which we have commitments. The illness deserves attention in its own right: shared diplomacy cannot replace information about people’s health."
 NFP89_WORLD_FLU_RIVAL:0 "Relations with a government may be poor, but influenza is no cause for celebration. We shall judge what is happening to the illness from evidence about it, rather than a list of political sympathies."
 NFP89_WORLD_GER_DISTANT:0 "German unification is visible beyond Europe. The appearance of a unified state does not yet tell us which changes will reach our own affairs."
 NFP89_WORLD_GER_NEIGHBOR:0 "For Germany’s neighbours, unification means a unified state now stands next door. How it uses that arrangement remains to be seen; the editors will not treat every next step as already decided."
 NFP89_WORLD_GER_OWN:0 "Germany has united, and for our readers this changes their own state. A common name now exists; how much common purpose follows will be shown in the years ahead."
 NFP89_WORLD_GER_PARTNER:0 "Our German partner now has a united state. Shared plans should be checked against its new position: yesterday’s acquaintances remain useful, but cannot preserve yesterday’s political map."
 NFP89_WORLD_GER_RIVAL:0 "German unification changes a country with which our relations are difficult. Pretending that only the map’s lettering has changed would be a rather expensive form of reassurance."
 NFP89_WORLD_ITA_DISTANT:0 "Italy reaches the world pages with news of unification. An account of what it brings our country must wait for the next part of the story: specific changes."
 NFP89_WORLD_ITA_NEIGHBOR:0 "Italy’s neighbours must now look at the peninsula differently. A nearby state’s political structure has changed, although this news alone provides no proof of its future intentions."
 NFP89_WORLD_ITA_OWN:0 "Italy now has a unified state. For those living within it, unification begins where the new name meets familiar local affairs."
 NFP89_WORLD_ITA_PARTNER:0 "Our dealings with an Italian partner now take place in a new political setting. Discussions should begin with a review of shared plans, rather than assuming unification changes nothing."
 NFP89_WORLD_ITA_RIVAL:0 "Difficult relations with Italy do not make its unification trivial. A unified state has taken shape on the peninsula; withholding congratulations does not make the news less substantial."
 NFP89_WORLD_JAP_DISTANT:0 "Japan’s restoration deserves attention even at a distance. “Change” should not quietly be translated into “successful renewal”: the latter still requires evidence of its own."
 NFP89_WORLD_JAP_NEIGHBOR:0 "For Japan’s neighbours, restoration changes the nearby political setting. We shall watch the authorities’ decisions: their new position alone cannot reveal an entire future programme."
 NFP89_WORLD_JAP_OWN:0 "The imperial restoration has occurred in our country. The change in authority is established; crediting it with every future success before those successes exist would be premature."
 NFP89_WORLD_JAP_PARTNER:0 "The position of supreme authority has changed in Japan, our partner. We should reconsider with whom and about what we negotiate, rather than pronounce every existing connection extinguished."
 NFP89_WORLD_JAP_RIVAL:0 "We may have grievances against Japan’s authorities. But restoration is a political change, not ready-made proof of either national strength or approaching failure."
 NFP89_WORLD_PANAMA_DISTANT:0 "The new route through Panama changes the possibilities of sea transport. It would be pleasant to follow that with a tale of profits already earned at home, but today’s report contains no such evidence."
 NFP89_WORLD_PANAMA_NEIGHBOR:0 "The Panama Canal has appeared in a part of the world close to us. A new passage now connects two oceans; which of our shipments it affects must be assessed separately."
 NFP89_WORLD_PANAMA_OWN:0 "The Panama Canal is complete in the country covered by this edition. The oceans have been connected; how the new passage is used remains to be seen."
 NFP89_WORLD_PANAMA_PARTNER:0 "Our ties to the state at the Panama Canal make its completion particularly interesting. A shared diplomatic circle, however, means neither free passage nor a ready-made trading gain."
 NFP89_WORLD_PANAMA_RIVAL:0 "With relations strained between us and the state at Panama, the canal may look merely like someone else’s good fortune. It is more useful to establish what the passage actually allows and on what terms it can be used."
 NFP89_WORLD_ROM_DISTANT:0 "The union of the Romanian principalities changes the region’s political arrangement. From afar, understanding the change itself should come before finding confirmation of a favourite general theory."
 NFP89_WORLD_ROM_NEIGHBOR:0 "For neighbours, Romanian union is a change nearby, not merely a line in the European chronicle. Establishing with whom shared questions will be discussed matters more than assuming how every one will be resolved."
 NFP89_WORLD_ROM_OWN:0 "Romanian union changes our readers’ own state. Shared decisions now have a new political arrangement; familiar local questions have not disappeared merely because of it."
 NFP89_WORLD_ROM_PARTNER:0 "A country to which we have commitments has united in the Romanian lands. Existing connections retain their value, but discussions should now take the new political arrangement into account."
 NFP89_WORLD_ROM_RIVAL:0 "Our relations with the Romanian state are difficult. Union still changes the diplomatic calculation: the old picture cannot be preserved merely because the new one is inconvenient."
 NFP89_WORLD_SPRING_DISTANT:0 "Different political stories sit beneath the common heading of the Springtime of Nations. From afar they are especially easy to mistake for one; preserving their differences serves readers better than an elegant generalisation in place of facts."
 NFP89_WORLD_SPRING_NEIGHBOR:0 "Upheaval is taking place among our neighbours. That brings the news close, but does not make the same outcome inevitable at home: a political destiny does not arrive ready-made across a border."
 NFP89_WORLD_SPRING_OWN:0 "For our readers, the Springtime of Nations is more than a heading in European news. Developments at home must be understood on their own evidence, rather than through a convenient historical label."
 NFP89_WORLD_SPRING_PARTNER:0 "Political upheaval has touched a state to which we have commitments. It merits closer attention: an existing shared plan does not explain how a partner will pass through change."
 NFP89_WORLD_SPRING_RIVAL:0 "The Springtime of Nations has reached a country with which our relations are difficult. Counting every difficulty there as a gain for us would be easy arithmetic for very complicated events."
 NFP89_WORLD_SUEZ_DISTANT:0 "Suez shortens the old sea detour for routes suited to the new passage. That does not mean every good at home becomes cheaper: the canal and the shop counter remain some distance apart."
 NFP89_WORLD_SUEZ_NEIGHBOR:0 "The Suez Canal has opened near our country. A new route nearby deserves attention; whether using it pays depends on more than distance on a map."
 NFP89_WORLD_SUEZ_OWN:0 "The Suez Canal is complete in the country covered by our readers’ edition. A great construction project has become a passage between seas; its economic return remains to be seen in practice."
 NFP89_WORLD_SUEZ_PARTNER:0 "We have commitments to the state at the Suez Canal. The new passage belongs in shared calculations, but completion alone promises us no special terms of use."
 NFP89_WORLD_SUEZ_RIVAL:0 "Relations with the state at Suez are difficult, but that makes the canal no less real. Before treating it as an advantage directed against us, we should examine the actual terms of passage."
 NFP89_WORLD_TAIPING_DISTANT:0 "China’s struggle now includes a separate Taiping state. That changes the cast of the story, but does not allow the editors to announce its ending."
 NFP89_WORLD_TAIPING_NEIGHBOR:0 "A Taiping authority has emerged among our neighbours. Who will control what nearby deserves attention; today’s report supplies no complete account of its future reach."
 NFP89_WORLD_TAIPING_OWN:0 "The emergence of a Taiping state belongs to our own political story. A new authority has appeared; its place in the struggle should not be replaced with a conclusion written in advance."
 NFP89_WORLD_TAIPING_PARTNER:0 "Our connections to the Taiping state bring this news closer than an ordinary Chinese dispatch. Shared calculations must take account of a separate authority’s emergence, rather than assume its inevitable success."
 NFP89_WORLD_TAIPING_RIVAL:0 "Relations with the Taiping state are far from straightforward. That makes it important to distinguish a new authority’s emergence from its future capabilities: the former is known, the latter cannot be read from one dispatch."
 NFP89_WORLD_YUG_DISTANT:0 "A new unified state has appeared in the Balkans. From afar, it is easy to assign it a ready-made historical role; we shall begin more modestly, with the established change on the map."
 NFP89_WORLD_YUG_NEIGHBOR:0 "For Yugoslavia’s neighbours, a unified state changes the nearby political map. What decisions follow remains unknown; proximity does not let the editors read another government’s plans in advance."
 NFP89_WORLD_YUG_OWN:0 "Yugoslavia has formed, and our readers are part of a new unified state. Its shared name must now meet varied local affairs: that is where union will acquire its everyday meaning."
 NFP89_WORLD_YUG_PARTNER:0 "Yugoslavia’s formation changes the arrangement of our Balkan partner. Shared plans deserve a fresh discussion on their merits: a new state calls for revised calculations, not merely congratulations."
 NFP89_WORLD_YUG_RIVAL:0 "Our relations with the Yugoslav state are difficult. Its emergence still requires attention: explaining Balkan affairs through an old map merely out of dislike for the new one would be a curious reassurance."
