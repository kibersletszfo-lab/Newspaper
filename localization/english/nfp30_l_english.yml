l_english:
 NFP30_ACCESS_HOME_1_BODY:0 "Region: [SelectLocalization(And(ScriptContainer.MakeScope.Var('nfp20_problem_state').IsSet, ScriptContainer.MakeScope.Var('nfp20_problem_state').GetState.IsValid), 'NFP40_STATE_LINK', 'NFP40_REGION_FALLBACK')]. Market Access has remained below 90% for two months running. Latest value: [Multiply_CFixedPoint(ScriptContainer.GetVariableValue('nfp20_after'), '(CFixedPoint)100')|1]%.\n\nThe available information does not establish the cause. Local infrastructure, sea connections and other restrictions need checking. Blaming the railways alone would be premature."
 NFP30_ACCESS_HOME_1_LEAD:0 "Poor Market Access persists in one of our states. This difficulty deserves attention alongside our economic successes."
 NFP30_ACCESS_HOME_1_TITLE:0 "Our market remains too far away"
 NFP30_ACCESS_HOME_2_BODY:0 "Region: [SelectLocalization(And(ScriptContainer.MakeScope.Var('nfp20_problem_state').IsSet, ScriptContainer.MakeScope.Var('nfp20_problem_state').GetState.IsValid), 'NFP40_STATE_LINK', 'NFP40_REGION_FALLBACK')]. Market Access has remained below 90% for two months running. Latest value: [Multiply_CFixedPoint(ScriptContainer.GetVariableValue('nfp20_after'), '(CFixedPoint)100')|1]%.\n\nThe figure shows restricted access but does not explain its origin. Before choosing a remedy, we need to find out where the connection has broken down."
 NFP30_ACCESS_HOME_2_LEAD:0 "A second month of poor Market Access gives us reason to raise the question of our state’s connection to the national economy again."
 NFP30_ACCESS_HOME_2_TITLE:0 "A state waits for a reliable route to market"
 NFP30_ACCESS_METRICS:0 "Region: [SelectLocalization(And(ScriptContainer.MakeScope.Var('nfp20_problem_state').IsSet, ScriptContainer.MakeScope.Var('nfp20_problem_state').GetState.IsValid), 'NFP40_STATE_LINK', 'NFP40_REGION_FALLBACK')]. Market Access has remained below 90% for two months running. Latest value: [Multiply_CFixedPoint(ScriptContainer.GetVariableValue('nfp20_after'), '(CFixedPoint)100')|1]%."
 NFP30_ACCESS_RECOVERY_HOME_1_BODY:0 "Region: [SelectLocalization(And(ScriptContainer.MakeScope.Var('nfp20_problem_state').IsSet, ScriptContainer.MakeScope.Var('nfp20_problem_state').GetState.IsValid), 'NFP40_STATE_LINK', 'NFP40_REGION_FALLBACK')]. At the previous warning, Market Access was [Multiply_CFixedPoint(ScriptContainer.GetVariableValue('nfp20_before'), '(CFixedPoint)100')|1]%; the latest value is [Multiply_CFixedPoint(ScriptContainer.GetVariableValue('nfp20_after'), '(CFixedPoint)100')|1]%. Access has remained at or above 90% for two months running.\n\nWe are pleased to report an improvement sustained over two months. This does not justify declaring every local difficulty solved or attributing the change to an unconfirmed cause."
 NFP30_ACCESS_RECOVERY_HOME_1_LEAD:0 "The story of our state’s poor connection to the market has taken a favourable turn."
 NFP30_ACCESS_RECOVERY_HOME_1_TITLE:0 "The state draws closer to the common market again"
 NFP30_ACCESS_RECOVERY_HOME_2_BODY:0 "Region: [SelectLocalization(And(ScriptContainer.MakeScope.Var('nfp20_problem_state').IsSet, ScriptContainer.MakeScope.Var('nfp20_problem_state').GetState.IsValid), 'NFP40_STATE_LINK', 'NFP40_REGION_FALLBACK')]. At the previous warning, Market Access was [Multiply_CFixedPoint(ScriptContainer.GetVariableValue('nfp20_before'), '(CFixedPoint)100')|1]%; the latest value is [Multiply_CFixedPoint(ScriptContainer.GetVariableValue('nfp20_after'), '(CFixedPoint)100')|1]%. Access has remained at or above 90% for two months running.\n\nTwo consecutive months give grounds for cautious satisfaction. The causes of the change and the circumstances of individual businesses require separate examination."
 NFP30_ACCESS_RECOVERY_HOME_2_LEAD:0 "Good news has arrived on a matter previously troubling this newspaper: the state’s Market Access has improved."
 NFP30_ACCESS_RECOVERY_HOME_2_TITLE:0 "The market connection grows stronger"
 NFP30_ACCESS_RECOVERY_METRICS:0 "Region: [SelectLocalization(And(ScriptContainer.MakeScope.Var('nfp20_problem_state').IsSet, ScriptContainer.MakeScope.Var('nfp20_problem_state').GetState.IsValid), 'NFP40_STATE_LINK', 'NFP40_REGION_FALLBACK')]. At the previous warning, Market Access was [Multiply_CFixedPoint(ScriptContainer.GetVariableValue('nfp20_before'), '(CFixedPoint)100')|1]%; the latest value is [Multiply_CFixedPoint(ScriptContainer.GetVariableValue('nfp20_after'), '(CFixedPoint)100')|1]%. Access has remained at or above 90% for two months running."
 NFP30_ARTICLE_DETAILS:0 "[SelectLocalization(ScriptContainer.HasVariable('nfp63_schema'), 'NFP63_DETAILS', 'NFP50_EMPTY')]\nEditorial information\nFact No. [ScriptContainer.GetVariableValue('nfp20_id')|0]; episode [ScriptContainer.GetVariableValue('nfp20_episode')|0].\nSelection: [Localize(ScriptContainer.MakeScope.Var('nfp20_reason').GetFlagName)]. Priority: [ScriptContainer.GetVariableValue('nfp20_priority')|0].\n[Localize(ScriptContainer.MakeScope.Var('nfp30_metrics').GetFlagName)]\nPresentation: [SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp30_domestic'), '(CFixedPoint)1'), 'NFP30_HOME', 'NFP30_AWAY')]; variant [ScriptContainer.GetVariableValue('nfp30_variant')|0].\nCountry names use persistent definitions; the dynamic historical name was not stored.\n[SelectLocalization(ScriptContainer.HasVariable('nfp63_schema'), 'NFP50_EMPTY', SelectLocalization(ScriptContainer.HasVariable('nfp31_reach'), 'NFP30_REACH_LINE', 'NFP30_REACH_OLD'))]"
