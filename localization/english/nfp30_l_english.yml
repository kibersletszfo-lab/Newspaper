 NFP50_SUPPLY_BOTH_1:0 "Both government and military buildings use this good. That makes supply more important; these figures do not establish specific losses for public services or the army."
 NFP50_SUPPLY_BOTH_2:0 "Government and military buildings use this good. Supply therefore deserves closer attention, while keeping the good’s uses distinct from proven consequences of its shortage."
 NFP50_SUPPLY_CRITICAL_1:0 "A particular concern: on the event date, the combination of market shortage severity and local shortages in our country meets the conditions for a red goods shortage warning. These signs do not establish how many inhabitants or businesses are affected."
 NFP50_SUPPLY_CRITICAL_2:0 "This time the problem deserves particular attention: on the event date, our country meets the conditions for a red goods shortage warning. Those conditions do not establish the scale of losses at individual businesses."
 NFP50_SUPPLY_END_1:0 "The editorial office urges prompt investigation. Choosing between greater production, trade and other measures requires a look at local conditions: the report alone offers no ready-made economic prescription."
 NFP50_SUPPLY_END_2:0 "The situation deserves early attention. First we need to find where supply is constrained; newspaper figures help frame the question, but do not replace an examination of production and trade."
 NFP50_SUPPLY_FOLLOW_1:0 "We return to a supply story already covered in these pages. A new observation gives us reason to continue the discussion."
 NFP50_SUPPLY_FOLLOW_2:0 "This question has appeared in our pages before. Fresh information calls us back to it."
 NFP50_SUPPLY_GAP_1:0 "The good is [ScriptContainer.MakeScope.Var('nfp46_good').GetGoods.GetNameNoIcon]. Sell orders amount to less than 80% of buy orders. Buy orders: [ScriptContainer.GetVariableValue('nfp46_buy_before')|1] → [ScriptContainer.GetVariableValue('nfp46_buy_after')|1]; sell orders: [ScriptContainer.GetVariableValue('nfp46_sell_before')|1] → [ScriptContainer.GetVariableValue('nfp46_sell_after')|1]. The left-hand value is the first saved observation in this series; the right-hand value is the observation on the event date. A substantial order gap alone does not prove a production penalty."
 NFP50_SUPPLY_GAP_2:0 "Demand for “[ScriptContainer.MakeScope.Var('nfp46_good').GetGoods.GetNameNoIcon]” considerably exceeds supply: sell orders amount to less than 80% of buy orders. Buy orders: [ScriptContainer.GetVariableValue('nfp46_buy_before')|1] → [ScriptContainer.GetVariableValue('nfp46_buy_after')|1]; sell orders: [ScriptContainer.GetVariableValue('nfp46_sell_before')|1] → [ScriptContainer.GetVariableValue('nfp46_sell_after')|1]. The left-hand value is the first saved observation in this series; the right-hand value is the observation on the event date. These are market orders, not quantities of goods inhabitants have gone without."
 NFP50_SUPPLY_GOVERNMENT_1:0 "Government buildings use this good. That is an important use, but the report does not identify particular institutions or the scale of any losses they have suffered."
 NFP50_SUPPLY_GOVERNMENT_2:0 "Demand for this good comes partly from government buildings. Such a use does not establish damage to any particular institution."
 NFP50_SUPPLY_INTRO_1:0 "Our market needs attention: a persistent supply problem has been identified."
 NFP50_SUPPLY_INTRO_2:0 "Supply brings us back to the market reports. The newspaper singles out the good affected by the problem."
 NFP50_SUPPLY_LONG_1:0 "The problem appears in [ScriptContainer.GetVariableValue('nfp50_supply_observations')|0] consecutive monthly observations. Each showed a substantial order gap or a direct shortage indicator; this does not mean that a production penalty persisted continuously between report dates."
 NFP50_SUPPLY_LONG_2:0 "The number of consecutive monthly observations showing a supply problem has reached [ScriptContainer.GetVariableValue('nfp50_supply_observations')|0]. The sign may have alternated between an order gap and a market shortage; this record cannot reconstruct the situation day by day."
 NFP50_SUPPLY_MILITARY_1:0 "This good is used to supply military buildings. That makes the question worth attention, but does not prove that our troops have already suffered losses or a penalty."
 NFP50_SUPPLY_MILITARY_2:0 "Military buildings use this good. The newspaper notes the importance of supply without attributing unproven consequences to it for the army."
 NFP50_SUPPLY_NATIVE_1:0 "The good is [ScriptContainer.MakeScope.Var('nfp46_good').GetGoods.GetNameNoIcon]. A direct market shortage indicator was recorded on the event date. Buy orders: [ScriptContainer.GetVariableValue('nfp46_buy_before')|1] → [ScriptContainer.GetVariableValue('nfp46_buy_after')|1]; sell orders: [ScriptContainer.GetVariableValue('nfp46_sell_before')|1] → [ScriptContainer.GetVariableValue('nfp46_sell_after')|1]. The left-hand value is the first saved observation in this series; the right-hand value is the observation on the event date."
 NFP50_SUPPLY_NATIVE_2:0 "The report concerns [ScriptContainer.MakeScope.Var('nfp46_good').GetGoods.GetNameNoIcon]: the latest observation records a direct market shortage indicator. Buy orders: [ScriptContainer.GetVariableValue('nfp46_buy_before')|1] → [ScriptContainer.GetVariableValue('nfp46_buy_after')|1]; sell orders: [ScriptContainer.GetVariableValue('nfp46_sell_before')|1] → [ScriptContainer.GetVariableValue('nfp46_sell_after')|1]. The left-hand value is the first saved observation in this series; the right-hand value is the observation on the event date."
 NFP50_SUPPLY_NO_IMPORT_1:0 "The current observation records no imports of this good into the market. Production: [ScriptContainer.GetVariableValue('nfp50_supply_production')|1]; consumption: [ScriptContainer.GetVariableValue('nfp50_supply_consumption')|1]; exports: [ScriptContainer.GetVariableValue('nfp50_supply_exports')|1]. An absence of imports does not prove an absence of trading opportunities."
 NFP50_SUPPLY_NO_IMPORT_2:0 "The market records no imports of this good on the event date. It produces [ScriptContainer.GetVariableValue('nfp50_supply_production')|1], consumes [ScriptContainer.GetVariableValue('nfp50_supply_consumption')|1] and exports [ScriptContainer.GetVariableValue('nfp50_supply_exports')|1]. This report does not assess the possibility of future deliveries."
 NFP50_SUPPLY_PRICE_1:0 "Price on the event date: £[ScriptContainer.GetVariableValue('nfp50_supply_price')|1]; deviation from base price: [ScriptContainer.GetVariableValue('nfp50_supply_premium')|1]% (a negative value means cheaper). Price does not measure the good’s availability to every buyer."
 NFP50_SUPPLY_PRICE_2:0 "There is a price side to the story too. Price on the event date: £[ScriptContainer.GetVariableValue('nfp50_supply_price')|1]; deviation from base price: [ScriptContainer.GetVariableValue('nfp50_supply_premium')|1]% (a negative value means cheaper). Price does not measure the good’s availability to every buyer."
 NFP50_SUPPLY_RECOVERY_1:0 "The good is [ScriptContainer.MakeScope.Var('nfp46_good').GetGoods.GetNameNoIcon]. In [ScriptContainer.GetVariableValue('nfp50_supply_good_observations')|0] consecutive monthly observations, the direct shortage indicator was absent and supply amounted to at least 80% of demand. Buy orders: [ScriptContainer.GetVariableValue('nfp46_buy_before')|1] → [ScriptContainer.GetVariableValue('nfp46_buy_after')|1]; sell orders: [ScriptContainer.GetVariableValue('nfp46_sell_before')|1] → [ScriptContainer.GetVariableValue('nfp46_sell_after')|1]. The left-hand value is the first saved observation in this series; the right-hand value is the observation on the event date. A gap below that threshold may still remain."
 NFP50_SUPPLY_RECOVERY_2:0 "For “[ScriptContainer.MakeScope.Var('nfp46_good').GetGoods.GetNameNoIcon]”, [ScriptContainer.GetVariableValue('nfp50_supply_good_observations')|0] consecutive monthly observations show neither the former shortage indicator nor a supply gap exceeding 20% of demand. Buy orders: [ScriptContainer.GetVariableValue('nfp46_buy_before')|1] → [ScriptContainer.GetVariableValue('nfp46_buy_after')|1]; sell orders: [ScriptContainer.GetVariableValue('nfp46_sell_before')|1] → [ScriptContainer.GetVariableValue('nfp46_sell_after')|1]. The left-hand value is the first saved observation in this series; the right-hand value is the observation on the event date. These conditions do not promise a perfect balance."
 NFP50_SUPPLY_RECOVERY_END_1:0 "The newspaper notes an improvement without declaring the matter settled for good. Favourable market figures alone do not prove that every business has recovered or every price fallen."
 NFP50_SUPPLY_RECOVERY_END_2:0 "This is a welcome turn in an old story. Future issues will continue watching the market; the present improvement should not be taken as a promise of lasting prosperity."
 NFP50_SUPPLY_RECOVERY_INTRO_1:0 "Encouraging information has arrived in a supply story we have covered before."
 NFP50_SUPPLY_RECOVERY_INTRO_2:0 "We return to an earlier shortage: new reports record an improvement."
 NFP50_SUPPLY_TRADE_1:0 "Market production: [ScriptContainer.GetVariableValue('nfp50_supply_production')|1]; consumption: [ScriptContainer.GetVariableValue('nfp50_supply_consumption')|1]; imports: [ScriptContainer.GetVariableValue('nfp50_supply_imports')|1]; exports: [ScriptContainer.GetVariableValue('nfp50_supply_exports')|1]. Imports account for [ScriptContainer.GetVariableValue('nfp50_supply_import_fraction')|1]% of production plus imports. This measures market supply, not the share of purchases made by our country’s inhabitants; trade volumes alone do not establish the cause of the shortage."
 NFP50_SUPPLY_TRADE_2:0 "Behind the overall orders lie production and trade. Market production: [ScriptContainer.GetVariableValue('nfp50_supply_production')|1]; consumption: [ScriptContainer.GetVariableValue('nfp50_supply_consumption')|1]; imports: [ScriptContainer.GetVariableValue('nfp50_supply_imports')|1]; exports: [ScriptContainer.GetVariableValue('nfp50_supply_exports')|1]. Imports account for [ScriptContainer.GetVariableValue('nfp50_supply_import_fraction')|1]% of production plus imports. This measures market supply, not the share of purchases made by our country’s inhabitants; trade volumes alone do not establish the cause of the shortage."
