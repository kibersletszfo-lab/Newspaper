 NFP52_ROM_1_BODY:0 "Romanian unification is now a fact. European affairs have a common centre of power where previously there were separate principalities. For supporters of union, this is an important result. For the neighbours, a reason to update their own calculations.\\n\\nThe Romanian principalities have acquired a common government. A substantial change, even if independence and future borders remain separate questions. One event should not be expected to answer for the country’s entire future history.\\n\\nUnification now faces everyday work. The common centre can deal with common concerns, and must take responsibility for the result. We hope people’s lives give this news a sequel worthy of its ceremonial beginning.\\n\\nThe chronicle is dated to the month when the news reached the editors. If communication was delayed, the event itself may have happened earlier."
