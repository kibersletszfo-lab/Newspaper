 NFP52_CHINA_1_BODY:0 "China has lost its former political unity. A familiar large patch on the map now conceals several centres of power. For a diplomat, that means new addresses. For someone doing business across a new border, it raises the question of which earlier agreements are still worth anything.\\n\\nThe former unified authority has broken apart. Independent governments must decide their relations with one another, while the rest of the world works out whom to negotiate with. Every reader still knows the country’s name. Who speaks on its behalf has become a much harder question.\\n\\nEveryday life continues behind the new map. People need work, trade and intelligible rules even when the authorities are busy deciding whose rules take precedence. Time will show where China’s fragmentation leads. We hope the price of that search will not fall upon those least able to influence it.\\n\\nThe chronicle is dated to the month when the news reached the editors. If communication was delayed, the event itself may have happened earlier."
