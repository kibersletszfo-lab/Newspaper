 NFP43_ELECTION_BASELINE:0 "Compared with the election report in edition No. [ScriptContainer.GetVariableValue('nfp43_previous_issue')|0]. Comparable parties: previous → current (change in coefficient). A dash means no comparable previous value is available."
 NFP43_ELECTION_BODY_1:0 "The campaign continues, and the parties’ positions may yet change. These are the momentum values recorded by the editors.\n\n[Localize(ScriptContainer.MakeScope.Var('nfp43_row_1').GetFlagName)]\n[Localize(ScriptContainer.MakeScope.Var('nfp43_row_2').GetFlagName)]\n[Localize(ScriptContainer.MakeScope.Var('nfp43_row_3').GetFlagName)]\n[Localize(ScriptContainer.MakeScope.Var('nfp43_row_4').GetFlagName)]\n[Localize(ScriptContainer.MakeScope.Var('nfp43_row_5').GetFlagName)]\n[Localize(ScriptContainer.MakeScope.Var('nfp43_row_6').GetFlagName)]\n\n[SelectLocalization(GreaterThan_CFixedPoint(ScriptContainer.GetVariableValue('nfp43_previous_issue'), '(CFixedPoint)0'), 'NFP43_ELECTION_BASELINE', 'NFP43_ELECTION_FIRST')]\n\nThis is an interim report on party momentum, not election results or projected vote shares. Momentum affects the campaign but does not determine the winner by itself. At most six parties are shown, ranked by momentum at printing; the numbers are the game’s raw coefficients."
 NFP43_ELECTION_BODY_2:0 "The election contest remains open. We compare party momentum without passing it off as counted ballots.\n\n[Localize(ScriptContainer.MakeScope.Var('nfp43_row_1').GetFlagName)]\n[Localize(ScriptContainer.MakeScope.Var('nfp43_row_2').GetFlagName)]\n[Localize(ScriptContainer.MakeScope.Var('nfp43_row_3').GetFlagName)]\n[Localize(ScriptContainer.MakeScope.Var('nfp43_row_4').GetFlagName)]\n[Localize(ScriptContainer.MakeScope.Var('nfp43_row_5').GetFlagName)]\n[Localize(ScriptContainer.MakeScope.Var('nfp43_row_6').GetFlagName)]\n\n[SelectLocalization(GreaterThan_CFixedPoint(ScriptContainer.GetVariableValue('nfp43_previous_issue'), '(CFixedPoint)0'), 'NFP43_ELECTION_BASELINE', 'NFP43_ELECTION_FIRST')]\n\nThis is an interim report on party momentum, not election results or projected vote shares. Momentum affects the campaign but does not determine the winner by itself. At most six parties are shown, ranked by momentum at printing; the numbers are the game’s raw coefficients."
 NFP43_ELECTION_FIRST:0 "No earlier snapshot of this campaign has yet been published. A dash marks parties without a comparable previous value."
 NFP43_ELECTION_LEAD_1:0 "Our election campaign continues. The parties are trying to gather momentum, and the editors are following their changing prospects. We are not printing victory speeches yet: one small detail is still missing — the result of the vote."
 NFP43_ELECTION_LEAD_2:0 "Our election campaign continues. The parties are trying to gather momentum, and the editors are following their changing prospects. We are not printing victory speeches yet: one small detail is still missing — the result of the vote."
 NFP43_ELECTION_METRICS:0 "Snapshot taken at printing; type 24, Society section. Comparison uses only the latest published election report from this same campaign. A candidate article omitted from the edition does not update the baseline. A new campaign or newly observed party does not generate an invented history. Values and ordering are frozen; party names may change with the game."
