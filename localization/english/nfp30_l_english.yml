 NFP52_SPRING_1_BODY:0 "The Springtime of Nations has begun in Europe. Political upheavals have grown into an event that can no longer be viewed as the purely internal affair of one country. Questions of power and society’s future have moved far beyond quiet discussion.\\n\\nA revolutionary wave is now part of European life. Each country has its own circumstances and course of events. Yet the old confidence that troubles abroad will remain exclusively foreign now needs firmer grounds than distance from a border.\\n\\nThe name promises spring, but the outcome has yet to be lived through. Hopes of change conceal disagreements about what those changes should be. We shall follow each story separately. A shared name for an era does not make people’s destinies the same.\\n\\nThe chronicle is dated to the month when the news reached the editors. If communication was delayed, the event itself may have happened earlier."
