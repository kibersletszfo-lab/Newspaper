 NFP52_ETH_1_BODY:0 "The Ethiopian state has united. Separate centres of power have given way to a common state. For the inhabitants, this begins a new order of affairs; for the neighbours, it is a change they will have to reckon with.\\n\\nEthiopia’s formation is confirmed. A united authority can now speak for the new state. How strong the connection between its parts proves to be will emerge in the years ahead. The unification itself has happened and deserves attention however far it lies from our borders.\\n\\nA common government now has common work to do. Turning a political achievement into lasting arrangements for the country is no smaller task than unification itself. We shall follow its progress. We hope the new position brings new opportunities for the inhabitants too.\\n\\nThe chronicle is dated to the month when the news reached the editors. If communication was delayed, the event itself may have happened earlier."
