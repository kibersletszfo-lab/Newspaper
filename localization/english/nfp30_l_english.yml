 NFP52_CAN_1_BODY:0 "Canada has acquired a common form of government. To an outside observer, this changes its position on the map. For the Canadian lands themselves, it offers a chance to settle more questions together. Their common name is now about more than geography.\\n\\nCanadian unification has taken place. A state has emerged to handle the common affairs of its constituent territories. Relations with the overlord are determined separately: unification is not, in itself, a declaration of independence.\\n\\nShared decisions must now be given substance. Distances, economic affairs and differing local interests do not disappear under a new signboard. But there is now a common address for those questions. We hope answers can be found there too.\\n\\nThe chronicle is dated to the month when the news reached the editors. If communication was delayed, the event itself may have happened earlier."
