 NFP52_SUEZ_1_BODY:0 "The Suez Canal is complete. Usually, people fit their route to the map. Here the map had to accommodate a human plan: a passage has opened between the Mediterranean and the Red Sea. For maritime connections, this is news difficult to confine to a footnote.\\n\\nConstruction of the canal is complete. A new sea route connects the two seas and changes how earlier routes are viewed. Where geography once demanded a detour, there is now a passage. A clear example of talk about shorter distances being accompanied by an actual structure.\\n\\nWork on the new opportunity begins next. Trade and politics will show who can use it to greatest advantage. The result itself already deserves attention. It is good when long planning produces something besides another plan.\\n\\nThe chronicle is dated to the month when the news reached the editors. If communication was delayed, the event itself may have happened earlier."
