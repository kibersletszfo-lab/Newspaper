 NFP52_GER_1_BODY:0 "Germany has become a united state. Readers have long known the name, but the political map now needs a fresh look. A common name has acquired a common government. Anyone accustomed to building plans on German fragmentation must revise something more substantial than an atlas.\\n\\nThe German state has formed. The union of its lands is an accomplished political fact that neighbours must reckon with. The extent of its borders and capabilities is another discussion. It is already too late, however, to discuss Germany solely as a collection of separate states.\\n\\nBringing a country together is an achievement; making it work is the next task. Beyond the celebrations lie common rules, economic affairs and relations with neighbours. The new name is already on the map. Now it will be particularly interesting to see what deeds become associated with it.\\n\\nThe chronicle is dated to the month when the news reached the editors. If communication was delayed, the event itself may have happened earlier."
