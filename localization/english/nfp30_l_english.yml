 NFP52_FLU_1_BODY:0 "Reports have arrived of a major influenza epidemic. Such news reads differently from reports of diplomatic successes. Illness concerns the simplest hope: that those close to us remain well, and tomorrow does not begin with anxiety for them.\\n\\nThe epidemic known as Spanish flu has begun. There is reason to follow the disease’s spread and conditions in the countries affected. News of a world event does not mean it has already reached us. But distance from the first reports should not be mistaken for a promise of safety.\\n\\nReliable information is especially necessary now. In anxious times, rumours can easily fill what we do not know; they add nothing to the care people receive. We shall return to the subject as news arrives. We hope to report as soon as possible that the danger is receding.\\n\\nThe chronicle is dated to the month when the news reached the editors. If communication was delayed, the event itself may have happened earlier."
