 NFP54_DIV_END:0 "What are we to make of it? Economic growth is worth celebrating. Yet the bigger the figures, the easier it becomes to overlook the people for whom that growth ought to matter. Why the two measures have parted company remains to be seen. We already have reason enough to look.\n\nA good report is a useful thing. Especially if life gets better after it."
 NFP54_DIV_EXPECTED:0 "We should add that the expected Standard of Living stands at [ScriptContainer.GetVariableValue('nfp50_family_expected_sol')|2]; our government, apparently, was not expecting that. However long we admire the economic achievements, the gap will not close itself."
 NFP54_DIV_FACT:0 "Over three months of observation, projected annual GDP rose from [ScriptContainer.GetVariableValue('nfp20_before')|0] to [ScriptContainer.GetVariableValue('nfp20_after')|0]. That is a gain of [ScriptContainer.GetVariableValue('nfp50_family_gdp_growth')|2]%, while average Standard of Living fell by [ScriptContainer.GetVariableValue('nfp20_extra')|2] points over the same period. Two pieces of news. Two neighbouring lines. The first calls for congratulations. The second rather takes the shine off them."
 NFP54_DIV_INTRO:0 "The latest reports leave no doubt that our country has something to be proud of: GDP has grown. A splendid piece of news, surely. We can congratulate one another, admire the figures, hum the anthem and turn the page with a duty well done. Though before we do, there is one more line worth a look. The one marked “Standard of Living”…"
 NFP54_DIV_LIVING:0 "Average Standard of Living used to be [ScriptContainer.GetVariableValue('nfp50_family_sol_before')|2]; it is now [ScriptContainer.GetVariableValue('nfp50_family_sol')|2]. An average rarely describes any particular person’s life, of course. If the capitalist has a roast and the farmer has nothing, the average dinner looks quite respectable. A falling average is nevertheless reason to look at the wider picture. The economy is gaining ground; ordinary prosperity is losing it. Not quite the detail one hopes to find in a celebratory report, is it?"
 NFP54_DIV_TITLE:0 "Economic success, or why you cannot dine on figures"
 NFP55_INF_CONNECTED:0 "There is no cause for panic yet: access to the common market stands at [Multiply_CFixedPoint(ScriptContainer.GetVariableValue('nfp50_family_access'), '(CFixedPoint)100')|1]%. Declaring the state cut off from the country would be a considerable exaggeration. Overloaded infrastructure does not mean bread and trousers will disappear tomorrow. Unwelcome news, certainly, but a long way from catastrophe."
 NFP55_INF_DISCONNECTED:0 "There is another cause for concern: access to the common market stands at [Multiply_CFixedPoint(ScriptContainer.GetVariableValue('nfp50_family_access'), '(CFixedPoint)100')|1]%. The state's connection to it is far from complete. Whether that will mean empty shelves remains to be seen. We should rather get to the bottom of it before residents start wondering which will run out first: essential goods or patience."
 NFP55_INF_END:0 "What are we to make of it? The state deserves attention now, before its difficulties become a familiar fixture in our columns. While the government decides whether to build a railway, enlarge a port or try another remedy, we shall follow developments.\n\nMeasure twice, cut once is sound advice. We should merely like someone to be ready to #strikethrough cut#! act when the measuring is done."
 NFP55_INF_FACT:0 "The state in question is [SelectLocalization(And(ScriptContainer.MakeScope.Var('nfp20_problem_state').IsSet, ScriptContainer.MakeScope.Var('nfp20_problem_state').GetState.IsValid), 'NFP40_STATE_LINK', 'NFP40_REGION_FALLBACK')]. For a couple of months running, the news has been discouraging: its infrastructure is overloaded. The first report could still be met with hope for the next one. The next one arrived. The hope remained. So did the problem."
 NFP55_INF_INTRO:0 "An economy needs quite a few things to prosper. Lower taxes, more affordable goods, and everything necessary arriving in the right place at the right time. That last requirement, however, needs spare infrastructure. Unlike our wishes, its capacity has a definite limit. In one of our states, demand has gone beyond it."
 NFP55_INF_TITLE:0 "No Room to Move: Infrastructure Strains the Economy"
 NFP56_ACC_END:0 "What are we to make of it? From the capital, the country is easy to see on a map. From the state, perhaps it is easier to see in what can be bought and sold. There is an unpleasant difference between those two views just now.\\n\\nWe shall see whether it can be narrowed. We would like the common market to be closer than the next explanation of why it is so far away."
 NFP56_ACC_FACT:0 "The state in question is [SelectLocalization(And(ScriptContainer.MakeScope.Var('nfp20_problem_state').IsSet, ScriptContainer.MakeScope.Var('nfp20_problem_state').GetState.IsValid), 'NFP40_STATE_LINK', 'NFP40_REGION_FALLBACK')]. Two monthly reports running have shown difficulties with access to the national market. It remains part of the country on the map, but cannot make full use of the common economy. The word “national” may warm the heart. It cannot fill a shopping basket."
 NFP56_ACC_FREE:0 "Curiously, the state’s infrastructure is still carrying its load. The familiar “let us build something more” is not an answer in itself, then. There is spare capacity, but no full market connection. We must find where things have become stuck before sending money and workers there."
 NFP56_ACC_INTRO:0 "It is good to be able simply to buy what one needs. No pondering distances or studying detours: just go and buy it. Yet a whole story sometimes stands between “available in the country” and “sold here”. In one of our states, that story has yet to find a happy ending."
 NFP56_ACC_OVERLOAD:0 "Perhaps the cause is ordinary enough: the state’s infrastructure is overloaded. An unpleasant combination: incomplete market access and insufficient capacity of its own. Does the latter explain everything else? That remains a question. There is certainly more than one reason to look closely at the state now."
 NFP56_ACC_SEVERE:0 "This is harder to dismiss as “minor difficulties”: Market Access does not reach even half its full level. Whether there is anything on the shelves at present is unknown. How much the state can rely on the common economy becomes an ever more pressing question."
 NFP56_ACC_TITLE:0 "Our state, and yet…"
 NFP57_SUP_BOTH:0 "The army and government offices both need this commodity. There are, then, plenty of buyers with important business and public money to spend. Important business, however, is no guarantee that the necessary supplies will be there. Better to settle the matter while the shortage is still something to discuss, rather than something to work around at the worst possible moment."
 NFP57_SUP_CHRONIC:0 "Scarcity is in danger of becoming familiar. That may be its least welcome feature: people can get used to hearing ‘no’. One day, though, it may be the public saying it to the government, rather than shopkeepers saying it to their customers. Finding the missing goods would then be only half the problem. The other half would be finding out where the trust went."
 NFP57_SUP_CRITICAL:0 "This time the shortage in our country is serious enough that it cannot be brushed aside as an ordinary inconvenience of trade. We can, of course, comfort ourselves with the thought that there must be a little more somewhere. Perhaps there is. The question is whether there is enough for everyone who needs it."
 NFP57_SUP_DETAILS:0 "$NFP46_METRICS$\nMarket production: [ScriptContainer.GetVariableValue('nfp50_supply_production')|1]; consumption: [ScriptContainer.GetVariableValue('nfp50_supply_consumption')|1]; imports: [ScriptContainer.GetVariableValue('nfp50_supply_imports')|1]; exports: [ScriptContainer.GetVariableValue('nfp50_supply_exports')|1]. Imports account for [ScriptContainer.GetVariableValue('nfp50_supply_import_fraction')|1]% of production plus imports. This measures market supply, not the share of purchases made by our country's inhabitants; trade volumes alone do not establish the cause of a shortage.\nPrice at the time of the event: £[ScriptContainer.GetVariableValue('nfp50_supply_price')|1]; deviation from base price: [ScriptContainer.GetVariableValue('nfp50_supply_premium')|1]% (negative means cheaper). Price does not measure every buyer's access to the commodity.\nConsecutive monthly observations of the problem: [ScriptContainer.GetVariableValue('nfp50_supply_observations')|0]. Direct shortage indicator at the time of the event: [ScriptContainer.GetVariableValue('nfp46_native_after')|0]; severe local shortage: [ScriptContainer.GetVariableValue('nfp50_supply_critical')|0]."
 NFP57_SUP_END:0 "What are we to make of it? A shortage may have any number of causes, but the buyer usually has just one question: ‘Can I get what I need?’\n\nWe shall return to this story when something changes. Preferably when the search is no longer for the goods themselves, but for a better bargain.\n\nAfter all, arguing over the price is rather more pleasant when there is something to buy."
 NFP57_SUP_FACT:0 "Our subject this time is [ScriptContainer.MakeScope.Var('nfp46_good').GetGoods.GetNameNoIcon]. A shortage has been recorded on the market, and supply difficulties have now appeared in more than one monthly report. That does not mean the commodity has vanished everywhere. But there are enough willing buyers for ‘where can we get it?’ to merit a newspaper column of its own. Demand, it seems, has done its part. We should now like to hear from supply."
 NFP57_SUP_GOVERNMENT:0 "Government offices need this commodity too. The matter may therefore be rather closer to the country's everyday business than a single line in a trade report suggests. National importance is an impressive thing. Unfortunately, it does not manufacture the necessary supplies by itself."
 NFP57_SUP_INTRO:0 "It is pleasant when shopping begins with a choice. Something better, something cheaper, something we can afford today, and something that can wait. Less pleasant is choosing between ‘none left’ and ‘try somewhere else’. Especially when what we need is a commodity, rather than an excuse for a walk or an argument."
 NFP57_SUP_LONG:0 "The reports arrive month after month, and supplies remain a question mark. At first we hoped the matter would soon improve. That hope has now acquired considerable seniority. It would be nice if the government's efforts had produced some results to go with it. As things stand, time passes, hope soldiers on, and the problem stays put."
 NFP57_SUP_MILITARY:0 "This commodity has military uses as well. Trade is therefore only part of the story: army supplies deserve attention too. Preferably in advance, while the matter can still be debated in a newspaper column, rather than settled in a scramble when the bayonets need sharpening. We should very much like everything necessary to be available by then."
 NFP57_SUP_NO_IMPORT:0 "No imports were recorded at the time of the report. Could purchases abroad make up the shortfall? The thought rather suggests itself. Admittedly, between ‘we ought to buy some’ and ‘it has finally arrived’ there is usually something more complicated than a newspaper sentence. It would nevertheless be interesting to see what stands in the way."
 NFP57_SUP_TITLE:0 "The Demand Is There. Where Are the Goods?"
 NFP57_SUP_TRADE:0 "Imports are arriving, but they have not yet ended the shortage. Saying ‘we shall import it’ is evidently easier than settling the supply question. A trade route looks convincing on a map. We should like there to be something to collect at the other end as well. How much additional buying would help, and where to buy, remain open questions."
 NFP58_GAP_BOTH:0 "The army and government offices both use this commodity, so there are public interests behind this question of trade. It would be reassuring if the importance of those interests helped get supplies in order in good time. Importance alone, alas, produces no extra goods."
 NFP58_GAP_CHRONIC:0 "This has been going on for some time. Demand ought to be a welcome invitation to anyone willing to produce and sell. Yet the invitation is still on the table, and supply has yet to catch up. What is holding it back—limited capacity, difficulties with trade, or something else? That remains an open question. A willingness to buy, it turns out, is not quite enough for an economic miracle."
 NFP58_GAP_CRITICAL:0 "Meanwhile, a serious local shortage has already been recorded in our country. Behind the broad picture of trade lies a sharper question: how easily can people get what they need here? For a buyer who needs the goods now, discussions of the market's future potential may do little more than pass the time."
 NFP58_GAP_END:0 "What are we to make of it? Strong demand can be good news for the economy. There are customers to produce for, people to sell to, and reasons to expand. But that opportunity still has to become a result—preferably before waiting becomes the greater part of shopping.\n\nThe willing buyers are there. Now for something worth buying."
 NFP58_GAP_FACT:0 "The commodity in question is [ScriptContainer.MakeScope.Var('nfp46_good').GetGoods.GetNameNoIcon]. There are considerably more willing buyers than goods offered for sale, and supply difficulties have now appeared in more than one monthly report. It would be an exaggeration to say the commodity has disappeared. But an awkward gap has opened between finding a buyer and finding something for that buyer."
 NFP58_GAP_GOVERNMENT:0 "Government offices use this commodity too, so interest in it extends beyond private trade. The treasury has resources of its own, of course. But putting an official seal on a document does not put more goods on the market."
 NFP58_GAP_INTRO:0 "Finding a buyer is half the business of trade. Sometimes it is the harder half: explaining, attracting interest, persuading someone to part with money. When customers are plentiful, we naturally feel inclined to congratulate both commerce and the national economy. First, though, it is worth making sure there is something to offer them. And that is where we have run into a difficulty."
 NFP58_GAP_LONG:0 "At first we could hope that trade would quickly respond to demand. After all, a willingness to buy usually receives a warmer welcome than a request to pay later. Yet the months pass and the question remains. Perhaps people willing to make a profit have already been found. We should like the goods to follow."
 NFP58_GAP_MILITARY:0 "The commodity has military uses as well. Its demand therefore deserves attention before the conversation turns to urgent army requirements. We should like the country to reach that conversation with some capacity in reserve, rather than merely a stock of explanations."
 NFP58_GAP_NO_IMPORT:0 "No imports have yet been recorded. That raises a reasonable question: if domestic supply is insufficient, could the goods be found abroad? The question itself will bring nothing into port, of course. But buyers would be interested to know what prevents it from being answered in practice."
 NFP58_GAP_TITLE:0 "Customers Waiting. Goods Wanted."
 NFP58_GAP_TRADE:0 "Imports are arriving, but the gap between supply and demand persists. It is good that goods are coming in at all. The next question is whether more can be obtained, and what that would require. Trade is particularly pleasing when its results can be bought, rather than merely marked on a map."
 NFP59_REC_BOTH:0 "The good is needed by both the army and government institutions, so this welcome news may be appreciated on more than one side. One favourable report does not supply the entire country with everything it needs, of course. But there is reason to look at the market more calmly now."
 NFP59_REC_BUY:0 "There are fewer would-be buyers too, however. Crediting the whole improvement solely to better supply would be rather convenient. Sometimes a queue shortens because trade works better. Sometimes because people leave the queue. This change alone does not tell us why."
 NFP59_REC_DETAILS:0 "$NFP57_SUP_DETAILS$\nConsecutive monthly observations without the earlier signal: [ScriptContainer.GetVariableValue('nfp50_supply_good_observations')|0]. Earlier warning type: [ScriptContainer.GetVariableValue('nfp46_mode')|0] (1 — direct shortage, 2 — supply/demand gap). The order comparison covers the beginning of the observation series and the date of the event."
 NFP59_REC_END:0 "What are we to make of it? The newspaper makes plenty of noise about difficulties. It would be strange to greet improvement with silence. There is reason to be pleased, and we are pleased to note it.\\n\\nWe shall watch that the story does not circle back to familiar ground. Good news is more pleasant to continue than to retract."
 NFP59_REC_GAP:0 "We return to the good “[ScriptContainer.MakeScope.Var('nfp46_good').GetGoods.GetNameNoIcon]”. Previously, would-be buyers considerably outnumbered what was offered for sale. Two monthly reports now show a calmer picture. Supply and demand may not yet have met with a handshake, but at least they have stopped standing quite so far apart."
 NFP59_REC_GOVERNMENT:0 "Government institutions use this good too, so the improvement concerns a question the treasury also has reason to follow. It would be pleasant if a better report were followed by easier everyday work."
 NFP59_REC_INTRO:0 "Good news sometimes looks rather modest. Nobody cuts a ribbon, makes a ceremonial speech or demands that we remember the day. A story that once made us frown simply gives us reason for a different expression. Our earlier trading concern has received just such a sequel."
 NFP59_REC_MILITARY:0 "The army needs this good too. Calmer supply conditions are therefore welcome from that quarter as well. We shall not declare every military need satisfied, of course. Still, one fewer concern about trade is no bad beginning."
 NFP59_REC_NATIVE:0 "We return to the good “[ScriptContainer.MakeScope.Var('nfp46_good').GetGoods.GetNameNoIcon]”. Following our warning, two monthly reports running no longer give the same cause for concern. The market’s direct shortage flag is absent, and supply is appreciably closer to demand. This is no promise that every buyer will find what they need. But instead of another “still not enough”, we finally have different news."
 NFP59_REC_NO_IMPORT:0 "No imports were recorded at the time of reporting, however. The present improvement cannot simply be attributed to goods arriving from abroad. What changed within the market is another question. The good news is no worse for it, but is still worth a closer look."
 NFP59_REC_SELL:0 "There is another welcome detail: more is being offered for sale than at the beginning of this story. The change did not consist solely of hoping that buyers would change their minds. More goods have entered trade. Who brought that about, and how, remains a question, but the change itself is pleasant to note."
 NFP59_REC_TITLE:0 "A reason to breathe easier"
 NFP59_REC_TRADE:0 "Imports continue. It is pleasant to see them alongside good news about supply. Too early to give trade all the credit, but we would not pass it by as though everything had happened on its own."
 NFP59_REC_ZERO_END:0 "Why people stopped buying remains to be established. We would not hurry to record the change as an economic victory.\\n\\nAn empty queue is a pleasant sight. If you know where the buyers went."
 NFP59_REC_ZERO_FACT:0 "For the good “[ScriptContainer.MakeScope.Var('nfp46_good').GetGoods.GetNameNoIcon]”, the earlier problem signal no longer appears, but no demand was recorded at the latest report either. Silence, then. Whether supply has improved behind that silence is not yet known."
 NFP59_REC_ZERO_INTRO:0 "There is a simple way to stop noticing a shortage: stop looking for what you need. Rather doubtful comfort for a buyer, though. We suggest approaching the following news without ceremonial music."
 NFP59_REC_ZERO_TITLE:0 "No demand, no problem?"
 NFP60_CONS_DOWN:0 "Consumption in the market has fallen. Why is another question. "
 NFP60_CONS_UP:0 "Consumption in the market has increased. "
 NFP60_EXP_DOWN:0 "Less of the good is being exported. "
 NFP60_EXP_UP:0 "More of the good is being exported. "
 NFP60_IMP_DOWN:0 "Imports into the market have fallen. "
 NFP60_IMP_UP:0 "More of the good is entering the market from abroad. "
 NFP60_PARTIAL_SUP:0 "We began detailed observation of production and trade only after this story was under way. Only changes since that point are visible here. "
 NFP60_PROD_DOWN:0 "Output of the good in the market has fallen. "
 NFP60_PROD_UP:0 "Output of the good in the market has risen. "
 NFP60_STATE_DETAILS:0 "[Localize(ScriptContainer.MakeScope.Var('nfp60_previous_metrics').GetFlagName)]\nCause observation from monthly index [ScriptContainer.GetVariableValue('nfp60_st_start')|0]; incomplete history: [ScriptContainer.GetVariableValue('nfp60_st_partial')|0].\nInfrastructure: [ScriptContainer.GetVariableValue('nfp60_st_cap_before')|2] → [ScriptContainer.GetVariableValue('nfp60_st_cap_after')|2]\nLoad: [ScriptContainer.GetVariableValue('nfp60_st_usage_before')|2] → [ScriptContainer.GetVariableValue('nfp60_st_usage_after')|2]\nMarket Access: [Multiply_CFixedPoint(ScriptContainer.GetVariableValue('nfp60_st_access_before'), '(CFixedPoint)100')|1]% → [Multiply_CFixedPoint(ScriptContainer.GetVariableValue('nfp60_st_access_after'), '(CFixedPoint)100')|1]%\nRailway levels: [ScriptContainer.GetVariableValue('nfp60_st_rail_before')|0] → [ScriptContainer.GetVariableValue('nfp60_st_rail_after')|0]\nPort levels: [ScriptContainer.GetVariableValue('nfp60_st_port_before')|0] → [ScriptContainer.GetVariableValue('nfp60_st_port_after')|0]\nUrban Centre levels: [ScriptContainer.GetVariableValue('nfp60_st_urban_before')|0] → [ScriptContainer.GetVariableValue('nfp60_st_urban_after')|0]\nEvents (counters capped at 99): rail_built=[ScriptContainer.GetVariableValue('nfp60_st_rail_built')|0]; rail_expanded=[ScriptContainer.GetVariableValue('nfp60_st_rail_expanded')|0]; rail_pm=[ScriptContainer.GetVariableValue('nfp60_st_rail_pm')|0]; port_built=[ScriptContainer.GetVariableValue('nfp60_st_port_built')|0]; port_expanded=[ScriptContainer.GetVariableValue('nfp60_st_port_expanded')|0]; port_pm=[ScriptContainer.GetVariableValue('nfp60_st_port_pm')|0]; urban_built=[ScriptContainer.GetVariableValue('nfp60_st_urban_built')|0]; urban_expanded=[ScriptContainer.GetVariableValue('nfp60_st_urban_expanded')|0]; urban_pm=[ScriptContainer.GetVariableValue('nfp60_st_urban_pm')|0].\nFirst/last event indices: [ScriptContainer.GetVariableValue('nfp60_st_event_first')|0] / [ScriptContainer.GetVariableValue('nfp60_st_event_last')|0]. Improved staffing is recorded when the observed building goes from below 80% to at least 80% occupancy; its exact infrastructure contribution was not calculated."
 NFP60_SUP_CAUSES:0 "[SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp60_supply_known'), '(CFixedPoint)1'), 'NFP60_SUP_COMPONENTS', 'NFP60_SUP_UNKNOWN')][SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp60_s_partial'), '(CFixedPoint)1'), 'NFP60_PARTIAL_SUP', 'NFP50_EMPTY')]"
 NFP60_SUP_COMPONENTS:0 "[SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp60_prod_dir'), '(CFixedPoint)1'), 'NFP60_PROD_UP', SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp60_prod_dir'), '(CFixedPoint)-1'), 'NFP60_PROD_DOWN', 'NFP50_EMPTY'))][SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp60_imp_dir'), '(CFixedPoint)1'), 'NFP60_IMP_UP', SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp60_imp_dir'), '(CFixedPoint)-1'), 'NFP60_IMP_DOWN', 'NFP50_EMPTY'))][SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp60_exp_dir'), '(CFixedPoint)1'), 'NFP60_EXP_UP', SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp60_exp_dir'), '(CFixedPoint)-1'), 'NFP60_EXP_DOWN', 'NFP50_EMPTY'))][SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp60_cons_dir'), '(CFixedPoint)1'), 'NFP60_CONS_UP', SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp60_cons_dir'), '(CFixedPoint)-1'), 'NFP60_CONS_DOWN', 'NFP50_EMPTY'))]These changes cover the same period as our supply story. Singling out one of them as the market’s sole saviour would be rather bold. "
 NFP60_SUP_DETAILS:0 "[Localize(ScriptContainer.MakeScope.Var('nfp60_previous_metrics').GetFlagName)]\nDetailed trade history from monthly index [ScriptContainer.GetVariableValue('nfp60_s_start')|0]; incomplete history: [ScriptContainer.GetVariableValue('nfp60_s_partial')|0].\nMarket output: [ScriptContainer.GetVariableValue('nfp60_s_prod_before')|2] → [ScriptContainer.GetVariableValue('nfp60_s_prod_after')|2]\nMarket consumption: [ScriptContainer.GetVariableValue('nfp60_s_cons_before')|2] → [ScriptContainer.GetVariableValue('nfp60_s_cons_after')|2]\nImports into the market: [ScriptContainer.GetVariableValue('nfp60_s_imp_before')|2] → [ScriptContainer.GetVariableValue('nfp60_s_imp_after')|2]\nExports from the market: [ScriptContainer.GetVariableValue('nfp60_s_exp_before')|2] → [ScriptContainer.GetVariableValue('nfp60_s_exp_after')|2]\nPrice: [ScriptContainer.GetVariableValue('nfp60_s_price_before')|2] → [ScriptContainer.GetVariableValue('nfp60_s_price_after')|2]. These are volumes for the entire market, not necessarily domestic output in the reader country."
 NFP60_SUP_UNKNOWN:0 "The earlier alarm has passed, but detailed production and trade figures do not yet explain what brought the change about. "
 NFP61_CAP_DOWN:0 "Curiously, the network itself has not gained capacity over this period. Quite the reverse: its capacity has fallen. Expansion alone, then, cannot explain the improvement. "
 NFP61_CAP_UP:0 "During our observations, the network itself gained capacity. The economy has been given more room; we now hope it will not fill it faster than we can celebrate. "
 NFP61_CAUSES:0 "[SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp60_components_known'), '(CFixedPoint)1'), 'NFP61_COMPONENTS', 'NFP61_UNKNOWN')][SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp60_st_partial'), '(CFixedPoint)1'), 'NFP61_PARTIAL', 'NFP50_EMPTY')]"
 NFP61_COMPONENTS:0 "[SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp60_cap_dir'), '(CFixedPoint)1'), 'NFP61_CAP_UP', SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp60_cap_dir'), '(CFixedPoint)-1'), 'NFP61_CAP_DOWN', 'NFP50_EMPTY'))][SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp60_usage_dir'), '(CFixedPoint)1'), 'NFP61_LOAD_UP', SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp60_usage_dir'), '(CFixedPoint)-1'), 'NFP61_LOAD_DOWN', 'NFP50_EMPTY'))]"
 NFP61_END:0 "What are we to make of it? Good news has arrived from the state, and we have no intention of finding fault simply out of habit. The economy has more breathing space. That is something to welcome.\n\nWe shall see how long the improvement lasts. We would rather return to this state for news of what it produces than for another account of what it cannot cope with.\n\nThey say there is always room for one more. A little room to spare is nicer still."
 NFP61_EVENTS:0 "[SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp60_rail_work'), '(CFixedPoint)1'), 'NFP61_RAIL_WORK', 'NFP50_EMPTY')][SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp60_port_work'), '(CFixedPoint)1'), 'NFP61_PORT_WORK', 'NFP50_EMPTY')][SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp60_urban_work'), '(CFixedPoint)1'), 'NFP61_URBAN_WORK', 'NFP50_EMPTY')][SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp60_rail_pm_seen'), '(CFixedPoint)1'), 'NFP61_RAIL_PM', 'NFP50_EMPTY')][SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp60_port_pm_seen'), '(CFixedPoint)1'), 'NFP61_PORT_PM', 'NFP50_EMPTY')][SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp60_urban_pm_seen'), '(CFixedPoint)1'), 'NFP61_URBAN_PM', 'NFP50_EMPTY')]$NFP61_PM_END_SELECT$[SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp60_st_rail_staffup'), '(CFixedPoint)1'), 'NFP61_RAIL_STAFF', 'NFP50_EMPTY')][SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp60_st_port_staffup'), '(CFixedPoint)1'), 'NFP61_PORT_STAFF', 'NFP50_EMPTY')]$NFP61_STAFF_END_SELECT$There have plainly been changes. We shall not credit any one of them with the entire success: happening at the same time and solving the problem are not quite the same thing."
 NFP61_FACT:0 "The state in question is [SelectLocalization(And(ScriptContainer.MakeScope.Var('nfp20_problem_state').IsSet, ScriptContainer.MakeScope.Var('nfp20_problem_state').GetState.IsValid), 'NFP40_STATE_LINK', 'NFP40_REGION_FALLBACK')]. We previously reported that its infrastructure was carrying more than it could bear. The latest reports show that its capacity now meets its needs. A problem that had already secured a place in our newspaper has finally made way for good news!"
 NFP61_INTRO:0 "It is easy to get used to things going well. An economy that works, for instance, without every new enterprise raising the question of whether our infrastructure can stand the strain. We can stop noticing bad things too. The overload persists, business muddles along, and the next report differs little from the last… This time, however, it does differ. And for the better."
 NFP61_LOAD_DOWN:0 "The load on the network has also fallen. There are two ways to ease a squeeze: make more room, or stop trying to fit quite so much into it. The second works too. It does not, by itself, explain why there is less to fit. "
 NFP61_LOAD_UP:0 "The load has increased as well. The economy has therefore not escaped the squeeze merely by needing less. The network has more work to do, yet the previous overload is gone. "
 NFP61_PARTIAL:0 "Our detailed records cover only part of this story, however. Its beginning fell outside our observations, so we shall not rush to a final explanation. "
 NFP61_PM_END:0 "Change does not always require new structures. Sometimes it is worth looking at how the existing ones are used. "
 NFP61_PM_END_SELECT:0 "[SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp60_rail_pm_seen'), '(CFixedPoint)1'), 'NFP61_PM_END', 'NFP61_PORT_PM_END_SELECT')]"
 NFP61_PORT_PM:0 "Working methods at the port changed. "
 NFP61_PORT_PM_END_SELECT:0 "[SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp60_port_pm_seen'), '(CFixedPoint)1'), 'NFP61_PM_END', 'NFP61_URBAN_PM_END_SELECT')]"
 NFP61_PORT_STAFF:0 "The port under observation now fills more of its jobs. "
 NFP61_PORT_STAFF_END_SELECT:0 "[SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp60_st_port_staffup'), '(CFixedPoint)1'), 'NFP61_STAFF_END', 'NFP50_EMPTY')]"
 NFP61_PORT_WORK:0 "Construction work was completed at the port. For a state short of capacity, that is a change worth noting. "
 NFP61_RAIL_PM:0 "Working methods on the railway changed. "
 NFP61_RAIL_STAFF:0 "The railway under observation now fills more of its jobs. "
 NFP61_RAIL_WORK:0 "During this period, railway construction or expansion was completed in the state. Talk of laying rails was at least accompanied by some actual rails. "
 NFP61_REMAINING:0 "There is a separate difficulty, however: the state's connection to the common market remains incomplete. Its infrastructure can cope with the present load, but that does not mean every route for trade is open. One problem has been left behind. We would rather not lose sight of the other amid the congratulations."
 NFP61_STAFF_END:0 "Building is only half the job. Someone still has to work there. "
 NFP61_STAFF_END_SELECT:0 "[SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp60_st_rail_staffup'), '(CFixedPoint)1'), 'NFP61_STAFF_END', 'NFP61_PORT_STAFF_END_SELECT')]"
 NFP61_TITLE:0 "Room to Breathe Again"
 NFP61_UNKNOWN:0 "We can see the improvement, but the information available does not yet explain it. Finding someone to blame for yesterday's trouble and someone to credit for today's success would be convenient. Convenience, however, is not evidence. "
 NFP61_URBAN_PM:0 "Working methods in the urban economy changed. "
 NFP61_URBAN_PM_END_SELECT:0 "[SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp60_urban_pm_seen'), '(CFixedPoint)1'), 'NFP61_PM_END', 'NFP50_EMPTY')]"
 NFP61_URBAN_WORK:0 "The urban economy expanded too. Major transport links are easy to spot on a map, but the state's everyday work does not end there. "
 NFP62_CAP_DOWN:0 "The infrastructure’s own capacity has fallen, however. “There is simply more room now” is not the explanation here. Market access has improved, but the story is clearly more complicated than one successful construction project. "
 NFP62_CAP_UP:0 "The state’s infrastructure has become more capacious during this time. A welcome combination: more capacity and a better market connection. Crediting this alone with the entire success would be hasty, but the change is hard to overlook. "
 NFP62_CAUSES:0 "[SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp60_components_known'), '(CFixedPoint)1'), 'NFP62_COMPONENTS', 'NFP62_UNKNOWN')][SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp60_st_partial'), '(CFixedPoint)1'), 'NFP62_PARTIAL', 'NFP50_EMPTY')]"
 NFP62_COMPONENTS:0 "[SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp60_cap_dir'), '(CFixedPoint)1'), 'NFP62_CAP_UP', SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp60_cap_dir'), '(CFixedPoint)-1'), 'NFP62_CAP_DOWN', 'NFP50_EMPTY'))][SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp60_usage_dir'), '(CFixedPoint)1'), 'NFP62_LOAD_UP', SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp60_usage_dir'), '(CFixedPoint)-1'), 'NFP62_LOAD_DOWN', 'NFP50_EMPTY'))]"
 NFP62_END:0 "What are we to make of it? Previously the state was ours on the map, while the common market sometimes seemed a distant prospect. There are now fewer obstacles between them. A good change for the national economy. We hope those who simply go out shopping will feel it too.\\n\\nWe shall follow the story. The common market is, after all, more pleasant to discuss while shopping than while explaining why it has once again become unreachable."
 NFP62_EVENTS:0 "[SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp60_rail_work'), '(CFixedPoint)1'), 'NFP62_RAIL_WORK', 'NFP50_EMPTY')][SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp60_port_work'), '(CFixedPoint)1'), 'NFP62_PORT_WORK', 'NFP50_EMPTY')][SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp60_urban_work'), '(CFixedPoint)1'), 'NFP62_URBAN_WORK', 'NFP50_EMPTY')][SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp60_rail_pm_seen'), '(CFixedPoint)1'), 'NFP62_RAIL_PM', 'NFP50_EMPTY')][SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp60_port_pm_seen'), '(CFixedPoint)1'), 'NFP62_PORT_PM', 'NFP50_EMPTY')][SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp60_urban_pm_seen'), '(CFixedPoint)1'), 'NFP62_URBAN_PM', 'NFP50_EMPTY')]$NFP62_PM_END_SELECT$[SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp60_st_rail_staffup'), '(CFixedPoint)1'), 'NFP62_RAIL_STAFF', 'NFP50_EMPTY')][SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp60_st_port_staffup'), '(CFixedPoint)1'), 'NFP62_PORT_STAFF', 'NFP50_EMPTY')]$NFP62_STAFF_END_SELECT$All this happened while we were following the state. Which changes helped most has not yet been established. Coinciding in time is a reason to look more closely, not a ready-made honours list."
 NFP62_FACT:0 "The state in question is [SelectLocalization(And(ScriptContainer.MakeScope.Var('nfp20_problem_state').IsSet, ScriptContainer.MakeScope.Var('nfp20_problem_state').GetState.IsValid), 'NFP40_STATE_LINK', 'NFP40_REGION_FALLBACK')]. The latest reports show that the earlier difficulties with common-market access have eased. This is no promise of low prices or plentiful choice in every shop. But the state can now make much fuller use of the national economy. “Common” has moved a little closer to its meaning again."
 NFP62_INTRO:0 "Sometimes “available in the country” and “sold here” are too far apart. And the distance cannot always be measured in miles. Everything looks close on the map: our borders, our common economy, yet not everyone can make full use of it. We have written about this difficulty before. Now there is reason to return in a different mood."
 NFP62_LOAD_DOWN:0 "The load on the network has fallen. Perhaps it is now easier for the state to meet transport requirements and its other economic needs. Why the load has fallen is another question, though. We would not rush to declare the decrease an unqualified victory. "
 NFP62_LOAD_UP:0 "The load on the network has, on the contrary, risen. Market access has therefore improved without economic requirements shrinking. There is more work, yet the earlier problem has eased. All the more reason to understand what made that possible. "
 NFP62_PARTIAL:0 "We did, however, begin detailed observation only after this story was under way. The state travelled part of the distance without our notes. Explaining the entire result solely through what we saw later would be rather too convenient. "
 NFP62_PM_END:0 "Change does not always require new construction: it matters not only what has been built, but how it is used. "
 NFP62_PM_END_SELECT:0 "[SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp60_rail_pm_seen'), '(CFixedPoint)1'), 'NFP62_PM_END', 'NFP62_PORT_PM_END_SELECT')]"
 NFP62_PORT_PM:0 "Working methods at the port changed. "
 NFP62_PORT_PM_END_SELECT:0 "[SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp60_port_pm_seen'), '(CFixedPoint)1'), 'NFP62_PM_END', 'NFP62_URBAN_PM_END_SELECT')]"
 NFP62_PORT_STAFF:0 "The port under observation now fills more of its jobs. "
 NFP62_PORT_STAFF_END_SELECT:0 "[SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp60_st_port_staffup'), '(CFixedPoint)1'), 'NFP62_STAFF_END', 'NFP50_EMPTY')]"
 NFP62_PORT_WORK:0 "Construction work was completed at the port. That deserves attention when considering the state’s connection with the rest of the country. A completed port alone does not tell the whole story of transport, however. "
 NFP62_RAIL_PM:0 "Working methods on the railway changed. "
 NFP62_RAIL_STAFF:0 "The railway under observation now fills more of its jobs. "
 NFP62_RAIL_WORK:0 "Railway construction or expansion was completed in the state during our observation. The old question of connection to the common economy has acquired a tangible neighbour: new railway capacity. "
 NFP62_REMAINING:0 "One difficulty remains, however: the state’s infrastructure is still overloaded. Market access has improved, but there is no extra room within the network yet. That does not cancel the good news. It is simply too early to close the neighbouring problem alongside it."
 NFP62_STAFF_END:0 "Structures have not yet learned to operate themselves. People are therefore a significant detail in this story. "
 NFP62_STAFF_END_SELECT:0 "[SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp60_st_rail_staffup'), '(CFixedPoint)1'), 'NFP62_STAFF_END', 'NFP62_PORT_STAFF_END_SELECT')]"
 NFP62_TITLE:0 "Our state. Our market too"
 NFP62_UNKNOWN:0 "The saved information on infrastructure and its load does not yet offer a clear explanation. We can see a welcome change, but cannot yet say whom to thank. We shall not name the winner before understanding the contest. "
 NFP62_URBAN_PM:0 "Working methods in the urban economy changed. "
 NFP62_URBAN_PM_END_SELECT:0 "[SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp60_urban_pm_seen'), '(CFixedPoint)1'), 'NFP62_PM_END', 'NFP50_EMPTY')]"
 NFP62_URBAN_WORK:0 "Urban facilities expanded too. They seldom look as impressive as a locomotive or a large ship, but the state lives by more than long-distance transport. "
 NFP63_ALLY:0 "This concerns our ally. Its capabilities deserve attention: shared agreements are worth more when we understand what is happening to our partner."
 NFP63_ATT_1:0 " This government regards us with hostility. We therefore follow events without illusions: a courteous explanation may not be forthcoming."
 NFP63_ATT_10:0 " This subject country is loyal to us. All the less reason to dismiss its own concerns as unimportant."
 NFP63_ATT_11:0 " This subject country seeks to escape our authority. Its news therefore deserves a closer reading: familiar assurances are no longer the best guide."
 NFP63_ATT_2:0 " Its attitude towards us is belligerent. Making jokes about affairs abroad is easier than dealing with their consequences at our own border."
 NFP63_ATT_3:0 " They would like to bring our country under their control. Neighbourly concern comes in many forms; this one deserves a look at the small print."
 NFP63_ATT_4:0 " They regard us warily. Mutual suspicions are better tested against events than passed off as established plans."
 NFP63_ATT_5:0 " They show little particular interest in our country for now. That does not make their news meaningless, but neither must every line conceal a message for us."
 NFP63_ATT_6:0 " They are disposed towards reconciliation. A welcome chance to follow events without reaching for a diplomatic barb every time."
 NFP63_ATT_7:0 " This government is inclined to cooperate with us. It would be pleasant to find common undertakings behind the goodwill."
 NFP63_ATT_8:0 " They regard us favourably. We can dispense with the customary dig: the facts will lose none of their edge."
 NFP63_ATT_9:0 " They are willing to act as our protector. A pleasant disposition, though it is still worth distinguishing care from control."
 NFP63_BAND_NEG1:0 "Relations leave something to be desired. A joke might enliven the reading, but it cannot explain what is happening."
 NFP63_BAND_NEG2:0 "Relations are cold. Warm words are scarce for this news; reasons to examine it closely are not."
 NFP63_BAND_NEG3:0 "Relations between our countries are openly hostile. Few will expect compliments from this newspaper. But a lack of sympathy does not change the facts."
 NFP63_BAND_POS1:0 "Relations allow a calm discussion. We can examine a change abroad without first assuming there must be a catch."
 NFP63_BAND_POS2:0 "Relations between our countries are good. It is pleasant to read news from there with friendly interest, though friendship is no substitute for examining events."
 NFP63_BAND_POS3:0 "Relations between our countries are particularly warm. We hope there will be more occasions for a kind word. And if the news is unwelcome, it deserves all the more attention."
 NFP63_BAND_ZERO:0 "Relations between our countries display neither particular warmth nor open hostility. We can consider the news itself without opening with a diplomatic quarrel."
 NFP63_BLOC:0 "This country belongs to our power bloc. Such changes concern our shared surroundings, even when events are far away."
 NFP63_CLOSING:0 "$NFP63_EDITORIAL$\n\n[Localize(ScriptContainer.MakeScope.Var('nfp63_closing').GetFlagName)]"
 NFP63_DETAILS:0 "Editorial selection: [SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp63_reason'), '(CFixedPoint)0'), 'NFP63_REASON_0', 'NFP50_EMPTY')][SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp63_reason'), '(CFixedPoint)1'), 'NFP63_REASON_1', 'NFP50_EMPTY')][SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp63_reason'), '(CFixedPoint)2'), 'NFP63_REASON_2', 'NFP50_EMPTY')][SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp63_reason'), '(CFixedPoint)3'), 'NFP63_REASON_3', 'NFP50_EMPTY')][SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp63_reason'), '(CFixedPoint)4'), 'NFP63_REASON_4', 'NFP50_EMPTY')][SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp63_reason'), '(CFixedPoint)5'), 'NFP63_REASON_5', 'NFP50_EMPTY')][SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp63_reason'), '(CFixedPoint)6'), 'NFP63_REASON_6', 'NFP50_EMPTY')][SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp63_reason'), '(CFixedPoint)7'), 'NFP63_REASON_7', 'NFP50_EMPTY')].\nEditorial tiers: reader [ScriptContainer.GetVariableValue('nfp63_reader_tier')|0], source [ScriptContainer.GetVariableValue('nfp63_source_tier')|0], other party [ScriptContainer.GetVariableValue('nfp63_second_tier')|0]. Priority bonus [ScriptContainer.GetVariableValue('nfp63_bonus')|0]; technology novelty [ScriptContainer.GetVariableValue('nfp63_novel')|0]; law difference [ScriptContainer.GetVariableValue('nfp63_different_law')|0].\nConnection to source [ScriptContainer.GetVariableValue('nfp63_relation')|0], to other party [ScriptContainer.GetVariableValue('nfp63_second_relation')|0]; relations [ScriptContainer.GetVariableValue('nfp63_friend')|0]. Selection grounds and tone were saved on receipt; the archive does not reread current diplomacy.\nSource relations towards reader, numerical value: [ScriptContainer.GetVariableValue('nfp63_relation_value')|0], band [ScriptContainer.GetVariableValue('nfp63_relation_band')|0]; AI attitude [ScriptContainer.GetVariableValue('nfp63_attitude')|0]. Other party: relations [ScriptContainer.GetVariableValue('nfp63_secondary_relation_value')|0], band [ScriptContainer.GetVariableValue('nfp63_secondary_relation_band')|0], AI attitude [ScriptContainer.GetVariableValue('nfp63_secondary_attitude')|0]. A zero attitude means no verified snapshot is available, not that the player has neutral intentions."
