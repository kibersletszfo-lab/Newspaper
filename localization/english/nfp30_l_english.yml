 NFP43_ELECTION_TITLE_1:0 "The ballot boxes can wait. First, the battle for voters"
 NFP43_ELECTION_TITLE_2:0 "The ballot boxes can wait. First, the battle for voters"
 NFP43_FRONT_PAGE:0 "Front Page"
 NFP43_THIS_ISSUE:0 "In This Edition"
 NFP43_THIS_ISSUE_URGENT:0 "In This Edition · Urgent"
 NFP43_WELCOME_1_BODY:0 "It is good to be able to buy what you need, reach your workplace and return with earnings enough to live on. Here we shall discuss goods, overloaded transport and states struggling to reach the common market. And we shall make a point of noticing when the troubles end.\n\nBig numbers do not fill a shopping basket by themselves. Beside economic successes, then, there will be room to ask about living standards. In a quiet month, we shall consult the trade report: prices can keep economics interesting without editorial assistance."
 NFP43_WELCOME_1_LEAD:0 "Welcome to the economic section. We shall try to notice difficulties before they become familiar."
 NFP43_WELCOME_1_TITLE:0 "The economy begins before the report"
 NFP43_WELCOME_2_BODY:0 "War concerns more than those who mark it on a map. In this section we shall follow conflicts beginning and ending, alliances and the membership of our bloc. In diplomatic crises, we shall note who made demands, who supported a side and who preferred to step back.\n\nImportant news may arrive in a separate extraordinary edition if you allow that delivery. We would prefer to report successful negotiations more often. But unwelcome news is better read in time than discovered through its consequences."
 NFP43_WELCOME_2_LEAD:0 "The War section follows the outbreak and end of conflicts, and changes affecting our country’s security."
 NFP43_WELCOME_2_TITLE:0 "Between treaty and cannon"
 NFP43_WELCOME_3_BODY:0 "Whether people can read, how they live and what happens during elections are questions for this section. Changes in society can be harder to follow than a new border. All the more reason to look at what changes behind familiar state names.\n\nDuring elections, we shall compare the course of the parties’ campaigns with earlier reports. Campaign strength is not yet a vote count. Electoral confidence can be infectious; the editors will try to retain the ability to wait for the ballots."
 NFP43_WELCOME_3_LEAD:0 "This section has room for the achievements of education and changes in the life of our country."
 NFP43_WELCOME_3_TITLE:0 "A country is also its people"
 NFP43_WELCOME_4_BODY:0 "Here you will find laws, new knowledge and changes in the standing of powers. Pride in our own achievements is pleasant. Noticing those abroad is useful, including when they make us ask why we have not yet done the same.\n\nYou can begin with the cover and move on to an individual article. Previous editions remain in the archive, with room for twelve issues. Sometimes old certainties make particularly interesting reading once we know what happened next."
 NFP43_WELCOME_4_LEAD:0 "Here we gather significant changes in government, new knowledge and important news from abroad."
 NFP43_WELCOME_4_TITLE:0 "Beyond the familiar"
 NFP43_WELCOME_METRICS:0 "Introductory article, not a report of a new event. All four sections are shown as an introduction; the ordinary contents of later editions are determined by the subscription. Observations continue without resetting. Where no comparable earlier observation exists, no change is calculated."
 NFP43_WELCOME_REACH:0 "introductory material for the reader’s country"
 NFP43_WELCOME_REASON:0 "introduction to the newspaper upon confirmation of a subscription"
 NFP45_ARCHIVE_NOTE:0 "Subscribers receive a new issue every month. Read issues remain in the archive."
 NFP47_CONFIRM:0 "Confirm selection"
 NFP47_CONFIRM_HINT:0 "Save delivery preferences and return to the newspaper."
 NFP47_EDITION:0 "The National Herald"
 NFP47_FOOTNOTE:0 "You may change these preferences at any time. Archived issues are retained."
 NFP47_MONTHLY:0 "Monthly edition"
 NFP47_MONTHLY_NOTE:0 "News from home and abroad, gathered in one issue every month."
 NFP47_READER:0 "Subscriber: [GetPlayer.GetName]"
 NFP47_REQUEST:0 "Please deliver the following editions:"
 NFP47_RETURN:0 "Return to newspaper"
 NFP47_RETURN_HINT:0 "Return to the newspaper. Delivery preferences are saved as you change them."
 NFP47_SECTIONS:0 "Economy · War · Society · Events"
 NFP47_TERMS:0 "Monthly editions and urgent editions may be enabled independently.\nYou may cancel delivery at any time without losing issues already received."
 NFP47_TITLE:0 "Subscription Form"
 NFP47_URGENT:0 "Urgent edition"
 NFP47_URGENT_NOTE:0 "War and momentous events: a special issue without delay."
