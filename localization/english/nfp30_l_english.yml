 NFP50_LAW_OPPOSE:0 "opposition"
 NFP50_LAW_OWN_COMPARE_1:0 "And how would a similar change be received here? Among our government groups, supporters account for [ScriptContainer.GetVariableValue('nfp50_law_own_yes')|1]% of political clout and opponents for [ScriptContainer.GetVariableValue('nfp50_law_own_no')|1]%. This compares our views on the law; it is not an announced response to another country’s decision. They have already changed their arrangements abroad. For us, it is a reason to consider what we like about our own."
 NFP50_LAW_OWN_COMPARE_2:0 "And how would a similar change be received here? Among our government groups, supporters account for [ScriptContainer.GetVariableValue('nfp50_law_own_yes')|1]% of political clout and opponents for [ScriptContainer.GetVariableValue('nfp50_law_own_no')|1]%. This compares our views on the law; it is not an announced response to another country’s decision. They have already changed their arrangements abroad. For us, it is a reason to consider what we like about our own."
 NFP50_LAW_OWN_SAME_1:0 "The same law is in force here. We can therefore compare more than promises. It will be interesting to see how another country manages under similar rules. Matching lines in the statute book do not make life identical on both sides of the border."
 NFP50_LAW_OWN_SAME_2:0 "The same law is in force here. We can therefore compare more than promises. It will be interesting to see how another country manages under similar rules. Matching lines in the statute book do not make life identical on both sides of the border."
