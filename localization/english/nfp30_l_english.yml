 NFP52_AUS_1_BODY:0 "A common Australian state has emerged. The distant continent brings news worthy of the front page. Several political entities have acquired a shared form of government. A familiar geographical name now stands for common affairs as well.\\n\\nAustralia has formed. This is a change in the organisation of the Australian territories, not in itself news of independence. International obligations are a separate matter. The common state is here; its future position will depend on its decisions and relations with other powers.\\n\\nUnification offers a chance to settle matters within a common framework. Everyday work will show how well that chance is used. The continent is large and will have plenty of shared concerns. We hope there will be room for shared benefits too.\\n\\nThe chronicle is dated to the month when the news reached the editors. If communication was delayed, the event itself may have happened earlier."
 NFP52_AUS_1_CONTEXT:0 "Unification offers a chance to settle matters within a common framework. Everyday work will show how well that chance is used. The continent is large and will have plenty of shared concerns. We hope there will be room for shared benefits too."
