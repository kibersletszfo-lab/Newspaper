 NFP51_START_1_CORE:0 "A diplomatic confrontation began during the reported month. The initiator is [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName]; the original target is [ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName]. The issue: [Localize(ScriptContainer.MakeScope.Var('nfp51_play_label').GetFlagName)]."
 NFP51_START_1_END:0 "War has not yet begun. The parties may seek support, yield or stand firm. We hope a persuasive argument will emerge before a cannon is judged the only convincing one. We shall follow this dispute as it develops."
 NFP51_START_1_LEAD:0 "The demands come from [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName]; the other party is [ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName]."
 NFP51_START_1_TITLE:0 "Arguments have turned into demands"
 NFP51_START_2_CORE:0 "A new confrontation has entered the diplomatic record. [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName] has made demands upon [ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName]; the dispute concerns [Localize(ScriptContainer.MakeScope.Var('nfp51_play_label').GetFlagName)]."
 NFP51_START_2_END:0 "War has not yet begun. The parties may seek support, yield or stand firm. We hope a persuasive argument will emerge before a cannon is judged the only convincing one. We shall follow this dispute as it develops."
 NFP51_START_2_LEAD:0 "A diplomatic confrontation has begun between [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName] and [ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName]."
 NFP51_START_2_TITLE:0 "Arguments have turned into demands"
 NFP51_START_TIMELINE:0 "This Diplomatic Play began in month [Localize(Concatenate('NFP30_MONTH_', ToString_int32(FixedPointToInt(ScriptContainer.GetVariableValue('nfp51_start_month')))))] of [ScriptContainer.GetVariableValue('nfp51_start_year')|0]. Later reports concern the same crisis."
 NFP52_ACW_1_BODY:0 "Civil war has begun in the United States. Some news makes a familiar country’s name read differently. The American Union is now arguing about its future with weapons. Behind the words about unity and the right to choose one’s path lies a harder question: how much will people endure before the argument ends?\\n\\nThe United States has entered a war against a breakaway American state. Political confrontation has crossed the line beyond which decisions are no longer made only at the negotiating table. The future of the Union itself now depends on the fighting’s outcome.\\n\\nFor the rest of the world, this is more than a distant American quarrel. The position of a country with which others trade, negotiate and make plans is changing. Above all, though, the war concerns those who must live within this division. We would rather soon report the terms of peace than grow accustomed to fresh news that the war continues.\\n\\nThe chronicle is dated to the month when the news reached the editors. If communication was delayed, the event itself may have happened earlier."
 NFP52_ACW_1_CONTEXT:0 "For the rest of the world, this is more than a distant American quarrel. The position of a country with which others trade, negotiate and make plans is changing. Above all, though, the war concerns those who must live within this division. We would rather soon report the terms of peace than grow accustomed to fresh news that the war continues."
 NFP52_ACW_1_FACT:0 "The United States has entered a war against a breakaway American state. Political confrontation has crossed the line beyond which decisions are no longer made only at the negotiating table. The future of the Union itself now depends on the fighting’s outcome."
