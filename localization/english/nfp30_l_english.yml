 NFP52_ITA_1_BODY:0 "Italy has united. It could already be spoken of as a land, a culture and a hope of a common future. A state has now joined that list. For those who sought unification, the time for congratulations has come. With it comes the question of how to live together after the ceremonial speeches.\\n\\nThe Italian state has formed. A union has appeared on the Mediterranean’s political map that neighbours must include in their calculations. The old habit of considering the Italian lands separately no longer explains the new position.\\n\\nA common government has acquired common concerns. One flag will not instantly reconcile roads, economic affairs and the interests of different lands. But there is now a state to deal with those questions. Unification has happened. We shall see what substance it is given.\\n\\nThe chronicle is dated to the month when the news reached the editors. If communication was delayed, the event itself may have happened earlier."
