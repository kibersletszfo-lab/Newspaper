 NFP52_TAIPING_1_BODY:0 "A Taiping state has appeared in China. The confrontation has acquired an independent political centre. The question is no longer merely what opponents of the old order dislike, but what government they offer in its place.\\n\\nThe Heavenly Kingdom exists as a separate political force. China’s crisis has taken a new form; the familiar account of another disturbance no longer suffices. A dispute with authority has become an authority claiming a place of its own.\\n\\nPeople’s lives remain behind the grand claims. The confrontation’s course and who will hold power are not yet settled. We shall follow events, remembering that for local inhabitants a change on the map means far more than another line in a foreign-news column.\\n\\nThe chronicle is dated to the month when the news reached the editors. If communication was delayed, the event itself may have happened earlier."
