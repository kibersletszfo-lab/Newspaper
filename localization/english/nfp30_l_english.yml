 NFP65_AWAY_HALF:0 "At least half the people in this country are now literate. A pleasing milestone does not turn everything upside down: reaching it does not open every book at once or make the old difficulties disappear. Yet a growing share of society can read. For an individual, that means finding out what is written without an intermediary. For the country, it is firmer ground on which to make further plans."
 NFP65_AWAY_THREE:0 "Literacy has reached three quarters of the population. Enough to speak of education becoming widespread, rather than a skill confined to a narrow circle. The remaining quarter, though, is not just an annoying blemish on the report. A good overall figure does not tell us how easy it is to learn in different states, or who still finds it harder to obtain an education. None of that makes the achievement smaller."
 NFP65_AWAY_TITLE:0 "More readers abroad"
 NFP65_COMPARE_AHEAD:0 "Our country still trails in literacy. They have an advantage here, and dismissing it with a comfortable “but at least we…” would be rather too convenient. We can take pride in our own successes and still notice someone else’s. Congratulations are not far from a useful question: what helped them achieve this, and how are things at home?"
 NFP65_COMPARE_BEHIND:0 "Our country is still ahead in literacy. A welcome detail, we will grant that. But someone else’s achievement is no reason to settle more comfortably on our own laurels. Being higher in the present report does not reserve the place for us forever. An advantage is good to have. Better still if it does not become a memory."
 NFP65_COMPARE_EQUAL:0 "Our countries now stand close together in literacy. We could note with satisfaction that we are not behind and turn the page. Similar overall figures, however, do not mean that education works the same way or is equally accessible to everyone. Similar lines in a report may conceal different stories. Comparing them would be more interesting than solemnly announcing a draw."
 NFP65_COMPARE_UNKNOWN:0 "There is not yet enough information for a sound comparison with our country. It would be convenient to decide immediately who deserves the loudest congratulations and who ought to hurry up. But a newspaper contest without reliable results is too easily won by whoever writes about it. We shall mark the milestone without handing out the places."
 NFP65_END_COLD_PARTNER:0 "Shared agreements have not spared our countries mutual displeasure. All the more reason to notice something besides ammunition for the next argument. Our partner has achieved a result in education. We need not love them for it; understanding what lies behind the result could still be useful."
 NFP65_END_FRIEND:0 "We can congratulate our partner without diplomatic teeth-grinding. It would be pleasant if the courtesies were followed by a discussion of useful experience. Copying someone else’s figure into our own report would be improper. Learning from what helped them achieve it is quite another matter."
 NFP65_END_NEUTRAL:0 "We have noted the change and found a reason to compare. Next, it would be interesting to see what the achievement means for life in that country. Meanwhile, let us look at our own report: foreign news is sometimes especially useful because it makes us read our own more closely."
 NFP65_END_OVERLORD:0 "We have particular reason to follow this power’s development. Its successes do not automatically become ours, any more than its literacy arrives here with the next instruction. Useful experience can be borrowed. It does not do our own work on education for us."
 NFP65_END_REBELLIOUS:0 "Relations with our subject can hardly be called calm. Rising literacy does not, by itself, explain its wish for independence. Turning the two reports into one convenient explanation would be easy. Examining each separately is harder, but more useful if we want to understand what is happening."
 NFP65_END_RIVAL:0 "Someone else’s achievement is not our defeat. Nor is it obliged to disappear after a well-aimed joke. Better to leave the rival its congratulations and examine our own report. We should like wit to remain one of our strengths, rather than our chief response to other people’s successes."
 NFP65_END_SUBJECT:0 "Good news from a subject deserves attention without a reminder of the payments due to us. Its development amounts to more than a benefit to our treasury. We hope this milestone will be followed by changes local people can appreciate beyond the pages of a newspaper."
 NFP65_END_THREAT:0 "That government’s intentions towards us can hardly be called harmless. Rising literacy does not, by itself, mean preparations for war. Yet the development of a country inclined to put pressure on us deserves attention without a bugle call. The comforting thought that “it is only education” would be rather careless here."
 NFP65_HOME_END:0 "We have a new reason to be proud of our country. More people can read for themselves; one fewer intermediary stands between them and knowledge. Exactly how the present result came about is another story. Without the details, we shall not credit the whole success to one fortunate measure.\n\nMay the story continue. A newspaper needs readers. A country needs people who can read more than newspapers."
 NFP65_HOME_EXPECTATIONS:0 "Education has a less comfortable side for the government: people expect more from life. Literacy helps the economy develop, but does not teach people to be content with less. An interesting arrangement: the country needs educated workers, and educated workers would like to live better. Congratulations on the progress of enlightenment are unlikely to settle that discussion."
 NFP65_HOME_HALF:0 "At least half the people in our country are now literate. More newspaper readers are only part of the story. An educated population finds it easier to enter new professions; the country can advance research and learn from discoveries abroad. Letters are gradually forming more than words: they are forming opportunities for the economy."
 NFP65_HOME_INTRO:0 "Reading is a useful skill. One can decipher a notice, read a letter or open a book for oneself. Or find out precisely what the latest speech promises, without relying on someone who remembered only the most interesting bits. For one person, an everyday ability. For a country, a change worth a place on the front page."
 NFP65_HOME_PROFESSION:0 "Education broadens people’s choice of work. Learning to be an engineer or handling official papers is easier when every written line need not be passed to someone else to read. For employers, this means a chance to find trained staff; for individuals, a chance to reach beyond their customary earnings. No promise of a new post and a good wage. But a door for which they may not previously have had a key."
 NFP65_HOME_SCIENCE:0 "Science has more room to work. Higher literacy lets the country use more of its universities’ research capacity for discoveries of its own. Knowledge from abroad spreads faster too: hearing that someone has invented something useful is not enough; one must understand how it works. Literate people alone will not produce a scientific leap, of course. University walls alone will not do it either."
 NFP65_HOME_THREE:0 "Literacy in our country has reached three quarters. A considerable foundation for the economy: more scope to train specialists, advance research and understand inventions from abroad. The remaining quarter are people too, however. A handsome report has not taught them to read."
 NFP65_HOME_TITLE:0 "More readers. And not just for our newspaper"
 NFP65_OPEN_ALLY:0 "Our ally, [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName], has reached a new milestone in literacy. It is pleasant to receive news from a partner without having to unfold a military map. This time the subject is people who can read for themselves. Including, presumably, our mutual commitments. A useful skill on both sides."
 NFP65_OPEN_ALLY_BLOC:0 "Our ally and fellow power-bloc member, [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName], has reached a new milestone in literacy. More people in our common circle can now read a newspaper, a treaty and the small print beneath a promise. Good news for partners. Shared bloc membership does not make someone else’s achievements ours, however. We can congratulate one another together. Each country will still have to do its own learning."
 NFP65_OPEN_BLOC:0 "Our power-bloc partner, [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName], has reached a new milestone in literacy. News from our shared circle of powers is not always about negotiations and the division of influence. Sometimes education supplies the occasion. A quiet-looking story, but a significant one for a country intent on developing. Signatures on common agreements alone will not take it very far."
 NFP65_OPEN_NEIGHBOR:0 "Our neighbour, [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName], has reached a new milestone in literacy. The border has stayed where it was, so there is no need to send alarming telegrams. Neighbourhood is about more than boundary posts, though. Sometimes it is useful to look at how things are going beyond them, especially when there is reason to compare someone else’s successes with our own."
 NFP65_OPEN_OTHER:0 "News has arrived from [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName] of a new milestone in literacy. Foreign news need not always begin with a war, a scandal or someone’s fall. This time the occasion is different: a larger share of the population can now read and write. An event without a ceremonial salute, but with consequences that may outlast its echo."
 NFP65_OPEN_OVERLORD:0 "Our overlord, [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName], has reached a new milestone in literacy. Changes in the country on which our own depends are worth knowing through more than the instructions arriving from its capital. This time the news concerns education. It does not, by itself, change our relationship, but shows one aspect of the development of a power we have to reckon with."
 NFP65_OPEN_RIVAL:0 "Our rival, [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName], has reached a new milestone in literacy. We might greet the news with a sharp remark and leave it there. Unfortunately for admirers of simple solutions, that will not make anyone there forget how to read. Before exercising our wit, then, let us look at what has happened. A few extra facts have never harmed a newspaper’s satire."
 NFP65_OPEN_SUBJECT:0 "News has arrived from our subject, [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName], of a new milestone in literacy. Its affairs are easily treated as an appendix to our own: what it produces, what it pays and how quietly it behaves. Yet people live there, not lines in our accounts. A larger share of those people can now read what the accounts actually say."
 NFP66_AWAY_CONTEXT:0 "The country has achieved a result worth taking seriously. Its place alone does not explain how it got there or how its various industries are faring. Still, dismissing the change as “just figures” would be rather convenient. Figures can tell a story, too. Especially when the economy behind them has joined the world’s largest."
 NFP66_AWAY_FACT:0 "Before entering the top ten, the country ranked [ScriptContainer.GetVariableValue('nfp20_before')|0]. It now ranks [ScriptContainer.GetVariableValue('nfp20_after')|0], and has appeared among the largest economies in two consecutive monthly reports. These places compare the overall size of economies. They are not awarded according to the comfort of individual households; that might produce a very different list."
 NFP66_AWAY_TITLE:0 "A new arrival among the world’s ten largest economies"
 NFP66_END_COLD_PARTNER:0 "Our agreements have not put an end to our disagreements. They have not made our partner’s economy any smaller, either. Understanding the change would be more useful than finding another way to insist that nothing of interest can happen in a country we find inconvenient."
 NFP66_END_FRIEND:0 "Our partner deserves congratulations. Next comes the interesting question: what will this economic success amount to, and will the new opportunities leave room for useful cooperation? A photograph together at a meeting is pleasant enough. One hopes it is not the full extent of the partnership’s benefits."
 NFP66_END_NEUTRAL:0 "We have noted the change and have something worth watching. What this new standing will mean for life at home and affairs abroad remains to be seen. Meanwhile, a glance at our own reports would do no harm. Good news from abroad can be especially useful for the questions it makes us ask ourselves."
 NFP66_END_OVERLORD:0 "Its economic success does not automatically become ours. Yet we need to understand the capabilities of the power on which we depend. One hopes our own development will occupy at least as much space in our plans as watching its achievements."
 NFP66_END_REBELLIOUS:0 "Relations with our subject are hardly tranquil. That makes its new economic standing particularly worth noting. Calling a place in the top ten the cause of its desire for independence would be hasty. Pretending the size of its economy has no bearing on our relations would be hasty, too."
 NFP66_END_RIVAL:0 "A foreign place in the top ten is no reason to declare our own country defeated. Nor would one clever sneer be much comfort. Our rival has achieved something substantial. It would be pleasant if our next answer were a good report of our own, rather than merely a good retort."
 NFP66_END_SUBJECT:0 "A subject country has an economy of its own, and we ought to see it. Its new position gives us reason to look more closely at its development, with something besides the next payment to our treasury in mind. A substantial achievement deserves a conversation a little broader than another statement of what is owed."
 NFP66_END_THREAT:0 "That power’s intentions towards us can hardly be called harmless. Joining the economic top ten does not, by itself, build an army or start a war. Ignoring the capabilities of such a country would nevertheless be careless. Counting another power’s strength after an unpleasant surprise is generally rather late."
 NFP66_HOME_CONTEXT:0 "Movement in the rankings does not tell the whole story. Our place depends both on our own affairs and on what happens elsewhere. We know the essential point: the present comparison puts us higher than before, with two observations confirming our place in the top ten. Calling that proof of success in every industry would be an exceedingly generous favour to any report."
 NFP66_HOME_END:0 "What are we to make of it? There is reason to be proud. Refusing that pride because problems remain would be strange. Deciding that we can now forget those problems would be stranger still.\n\nWe have made it into the top ten. Let us hope a better life has not been left outside the door."
 NFP66_HOME_FACT:0 "Before entering the top ten, our country ranked [ScriptContainer.GetVariableValue('nfp20_before')|0]. It now ranks [ScriptContainer.GetVariableValue('nfp20_after')|0]. We have appeared among the largest economies in two consecutive monthly reports. In other words, the congratulations did not have to be withdrawn as soon as the ink was dry. Not a bad start."
 NFP66_HOME_INTRO:0 "Our country has joined the world’s ten largest economies. Welcome news for anyone accustomed to searching international reports for a reason to feel national pride. This time there is one. We may straighten our backs, adjust our collars and take a closer look at the result. Preferably before the speeches begin."
 NFP66_HOME_LIVING:0 "For the people who live here, a good place on the list does not yet mean more comfort at home. It is pleasant to know that one lives in one of the world’s largest economies. The shopkeeper will still ask for money, though, rather than our place in an international report. One hopes our economic weight will be felt not only in the grandeur of speeches, but in what people can afford."
 NFP66_HOME_POTENTIAL:0 "A large economy gives a country more possibilities. Behind the total stand businesses, work and goods: the things of which daily life is made. For the state, this is a foundation on which to build its plans. Between “we have the means” and “we made good use of them”, however, there is usually a fair amount of governing to be done. A place in the top ten will not do it for us."
 NFP66_HOME_TITLE:0 "Our economy joins the world’s top ten"
 NFP66_OPEN_ALLY:0 "Our ally, [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName], has joined the world’s ten largest economies. Our partner has something to boast of at the next meeting. It is pleasant when common agreements come with a substantial economy attached. We shall not put its achievement down as our own, though: friendship is friendship, but each country has its own accounts."
 NFP66_OPEN_ALLY_BLOC:0 "Our ally and fellow bloc member, [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName], has joined the world’s economic top ten. Our shared circle has found another occasion for ceremonial speeches. It would be pleasant if useful business followed them. After all, a common bloc has more to offer than an impressive list of names."
 NFP66_OPEN_BLOC:0 "Our fellow bloc member, [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName], has joined the world’s ten largest economies. This is a notable change within our shared circle of powers. Its place on the list does not automatically add money to our treasury, of course. It does give us reason to look more closely at the development of a country bound to us by common agreements."
 NFP66_OPEN_NEIGHBOR:0 "Our neighbour, [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName], has joined the world’s ten largest economies. Beyond the border posts there is another reason for pride. Neighbours do have a habit of making us look at our own affairs now and then. Sometimes with loud declarations. This time, with a place in the economic tables."
 NFP66_OPEN_OTHER:0 "[ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName] has joined the world’s ten largest economies. A new name on the list gives us reason to look more closely at changes abroad. A country’s economic weight seldom becomes clearer through one loud declaration. An international comparison offers rather more grounds for discussion."
 NFP66_OPEN_OVERLORD:0 "Our overlord, [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName], has joined the world’s ten largest economies. We have reason enough to know that power’s economic capabilities without a reminder from its capital. Now it has a new place in the international tables as well. For the country on which our own depends, that is a significant detail."
 NFP66_OPEN_RIVAL:0 "Our rival, [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName], has joined the world’s economic top ten. Warm congratulations may take us a little time to find. Their absence is unlikely to change the result, however. Before explaining why this foreign achievement means nothing, we might at least read what has actually been achieved."
 NFP66_OPEN_SUBJECT:0 "News has arrived from our subject, [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName], of its entry into the world’s economic top ten. There is another reason to look more closely at its affairs. A familiar line about subordination can make it easy to overlook the size of the economy itself. The international tables, evidently, have not forgotten."
 NFP67_AWAY_FACT:0 "Before entering the top three, the country ranked [ScriptContainer.GetVariableValue('nfp20_before')|0]. It now ranks [ScriptContainer.GetVariableValue('nfp20_after')|0]. It has appeared among the leading producers in two consecutive monthly reports."
 NFP67_AWAY_FIRST:0 "Its current output puts it at the head of the world list. This is more than a place among the leaders: nobody in this report stands above it."
 NFP67_AWAY_TITLE:0 "A new name among the top three producers"
 NFP67_AWAY_TOP:0 "World leadership is still beyond its reach, but the country has secured a place among the largest producers. Dismissing the result simply because it is not first would be a peculiar way to console ourselves."
 NFP67_END_COLD_PARTNER:0 "Our countries have plenty of grievances. None of them reduces the quantity produced. Comparing results might be more useful than proving, yet again, that an awkward partner can do nothing worth noticing."
 NFP67_END_FRIEND:0 "Our partner deserves congratulations. It would be pleasant if the courtesies were followed by useful negotiations to our mutual benefit. Friendship between states and the business of individual firms do not always go hand in hand, of course. That makes the achievement no less interesting."
 NFP67_END_NEUTRAL:0 "We have noted the change and compared our own result. Now the next chapter will be worth following. In an industry where we are ourselves a major producer, good news abroad is an excellent reason to examine matters at home."
 NFP67_END_OVERLORD:0 "Its industrial success does not automatically become ours. Still, comparing the capabilities of both countries is useful. We would like to understand our place in this industry through the results of our work, not merely our place in a subject relationship."
 NFP67_END_RIVAL:0 "An achievement abroad does not oblige us to concede defeat immediately. It does give us a good reason to examine our own industry. We hope our next answer will be visible not only to this newspaper’s readers, but to the people compiling the production figures."
 NFP67_END_SUBJECT:0 "A subject country has an economy of its own. Its new position deserves attention even without asking what our Treasury can extract from it. And if relations are becoming strained, there is all the less reason to treat its capabilities as an insignificant detail."
 NFP67_END_THREAT:0 "We have particular reason to watch this power’s capabilities. Output alone does not tell us how the goods will be used or what their producers intend to achieve. But ignoring the productive strength of a country seeking to pressure us would be careless."
 NFP67_EQUAL:0 "Our own output is roughly the same. This is no distant leader at whom we can only sigh. The results are close, which makes the next chapter all the more interesting. Supremacy in newspaper columns can be proclaimed today. Supremacy in production still has to be earned."
 NFP67_HOME_END:0 "What should we take from this? We have entered the world’s top three. Let us do more than put an impressive seal beside the fact. Success is more pleasant to continue than to remember.\n\nThird or second place is already an achievement. As a reason to stop, though, it leaves something to be desired."
 NFP67_HOME_FACT:0 "Before entering the top three, our country ranked [ScriptContainer.GetVariableValue('nfp20_before')|0]. It now ranks [ScriptContainer.GetVariableValue('nfp20_after')|0]. We have appeared among the leading producers in two consecutive monthly reports. These are not congratulations that the very next count has already obliged us to withdraw. Holding our present place is another matter."
 NFP67_HOME_FIRST_END:0 "What should we take from this? First place deserves congratulations. Production will still have to carry on afterwards. Laurels may decorate the celebration, but they cannot replace raw materials or working equipment.\n\nWe have reached the top of the list. We hope to hold that position in more than the celebratory speeches."
 NFP67_HOME_FIRST_INTRO:0 "Our country has become the world’s largest producer of [Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]. In the current output report, nobody stands above us. A pleasing line for national pride. We hope the congratulations will leave room for the people whose daily work made it possible to write that line at all."
 NFP67_HOME_FIRST_TITLE:0 "First place is ours"
 NFP67_HOME_INTRO:0 "Our country has entered the world’s top three producers of [Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]. It is pleasant to receive news in which our economy does not appear beside the words “not enough again”. This time the occasion is different: our output puts us among the world leaders. There is something to be proud of. Now let us see what lies behind it."
 NFP67_HOME_LIMIT:0 "High output does not answer every economic question. Whether the goods sold profitably, whether there are enough at home, and whether the work is well paid are other parts of the same story. A place in the top three has not checked them for us. But that does not diminish the achievement: our country now has a substantial reason for pride among the world’s producers."
 NFP67_HOME_TITLE:0 "Our industry joins the world’s top three"
 NFP67_HOME_WORK:0 "Behind that place in the list stands real production. Goods do not materialise because a report is well written. Businesses produce them, employing people, consuming materials and solving everyday problems. The international report records their combined achievement. We ought to remember that it is made from countless working days which rarely receive a ceremonial speech of their own."
 NFP67_LESS:0 "Our own output is roughly [ScriptContainer.GetVariableValue('nfp67_output_abs')|0]% lower. The other country currently produces more of this good. This is no comparison of profits or workers’ living standards, but it is a clear difference in results that we should seek to narrow. It will be interesting to see how we answer it, beyond explaining why the comparison should never have been made."
 NFP67_MORE:0 "Our own output is roughly [ScriptContainer.GetVariableValue('nfp67_output_abs')|0]% higher. Pleasant news, certainly. But another country’s entry into the top three is a reason to watch the industry, not to adjust our laurels with a condescending smile. An advantage is better maintained by work than by reminders that we possess it."
 NFP67_OPEN_ALLY:0 "Our ally, [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName], has entered the world’s top three producers of [Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]. Our partner has something to boast of. This is no indifferent industry to us, either: we are among the world’s top five producers of this good. Our congratulations therefore come with a certain professional interest... And envy."
 NFP67_OPEN_ALLY_BLOC:0 "Our ally and fellow power bloc member, [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName], has entered the world’s top three producers of [Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]. Another industrial success within our shared circle. A common bloc does not make their factories ours, however. All the more reason to compare the two countries’ results."
 NFP67_OPEN_BLOC:0 "Our fellow power bloc member, [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName], has entered the world’s top three producers of [Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]. This concerns an industry in which we hold a substantial position ourselves. There is something more useful to discuss here than another exchange of assurances about shared prosperity."
 NFP67_OPEN_NEIGHBOR:0 "Our neighbour, [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName], has entered the world’s top three producers of [Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]. There is another reason for economic pride across the border. This time it concerns a good for which we ourselves rank among the top five. There is plenty to compare without competing over the volume of our congratulations."
 NFP67_OPEN_OTHER:0 "[ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName] has entered the world’s top three producers of [Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]. This is no incidental detail of somebody else’s economy. We are ourselves among the top five producers of this good, which gives us reason to follow developments in the industry closely."
 NFP67_OPEN_OVERLORD:0 "Our overlord, [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName], has entered the world’s top three producers of [Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]. We too are a significant producer of this good, so the news deserves attention for reasons beyond our relationship. There is now a very concrete reason to compare results."
 NFP67_OPEN_RIVAL:0 "Our rival, [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName], has entered the world’s top three producers of [Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]. We have interests and production of our own in this industry. Dismissing it with the customary “nothing special” would be rather too convenient. Let us see what they have achieved, and how we compare."
 NFP67_OPEN_SUBJECT:0 "Our subject, [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName], has entered the world’s top three producers of [Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]. The familiar line about subordination can make it easy to overlook this country’s capabilities. The production report invites us to remember them, in an industry that matters to our own economy as well."
 NFP67_UNKNOWN:0 "A reliable comparison of output is not yet possible. We know the rankings, but we shall not invent the size of the gap. Discussing our own capabilities requires our own figures, not merely an impression of somebody else’s achievement."
 NFP68_AWAY_CONTEXT_DOWN:0 "Its opportunities have narrowed, but it is too soon to write the country off. International status cannot replace knowledge of its economy, army and agreements. Fitting all that into one short title would be convenient. But convenience can easily become a mistake here, especially if we then build our own calculations upon it."
 NFP68_AWAY_CONTEXT_RECOG:0 "The country has secured a better position for further development. Whether it will catch those who once looked down on it remains to be seen. But the familiar explanation that it is somehow inferior no longer suffices. We shall have to examine its affairs. That would have been a good place to start before, too."
 NFP68_AWAY_CONTEXT_UP:0 "The country has more scope to pursue its own policy. We should remember that when drawing up our plans. Its new position promises neither a useful agreement nor an unwelcome confrontation by itself. But our customary assessment of this power may begin to lag behind its present capabilities."
 NFP68_AWAY_FACT_DOWN:0 "Its former status was “[Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]”; its new status is “[Localize(ScriptContainer.MakeScope.Var('nfp20_extra_detail').GetFlagName)]”. Its standing has fallen, narrowing its diplomatic options. This does not yet tell us of an empty treasury or a helpless army. A change of status alone cannot draw those conclusions for us. But its former weight can no longer be treated as a constant."
 NFP68_AWAY_FACT_GP_DOWN:0 "Its former status was “Great Power”; its new status is “[Localize(ScriptContainer.MakeScope.Var('nfp20_extra_detail').GetFlagName)]”. It has left the highest circle. Past achievements have not vanished, nor has the country itself. Nevertheless, counting on its international capabilities as though nothing had happened would be peculiar."
 NFP68_AWAY_FACT_GP_UP:0 "Its former status was “[Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]”; its new status is “Great Power”. It has joined the states with the widest diplomatic possibilities. Calling it master of world politics would be generous congratulations. Pretending that only the name has changed would be an equally generous gift to our own peace of mind."
 NFP68_AWAY_FACT_RECOG:0 "Its former status was “[Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]”; its new status is “[Localize(ScriptContainer.MakeScope.Var('nfp20_extra_detail').GetFlagName)]”: it has joined the recognised powers. More than a title has changed. Its previous standing meant less favourable conditions in several areas. One obstacle now lies behind it. How well it uses the change is the next story."
 NFP68_AWAY_FACT_UP:0 "Its former status was “[Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]”; its new status is “[Localize(ScriptContainer.MakeScope.Var('nfp20_extra_detail').GetFlagName)]”. Its standing has risen, along with its diplomatic possibilities. That does not mean every proposal from its capital will now meet with agreement. It does have more influence with which to support its plans."
 NFP68_AWAY_TITLE_DOWN:0 "The old weight, with less to carry it"
 NFP68_AWAY_TITLE_RECOG:0 "Another name among the recognised powers"
 NFP68_AWAY_TITLE_UP:0 "The company of powers grows more crowded"
 NFP68_END_COLD_DOWN:0 "With relations as they are, enjoying this misfortune would be easy. Deciding sensibly what to do about our shared affairs is harder. While agreements bind us together, a change in our partner’s capabilities concerns our plans as well. We would prefer to avoid a celebration spoiled by the very first reckoning of our own interests."
 NFP68_END_COLD_UP:0 "Our shared agreements have not removed our mutual grievances. Neither do those grievances remove an awkward partner’s new capabilities. Examining them will be more useful than explaining why its success deserves no attention at all. Especially if we shall still have to negotiate with this country afterwards."
 NFP68_END_FRIEND_DOWN:0 "Unwelcome news for our shared circle. But an alliance is for more than reciting successes together. It is more useful now to understand how our partner’s capabilities have changed and what that means for our joint plans. Less remains of the former title. We hope there will be more mutual understanding."
 NFP68_END_FRIEND_UP:0 "Our partner deserves congratulations. It would be pleasant if the courtesies were followed by useful negotiations to our mutual benefit. Its new capabilities do not automatically become ours. But the chance to find a shared advantage deserves more than an elegant letter."
 NFP68_END_NEUTRAL_DOWN:0 "The world report has changed, and we should notice. We shall not blame the change on foreign mistakes without examining them. Nor is there much sense in clinging to a familiar picture of the country simply because it is familiar. Maps grow old even when borders stay put."
 NFP68_END_NEUTRAL_UP:0 "We have noted the change. Now we shall watch what follows. The new status gives the country more reason to rely on its own capabilities, and gives us reason to check familiar assumptions against present circumstances. International news is useful when it helps us correct our own calculations in time."
 NFP68_END_OVERLORD_DOWN:0 "Its new position deserves attention, not premature promises. A change of status alone does not end our dependence. Before announcing that every door has opened, we should establish which were locked in the first place, and what has now happened to the locks."
 NFP68_END_OVERLORD_UP:0 "Its success does not automatically become ours. Yet we must understand the capabilities of the power upon which we depend. We hope that watching its rise will leave room for plans of our own. Somebody else’s great name is not a ready-made future for our country."
 NFP68_END_REBELLIOUS:0 "Relations with this subject country already raise plenty of questions about independence. Its new status neither explains those ambitions nor determines their outcome. But discussing its future while ignoring changes in its capabilities would be a rather convenient habit. For us, above all."
 NFP68_END_RIVAL_DOWN:0 "Our rival’s setback will surely find an appreciative reader here. The editors understand the feeling. We shall not yet conclude that the rival is incapable of anything more. Complacency is an affordable pleasure. Its consequences can cost rather more."
 NFP68_END_RIVAL_UP:0 "We have reason to examine our own capabilities more closely. An unfriendly country has achieved something that a joke cannot undo. We hope our response will also find a place in the record of achievements. Winning a contest of wit is pleasant. Unfortunately, it brings no additional diplomatic influence."
 NFP68_END_SUBJECT_DOWN:0 "Losing its former standing does not make its difficulties somebody else’s business alone. It is easy to expect a subject country to discharge its obligations faithfully. Occasionally, we should examine the means it now has to do so."
 NFP68_END_SUBJECT_UP:0 "Behind its subordinate position, we should see this country’s own development. Its new capabilities deserve attention beyond asking what more our Treasury might obtain. We hope our understanding of its affairs will grow at least as quickly as our expectations of it."
 NFP68_END_THREAT:0 "Its intentions towards our country are difficult to call harmless. Changes in its capabilities therefore deserve particular attention. A new status does not mean war has begun, and losing an old one does not guarantee peace. Understanding whom we face is more useful than hoping the necessary conclusion is already written in the category’s name."
 NFP68_HOME_CONTEXT_DOWN:0 "Our country has fewer diplomatic possibilities. Not so few that every decision of our own is pointless, but enough to reconsider the familiar assurance that others will heed us regardless. We hope to be noticed for what we can offer, not merely for how loudly we recall our former standing."
 NFP68_HOME_CONTEXT_GP_DOWN:0 "We have left the circle of Great Powers. With our former standing went some of our ability to influence international affairs. That does not mean every neighbour will stop answering our letters tomorrow. But relying on the old weight of our name alone would now be far too naïve. Especially for those who must explain where that weight went."
 NFP68_HOME_CONTEXT_GP_UP:0 "We have joined the Great Powers. Our country has greater scope to conduct its own diplomacy and back proposals with influence. It is good to have something behind one’s words. Now we are particularly interested in which undertakings we shall consider worthy of these possibilities. Greatness is more pleasing in results than in the size of the lettering on our title."
 NFP68_HOME_CONTEXT_RECOG:0 "The old distinction was more than a matter of pride. Being unrecognised meant less favourable conditions, including borrowing and the spread of knowledge from abroad. Those conditions have changed. That does not mean the Treasury is immediately breathing easier or every discovery reaching us sooner. But one obstacle is gone. A respectable beginning."
 NFP68_HOME_CONTEXT_UP:0 "The new position gives our country more diplomatic possibilities. It does not itself deliver a favourable agreement or make every interlocutor a friend. It does give us more room for decisions of our own. We hope to use it before congratulatory speeches occupy all the available space."
 NFP68_HOME_END_DOWN:0 "What should we take from this? Better to notice an unwelcome change than take offence at the report. Its causes still require examination. Finding them will be more useful than proving that we never much liked our former standing anyway.\n\nThe title has grown more modest. We hope our plans will not follow suit."
 NFP68_HOME_END_RECOG:0 "What should we take from this? Recognition is worth celebrating. Afterwards, we can pursue the things that made a better position worth seeking in the first place. Open possibilities are particularly pleasant when used.\n\nA door has opened before us. Spending the whole day discussing its nameplate would be a peculiar response."
 NFP68_HOME_END_UP:0 "What should we take from this? There is reason for pride. We only hope the new position helps answer old questions instead of becoming a convenient answer to all of them.\n\nOur country carries more weight. May that be felt beyond the recitation of its distinctions."
 NFP68_HOME_FACT:0 "Our former status was “[Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]”; our new status is “[Localize(ScriptContainer.MakeScope.Var('nfp20_extra_detail').GetFlagName)]”. That is the change recorded in the latest report. It describes our standing among other powers. It deserves attention, although it does not by itself explain which achievements, or troubles, brought us here."
 NFP68_HOME_INTRO_DOWN:0 "Our country has lost its former standing among the world’s powers. Not the news one wants beside a festive engraving. We can declare, of course, that foreign lists never interested us much. Yet when our place was higher, we recalled it with noticeably greater pleasure."
 NFP68_HOME_INTRO_NEUTRAL:0 "Our country now belongs to a different category of international status. The report records a change worth examining without premature congratulations or regrets."
 NFP68_HOME_INTRO_RECOG:0 "Our country is now counted among the recognised powers. It is not as though nobody lived, worked or made plans here before. But in international affairs, existence alone is sometimes insufficient: preferably, everyone else must agree to notice it. The old designation is now behind us. Let us see what changes with it."
 NFP68_HOME_INTRO_UP:0 "Our country has climbed a step among the world’s powers. Pleasant news, especially for those tired of finding their homeland somewhere after the words “and others”. National pride has another reason to straighten its shoulders. We hope our capabilities will stand a little taller too."
 NFP68_HOME_TITLE_DOWN:0 "A humbler title. What of our affairs?"
 NFP68_HOME_TITLE_RECOG:0 "Noticed at last"
 NFP68_HOME_TITLE_UP:0 "Now they must reckon with us"
 NFP68_NEUTRAL_CONTEXT:0 "This change calls for examination of its own. Different circumstances may lie behind a category’s name; we shall not choose a convenient explanation in advance."
 NFP68_NEUTRAL_END:0 "We shall watch the country’s next steps. They will tell us more about its capabilities than trying to guess the whole story from a single line."
 NFP68_NEUTRAL_FACT:0 "Its former status was “[Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]”; its new status is “[Localize(ScriptContainer.MakeScope.Var('nfp20_extra_detail').GetFlagName)]”. A difference in names alone does not tell us whether the country has grown stronger or weaker."
 NFP68_NEUTRAL_TITLE:0 "Our country’s standing has changed"
 NFP68_OPEN_ALLY:0 "Our ally, [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName], has a new international status. This deserves more attention than another rearrangement in a foreign list. Shared agreements are easier to assess when we understand our partner’s capabilities. An alliance treaty is no weighing scale, of course. But knowing the partner’s weight is useful nonetheless."
 NFP68_OPEN_ALLY_BLOC:0 "Our ally and fellow power bloc member, [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName], has a new international status. There are enough ties between us not to dismiss the change as “their business”. Theirs, certainly. But when plans are shared, another country’s capabilities soon enter our own calculations."
 NFP68_OPEN_BLOC:0 "Our fellow power bloc member, [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName], has changed its standing among the powers. The company is the same; one member’s weight is not. A substantial detail when discussing joint undertakings. After all, a bloc matters for more than the number of names beneath its banner."
 NFP68_OPEN_NEIGHBOR:0 "Our neighbour, [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName], has a new international status. The border posts have not moved. There is, however, reason to look more closely at who stands on the other side. We cannot choose our neighbours, they say. Fortunately, the saying does not forbid following their affairs."
 NFP68_OPEN_OTHER:0 "News has arrived from [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName] of a change in its international standing. Weight has shifted among the world’s powers, earning this story a place in our edition. A new category alone does not explain the whole change, but it gives us a definite reason to examine it."
 NFP68_OPEN_OVERLORD:0 "Our overlord, [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName], has a new international status. Obligations between capitals do not make the news our own. Nor is it entirely somebody else’s business. The capabilities of the power upon which we depend deserve attention without a special reminder from that power."
 NFP68_OPEN_RIVAL:0 "Our rival, [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName], now holds a different standing among the powers. Before rejoicing or regretting, we should read what has actually changed. Another country’s title neither adds to our strength nor subtracts from it. Its capabilities, however, may prove important information for the future."
 NFP68_OPEN_SUBJECT:0 "Our subject, [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName], reports a change in its international status. The familiar line about subordination can make it easy to overlook this country’s capabilities. Its standing is changing nonetheless, and we should understand what happens beyond the next statement of dues."
 NFP69_FACT:0 "In [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName], ‘[Localize(ScriptContainer.MakeScope.Var('nfp69_old').GetFlagName)]’ has been replaced by ‘[Localize(ScriptContainer.MakeScope.Var('nfp69_new').GetFlagName)]’.\n\n[Localize(ScriptContainer.MakeScope.Var('nfp69_topic').GetFlagName)]"
 NFP69_HOME_OPEN:0 "The law has changed at home. The old rules have made way for new ones. For some, this may be a long-awaited change; for others, a reason to reconsider familiar plans. Let us see what the law now actually says."
 NFP69_LIMIT:0 "The new rules have been adopted; now comes the question of what they will mean for the country. The decree is not the whole story. We shall return to it when changes worth reporting emerge from behind the legal wording."
 NFP69_OPEN_ALLY:0 "News of a new law has arrived from our ally — [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName]. Other countries’ arrangements are easiest to discuss from a distance. It is more useful to read what has changed first: sometimes it leaves us with questions about our own."
 NFP69_OPEN_ALLY_BLOC:0 "News of a new law has arrived from our ally and fellow power bloc member — [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName]. Other countries’ arrangements are easiest to discuss from a distance. It is more useful to read what has changed first: sometimes it leaves us with questions about our own."
 NFP69_OPEN_BLOC:0 "News of a new law has arrived from a member of our power bloc — [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName]. Other countries’ arrangements are easiest to discuss from a distance. It is more useful to read what has changed first: sometimes it leaves us with questions about our own."
 NFP69_OPEN_NEIGHBOR:0 "News of a new law has arrived from our neighbour — [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName]. Other countries’ arrangements are easiest to discuss from a distance. It is more useful to read what has changed first: sometimes it leaves us with questions about our own."
 NFP69_OPEN_OTHER:0 "News of a new law has arrived from a foreign country — [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName]. Other countries’ arrangements are easiest to discuss from a distance. It is more useful to read what has changed first: sometimes it leaves us with questions about our own."
 NFP69_OPEN_OVERLORD:0 "News of a new law has arrived from our overlord — [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName]. Other countries’ arrangements are easiest to discuss from a distance. It is more useful to read what has changed first: sometimes it leaves us with questions about our own."
 NFP69_OPEN_RIVAL:0 "News of a new law has arrived from our rival — [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName]. Other countries’ arrangements are easiest to discuss from a distance. It is more useful to read what has changed first: sometimes it leaves us with questions about our own."
 NFP69_OPEN_SUBJECT:0 "News of a new law has arrived from our subject — [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName]. Other countries’ arrangements are easiest to discuss from a distance. It is more useful to read what has changed first: sometimes it leaves us with questions about our own."
 NFP69_POLICY_LAW_AFFIRMATIVE_ACTION:0 "The law provides particular support for groups previously pushed to the margins of public life. Equality here means helping people overcome accumulated disadvantages, rather than merely hanging the same welcome sign above the door."
 NFP69_POLICY_LAW_AGRARIANISM:0 "Economic policy favours agriculture and rural communities. Its centre of attention lies closer to the field and village than the factory gates."
 NFP69_POLICY_LAW_ANARCHY:0 "Local communities govern themselves and send temporary delegates to common councils. Decisions must be agreed between communities, since a permanent chain of command is not the foundation of this arrangement."
 NFP69_POLICY_LAW_ANTI_STRIKE_LAWS:0 "Workers may form associations, but strikes and some collective demands remain forbidden. The organisation may exist; the law has cut off some of its means of applying pressure."
 NFP69_POLICY_LAW_APPOINTED_BUREAUCRATS:0 "Officials are appointed by the authorities and paid for their public service. Their posts and their performance are matters for those who sign the appointments."
 NFP69_POLICY_LAW_AUTOCRACY:0 "Supreme power rests with the head of state, answerable to no other earthly authority. Under such an arrangement, who has the last word is known before the subject of the argument."
 NFP69_POLICY_LAW_BAKUFU:0 "Full authority belongs to the shogun, who rules in the emperor’s name. The name at the summit of the state and the hand making its decisions belong to different offices."
 NFP69_POLICY_LAW_CAESAROPAPISM:0 "The Orthodox Church keeps its altars, but the state has the final say in its affairs. Other faiths remain on unequal terms before the law."
 NFP69_POLICY_LAW_CANTON_SYSTEM:0 "Foreign trade is permitted through only one coastal state. Imported goods are given a narrow entrance, easier for the authorities to watch."
 NFP69_POLICY_LAW_CENSORSHIP:0 "The press is subject to censorship, and freedom of assembly is not granted. Before a word reaches its reader, the authorities have an opportunity to stop it on the way."
 NFP69_POLICY_LAW_CENSUS_VOTING:0 "Educated men meeting the prescribed qualifications may vote. Literacy and social standing become conditions for admission to the electorate."
 NFP69_POLICY_LAW_CHARITABLE_HEALTH_SYSTEM:0 "Care for the sick falls to charitable organisations, including religious ones. Treatment depends on the resources of those willing to help, giving donations a very practical significance."
 NFP69_POLICY_LAW_CHIEFDOM:0 "Authority rests on kinship and a chief or elder from a prominent lineage. Personal and family standing take the place of an extensive administration governing large territories."
 NFP69_POLICY_LAW_CHIEFS_DISTRIBUTE_AID:0 "Chiefs distribute aid to needy members of the clan, religious institutions and warriors. Support passes through the authority of the clan and its control of common resources."
 NFP69_POLICY_LAW_CHILD_LABOR_ALLOWED:0 "The law places no special restrictions on where children may work. Child labour remains part of the economy, without a separate prohibition on work dangerous for their age."
 NFP69_POLICY_LAW_CLOSED_BORDERS:0 "Migration into and out of the country is forbidden. The border bars both those seeking a life abroad and those hoping to settle here."
 NFP69_POLICY_LAW_COLLECTIVIZED_AGRICULTURE:0 "The land is worked by collectives of farmers. A plot becomes a shared undertaking, with the organisation of labour concerning the whole group."
 NFP69_POLICY_LAW_COLONIAL_ADMINISTRATION:0 "The territory is governed on behalf of the colonial power and has no sovereignty of its own. The local administration acts within powers granted from abroad."
 NFP69_POLICY_LAW_COLONIAL_EXPLOITATION:0 "Colonial policy centres on natural wealth and cheap labour. Its foundation is the economic return from dependent territories, rather than provision of a plot for a settler."
 NFP69_POLICY_LAW_COLONIAL_RESETTLEMENT:0 "Colonies are intended chiefly for settlers from the country’s incorporated states. The land question takes an overseas turn: new possessions are viewed as places for new farms."
 NFP69_POLICY_LAW_COLONIAL_SLAVERY:0 "Slavery is permitted in the colonies, but an enslaved person becomes free upon setting foot in the homeland. One state assigns two different legal fates to people in different parts of its territory."
 NFP69_POLICY_LAW_COMBINATION_ACTS:0 "All workers’ associations are forbidden by law. Working together is permitted; organising to defend common interests is not."
 NFP69_POLICY_LAW_COMMAND_ECONOMY:0 "The government directly manages most production. The principal economic decisions converge on the state administration, which must determine the course of enterprises."
 NFP69_POLICY_LAW_COMMERCIALIZED_AGRICULTURE:0 "Agriculture is organised as a market business owned by capital. The field joins the same world of investment and calculations of return as other enterprises."
 NFP69_POLICY_LAW_COMMUNAL_ADMINISTRATION:0 "Workers’ organizations take charge of everyday administration. At the central offices, the seats go to representatives they elect themselves."
 NFP69_POLICY_LAW_COMPULSORY_PRIMARY_SCHOOL:0 "Children must attend primary school for several years and may not work during that education. The law gives literacy a compulsory place in the childhood timetable, in place of earnings."
 NFP69_POLICY_LAW_CONSUMPTION_BASED_TAXATION:0 "The treasury raises taxes through the consumption of goods rather than a general income or poll tax. The tax question arises at the counter: which purchases are taxed matters."
 NFP69_POLICY_LAW_COOPERATIVE_OWNERSHIP:0 "The means of production pass into the joint ownership of workers, who share the surplus. The workforce gains a place on both sides of the enterprise: labour and ownership."
 NFP69_POLICY_LAW_CORPORATE_STATE:0 "The state arranges cooperation between officially recognised corporate groups and negotiations between social classes. The right to speak for an interest is tied to membership of a recognised organisation."
 NFP69_POLICY_LAW_CORPORATIZED_UNIONS:0 "Workers’ associations come under direct or indirect state control and are directed towards cooperation between classes. Organised labour must fit into the authorities’ arrangements for reconciling interests."
 NFP69_POLICY_LAW_COUNCIL_REPUBLIC:0 "Workers elect representatives to local councils, which form the basis of government. The organisation of the workforce thus becomes part of the structure of political power."
 NFP69_POLICY_LAW_CROWNLAND_DIETS:0 "Local government is entrusted to traditional assemblies representing the regional aristocracy. The state’s affairs are discussed by its noble families; the circle of speakers is settled in advance."
 NFP69_POLICY_LAW_CULTURAL_EXCLUSION:0 "Cultural acceptance extends to those who share traits with the country’s primary cultures. Cultures without such ties still face restrictions: the state continues to demand evidence of resemblance."
 NFP69_POLICY_LAW_DEBT_SLAVERY:0 "Failure to repay a debt allows the debtor to become the creditor’s property. The obligation now reaches as far as the person’s own freedom."
 NFP69_POLICY_LAW_DEDICATED_POLICE:0 "A professional police force is established, with common training requirements. Keeping order becomes a dedicated service, with instruction and permanent duties of its own."
 NFP69_POLICY_LAW_DIPLOMATIC_NAVY:0 "The emphasis falls on long-range cruising and a presence around the world. Diplomacy gains a naval service able to show the flag far from its home port."
 NFP69_POLICY_LAW_ELDER_COUNCIL:0 "Participation in government is reserved for the oldest and most respected members of society. Political weight is tied to age and standing, rather than a universal electoral roll."
 NFP69_POLICY_LAW_ELECTED_BUREAUCRATS:0 "Local governors are elected by the inhabitants of the states. The office now has an electorate to answer to: local authority rests on more than a decision made in the capital."
 NFP69_POLICY_LAW_ETHNOSTATE:0 "Citizenship is confined to a particular ethnic group, while other cultures face discrimination. Ancestry becomes the test for full membership of the state."
 NFP69_POLICY_LAW_EXPANDED_LATIFUNDIAS:0 "Large estates receive stronger backing: the law increases the aristocracy’s political weight and investment returns while weakening the peasantry’s political position. The size of an estate is reinforced by advantages in both business and government."
 NFP69_POLICY_LAW_EXTRACTION_ECONOMY:0 "The colonial economy is directed towards profit for the colonial power. Production is arranged to serve the interests of an external centre, whose gain becomes the measure of the system."
 NFP69_POLICY_LAW_EXTRAORDINARY_COMMISSION:0 "A mass organization has been charged with putting down sabotage and counter-revolution. It will be the body that takes up accusations carrying those names."
 NFP69_POLICY_LAW_FACTORY_COUNCILS:0 "Workers’ councils gain a route to collective management of enterprises, while trade unions gain political strength. The law brings the question of power in the workplace into the workforce itself."
 NFP69_POLICY_LAW_FREEDOM_OF_CONSCIENCE:0 "An official religion remains, but freedom to choose a faith expands; some beliefs still face discrimination. Conscience has more room, though the state keeps its exceptions."
 NFP69_POLICY_LAW_FREE_TRADE:0 "Free trade is established, reducing state barriers to the exchange of goods. Businesses face more competition from abroad, whether buying or selling."
 NFP69_POLICY_LAW_FRONTIER_COLONIZATION:0 "Colonial policy concentrates on frontiers adjoining the country. Settlement expands into neighbouring borderlands, rather than seeking any distant land available."
 NFP69_POLICY_LAW_GRADUATED_TAXATION:0 "Taxes on dividends are intended to shift more of the burden onto wealthy recipients of income. The treasury takes a closer interest in the returns earned by owners of capital."
 NFP69_POLICY_LAW_GUARANTEED_LIBERTIES:0 "The home affairs authorities must address people’s grievances and problems; detention and surveillance require substantial grounds. An official’s powers are now bounded by the rights of the person whose door they knock upon."
 NFP69_POLICY_LAW_GUILD_SYSTEM:0 "Practising certain crafts and trades requires membership of a recognised guild. The profession acquires a collective gatekeeper: wanting to enter the business is no longer enough."
 NFP69_POLICY_LAW_HEREDITARY_BUREAUCRATS:0 "Official posts pass from parents to children, along with their duties. Family succession has reached the government writing desk."
 NFP69_POLICY_LAW_HINDU_CASTE_CODIFIED:0 "Caste distinctions are officially codified and used to restrict social and economic opportunities. The old order receives a place in the statute book, turning custom into a formal rule."
 NFP69_POLICY_LAW_HINDU_CASTE_ENFORCED:0 "The caste hierarchy is upheld by law and restricts movement between social positions. Birth is not merely an entry in a family history; it marks the limits of what is permitted."
 NFP69_POLICY_LAW_HINDU_CASTE_NOT_ENFORCED:0 "Caste no longer provides a lawful restriction on social or economic advancement. Ancestry ceases to be the official passport to opportunity, although a decree alone cannot abolish society’s habits."
 NFP69_POLICY_LAW_HOMESTEADING:0 "Farmers hold their own plots and work them alongside hired labourers. Independent ownership and hired labour go together: the owner need not work alone."
 NFP69_POLICY_LAW_INDUSTRY_BANNED:0 "Heavy industry and automation are rejected in favour of an economy based on manual labour. A machine must justify not its profitability, but its very right to exist."
 NFP69_POLICY_LAW_INTERMEDIATE_EDO_SYSTEM:0 "Social restrictions are eased, and wealthy townspeople and peasants may purchase the status of gokenin, a lower rank of samurai. The door to the privileged estate stands ajar, though admission still costs money."
 NFP69_POLICY_LAW_INTERNAL_COLONIZATION:0 "Settlers of the dominant culture are to move to the internal frontier. The line on the national map stays put. Who lives next door is another matter."
 NFP69_POLICY_LAW_INTERVENTIONISM:0 "The state retains the right to intervene in private enterprise to restrain its excesses and maintain stability. Freedom of enterprise sits alongside the authorities’ right to adjust its course."
 NFP69_POLICY_LAW_ISOLATIONISM:0 "The economy turns towards domestic self-sufficiency, rejecting ordinary foreign trade. Supply and demand must largely find each other on their own side of the border."
 NFP69_POLICY_LAW_JEUNE_ECOLE:0 "The fleet is built around small, well-armed vessels intended to fight larger opponents. Naval thinking places its wager on a small ship’s weapons, rather than hull size alone."
 NFP69_POLICY_LAW_LABOUR_SUFFRAGE:0 "A ballot now depends on how one earns a living. Work for your bread and you may vote. Draw an income from property as well, and the rule changes."
 NFP69_POLICY_LAW_LAISSEZ_FAIRE:0 "Economic policy rests on private competition and limited state intervention. Businesses gain greater freedom to decide where their capital should go."
 NFP69_POLICY_LAW_LANDED_VOTING:0 "Owners of land or capital may vote. Before asking a citizen’s opinion, the system enquires after their property."
 NFP69_POLICY_LAW_LAND_BASED_TAXATION:0 "The tax system rests on land-based levies, chiefly collected from peasants. State revenue is closely tied to agriculture and the obligations of those who work the land."
 NFP69_POLICY_LAW_LATIFUNDIAS:0 "Large estates employing poorly paid seasonal labour form the basis of landholding. A worker’s earnings depend not only on the landowner, but on the agricultural season."
 NFP69_POLICY_LAW_LAX_EDO_SYSTEM:0 "Commoners gain access to offices and duties previously reserved for samurai. The law leaves more room between a person’s birth and their occupation."
 NFP69_POLICY_LAW_LEGACY_SLAVERY:0 "Existing slavery remains, but its expansion is forbidden. The law preserves the old bondage while closing the way to its further spread."
 NFP69_POLICY_LAW_LOCAL_POLICE:0 "Public order is entrusted to local police bodies. The service is tied to local authority, making policing chiefly a local matter."
 NFP69_POLICY_LAW_MANORIALISM:0 "Land remains with hereditary owners, while tenants owe them unpaid labour but retain freedom of movement. They may leave; while occupying the land, their obligations still include working for its owner."
 NFP69_POLICY_LAW_MASS_CONSCRIPTION:0 "A professional army may be reinforced through mass conscription of infantry. Military rolls become closely connected to the lists of people workshops and farms may find missing."
 NFP69_POLICY_LAW_MERCANTILISM:0 "Trade policy favours exports and a positive inflow of funds in competition with other countries. Foreign trade becomes a means of strengthening the domestic economy in that contest."
 NFP69_POLICY_LAW_MERCHANT_NAVY:0 "Naval organisation centres on international trade and protecting cargoes. Its essential question is whether a merchant ship can complete its voyage with its goods."
 NFP69_POLICY_LAW_MIGRATION_CONTROLS:0 "Migration is permitted only to members of cultures and religions that do not face discrimination. The right to cross the border depends on how the state regards the migrant’s identity."
 NFP69_POLICY_LAW_MILITARIZED_POLICE:0 "The police receive military equipment and training. In the means at its disposal, the service responsible for domestic order draws closer to the armed forces."
 NFP69_POLICY_LAW_MILITARY_BUREAUCRATS:0 "A uniform will look quite at home in the civil service. The army supplies most of its senior officials."
 NFP69_POLICY_LAW_MILLET_SYSTEM:0 "With Sunni Islam as the state faith, other Abrahamic communities receive legal autonomy and exemption from conscription in exchange for a religious tax. Communities retain their own arrangements, while the treasury presents a decidedly earthly bill."
 NFP69_POLICY_LAW_MONARCHY:0 "Executive power belongs to the monarch, and the ruling dynasty embodies the continuity of the state. The family history of the ruling house becomes part of the whole country’s constitution."
 NFP69_POLICY_LAW_MULTICULTURAL:0 "Civil rights are granted without cultural discrimination or the official supremacy of one culture over another. Belonging to the country no longer requires the right cultural pedigree."
 NFP69_POLICY_LAW_NATIONAL_GUARD:0 "Independent volunteer citizen formations are provided for the maintenance of public order. Domestic security becomes the responsibility of armed volunteers as well as permanent officials."
 NFP69_POLICY_LAW_NATIONAL_MILITIA:0 "A small regular army is supplemented by local militias in the country’s defence. For such a soldier, home is both the reason to take up arms and the place they hope to return to soon."
 NFP69_POLICY_LAW_NATIONAL_SUPREMACY:0 "The state gives primacy to its principal national identity, also accepting cultures that share its heritage and language or other customs. Legal barriers remain for the rest: resemblance to the majority becomes a condition of admission."
 NFP69_POLICY_LAW_NEO_ABSOLUTISM:0 "An autocratic ruler relies on a modern, centralised administration. The offices may be organised on new lines, but the final decision still belongs to one person."
 NFP69_POLICY_LAW_NO_COLONIAL_AFFAIRS:0 "The state forgoes establishing colonies through formal colonisation. Colonial ambitions no longer have the mechanism of expansion provided by that policy."
 NFP69_POLICY_LAW_NO_HEALTH_SYSTEM:0 "The treasury does not fund healthcare. Treatment falls outside public expenditure, leaving the sick to seek help through other means and institutions."
 NFP69_POLICY_LAW_NO_HOME_AFFAIRS:0 "Suppressing unrest and rebellion remains the responsibility of the regular army and police. The law provides no separate home affairs institution; the state relies on the forces it already has."
 NFP69_POLICY_LAW_NO_MIGRATION_CONTROLS:0 "The state imposes no controls on migration across its borders. The decision to leave or arrive does not require overcoming a specific migration prohibition."
 NFP69_POLICY_LAW_NO_POLICE:0 "The law provides no organised police service. Public order has no separate permanent institution charged with maintaining it."
 NFP69_POLICY_LAW_NO_SCHOOLS:0 "Education is left to families, without a common school system. Learning to read depends closely on the money and assistance available at home."
 NFP69_POLICY_LAW_NO_SOCIAL_SECURITY:0 "The state does not undertake to maintain people who cannot support themselves. Those in need must look beyond a public benefits system for help."
 NFP69_POLICY_LAW_NO_WOMENS_RIGHTS:0 "Women are legally subject to male guardianship and have limited rights. Independent decisions run up against their established dependence on a guardian."
 NFP69_POLICY_LAW_NO_WORKERS_RIGHTS:0 "The state establishes no special guarantees of labour rights. Employment relations are left without this layer of legal protection for workers."
 NFP69_POLICY_LAW_OFFICIAL_NATIONALITY:0 "The state has chosen the Russian subject as its ideal and expects other peoples to assimilate. That distinction lands rather close to home for a family that speaks another language."
 NFP69_POLICY_LAW_OKHRANA:0 "The secret police will watch émigrés and suppress revolutionary activity. Crossing a frontier, it seems, need not put one beyond their gaze."
 NFP69_POLICY_LAW_OLD_AGE_PENSION:0 "The state undertakes to support workers in old age. Retirement becomes a matter of public provision, rather than solely personal savings and help from the family."
 NFP69_POLICY_LAW_OLIGARCHY:0 "The head of state shares power with a narrow circle of influential people who do not answer to voters. Political discussion admits several voices, but the guest list remains short."
 NFP69_POLICY_LAW_ORGANIC_REGULATION:0 "Government follows organic laws imposed by the Great Powers, while representatives of the boyar elite choose the head of state. Local authority receives its rules from outside and its electors from a very restricted circle."
 NFP69_POLICY_LAW_OUTLAWED_DISSENT:0 "Criticism of the government is illegal and treated as treason. For a newspaper’s pen, that is a particularly short journey from observation to accusation."
 NFP69_POLICY_LAW_PARLIAMENTARY_REPUBLIC:0 "The head of the legislature becomes head of state. The highest executive office is tied to parliament, making the organisation of representation particularly important."
 NFP69_POLICY_LAW_PEASANT_LEVIES:0 "The army rests on levies of peasant infantry with the most modest training. There is, after all, some distance between knowing how to hold a plough and knowing how to hold a formation."
 NFP69_POLICY_LAW_PEASANT_PROPRIETORSHIP:0 "Most agricultural land belongs to independent peasant proprietors, while large commercial estates occupy a smaller share. Farming centres on people working their own land."
 NFP69_POLICY_LAW_PEOPLE_OF_THE_BOOK:0 "The Islamic legal order grants followers of other Abrahamic faiths legal autonomy and exemption from conscription, alongside a special religious tax. The distinction reaches communal courts, military service and the purse alike."
 NFP69_POLICY_LAW_PER_CAPITA_BASED_TAXATION:0 "Income taxation is combined with a poll tax that weighs particularly heavily on the poor. An identical charge per person occupies a very different place in a large purse and a small one."
 NFP69_POLICY_LAW_POOR_LAWS:0 "Poor relief is organised through workhouses. Along with maintenance, a person in need receives prescribed arrangements for living and working."
 NFP69_POLICY_LAW_PRESIDENTIAL_REPUBLIC:0 "The republic has a president as head of state and a representative government. The presidency becomes the central office of state; who may vote is determined separately by the laws on political rights."
 NFP69_POLICY_LAW_PRIVATE_HEALTH_INSURANCE:0 "Treatment is organised through private hospitals and individual health insurance. Access to paid care depends on being able to purchase that protection: health enters the realm of contracts and contributions."
 NFP69_POLICY_LAW_PRIVATE_SCHOOLS:0 "Private institutions provide education. The choice of school depends on the establishments available and the family’s ability to pay the fees."
 NFP69_POLICY_LAW_PROFESSIONAL_ARMY:0 "The country relies on a standing army of professional soldiers. Soldiering becomes their principal occupation, and training part of their service rather than a brief preface to a campaign."
 NFP69_POLICY_LAW_PROFESSIONAL_NAVY:0 "The state chooses to maintain a powerful standing navy to deter rivals. Under this arrangement, a ship is both a weapon and a rather conspicuous argument."
 NFP69_POLICY_LAW_PROPORTIONAL_TAXATION:0 "Taxation is based chiefly on income, taking roughly the same share of earnings. The treasury measures its demand against income instead of merely counting taxpayers by the head."
 NFP69_POLICY_LAW_PROTECTED_SPEECH:0 "Freedom of speech receives legal protection. Public debate gains more room, and a newspaper more reason to expect that an argument will be answered with another argument."
 NFP69_POLICY_LAW_PROTECTIONISM:0 "The state shields domestic industry from foreign competition through trade restrictions. Trade policy places a barrier between the home producer and the rival abroad."
 NFP69_POLICY_LAW_PUBLIC_HEALTH_INSURANCE:0 "The state funds health insurance intended to give citizens equal access to care. Treatment costs acquire a common budgetary footing instead of resting entirely on the individual bill."
 NFP69_POLICY_LAW_PUBLIC_SCHOOLS:0 "The state undertakes to provide accessible schooling under common educational rules. A place in the classroom becomes a public responsibility, rather than solely a matter of family means."
 NFP69_POLICY_LAW_RACIAL_SEGREGATION:0 "Civil rights are tied to shared racial heritage, discriminating against cultures of a different ancestry. The law draws a boundary between inhabitants where it sees a difference in their heritage."
 NFP69_POLICY_LAW_REGULATORY_BODIES:0 "Government bodies are charged with limiting employers’ actions. A labour dispute gains an institution meant to watch the rules, rather than production figures alone."
 NFP69_POLICY_LAW_RELIGIOUS_SCHOOLS:0 "Religious institutions are put in charge of schooling. Alongside letters, the classroom gains teachers for whom learning is bound up with matters of faith."
 NFP69_POLICY_LAW_RESTRICTED_CHILD_LABOR:0 "Children are forbidden to work in factories. The law draws a definite boundary between a child’s age and a place on the factory floor."
 NFP69_POLICY_LAW_REVOLUTIONARY_GUARD:0 "Workers’ militias are being brought into one army. Who gives the orders? The ranks will elect their officers."
 NFP69_POLICY_LAW_RIGHT_OF_ASSEMBLY:0 "Citizens are granted the right to gather. Public opinion gains somewhere to meet: a chance to discuss matters and make demands together."
 NFP69_POLICY_LAW_RIGHT_TO_ASSOCIATE:0 "Workers may form organisations and conduct their activities without special restrictions. A common interest receives the right to an organisation of its own."
 NFP69_POLICY_LAW_SAKOKU:0 "Contact with foreign states is sharply restricted, and trade permitted only through designated ports. The maritime border has a few doors, opened under special rules."
 NFP69_POLICY_LAW_SECRET_POLICE:0 "A special apparatus is established to watch dissenters and investigate political crimes. State attention to private conversations acquires a department of its own."
 NFP69_POLICY_LAW_SERFDOM:0 "Peasants are bound to the land and obliged to work for their feudal lord. Their ability to move elsewhere or change occupation is restricted by their place in this order."
 NFP69_POLICY_LAW_SHINSENGUMI:0 "An elite band of swordsmen is entrusted with protecting officials and patrolling the capital. This arrangement has a definite shape: the security of authority is assigned to a special armed service."
 NFP69_POLICY_LAW_SINGLE_PARTY_STATE:0 "Legal political activity is concentrated in one party’s hands. Debate over power has a prescribed framework: only one kind of party card is admitted."
 NFP69_POLICY_LAW_SLAVERY_BANNED:0 "Owning another human being as property is prohibited. Human freedom can no longer lawfully be entered in someone else’s inventory."
 NFP69_POLICY_LAW_SLAVE_TRADE:0 "The law permits the purchase of slaves through international trade. Demand for forced labour acquires an external market in which a human being is the object of the transaction."
 NFP69_POLICY_LAW_SOCIAL_MONARCHY:0 "The monarchy remains a national symbol while the state mediates between corporate bodies. The crown stays above the negotiating table where organised interests in society are meant to meet."
 NFP69_POLICY_LAW_STATE_ATHEISM:0 "The state pursues an antireligious policy, excluding religion from public government and restricting all faiths. Belief itself now becomes an object of official suspicion."
 NFP69_POLICY_LAW_STATE_RELIGION:0 "The church becomes an organ of the state, while religious minorities remain unequal before the law. Faith becomes a question not merely of conscience, but of relations with authority."
 NFP69_POLICY_LAW_STRICT_EDO_SYSTEM:0 "The estate system strictly determines occupations, rights and even the permitted design of a dwelling; a commoner cannot lawfully become a samurai. The state watches distinctions down to the number of gates: a remarkably thorough idea of order."
 NFP69_POLICY_LAW_SUBJECTHOOD:0 "Inhabitants are regarded primarily as the monarch’s subjects, with cultural matters left to their respective communities. Common allegiance to the crown matters more here than an attempt to create a single national identity."
 NFP69_POLICY_LAW_TECHNOCRACY:0 "Government is entrusted to an unelected council selected for knowledge and ability. The right to govern is justified by competence rather than the result of a vote."
 NFP69_POLICY_LAW_TENANT_FARMERS:0 "Farmers work on land belonging to hereditary owners but remain free to leave and seek another occupation. Their relationship with the land runs through someone else’s ownership; the worker is not bound to the plot."
 NFP69_POLICY_LAW_TERAKOYA:0 "Commoners are educated through a decentralised network of private temple schools. School life rests on local terakoya rather than a single state hierarchy of institutions."
 NFP69_POLICY_LAW_THEOCRACY:0 "The clergy govern through interpretations of sacred texts. State authority has a religious foundation, and an argument over public order stands close to an argument over faith."
 NFP69_POLICY_LAW_THIRD_SECTION:0 "The Imperial Chancellery has a special bureau for censorship and investigation. Political and religious dissent both fall within its remit. A newspaper has a professional interest in the arrangement."
 NFP69_POLICY_LAW_TOTAL_SEPARATION:0 "The church is separated from government, and religious affiliation no longer grounds discrimination. The law sends questions of faith and civil standing to different offices."
 NFP69_POLICY_LAW_TRADITIONALISM:0 "Economic life rests on preindustrial subsistence production with little state intervention. Familiar ways of making a living retain precedence over organising the economy on industrial lines."
 NFP69_POLICY_LAW_UNIVERSAL_SUFFRAGE:0 "All adult men receive the vote on equal terms. Differences in wealth no longer determine the weight of a man’s vote; women’s position remains subject to a separate law."
 NFP69_POLICY_LAW_WAGE_SUBSIDIES:0 "The law links social provision to a minimum wage administered through the relevant institution. Pay acquires a floor that the state undertakes to support."
 NFP69_POLICY_LAW_WARRIOR_CASTE:0 "Bearing arms and military service are reserved for a distinct warrior estate, closed to commoners. Ancestry is examined before marksmanship."
 NFP69_POLICY_LAW_WEALTH_VOTING:0 "Voting rights depend on wealth, with the prosperous vote carrying greater weight. Political influence acquires a distinctly monetary measure."
 NFP69_POLICY_LAW_WOMENS_SUFFRAGE:0 "Women receive the right to vote. Political opinion ceases to be one sex’s privilege, though the general rules of admission to elections still come from electoral laws."
 NFP69_POLICY_LAW_WOMEN_IN_THE_FIELDS:0 "Women bear the main burden of economic and agricultural work, allowing more men to pursue war and raiding. Society’s military arrangements rest on who stays behind to keep the economy running."
 NFP69_POLICY_LAW_WOMEN_IN_THE_WORKPLACE:0 "The law permits women a wider role in paid employment. Questions of earnings and independence extend beyond the household."
 NFP69_POLICY_LAW_WOMEN_OWN_PROPERTY:0 "Women acquire the right to own property, including inherited property. Ownership may belong to the woman herself, rather than only to the man on whom her position depends."
 NFP69_POLICY_LAW_WORKER_PROTECTIONS:0 "Workers receive broad rights secured by law. Terms of employment must reckon with obligations to the employee that cannot simply be struck out of a private agreement."
 NFP72_BASE_1:0 "What we know here is how the groups regard the new law itself. Their positions before its passage were not recorded. This tells us how well the law fits their views, not who supported replacing the old one. Awarding votes after the fact would be rather adventurous journalism."
 NFP72_BASE_2:0 "What we know here is how the groups regard the new law itself. Their positions before its passage were not recorded. This tells us how well the law fits their views, not who supported replacing the old one. Awarding votes after the fact would be rather adventurous journalism."
 NFP72_GOV_1:0 "The new law has its own story within the government, too. [Localize(ScriptContainer.MakeScope.Var('nfp50_law_gov_summary').GetFlagName)] The decision has been made, but that alone does not make every member of the government of one mind. [SelectLocalization(GreaterThan_CFixedPoint(ScriptContainer.GetVariableValue('nfp50_law_gov_yes_present'), '(CFixedPoint)0'), 'NFP50_LAW_GOV_YES_NAME', 'NFP50_LAW_NO_MOVE')] [SelectLocalization(GreaterThan_CFixedPoint(ScriptContainer.GetVariableValue('nfp50_law_gov_no_present'), '(CFixedPoint)0'), 'NFP50_LAW_GOV_NO_NAME', 'NFP50_LAW_NO_MOVE')]"
 NFP72_GOV_2:0 "The new law has its own story within the government, too. [Localize(ScriptContainer.MakeScope.Var('nfp50_law_gov_summary').GetFlagName)] The decision has been made, but that alone does not make every member of the government of one mind. [SelectLocalization(GreaterThan_CFixedPoint(ScriptContainer.GetVariableValue('nfp50_law_gov_yes_present'), '(CFixedPoint)0'), 'NFP50_LAW_GOV_YES_NAME', 'NFP50_LAW_NO_MOVE')] [SelectLocalization(GreaterThan_CFixedPoint(ScriptContainer.GetVariableValue('nfp50_law_gov_no_present'), '(CFixedPoint)0'), 'NFP50_LAW_GOV_NO_NAME', 'NFP50_LAW_NO_MOVE')]"
 NFP72_IG_1:0 "Among the largest organised groups by membership, the picture is as follows. [Localize(ScriptContainer.MakeScope.Var('nfp50_law_ig_1_type').GetFlagName)] — [Localize(ScriptContainer.MakeScope.Var('nfp50_law_ig_1_stance').GetFlagName)]. [SelectLocalization(GreaterThan_CFixedPoint(ScriptContainer.GetVariableValue('nfp50_law_ig_count'), '(CFixedPoint)1'), 'NFP72_SECOND', 'NFP50_LAW_NO_MOVE')] These voices tell us much about organised political life. They do not, however, speak for everyone outside it."
 NFP72_IG_2:0 "Among the largest organised groups by membership, the picture is as follows. [Localize(ScriptContainer.MakeScope.Var('nfp50_law_ig_1_type').GetFlagName)] — [Localize(ScriptContainer.MakeScope.Var('nfp50_law_ig_1_stance').GetFlagName)]. [SelectLocalization(GreaterThan_CFixedPoint(ScriptContainer.GetVariableValue('nfp50_law_ig_count'), '(CFixedPoint)1'), 'NFP72_SECOND', 'NFP50_LAW_NO_MOVE')] These voices tell us much about organised political life. They do not, however, speak for everyone outside it."
 NFP72_MOVES_1:0 "Political movements have a place in this story as well. [SelectLocalization(GreaterThan_CFixedPoint(ScriptContainer.GetVariableValue('nfp50_law_move_yes_present'), '(CFixedPoint)0'), 'NFP72_MOVE_YES', 'NFP50_LAW_NO_MOVE')] [SelectLocalization(GreaterThan_CFixedPoint(ScriptContainer.GetVariableValue('nfp50_law_move_no_present'), '(CFixedPoint)0'), 'NFP72_MOVE_NO', 'NFP50_LAW_NO_MOVE')] Agreement with the new law does not establish who brought the change about. It does help explain why some find the new arrangements more agreeable than others."
 NFP72_MOVES_2:0 "Political movements have a place in this story as well. [SelectLocalization(GreaterThan_CFixedPoint(ScriptContainer.GetVariableValue('nfp50_law_move_yes_present'), '(CFixedPoint)0'), 'NFP72_MOVE_YES', 'NFP50_LAW_NO_MOVE')] [SelectLocalization(GreaterThan_CFixedPoint(ScriptContainer.GetVariableValue('nfp50_law_move_no_present'), '(CFixedPoint)0'), 'NFP72_MOVE_NO', 'NFP50_LAW_NO_MOVE')] Agreement with the new law does not establish who brought the change about. It does help explain why some find the new arrangements more agreeable than others."
 NFP72_MOVE_NO:0 "Among opponents of the law, the best-supported movement is of the ‘[Localize(ScriptContainer.MakeScope.Var('nfp50_law_move_no_type').GetFlagName)]’ type."
 NFP72_MOVE_YES:0 "Among supporters of the law, the best-supported movement is of the ‘[Localize(ScriptContainer.MakeScope.Var('nfp50_law_move_yes_type').GetFlagName)]’ type."
 NFP72_NO_GROUPS_1:0 "We have no information on organised groups’ positions on this change. We shall not mistake a silent report for universal agreement: it tells us only where our information ends."
 NFP72_NO_GROUPS_2:0 "We have no information on organised groups’ positions on this change. We shall not mistake a silent report for universal agreement: it tells us only where our information ends."
 NFP72_RELATIVE_1:0 "These positions were recorded before the law completed its passage. They compare the new measure with the old one. Some welcome the replacement; others feel quite the opposite. The signature beneath a decree seldom reveals that distinction."
 NFP72_RELATIVE_2:0 "These positions were recorded before the law completed its passage. They compare the new measure with the old one. Some welcome the replacement; others feel quite the opposite. The signature beneath a decree seldom reveals that distinction."
 NFP72_SECOND:0 "[Localize(ScriptContainer.MakeScope.Var('nfp50_law_ig_2_type').GetFlagName)] — [Localize(ScriptContainer.MakeScope.Var('nfp50_law_ig_2_stance').GetFlagName)]."
 NFP89_DELIVERY:0 "[SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp89_regular'), '(CFixedPoint)1'), 'NFP89_MONTHLY_ON', 'NFP89_MONTHLY_OFF')]\n\n[SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp89_urgent'), '(CFixedPoint)1'), 'NFP89_URGENT_ON', 'NFP89_URGENT_OFF')]"
 NFP89_MONTHLY_OFF:0 "Monthly delivery is currently off. This introductory edition will remain in the archive; regular news will arrive when you choose to receive it again."
 NFP89_MONTHLY_ON:0 "You have chosen monthly delivery. We shall return to developments from one edition to the next: a single troubling report rarely tells the whole story."
 NFP89_TECH_END_COLD:0 "We have commitments to each other, but little warmth at present. That does not diminish the discovery. There is still a useful opportunity to consider, if we can resist turning every report into another argument."
 NFP89_TECH_END_FRIEND:0 "This is news worth sending our congratulations over. It would be pleasant if useful talks followed the courtesies. Goodwill benefits from having something practical to do."
 NFP89_TECH_END_NEUTRAL:0 "The other country now has this knowledge. What it makes of it will depend on the work that follows. We would do better to examine our own capabilities than explain away somebody else’s."
 NFP89_TECH_END_THREAT:0 "Our relations leave little room for carefree congratulations. The country’s new capabilities deserve attention. Declaring every discovery a preparation for war, however, would be an easy substitute for observation."
 NFP89_TECH_OPEN_ALLY:0 "Our ally [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName] has acquired a new technology: [Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]. It is pleasant to receive something from an ally besides another reason to worry. The question now is how it will put the discovery to use."
 NFP89_TECH_OPEN_BLOC:0 "Our power-bloc partner [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName] has acquired a new technology: [Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]. Our shared circle has gained another opportunity. Bloc membership, however, does not by itself bring that knowledge into our own workshops."
 NFP89_TECH_OPEN_NEIGHBOR:0 "Our neighbour [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName] has acquired a new technology: [Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]. Distance matters little to a scientific discovery. For an economy next door, however, new capabilities across the border deserve attention."
 NFP89_TECH_OPEN_OTHER:0 "News of a scientific advance has arrived from [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName]: [Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]. There is one more entry on its list of discoveries. Let us see what opportunities lie behind it."
 NFP89_TECH_OPEN_OVERLORD:0 "Our overlord [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName] has acquired a new technology: [Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]. Our ties have not suddenly turned into a lending library for scientific knowledge. Still, its new capabilities matter to us."
 NFP89_TECH_OPEN_RIVAL:0 "Our rival [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName] has acquired a new technology: [Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]. Dismissing the news would be easy. Our indifference would do little to diminish its new capabilities."
 NFP89_TECH_OPEN_SUBJECT:0 "Our subject [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName] has acquired a new technology: [Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]. Behind the familiar line about dependence, it is easy to overlook the country’s own capabilities. Here is a useful reason to take another look."
 NFP89_URGENT_OFF:0 "Special editions are disabled. If you would like separate editions on wars and major world events, you can enable them in your subscription."
 NFP89_URGENT_ON:0 "Special editions are enabled too. News of a war beginning or ending, or of an important world event, will not wait for the regular monthly edition."
