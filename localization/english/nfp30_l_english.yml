 NFP30_PRICE_SAME:0 "—"
 NFP30_PRICE_TITLE_1:0 "What does an everyday purchase cost today?"
 NFP30_PRICE_TITLE_2:0 "What does an everyday purchase cost today?"
 NFP30_PRICE_UNAVAILABLE:0 "No prices are available for this report. The editors have not filled the table with invented figures."
 NFP30_PRICE_UP:0 "@arrow_up!"
 NFP30_PRODUCTION_AWAY_1_BODY:0 "Good: [Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]. Previous position outside the top three: [ScriptContainer.GetVariableValue('nfp20_before')|0]; latest: [ScriptContainer.GetVariableValue('nfp20_after')|0]. Two monthly observations confirm the country’s place in the top three.\\n\\nThe picture of world production is changing. The ranking measures output; it does not establish profit, exports or prices in our market."
 NFP30_PRODUCTION_AWAY_1_LEAD:0 "A foreign country has entered the top three producers of an important good and held its place for a second month."
 NFP30_PRODUCTION_AWAY_1_TITLE:0 "A new name among the world’s leading producers"
 NFP30_PRODUCTION_AWAY_2_BODY:0 "Good: [Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]. Previous position outside the top three: [ScriptContainer.GetVariableValue('nfp20_before')|0]; latest: [ScriptContainer.GetVariableValue('nfp20_after')|0]. Two monthly observations confirm the country’s place in the top three.\\n\\nProduction volumes and commercial influence are different things. A place in this ranking alone does not establish the latter."
 NFP30_PRODUCTION_AWAY_2_LEAD:0 "Foreign output of an important good has entered the world’s top three."
 NFP30_PRODUCTION_AWAY_2_TITLE:0 "A major producer strengthens its position abroad"
 NFP30_PRODUCTION_HOME_1_BODY:0 "Good: [Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]. Previous position outside the top three: [ScriptContainer.GetVariableValue('nfp20_before')|0]; latest: [ScriptContainer.GetVariableValue('nfp20_after')|0]. Two monthly observations confirm the country’s place in the top three.\\n\\nA substantial result in production. The comparison measures output; profitability, exports and workers’ circumstances require evidence of their own."
 NFP30_PRODUCTION_HOME_1_LEAD:0 "Our country has established itself among the three largest producers of an important good."
 NFP30_PRODUCTION_HOME_1_TITLE:0 "Our production enters the world’s top three"
 NFP30_PRODUCTION_HOME_2_BODY:0 "Good: [Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]. Previous position outside the top three: [ScriptContainer.GetVariableValue('nfp20_before')|0]; latest: [ScriptContainer.GetVariableValue('nfp20_after')|0]. Two monthly observations confirm the country’s place in the top three.\\n\\nA high place in output is a measurable achievement. This ranking does not show what it cost to obtain the result or how much it benefited every family."
 NFP30_PRODUCTION_HOME_2_LEAD:0 "Two months among the top three producers give us reason to mark a national industrial achievement."
 NFP30_PRODUCTION_HOME_2_TITLE:0 "Domestic output among the world leaders"
 NFP30_PRODUCTION_METRICS:0 "Good: [Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]. Previous position outside the top three: [ScriptContainer.GetVariableValue('nfp20_before')|0]; latest: [ScriptContainer.GetVariableValue('nfp20_after')|0]. Two monthly observations confirm the country’s place in the top three."
 NFP30_PUBLICATION_KIND:0 "[SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp_kind'), '(CFixedPoint)3'), 'NFP30_URGENT', SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp_kind'), '(CFixedPoint)1'), 'NFP30_REGULAR', 'NFP30_MANUAL'))]"
 NFP30_RANK_AWAY_1_BODY:0 "Former status: [Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]; new status: [Localize(ScriptContainer.MakeScope.Var('nfp20_extra_detail').GetFlagName)].\\n\\nFor our readers, this is part of a changing world picture. A change of category does not necessarily mean that a new Great Power has appeared."
 NFP30_RANK_AWAY_1_LEAD:0 "A foreign country has acquired a different international status."
 NFP30_RANK_AWAY_1_TITLE:0 "The balance among the powers is changing"
 NFP30_RANK_AWAY_2_BODY:0 "Former status: [Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]; new status: [Localize(ScriptContainer.MakeScope.Var('nfp20_extra_detail').GetFlagName)].\\n\\nWe give both statuses so that readers can judge the direction of the change. Its causes and consequences require separate examination."
 NFP30_RANK_AWAY_2_LEAD:0 "News has arrived of a change in a foreign country’s rank."
 NFP30_RANK_AWAY_2_TITLE:0 "A foreign power changes status"
 NFP30_RANK_HOME_1_BODY:0 "Former status: [Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]; new status: [Localize(ScriptContainer.MakeScope.Var('nfp20_extra_detail').GetFlagName)].\\n\\nThe change deserves attention in its own right. Its direction should be judged from the categories shown; not every change of rank is a rise."
 NFP30_RANK_HOME_1_LEAD:0 "Our country’s international position has been reassessed. We report the former and the new status."
 NFP30_RANK_HOME_1_TITLE:0 "Our place among the powers has changed"
 NFP30_RANK_HOME_2_BODY:0 "Former status: [Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]; new status: [Localize(ScriptContainer.MakeScope.Var('nfp20_extra_detail').GetFlagName)].\\n\\nThe newspaper records a change of position. The name of the new rank alone cannot explain its causes or diplomatic consequences."
 NFP30_RANK_HOME_2_LEAD:0 "Our country now belongs to a different category of powers."
 NFP30_RANK_HOME_2_TITLE:0 "Our country receives a new international status"
 NFP30_RANK_METRICS:0 "Former status: [Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]; new status: [Localize(ScriptContainer.MakeScope.Var('nfp20_extra_detail').GetFlagName)]."
