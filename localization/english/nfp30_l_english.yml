 NFP30_PRICE_FIRST:0 "No comparable figures for the previous month are available for these goods yet. Only the latest observed prices are shown."
 NFP30_PRICE_LEAD_1:0 "This time, let us turn to the market report. There was no major news for the pages, but prices deserve attention in a quiet month too. Especially when you pay for the purchase yourself."
 NFP30_PRICE_LEAD_2:0 "This time, let us turn to the market report. There was no major news for the pages, but prices deserve attention in a quiet month too. Especially when you pay for the purchase yourself."
 NFP30_PRICE_MARKET:0 "Market: [ScriptContainer.MakeScope.Var('nfp32_market_owner').GetCountryDefinition.GetName]."
 NFP30_PRICE_METHOD:0 "Up to six goods with the largest price changes between consecutive monthly observations are shown. The arrow leads from the earlier price to the latest, with the change in brackets. Newly observed goods show only the latest price. These are market prices, not individual states’ local prices or monthly averages."
 NFP30_PRICE_METRICS:0 "Routine report in place of an empty issue. Rows: [ScriptContainer.GetVariableValue('nfp32_rows')|0]; comparisons: [ScriptContainer.GetVariableValue('nfp32_comparisons')|0]. The snapshot is taken once per calendar month; weekly editions in the same month use the same figures. A change of market or a gap in observations interrupts the comparison. Prices are calculated from each good’s base price and the game’s market-price deviation. The table and its order are fixed at publication."
