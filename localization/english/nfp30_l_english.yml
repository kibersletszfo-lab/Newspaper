 NFP52_YUG_1_BODY:0 "A Yugoslav state has appeared in the Balkans. The idea of a common arrangement has acquired political form. For a region so often visited by international calculations, this is an event of particular significance: there is now a new state to include in them.\\n\\nYugoslavia’s formation is confirmed. South Slav unification is now a fact on the political map. Its constituent lands and relations with neighbours need careful consideration; old assumptions about the region cannot simply be copied into the new report.\\n\\nA common name begins the work of living together. Different interests must be reconciled in everyday affairs once the celebrations end. We hope unity proves useful to more than the mapmakers. People must live inside the new borders, not admire them from a distance.\\n\\nThe chronicle is dated to the month when the news reached the editors. If communication was delayed, the event itself may have happened earlier."
