 NFP52_COMMUNE_1_BODY:0 "A Commune has emerged in Paris. France’s political division has acquired a name and an independent expression. The question of power is particularly acute now: this is the capital, the very centre of the established state order.\\n\\nThe proclamation of the Paris Commune is confirmed. Its new name represents a claim to a different order of government. How the confrontation will turn out remains to be seen. For now, the Paris crisis can no longer be treated as another argument that will settle after the next speech.\\n\\nBehind competing political visions, it matters to see the city itself. People need to live and work while the question of who should govern them, and how, is being settled. We shall follow the news from France. We hope the next page of this story brings more clarity and fewer troubles.\\n\\nThe chronicle is dated to the month when the news reached the editors. If communication was delayed, the event itself may have happened earlier."
