 NFP50_FAMILY_BODY:0 "[Localize(ScriptContainer.MakeScope.Var('nfp30_body').GetFlagName)]"
 NFP50_FAMILY_DIVERGENCE_FACTS:0 "Over three monthly intervals, projected annual GDP rose from [ScriptContainer.GetVariableValue('nfp20_before')|0] to [ScriptContainer.GetVariableValue('nfp20_after')|0]. Average Standard of Living fell by [ScriptContainer.GetVariableValue('nfp20_extra')|2] points over the same period."
 NFP50_FAMILY_DIVERGENCE_HOME_END_1:0 "Growth in the economy as a whole does not necessarily mean that families are better off. The circumstances of the population deserve attention at the highest level; why the figures have diverged is a separate question."
 NFP50_FAMILY_DIVERGENCE_HOME_END_2:0 "The country needs achievements that can be felt in everyday life. These figures alone neither explain the deterioration nor tell us whom to blame."
 NFP50_FAMILY_ELECTION_AGAIN:0 "We can now compare the campaign with the previous report. Some parties may have gained momentum, others lost it. The signs beside the figures show that change, not a prediction of the margin at the polls."
 NFP50_FAMILY_ELECTION_BASE:0 "[SelectLocalization(GreaterThan_CFixedPoint(ScriptContainer.GetVariableValue('nfp43_previous_issue'), '(CFixedPoint)0'), 'NFP43_ELECTION_BASELINE', 'NFP43_ELECTION_FIRST')]"
 NFP50_FAMILY_ELECTION_END_1:0 "There is a story worth following before election day, too. We shall see how it develops. We would like to know who will win the voters over; for now, a newspaper column should not cast their ballots for them."
 NFP50_FAMILY_ELECTION_END_2:0 "There is a story worth following before election day, too. We shall see how it develops. We would like to know who will win the voters over; for now, a newspaper column should not cast their ballots for them."
 NFP50_FAMILY_ELECTION_FIRST:0 "This marks the beginning of our comparison of the campaign. The next reports should make it clearer who is gathering momentum and who is losing it. For now, we are getting acquainted with the parties and their positions."
 NFP50_FAMILY_ELECTION_NOTE:0 "This is a campaign in progress, not a count of the votes. The figures compare the momentum of up to six leading parties; they are not percentages of the electorate. Election day still lies ahead, however confident a contender may look today."
 NFP50_FAMILY_ELECTION_TABLE:0 "[Localize(ScriptContainer.MakeScope.Var('nfp43_row_1').GetFlagName)]\n[Localize(ScriptContainer.MakeScope.Var('nfp43_row_2').GetFlagName)]\n[Localize(ScriptContainer.MakeScope.Var('nfp43_row_3').GetFlagName)]\n[Localize(ScriptContainer.MakeScope.Var('nfp43_row_4').GetFlagName)]\n[Localize(ScriptContainer.MakeScope.Var('nfp43_row_5').GetFlagName)]\n[Localize(ScriptContainer.MakeScope.Var('nfp43_row_6').GetFlagName)]"
 NFP50_FAMILY_EXPECTED:0 "At the time of reporting, the average Standard of Living is [ScriptContainer.GetVariableValue('nfp50_family_sol')|2], against an expected level of [ScriptContainer.GetVariableValue('nfp50_family_expected_sol')|2]. The first is below the second: another reason to look closely at how people are faring."
 NFP50_FAMILY_GAINED_ALLIANCE_1_1:0 "Our country has a formal ally: [ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName]. Shared plans now have an agreement behind them. It is pleasant to have someone nearby with whom we can discuss more than our differences. We shall see how well those discussions turn into action."
 NFP50_FAMILY_GAINED_ALLIANCE_1_2:0 "An alliance deserves more than an exchange of courtesies. Its value will emerge in practical decisions and commitments kept. A seal on a treaty is a good beginning. We would like the cooperation to go beyond it."
 NFP50_FAMILY_GAINED_ALLIANCE_2_1:0 "Our country has a formal ally: [ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName]. Shared plans now have an agreement behind them. It is pleasant to have someone nearby with whom we can discuss more than our differences. We shall see how well those discussions turn into action."
 NFP50_FAMILY_GAINED_ALLIANCE_2_2:0 "An alliance deserves more than an exchange of courtesies. Its value will emerge in practical decisions and commitments kept. A seal on a treaty is a good beginning. We would like the cooperation to go beyond it."
 NFP50_FAMILY_GAINED_BLOC_1_1:0 "We and [ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName] now belong to the same power bloc. Our common circle has changed. We shall not guess who persuaded whom to join; the more useful question is what possibilities this new proximity within the association offers."
 NFP50_FAMILY_GAINED_BLOC_1_2:0 "A common banner is no substitute for common work. There is something to negotiate here even without a separate military alliance between us. It would be pleasant if acquaintance were followed by useful, mutually beneficial talks."
 NFP50_FAMILY_GAINED_BLOC_2_1:0 "We and [ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName] now belong to the same power bloc. Our common circle has changed. We shall not guess who persuaded whom to join; the more useful question is what possibilities this new proximity within the association offers."
 NFP50_FAMILY_GAINED_BLOC_2_2:0 "A common banner is no substitute for common work. There is something to negotiate here even without a separate military alliance between us. It would be pleasant if acquaintance were followed by useful, mutually beneficial talks."
 NFP50_FAMILY_GROWTH:0 "Projected annual GDP grew by [ScriptContainer.GetVariableValue('nfp50_family_gdp_growth')|2]% between the observations shown. That concerns the size of the economy, not every family’s income."
 NFP50_FAMILY_INTRO:0 "[Localize(ScriptContainer.MakeScope.Var('nfp30_lead').GetFlagName)]"
 NFP50_FAMILY_LAW_AWAY_END_1:0 "Our readers can follow changes in the lives of other nations. For now, we know the new rule is in force; its consequences remain to be assessed."
 NFP50_FAMILY_LAW_AWAY_END_2:0 "The information does not establish that the reform passed through a parliamentary vote, nor does it promise a particular result. Its effects deserve attention in their own right."
 NFP50_FAMILY_LAW_FACTS:0 "A law has taken effect: [Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]."
 NFP50_FAMILY_LAW_HOME_END_1:0 "We report the change itself. This news does not yet establish how it was adopted or what it will mean for people’s lives."
 NFP50_FAMILY_LAW_HOME_END_2:0 "Assessing the reform will take time and evidence of its effects. A law coming into force is not the same as its promised results already having arrived."
 NFP50_FAMILY_LOST_ALLIANCE_1_1:0 "Our former alliance with [ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName] is no more. A substantial piece of news for plans in which the alliance had a place. The reason for the change still needs examination, but we should no longer count on the old agreement out of habit."
 NFP50_FAMILY_LOST_ALLIANCE_1_2:0 "We must now look more closely at our own capabilities. Declaring the former ally an eternal enemy would be as hasty as continuing to treat its help as assured. Memory is useful in diplomacy. Especially if we remember what has changed too."
 NFP50_FAMILY_LOST_ALLIANCE_2_1:0 "Our former alliance with [ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName] is no more. A substantial piece of news for plans in which the alliance had a place. The reason for the change still needs examination, but we should no longer count on the old agreement out of habit."
 NFP50_FAMILY_LOST_ALLIANCE_2_2:0 "We must now look more closely at our own capabilities. Declaring the former ally an eternal enemy would be as hasty as continuing to treat its help as assured. Memory is useful in diplomacy. Especially if we remember what has changed too."
 NFP50_FAMILY_LOST_BLOC_1_1:0 "We are no longer linked to [ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName] by membership of the same bloc. The former common circle belongs in the former report. Either party’s position, or the association itself, may have changed; the present result is no less important to our plans for that."
 NFP50_FAMILY_LOST_BLOC_1_2:0 "There is less common ground for our calculations. Separate treaties between the countries are another matter and deserve consideration on their own terms. It would be strange to keep using an old picture of relations merely because nobody has hung the new one on the wall yet."
 NFP50_FAMILY_LOST_BLOC_2_1:0 "We are no longer linked to [ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName] by membership of the same bloc. The former common circle belongs in the former report. Either party’s position, or the association itself, may have changed; the present result is no less important to our plans for that."
 NFP50_FAMILY_LOST_BLOC_2_2:0 "There is less common ground for our calculations. Separate treaties between the countries are another matter and deserve consideration on their own terms. It would be strange to keep using an old picture of relations merely because nobody has hung the new one on the wall yet."
 NFP50_FAMILY_PRICE_CORE:0 "[SelectLocalization(GreaterThan_CFixedPoint(ScriptContainer.GetVariableValue('nfp32_rows'), '(CFixedPoint)0'), 'NFP30_PRICE_MARKET', 'NFP30_PRICE_UNAVAILABLE')]\n\n[Localize(ScriptContainer.MakeScope.Var('nfp32_row_1').GetFlagName)]\n[Localize(ScriptContainer.MakeScope.Var('nfp32_row_2').GetFlagName)]\n[Localize(ScriptContainer.MakeScope.Var('nfp32_row_3').GetFlagName)]\n[Localize(ScriptContainer.MakeScope.Var('nfp32_row_4').GetFlagName)]\n[Localize(ScriptContainer.MakeScope.Var('nfp32_row_5').GetFlagName)]\n[Localize(ScriptContainer.MakeScope.Var('nfp32_row_6').GetFlagName)]"
 NFP50_FAMILY_PRICE_END_1:0 "Prices are worth following without waiting for a dramatic difficulty. This table covers individual goods, so it cannot calculate the family’s entire expenditure. But it helps us examine familiar purchases. Sometimes the most revealing news awaits the reader at the counter."
 NFP50_FAMILY_PRICE_END_2:0 "Prices are worth following without waiting for a dramatic difficulty. This table covers individual goods, so it cannot calculate the family’s entire expenditure. But it helps us examine familiar purchases. Sometimes the most revealing news awaits the reader at the counter."
 NFP50_FAMILY_PRICE_NOTE:0 "[SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp32_comparisons'), '(CFixedPoint)0'), 'NFP30_PRICE_FIRST', 'NFP30_PRICE_METHOD')]"
 NFP50_FAMILY_SHORTAGE_FACTS:0 "Good: [Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]. A shortage in our market has been recorded in two consecutive monthly observations."
 NFP50_FAMILY_SHORTAGE_HOME_END_1:0 "The supply and consumption of this good deserve close examination. The report concerns the shortage itself; a high price calls for separate consideration."
 NFP50_FAMILY_SHORTAGE_HOME_END_2:0 "A market shortage is established; its causes are not yet known. These facts do not identify who is responsible or promise a result from any particular construction project."
 NFP50_FAMILY_SHORTAGE_RECOVERY_FACTS:0 "Good: [Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]. Following our warning, two consecutive monthly observations no longer show the earlier market shortage."
 NFP50_FAMILY_SHORTAGE_RECOVERY_HOME_END_1:0 "We note that the earlier shortage is absent. This does not yet promise low prices: expense and scarcity are different questions."
 NFP50_FAMILY_SHORTAGE_RECOVERY_HOME_END_2:0 "The improvement has held for two months. The newspaper will continue to distinguish availability from affordability; the latter is not established by this report."
 NFP50_FAMILY_SOL:0 "Over the same period, average Standard of Living changed from [ScriptContainer.GetVariableValue('nfp50_family_sol_before')|2] to [ScriptContainer.GetVariableValue('nfp50_family_sol')|2]. This is a national average: the circumstances of individual strata and states may differ."
 NFP50_FAMILY_TECH_ANILINE_1:0 "Synthetic plants can now be built. Dyes can be produced industrially. An interesting prospect for textile production: the colour of a future garment owes less and less to the origin of its raw materials."
 NFP50_FAMILY_TECH_ANILINE_2:0 "Producing dyes requires sulphur and fertilisers. New technology changes the supply chain; it does not abolish it. A handsome colour can, it turns out, have some unexpected economic relations."
 NFP50_FAMILY_TECH_ANTIBIOTICS_1:0 "The country can expand its healthcare. Medical knowledge deserves attention first because it concerns a very ordinary hope: getting better. That hope has more to stand on now, though providing care still requires funding."
 NFP50_FAMILY_TECH_ANTIBIOTICS_2:0 "Disease outbreaks will have less effect on harvests. A concrete economic benefit of the new knowledge. Illness can disrupt life far beyond a sickroom; it is pleasant when a remedy helps everyday work as well."
 NFP50_FAMILY_TECH_AWAY_END_1:0 "Its possibilities have widened. That gives us reason to examine our own affairs: what can we already do, and how are we using it? Congratulations can wait for the post. A useful thought for ourselves is worth keeping straight away."
 NFP50_FAMILY_TECH_AWAY_END_2:0 "Its possibilities have widened. That gives us reason to examine our own affairs: what can we already do, and how are we using it? Congratulations can wait for the post. A useful thought for ourselves is worth keeping straight away."
 NFP50_FAMILY_TECH_BESSEMER_PROCESS_1:0 "Steel mills can now use the Bessemer process to obtain more steel. A useful possibility for an economy that needs metal for more than monuments to its own successes."
 NFP50_FAMILY_TECH_BESSEMER_PROCESS_2:0 "The new method needs more iron with the same coal consumption. Progress plainly does not release us from the need for supplies. Before celebrating the steel to come, we must see to what it will be made from."
 NFP50_FAMILY_TECH_ELECTRICAL_GENERATION_1:0 "Power plants can now be built. The economy has a new source of possibilities. For now it is knowledge that must still acquire structures and supplies. But it already gives us a different reason to examine future enterprises."
 NFP50_FAMILY_TECH_ELECTRICAL_GENERATION_2:0 "Towns can switch to electric streetlights. Local electricity is required. The change promises to be visible quite literally: all the more reason to look forward to light in the street following talk of a bright future."
 NFP50_FAMILY_TECH_ELECTRIC_TELEGRAPH_1:0 "Military knowledge has gained the electric telegraph. The country has a new means of bearing the burden of war. The value of the news is not measured merely by how impressive the new term looks in a military report."
 NFP50_FAMILY_TECH_ELECTRIC_TELEGRAPH_2:0 "Casualties will add less to the country’s war exhaustion. This concerns its ability to bear war’s burden; the knowledge does not bring the dead back. We hope this useful military acquisition will not need testing in practice too often."
 NFP50_FAMILY_TECH_FACTS:0 "The country now has access to the technology [Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]."
 NFP50_FAMILY_TECH_HOME_END_1:0 "We know more now; what remains is to make good use of it. Our country has reason both to be proud and to get to work. We would like the next story to concern what this new knowledge has made possible. A list of possibilities is pleasant. Putting them to use is better still."
 NFP50_FAMILY_TECH_HOME_END_2:0 "We know more now; what remains is to make good use of it. Our country has reason both to be proud and to get to work. We would like the next story to concern what this new knowledge has made possible. A list of possibilities is pleasant. Putting them to use is better still."
 NFP50_FAMILY_TECH_KNOWN:0 "We already possess this knowledge. Another country can now use it too. Our advantage in knowing the technology has ended here. We shall see who makes better use of what they know: in economic life that is usually more interesting than a contest of memory."
 NFP50_FAMILY_TECH_QUININE_1:0 "Quinine overcomes the obstacle of ordinary malaria to colonial expansion. Severe malaria remains a separate problem. There are more possibilities on the map, but it would be too naive to suppose that one remedy has removed every local difficulty."
 NFP50_FAMILY_TECH_QUININE_2:0 "Healthcare and colonial administration can be expanded. The extra funds still have to be allocated. The medicine has widened the country’s possibilities; the treasury and administration now have something to consider."
 NFP50_FAMILY_TECH_RAILWAYS_1:0 "Railways can now be built. That will not reduce the distance between towns. But it offers a way to cross it with new transport capabilities. The rails must still be laid: a line drawn on a plan works less well for the economy than a real one."
 NFP50_FAMILY_TECH_RAILWAYS_2:0 "Mines can now use rail transportation. The new production method requires transportation services. Extracting more is useful. It would be good not to discover afterwards that there is still nothing to carry the output away."
 NFP50_FAMILY_TECH_STEAM_DONKEY_1:0 "Supporting work in logging camps and mines can be mechanised. Steam can shoulder part of the labour that previously required working hands. The economy gains another way to cope with its load."
 NFP50_FAMILY_TECH_STEAM_DONKEY_2:0 "Mechanisation requires engines and fewer labourers. Saving labour is an attractive possibility for an enterprise. What the change means for people also depends on whether other work can be found. It is sometimes easier to find a place for a machine than for a person."
 NFP50_FAMILY_TECH_STEELWORKING_1:0 "The country can now build steel mills. The economy gains a foundation for new productive possibilities. Steel on a list of knowledge begins the story; steel that can be used requires enterprises and work."
 NFP50_FAMILY_TECH_STEELWORKING_2:0 "Tooling workshops can use pig iron. A familiar tool acquires a different production story. New methods must still be chosen and supplied with materials. Mere acquaintance with them does not change a workshop."
 NFP50_FAMILY_TECH_UNKNOWN:0 "We do not yet have this knowledge. Another country has therefore gained an advantage in this field. We would like to answer with a result of our own in time. Explaining why someone else’s achievement is not so important requires no research, but is rather less useful."
 NFP50_FAMILY_WAR_ALLIANCE_1_1:0 "Our ally, [ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName], is the defending party in a new war. The initiator is [ScriptContainer.MakeScope.Var('nfp20_extra_detail').GetCountryDefinition.GetName]. The news has direct diplomatic significance for us: it concerns a country bound to us by an alliance."
 NFP50_FAMILY_WAR_ALLIANCE_1_2:0 "Our alliance agreements must now be considered against an actual war. The report itself does not mean that we have already joined it. But leaving such news among distant foreign affairs would be strange. An alliance is not remembered only when it is convenient to congratulate one another."
 NFP50_FAMILY_WAR_ALLIANCE_2_1:0 "Our ally, [ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName], is the defending party in a new war. The initiator is [ScriptContainer.MakeScope.Var('nfp20_extra_detail').GetCountryDefinition.GetName]. The news has direct diplomatic significance for us: it concerns a country bound to us by an alliance."
 NFP50_FAMILY_WAR_ALLIANCE_2_2:0 "Our alliance agreements must now be considered against an actual war. The report itself does not mean that we have already joined it. But leaving such news among distant foreign affairs would be strange. An alliance is not remembered only when it is convenient to congratulate one another."
 NFP50_FAMILY_WAR_BLOC_1_1:0 "War has begun against [ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName], a member of our power bloc. The confrontation’s initiator is [ScriptContainer.MakeScope.Var('nfp20_extra_detail').GetCountryDefinition.GetName]. This concerns the circle in which we make common plans. We have a much stronger reason than passing curiosity to read the report carefully."
 NFP50_FAMILY_WAR_BLOC_1_2:0 "A common bloc does not make every member’s war our own. It does make the conflict important to our calculations. We would like to understand how our partner’s capabilities may change before making further plans as though everything remained peaceful."
 NFP50_FAMILY_WAR_BLOC_2_1:0 "War has begun against [ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName], a member of our power bloc. The confrontation’s initiator is [ScriptContainer.MakeScope.Var('nfp20_extra_detail').GetCountryDefinition.GetName]. This concerns the circle in which we make common plans. We have a much stronger reason than passing curiosity to read the report carefully."
 NFP50_FAMILY_WAR_BLOC_2_2:0 "A common bloc does not make every member’s war our own. It does make the conflict important to our calculations. We would like to understand how our partner’s capabilities may change before making further plans as though everything remained peaceful."
 NFP50_FAMILY_WAR_END_AWAY_END_1:0 "The war is over; examining its results is still ahead. Who gained what they wanted, and what they paid for it, should become clearer from the peace terms. We would do well to look afresh at both parties: relying on their former capabilities out of habit would be too naive."
 NFP50_FAMILY_WAR_END_AWAY_END_2:0 "The war is over; examining its results is still ahead. Who gained what they wanted, and what they paid for it, should become clearer from the peace terms. We would do well to look afresh at both parties: relying on their former capabilities out of habit would be too naive."
 NFP50_FAMILY_WAR_END_CONTEXT:0 "Peace presents countries with new questions. A war can end while its aftermath takes a long time to unravel. We shall mark the good news now and measure the result against the terms of the agreement."
 NFP50_FAMILY_WAR_END_FACTS:0 "The war has ended. Principal parties: [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName] and [ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName]."
 NFP50_FAMILY_WAR_END_HOME_END_1:0 "We can now speak of the war’s end. Congratulations on victory require its terms too, but this news is already enough for hope of a peaceful life. We would like the country’s next great effort to take place where things are created. History offers more than enough occasions to destroy them."
 NFP50_FAMILY_WAR_END_HOME_END_2:0 "We can now speak of the war’s end. Congratulations on victory require its terms too, but this news is already enough for hope of a peaceful life. We would like the country’s next great effort to take place where things are created. History offers more than enough occasions to destroy them."
 NFP50_FAMILY_WAR_START_AWAY_END_1:0 "The consequences of this war will reach beyond the two capitals. Its course will show which of them concern us. For now, following the participants and their decisions is more useful than choosing the winner by the size of a name on the map. Confident predictions come especially easily to those who need not answer for them."
 NFP50_FAMILY_WAR_START_AWAY_END_2:0 "The consequences of this war will reach beyond the two capitals. Its course will show which of them concern us. For now, following the participants and their decisions is more useful than choosing the winner by the size of a name on the map. Confident predictions come especially easily to those who need not answer for them."
 NFP50_FAMILY_WAR_START_CONTEXT:0 "A diplomatic dispute has reached war. Persuasive words alone no longer suffice for the parties. Behind them they will need people, supplies and forces much harder to gather than a polished phrase announcing an intention."
 NFP50_FAMILY_WAR_START_FACTS:0 "The war has begun. Principal parties: [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName] and [ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName]."
 NFP50_FAMILY_WAR_START_HOME_END_1:0 "War is now part of our own affairs. Its beginning can be reported in one line. Everything that follows will not fit into one. We hope to print news of peace soon; meanwhile we shall read the reports of war carefully, without hurrying to turn hope into a victory bulletin."
 NFP50_FAMILY_WAR_START_HOME_END_2:0 "War is now part of our own affairs. Its beginning can be reported in one line. Everything that follows will not fit into one. We hope to print news of peace soon; meanwhile we shall read the reports of war carefully, without hurrying to turn hope into a victory bulletin."
 NFP50_FAMILY_WELCOME_1_1:0 "It is good to be able to buy what you need, reach your workplace and return with earnings enough to live on. Here we shall discuss goods, overloaded transport and states struggling to reach the common market. And we shall make a point of noticing when the troubles end."
 NFP50_FAMILY_WELCOME_1_2:0 "Big numbers do not fill a shopping basket by themselves. Beside economic successes, then, there will be room to ask about living standards. In a quiet month, we shall consult the trade report: prices can keep economics interesting without editorial assistance."
 NFP50_FAMILY_WELCOME_2_1:0 "War concerns more than those who mark it on a map. In this section we shall follow conflicts beginning and ending, alliances and the membership of our bloc. In diplomatic crises, we shall note who made demands, who supported a side and who preferred to step back."
 NFP50_FAMILY_WELCOME_2_2:0 "Important news may arrive in a separate extraordinary edition if you allow that delivery. We would prefer to report successful negotiations more often. But unwelcome news is better read in time than discovered through its consequences."
 NFP50_FAMILY_WELCOME_3_1:0 "Whether people can read, how they live and what happens during elections are questions for this section. Changes in society can be harder to follow than a new border. All the more reason to look at what changes behind familiar state names."
 NFP50_FAMILY_WELCOME_3_2:0 "During elections, we shall compare the course of the parties’ campaigns with earlier reports. Campaign strength is not yet a vote count. Electoral confidence can be infectious; the editors will try to retain the ability to wait for the ballots."
 NFP50_FAMILY_WELCOME_4_1:0 "Here you will find laws, new knowledge and changes in the standing of powers. Pride in our own achievements is pleasant. Noticing those abroad is useful, including when they make us ask why we have not yet done the same."
 NFP50_FAMILY_WELCOME_4_2:0 "You can begin with the cover and move on to an individual article. Previous editions remain in the archive, with room for twelve issues. Sometimes old certainties make particularly interesting reading once we know what happened next."
 NFP50_FAMILY_WELCOME_END_1:0 "Our acquaintance has only just begun. We shall keep returning to events to see what has changed. We hope that, more often, the reason to reread an old troubling report will be a welcome new one.\n\n$NFP89_DELIVERY$"
 NFP50_FAMILY_WELCOME_END_2:0 "Our acquaintance has only just begun. We shall keep returning to events to see what has changed. We hope that, more often, the reason to reread an old troubling report will be a welcome new one.\n\n$NFP89_DELIVERY$"
 NFP50_LAW_APPROVE:0 "support"
 NFP50_LAW_END_1:0 "Now the law must become part of everyday life. Its supporters may already call it a success, its opponents a mistake. We are more interested in what lies between those two explanations once the new rules begin to work. A good law is pleasant to read. Living well under it is better still."
 NFP50_LAW_END_2:0 "Now the law must become part of everyday life. Its supporters may already call it a success, its opponents a mistake. We are more interested in what lies between those two explanations once the new rules begin to work. A good law is pleasant to read. Living well under it is better still."
 NFP50_LAW_FACT_1:0 "The law “[Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]” has come into force in [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName]. [SelectLocalization(GreaterThan_CFixedPoint(ScriptContainer.GetVariableValue('nfp50_law_old_known'), '(CFixedPoint)0'), 'NFP50_LAW_OLD', 'NFP50_LAW_NO_OLD')]"
 NFP50_LAW_FACT_2:0 "The law “[Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]” has taken effect in [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName]. [SelectLocalization(GreaterThan_CFixedPoint(ScriptContainer.GetVariableValue('nfp50_law_old_known'), '(CFixedPoint)0'), 'NFP50_LAW_OLD', 'NFP50_LAW_NO_OLD')]"
 NFP50_LAW_GOV_BASE_1:0 "Let us look at opinion within the government. [Localize(ScriptContainer.MakeScope.Var('nfp50_law_gov_summary').GetFlagName)][SelectLocalization(GreaterThan_CFixedPoint(ScriptContainer.GetVariableValue('nfp50_law_gov_yes_present'), '(CFixedPoint)0'), 'NFP50_LAW_GOV_YES_NAME', 'NFP50_LAW_NO_MOVE')][SelectLocalization(GreaterThan_CFixedPoint(ScriptContainer.GetVariableValue('nfp50_law_gov_no_present'), '(CFixedPoint)0'), 'NFP50_LAW_GOV_NO_NAME', 'NFP50_LAW_NO_MOVE')] These are views on the law itself; this information does not allow a comparison with the previous arrangement."
 NFP50_LAW_GOV_BASE_2:0 "Let us look at opinion within the government. [Localize(ScriptContainer.MakeScope.Var('nfp50_law_gov_summary').GetFlagName)][SelectLocalization(GreaterThan_CFixedPoint(ScriptContainer.GetVariableValue('nfp50_law_gov_yes_present'), '(CFixedPoint)0'), 'NFP50_LAW_GOV_YES_NAME', 'NFP50_LAW_NO_MOVE')][SelectLocalization(GreaterThan_CFixedPoint(ScriptContainer.GetVariableValue('nfp50_law_gov_no_present'), '(CFixedPoint)0'), 'NFP50_LAW_GOV_NO_NAME', 'NFP50_LAW_NO_MOVE')] These are views on the law itself; this information does not allow a comparison with the previous arrangement."
 NFP50_LAW_GOV_NEUTRAL:0 "The groups in government have no clear preference. It happens: the law changes, but the political scales stay level."
 NFP50_LAW_GOV_NO_NAME:0 " The most influential group among its opponents in government is “[Localize(ScriptContainer.MakeScope.Var('nfp50_law_gov_no_type').GetFlagName)]”."
 NFP50_LAW_GOV_OPPOSE:0 "Among government groups with a stated preference, opponents have the greater weight. The law has passed, but affection for it was not included in every copy."
 NFP50_LAW_GOV_RELATIVE_1:0 "Even before the law passed, preferences had emerged within the government. [Localize(ScriptContainer.MakeScope.Var('nfp50_law_gov_summary').GetFlagName)][SelectLocalization(GreaterThan_CFixedPoint(ScriptContainer.GetVariableValue('nfp50_law_gov_yes_present'), '(CFixedPoint)0'), 'NFP50_LAW_GOV_YES_NAME', 'NFP50_LAW_NO_MOVE')][SelectLocalization(GreaterThan_CFixedPoint(ScriptContainer.GetVariableValue('nfp50_law_gov_no_present'), '(CFixedPoint)0'), 'NFP50_LAW_GOV_NO_NAME', 'NFP50_LAW_NO_MOVE')]"
 NFP50_LAW_GOV_RELATIVE_2:0 "Even before the law passed, preferences had emerged within the government. [Localize(ScriptContainer.MakeScope.Var('nfp50_law_gov_summary').GetFlagName)][SelectLocalization(GreaterThan_CFixedPoint(ScriptContainer.GetVariableValue('nfp50_law_gov_yes_present'), '(CFixedPoint)0'), 'NFP50_LAW_GOV_YES_NAME', 'NFP50_LAW_NO_MOVE')][SelectLocalization(GreaterThan_CFixedPoint(ScriptContainer.GetVariableValue('nfp50_law_gov_no_present'), '(CFixedPoint)0'), 'NFP50_LAW_GOV_NO_NAME', 'NFP50_LAW_NO_MOVE')]"
 NFP50_LAW_GOV_SPLIT:0 "The government contains both supporters and opponents. Sharing a cabinet, evidently, does not mean sharing an opinion."
 NFP50_LAW_GOV_SUPPORT:0 "Among government groups with a stated preference, supporters have the greater weight. Useful company for a new law to keep."
 NFP50_LAW_GOV_YES_NAME:0 " The most influential group among its supporters in government is “[Localize(ScriptContainer.MakeScope.Var('nfp50_law_gov_yes_type').GetFlagName)]”."
 NFP50_LAW_IG_BASE_1:0 "The largest interest groups have their own views too. $NFP50_LAW_IG_ROW_1$ [SelectLocalization(GreaterThan_CFixedPoint(ScriptContainer.GetVariableValue('nfp50_law_ig_count'), '(CFixedPoint)1'), 'NFP50_LAW_IG_ROW_2', 'NFP50_LAW_NO_SECOND_IG')] These are the voices of organised groups. A single line cannot speak for every inhabitant."
 NFP50_LAW_IG_BASE_2:0 "The largest interest groups have their own views too. $NFP50_LAW_IG_ROW_1$ [SelectLocalization(GreaterThan_CFixedPoint(ScriptContainer.GetVariableValue('nfp50_law_ig_count'), '(CFixedPoint)1'), 'NFP50_LAW_IG_ROW_2', 'NFP50_LAW_NO_SECOND_IG')] These are the voices of organised groups. A single line cannot speak for every inhabitant."
 NFP50_LAW_IG_OTHER:0 "Another interest group"
 NFP50_LAW_IG_RELATIVE_1:0 "The largest interest groups judged the change differently. $NFP50_LAW_IG_ROW_1$ [SelectLocalization(GreaterThan_CFixedPoint(ScriptContainer.GetVariableValue('nfp50_law_ig_count'), '(CFixedPoint)1'), 'NFP50_LAW_IG_ROW_2', 'NFP50_LAW_NO_SECOND_IG')] These are the voices of organised groups. A single line cannot speak for every inhabitant."
