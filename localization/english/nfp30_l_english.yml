 NFP50_LAW_IG_ROW_1:0 "[Localize(ScriptContainer.MakeScope.Var('nfp50_law_ig_1_type').GetFlagName)]: [Localize(ScriptContainer.MakeScope.Var('nfp50_law_ig_1_stance').GetFlagName)]."
 NFP50_LAW_IG_ROW_2:0 "[Localize(ScriptContainer.MakeScope.Var('nfp50_law_ig_2_type').GetFlagName)]: [Localize(ScriptContainer.MakeScope.Var('nfp50_law_ig_2_stance').GetFlagName)]."
 NFP50_LAW_INTRO_AWAY_1:0 "A law has changed abroad. Other countries’ arrangements are easy to discuss from a safe distance. Sometimes, though, such news makes us examine our own: what do we do differently, and are we happy with the difference?"
 NFP50_LAW_INTRO_AWAY_2:0 "A law has changed abroad. Other countries’ arrangements are easy to discuss from a safe distance. Sometimes, though, such news makes us examine our own: what do we do differently, and are we happy with the difference?"
 NFP50_LAW_INTRO_HOME_1:0 "A law has changed at home. The rules a country lives by rarely suit everyone equally: they open a door for one person and remind another that the key is no longer theirs. Let us see what has changed and who welcomes the new entry in the statute book."
 NFP50_LAW_INTRO_HOME_2:0 "A law has changed at home. The rules a country lives by rarely suit everyone equally: they open a door for one person and remind another that the key is no longer theirs. Let us see what has changed and who welcomes the new entry in the statute book."
 NFP50_LAW_MEANING_LAW_COMPULSORY_PRIMARY_SCHOOL_1:0 "Children are required to learn, and child labour is restricted. The law allows schooling to expand. Behind it lies a simple opportunity: to begin adult life knowing how to read, not merely how to work. Yet between compulsory education on paper and a place at a desk, actual schools and money for them are still needed. Letters do not enter children’s heads through the sternness of a decree."
 NFP50_LAW_MEANING_LAW_COMPULSORY_PRIMARY_SCHOOL_2:0 "Children are required to learn, and child labour is restricted. The law allows schooling to expand. Behind it lies a simple opportunity: to begin adult life knowing how to read, not merely how to work. Yet between compulsory education on paper and a place at a desk, actual schools and money for them are still needed. Letters do not enter children’s heads through the sternness of a decree."
 NFP50_LAW_MEANING_LAW_GUARANTEED_LIBERTIES_1:0 "Domestic security is now constrained by guarantees of liberty. Keeping order must take inhabitants’ rights into account. That is particularly welcome to anyone whose opinions are inconvenient. Much now depends on the work of the home affairs authorities: a fine promise of freedom deserves a worthy life beyond the printed page."
 NFP50_LAW_MEANING_LAW_GUARANTEED_LIBERTIES_2:0 "Domestic security is now constrained by guarantees of liberty. Keeping order must take inhabitants’ rights into account. That is particularly welcome to anyone whose opinions are inconvenient. Much now depends on the work of the home affairs authorities: a fine promise of freedom deserves a worthy life beyond the printed page."
 NFP50_LAW_MEANING_LAW_PROTECTED_SPEECH_1:0 "Free speech now has the protection of law. The state loses its former means of suppressing some political movements and encouraging others. This matters for public debate: the convenience of a ban becomes harder to substitute for a convincing argument. We hope that more room for words will also make room for thought."
 NFP50_LAW_MEANING_LAW_PROTECTED_SPEECH_2:0 "Free speech now has the protection of law. The state loses its former means of suppressing some political movements and encouraging others. This matters for public debate: the convenience of a ban becomes harder to substitute for a convincing argument. We hope that more room for words will also make room for thought."
 NFP50_LAW_MEANING_LAW_SLAVERY_BANNED_1:0 "Slavery is no longer legal. A person ceases to be someone else’s property—a change hardly described as a mere correction to the paperwork. Freedom alone does not provide a wage or equal standing in society. But at least it is no longer lawful to dispose of a human being as one would the furniture at home."
 NFP50_LAW_MEANING_LAW_SLAVERY_BANNED_2:0 "Slavery is no longer legal. A person ceases to be someone else’s property—a change hardly described as a mere correction to the paperwork. Freedom alone does not provide a wage or equal standing in society. But at least it is no longer lawful to dispose of a human being as one would the furniture at home."
 NFP50_LAW_MEANING_LAW_WOMENS_SUFFRAGE_1:0 "Women have gained more rights to take part in political life. It is now harder to discuss the country’s future as though its population consisted entirely of men. How the new right operates also depends on the electoral system. But there is already reason to reconsider familiar assumptions about who may decide our common affairs."
 NFP50_LAW_MEANING_LAW_WOMENS_SUFFRAGE_2:0 "Women have gained more rights to take part in political life. It is now harder to discuss the country’s future as though its population consisted entirely of men. How the new right operates also depends on the electoral system. But there is already reason to reconsider familiar assumptions about who may decide our common affairs."
 NFP50_LAW_MOVEMENT_BASE_1:0 "Political movements also have their preferences. [SelectLocalization(GreaterThan_CFixedPoint(ScriptContainer.GetVariableValue('nfp50_law_move_yes_present'), '(CFixedPoint)0'), 'NFP50_LAW_MOVE_YES', 'NFP50_LAW_NO_MOVE')] [SelectLocalization(GreaterThan_CFixedPoint(ScriptContainer.GetVariableValue('nfp50_law_move_no_present'), '(CFixedPoint)0'), 'NFP50_LAW_MOVE_NO', 'NFP50_LAW_NO_MOVE')] These positions show who welcomes the law and who finds it hard to swallow. Who actually secured its passage is a separate question."
 NFP50_LAW_MOVEMENT_BASE_2:0 "Political movements also have their preferences. [SelectLocalization(GreaterThan_CFixedPoint(ScriptContainer.GetVariableValue('nfp50_law_move_yes_present'), '(CFixedPoint)0'), 'NFP50_LAW_MOVE_YES', 'NFP50_LAW_NO_MOVE')] [SelectLocalization(GreaterThan_CFixedPoint(ScriptContainer.GetVariableValue('nfp50_law_move_no_present'), '(CFixedPoint)0'), 'NFP50_LAW_MOVE_NO', 'NFP50_LAW_NO_MOVE')] These positions show who welcomes the law and who finds it hard to swallow. Who actually secured its passage is a separate question."
 NFP50_LAW_MOVEMENT_RELATIVE_1:0 "Political movements also have their preferences. [SelectLocalization(GreaterThan_CFixedPoint(ScriptContainer.GetVariableValue('nfp50_law_move_yes_present'), '(CFixedPoint)0'), 'NFP50_LAW_MOVE_YES', 'NFP50_LAW_NO_MOVE')] [SelectLocalization(GreaterThan_CFixedPoint(ScriptContainer.GetVariableValue('nfp50_law_move_no_present'), '(CFixedPoint)0'), 'NFP50_LAW_MOVE_NO', 'NFP50_LAW_NO_MOVE')] These positions show who welcomes the law and who finds it hard to swallow. Who actually secured its passage is a separate question."
 NFP50_LAW_MOVEMENT_RELATIVE_2:0 "Political movements also have their preferences. [SelectLocalization(GreaterThan_CFixedPoint(ScriptContainer.GetVariableValue('nfp50_law_move_yes_present'), '(CFixedPoint)0'), 'NFP50_LAW_MOVE_YES', 'NFP50_LAW_NO_MOVE')] [SelectLocalization(GreaterThan_CFixedPoint(ScriptContainer.GetVariableValue('nfp50_law_move_no_present'), '(CFixedPoint)0'), 'NFP50_LAW_MOVE_NO', 'NFP50_LAW_NO_MOVE')] These positions show who welcomes the law and who finds it hard to swallow. Who actually secured its passage is a separate question."
 NFP50_LAW_MOVE_NO:0 "Among its opponents is the “[Localize(ScriptContainer.MakeScope.Var('nfp50_law_move_no_type').GetFlagName)]” movement."
 NFP50_LAW_MOVE_OTHER:0 "Another political movement"
 NFP50_LAW_MOVE_YES:0 "Among its supporters is the “[Localize(ScriptContainer.MakeScope.Var('nfp50_law_move_yes_type').GetFlagName)]” movement."
