 NFP52_METRICS:0 "World event. Received: [Localize(ScriptContainer.MakeScope.Var('nfp30_month').GetFlagName)], [ScriptContainer.GetVariableValue('nfp20_year')|0]. One-time report after observation began."
 NFP52_PANAMA_1_BODY:0 "The Panama Canal is finished. A new passage joins the Atlantic and Pacific oceans. On paper, the land between them looks rather narrow. One imagines the builders needed more than that comforting observation. A completed structure now stands behind the line on the map.\\n\\nConstruction of the canal is complete. Ocean routes have a new possibility, and old ideas of the journey between the two oceans need revisiting. The scale of the change is clear without a celebratory inventory of every future benefit: there is a passage where none existed before.\\n\\nEconomic calculations will now follow the engineering achievement. The new route must still be used, its advantages turned to practical purposes. Yet the reason for congratulations is already quite tangible. Sometimes bringing different sides of the world closer can be done literally.\\n\\nThe chronicle is dated to the month when the news reached the editors. If communication was delayed, the event itself may have happened earlier."
 NFP52_PANAMA_1_CONTEXT:0 "Economic calculations will now follow the engineering achievement. The new route must still be used, its advantages turned to practical purposes. Yet the reason for congratulations is already quite tangible. Sometimes bringing different sides of the world closer can be done literally."
