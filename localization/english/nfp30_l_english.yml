 NFP30_SHORTAGE_HOME_1_BODY:0 "Good: [Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]. A shortage in our market has been recorded in two consecutive monthly observations.\\n\\nThe supply and consumption of this good deserve a close look. This report concerns the shortage itself; a high price is a separate matter."
 NFP30_SHORTAGE_HOME_1_LEAD:0 "The shortage in our market is no longer an isolated report. We bring it onto today’s economic pages."
 NFP30_SHORTAGE_HOME_1_TITLE:0 "The market is short of a needed good"
 NFP30_SHORTAGE_HOME_2_BODY:0 "Good: [Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]. A shortage in our market has been recorded in two consecutive monthly observations.\\n\\nA market shortage is confirmed; its causes have not yet been established. These facts do not identify who is responsible or promise a result from any particular building."
 NFP30_SHORTAGE_HOME_2_LEAD:0 "For two months running, our market has reported a shortage of an important good. Success elsewhere does not settle the question."
 NFP30_SHORTAGE_HOME_2_TITLE:0 "The shortage deserves attention"
 NFP30_SHORTAGE_METRICS:0 "Good: [Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]. A shortage in our market has been recorded in two consecutive monthly observations."
 NFP30_SHORTAGE_RECOVERY_HOME_1_BODY:0 "Good: [Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]. Following our warning, two consecutive monthly observations no longer show the earlier market shortage.\\n\\nWe note that the earlier shortage is absent. This is not yet a promise of low prices: expense and scarcity are different questions."
 NFP30_SHORTAGE_RECOVERY_HOME_1_LEAD:0 "There is good news about a good whose shortage we have already reported."
 NFP30_SHORTAGE_RECOVERY_HOME_1_TITLE:0 "The earlier shortage has eased"
 NFP30_SHORTAGE_RECOVERY_HOME_2_BODY:0 "Good: [Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]. Following our warning, two consecutive monthly observations no longer show the earlier market shortage.\\n\\nThe improvement has held for two months. The newspaper will continue to distinguish a good’s availability from its affordability; the latter is not established by this report."
 NFP30_SHORTAGE_RECOVERY_HOME_2_LEAD:0 "Our market observations bring the news we hoped for after the earlier warning: the shortage is no longer recorded."
 NFP30_SHORTAGE_RECOVERY_HOME_2_TITLE:0 "A welcome turn in the shortage story"
 NFP30_SHORTAGE_RECOVERY_METRICS:0 "Good: [Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]. Following our warning, two consecutive monthly observations no longer show the earlier market shortage."
 NFP30_TECH_AWAY_1_BODY:0 "The country now has access to the technology [Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)].\n\nIts possibilities have widened. That gives us reason to examine our own affairs: what can we already do, and how are we using it? Congratulations can wait for the post. A useful thought for ourselves is worth keeping straight away."
 NFP30_TECH_AWAY_1_LEAD:0 "A new technology has been acquired abroad. While we read the familiar reports, another country gained new possibilities. Let us look at what they are."
 NFP30_TECH_AWAY_1_TITLE:0 "They can do more abroad"
 NFP30_TECH_AWAY_2_BODY:0 "The country now has access to the technology [Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)].\n\nIts possibilities have widened. That gives us reason to examine our own affairs: what can we already do, and how are we using it? Congratulations can wait for the post. A useful thought for ourselves is worth keeping straight away."
 NFP30_TECH_AWAY_2_LEAD:0 "A new technology has been acquired abroad. While we read the familiar reports, another country gained new possibilities. Let us look at what they are."
 NFP30_TECH_AWAY_2_TITLE:0 "They can do more abroad"
 NFP30_TECH_HOME_1_BODY:0 "The country now has access to the technology [Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)].\n\nWe know more now; what remains is to make good use of it. Our country has reason both to be proud and to get to work. We would like the next story to concern what this new knowledge has made possible. A list of possibilities is pleasant. Putting them to use is better still."
 NFP30_TECH_HOME_1_LEAD:0 "Our country has acquired a new technology. Good news for those who would like to move the economy forward with more than promises."
 NFP30_TECH_HOME_1_TITLE:0 "More knowledge. Now to work"
 NFP30_TECH_HOME_2_BODY:0 "The country now has access to the technology [Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)].\n\nWe know more now; what remains is to make good use of it. Our country has reason both to be proud and to get to work. We would like the next story to concern what this new knowledge has made possible. A list of possibilities is pleasant. Putting them to use is better still."
 NFP30_TECH_HOME_2_LEAD:0 "Our country has acquired a new technology. Good news for those who would like to move the economy forward with more than promises."
 NFP30_TECH_HOME_2_TITLE:0 "More knowledge. Now to work"
 NFP30_TECH_METRICS:0 "The country has acquired technological knowledge: [Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]."
 NFP30_TITLE:0 "The National Herald — 0.5.0"
 NFP30_UNKNOWN_LEAD:0 "An article drawn from previously gathered information."
 NFP30_UNKNOWN_METRICS:0 "Saved values: [ScriptContainer.GetVariableValue('nfp20_before')|3] → [ScriptContainer.GetVariableValue('nfp20_after')|3]."
 NFP30_UNKNOWN_TITLE:0 "From the editors"
 NFP30_URGENT:0 "URGENT EDITION"
 NFP30_WAR_END_AWAY_1_BODY:0 "The war has ended. Principal parties: [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName] and [ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName].\\n\\nThis is an important turn in world affairs for our readers. The present report does not establish who achieved their aims, or at what cost."
 NFP30_WAR_END_AWAY_1_LEAD:0 "News has arrived that the war between the principal parties named here has ended."
 NFP30_WAR_END_AWAY_1_TITLE:0 "A foreign war comes to an end"
 NFP30_WAR_END_AWAY_2_BODY:0 "The war has ended. Principal parties: [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName] and [ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName].\\n\\nThe newspaper records the end of the war and leaves judgement of its results until information on losses and peace terms is available."
 NFP30_WAR_END_AWAY_2_LEAD:0 "The military confrontation between the principal parties has ended."
 NFP30_WAR_END_AWAY_2_TITLE:0 "News from abroad: a war has ended"
 NFP30_WAR_END_HOME_1_BODY:0 "The war has ended. Principal parties: [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName] and [ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName].\\n\\nWe report the end of the war. That news alone does not identify the victor, the losses or the terms of peace."
 NFP30_WAR_END_HOME_1_LEAD:0 "The war involving our country as a principal party has come to an end."
 NFP30_WAR_END_HOME_1_TITLE:0 "Our country’s war has ended"
 NFP30_WAR_END_HOME_2_BODY:0 "The war has ended. Principal parties: [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName] and [ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName].\\n\\nAssessing the result requires information about the agreements and the parties’ positions. The cessation of war alone is no basis for declaring victory."
 NFP30_WAR_END_HOME_2_LEAD:0 "The war involving our country is over. We mark an important change in the national news."
 NFP30_WAR_END_HOME_2_TITLE:0 "News arrives of the end of the war"
 NFP30_WAR_END_METRICS:0 "The war has ended. Principal parties: [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName] and [ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName]."
 NFP30_WAR_START_AWAY_1_BODY:0 "The war has begun. Principal parties: [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName] and [ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName].\\n\\nThe other participants, course of the fighting and consequences for our country require further information. The outcome is not yet known."
 NFP30_WAR_START_AWAY_1_LEAD:0 "A significant war has begun abroad. We report its two principal parties."
 NFP30_WAR_START_AWAY_1_TITLE:0 "A new war breaks out"
 NFP30_WAR_START_AWAY_2_BODY:0 "The war has begun. Principal parties: [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName] and [ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName].\\n\\nWe record the beginning of the war without appointing the victor in advance. This article does not establish the full list of participants."
 NFP30_WAR_START_AWAY_2_LEAD:0 "News has arrived of a military confrontation between the powers named here."
 NFP30_WAR_START_AWAY_2_TITLE:0 "A new war changes the world’s news"
 NFP30_WAR_START_HOME_1_BODY:0 "The war has begun. Principal parties: [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName] and [ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName].\\n\\nWe shall follow developments. For now, we report the principal parties; this news does not contain information on every participant or the eventual outcome."
 NFP30_WAR_START_HOME_1_LEAD:0 "Military news takes the place of peacetime affairs: our country is a principal party to a new war."
 NFP30_WAR_START_HOME_1_TITLE:0 "Our country has entered a war"
 NFP30_WAR_START_HOME_2_BODY:0 "The war has begun. Principal parties: [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName] and [ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName].\\n\\nThe event deserves every reader’s attention. The newspaper will not prejudge the outcome or replace reliable information with promises of victory."
 NFP30_WAR_START_HOME_2_LEAD:0 "News has arrived of a war in which our country is a principal party."
 NFP30_WAR_START_HOME_2_TITLE:0 "A war involving our country has begun"
 NFP30_WAR_START_METRICS:0 "The war has begun. Principal parties: [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName] and [ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName]."
