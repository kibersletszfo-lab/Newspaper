 NFP52_JAP_1_BODY:0 "Imperial rule has been restored in Japan. Talk of returning to an old order opens a new page here. The former balance between the imperial court and the shogunate has changed. A country distant to many readers gives us reason to examine where it intends to go.\\n\\nThe imperial restoration has taken place. The country’s political centre has a different position, raising the question of how Japanese life will now be organised. The ceremonial proclamation has happened. Everyday consequences will depend on the decisions that follow.\\n\\nRestoring authority does not make every future change an accomplished fact. Japan must show how it will use the new order. We would like to judge this story by deeds. Ceremonial titles, as we know, are seldom short of promises.\\n\\nThe chronicle is dated to the month when the news reached the editors. If communication was delayed, the event itself may have happened earlier."
