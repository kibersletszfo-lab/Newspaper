 NFP51_DETAIL:0 "diplomatic crisis"
 NFP51_END_1_CORE:0 "In the confrontation between initiator [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName] and target [ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName], [ScriptContainer.MakeScope.Var('nfp51_actor').GetCountryDefinition.GetName] backed down. The dispute concerned [Localize(ScriptContainer.MakeScope.Var('nfp51_play_label').GetFlagName)]."
 NFP51_END_1_END:0 "This crisis ended without war. One side’s retreat has not erased every disagreement between the countries. But a dispute settled before the fighting deserves a line of its own. A less spectacular ending for the newspaper. For those who must live through it, perhaps a much happier one."
 NFP51_END_1_LEAD:0 "[ScriptContainer.MakeScope.Var('nfp51_actor').GetCountryDefinition.GetName] has backed down in the diplomatic confrontation."
 NFP51_END_1_TITLE:0 "They stepped back before the guns spoke"
 NFP51_END_2_CORE:0 "The confrontation between [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName] and [ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName] ended without the crisis becoming a war: [ScriptContainer.MakeScope.Var('nfp51_actor').GetCountryDefinition.GetName] backed down. The dispute concerned [Localize(ScriptContainer.MakeScope.Var('nfp51_play_label').GetFlagName)]."
 NFP51_END_2_END:0 "This crisis ended without war. One side’s retreat has not erased every disagreement between the countries. But a dispute settled before the fighting deserves a line of its own. A less spectacular ending for the newspaper. For those who must live through it, perhaps a much happier one."
 NFP51_END_2_LEAD:0 "[ScriptContainer.MakeScope.Var('nfp51_actor').GetCountryDefinition.GetName] backed down before the Diplomatic Play became a war."
 NFP51_END_2_TITLE:0 "They stepped back before the guns spoke"
 NFP51_JOIN_1_CORE:0 "During the reported month, [ScriptContainer.MakeScope.Var('nfp51_actor').GetCountryDefinition.GetName] joined the side of [ScriptContainer.MakeScope.Var('nfp51_side').GetCountryDefinition.GetName] in the diplomatic confrontation between [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName] and [ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName]. The dispute concerns [Localize(ScriptContainer.MakeScope.Var('nfp51_play_label').GetFlagName)]."
 NFP51_JOIN_1_END:0 "New support changes both sides’ calculations. Making demands alone is one thing; knowing who will stand beside you is another. For now, this remains a diplomatic confrontation. We shall see whether a larger gathering helps reach an agreement, or simply brings more people determined to have their way."
 NFP51_JOIN_1_LEAD:0 "[ScriptContainer.MakeScope.Var('nfp51_actor').GetCountryDefinition.GetName] has supported the side of [ScriptContainer.MakeScope.Var('nfp51_side').GetCountryDefinition.GetName]."
 NFP51_JOIN_1_TITLE:0 "The table of dispute grows crowded"
 NFP51_JOIN_2_CORE:0 "The diplomatic confrontation has a new participant: [ScriptContainer.MakeScope.Var('nfp51_actor').GetCountryDefinition.GetName]. It supports [ScriptContainer.MakeScope.Var('nfp51_side').GetCountryDefinition.GetName]; the principal parties are [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName] and [ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName]. The dispute concerns [Localize(ScriptContainer.MakeScope.Var('nfp51_play_label').GetFlagName)]."
 NFP51_JOIN_2_END:0 "New support changes both sides’ calculations. Making demands alone is one thing; knowing who will stand beside you is another. For now, this remains a diplomatic confrontation. We shall see whether a larger gathering helps reach an agreement, or simply brings more people determined to have their way."
 NFP51_JOIN_2_LEAD:0 "[ScriptContainer.MakeScope.Var('nfp51_actor').GetCountryDefinition.GetName] has joined the side of [ScriptContainer.MakeScope.Var('nfp51_side').GetCountryDefinition.GetName]."
