 NFP30_DIVERGENCE_HOME_1_BODY:0 "Over three monthly intervals, projected annual GDP rose from [ScriptContainer.GetVariableValue('nfp20_before')|0] to [ScriptContainer.GetVariableValue('nfp20_after')|0]. Average Standard of Living fell by [ScriptContainer.GetVariableValue('nfp20_extra')|2] points over the same period.\n\nA larger economy does not yet mean comfortable households. We consider the population’s circumstances a matter of national importance; the reasons for this divergence deserve their own investigation."
 NFP30_DIVERGENCE_HOME_1_LEAD:0 "Economic growth gives our country reason for pride, but falling living standards deserve equally close attention."
 NFP30_DIVERGENCE_HOME_1_TITLE:0 "The economy grows. Life gets harder"
 NFP30_DIVERGENCE_HOME_2_BODY:0 "Over three monthly intervals, projected annual GDP rose from [ScriptContainer.GetVariableValue('nfp20_before')|0] to [ScriptContainer.GetVariableValue('nfp20_after')|0]. Average Standard of Living fell by [ScriptContainer.GetVariableValue('nfp20_extra')|2] points over the same period.\n\nThe country needs achievements felt in daily life as well. These figures alone neither explain the deterioration nor identify anyone responsible."
 NFP30_DIVERGENCE_HOME_2_LEAD:0 "Our economy has grown while average Standard of Living has fallen. Both sides of this picture belong on the front page."
 NFP30_DIVERGENCE_HOME_2_TITLE:0 "Troubling figures behind economic success"
 NFP30_DIVERGENCE_METRICS:0 "Over three monthly intervals, projected annual GDP rose from [ScriptContainer.GetVariableValue('nfp20_before')|0] to [ScriptContainer.GetVariableValue('nfp20_after')|0]. Average Standard of Living fell by [ScriptContainer.GetVariableValue('nfp20_extra')|2] points over the same period."
 NFP30_EMPTY:0 "There are no new articles for the selected sections today. A future issue will bring fresh news when it arrives."
 NFP30_GDP_LEADER_AWAY_1_BODY:0 "Previous position outside the top ten: [ScriptContainer.GetVariableValue('nfp20_before')|0]; latest rank: [ScriptContainer.GetVariableValue('nfp20_after')|0]. The country has remained in the top ten for two months running.\n\nThis is a notable change in the world economy for our readers. It proves neither comfortable living standards nor the profitability of individual industries."
 NFP30_GDP_LEADER_AWAY_1_LEAD:0 "The ranks of the largest economies have changed: a foreign country has established itself in the GDP top ten."
 NFP30_GDP_LEADER_AWAY_1_TITLE:0 "A new arrival in the world’s economic top ten"
 NFP30_GDP_LEADER_AWAY_2_BODY:0 "Previous position outside the top ten: [ScriptContainer.GetVariableValue('nfp20_before')|0]; latest rank: [ScriptContainer.GetVariableValue('nfp20_after')|0]. The country has remained in the top ten for two months running.\n\nThe ranking measures projected annual GDP. These figures alone say nothing about the trade consequences for our country."
 NFP30_GDP_LEADER_AWAY_2_LEAD:0 "A new arrival in the top ten has held its position for a second month running."
 NFP30_GDP_LEADER_AWAY_2_TITLE:0 "A foreign economy holds its place among the largest"
 NFP30_GDP_LEADER_HOME_1_BODY:0 "Previous position outside the top ten: [ScriptContainer.GetVariableValue('nfp20_before')|0]; latest rank: [ScriptContainer.GetVariableValue('nfp20_after')|0]. The country has remained in the top ten for two months running.\n\nThe achievement deserves recognition. A place by overall economic size does not, however, measure living standards or business profits."
 NFP30_GDP_LEADER_HOME_1_LEAD:0 "Our country has established itself among the ten largest economies by projected annual GDP."
 NFP30_GDP_LEADER_HOME_1_TITLE:0 "Our economy joins the world’s top ten"
 NFP30_GDP_LEADER_HOME_2_BODY:0 "Previous position outside the top ten: [ScriptContainer.GetVariableValue('nfp20_before')|0]; latest rank: [ScriptContainer.GetVariableValue('nfp20_after')|0]. The country has remained in the top ten for two months running.\n\nWe welcome the result while keeping an eye on the population’s prosperity: economic size is no substitute for assessing it."
 NFP30_GDP_LEADER_HOME_2_LEAD:0 "Two months in the GDP top ten give grounds to call this a sustained economic achievement."
 NFP30_GDP_LEADER_HOME_2_TITLE:0 "Our country takes its place among the largest"
 NFP30_GDP_LEADER_METRICS:0 "Previous position outside the top ten: [ScriptContainer.GetVariableValue('nfp20_before')|0]; latest rank: [ScriptContainer.GetVariableValue('nfp20_after')|0]. The country has remained in the top ten for two months running."
 NFP30_HOME:0 "domestic event"
 NFP30_INFRA_HOME_1_BODY:0 "Region: [SelectLocalization(And(ScriptContainer.MakeScope.Var('nfp20_problem_state').IsSet, ScriptContainer.MakeScope.Var('nfp20_problem_state').GetState.IsValid), 'NFP40_STATE_LINK', 'NFP40_REGION_FALLBACK')]. The infrastructure balance has remained negative for two months; latest value: [ScriptContainer.GetVariableValue('nfp20_after')|2].\n\nThe infrastructure shortage warrants a closer look at local needs. We do not attribute every difficulty in the state to it or declare one particular building the only answer."
 NFP30_INFRA_HOME_1_LEAD:0 "Insufficient infrastructure in one of our states has become a persistent problem. It is growing harder to put off giving it attention."
 NFP30_INFRA_HOME_1_TITLE:0 "The state needs a connection worthy of the country"
 NFP30_INFRA_HOME_2_BODY:0 "Region: [SelectLocalization(And(ScriptContainer.MakeScope.Var('nfp20_problem_state').IsSet, ScriptContainer.MakeScope.Var('nfp20_problem_state').GetState.IsValid), 'NFP40_STATE_LINK', 'NFP40_REGION_FALLBACK')]. The infrastructure balance has remained negative for two months; latest value: [ScriptContainer.GetVariableValue('nfp20_after')|2].\n\nWe draw attention to a recurring shortfall. Choosing a remedy requires studying the state itself; one figure is not enough for a ready-made building prescription."
 NFP30_INFRA_HOME_2_LEAD:0 "In one of our states, infrastructure needs once again exceed available capacity."
 NFP30_INFRA_HOME_2_TITLE:0 "Infrastructure cannot keep waiting"
 NFP30_INFRA_METRICS:0 "Region: [SelectLocalization(And(ScriptContainer.MakeScope.Var('nfp20_problem_state').IsSet, ScriptContainer.MakeScope.Var('nfp20_problem_state').GetState.IsValid), 'NFP40_STATE_LINK', 'NFP40_REGION_FALLBACK')]. The infrastructure balance has remained negative for two months; latest value: [ScriptContainer.GetVariableValue('nfp20_after')|2]."
 NFP30_INFRA_RECOVERY_HOME_1_BODY:0 "Region: [SelectLocalization(And(ScriptContainer.MakeScope.Var('nfp20_problem_state').IsSet, ScriptContainer.MakeScope.Var('nfp20_problem_state').GetState.IsValid), 'NFP40_STATE_LINK', 'NFP40_REGION_FALLBACK')]. At the previous warning, the infrastructure balance was [ScriptContainer.GetVariableValue('nfp20_before')|2]; now it is [ScriptContainer.GetVariableValue('nfp20_after')|2]. The two latest monthly observations show a non-negative balance.\n\nThis achievement deserves a place in the newspaper. Two favourable observations do not, however, promise that the shortage will never return."
 NFP30_INFRA_RECOVERY_HOME_1_LEAD:0 "We return to the infrastructure problem previously reported: the latest information allows us to announce an improvement."
 NFP30_INFRA_RECOVERY_HOME_1_TITLE:0 "Good news from a once-troubled state"
 NFP30_INFRA_RECOVERY_HOME_2_BODY:0 "Region: [SelectLocalization(And(ScriptContainer.MakeScope.Var('nfp20_problem_state').IsSet, ScriptContainer.MakeScope.Var('nfp20_problem_state').GetState.IsValid), 'NFP40_STATE_LINK', 'NFP40_REGION_FALLBACK')]. At the previous warning, the infrastructure balance was [ScriptContainer.GetVariableValue('nfp20_before')|2]; now it is [ScriptContainer.GetVariableValue('nfp20_after')|2]. The two latest monthly observations show a non-negative balance.\n\nTwo consecutive observations confirm the improvement. The available information does not establish which measures brought it about."
 NFP30_INFRA_RECOVERY_HOME_2_LEAD:0 "Our state’s infrastructure balance has recovered. We note a change in a story our readers have already been following."
 NFP30_INFRA_RECOVERY_HOME_2_TITLE:0 "An earlier warning gives way to good news"
 NFP30_INFRA_RECOVERY_METRICS:0 "Region: [SelectLocalization(And(ScriptContainer.MakeScope.Var('nfp20_problem_state').IsSet, ScriptContainer.MakeScope.Var('nfp20_problem_state').GetState.IsValid), 'NFP40_STATE_LINK', 'NFP40_REGION_FALLBACK')]. At the previous warning, the infrastructure balance was [ScriptContainer.GetVariableValue('nfp20_before')|2]; now it is [ScriptContainer.GetVariableValue('nfp20_after')|2]. The two latest monthly observations show a non-negative balance."
 NFP30_ISSUE_DETAILS:0 "Issue details\nArticles: [ScriptContainer.GetVariableValue('nfp20_article_count')|0].\nHistory: [ScriptContainer.GetVariableValue('nfp20_history_count')|0] observations, [ScriptContainer.GetVariableValue('nfp20_summary_intervals')|0] comparison intervals.\nProjected annual GDP: [ScriptContainer.GetVariableValue('nfp20_summary_before')|0] → [ScriptContainer.GetVariableValue('nfp20_summary_after')|0].\n\n$NFP20_DIAGNOSTICS$\n[SelectLocalization(ScriptContainer.HasVariable('nfp31_rejected_region'), 'NFP30_REACH_REJECTED', 'NFP30_REACH_OLD')]"
 NFP30_ISSUE_HEADER:0 "[ScriptContainer.MakeScope.Var('nfp30_reader_definition').GetCountryDefinition.GetName] · No. [ScriptContainer.GetVariableValue('nfp_number')|0] · [Localize(ScriptContainer.MakeScope.Var('nfp30_month').GetFlagName)], [ScriptContainer.GetVariableValue('nfp_year')|0]"
 NFP30_LAW_AWAY_1_BODY:0 "A law has taken effect: [Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)].\n\nOur readers can follow changes in the lives of other nations. For now, we know the new rule is in force; its consequences remain to be assessed."
 NFP30_LAW_AWAY_1_LEAD:0 "A significant reform has taken effect in a foreign country."
 NFP30_LAW_AWAY_1_TITLE:0 "A new legal chapter opens abroad"
 NFP30_LAW_AWAY_2_BODY:0 "A law has taken effect: [Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)].\n\nThe information does not establish that the reform passed through a parliamentary vote, nor does it promise a particular result. Its effects deserve attention in their own right."
 NFP30_LAW_AWAY_2_LEAD:0 "News from abroad reports a new law coming into force."
 NFP30_LAW_AWAY_2_TITLE:0 "A foreign country introduces a significant law"
 NFP30_LAW_HOME_1_BODY:0 "A law has taken effect: [Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)].\n\nWe report the change itself. This news does not yet establish how it was adopted or what it will mean for people’s lives."
 NFP30_LAW_HOME_1_LEAD:0 "A significant law has taken effect in our country."
 NFP30_LAW_HOME_1_TITLE:0 "A new law, a new chapter in our lives"
 NFP30_LAW_HOME_2_BODY:0 "A law has taken effect: [Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)].\n\nAssessing the reform will take time and evidence of its effects. A law coming into force is not the same as its promised results already having arrived."
 NFP30_LAW_HOME_2_LEAD:0 "Our country’s laws have changed. The new rule deserves our readers’ attention."
 NFP30_LAW_HOME_2_TITLE:0 "A significant reform takes effect at home"
 NFP30_LAW_METRICS:0 "A law has taken effect: [Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]."
 NFP30_LEAD_STORY:0 "Leading story"
 NFP30_LITERACY_AWAY_1_BODY:0 "The literate share rose from [Multiply_CFixedPoint(ScriptContainer.GetVariableValue('nfp20_before'), '(CFixedPoint)100')|1]% to [Multiply_CFixedPoint(ScriptContainer.GetVariableValue('nfp20_after'), '(CFixedPoint)100')|1]%, crossing the [Multiply_CFixedPoint(ScriptContainer.GetVariableValue('nfp20_extra'), '(CFixedPoint)100')|1]% threshold.\n\nThis foreign success deserves our readers’ attention. The milestone alone does not explain how the schools work or prove the superiority of the entire education system."
 NFP30_LITERACY_AWAY_1_LEAD:0 "Notable news of rising literacy has arrived from another country."
 NFP30_LITERACY_AWAY_1_TITLE:0 "An educational milestone reached abroad"
 NFP30_LITERACY_AWAY_2_BODY:0 "The literate share rose from [Multiply_CFixedPoint(ScriptContainer.GetVariableValue('nfp20_before'), '(CFixedPoint)100')|1]% to [Multiply_CFixedPoint(ScriptContainer.GetVariableValue('nfp20_after'), '(CFixedPoint)100')|1]%, crossing the [Multiply_CFixedPoint(ScriptContainer.GetVariableValue('nfp20_extra'), '(CFixedPoint)100')|1]% threshold.\n\nFresh information confirms the increase. Its causes, and whether we could learn from the experience at home, require closer study."
 NFP30_LITERACY_AWAY_2_LEAD:0 "News of literacy abroad adds another chapter to the progress of education followed by this newspaper."
 NFP30_LITERACY_AWAY_2_TITLE:0 "More of the world can read"
 NFP30_LITERACY_HOME_1_BODY:0 "The literate share rose from [Multiply_CFixedPoint(ScriptContainer.GetVariableValue('nfp20_before'), '(CFixedPoint)100')|1]% to [Multiply_CFixedPoint(ScriptContainer.GetVariableValue('nfp20_after'), '(CFixedPoint)100')|1]%, crossing the [Multiply_CFixedPoint(ScriptContainer.GetVariableValue('nfp20_extra'), '(CFixedPoint)100')|1]% threshold.\n\nComparison with earlier information confirms the change. One milestone is not enough to judge school quality or equal access to education."
 NFP30_LITERACY_HOME_1_LEAD:0 "A new literacy milestone has been reached. The achievement deserves national pride."
 NFP30_LITERACY_HOME_1_TITLE:0 "Our country takes a step towards learning"
 NFP30_LITERACY_HOME_2_BODY:0 "The literate share rose from [Multiply_CFixedPoint(ScriptContainer.GetVariableValue('nfp20_before'), '(CFixedPoint)100')|1]% to [Multiply_CFixedPoint(ScriptContainer.GetVariableValue('nfp20_after'), '(CFixedPoint)100')|1]%, crossing the [Multiply_CFixedPoint(ScriptContainer.GetVariableValue('nfp20_extra'), '(CFixedPoint)100')|1]% threshold.\n\nThe share of people able to read and write has crossed an important threshold. Assessing conditions in different regions and social classes will require more detailed information."
 NFP30_LITERACY_HOME_2_LEAD:0 "New literacy figures give this newspaper reason to welcome our country’s achievement."
 NFP30_LITERACY_HOME_2_TITLE:0 "Learning widens its reach"
 NFP30_LITERACY_METRICS:0 "The literate share rose from [Multiply_CFixedPoint(ScriptContainer.GetVariableValue('nfp20_before'), '(CFixedPoint)100')|1]% to [Multiply_CFixedPoint(ScriptContainer.GetVariableValue('nfp20_after'), '(CFixedPoint)100')|1]%, crossing the [Multiply_CFixedPoint(ScriptContainer.GetVariableValue('nfp20_extra'), '(CFixedPoint)100')|1]% threshold."
