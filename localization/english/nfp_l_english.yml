l_english:
 NFP20_ACCESS:0 "Persistently low Market Access\nCountry definition: [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName]. Observation: [ScriptContainer.GetVariableValue('nfp20_year')|0], month [Add_CFixedPoint(ScriptContainer.GetVariableValue('nfp20_month'), '(CFixedPoint)1')|0].\nRegion: [ScriptContainer.MakeScope.Var('nfp20_region').GetStateRegion.GetName]. Market Access has remained below 90% for two months; current proportion: [ScriptContainer.GetVariableValue('nfp20_after')|3]. The cause is unknown: local infrastructure shortages, sea connections and other restrictions need separate examination.\nSelection: [Localize(ScriptContainer.MakeScope.Var('nfp20_reason').GetFlagName)]. Fact No. [ScriptContainer.GetVariableValue('nfp20_id')|0]."
 NFP20_ACCESS_RECOVERY:0 "Follow-up: Market Access has improved\nCountry definition: [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName]. Observation: [ScriptContainer.GetVariableValue('nfp20_year')|0], month [Add_CFixedPoint(ScriptContainer.GetVariableValue('nfp20_month'), '(CFixedPoint)1')|0].\nRegion: [ScriptContainer.MakeScope.Var('nfp20_region').GetStateRegion.GetName]. Following the previously published problem, two consecutive observations show Market Access of at least 90%. Proportion: [ScriptContainer.GetVariableValue('nfp20_before')|3] → [ScriptContainer.GetVariableValue('nfp20_after')|3].\nSelection: [Localize(ScriptContainer.MakeScope.Var('nfp20_reason').GetFlagName)]. Fact No. [ScriptContainer.GetVariableValue('nfp20_id')|0]."
 NFP20_COVER_TEXT:0 "Editorial report\nArticles: [ScriptContainer.GetVariableValue('nfp20_article_count')|0]. Figures and wording are fixed to this issue.\n\nObservation history: [ScriptContainer.GetVariableValue('nfp20_history_count')|0] points; comparison over [ScriptContainer.GetVariableValue('nfp20_summary_intervals')|0] intervals (up to 12).\nProjected annual GDP: [ScriptContainer.GetVariableValue('nfp20_summary_before')|0] → [ScriptContainer.GetVariableValue('nfp20_summary_after')|0].\n\nIf there are no articles, confirmed news has not yet accumulated for the enabled sections. Older facts always carry their observation date."
 NFP20_DIAGNOSTICS:0 "Editorial diagnostics at publication\nRemaining in queue: [ScriptContainer.GetVariableValue('nfp20_queue_remaining')|0]; total omitted due to overflow: [ScriptContainer.GetVariableValue('nfp20_dropped')|0].\nNot selected for this issue: obsolete problem [ScriptContainer.GetVariableValue('nfp20_rejected_obsolete')|0]; section disabled [ScriptContainer.GetVariableValue('nfp20_rejected_rubric')|0]; not urgent [ScriptContainer.GetVariableValue('nfp20_rejected_urgent')|0]; type limit [ScriptContainer.GetVariableValue('nfp20_rejected_cap')|0]; insufficient space [ScriptContainer.GetVariableValue('nfp20_rejected_space')|0]."
 NFP20_DIVERGENCE:0 "Economic growth diverges from living standards\nCountry definition: [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName]. Observation: [ScriptContainer.GetVariableValue('nfp20_year')|0], month [Add_CFixedPoint(ScriptContainer.GetVariableValue('nfp20_month'), '(CFixedPoint)1')|0].\nOver three complete monthly intervals, projected annual GDP rose: [ScriptContainer.GetVariableValue('nfp20_before')|0] → [ScriptContainer.GetVariableValue('nfp20_after')|0]. Average Standard of Living fell by [ScriptContainer.GetVariableValue('nfp20_extra')|2] points. These figures describe the divergence but do not establish its cause.\nSelection: [Localize(ScriptContainer.MakeScope.Var('nfp20_reason').GetFlagName)]. Fact No. [ScriptContainer.GetVariableValue('nfp20_id')|0]."
 NFP20_GDP_LEADER:0 "A new country in the GDP top ten\nCountry definition: [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName]. Observation: [ScriptContainer.GetVariableValue('nfp20_year')|0], month [Add_CFixedPoint(ScriptContainer.GetVariableValue('nfp20_month'), '(CFixedPoint)1')|0].\nPrevious position outside the top ten: [ScriptContainer.GetVariableValue('nfp20_before')|0]. Current rank: [ScriptContainer.GetVariableValue('nfp20_after')|0]. The country has remained in the top ten for two monthly observations. This measures projected annual GDP, not profits or the population’s prosperity.\nSelection: [Localize(ScriptContainer.MakeScope.Var('nfp20_reason').GetFlagName)]. Fact No. [ScriptContainer.GetVariableValue('nfp20_id')|0]."
 NFP20_INFRA:0 "Infrastructure under strain\nCountry definition: [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName]. Observation: [ScriptContainer.GetVariableValue('nfp20_year')|0], month [Add_CFixedPoint(ScriptContainer.GetVariableValue('nfp20_month'), '(CFixedPoint)1')|0].\nRegion: [ScriptContainer.MakeScope.Var('nfp20_region').GetStateRegion.GetName]. The infrastructure balance has been negative for two months running. Latest balance: [ScriptContainer.GetVariableValue('nfp20_after')|2]. This warrants checking the local transport network and its load.\nSelection: [Localize(ScriptContainer.MakeScope.Var('nfp20_reason').GetFlagName)]. Fact No. [ScriptContainer.GetVariableValue('nfp20_id')|0]."
 NFP20_INFRA_RECOVERY:0 "Follow-up: infrastructure balance restored\nCountry definition: [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName]. Observation: [ScriptContainer.GetVariableValue('nfp20_year')|0], month [Add_CFixedPoint(ScriptContainer.GetVariableValue('nfp20_month'), '(CFixedPoint)1')|0].\nRegion: [ScriptContainer.MakeScope.Var('nfp20_region').GetStateRegion.GetName]. Since the published warning, the balance has been non-negative in two consecutive observations: [ScriptContainer.GetVariableValue('nfp20_before')|2] → [ScriptContainer.GetVariableValue('nfp20_after')|2]. This is confirmed improvement, not a guarantee against future problems.\nSelection: [Localize(ScriptContainer.MakeScope.Var('nfp20_reason').GetFlagName)]. Fact No. [ScriptContainer.GetVariableValue('nfp20_id')|0]."
 NFP20_LAW:0 "A significant reform takes effect\nCountry definition: [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName]. Observation: [ScriptContainer.GetVariableValue('nfp20_year')|0], month [Add_CFixedPoint(ScriptContainer.GetVariableValue('nfp20_month'), '(CFixedPoint)1')|0].\nLaw: [Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]. The law’s activation has been recorded. The newspaper does not claim it passed through a parliamentary vote, and does not yet assess its consequences.\nSelection: [Localize(ScriptContainer.MakeScope.Var('nfp20_reason').GetFlagName)]. Fact No. [ScriptContainer.GetVariableValue('nfp20_id')|0]."
 NFP20_LITERACY:0 "A literacy milestone crossed\nCountry definition: [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName]. Observation: [ScriptContainer.GetVariableValue('nfp20_year')|0], month [Add_CFixedPoint(ScriptContainer.GetVariableValue('nfp20_month'), '(CFixedPoint)1')|0].\nLiterate share: [ScriptContainer.GetVariableValue('nfp20_before')|3] → [ScriptContainer.GetVariableValue('nfp20_after')|3]. The threshold of [ScriptContainer.GetVariableValue('nfp20_extra')|2] (population share) was crossed. This is confirmed by comparison with the previous snapshot, rather than the country’s starting position.\nSelection: [Localize(ScriptContainer.MakeScope.Var('nfp20_reason').GetFlagName)]. Fact No. [ScriptContainer.GetVariableValue('nfp20_id')|0]."
 NFP20_NONE:0 "—"
 NFP20_PRODUCTION:0 "A new arrival among the top three producers\nCountry definition: [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName]. Observation: [ScriptContainer.GetVariableValue('nfp20_year')|0], month [Add_CFixedPoint(ScriptContainer.GetVariableValue('nfp20_month'), '(CFixedPoint)1')|0].\nGood: [Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]. Position outside the top three: [ScriptContainer.GetVariableValue('nfp20_before')|0]; now: [ScriptContainer.GetVariableValue('nfp20_after')|0]. Two monthly observations confirm a top-three position. Output is compared; profitability and exports were not measured.\nSelection: [Localize(ScriptContainer.MakeScope.Var('nfp20_reason').GetFlagName)]. Fact No. [ScriptContainer.GetVariableValue('nfp20_id')|0]."
 NFP20_QUIET:0 "No new articles have been selected for this section in this issue. The newspaper does not fill the page by repeating current figures."
 NFP20_RANK:0 "The country’s status has changed\nCountry definition: [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName]. Observation: [ScriptContainer.GetVariableValue('nfp20_year')|0], month [Add_CFixedPoint(ScriptContainer.GetVariableValue('nfp20_month'), '(CFixedPoint)1')|0].\nPrevious status: [Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]. New status: [Localize(ScriptContainer.MakeScope.Var('nfp20_extra_detail').GetFlagName)]. A rank change does not necessarily mean a new Great Power has emerged.\nSelection: [Localize(ScriptContainer.MakeScope.Var('nfp20_reason').GetFlagName)]. Fact No. [ScriptContainer.GetVariableValue('nfp20_id')|0]."
 NFP20_RANK_UNKNOWN:0 "outside the listed categories"
 NFP20_REASON_PRIORITY:0 "topic priority and age"
 NFP20_SHORTAGE:0 "The market shortage persists\nCountry definition: [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName]. Observation: [ScriptContainer.GetVariableValue('nfp20_year')|0], month [Add_CFixedPoint(ScriptContainer.GetVariableValue('nfp20_month'), '(CFixedPoint)1')|0].\nGood: [Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]. A direct shortage indicator has been recorded in the reader’s market for two months running. This is not an inference from a high price; check market supply and consumption.\nSelection: [Localize(ScriptContainer.MakeScope.Var('nfp20_reason').GetFlagName)]. Fact No. [ScriptContainer.GetVariableValue('nfp20_id')|0]."
 NFP20_SHORTAGE_RECOVERY:0 "Follow-up: the market shortage is no longer observed\nCountry definition: [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName]. Observation: [ScriptContainer.GetVariableValue('nfp20_year')|0], month [Add_CFixedPoint(ScriptContainer.GetVariableValue('nfp20_month'), '(CFixedPoint)1')|0].\nGood: [Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]. Since the published warning, the direct shortage indicator has been absent in two monthly observations. A high price may persist; that is a different measure.\nSelection: [Localize(ScriptContainer.MakeScope.Var('nfp20_reason').GetFlagName)]. Fact No. [ScriptContainer.GetVariableValue('nfp20_id')|0]."
 NFP20_TECH:0 "A significant technology acquired\nCountry definition: [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName]. Observation: [ScriptContainer.GetVariableValue('nfp20_year')|0], month [Add_CFixedPoint(ScriptContainer.GetVariableValue('nfp20_month'), '(CFixedPoint)1')|0].\nTechnology: [Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]. The country’s acquisition of this knowledge has been recorded. This does not establish a world first or confirm adoption in every building.\nSelection: [Localize(ScriptContainer.MakeScope.Var('nfp20_reason').GetFlagName)]. Fact No. [ScriptContainer.GetVariableValue('nfp20_id')|0]."
 NFP20_WAR_END:0 "The war has ended\nEvent date: [ScriptContainer.GetVariableValue('nfp20_year')|0], month [Add_CFixedPoint(ScriptContainer.GetVariableValue('nfp20_month'), '(CFixedPoint)1')|0].\nPrincipal sides, using permanent definitions: [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName] and [ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName]. The end of the war has been recorded. The newspaper makes no unsupported claims about the victor, losses or peace terms.\nSelection: [Localize(ScriptContainer.MakeScope.Var('nfp20_reason').GetFlagName)]. Fact No. [ScriptContainer.GetVariableValue('nfp20_id')|0]."
 NFP20_WAR_START:0 "War has begun\nEvent date: [ScriptContainer.GetVariableValue('nfp20_year')|0], month [Add_CFixedPoint(ScriptContainer.GetVariableValue('nfp20_month'), '(CFixedPoint)1')|0].\nPrincipal sides, using permanent definitions: [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName] and [ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName]. The transition from diplomatic play to war has been recorded. Other participants and the eventual outcome are not assessed here.\nSelection: [Localize(ScriptContainer.MakeScope.Var('nfp20_reason').GetFlagName)]. Fact No. [ScriptContainer.GetVariableValue('nfp20_id')|0]."
 NFP_ARCHIVE:0 "Archive (up to 12)"
 NFP_ARCHIVE_ITEM:0 "No. [ScriptContainer.GetVariableValue('nfp_number')|0]"
 NFP_COUNTRY:0 "Reader: [GetPlayer.GetName]"
 NFP_COVER:0 "Cover"
 NFP_COVER_TEXT:0 "The country at the time of printing\n\nGDP: [ScriptContainer.GetVariableValue('nfp_gdp')|0]\nPopulation: [ScriptContainer.GetVariableValue('nfp_population')|0]\nAverage Standard of Living: [ScriptContainer.GetVariableValue('nfp_sol')|2]\nLiteracy (raw proportion): [ScriptContainer.GetVariableValue('nfp_literacy')|3]\n\nChoose a section or turn the page. The sections and figures in this issue are fixed at publication; reading it does not update them."
 NFP_ECONOMY:0 "Economy"
 NFP_EVENTS:0 "Events"
 NFP_ISSUE_HEADER:0 "Issue No. [ScriptContainer.GetVariableValue('nfp_number')|0] — [ScriptContainer.GetVariableValue('nfp_year')|0], month [Add_CFixedPoint(ScriptContainer.GetVariableValue('nfp_month'), '(CFixedPoint)1')|0]"
 NFP_ISSUE_META:0 "Source: [SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp_kind'), '(CFixedPoint)1'), 'NFP_KIND_REGULAR', SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp_kind'), '(CFixedPoint)3'), 'NFP_KIND_URGENT', 'NFP_KIND_OTHER'))] • marker [ScriptContainer.GetVariableValue('nfp_marker')|0]"
