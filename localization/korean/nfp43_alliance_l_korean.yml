l_korean:
 NFP43_GAINED:0 "우리나라와 [ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName] 사이에 새로운 동맹 관계가 확인됐다."
 NFP43_GAINED_ALLIANCE_1_BODY:0 "우리 동맹국 명단이 바뀌었다. 가장 최근에 확인한 결과, [ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName] 측과 정식 동맹을 맺고 있다.\n\n우리 외교에 중요한 소식이다. 어떤 약속이 오갔고 특정 분쟁에 함께 나설지는 현재 동맹의 조건을 살펴야 알 수 있다."
 NFP43_GAINED_ALLIANCE_1_LEAD:0 "[ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName] 측과 이제 정식 동맹 관계에 있다."
 NFP43_GAINED_ALLIANCE_1_TITLE:0 "우리나라에 새 동맹국이 생겼다"
 NFP43_GAINED_ALLIANCE_2_BODY:0 "이전에 확인되지 않던 동맹 관계가 새로 나타났다. [ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName] 측이 우리나라의 정식 동맹국 명단에 올랐다.\n\n편집부가 확인한 것은 외교 관계의 변화다. 동맹에 담긴 구체적인 약속을 따져 보기도 전에 무조건 군대를 보내기로 했다고 쓸 수는 없다."
 NFP43_GAINED_ALLIANCE_2_LEAD:0 "편집부는 우리나라와 [ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName] 사이의 새 동맹을 확인했다."
 NFP43_GAINED_ALLIANCE_2_TITLE:0 "동맹의 폭이 넓어지다"
 NFP43_GAINED_BLOC_1_BODY:0 "우리와 외교적으로 한울타리에 있는 나라들이 달라졌다. 최근 기록을 보니 [ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName] 측과 같은 세력 블록에 들어 있다.\n\n이번 소식은 블록의 구성에 관한 것이다. 같은 블록에 속했다는 이유만으로 쌍무 동맹을 맺었다거나 상대국의 모든 전쟁에 참전할 의무가 생겼다고 할 수는 없다."
 NFP43_GAINED_BLOC_1_LEAD:0 "[ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName] 측이 이제 우리나라와 같은 세력 블록에 속한다."
 NFP43_GAINED_BLOC_1_TITLE:0 "우리 세력 블록에 새 동반자가 생기다"
 NFP43_GAINED_BLOC_2_BODY:0 "두 차례 기록 사이에 새 연결고리가 생겼다. 우리나라와 [ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName] 측이 같은 세력 블록에 들어 있다. 소속을 바꾼 쪽은 어느 쪽이든 될 수 있다.\n\n본지는 새로 확인된 관계를 전한다. 누가 누구를 초청했는지, 군사 지원을 약속했는지는 확인된 바 없다."
 NFP43_GAINED_BLOC_2_LEAD:0 "우리나라와 [ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName] 측이 이제 같은 세력 블록에서 함께한다."
 NFP43_GAINED_BLOC_2_TITLE:0 "세력 블록의 동반자가 달라졌다"
 NFP43_GAINED_METRICS:0 "두 관측 사이에 우리나라의 전략적 관계가 새로 확인됐다. 종류는 [SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp20_extra'), '(CFixedPoint)1'), 'NFP43_KIND_ALLIANCE', 'NFP43_KIND_BLOC')]. 최초 기록은 기사화하지 않는다. 매주, 그리고 인쇄 전에 확인하므로 그사이 생겼다 사라진 변화는 놓칠 수 있다. 기사의 달은 발견한 달이며 조약 체결일은 확인되지 않았다. 우선순위 160. 해외 지리 필터를 거치지 않고 자국 독자에게만 보낸다."
 NFP43_KIND_ALLIANCE:0 "정식 동맹"
 NFP43_KIND_BLOC:0 "같은 세력 블록 소속"
 NFP43_LOST:0 "우리나라와 [ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName] 사이에 있던 동맹 관계가 더는 확인되지 않는다."
 NFP43_LOST_ALLIANCE_1_BODY:0 "우리 동맹국 명단이 바뀌었다. 가장 최근 기록을 보니 [ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName] 측과 유지하던 동맹이 사라졌다.\n\n종전의 관계를 전제로 세운 계획을 다시 들여다볼 만하다. 누가 먼저 동맹을 끝냈는지, 이유가 무엇인지는 편집부도 확인하지 못했다."
 NFP43_LOST_ALLIANCE_1_LEAD:0 "[ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName] 측과 맺었던 정식 동맹이 더는 확인되지 않는다."
 NFP43_LOST_ALLIANCE_1_TITLE:0 "종전의 동맹이 효력을 잃다"
 NFP43_LOST_ALLIANCE_2_BODY:0 "우리나라와 [ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName] 사이에 있던 동맹이 가장 최근의 외교 관계 기록에서 사라졌다.\n\n경위는 따로 살펴야 한다. 나라 자체가 사라져도 관계는 끊긴다. 자료도 없이 그것과 외교적 결별을 같은 일로 단정할 수는 없다."
 NFP43_LOST_ALLIANCE_2_LEAD:0 "[ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName] 측과의 정식 동맹이 더는 확인되지 않는다."
 NFP43_LOST_ALLIANCE_2_TITLE:0 "동맹망 한 곳이 끊어졌다"
 NFP43_LOST_BLOC_1_BODY:0 "우리나라와 [ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName] 측은 같은 세력 블록에 속해 있었다. 가장 최근 기록에서는 이 관계가 확인되지 않는다.\n\n양국 가운데 어느 한쪽의 처지가 달라졌을 수도 있고, 블록 자체가 바뀌었을 수도 있다. 편집부는 결과를 전한다. 누가 블록을 떠났는지는 증거가 있어야 말할 수 있다."
 NFP43_LOST_BLOC_1_LEAD:0 "[ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName] 측은 더는 우리나라와 같은 세력 블록에 속해 있지 않다."
 NFP43_LOST_BLOC_1_TITLE:0 "더는 같은 세력 블록이 아니다"
 NFP43_LOST_BLOC_2_BODY:0 "우리나라와 [ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName] 측이 같은 세력 블록에 속해 있던 관계가 더는 확인되지 않는다. 우리의 가까운 외교 환경에서 벌어진 변화다.\n\n무엇 때문에, 어느 쪽이 먼저 움직였는지는 밝혀지지 않았다. 양국 사이에 별도의 동맹이 있다면 이 소식만으로 그 동맹까지 끝났다고 볼 수는 없다."
 NFP43_LOST_BLOC_2_LEAD:0 "[ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName] 측과 한 블록에 있던 종전의 관계가 더는 확인되지 않는다."
 NFP43_LOST_BLOC_2_TITLE:0 "세력 블록의 구성이 달라지다"
 NFP43_LOST_METRICS:0 "우리나라의 전략적 관계가 더는 확인되지 않는다. 종류는 [SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp20_extra'), '(CFixedPoint)1'), 'NFP43_KIND_ALLIANCE', 'NFP43_KIND_BLOC')]. 매주, 그리고 인쇄 전에 확인한다. 결별을 먼저 제안한 쪽과 정확한 날짜는 알 수 없다. 나라가 사라져도 관계는 끝난다. 우선순위 170. 자국 독자에게만 보낸다."
 NFP43_RELATION:0 "우리나라의 동맹 관계"
 NFP43_WAR:0 "전쟁이 시작됐다. 공격 측은 [ScriptContainer.MakeScope.Var('nfp20_extra_detail').GetCountryDefinition.GetName], 방어 측은 [ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName]."
 NFP43_WAR_ALLIANCE_1_BODY:0 "전쟁이 벌어졌다. 외교전을 개시한 쪽은 [ScriptContainer.MakeScope.Var('nfp20_extra_detail').GetCountryDefinition.GetName], 대상은 [ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName] 측이다. 개전 당시 우리나라는 방어 측과 정식 동맹을 맺고 있었다.\n\n편집부는 이 소식을 머리기사로 올린다. 그렇지만 동맹을 맺었다는 사실 하나로 우리나라가 이미 참전했다고 선언할 수는 없다."
 NFP43_WAR_ALLIANCE_1_LEAD:0 "[ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName] 측이 새로 벌어진 전쟁에서 방어에 나섰다."
 NFP43_WAR_ALLIANCE_1_TITLE:0 "우리 동맹국이 공격받다"
 NFP43_WAR_ALLIANCE_2_BODY:0 "새 전쟁을 일으킨 쪽은 [ScriptContainer.MakeScope.Var('nfp20_extra_detail').GetCountryDefinition.GetName], 방어하는 쪽은 [ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName] 측이다. 개전 당시 우리나라와 방어 측 사이의 동맹이 확인됐다.\n\n우리의 외교적 입장에 직접 닿는 일이다. 실제로 참전할지, 어떤 의무를 어떻게 이행할지는 개전 소식만으로 알 수 없다."
 NFP43_WAR_ALLIANCE_2_LEAD:0 "우리와 동맹을 맺은 [ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName] 측을 상대로 전쟁이 시작됐다."
 NFP43_WAR_ALLIANCE_2_TITLE:0 "동맹국에 전쟁이 닥치다"
 NFP43_WAR_BLOC_1_BODY:0 "전쟁이 시작됐다. 개시한 쪽은 [ScriptContainer.MakeScope.Var('nfp20_extra_detail').GetCountryDefinition.GetName], 방어 측은 [ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName]. 분쟁이 시작될 때 방어 측은 우리나라와 같은 세력 블록에 속해 있었다.\n\n우리 정부가 주목할 소식이다. 다만 같은 블록이라는 사실만으로 군사 동맹이나 참전 의무가 입증되지는 않는다."
 NFP43_WAR_BLOC_1_LEAD:0 "우리와 같은 세력 블록에 있는 [ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName] 측이 새 전쟁의 대상이 됐다."
 NFP43_WAR_BLOC_1_TITLE:0 "우리 세력 블록의 일원이 공격받다"
 NFP43_WAR_BLOC_2_BODY:0 "외교전을 개시한 [ScriptContainer.MakeScope.Var('nfp20_extra_detail').GetCountryDefinition.GetName] 측과 그 대상인 [ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName] 측 사이에 전쟁이 벌어졌다. 사건 당시 방어 측은 우리나라와 같은 세력 블록에 속해 있었다.\n\n우리와 가까운 외교권에서 벌어진 일이다. 그러나 우리나라가 참전했다거나 블록에 확인되지 않은 의무가 있다는 뜻은 아니다."
 NFP43_WAR_BLOC_2_LEAD:0 "세력 블록의 동반자인 [ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName] 측이 방어에 나섰다."
 NFP43_WAR_BLOC_2_TITLE:0 "우리 외교권에 전쟁이 닥치다"
 NFP43_WAR_METRICS:0 "출처는 on_diplo_play_war_start. 외교전을 개시한 쪽, 그 대상, 그리고 개전 당시 독자 국가와 대상국 사이의 동맹 관계를 기록했다. 개시국 [ScriptContainer.MakeScope.Var('nfp20_extra_detail').GetCountryDefinition.GetName], 대상국 [ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName]. 우선순위 190으로 전쟁면의 호외 후보가 된다. 같은 세력 블록 소속이라는 사실만으로 참전 의무가 확인되지는 않는다."
