l_korean:
 NFP20_ACCESS:0 "시장 접근성이 낮은 상태가 지속됨\n국가 정의 [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName]. 관측 시점 [ScriptContainer.GetVariableValue('nfp20_year')|0]년 [Add_CFixedPoint(ScriptContainer.GetVariableValue('nfp20_month'), '(CFixedPoint)1')|0]월.\n지역 [ScriptContainer.MakeScope.Var('nfp20_region').GetStateRegion.GetName]. 두 달 연속 접근성이 90%를 밑돌았으며 현재 비율은 [ScriptContainer.GetVariableValue('nfp20_after')|3]. 원인은 확인되지 않았다. 현지 기반 시설 부족, 해상 연결, 그 밖의 제약을 각각 점검할 필요가 있다.\n선정 기준 [Localize(ScriptContainer.MakeScope.Var('nfp20_reason').GetFlagName)]. 기록 번호 [ScriptContainer.GetVariableValue('nfp20_id')|0]."
 NFP20_ACCESS_RECOVERY:0 "후속 보도: 시장 접근성 개선\n국가 정의 [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName]. 관측 시점 [ScriptContainer.GetVariableValue('nfp20_year')|0]년 [Add_CFixedPoint(ScriptContainer.GetVariableValue('nfp20_month'), '(CFixedPoint)1')|0]월.\n지역 [ScriptContainer.MakeScope.Var('nfp20_region').GetStateRegion.GetName]. 앞서 보도한 문제 이후 두 차례 연속 접근성이 90% 이상이다. 비율은 [ScriptContainer.GetVariableValue('nfp20_before')|3] → [ScriptContainer.GetVariableValue('nfp20_after')|3].\n선정 기준 [Localize(ScriptContainer.MakeScope.Var('nfp20_reason').GetFlagName)]. 기록 번호 [ScriptContainer.GetVariableValue('nfp20_id')|0]."
 NFP20_COVER_TEXT:0 "편집부 집계\n기사 수 [ScriptContainer.GetVariableValue('nfp20_article_count')|0]. 수치와 문안은 호별로 저장된다.\n\n관측 기록 [ScriptContainer.GetVariableValue('nfp20_history_count')|0]개, 비교 구간 [ScriptContainer.GetVariableValue('nfp20_summary_intervals')|0]개(최대 12개).\n예상 연간 국내총생산 [ScriptContainer.GetVariableValue('nfp20_summary_before')|0] → [ScriptContainer.GetVariableValue('nfp20_summary_after')|0].\n\n기사가 없으면 활성화된 지면에 실을 확인된 소식이 아직 충분히 쌓이지 않았다는 뜻이다. 이전 기록에는 항상 관측 시점을 표시한다."
 NFP20_DIAGNOSTICS:0 "발행 시점의 편집 기록\n대기 중 [ScriptContainer.GetVariableValue('nfp20_queue_remaining')|0]건, 관측 기간 전체에 걸쳐 대기열 초과로 누락 [ScriptContainer.GetVariableValue('nfp20_dropped')|0]건.\n이 호에서 제외: 시효가 지난 문제 [ScriptContainer.GetVariableValue('nfp20_rejected_obsolete')|0], 지면 비활성 [ScriptContainer.GetVariableValue('nfp20_rejected_rubric')|0], 긴급성 부족 [ScriptContainer.GetVariableValue('nfp20_rejected_urgent')|0], 유형별 한도 [ScriptContainer.GetVariableValue('nfp20_rejected_cap')|0], 지면 부족 [ScriptContainer.GetVariableValue('nfp20_rejected_space')|0]."
 NFP20_DIVERGENCE:0 "경제 성장과 생활 수준이 엇갈리다\n국가 정의 [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName]. 관측 시점 [ScriptContainer.GetVariableValue('nfp20_year')|0]년 [Add_CFixedPoint(ScriptContainer.GetVariableValue('nfp20_month'), '(CFixedPoint)1')|0]월.\n세 번의 온전한 월간 구간 동안 예상 연간 국내총생산이 [ScriptContainer.GetVariableValue('nfp20_before')|0]에서 [ScriptContainer.GetVariableValue('nfp20_after')|0]까지 늘었다. 같은 기간 평균 생활 수준은 [ScriptContainer.GetVariableValue('nfp20_extra')|2]점 낮아졌다. 이 자료는 두 변화가 엇갈렸음을 보여 줄 뿐 원인까지 밝히지는 않는다.\n선정 기준 [Localize(ScriptContainer.MakeScope.Var('nfp20_reason').GetFlagName)]. 기록 번호 [ScriptContainer.GetVariableValue('nfp20_id')|0]."
 NFP20_GDP_LEADER:0 "국내총생산 10위권에 새 나라 진입\n국가 정의 [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName]. 관측 시점 [ScriptContainer.GetVariableValue('nfp20_year')|0]년 [Add_CFixedPoint(ScriptContainer.GetVariableValue('nfp20_month'), '(CFixedPoint)1')|0]월.\n이전 10위권 밖 순위 [ScriptContainer.GetVariableValue('nfp20_before')|0]. 현재 순위 [ScriptContainer.GetVariableValue('nfp20_after')|0]. 두 차례 연속 월간 관측에서 10위권을 유지했다. 기준은 예상 연간 국내총생산으로, 기업 이익이나 주민의 형편을 뜻하지 않는다.\n선정 기준 [Localize(ScriptContainer.MakeScope.Var('nfp20_reason').GetFlagName)]. 기록 번호 [ScriptContainer.GetVariableValue('nfp20_id')|0]."
 NFP20_INFRA:0 "부담을 받는 기반 시설\n국가 정의 [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName]. 관측 시점 [ScriptContainer.GetVariableValue('nfp20_year')|0]년 [Add_CFixedPoint(ScriptContainer.GetVariableValue('nfp20_month'), '(CFixedPoint)1')|0]월.\n지역 [ScriptContainer.MakeScope.Var('nfp20_region').GetStateRegion.GetName]. 두 달 연속 기반 시설 수지가 음수다. 최근 수지는 [ScriptContainer.GetVariableValue('nfp20_after')|2]. 현지 운송망과 그 부담을 살펴볼 만하다.\n선정 기준 [Localize(ScriptContainer.MakeScope.Var('nfp20_reason').GetFlagName)]. 기록 번호 [ScriptContainer.GetVariableValue('nfp20_id')|0]."
 NFP20_INFRA_RECOVERY:0 "후속 보도: 기반 시설 수지 회복\n국가 정의 [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName]. 관측 시점 [ScriptContainer.GetVariableValue('nfp20_year')|0]년 [Add_CFixedPoint(ScriptContainer.GetVariableValue('nfp20_month'), '(CFixedPoint)1')|0]월.\n지역 [ScriptContainer.MakeScope.Var('nfp20_region').GetStateRegion.GetName]. 지난 경고 후 두 차례 연속 관측에서 수지가 0 이상이다. [ScriptContainer.GetVariableValue('nfp20_before')|2] → [ScriptContainer.GetVariableValue('nfp20_after')|2]. 개선이 확인됐지만 앞으로 문제가 생기지 않으리라는 보장은 아니다.\n선정 기준 [Localize(ScriptContainer.MakeScope.Var('nfp20_reason').GetFlagName)]. 기록 번호 [ScriptContainer.GetVariableValue('nfp20_id')|0]."
 NFP20_LAW:0 "중요한 개혁 발효\n국가 정의 [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName]. 관측 시점 [ScriptContainer.GetVariableValue('nfp20_year')|0]년 [Add_CFixedPoint(ScriptContainer.GetVariableValue('nfp20_month'), '(CFixedPoint)1')|0]월.\n법률 [Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]. 법의 발효가 확인됐다. 본지는 의회 표결로 채택됐다고 단정하지 않으며 그 영향은 아직 평가하지 않는다.\n선정 기준 [Localize(ScriptContainer.MakeScope.Var('nfp20_reason').GetFlagName)]. 기록 번호 [ScriptContainer.GetVariableValue('nfp20_id')|0]."
 NFP20_LITERACY:0 "식자율이 새 문턱을 넘다\n국가 정의 [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName]. 관측 시점 [ScriptContainer.GetVariableValue('nfp20_year')|0]년 [Add_CFixedPoint(ScriptContainer.GetVariableValue('nfp20_month'), '(CFixedPoint)1')|0]월.\n글을 읽는 인구 비율 [ScriptContainer.GetVariableValue('nfp20_before')|3] → [ScriptContainer.GetVariableValue('nfp20_after')|3]. 인구 비율 [ScriptContainer.GetVariableValue('nfp20_extra')|2]의 문턱을 넘었다. 게임 시작 당시의 수준이 아니라 직전 기록과의 비교에서 새로운 돌파를 확인했다.\n선정 기준 [Localize(ScriptContainer.MakeScope.Var('nfp20_reason').GetFlagName)]. 기록 번호 [ScriptContainer.GetVariableValue('nfp20_id')|0]."
 NFP20_NONE:0 "—"
 NFP20_PRODUCTION:0 "3대 생산국에 새 나라 진입\n국가 정의 [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName]. 관측 시점 [ScriptContainer.GetVariableValue('nfp20_year')|0]년 [Add_CFixedPoint(ScriptContainer.GetVariableValue('nfp20_month'), '(CFixedPoint)1')|0]월.\n상품 [Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]. 이전에는 3위권 밖 [ScriptContainer.GetVariableValue('nfp20_before')|0]위, 지금은 [ScriptContainer.GetVariableValue('nfp20_after')|0]위. 두 차례 월간 관측에서 3위권을 확인했다. 생산량을 비교했으며 수익성과 수출량은 측정하지 않았다.\n선정 기준 [Localize(ScriptContainer.MakeScope.Var('nfp20_reason').GetFlagName)]. 기록 번호 [ScriptContainer.GetVariableValue('nfp20_id')|0]."
 NFP20_QUIET:0 "이번 호의 이 지면에는 새로 선정된 기사가 없다. 본지는 현재 수치를 반복해 지면을 채우지 않는다."
 NFP20_RANK:0 "국가 지위 변경\n국가 정의 [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName]. 관측 시점 [ScriptContainer.GetVariableValue('nfp20_year')|0]년 [Add_CFixedPoint(ScriptContainer.GetVariableValue('nfp20_month'), '(CFixedPoint)1')|0]월.\n이전 지위 [Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]. 새 지위 [Localize(ScriptContainer.MakeScope.Var('nfp20_extra_detail').GetFlagName)]. 국가 등급의 변화가 반드시 새 열강의 탄생을 뜻하지는 않는다.\n선정 기준 [Localize(ScriptContainer.MakeScope.Var('nfp20_reason').GetFlagName)]. 기록 번호 [ScriptContainer.GetVariableValue('nfp20_id')|0]."
 NFP20_RANK_UNKNOWN:0 "열거한 등급 외"
 NFP20_REASON_PRIORITY:0 "주제의 우선순위와 경과 시간"
 NFP20_SHORTAGE:0 "시장 품귀 지속\n국가 정의 [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName]. 관측 시점 [ScriptContainer.GetVariableValue('nfp20_year')|0]년 [Add_CFixedPoint(ScriptContainer.GetVariableValue('nfp20_month'), '(CFixedPoint)1')|0]월.\n상품 [Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]. 독자 국가의 시장에 두 달 연속 직접적인 품귀 신호가 나타났다. 비싼 가격에서 추론한 결과는 아니다. 시장의 공급과 소비를 확인할 필요가 있다.\n선정 기준 [Localize(ScriptContainer.MakeScope.Var('nfp20_reason').GetFlagName)]. 기록 번호 [ScriptContainer.GetVariableValue('nfp20_id')|0]."
 NFP20_SHORTAGE_RECOVERY:0 "후속 보도: 시장 품귀가 더는 관측되지 않음\n국가 정의 [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName]. 관측 시점 [ScriptContainer.GetVariableValue('nfp20_year')|0]년 [Add_CFixedPoint(ScriptContainer.GetVariableValue('nfp20_month'), '(CFixedPoint)1')|0]월.\n상품 [Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]. 지난 경고 이후 두 번의 월간 관측에서 직접적인 품귀 신호가 사라졌다. 높은 가격은 계속될 수 있으며 그것은 별도의 지표다.\n선정 기준 [Localize(ScriptContainer.MakeScope.Var('nfp20_reason').GetFlagName)]. 기록 번호 [ScriptContainer.GetVariableValue('nfp20_id')|0]."
 NFP20_TECH:0 "중요 기술 습득\n국가 정의 [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName]. 관측 시점 [ScriptContainer.GetVariableValue('nfp20_year')|0]년 [Add_CFixedPoint(ScriptContainer.GetVariableValue('nfp20_month'), '(CFixedPoint)1')|0]월.\n기술 [Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]. 이 나라가 지식을 얻은 사실을 기록했다. 세계 최초의 발견이거나 모든 사업장에서 도입됐음을 뜻하지는 않는다.\n선정 기준 [Localize(ScriptContainer.MakeScope.Var('nfp20_reason').GetFlagName)]. 기록 번호 [ScriptContainer.GetVariableValue('nfp20_id')|0]."
 NFP20_WAR_END:0 "종전\n발생 시점 [ScriptContainer.GetVariableValue('nfp20_year')|0]년 [Add_CFixedPoint(ScriptContainer.GetVariableValue('nfp20_month'), '(CFixedPoint)1')|0]월.\n고정된 국가 정의로 기록한 주요 당사국은 [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName] 및 [ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName]. 전쟁 종료를 확인했다. 승자, 손실, 평화 조건에 관해 확인되지 않은 결론을 내리지 않는다.\n선정 기준 [Localize(ScriptContainer.MakeScope.Var('nfp20_reason').GetFlagName)]. 기록 번호 [ScriptContainer.GetVariableValue('nfp20_id')|0]."
 NFP20_WAR_START:0 "개전\n발생 시점 [ScriptContainer.GetVariableValue('nfp20_year')|0]년 [Add_CFixedPoint(ScriptContainer.GetVariableValue('nfp20_month'), '(CFixedPoint)1')|0]월.\n고정된 국가 정의로 기록한 주요 당사국은 [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName] 및 [ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName]. 외교전이 전쟁으로 넘어간 사실을 확인했다. 그 밖의 참전국이나 앞으로의 결말은 여기서 평가하지 않는다.\n선정 기준 [Localize(ScriptContainer.MakeScope.Var('nfp20_reason').GetFlagName)]. 기록 번호 [ScriptContainer.GetVariableValue('nfp20_id')|0]."
 NFP_ARCHIVE:0 "지난 호 (최대 12개)"
 NFP_ARCHIVE_ITEM:0 "제[ScriptContainer.GetVariableValue('nfp_number')|0]호"
 NFP_COUNTRY:0 "독자: [GetPlayer.GetName]"
 NFP_COVER:0 "첫 면"
 NFP_COVER_TEXT:0 "발행 당시의 국가 현황\n\n국내총생산: [ScriptContainer.GetVariableValue('nfp_gdp')|0]\n인구: [ScriptContainer.GetVariableValue('nfp_population')|0]\n평균 생활 수준: [ScriptContainer.GetVariableValue('nfp_sol')|2]\n식자율 (원래 비율): [ScriptContainer.GetVariableValue('nfp_literacy')|3]\n\n분야를 선택하거나 다음 면으로 넘기십시오. 분야 구성은 해당 호에 고정되며, 읽는 동안 수치는 다시 계산되지 않습니다."
 NFP_ECONOMY:0 "경제"
 NFP_EVENTS:0 "사건"
 NFP_ISSUE_HEADER:0 "제[ScriptContainer.GetVariableValue('nfp_number')|0]호 — [ScriptContainer.GetVariableValue('nfp_year')|0]년 [Add_CFixedPoint(ScriptContainer.GetVariableValue('nfp_month'), '(CFixedPoint)1')|0]월"
 NFP_ISSUE_META:0 "출처: [SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp_kind'), '(CFixedPoint)1'), 'NFP_KIND_REGULAR', SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp_kind'), '(CFixedPoint)3'), 'NFP_KIND_URGENT', 'NFP_KIND_OTHER'))] • 표식 [ScriptContainer.GetVariableValue('nfp_marker')|0]"
 NFP_KIND_OTHER:0 "수동 발행"
 NFP_KIND_REGULAR:0 "정기 배달"
 NFP_KIND_URGENT:0 "호외"
 NFP_LATEST:0 "최신호"
 NFP_NEXT:0 "다음"
 NFP_PREVIOUS:0 "이전"
 NFP_READER:0 "신문 읽기"
 NFP_SETTINGS:0 "구독"
 NFP_SOCIETY:0 "사회"
 NFP_WAR:0 "전쟁"
 je_nfp_subscription:0 "신문 구독"
 je_nfp_subscription_reason:0 "신문 단추로 정기호와 호외의 배달을 설정하십시오. 받아 본 신문은 보관함에 저장되며 한 번에 열두 호까지 볼 수 있습니다."
 nfp_open_decision:0 "신문 열기"
 nfp_open_decision_desc:0 "최신 호를 읽거나 보관함에서 지난 호를 골라 읽을 수 있습니다."
