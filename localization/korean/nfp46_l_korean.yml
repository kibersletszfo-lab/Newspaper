l_korean:
 NFP46_GOOD_LABEL:0 "[ScriptContainer.MakeScope.Var('nfp46_good').GetGoods.GetNameNoIcon]"
 NFP46_METRICS:0 "품목 [ScriptContainer.MakeScope.Var('nfp46_good').GetGoods.GetNameNoIcon]. 구매 주문 [ScriptContainer.GetVariableValue('nfp46_buy_before')|1] → [ScriptContainer.GetVariableValue('nfp46_buy_after')|1], 판매 주문 [ScriptContainer.GetVariableValue('nfp46_sell_before')|1] → [ScriptContainer.GetVariableValue('nfp46_sell_after')|1]. 수요 대비 격차 [ScriptContainer.GetVariableValue('nfp46_gap_before')|1]% → [ScriptContainer.GetVariableValue('nfp46_gap_after')|1]%. 왼쪽 값은 이 연속 관측에서 처음 저장한 기록, 오른쪽은 최근 월간 기록이다.\n편집부의 보도 기준은 두 차례 연속 월간 관측에서 공급이 수요의 80%를 밑돌거나 게임의 직접적인 품귀 신호가 나타난 경우다. 현지 서비스, 운송 및 전기는 지역별 별도 관측이 필요하다."
 NFP46_SHORTAGE_BODY_1:0 "우리 시장에서 게임의 직접적인 상품 품귀 신호가 확인됐다. 두 차례 연속 월간 관측에서 공급 문제가 지속됐다. 직접적인 품귀 신호 또는 상당한 주문 격차 중 하나에 해당한다.\n\n품목 [ScriptContainer.MakeScope.Var('nfp46_good').GetGoods.GetNameNoIcon]. 구매 주문 [ScriptContainer.GetVariableValue('nfp46_buy_before')|1] → [ScriptContainer.GetVariableValue('nfp46_buy_after')|1], 판매 주문 [ScriptContainer.GetVariableValue('nfp46_sell_before')|1] → [ScriptContainer.GetVariableValue('nfp46_sell_after')|1]. 수요 대비 격차 [ScriptContainer.GetVariableValue('nfp46_gap_before')|1]% → [ScriptContainer.GetVariableValue('nfp46_gap_after')|1]%. 왼쪽 값은 이 연속 관측에서 처음 저장한 기록, 오른쪽은 최근 월간 기록이다.\n\n이는 시장 주문을 비교한 수치이며 주민이 받지 못한 물량을 잰 것이 아니다. 격차의 원인이나 특정 건물, 생활 수준에 미친 영향은 이 숫자들만으로 밝혀지지 않는다."
 NFP46_SHORTAGE_BODY_2:0 "최근 집계에서 직접적인 시장 품귀 신호가 나타났다. 공급 문제는 두 달 연속 관측됐지만 앞선 집계는 주문 격차를 기준으로 했을 수 있으므로 생산 불이익이 두 달간 이어졌다고 말할 수는 없다.\n\n품목 [ScriptContainer.MakeScope.Var('nfp46_good').GetGoods.GetNameNoIcon]. 구매 주문 [ScriptContainer.GetVariableValue('nfp46_buy_before')|1] → [ScriptContainer.GetVariableValue('nfp46_buy_after')|1], 판매 주문 [ScriptContainer.GetVariableValue('nfp46_sell_before')|1] → [ScriptContainer.GetVariableValue('nfp46_sell_after')|1]. 수요 대비 격차 [ScriptContainer.GetVariableValue('nfp46_gap_before')|1]% → [ScriptContainer.GetVariableValue('nfp46_gap_after')|1]%. 왼쪽 값은 이 연속 관측에서 처음 저장한 기록, 오른쪽은 최근 월간 기록이다.\n\n이는 시장 주문을 비교한 수치이며 주민이 받지 못한 물량을 잰 것이 아니다. 격차의 원인이나 특정 건물, 생활 수준에 미친 영향은 이 숫자들만으로 밝혀지지 않는다."
 NFP46_SHORTAGE_LEAD_1:0 "시장 기록에서 품귀가 사라지지 않았다. 편집부는 공급 문제를 지면에 올린다."
 NFP46_SHORTAGE_LEAD_2:0 "우리 시장에서 직접적인 품귀 신호가 나타났다. 눈여겨볼 일이다."
 NFP46_SHORTAGE_RECOVERY_BODY_1:0 "지난 경고 뒤 두 달 연속 직접적인 품귀 신호가 없었으며 두 기록 모두 공급이 수요의 80% 이상이다. 가격이 낮아졌다거나 사업장마다 회복됐다는 뜻은 아니다.\n\n품목 [ScriptContainer.MakeScope.Var('nfp46_good').GetGoods.GetNameNoIcon]. 구매 주문 [ScriptContainer.GetVariableValue('nfp46_buy_before')|1] → [ScriptContainer.GetVariableValue('nfp46_buy_after')|1], 판매 주문 [ScriptContainer.GetVariableValue('nfp46_sell_before')|1] → [ScriptContainer.GetVariableValue('nfp46_sell_after')|1]. 수요 대비 격차 [ScriptContainer.GetVariableValue('nfp46_gap_before')|1]% → [ScriptContainer.GetVariableValue('nfp46_gap_after')|1]%. 왼쪽 값은 이 연속 관측에서 처음 저장한 기록, 오른쪽은 최근 월간 기록이다.\n\n이는 시장 주문을 비교한 수치이며 주민이 받지 못한 물량을 잰 것이 아니다. 격차의 원인이나 특정 건물, 생활 수준에 미친 영향은 이 숫자들만으로 밝혀지지 않는다."
 NFP46_SHORTAGE_RECOVERY_BODY_2:0 "두 차례 연속 월간 집계에서 예전의 직접적인 품귀 신호도, 편집부 기준을 넘는 주문 격차도 발견되지 않았다. 물건이 있는지와 그 가격이 얼마인지를 구별해 기록한다.\n\n품목 [ScriptContainer.MakeScope.Var('nfp46_good').GetGoods.GetNameNoIcon]. 구매 주문 [ScriptContainer.GetVariableValue('nfp46_buy_before')|1] → [ScriptContainer.GetVariableValue('nfp46_buy_after')|1], 판매 주문 [ScriptContainer.GetVariableValue('nfp46_sell_before')|1] → [ScriptContainer.GetVariableValue('nfp46_sell_after')|1]. 수요 대비 격차 [ScriptContainer.GetVariableValue('nfp46_gap_before')|1]% → [ScriptContainer.GetVariableValue('nfp46_gap_after')|1]%. 왼쪽 값은 이 연속 관측에서 처음 저장한 기록, 오른쪽은 최근 월간 기록이다.\n\n이는 시장 주문을 비교한 수치이며 주민이 받지 못한 물량을 잰 것이 아니다. 격차의 원인이나 특정 건물, 생활 수준에 미친 영향은 이 숫자들만으로 밝혀지지 않는다."
 NFP46_SHORTAGE_RECOVERY_LEAD_1:0 "앞서 실었던 공급 소식의 뒤를 잇는다. 두 차례의 관측에서 종전 문제가 더는 나타나지 않았다."
 NFP46_SHORTAGE_RECOVERY_LEAD_2:0 "시장 품귀를 다뤄 온 이야기에 희망적인 소식이 더해졌다."
 NFP46_SHORTAGE_RECOVERY_TITLE_1:0 "예전의 품귀가 한발 물러서다"
 NFP46_SHORTAGE_RECOVERY_TITLE_2:0 "물자 공급에 찾아온 반가운 변화"
 NFP46_SHORTAGE_TITLE_1:0 "우리 시장의 품귀, 관심이 필요하다"
 NFP46_SHORTAGE_TITLE_2:0 "공급에 대한 물음이 남았다"
 NFP46_SUPPLY_GAP_BODY_1:0 "최근 월간 집계에서 판매 주문이 구매 주문의 80% 미만이다. 전달에도 상당한 주문 격차나 게임의 직접적인 품귀 신호가 있었다. 편집부의 불균형 기준은 자동으로 생산 불이익을 뜻하지 않는다.\n\n품목 [ScriptContainer.MakeScope.Var('nfp46_good').GetGoods.GetNameNoIcon]. 구매 주문 [ScriptContainer.GetVariableValue('nfp46_buy_before')|1] → [ScriptContainer.GetVariableValue('nfp46_buy_after')|1], 판매 주문 [ScriptContainer.GetVariableValue('nfp46_sell_before')|1] → [ScriptContainer.GetVariableValue('nfp46_sell_after')|1]. 수요 대비 격차 [ScriptContainer.GetVariableValue('nfp46_gap_before')|1]% → [ScriptContainer.GetVariableValue('nfp46_gap_after')|1]%. 왼쪽 값은 이 연속 관측에서 처음 저장한 기록, 오른쪽은 최근 월간 기록이다.\n\n이는 시장 주문을 비교한 수치이며 주민이 받지 못한 물량을 잰 것이 아니다. 격차의 원인이나 특정 건물, 생활 수준에 미친 영향은 이 숫자들만으로 밝혀지지 않는다."
 NFP46_SUPPLY_GAP_BODY_2:0 "두 달 연속 공급 문제가 나타났다. 지금 공급은 수요의 80% 미만이며 앞선 기록에서도 그런 격차나 직접적인 품귀 신호가 있었다. 생산 불이익이나 높은 가격의 여파에 관해 내린 결론은 아니다.\n\n품목 [ScriptContainer.MakeScope.Var('nfp46_good').GetGoods.GetNameNoIcon]. 구매 주문 [ScriptContainer.GetVariableValue('nfp46_buy_before')|1] → [ScriptContainer.GetVariableValue('nfp46_buy_after')|1], 판매 주문 [ScriptContainer.GetVariableValue('nfp46_sell_before')|1] → [ScriptContainer.GetVariableValue('nfp46_sell_after')|1]. 수요 대비 격차 [ScriptContainer.GetVariableValue('nfp46_gap_before')|1]% → [ScriptContainer.GetVariableValue('nfp46_gap_after')|1]%. 왼쪽 값은 이 연속 관측에서 처음 저장한 기록, 오른쪽은 최근 월간 기록이다.\n\n이는 시장 주문을 비교한 수치이며 주민이 받지 못한 물량을 잰 것이 아니다. 격차의 원인이나 특정 건물, 생활 수준에 미친 영향은 이 숫자들만으로 밝혀지지 않는다."
 NFP46_SUPPLY_GAP_LEAD_1:0 "두 달째 공급에서 문제가 확인된다. 최근 집계에서 공급이 수요를 눈에 띄게 밑돌았다."
 NFP46_SUPPLY_GAP_LEAD_2:0 "편집부가 지속되는 공급난에 주목한다. 현재 공급은 수요보다 상당히 적다."
 NFP46_SUPPLY_GAP_RECOVERY_BODY_1:0 "두 달 연속 공급이 구매 주문의 80% 이상이었고 직접적인 품귀 신호는 없었다. 기준선 밑의 격차는 남아 있을 수 있으므로 본지는 완전한 균형이나 낮은 가격까지 약속하지 않는다.\n\n품목 [ScriptContainer.MakeScope.Var('nfp46_good').GetGoods.GetNameNoIcon]. 구매 주문 [ScriptContainer.GetVariableValue('nfp46_buy_before')|1] → [ScriptContainer.GetVariableValue('nfp46_buy_after')|1], 판매 주문 [ScriptContainer.GetVariableValue('nfp46_sell_before')|1] → [ScriptContainer.GetVariableValue('nfp46_sell_after')|1]. 수요 대비 격차 [ScriptContainer.GetVariableValue('nfp46_gap_before')|1]% → [ScriptContainer.GetVariableValue('nfp46_gap_after')|1]%. 왼쪽 값은 이 연속 관측에서 처음 저장한 기록, 오른쪽은 최근 월간 기록이다.\n\n이는 시장 주문을 비교한 수치이며 주민이 받지 못한 물량을 잰 것이 아니다. 격차의 원인이나 특정 건물, 생활 수준에 미친 영향은 이 숫자들만으로 밝혀지지 않는다."
 NFP46_SUPPLY_GAP_RECOVERY_BODY_2:0 "지난 경고 뒤 두 달 동안 상황이 편집부의 공급난 기준을 벗어났다. 공급이 수요의 80% 이상이고 직접적인 품귀 신호도 없다. 지표에서 확인된 범위의 개선이며, 원인과 결과에 대한 최종 판단은 아니다.\n\n품목 [ScriptContainer.MakeScope.Var('nfp46_good').GetGoods.GetNameNoIcon]. 구매 주문 [ScriptContainer.GetVariableValue('nfp46_buy_before')|1] → [ScriptContainer.GetVariableValue('nfp46_buy_after')|1], 판매 주문 [ScriptContainer.GetVariableValue('nfp46_sell_before')|1] → [ScriptContainer.GetVariableValue('nfp46_sell_after')|1]. 수요 대비 격차 [ScriptContainer.GetVariableValue('nfp46_gap_before')|1]% → [ScriptContainer.GetVariableValue('nfp46_gap_after')|1]%. 왼쪽 값은 이 연속 관측에서 처음 저장한 기록, 오른쪽은 최근 월간 기록이다.\n\n이는 시장 주문을 비교한 수치이며 주민이 받지 못한 물량을 잰 것이 아니다. 격차의 원인이나 특정 건물, 생활 수준에 미친 영향은 이 숫자들만으로 밝혀지지 않는다."
 NFP46_SUPPLY_GAP_RECOVERY_LEAD_1:0 "앞서 보도한 문제로 돌아가 보자. 공급이 더는 수요에 그만큼 뒤처지지 않는다."
 NFP46_SUPPLY_GAP_RECOVERY_LEAD_2:0 "두 차례의 관측에서 종전만큼 큰 주문 격차는 확인되지 않았다."
 NFP46_SUPPLY_GAP_RECOVERY_TITLE_1:0 "시장의 간격이 좁혀졌다"
 NFP46_SUPPLY_GAP_RECOVERY_TITLE_2:0 "공급에 개선 조짐이 보인다"
 NFP46_SUPPLY_GAP_TITLE_1:0 "수요가 공급을 앞지르다"
 NFP46_SUPPLY_GAP_TITLE_2:0 "눈감기 어려운 시장의 격차"
