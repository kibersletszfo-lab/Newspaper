l_korean:
 NFP89_LAW_COLD:0 "우리가 이 나라를 그다지 좋아하지는 않는다. 그렇다고 그 나라의 법이 더 낫거나 못해지지는 않는다. 사람들에게 무엇이 달라질지 살펴보자. 남의 정부와 논쟁하는 일도 쟁점이 무엇인지 알고 해야 수월하다."
 NFP89_LAW_DEPENDENT:0 "우리 두 나라 사이에는 종속 관계가 있다. 그 때문에 저 나라의 내부 사정이 우리 일에 가까워져도 그곳의 논쟁까지 우리의 논쟁과 똑같아지지는 않는다. 새 규정은 그 자체의 내용을 놓고 살펴보겠다."
 NFP89_LAW_NEIGHBOR:0 "이웃이라면 이 변화를 먼 나라 일처럼 보기 어렵다. 우리 제도와 비교하는 것은 유익해도 남의 법을 곧장 우리에게 맞는 처방으로 받아들이기는 이르다. 이웃집은 벽의 구조부터 다를 수 있으니."
 NFP89_LAW_PARTNER:0 "우리 동반자 나라에서 일어난 변화다. 함께 세운 계획이 이로써 사라지지는 않지만, 그 계획을 나눌 상대라면 조약 아래의 서명보다 조금은 더 알아 두어야겠다. 새 규정이 어떻게 뿌리내릴지 지켜보자."
 NFP89_LAW_THREAT:0 "이 나라와의 관계를 생각하면 긴장을 늦추기 어렵다. 그래도 새 법 자체가 곧 우리를 겨눈 것은 아니다. 저쪽에서 변화가 있을 때마다 비웃음으로 답하기보다 이제 그 나라가 어떻게 운영되는지 알아 두는 편이 유익하다."
 NFP89_WORLD_ACW_DISTANT:0 "멀리서는 미국의 전쟁을 두 진영의 논쟁처럼 읽기 쉽다. 그렇게 읽다 보면 중요한 사실을 놓친다. 한 나라가 내부의 무력 투쟁에 들어갔으며 결말은 아직 모른다는 사실이다."
 NFP89_WORLD_ACW_NEIGHBOR:0 "이웃으로서는 미국 내전이 너무 가까이에서 시작돼 먼 곳 단신으로 밀어 두기 어렵다. 가까운 일은 살필 만하다. 다만 가깝다는 사실이 우리 국경의 위협까지 입증하지는 않는다."
 NFP89_WORLD_ACW_OWN:0 "우리 땅에서 내전이 벌어질 때 ‘국내 문제’라는 말은 위로가 되기 어렵다. 미국의 분열을 이제 무기로 결판내려 한다. 이번 소식만으로 누가 어떤 대가로 이길지는 알 수 없다."
 NFP89_WORLD_ACW_PARTNER:0 "우리와 미국의 관계를 이제 내전이라는 배경 속에서 보아야 한다. 종전의 약속을 다시 읽어 볼 때다. 한 나라와 우호를 나눈다는 사실만으로 그 내부의 분열에 어떻게 대응할지 답이 나오지는 않는다."
 NFP89_WORLD_ACW_RIVAL:0 "미국 정부를 달갑게 여기지 않는다고 내전이 무해한 구경거리가 되지는 않는다. 우리도 헤아려야 할 나라의 처지가 바뀌고 있다. 편집부는 승자를 미리 정하지 않겠다."
 NFP89_WORLD_AUS_DISTANT:0 "오스트레일리아가 하나의 나라로 국제면에 올랐다. 새 체제를 어떻게 다룰지에 대한 평가는 다음 호들에 남겨 둔다. 오늘의 기사에 아직 그 뒷이야기는 없다."
 NFP89_WORLD_AUS_NEIGHBOR:0 "가까운 곳에서 오스트레일리아가 통합됐다. 이웃인 우리에게 새 정치 환경은 중요하다. 다만 주민들의 삶에 어떤 영향이 올지는 후속 사실이 있어야 알 수 있다."
 NFP89_WORLD_AUS_OWN:0 "오스트레일리아 통합은 우리 독자들 자신의 소식이다. 하나의 나라가 등장했다. 여러 지역의 일상 문제를 이 국가가 얼마나 잘 이을지는 앞으로 확인할 일이다."
 NFP89_WORLD_AUS_PARTNER:0 "우리 동반자 오스트레일리아에 새 통합 체제가 생겼다. 이 변화를 감안해 공동 계획을 논의하되 통합 자체가 부나 새로운 의무를 절로 가져왔다고 볼 수는 없다."
 NFP89_WORLD_AUS_RIVAL:0 "오스트레일리아와 우리의 관계는 순탄치 않다. 그래도 통합이 빈 형식에 그치는 것은 아니다. 하찮은 일로 미리 선언하기보다 어떤 변화인지 이해하는 편이 낫다."
 NFP89_WORLD_CAN_DISTANT:0 "캐나다의 성립이 북아메리카 지도를 바꾼다. 이번 소식에서 확인한 것은 거기까지다. 우리 경제에 닥칠 구체적인 여파를 쓰려면 다른 자료가 필요하다."
 NFP89_WORLD_CAN_NEIGHBOR:0 "우리 가까이에서 캐나다 통합이 이루어졌다. 이웃에게는 가까운 정치 지도에 생긴 변화다. 이번 일로 캐나다의 새로운 의도까지 선언한다면 그것은 추측이다."
 NFP89_WORLD_CAN_OWN:0 "캐나다가 성립해 우리 독자들도 새로운 국가 체제 아래 살게 됐다. 함께 그릴 지도는 생겼다. 익숙한 지방의 문제들이 그 안에서 어떻게 풀릴지는 앞으로의 삶이 말해 줄 것이다."
 NFP89_WORLD_CAN_PARTNER:0 "캐나다 통합은 우리와 약속을 나눈 나라의 일이다. 옛 문서의 이름만 바꿔 적기보다 공동의 계획을 새 체제와 대조해 보는 일이 쓸모 있겠다."
 NFP89_WORLD_CAN_RIVAL:0 "관계가 껄끄러워도 캐나다 통합은 계산에 넣어야 한다. 새 국가 체제가 편집부의 마음에 꼭 들어야만 짚어 볼 가치가 있는 것은 아니다."
 NFP89_WORLD_CHINA_DISTANT:0 "먼 곳에서 보더라도 중국의 분열은 별도 지면을 받을 만하다. 그렇다고 큰 국제 사건에서 우리 장터의 변화까지 남은 거리를 신문의 추측 한 줄로 메울 수는 없다."
 NFP89_WORLD_CHINA_NEIGHBOR:0 "이웃인 우리에게 중국의 분열은 가까운 국경 너머에 일어난 변화다. 이제 옛 지도만으로는 곁에서 누가 다스리는지 알기 어렵다. 구체적인 여파는 따로 살펴보겠다."
 NFP89_WORLD_CHINA_OWN:0 "중국의 분열은 우리 독자 자신의 이야기다. 새 지도를 그럴듯하게 설명하는 일보다 누가 결정을 내리고 그것을 실행할 힘은 어디에 있는지 아는 일이 더 절실하다."
 NFP89_WORLD_CHINA_PARTNER:0 "우리와 중국은 함께 계산에 넣던 일들이 있었다. 이제 익숙한 이름 하나를 보고 예전처럼 단일한 국가를 떠올릴 수는 없다. 하던 이야기를 잇기 전에 누구와 이어 갈지부터 알아야겠다."
 NFP89_WORLD_CHINA_RIVAL:0 "관계가 까다로웠던 나라가 갈라졌다는 소식은 반기기 쉽다. 그러나 여러 새 정부가 들어섰다고 편한 이웃이 생기거나 협상이 단순해진다는 보장은 없다."
 NFP89_WORLD_COMMUNE_DISTANT:0 "파리 코뮌을 두고 벌일 논쟁은 프랑스 국경을 넘어설 것이다. 본지는 우선 확인된 사건을 전한다. 세계 어디에서 비슷한 일이 다시 벌어질지에 관한 판단은 그 뒤의 일이다."
 NFP89_WORLD_COMMUNE_NEIGHBOR:0 "프랑스의 이웃이라면 가까운 수도에서 온 코뮌 소식에 귀를 기울일 만하다. 정치적으로 가까운 곳의 일이지만 그렇다고 우리에게도 같은 일이 일어나리라는 뜻은 아니다."
 NFP89_WORLD_COMMUNE_OWN:0 "파리 코뮌은 우리나라에서 누가 어떻게 다스릴지에 관한 사건이다. 커다란 정치적 명칭 뒤에서는 사건이 아직 진행 중이다. 오늘자 신문에는 편리한 결말이 실려 있지 않다."
 NFP89_WORLD_COMMUNE_PARTNER:0 "우리와 약속을 나눈 프랑스에서 코뮌 소식이 왔다. 익숙한 동반자의 이름만 보고 있던 외교적 셈법을 이제 그곳에서 누가 권력을 쥘 것인가 하는 새 물음에 비춰 봐야 한다."
 NFP89_WORLD_COMMUNE_RIVAL:0 "프랑스와의 껄끄러운 관계를 생각하면 빈정거리는 한마디가 나오기 쉽다. 그러나 파리 코뮌을 알려면 먼저 권력이 어떻게 바뀌고 있는지 알아야 한다. 잘 만든 빈정거림이 그 설명을 대신하지는 못한다."
 NFP89_WORLD_ETH_DISTANT:0 "에티오피아 통일은 세계 소식으로 전할 만하다. 구체적인 국제 관계에 어떻게 작용할지는 지켜볼 일이다. 새 지도 안에 미래의 대답이 모두 적혀 있지는 않다."
 NFP89_WORLD_ETH_NEIGHBOR:0 "우리 이웃에서 에티오피아가 통일됐다. 이 소식이 없었던 것처럼 지역 정세를 논하기 전에 이웃으로서 달라진 정치 상황부터 확인하는 편이 낫겠다."
 NFP89_WORLD_ETH_OWN:0 "에티오피아 통합은 우리 독자 자신의 역사다. 하나의 국가 체제가 들어섰다는 소식은 이미 있다. 그 체제가 삶을 어떻게 나아지게 했는지는 앞으로 벌어질 일에 근거해 써야 한다."
 NFP89_WORLD_ETH_PARTNER:0 "우리 동반자 에티오피아의 국가 체제가 달라졌다. 통합을 종전 약속의 또 다른 형식으로만 여기기보다 그 변화에 비추어 공동의 계획을 점검할 만하다."
 NFP89_WORLD_ETH_RIVAL:0 "관계가 껄끄럽다고 에티오피아 통합을 계산에서 지울 수는 없다. 국가 체제가 변했다. 그 변화가 마음에 드느냐는 따로 물을 일이고, 대답이 달라도 사실은 그대로다."
 NFP89_WORLD_FLU_DISTANT:0 "독감이 세계 뉴스에 올랐다. 이것이 모든 나라의 사정을 서술한 것은 아니다. 어디에서 어느 정도로 사람들이 병에 걸렸는지는 요란한 한 줄 제목에 기대지 않고 따로 살펴야 한다."
 NFP89_WORLD_FLU_NEIGHBOR:0 "이웃에서 독감 소식이 건너왔다. 가깝다는 점은 주목할 만하나 그에 맞는 자료도 없이 우리나라까지 병이 퍼졌다고 선언하지는 않겠다."
 NFP89_WORLD_FLU_OWN:0 "독감 소식이 우리 독자의 나라와 관련돼 있다. 믿을 만한 정보를 계속 지켜보아야 한다. 오늘의 기사는 환자 수나 확산 규모까지 전하지는 않는다."
 NFP89_WORLD_FLU_PARTNER:0 "우리와 약속을 나눈 나라에서 독감 소식이 왔다. 병은 그 자체로 눈여겨볼 일이다. 양국 사이의 외교가 그곳 주민들의 건강에 관한 자료를 대신해 주지는 않는다."
 NFP89_WORLD_FLU_RIVAL:0 "정부와 사이가 나쁘다고 독감 소식을 반길 일은 아니다. 병이 어떻게 번지는지는 정치적 호불호의 목록이 아니라 질병에 관해 확인된 소식에서 알아보겠다."
 NFP89_WORLD_GER_DISTANT:0 "독일 통일은 유럽 밖에서도 눈에 띄는 일이다. 하지만 하나의 국가가 등장했다는 사실만으로 어떤 변화가 우리 살림에까지 닿을지 알 수는 없다."
 NFP89_WORLD_GER_NEIGHBOR:0 "독일의 이웃에게 통일이란 곁에 이제 하나의 국가가 있다는 뜻이다. 그 틀을 어떻게 활용할지는 두고 볼 일이다. 앞으로의 행보 하나하나가 이미 정해졌다고 쓰지는 않겠다."
 NFP89_WORLD_GER_OWN:0 "독일이 통일됐다. 우리 독자에게는 바로 자기 나라의 변화다. 한 이름은 이미 생겼다. 실제로 얼마나 많은 일을 함께하게 될지는 앞으로의 세월이 보여 줄 것이다."
 NFP89_WORLD_GER_PARTNER:0 "우리 독일 측 동반자가 이제 통일 국가를 이루었다. 함께 세운 계획을 새 처지에 비춰 볼 때다. 어제의 친분은 여전히 쓸모 있지만 옛 정치 지도까지 붙잡아 두지는 못한다."
 NFP89_WORLD_GER_RIVAL:0 "독일 통일로 우리와 관계가 순탄치 않은 나라의 체제가 달라졌다. 지도에 적힌 글자만 바뀐 척한다면 꽤 값비싼 자기 위안이 될 것이다."
 NFP89_WORLD_ITA_DISTANT:0 "이탈리아가 통일 소식으로 국제면에 올랐다. 이것이 우리나라에 이로운지 해로운지 쓰려면 이야기의 다음 장, 곧 실제로 달라진 일이 있어야 한다."
 NFP89_WORLD_ITA_NEIGHBOR:0 "이탈리아의 이웃들은 이제 반도를 다른 눈으로 보게 됐다. 가까운 나라의 체제가 변했다. 다만 이 소식만으로 앞으로의 의도까지 읽을 수는 없다."
 NFP89_WORLD_ITA_OWN:0 "이탈리아가 하나의 나라가 됐다. 그 안에서 사는 이들에게 통일은 새 이름이 익숙한 동네 일과 만나는 곳에서 시작된다."
 NFP89_WORLD_ITA_PARTNER:0 "우리 이탈리아 측 동반자와는 이제 달라진 정치 환경에서 만난다. 함께 세운 계획은 통일로 아무것도 달라지지 않았다 여기는 대신, 어디를 손봐야 할지 묻는 데서 다시 시작할 만하다."
 NFP89_WORLD_ITA_RIVAL:0 "이탈리아와의 껄끄러운 관계가 그 통일을 사소한 일로 만들지는 않는다. 반도에 하나의 국가가 들어섰다. 축하할 마음이 없어도 반갑지 않은 소식의 무게는 줄지 않는다."
 NFP89_WORLD_JAP_DISTANT:0 "일본의 왕정복고는 멀리에서도 눈여겨볼 만하다. 다만 ‘변화’라는 말을 슬그머니 ‘성공적인 쇄신’으로 옮겨 적고 싶지는 않다. 성공에는 그에 맞는 증거가 따로 필요하다."
 NFP89_WORLD_JAP_NEIGHBOR:0 "일본의 이웃들에게 왕정복고는 가까운 정치 환경의 변화다. 새 권력이 내릴 결정을 눈여겨보자. 권력이 놓인 자리만 보아서는 앞으로 내놓을 정책 전체를 읽을 수 없다."
 NFP89_WORLD_JAP_OWN:0 "천황의 권력이 우리나라에서 복원됐다. 권력의 새 위치는 이미 확인된 사실이다. 하지만 앞으로 거둘 모든 성공을 그 성공이 오기도 전에 복고의 공으로 돌리기는 이르다."
 NFP89_WORLD_JAP_PARTNER:0 "우리 일본 측 동반자의 최고 통치권에 변화가 있었다. 누구와 무엇을 협의해 왔는지 돌아볼 계기다. 모든 옛 인연이 사라졌다고 선언할 때는 아니다."
 NFP89_WORLD_JAP_RIVAL:0 "일본의 집권 세력에 우리로서 할 말이 있을 수 있다. 그래도 복고는 정치적 변화이며 국력이 강해졌거나 곧 실패하리라는 증거는 아니다."
 NFP89_WORLD_PANAMA_DISTANT:0 "파나마를 지나는 새 길이 해상 교통의 가능성을 바꾼다. 우리나라가 벌써 이익을 챙겼다고 덧붙이면 기분은 좋겠지만 오늘의 자료에는 그런 내용이 없다."
 NFP89_WORLD_PANAMA_NEIGHBOR:0 "우리와 가까운 지역에 파나마 운하가 생겼다. 두 대양 사이에 새 뱃길이 났다. 우리 쪽 수송 가운데 무엇이 영향을 받을지는 따로 따져야 한다."
 NFP89_WORLD_PANAMA_OWN:0 "우리 독자의 나라에서 파나마 운하가 완공됐다. 두 대양을 잇는 데는 성공했다. 이제 그 통로를 실제로 어떻게 쓸지 지켜볼 일이다."
 NFP89_WORLD_PANAMA_PARTNER:0 "파나마 운하가 있는 나라와 맺은 관계 때문에 이번 공사가 특히 눈길을 끈다. 다만 같은 외교권에 있다는 사실만으로 무료 통항이나 무역 이익이 보장되지는 않는다."
 NFP89_WORLD_PANAMA_RIVAL:0 "파나마가 있는 나라와 관계가 껄끄러우면 운하도 그저 남의 행운으로만 보기 쉽다. 새 통로로 무엇이 가능하며 어떤 조건에서 쓸 수 있는지 알아보는 편이 더 유익하다."
 NFP89_WORLD_ROM_DISTANT:0 "루마니아 공국들의 통합이 지역의 정치 체제를 바꾼다. 멀리서는 이 사건을 당장 익숙한 이론의 증거로 삼기 전에 변화 자체부터 차분히 살펴볼 만하다."
 NFP89_WORLD_ROM_NEIGHBOR:0 "이웃인 우리에게 루마니아 통합은 유럽 단신 한 줄을 넘어 가까이 벌어진 변화다. 모든 공동 현안이 어떻게 풀릴지 넘겨짚기보다 이제 누구와 풀어 가야 할지 아는 일이 먼저다."
 NFP89_WORLD_ROM_OWN:0 "루마니아 통합으로 우리 독자들이 사는 나라의 체제가 달라졌다. 공동의 결정을 내릴 새 틀이 생겼다. 그렇다고 익숙한 지방의 문제가 한꺼번에 사라지지는 않았다."
 NFP89_WORLD_ROM_PARTNER:0 "우리와 약속을 나눈 나라가 루마니아의 여러 땅을 한데 모았다. 종전의 인연은 여전히 소중하지만 앞으로의 대화에는 새 국가 체제도 감안해야 한다."
 NFP89_WORLD_ROM_RIVAL:0 "루마니아 국가와 우리는 순탄한 관계가 아니다. 그래도 통합은 외교적 셈법의 대상을 바꿨다. 새 상황이 마음에 들지 않는다고 옛 그림을 붙들고 있을 수는 없다."
 NFP89_WORLD_SPRING_DISTANT:0 "민족들의 봄이라는 이름 아래 서로 다른 정치적 사연이 모여 있다. 멀리서 보면 하나의 이야기로 착각하기 쉽다. 독자에게는 사실 대신 멋진 일반론을 건네기보다 그 차이를 살려 전하는 편이 낫다."
 NFP89_WORLD_SPRING_NEIGHBOR:0 "격변이 이웃에서 일어나고 있다. 가까운 소식이지만 우리에게도 같은 결말이 불가피하다고 단정할 수는 없다. 정치적 운명이 완성된 채 국경을 건너오는 것은 아니니까."
 NFP89_WORLD_SPRING_OWN:0 "우리 독자들에게 민족들의 봄은 유럽 소식에 붙인 이름만은 아니다. 우리나라의 정치적 변화는 편리한 시대 명칭을 빌리기보다 이곳에서 실제로 일어나는 일에 비추어 이해해야 한다."
 NFP89_WORLD_SPRING_PARTNER:0 "우리와 약속을 나눈 나라에도 정치적 격변이 닥쳤다. 그곳을 좀 더 눈여겨봐야겠다. 종전의 공동 계획만으로 동반자가 변화를 어떻게 헤쳐 나갈지 알 수는 없다."
 NFP89_WORLD_SPRING_RIVAL:0 "민족들의 봄이 우리와 관계가 껄끄러운 나라에까지 미쳤다. 그곳의 곤란이라면 무엇이든 우리의 이익이라고 셈하는 것은 복잡한 사건에 비해 너무 쉬운 산술이다."
 NFP89_WORLD_SUEZ_DISTANT:0 "수에즈는 새 통로를 쓸 수 있는 항로에서 종전의 먼 우회를 줄여 준다. 그렇다고 우리 시장의 모든 물건이 싸진다는 뜻은 아니다. 운하에서 가게까지도 따로 거쳐야 할 길이 있다."
 NFP89_WORLD_SUEZ_NEIGHBOR:0 "우리나라와 가까운 곳에 수에즈 운하가 열렸다. 가까이 난 새 길은 눈여겨볼 만하다. 다만 이용해서 이득을 볼지는 지도상의 거리보다 여러 사정에 달렸다."
 NFP89_WORLD_SUEZ_OWN:0 "우리 독자가 사는 나라에서 수에즈 운하가 완공됐다. 거대한 공사가 두 바다 사이의 뱃길이 됐다. 경제적 보람은 실제 쓰임새에서 확인할 일이다."
 NFP89_WORLD_SUEZ_PARTNER:0 "수에즈 운하가 있는 나라와 우리 사이에는 함께 지는 의무가 있다. 공동의 계획에 새 통로를 넣을 만하지만 완공 자체가 우리에게 특별한 이용 조건까지 약속하지는 않는다."
 NFP89_WORLD_SUEZ_RIVAL:0 "수에즈가 있는 나라와 관계는 순탄치 않지만 운하가 실제로 존재한다는 사실은 달라지지 않는다. 이것이 우리를 겨냥한 상대의 우위라고 계산하기 전에 실제 통항 조건을 살펴야 한다."
 NFP89_WORLD_TAIPING_DISTANT:0 "중국의 대립에 태평천국이라는 별도 국가가 등장했다. 이야기의 당사자가 늘어났다. 그렇다고 편집부가 결말까지 지금 말할 수 있게 된 것은 아니다."
 NFP89_WORLD_TAIPING_NEIGHBOR:0 "이웃에서 태평천국의 권력이 생겨났다. 가까운 곳에서 누가 무엇을 다스릴지는 따로 주목할 만하다. 오늘의 소식만으로 그 영향력이 미칠 경계를 전부 그릴 수는 없다."
 NFP89_WORLD_TAIPING_OWN:0 "태평천국의 등장은 우리나라 자신의 정치사에 속한다. 새 권력이 모습을 드러냈다. 하지만 대립 속에서 차지할 위치를 미리 써 둔 승부 결과로 대신할 수는 없다."
 NFP89_WORLD_TAIPING_PARTNER:0 "우리와 태평천국 사이의 관계 때문에 이번 소식은 여느 중국 소식보다 가깝다. 함께 세운 계산에 중요한 것은 독자적 권력이 생겼다는 사실이다. 그 권력이 반드시 성공하리라는 가정은 아직 이르다."
 NFP89_WORLD_TAIPING_RIVAL:0 "태평천국과의 관계는 단순하지 않다. 그럴수록 새 권력의 등장과 그 장래 역량을 나누어 볼 일이다. 전자는 확인됐지만 후자는 한 가지 소식만으로 알 수 없다."
 NFP89_WORLD_YUG_DISTANT:0 "발칸에 새 통합 국가가 생겼다. 멀리서는 당장 그 나라에 근사한 역사적 역할을 부여하기 쉽다. 본지는 좀 더 소박한 일, 지도에서 확인된 변화부터 전하겠다."
 NFP89_WORLD_YUG_NEIGHBOR:0 "이웃들에게 유고슬라비아의 성립은 가까운 정치 지형의 변화다. 어떤 새 결정이 뒤따를지는 아직 모른다. 이웃이라는 사실만으로 남의 계획을 미리 읽을 수는 없다."
 NFP89_WORLD_YUG_OWN:0 "유고슬라비아가 성립하고 우리 독자들은 새로 합쳐진 나라의 구성원이 됐다. 하나의 이름이 저마다 다른 지방의 일과 만날 때 통합도 일상의 내용을 얻는다."
 NFP89_WORLD_YUG_PARTNER:0 "유고슬라비아 성립으로 발칸의 우리 동반자가 새 체제를 갖췄다. 공동 계획은 내용부터 다시 논의해 볼 만하다. 새 나라의 등장은 축하 전문을 쓸 이유이면서 셈법을 고칠 이유이기도 하다."
 NFP89_WORLD_YUG_RIVAL:0 "유고슬라비아 국가와 우리의 관계는 순탄치 않다. 그래도 그 등장을 살펴야 한다. 새 지도가 마음에 들지 않아 옛 지도로 발칸의 일을 설명한다면 이상한 자기 위안이 될 것이다."
