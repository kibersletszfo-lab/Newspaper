 NFP52_GER_2_TITLE:0 "독일 통일 성립"
 NFP52_ITA_1_BODY:0 "이탈리아가 통일됐다. 이탈리아를 하나의 땅이나 문화, 혹은 함께할 미래에 대한 희망으로 부를 수 있었던 시절이 있었다. 이제 거기에 국가가 더해졌다. 통일을 바라던 이들에게는 축하할 때다. 축사가 끝난 뒤 어떻게 함께 살아갈지를 알아볼 때이기도 하다.\n\n이탈리아 국가가 형성됐다. 지중해의 정치 지도에 이웃 나라들이 제 계산에 넣어야 할 통합 국가가 들어섰다. 이탈리아의 여러 땅을 하나씩 따로 보던 오랜 습관만으로는 달라진 사정을 설명할 수 없다.\n\n공동의 정부가 공동의 걱정거리를 맡았다. 깃발을 하나 세운다고 여러 지역의 길이며 경제며 이해관계가 당장 조화를 이루지는 않는다. 그러나 이제 그 문제를 맡을 나라가 있다. 통일은 이루어졌다. 무엇으로 그 속을 채울지 지켜보자.\n\n이 소식에 적힌 날짜는 편집부가 소식을 받은 달이다. 전하는 데 시간이 걸렸다면 실제 사건은 그보다 앞서 일어났을 수 있다."
 NFP52_ITA_1_CONTEXT:0 "공동의 정부가 공동의 걱정거리를 맡았다. 깃발을 하나 세운다고 여러 지역의 길이며 경제며 이해관계가 당장 조화를 이루지는 않는다. 그러나 이제 그 문제를 맡을 나라가 있다. 통일은 이루어졌다. 무엇으로 그 속을 채울지 지켜보자."
