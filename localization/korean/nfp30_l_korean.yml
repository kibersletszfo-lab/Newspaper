 NFP52_ITA_2_TITLE:0 "한 이름 아래 한 정부가 서다"
 NFP52_JAP_1_BODY:0 "일본에서 천황의 권력이 복원됐다. 옛 질서가 돌아왔다는 말이 도리어 새 장을 여는 셈이다. 조정과 막부 사이의 종전 세력 균형이 달라졌다. 많은 독자에게 먼 나라였던 일본이 이제 어디로 향할지 눈여겨볼 이유가 생겼다.\n\n왕정복고가 이루어졌다. 정치의 중심이 다른 자리를 차지하면서 일본의 생활과 통치가 앞으로 어떻게 달라질지도 물음이 됐다. 장엄한 선포는 이미 있었다. 일상에서 나타날 결과는 그 뒤에 따를 결정에 달려 있다.\n\n권력이 돌아왔다고 미래의 모든 변화도 이루어진 것은 아니다. 일본은 새 질서를 어떻게 쓸지 스스로 보여 주어야 한다. 이 이야기는 앞으로의 행보를 보고 판단하고 싶다. 거창한 이름에 그럴듯한 약속이 모자라는 법은 드무니까.\n\n이 소식에 적힌 날짜는 편집부가 소식을 받은 달이다. 전하는 데 시간이 걸렸다면 실제 사건은 그보다 앞서 일어났을 수 있다."
