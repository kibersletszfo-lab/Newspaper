 NFP52_PANAMA_2_TITLE:0 "파나마 운하 완공"
 NFP52_ROM_1_BODY:0 "루마니아 통합이 현실이 됐다. 유럽 외교에서 따로따로 불러야 했던 여러 공국이 이제 하나의 권력 중심을 두고 있다. 통합을 바라던 이들에게는 큰 성과이고, 이웃들에게는 기존의 계산을 고칠 이유다.\n\n루마니아 공국들에 하나의 정부가 생겼다. 독립 문제와 앞으로의 국경이 따로 남아 있더라도 큰 변화다. 한 사건에 나라의 미래 역사를 모두 설명해 달라고 할 수는 없는 일이다.\n\n이제 통합에는 일상의 일이 남았다. 공동의 정부가 함께 해결할 문제를 맡을 수 있게 됐고 그 결과에 대한 책임도 함께 얻었다. 사람들의 삶이 이 소식의 장엄한 시작에 걸맞은 후속 기사를 들려주기를 바란다.\n\n이 소식에 적힌 날짜는 편집부가 소식을 받은 달이다. 전하는 데 시간이 걸렸다면 실제 사건은 그보다 앞서 일어났을 수 있다."
 NFP52_ROM_1_CONTEXT:0 "이제 통합에는 일상의 일이 남았다. 공동의 정부가 함께 해결할 문제를 맡을 수 있게 됐고 그 결과에 대한 책임도 함께 얻었다. 사람들의 삶이 이 소식의 장엄한 시작에 걸맞은 후속 기사를 들려주기를 바란다."
 NFP52_ROM_1_FACT:0 "루마니아 공국들에 하나의 정부가 생겼다. 독립 문제와 앞으로의 국경이 따로 남아 있더라도 큰 변화다. 한 사건에 나라의 미래 역사를 모두 설명해 달라고 할 수는 없는 일이다."
 NFP52_ROM_1_LEAD:0 "루마니아 통합이 현실이 됐다. 유럽 외교에서 따로따로 불러야 했던 여러 공국이 이제 하나의 권력 중심을 두고 있다. 통합을 바라던 이들에게는 큰 성과이고, 이웃들에게는 기존의 계산을 고칠 이유다."
 NFP52_ROM_1_TITLE:0 "루마니아의 여러 땅에 공동의 중심이 생겼다"
 NFP52_ROM_2_BODY:0 "루마니아 통합이 현실이 됐다. 유럽 외교에서 따로따로 불러야 했던 여러 공국이 이제 하나의 권력 중심을 두고 있다. 통합을 바라던 이들에게는 큰 성과이고, 이웃들에게는 기존의 계산을 고칠 이유다.\n\n루마니아 공국들에 하나의 정부가 생겼다. 독립 문제와 앞으로의 국경이 따로 남아 있더라도 큰 변화다. 한 사건에 나라의 미래 역사를 모두 설명해 달라고 할 수는 없는 일이다.\n\n이제 통합에는 일상의 일이 남았다. 공동의 정부가 함께 해결할 문제를 맡을 수 있게 됐고 그 결과에 대한 책임도 함께 얻었다. 사람들의 삶이 이 소식의 장엄한 시작에 걸맞은 후속 기사를 들려주기를 바란다.\n\n기사의 날짜는 편집부가 소식을 확인한 달이다. 사건이 정확히 어느 날 일어났는지를 뜻하지는 않는다."
