 NFP52_CHINA_2_TITLE:0 "나라는 하나 줄고 물음은 늘었다"
 NFP52_COMMUNE_1_BODY:0 "파리에 코뮌이 들어섰다. 프랑스의 정치적 분열이 제 이름과 독자적인 모습을 얻었다. 누가 권력을 쥐는가 하는 물음이 유난히 날카롭다. 무대가 다름 아닌 수도, 곧 익숙한 국가 질서의 한복판이기 때문이다.\n\n파리 코뮌의 선포가 확인됐다. 새 이름 뒤에는 권력을 다른 방식으로 꾸리겠다는 주장이 있다. 대립이 어디로 향할지는 두고 볼 일이다. 다만 이번 위기를 다음 연설 한 번이면 잦아들 평소의 말다툼으로 여기기는 어렵게 됐다.\n\n정치적 구상이 맞붙는 가운데서도 도시 자체를 보아야 한다. 누가 어떤 방식으로 다스릴지 결정하는 동안에도 사람들은 살고 일할 수 있어야 한다. 본지는 프랑스에서 오는 소식을 계속 전할 것이다. 다음 장에서는 사정이 조금 더 또렷해지고 고난은 조금 덜해지기를 바란다.\n\n이 소식에 적힌 날짜는 편집부가 소식을 받은 달이다. 전하는 데 시간이 걸렸다면 실제 사건은 그보다 앞서 일어났을 수 있다."
 NFP52_COMMUNE_1_CONTEXT:0 "정치적 구상이 맞붙는 가운데서도 도시 자체를 보아야 한다. 누가 어떤 방식으로 다스릴지 결정하는 동안에도 사람들은 살고 일할 수 있어야 한다. 본지는 프랑스에서 오는 소식을 계속 전할 것이다. 다음 장에서는 사정이 조금 더 또렷해지고 고난은 조금 덜해지기를 바란다."
