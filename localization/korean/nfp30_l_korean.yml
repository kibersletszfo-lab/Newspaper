 NFP50_SUPPLY_BOTH_1:0 "이 상품은 정부와 군사 시설 양쪽에서 사용한다. 그 쓰임새를 생각하면 공급 문제의 무게가 더해진다. 개별 부서와 군대의 구체적인 피해는 이 자료에서 확인되지 않았다."
 NFP50_SUPPLY_BOTH_2:0 "정부와 군사 시설이 함께 사용하는 상품이다. 편집부는 두 가지 공급 용도를 기록한다. 각각의 기관이나 부대가 어떤 피해를 입었는지는 따로 확인할 일이다."
 NFP50_SUPPLY_CRITICAL_1:0 "특히 우려되는 점이 있다. 사건 당시 시장 부족의 심각도와 우리나라의 현지 부족이 함께 게임의 적색 품귀 경고 조건을 충족했다. 이 신호만으로 영향을 받은 주민이나 사업장의 수를 알 수는 없다."
 NFP50_SUPPLY_CRITICAL_2:0 "이번 문제에는 특별히 주의를 기울일 만하다. 사건 당시 우리나라에서 적색 품귀 경고의 조건이 충족됐다. 개별 사업장의 손해 규모가 그 조건에서 따라 나오는 것은 아니다."
 NFP50_SUPPLY_END_1:0 "편집부는 이 문제를 살피는 일을 미루지 않기를 바란다. 생산 확대와 무역, 기타 대책 중 무엇을 고를지는 현지 조건을 확인해야 한다. 집계표가 완성된 경제 처방을 내주지는 않는다."
 NFP50_SUPPLY_END_2:0 "서둘러 살펴볼 만한 상황이다. 먼저 공급이 어디에서 제한되고 있는지 알아야 한다. 신문의 수치는 물음을 제기하는 데 도움이 되지만 생산과 거래의 점검을 대신하지는 않는다."
 NFP50_SUPPLY_FOLLOW_1:0 "앞서 게재한 공급 이야기로 돌아가자. 새로운 관측에서 뒷이야기를 이어 갈 이유가 생겼다."
 NFP50_SUPPLY_FOLLOW_2:0 "이미 우리 지면에 올랐던 문제다. 새 자료가 들어와 다시 들여다본다."
 NFP50_SUPPLY_GAP_1:0 "상품은 ‘[ScriptContainer.MakeScope.Var('nfp46_good').GetGoods.GetNameNoIcon]’. 판매 주문이 구매 주문의 80% 미만이다. 구매 주문 [ScriptContainer.GetVariableValue('nfp46_buy_before')|1] → [ScriptContainer.GetVariableValue('nfp46_buy_after')|1], 판매 주문 [ScriptContainer.GetVariableValue('nfp46_sell_before')|1] → [ScriptContainer.GetVariableValue('nfp46_sell_after')|1]. 왼쪽은 이 연속 관측의 첫 저장 기록이고 오른쪽은 사건 당시 기록이다. 상당한 주문 격차 하나만으로 생산 불이익이 입증되지는 않는다."
 NFP50_SUPPLY_GAP_2:0 "‘[ScriptContainer.MakeScope.Var('nfp46_good').GetGoods.GetNameNoIcon]’의 수요가 공급을 뚜렷이 앞질러 판매 주문이 구매 주문의 80% 미만이다. 구매 주문 [ScriptContainer.GetVariableValue('nfp46_buy_before')|1] → [ScriptContainer.GetVariableValue('nfp46_buy_after')|1], 판매 주문 [ScriptContainer.GetVariableValue('nfp46_sell_before')|1] → [ScriptContainer.GetVariableValue('nfp46_sell_after')|1]. 왼쪽은 이 연속 관측의 첫 저장 기록이고 오른쪽은 사건 당시 기록이다. 시장 주문에 관한 수치로, 주민들이 받지 못한 물량을 뜻하지 않는다."
 NFP50_SUPPLY_GOVERNMENT_1:0 "정부 시설에서 쓰는 상품이다. 중요한 용도다. 어느 특정 기관이 얼마나 피해를 입었는지까지는 이 자료에서 확인되지 않는다."
 NFP50_SUPPLY_GOVERNMENT_2:0 "정부 시설에서도 이 상품을 찾는다. 그런 쓰임이 있다는 사실만으로 특정 기관에 피해가 발생했다고 단정할 수는 없다."
 NFP50_SUPPLY_INTRO_1:0 "우리 시장을 살필 때다. 공급에서 지속적인 문제가 확인됐다."
 NFP50_SUPPLY_INTRO_2:0 "공급 사정 때문에 다시 시장 기록을 펼치게 됐다. 본지는 문제가 있는 상품을 골라 살펴본다."
 NFP50_SUPPLY_LONG_1:0 "[ScriptContainer.GetVariableValue('nfp50_supply_observations')|0]회 연속 월간 관측에서 문제가 나타났다. 매번 상당한 주문 격차나 직접적인 품귀 신호가 있었다. 두 집계일 사이에 생산 불이익이 줄곧 이어졌다는 뜻은 아니다."
 NFP50_SUPPLY_LONG_2:0 "이번으로 공급 문제가 [ScriptContainer.GetVariableValue('nfp50_supply_observations')|0]개월 연속 월간 관측에 올랐다. 신호는 주문 격차에서 시장 품귀로 또는 그 반대로 바뀔 수 있다. 이 기록으로 하루하루의 사정을 복원할 수는 없다."
 NFP50_SUPPLY_MILITARY_1:0 "이 상품은 군사 시설의 보급에 쓰인다. 그 쓰임새는 주목할 만하지만 우리 부대가 이미 손실이나 불이익을 입었다는 증거는 아니다."
 NFP50_SUPPLY_MILITARY_2:0 "군사 시설이 쓰는 상품이다. 편집부는 공급의 중요성을 기록할 뿐, 확인되지 않은 군대의 피해를 이 상품에 돌리지는 않는다."
 NFP50_SUPPLY_NATIVE_1:0 "상품은 ‘[ScriptContainer.MakeScope.Var('nfp46_good').GetGoods.GetNameNoIcon]’. 사건 당시 직접적인 시장 품귀 신호가 나타났다. 구매 주문 [ScriptContainer.GetVariableValue('nfp46_buy_before')|1] → [ScriptContainer.GetVariableValue('nfp46_buy_after')|1], 판매 주문 [ScriptContainer.GetVariableValue('nfp46_sell_before')|1] → [ScriptContainer.GetVariableValue('nfp46_sell_after')|1]. 왼쪽은 연속 관측의 첫 저장 기록, 오른쪽은 사건 당시 기록이다."
 NFP50_SUPPLY_NATIVE_2:0 "이번 집계는 ‘[ScriptContainer.MakeScope.Var('nfp46_good').GetGoods.GetNameNoIcon]’에 주목한다. 최근 관측에서 직접적인 시장 품귀 신호가 나타났다. 구매 주문 [ScriptContainer.GetVariableValue('nfp46_buy_before')|1] → [ScriptContainer.GetVariableValue('nfp46_buy_after')|1], 판매 주문 [ScriptContainer.GetVariableValue('nfp46_sell_before')|1] → [ScriptContainer.GetVariableValue('nfp46_sell_after')|1]. 왼쪽은 연속 관측의 첫 저장 기록, 오른쪽은 사건 당시 기록이다."
 NFP50_SUPPLY_NO_IMPORT_1:0 "현재 집계에서 이 상품이 시장으로 수입된 기록은 없다. 생산 [ScriptContainer.GetVariableValue('nfp50_supply_production')|1], 소비 [ScriptContainer.GetVariableValue('nfp50_supply_consumption')|1], 수출 [ScriptContainer.GetVariableValue('nfp50_supply_exports')|1]. 수입이 없다고 무역 기회까지 없다는 뜻은 아니다."
 NFP50_SUPPLY_NO_IMPORT_2:0 "사건 당시 시장에 이 상품의 수입이 기록되지 않았다. 생산 [ScriptContainer.GetVariableValue('nfp50_supply_production')|1], 소비 [ScriptContainer.GetVariableValue('nfp50_supply_consumption')|1], 수출 [ScriptContainer.GetVariableValue('nfp50_supply_exports')|1]. 향후 공급의 가능성은 이번 집계로 평가하지 않는다."
 NFP50_SUPPLY_PRICE_1:0 "사건 시점 가격은 £[ScriptContainer.GetVariableValue('nfp50_supply_price')|1], 기본 가격 대비 편차는 [ScriptContainer.GetVariableValue('nfp50_supply_premium')|1]%다. 음수이면 더 싸다는 뜻이다. 한 가격이 모든 구매자의 구매 가능성을 재 주지는 않는다."
 NFP50_SUPPLY_PRICE_2:0 "상품에는 가격이라는 측면도 있다. 사건 시점 가격 £[ScriptContainer.GetVariableValue('nfp50_supply_price')|1], 기본 가격 대비 편차 [ScriptContainer.GetVariableValue('nfp50_supply_premium')|1]%. 음수이면 더 싸다는 뜻이다. 이 값은 모든 구매자가 구할 수 있는지를 재는 지표가 아니다."
 NFP50_SUPPLY_RECOVERY_1:0 "상품은 ‘[ScriptContainer.MakeScope.Var('nfp46_good').GetGoods.GetNameNoIcon]’. [ScriptContainer.GetVariableValue('nfp50_supply_good_observations')|0]회 연속 월간 관측에서 직접적인 품귀 신호가 없고 공급이 수요의 80% 이상이다. 구매 주문 [ScriptContainer.GetVariableValue('nfp46_buy_before')|1] → [ScriptContainer.GetVariableValue('nfp46_buy_after')|1], 판매 주문 [ScriptContainer.GetVariableValue('nfp46_sell_before')|1] → [ScriptContainer.GetVariableValue('nfp46_sell_after')|1]. 왼쪽은 이 연속 관측의 첫 저장 기록, 오른쪽은 사건 당시 기록이다. 기준선 아래의 격차는 여전히 남을 수 있다."
 NFP50_SUPPLY_RECOVERY_2:0 "‘[ScriptContainer.MakeScope.Var('nfp46_good').GetGoods.GetNameNoIcon]’에서 [ScriptContainer.GetVariableValue('nfp50_supply_good_observations')|0]회 연속 월간 관측에 종전 품귀 신호가 없었으며 공급 격차도 수요의 20%를 넘지 않았다. 구매 주문 [ScriptContainer.GetVariableValue('nfp46_buy_before')|1] → [ScriptContainer.GetVariableValue('nfp46_buy_after')|1], 판매 주문 [ScriptContainer.GetVariableValue('nfp46_sell_before')|1] → [ScriptContainer.GetVariableValue('nfp46_sell_after')|1]. 왼쪽은 이 연속 관측의 첫 저장 기록, 오른쪽은 사건 당시 기록이다. 완전한 균형을 약속하는 조건은 아니다."
 NFP50_SUPPLY_RECOVERY_END_1:0 "편집부는 개선을 기록하되 문제가 영원히 끝났다고 선언하지 않는다. 좋은 시장 지표 자체가 모든 사업장의 회복이나 모든 가격의 하락을 입증하지는 않는다."
 NFP50_SUPPLY_RECOVERY_END_2:0 "종전 이야기에서 반가운 방향 전환이 보인다. 다음 호들도 시장을 계속 지켜볼 것이다. 이번 개선을 앞으로 모든 일이 잘되리라는 약속으로 받아들여서는 안 된다."
 NFP50_SUPPLY_RECOVERY_INTRO_1:0 "본지가 게재했던 공급 이야기에서 희망적인 소식이 나왔다."
 NFP50_SUPPLY_RECOVERY_INTRO_2:0 "종전의 부족 문제로 다시 돌아간다. 새 집계에서 개선이 나타났다."
 NFP50_SUPPLY_TRADE_1:0 "시장의 생산량 [ScriptContainer.GetVariableValue('nfp50_supply_production')|1], 소비량 [ScriptContainer.GetVariableValue('nfp50_supply_consumption')|1], 수입량 [ScriptContainer.GetVariableValue('nfp50_supply_imports')|1], 수출량 [ScriptContainer.GetVariableValue('nfp50_supply_exports')|1]. 생산량과 수입량의 합계 중 수입 비중은 [ScriptContainer.GetVariableValue('nfp50_supply_import_fraction')|1]%다. 시장 공급 지표이지 자국 주민의 구매 중 수입 비중은 아니다. 교역량 자체로 부족의 원인이 확인되지는 않는다."
 NFP50_SUPPLY_TRADE_2:0 "주문 총계 뒤에는 생산도 무역도 있다. 시장의 생산량 [ScriptContainer.GetVariableValue('nfp50_supply_production')|1], 소비량 [ScriptContainer.GetVariableValue('nfp50_supply_consumption')|1], 수입량 [ScriptContainer.GetVariableValue('nfp50_supply_imports')|1], 수출량 [ScriptContainer.GetVariableValue('nfp50_supply_exports')|1]. 생산량과 수입량의 합계 중 수입 비중은 [ScriptContainer.GetVariableValue('nfp50_supply_import_fraction')|1]%다. 시장 공급 지표이지 자국 주민이 구매한 수입품의 비중은 아니다. 교역량 자체가 부족의 원인을 입증하지는 않는다."
