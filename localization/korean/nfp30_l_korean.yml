 NFP52_ACW_2_TITLE:0 "전쟁으로 갈라진 연방"
 NFP52_ARTICLE_META:0 "세계 소식 · [Localize(ScriptContainer.MakeScope.Var('nfp30_month').GetFlagName)], [ScriptContainer.GetVariableValue('nfp20_year')|0]년 · 호외"
 NFP52_AUS_1_BODY:0 "오스트레일리아가 한 나라로 뭉쳤다. 먼 대륙에서 신문 첫 면을 차지할 만한 소식이 건너왔다. 여러 정치체가 하나의 국가 틀을 갖춘 것이다. 이제 익숙한 지명 아래에서 함께 꾸려 갈 일이 생겼다.\n\n오스트레일리아가 성립했다. 이는 현지의 통치 체제가 달라졌다는 소식이다. 곧바로 독립을 뜻하지는 않는다. 대외 의무는 별도로 정해진다. 한 나라가 세워진 지금, 그 앞날의 지위는 앞으로 내릴 결정과 다른 나라들과의 관계에 달렸다.\n\n한 지붕 아래 모였으니 이제 그 안에서 의견을 맞출 수 있다. 그 기회를 얼마나 잘 살릴지는 일상의 일처리가 보여 줄 것이다. 대륙은 넓고 함께 짊어질 걱정거리도 충분하다. 그 곁에 함께 누릴 이득도 자리를 얻기를 바란다.\n\n이 소식에 적힌 날짜는 편집부가 소식을 받은 달이다. 전하는 데 시간이 걸렸다면 실제 사건은 그보다 앞서 일어났을 수 있다."
