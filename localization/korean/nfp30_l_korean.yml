 NFP52_YUG_2_LEAD:0 "발칸에 유고슬라비아 국가가 등장했다. 함께 살아갈 제도에 대한 구상이 정치적 형태를 얻은 것이다. 국제 정치의 셈법에 자주 오르내리던 지역인지라 특별한 의미가 있다. 이제 그 계산 속에 새 나라가 들어갔다."
 NFP52_YUG_2_TITLE:0 "남슬라브 통합 성립"
 NFP54_DIV_END:0 "경제 성장을 반겨도 좋고 또 마땅히 반길 일이다. 다만 큰 숫자에 눈길이 쏠려 정작 누구를 위해 성장하는지를 놓치기 쉽다. 두 지표가 어째서 서로 다른 길로 갔는지는 더 알아보아야 한다. 살펴볼 이유는 이미 눈앞에 있다.\n\n좋은 보고서는 쓸모가 있다. 읽고 난 뒤 살기도 더 나아진다면 특히 그렇다."
 NFP54_DIV_EXPECTED:0 "기대 생활 수준은 [ScriptContainer.GetVariableValue('nfp50_family_expected_sol')|2]라는 점도 덧붙이자. 우리 정부에는 이 ‘기대’가 뜻밖이었던 모양이다. 경제적 성과를 아무리 흐뭇하게 바라본들 그 차이가 저절로 메워지지는 않는다."
 NFP54_DIV_FACT:0 "석 달간 관측한 결과 예상 연간 국내총생산이 [ScriptContainer.GetVariableValue('nfp20_before')|0]에서 [ScriptContainer.GetVariableValue('nfp20_after')|0]까지 늘었다. 증가율은 [ScriptContainer.GetVariableValue('nfp50_family_gdp_growth')|2]%다. 그런데 같은 기간 평균 생활 수준은 [ScriptContainer.GetVariableValue('nfp20_extra')|2]점 낮아졌다. 두 가지 소식이 보고서의 이웃한 두 줄에 실렸다. 첫 줄에는 나라에 축하를 보내고 싶다. 둘째 줄에는 손이 좀처럼 가지 않는다."
 NFP54_DIV_INTRO:0 "최근 보고서는 자랑할 만한 성과를 또렷이 보여 준다. 국내총생산이 늘었다. 얼마나 반가운 소식인가. 수치를 흐뭇하게 보며 서로 축하하고, 속으로 국가를 한 소절 부른 뒤 할 일을 다했다는 마음으로 장을 넘겨도 되겠다. 다만 그러기 전에 한 줄만 더 보자. ‘생활 수준’이라고 적힌 그 줄을…."
 NFP54_DIV_LIVING:0 "평균 생활 수준은 전에는 [ScriptContainer.GetVariableValue('nfp50_family_sol_before')|2]였고 지금은 [ScriptContainer.GetVariableValue('nfp50_family_sol')|2]다. 물론 평균이 어느 한 사람의 식탁을 그대로 보여 주는 일은 드물다. 자본가는 고기를, 농민은 배추를 먹으니 평균 내면 모두가 고기쌈을 먹었다는 우스갯소리처럼. 그래도 평균 자체가 내려갔다면 전체 사정을 들여다볼 이유가 있다. 경제는 커지고 평균 살림은 뒷걸음친다. 축하 보고서에 붙이기에는 조금 껄끄러운 주석 아닌가."
 NFP54_DIV_TITLE:0 "경제는 자란다. 저녁상에 숫자를 차릴 수는 없다"
 NFP55_INF_CONNECTED:0 "그래도 아직 겁부터 먹을 일은 아니다. 공동 시장 접근성은 [Multiply_CFixedPoint(ScriptContainer.GetVariableValue('nfp50_family_access'), '(CFixedPoint)100')|1]%다. 이 지역이 나라에서 끊어졌다고 하면 지나친 말이다. 기반 시설이 붐빈다고 내일 당장 빵과 바지가 자취를 감추지는 않는다. 반가운 소식은 아니지만 재앙과는 거리가 있다."
 NFP55_INF_DISCONNECTED:0 "걱정거리가 하나 더 있다. 공동 시장 접근성은 [Multiply_CFixedPoint(ScriptContainer.GetVariableValue('nfp50_family_access'), '(CFixedPoint)100')|1]%다. 지역과 시장 사이의 연결이 온전하다고 보기는 어렵다. 가게 선반이 비게 될지는 아직 알 수 없다. 다만 주민들이 필요한 물건과 인내심 중 무엇이 먼저 바닥날지 따지기 전에 사정을 알아냈으면 한다."
 NFP55_INF_END:0 "편집부는 이 지역의 소식이 신문의 익숙한 배경이 되기 전에 살펴볼 때라고 생각한다. 정부가 철도를 지을지, 항구를 넓힐지, 또 다른 수단을 찾을지 고르는 동안 우리는 전개를 지켜보겠다.\n\n돌다리도 두드려 보고 건너라, 좋은 말이다. 두드리고 나면 누군가는 실제로 #strikethrough 건너는#! 움직이는 일도 해 줬으면 한다."
 NFP55_INF_FACT:0 "이번 이야기는 [SelectLocalization(And(ScriptContainer.MakeScope.Var('nfp20_problem_state').IsSet, ScriptContainer.MakeScope.Var('nfp20_problem_state').GetState.IsValid), 'NFP40_STATE_LINK', 'NFP40_REGION_FALLBACK')]에서 왔다. 두 달째 궂은 소식이 전해진다. 기반 시설에 과부하가 걸렸다. 첫 소식에는 다음 달이면 괜찮아지리라는 희망을 걸 수도 있었다. 다음 달이 왔다. 희망도 여전하고 문제도 여전하다."
 NFP55_INF_INTRO:0 "경제가 잘 돌아가려면 필요한 것이 많다. 세금은 적고, 살 수 있는 물건은 많고, 필요한 것이 필요한 때 제자리에 와 있어야 한다. 마지막 조건에는 여유 있는 기반 시설이 필요하다. 바람과 달리 그 여유에는 분명한 한계가 있다. 우리 지역 한 곳에서 수요가 그 한계를 넘어섰다."
 NFP55_INF_TITLE:0 "좁은 길에 쌓이는 불만 — 기반 시설의 부담이 경제로 번지다"
 NFP56_ACC_END:0 "수도에서 보면 나라는 지도에 잘 나타난다. 지역에서 보면 무엇을 사고팔 수 있느냐가 나라를 더 잘 보여 줄지도 모른다. 지금 이 두 풍경 사이에는 반갑지 않은 차이가 있다.\n\n그 차이가 줄어들지 지켜보겠다. 시장이 왜 그렇게 먼지 또 설명을 듣는 길보다 공동 시장에 닿는 길이 더 가까워졌으면 한다."
 NFP56_ACC_FACT:0 "[SelectLocalization(And(ScriptContainer.MakeScope.Var('nfp20_problem_state').IsSet, ScriptContainer.MakeScope.Var('nfp20_problem_state').GetState.IsValid), 'NFP40_STATE_LINK', 'NFP40_REGION_FALLBACK')]의 이야기다. 두 달 연속 국내 시장 접근에 차질이 생겼다는 소식이 왔다. 지도에서 이 지역은 여전히 우리 땅이다. 그러나 나라의 경제를 온전히 이용하기는 어렵다. ‘국내’라는 말이 마음에는 흐뭇해도 장바구니에 담을 수는 없으니."
 NFP56_ACC_FREE:0 "흥미롭게도 이 지역의 기반 시설은 아직 부담을 감당한다. 그렇다면 늘 하던 ‘뭐라도 더 지읍시다’만으로는 답이 안 된다. 여력이 있는데 온전한 시장 연결은 없다. 무엇이 막혔는지를 먼저 알고 나서 그곳에 돈과 일손을 보내야 한다."
 NFP56_ACC_INTRO:0 "필요한 물건을 그저 사러 갈 수 있다면 좋다. 거리를 재거나 돌아갈 길을 찾을 것도 없이 가서 사면 된다. 하지만 ‘나라 안에 있다’와 ‘여기서 판다’ 사이에 이야기 하나가 통째로 들어갈 때가 있다. 우리 지역 한 곳에서는 아직 그 이야기가 좋은 결말을 얻지 못했다."
 NFP56_ACC_OVERLOAD:0 "까닭은 평범할지 모른다. 기반 시설에 과부하가 걸렸다. 시장과의 연결도 불완전하고 자체 여력도 부족한 반갑지 않은 조합이다. 뒤의 문제가 앞의 일을 전부 설명할까? 아직은 물음이다. 그렇지만 지역을 들여다볼 이유가 둘 이상인 것은 분명하다."
 NFP56_ACC_SEVERE:0 "이제는 ‘약간의 불편’이라는 말로 넘기기 어렵다. 시장 접근성이 온전한 수준의 절반에도 미치지 못한다. 현재 가게 선반에 무엇이 놓여 있는지는 알 수 없다. 다만 이 지역이 공동 경제에 얼마나 기댈 수 있느냐는 물음은 점점 더 절실해진다."
 NFP56_ACC_TITLE:0 "우리 땅인데, 우리 시장은 어디에…"
 NFP57_SUP_BOTH:0 "이 물건은 군대와 정부 기관 양쪽에 필요하다. 구매자 중에는 중요한 임무와 나랏돈을 함께 쥔 이들도 있다는 뜻이다. 그렇지만 임무가 중요하다고 필요한 물건까지 절로 생기지는 않는다. 품귀를 의논할 수 있는 지금 대책을 살펴보는 편이 가장 곤란한 때에 임시변통을 찾는 것보다 낫겠다."
 NFP57_SUP_CHRONIC:0 "품귀가 일상이 될지도 모른다. 그것이야말로 가장 달갑지 않은 면이다. ‘없습니다’라는 말에도 익숙해질 수 있으니까. 언젠가 그 말을 파는 사람이 사는 사람에게 하는 대신 국민이 국가에 하게 될 수도 있다. 그때는 필요한 물건의 행방과 함께 신뢰의 행방도 물어야 한다."
 NFP57_SUP_CRITICAL:0 "이번에는 우리나라의 품귀가 평소의 거래 불편이라 넘기기 어려울 만큼 심각해졌다. 어디엔가 조금 더 남았겠지 하고 스스로 위로할 수는 있다. 실제로 남았을지도 모른다. 문제는 필요한 이들에게 모두 돌아갈 만큼 있느냐는 것이다."
 NFP57_SUP_DETAILS:0 "$NFP46_METRICS$\n시장 생산 [ScriptContainer.GetVariableValue('nfp50_supply_production')|1], 소비 [ScriptContainer.GetVariableValue('nfp50_supply_consumption')|1], 수입 [ScriptContainer.GetVariableValue('nfp50_supply_imports')|1], 수출 [ScriptContainer.GetVariableValue('nfp50_supply_exports')|1]. 생산량과 수입량의 합계 중 수입 비중은 [ScriptContainer.GetVariableValue('nfp50_supply_import_fraction')|1]%다. 시장 공급 지표이며 우리 주민의 구매에서 차지하는 비중은 아니다. 무역량만으로 부족의 원인을 밝힐 수 없다.\n사건 발생 시 가격 £[ScriptContainer.GetVariableValue('nfp50_supply_price')|1], 기본 가격 대비 편차 [ScriptContainer.GetVariableValue('nfp50_supply_premium')|1]%(음수는 더 저렴함). 가격이 모든 구매자의 구입 가능성을 재는 것은 아니다.\n문제가 이어진 월간 관측 횟수 [ScriptContainer.GetVariableValue('nfp50_supply_observations')|0]. 사건 시점의 직접적인 품귀 신호 [ScriptContainer.GetVariableValue('nfp46_native_after')|0], 심각한 현지 부족 [ScriptContainer.GetVariableValue('nfp50_supply_critical')|0]."
 NFP57_SUP_END:0 "부족의 원인은 여럿이겠지만 사러 나온 이의 물음은 대개 하나다. ‘오늘은 필요한 것을 구할 수 있을까?’\n\n달라진 소식이 들리면 이 이야기로 돌아오겠다. 그때에는 물건 자체보다 더 좋은 값에 파는 가게를 찾아다닐 수 있으면 좋겠다.\n\n그래도 값을 두고 흥정하는 일이 즐거우려면 먼저 흥정할 물건이 있어야 한다."
 NFP57_SUP_FACT:0 "이번 주제는 [ScriptContainer.MakeScope.Var('nfp46_good').GetGoods.GetNameNoIcon]. 시장에서 품귀가 나타났고 월간 소식에 공급난이 오른 것도 처음이 아니다. 그렇다고 어디에서나 물건이 사라졌다는 뜻은 아니다. 다만 사려는 이가 충분히 많아 ‘어디서 구하나?’라는 물음에 지면 하나를 내줄 만하다. 보다시피 수요는 제 몫을 했다. 이제 공급을 기다릴 차례다."
 NFP57_SUP_GOVERNMENT:0 "정부 기관에도 이 물건이 필요하다. 시세표 한 줄을 볼 때 짐작한 것보다 나라의 일상 업무에 가까운 문제일 수 있다. 국가적 중요성이라는 말은 제법 묵직하다. 아쉽게도 그 말 자체가 물건을 생산하지는 못한다."
 NFP57_SUP_INTRO:0 "장을 보는 일이 고르는 데서 시작되면 좋다. 더 좋은 것은 무엇이고, 더 싼 것은 무엇이며, 오늘 살 수 있는 것은 무엇이고 무엇을 잠시 두어야 할까. ‘없습니다’와 ‘다른 곳에서 찾아보세요’ 사이에서 골라야 한다면 사정이 덜 즐겁다. 산책이나 말다툼을 할 구실이 아니라 물건이 필요한 날에는 특히 그렇다."
 NFP57_SUP_LONG:0 "달마다 소식은 오지만 공급에는 아직 물음표가 붙는다. 처음에는 금세 나아지리라 기대했다. 이제 그 기대에도 꽤 오랜 경력이 붙었다. 그만큼 정부가 일한 성과도 따라붙으면 좋겠다. 지금까지는 시간도 흐르고 희망도 자랐지만 문제는 여전히 제자리에 있다."
 NFP57_SUP_MILITARY:0 "이 물건에는 군사용 쓰임새도 있다. 무역뿐 아니라 군대의 보급도 들여다볼 일이다. 총검을 갈아야 할 때 서둘러 해결하는 것보다는 아직 신문 지면에서 논할 수 있을 때 미리 살피는 편이 좋겠다. 그때쯤에는 필요한 것이 다 갖추어져 있기를 바란다."
 NFP57_SUP_NO_IMPORT:0 "집계 시점에 외부에서 들어오는 물량은 확인되지 않았다. 해외 구매로 부족한 양을 메울 수 있을까? 자연스레 떠오르는 생각이다. 다만 ‘사면 좋겠다’와 ‘마침내 실려 왔다’ 사이에는 대개 신문 문장 하나보다 복잡한 일이 있다. 정확히 무엇이 가로막고 있는지 살펴볼 만하다."
 NFP57_SUP_TITLE:0 "수요는 있다. 물건은 어디에?"
 NFP57_SUP_TRADE:0 "외부에서 물량이 들어오지만 품귀를 풀지는 못했다. ‘들여오겠다’고 말하는 편이 공급 문제를 끝내는 것보다 쉽다는 뜻이다. 지도에 그린 무역로는 그럴듯하다. 그 길 끝에서 실제로 받을 물건도 있으면 좋겠다. 추가 구매가 얼마나 도움이 될지, 어디에서 더 구할지는 아직 물음으로 남는다."
 NFP58_GAP_BOTH:0 "군대와 정부 기관이 모두 쓰는 물품이다. 그러니 이 거래에는 국가의 이해관계도 걸려 있다. 그만큼 중요한 일이라면 공급 문제도 제때 풀리는 데 보탬이 되었으면 한다. 안타깝게도 중요하다는 말만으로 물건이 생기지는 않는다."
 NFP58_GAP_CHRONIC:0 "이야기가 꽤 길어졌다. 수요가 많다는 것은 생산하고 팔려는 이들에게 좋은 초대장이 될 법하다. 그런데 초대장은 아직 탁자에 놓여 있고, 공급은 그 뒤를 따라오지 못한다. 생산 여력이 부족한가, 무역이 막혔나, 아니면 다른 사정인가? 아직은 물음표다. 사겠다는 마음만으로 경제의 기적이 일어나지는 않는 모양이다."
 NFP58_GAP_CRITICAL:0 "게다가 국내에서는 이미 심각한 지역적 부족이 확인됐다. 시장 전체의 사정 뒤에 더 다급한 질문이 있는 셈이다. 바로 여기서 필요한 물건을 구하기는 얼마나 쉬운가? 당장 물건이 필요한 구매자에게 시장의 장래성을 논하는 말은 기다리는 시간을 보내는 데나 도움이 될 것이다."
 NFP58_GAP_END:0 "끝으로 무슨 말을 하고 싶은가? 높은 수요는 경제에 좋은 소식이 될 수 있다. 만들 이유도, 팔 상대도, 사업을 넓힐 까닭도 있다. 다만 가능성을 결과로 바꾸는 일은 아직 남았다. 기다리는 것이 구매의 주된 일이 되기 전이면 더욱 좋겠다.\n\n원하는 사람은 있다. 이제 원하는 물건이 있어야 한다."
 NFP58_GAP_FACT:0 "이번에 살펴볼 물품은 ‘[ScriptContainer.MakeScope.Var('nfp46_good').GetGoods.GetNameNoIcon]’이다. 사려는 양이 팔려고 내놓은 양보다 눈에 띄게 많고, 공급의 어려움도 한 달치 소식에 그치지 않는다. 물건이 사라졌다고 하면 과장이다. 하지만 ‘살 사람이 있다’와 ‘살 사람이 구할 수 있다’ 사이에 달갑지 않은 차이가 생겼다."
 NFP58_GAP_GOVERNMENT:0 "정부 기관에서도 쓰는 물품이다. 따라서 사적인 거래에만 걸린 관심사는 아니다. 물론 국고에는 나름의 수단이 있다. 그렇다고 서류에 관인을 찍는다고 시장의 공급이 늘어나는 것은 아니다."
 NFP58_GAP_INTRO:0 "구매자를 찾으면 장사의 절반은 해낸 셈이다. 때로는 가장 어려운 절반이기도 하다. 설명하고, 관심을 끌고, 지갑을 열도록 설득해야 하니까. 사겠다는 사람이 충분하다면 상인에게도 나라 경제에도 축하를 건네고 싶어진다. 다만 그 전에 이들에게 내놓을 물건이 있는지부터 살펴야 한다. 바로 여기서 일이 꼬였다."
 NFP58_GAP_LONG:0 "처음에는 장사가 금세 수요를 따라잡으리라 기대할 만했다. 돈을 내겠다는 말은 대개 외상으로 해 달라는 말보다 환영받기 마련이다. 그런데 달은 넘어가도 문제는 남아 있다. 돈을 벌겠다는 사람은 이미 나타났을지도 모른다. 이제 물건도 나타났으면 한다."
 NFP58_GAP_MILITARY:0 "군사용으로도 쓰이는 물품이다. 그러니 군대의 급한 필요를 논하기 전부터 수요를 눈여겨볼 만하다. 그때가 되었을 때 나라에 남아 있는 것이 설명거리만이 아니라 공급할 여력이었으면 한다."
 NFP58_GAP_NO_IMPORT:0 "아직 외부에서 들어오는 공급은 확인되지 않았다. 자연히 이런 질문이 나온다. 국내 공급이 모자라면 해외에서 찾아볼 수는 없을까? 물론 질문만으로 물건이 실려 오지는 않는다. 그래도 구매자는 무엇이 행동으로 답하는 일을 막고 있는지 알고 싶을 것이다."
 NFP58_GAP_TITLE:0 "살 사람은 있다. 물건은 어디에?"
 NFP58_GAP_TRADE:0 "외부 공급은 있지만 수요와 공급의 차이는 여전하다. 물건이 들어오고 있다는 것은 반가운 일이다. 더 들여올 수 있는지, 그러려면 무엇이 필요한지 알아볼 차례다. 무역의 성과는 지도에서 확인할 수 있을 때보다 손에 넣을 수 있을 때 더욱 반갑다."
 NFP59_REC_BOTH:0 "군대와 정부 기관 모두 이 물건이 필요하다. 그러니 반가운 소식을 눈여겨볼 곳도 여럿이다. 좋은 소식 한 번이 온 나라에 필요한 물자를 채워 주지는 않는다. 그래도 시장을 조금 편한 마음으로 바라볼 이유가 생겼다."
 NFP59_REC_BUY:0 "다만 사려는 이도 줄었다. 그러니 모든 개선을 공급의 성과로 돌리기는 지나치게 편리하다. 장사가 잘 돌아가 줄이 짧아질 수도 있다. 기다리던 사람들이 떠나서 짧아질 때도 있다. 지금의 변화만으로 어느 쪽인지는 모른다."
 NFP59_REC_DETAILS:0 "$NFP57_SUP_DETAILS$\n종전 신호가 없어진 연속 월간 관측 횟수 [ScriptContainer.GetVariableValue('nfp50_supply_good_observations')|0]. 이전 경고 유형 [ScriptContainer.GetVariableValue('nfp46_mode')|0] (1은 직접적인 품귀, 2는 수요와 공급의 격차). 주문 비교는 연속 관측이 시작된 시점과 사건 발생 시점을 대상으로 한다."
 NFP59_REC_END:0 "신문은 궂은 소식은 크게 쓴다. 그러고서 개선에는 입을 다문다면 이상한 일이다. 반길 이유가 생겼고 우리는 기쁜 마음으로 이를 기록한다.\n\n옛 일이 다시 제자리로 돌아오지는 않는지 지켜보겠다. 좋은 소식을 뒤집어야 하는 것보다 그 후속 보도를 쓸 수 있는 편이 즐겁다."
 NFP59_REC_GAP:0 "‘[ScriptContainer.MakeScope.Var('nfp46_good').GetGoods.GetNameNoIcon]’ 소식으로 돌아가자. 전에는 내놓은 물량보다 사려는 이가 훨씬 많았다. 이제 두 달 연속 한결 차분한 모습이다. 수요와 공급이 손을 맞잡았다고 단정할 수는 없어도 적어도 그토록 멀찍이 떨어져 있지는 않다."
 NFP59_REC_GOVERNMENT:0 "정부 기관에서도 이 물건을 쓴다. 이번 개선은 국고에서도 눈여겨볼 문제다. 반가운 소식에 이어 평소의 업무도 한결 수월해지면 좋겠다."
 NFP59_REC_INTRO:0 "좋은 소식의 모습이 꽤 수수할 때가 있다. 테이프를 끊는 이도, 축사를 하는 이도, 오늘을 기억하라고 당부하는 이도 없다. 눈살을 찌푸리게 하던 이야기에서 마침내 다른 표정을 지을 이유가 생겼을 뿐이다. 예전의 우리 시장 걱정이 바로 그런 뒷이야기를 얻었다."
 NFP59_REC_MILITARY:0 "군대에도 이 물건이 필요하다. 공급 사정이 차분해진 일은 그런 면에서도 반갑다. 군의 모든 수요가 채워졌다고 선언할 수는 없다. 그렇지만 시장의 걱정거리가 적어도 하나 줄었다. 나쁘지 않은 시작이다."
 NFP59_REC_NATIVE:0 "‘[ScriptContainer.MakeScope.Var('nfp46_good').GetGoods.GetNameNoIcon]’의 이야기로 돌아간다. 지난 경고 뒤 두 달 연속 종전의 우려 신호가 사라졌다. 시장에서 직접적인 품귀가 더는 관측되지 않고 공급도 수요에 훨씬 가까워졌다. 모든 구매자가 필요한 것을 찾으리라는 보장은 아니다. 그래도 또 ‘여전히 모자란다’는 말 대신 다른 소식을 전할 수 있게 됐다."
 NFP59_REC_NO_IMPORT:0 "집계 시점에 외부 공급은 확인되지 않았다. 그러니 이번 개선을 국경 밖에서 온 화물 덕분이라고 간단히 설명할 수는 없다. 시장 안에서 무엇이 변했는지는 별개의 문제다. 좋은 소식의 값이 떨어지지는 않지만 조금 더 살펴보고 싶은 까닭은 된다."
 NFP59_REC_SELL:0 "반가운 대목이 하나 있다. 처음 이 이야기를 다룰 때보다 팔겠다고 내놓은 양이 늘었다. 구매자들이 어쩌다 생각을 바꾸기를 기다리기만 한 것은 아니라는 뜻이다. 거래되는 물량이 늘었다. 누가 어떻게 해냈는지는 아직 모르지만 변화 자체는 기록할 만하다."
 NFP59_REC_TITLE:0 "한숨 돌릴 만한 소식"
 NFP59_REC_TRADE:0 "외부에서 물량은 계속 들어온다. 공급 사정이 좋다는 소식 곁에서 보면 반갑다. 모든 공을 무역에 돌리기에는 이르지만 저절로 잘 풀린 듯 무심히 지나치기도 아쉽다."
 NFP59_REC_ZERO_END:0 "사람들이 왜 더는 사지 않는지는 앞으로 알아봐야 한다. 이 변화를 경제의 승리로 적는 일은 서두르지 않겠다.\n\n빈 대기 줄은 보기 좋다. 기다리던 사람들이 어디로 갔는지 안다면 말이다."
 NFP59_REC_ZERO_FACT:0 "‘[ScriptContainer.MakeScope.Var('nfp46_good').GetGoods.GetNameNoIcon]’에서 종전의 문제 신호는 사라졌다. 하지만 가장 최근 집계에서는 수요도 관측되지 않았다. 조용해진 것은 사실이다. 그 침묵 뒤에서 공급이 나아졌는지는 아직 모른다."
 NFP59_REC_ZERO_INTRO:0 "부족을 눈치채지 않게 되는 간단한 방법이 있다. 필요한 것을 찾지 않으면 된다. 물론 구매자에게는 위안이 되기 어렵다. 그러니 다음 소식에는 축하 음악을 잠시 멈추고 귀를 기울이자."
 NFP59_REC_ZERO_TITLE:0 "수요가 없으면 문제도 없을까?"
 NFP60_CONS_DOWN:0 "시장의 소비가 줄었다. 이유는 따로 살필 문제다. "
 NFP60_CONS_UP:0 "시장의 소비가 늘었다. "
 NFP60_EXP_DOWN:0 "수출로 빠져나가는 물량이 줄었다. "
 NFP60_EXP_UP:0 "수출로 나가는 물량이 늘었다. "
 NFP60_IMP_DOWN:0 "외부에서 시장으로 들어오는 물량이 줄었다. "
 NFP60_IMP_UP:0 "외부에서 시장으로 들어오는 물량이 늘었다. "
 NFP60_PARTIAL_SUP:0 "우리는 문제가 이미 진행 중일 때 생산과 무역을 자세히 관측하기 시작했다. 여기에 보이는 것은 그 시점 이후의 변화뿐이다. "
 NFP60_PROD_DOWN:0 "시장의 상품 생산량이 줄었다. "
 NFP60_PROD_UP:0 "시장의 상품 생산량이 늘었다. "
 NFP60_STATE_DETAILS:0 "[Localize(ScriptContainer.MakeScope.Var('nfp60_previous_metrics').GetFlagName)]\n원인 관측 시작 월 지수 [ScriptContainer.GetVariableValue('nfp60_st_start')|0], 기록 불완전 여부 [ScriptContainer.GetVariableValue('nfp60_st_partial')|0].\n기반 시설 [ScriptContainer.GetVariableValue('nfp60_st_cap_before')|2] → [ScriptContainer.GetVariableValue('nfp60_st_cap_after')|2]\n부담 [ScriptContainer.GetVariableValue('nfp60_st_usage_before')|2] → [ScriptContainer.GetVariableValue('nfp60_st_usage_after')|2]\n시장 접근성 [Multiply_CFixedPoint(ScriptContainer.GetVariableValue('nfp60_st_access_before'), '(CFixedPoint)100')|1]% → [Multiply_CFixedPoint(ScriptContainer.GetVariableValue('nfp60_st_access_after'), '(CFixedPoint)100')|1]%\n철도 단계 [ScriptContainer.GetVariableValue('nfp60_st_rail_before')|0] → [ScriptContainer.GetVariableValue('nfp60_st_rail_after')|0]\n항구 단계 [ScriptContainer.GetVariableValue('nfp60_st_port_before')|0] → [ScriptContainer.GetVariableValue('nfp60_st_port_after')|0]\n도심지 단계 [ScriptContainer.GetVariableValue('nfp60_st_urban_before')|0] → [ScriptContainer.GetVariableValue('nfp60_st_urban_after')|0]\n사건(각 횟수 상한 99): 철도 건설 [ScriptContainer.GetVariableValue('nfp60_st_rail_built')|0], 철도 확장 [ScriptContainer.GetVariableValue('nfp60_st_rail_expanded')|0], 철도 생산 방식 변경 [ScriptContainer.GetVariableValue('nfp60_st_rail_pm')|0], 항구 건설 [ScriptContainer.GetVariableValue('nfp60_st_port_built')|0], 항구 확장 [ScriptContainer.GetVariableValue('nfp60_st_port_expanded')|0], 항구 생산 방식 변경 [ScriptContainer.GetVariableValue('nfp60_st_port_pm')|0], 도심지 건설 [ScriptContainer.GetVariableValue('nfp60_st_urban_built')|0], 도심지 확장 [ScriptContainer.GetVariableValue('nfp60_st_urban_expanded')|0], 도심지 생산 방식 변경 [ScriptContainer.GetVariableValue('nfp60_st_urban_pm')|0].\n첫 사건과 마지막 사건의 지수 [ScriptContainer.GetVariableValue('nfp60_st_event_first')|0] / [ScriptContainer.GetVariableValue('nfp60_st_event_last')|0]. 관측 건물의 고용 충원율이 80% 미만에서 80% 이상으로 바뀌면 충원 개선으로 기록한다. 기반 시설에 미친 정확한 기여분은 계산하지 않았다."
 NFP60_SUP_CAUSES:0 "[SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp60_supply_known'), '(CFixedPoint)1'), 'NFP60_SUP_COMPONENTS', 'NFP60_SUP_UNKNOWN')][SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp60_s_partial'), '(CFixedPoint)1'), 'NFP60_PARTIAL_SUP', 'NFP50_EMPTY')]"
 NFP60_SUP_COMPONENTS:0 "[SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp60_prod_dir'), '(CFixedPoint)1'), 'NFP60_PROD_UP', SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp60_prod_dir'), '(CFixedPoint)-1'), 'NFP60_PROD_DOWN', 'NFP50_EMPTY'))][SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp60_imp_dir'), '(CFixedPoint)1'), 'NFP60_IMP_UP', SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp60_imp_dir'), '(CFixedPoint)-1'), 'NFP60_IMP_DOWN', 'NFP50_EMPTY'))][SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp60_exp_dir'), '(CFixedPoint)1'), 'NFP60_EXP_UP', SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp60_exp_dir'), '(CFixedPoint)-1'), 'NFP60_EXP_DOWN', 'NFP50_EMPTY'))][SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp60_cons_dir'), '(CFixedPoint)1'), 'NFP60_CONS_UP', SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp60_cons_dir'), '(CFixedPoint)-1'), 'NFP60_CONS_DOWN', 'NFP50_EMPTY'))]모두 이 공급 소식을 따라온 기간에 일어난 변화다. 그 가운데 하나를 시장의 유일한 구원자로 꼽는 것은 지나치게 대담하겠다. "
 NFP60_SUP_DETAILS:0 "[Localize(ScriptContainer.MakeScope.Var('nfp60_previous_metrics').GetFlagName)]\n상세 무역 기록 시작 월 지수 [ScriptContainer.GetVariableValue('nfp60_s_start')|0], 기록 불완전 여부 [ScriptContainer.GetVariableValue('nfp60_s_partial')|0].\n시장 생산량 [ScriptContainer.GetVariableValue('nfp60_s_prod_before')|2] → [ScriptContainer.GetVariableValue('nfp60_s_prod_after')|2]\n시장 소비량 [ScriptContainer.GetVariableValue('nfp60_s_cons_before')|2] → [ScriptContainer.GetVariableValue('nfp60_s_cons_after')|2]\n시장 유입량 [ScriptContainer.GetVariableValue('nfp60_s_imp_before')|2] → [ScriptContainer.GetVariableValue('nfp60_s_imp_after')|2]\n시장 유출량 [ScriptContainer.GetVariableValue('nfp60_s_exp_before')|2] → [ScriptContainer.GetVariableValue('nfp60_s_exp_after')|2]\n가격 [ScriptContainer.GetVariableValue('nfp60_s_price_before')|2] → [ScriptContainer.GetVariableValue('nfp60_s_price_after')|2]. 시장 전체의 물량이며 반드시 독자 국가의 국내 생산량은 아니다."
 NFP60_SUP_UNKNOWN:0 "종전의 우려는 사라졌지만 생산과 무역의 상세 기록은 아직 그 까닭을 설명해 주지 못한다. "
 NFP61_CAP_DOWN:0 "흥미롭게도 그동안 운송망의 그릇이 커진 것은 아니다. 오히려 수용 능력은 줄었다. 변화를 기반 시설 확장 하나로 설명할 수는 없다는 뜻이다. "
 NFP61_CAP_UP:0 "관측하는 동안 운송망 자체에 더 큰 여유가 생겼다. 경제에 자리를 더 마련해 준 셈이다. 기뻐할 틈도 없이 그 자리가 다시 꽉 차지는 않았으면 한다. "
 NFP61_CAUSES:0 "[SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp60_components_known'), '(CFixedPoint)1'), 'NFP61_COMPONENTS', 'NFP61_UNKNOWN')][SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp60_st_partial'), '(CFixedPoint)1'), 'NFP61_PARTIAL', 'NFP50_EMPTY')]"
 NFP61_COMPONENTS:0 "[SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp60_cap_dir'), '(CFixedPoint)1'), 'NFP61_CAP_UP', SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp60_cap_dir'), '(CFixedPoint)-1'), 'NFP61_CAP_DOWN', 'NFP50_EMPTY'))][SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp60_usage_dir'), '(CFixedPoint)1'), 'NFP61_LOAD_UP', SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp60_usage_dir'), '(CFixedPoint)-1'), 'NFP61_LOAD_DOWN', 'NFP50_EMPTY'))]"
 NFP61_END:0 "이 지역에서 반가운 소식이 왔다. 늘 하던 불평을 이어 가려고 굳이 꿍꿍이를 찾을 생각은 없다. 경제가 한숨 돌릴 수 있게 됐으니 기뻐할 만하다.\n\n이 여유가 얼마나 갈지 두고 보겠다. 다음에는 이 지역이 또 무엇을 감당하지 못했나 하는 소식보다 무엇을 생산하는가 하는 소식을 싣고 싶다.\n\n비좁아도 정만 있으면 산다는 말이 있다. 그래도 조금 널찍하면 역시 더 좋다."
 NFP61_EVENTS:0 "[SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp60_rail_work'), '(CFixedPoint)1'), 'NFP61_RAIL_WORK', 'NFP50_EMPTY')][SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp60_port_work'), '(CFixedPoint)1'), 'NFP61_PORT_WORK', 'NFP50_EMPTY')][SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp60_urban_work'), '(CFixedPoint)1'), 'NFP61_URBAN_WORK', 'NFP50_EMPTY')][SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp60_rail_pm_seen'), '(CFixedPoint)1'), 'NFP61_RAIL_PM', 'NFP50_EMPTY')][SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp60_port_pm_seen'), '(CFixedPoint)1'), 'NFP61_PORT_PM', 'NFP50_EMPTY')][SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp60_urban_pm_seen'), '(CFixedPoint)1'), 'NFP61_URBAN_PM', 'NFP50_EMPTY')]$NFP61_PM_END_SELECT$[SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp60_st_rail_staffup'), '(CFixedPoint)1'), 'NFP61_RAIL_STAFF', 'NFP50_EMPTY')][SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp60_st_port_staffup'), '(CFixedPoint)1'), 'NFP61_PORT_STAFF', 'NFP50_EMPTY')]$NFP61_STAFF_END_SELECT$보시다시피 변화는 있었다. 어느 하나에 모든 공을 돌리지는 않겠다. 같은 때에 일어나는 일과 실제로 문제를 해결하는 일은 다르다."
 NFP61_FACT:0 "[SelectLocalization(And(ScriptContainer.MakeScope.Var('nfp20_problem_state').IsSet, ScriptContainer.MakeScope.Var('nfp20_problem_state').GetState.IsValid), 'NFP40_STATE_LINK', 'NFP40_REGION_FALLBACK')]의 이야기다. 전에는 이곳의 기반 시설이 감당할 수 있는 것보다 더 많은 일을 지고 있다고 썼다. 이제는 있는 시설로도 충분하다는 소식이다. 이미 신문 한 자리를 차지했던 문제가 마침내 좋은 소식에 자리를 내줬다."
 NFP61_INTRO:0 "좋은 일에는 금세 익숙해진다. 새 사업장이 들어설 때마다 ‘여기 기반 시설이 견딜까?’ 하고 묻지 않아도 경제가 돌아가는 일처럼. 나쁜 일도 어느새 잊고 지낼 수 있다. 과부하는 그대로고, 일은 되는 대로 흘러가고, 다음 달 소식은 지난달과 다를 바 없고…. 그런데 이번에는 다르다. 그것도 좋은 쪽으로."
 NFP61_LOAD_DOWN:0 "그동안 운송망에 걸린 부담도 줄었다. 비좁음을 덜 방법은 둘이다. 자리를 넓히거나 예전만큼 많은 일을 밀어 넣지 않는 것이다. 두 번째 방법도 효과가 있다. 다만 왜 할 일이 줄었는지까지 설명해 주지는 않는다. "
 NFP61_LOAD_UP:0 "그동안 부담도 오히려 늘었다. 수요가 줄어서 경제가 덜 비좁아진 것만은 아니라는 뜻이다. 운송망이 할 일은 늘었는데 종전의 과부하는 사라졌다. "
 NFP61_PARTIAL:0 "세세한 기록이 있는 것은 이 이야기의 일부뿐이다. 시작은 관측 기간 밖에 있으므로 최종적인 설명을 서두르지는 않겠다. "
 NFP61_PM_END:0 "변화에 늘 새 시설이 필요한 것은 아니다. 이미 있는 시설을 어떻게 쓰는지도 살펴볼 만하다. "
 NFP61_PM_END_SELECT:0 "[SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp60_rail_pm_seen'), '(CFixedPoint)1'), 'NFP61_PM_END', 'NFP61_PORT_PM_END_SELECT')]"
 NFP61_PORT_PM:0 "항구에서는 운영 방식을 바꿨다. "
 NFP61_PORT_PM_END_SELECT:0 "[SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp60_port_pm_seen'), '(CFixedPoint)1'), 'NFP61_PM_END', 'NFP61_URBAN_PM_END_SELECT')]"
 NFP61_PORT_STAFF:0 "관측한 항구에서 채워진 일자리의 비중이 늘었다. "
 NFP61_PORT_STAFF_END_SELECT:0 "[SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp60_st_port_staffup'), '(CFixedPoint)1'), 'NFP61_STAFF_END', 'NFP50_EMPTY')]"
 NFP61_PORT_WORK:0 "항구에서 공사가 마무리됐다. 자기 역량이 비좁았던 지역이라면 눈여겨볼 변화다. "
 NFP61_RAIL_PM:0 "철도에서는 운영 방식을 바꿨다. "
 NFP61_RAIL_STAFF:0 "관측한 철도에서 채워진 일자리의 비중이 늘었다. "
 NFP61_RAIL_WORK:0 "그동안 이 지역에서 철도의 건설 또는 확장 공사가 끝났다. 적어도 여기에서는 철로 이야기에 실제 철로가 뒤따랐다. "
 NFP61_REMAINING:0 "다만 별개의 어려움이 남았다. 이 지역과 공동 시장 사이의 연결은 아직 온전하지 않다. 기반 시설이 현재의 부담을 감당한다는 것이 무역의 모든 길이 열렸다는 뜻은 아니다. 하나는 해결했다. 축하하다 옆의 문제까지 놓치지는 말아야겠다."
 NFP61_STAFF_END:0 "짓는 것은 절반의 일이다. 일할 사람이 있어야 한다. "
 NFP61_STAFF_END_SELECT:0 "[SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp60_st_rail_staffup'), '(CFixedPoint)1'), 'NFP61_STAFF_END', 'NFP61_PORT_STAFF_END_SELECT')]"
 NFP61_TITLE:0 "비좁던 곳에 숨통이 트이다"
 NFP61_UNKNOWN:0 "좋아진 것은 보이는데 우리가 가진 자료로 까닭을 설명하기는 아직 어렵다. 예전 곤란의 책임자와 지금 성공의 주인공을 바로 짚을 수 있다면 편하겠다. 편리함이 증거는 아니다. "
 NFP61_URBAN_PM:0 "도심지에서도 운영 방식을 바꿨다. "
 NFP61_URBAN_PM_END_SELECT:0 "[SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp60_urban_pm_seen'), '(CFixedPoint)1'), 'NFP61_PM_END', 'NFP50_EMPTY')]"
 NFP61_URBAN_WORK:0 "도심지 역시 확장됐다. 큰 수송망이 지도에서 잘 보이기는 하지만 한 지역의 하루가 장거리 수송만으로 돌아가지는 않는다. "
 NFP62_CAP_DOWN:0 "그동안 기반 시설 자체의 수용 능력은 줄었다. 그러니 단순히 자리가 넓어졌다는 설명은 맞지 않는다. 시장 연결은 나아졌지만 성공한 공사 하나로 끝나는 이야기는 아닌 모양이다. "
 NFP62_CAP_UP:0 "그동안 이 지역 기반 시설의 수용 능력이 늘었다. 여력도 생기고 시장 연결도 나아진 좋은 조합이다. 모든 공을 여기에 돌리기는 이르지만 그냥 지나치기도 어려운 변화다. "
 NFP62_CAUSES:0 "[SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp60_components_known'), '(CFixedPoint)1'), 'NFP62_COMPONENTS', 'NFP62_UNKNOWN')][SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp60_st_partial'), '(CFixedPoint)1'), 'NFP62_PARTIAL', 'NFP50_EMPTY')]"
 NFP62_COMPONENTS:0 "[SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp60_cap_dir'), '(CFixedPoint)1'), 'NFP62_CAP_UP', SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp60_cap_dir'), '(CFixedPoint)-1'), 'NFP62_CAP_DOWN', 'NFP50_EMPTY'))][SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp60_usage_dir'), '(CFixedPoint)1'), 'NFP62_LOAD_UP', SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp60_usage_dir'), '(CFixedPoint)-1'), 'NFP62_LOAD_DOWN', 'NFP50_EMPTY'))]"
 NFP62_END:0 "전에는 지도에서 우리 땅인데도 공동 시장이 먼 곳처럼 느껴질 때가 있었다. 이제 둘 사이의 장애물이 줄었다. 나라 경제에 좋은 변화다. 장을 보러 나온 사람도 그 변화를 느끼게 되기를 바란다.\n\n뒷이야기를 지켜보겠다. 공동 시장이란 것은 왜 또 닿을 수 없는지 해명을 들으며 논하기보다 물건을 사면서 논하는 편이 낫다."
 NFP62_EVENTS:0 "[SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp60_rail_work'), '(CFixedPoint)1'), 'NFP62_RAIL_WORK', 'NFP50_EMPTY')][SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp60_port_work'), '(CFixedPoint)1'), 'NFP62_PORT_WORK', 'NFP50_EMPTY')][SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp60_urban_work'), '(CFixedPoint)1'), 'NFP62_URBAN_WORK', 'NFP50_EMPTY')][SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp60_rail_pm_seen'), '(CFixedPoint)1'), 'NFP62_RAIL_PM', 'NFP50_EMPTY')][SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp60_port_pm_seen'), '(CFixedPoint)1'), 'NFP62_PORT_PM', 'NFP50_EMPTY')][SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp60_urban_pm_seen'), '(CFixedPoint)1'), 'NFP62_URBAN_PM', 'NFP50_EMPTY')]$NFP62_PM_END_SELECT$[SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp60_st_rail_staffup'), '(CFixedPoint)1'), 'NFP62_RAIL_STAFF', 'NFP50_EMPTY')][SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp60_st_port_staffup'), '(CFixedPoint)1'), 'NFP62_PORT_STAFF', 'NFP50_EMPTY')]$NFP62_STAFF_END_SELECT$모두 우리가 이 지역을 관측하던 동안 일어난 일이다. 어느 변화가 가장 도움이 됐는지는 아직 확인되지 않았다. 시기가 겹친다는 사실은 살펴볼 이유이지 공로자 명단은 아니다."
 NFP62_FACT:0 "[SelectLocalization(And(ScriptContainer.MakeScope.Var('nfp20_problem_state').IsSet, ScriptContainer.MakeScope.Var('nfp20_problem_state').GetState.IsValid), 'NFP40_STATE_LINK', 'NFP40_REGION_FALLBACK')]의 최근 소식이다. 예전의 공동 시장 접근 차질이 가라앉았다. 가게마다 물건이 싸고 다양해지리라는 약속은 아직 아니다. 다만 이제 이 지역은 나라의 경제를 훨씬 온전히 이용할 수 있다. ‘공동’이라는 말이 제 뜻에 조금 더 가까워졌다."
 NFP62_INTRO:0 "‘나라 안에 있다’와 ‘여기서 판다’ 사이가 때로 지나치게 멀다. 그 거리를 이정표로 잴 수만 있는 것도 아니다. 지도에서는 가깝고 국경도 우리 것이며 경제도 함께 꾸리는데, 그 경제를 온전히 이용하지 못한다. 우리는 앞서 이 어려움을 썼다. 이제는 다른 기분으로 그 이야기로 돌아갈 이유가 생겼다."
 NFP62_LOAD_DOWN:0 "운송망에 걸린 부담이 줄었다. 지역에서 수송과 그 밖의 경제적 필요를 감당하기가 전보다 쉬워졌을 수 있다. 왜 부담이 줄었는지는 별개의 물음이다. 그 감소를 무조건 승리로 기록하기는 이르다. "
 NFP62_LOAD_UP:0 "반대로 운송망의 부담은 커졌다. 경제적 수요가 줄어드는 가운데 접근성이 나아진 것은 아니라는 뜻이다. 일은 늘고 종전의 문제는 물러섰다. 무엇이 그 일을 가능하게 했는지 더 궁금해진다. "
 NFP62_PARTIAL:0 "다만 우리는 이야기가 이미 진행 중일 때 세세한 관측을 시작했다. 그 전의 길은 기록에 없다. 나중에 본 것만으로 전체 결과를 설명한다면 지나치게 편리한 해석이 될 것이다. "
 NFP62_PM_END:0 "새 공사 없이도 변화는 생긴다. 무엇을 지었는지만큼이나 그것을 어떻게 쓰는지도 중요하다. "
 NFP62_PM_END_SELECT:0 "[SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp60_rail_pm_seen'), '(CFixedPoint)1'), 'NFP62_PM_END', 'NFP62_PORT_PM_END_SELECT')]"
 NFP62_PORT_PM:0 "항구에서는 운영 방식을 바꿨다. "
 NFP62_PORT_PM_END_SELECT:0 "[SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp60_port_pm_seen'), '(CFixedPoint)1'), 'NFP62_PM_END', 'NFP62_URBAN_PM_END_SELECT')]"
 NFP62_PORT_STAFF:0 "관측한 항구에서 채워진 일자리의 비중이 늘었다. "
 NFP62_PORT_STAFF_END_SELECT:0 "[SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp60_st_port_staffup'), '(CFixedPoint)1'), 'NFP62_STAFF_END', 'NFP50_EMPTY')]"
 NFP62_PORT_WORK:0 "항구에서 공사가 마무리됐다. 지역과 나라의 다른 곳을 잇는 길을 생각하면 주목할 만하다. 물론 완공된 항구 하나가 수송의 사연을 전부 말해 주지는 않는다. "
 NFP62_RAIL_PM:0 "철도에서는 운영 방식을 바꿨다. "
 NFP62_RAIL_STAFF:0 "관측한 철도에서 채워진 일자리의 비중이 늘었다. "
 NFP62_RAIL_WORK:0 "관측 기간에 이 지역에서는 철도의 건설 또는 확장 공사가 끝났다. 공동 경제와의 연결을 묻던 예전의 물음 곁에 손에 잡히는 변화가 생겼다. 철도가 전보다 많은 일을 할 수 있게 됐다. "
 NFP62_REMAINING:0 "한 가지 곤란은 남았다. 이 지역의 기반 시설은 여전히 과부하 상태다. 시장 접근성은 나아졌지만 운송망 내부까지 여유로워진 것은 아니다. 좋은 소식이 없어지는 것은 아니다. 다만 옆의 문제까지 함께 해결됐다고 하기에는 이르다."
 NFP62_STAFF_END:0 "시설은 아직 스스로를 운영하는 법을 배우지 못했다. 이 이야기에서 일하는 사람들은 중요한 대목이다. "
 NFP62_STAFF_END_SELECT:0 "[SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp60_st_rail_staffup'), '(CFixedPoint)1'), 'NFP62_STAFF_END', 'NFP62_PORT_STAFF_END_SELECT')]"
 NFP62_TITLE:0 "우리 땅, 그리고 우리 시장"
 NFP62_UNKNOWN:0 "기반 시설과 부담에 관한 기록에는 아직 분명한 설명이 보이지 않는다. 좋아진 일은 있다. 누구에게 고마워해야 하는지는 아직 모른다. 경기가 어땠는지 알기도 전에 우승자를 정하지는 말자. "
 NFP62_URBAN_PM:0 "도심지에서도 운영 방식을 바꿨다. "
 NFP62_URBAN_PM_END_SELECT:0 "[SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp60_urban_pm_seen'), '(CFixedPoint)1'), 'NFP62_PM_END', 'NFP50_EMPTY')]"
 NFP62_URBAN_WORK:0 "도심지도 확장됐다. 증기 기관차나 큰 배처럼 눈에 띄는 모습은 아니더라도 지역의 생활이 장거리 수송만으로 이루어지는 것은 아니다. "
 NFP63_ALLY:0 "우리 동맹국 이야기다. 파트너에게 무슨 일이 일어나고 있는지 알면 공동의 약속을 뒷받침하기도 수월하다. 그 나라가 무엇을 할 수 있는지 눈여겨볼 까닭이다."
 NFP63_ATT_1:0 " 이 나라 정부는 우리에게 비우호적이다. 그러니 헛된 기대는 덜고 보자. 저쪽에서 친절한 해명까지 준비해 줄 것이라 기대하기는 어렵다."
 NFP63_ATT_10:0 " 이 종속국은 우리에게 충성스러운 태도를 보인다. 그렇다면 그들 자신의 걱정을 하찮게 여길 까닭은 더더욱 없다."
 NFP63_ATT_11:0 " 이 종속국에서는 예속에서 벗어나려는 뜻이 보인다. 그래서 그 소식을 더 자세히 읽을 필요가 있다. 늘 조용했으니 앞으로도 괜찮으리라는 생각은 이제 좋은 조언이 아니다."
 NFP63_ATT_2:0 " 우리를 대하는 태도에는 호전적인 기색이 있다. 남의 일을 비웃는 편이 그 여파가 우리 국경에 닿았을 때 사정을 파악하는 것보다는 쉬운 법이다."
 NFP63_ATT_3:0 " 저쪽에서는 우리나라를 종속시키려 한다. 이웃을 위한다는 마음에도 여러 종류가 있다. 이런 배려라면 작은 글씨로 붙은 조건까지 읽어 보는 편이 좋겠다."
 NFP63_ATT_4:0 " 그들은 우리를 경계한다. 서로의 추측을 이미 알려진 계획처럼 내놓기보다는 실제 사건에 비춰 확인하는 편이 유익하다."
 NFP63_ATT_5:0 " 그곳에서는 아직 우리나라에 특별한 관심을 보이지 않는다. 그들의 소식이 무의미해지는 것은 아니지만 매 줄마다 우리에게 보내는 숨은 뜻을 찾을 필요도 없다."
 NFP63_ATT_6:0 " 그들은 우리와 화해할 뜻을 보인다. 매번 외교적 빈정거림을 꺼내 들지 않고 변화를 지켜볼 좋은 기회다."
 NFP63_ATT_7:0 " 이 나라 정부는 우리와 협력하고자 한다. 좋은 마음 뒤에 함께 처리할 일도 생기면 반갑겠다."
 NFP63_ATT_8:0 " 저쪽은 우리에게 호의적이다. 으레 덧붙이던 가시 돋친 한마디쯤은 생략해도 사실의 날이 무뎌지지는 않는다."
 NFP63_ATT_9:0 " 그들은 우리의 후견인으로 나설 준비가 돼 있다. 반가운 호의지만 보살핌을 받는 일과 스스로 정할 수 있는 일의 경계는 구별해 둘 만하다."
 NFP63_BAND_NEG1:0 "양국 관계가 썩 만족스럽지는 않다. 비웃음을 섞으면 읽는 재미는 있을지 몰라도 실제로 무슨 일이 벌어지는지 설명할 수는 없다."
 NFP63_BAND_NEG2:0 "양국 관계는 냉랭하다. 이 소식에 붙일 따뜻한 말은 적지만 유심히 들여다볼 이유는 충분하다."
 NFP63_BAND_NEG3:0 "양국 관계는 노골적으로 적대적이다. 우리 편집부에 찬사를 기대하는 이도 드물 것이다. 하지만 호감이 없다고 사실이 달라지지는 않는다."
 NFP63_BAND_POS1:0 "양국 관계는 차분히 이야기할 만하다. 남의 나라에 변화가 생길 때마다 미리 꿍꿍이를 찾는 습관은 내려놓아도 좋겠다."
 NFP63_BAND_POS2:0 "양국 관계는 좋다. 그곳 소식에 호의를 담아 귀를 기울일 수 있어 반갑다. 물론 우정이 사건을 살피는 일을 대신해 주지는 않는다."
 NFP63_BAND_POS3:0 "양국 관계는 유난히 돈독하다. 좋은 말을 건넬 계기가 더 많아졌으면 한다. 궂은 소식이라면 그만큼 더 유심히 볼 일이다."
 NFP63_BAND_ZERO:0 "양국 사이에 별다른 온기도 드러난 적의도 없다. 외교적 말다툼부터 시작하지 않고 소식 자체를 살펴볼 수 있겠다."
 NFP63_BLOC:0 "우리와 같은 세력 블록의 나라다. 사건이 벌어진 곳이 멀어도 이런 변화는 우리가 함께 속한 외교권에 닿는다."
 NFP63_CLOSING:0 "$NFP63_EDITORIAL$\n\n[Localize(ScriptContainer.MakeScope.Var('nfp63_closing').GetFlagName)]"
 NFP63_DETAILS:0 "편집부의 선정 기준 [SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp63_reason'), '(CFixedPoint)0'), 'NFP63_REASON_0', 'NFP50_EMPTY')][SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp63_reason'), '(CFixedPoint)1'), 'NFP63_REASON_1', 'NFP50_EMPTY')][SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp63_reason'), '(CFixedPoint)2'), 'NFP63_REASON_2', 'NFP50_EMPTY')][SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp63_reason'), '(CFixedPoint)3'), 'NFP63_REASON_3', 'NFP50_EMPTY')][SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp63_reason'), '(CFixedPoint)4'), 'NFP63_REASON_4', 'NFP50_EMPTY')][SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp63_reason'), '(CFixedPoint)5'), 'NFP63_REASON_5', 'NFP50_EMPTY')][SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp63_reason'), '(CFixedPoint)6'), 'NFP63_REASON_6', 'NFP50_EMPTY')][SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp63_reason'), '(CFixedPoint)7'), 'NFP63_REASON_7', 'NFP50_EMPTY')].\n편집부 기준 등급: 독자 국가 [ScriptContainer.GetVariableValue('nfp63_reader_tier')|0], 소식의 당사국 [ScriptContainer.GetVariableValue('nfp63_source_tier')|0], 상대국 [ScriptContainer.GetVariableValue('nfp63_second_tier')|0]. 우선순위 가산 [ScriptContainer.GetVariableValue('nfp63_bonus')|0], 기술의 신규성 [ScriptContainer.GetVariableValue('nfp63_novel')|0], 법률의 차이 [ScriptContainer.GetVariableValue('nfp63_different_law')|0].\n당사국과의 연결 [ScriptContainer.GetVariableValue('nfp63_relation')|0], 상대국과의 연결 [ScriptContainer.GetVariableValue('nfp63_second_relation')|0], 관계 [ScriptContainer.GetVariableValue('nfp63_friend')|0]. 근거와 어조는 접수 시점에 저장되며 보관함은 현재 외교 상태를 다시 읽지 않는다.\n당사국에서 독자 국가를 본 관계 수치 [ScriptContainer.GetVariableValue('nfp63_relation_value')|0], 구간 [ScriptContainer.GetVariableValue('nfp63_relation_band')|0], AI 태도 [ScriptContainer.GetVariableValue('nfp63_attitude')|0]. 상대국은 관계 [ScriptContainer.GetVariableValue('nfp63_secondary_relation_value')|0], 구간 [ScriptContainer.GetVariableValue('nfp63_secondary_relation_band')|0], AI 태도 [ScriptContainer.GetVariableValue('nfp63_secondary_attitude')|0]. 태도 값 0은 확인된 기록이 없다는 뜻이며 플레이어가 중립적인 의도를 품었다는 뜻은 아니다."
 NFP63_DOMESTIC_REASON:0 "국내 소식을 위해 확보한 자리"
 NFP63_EDITORIAL:0 "[SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp63_relation'), '(CFixedPoint)1'), 'NFP63_SECOND_TONE', 'NFP63_TONE')]"
 NFP63_NEIGHBOR:0 "우리 이웃에서 벌어지는 일이다. 지도에 국경선을 긋기는 쉬워도 남의 나라 변화에서 나온 여파까지 그 선을 따르리란 법은 없다."
 NFP63_NEUTRAL:0 "이 나라의 사정은 성급한 찬사도 그만큼 성급한 조롱도 없이 지켜볼 만하다. 남의 변화에서 눈여겨볼 대목은 무엇보다 실제로 무엇이 달라졌는가에 있다."
 NFP63_OVERLORD:0 "우리나라가 의존하는 나라에서 온 소식이다. 그러니 단지 신기한 외국 이야기처럼 읽고 넘기기에는 마음을 너무 놓는 셈이다."
 NFP63_REASON_0:0 "종전 방식 또는 특별 배달 경로"
 NFP63_REASON_1:0 "우리나라 또는 직접 참여"
 NFP63_REASON_2:0 "세계적 규모의 사건"
 NFP63_REASON_3:0 "열강의 전략적 변화"
 NFP63_REASON_4:0 "동맹국, 세력 블록 구성국, 종속국 또는 종주국의 전략적 변화"
 NFP63_REASON_5:0 "경쟁국의 전략적 변화"
 NFP63_REASON_6:0 "접경국에서 일어난 분쟁"
 NFP63_REASON_7:0 "독자 국가의 지역 이해관계와 편집부 기준 국가 등급"
 NFP63_RIVAL:0 "우리 경쟁국 이야기다. 일어난 일을 가볍게 넘길 수는 있다. 다만 그렇게 한다고 그 일이 중요성을 잃은 척하기는 좀 더 어렵다."
