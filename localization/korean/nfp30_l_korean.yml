 NFP30_PRICE_BODY_1:0 "이번 호에 실을 조건에 맞는 새 기사가 없었다. 편집부가 다음 소식을 기다리는 동안 정례 시세표를 전한다.\n\n[SelectLocalization(GreaterThan_CFixedPoint(ScriptContainer.GetVariableValue('nfp32_rows'), '(CFixedPoint)0'), 'NFP30_PRICE_MARKET', 'NFP30_PRICE_UNAVAILABLE')]\n\n[Localize(ScriptContainer.MakeScope.Var('nfp32_row_1').GetFlagName)]\n[Localize(ScriptContainer.MakeScope.Var('nfp32_row_2').GetFlagName)]\n[Localize(ScriptContainer.MakeScope.Var('nfp32_row_3').GetFlagName)]\n[Localize(ScriptContainer.MakeScope.Var('nfp32_row_4').GetFlagName)]\n[Localize(ScriptContainer.MakeScope.Var('nfp32_row_5').GetFlagName)]\n[Localize(ScriptContainer.MakeScope.Var('nfp32_row_6').GetFlagName)]\n\n[SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp32_comparisons'), '(CFixedPoint)0'), 'NFP30_PRICE_FIRST', 'NFP30_PRICE_METHOD')]"
 NFP30_PRICE_BODY_2:0 "이번 호의 뉴스 지면을 채울 기사가 없었다. 그 자리는 늘 그렇듯 시장 소식이 지킨다.\n\n[SelectLocalization(GreaterThan_CFixedPoint(ScriptContainer.GetVariableValue('nfp32_rows'), '(CFixedPoint)0'), 'NFP30_PRICE_MARKET', 'NFP30_PRICE_UNAVAILABLE')]\n\n[Localize(ScriptContainer.MakeScope.Var('nfp32_row_1').GetFlagName)]\n[Localize(ScriptContainer.MakeScope.Var('nfp32_row_2').GetFlagName)]\n[Localize(ScriptContainer.MakeScope.Var('nfp32_row_3').GetFlagName)]\n[Localize(ScriptContainer.MakeScope.Var('nfp32_row_4').GetFlagName)]\n[Localize(ScriptContainer.MakeScope.Var('nfp32_row_5').GetFlagName)]\n[Localize(ScriptContainer.MakeScope.Var('nfp32_row_6').GetFlagName)]\n\n[SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp32_comparisons'), '(CFixedPoint)0'), 'NFP30_PRICE_FIRST', 'NFP30_PRICE_METHOD')]"
