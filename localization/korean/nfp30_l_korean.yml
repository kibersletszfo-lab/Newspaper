 NFP50_LAW_INTRO_AWAY_1:0 "외국에서 법이 바뀌었다. 안전한 거리에서 남의 제도를 논하기는 쉽다. 하지만 이런 소식이 우리 제도도 살펴보게 만들 때가 있다. 우리는 무엇이 다르고 그 차이에 만족하고 있는가?"
 NFP50_LAW_INTRO_AWAY_2:0 "외국에서 법이 바뀌었다. 안전한 거리에서 남의 제도를 논하기는 쉽다. 하지만 이런 소식이 우리 제도도 살펴보게 만들 때가 있다. 우리는 무엇이 다르고 그 차이에 만족하고 있는가?"
 NFP50_LAW_INTRO_HOME_1:0 "우리나라에서 법이 바뀌었다. 나라의 규칙이 모두를 똑같이 만족시키는 일은 드물다. 누군가에게 문을 열어 주는 규칙이 다른 누군가에게는 이제 열쇠가 자기 손에 없음을 일깨운다. 무엇이 달라졌으며 누가 법전의 새 줄을 반겼는지 살펴보자."
 NFP50_LAW_INTRO_HOME_2:0 "우리나라에서 법이 바뀌었다. 나라의 규칙이 모두를 똑같이 만족시키는 일은 드물다. 누군가에게 문을 열어 주는 규칙이 다른 누군가에게는 이제 열쇠가 자기 손에 없음을 일깨운다. 무엇이 달라졌으며 누가 법전의 새 줄을 반겼는지 살펴보자."
 NFP50_LAW_MEANING_LAW_COMPULSORY_PRIMARY_SCHOOL_1:0 "어린이에게 배움이 의무가 되고 아동 노동이 제한된다. 법은 학교 교육을 넓힐 길을 연다. 그 뒤에 있는 기회는 분명하다. 일하는 법만 아는 대신 글도 읽으며 어른의 삶을 시작할 수 있다. 다만 종이 위의 의무 교육과 실제 책상 자리 사이에는 학교와 그 비용이 필요하다. 법령이 엄격하다고 글자가 저절로 머릿속에 들어가지는 않는다."
 NFP50_LAW_MEANING_LAW_COMPULSORY_PRIMARY_SCHOOL_2:0 "어린이에게 배움이 의무가 되고 아동 노동이 제한된다. 법은 학교 교육을 넓힐 길을 연다. 그 뒤에 있는 기회는 분명하다. 일하는 법만 아는 대신 글도 읽으며 어른의 삶을 시작할 수 있다. 다만 종이 위의 의무 교육과 실제 책상 자리 사이에는 학교와 그 비용이 필요하다. 법령이 엄격하다고 글자가 저절로 머릿속에 들어가지는 않는다."
 NFP50_LAW_MEANING_LAW_GUARANTEED_LIBERTIES_1:0 "자유를 보장하는 규정이 국내 치안 권력에 한계를 두었다. 질서를 돌보는 일도 주민의 권리를 감안해야 한다. 편리한 통설과 다른 의견을 가진 이라면 특히 기억할 만하다. 많은 것이 이제 내무 기관의 업무에 달렸다. 자유에 관한 아름다운 약속은 인쇄된 지면 밖에서도 어울리는 뒷이야기를 받을 만하다."
 NFP50_LAW_MEANING_LAW_GUARANTEED_LIBERTIES_2:0 "자유를 보장하는 규정이 국내 치안 권력에 한계를 두었다. 질서를 돌보는 일도 주민의 권리를 감안해야 한다. 편리한 통설과 다른 의견을 가진 이라면 특히 기억할 만하다. 많은 것이 이제 내무 기관의 업무에 달렸다. 자유에 관한 아름다운 약속은 인쇄된 지면 밖에서도 어울리는 뒷이야기를 받을 만하다."
 NFP50_LAW_MEANING_LAW_PROTECTED_SPEECH_1:0 "자유로운 발언이 법의 보호를 얻었다. 국가는 어떤 사회 운동을 억누르고 다른 운동을 밀어 주던 종전의 수단을 잃는다. 논쟁에서는 중요한 변화다. 이제 금지의 편리함으로 주장의 설득력을 대체하기가 더 어렵다. 말할 공간이 넓어진 만큼 생각도 많아지면 좋겠다."
 NFP50_LAW_MEANING_LAW_PROTECTED_SPEECH_2:0 "자유로운 발언이 법의 보호를 얻었다. 국가는 어떤 사회 운동을 억누르고 다른 운동을 밀어 주던 종전의 수단을 잃는다. 논쟁에서는 중요한 변화다. 이제 금지의 편리함으로 주장의 설득력을 대체하기가 더 어렵다. 말할 공간이 넓어진 만큼 생각도 많아지면 좋겠다."
 NFP50_LAW_MEANING_LAW_SLAVERY_BANNED_1:0 "노예제가 더는 합법으로 인정되지 않는다. 사람이 남의 재산이기를 그친다. 문서 몇 글자가 고쳐졌을 뿐이라고 말하기 어려운 변화다. 자유 하나로 소득이나 사회적 평등까지 생기지는 않는다. 그러나 적어도 이제 남을 제 집안 물건처럼 마음대로 처분하는 일은 법으로 허용되지 않는다."
 NFP50_LAW_MEANING_LAW_SLAVERY_BANNED_2:0 "노예제가 더는 합법으로 인정되지 않는다. 사람이 남의 재산이기를 그친다. 문서 몇 글자가 고쳐졌을 뿐이라고 말하기 어려운 변화다. 자유 하나로 소득이나 사회적 평등까지 생기지는 않는다. 그러나 적어도 이제 남을 제 집안 물건처럼 마음대로 처분하는 일은 법으로 허용되지 않는다."
 NFP50_LAW_MEANING_LAW_WOMENS_SUFFRAGE_1:0 "여성들이 정치 생활에 참여할 권리가 넓어졌다. 이제 온 국민이 남성뿐인 양 나라의 미래를 논하기는 한결 어렵다. 새 권리가 구체적으로 어떻게 작용할지는 선거 제도에도 달려 있다. 하지만 누가 공동의 일을 정할 수 있는지에 대한 익숙한 생각을 돌아볼 이유는 이미 생겼다."
 NFP50_LAW_MEANING_LAW_WOMENS_SUFFRAGE_2:0 "여성들이 정치 생활에 참여할 권리가 넓어졌다. 이제 온 국민이 남성뿐인 양 나라의 미래를 논하기는 한결 어렵다. 새 권리가 구체적으로 어떻게 작용할지는 선거 제도에도 달려 있다. 하지만 누가 공동의 일을 정할 수 있는지에 대한 익숙한 생각을 돌아볼 이유는 이미 생겼다."
 NFP50_LAW_MOVEMENT_BASE_1:0 "사회 운동에도 저마다의 선호가 있다. [SelectLocalization(GreaterThan_CFixedPoint(ScriptContainer.GetVariableValue('nfp50_law_move_yes_present'), '(CFixedPoint)0'), 'NFP50_LAW_MOVE_YES', 'NFP50_LAW_NO_MOVE')] [SelectLocalization(GreaterThan_CFixedPoint(ScriptContainer.GetVariableValue('nfp50_law_move_no_present'), '(CFixedPoint)0'), 'NFP50_LAW_MOVE_NO', 'NFP50_LAW_NO_MOVE')] 그 입장을 보면 누가 이 법을 반기고 누가 목에 걸린 가시처럼 여기는지 알 수 있다. 누가 실제로 법을 통과시켰는지는 따로 살필 일이다."
 NFP50_LAW_MOVEMENT_BASE_2:0 "사회 운동에도 저마다의 선호가 있다. [SelectLocalization(GreaterThan_CFixedPoint(ScriptContainer.GetVariableValue('nfp50_law_move_yes_present'), '(CFixedPoint)0'), 'NFP50_LAW_MOVE_YES', 'NFP50_LAW_NO_MOVE')] [SelectLocalization(GreaterThan_CFixedPoint(ScriptContainer.GetVariableValue('nfp50_law_move_no_present'), '(CFixedPoint)0'), 'NFP50_LAW_MOVE_NO', 'NFP50_LAW_NO_MOVE')] 그 입장을 보면 누가 이 법을 반기고 누가 목에 걸린 가시처럼 여기는지 알 수 있다. 누가 실제로 법을 통과시켰는지는 따로 살필 일이다."
 NFP50_LAW_MOVEMENT_RELATIVE_1:0 "사회 운동에도 저마다의 선호가 있다. [SelectLocalization(GreaterThan_CFixedPoint(ScriptContainer.GetVariableValue('nfp50_law_move_yes_present'), '(CFixedPoint)0'), 'NFP50_LAW_MOVE_YES', 'NFP50_LAW_NO_MOVE')] [SelectLocalization(GreaterThan_CFixedPoint(ScriptContainer.GetVariableValue('nfp50_law_move_no_present'), '(CFixedPoint)0'), 'NFP50_LAW_MOVE_NO', 'NFP50_LAW_NO_MOVE')] 그 입장을 보면 누가 이 법을 반기고 누가 목에 걸린 가시처럼 여기는지 알 수 있다. 누가 실제로 법을 통과시켰는지는 따로 살필 일이다."
 NFP50_LAW_MOVEMENT_RELATIVE_2:0 "사회 운동에도 저마다의 선호가 있다. [SelectLocalization(GreaterThan_CFixedPoint(ScriptContainer.GetVariableValue('nfp50_law_move_yes_present'), '(CFixedPoint)0'), 'NFP50_LAW_MOVE_YES', 'NFP50_LAW_NO_MOVE')] [SelectLocalization(GreaterThan_CFixedPoint(ScriptContainer.GetVariableValue('nfp50_law_move_no_present'), '(CFixedPoint)0'), 'NFP50_LAW_MOVE_NO', 'NFP50_LAW_NO_MOVE')] 그 입장을 보면 누가 이 법을 반기고 누가 목에 걸린 가시처럼 여기는지 알 수 있다. 누가 실제로 법을 통과시켰는지는 따로 살필 일이다."
