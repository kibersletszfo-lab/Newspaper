 NFP52_TAIPING_1_LEAD:0 "중국에서 태평천국이 세워졌다. 대립의 한쪽에 독자적인 정치 중심이 생겼다. 물음은 이제 옛 질서에 반대하는 사람들이 무엇에 불만인가에 그치지 않는다. 그 대신 어떤 권력을 세우려는지도 물어야 한다."
 NFP52_TAIPING_1_TITLE:0 "중국에서 태평천국이 일어나다"
 NFP52_TAIPING_2_BODY:0 "중국에서 태평천국이 세워졌다. 대립의 한쪽에 독자적인 정치 중심이 생겼다. 물음은 이제 옛 질서에 반대하는 사람들이 무엇에 불만인가에 그치지 않는다. 그 대신 어떤 권력을 세우려는지도 물어야 한다.\n\n태평천국이 별개의 정치 세력으로 존재한다. 중국의 위기가 새로운 모습을 띠면서 흔히 쓰던 ‘또 한 차례의 소요’만으로는 사정을 전하기 어려워졌다. 권력에 이의를 제기하던 자리에 이제 제 몫의 자리를 요구하는 권력이 들어섰다.\n\n웅대한 포부 뒤에도 사람들의 삶은 이어진다. 대립이 어디로 흘러가고 누가 권력을 지킬지는 아직 결정되지 않았다. 본지는 사태를 지켜보겠다. 그 땅의 주민에게 지도에 생긴 변화는 외신란에 더해진 한 줄보다 훨씬 큰 일임을 기억하면서.\n\n기사의 날짜는 편집부가 소식을 확인한 달이다. 사건이 정확히 어느 날 일어났는지를 뜻하지는 않는다."
 NFP52_TAIPING_2_CONTEXT:0 "웅대한 포부 뒤에도 사람들의 삶은 이어진다. 대립이 어디로 흘러가고 누가 권력을 지킬지는 아직 결정되지 않았다. 본지는 사태를 지켜보겠다. 그 땅의 주민에게 지도에 생긴 변화는 외신란에 더해진 한 줄보다 훨씬 큰 일임을 기억하면서."
 NFP52_TAIPING_2_FACT:0 "태평천국이 별개의 정치 세력으로 존재한다. 중국의 위기가 새로운 모습을 띠면서 흔히 쓰던 ‘또 한 차례의 소요’만으로는 사정을 전하기 어려워졌다. 권력에 이의를 제기하던 자리에 이제 제 몫의 자리를 요구하는 권력이 들어섰다."
 NFP52_TAIPING_2_LEAD:0 "중국에서 태평천국이 세워졌다. 대립의 한쪽에 독자적인 정치 중심이 생겼다. 물음은 이제 옛 질서에 반대하는 사람들이 무엇에 불만인가에 그치지 않는다. 그 대신 어떤 권력을 세우려는지도 물어야 한다."
 NFP52_TAIPING_2_TITLE:0 "중국의 위기 속에 새 권력이 서다"
 NFP52_YUG_1_BODY:0 "발칸에 유고슬라비아 국가가 등장했다. 함께 살아갈 제도에 대한 구상이 정치적 형태를 얻은 것이다. 국제 정치의 셈법에 자주 오르내리던 지역인지라 특별한 의미가 있다. 이제 그 계산 속에 새 나라가 들어갔다.\n\n유고슬라비아의 성립이 확인됐다. 남슬라브 통합이 정치 지도에 자리 잡았다. 어느 땅들이 모였으며 이웃과의 관계는 어떤지 면밀히 살펴야 하지만, 종전에 알던 지역 정세를 새 기사에 그대로 옮겨 적을 수는 없게 됐다.\n\n공통된 이름은 함께할 일의 시작이다. 축하 행사가 끝나면 날마다 다른 이해관계를 맞추어 나가야 한다. 통합이 지도 제작자에게만 편리한 일이 아니기를 바란다. 사람들은 새 국경을 멀리서 바라보는 대신 그 안에서 살아야 하기 때문이다.\n\n이 소식에 적힌 날짜는 편집부가 소식을 받은 달이다. 전하는 데 시간이 걸렸다면 실제 사건은 그보다 앞서 일어났을 수 있다."
 NFP52_YUG_1_CONTEXT:0 "공통된 이름은 함께할 일의 시작이다. 축하 행사가 끝나면 날마다 다른 이해관계를 맞추어 나가야 한다. 통합이 지도 제작자에게만 편리한 일이 아니기를 바란다. 사람들은 새 국경을 멀리서 바라보는 대신 그 안에서 살아야 하기 때문이다."
