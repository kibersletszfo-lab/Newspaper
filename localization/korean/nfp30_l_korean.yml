 NFP63_SECOND_PARTNER:0 " 또 다른 주요 당사국은 동맹, 공동 세력 블록 또는 종속 관계로 우리와 연결돼 있다. 그 나라의 처지도 눈여겨볼 만하다."
 NFP63_SECOND_RELATIONS:0 "[SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp63_secondary_relation_band'), '(CFixedPoint)-3'), 'NFP63_BAND_NEG3', 'NFP50_EMPTY')][SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp63_secondary_relation_band'), '(CFixedPoint)-2'), 'NFP63_BAND_NEG2', 'NFP50_EMPTY')][SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp63_secondary_relation_band'), '(CFixedPoint)-1'), 'NFP63_BAND_NEG1', 'NFP50_EMPTY')][SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp63_secondary_relation_band'), '(CFixedPoint)0'), 'NFP63_BAND_ZERO', 'NFP50_EMPTY')][SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp63_secondary_relation_band'), '(CFixedPoint)1'), 'NFP63_BAND_POS1', 'NFP50_EMPTY')][SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp63_secondary_relation_band'), '(CFixedPoint)2'), 'NFP63_BAND_POS2', 'NFP50_EMPTY')][SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp63_secondary_relation_band'), '(CFixedPoint)3'), 'NFP63_BAND_POS3', 'NFP50_EMPTY')]"
 NFP63_SECOND_RIVAL:0 " 주요 당사국 중에는 우리의 경쟁국도 있다. 앞으로의 전개를 살펴볼 이유가 하나 더 생겼다."
 NFP63_SECOND_TONE:0 "다른 쪽 당사국에 관해서는 [ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName].\n\n[SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp63_second_relation'), '(CFixedPoint)2'), 'NFP63_SUBJECT', SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp63_second_relation'), '(CFixedPoint)3'), 'NFP63_OVERLORD', SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp63_second_relation'), '(CFixedPoint)4'), 'NFP63_ALLY', SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp63_second_relation'), '(CFixedPoint)5'), 'NFP63_BLOC', SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp63_second_relation'), '(CFixedPoint)6'), 'NFP63_RIVAL', SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp63_second_relation'), '(CFixedPoint)7'), 'NFP63_NEIGHBOR', 'NFP63_NEUTRAL'))))))]\n\n$NFP63_SECOND_RELATIONS$$NFP63_SECOND_ATTITUDE$"
 NFP63_SUBJECT:0 "우리 종속국 이야기다. 수도에서 보면 그곳의 일은 멀리서 들려오는 자잘한 사정처럼 보이기 쉽다. 현지에 사는 사람에게는 그리 멀지 않을 것이다."
 NFP63_TONE:0 "[SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp63_relation'), '(CFixedPoint)2'), 'NFP63_SUBJECT', SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp63_relation'), '(CFixedPoint)3'), 'NFP63_OVERLORD', SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp63_relation'), '(CFixedPoint)4'), 'NFP63_ALLY', SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp63_relation'), '(CFixedPoint)5'), 'NFP63_BLOC', SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp63_relation'), '(CFixedPoint)6'), 'NFP63_RIVAL', SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp63_relation'), '(CFixedPoint)7'), 'NFP63_NEIGHBOR', 'NFP63_NEUTRAL'))))))]\n\n$NFP63_TONE_RELATIONS$$NFP63_TONE_ATTITUDE$[SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp63_second_relation'), '(CFixedPoint)6'), 'NFP63_SECOND_RIVAL', 'NFP50_EMPTY')][SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp63_second_relation'), '(CFixedPoint)2'), 'NFP63_SECOND_PARTNER', 'NFP50_EMPTY')][SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp63_second_relation'), '(CFixedPoint)3'), 'NFP63_SECOND_PARTNER', 'NFP50_EMPTY')][SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp63_second_relation'), '(CFixedPoint)4'), 'NFP63_SECOND_PARTNER', 'NFP50_EMPTY')][SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp63_second_relation'), '(CFixedPoint)5'), 'NFP63_SECOND_PARTNER', 'NFP50_EMPTY')]"
 NFP63_TONE_ATTITUDE:0 "[SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp63_attitude'), '(CFixedPoint)1'), 'NFP63_ATT_1', 'NFP50_EMPTY')][SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp63_attitude'), '(CFixedPoint)2'), 'NFP63_ATT_2', 'NFP50_EMPTY')][SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp63_attitude'), '(CFixedPoint)3'), 'NFP63_ATT_3', 'NFP50_EMPTY')][SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp63_attitude'), '(CFixedPoint)4'), 'NFP63_ATT_4', 'NFP50_EMPTY')][SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp63_attitude'), '(CFixedPoint)5'), 'NFP63_ATT_5', 'NFP50_EMPTY')][SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp63_attitude'), '(CFixedPoint)6'), 'NFP63_ATT_6', 'NFP50_EMPTY')][SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp63_attitude'), '(CFixedPoint)7'), 'NFP63_ATT_7', 'NFP50_EMPTY')][SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp63_attitude'), '(CFixedPoint)8'), 'NFP63_ATT_8', 'NFP50_EMPTY')][SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp63_attitude'), '(CFixedPoint)9'), 'NFP63_ATT_9', 'NFP50_EMPTY')][SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp63_attitude'), '(CFixedPoint)10'), 'NFP63_ATT_10', 'NFP50_EMPTY')][SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp63_attitude'), '(CFixedPoint)11'), 'NFP63_ATT_11', 'NFP50_EMPTY')]"
 NFP63_TONE_RELATIONS:0 "[SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp63_relation_band'), '(CFixedPoint)-3'), 'NFP63_BAND_NEG3', 'NFP50_EMPTY')][SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp63_relation_band'), '(CFixedPoint)-2'), 'NFP63_BAND_NEG2', 'NFP50_EMPTY')][SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp63_relation_band'), '(CFixedPoint)-1'), 'NFP63_BAND_NEG1', 'NFP50_EMPTY')][SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp63_relation_band'), '(CFixedPoint)0'), 'NFP63_BAND_ZERO', 'NFP50_EMPTY')][SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp63_relation_band'), '(CFixedPoint)1'), 'NFP63_BAND_POS1', 'NFP50_EMPTY')][SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp63_relation_band'), '(CFixedPoint)2'), 'NFP63_BAND_POS2', 'NFP50_EMPTY')][SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp63_relation_band'), '(CFixedPoint)3'), 'NFP63_BAND_POS3', 'NFP50_EMPTY')]"
 NFP65_AWAY_HALF:0 "이 나라에서는 이제 적어도 절반이 글을 읽고 쓴다. 멋진 문턱 하나를 넘은 날 모든 책이 동시에 펼쳐지거나 옛 어려움이 사라지지는 않는다. 그래도 글을 읽는 일이 더 많은 사람에게 가능해지고 있다. 개인에게는 적힌 것을 스스로 이해할 기회이고 나라에는 다음 계획을 세울 든든한 바탕이다."
 NFP65_AWAY_THREE:0 "식자율이 인구의 4분의 3에 이르렀다. 소수의 재주가 아니라 교육이 널리 퍼졌다고 할 만하다. 그렇지만 남은 4분의 1도 보고서에 난 성가신 오자는 아니다. 좋은 평균만으로는 어느 지역에서 배우기 쉬운지, 누가 여전히 배움에 더 큰 어려움을 겪는지 알 수 없다. 그렇다고 성취 자체가 작아지지는 않는다."
 NFP65_AWAY_TITLE:0 "외국에서 글 읽는 사람이 늘었다"
 NFP65_COMPARE_AHEAD:0 "우리나라는 식자율에서 아직 뒤에 있다. 이 대목에서는 저쪽이 앞선다. ‘그래도 우리는…’이라는 말로 넘기기는 너무 편하다. 내 성취를 자랑하면서 남의 성취도 알아볼 수 있다. 축하에서 쓸모 있는 물음까지는 멀지 않다. 무엇이 그 결과를 도왔으며 우리 사정은 어떠한가?"
 NFP65_COMPARE_BEHIND:0 "현재 식자율은 우리나라가 앞선다. 기분 좋은 대목인 것은 맞다. 하지만 남의 성취를 보며 느긋하게 월계관을 고쳐 쓰는 것은 어울리지 않는다. 이번 통계에서 높았다고 그 자리가 영원히 우리 몫은 아니다. 우위가 있다는 것은 좋다. 그것이 추억이 되지 않게 한다면 더 좋다."
 NFP65_COMPARE_EQUAL:0 "두 나라의 식자율은 지금 어깨를 나란히 한다. 우리가 뒤지지 않는다며 만족스럽게 장을 넘길 수도 있다. 그러나 숫자가 같다고 교육의 모습도, 모두에게 주어진 기회도 같지는 않다. 비슷한 통계 한 줄 뒤에 다른 사연이 있을 수 있다. 엄숙하게 무승부를 선언하는 것보다 그 사연을 비교하고 싶다."
 NFP65_COMPARE_UNKNOWN:0 "우리와 자신 있게 비교할 자료는 아직 부족하다. 누구를 더 크게 축하하고 누구에게 서두르라고 할지 당장 정할 수 있으면 편하겠다. 하지만 믿을 만한 성적표 없는 신문의 경주는 그걸 쓰는 사람이 이기기 너무 쉽다. 이룬 문턱을 기록하되 순위는 아직 매기지 않겠다."
 NFP65_END_COLD_PARTNER:0 "함께 맺은 약속이 양국 사이의 불만을 없애지는 못했다. 그럴수록 다음 다툼에 쓰기 편한 소식만 골라 볼 일은 아니다. 동반자는 교육에서 성과를 냈다. 그 일로 좋아할 의무는 없어도 무엇이 그 성과를 뒷받침했는지 이해하는 일은 유익할 것이다."
 NFP65_END_FRIEND:0 "이번에는 이를 악물고 외교적 축하를 할 필요가 없다. 인사 뒤에 쓸 만한 경험을 나누는 이야기까지 이어지면 반갑겠다. 남의 수치를 우리 보고서에 베껴 쓰는 것은 좋지 않다. 그 수치를 낳은 방식을 배우는 것은 다른 일이다."
 NFP65_END_NEUTRAL:0 "변화는 기록했고 비교할 계기도 생겼다. 이 성과가 그 나라 사람들의 삶에 어떻게 작용할지 궁금하다. 그동안 우리 보고서도 펼쳐 보자. 남의 소식 덕분에 우리 소식을 주의 깊게 읽게 되는 때가 있다."
 NFP65_END_OVERLORD:0 "우리는 이 나라의 발전을 특히 유심히 지켜봐야 한다. 저들의 성취가 곧 우리의 성취는 아니며, 종주국에서 다음 지시가 온다고 그 식자율까지 우리에게 전해지지는 않는다. 좋은 경험은 배울 수 있다. 우리 교육을 위해 할 일까지 없어지지는 않는다."
 NFP65_END_REBELLIOUS:0 "종속국과의 관계는 평온하다고 하기 어렵다. 그렇다고 식자율 상승 자체가 자립을 바라는 마음을 설명하는 것은 아니다. 두 소식을 한데 묶어 편한 설명을 만들기는 쉽다. 따로따로 알아보는 편이 더 어렵지만 사정을 이해하는 데에는 낫다."
 NFP65_END_RIVAL:0 "남의 성취가 우리의 패배는 아니다. 그렇다고 재치 있는 비웃음 한마디에 그 성취가 사라질 리도 없다. 경쟁국이 받을 축하는 받게 두고 우리 보고서도 살펴보자. 재치가 우리 장점으로 남으면 좋겠다. 남의 성과에 내놓는 주된 답이 되는 대신에."
 NFP65_END_SUBJECT:0 "종속국의 좋은 소식을 볼 때 우리에게 낼 돈부터 떠올릴 필요는 없다. 그 나라의 발전은 우리 국고의 이득만으로 다 설명되지 않는다. 이 문턱을 넘은 뒤 현지 주민들이 신문에서 읽는 것 말고도 몸소 느낄 변화가 이어졌으면 한다."
 NFP65_END_THREAT:0 "그 나라가 우리를 대하는 의도는 무해하다고 말하기 어렵다. 식자율이 높아진 것 자체는 전쟁 준비가 아니다. 그래도 우리에게 압력을 가하려는 나라의 발전은 나팔 소리 없이도 주목할 만하다. ‘교육일 뿐’이라며 마음을 놓기에는 조금 경솔하다."
 NFP65_HOME_END:0 "나라를 자랑할 이유가 생겼다. 적힌 것을 제 힘으로 읽는 사람이 늘고 있다. 그만큼 사람과 지식 사이에 서 있던 중개인이 하나 줄었다. 이 결과가 어떻게 이루어졌는지는 별개의 이야기다. 자세한 근거 없이 어느 한 조치에 모든 공을 돌리지는 않겠다.\n\n이 이야기가 이어지면 좋겠다. 신문에는 독자가 필요하다. 나라에는 신문 이외의 것도 읽을 줄 아는 사람이 필요하다."
 NFP65_HOME_EXPECTATIONS:0 "교육에는 정부로서 조금 불편한 면도 있다. 삶에 대한 기대가 높아진다. 글을 아는 사람은 경제 발전을 돕지만 더 적게 받고 만족하는 법을 배우지는 않는다. 재미있는 만남이다. 나라에는 배운 일꾼이 필요하고 배운 일꾼은 더 잘 살고 싶다. 교육 성과에 대한 축하만으로 이 대화가 끝나지는 않을 것이다."
 NFP65_HOME_HALF:0 "이제 우리나라에서 적어도 절반이 글을 읽고 쓴다. 신문 독자가 늘었다는 것 이상이다. 교육받은 사람이 새 직업을 익히기는 더 쉽고 나라는 학문을 키우고 남의 발견을 받아들이기에 유리해진다. 글자가 모여 낱말이 되고 경제의 가능성도 된다."
 NFP65_HOME_INTRO:0 "글을 읽을 수 있으면 편하다. 공고문을 스스로 읽고, 편지를 펴고, 책을 들여다볼 수 있다. 다음 연설에서 무엇을 약속했는지 가장 재미있는 대목만 기억한 사람의 전언에 기대지 않고 알아볼 수도 있다. 개인에게는 일상의 재주다. 나라에는 신문 첫 면에 실을 만한 변화다."
 NFP65_HOME_PROFESSION:0 "교육은 주민이 고를 수 있는 일의 범위를 넓힌다. 글이 적힐 때마다 남에게 읽어 달라 하지 않아도 되면 기사가 되거나 공문서를 다루는 일에 도전하기가 쉽다. 기업에는 훈련받은 일손을 구할 기회이고 사람에게는 익숙한 벌이 너머로 나서 볼 기회다. 새 일자리와 좋은 봉급을 약속하지는 않는다. 하지만 전에는 열쇠조차 없었을 문이 열렸다."
 NFP65_HOME_SCIENCE:0 "학문이 펼칠 수 있는 폭도 넓어진다. 식자율이 높을수록 대학의 연구 역량을 자국의 발견에 더 많이 활용할 수 있다. 남의 지식도 더 빨리 퍼진다. 어디서 쓸 만한 물건을 고안했다는 소식을 듣는 데 그치지 않고 어떻게 작동하는지 알아야 하기 때문이다. 글을 아는 사람이 많다는 이유만으로 과학이 도약하지는 않는다. 대학 건물만 세워도 안 되기는 마찬가지다."
 NFP65_HOME_THREE:0 "우리나라에서 글을 읽고 쓰는 사람이 4분의 3에 이르렀다. 경제에는 든든한 바탕이다. 전문가를 기르고 연구를 발전시키며 외국의 발견을 이해할 기회가 늘어난다. 다만 남은 4분의 1도 사람이다. 멋진 보고서가 그들에게까지 글을 가르쳐 준 것은 아니다."
 NFP65_HOME_TITLE:0 "독자가 늘었다. 우리 신문만의 일은 아니다"
 NFP65_OPEN_ALLY:0 "우리 동맹국 [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName] 측이 식자율에서 새 문턱을 넘었다. 동반자의 소식을 받으면서 군용 지도를 펴지 않아도 되는 날이라니 반갑다. 이번에는 적힌 바를 스스로 읽을 줄 아는 사람들의 소식이다. 짐작건대 두 나라 사이의 약속까지도. 양쪽 모두에 쓸모 있는 재주다."
 NFP65_OPEN_ALLY_BLOC:0 "우리 동맹국이자 같은 세력 블록의 일원인 [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName] 측이 식자율의 새 문턱을 넘었다. 함께하는 나라에서 신문과 조약, 약속 밑의 작은 글씨까지 읽을 사람이 늘었다. 동반자들에게 반가운 소식이다. 그렇다고 같은 블록에 있다고 남의 성취가 우리 것이 되지는 않는다. 축하는 함께하되 배움은 각자의 집에서 시작해야 한다."
 NFP65_OPEN_BLOC:0 "우리 세력 블록의 일원인 [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName] 측이 식자율에서 새 문턱을 넘었다. 같은 외교권의 소식이 늘 협상과 영향력 배분만 다루는 것은 아니다. 이번 주제는 교육이다. 언뜻 조용한 뉴스지만 스스로 발전할 길을 찾는 나라에는 무게 있는 일이다. 공동 협정에 서명만 한다고 멀리 갈 수는 없다."
 NFP65_OPEN_NEIGHBOR:0 "우리 이웃 [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName] 측이 식자율에서 새 문턱을 넘었다. 국경선은 제자리에 있고 급한 전보를 돌릴 필요도 없다. 그렇지만 이웃이라는 관계는 국경 표지들만으로 이루어지지 않는다. 그 너머 사정도 가끔 보아 둘 만하다. 우리의 성과와 나란히 놓을 이유가 생겼다면 특히 그렇다."
 NFP65_OPEN_OTHER:0 "[ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName]에서 식자율의 새 문턱을 넘었다는 소식이 왔다. 모든 외신이 전쟁이나 추문, 누군가의 몰락으로 시작할 필요는 없다. 이번에는 글을 읽고 쓸 줄 아는 인구의 비율이 높아졌다. 예포는 없지만 여운은 포성의 메아리보다 오래갈지 모른다."
 NFP65_OPEN_OVERLORD:0 "우리 종주국 [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName] 측이 식자율의 새 문턱을 넘었다. 우리가 의존하는 나라의 변화는 거기서 내려오는 지시 이외의 길로도 알아 두는 편이 좋다. 이번 소식은 교육에 관한 것이다. 이것만으로 양국 관계가 달라지지는 않지만 우리가 헤아려야 할 나라가 어떻게 발전하는지 한 면을 보여 준다."
 NFP65_OPEN_RIVAL:0 "우리 경쟁국 [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName] 측이 식자율의 새 문턱을 넘었다. 괜찮은 빈정거림 하나로 소식을 마칠 수도 있겠다. 하지만 손쉬운 해결책을 좋아하는 분들에게 유감스럽게도, 그 한마디에 저쪽 사람들이 글 읽는 법을 잊지는 않는다. 재치를 뽐내기 전에 무슨 일이 있었는지부터 보자. 신문에 풍자를 실을 때도 자료가 조금 더 있다고 손해 본 적은 없다."
 NFP65_OPEN_SUBJECT:0 "우리 종속국 [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName] 측에서 식자율의 새 문턱을 넘었다는 소식이 왔다. 그곳의 일을 우리 일의 부록처럼 보기 쉽다. 무엇을 생산하고 얼마나 가져다주며 얼마나 조용히 지내는가. 그러나 그곳에는 우리 장부의 줄이 아니라 사람들이 산다. 이제 그중 더 많은 이들이 그 장부에 적힌 것을 읽을 줄 안다."
 NFP66_AWAY_CONTEXT:0 "이제 이 나라에는 남들도 셈에 넣어야 할 성과가 있다. 순위 하나가 어떻게 올라섰는지, 업종마다 장사가 어떤지까지 말해 주지는 않는다. 그렇다고 ‘고작 숫자’라며 넘기기는 너무 편하다. 숫자에도 내용은 있다. 그 뒤에 세계 상위권의 경제가 들어 있다면 특히 그렇다."
 NFP66_AWAY_FACT:0 "10위권에 들기 전에는 [ScriptContainer.GetVariableValue('nfp20_before')|0]위였고 지금은 [ScriptContainer.GetVariableValue('nfp20_after')|0]위다. 두 달 연속 월간 보고서에서 상위권에 이름을 올렸다. 경제 전체의 규모를 비교해 정한 자리다. 한 가정의 살림으로 순위를 매겼다면 명단은 사뭇 달라졌을지도 모른다."
 NFP66_AWAY_TITLE:0 "세계 10대 경제국에 새 얼굴"
 NFP66_END_COLD_PARTNER:0 "함께한 약속이 양측의 불만을 없애 주지는 못했다. 그래도 저 나라의 경제가 작아지는 것은 아니다. 껄끄러운 동반자에게는 흥미로운 일이 생길 리 없다는 증거를 또 찾기보다 무엇이 달라졌는지 살펴보는 편이 유익하다."
 NFP66_END_FRIEND:0 "동반자에게 축하를 보낼 만하다. 이 경제적 성취가 어디로 이어질지, 새로운 가능성 속에 쓸모 있는 협력의 자리도 있을지 궁금하다. 회담에서 사진을 함께 찍는 일도 좋다. 동반자의 이점이 사진으로 끝나지는 않았으면 한다."
 NFP66_END_NEUTRAL:0 "변화를 기록했고 지켜볼 이유도 생겼다. 새 지위가 나라 안의 생활과 밖의 일에 어떤 영향을 미치는지는 앞으로 알게 될 것이다. 그동안 우리 보고서도 한 번 들여다보자. 남의 좋은 소식에서 특히 유익한 것은 읽고 나면 우리 자신에게 던지고 싶어지는 물음일 때가 있다."
 NFP66_END_OVERLORD:0 "종주국의 경제적 성공이 자동으로 우리의 성과가 되지는 않는다. 하지만 우리가 의존하는 나라의 역량을 이해할 필요는 있다. 종주국의 성취를 바라보는 일만큼이나 우리의 발전도 우리 계획에서 자리를 차지했으면 한다."
 NFP66_END_REBELLIOUS:0 "이 종속국과의 관계는 조용하다고 하기 어렵다. 이런 때일수록 달라진 경제적 지위가 눈길을 끈다. 10위권 진입이 자립 열망의 원인이라고 단정하기는 이르다. 그렇다고 그 경제의 크기가 양국 관계와 전혀 무관한 듯 행동하기도 이르다."
 NFP66_END_RIVAL:0 "경쟁국이 10위권에 들었다고 우리나라가 곧장 패배한 것은 아니다. 그렇다고 재치 있는 비웃음 한마디로 자신을 달래고 싶지도 않다. 상대가 눈에 띄는 성과를 냈다. 우리의 다음 답은 멋진 농담에 그치지 않고 우리 자신의 반가운 경제 소식이면 좋겠다."
 NFP66_END_SUBJECT:0 "종속국이라는 이름 뒤에는 그 나라 자신의 경제가 있다. 새 순위는 발전을 좀 더 자세히 볼 계기다. 우리 국고가 무엇을 더 받을 수 있는지만 물을 일은 아니다. 큰 성과라면 납부 명세서 한 장보다 조금 넓은 이야기를 나눌 만하다."
 NFP66_END_THREAT:0 "그 나라가 우리를 대하는 의도는 마냥 무해하다고 하기 어렵다. 경제 10위권에 들었다고 곧 군대가 생기거나 전쟁이 시작되지는 않는다. 그러나 그런 나라의 역량을 지나치는 일은 경솔하다. 뜻밖의 곤란을 겪고 나서야 남의 힘을 세기 시작하면 대개 늦는 법이다."
 NFP66_HOME_CONTEXT:0 "순위가 움직였다는 사실은 전체 이야기의 일부다. 순위는 우리나라의 일과 다른 나라의 일 양쪽에 달려 있다. 확인된 핵심은 이번 비교에서 전보다 높은 자리에 섰고 두 차례 관측에서 10위권을 지켰다는 것이다. 이를 모든 업종의 성공 증명서로 내준다면 어느 보고서에나 지나치게 후한 선물이 되겠다."
 NFP66_HOME_END:0 "자랑할 이유는 있다. 나라에 아직 문제가 남아 있다고 그 이유를 오롯이 포기한다면 이상하다. 이제 문제를 모두 잊어도 된다고 여긴다면 더 이상하다.\n\n10위권 안으로 우리는 들어갔다. 좋은 삶까지 문밖에 남겨 두지는 않았으면 한다."
 NFP66_HOME_FACT:0 "10위권에 들기 전 우리나라는 [ScriptContainer.GetVariableValue('nfp20_before')|0]위였다. 지금은 [ScriptContainer.GetVariableValue('nfp20_after')|0]위다. 두 달 연속 월간 보고서에서 세계 상위권에 들었다. 축하 글의 잉크가 마르자마자 취소할 일을 면했다는 말이다. 시작으로는 제법 괜찮다."
 NFP66_HOME_INTRO:0 "우리나라가 세계 10대 경제국에 들었다. 국제면에서 나라를 자랑할 구실을 찾던 분들에게 반가운 소식이다. 이번에는 그 구실이 실제로 있다. 어깨를 펴고 옷깃을 가다듬은 뒤 성과를 좀 더 가까이 들여다보자. 되도록 축사가 시작되기 전에."
 NFP66_HOME_LIVING:0 "주민에게 명단의 좋은 자리가 곧 살림의 보탬은 아니다. 세계에서 손꼽히는 경제를 가진 나라에 산다는 것은 흐뭇하다. 하지만 가게에서는 국제 순위 대신 돈을 내라고 한다. 나라의 경제력이 축사의 장엄함뿐 아니라 사람들이 살 수 있는 물건에서도 느껴지면 좋겠다."
 NFP66_HOME_POTENTIAL:0 "경제가 크면 나라가 할 수 있는 일도 많다. 전체 규모 뒤에는 일상의 삶을 이루는 기업과 일자리와 상품이 있다. 국가는 이를 바탕으로 자기 계획을 세울 수 있다. 다만 ‘여력이 있다’와 ‘그 여력을 잘 썼다’ 사이에는 정부가 해야 할 일이 꽤 많다. 10위권의 자리가 그 일을 대신하지는 않는다."
 NFP66_HOME_TITLE:0 "우리 경제, 세계 10위권에 들다"
 NFP66_OPEN_ALLY:0 "우리 동맹국 [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName] 측이 세계 10대 경제국에 들었다. 다음 회담에서 동반자에게 자랑거리가 하나 생겼다. 함께한 약속에 든든한 경제가 따라온다면 반가운 일이다. 그래도 남의 성과를 우리 업적란에 옮겨 싣지는 않겠다. 우정은 우정이고 보고서는 각국의 몫이다."
 NFP66_OPEN_ALLY_BLOC:0 "우리 동맹국이자 같은 세력 블록의 일원인 [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName] 측이 세계 경제 10위권에 들었다. 함께 모인 자리에서 축사를 할 이유가 하나 늘었다. 축사 뒤에 유익한 일도 따라오면 좋겠다. 블록의 가치는 회원국 명단이 얼마나 그럴듯하게 보이는지만으로 정해지지 않으니까."
 NFP66_OPEN_BLOC:0 "우리 세력 블록의 일원인 [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName] 측이 세계 10대 경제국에 들었다. 함께하는 나라들에는 눈에 띄는 변화다. 물론 남의 순위가 우리 국고에 자동으로 돈을 보태지는 않는다. 다만 약속을 나눈 나라의 경제가 어떻게 자라고 있는지 눈여겨볼 계기는 된다."
 NFP66_OPEN_NEIGHBOR:0 "우리 이웃 [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName] 측이 세계 10대 경제국에 들었다. 국경 표지 너머에 자랑거리 하나가 더 생겼다. 이웃은 가끔 우리 일도 돌아보게 한다. 때로는 큰소리로, 이번에는 경제 통계의 한 자리로."
 NFP66_OPEN_OTHER:0 "[ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName] 측이 세계 10대 경제국에 들어섰다. 명단의 새 얼굴과 함께 외국의 변화를 살필 계기가 생겼다. 성명 한 번 요란하게 낸다고 경제적 무게가 선명해지는 경우는 드물다. 국제 비교라면 이야기할 근거가 조금 더 있다."
 NFP66_OPEN_OVERLORD:0 "우리 종주국 [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName] 측이 세계 10대 경제국에 들었다. 그 나라의 수도에서 일깨워 주기 전에도 그 경제적 역량은 알아 둘 만하다. 이번에는 국제 보고서에 실린 순위가 달라졌다. 우리나라가 의존하는 국가의 일이라면 가볍지 않은 대목이다."
 NFP66_OPEN_RIVAL:0 "우리 경쟁국 [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName] 측이 세계 경제 10위권에 들었다. 따뜻한 축하가 금세 나오기는 어려운 소식이다. 그래도 축사가 없다고 결과가 달라질 리는 없다. 남의 성취에 의미가 없는 까닭을 설명하기 전에 무엇을 성취했는지부터 읽어 보자."
 NFP66_OPEN_SUBJECT:0 "우리 종속국 [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName] 측에서 세계 경제 10위권에 들었다는 소식이 왔다. 그곳을 눈여겨볼 이유가 또 생겼다. 익숙한 종속 관계 한 줄에 가려 그 나라 경제 자체의 크기를 놓치기 쉽다. 국제 통계는 보아하니 잊지 않았다."
 NFP67_AWAY_FACT:0 "3위권 안에 들기 전에는 [ScriptContainer.GetVariableValue('nfp20_before')|0]위였고 지금은 [ScriptContainer.GetVariableValue('nfp20_after')|0]위다. 두 달 연속 월간 보고서에서 세계 최대 생산국들에 이름을 올렸다."
 NFP67_AWAY_FIRST:0 "현재 생산량으로는 이 나라가 세계 명단의 맨 위에 섰다. 그저 선두권에 든 것이 아니다. 이번 집계에는 그 위에 아무도 없다."
 NFP67_AWAY_TITLE:0 "세계 3대 생산국에 새 얼굴"
 NFP67_AWAY_TOP:0 "세계 1위에는 아직 이르지 못했지만 손꼽히는 생산국의 자리는 얻었다. 첫째가 아니라는 이유만으로 그 성과를 가볍게 본다면 이상한 자기 위안이겠다."
 NFP67_END_COLD_PARTNER:0 "두 나라 사이에는 서로 불만이 충분히 많다. 그렇다고 이미 생산한 물량이 줄지는 않는다. 껄끄러운 동반자가 눈여겨볼 일을 해낼 리 없다고 또 입증하려 하기보다 양쪽 성과를 비교해 보는 편이 유익하겠다."
 NFP67_END_FRIEND:0 "동반자에게 축하를 보낼 만하다. 인사 뒤에 양국 모두에게 유익한 협상까지 이어진다면 반갑겠다. 국가의 우정과 개별 기업의 사정에 언제나 등호를 붙일 수 있는 것은 아니다. 그래도 성과 자체는 여전히 흥미롭다."
 NFP67_END_NEUTRAL:0 "변화를 기록하고 우리 생산량과도 비교했다. 이제 뒷이야기를 지켜볼 차례다. 우리나라 역시 주요 생산국인 산업이라면 남의 좋은 소식은 우리 일도 자세히 살펴볼 적절한 계기다."
 NFP67_END_OVERLORD:0 "종주국의 생산 성과가 곧 우리의 성과가 되지는 않는다. 그렇지만 양국의 역량을 나란히 살펴두는 일은 유익하다. 이 업계에서 우리 자리는 누가 누구에게 종속됐는지만이 아니라 일한 결과로 이해하고 싶다."
 NFP67_END_RIVAL:0 "남의 성취가 우리에게 곧장 패배를 인정하라고 요구하는 것은 아니다. 대신 우리 산업을 돌아볼 이유가 된다. 우리의 다음 답이 신문 독자뿐 아니라 생산 통계를 작성하는 사람들의 눈에도 띄기를 바란다."
 NFP67_END_SUBJECT:0 "종속국 뒤에는 그 나라 자신의 경제가 있다. 이 순위는 우리 국고에 무슨 이득이 되는지를 묻지 않더라도 눈여겨볼 만하다. 그 나라와의 관계가 긴장되고 있다면 그 역량을 사소한 대목이라 여길 까닭은 더욱 적다."
 NFP67_END_THREAT:0 "우리는 이 나라의 역량을 특히 유심히 지켜봐야 한다. 상품을 많이 생산한다는 사실만으로 무엇에 쓸지, 무엇을 이루려는지 알 수는 없다. 그러나 우리에게 압력을 가하려는 나라의 생산력을 지나치는 일은 경솔하다."
 NFP67_EQUAL:0 "우리도 대략 같은 양을 생산한다. 한숨만 쉬며 멀리 바라보는 선두 주자의 이야기는 아니다. 성적이 비슷한 만큼 다음 기록이 더 흥미롭다. 지면에서라면 오늘이라도 우승을 선언할 수 있다. 실제 생산에서라면 결국 그 자리를 따내야 한다."
 NFP67_HOME_END:0 "우리는 세계 3위권에 들었다. 이 사실 옆에 예쁜 도장을 하나 찍고 싶다는 마음으로 끝나지 않았으면 한다. 성취는 회상하는 것보다 이어 가는 편이 반갑다.\n\n2위나 3위도 충분한 성과다. 다만 여기서 멈출 이유로는 썩 훌륭하지 않다."
 NFP67_HOME_FACT:0 "3위권에 들기 전에는 [ScriptContainer.GetVariableValue('nfp20_before')|0]위였고 이제 [ScriptContainer.GetVariableValue('nfp20_after')|0]위다. 두 달 연속 월간 보고서에서 우리나라를 주요 생산국으로 꼽았다. 다음 집계가 나오자마자 축하를 도로 거둘 상황은 면했다는 말이다. 물론 지금 얻은 자리는 앞으로 지켜야 한다."
 NFP67_HOME_FIRST_END:0 "1위는 축하받을 만하다. 다만 축하가 끝나도 생산 현장은 계속 움직여야 한다. 월계관은 식장을 장식할 수는 있어도 원료와 멀쩡한 설비를 대신하지 못한다.\n\n명단 선두에 섰다. 축사에서만이 아니라 실제 생산에서도 이 성과를 지킬 수 있기를 바란다."
 NFP67_HOME_FIRST_INTRO:0 "우리나라는 ‘[Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]’의 세계 최대 생산국이 됐다. 이번 생산량 집계에는 우리 위에 아무도 없다. 나라의 자존심에 반가운 한 줄이다. 그 한 줄을 쓸 수 있게 해 준 사람들의 하루하루 노동이 축하 속에 묻히지는 않았으면 한다."
 NFP67_HOME_FIRST_TITLE:0 "1위는 우리 몫"
 NFP67_HOME_INTRO:0 "우리나라가 ‘[Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]’의 세계 3대 생산국에 들었다. 국내 경제가 ‘또 모자란다’는 말 곁에 서지 않는 소식을 받으니 반갑다. 이번에는 생산량에서 세계 선두권에 섰다. 자랑할 만하다. 이제 그 성과의 속을 들여다보자."
 NFP67_HOME_LIMIT:0 "대규모 생산이 경제의 모든 물음에 답하지는 않는다. 만든 물건을 이익을 남기고 팔았는지, 국내 물량이 충분한지, 임금을 잘 주는지는 같은 이야기의 다른 측면이다. 3위권이라는 자리가 그것까지 확인해 주지는 않았다. 그래도 성과는 성과다. 생산국들 사이에서 우리나라가 자랑할 든든한 근거를 얻었다."
 NFP67_HOME_TITLE:0 "우리 생산이 세계 3위권에 들었다"
 NFP67_HOME_WORK:0 "명단의 한 자리 뒤에는 실제 생산이 있다. 보고서를 잘 쓴다고 상품이 생기지는 않는다. 사람이 일하고 자재를 쓰며 날마다 문제를 해결하는 사업장에서 만들어진다. 국제 통계는 그 합계를 기록한다. 이를 이룬 수많은 노동의 하루하루에는 따로 축사를 바치는 일이 드물다는 것도 기억할 만하다."
 NFP67_LESS:0 "우리 생산량은 약 [ScriptContainer.GetVariableValue('nfp67_output_abs')|0]% 적다. 만들어 낸 수량에서 지금은 저 나라가 앞선다. 이익이나 노동자의 형편을 비교한 것은 아니지만 결과의 차이는 분명하고 줄여 볼 만하다. 애초에 비교하면 안 됐다는 해명 말고 우리가 어떤 답을 내놓을 수 있을지 궁금하다."
 NFP67_MORE:0 "우리 생산량이 약 [ScriptContainer.GetVariableValue('nfp67_output_abs')|0]% 많다. 반가운 일인 것은 맞다. 그래도 다른 나라가 3위권에 든 것은 산업을 눈여겨볼 계기이지 느긋하게 우리 월계관을 고쳐 쓸 계기는 아니다. 우위는 그 사실을 자랑하기보다 일로 지키는 편이 유익하다."
 NFP67_OPEN_ALLY:0 "우리 동맹국 [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName] 측이 ‘[Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]’ 생산량에서 세계 3위권에 올랐다. 동반자에게 자랑거리가 생겼다. 우리나라도 이 상품의 세계 5대 생산국에 들어 무관심할 수 없는 업종이다. 그러니 이번 축하에는 업계 사람의 관심이 조금 섞여 있다…. 부러움도 조금."
 NFP67_OPEN_ALLY_BLOC:0 "우리 동맹국이자 같은 세력 블록의 일원인 [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName] 측이 ‘[Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]’의 세계 3대 생산국에 들었다. 함께하는 나라들 가운데 생산 성과가 하나 더 나왔다. 그렇다고 같은 블록의 남의 기업이 우리 기업이 되지는 않는다. 두 나라의 성적을 함께 보면 더 흥미롭겠다."
 NFP67_OPEN_BLOC:0 "우리 세력 블록의 일원인 [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName] 측이 ‘[Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]’의 세계 3대 생산국에 들었다. 우리나라도 눈에 띄는 자리를 지닌 업종의 소식이다. 공동 번영을 다시 한번 다짐하는 것보다 내용을 갖춘 이야깃거리가 생겼다."
 NFP67_OPEN_NEIGHBOR:0 "우리 이웃 [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName] 측이 ‘[Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]’의 세계 3대 생산국에 들었다. 국경 건너에 경제적 자랑거리가 하나 늘었다. 이번에는 우리나라도 세계 5위권에 드는 상품 이야기다. 누가 더 큰 목소리로 축하하는지 겨루지 않아도 비교할 것이 있다."
 NFP67_OPEN_OTHER:0 "[ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName] 측이 ‘[Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]’의 세계 3대 생산국에 들었다. 우리에게는 우연히 들려온 남의 살림 이야기가 아니다. 우리나라도 이 품목 생산에서 세계 5위권에 드니 업계의 변화에 한층 주의를 기울일 만하다."
 NFP67_OPEN_OVERLORD:0 "우리 종주국 [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName] 측이 ‘[Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]’의 세계 3대 생산국에 들었다. 우리도 이 상품의 주요 생산국이니 두 나라의 외교 관계 외에도 주목할 이유가 있다. 결과를 비교할 구체적인 계기가 생겼다."
 NFP67_OPEN_RIVAL:0 "우리 경쟁국 [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName] 측이 ‘[Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]’의 세계 3대 생산국에 들었다. 우리도 이 산업에 이해관계가 있고 직접 생산을 한다. 그러니 늘 하던 ‘별일 아니다’ 한마디로 넘기기는 너무 편하다. 저들이 무엇을 이뤘고 그 옆에서 우리는 어떤지 살펴보자."
 NFP67_OPEN_SUBJECT:0 "우리 종속국 [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName] 측이 ‘[Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]’ 생산에서 세계 3위권에 들었다. 종속 관계를 적은 익숙한 한 줄에 가려 그 나라의 역량을 놓치기 쉽다. 생산 통계가 그것을 떠올려 보라고 한다. 그것도 우리 경제에 중요한 업종에서."
 NFP67_UNKNOWN:0 "생산량을 믿을 만하게 비교할 자료는 아직 부족하다. 명단의 순위는 알지만 순위 사이의 차이를 지어내지는 않겠다. 우리의 역량을 논하려면 남의 성취에서 받은 인상에 더해 우리 자신의 집계도 필요하다."
 NFP68_AWAY_CONTEXT_DOWN:0 "할 수 있는 일은 줄었지만 이 나라를 계산에서 빼기에는 이르다. 국제 지위가 그 경제와 군대, 약속들에 관한 자료를 대신하지는 못한다. 짧은 명칭 하나에 전부 담기면 편하겠지만, 특히 그 명칭을 기초로 계획을 세운다면 그런 편의는 오판이 되기 쉽다."
 NFP68_AWAY_CONTEXT_RECOG:0 "이 나라는 앞으로 발전하기에 좀 더 유리한 처지가 됐다. 예전에 얕보던 나라들을 따라잡을지는 아직 모른다. 하지만 이제 ‘온전한 나라가 아니다’라는 익숙한 설명만으로는 부족하다. 실제로 무슨 일을 하는지 보아야 한다. 사실 예전부터 그렇게 시작하는 편이 옳았겠다."
 NFP68_AWAY_CONTEXT_UP:0 "이 나라가 자기 정책을 펼칠 여지가 늘었다. 우리 계획을 세울 때도 기억할 일이다. 새 지위가 유익한 조약이나 달갑지 않은 충돌을 약속하지는 않는다. 그러나 상대를 보는 우리의 오랜 습관은 달라진 역량을 뒤쫓기 시작할 수 있다."
 NFP68_AWAY_FACT_DOWN:0 "종전 지위는 ‘[Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]’, 새 지위는 ‘[Localize(ScriptContainer.MakeScope.Var('nfp20_extra_detail').GetFlagName)]’다. 위상이 낮아지며 외교의 선택지도 좁아졌다. 국고가 망하거나 군대가 무력해졌다는 이야기는 아직 아니다. 지위 변화 하나가 그런 결론까지 내주지는 않는다. 그러나 종전의 무게가 늘 그대로라고 여길 수도 없게 됐다."
 NFP68_AWAY_FACT_GP_DOWN:0 "종전 지위는 ‘열강’, 새 지위는 ‘[Localize(ScriptContainer.MakeScope.Var('nfp20_extra_detail').GetFlagName)]’다. 이 나라는 최상위 반열에서 내려왔다. 이전의 성취가 사라진 것도, 나라 자체가 사라진 것도 아니다. 하지만 아무 일도 없었던 것처럼 국제적 역량을 계산한다면 이상할 것이다."
 NFP68_AWAY_FACT_GP_UP:0 "종전 지위는 ‘[Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]’, 새 지위는 ‘열강’이다. 가장 폭넓은 외교 수단을 갖는 나라들의 반열에 들어갔다. 이를 두고 세계 정치를 쥐었다고 하면 지나치게 후한 축하다. 그러나 이름만 바뀐 척한다면 우리 마음의 평안에 지나치게 후한 선물을 주는 셈이다."
 NFP68_AWAY_FACT_RECOG:0 "종전 지위는 ‘[Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]’, 새 지위는 ‘[Localize(ScriptContainer.MakeScope.Var('nfp20_extra_detail').GetFlagName)]’다. 이제 승인국의 반열에 올랐다. 칭호만 달라진 것은 아니다. 예전에는 여러 사안에서 불리한 조건을 감수했다. 그 장벽 가운데 하나를 넘었다. 얼마나 잘 활용할지는 다음 이야기다."
 NFP68_AWAY_FACT_UP:0 "종전 지위는 ‘[Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]’, 새 지위는 ‘[Localize(ScriptContainer.MakeScope.Var('nfp20_extra_detail').GetFlagName)]’다. 국제적 위상이 올라 외교적 선택지가 늘었다. 이 나라 수도에서 오는 제안마다 승낙을 받으리라는 뜻은 아니다. 그래도 계획을 영향력으로 뒷받침할 근거는 더 많아졌다."
 NFP68_AWAY_TITLE_DOWN:0 "예전만 한 이름, 가벼워진 무게"
 NFP68_AWAY_TITLE_RECOG:0 "승인국 명단에 한 나라가 더"
 NFP68_AWAY_TITLE_UP:0 "강국들의 자리가 한층 비좁아졌다"
 NFP68_END_COLD_DOWN:0 "양국 관계를 생각하면 남의 곤란을 반기기는 쉽다. 그 뒤 공동의 일을 어떻게 풀지 현명하게 정하기는 더 어렵다. 약속으로 연결돼 있는 한 동반자의 역량 변화는 우리 계획에도 닿는다. 우리 이익을 한 번만 따져 봐도 흥이 깨질 축하는 삼가고 싶다."
 NFP68_END_COLD_UP:0 "함께 맺은 약속으로 서로의 불만이 사라지지는 않았다. 그렇다고 껄끄러운 동반자의 새 역량이 없어지지도 않는다. 남의 성공이 관심을 받을 가치가 없는 이유를 찾기보다 무엇이 가능해졌는지 보는 편이 낫다. 어차피 그 나라와 다시 협의해야 한다면 더욱 그렇다."
 NFP68_END_FRIEND_DOWN:0 "우리 외교권에 썩 반가운 소식은 아니다. 하지만 서로의 성공을 늘어놓으려고만 동맹을 맺은 것은 아닐 것이다. 지금은 동반자의 역량이 어떻게 바뀌었고 공동 계획에서 무엇을 기대할 수 있는지 이해할 때다. 예전의 칭호는 작아졌다. 서로를 이해하는 몫은 커졌으면 한다."
 NFP68_END_FRIEND_UP:0 "동반자에게 축하를 보낼 만하다. 인사 뒤에 양쪽에 이로운 협의가 이어지면 반갑겠다. 저들의 새로운 역량이 저절로 우리 것이 되지는 않는다. 하지만 함께 얻을 이득을 찾아볼 기회라면 근사한 편지 한 장보다 무게 있게 다룰 만하다."
 NFP68_END_NEUTRAL_DOWN:0 "세계 보고서가 달라졌다. 우리가 알아 둘 만한 일이다. 따져 보지도 않고 남의 실수에서 원인을 찾지는 않겠다. 그렇다고 오래 익숙했다는 이유로 옛 관념을 붙들고 있을 까닭도 없다. 지도는 국경이 움직일 때만 낡는 것이 아니다."
 NFP68_END_NEUTRAL_UP:0 "변화를 기록했다. 이제 실제 행보를 살펴보자. 새 지위는 그 나라가 자기 역량에 기댈 근거를 더해 준다. 우리에게는 익숙한 관념을 현재 처지에 비추어 볼 계기다. 국제 뉴스 덕에 우리 계산을 제때 고친다면 반가운 일이다."
 NFP68_END_OVERLORD_DOWN:0 "새 지위는 유심히 볼 일이지만 성급한 약속을 할 일은 아니다. 종속 관계가 지위 한 번 바뀌었다고 사라지지는 않는다. 온갖 문이 열렸다고 선언하기 전에 어느 문이 원래 잠겨 있었고 자물쇠 자체에 무엇이 달라졌는지 살피는 편이 좋다."
 NFP68_END_OVERLORD_UP:0 "저들의 성공이 저절로 우리 것이 되지는 않는다. 다만 우리가 의존하는 나라의 역량을 이해하는 일은 필요하다. 그 나라의 상승을 지켜보면서도 우리 자신의 계획이 들어설 자리를 남기고 싶다. 남의 큰 이름이 우리나라의 미래까지 완성해 주지는 않는다."
 NFP68_END_REBELLIOUS:0 "종속국과의 관계에는 자립에 관한 물음이 이미 충분히 많다. 새 지위가 그 열망을 설명하지도 결말을 정하지도 않는다. 그러나 그 나라의 역량에 생긴 변화를 못 본 척하며 미래를 논하기란 지나치게 편한 습관이겠다. 무엇보다 우리에게."
 NFP68_END_RIVAL_DOWN:0 "남의 실패를 반가워하는 독자가 우리 안에 분명 있을 것이다. 편집부도 이해한다. 다만 이를 근거로 경쟁국이 더는 아무 일도 못 한다고 결론짓지는 않겠다. 자기 위안은 싸게 누릴 수 있다. 그 대가는 때로 더 비싸다."
 NFP68_END_RIVAL_UP:0 "우리로서는 제 역량을 더 자세히 돌아볼 계기다. 우리에게 비우호적인 나라가 비웃음 한 번에 사라지지 않을 성과를 냈다. 우리의 답도 성취를 적는 보고서에 실릴 만한 것이면 좋겠다. 재치 겨루기에서 이기면 기분은 좋다. 안타깝게도 그 상으로 외교력이 더해지지는 않는다."
 NFP68_END_SUBJECT_DOWN:0 "종전의 지위를 잃었다고 그 나라의 어려움이 오롯이 남의 일이 되지는 않는다. 종속국에 약속을 성실히 지키라 기대하기는 쉽다. 이제 어떤 역량으로 그 약속을 지켜야 하는지도 가끔 돌아볼 일이다."
 NFP68_END_SUBJECT_UP:0 "종속 관계 뒤에서 그 나라 자신의 발전도 볼 필요가 있다. 새 역량은 우리 국고가 무엇을 더 얻을 수 있는가 하는 물음 외에도 주목할 가치가 있다. 우리가 그곳을 이해하는 속도도 우리가 거는 기대가 자라는 속도만큼은 됐으면 한다."
 NFP68_END_THREAT:0 "우리를 향한 그 나라의 의도를 무해하다고 보기는 어렵다. 그래서 역량의 변화가 특히 눈길을 끈다. 새 지위가 전쟁의 시작을 뜻하지 않고 옛 지위의 상실이 평온을 보장하지도 않는다. 등급 이름에 결론이 적혀 있기를 바라기보다 상대가 누구인지 이해하는 편이 유익하다."
 NFP68_HOME_CONTEXT_DOWN:0 "우리나라의 외교적 선택지가 줄었다. 스스로 내리는 결정마다 쓸모없어질 만큼은 아니다. 그러나 ‘어차피 우리를 셈에 넣겠지’ 하는 습관을 거두고 제 사정을 살필 만큼은 된다. 옛 위상을 얼마나 요란하게 들먹이는지보다 무엇을 내놓을 수 있느냐로 주목받기를 바란다."
 NFP68_HOME_CONTEXT_GP_DOWN:0 "우리는 열강의 반열에서 내려왔다. 옛 위상과 함께 국제 사안에 영향력을 미칠 여지도 좁아졌다. 내일부터 이웃들이 우리 편지에 답하지 않으리라는 뜻은 아니다. 그러나 이름 하나가 예전만 한 무게를 낼 것으로 기대하기에는 너무 순진하다. 특히 그 무게가 어디로 갔는지 해명해야 할 사람들에게는."
 NFP68_HOME_CONTEXT_GP_UP:0 "우리는 열강의 반열에 들었다. 독자적인 외교전을 펼치고 우리 제안을 영향력으로 뒷받침할 여지가 커졌다. 말에 힘을 실을 수 있다면 반가운 일이다. 이제 어떤 일을 그 역량에 걸맞다고 여길지가 궁금하다. 위대함은 칭호에 쓰인 글자 크기보다 성과로 알아보는 편이 낫다."
 NFP68_HOME_CONTEXT_RECOG:0 "옛 구분은 자존심만의 문제가 아니었다. 미승인국의 지위는 차입이나 외국 지식의 전파 등에서 불리한 조건을 뜻했다. 그 조건이 이제 달라졌다. 국고가 당장 숨을 돌리고 모든 발견이 더 빨리 도착했다는 것은 아니다. 그래도 장벽 하나가 줄었다. 시작으로는 충분히 값진 소식이다."
 NFP68_HOME_CONTEXT_UP:0 "새 지위로 우리나라가 택할 수 있는 외교의 길이 넓어졌다. 그것만으로 좋은 협약이 성사되거나 모든 대화 상대가 우호적이 되지는 않는다. 다만 우리가 스스로 정할 공간이 더 생겼다. 그 여백을 축사로 가득 채우기 전에 한번 활용해 보면 좋겠다."
 NFP68_HOME_END_DOWN:0 "껄끄러운 변화를 보고서 탓으로 돌리며 토라지기보다 알아채는 편이 낫다. 원인은 더 살펴야 한다. 예전의 지위가 원래부터 별로 마음에 들지 않았다고 입증하는 것보다는 원인을 찾는 편이 유익할 것이다.\n\n칭호는 소박해졌다. 우리 계획까지 소박해지지는 않았으면 한다."
 NFP68_HOME_END_RECOG:0 "승인을 축하해도 좋다. 그런 다음 더 나은 지위를 얻으려고 애쓴 까닭, 곧 그 지위로 할 일을 시작하면 된다. 열린 기회는 쓸 때 더욱 반갑다.\n\n우리 앞에 문이 열렸다. 그 문패를 논하는 데 하루를 다 쓴다면 이상하지 않겠는가."
 NFP68_HOME_END_UP:0 "자랑할 이유가 있다. 다만 새 지위가 옛 문제를 푸는 힘이 되기를 바란다. 무슨 문제든 얼버무릴 편리한 대답으로 쓰이지는 말고.\n\n나라의 무게가 더해졌다. 업적을 줄줄이 읽을 때 말고도 느낄 수 있다면 좋겠다."
 NFP68_HOME_FACT:0 "전에는 ‘[Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]’였고 지금은 ‘[Localize(ScriptContainer.MakeScope.Var('nfp20_extra_detail').GetFlagName)]’다. 이번 보고서에 기록된 변화는 바로 이것이다. 다른 나라 사이에서 우리나라가 차지하는 지위다. 주목할 만하지만 어떤 성취나 곤란이 이 결과를 낳았는지까지 한 줄로 알 수는 없다."
 NFP68_HOME_INTRO_DOWN:0 "우리나라가 여러 강국 사이에서 차지하던 종전의 지위를 잃었다. 축하 판화 옆에 싣고 싶은 소식은 아니다. 남들이 매긴 명단에는 원래 관심이 없었다고 말할 수도 있다. 다만 순위가 더 높았을 때는 지금보다 훨씬 즐거운 마음으로 떠올리곤 했다."
 NFP68_HOME_INTRO_NEUTRAL:0 "우리나라의 국제 지위 등급이 달라졌다. 성급한 축하나 유감 표명에 앞서 무엇이 바뀌었는지 들여다볼 만하다."
 NFP68_HOME_INTRO_RECOG:0 "우리나라가 이제 승인국 명단에 들었다. 그 전에는 여기서 아무도 살지 않고 일하지 않고 앞날을 계획하지 않았다는 것은 물론 아니다. 다만 국제 사회에서는 존재한다는 사실만으로 부족할 때가 있다. 남들이 알아봐 주면 더욱 좋다는 얘기다. 이제 옛 표시는 뒤에 남았다. 그 뒤에 무엇이 달라질지 보자."
 NFP68_HOME_INTRO_UP:0 "우리나라가 세계 국가들 사이에서 한 단계 올라섰다. 반가운 소식이다. 특히 고국의 이름을 늘 ‘그 밖의 나라’ 뒤에서 찾던 이들에게. 나라의 자존심이 어깨를 펼 이유가 생겼다. 어깨와 함께 우리의 가능성도 피어났으면 좋겠다."
 NFP68_HOME_TITLE_DOWN:0 "칭호는 소박해졌다. 실제 사정은?"
 NFP68_HOME_TITLE_RECOG:0 "마침내 우리를 알아보다"
 NFP68_HOME_TITLE_UP:0 "이제는 우리도 셈에 넣어야 한다"
 NFP68_NEUTRAL_CONTEXT:0 "이 변화는 따로 살필 일이다. 등급 이름 뒤에는 여러 사정이 있을 수 있으니 미리 편한 설명을 골라 두지는 않겠다."
 NFP68_NEUTRAL_END:0 "그 나라가 앞으로 할 일을 지켜보자. 한 줄에서 이야기 전체를 추측하는 것보다 그 역량을 더 잘 보여 줄 것이다."
 NFP68_NEUTRAL_FACT:0 "종전 지위는 ‘[Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]’, 새 지위는 ‘[Localize(ScriptContainer.MakeScope.Var('nfp20_extra_detail').GetFlagName)]’다. 이름이 달라졌다는 것만으로 그 나라가 더 강해지거나 약해졌다고 할 수는 없다."
 NFP68_NEUTRAL_TITLE:0 "한 나라의 국제적 지위가 달라졌다"
 NFP68_OPEN_ALLY:0 "우리 동맹국 [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName] 측의 국제적 지위가 바뀌었다. 우리에게 이는 남의 명단에서 자리가 바뀌었다는 소식보다 무게가 있다. 약속을 나눈 상대의 역량을 알고 나면 공동의 계획을 헤아리기도 좋다. 동맹 조약이 저울은 아니지만 동반자의 무게를 알아 두면 쓸모가 있다."
 NFP68_OPEN_ALLY_BLOC:0 "우리 동맹국이자 같은 세력 블록의 일원인 [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName] 측이 새 국제적 지위를 얻었다. 양국의 연결은 ‘저들 일’ 한마디로 넘기기에는 깊다. 저들의 일인 것은 맞다. 하지만 함께 계획을 세우다 보면 상대의 역량은 금세 우리 계산에도 들어온다."
 NFP68_OPEN_BLOC:0 "우리 세력 블록의 일원인 [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName] 측의 지위가 달라졌다. 같은 식구는 그대로지만 식구 하나의 무게는 이미 달라졌다. 공동의 일을 논할 때에는 중요한 대목이다. 블록의 가치가 깃발 아래 나라 이름 몇 개가 들어가느냐에만 있는 것은 아니니까."
 NFP68_OPEN_NEIGHBOR:0 "우리 이웃 [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName] 측의 국제적 지위가 달라졌다. 그 일로 국경 표지가 옮겨지지는 않았다. 대신 그 너머에 누가 있는지 더 자세히 볼 계기가 생겼다. 이웃은 고를 수 없다고들 한다. 다행히 그 격언이 이웃의 일을 살피는 것까지 금하지는 않는다."
 NFP68_OPEN_OTHER:0 "[ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName] 측의 국제적 지위가 달라졌다는 소식이 왔다. 세계 국가들 사이의 무게 배분이 달라져 이번 호에 자리를 마련했다. 새 등급 이름만으로 변화 전체를 설명할 수는 없다. 하지만 유심히 볼 뚜렷한 계기는 된다."
 NFP68_OPEN_OVERLORD:0 "우리 종주국 [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName] 측의 국제 지위가 달라졌다. 두 수도가 약속을 나눴다는 이유만으로 이 소식이 우리 소식이 되지는 않는다. 그렇다고 완전히 남의 일도 아니다. 우리가 의존하는 나라의 역량은 그쪽에서 따로 일깨우지 않아도 살펴둘 만하다."
 NFP68_OPEN_RIVAL:0 "우리 경쟁국 [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName] 측이 강국들 사이에서 이제 다른 자리를 차지한다. 반가워하거나 못마땅해하기 전에 무엇이 달라졌는지 읽어보자. 남의 칭호가 우리 힘을 보태거나 덜지는 않는다. 하지만 우리가 상대해야 할 나라의 역량은 훗날 중요한 정보가 될 수 있다."
 NFP68_OPEN_SUBJECT:0 "우리 종속국 [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName] 측에서 국제 지위가 바뀌었다는 소식이 왔다. 종속을 적은 익숙한 한 줄 뒤에서 그 나라의 역량을 놓치기 쉽다. 그러나 그 나라의 처지는 변한다. 우리에게 바칠 몫을 적은 다음 장부 너머에서 무엇이 일어나는지 아는 편이 유익하다."
 NFP69_FACT:0 "[ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName]에서 종전의 ‘[Localize(ScriptContainer.MakeScope.Var('nfp69_old').GetFlagName)]’ 법률이 ‘[Localize(ScriptContainer.MakeScope.Var('nfp69_new').GetFlagName)]’ 법률로 바뀌었다.\n\n[Localize(ScriptContainer.MakeScope.Var('nfp69_topic').GetFlagName)]"
 NFP69_HOME_OPEN:0 "우리나라의 법이 바뀌었다. 옛 규칙이 새 규칙에 자리를 내줬다. 어떤 주민에게는 오래 기다린 변화겠고, 다른 주민에게는 익숙한 계획을 다시 살펴야 할 이유겠지. 법에 이제 무엇이 적혔는지 읽어 보자."
 NFP69_LIMIT:0 "새 규칙은 채택됐다. 이제 나라 안의 일에 어떤 영향을 줄지가 궁금하다. 결정문 자체가 이야기의 전부는 아니다. 법조문 뒤에서 전할 만한 변화가 보이면 이 지면에서 다시 다루겠다."
 NFP69_OPEN_ALLY:0 "우리 동맹국 [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName] 측에서 새 법 소식이 왔다. 남의 제도를 논하기는 멀리서가 가장 쉽다. 하지만 무엇이 달라졌는지 먼저 읽는 편이 더 유익하다. 그러고 나면 때로는 우리 제도에도 묻고 싶은 것이 생긴다."
 NFP69_OPEN_ALLY_BLOC:0 "우리 동맹국이자 같은 세력 블록의 일원인 [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName] 측에서 새 법 소식이 왔다. 남의 제도를 논하기는 멀리서가 가장 쉽다. 하지만 무엇이 달라졌는지 먼저 읽는 편이 더 유익하다. 그러고 나면 때로는 우리 제도에도 묻고 싶은 것이 생긴다."
 NFP69_OPEN_BLOC:0 "우리 세력 블록의 일원인 [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName] 측에서 새 법 소식이 왔다. 남의 제도를 논하기는 멀리서가 가장 쉽다. 하지만 무엇이 달라졌는지 먼저 읽는 편이 더 유익하다. 그러고 나면 때로는 우리 제도에도 묻고 싶은 것이 생긴다."
 NFP69_OPEN_NEIGHBOR:0 "이웃 나라 [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName] 측에서 새 법 소식이 왔다. 남의 제도를 논하기는 멀리서가 가장 쉽다. 하지만 무엇이 달라졌는지 먼저 읽는 편이 더 유익하다. 그러고 나면 때로는 우리 제도에도 묻고 싶은 것이 생긴다."
 NFP69_OPEN_OTHER:0 "외국 [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName] 측에서 새 법 소식이 왔다. 남의 제도를 논하기는 멀리서가 가장 쉽다. 하지만 무엇이 달라졌는지 먼저 읽는 편이 더 유익하다. 그러고 나면 때로는 우리 제도에도 묻고 싶은 것이 생긴다."
 NFP69_OPEN_OVERLORD:0 "우리 종주국 [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName] 측에서 새 법 소식이 왔다. 남의 제도를 논하기는 멀리서가 가장 쉽다. 하지만 무엇이 달라졌는지 먼저 읽는 편이 더 유익하다. 그러고 나면 때로는 우리 제도에도 묻고 싶은 것이 생긴다."
 NFP69_OPEN_RIVAL:0 "우리 경쟁국 [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName] 측에서 새 법 소식이 왔다. 남의 제도를 논하기는 멀리서가 가장 쉽다. 하지만 무엇이 달라졌는지 먼저 읽는 편이 더 유익하다. 그러고 나면 때로는 우리 제도에도 묻고 싶은 것이 생긴다."
 NFP69_OPEN_SUBJECT:0 "우리 종속국 [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName] 측에서 새 법 소식이 왔다. 남의 제도를 논하기는 멀리서가 가장 쉽다. 하지만 무엇이 달라졌는지 먼저 읽는 편이 더 유익하다. 그러고 나면 때로는 우리 제도에도 묻고 싶은 것이 생긴다."
 NFP69_POLICY_LAW_AFFIRMATIVE_ACTION:0 "그동안 사회의 변두리로 밀려나 있던 집단에 특별한 지원을 제공한다. 누구에게나 같은 문패를 보여 주는 데 그치지 않고, 쌓인 불평등을 넘어 문 안으로 들어설 수 있도록 돕겠다는 평등의 해석이다."
 NFP69_POLICY_LAW_AGRARIANISM:0 "농업과 농촌 공동체를 우선하는 경제 노선을 택했다. 이제 경제 정책의 관심은 공장 정문보다 들판과 마을 쪽에 더 가까이 가 있다."
 NFP69_POLICY_LAW_ANARCHY:0 "지역 공동체는 스스로 다스리고 공동 평의회에 임시 대표를 보낸다. 상설 지휘 계통을 밑바탕에 두지 않은 만큼, 결정은 공동체들이 서로 뜻을 모아 내려야 한다."
 NFP69_POLICY_LAW_ANTI_STRIKE_LAWS:0 "노동자의 단체 결성은 허용하지만 파업과 일부 집단 요구는 여전히 금지한다. 조직을 세울 수는 있어도 그 조직이 요구를 관철할 수단 중 몇 가지는 법이 막아 두었다."
 NFP69_POLICY_LAW_APPOINTED_BUREAUCRATS:0 "정부가 관리를 임명하고 공직 수행의 대가로 봉급을 지급한다. 관직을 주는 쪽과 일의 책임을 물을 쪽은 모두 임명장에 서명하는 사람들이다."
 NFP69_POLICY_LAW_AUTOCRACY:0 "최고 권력은 국가원수에게 집중되며 그는 지상의 다른 권력에 책임을 지지 않는다. 무슨 논쟁이 벌어질지는 몰라도 마지막 말을 누가 할지는 이미 정해져 있다."
 NFP69_POLICY_LAW_BAKUFU:0 "천황의 이름으로 통치하는 쇼군이 모든 권한을 쥔다. 국가 질서의 맨 위에 적힌 이름과 실제로 결정을 내리는 손이 서로 다른 역할을 맡는 체제다."
 NFP69_POLICY_LAW_CAESAROPAPISM:0 "정교회의 제단은 그대로지만 교회 사무의 최종 결정권은 국가에 있다. 다른 종교의 신도들은 법 앞에서 동등한 대우를 받지 못한다."
 NFP69_POLICY_LAW_CANTON_SYSTEM:0 "대외 무역은 오직 한 해안 지역을 통해서만 허용된다. 외국 상품에 열어 둔 문이 좁을수록 국가는 드나드는 물건을 살피기 쉽다."
 NFP69_POLICY_LAW_CENSORSHIP:0 "언론은 검열을 받고 집회의 권리는 인정되지 않는다. 활자가 독자에게 닿기까지 당국에는 그 걸음을 멈춰 세울 기회가 있다."
 NFP69_POLICY_LAW_CENSUS_VOTING:0 "정해진 자격을 갖춘 교육받은 남성에게 선거권을 준다. 글을 읽을 수 있는지, 사회적 지위는 어떠한지가 유권자 명단에 들기 위한 조건이 된다."
 NFP69_POLICY_LAW_CHARITABLE_HEALTH_SYSTEM:0 "환자를 돌볼 책임을 종교 단체를 비롯한 자선 단체에 맡긴다. 치료는 돕겠다고 나선 이들의 재원에 달려 있다. 이 제도에서 기부금은 당장 약과 치료로 이어지는 돈이다."
 NFP69_POLICY_LAW_CHIEFDOM:0 "통치는 혈연을 바탕으로 명문 가계에서 나온 추장이나 원로를 중심으로 이루어진다. 넓은 지역을 다스릴 복잡한 행정 조직의 자리를 개인과 가문의 권위가 대신한다."
 NFP69_POLICY_LAW_CHIEFS_DISTRIBUTE_AID:0 "어려움에 처한 일족과 종교 기관, 전사들에게 줄 원조를 추장이 분배한다. 누가 도움을 받을지는 공동 재원을 다루는 씨족 권력을 거쳐 결정된다."
 NFP69_POLICY_LAW_CHILD_LABOR_ALLOWED:0 "어린이가 일할 수 있는 곳을 따로 제한하지 않는다. 어린 나이에 위험한 일자리도 별도로 금지되지 않으므로 아동 노동은 경제 활동의 일부로 남는다."
 NFP69_POLICY_LAW_CLOSED_BORDERS:0 "다른 나라로 이주하기 위한 출국과 국내 정착을 위한 입국을 모두 금한다. 새 삶을 찾아 떠나려는 사람에게도 이곳에 뿌리내리려는 사람에게도 국경은 장벽이 된다."
 NFP69_POLICY_LAW_COLLECTIVIZED_AGRICULTURE:0 "농민들이 집단을 이루어 함께 땅을 경작한다. 한 필지를 가꾸는 일도 공동의 살림이 되므로 노동을 어떻게 조직할지가 집단 전체의 문제가 된다."
 NFP69_POLICY_LAW_COLONIAL_ADMINISTRATION:0 "본국의 이름으로 영토를 통치하며 이 나라는 자체 주권을 갖지 않는다. 현지 행정 당국은 바깥에서 부여받은 권한 안에서 일을 맡는다."
 NFP69_POLICY_LAW_COLONIAL_EXPLOITATION:0 "식민 정책은 천연자원과 값싼 노동력을 확보하는 데 초점을 둔다. 이주민에게 땅을 마련해 주기보다 종속된 영토에서 경제적 이득을 얻으려는 정책이다."
 NFP69_POLICY_LAW_COLONIAL_RESETTLEMENT:0 "식민지는 우선 본국의 편입 주에서 온 이주민을 위한 곳이다. 토지 문제의 해답을 바다 건너에서 찾는다. 새 영토를 새 농가가 들어설 땅으로 여기는 셈이다."
 NFP69_POLICY_LAW_COLONIAL_SLAVERY:0 "식민지에서는 노예제가 허용되지만 본국 땅에 발을 들이는 순간 노예는 자유를 얻는다. 같은 나라가 제 영토의 어느 쪽에 서느냐에 따라 한 사람의 법적 운명을 달리 정한다."
 NFP69_POLICY_LAW_COMBINATION_ACTS:0 "노동자들이 어떤 형태로든 단체를 세우는 것을 법으로 금한다. 함께 일할 수는 있어도 공동의 이해를 지키기 위해 함께 조직할 수는 없다."
 NFP69_POLICY_LAW_COMMAND_ECONOMY:0 "정부가 생산의 주요 부분을 직접 지휘한다. 중요한 경제 결정은 국가 기구에 모이고, 각 기업이 어느 방향으로 일할지도 여기에서 정한다."
 NFP69_POLICY_LAW_COMMERCIALIZED_AGRICULTURE:0 "농업은 자본이 소유하는 시장 사업으로 조직된다. 들판 역시 다른 기업과 마찬가지로 투자와 수익 계산의 장에 들어간다."
 NFP69_POLICY_LAW_COMMUNAL_ADMINISTRATION:0 "일상의 행정은 노동자 조직이 맡는다. 중앙 행정의 자리는 그 조직들이 직접 뽑은 대표에게 돌아간다."
 NFP69_POLICY_LAW_COMPULSORY_PRIMARY_SCHOOL:0 "어린이는 몇 년간 초등학교에 의무적으로 다녀야 하며 그 기간에는 일할 수 없다. 법은 아이들의 하루 일과에서 품삯을 벌던 자리에 글을 배우는 시간을 넣었다."
 NFP69_POLICY_LAW_CONSUMPTION_BASED_TAXATION:0 "국고는 일반 소득세나 인두세 대신 상품 소비를 통해 세금을 거둔다. 세금 문제를 마주치는 곳은 이제 가게 앞이다. 어떤 물건을 살 때 세금이 붙는지가 중요해진다."
 NFP69_POLICY_LAW_COOPERATIVE_OWNERSHIP:0 "생산 수단을 노동자가 공동 소유하고 생산에서 생긴 잉여도 그들 사이에 분배한다. 일하던 사람들은 이제 기업에서 노동자의 자리와 주인의 자리에 함께 선다."
 NFP69_POLICY_LAW_CORPORATE_STATE:0 "국가는 공식 인정을 받은 직능 단체 사이의 협력과 사회 계급 사이의 협상을 조직한다. 어떤 이해를 대표해 발언할 권리는 인정을 받은 조직에 주어진다."
 NFP69_POLICY_LAW_CORPORATIZED_UNIONS:0 "노동자 단체는 국가의 직간접적인 통제 아래 놓이고 계급 간 협력을 지향한다. 노동을 조직하는 일도 당국이 정한 이해 조정의 틀 안에 들어가야 한다."
 NFP69_POLICY_LAW_COUNCIL_REPUBLIC:0 "노동자들이 지역 평의회 대표를 선출하고 그 평의회들을 바탕으로 국가를 운영한다. 일터에서 사람을 조직하던 방식이 이제 권력을 구성하는 방식에도 반영된다."
 NFP69_POLICY_LAW_CROWNLAND_DIETS:0 "지역 귀족의 대표로 구성된 전통 의회가 지방 행정을 맡는다. 지역 현안을 논의하는 이들은 현지 명문 가문들이다. 회의석에 누가 앉을지는 미리 정해져 있다."
 NFP69_POLICY_LAW_CULTURAL_EXCLUSION:0 "국가의 주요 문화와 공통된 특성이 있는 문화에 수용의 문을 넓힌다. 그러한 연고가 없는 문화에는 제약이 남는다. 국가는 여전히 닮았다는 증거를 요구한다."
 NFP69_POLICY_LAW_DEBT_SLAVERY:0 "빚을 갚지 못한 채무자는 채권자의 재산으로 삼을 수 있다. 갚아야 할 빚이 이제 그 사람 자신의 자유에까지 미친다."
 NFP69_POLICY_LAW_DEDICATED_POLICE:0 "통일된 훈련 기준을 갖춘 직업 경찰을 설치한다. 치안 유지가 교육과 상시 임무를 갖춘 전문 직무가 된다."
 NFP69_POLICY_LAW_DIPLOMATIC_NAVY:0 "먼바다에서 순항하고 세계 곳곳에 모습을 드러내는 데 해군의 중점을 둔다. 외교는 이제 모항에서 멀리 떨어진 곳에서도 국기를 보일 수 있는 수단을 얻는다."
 NFP69_POLICY_LAW_ELDER_COUNCIL:0 "사회에서 가장 나이가 많고 존경받는 구성원들이 통치에 참여할 권리를 갖는다. 정치적 비중을 보통 선거인 명부보다 나이와 권위에 두는 제도다."
 NFP69_POLICY_LAW_ELECTED_BUREAUCRATS:0 "각 지역 주민들이 지방관을 선출한다. 이제 그 자리에는 표를 준 주민들이 있다. 지방 권력 뒤에 수도의 결정만 있는 것은 아니다."
 NFP69_POLICY_LAW_ETHNOSTATE:0 "특정 민족 집단에만 완전한 시민 자격을 주고 다른 문화를 차별한다. 나라의 온전한 구성원이 될 권리를 출신으로 가린다."
 NFP69_POLICY_LAW_EXPANDED_LATIFUNDIAS:0 "대농장이 한층 든든한 지원을 받는다. 귀족의 정치적 영향력과 투자 수익은 커지고 농민의 정치적 지위는 약해진다. 넓은 토지가 경제와 국정에서 누리는 이점까지 법으로 뒷받침된다."
 NFP69_POLICY_LAW_EXTRACTION_ECONOMY:0 "식민지 경제를 본국의 이윤에 맞추어 운영한다. 생산이 잘 조직됐는지 재는 잣대는 그것으로 이익을 얻는 바깥의 중심지가 얼마나 가져가는가이다."
 NFP69_POLICY_LAW_EXTRAORDINARY_COMMISSION:0 "사보타주와 반혁명을 진압할 대규모 조직이 들어선다. 이런 혐의가 제기되면 이 조직이 사건을 맡게 된다."
 NFP69_POLICY_LAW_FACTORY_COUNCILS:0 "노동자 평의회가 기업을 공동으로 운영할 길이 열리고 노동조합의 정치적 지위도 강해진다. 생산 현장의 권력을 누가 쥘 것인가 하는 물음이 노동자 집단 안으로 옮겨 간다."
 NFP69_POLICY_LAW_FREEDOM_OF_CONSCIENCE:0 "국교는 유지하되 신앙을 택할 자유는 넓힌다. 일부 신앙에 대한 차별은 남는다. 양심이 움직일 자리는 넓어졌지만 국가는 예외를 두었다."
 NFP69_POLICY_LAW_FREE_TRADE:0 "상품 교환을 가로막던 국가의 장벽을 낮추고 자유 무역을 시행한다. 사업가는 판매자로서든 구매자로서든 더 많은 외국 경쟁자를 만나게 된다."
 NFP69_POLICY_LAW_FRONTIER_COLONIZATION:0 "국가에 인접한 변경 지대에 식민 정책을 집중한다. 멀리 떨어진 아무 땅이나 찾기보다는 국경 지대에 정착지를 넓혀 간다는 방침이다."
 NFP69_POLICY_LAW_GRADUATED_TAXATION:0 "배당금에 세금을 물려 넉넉한 소득을 얻는 사람들에게 조세 부담을 더 많이 지운다. 국고가 자본 소유자의 이윤을 한층 유심히 들여다보게 된다."
 NFP69_POLICY_LAW_GUARANTEED_LIBERTIES:0 "내무 기관은 주민들의 민원과 고충을 다뤄야 한다. 구금과 감시에는 상당한 근거가 필요하다. 이제는 관리가 찾아간 집주인의 권리가 그 관리의 권한에 선을 긋는다."
 NFP69_POLICY_LAW_GUILD_SYSTEM:0 "일부 수공업과 상업에 종사하려면 공인된 길드의 일원이어야 한다. 직업에 단체 문지기가 생긴 셈이다. 하고 싶다는 뜻만으로 문이 열리지는 않는다."
 NFP69_POLICY_LAW_HEREDITARY_BUREAUCRATS:0 "관직을 그 직무와 함께 부모에게서 자녀에게 물려준다. 집안의 대물림이 관청의 서류 책상에까지 이르렀다."
 NFP69_POLICY_LAW_HINDU_CASTE_CODIFIED:0 "카스트의 구분을 공식적으로 법에 담고 사회적·경제적 기회를 제한하는 데 쓴다. 옛 질서가 법전에 한 자리를 얻으면서 관습이 정식 규칙이 된다."
 NFP69_POLICY_LAW_HINDU_CASTE_ENFORCED:0 "법이 카스트의 위계를 뒷받침해 사회적 지위 사이의 이동을 제한한다. 출신은 족보의 한 줄을 넘어 허용되는 일의 경계선이 된다."
 NFP69_POLICY_LAW_HINDU_CASTE_NOT_ENFORCED:0 "카스트 소속을 이유로 사회적·경제적 진출을 법으로 제한하지 않는다. 족보가 기회를 얻기 위한 공식 통행증이던 시대는 지나간다. 다만 법령 하나로 사회의 오랜 습관까지 지워지는 것은 아니다."
 NFP69_POLICY_LAW_HOMESTEADING:0 "농민이 제 땅을 확보하고 고용한 일꾼과 함께 경작한다. 독립적인 토지 소유와 고용 노동이 한데 있는 제도다. 자기 땅을 가진 농민이라고 꼭 혼자 농사를 짓지는 않는다."
 NFP69_POLICY_LAW_INDUSTRY_BANNED:0 "중공업과 자동화를 배척하고 손으로 일하는 경제를 택한다. 이곳에서 기계는 수익성을 증명하기 전에 존재할 권리부터 입증해야 한다."
 NFP69_POLICY_LAW_INTERMEDIATE_EDO_SYSTEM:0 "신분 제한을 완화해 부유한 도시민과 농민이 하급 무사인 고케닌의 지위를 살 수 있게 한다. 특권 신분으로 드는 문은 조금 열렸지만 입장료는 여전히 비싸다."
 NFP69_POLICY_LAW_INTERNAL_COLONIZATION:0 "주류 문화권의 주민을 국내 변경에 정착시키기로 했다. 지도의 국경선은 제자리지만 앞으로 누가 이웃이 될지는 다른 문제다."
 NFP69_POLICY_LAW_INTERVENTIONISM:0 "경제의 극단을 누그러뜨리고 안정을 지키기 위해 정부가 민간 경제에 개입할 권리를 갖는다. 기업가의 자유 곁에는 일이 돌아가는 방향을 바로잡을 정부의 권한이 함께 놓인다."
 NFP69_POLICY_LAW_ISOLATIONISM:0 "일반적인 대외 무역을 포기하고 국내에서 필요한 것을 마련하는 경제를 지향한다. 수요와 공급은 주로 국경 안쪽에서 만나야 한다."
 NFP69_POLICY_LAW_JEUNE_ECOLE:0 "크고 강한 적과 싸우기 위해 작되 무장을 충실히 갖춘 함정을 중심으로 함대를 꾸린다. 바다 위의 계산에서 선체 크기만큼 소형함의 무장에도 기대를 거는 선택이다."
 NFP69_POLICY_LAW_LABOUR_SUFFRAGE:0 "이제 투표권은 생계를 꾸리는 방식에 달렸다. 일해서 번 돈으로 사는 사람은 표를 얻지만 재산 소득까지 있는 사람은 제외된다."
 NFP69_POLICY_LAW_LAISSEZ_FAIRE:0 "민간 경쟁을 중시하고 국가의 개입을 제한하는 경제 노선을 택한다. 자본을 어디로 보낼지 결정할 더 큰 재량이 기업가에게 있다."
 NFP69_POLICY_LAW_LANDED_VOTING:0 "토지나 자본을 소유한 사람에게 선거권을 준다. 시민의 의견을 묻기에 앞서 재산부터 묻는 제도다."
 NFP69_POLICY_LAW_LAND_BASED_TAXATION:0 "조세 수입의 바탕을 토지에 물리는 세금에 두며 그 부담은 주로 농민에게 돌아간다. 나라의 수입이 농업과 땅에서 일하는 사람들의 의무에 단단히 매여 있다."
 NFP69_POLICY_LAW_LATIFUNDIAS:0 "저임금 계절 노동자를 쓰는 대농장이 토지 제도의 중심을 이룬다. 일꾼의 품삯은 땅 주인이 누구인지뿐 아니라 어느 철에 농사일이 있는지에도 달려 있다."
 NFP69_POLICY_LAW_LAX_EDO_SYSTEM:0 "예전에는 사무라이만 맡던 관직과 직무를 평민에게도 개방한다. 출신과 직업 사이에 법이 조금 더 여지를 남겨 둔다."
 NFP69_POLICY_LAW_LEGACY_SLAVERY:0 "기존 노예제는 존속시키되 그 확대는 금지한다. 이미 자유를 빼앗긴 처지는 그대로 두면서 그 처지가 더 퍼질 길은 막는 법이다."
 NFP69_POLICY_LAW_LOCAL_POLICE:0 "치안을 지방 경찰 기관에 맡긴다. 경찰 조직이 지방 권력과 이어져 있으므로 치안 문제도 우선 그 지역에서 처리한다."
 NFP69_POLICY_LAW_MANORIALISM:0 "토지는 세습 소유주에게 남고 소작인은 이동의 자유를 갖는 대신 주인을 위해 무급으로 일해야 한다. 떠날 수는 있지만 그 땅을 쓰는 동안에는 주인을 위한 노동이 여전히 의무다."
 NFP69_POLICY_LAW_MASS_CONSCRIPTION:0 "보병을 대규모로 징집해 직업 군대를 보충할 수 있게 한다. 이런 제도 아래에서 군의 명부는 공방과 농가에 빈자리가 날 사람들의 명부와 가깝다."
 NFP69_POLICY_LAW_MERCANTILISM:0 "다른 나라와 겨루며 수출을 늘리고 자금을 순유입시키는 데 무역 정책의 초점을 둔다. 대외 무역은 그 경쟁에서 자국 경제의 힘을 기르는 수단이다."
 NFP69_POLICY_LAW_MERCHANT_NAVY:0 "국제 무역과 수송 화물 보호에 맞추어 해상 조직을 꾸린다. 이들에게 가장 중요한 물음은 상선이 짐을 싣고 항로 끝까지 갈 수 있느냐는 것이다."
 NFP69_POLICY_LAW_MIGRATION_CONTROLS:0 "차별받지 않는 문화와 종교에 속하는 사람에게만 이주를 허용한다. 국경을 넘을 권리가 이주민의 소속을 국가가 어떻게 평가하는가에 달려 있다."
 NFP69_POLICY_LAW_MILITARIZED_POLICE:0 "경찰에 군용 장비와 그에 맞는 훈련을 제공한다. 국내 질서를 지키는 조직이 사용하는 수단에서 군대와 가까워진다."
 NFP69_POLICY_LAW_MILITARY_BUREAUCRATS:0 "이제 관청에서도 군복 차림이 낯설지 않겠다. 고위 관리 대부분을 군에서 충원한다."
 NFP69_POLICY_LAW_MILLET_SYSTEM:0 "수니파를 국교로 유지하면서 다른 아브라함계 종교 공동체에 별도의 종교세를 물리는 대신 법적 자치와 병역 면제를 허용한다. 공동체는 자체 질서를 지키고 국고는 그 대가로 지극히 세속적인 계산서를 내민다."
 NFP69_POLICY_LAW_MONARCHY:0 "군주가 행정권을 가지며 왕조가 국가의 연속성을 상징한다. 통치 가문의 가족사가 나라 전체의 제도 속으로 들어온다."
 NFP69_POLICY_LAW_MULTICULTURAL:0 "문화에 따른 차별이나 한 문화의 공식적 우위 없이 시민권을 인정한다. 이 나라에 속할 권리를 얻기 위해 알맞은 문화적 혈통을 증명할 필요가 없어진다."
 NFP69_POLICY_LAW_NATIONAL_GUARD:0 "시민이 자발적으로 꾸린 독립 부대가 공공질서를 지킨다. 국내 안보는 이제 상근 관리만이 아니라 무장한 자원자들의 책임이기도 하다."
 NFP69_POLICY_LAW_NATIONAL_MILITIA:0 "소규모 상비군을 지역 민병대로 보완해 나라를 지킨다. 민병에게 고향은 무기를 드는 까닭이자 되도록 빨리 돌아가고 싶은 곳이다."
 NFP69_POLICY_LAW_NATIONAL_SUPREMACY:0 "국가는 주요 국민 정체성을 우선하며 공통의 유산에 더해 언어나 다른 관습을 공유하는 문화도 받아들인다. 그 밖의 문화에는 법적 장벽이 남는다. 다수와의 유사성이 문을 여는 조건이다."
 NFP69_POLICY_LAW_NEO_ABSOLUTISM:0 "전제 군주가 현대적이고 중앙집권적인 행정 조직을 바탕으로 다스린다. 관청은 새 방식으로 돌아가더라도 마지막 결정권은 여전히 한 사람에게 있다."
 NFP69_POLICY_LAW_NO_COLONIAL_AFFAIRS:0 "국가는 공식적인 식민 정책을 통해 식민지를 설치하는 일을 포기한다. 식민지 확장을 바라는 이들에게는 이를 추진할 이 법상의 수단이 사라진다."
 NFP69_POLICY_LAW_NO_HEALTH_SYSTEM:0 "국고에서 보건 비용을 부담하지 않는다. 치료가 국가 지출 밖에 있으므로 환자는 다른 재원과 기관을 통해 도움을 구해야 한다."
 NFP69_POLICY_LAW_NO_HOME_AFFAIRS:0 "소요와 반란을 진압하는 일은 정규군과 경찰에 맡긴다. 별도의 내무 기관을 두지 않고 현재의 치안·군사 조직에 기댄다."
 NFP69_POLICY_LAW_NO_MIGRATION_CONTROLS:0 "국가는 국경을 넘는 이주를 통제하지 않는다. 떠나거나 들어오기로 한 사람이 별도의 이주 금지 규정을 넘어야 할 필요가 없다."
 NFP69_POLICY_LAW_NO_POLICE:0 "조직된 경찰을 설치하는 규정이 없다. 공공질서를 지킬 책임을 전문으로 맡는 별도의 상설 부서가 없는 셈이다."
 NFP69_POLICY_LAW_NO_SCHOOLS:0 "공통의 학교 제도 없이 교육을 가정의 책임으로 둔다. 글을 배울 기회는 집안에서 마련할 수 있는 돈과 도움에 긴밀히 달려 있다."
 NFP69_POLICY_LAW_NO_SOCIAL_SECURITY:0 "스스로 생계를 꾸릴 수 없는 사람을 부양할 의무를 국가가 지지 않는다. 어려울 때 받을 도움은 공적 급여 제도 밖에서 찾아야 한다."
 NFP69_POLICY_LAW_NO_WOMENS_RIGHTS:0 "여성은 법적으로 남성 후견인 아래에 있으며 제한된 권리만 가진다. 스스로 결정을 내리려 해도 법에 정해진 후견 관계에 부딪힌다."
 NFP69_POLICY_LAW_NO_WORKERS_RIGHTS:0 "국가는 노동권에 대한 별도의 보장을 두지 않는다. 일터의 관계에서 노동자를 지켜 줄 이 법적 보호막이 빠진다."
 NFP69_POLICY_LAW_OFFICIAL_NATIONALITY:0 "국가는 러시아인을 모범 신민으로 삼고 다른 민족에게 동화를 요구한다. 집에서 다른 말을 쓰는 가족에게는 남의 이야기가 아니다."
 NFP69_POLICY_LAW_OKHRANA:0 "비밀경찰이 망명자 감시와 혁명 활동 진압을 맡는다. 국경을 넘는다고 그 시선에서 벗어나는 것은 아닌 셈이다."
 NFP69_POLICY_LAW_OLD_AGE_PENSION:0 "국가는 노년에 든 노동자의 생계를 돌볼 책임을 진다. 일을 그만둘 수 있느냐가 개인의 저축과 가족의 도움에만 달려 있던 데서 공적 지원과도 이어진다."
 NFP69_POLICY_LAW_OLIGARCHY:0 "국가원수가 선거인에게 책임을 지지 않는 소수 유력자와 권력을 나눈다. 정치에 여러 목소리가 참여하지만 초대받는 사람의 범위는 여전히 좁다."
 NFP69_POLICY_LAW_ORGANIC_REGULATION:0 "열강이 부과한 기본법으로 국가 질서를 정하고 보야르 상층의 대표들이 국가원수를 선출한다. 현지 권력은 바깥에서 규칙을 받고, 통치자를 뽑는 사람들은 매우 한정된 집단에서 나온다."
 NFP69_POLICY_LAW_OUTLAWED_DISSENT:0 "정부 비판을 불법으로 정하고 반역과 동일하게 취급한다. 신문을 쓰는 펜으로서는 한마디 지적에서 고발을 당하기까지 거리가 유난히 짧아졌다."
 NFP69_POLICY_LAW_PARLIAMENTARY_REPUBLIC:0 "입법 의회의 수장이 국가원수가 된다. 최고 행정 직위가 의회와 연결되므로 대표 기구의 구성이 특히 중요해진다."
 NFP69_POLICY_LAW_PEASANT_LEVIES:0 "변변한 훈련을 받지 못한 농민 보병을 징집해 군의 주력으로 삼는다. 쟁기를 잡는 데 익숙한 것과 대오를 지킬 줄 아는 것 사이에는 아무래도 거리가 좀 있다."
 NFP69_POLICY_LAW_PEASANT_PROPRIETORSHIP:0 "농지 대부분은 독립된 자영농이 소유하고 대규모 상업 농장은 상대적으로 적다. 자기 땅에서 일하는 농민이 농업의 중심에 선다."
 NFP69_POLICY_LAW_PEOPLE_OF_THE_BOOK:0 "이슬람 법질서 안에서 다른 아브라함계 종교의 신자에게 법적 자치와 병역 면제를 인정하고 특별 종교세를 부과한다. 제도상의 차이가 공동체의 법정과 복무, 그리고 지갑에까지 미친다."
 NFP69_POLICY_LAW_PER_CAPITA_BASED_TAXATION:0 "소득세와 함께 인두세를 매기며 인두세는 가난한 사람에게 특히 무겁다. 한 사람에게 같은 액수를 걷어도 큰 지갑과 작은 지갑에서 그 몫은 전혀 다르다."
 NFP69_POLICY_LAW_POOR_LAWS:0 "빈민에 대한 구제는 구빈원을 통해 이루어진다. 곤궁한 사람은 생계 지원을 받는 동시에 그곳에 정해진 거주와 노동 규율을 따라야 한다."
 NFP69_POLICY_LAW_PRESIDENTIAL_REPUBLIC:0 "대통령을 국가원수로 두고 대표 기구를 갖춘 공화정을 세운다. 대통령직은 국정의 중심이 되고, 누가 선거에 참여하는가는 별도의 정치권 법률에 따라 정해진다."
 NFP69_POLICY_LAW_PRIVATE_HEALTH_INSURANCE:0 "민간 병원과 개인 의료 보험을 통해 치료받는 제도다. 유료 의료를 이용할 수 있는가는 보험을 살 형편에 달려 있다. 건강 문제에 계약과 보험료가 따라붙는다."
 NFP69_POLICY_LAW_PRIVATE_SCHOOLS:0 "교육을 사립 기관에 맡긴다. 어느 학교를 고를 수 있는지는 문을 연 학교가 얼마나 있는지, 가정이 학비를 낼 수 있는지에 달려 있다."
 NFP69_POLICY_LAW_PROFESSIONAL_ARMY:0 "직업 군인으로 이루어진 상비군에 방위를 맡긴다. 군무가 이들의 본업이고 훈련은 출정 직전에 잠깐 거치는 일이 아니라 복무의 일부다."
 NFP69_POLICY_LAW_PROFESSIONAL_NAVY:0 "경쟁국을 억제할 수단으로 강력한 상비 해군을 유지한다. 이 체제에서 군함은 무기이면서 눈에 잘 띄는 외교적 논거다."
 NFP69_POLICY_LAW_PROPORTIONAL_TAXATION:0 "주로 소득에 세금을 매기고 번 돈의 대략 같은 비율을 걷는다. 국고는 납세자의 머릿수만 세지 않고 소득에 맞추어 요구액을 정한다."
 NFP69_POLICY_LAW_PROTECTED_SPEECH:0 "언론의 자유를 법으로 보호한다. 공론의 장은 넓어지고, 신문은 논거에 대한 답으로 또 다른 논거가 돌아오기를 기대할 근거를 얻는다."
 NFP69_POLICY_LAW_PROTECTIONISM:0 "무역 제한을 두어 외국의 경쟁에서 국내 산업을 보호한다. 국내 기업과 해외 경쟁자 사이에 무역 정책이 세운 장벽이 들어선다."
 NFP69_POLICY_LAW_PUBLIC_HEALTH_INSURANCE:0 "시민이 고르게 의료 서비스를 이용할 수 있도록 국가가 의료 보험 재정을 맡는다. 치료비를 개인 계산서로만 남겨 두지 않고 공동 예산으로 뒷받침한다."
 NFP69_POLICY_LAW_PUBLIC_SCHOOLS:0 "국가가 누구나 다닐 수 있는 학교와 공통된 교육 기준을 마련한다. 배움의 자리는 각 집안의 형편만이 아니라 공공의 책임이 된다."
 NFP69_POLICY_LAW_RACIAL_SEGREGATION:0 "시민권을 공통된 인종적 유산에 연결하고 출신이 다른 문화를 차별한다. 법은 주민들의 혈통에서 차이를 본 바로 그 자리에 경계선을 긋는다."
 NFP69_POLICY_LAW_REGULATORY_BODIES:0 "고용주의 행위를 제한할 임무를 국가 기관에 맡긴다. 노동 분쟁이 생겼을 때 이제 생산량뿐 아니라 규칙이 지켜지는지도 살필 곳이 생긴다."
 NFP69_POLICY_LAW_RELIGIOUS_SCHOOLS:0 "학교 교육을 종교 기관의 관할 아래 둔다. 학생은 글을 배우는 동시에 교육을 신앙과 연결해 생각하는 스승을 만나게 된다."
 NFP69_POLICY_LAW_RESTRICTED_CHILD_LABOR:0 "어린이가 공장에서 일하는 것을 금지한다. 법은 아이의 나이와 공장의 일자리 사이에 분명한 선을 긋는다."
 NFP69_POLICY_LAW_REVOLUTIONARY_GUARD:0 "노동자 민병대가 하나의 군대로 묶인다. 명령을 내릴 장교는 병사들이 직접 뽑는다."
 NFP69_POLICY_LAW_RIGHT_OF_ASSEMBLY:0 "시민에게 함께 모일 권리를 준다. 사람들이 의견을 만나게 할 자리가 생긴다. 공동으로 의논하고 요구를 내놓을 수 있다는 뜻이다."
 NFP69_POLICY_LAW_RIGHT_TO_ASSOCIATE:0 "노동자들은 특별한 제한 없이 단체를 만들고 활동할 수 있다. 공동의 이해를 위해 자체 조직을 세울 권리가 생긴다."
 NFP69_POLICY_LAW_SAKOKU:0 "외국과의 접촉을 크게 제한하고 무역도 지정된 항구에서만 허용한다. 바다 국경에 남겨 둔 몇 안 되는 문이 특별한 규칙에 따라 열린다."
 NFP69_POLICY_LAW_SECRET_POLICE:0 "반대 의견을 지닌 사람을 감시하고 정치 범죄를 수사하는 별도 조직을 만든다. 사적인 대화에 쏠리던 국가의 관심에 전담 부서가 생겼다."
 NFP69_POLICY_LAW_SERFDOM:0 "농민은 토지에 예속돼 영주를 위해 일해야 한다. 사는 곳과 생업을 바꿀 자유가 이 신분 제도에 의해 제한된다."
 NFP69_POLICY_LAW_SHINSENGUMI:0 "정예 검사 집단에 관리의 호위와 수도 순찰을 맡긴다. 통치자의 안전을 특별 무장 조직에 의탁하는, 모습이 뚜렷한 치안 제도다."
 NFP69_POLICY_LAW_SINGLE_PARTY_STATE:0 "합법적인 정치 활동을 한 정당의 손에 집중한다. 권력을 다투는 틀은 미리 정해져 있다. 그 안에서 통하는 당원증은 딱 한 종류뿐이다."
 NFP69_POLICY_LAW_SLAVERY_BANNED:0 "인간을 자기 재산으로 소유하는 일을 금지한다. 이제 남의 재산 목록에 한 사람의 자유를 합법적으로 적어 넣을 수 없다."
 NFP69_POLICY_LAW_SLAVE_TRADE:0 "국제 무역을 통해 노예를 사들이는 것을 허용한다. 강제 노동에 대한 수요가 외국 시장으로 이어지며 그 거래의 대상은 사람이 된다."
 NFP69_POLICY_LAW_SOCIAL_MONARCHY:0 "군주제를 국민의 상징으로 유지하고 국가가 직능 단체들 사이를 중재한다. 조직된 사회의 여러 이해관계가 만나는 협상 탁자 위에 왕관이 남는다."
 NFP69_POLICY_LAW_STATE_ATHEISM:0 "국가는 반종교 정책을 펴고 공공 행정에서 종교를 배제하며 모든 신앙을 제한한다. 이제 신앙 그 자체가 당국의 의심을 받는다."
 NFP69_POLICY_LAW_STATE_RELIGION:0 "교회가 국가 기관의 지위를 얻고 소수 종교는 법적으로 불평등한 처지에 놓인다. 신앙은 양심의 문제인 동시에 권력과 맺는 관계의 문제가 된다."
 NFP69_POLICY_LAW_STRICT_EDO_SYSTEM:0 "신분에 따라 직업과 권리, 허용되는 집의 구조까지 엄격히 정하며 평민이 합법적으로 사무라이가 될 수 없다. 국가가 문을 몇 개 낼지까지 신분에 따라 살피다니, 참으로 빈틈없는 질서관이다."
 NFP69_POLICY_LAW_SUBJECTHOOD:0 "주민들을 우선 군주의 신민으로 보고 문화에 관한 일은 각 공동체에 맡긴다. 하나의 국민 정체성을 만들려는 노력보다 같은 왕권 아래 속한다는 사실이 중요하다."
 NFP69_POLICY_LAW_TECHNOCRACY:0 "지식과 능력으로 선발한 비선출 평의회에 통치를 맡긴다. 여기서 다스릴 권리는 득표 결과가 아니라 실력으로 정당화된다."
 NFP69_POLICY_LAW_TENANT_FARMERS:0 "농민들은 세습 소유주의 땅에서 일하되 떠나서 다른 생업을 찾을 수 있다. 남의 토지를 빌려 경작하지만 일꾼 자신이 그 땅에 매인 것은 아니다."
 NFP69_POLICY_LAW_TERAKOYA:0 "사찰을 기반으로 한 분산형 사립 학교망에서 평민을 가르친다. 학교 생활은 단일한 국가 교육 체계보다 각 지역의 데라코야에 의지한다."
 NFP69_POLICY_LAW_THEOCRACY:0 "성직자들이 성전의 해석에 근거해 나라를 다스린다. 국가 권력에 종교적인 정당성이 주어지면서 제도를 둘러싼 논쟁은 신앙 논쟁과 가까워진다."
 NFP69_POLICY_LAW_THIRD_SECTION:0 "황제 관방에 검열과 수사를 맡는 부서가 생긴다. 정치적 반대파와 종교적 이단이 모두 조사 대상이다. 신문사로서는 업무와 직결되는 소식이다."
 NFP69_POLICY_LAW_TOTAL_SEPARATION:0 "교회를 국가 행정에서 분리하고 종교적 소속을 차별의 근거로 삼지 않는다. 무엇을 믿는지와 어떤 시민 자격을 갖는지를 법이 서로 다른 창구로 보낸다."
 NFP69_POLICY_LAW_TRADITIONALISM:0 "국가 개입이 적은 전산업적 자급 생산을 토대로 경제를 꾸린다. 산업화한 경제의 틀을 들이는 일보다 종전의 생산 방식이 우위를 유지한다."
 NFP69_POLICY_LAW_UNIVERSAL_SUFFRAGE:0 "모든 성인 남성에게 동등한 선거권을 준다. 재산 차이가 남성의 한 표에 실리는 무게를 가르지 않게 되며 여성의 지위는 별도의 법률에 따라 정해진다."
 NFP69_POLICY_LAW_WAGE_SUBSIDIES:0 "담당 기관을 통해 최저 임금을 정하고 이를 사회적 지원과 잇는다. 노동의 대가에 하한을 두고 국가가 그 하한을 떠받치겠다는 뜻이다."
 NFP69_POLICY_LAW_WARRIOR_CASTE:0 "무기 휴대와 군 복무를 특정 무사 신분에 한정하고 평민에게는 이를 허용하지 않는다. 이곳에서는 명중률을 보기 전에 출신부터 확인한다."
 NFP69_POLICY_LAW_WEALTH_VOTING:0 "부에 따라 선거권을 주며 부유한 이의 한 표에 더 큰 무게를 싣는다. 정치적 영향력을 재는 데 말 그대로 돈이 단위가 된다."
 NFP69_POLICY_LAW_WOMENS_SUFFRAGE:0 "여성이 선거권을 얻는다. 정치적 의사 표시가 한 성별의 특권이기를 그치되, 누가 선거에 참여할 수 있는지에 관한 일반 규정은 여전히 선거법으로 정한다."
 NFP69_POLICY_LAW_WOMEN_IN_THE_FIELDS:0 "여성에게 집안 경제와 농사일의 대부분을 맡겨 더 많은 남성이 전쟁과 약탈에 나설 수 있게 한다. 이 사회의 군사 조직은 뒤에 남아 살림을 꾸릴 사람이 누구인지에 의지한다."
 NFP69_POLICY_LAW_WOMEN_IN_THE_WORKPLACE:0 "여성이 유급 노동에 더 폭넓게 참여하도록 허용한다. 소득과 자립에 관한 문제가 집안 살림의 울타리를 벗어난다."
 NFP69_POLICY_LAW_WOMEN_OWN_PROPERTY:0 "여성에게 상속 재산을 포함해 재산을 소유할 권리를 준다. 여성이 의존하는 남성의 재산으로만 남던 것을 여성 자신이 소유할 수 있다."
 NFP69_POLICY_LAW_WORKER_PROTECTIONS:0 "노동자에게 폭넓은 권리를 법으로 보장한다. 고용 조건을 정할 때에는 사적인 계약서에서 마음대로 지울 수 없는 노동자에 대한 의무도 고려해야 한다."
 NFP72_BASE_1:0 "확인된 것은 새 규정 자체에 대한 전반적인 평가다. 법이 통과되기 직전의 입장은 자료에 담기지 않았다. 어느 집단의 견해와 법이 얼마나 맞는지를 말할 수는 있어도, 교체에 찬성표를 던진 쪽을 소급해 정하는 일은 신문이 하기에는 지나치게 대담하다."
 NFP72_BASE_2:0 "확인된 것은 새 규정 자체에 대한 전반적인 평가다. 법이 통과되기 직전의 입장은 자료에 담기지 않았다. 어느 집단의 견해와 법이 얼마나 맞는지를 말할 수는 있어도, 교체에 찬성표를 던진 쪽을 소급해 정하는 일은 신문이 하기에는 지나치게 대담하다."
 NFP72_GOV_1:0 "정부 안에서도 이 법에는 나름의 사연이 있다. [Localize(ScriptContainer.MakeScope.Var('nfp50_law_gov_summary').GetFlagName)] 결정은 이미 내려졌지만 그렇다고 정부에 참여한 모든 이의 생각까지 하나가 되지는 않는다. [SelectLocalization(GreaterThan_CFixedPoint(ScriptContainer.GetVariableValue('nfp50_law_gov_yes_present'), '(CFixedPoint)0'), 'NFP50_LAW_GOV_YES_NAME', 'NFP50_LAW_NO_MOVE')] [SelectLocalization(GreaterThan_CFixedPoint(ScriptContainer.GetVariableValue('nfp50_law_gov_no_present'), '(CFixedPoint)0'), 'NFP50_LAW_GOV_NO_NAME', 'NFP50_LAW_NO_MOVE')]"
 NFP72_GOV_2:0 "정부 안에서도 이 법에는 나름의 사연이 있다. [Localize(ScriptContainer.MakeScope.Var('nfp50_law_gov_summary').GetFlagName)] 결정은 이미 내려졌지만 그렇다고 정부에 참여한 모든 이의 생각까지 하나가 되지는 않는다. [SelectLocalization(GreaterThan_CFixedPoint(ScriptContainer.GetVariableValue('nfp50_law_gov_yes_present'), '(CFixedPoint)0'), 'NFP50_LAW_GOV_YES_NAME', 'NFP50_LAW_NO_MOVE')] [SelectLocalization(GreaterThan_CFixedPoint(ScriptContainer.GetVariableValue('nfp50_law_gov_no_present'), '(CFixedPoint)0'), 'NFP50_LAW_GOV_NO_NAME', 'NFP50_LAW_NO_MOVE')]"
 NFP72_IG_1:0 "참여 인원이 가장 많은 조직 집단들의 입장은 다음과 같다. [Localize(ScriptContainer.MakeScope.Var('nfp50_law_ig_1_type').GetFlagName)] — [Localize(ScriptContainer.MakeScope.Var('nfp50_law_ig_1_stance').GetFlagName)]. [SelectLocalization(GreaterThan_CFixedPoint(ScriptContainer.GetVariableValue('nfp50_law_ig_count'), '(CFixedPoint)1'), 'NFP72_SECOND', 'NFP50_LAW_NO_MOVE')] 이 목소리들은 조직을 이룬 사람들의 정치 생활을 이해하는 데 도움이 된다. 그 밖의 주민들까지 대표하는 자료는 아니다."
 NFP72_IG_2:0 "참여 인원이 가장 많은 조직 집단들의 입장은 다음과 같다. [Localize(ScriptContainer.MakeScope.Var('nfp50_law_ig_1_type').GetFlagName)] — [Localize(ScriptContainer.MakeScope.Var('nfp50_law_ig_1_stance').GetFlagName)]. [SelectLocalization(GreaterThan_CFixedPoint(ScriptContainer.GetVariableValue('nfp50_law_ig_count'), '(CFixedPoint)1'), 'NFP72_SECOND', 'NFP50_LAW_NO_MOVE')] 이 목소리들은 조직을 이룬 사람들의 정치 생활을 이해하는 데 도움이 된다. 그 밖의 주민들까지 대표하는 자료는 아니다."
 NFP72_MOVES_1:0 "사회 운동도 이번 이야기와 닿아 있다. [SelectLocalization(GreaterThan_CFixedPoint(ScriptContainer.GetVariableValue('nfp50_law_move_yes_present'), '(CFixedPoint)0'), 'NFP72_MOVE_YES', 'NFP50_LAW_NO_MOVE')] [SelectLocalization(GreaterThan_CFixedPoint(ScriptContainer.GetVariableValue('nfp50_law_move_no_present'), '(CFixedPoint)0'), 'NFP72_MOVE_NO', 'NFP50_LAW_NO_MOVE')] 견해가 일치한다고 바로 그 세력이 변화를 이루어 냈다는 뜻은 아니다. 다만 새 질서가 누구에게 더 반갑게 다가오는지는 알 수 있다."
 NFP72_MOVES_2:0 "사회 운동도 이번 이야기와 닿아 있다. [SelectLocalization(GreaterThan_CFixedPoint(ScriptContainer.GetVariableValue('nfp50_law_move_yes_present'), '(CFixedPoint)0'), 'NFP72_MOVE_YES', 'NFP50_LAW_NO_MOVE')] [SelectLocalization(GreaterThan_CFixedPoint(ScriptContainer.GetVariableValue('nfp50_law_move_no_present'), '(CFixedPoint)0'), 'NFP72_MOVE_NO', 'NFP50_LAW_NO_MOVE')] 견해가 일치한다고 바로 그 세력이 변화를 이루어 냈다는 뜻은 아니다. 다만 새 질서가 누구에게 더 반갑게 다가오는지는 알 수 있다."
 NFP72_MOVE_NO:0 "이 규정에 반대하는 운동 가운데 가장 많은 지지를 받은 유형은 ‘[Localize(ScriptContainer.MakeScope.Var('nfp50_law_move_no_type').GetFlagName)]’다."
 NFP72_MOVE_YES:0 "이 규정을 지지하는 운동 가운데 가장 많은 지지를 받은 유형은 ‘[Localize(ScriptContainer.MakeScope.Var('nfp50_law_move_yes_type').GetFlagName)]’다."
 NFP72_NO_GROUPS_1:0 "이번 변화에 대한 조직 집단의 입장은 자료에 없다. 기록이 조용하다고 모두가 동의한 것으로 읽지는 않겠다. 그 침묵이 말해 주는 것은 우리가 아는 범위뿐이다."
 NFP72_NO_GROUPS_2:0 "이번 변화에 대한 조직 집단의 입장은 자료에 없다. 기록이 조용하다고 모두가 동의한 것으로 읽지는 않겠다. 그 침묵이 말해 주는 것은 우리가 아는 범위뿐이다."
 NFP72_RELATIVE_1:0 "이 입장은 입법 절차가 끝나기 직전에 기록했다. 새 규정을 종전의 규정과 비교한 것이다. 누구에게는 기다리던 교체이고 누구에게는 정반대겠지만, 법령 아래 서명만 봐서는 대개 그 차이를 알 수 없다."
 NFP72_RELATIVE_2:0 "이 입장은 입법 절차가 끝나기 직전에 기록했다. 새 규정을 종전의 규정과 비교한 것이다. 누구에게는 기다리던 교체이고 누구에게는 정반대겠지만, 법령 아래 서명만 봐서는 대개 그 차이를 알 수 없다."
 NFP72_SECOND:0 "[Localize(ScriptContainer.MakeScope.Var('nfp50_law_ig_2_type').GetFlagName)] — [Localize(ScriptContainer.MakeScope.Var('nfp50_law_ig_2_stance').GetFlagName)]."
 NFP89_DELIVERY:0 "[SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp89_regular'), '(CFixedPoint)1'), 'NFP89_MONTHLY_ON', 'NFP89_MONTHLY_OFF')]\n\n[SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp89_urgent'), '(CFixedPoint)1'), 'NFP89_URGENT_ON', 'NFP89_URGENT_OFF')]"
 NFP89_MONTHLY_OFF:0 "현재 월간 정기 배달이 꺼져 있습니다. 이 안내 호는 보관함에 남습니다. 정기호를 다시 신청하시면 평소의 소식도 받아보실 수 있습니다."
 NFP89_MONTHLY_ON:0 "정기호를 매달 받아보기로 하셨습니다. 한 번의 심상찮은 소식만으로는 긴 사연을 다 알 수 없으니, 달마다 그 뒷이야기를 살펴보겠습니다."
 NFP89_TECH_END_COLD:0 "양국 사이에는 약속이 있지만 온기는 아직 부족하다. 그렇다고 저쪽의 발견이 가치를 잃은 것은 아니다. 모든 소식을 말다툼의 구실로 삼다 쓸 만한 기회까지 놓치지 말아야겠다."
 NFP89_TECH_END_FRIEND:0 "이번 소식은 축하할 만하다. 인사를 주고받은 뒤 서로에게 보탬이 되는 협의까지 이어지면 더욱 반갑겠다. 호의에도 가끔은 할 일을 찾아 줄 필요가 있다."
 NFP89_TECH_END_NEUTRAL:0 "그 나라가 새 지식을 얻은 것은 분명하다. 무엇을 이룰지는 앞으로 어떻게 쓰느냐에 달렸다. 우리로서도 남의 성과가 보잘것없다고 설명하는 데 힘쓰기보다 우리가 할 수 있는 일을 살피는 편이 유익하겠다."
 NFP89_TECH_END_THREAT:0 "양국 관계를 보면 마음 놓고 축하만 할 형편은 아니다. 저 나라가 무엇을 할 수 있게 됐는지 기억해 둘 만하다. 하지만 발견이 있을 때마다 전쟁 준비라고 외친다면 세상을 관찰하는 일을 참 손쉽게 대신할 수 있을 것이다."
 NFP89_TECH_OPEN_ALLY:0 "우리 동맹국 [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName] 측이 ‘[Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]’ 기술을 익혔다. 동맹국에서 편지가 와도 마음을 졸일 필요가 없는 날이 있다니 반갑다. 이제 이 발견을 어디에 쓸지 지켜볼 일이다."
 NFP89_TECH_OPEN_BLOC:0 "같은 세력 블록의 동반자 [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName] 측이 ‘[Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]’ 기술을 익혔다. 우리 울타리 안에서 할 수 있는 일이 하나 늘었다. 그렇다고 블록을 함께한다는 사실만으로 그 지식이 우리 작업장에 절로 전해지는 것은 아니다."
 NFP89_TECH_OPEN_NEIGHBOR:0 "우리 이웃 [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName] 측이 ‘[Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]’ 기술을 익혔다. 학문 소식에서는 거리가 첫째가는 조건은 아닐지 모른다. 그래도 국경을 맞대고 살림을 꾸리는 우리에게는 저쪽에서 무엇이 가능해졌는지 눈여겨볼 이유가 있다."
 NFP89_TECH_OPEN_OTHER:0 "[ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName]에서 학술 소식이 왔다. 새로 얻은 지식은 ‘[Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]’. 연구 목록에 한 줄이 늘었다. 그 한 줄 뒤에 어떤 가능성이 숨어 있는지 살펴보자."
 NFP89_TECH_OPEN_OVERLORD:0 "우리 종주국 [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName] 측이 ‘[Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]’ 기술을 익혔다. 두 나라가 맺은 관계가 책을 마음대로 빌려 주는 과학 도서관은 아니다. 그래도 종주국이 무엇을 할 수 있게 됐는지 아는 일은 유익하다."
 NFP89_TECH_OPEN_RIVAL:0 "우리 경쟁국 [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName] 측이 ‘[Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]’ 기술을 익혔다. 대수롭지 않은 소식처럼 넘기기는 쉽다. 다만 우리가 관심을 끈다고 저쪽에서 할 수 있는 일이 줄어들지는 않는다."
 NFP89_TECH_OPEN_SUBJECT:0 "우리 종속국 [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName] 측이 ‘[Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]’ 기술을 익혔다. 늘 보던 ‘종속국’이라는 한 줄에 익숙해지면 그 나라가 스스로 이룰 수 있는 일을 놓치기 쉽다. 이번 소식이 다시 볼 좋은 계기가 됐다."
 NFP89_URGENT_OFF:0 "호외 배달은 꺼져 있습니다. 전쟁과 중대한 세계 사건을 별도 호외로 받아보려면 구독 설정에서 호외를 켜 주십시오."
 NFP89_URGENT_ON:0 "호외 배달도 신청하셨습니다. 전쟁의 시작과 끝, 중대한 세계 소식은 다음 정기호까지 기다리지 않고 전해 드립니다."
 NFPTEST_PARTY_1:0 "시험 노동당 — [ScriptContainer.GetVariableValue('nfp43_now_1')|2]."
 NFPTEST_PARTY_2:0 "시험 지주당 — [ScriptContainer.GetVariableValue('nfp43_now_2')|2]."
 NFPTEST_PARTY_3:0 "시험 자유당 — [ScriptContainer.GetVariableValue('nfp43_now_3')|2]."
