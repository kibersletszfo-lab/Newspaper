 NFP52_ETH_2_TITLE:0 "아프리카의 뿔에서 지도가 달라지다"
 NFP52_FLU_1_BODY:0 "대규모 독감이 유행하기 시작했다는 소식이 들어왔다. 이런 소식은 외교적 성과를 알리는 기사와는 다르게 읽힌다. 병은 가장 소박한 바람을 건드린다. 가까운 이들이 건강하기를, 내일 아침이 그들을 걱정하는 마음으로 시작되지 않기를 바라는 마음이다.\n\n스페인 독감으로 알려진 유행병이 시작됐다. 병의 확산과 피해 지역의 사정을 살펴야 할 때다. 세계적인 소식 하나만으로 우리나라에도 이미 병이 들어왔다고 말할 수는 없다. 그렇다고 최초의 소식이 먼 곳에서 왔다는 사실을 안전의 보증서로 받아들일 수도 없다.\n\n지금 특히 필요한 것은 믿을 만한 소식이다. 불안할 때에는 모르는 자리를 소문으로 채우기 쉽지만, 그렇다고 사람들을 더 잘 돌보게 되지는 않는다. 본지는 확인되는 소식에 따라 이 문제를 다시 다룰 것이다. 되도록 빨리 위험이 물러나고 있다고 전할 수 있기를 바란다.\n\n이 소식에 적힌 날짜는 편집부가 소식을 받은 달이다. 전하는 데 시간이 걸렸다면 실제 사건은 그보다 앞서 일어났을 수 있다."
