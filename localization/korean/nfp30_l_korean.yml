 NFP52_CAN_2_LEAD:0 "캐나다가 하나의 국가 체제를 갖췄다. 밖에서 보면 지도에 생긴 변화다. 캐나다 각지의 사람들에게는 전보다 많은 사안을 함께 결정할 기회다. 이제는 같은 지명 아래 있다는 것 이상의 공통점이 생겼다."
 NFP52_CAN_2_TITLE:0 "캐나다의 여러 땅, 하나의 나라로"
 NFP52_CHINA_1_BODY:0 "중국이 예전의 통일을 잃었다. 지도에서 낯익던 커다란 한 덩어리 안에 이제 여러 권력의 중심이 있다. 외교관에게는 새로 적어 둘 주소들이다. 새 국경 너머에서 장사를 해야 하는 사람에게는 조금 다른 물음이다. 예전에 한 약속 가운데 아직 값어치가 남은 것은 무엇인가.\n\n하나였던 권력이 무너졌다. 독립된 정부들은 서로의 관계를 정해야 하고, 바깥세상은 앞으로 누구와 약속을 맺을지 알아내야 한다. 독자라면 누구나 익히 아는 나라 이름이다. 그 이름으로 누가 말하는지에 대한 답은 한층 어려워졌다.\n\n새 지도 뒤에도 일상은 남아 있다. 누구의 규칙이 위에 서는지 권력자들이 따지는 동안에도 사람들에게는 일자리와 거래, 이해할 수 있는 규칙이 필요하다. 분열의 끝은 시간이 알려 줄 것이다. 결정에 목소리를 내기 가장 어려운 이들이 그 대가까지 치르는 일은 없었으면 한다.\n\n이 소식에 적힌 날짜는 편집부가 소식을 받은 달이다. 전하는 데 시간이 걸렸다면 실제 사건은 그보다 앞서 일어났을 수 있다."
