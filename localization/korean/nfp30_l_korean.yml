 NFP52_AUS_2_TITLE:0 "먼 대륙에 하나의 국가가 서다"
 NFP52_CAN_1_BODY:0 "캐나다가 하나의 국가 체제를 갖췄다. 밖에서 보면 지도에 생긴 변화다. 캐나다 각지의 사람들에게는 전보다 많은 사안을 함께 결정할 기회다. 이제는 같은 지명 아래 있다는 것 이상의 공통점이 생겼다.\n\n캐나다의 통합이 이루어졌다. 그 안에 든 지역들의 공동 사무를 맡을 나라가 생겼다. 종주국과의 관계는 따로 정해진다. 나라를 하나로 합친 일이 그 자체로 독립 선언은 아니다.\n\n이제 공동의 결정에 내용을 채워 넣을 차례다. 새 간판을 달았다고 거리도, 살림살이도, 지역마다 다른 이해관계도 없어지지는 않는다. 다만 이런 물음을 보낼 공동의 주소는 생겼다. 그곳에서 답장도 받아 볼 수 있기를 바란다.\n\n이 소식에 적힌 날짜는 편집부가 소식을 받은 달이다. 전하는 데 시간이 걸렸다면 실제 사건은 그보다 앞서 일어났을 수 있다."
