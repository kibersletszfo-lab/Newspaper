 NFP43_ELECTION_TITLE_1:0 "투표함은 아직 열리지 않았다. 지금은 유권자의 마음을 얻을 때"
 NFP43_ELECTION_TITLE_2:0 "투표함은 아직 열리지 않았다. 지금은 유권자의 마음을 얻을 때"
 NFP43_FRONT_PAGE:0 "1면"
 NFP43_THIS_ISSUE:0 "이번 호의 소식"
 NFP43_THIS_ISSUE_URGENT:0 "이번 호의 소식 · 호외"
 NFP43_WELCOME_1_BODY:0 "필요한 물건을 살 수 있고, 일터에 다녀와 하루를 살아갈 만큼의 품삯을 손에 쥔다면 다행이다. 경제면에서는 물건 사정과 붐비는 길, 그리고 공동 시장에 닿기 어려운 지역을 다룬다. 그 어려움이 풀린 날도 빼놓지 않을 것이다.\n\n큼지막한 숫자만으로 장바구니가 차지는 않는다. 경제가 이룬 성과 곁에 사람들의 살림살이도 함께 실을 까닭이다. 조용한 달에는 시세표를 펼쳐 보자. 편집부가 애써 화제를 만들지 않아도 물가는 경제에 대한 관심을 끄는 재주가 있으니."
 NFP43_WELCOME_1_LEAD:0 "경제면에 오신 독자 여러분을 환영한다. 어려움이 일상이 되어 버리기 전에 눈여겨보려 한다."
 NFP43_WELCOME_1_TITLE:0 "경제는 통계표 밖에서 시작된다"
 NFP43_WELCOME_2_BODY:0 "전쟁은 지도 위에 전선을 그리는 이들만의 일이 아니다. 이 지면에서는 충돌이 시작되고 끝나는 과정, 동맹과 우리 세력 블록의 변화를 따라갈 것이다. 외교 위기가 닥치면 누가 무엇을 요구했는지, 누가 어느 편을 들었고 어느 쪽이 물러섰는지 살펴본다.\n\n호외 배달을 허용해 두면 큰 소식은 별도 호외로 받아볼 수 있다. 협상이 잘 풀렸다는 기사를 자주 쓸 수 있으면 좋겠다. 그래도 궂은 소식은 그 여파를 몸으로 겪고 나서 알기보다 제때 지면에서 읽는 편이 낫다."
 NFP43_WELCOME_2_LEAD:0 "전쟁면에서는 충돌의 시작과 끝, 그리고 나라의 안전에 영향을 주는 변화를 다룬다."
 NFP43_WELCOME_2_TITLE:0 "조약과 대포 사이"
 NFP43_WELCOME_3_BODY:0 "사람들은 글을 읽을 수 있는가, 어떻게 살아가고 있는가, 선거철에는 무슨 일이 벌어지는가. 사회면에서 다룰 물음들이다. 달라진 국경선보다 달라진 사회의 모습을 알아채기가 더 어려울 때도 있다. 익숙한 지명 뒤에서 무엇이 변하는지 들여다볼 맛이 나는 이유다.\n\n선거철에는 각 당의 선거 운동을 지난 보도와 비교한다. 운동의 기세가 곧 득표수는 아니다. 선거 전의 자신감은 전염되기 쉽다. 편집부만큼은 개표를 기다릴 줄 아는 인내심을 잃지 않으려 한다."
 NFP43_WELCOME_3_LEAD:0 "교육의 성과와 우리나라 사람들의 삶에서 일어난 변화가 이 지면을 채울 것이다."
 NFP43_WELCOME_3_TITLE:0 "나라를 이루는 것은 사람이다"
 NFP43_WELCOME_4_BODY:0 "이 지면에서는 법률과 새 지식, 여러 나라의 지위 변화가 만난다. 우리 성과를 자랑스러워하는 것도 좋다. 남의 성과도 눈여겨볼 만하다. 우리는 어째서 아직 같은 일을 해내지 못했나 하는 물음이 따라올 때는 더욱 그렇다.\n\n첫 면에서 관심을 끄는 기사를 골라 각 면으로 넘어가면 된다. 지난 호는 열두 호까지 보관한다. 이야기의 뒷부분을 알고 나서야 앞선 호의 자신만만했던 한 줄이 새삼 흥미로워질 때가 있다."
 NFP43_WELCOME_4_LEAD:0 "눈여겨볼 나라 안팎의 변화와 새로운 지식, 굵직한 외신을 한데 모으는 지면이다."
 NFP43_WELCOME_4_TITLE:0 "익숙한 풍경 너머"
 NFP43_WELCOME_METRICS:0 "신문을 소개하는 창간 기사다. 네 지면을 모두 소개하며 이후 정기호는 구독 설정에 따라 발행된다. 관측 기록은 초기화 없이 이어진다. 비교할 이전 관측값이 없으면 변화량을 계산하지 않는다."
 NFP43_WELCOME_REACH:0 "자국 독자를 위한 안내 기사"
 NFP43_WELCOME_REASON:0 "구독 확정 때 제공하는 신문 안내"
 NFP45_ARCHIVE_NOTE:0 "구독하면 매달 정기호를 받습니다. 읽은 신문은 보관함에서 다시 볼 수 있습니다."
 NFP47_CONFIRM:0 "선택 확인"
 NFP47_CONFIRM_HINT:0 "배달 설정을 저장하고 신문으로 돌아갑니다."
 NFP47_EDITION:0 "국민신문"
 NFP47_FOOTNOTE:0 "언제든 설정을 바꿀 수 있습니다. 지난 호는 그대로 보관됩니다."
 NFP47_MONTHLY:0 "월간 정기호"
 NFP47_MONTHLY_NOTE:0 "국내외 소식을 매달 한 호에 담아 전합니다."
 NFP47_READER:0 "구독자: [GetPlayer.GetName]"
 NFP47_REQUEST:0 "다음 신문을 받아 보고자 합니다."
 NFP47_RETURN:0 "신문으로 돌아가기"
