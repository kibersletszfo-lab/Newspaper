 NFP50_FAMILY_WAR_START_HOME_END_2:0 "이제 전쟁은 우리 자신의 일이 됐다. 시작은 한 줄로 전할 수 있다. 그 뒤에 따를 일은 한 줄에 다 담기지 않을 것이다. 되도록 빨리 평화 소식을 싣고 싶다. 그동안은 전쟁 소식을 주의 깊게 읽되 희망을 서둘러 승전보로 바꾸지는 않겠다."
 NFP50_FAMILY_WELCOME_1_1:0 "필요한 물건을 살 수 있고, 일터에 다녀와 하루를 살아갈 만큼의 품삯을 손에 쥔다면 다행이다. 경제면에서는 물건 사정과 붐비는 길, 그리고 공동 시장에 닿기 어려운 지역을 다룬다. 그 어려움이 풀린 날도 빼놓지 않을 것이다."
 NFP50_FAMILY_WELCOME_1_2:0 "큼지막한 숫자만으로 장바구니가 차지는 않는다. 경제가 이룬 성과 곁에 사람들의 살림살이도 함께 실을 까닭이다. 조용한 달에는 시세표를 펼쳐 보자. 편집부가 애써 화제를 만들지 않아도 물가는 경제에 대한 관심을 끄는 재주가 있으니."
 NFP50_FAMILY_WELCOME_2_1:0 "전쟁은 지도 위에 전선을 그리는 이들만의 일이 아니다. 이 지면에서는 충돌이 시작되고 끝나는 과정, 동맹과 우리 세력 블록의 변화를 따라갈 것이다. 외교 위기가 닥치면 누가 무엇을 요구했는지, 누가 어느 편을 들었고 어느 쪽이 물러섰는지 살펴본다."
 NFP50_FAMILY_WELCOME_2_2:0 "호외 배달을 허용해 두면 큰 소식은 별도 호외로 받아볼 수 있다. 협상이 잘 풀렸다는 기사를 자주 쓸 수 있으면 좋겠다. 그래도 궂은 소식은 그 여파를 몸으로 겪고 나서 알기보다 제때 지면에서 읽는 편이 낫다."
 NFP50_FAMILY_WELCOME_3_1:0 "사람들은 글을 읽을 수 있는가, 어떻게 살아가고 있는가, 선거철에는 무슨 일이 벌어지는가. 사회면에서 다룰 물음들이다. 달라진 국경선보다 달라진 사회의 모습을 알아채기가 더 어려울 때도 있다. 익숙한 지명 뒤에서 무엇이 변하는지 들여다볼 맛이 나는 이유다."
 NFP50_FAMILY_WELCOME_3_2:0 "선거철에는 각 당의 선거 운동을 지난 보도와 비교한다. 운동의 기세가 곧 득표수는 아니다. 선거 전의 자신감은 전염되기 쉽다. 편집부만큼은 개표를 기다릴 줄 아는 인내심을 잃지 않으려 한다."
 NFP50_FAMILY_WELCOME_4_1:0 "이 지면에서는 법률과 새 지식, 여러 나라의 지위 변화가 만난다. 우리 성과를 자랑스러워하는 것도 좋다. 남의 성과도 눈여겨볼 만하다. 우리는 어째서 아직 같은 일을 해내지 못했나 하는 물음이 따라올 때는 더욱 그렇다."
 NFP50_FAMILY_WELCOME_4_2:0 "첫 면에서 관심을 끄는 기사를 골라 각 면으로 넘어가면 된다. 지난 호는 열두 호까지 보관한다. 이야기의 뒷부분을 알고 나서야 앞선 호의 자신만만했던 한 줄이 새삼 흥미로워질 때가 있다."
 NFP50_FAMILY_WELCOME_END_1:0 "이제 막 첫인사를 나눴다. 앞으로 지난 일을 다시 찾아 무엇이 바뀌었는지 살펴보겠다. 예전의 걱정스러운 기사를 다시 펼칠 이유가 반가운 새 소식일 때가 더 많아지기를 바란다.\n\n$NFP89_DELIVERY$"
 NFP50_FAMILY_WELCOME_END_2:0 "이제 막 첫인사를 나눴다. 앞으로 지난 일을 다시 찾아 무엇이 바뀌었는지 살펴보겠다. 예전의 걱정스러운 기사를 다시 펼칠 이유가 반가운 새 소식일 때가 더 많아지기를 바란다.\n\n$NFP89_DELIVERY$"
 NFP50_LAW_APPROVE:0 "지지"
 NFP50_LAW_END_1:0 "이제 법이 일상의 일부가 될 차례다. 찬성하는 이들은 벌써 성공이라고, 반대하는 이들은 실수라고 할 수 있다. 편집부로서는 새 규칙이 작동할 때 두 설명 사이에서 실제로 무슨 일이 일어날지 더 궁금하다. 좋은 법은 읽기에도 반갑다. 그 법 아래서 잘 살아간다면 더욱 반갑다."
 NFP50_LAW_END_2:0 "이제 법이 일상의 일부가 될 차례다. 찬성하는 이들은 벌써 성공이라고, 반대하는 이들은 실수라고 할 수 있다. 편집부로서는 새 규칙이 작동할 때 두 설명 사이에서 실제로 무슨 일이 일어날지 더 궁금하다. 좋은 법은 읽기에도 반갑다. 그 법 아래서 잘 살아간다면 더욱 반갑다."
