 NFP52_ROM_2_TITLE:0 "루마니아 통일 성립"
 NFP52_SPRING_1_BODY:0 "유럽에서 민족들의 봄이 시작됐다. 잇따른 정치적 격변을 어느 한 나라의 내정만으로 보기 어려워졌다. 누가 권력을 쥐고 사회가 어디로 갈지에 관한 물음은 차분한 토론의 범위를 한참 넘어섰다.\n\n혁명의 물결이 유럽의 현실이 됐다. 나라마다 사정이 다르고 사건이 흘러가는 길도 다르다. 하지만 남의 나라 소요는 끝까지 남의 일로 남으리라는 종전의 확신에는 이제 국경까지의 거리보다 더 든든한 근거가 필요하다.\n\n이름은 봄을 약속하지만 결말은 앞으로 겪어야 한다. 변화를 바라는 마음 뒤에는 정확히 무엇을 바꿔야 하는가를 둘러싼 의견 차이가 있다. 본지는 각지의 사연을 따로 살필 것이다. 시대에 하나의 이름이 붙었다고 사람들의 운명까지 같아지지는 않는다.\n\n이 소식에 적힌 날짜는 편집부가 소식을 받은 달이다. 전하는 데 시간이 걸렸다면 실제 사건은 그보다 앞서 일어났을 수 있다."
