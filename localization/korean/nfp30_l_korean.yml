l_korean:
 NFP30_ACCESS_HOME_1_BODY:0 "지역 [SelectLocalization(And(ScriptContainer.MakeScope.Var('nfp20_problem_state').IsSet, ScriptContainer.MakeScope.Var('nfp20_problem_state').GetState.IsValid), 'NFP40_STATE_LINK', 'NFP40_REGION_FALLBACK')]. 시장 접근성이 두 달 연속 90%를 밑돌았다. 최근 값은 [Multiply_CFixedPoint(ScriptContainer.GetVariableValue('nfp20_after'), '(CFixedPoint)100')|1]%.\n\n확인된 자료만으로는 원인을 단정할 수 없다. 현지 기반 시설과 해상 연결, 그 밖의 제약을 살펴야 한다. 철도에만 책임을 돌리기에는 이르다."
 NFP30_ACCESS_HOME_1_LEAD:0 "우리 지역의 시장 접근성이 여전히 낮다. 경제적 성취만큼이나 이 어려움에도 관심을 기울일 만하다."
 NFP30_ACCESS_HOME_1_TITLE:0 "우리 시장까지의 길은 아직도 멀다"
 NFP30_ACCESS_HOME_2_BODY:0 "지역 [SelectLocalization(And(ScriptContainer.MakeScope.Var('nfp20_problem_state').IsSet, ScriptContainer.MakeScope.Var('nfp20_problem_state').GetState.IsValid), 'NFP40_STATE_LINK', 'NFP40_REGION_FALLBACK')]. 시장 접근성이 두 달 연속 90%를 밑돌았다. 최근 값은 [Multiply_CFixedPoint(ScriptContainer.GetVariableValue('nfp20_after'), '(CFixedPoint)100')|1]%.\n\n수치는 접근이 제한됐음을 가리킬 뿐 어디에서 문제가 생겼는지까지 설명하지는 않는다. 대책을 고르기 전에 연결이 끊긴 곳부터 찾아야 한다."
 NFP30_ACCESS_HOME_2_LEAD:0 "시장으로 가는 길이 두 달째 순탄치 않다. 이 지역과 나라 전체의 경제를 잇는 연결을 다시 지면에 올릴 까닭이다."
 NFP30_ACCESS_HOME_2_TITLE:0 "시장이 다시 가까워지기를 기다리는 지역"
 NFP30_ACCESS_METRICS:0 "지역 [SelectLocalization(And(ScriptContainer.MakeScope.Var('nfp20_problem_state').IsSet, ScriptContainer.MakeScope.Var('nfp20_problem_state').GetState.IsValid), 'NFP40_STATE_LINK', 'NFP40_REGION_FALLBACK')]. 시장 접근성이 두 달 연속 90%를 밑돌았다. 최근 값은 [Multiply_CFixedPoint(ScriptContainer.GetVariableValue('nfp20_after'), '(CFixedPoint)100')|1]%."
 NFP30_ACCESS_RECOVERY_HOME_1_BODY:0 "지역 [SelectLocalization(And(ScriptContainer.MakeScope.Var('nfp20_problem_state').IsSet, ScriptContainer.MakeScope.Var('nfp20_problem_state').GetState.IsValid), 'NFP40_STATE_LINK', 'NFP40_REGION_FALLBACK')]. 앞서 경고할 때의 시장 접근성은 [Multiply_CFixedPoint(ScriptContainer.GetVariableValue('nfp20_before'), '(CFixedPoint)100')|1]%, 최근 값은 [Multiply_CFixedPoint(ScriptContainer.GetVariableValue('nfp20_after'), '(CFixedPoint)100')|1]%다. 두 달 연속 90% 이상을 유지했다.\n\n두 달에 걸쳐 개선이 이어진 일을 반갑게 기록한다. 그렇다고 현지의 어려움이 모두 풀렸다거나 확인되지 않은 원인 덕이라고 할 근거는 없다."
 NFP30_ACCESS_RECOVERY_HOME_1_LEAD:0 "우리 지역의 불편한 시장 접근성에 관해 반가운 뒷이야기가 들어왔다."
 NFP30_ACCESS_RECOVERY_HOME_1_TITLE:0 "공동 시장이 다시 가까워졌다"
 NFP30_ACCESS_RECOVERY_HOME_2_BODY:0 "지역 [SelectLocalization(And(ScriptContainer.MakeScope.Var('nfp20_problem_state').IsSet, ScriptContainer.MakeScope.Var('nfp20_problem_state').GetState.IsValid), 'NFP40_STATE_LINK', 'NFP40_REGION_FALLBACK')]. 앞서 경고할 때의 시장 접근성은 [Multiply_CFixedPoint(ScriptContainer.GetVariableValue('nfp20_before'), '(CFixedPoint)100')|1]%, 최근 값은 [Multiply_CFixedPoint(ScriptContainer.GetVariableValue('nfp20_after'), '(CFixedPoint)100')|1]%다. 두 달 연속 90% 이상을 유지했다.\n\n두 달 연속으로 사정이 나아졌으니 조심스럽게 반길 만하다. 변화의 원인과 개별 사업장의 사정은 따로 확인해야 한다."
 NFP30_ACCESS_RECOVERY_HOME_2_LEAD:0 "본지가 걱정하던 문제에 관해 좋은 소식이 왔다. 이 지역의 시장 접근성이 나아졌다."
 NFP30_ACCESS_RECOVERY_HOME_2_TITLE:0 "시장으로 이어지는 길이 든든해지다"
 NFP30_ACCESS_RECOVERY_METRICS:0 "지역 [SelectLocalization(And(ScriptContainer.MakeScope.Var('nfp20_problem_state').IsSet, ScriptContainer.MakeScope.Var('nfp20_problem_state').GetState.IsValid), 'NFP40_STATE_LINK', 'NFP40_REGION_FALLBACK')]. 앞서 경고할 때의 시장 접근성은 [Multiply_CFixedPoint(ScriptContainer.GetVariableValue('nfp20_before'), '(CFixedPoint)100')|1]%, 최근 값은 [Multiply_CFixedPoint(ScriptContainer.GetVariableValue('nfp20_after'), '(CFixedPoint)100')|1]%다. 두 달 연속 90% 이상을 유지했다."
 NFP30_ARTICLE_DETAILS:0 "[SelectLocalization(ScriptContainer.HasVariable('nfp63_schema'), 'NFP63_DETAILS', 'NFP50_EMPTY')]\n편집부 기록\n기록 번호 [ScriptContainer.GetVariableValue('nfp20_id')|0], 사안 번호 [ScriptContainer.GetVariableValue('nfp20_episode')|0].\n선정 기준 [Localize(ScriptContainer.MakeScope.Var('nfp20_reason').GetFlagName)]. 우선순위 [ScriptContainer.GetVariableValue('nfp20_priority')|0].\n[Localize(ScriptContainer.MakeScope.Var('nfp30_metrics').GetFlagName)]\n보도 관점 [SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp30_domestic'), '(CFixedPoint)1'), 'NFP30_HOME', 'NFP30_AWAY')], 문안 [ScriptContainer.GetVariableValue('nfp30_variant')|0].\n국명은 고정된 국가 정의를 바탕으로 표시한다. 시기에 따라 변하는 국명은 따로 저장하지 않았다.\n[SelectLocalization(ScriptContainer.HasVariable('nfp63_schema'), 'NFP50_EMPTY', SelectLocalization(ScriptContainer.HasVariable('nfp31_reach'), 'NFP30_REACH_LINE', 'NFP30_REACH_OLD'))]"
 NFP30_ARTICLE_META:0 "[ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName] · [ScriptContainer.GetVariableValue('nfp20_year')|0]년 [Localize(ScriptContainer.MakeScope.Var('nfp30_month').GetFlagName)] · [Localize(ScriptContainer.MakeScope.Var('nfp30_rubric').GetFlagName)]"
 NFP30_ARTICLE_TEXT:0 "[Localize(ScriptContainer.MakeScope.Var('nfp30_lead').GetFlagName)]\n\n[Localize(ScriptContainer.MakeScope.Var('nfp30_body').GetFlagName)]"
 NFP30_AWAY:0 "외국 소식"
 NFP30_CONTENTS:0 "이번 호의 소식"
 NFP30_COVER:0 "첫 면으로"
 NFP30_DETAILS:0 "자세히"
 NFP30_DETAILS_CLOSE:0 "상세 정보 닫기"
 NFP30_DIVERGENCE_HOME_1_BODY:0 "세 달 사이 예상 연간 국내총생산은 [ScriptContainer.GetVariableValue('nfp20_before')|0]에서 [ScriptContainer.GetVariableValue('nfp20_after')|0]까지 늘었다. 같은 기간 평균 생활 수준은 [ScriptContainer.GetVariableValue('nfp20_extra')|2]점 하락했다.\n\n경제 전체의 덩치가 커진다고 각 가정의 삶이 곧바로 넉넉해지지는 않는다. 편집부는 주민들의 형편을 나라의 중요한 일로 여긴다. 두 수치가 갈라진 이유는 따로 짚어 볼 문제다."
 NFP30_DIVERGENCE_HOME_1_LEAD:0 "경제 성장은 자랑할 만한 일이지만 생활 수준의 하락도 그만큼 유심히 볼 일이다."
 NFP30_DIVERGENCE_HOME_1_TITLE:0 "경제는 성장했는데 살림은 더 팍팍해졌다"
 NFP30_DIVERGENCE_HOME_2_BODY:0 "세 달 사이 예상 연간 국내총생산은 [ScriptContainer.GetVariableValue('nfp20_before')|0]에서 [ScriptContainer.GetVariableValue('nfp20_after')|0]까지 늘었다. 같은 기간 평균 생활 수준은 [ScriptContainer.GetVariableValue('nfp20_extra')|2]점 하락했다.\n\n나라에는 일상에서도 느낄 수 있는 성과가 필요하다. 이 수치만으로 살림이 어려워진 까닭을 설명하거나 누구에게 책임을 돌릴 수는 없다."
 NFP30_DIVERGENCE_HOME_2_LEAD:0 "우리 경제는 커졌고 평균 생활 수준은 내려갔다. 두 소식 모두 첫 면에 올릴 만하다."
 NFP30_DIVERGENCE_HOME_2_TITLE:0 "경제 성과 뒤에 놓인 심상찮은 숫자"
 NFP30_DIVERGENCE_METRICS:0 "세 달 사이 예상 연간 국내총생산은 [ScriptContainer.GetVariableValue('nfp20_before')|0]에서 [ScriptContainer.GetVariableValue('nfp20_after')|0]까지 늘었다. 같은 기간 평균 생활 수준은 [ScriptContainer.GetVariableValue('nfp20_extra')|2]점 하락했다."
 NFP30_EMPTY:0 "이번 호에 선택한 지면에는 새 기사가 없습니다. 다음 소식이 들어오면 새 호에서 전해 드립니다."
 NFP30_GDP_LEADER_AWAY_1_BODY:0 "10위권 밖에 있을 때는 [ScriptContainer.GetVariableValue('nfp20_before')|0]위, 최근에는 [ScriptContainer.GetVariableValue('nfp20_after')|0]위다. 두 달 연속 10위권을 지켰다.\n\n우리 독자에게도 세계 경제의 판도가 달라지는 소식이다. 주민들의 살림이 넉넉한지, 개별 업종이 이익을 내는지까지 입증하지는 않는다."
 NFP30_GDP_LEADER_AWAY_1_LEAD:0 "한 외국이 국내총생산 10위권에 안착하며 세계 경제 상위권의 구성이 달라졌다."
 NFP30_GDP_LEADER_AWAY_1_TITLE:0 "세계 10대 경제국에 새 얼굴"
 NFP30_GDP_LEADER_AWAY_2_BODY:0 "10위권 밖에 있을 때는 [ScriptContainer.GetVariableValue('nfp20_before')|0]위, 최근에는 [ScriptContainer.GetVariableValue('nfp20_after')|0]위다. 두 달 연속 10위권을 지켰다.\n\n이 순위는 예상 연간 국내총생산을 기준으로 매긴 것이다. 우리 무역에 어떤 영향이 미칠지는 이것만으로 말할 수 없다."
 NFP30_GDP_LEADER_AWAY_2_LEAD:0 "새로 10위권에 든 나라가 두 달째 자리를 지켰다."
 NFP30_GDP_LEADER_AWAY_2_TITLE:0 "한 외국 경제가 세계 상위권에 자리를 잡다"
 NFP30_GDP_LEADER_HOME_1_BODY:0 "10위권 밖에 있을 때는 [ScriptContainer.GetVariableValue('nfp20_before')|0]위, 최근에는 [ScriptContainer.GetVariableValue('nfp20_after')|0]위다. 두 달 연속 10위권을 지켰다.\n\n인정할 만한 성과다. 다만 경제 전체의 규모를 따진 순위는 주민의 생활 수준이나 기업의 이익을 재는 잣대가 아니다."
 NFP30_GDP_LEADER_HOME_1_LEAD:0 "우리나라가 예상 연간 국내총생산 기준 세계 10대 경제국에 안착했다."
 NFP30_GDP_LEADER_HOME_1_TITLE:0 "우리 경제가 세계 10위권에 들었다"
 NFP30_GDP_LEADER_HOME_2_BODY:0 "10위권 밖에 있을 때는 [ScriptContainer.GetVariableValue('nfp20_before')|0]위, 최근에는 [ScriptContainer.GetVariableValue('nfp20_after')|0]위다. 두 달 연속 10위권을 지켰다.\n\n본지는 이 성과를 반기는 한편 주민들의 살림살이에도 계속 관심을 둘 것이다. 경제의 크기가 형편에 대한 평가를 대신하지는 못한다."
 NFP30_GDP_LEADER_HOME_2_LEAD:0 "국내총생산 10위권을 두 달간 지켰으니 경제적 성과가 자리를 잡았다고 할 만하다."
 NFP30_GDP_LEADER_HOME_2_TITLE:0 "세계 주요 경제국 사이에 우리 자리도 생겼다"
 NFP30_GDP_LEADER_METRICS:0 "10위권 밖에 있을 때는 [ScriptContainer.GetVariableValue('nfp20_before')|0]위, 최근에는 [ScriptContainer.GetVariableValue('nfp20_after')|0]위다. 두 달 연속 10위권을 지켰다."
 NFP30_HOME:0 "자국 소식"
 NFP30_INFRA_HOME_1_BODY:0 "지역 [SelectLocalization(And(ScriptContainer.MakeScope.Var('nfp20_problem_state').IsSet, ScriptContainer.MakeScope.Var('nfp20_problem_state').GetState.IsValid), 'NFP40_STATE_LINK', 'NFP40_REGION_FALLBACK')]. 두 달 연속 기반 시설 수지가 음수를 기록했다. 최근 값은 [ScriptContainer.GetVariableValue('nfp20_after')|2].\n\n기반 시설 부족은 현지의 수요를 따로 점검할 만한 일이다. 본지는 지역의 모든 어려움을 그 탓으로 돌리거나 특정 건설 사업을 유일한 해법으로 선언하지 않는다."
 NFP30_INFRA_HOME_1_LEAD:0 "우리 지역의 기반 시설 수지가 계속 적자를 보인다. 이제 눈길을 미루기가 갈수록 어렵다."
 NFP30_INFRA_HOME_1_TITLE:0 "지역에는 나라에 걸맞은 길이 필요하다"
 NFP30_INFRA_HOME_2_BODY:0 "지역 [SelectLocalization(And(ScriptContainer.MakeScope.Var('nfp20_problem_state').IsSet, ScriptContainer.MakeScope.Var('nfp20_problem_state').GetState.IsValid), 'NFP40_STATE_LINK', 'NFP40_REGION_FALLBACK')]. 두 달 연속 기반 시설 수지가 음수를 기록했다. 최근 값은 [ScriptContainer.GetVariableValue('nfp20_after')|2].\n\n편집부가 주목하는 것은 되풀이되는 부족이다. 어느 대책을 고를지는 그곳의 사정을 들여다봐야 한다. 지표 하나로 당장 건설 처방을 내리기는 어렵다."
 NFP30_INFRA_HOME_2_LEAD:0 "우리 지역 한 곳에서 기반 시설의 수요가 다시 수용 능력을 넘어섰다."
 NFP30_INFRA_HOME_2_TITLE:0 "미뤄 두기 어려운 기반 시설 문제"
 NFP30_INFRA_METRICS:0 "지역 [SelectLocalization(And(ScriptContainer.MakeScope.Var('nfp20_problem_state').IsSet, ScriptContainer.MakeScope.Var('nfp20_problem_state').GetState.IsValid), 'NFP40_STATE_LINK', 'NFP40_REGION_FALLBACK')]. 두 달 연속 기반 시설 수지가 음수를 기록했다. 최근 값은 [ScriptContainer.GetVariableValue('nfp20_after')|2]."
 NFP30_INFRA_RECOVERY_HOME_1_BODY:0 "지역 [SelectLocalization(And(ScriptContainer.MakeScope.Var('nfp20_problem_state').IsSet, ScriptContainer.MakeScope.Var('nfp20_problem_state').GetState.IsValid), 'NFP40_STATE_LINK', 'NFP40_REGION_FALLBACK')]. 앞서 경고할 때의 기반 시설 수지는 [ScriptContainer.GetVariableValue('nfp20_before')|2], 지금은 [ScriptContainer.GetVariableValue('nfp20_after')|2]다. 최근 두 차례 월간 관측에서 수지가 0 이상을 기록했다.\n\n지면에 올릴 만한 성과다. 다만 두 번의 반가운 관측이 앞으로 다시는 부족해지지 않으리라는 약속까지 해 주지는 않는다."
 NFP30_INFRA_RECOVERY_HOME_1_LEAD:0 "앞서 다룬 기반 시설 문제를 다시 찾았다. 이번에는 사정이 나아졌다는 소식을 전할 수 있다."
 NFP30_INFRA_RECOVERY_HOME_1_TITLE:0 "한때 어려움을 겪던 지역에서 온 반가운 소식"
 NFP30_INFRA_RECOVERY_HOME_2_BODY:0 "지역 [SelectLocalization(And(ScriptContainer.MakeScope.Var('nfp20_problem_state').IsSet, ScriptContainer.MakeScope.Var('nfp20_problem_state').GetState.IsValid), 'NFP40_STATE_LINK', 'NFP40_REGION_FALLBACK')]. 앞서 경고할 때의 기반 시설 수지는 [ScriptContainer.GetVariableValue('nfp20_before')|2], 지금은 [ScriptContainer.GetVariableValue('nfp20_after')|2]다. 최근 두 차례 월간 관측에서 수지가 0 이상을 기록했다.\n\n연속된 두 차례 관측에서 개선이 확인됐다. 정확히 어느 조치가 이를 이뤘는지까지는 현재 자료로 알 수 없다."
 NFP30_INFRA_RECOVERY_HOME_2_LEAD:0 "우리 지역의 기반 시설 수지가 회복됐다. 독자들이 앞서 접한 이야기의 후속 보도다."
 NFP30_INFRA_RECOVERY_HOME_2_TITLE:0 "경고 기사 자리에 들어선 희소식"
 NFP30_INFRA_RECOVERY_METRICS:0 "지역 [SelectLocalization(And(ScriptContainer.MakeScope.Var('nfp20_problem_state').IsSet, ScriptContainer.MakeScope.Var('nfp20_problem_state').GetState.IsValid), 'NFP40_STATE_LINK', 'NFP40_REGION_FALLBACK')]. 앞서 경고할 때의 기반 시설 수지는 [ScriptContainer.GetVariableValue('nfp20_before')|2], 지금은 [ScriptContainer.GetVariableValue('nfp20_after')|2]다. 최근 두 차례 월간 관측에서 수지가 0 이상을 기록했다."
 NFP30_ISSUE_DETAILS:0 "이 호의 기록\n기사 수 [ScriptContainer.GetVariableValue('nfp20_article_count')|0].\n관측 [ScriptContainer.GetVariableValue('nfp20_history_count')|0]회, 비교 구간 [ScriptContainer.GetVariableValue('nfp20_summary_intervals')|0]개.\n예상 연간 국내총생산 [ScriptContainer.GetVariableValue('nfp20_summary_before')|0] → [ScriptContainer.GetVariableValue('nfp20_summary_after')|0].\n\n$NFP20_DIAGNOSTICS$\n[SelectLocalization(ScriptContainer.HasVariable('nfp31_rejected_region'), 'NFP30_REACH_REJECTED', 'NFP30_REACH_OLD')]"
 NFP30_ISSUE_HEADER:0 "[ScriptContainer.MakeScope.Var('nfp30_reader_definition').GetCountryDefinition.GetName] · 제[ScriptContainer.GetVariableValue('nfp_number')|0]호 · [ScriptContainer.GetVariableValue('nfp_year')|0]년 [Localize(ScriptContainer.MakeScope.Var('nfp30_month').GetFlagName)]"
 NFP30_LAW_AWAY_1_BODY:0 "발효된 법률은 ‘[Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]’다.\n\n다른 나라 주민들의 변화를 우리 독자들도 지켜볼 수 있게 됐다. 지금 확인된 것은 새 규정이 효력을 얻었다는 사실이다. 그 결과는 앞으로 살펴야 한다."
 NFP30_LAW_AWAY_1_LEAD:0 "외국에서 중요한 개혁이 발효됐다."
 NFP30_LAW_AWAY_1_TITLE:0 "해외에서 법질서의 새 장이 열리다"
 NFP30_LAW_AWAY_2_BODY:0 "발효된 법률은 ‘[Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]’다.\n\n이 자료로 개혁이 의회의 표결을 거쳤다고 단정하거나 어떤 결과를 약속할 수는 없다. 실제로 어떻게 작용하는지는 따로 지켜볼 일이다."
 NFP30_LAW_AWAY_2_LEAD:0 "외국에서 새 법규가 발효됐다는 소식이 들어왔다."
 NFP30_LAW_AWAY_2_TITLE:0 "한 외국이 중요한 법을 시행하다"
 NFP30_LAW_HOME_1_BODY:0 "발효된 법률은 ‘[Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]’다.\n\n편집부는 변화가 있었다는 사실을 전한다. 법이 어떤 경로로 채택됐고 주민들의 삶에 어떤 영향을 줄지는 아직 이 소식만으로 확인되지 않는다."
 NFP30_LAW_HOME_1_LEAD:0 "우리나라에서 중요한 법규가 발효됐다."
 NFP30_LAW_HOME_1_TITLE:0 "새 법, 우리 삶의 새 장"
 NFP30_LAW_HOME_2_BODY:0 "발효된 법률은 ‘[Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]’다.\n\n개혁의 결과를 평가하려면 시간도, 어떻게 작동했는지 보여 주는 자료도 필요하다. 본지는 법의 발효를 이미 이루어진 사회적 성과와 혼동하지 않는다."
 NFP30_LAW_HOME_2_LEAD:0 "우리나라의 법질서가 달라졌다. 새 규정은 독자들이 주목할 만하다."
 NFP30_LAW_HOME_2_TITLE:0 "나라에서 중요한 개혁이 시행되다"
 NFP30_LAW_METRICS:0 "발효된 법률은 ‘[Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]’다."
 NFP30_LEAD_STORY:0 "머리기사"
 NFP30_LITERACY_AWAY_1_BODY:0 "식자율은 [Multiply_CFixedPoint(ScriptContainer.GetVariableValue('nfp20_before'), '(CFixedPoint)100')|1]%에서 [Multiply_CFixedPoint(ScriptContainer.GetVariableValue('nfp20_after'), '(CFixedPoint)100')|1]%로 바뀌며 [Multiply_CFixedPoint(ScriptContainer.GetVariableValue('nfp20_extra'), '(CFixedPoint)100')|1]%의 문턱을 넘었다.\n\n다른 나라의 성취도 우리 독자가 눈여겨볼 만하다. 수치가 한 고비를 넘었다고 학교가 어떻게 꾸려졌는지 알게 되거나 교육 제도 전체의 우월함이 증명되지는 않는다."
 NFP30_LITERACY_AWAY_1_LEAD:0 "외국에서 식자율이 크게 진전됐다는 소식이 왔다."
 NFP30_LITERACY_AWAY_1_TITLE:0 "외국에서 교육의 새 고비를 넘다"
 NFP30_LITERACY_AWAY_2_BODY:0 "식자율은 [Multiply_CFixedPoint(ScriptContainer.GetVariableValue('nfp20_before'), '(CFixedPoint)100')|1]%에서 [Multiply_CFixedPoint(ScriptContainer.GetVariableValue('nfp20_after'), '(CFixedPoint)100')|1]%로 바뀌며 [Multiply_CFixedPoint(ScriptContainer.GetVariableValue('nfp20_extra'), '(CFixedPoint)100')|1]%의 문턱을 넘었다.\n\n글을 읽고 쓰는 사람의 비중이 늘었음은 새 자료로 확인됐다. 원인이 무엇이며 그 경험을 우리에게도 적용할 수 있을지는 별도 연구가 필요한 일이다."
 NFP30_LITERACY_AWAY_2_LEAD:0 "본지가 따라온 교육의 역사에 해외 식자율 소식이 한 줄 더해졌다."
 NFP30_LITERACY_AWAY_2_TITLE:0 "세계에 글 읽는 이들이 늘어나다"
 NFP30_LITERACY_HOME_1_BODY:0 "식자율은 [Multiply_CFixedPoint(ScriptContainer.GetVariableValue('nfp20_before'), '(CFixedPoint)100')|1]%에서 [Multiply_CFixedPoint(ScriptContainer.GetVariableValue('nfp20_after'), '(CFixedPoint)100')|1]%로 바뀌며 [Multiply_CFixedPoint(ScriptContainer.GetVariableValue('nfp20_extra'), '(CFixedPoint)100')|1]%의 문턱을 넘었다.\n\n이전 자료와의 비교에서 변화가 확인됐다. 한 고비를 넘긴 수치만으로 학교의 질이나 교육 기회의 평등까지 판단하기에는 이르다."
 NFP30_LITERACY_HOME_1_LEAD:0 "식자율이 새 문턱을 넘었다. 나라가 자랑할 만한 성과다."
 NFP30_LITERACY_HOME_1_TITLE:0 "우리나라가 교육에서 한 걸음 나아가다"
 NFP30_LITERACY_HOME_2_BODY:0 "식자율은 [Multiply_CFixedPoint(ScriptContainer.GetVariableValue('nfp20_before'), '(CFixedPoint)100')|1]%에서 [Multiply_CFixedPoint(ScriptContainer.GetVariableValue('nfp20_after'), '(CFixedPoint)100')|1]%로 바뀌며 [Multiply_CFixedPoint(ScriptContainer.GetVariableValue('nfp20_extra'), '(CFixedPoint)100')|1]%의 문턱을 넘었다.\n\n글을 읽고 쓰는 주민의 비중이 중요한 문턱을 넘었다. 서로 다른 지역과 계층의 형편을 평가하려면 더 자세한 자료가 필요하다."
 NFP30_LITERACY_HOME_2_LEAD:0 "새 식자율 소식은 본지가 나라의 성과를 반길 좋은 계기가 됐다."
 NFP30_LITERACY_HOME_2_TITLE:0 "교육의 지평이 넓어지다"
 NFP30_LITERACY_METRICS:0 "식자율은 [Multiply_CFixedPoint(ScriptContainer.GetVariableValue('nfp20_before'), '(CFixedPoint)100')|1]%에서 [Multiply_CFixedPoint(ScriptContainer.GetVariableValue('nfp20_after'), '(CFixedPoint)100')|1]%로 바뀌며 [Multiply_CFixedPoint(ScriptContainer.GetVariableValue('nfp20_extra'), '(CFixedPoint)100')|1]%의 문턱을 넘었다."
