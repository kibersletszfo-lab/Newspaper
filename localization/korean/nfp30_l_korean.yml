 NFP43_ELECTION_BASELINE:0 "제[ScriptContainer.GetVariableValue('nfp43_previous_issue')|0]호의 선거 보도와 비교했다. 같은 정당을 비교할 때는 이전 수치 → 현재 수치 (계수의 변화) 순으로 표시한다. ‘—’는 비교할 이전 수치가 없다는 뜻이다."
 NFP43_ELECTION_BODY_1:0 "선거 운동은 계속되고 있다. 정당들의 처지는 아직 얼마든지 바뀔 수 있다. 편집부가 기록한 각 당의 선거 동력은 다음과 같다.\n\n[Localize(ScriptContainer.MakeScope.Var('nfp43_row_1').GetFlagName)]\n[Localize(ScriptContainer.MakeScope.Var('nfp43_row_2').GetFlagName)]\n[Localize(ScriptContainer.MakeScope.Var('nfp43_row_3').GetFlagName)]\n[Localize(ScriptContainer.MakeScope.Var('nfp43_row_4').GetFlagName)]\n[Localize(ScriptContainer.MakeScope.Var('nfp43_row_5').GetFlagName)]\n[Localize(ScriptContainer.MakeScope.Var('nfp43_row_6').GetFlagName)]\n\n[SelectLocalization(GreaterThan_CFixedPoint(ScriptContainer.GetVariableValue('nfp43_previous_issue'), '(CFixedPoint)0'), 'NFP43_ELECTION_BASELINE', 'NFP43_ELECTION_FIRST')]\n\n이 수치는 선거 운동 도중에 잰 각 당의 동력이다. 개표 결과나 예상 득표율로 읽어서는 안 된다. 동력은 선거 운동에 영향을 주지만 승패를 혼자 결정하지는 않는다. 발행 당시 수치가 높은 순서로 최대 여섯 정당을 실었다. 숫자는 게임에서 쓰는 계수 그대로다."
 NFP43_ELECTION_BODY_2:0 "선거의 향방은 여전히 열려 있다. 이미 개표한 표처럼 단정하지 않고 각 당의 선거 동력을 비교했다.\n\n[Localize(ScriptContainer.MakeScope.Var('nfp43_row_1').GetFlagName)]\n[Localize(ScriptContainer.MakeScope.Var('nfp43_row_2').GetFlagName)]\n[Localize(ScriptContainer.MakeScope.Var('nfp43_row_3').GetFlagName)]\n[Localize(ScriptContainer.MakeScope.Var('nfp43_row_4').GetFlagName)]\n[Localize(ScriptContainer.MakeScope.Var('nfp43_row_5').GetFlagName)]\n[Localize(ScriptContainer.MakeScope.Var('nfp43_row_6').GetFlagName)]\n\n[SelectLocalization(GreaterThan_CFixedPoint(ScriptContainer.GetVariableValue('nfp43_previous_issue'), '(CFixedPoint)0'), 'NFP43_ELECTION_BASELINE', 'NFP43_ELECTION_FIRST')]\n\n이 수치는 선거 운동 도중에 잰 각 당의 동력이다. 개표 결과나 예상 득표율로 읽어서는 안 된다. 동력은 선거 운동에 영향을 주지만 승패를 혼자 결정하지는 않는다. 발행 당시 수치가 높은 순서로 최대 여섯 정당을 실었다. 숫자는 게임에서 쓰는 계수 그대로다."
 NFP43_ELECTION_FIRST:0 "이번 선거에 관해 앞서 게재한 중간 집계가 아직 없다. 비교할 이전 수치가 없는 정당에는 ‘—’를 붙였다."
 NFP43_ELECTION_LEAD_1:0 "우리나라에서 선거 운동이 한창이다. 각 당이 기세를 올리는 사이, 편집부는 어느 당의 발걸음이 가벼워졌는지 지켜보고 있다. 승리 연설은 아직 싣지 않는다. 사소한 것 하나, 바로 투표 결과가 빠져 있기 때문이다."
 NFP43_ELECTION_LEAD_2:0 "우리나라에서 선거 운동이 한창이다. 각 당이 기세를 올리는 사이, 편집부는 어느 당의 발걸음이 가벼워졌는지 지켜보고 있다. 승리 연설은 아직 싣지 않는다. 사소한 것 하나, 바로 투표 결과가 빠져 있기 때문이다."
 NFP43_ELECTION_METRICS:0 "발행 시점 기록. 유형 24, 사회면. 같은 선거에서 가장 최근에 게재한 중간 집계와만 비교한다. 기사 선정에서 빠진 후보 기사는 비교 기준을 갱신하지 않는다. 새 선거나 처음 관측한 정당에는 과거 수치를 붙이지 않는다. 수치와 순서는 당시 기록이지만 정당 이름은 게임 진행에 따라 바뀔 수 있다."
