 NFP50_EMPTY:0 ""
 NFP50_FAMILY_BODY:0 "[Localize(ScriptContainer.MakeScope.Var('nfp30_body').GetFlagName)]"
 NFP50_FAMILY_DIVERGENCE_FACTS:0 "세 달 사이 예상 연간 국내총생산은 [ScriptContainer.GetVariableValue('nfp20_before')|0]에서 [ScriptContainer.GetVariableValue('nfp20_after')|0]까지 늘었다. 같은 기간 평균 생활 수준은 [ScriptContainer.GetVariableValue('nfp20_extra')|2]점 하락했다."
 NFP50_FAMILY_DIVERGENCE_HOME_END_1:0 "경제 전체의 덩치가 커진다고 각 가정의 삶이 곧바로 넉넉해지지는 않는다. 편집부는 주민들의 형편을 나라의 중요한 일로 여긴다. 두 수치가 갈라진 이유는 따로 짚어 볼 문제다."
 NFP50_FAMILY_DIVERGENCE_HOME_END_2:0 "나라에는 일상에서도 느낄 수 있는 성과가 필요하다. 이 수치만으로 살림이 어려워진 까닭을 설명하거나 누구에게 책임을 돌릴 수는 없다."
 NFP50_FAMILY_ELECTION_AGAIN:0 "이제 이번 선거 운동을 앞선 보도와 비교할 수 있다. 일부 정당의 동력은 커지고 다른 정당은 약해졌을 수 있다. 숫자 옆의 부호가 보여 주는 것은 그 변화다. 앞으로 벌어질 득표 차이가 아니다."
 NFP50_FAMILY_ELECTION_BASE:0 "[SelectLocalization(GreaterThan_CFixedPoint(ScriptContainer.GetVariableValue('nfp43_previous_issue'), '(CFixedPoint)0'), 'NFP43_ELECTION_BASELINE', 'NFP43_ELECTION_FIRST')]"
 NFP50_FAMILY_ELECTION_END_1:0 "개표 결과가 나오기 전에도 읽어 볼 이야기가 있다. 그 뒤를 계속 살피겠다. 유권자의 지지가 어디로 갈지 몹시 궁금하지만, 신문 한 줄로 대신 표를 던지지는 않겠다."
 NFP50_FAMILY_ELECTION_END_2:0 "개표 결과가 나오기 전에도 읽어 볼 이야기가 있다. 그 뒤를 계속 살피겠다. 유권자의 지지가 어디로 갈지 몹시 궁금하지만, 신문 한 줄로 대신 표를 던지지는 않겠다."
 NFP50_FAMILY_ELECTION_FIRST:0 "이번 보도부터 선거 운동의 추이를 비교하기 시작한다. 누가 탄력을 받고 누가 잃는지는 후속 보도로 더 분명해질 것이다. 지금은 각 당의 현재 위치를 살펴보자."
 NFP50_FAMILY_ELECTION_NOTE:0 "여기서 보는 것은 선거 운동의 경과지 집계한 표가 아니다. 수치는 선두 여섯 정당의 선거 동력을 비교하며 유권자 비율로 읽을 수 없다. 오늘의 주자가 아무리 자신 있어 보여도 결과까지는 아직 갈 길이 있다."
 NFP50_FAMILY_ELECTION_TABLE:0 "[Localize(ScriptContainer.MakeScope.Var('nfp43_row_1').GetFlagName)]\n[Localize(ScriptContainer.MakeScope.Var('nfp43_row_2').GetFlagName)]\n[Localize(ScriptContainer.MakeScope.Var('nfp43_row_3').GetFlagName)]\n[Localize(ScriptContainer.MakeScope.Var('nfp43_row_4').GetFlagName)]\n[Localize(ScriptContainer.MakeScope.Var('nfp43_row_5').GetFlagName)]\n[Localize(ScriptContainer.MakeScope.Var('nfp43_row_6').GetFlagName)]"
 NFP50_FAMILY_EXPECTED:0 "보도 당시 평균 생활 수준은 [ScriptContainer.GetVariableValue('nfp50_family_sol')|2], 평균 기대 수준은 [ScriptContainer.GetVariableValue('nfp50_family_expected_sol')|2]다. 실제 수준이 기대 수준을 밑돈다. 주민의 형편을 주의 깊게 살필 이유가 하나 더 있다."
 NFP50_FAMILY_GAINED_ALLIANCE_1_1:0 "우리나라에 정식 동맹국이 생겼다. 상대는 [ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName]. 이제 공동 계획은 합의를 바탕으로 한다. 곁에 있는 사람과 이견 말고도 이야기할 것이 있다니 반갑다. 실제 일에서도 얼마나 뜻을 모을 수 있을지는 이제 볼 일이다."
 NFP50_FAMILY_GAINED_ALLIANCE_1_2:0 "동맹은 인사만 주고받기에는 값진 관계다. 구체적인 결정을 내리고 약속을 이행할 때 유용함이 드러날 것이다. 조약에 찍은 도장은 좋은 시작이다. 협력이 거기에서 끝나지 않기를 바란다."
 NFP50_FAMILY_GAINED_ALLIANCE_2_1:0 "우리나라에 정식 동맹국이 생겼다. 상대는 [ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName]. 이제 공동 계획은 합의를 바탕으로 한다. 곁에 있는 사람과 이견 말고도 이야기할 것이 있다니 반갑다. 실제 일에서도 얼마나 뜻을 모을 수 있을지는 이제 볼 일이다."
 NFP50_FAMILY_GAINED_ALLIANCE_2_2:0 "동맹은 인사만 주고받기에는 값진 관계다. 구체적인 결정을 내리고 약속을 이행할 때 유용함이 드러날 것이다. 조약에 찍은 도장은 좋은 시작이다. 협력이 거기에서 끝나지 않기를 바란다."
 NFP50_FAMILY_GAINED_BLOC_1_1:0 "이제 우리와 [ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName] 측은 같은 세력 블록에 있다. 함께하는 나라들의 범위가 달라졌다. 누가 누구를 설득해 가입시켰는지 점치지 않겠다. 지금의 이웃 관계가 어떤 기회를 여느냐가 더 중요하다."
 NFP50_FAMILY_GAINED_BLOC_1_2:0 "같은 깃발이 함께할 일을 대신하지는 않는다. 별도의 군사 동맹이 없더라도 협의할 일은 있다. 새로 인사를 나눈 뒤 서로에게 보탬이 될 교섭까지 이어지면 좋겠다."
 NFP50_FAMILY_GAINED_BLOC_2_1:0 "이제 우리와 [ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName] 측은 같은 세력 블록에 있다. 함께하는 나라들의 범위가 달라졌다. 누가 누구를 설득해 가입시켰는지 점치지 않겠다. 지금의 이웃 관계가 어떤 기회를 여느냐가 더 중요하다."
 NFP50_FAMILY_GAINED_BLOC_2_2:0 "같은 깃발이 함께할 일을 대신하지는 않는다. 별도의 군사 동맹이 없더라도 협의할 일은 있다. 새로 인사를 나눈 뒤 서로에게 보탬이 될 교섭까지 이어지면 좋겠다."
 NFP50_FAMILY_GROWTH:0 "두 관측 사이에 예상 연간 국내총생산이 [ScriptContainer.GetVariableValue('nfp50_family_gdp_growth')|2]% 늘었다. 한 가정 한 가정의 소득이 아니라 경제의 크기를 본 수치다."
 NFP50_FAMILY_INTRO:0 "[Localize(ScriptContainer.MakeScope.Var('nfp30_lead').GetFlagName)]"
 NFP50_FAMILY_LAW_AWAY_END_1:0 "다른 나라 주민들의 변화를 우리 독자들도 지켜볼 수 있게 됐다. 지금 확인된 것은 새 규정이 효력을 얻었다는 사실이다. 그 결과는 앞으로 살펴야 한다."
 NFP50_FAMILY_LAW_AWAY_END_2:0 "이 자료로 개혁이 의회의 표결을 거쳤다고 단정하거나 어떤 결과를 약속할 수는 없다. 실제로 어떻게 작용하는지는 따로 지켜볼 일이다."
 NFP50_FAMILY_LAW_FACTS:0 "발효된 법률은 ‘[Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]’다."
 NFP50_FAMILY_LAW_HOME_END_1:0 "편집부는 변화가 있었다는 사실을 전한다. 법이 어떤 경로로 채택됐고 주민들의 삶에 어떤 영향을 줄지는 아직 이 소식만으로 확인되지 않는다."
 NFP50_FAMILY_LAW_HOME_END_2:0 "개혁의 결과를 평가하려면 시간도, 어떻게 작동했는지 보여 주는 자료도 필요하다. 본지는 법의 발효를 이미 이루어진 사회적 성과와 혼동하지 않는다."
 NFP50_FAMILY_LOST_ALLIANCE_1_1:0 "[ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName] 측과의 종전 동맹은 더는 존재하지 않는다. 이 동맹을 염두에 둔 계획에는 중요한 뉴스다. 까닭은 따로 살펴야 하지만 습관대로 옛 약속에 기대서는 안 되겠다."
 NFP50_FAMILY_LOST_ALLIANCE_1_2:0 "이제 우리 자신의 역량을 더 자세히 살필 일이다. 옛 동맹국을 영원한 적으로 선포하는 일은 그 지원이 여전히 보장됐다고 보는 것만큼 성급하다. 외교에서 기억은 유용하다. 달라진 일까지 기억한다면 특히 그렇다."
 NFP50_FAMILY_LOST_ALLIANCE_2_1:0 "[ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName] 측과의 종전 동맹은 더는 존재하지 않는다. 이 동맹을 염두에 둔 계획에는 중요한 뉴스다. 까닭은 따로 살펴야 하지만 습관대로 옛 약속에 기대서는 안 되겠다."
 NFP50_FAMILY_LOST_ALLIANCE_2_2:0 "이제 우리 자신의 역량을 더 자세히 살필 일이다. 옛 동맹국을 영원한 적으로 선포하는 일은 그 지원이 여전히 보장됐다고 보는 것만큼 성급하다. 외교에서 기억은 유용하다. 달라진 일까지 기억한다면 특히 그렇다."
 NFP50_FAMILY_LOST_BLOC_1_1:0 "[ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName] 측과 이제 같은 블록의 일원이라는 연결고리가 사라졌다. 예전의 공동 외교권은 예전 보고서에 남았다. 어느 쪽의 처지가 달라졌을 수도, 블록 자체가 바뀌었을 수도 있다. 그 결과가 우리 계획에 미치는 무게는 어느 경우든 작지 않다."
 NFP50_FAMILY_LOST_BLOC_1_2:0 "함께 의지할 계산의 근거 하나가 줄었다. 양국 사이의 별도 조약은 다른 문제이므로 조약 내용대로 살펴야 한다. 새 지도를 아직 벽에 걸지 못했다는 이유로 옛 관계도만 계속 쓰면 이상한 일이다."
 NFP50_FAMILY_LOST_BLOC_2_1:0 "[ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName] 측과 이제 같은 블록의 일원이라는 연결고리가 사라졌다. 예전의 공동 외교권은 예전 보고서에 남았다. 어느 쪽의 처지가 달라졌을 수도, 블록 자체가 바뀌었을 수도 있다. 그 결과가 우리 계획에 미치는 무게는 어느 경우든 작지 않다."
 NFP50_FAMILY_LOST_BLOC_2_2:0 "함께 의지할 계산의 근거 하나가 줄었다. 양국 사이의 별도 조약은 다른 문제이므로 조약 내용대로 살펴야 한다. 새 지도를 아직 벽에 걸지 못했다는 이유로 옛 관계도만 계속 쓰면 이상한 일이다."
 NFP50_FAMILY_PRICE_CORE:0 "[SelectLocalization(GreaterThan_CFixedPoint(ScriptContainer.GetVariableValue('nfp32_rows'), '(CFixedPoint)0'), 'NFP30_PRICE_MARKET', 'NFP30_PRICE_UNAVAILABLE')]\n\n[Localize(ScriptContainer.MakeScope.Var('nfp32_row_1').GetFlagName)]\n[Localize(ScriptContainer.MakeScope.Var('nfp32_row_2').GetFlagName)]\n[Localize(ScriptContainer.MakeScope.Var('nfp32_row_3').GetFlagName)]\n[Localize(ScriptContainer.MakeScope.Var('nfp32_row_4').GetFlagName)]\n[Localize(ScriptContainer.MakeScope.Var('nfp32_row_5').GetFlagName)]\n[Localize(ScriptContainer.MakeScope.Var('nfp32_row_6').GetFlagName)]"
 NFP50_FAMILY_PRICE_END_1:0 "큰 탈이 날 때까지 기다리지 않아도 가격은 지켜볼 만하다. 몇 품목만 담겼으므로 이 표로 가계 전체의 지출을 셀 수는 없다. 그래도 늘 사는 물건을 자세히 보는 데에는 도움이 된다. 때로는 가게 앞에서 가장 내용 있는 뉴스가 독자를 기다린다."
 NFP50_FAMILY_PRICE_END_2:0 "큰 탈이 날 때까지 기다리지 않아도 가격은 지켜볼 만하다. 몇 품목만 담겼으므로 이 표로 가계 전체의 지출을 셀 수는 없다. 그래도 늘 사는 물건을 자세히 보는 데에는 도움이 된다. 때로는 가게 앞에서 가장 내용 있는 뉴스가 독자를 기다린다."
 NFP50_FAMILY_PRICE_NOTE:0 "[SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp32_comparisons'), '(CFixedPoint)0'), 'NFP30_PRICE_FIRST', 'NFP30_PRICE_METHOD')]"
 NFP50_FAMILY_SHORTAGE_FACTS:0 "상품 [Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]. 두 차례 연속 월간 관측에서 우리 시장의 품귀가 확인됐다."
 NFP50_FAMILY_SHORTAGE_HOME_END_1:0 "이 품목의 공급과 소비를 유심히 확인할 일이다. 이번 소식은 물량의 부족에 관한 것이며 비싼 가격은 별도로 살펴야 한다."
 NFP50_FAMILY_SHORTAGE_HOME_END_2:0 "시장 품귀는 확인됐지만 원인은 아직 밝혀지지 않았다. 이 자료로 책임자를 지목하거나 특정 건물을 지으면 어떤 효과가 난다고 약속할 수는 없다."
 NFP50_FAMILY_SHORTAGE_RECOVERY_FACTS:0 "상품 [Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]. 지난 경고 이후 두 차례 연속 월간 관측에서 종전의 시장 품귀가 더는 나타나지 않았다."
 NFP50_FAMILY_SHORTAGE_RECOVERY_HOME_END_1:0 "종전의 품귀가 사라졌음을 기록한다. 그렇다고 낮은 가격을 약속하는 것은 아니다. 값비싼 것과 물량이 모자란 것은 서로 다른 문제다."
 NFP50_FAMILY_SHORTAGE_RECOVERY_HOME_END_2:0 "양호한 상태가 두 달간 이어졌다. 본지는 앞으로도 물건이 있는지와 살 만한 가격인지를 구별할 것이다. 후자는 이번 소식에서 확인되지 않았다."
 NFP50_FAMILY_SOL:0 "같은 기간 평균 생활 수준은 [ScriptContainer.GetVariableValue('nfp50_family_sol_before')|2]에서 [ScriptContainer.GetVariableValue('nfp50_family_sol')|2]까지 바뀌었다. 전국 평균이다. 지역과 계층에 따라 사정은 다를 수 있다."
 NFP50_FAMILY_TECH_ANILINE_1:0 "합성 소재 공장을 건설할 수 있게 됐다. 이제 염료를 공업적으로 생산할 수 있다. 직물을 만드는 사람에게 흥미로운 가능성이다. 앞으로 옷감의 빛깔은 원료가 어디에서 왔느냐에 덜 좌우될 수 있다."
 NFP50_FAMILY_TECH_ANILINE_2:0 "염료 생산에는 유황과 비료가 든다. 기술이 공급망을 바꾸기는 해도 없애지는 않는다. 아름다운 빛깔에도 뜻밖의 경제적 친척들이 있는 모양이다."
 NFP50_FAMILY_TECH_ANTIBIOTICS_1:0 "이 나라의 보건 제도를 확장할 길이 열렸다. 의학 지식이 중요한 첫째 이유는 ‘나았으면 좋겠다’는 평범한 바람과 닿아 있기 때문이다. 그 바람을 뒷받침할 근거가 늘었다. 물론 실제로 치료를 제공할 재원은 여전히 필요하다."
 NFP50_FAMILY_TECH_ANTIBIOTICS_2:0 "전염병이 수확에 미치는 악영향이 줄어든다. 새 지식이 주는 구체적인 경제적 이득이다. 질병은 병실을 훨씬 벗어난 곳에서도 삶을 흐트러뜨린다. 병에 맞서는 수단이 일상의 일까지 도울 수 있다니 반갑다."
 NFP50_FAMILY_TECH_AWAY_END_1:0 "저쪽에서 할 수 있는 일이 늘었다. 우리가 이미 아는 것은 무엇이고 어떻게 쓰고 있는지 제 살림을 돌아볼 계기다. 축하는 우편으로 보내도 되지만 우리에게 쓸 만한 생각은 그 자리에서 챙겨 두는 편이 좋겠다."
 NFP50_FAMILY_TECH_AWAY_END_2:0 "저쪽에서 할 수 있는 일이 늘었다. 우리가 이미 아는 것은 무엇이고 어떻게 쓰고 있는지 제 살림을 돌아볼 계기다. 축하는 우편으로 보내도 되지만 우리에게 쓸 만한 생각은 그 자리에서 챙겨 두는 편이 좋겠다."
 NFP50_FAMILY_TECH_BESSEMER_PROCESS_1:0 "제철소가 베서머 공법을 쓸 수 있게 됐다. 이제 더 많은 강철을 얻을 수 있다. 자신의 성공을 기리는 기념비 말고도 금속이 필요한 경제라면 쓸모 있는 가능성이다."
 NFP50_FAMILY_TECH_BESSEMER_PROCESS_2:0 "새 공법은 석탄 사용량이 같은 데 비해 철을 더 많이 요구한다. 진보해도 공급을 챙길 필요는 사라지지 않는다는 좋은 예다. 미래의 강철을 반기기에 앞서 그 강철을 만들 원료부터 마련해야 한다."
 NFP50_FAMILY_TECH_ELECTRICAL_GENERATION_1:0 "이제 발전소를 지을 수 있다. 경제에 새로운 가능성의 원천이 생겼다. 아직은 시설과 공급을 갖춰야 실제로 쓸 수 있는 지식이다. 그래도 앞으로의 기업을 바라볼 눈은 달라졌다."
 NFP50_FAMILY_TECH_ELECTRICAL_GENERATION_2:0 "도시는 전기 가로등으로 바꿀 수 있다. 그러려면 현지 전기가 필요하다. 변화가 글자 그대로 눈에 보이게 될 일이다. 밝은 미래를 이야기한 뒤 실제 거리에도 불이 켜지는 날이 더욱 기다려진다."
 NFP50_FAMILY_TECH_ELECTRIC_TELEGRAPH_1:0 "군사 지식에 전신이 더해졌다. 나라가 전쟁의 부담을 견디는 방식에 새 가능성이 생겼다. 군사 보고서에 적힌 새 단어가 얼마나 그럴듯한가만으로 이 소식의 가치를 잴 수는 없다."
 NFP50_FAMILY_TECH_ELECTRIC_TELEGRAPH_2:0 "인명 손실이 나라의 전쟁 피로를 키우는 효과가 줄어든다. 부담을 견디는 힘에 관한 이야기다. 이 지식이 죽은 사람을 되돌리지는 않는다. 쓸모 있는 군사적 성취를 너무 자주 실전에서 확인할 필요는 없기를 바란다."
 NFP50_FAMILY_TECH_FACTS:0 "이제 이 나라가 쓸 수 있는 기술은 ‘[Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]’다."
 NFP50_FAMILY_TECH_HOME_END_1:0 "이제 아는 것이 늘었으니 알맞게 쓰는 일이 남았다. 자부심을 가질 이유이자 일에 착수할 이유다. 다음 기사는 새 지식으로 해낸 일을 다룰 수 있기를 바란다. 가능성의 목록도 반갑지만 그 쓰임은 더 반갑다."
 NFP50_FAMILY_TECH_HOME_END_2:0 "이제 아는 것이 늘었으니 알맞게 쓰는 일이 남았다. 자부심을 가질 이유이자 일에 착수할 이유다. 다음 기사는 새 지식으로 해낸 일을 다룰 수 있기를 바란다. 가능성의 목록도 반갑지만 그 쓰임은 더 반갑다."
 NFP50_FAMILY_TECH_KNOWN:0 "이 지식은 우리도 이미 갖고 있다. 이제 다른 나라도 활용할 수 있다. 먼저 알았다는 우리의 이점은 여기서 끝났다. 누가 아는 것을 더 잘 쓸지 지켜보자. 경제에서라면 기억력 겨루기보다 대개 그 편이 더 흥미롭다."
 NFP50_FAMILY_TECH_QUININE_1:0 "퀴닌 덕에 식민지 진출을 막던 일반 말라리아의 장벽을 넘을 수 있다. 중증 말라리아는 별개 문제로 남는다. 지도에 선택지는 늘었지만 약 하나가 생겼다고 현지의 모든 어려움이 사라졌다고 보면 지나치게 순진하다."
 NFP50_FAMILY_TECH_QUININE_2:0 "보건과 식민지 행정을 확장할 여지가 생겼다. 그에 필요한 추가 재원은 앞으로 배정해야 한다. 약은 나라의 가능성을 넓혔다. 이제 국고와 행정 당국이 궁리할 일이 생겼다."
 NFP50_FAMILY_TECH_RAILWAYS_1:0 "이제 철도를 지을 수 있다. 도시 사이의 거리가 줄어들지는 않는다. 대신 그 거리를 다른 수송 능력으로 건널 길이 열린다. 철로는 아직 직접 깔아야 한다. 경제에서는 그림으로 그은 선이 진짜 선로만큼 일을 하지 못한다."
 NFP50_FAMILY_TECH_RAILWAYS_2:0 "광산에서 철도 수송을 쓸 수 있게 됐다. 새 운영 방식에는 운송 서비스가 필요하다. 더 많이 캐내는 것은 반가운 일이다. 캐낸 뒤에야 또 실어 나를 수단이 없음을 깨닫지는 않았으면 한다."
 NFP50_FAMILY_TECH_STEAM_DONKEY_1:0 "벌목장과 광산의 보조 작업을 기계화할 수 있다. 전에 사람 손이 필요했던 일의 일부를 증기가 맡는다. 경제가 부담을 견딜 수단이 또 하나 생겼다."
 NFP50_FAMILY_TECH_STEAM_DONKEY_2:0 "기계화에는 발동기가 필요하며 단순 노동자는 더 적게 필요하다. 기업에는 노동 절약이 반가운 기회다. 노동자의 앞날은 다른 일자리를 구할 수 있느냐에도 달렸다. 때로는 사람보다 기계에 줄 자리를 찾기가 쉽다."
 NFP50_FAMILY_TECH_STEELWORKING_1:0 "이 나라는 제철소를 건설할 수 있게 됐다. 새로운 생산 능력을 쌓을 바탕이다. 지식 목록에 오른 강철은 이야기의 시작이다. 실제로 쓸 강철에는 사업장과 노동이 필요하다."
 NFP50_FAMILY_TECH_STEELWORKING_2:0 "공구 공장에서 주철을 쓸 수 있게 된다. 익숙한 공구가 다른 생산 과정을 얻게 됐다. 새 방식을 선택하고 자재를 갖춰야 한다. 공장의 일이 달라지려면 그 방식을 알기만 해서는 부족하다."
 NFP50_FAMILY_TECH_UNKNOWN:0 "이 지식은 우리에게 아직 없다. 이 분야에서 다른 나라가 우위를 얻었다는 뜻이다. 때가 오면 우리 자신의 성과로 답하고 싶다. 외국의 발견이 그다지 중요하지 않은 이유를 설명하는 일은 연구 없이도 가능하지만 쓸모는 그만 못하다."
