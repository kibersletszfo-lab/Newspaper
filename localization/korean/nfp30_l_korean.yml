 NFP50_LAW_OWN_COMPARE_1:0 "우리나라에서 비슷한 변화가 온다면 어떨까? 정부에 참여한 집단들의 정치적 비중 중 지지측은 [ScriptContainer.GetVariableValue('nfp50_law_own_yes')|1]%, 반대측은 [ScriptContainer.GetVariableValue('nfp50_law_own_no')|1]%다. 우리 안에서 그 법을 바라보는 견해를 비교한 것이지 다른 나라의 결정에 공식 반응을 보였다는 뜻은 아니다. 외국에서는 이미 규칙이 바뀌었다. 우리에게는 우리의 현 제도가 어떤 점에서 마음에 드는지 생각해 볼 계기가 생겼다."
 NFP50_LAW_OWN_COMPARE_2:0 "우리나라에서 비슷한 변화가 온다면 어떨까? 정부에 참여한 집단들의 정치적 비중 중 지지측은 [ScriptContainer.GetVariableValue('nfp50_law_own_yes')|1]%, 반대측은 [ScriptContainer.GetVariableValue('nfp50_law_own_no')|1]%다. 우리 안에서 그 법을 바라보는 견해를 비교한 것이지 다른 나라의 결정에 공식 반응을 보였다는 뜻은 아니다. 외국에서는 이미 규칙이 바뀌었다. 우리에게는 우리의 현 제도가 어떤 점에서 마음에 드는지 생각해 볼 계기가 생겼다."
 NFP50_LAW_OWN_SAME_1:0 "같은 법이 우리나라에서도 시행 중이다. 그러니 약속 너머의 일도 비교할 수 있다. 비슷한 규칙을 다른 나라에서는 어떻게 다루는지 지켜볼 만하다. 법전에서 같은 줄이 보인다고 국경 양편의 삶까지 같아지지는 않는다."
 NFP50_LAW_OWN_SAME_2:0 "같은 법이 우리나라에서도 시행 중이다. 그러니 약속 너머의 일도 비교할 수 있다. 비슷한 규칙을 다른 나라에서는 어떻게 다루는지 지켜볼 만하다. 법전에서 같은 줄이 보인다고 국경 양편의 삶까지 같아지지는 않는다."
