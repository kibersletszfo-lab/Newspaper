 NFP52_ETH_1_TITLE:0 "에티오피아 통일"
 NFP52_ETH_2_BODY:0 "에티오피아가 한 나라로 통일됐다. 익숙했던 여러 권력 중심이 하나의 국가 체제로 모였다. 그 땅의 주민들에게는 일을 꾸리는 새 질서의 시작이고 이웃 나라들에게는 앞으로 헤아려야 할 변화다.\n\n에티오피아의 성립이 확인됐다. 통합된 정부가 새 나라를 대표해 말할 수 있게 됐다. 나라를 이루는 여러 부분이 얼마나 단단히 이어질지는 앞으로의 삶이 보여 줄 것이다. 통일은 이미 이루어졌다. 우리 국경에서 얼마나 먼지와 관계없이 주목할 일이다.\n\n하나가 된 정부에 이제 함께 처리할 몫이 생겼다. 정치적 성취를 안정된 국가 체제로 만드는 일은 통일만큼이나 만만치 않다. 그 과정을 지켜보겠다. 새 지위와 함께 주민들에게도 새로운 기회가 생겼다는 소식을 듣고 싶다.\n\n기사의 날짜는 편집부가 소식을 확인한 달이다. 사건이 정확히 어느 날 일어났는지를 뜻하지는 않는다."
