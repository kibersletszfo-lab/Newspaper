 NFP52_SPRING_2_TITLE:0 "격변에 접어든 유럽"
 NFP52_SUEZ_1_BODY:0 "수에즈 운하가 완공됐다. 대개 사람은 지도에 맞추어 길을 정한다. 이번에는 사람이 낸 구상에 맞추어 지도를 고치게 됐다. 지중해와 홍해 사이에 통로가 생겼다. 바닷길에 관한 소식으로는 작은 단신란에 밀어 넣기 어려운 일이다.\n\n운하 건설이 끝났다. 두 바다가 새 항로로 이어지면서 예전의 항로를 달리 볼 수 있게 됐다. 지형 때문에 돌아가야 했던 곳에 이제 지나갈 길이 있다. 거리를 줄였다는 말 옆에 실제로 지어진 시설을 보여 줄 수 있는 사례다.\n\n앞으로는 새 가능성을 활용하는 일이 남았다. 누가 더 유리하게 활용할지는 무역과 정치가 보여 줄 것이다. 하지만 결과만으로도 이미 주목할 만하다. 오랜 계획 끝에 세상에 나온 것이 또 하나의 계획만은 아니라니 반가운 일이다.\n\n이 소식에 적힌 날짜는 편집부가 소식을 받은 달이다. 전하는 데 시간이 걸렸다면 실제 사건은 그보다 앞서 일어났을 수 있다."
