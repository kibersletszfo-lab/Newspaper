 NFP52_JAP_2_TITLE:0 "일본의 권력 질서가 바뀌다"
 NFP52_METRICS:0 "세계 사건. 접수 시점은 [Localize(ScriptContainer.MakeScope.Var('nfp30_month').GetFlagName)], [ScriptContainer.GetVariableValue('nfp20_year')|0]년. 관측을 시작한 뒤 한 번만 알린다."
 NFP52_PANAMA_1_BODY:0 "파나마 운하가 완공됐다. 대서양과 태평양 사이에 새 통로가 났다. 지도에서 보면 두 바다 사이의 땅은 제법 좁아 보인다. 공사에 매달린 사람들에게는 그런 위안만으로는 부족했을 것이다. 이제 지도 위의 선 뒤에는 실제로 완성된 시설이 있다.\n\n운하 건설이 끝났다. 대양을 오가는 배들에게 새로운 선택지가 생겼고, 두 바다 사이의 항로도 다시 바라봐야 한다. 축하의 기분으로 미래의 이득을 하나하나 헤아리지 않아도 변화의 크기는 알 수 있다. 전에는 없던 길이 생겼다.\n\n공학의 성취 뒤에는 경제의 계산이 기다린다. 새 길을 실제로 이용하고 그 이점을 쓸모 있는 일로 바꾸어야 한다. 그래도 축하할 이유는 이미 손에 잡힐 만큼 분명하다. 세계의 두 끝을 가깝게 한다는 말이 가끔은 말 그대로 이루어진다.\n\n이 소식에 적힌 날짜는 편집부가 소식을 받은 달이다. 전하는 데 시간이 걸렸다면 실제 사건은 그보다 앞서 일어났을 수 있다."
