 NFP51_RELATION_ALLY:0 "사건 당시 두 주요 당사국 중 적어도 한 나라가 우리와 정식 동맹 관계였다. 동맹이라는 사실만으로 우리도 이 외교전에 참여했거나 앞으로 참전하리라고 단정할 수는 없다."
 NFP51_RELATION_BLOC:0 "사건 당시 주요 당사국 중 적어도 한 나라가 우리와 같은 세력 블록에 속했다. 같은 블록이 군사 동맹을 대신하거나 우리의 자동 참여를 뜻하지는 않는다."
 NFP51_RELATION_JOINER:0 "우리나라가 이번 소식에서 외교전에 가담한 쪽이다. 가담했다는 사실이 이미 전쟁이 시작됐다는 뜻은 아니다."
 NFP51_RELATION_JOINER_ALLY:0 "새로 가담한 나라는 사건 당시 우리와 정식 동맹을 맺고 있었다. 그들의 결정이 곧 우리나라의 가담으로 이어지는 것은 아니다."
 NFP51_RELATION_JOINER_BLOC:0 "새로 가담한 나라는 사건 당시 우리와 같은 세력 블록에 있었다. 이 소식이 알려 주는 것은 그 나라의 입장이지 블록 전체의 참전 의무가 아니다."
 NFP51_RELATION_OWN:0 "우리나라는 이 대립의 두 주요 당사국 가운데 하나다. 그러므로 소식은 우리 외교와 직접 맞닿는다."
 NFP51_SPECIAL_HINT:0 "이 호외는 하나의 사건을 집중적으로 다룹니다."
 NFP51_SPECIAL_LABEL:0 "호외"
 NFP51_START_1_CORE:0 "해당 월에 외교적 대립이 시작됐다. 요구를 처음 제기한 쪽은 [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName], 원래의 대상은 [ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName]. 쟁점은 [Localize(ScriptContainer.MakeScope.Var('nfp51_play_label').GetFlagName)]."
 NFP51_START_1_END:0 "아직 전쟁이 터진 것은 아니다. 양측은 지지를 구하거나 양보할 수도, 제 뜻을 고집할 수도 있다. 대포만이 설득력이 있다고 여기기 전에 말로도 통할 근거를 찾았으면 좋겠다. 이 다툼의 뒷이야기를 지켜보겠다."
 NFP51_START_1_LEAD:0 "요구를 제기한 쪽은 [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName], 대립의 상대는 [ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName] 측이다."
 NFP51_START_1_TITLE:0 "설득이 끝난 자리에 요구가 놓이다"
 NFP51_START_2_CORE:0 "외교 기록에 새 대립이 올랐다. [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName] 측이 [ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName] 측에 요구를 제기했다. 쟁점은 [Localize(ScriptContainer.MakeScope.Var('nfp51_play_label').GetFlagName)]."
 NFP51_START_2_END:0 "아직 전쟁이 터진 것은 아니다. 양측은 지지를 구하거나 양보할 수도, 제 뜻을 고집할 수도 있다. 대포만이 설득력이 있다고 여기기 전에 말로도 통할 근거를 찾았으면 좋겠다. 이 다툼의 뒷이야기를 지켜보겠다."
 NFP51_START_2_LEAD:0 "외교적 대립이 시작됐다. 두 당사국은 [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName] 및 [ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName]."
 NFP51_START_2_TITLE:0 "설득이 끝난 자리에 요구가 놓이다"
 NFP51_START_TIMELINE:0 "이 외교전의 시작을 기록한 때는 [Localize(Concatenate('NFP30_MONTH_', ToString_int32(FixedPointToInt(ScriptContainer.GetVariableValue('nfp51_start_month')))))], [ScriptContainer.GetVariableValue('nfp51_start_year')|0]년이다. 그 뒤의 소식들도 같은 위기에 속한다."
 NFP52_ACW_1_BODY:0 "미국에서 내전이 시작됐다. 익숙하던 나라 이름도 어떤 소식을 듣고 나면 새롭게 읽힌다. 미국은 지금 연방의 미래를 놓고 무기로 다투고 있다. 단결이니 제 갈 길을 갈 권리니 하는 말 뒤에는 무거운 물음이 남는다. 이 다툼이 끝나기까지 사람들은 얼마나 많은 일을 겪어야 할까.\n\n미국이 연방에서 떨어져 나온 나라와 전쟁에 돌입했다. 정치적 대립은 이제 협상 탁자에 앉아서만 결정을 내릴 수 있는 선을 넘었다. 연방 자체의 앞날도 전장의 향방에 달렸다.\n\n다른 나라에 이것은 먼 미국 땅의 집안싸움 이상이다. 교역하고 협상하고 미래의 계획을 함께 짜던 나라의 처지가 달라졌기 때문이다. 하지만 무엇보다 전쟁의 당사자는 분열 한복판에서 살아야 하는 사람들이다. 전쟁이 계속된다는 소식에 익숙해지기 전에 평화의 조건을 지면에 실을 수 있으면 좋겠다.\n\n이 소식에 적힌 날짜는 편집부가 소식을 받은 달이다. 전하는 데 시간이 걸렸다면 실제 사건은 그보다 앞서 일어났을 수 있다."
 NFP52_ACW_1_CONTEXT:0 "다른 나라에 이것은 먼 미국 땅의 집안싸움 이상이다. 교역하고 협상하고 미래의 계획을 함께 짜던 나라의 처지가 달라졌기 때문이다. 하지만 무엇보다 전쟁의 당사자는 분열 한복판에서 살아야 하는 사람들이다. 전쟁이 계속된다는 소식에 익숙해지기 전에 평화의 조건을 지면에 실을 수 있으면 좋겠다."
