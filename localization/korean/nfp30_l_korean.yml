 NFP51_DETAIL:0 "외교 위기"
 NFP51_END_1_CORE:0 "외교전을 시작한 [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName] 측과 그 대상인 [ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName] 측이 맞선 가운데 [ScriptContainer.MakeScope.Var('nfp51_actor').GetCountryDefinition.GetName] 측이 물러섰다. 쟁점은 [Localize(ScriptContainer.MakeScope.Var('nfp51_play_label').GetFlagName)]."
 NFP51_END_1_END:0 "이번 위기는 전쟁 없이 풀렸다. 한쪽이 물러섰다고 나라 사이의 갈등이 모두 사라지지는 않았다. 그래도 총성이 울리기 전에 끝낸 다툼은 한 줄 따로 기록할 만하다. 신문으로서는 덜 요란한 결말이지만, 살아가는 이들에게는 어쩌면 훨씬 반가운 결말이다."
 NFP51_END_1_LEAD:0 "외교적 대립에서 [ScriptContainer.MakeScope.Var('nfp51_actor').GetCountryDefinition.GetName] 측이 물러섰다."
 NFP51_END_1_TITLE:0 "대포가 입을 열기 전에 한발 물러서다"
 NFP51_END_2_CORE:0 "[ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName] 및 [ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName] 사이의 대립은 전쟁으로 번지기 전에 매듭지어졌다. [ScriptContainer.MakeScope.Var('nfp51_actor').GetCountryDefinition.GetName] 측이 물러섰다. 다툼의 핵심은 [Localize(ScriptContainer.MakeScope.Var('nfp51_play_label').GetFlagName)]."
 NFP51_END_2_END:0 "이번 위기는 전쟁 없이 풀렸다. 한쪽이 물러섰다고 나라 사이의 갈등이 모두 사라지지는 않았다. 그래도 총성이 울리기 전에 끝낸 다툼은 한 줄 따로 기록할 만하다. 신문으로서는 덜 요란한 결말이지만, 살아가는 이들에게는 어쩌면 훨씬 반가운 결말이다."
 NFP51_END_2_LEAD:0 "외교전이 전쟁으로 번지기 전에 [ScriptContainer.MakeScope.Var('nfp51_actor').GetCountryDefinition.GetName] 측이 물러난 사실이 확인됐다."
 NFP51_END_2_TITLE:0 "대포가 입을 열기 전에 한발 물러서다"
 NFP51_JOIN_1_CORE:0 "해당 월에 [ScriptContainer.MakeScope.Var('nfp51_actor').GetCountryDefinition.GetName] 측은 [ScriptContainer.MakeScope.Var('nfp51_side').GetCountryDefinition.GetName] 편에 가담했다. 외교적 대립의 두 주요 당사국은 [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName] 및 [ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName], 쟁점은 [Localize(ScriptContainer.MakeScope.Var('nfp51_play_label').GetFlagName)]."
 NFP51_JOIN_1_END:0 "새로운 지지는 양측의 계산을 바꾼다. 홀로 요구를 내미는 것과 누가 곁에 설지 알고 말하는 것은 다르다. 현재로서는 외교적 대립이다. 자리가 더 찬 협상 탁자가 타협을 도울지, 제 뜻을 굽히지 않으려는 사람만 더 늘어날지 지켜보자."
 NFP51_JOIN_1_LEAD:0 "[ScriptContainer.MakeScope.Var('nfp51_actor').GetCountryDefinition.GetName] 측이 [ScriptContainer.MakeScope.Var('nfp51_side').GetCountryDefinition.GetName] 편을 지지하고 나섰다."
 NFP51_JOIN_1_TITLE:0 "다툼의 탁자가 한층 비좁아졌다"
 NFP51_JOIN_2_CORE:0 "외교적 대립에 새로 가담한 나라는 [ScriptContainer.MakeScope.Var('nfp51_actor').GetCountryDefinition.GetName], 지지를 받은 나라는 [ScriptContainer.MakeScope.Var('nfp51_side').GetCountryDefinition.GetName] 측이다. 두 주요 당사국은 [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName] 및 [ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName], 쟁점은 [Localize(ScriptContainer.MakeScope.Var('nfp51_play_label').GetFlagName)]."
 NFP51_JOIN_2_END:0 "새로운 지지는 양측의 계산을 바꾼다. 홀로 요구를 내미는 것과 누가 곁에 설지 알고 말하는 것은 다르다. 현재로서는 외교적 대립이다. 자리가 더 찬 협상 탁자가 타협을 도울지, 제 뜻을 굽히지 않으려는 사람만 더 늘어날지 지켜보자."
 NFP51_JOIN_2_LEAD:0 "[ScriptContainer.MakeScope.Var('nfp51_side').GetCountryDefinition.GetName] 편에 [ScriptContainer.MakeScope.Var('nfp51_actor').GetCountryDefinition.GetName] 측이 새로 가담했다."
 NFP51_JOIN_2_TITLE:0 "다툼의 탁자가 한층 비좁아졌다"
 NFP51_METRICS:0 "출처는 1.15.0의 기본 외교전 신호다. 사건을 접수한 때의 상태를 저장하며 기사의 날짜는 사건이 발생한 달이다. 위기 번호 [ScriptContainer.GetVariableValue('nfp51_crisis')|0]. 결말이나 다른 나라의 참여 여부를 현재 세계 상태에서 역산하지 않는다. 정기호 전용 기사로 호외로 배달하지 않는다. 당사국과 정식 동맹국, 같은 세력 블록 구성원을 구별해 쓴다."
