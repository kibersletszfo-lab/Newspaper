 NFP52_YUG_2_CONTEXT:0 "공통된 이름은 함께할 일의 시작이다. 축하 행사가 끝나면 날마다 다른 이해관계를 맞추어 나가야 한다. 통합이 지도 제작자에게만 편리한 일이 아니기를 바란다. 사람들은 새 국경을 멀리서 바라보는 대신 그 안에서 살아야 하기 때문이다."
