 NFP50_LAW_GOV_NEUTRAL:0 "정부에 참여한 집단들에는 뚜렷한 선호가 없다. 법은 달라졌지만 정치의 저울은 그대로일 때도 있다."
 NFP50_LAW_GOV_NO_NAME:0 " 정부 내 반대 세력 중 영향력이 가장 큰 집단은 ‘[Localize(ScriptContainer.MakeScope.Var('nfp50_law_gov_no_type').GetFlagName)]’다."
 NFP50_LAW_GOV_OPPOSE:0 "입장을 정한 정부 내 집단에서는 반대 세력이 우세하다. 법이 통과됐다고 모두에게 그 법에 대한 애정까지 딸려 온 것은 아니다."
 NFP50_LAW_GOV_RELATIVE_1:0 "법이 통과되기 전부터 정부 안에서 서로의 선호가 드러났다. [Localize(ScriptContainer.MakeScope.Var('nfp50_law_gov_summary').GetFlagName)][SelectLocalization(GreaterThan_CFixedPoint(ScriptContainer.GetVariableValue('nfp50_law_gov_yes_present'), '(CFixedPoint)0'), 'NFP50_LAW_GOV_YES_NAME', 'NFP50_LAW_NO_MOVE')][SelectLocalization(GreaterThan_CFixedPoint(ScriptContainer.GetVariableValue('nfp50_law_gov_no_present'), '(CFixedPoint)0'), 'NFP50_LAW_GOV_NO_NAME', 'NFP50_LAW_NO_MOVE')]"
 NFP50_LAW_GOV_RELATIVE_2:0 "법이 통과되기 전부터 정부 안에서 서로의 선호가 드러났다. [Localize(ScriptContainer.MakeScope.Var('nfp50_law_gov_summary').GetFlagName)][SelectLocalization(GreaterThan_CFixedPoint(ScriptContainer.GetVariableValue('nfp50_law_gov_yes_present'), '(CFixedPoint)0'), 'NFP50_LAW_GOV_YES_NAME', 'NFP50_LAW_NO_MOVE')][SelectLocalization(GreaterThan_CFixedPoint(ScriptContainer.GetVariableValue('nfp50_law_gov_no_present'), '(CFixedPoint)0'), 'NFP50_LAW_GOV_NO_NAME', 'NFP50_LAW_NO_MOVE')]"
 NFP50_LAW_GOV_SPLIT:0 "정부에는 찬성 세력과 반대 세력이 모두 있다. 같은 청사를 쓴다고 견해까지 같아지지는 않는 모양이다."
 NFP50_LAW_GOV_SUPPORT:0 "입장을 정한 정부 내 집단에서는 지지 세력이 우세하다. 새 법으로서는 든든한 이웃이다."
 NFP50_LAW_GOV_YES_NAME:0 " 정부 내 지지 세력 중 영향력이 가장 큰 집단은 ‘[Localize(ScriptContainer.MakeScope.Var('nfp50_law_gov_yes_type').GetFlagName)]’다."
 NFP50_LAW_IG_BASE_1:0 "규모가 큰 사회 집단들에게도 제 견해가 있다. $NFP50_LAW_IG_ROW_1$ [SelectLocalization(GreaterThan_CFixedPoint(ScriptContainer.GetVariableValue('nfp50_law_ig_count'), '(CFixedPoint)1'), 'NFP50_LAW_IG_ROW_2', 'NFP50_LAW_NO_SECOND_IG')] 이것은 조직된 집단의 목소리다. 주민 모두의 생각을 한 줄로 옮길 수는 없다."
