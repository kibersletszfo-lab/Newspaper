 NFP52_ACW_1_TITLE:0 "미국, 스스로와 전쟁에 나서다"
 NFP52_ACW_2_BODY:0 "미국에서 내전이 시작됐다. 익숙하던 나라 이름도 어떤 소식을 듣고 나면 새롭게 읽힌다. 미국은 지금 연방의 미래를 놓고 무기로 다투고 있다. 단결이니 제 갈 길을 갈 권리니 하는 말 뒤에는 무거운 물음이 남는다. 이 다툼이 끝나기까지 사람들은 얼마나 많은 일을 겪어야 할까.\n\n미국이 연방에서 떨어져 나온 나라와 전쟁에 돌입했다. 정치적 대립은 이제 협상 탁자에 앉아서만 결정을 내릴 수 있는 선을 넘었다. 연방 자체의 앞날도 전장의 향방에 달렸다.\n\n다른 나라에 이것은 먼 미국 땅의 집안싸움 이상이다. 교역하고 협상하고 미래의 계획을 함께 짜던 나라의 처지가 달라졌기 때문이다. 하지만 무엇보다 전쟁의 당사자는 분열 한복판에서 살아야 하는 사람들이다. 전쟁이 계속된다는 소식에 익숙해지기 전에 평화의 조건을 지면에 실을 수 있으면 좋겠다.\n\n기사의 날짜는 편집부가 소식을 확인한 달이다. 사건이 정확히 어느 날 일어났는지를 뜻하지는 않는다."
