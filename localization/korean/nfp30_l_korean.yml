 NFP52_FLU_2_TITLE:0 "새 전염병과 마주한 세계"
 NFP52_GER_1_BODY:0 "독일이 하나의 국가가 됐다. 독자들에게 그 이름은 낯익어도 이제 정치 지도는 다시 봐야 한다. 공통된 이름 아래 공통된 권력이 생겼다. 독일의 분열을 전제로 셈을 해 오던 사람들에게는 지도책보다 더 중요한 무언가를 고쳐야 할 때다.\n\n독일 국가가 형성됐다. 여러 땅의 통일은 이웃 나라들이 계산에 넣어야 할 정치적 현실이 됐다. 그 국경이 어디까지이고 무엇을 할 수 있을지는 별도의 이야기다. 다만 독일을 그저 여러 나라의 집합으로만 이야기하기에는 늦었다.\n\n나라를 하나로 모은 것은 성취다. 그 나라를 꾸리는 일은 이제부터다. 축하 행사 뒤에는 공동의 규칙과 경제, 이웃과의 관계가 기다린다. 지도에는 이미 새 이름이 있다. 이제는 어떤 일들이 그 이름에 따라붙을지 궁금하다.\n\n이 소식에 적힌 날짜는 편집부가 소식을 받은 달이다. 전하는 데 시간이 걸렸다면 실제 사건은 그보다 앞서 일어났을 수 있다."
