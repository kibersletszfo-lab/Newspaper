 NFP50_LAW_IG_OTHER:0 "그 밖의 이해 집단"
 NFP50_LAW_IG_RELATIVE_1:0 "규모가 큰 사회 집단들은 변화를 서로 다르게 보았다. $NFP50_LAW_IG_ROW_1$ [SelectLocalization(GreaterThan_CFixedPoint(ScriptContainer.GetVariableValue('nfp50_law_ig_count'), '(CFixedPoint)1'), 'NFP50_LAW_IG_ROW_2', 'NFP50_LAW_NO_SECOND_IG')] 이것은 조직된 집단의 목소리다. 주민 모두의 생각을 한 줄로 옮길 수는 없다."
