 NFP30_PRICE_DOWN:0 "@arrow_down!"
 NFP30_PRICE_FIRST:0 "이 품목들은 지난달과 비교할 만한 기록이 아직 없다. 최근 관측한 가격만 표시했다."
 NFP30_PRICE_LEAD_1:0 "이번에는 시황을 펼쳐 보자. 지면에 올릴 큰 소식은 없었지만 조용한 달에도 가격은 눈여겨볼 만하다. 특히 제 지갑에서 값을 치르는 사람에게는."
 NFP30_PRICE_LEAD_2:0 "이번에는 시황을 펼쳐 보자. 지면에 올릴 큰 소식은 없었지만 조용한 달에도 가격은 눈여겨볼 만하다. 특히 제 지갑에서 값을 치르는 사람에게는."
 NFP30_PRICE_MARKET:0 "시장 [ScriptContainer.MakeScope.Var('nfp32_market_owner').GetCountryDefinition.GetName]."
 NFP30_PRICE_METHOD:0 "연속된 두 차례 월간 관측 사이에 가격이 가장 크게 달라진 상품을 여섯 가지까지 실었다. 화살표는 이전 가격에서 최근 가격으로 향하며 괄호 안은 변화량이다. 새 상품은 최근 가격만 표시한다. 각 지역의 현지 가격이나 월평균이 아닌 시장 가격이다."
 NFP30_PRICE_METRICS:0 "새 기사가 없는 호를 위한 정례 시황. [ScriptContainer.GetVariableValue('nfp32_rows')|0]개 행, [ScriptContainer.GetVariableValue('nfp32_comparisons')|0]건의 비교. 한 달에 한 번 기록하며 같은 달의 주간호는 같은 자료를 사용한다. 시장이 바뀌거나 관측을 건너뛰면 비교가 끊긴다. 상품의 기본 가격과 게임 내 시장 가격 편차를 바탕으로 가격을 계산한다. 표와 순서는 발행 시점에 정해진다."
 NFP30_PRICE_ROW_EMPTY:0 ""
 NFP30_PRICE_SAME:0 "—"
 NFP30_PRICE_TITLE_1:0 "늘 사던 물건, 요즘은 얼마인가?"
 NFP30_PRICE_TITLE_2:0 "늘 사던 물건, 요즘은 얼마인가?"
 NFP30_PRICE_UNAVAILABLE:0 "이 시황에 실을 수 있는 가격 자료가 없다. 편집부는 숫자를 지어내 표를 채우지 않기로 했다."
 NFP30_PRICE_UP:0 "@arrow_up!"
 NFP30_PRODUCTION_AWAY_1_BODY:0 "상품 [Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]. 3위권 밖에 있을 때는 [ScriptContainer.GetVariableValue('nfp20_before')|0]위, 최근에는 [ScriptContainer.GetVariableValue('nfp20_after')|0]위다. 두 달 연속 3위권에 들었다.\n\n세계 생산의 판도가 바뀌고 있다. 이 순위는 생산량을 재는 것이므로 본지는 여기에서 이익이나 수출, 우리 시장의 가격까지 추론하지 않는다."
 NFP30_PRODUCTION_AWAY_1_LEAD:0 "한 외국이 주요 상품 한 품목의 생산량 3위권에 들어 두 달째 자리를 지켰다."
 NFP30_PRODUCTION_AWAY_1_TITLE:0 "세계 생산 상위권에 새 얼굴"
 NFP30_PRODUCTION_AWAY_2_BODY:0 "상품 [Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]. 3위권 밖에 있을 때는 [ScriptContainer.GetVariableValue('nfp20_before')|0]위, 최근에는 [ScriptContainer.GetVariableValue('nfp20_after')|0]위다. 두 달 연속 3위권에 들었다.\n\n생산량과 무역 영향력은 구별할 일이다. 이 순위의 한 자리만으로 후자까지 입증되지는 않는다."
 NFP30_PRODUCTION_AWAY_2_LEAD:0 "외국의 한 주요 상품 생산량이 세계 3위권에 올랐다."
 NFP30_PRODUCTION_AWAY_2_TITLE:0 "대규모 생산국이 해외에서 입지를 굳히다"
 NFP30_PRODUCTION_HOME_1_BODY:0 "상품 [Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]. 3위권 밖에 있을 때는 [ScriptContainer.GetVariableValue('nfp20_before')|0]위, 최근에는 [ScriptContainer.GetVariableValue('nfp20_after')|0]위다. 두 달 연속 3위권에 들었다.\n\n무게 있는 생산 성과다. 비교 기준은 산출량이며 수익성과 수출, 노동자의 형편에는 각각 별도의 자료가 필요하다."
 NFP30_PRODUCTION_HOME_1_LEAD:0 "우리나라가 주요 상품 한 품목에서 세계 3대 생산국에 안착했다."
 NFP30_PRODUCTION_HOME_1_TITLE:0 "우리 생산량, 세계 3위권 진입"
 NFP30_PRODUCTION_HOME_2_BODY:0 "상품 [Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]. 3위권 밖에 있을 때는 [ScriptContainer.GetVariableValue('nfp20_before')|0]위, 최근에는 [ScriptContainer.GetVariableValue('nfp20_after')|0]위다. 두 달 연속 3위권에 들었다.\n\n높은 생산 순위는 숫자로 확인되는 성과다. 다만 얼마나 비용을 들였고 각 가정에 어떤 이득이 돌아갔는지는 이 순위에 나오지 않는다."
 NFP30_PRODUCTION_HOME_2_LEAD:0 "두 달간 3대 생산국 자리를 지켰으니 우리 산업의 성취를 기록할 만하다."
 NFP30_PRODUCTION_HOME_2_TITLE:0 "국내 생산이 세계 선두권에 서다"
 NFP30_PRODUCTION_METRICS:0 "상품 [Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]. 3위권 밖에 있을 때는 [ScriptContainer.GetVariableValue('nfp20_before')|0]위, 최근에는 [ScriptContainer.GetVariableValue('nfp20_after')|0]위다. 두 달 연속 3위권에 들었다."
 NFP30_PUBLICATION_KIND:0 "[SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp_kind'), '(CFixedPoint)3'), 'NFP30_URGENT', SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp_kind'), '(CFixedPoint)1'), 'NFP30_REGULAR', 'NFP30_MANUAL'))]"
 NFP30_RANK_AWAY_1_BODY:0 "종전 지위는 [Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)], 새 지위는 [Localize(ScriptContainer.MakeScope.Var('nfp20_extra_detail').GetFlagName)].\n\n우리 독자에게는 달라지는 세계의 한 장면이다. 국가 등급이 바뀌었다고 언제나 새 열강이 탄생한 것은 아니다."
 NFP30_RANK_AWAY_1_LEAD:0 "한 외국의 국제적 지위가 달라졌다."
 NFP30_RANK_AWAY_1_TITLE:0 "열강의 판도가 달라지다"
 NFP30_RANK_AWAY_2_BODY:0 "종전 지위는 [Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)], 새 지위는 [Localize(ScriptContainer.MakeScope.Var('nfp20_extra_detail').GetFlagName)].\n\n독자가 변화의 방향을 가늠할 수 있도록 전후 지위를 모두 실었다. 원인과 결과는 따로 살펴야 한다."
 NFP30_RANK_AWAY_2_LEAD:0 "어느 나라의 국제 등급이 바뀌었다는 소식이 들어왔다."
 NFP30_RANK_AWAY_2_TITLE:0 "해외 국가의 위상이 바뀌다"
 NFP30_RANK_HOME_1_BODY:0 "종전 지위는 [Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)], 새 지위는 [Localize(ScriptContainer.MakeScope.Var('nfp20_extra_detail').GetFlagName)].\n\n변화 자체가 주목할 만하다. 방향은 표시된 등급을 보고 판단할 일이다. 등급이 달라졌다고 모두 상승인 것은 아니다."
 NFP30_RANK_HOME_1_LEAD:0 "우리나라의 국제적 위상이 새 평가를 받았다. 편집부가 전후 지위를 전한다."
 NFP30_RANK_HOME_1_TITLE:0 "세계 무대에서 우리의 자리가 달라졌다"
 NFP30_RANK_HOME_2_BODY:0 "종전 지위는 [Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)], 새 지위는 [Localize(ScriptContainer.MakeScope.Var('nfp20_extra_detail').GetFlagName)].\n\n본지는 지위의 변화를 기록한다. 새 등급의 이름만으로 그 원인과 외교적 결과를 가늠할 수는 없다."
 NFP30_RANK_HOME_2_LEAD:0 "국가 명단에서 우리나라가 이제 다른 등급에 자리한다."
 NFP30_RANK_HOME_2_TITLE:0 "나라가 새 국제적 지위를 맞다"
 NFP30_RANK_METRICS:0 "종전 지위는 [Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)], 새 지위는 [Localize(ScriptContainer.MakeScope.Var('nfp20_extra_detail').GetFlagName)]."
 NFP30_REACH_DOMESTIC:0 "자국에서 발생했거나 전쟁에서 자국이 속한 편의 소식"
 NFP30_REACH_FROZEN:0 "수도가 있는 지역과 세계적 사건 여부를 사건 기록 시점에 저장했다."
 NFP30_REACH_LINE:0 "보도 범위 [Localize(ScriptContainer.MakeScope.Var('nfp31_reach').GetFlagName)]. [SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp31_legacy'), '(CFixedPoint)1'), 'NFP30_REACH_MIGRATED', 'NFP30_REACH_FROZEN')]"
 NFP30_REACH_MIGRATED:0 "예전에 수집했으나 아직 발행하지 않은 기록의 수도 지역을 갱신 시점에 복원했다. 당시의 이해관계와 당사국 순위는 알 수 없다."
 NFP30_REACH_OLD:0 "이 호는 지역 필터를 도입하기 전에 발행됐다."
 NFP30_REACH_PRICE_LOCAL:0 "독자 국가의 시장에 관한 정례 시황"
 NFP30_REACH_REGION:0 "접수와 발행 시점 모두 독자 국가의 지역 이해관계가 2 이상"
 NFP30_REACH_REJECTED:0 "지역 필터로 [ScriptContainer.GetVariableValue('nfp31_rejected_region')|0]건의 기사 보류"
 NFP30_REACH_WORLD:0 "세계적 사건 — 두 열강 사이의 전쟁 또는 열강 지위의 획득이나 상실"
 NFP30_REASON_PRICES:0 "이번 호에 선정된 소식이 없어 월간 시황을 실었다."
 NFP30_REGULAR:0 "정기호"
 NFP30_RUBRIC_1:0 "경제"
 NFP30_RUBRIC_2:0 "전쟁"
 NFP30_RUBRIC_3:0 "사회"
 NFP30_RUBRIC_4:0 "사건"
 NFP30_RUBRIC_EMPTY:0 "이번 호에 해당 지면의 기사가 없습니다. 지면이 꺼져 있었거나 조건에 맞는 소식이 없었습니다."
 NFP30_RUBRIC_JUMP:0 "이 지면의 첫 기사로 이동합니다."
 NFP30_SHORTAGE_HOME_1_BODY:0 "상품 [Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]. 두 차례 연속 월간 관측에서 우리 시장의 품귀가 확인됐다.\n\n이 품목의 공급과 소비를 유심히 확인할 일이다. 이번 소식은 물량의 부족에 관한 것이며 비싼 가격은 별도로 살펴야 한다."
 NFP30_SHORTAGE_HOME_1_LEAD:0 "우리 시장에서 품귀 소식이 한 차례로 끝나지 않았다. 편집부는 이를 오늘의 경제 현안에 올린다."
 NFP30_SHORTAGE_HOME_1_TITLE:0 "시장에 필요한 물건이 모자라다"
 NFP30_SHORTAGE_HOME_2_BODY:0 "상품 [Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]. 두 차례 연속 월간 관측에서 우리 시장의 품귀가 확인됐다.\n\n시장 품귀는 확인됐지만 원인은 아직 밝혀지지 않았다. 이 자료로 책임자를 지목하거나 특정 건물을 지으면 어떤 효과가 난다고 약속할 수는 없다."
 NFP30_SHORTAGE_HOME_2_LEAD:0 "우리 시장에서 주요 상품 한 품목이 두 달째 부족하다. 다른 산업이 잘된다고 이 물음이 사라지지는 않는다."
 NFP30_SHORTAGE_HOME_2_TITLE:0 "눈여겨볼 품귀 소식"
 NFP30_SHORTAGE_METRICS:0 "상품 [Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]. 두 차례 연속 월간 관측에서 우리 시장의 품귀가 확인됐다."
 NFP30_SHORTAGE_RECOVERY_HOME_1_BODY:0 "상품 [Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]. 지난 경고 이후 두 차례 연속 월간 관측에서 종전의 시장 품귀가 더는 나타나지 않았다.\n\n종전의 품귀가 사라졌음을 기록한다. 그렇다고 낮은 가격을 약속하는 것은 아니다. 값비싼 것과 물량이 모자란 것은 서로 다른 문제다."
 NFP30_SHORTAGE_RECOVERY_HOME_1_LEAD:0 "앞서 독자들에게 부족하다고 알린 상품에 관해 반가운 소식이 왔다."
 NFP30_SHORTAGE_RECOVERY_HOME_1_TITLE:0 "종전의 품귀가 물러가다"
 NFP30_SHORTAGE_RECOVERY_HOME_2_BODY:0 "상품 [Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]. 지난 경고 이후 두 차례 연속 월간 관측에서 종전의 시장 품귀가 더는 나타나지 않았다.\n\n양호한 상태가 두 달간 이어졌다. 본지는 앞으로도 물건이 있는지와 살 만한 가격인지를 구별할 것이다. 후자는 이번 소식에서 확인되지 않았다."
 NFP30_SHORTAGE_RECOVERY_HOME_2_LEAD:0 "우리 시장을 지켜본 끝에 지난 경고 뒤 기다리던 소식이 왔다. 품귀가 더는 확인되지 않는다."
 NFP30_SHORTAGE_RECOVERY_HOME_2_TITLE:0 "품귀 소식에 찾아온 반가운 전환"
 NFP30_SHORTAGE_RECOVERY_METRICS:0 "상품 [Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]. 지난 경고 이후 두 차례 연속 월간 관측에서 종전의 시장 품귀가 더는 나타나지 않았다."
 NFP30_TECH_AWAY_1_BODY:0 "이제 이 나라가 쓸 수 있는 기술은 ‘[Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]’다.\n\n저쪽에서 할 수 있는 일이 늘었다. 우리가 이미 아는 것은 무엇이고 어떻게 쓰고 있는지 제 살림을 돌아볼 계기다. 축하는 우편으로 보내도 되지만 우리에게 쓸 만한 생각은 그 자리에서 챙겨 두는 편이 좋겠다."
 NFP30_TECH_AWAY_1_LEAD:0 "외국이 새 기술을 습득했다. 우리가 익숙한 소식들을 읽는 동안 저 나라의 가능성이 넓어졌다. 정확히 무엇이 가능해졌는지 볼 만하다."
 NFP30_TECH_AWAY_1_TITLE:0 "해외에서 할 수 있는 일이 늘어났다"
 NFP30_TECH_AWAY_2_BODY:0 "이제 이 나라가 쓸 수 있는 기술은 ‘[Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]’다.\n\n저쪽에서 할 수 있는 일이 늘었다. 우리가 이미 아는 것은 무엇이고 어떻게 쓰고 있는지 제 살림을 돌아볼 계기다. 축하는 우편으로 보내도 되지만 우리에게 쓸 만한 생각은 그 자리에서 챙겨 두는 편이 좋겠다."
 NFP30_TECH_AWAY_2_LEAD:0 "외국이 새 기술을 습득했다. 우리가 익숙한 소식들을 읽는 동안 저 나라의 가능성이 넓어졌다. 정확히 무엇이 가능해졌는지 볼 만하다."
 NFP30_TECH_AWAY_2_TITLE:0 "해외에서 할 수 있는 일이 늘어났다"
 NFP30_TECH_HOME_1_BODY:0 "이제 이 나라가 쓸 수 있는 기술은 ‘[Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]’다.\n\n이제 아는 것이 늘었으니 알맞게 쓰는 일이 남았다. 자부심을 가질 이유이자 일에 착수할 이유다. 다음 기사는 새 지식으로 해낸 일을 다룰 수 있기를 바란다. 가능성의 목록도 반갑지만 그 쓰임은 더 반갑다."
 NFP30_TECH_HOME_1_LEAD:0 "우리나라가 새 기술을 손에 넣었다. 약속만으로 경제를 움직이고 싶지 않았던 이들에게 반가운 소식이다."
 NFP30_TECH_HOME_1_TITLE:0 "지식이 늘었다. 이제 써먹을 차례다"
 NFP30_TECH_HOME_2_BODY:0 "이제 이 나라가 쓸 수 있는 기술은 ‘[Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]’다.\n\n이제 아는 것이 늘었으니 알맞게 쓰는 일이 남았다. 자부심을 가질 이유이자 일에 착수할 이유다. 다음 기사는 새 지식으로 해낸 일을 다룰 수 있기를 바란다. 가능성의 목록도 반갑지만 그 쓰임은 더 반갑다."
 NFP30_TECH_HOME_2_LEAD:0 "우리나라가 새 기술을 손에 넣었다. 약속만으로 경제를 움직이고 싶지 않았던 이들에게 반가운 소식이다."
 NFP30_TECH_HOME_2_TITLE:0 "지식이 늘었다. 이제 써먹을 차례다"
 NFP30_TECH_METRICS:0 "이 나라가 습득한 기술은 ‘[Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]’다."
 NFP30_TITLE:0 "국민신문 — 0.5.0"
 NFP30_UNKNOWN_LEAD:0 "이전에 수집한 자료에서 뽑은 기사."
 NFP30_UNKNOWN_METRICS:0 "저장된 수치 [ScriptContainer.GetVariableValue('nfp20_before')|3] → [ScriptContainer.GetVariableValue('nfp20_after')|3]."
 NFP30_UNKNOWN_TITLE:0 "편집부 소식"
 NFP30_URGENT:0 "호외"
 NFP30_WAR_END_AWAY_1_BODY:0 "전쟁이 끝났다. 주요 당사국은 [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName] 및 [ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName].\n\n우리 독자에게도 국제 정세의 중요한 전환이다. 누가 목적을 이뤘으며 어떤 대가를 치렀는지는 이번 소식에서 확인되지 않았다."
 NFP30_WAR_END_AWAY_1_LEAD:0 "두 주요 당사국 사이의 전쟁이 끝났다는 소식이 왔다."
 NFP30_WAR_END_AWAY_1_TITLE:0 "해외 전쟁이 막을 내리다"
 NFP30_WAR_END_AWAY_2_BODY:0 "전쟁이 끝났다. 주요 당사국은 [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName] 및 [ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName].\n\n본지는 종전을 기록한다. 결과에 대한 평가는 손실과 평화 조건에 관한 자료가 들어온 뒤로 남긴다."
 NFP30_WAR_END_AWAY_2_LEAD:0 "주요 당사국의 무력 충돌이 끝났다."
 NFP30_WAR_END_AWAY_2_TITLE:0 "외국에서 종전 소식이 들어오다"
 NFP30_WAR_END_HOME_1_BODY:0 "전쟁이 끝났다. 주요 당사국은 [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName] 및 [ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName].\n\n본지는 전쟁의 끝을 전한다. 승자와 피해 규모, 평화 조건의 내용까지 이 소식에서 밝혀지는 것은 아니다."
 NFP30_WAR_END_HOME_1_LEAD:0 "우리나라가 주요 당사국으로 얽혔던 전쟁이 막을 내렸다."
 NFP30_WAR_END_HOME_1_TITLE:0 "우리나라의 전쟁이 끝났다"
 NFP30_WAR_END_HOME_2_BODY:0 "전쟁이 끝났다. 주요 당사국은 [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName] 및 [ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName].\n\n결과를 평가하려면 합의 내용과 당사국들의 형편을 알아야 한다. 전쟁이 끝났다는 사실만으로 승리를 선언할 수는 없다."
 NFP30_WAR_END_HOME_2_LEAD:0 "우리나라가 참여한 전쟁이 끝났다. 편집부가 나라의 큰 변화를 기록한다."
 NFP30_WAR_END_HOME_2_TITLE:0 "종전 소식이 전해지다"
 NFP30_WAR_END_METRICS:0 "전쟁이 끝났다. 주요 당사국은 [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName] 및 [ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName]."
 NFP30_WAR_START_AWAY_1_BODY:0 "전쟁이 시작됐다. 주요 당사국은 [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName] 및 [ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName].\n\n그 밖에 누가 참여했는지, 전투가 어떻게 전개되고 우리나라에 어떤 영향을 미칠지는 더 많은 자료가 필요하다. 전쟁의 결말은 아직 알 수 없다."
 NFP30_WAR_START_AWAY_1_LEAD:0 "해외에서 중요한 전쟁이 시작됐다. 본지는 두 주요 당사국을 전한다."
 NFP30_WAR_START_AWAY_1_TITLE:0 "세계에서 새 전쟁이 터지다"
 NFP30_WAR_START_AWAY_2_BODY:0 "전쟁이 시작됐다. 주요 당사국은 [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName] 및 [ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName].\n\n편집부는 개전을 기록하고 승자를 미리 정하지 않는다. 참전국 전체의 명단은 이 기사에서 확인되지 않았다."
 NFP30_WAR_START_AWAY_2_LEAD:0 "외국에서 두 나라 사이에 무력 충돌이 시작됐다는 소식이 왔다."
 NFP30_WAR_START_AWAY_2_TITLE:0 "새 전쟁이 국제면을 바꾸다"
 NFP30_WAR_START_HOME_1_BODY:0 "전쟁이 시작됐다. 주요 당사국은 [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName] 및 [ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName].\n\n편집부는 전개를 지켜볼 것이다. 이번에는 주요 당사국을 전한다. 모든 참전국과 앞으로의 결말까지 알려진 것은 아니다."
 NFP30_WAR_START_HOME_1_LEAD:0 "평화로운 소식 자리에 개전 소식이 들어섰다. 우리나라는 새 전쟁의 주요 당사국이 됐다."
 NFP30_WAR_START_HOME_1_TITLE:0 "우리나라가 전쟁에 들어갔다"
 NFP30_WAR_START_HOME_2_BODY:0 "전쟁이 시작됐다. 주요 당사국은 [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName] 및 [ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName].\n\n모든 독자가 주목할 사건이다. 본지는 결말을 미리 정하거나 믿을 만한 소식을 승리의 약속으로 대신하지 않을 것이다."
 NFP30_WAR_START_HOME_2_LEAD:0 "우리나라가 주요 당사국인 전쟁이 시작됐다는 소식이 들어왔다."
 NFP30_WAR_START_HOME_2_TITLE:0 "우리나라가 참여한 전쟁이 시작되다"
 NFP30_WAR_START_METRICS:0 "전쟁이 시작됐다. 주요 당사국은 [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName] 및 [ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName]."
