l_braz_por:
 NFP43_GAINED:0 "Surgiu um novo vínculo diplomático entre nosso país e [ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName]."
 NFP43_GAINED_ALLIANCE_1_BODY:0 "Mudou o nosso círculo de aliados. O último levantamento confirma uma aliança com [ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName].\n\nPara a nossa diplomacia, a notícia importa. As obrigações de cada parte e a participação em um conflito dependem dos termos em vigor."
 NFP43_GAINED_ALLIANCE_1_LEAD:0 "Temos agora uma aliança formal com [ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName]."
 NFP43_GAINED_ALLIANCE_1_TITLE:0 "Nosso país tem um novo aliado"
 NFP43_GAINED_ALLIANCE_2_BODY:0 "Até o último levantamento, essa aliança não constava da lista. Agora, [ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName] integra o nosso círculo de aliados formais.\n\nA redação registra a mudança nas relações. Para saber até onde vai a ajuda militar prometida, é preciso ler o acordo."
 NFP43_GAINED_ALLIANCE_2_LEAD:0 "A redação registra uma nova aliança com [ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName]."
 NFP43_GAINED_ALLIANCE_2_TITLE:0 "Um novo laço entre aliados"
 NFP43_GAINED_BLOC_1_BODY:0 "Mudou a composição do nosso círculo diplomático. O último levantamento confirma que pertencemos ao mesmo bloco de poder que [ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName].\n\nPassar a integrar o mesmo bloco não equivale a firmar uma aliança bilateral nem a prometer participação em todas as guerras do parceiro."
 NFP43_GAINED_BLOC_1_LEAD:0 "Nosso país e [ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName] agora integram o mesmo bloco de poder."
 NFP43_GAINED_BLOC_1_TITLE:0 "Há um novo parceiro em nosso bloco"
 NFP43_GAINED_BLOC_2_BODY:0 "Entre dois levantamentos surgiu um laço: nosso país e [ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName] estão no mesmo bloco. Qualquer um dos dois pode ter mudado de posição.\n\nRegistramos a nova composição. Por enquanto, faltam elementos para falar de um convite ou de um acordo de ajuda militar."
 NFP43_GAINED_BLOC_2_LEAD:0 "Agora compartilhamos um bloco de poder com [ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName]."
 NFP43_GAINED_BLOC_2_TITLE:0 "Mudou o círculo de parceiros do bloco"
 NFP43_GAINED_METRICS:0 "Novo vínculo estratégico observado. Natureza: [SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp20_extra'), '(CFixedPoint)1'), 'NFP43_KIND_ALLIANCE', 'NFP43_KIND_BLOC')]. O primeiro levantamento serve de referência. As verificações são semanais e também precedem a publicação. Mudanças breves podem passar despercebidas. A data indica o mês da descoberta. A data de assinatura pode ser outra. Prioridade 160, para o leitor do próprio país, sem filtro geográfico."
 NFP43_KIND_ALLIANCE:0 "aliança formal"
 NFP43_KIND_BLOC:0 "participação no mesmo bloco de poder"
 NFP43_LOST:0 "O vínculo diplomático que mantínhamos com [ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName] deixou de constar do levantamento."
 NFP43_LOST_ALLIANCE_1_BODY:0 "Temos uma mudança na lista de aliados. A aliança que vigorava com [ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName] já não consta do último levantamento.\n\nVale rever as contas feitas com esse compromisso em mente. A redação ainda não pôde apurar o motivo do fim da aliança nem de quem partiu a iniciativa."
 NFP43_LOST_ALLIANCE_1_LEAD:0 "A aliança formal com [ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName] já não aparece entre os nossos acordos."
 NFP43_LOST_ALLIANCE_1_TITLE:0 "A antiga aliança chegou ao fim"
 NFP43_LOST_ALLIANCE_2_BODY:0 "O último levantamento já não registra a aliança que mantínhamos com [ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName].\n\nAs circunstâncias merecem apuração. Um país que deixa de existir e dois governos que rompem relações podem sair do registro da mesma maneira, mas são histórias bem diferentes."
 NFP43_LOST_ALLIANCE_2_LEAD:0 "O levantamento deixou de registrar a nossa aliança formal com [ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName]."
 NFP43_LOST_ALLIANCE_2_TITLE:0 "Um laço a menos entre os aliados"
 NFP43_LOST_BLOC_1_BODY:0 "Antes, compartilhávamos um bloco de poder com [ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName]. O levantamento mais recente já não confirma esse vínculo.\n\nPode ter mudado a posição de qualquer uma das partes ou até o próprio bloco. Registramos a mudança sem atribuir a ninguém uma saída que ainda cabe apurar."
 NFP43_LOST_BLOC_1_LEAD:0 "Já não pertencemos ao mesmo bloco de poder que [ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName]."
 NFP43_LOST_BLOC_1_TITLE:0 "Terminou a participação no mesmo bloco"
 NFP43_LOST_BLOC_2_BODY:0 "Nosso país e [ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName] deixaram de constar como membros do mesmo bloco. A mudança interessa de perto à nossa diplomacia.\n\nA causa e a iniciativa ainda estão por esclarecer. Uma aliança bilateral, se houver, é outro acordo."
 NFP43_LOST_BLOC_2_LEAD:0 "O último levantamento já não confirma o vínculo de bloco com [ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName]."
 NFP43_LOST_BLOC_2_TITLE:0 "Mudança na composição do bloco"
 NFP43_LOST_METRICS:0 "Um vínculo estratégico do nosso país deixou de ser observado. Natureza: [SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp20_extra'), '(CFixedPoint)1'), 'NFP43_KIND_ALLIANCE', 'NFP43_KIND_BLOC')]. Verificação semanal e antes da publicação. A iniciativa e a data exata do rompimento são desconhecidas. Um país que deixa de existir também perde o vínculo. Prioridade 170, apenas para o leitor do próprio país."
 NFP43_RELATION:0 "vínculo de aliança do nosso país"
 NFP43_WAR:0 "Começou a guerra. Quem ataca: [ScriptContainer.MakeScope.Var('nfp20_extra_detail').GetCountryDefinition.GetName]. Quem se defende: [ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName]."
 NFP43_WAR_ALLIANCE_1_BODY:0 "A guerra começou. A iniciativa partiu de [ScriptContainer.MakeScope.Var('nfp20_extra_detail').GetCountryDefinition.GetName], e o alvo da jogada diplomática foi [ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName]. Quando a guerra teve início, o país atacado era nosso aliado formal.\n\nA notícia merece a primeira página. Para dizer que nosso país também entrou na guerra, seria preciso mais que o texto da aliança."
 NFP43_WAR_ALLIANCE_1_LEAD:0 "Na guerra que acaba de começar, quem se defende é [ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName]."
 NFP43_WAR_ALLIANCE_1_TITLE:0 "Nosso aliado está sob ataque"
 NFP43_WAR_ALLIANCE_2_BODY:0 "Quem iniciou a guerra foi [ScriptContainer.MakeScope.Var('nfp20_extra_detail').GetCountryDefinition.GetName]. Na defesa está [ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName], país com o qual mantínhamos uma aliança quando começou o conflito.\n\nA notícia toca diretamente a nossa diplomacia. Só o anúncio da guerra ainda não esclarece a nossa participação nem como se cumprirão as obrigações."
 NFP43_WAR_ALLIANCE_2_LEAD:0 "Começou uma guerra contra um país aliado, [ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName]."
 NFP43_WAR_ALLIANCE_2_TITLE:0 "A guerra chegou ao nosso aliado"
 NFP43_WAR_BLOC_1_BODY:0 "A guerra começou por iniciativa de [ScriptContainer.MakeScope.Var('nfp20_extra_detail').GetCountryDefinition.GetName]. Na defesa está [ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName], país que pertencia ao nosso bloco quando o conflito teve início.\n\nA notícia merece a atenção do governo. Participar do mesmo bloco não cria, por si só, uma aliança militar nem uma obrigação de entrar na guerra."
 NFP43_WAR_BLOC_1_LEAD:0 "O alvo da nova guerra é um país do nosso bloco de poder, [ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName]."
 NFP43_WAR_BLOC_1_TITLE:0 "Guerra contra um parceiro do bloco"
 NFP43_WAR_BLOC_2_BODY:0 "Começou a guerra entre o país que tomou a iniciativa, [ScriptContainer.MakeScope.Var('nfp20_extra_detail').GetCountryDefinition.GetName], e o alvo da jogada, [ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName]. Quando a guerra começou, o alvo pertencia ao nosso bloco.\n\nO fato interessa diretamente à nossa diplomacia. A redação não tem motivo para anunciar nossa entrada na guerra nem para atribuir ao bloco compromissos que não pôde confirmar."
 NFP43_WAR_BLOC_2_LEAD:0 "Na defesa está um parceiro do nosso bloco de poder, [ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName]."
 NFP43_WAR_BLOC_2_TITLE:0 "A guerra alcança o nosso círculo diplomático"
 NFP43_WAR_METRICS:0 "Fonte: on_diplo_play_war_start. Foram registrados os lados da jogada diplomática e o vínculo entre o leitor e o alvo no início da guerra. Iniciador: [ScriptContainer.MakeScope.Var('nfp20_extra_detail').GetCountryDefinition.GetName]. Alvo: [ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName]. Prioridade 190, pauta urgente da seção Guerra. A participação no mesmo bloco, por si só, não obriga ninguém a entrar na guerra."
