l_braz_por:
 NFP89_LAW_COLD:0 "Esse país desperta pouca simpatia por aqui. Sua lei não fica melhor nem pior por isso. Vejamos o que muda para as pessoas: até para discordar de um governo estrangeiro vale a pena saber do que se discorda."
 NFP89_LAW_DEPENDENT:0 "Um de nossos países é súdito do outro. Por isso a organização interna de lá toca mais de perto os nossos assuntos, embora os debates locais tenham razões próprias. A nova lei merece ser lida pelo que de fato dispõe."
 NFP89_LAW_NEIGHBOR:0 "É difícil achar distante uma mudança do outro lado da fronteira. Vale compará-la com nossas regras. Tomá-la como receita pronta para nós seria apressar o diagnóstico: a casa ao lado pode ter paredes diferentes."
 NFP89_LAW_PARTNER:0 "A mudança se deu em um país parceiro. Os planos comuns continuam de pé, mas convém conhecer o parceiro um pouco além da assinatura no tratado. Veremos como a nova lei vai se sair no cotidiano."
 NFP89_LAW_THREAT:0 "Temos motivos para acompanhar de perto as relações com esse país. A nova lei, por si só, não é dirigida contra nós. Melhor entender como o país se organiza do que responder com a mesma piada a toda mudança que vem de lá."
 NFP89_WORLD_ACW_DISTANT:0 "De longe é cômodo ler a guerra americana como uma discussão entre dois campos. Com isso corre-se o risco de perder o principal: o país entrou em uma luta armada interna cujo desfecho ainda se ignora."
 NFP89_WORLD_ACW_NEIGHBOR:0 "Para os vizinhos, a guerra civil americana começou perto demais para ficar entre as notícias de terras distantes. A proximidade merece atenção, ainda que por si só não comprove ameaça à nossa fronteira."
 NFP89_WORLD_ACW_OWN:0 "Quando a guerra civil se trava em nosso país, a palavra «interna» pouco consola. A divisão americana chegou às armas. O boletim de hoje ainda não diz quem vencerá nem a que preço."
 NFP89_WORLD_ACW_PARTNER:0 "Nossos laços com os Estados Unidos precisam ser considerados à luz da guerra civil. Vale reler os compromissos: a amizade com um país não traz pronta uma resposta para a divisão que se abriu dentro dele."
 NFP89_WORLD_ACW_RIVAL:0 "A antipatia pelo governo americano não transforma a guerra civil em espetáculo inofensivo. A posição de um país com o qual precisamos contar está mudando. O vencedor, a redação não pretende nomear de antemão."
 NFP89_WORLD_AUS_DISTANT:0 "A Austrália chega ao noticiário como Estado unificado. Deixemos para as próximas edições o juízo sobre o uso que fará de sua nova organização. Essa parte da história ainda não chegou à redação."
 NFP89_WORLD_AUS_NEIGHBOR:0 "A união australiana ocorreu numa parte do mundo próxima à nossa. A vizinhança dá importância à nova situação política. Para dizer o que ela trará aos nossos habitantes, contudo, falta conhecer os efeitos."
 NFP89_WORLD_AUS_OWN:0 "A união da Austrália é uma notícia de casa para nossos leitores. Surgiu um Estado comum. Ainda se verá até que ponto conseguirá ligar os assuntos cotidianos das diferentes localidades."
 NFP89_WORLD_AUS_PARTNER:0 "Nosso parceiro australiano ganhou uma organização comum. Vale discutir os planos conjuntos à luz da mudança, sem atribuir à união riquezas instantâneas ou compromissos que ainda não foram assumidos."
 NFP89_WORLD_AUS_RIVAL:0 "Temos relações complicadas com a Austrália. Nem por isso sua união é mera formalidade. Entender a mudança vale mais do que declará-la insignificante antes de examiná-la."
 NFP89_WORLD_CAN_DISTANT:0 "A formação do Canadá muda o mapa da América do Norte. Por enquanto, é disso que trata o nosso boletim. Os efeitos concretos sobre os negócios daqui exigem outras informações."
 NFP89_WORLD_CAN_NEIGHBOR:0 "Bem perto de nós, o Canadá se uniu. Mudou a política na vizinhança. Atribuir à mudança intenções novas do governo canadense já seria um palpite."
 NFP89_WORLD_CAN_OWN:0 "Formou-se o Canadá. Para nossos leitores, a nova organização do Estado é assunto de casa. O mapa comum já existe. O dia a dia mostrará como nele se resolverão os assuntos locais de sempre."
 NFP89_WORLD_CAN_PARTNER:0 "A unificação canadense envolve um país com o qual temos compromissos. Os planos comuns merecem ser conferidos à luz da nova organização. Trocar o nome no cabeçalho dos velhos papéis pode ser pouco."
 NFP89_WORLD_CAN_RIVAL:0 "A unificação canadense merece entrar nos cálculos apesar das relações difíceis. A nova organização do Estado não precisa agradar a nossa redação para merecer um exame sério."
 NFP89_WORLD_CHINA_DISTANT:0 "Mesmo vista de longe, a fragmentação da China merece uma página especial. Mas entre uma mudança mundial e o que se encontra em nosso balcão há uma distância que nenhum palpite de jornal consegue preencher."
 NFP89_WORLD_CHINA_NEIGHBOR:0 "Para os vizinhos, a divisão da China acontece logo além da fronteira. O mapa antigo já não basta para saber quem exerce o poder por perto. As consequências concretas merecem apuração à parte."
 NFP89_WORLD_CHINA_OWN:0 "Para nossos leitores, a fragmentação da China é história do próprio país. Saber quem decide agora e onde encontrar uma autoridade capaz de cumprir a decisão importa mais que uma bela explicação para as novas cores do mapa."
 NFP89_WORLD_CHINA_PARTNER:0 "Tínhamos planos em comum com a China. Agora, o nome conhecido já não representa automaticamente o mesmo Estado unificado. Antes de retomar a conversa, vale descobrir com quem falar."
 NFP89_WORLD_CHINA_RIVAL:0 "A divisão de um país com o qual temos relações difíceis pode até causar satisfação. Mas uma porção de novos governos tampouco promete uma vizinhança conveniente ou negociações mais simples."
 NFP89_WORLD_COMMUNE_DISTANT:0 "Haverá discussão sobre a Comuna de Paris muito além da França. Por ora, este jornal distingue o acontecimento confirmado dos palpites sobre onde mais ele poderia se repetir."
 NFP89_WORLD_COMMUNE_NEIGHBOR:0 "Aos vizinhos da França, a notícia da Comuna chega de uma capital próxima. Há motivo para acompanhar a mudança. A vizinhança, sozinha, ainda não diz se algo semelhante acontecerá entre nós."
 NFP89_WORLD_COMMUNE_OWN:0 "A Comuna de Paris diz respeito à organização do poder em nosso próprio país. Por trás do grande nome político, os acontecimentos ainda estão em curso. A edição de hoje terá de passar sem a comodidade de um desfecho definitivo."
 NFP89_WORLD_COMMUNE_PARTNER:0 "Chega da França, país com o qual mantemos compromissos, a notícia da Comuna. Nossos cálculos diplomáticos terão de considerar a questão que se abriu sobre o poder, além do nome conhecido do parceiro."
 NFP89_WORLD_COMMUNE_RIVAL:0 "As relações difíceis com a França convidam ao comentário mordaz. Com a Comuna de Paris, porém, a primeira tarefa é entender o que está acontecendo com o poder. Uma boa farpa não substitui a explicação."
 NFP89_WORLD_ETH_DISTANT:0 "A unificação etíope merece seu lugar na crônica mundial. Como afetará os assuntos internacionais ainda se verá. Um mapa novo não vem com todas as respostas sobre o futuro."
 NFP89_WORLD_ETH_NEIGHBOR:0 "Aqui ao lado, a Etiópia se unificou. Aos vizinhos convém tomar conhecimento da nova situação antes de continuar discutindo a região como se nada tivesse acontecido."
 NFP89_WORLD_ETH_OWN:0 "A união etíope faz parte da história dos nossos próprios leitores. A organização política comum já é notícia. Os relatos de que ela tenha melhorado a vida precisarão se apoiar nos acontecimentos que ainda virão."
 NFP89_WORLD_ETH_PARTNER:0 "Nosso parceiro etíope mudou sua organização política. Convém conferir os planos em comum à luz da união. Seria cedo para tomar a nova posição por mera continuação dos entendimentos anteriores."
 NFP89_WORLD_ETH_RIVAL:0 "Mesmo com relações difíceis, não podemos riscar a união etíope dos nossos cálculos. Mudou a organização do país. Se a mudança nos agrada é outra pergunta, que não altera o fato."
 NFP89_WORLD_FLU_DISTANT:0 "A gripe entrou para o noticiário mundial. Isso ainda não descreve a situação em cada país. Será preciso apurar onde e em que medida a doença atingiu as pessoas. Um título vistoso não fará esse trabalho."
 NFP89_WORLD_FLU_NEIGHBOR:0 "Dos vizinhos chegou a notícia da gripe. A proximidade merece atenção, mas para dizer que a doença já se espalhou por aqui a redação precisaria de informações locais."
 NFP89_WORLD_FLU_OWN:0 "A notícia da gripe diz respeito ao país desta edição. Cabe acompanhar as informações confirmadas sobre a doença. A matéria de hoje ainda não traz o número de doentes nem a extensão do contágio."
 NFP89_WORLD_FLU_PARTNER:0 "A notícia da gripe veio de um Estado com o qual temos compromissos. A doença merece atenção por seus próprios efeitos. Nenhuma relação diplomática substitui as informações sobre a saúde das pessoas."
 NFP89_WORLD_FLU_RIVAL:0 "As relações com um governo podem ser ruins sem que a notícia da gripe se torne ocasião de festejo. Procuraremos saber como anda a doença pelos boletins a seu respeito. Uma lista de simpatias políticas serve pouco para esse fim."
 NFP89_WORLD_GER_DISTANT:0 "A unificação alemã chama atenção mesmo fora da Europa. O surgimento de um Estado comum, porém, ainda não diz quais efeitos chegarão aos nossos próprios negócios."
 NFP89_WORLD_GER_NEIGHBOR:0 "Para os vizinhos da Alemanha, a união significa que há um só Estado ali ao lado. Veremos o que fará dessa organização. A redação não pretende tomar cada passo seguinte por coisa decidida."
 NFP89_WORLD_GER_OWN:0 "A Alemanha se uniu, e nossos leitores vivem a mudança no próprio Estado. O nome agora é comum. Até que ponto o serão também os afazeres, os próximos anos dirão."
 NFP89_WORLD_GER_PARTNER:0 "Nosso parceiro alemão conta agora com um Estado unificado. Vale conferir os planos em comum à luz dessa nova posição. Os contatos de ontem continuam úteis, mas não conservam o antigo mapa político."
 NFP89_WORLD_GER_RIVAL:0 "A unificação da Alemanha muda a organização de um país com o qual nos entendemos mal. Fingir que só mudou o letreiro no mapa seria uma maneira um tanto cara de buscar sossego."
 NFP89_WORLD_ITA_DISTANT:0 "A Itália chegou às páginas internacionais com uma notícia de união. Para dizer se nos trouxe proveito ou prejuízo ainda falta o capítulo seguinte: saber o que de fato mudou para nós."
 NFP89_WORLD_ITA_NEIGHBOR:0 "Os vizinhos da Itália precisam olhar a península de outro modo. A organização de um Estado próximo mudou. Uma só notícia, porém, não revela suas intenções futuras."
 NFP89_WORLD_ITA_OWN:0 "A Itália ganhou um Estado comum. Para quem vive nele, a união começa de verdade no lugar onde o nome novo encontra os velhos assuntos da vida local."
 NFP89_WORLD_ITA_PARTNER:0 "Lidaremos com o parceiro italiano em outras circunstâncias políticas. Vale começar a conversa conferindo os planos comuns, em vez de pressupor que a união deixou tudo como estava."
 NFP89_WORLD_ITA_RIVAL:0 "Nossas relações difíceis com a Itália não reduzem sua unificação a uma ninharia. Formou-se um Estado comum na península. Uma notícia incômoda não perde substância por falta de telegrama de parabéns."
 NFP89_WORLD_JAP_DISTANT:0 "A restauração japonesa merece atenção mesmo à distância. Só não convém traduzir, sem perceber, «mudança» por «renovação bem-sucedida». Para a segunda afirmação ainda serão necessárias notícias próprias."
 NFP89_WORLD_JAP_NEIGHBOR:0 "Para os vizinhos do Japão, a restauração altera a política por perto. Acompanhemos as decisões de quem governa. Pela posição da nova autoridade ainda não se lê todo o seu programa."
 NFP89_WORLD_JAP_OWN:0 "A restauração imperial ocorreu em nosso país. A nova posição do poder já é um fato. Atribuir-lhe agora todos os êxitos do futuro seria chegar antes dos próprios êxitos."
 NFP89_WORLD_JAP_PARTNER:0 "No país de nosso parceiro japonês mudou a posição da autoridade suprema. Vale examinar de novo com quem tratamos e em que termos. Isso não faz desaparecer de uma vez todos os vínculos anteriores."
 NFP89_WORLD_JAP_RIVAL:0 "Podemos ter motivos de queixa contra o poder japonês. A restauração é, ainda assim, uma mudança política. Sozinha não prova nem que o país se fortaleceu nem que esteja prestes a fracassar."
 NFP89_WORLD_PANAMA_DISTANT:0 "A nova rota pelo Panamá altera as possibilidades do transporte marítimo. Seria agradável contar já em seguida quanto lucramos. O boletim de hoje ainda não traz esse número."
 NFP89_WORLD_PANAMA_NEIGHBOR:0 "O Canal do Panamá surgiu numa região próxima à nossa. Os oceanos ganharam uma nova ligação. Quais dos nossos transportes serão afetados ainda merece exame próprio."
 NFP89_WORLD_PANAMA_OWN:0 "O Canal do Panamá foi concluído no país a que se dedica esta edição. Os oceanos estão ligados. Resta ver que uso se fará da passagem."
 NFP89_WORLD_PANAMA_PARTNER:0 "Nossos vínculos com o Estado do Canal do Panamá dão à obra interesse especial. Estar no mesmo círculo diplomático, contudo, não garante passagem gratuita nem vantagem comercial já realizada."
 NFP89_WORLD_PANAMA_RIVAL:0 "Com as relações difíceis que temos com o Estado do Panamá, é tentador ver no canal apenas o êxito de outro país. Melhor saber o que a nova passagem permite e em que condições poderemos usá-la."
 NFP89_WORLD_ROM_DISTANT:0 "A união dos principados romenos muda a política da região. De longe, convém entender primeiro a mudança. Haverá tempo depois para procurar nela a confirmação de alguma teoria de estimação."
 NFP89_WORLD_ROM_NEIGHBOR:0 "Para os vizinhos, a união romena é mais que uma linha nas notícias europeias. Saber com quem resolver agora os assuntos comuns vale mais do que tentar adivinhar como cada um deles terminará."
 NFP89_WORLD_ROM_OWN:0 "A união romena mudou o próprio Estado em que vivem nossos leitores. Há uma nova maneira de tomar decisões comuns. As questões locais de sempre, é claro, não desapareceram só por isso."
 NFP89_WORLD_ROM_PARTNER:0 "Nas terras romenas se uniu um país com o qual temos compromissos. Os antigos contatos conservam seu valor. Já as conversas futuras devem levar em conta a nova organização do Estado."
 NFP89_WORLD_ROM_RIVAL:0 "As relações com o Estado romeno são difíceis. Mesmo assim, sua união altera os cálculos diplomáticos. O quadro de ontem não se conserva só porque o de hoje nos incomoda."
 NFP89_WORLD_SPRING_DISTANT:0 "Sob o nome de Primavera dos Povos convivem histórias políticas diferentes. De longe, é fácil tomar todas por uma só. O leitor ganhará mais se conservarmos as diferenças do que se trocarmos os fatos por uma bela generalização."
 NFP89_WORLD_SPRING_NEIGHBOR:0 "Os abalos se dão na vizinhança. Isso aproxima a notícia, mas não torna inevitável entre nós o mesmo desfecho. Um destino político pronto não se transporta pela fronteira."
 NFP89_WORLD_SPRING_OWN:0 "Para nossos leitores, a Primavera dos Povos já vai além do título das notícias europeias. As mudanças em nosso país devem ser entendidas a partir do que se passa aqui. O nome cômodo de uma época dificilmente basta."
 NFP89_WORLD_SPRING_PARTNER:0 "Os abalos políticos atingiram um Estado com o qual temos compromissos. Vale acompanhá-lo de perto: um plano em comum traçado ontem não explica como o parceiro atravessará as mudanças."
 NFP89_WORLD_SPRING_RIVAL:0 "A Primavera dos Povos chegou a um país com o qual temos relações difíceis. Contar cada embaraço dele como um ganho nosso seria aritmética simples demais para acontecimentos tão complicados."
 NFP89_WORLD_SUEZ_DISTANT:0 "Suez encurta a antiga volta pelo mar nas rotas às quais a nova passagem convém. Daí não se segue que toda mercadoria ficará mais barata aqui. Do canal até o balcão ainda há um caminho."
 NFP89_WORLD_SUEZ_NEIGHBOR:0 "O Canal de Suez abriu perto do nosso país. A nova rota merece atenção, mas saber se convém utilizá-la exige mais que medir a distância no mapa."
 NFP89_WORLD_SUEZ_OWN:0 "O Canal de Suez foi concluído no país desta edição. Uma grande obra deu lugar a uma passagem entre mares. A contribuição para a economia ainda terá de aparecer nos negócios."
 NFP89_WORLD_SUEZ_PARTNER:0 "Temos compromissos com o Estado onde se encontra o Canal de Suez. Convém incluir a nova passagem nos cálculos comuns. A conclusão da obra ainda não nos promete condições especiais de uso."
 NFP89_WORLD_SUEZ_RIVAL:0 "As relações com o Estado de Suez são difíceis. O canal não se torna menos real por isso. Antes de considerá-lo uma vantagem a ser usada contra nós, vale conhecer as condições efetivas de passagem."
 NFP89_WORLD_TAIPING_DISTANT:0 "No confronto chinês surgiu um Estado Taiping separado. A lista dos participantes mudou. Isso ainda não habilita a redação a contar o fim da história."
 NFP89_WORLD_TAIPING_NEIGHBOR:0 "Na vizinhança surgiu o poder Taiping. Saber quem governará o quê perto de nós merece atenção. O boletim de hoje ainda não traça todos os limites dessa influência."
 NFP89_WORLD_TAIPING_OWN:0 "O surgimento do Estado Taiping faz parte da história política de nosso próprio país. A nova autoridade já se apresentou. Seu lugar na disputa ainda não autoriza a redação a publicar o resultado da luta."
 NFP89_WORLD_TAIPING_PARTNER:0 "Os vínculos que mantemos com o Estado Taiping aproximam esta notícia mais que de costume os relatos da China. Para os planos comuns, importa o surgimento de um poder à parte. Seu êxito inevitável seria mera suposição."
 NFP89_WORLD_TAIPING_RIVAL:0 "As relações com o Estado Taiping são complicadas. Razão a mais para distinguir o surgimento de uma autoridade de suas possibilidades futuras. O primeiro está confirmado. A segunda questão não se resolve com uma só notícia."
 NFP89_WORLD_YUG_DISTANT:0 "Nos Bálcãs apareceu um novo Estado unificado. De longe é fácil lhe atribuir imediatamente um papel na história. Comecemos com algo mais modesto: a mudança que já se vê no mapa."
 NFP89_WORLD_YUG_NEIGHBOR:0 "Para os vizinhos da Iugoslávia, a formação de um Estado comum muda a política bem de perto. Que decisões se seguirão, ainda se ignora. A vizinhança não nos dá o dom de ler os planos alheios antes da hora."
 NFP89_WORLD_YUG_OWN:0 "Formou-se a Iugoslávia. Nossos leitores passaram a integrar um novo Estado comum. Ao nome único caberá lidar com os diversos assuntos locais. É aí que a união ganhará sentido no dia a dia."
 NFP89_WORLD_YUG_PARTNER:0 "A formação da Iugoslávia muda a organização do nosso parceiro nos Bálcãs. Vale rever os planos conjuntos por seu conteúdo. Um novo Estado merece mais que um simples endereço para enviar os parabéns."
 NFP89_WORLD_YUG_RIVAL:0 "Temos relações difíceis com o Estado iugoslavo. Ainda assim, seu surgimento merece atenção. Explicar os Bálcãs segundo o mapa de ontem só por antipatia ao de hoje seria um consolo bastante estranho."
