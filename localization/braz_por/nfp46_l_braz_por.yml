l_braz_por:
 NFP46_GOOD_LABEL:0 "[ScriptContainer.MakeScope.Var('nfp46_good').GetGoods.GetNameNoIcon]"
 NFP46_METRICS:0 "Mercadoria: [ScriptContainer.MakeScope.Var('nfp46_good').GetGoods.GetNameNoIcon]. Ordens de compra: [ScriptContainer.GetVariableValue('nfp46_buy_before')|1] → [ScriptContainer.GetVariableValue('nfp46_buy_after')|1]. Ordens de venda: [ScriptContainer.GetVariableValue('nfp46_sell_before')|1] → [ScriptContainer.GetVariableValue('nfp46_sell_after')|1]. Diferença em relação à demanda: [ScriptContainer.GetVariableValue('nfp46_gap_before')|1]% → [ScriptContainer.GetVariableValue('nfp46_gap_after')|1]%. À esquerda, o primeiro registro guardado da série. À direita, a observação mensal mais recente.\nLimiar editorial: oferta inferior a 80% da demanda em duas observações mensais seguidas ou sinal direto de escassez no jogo. Serviços locais, transporte e eletricidade exigem observação regional própria."
 NFP46_SHORTAGE_BODY_1:0 "O jogo indica diretamente uma escassez de mercadoria no mercado. Foram duas observações mensais seguidas com dificuldades de abastecimento, por sinal direto de escassez ou grande descompasso nas ordens.\n\nMercadoria: [ScriptContainer.MakeScope.Var('nfp46_good').GetGoods.GetNameNoIcon]. Ordens de compra: [ScriptContainer.GetVariableValue('nfp46_buy_before')|1] → [ScriptContainer.GetVariableValue('nfp46_buy_after')|1]. Ordens de venda: [ScriptContainer.GetVariableValue('nfp46_sell_before')|1] → [ScriptContainer.GetVariableValue('nfp46_sell_after')|1]. Diferença em relação à demanda: [ScriptContainer.GetVariableValue('nfp46_gap_before')|1]% → [ScriptContainer.GetVariableValue('nfp46_gap_after')|1]%. À esquerda, o primeiro registro guardado da série. À direita, a observação mensal mais recente.\n\nComparamos ordens no mercado. Não medimos quanto deixou de chegar às mãos dos moradores. Os números não estabelecem a causa da diferença, as obras responsáveis ou o efeito sobre o padrão de vida."
 NFP46_SHORTAGE_BODY_2:0 "O último registro indica diretamente escassez no mercado. As dificuldades persistem por dois meses. O registro anterior pode ter entrado na conta pela diferença entre as ordens. Isso não estabelece dois meses de penalidade à produção.\n\nMercadoria: [ScriptContainer.MakeScope.Var('nfp46_good').GetGoods.GetNameNoIcon]. Ordens de compra: [ScriptContainer.GetVariableValue('nfp46_buy_before')|1] → [ScriptContainer.GetVariableValue('nfp46_buy_after')|1]. Ordens de venda: [ScriptContainer.GetVariableValue('nfp46_sell_before')|1] → [ScriptContainer.GetVariableValue('nfp46_sell_after')|1]. Diferença em relação à demanda: [ScriptContainer.GetVariableValue('nfp46_gap_before')|1]% → [ScriptContainer.GetVariableValue('nfp46_gap_after')|1]%. À esquerda, o primeiro registro guardado da série. À direita, a observação mensal mais recente.\n\nComparamos ordens no mercado. Não medimos quanto deixou de chegar às mãos dos moradores. Os números não estabelecem a causa da diferença, as obras responsáveis ou o efeito sobre o padrão de vida."
 NFP46_SHORTAGE_LEAD_1:0 "A falta da mercadoria persiste nos registros do nosso mercado. Trazemos o abastecimento à pauta."
 NFP46_SHORTAGE_LEAD_2:0 "Nosso mercado registra diretamente a escassez do produto. A dificuldade merece atenção."
 NFP46_SHORTAGE_RECOVERY_BODY_1:0 "Depois do alerta, duas observações mensais seguidas já não mostram o sinal direto de escassez. Em ambas, a oferta chegou a pelo menos 80% da demanda. Isso não garante preço baixo nem recuperação em todas as empresas.\n\nMercadoria: [ScriptContainer.MakeScope.Var('nfp46_good').GetGoods.GetNameNoIcon]. Ordens de compra: [ScriptContainer.GetVariableValue('nfp46_buy_before')|1] → [ScriptContainer.GetVariableValue('nfp46_buy_after')|1]. Ordens de venda: [ScriptContainer.GetVariableValue('nfp46_sell_before')|1] → [ScriptContainer.GetVariableValue('nfp46_sell_after')|1]. Diferença em relação à demanda: [ScriptContainer.GetVariableValue('nfp46_gap_before')|1]% → [ScriptContainer.GetVariableValue('nfp46_gap_after')|1]%. À esquerda, o primeiro registro guardado da série. À direita, a observação mensal mais recente.\n\nComparamos ordens no mercado. Não medimos quanto deixou de chegar às mãos dos moradores. Os números não estabelecem a causa da diferença, as obras responsáveis ou o efeito sobre o padrão de vida."
 NFP46_SHORTAGE_RECOVERY_BODY_2:0 "Dois registros mensais seguidos não mostram o antigo sinal de escassez nem um descompasso nas ordens além do limiar editorial. Registramos a mudança, lembrando que disponibilidade e preço são coisas distintas.\n\nMercadoria: [ScriptContainer.MakeScope.Var('nfp46_good').GetGoods.GetNameNoIcon]. Ordens de compra: [ScriptContainer.GetVariableValue('nfp46_buy_before')|1] → [ScriptContainer.GetVariableValue('nfp46_buy_after')|1]. Ordens de venda: [ScriptContainer.GetVariableValue('nfp46_sell_before')|1] → [ScriptContainer.GetVariableValue('nfp46_sell_after')|1]. Diferença em relação à demanda: [ScriptContainer.GetVariableValue('nfp46_gap_before')|1]% → [ScriptContainer.GetVariableValue('nfp46_gap_after')|1]%. À esquerda, o primeiro registro guardado da série. À direita, a observação mensal mais recente.\n\nComparamos ordens no mercado. Não medimos quanto deixou de chegar às mãos dos moradores. Os números não estabelecem a causa da diferença, as obras responsáveis ou o efeito sobre o padrão de vida."
 NFP46_SHORTAGE_RECOVERY_LEAD_1:0 "Voltamos ao abastecimento de que já tratamos. Dois registros deixaram de mostrar o problema anterior."
 NFP46_SHORTAGE_RECOVERY_LEAD_2:0 "Há notícia animadora sobre a escassez no mercado."
 NFP46_SHORTAGE_RECOVERY_TITLE_1:0 "A escassez anterior dá sinais de alívio"
 NFP46_SHORTAGE_RECOVERY_TITLE_2:0 "Uma virada favorável no abastecimento"
 NFP46_SHORTAGE_TITLE_1:0 "A falta do produto merece atenção em nosso mercado"
 NFP46_SHORTAGE_TITLE_2:0 "A questão do abastecimento segue em aberto"
 NFP46_SUPPLY_GAP_BODY_1:0 "Na observação mensal mais recente, as ordens de venda somam menos de 80% das ordens de compra. O mês anterior também registrou dificuldade, por grande descompasso nas ordens ou sinal direto de escassez no jogo. O limiar editorial não implica automaticamente penalidade à produção.\n\nMercadoria: [ScriptContainer.MakeScope.Var('nfp46_good').GetGoods.GetNameNoIcon]. Ordens de compra: [ScriptContainer.GetVariableValue('nfp46_buy_before')|1] → [ScriptContainer.GetVariableValue('nfp46_buy_after')|1]. Ordens de venda: [ScriptContainer.GetVariableValue('nfp46_sell_before')|1] → [ScriptContainer.GetVariableValue('nfp46_sell_after')|1]. Diferença em relação à demanda: [ScriptContainer.GetVariableValue('nfp46_gap_before')|1]% → [ScriptContainer.GetVariableValue('nfp46_gap_after')|1]%. À esquerda, o primeiro registro guardado da série. À direita, a observação mensal mais recente.\n\nComparamos ordens no mercado. Não medimos quanto deixou de chegar às mãos dos moradores. Os números não estabelecem a causa da diferença, as obras responsáveis ou o efeito sobre o padrão de vida."
 NFP46_SUPPLY_GAP_BODY_2:0 "Duas observações mensais seguidas revelam dificuldade no abastecimento. Agora a oferta está abaixo de 80% da procura. No registro anterior havia um descompasso assim ou um sinal direto de escassez. Isso não estabelece penalidade na produção nem efeitos de um preço elevado.\n\nMercadoria: [ScriptContainer.MakeScope.Var('nfp46_good').GetGoods.GetNameNoIcon]. Ordens de compra: [ScriptContainer.GetVariableValue('nfp46_buy_before')|1] → [ScriptContainer.GetVariableValue('nfp46_buy_after')|1]. Ordens de venda: [ScriptContainer.GetVariableValue('nfp46_sell_before')|1] → [ScriptContainer.GetVariableValue('nfp46_sell_after')|1]. Diferença em relação à demanda: [ScriptContainer.GetVariableValue('nfp46_gap_before')|1]% → [ScriptContainer.GetVariableValue('nfp46_gap_after')|1]%. À esquerda, o primeiro registro guardado da série. À direita, a observação mensal mais recente.\n\nComparamos ordens no mercado. Não medimos quanto deixou de chegar às mãos dos moradores. Os números não estabelecem a causa da diferença, as obras responsáveis ou o efeito sobre o padrão de vida."
 NFP46_SUPPLY_GAP_LEAD_1:0 "Pelo segundo mês, o abastecimento apresenta dificuldade. Na observação mais recente, a oferta fica bem atrás da procura."
 NFP46_SUPPLY_GAP_LEAD_2:0 "A dificuldade no abastecimento persiste: a oferta está consideravelmente abaixo da procura."
 NFP46_SUPPLY_GAP_RECOVERY_BODY_1:0 "Em dois boletins mensais seguidos, a oferta representou ao menos 80% das ordens de compra, sem sinal direto de escassez. Ainda pode restar uma diferença menor: o jornal não promete equilíbrio perfeito nem preços baixos.\n\nMercadoria: [ScriptContainer.MakeScope.Var('nfp46_good').GetGoods.GetNameNoIcon]. Ordens de compra: [ScriptContainer.GetVariableValue('nfp46_buy_before')|1] → [ScriptContainer.GetVariableValue('nfp46_buy_after')|1]. Ordens de venda: [ScriptContainer.GetVariableValue('nfp46_sell_before')|1] → [ScriptContainer.GetVariableValue('nfp46_sell_after')|1]. Diferença em relação à demanda: [ScriptContainer.GetVariableValue('nfp46_gap_before')|1]% → [ScriptContainer.GetVariableValue('nfp46_gap_after')|1]%. À esquerda, o primeiro registro guardado da série. À direita, a observação mensal mais recente.\n\nComparamos ordens no mercado. Não medimos quanto deixou de chegar às mãos dos moradores. Os números não estabelecem a causa da diferença, as obras responsáveis ou o efeito sobre o padrão de vida."
 NFP46_SUPPLY_GAP_RECOVERY_BODY_2:0 "Depois do alerta, o mercado ficou dois meses fora do limiar editorial de dificuldade. A oferta atingiu ao menos 80% da procura e o sinal direto de escassez desapareceu. É uma melhora delimitada nos indicadores. As causas e consequências ainda requerem exame próprio.\n\nMercadoria: [ScriptContainer.MakeScope.Var('nfp46_good').GetGoods.GetNameNoIcon]. Ordens de compra: [ScriptContainer.GetVariableValue('nfp46_buy_before')|1] → [ScriptContainer.GetVariableValue('nfp46_buy_after')|1]. Ordens de venda: [ScriptContainer.GetVariableValue('nfp46_sell_before')|1] → [ScriptContainer.GetVariableValue('nfp46_sell_after')|1]. Diferença em relação à demanda: [ScriptContainer.GetVariableValue('nfp46_gap_before')|1]% → [ScriptContainer.GetVariableValue('nfp46_gap_after')|1]%. À esquerda, o primeiro registro guardado da série. À direita, a observação mensal mais recente.\n\nComparamos ordens no mercado. Não medimos quanto deixou de chegar às mãos dos moradores. Os números não estabelecem a causa da diferença, as obras responsáveis ou o efeito sobre o padrão de vida."
 NFP46_SUPPLY_GAP_RECOVERY_LEAD_1:0 "Voltamos ao problema já publicado. A distância entre oferta e procura diminuiu."
 NFP46_SUPPLY_GAP_RECOVERY_LEAD_2:0 "Duas observações já não confirmam o grande descompasso anterior entre as ordens."
 NFP46_SUPPLY_GAP_RECOVERY_TITLE_1:0 "Diminuiu o descompasso do mercado"
 NFP46_SUPPLY_GAP_RECOVERY_TITLE_2:0 "Sinais de melhora no abastecimento"
 NFP46_SUPPLY_GAP_TITLE_1:0 "A procura deixa a oferta para trás"
 NFP46_SUPPLY_GAP_TITLE_2:0 "O descompasso do mercado pede atenção"
