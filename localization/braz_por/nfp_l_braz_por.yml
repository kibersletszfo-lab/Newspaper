l_braz_por:
 NFP20_ACCESS:0 "Acesso ao mercado persistentemente baixo\nDefinição de país: [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName]. Observação: [ScriptContainer.GetVariableValue('nfp20_year')|0], mês [Add_CFixedPoint(ScriptContainer.GetVariableValue('nfp20_month'), '(CFixedPoint)1')|0].\nRegião: [ScriptContainer.MakeScope.Var('nfp20_region').GetStateRegion.GetName]. O acesso ao mercado permaneceu abaixo de 90% por dois meses. Proporção atual: [ScriptContainer.GetVariableValue('nfp20_after')|3]. É preciso apurar a causa. A infraestrutura local, as ligações marítimas e outras restrições exigem exame separado.\nSeleção: [Localize(ScriptContainer.MakeScope.Var('nfp20_reason').GetFlagName)]. Fato nº [ScriptContainer.GetVariableValue('nfp20_id')|0]."
 NFP20_ACCESS_RECOVERY:0 "Continuação: melhora no acesso ao mercado\nDefinição de país: [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName]. Observação: [ScriptContainer.GetVariableValue('nfp20_year')|0], mês [Add_CFixedPoint(ScriptContainer.GetVariableValue('nfp20_month'), '(CFixedPoint)1')|0].\nRegião: [ScriptContainer.MakeScope.Var('nfp20_region').GetStateRegion.GetName]. Depois do alerta publicado, duas observações consecutivas mostram acesso ao mercado de pelo menos 90%. Proporção: [ScriptContainer.GetVariableValue('nfp20_before')|3] → [ScriptContainer.GetVariableValue('nfp20_after')|3].\nSeleção: [Localize(ScriptContainer.MakeScope.Var('nfp20_reason').GetFlagName)]. Fato nº [ScriptContainer.GetVariableValue('nfp20_id')|0]."
 NFP20_COVER_TEXT:0 "Boletim da redação\nMatérias: [ScriptContainer.GetVariableValue('nfp20_article_count')|0]. Os números e textos correspondem ao fechamento desta edição.\n\nHistórico: [ScriptContainer.GetVariableValue('nfp20_history_count')|0] observações. Comparação ao longo de [ScriptContainer.GetVariableValue('nfp20_summary_intervals')|0] intervalos (até 12).\nProjeção do PIB anual: [ScriptContainer.GetVariableValue('nfp20_summary_before')|0] → [ScriptContainer.GetVariableValue('nfp20_summary_after')|0].\n\nUma edição sem matérias indica que ainda faltam fatos confirmados nas seções habilitadas. Notícias anteriores trazem sempre sua data de observação."
 NFP20_DIAGNOSTICS:0 "Diagnóstico da redação no fechamento\nRestantes na fila: [ScriptContainer.GetVariableValue('nfp20_queue_remaining')|0]. Total omitido por excesso: [ScriptContainer.GetVariableValue('nfp20_dropped')|0].\nFora desta edição: problema já superado [ScriptContainer.GetVariableValue('nfp20_rejected_obsolete')|0]; seção desativada [ScriptContainer.GetVariableValue('nfp20_rejected_rubric')|0]; sem caráter urgente [ScriptContainer.GetVariableValue('nfp20_rejected_urgent')|0]; limite do tipo [ScriptContainer.GetVariableValue('nfp20_rejected_cap')|0]; falta de espaço [ScriptContainer.GetVariableValue('nfp20_rejected_space')|0]."
 NFP20_DIVERGENCE:0 "A economia cresce enquanto o padrão de vida recua\nDefinição de país: [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName]. Observação: [ScriptContainer.GetVariableValue('nfp20_year')|0], mês [Add_CFixedPoint(ScriptContainer.GetVariableValue('nfp20_month'), '(CFixedPoint)1')|0].\nEm três intervalos mensais completos, o PIB anual projetado passou de [ScriptContainer.GetVariableValue('nfp20_before')|0] para [ScriptContainer.GetVariableValue('nfp20_after')|0]. O padrão de vida médio caiu [ScriptContainer.GetVariableValue('nfp20_extra')|2] pontos. Os dados mostram a divergência; sua causa ainda precisa ser apurada.\nSeleção: [Localize(ScriptContainer.MakeScope.Var('nfp20_reason').GetFlagName)]. Fato nº [ScriptContainer.GetVariableValue('nfp20_id')|0]."
 NFP20_GDP_LEADER:0 "Um novo país entre os dez maiores PIBs\nDefinição de país: [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName]. Observação: [ScriptContainer.GetVariableValue('nfp20_year')|0], mês [Add_CFixedPoint(ScriptContainer.GetVariableValue('nfp20_month'), '(CFixedPoint)1')|0].\nÚltima posição fora dos dez primeiros: [ScriptContainer.GetVariableValue('nfp20_before')|0]. Posição atual: [ScriptContainer.GetVariableValue('nfp20_after')|0]. O país se manteve entre os dez primeiros por duas observações mensais. Mede-se a projeção do PIB anual. Os lucros e o bem-estar da população são outras questões.\nSeleção: [Localize(ScriptContainer.MakeScope.Var('nfp20_reason').GetFlagName)]. Fato nº [ScriptContainer.GetVariableValue('nfp20_id')|0]."
 NFP20_INFRA:0 "Infraestrutura sob pressão\nDefinição de país: [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName]. Observação: [ScriptContainer.GetVariableValue('nfp20_year')|0], mês [Add_CFixedPoint(ScriptContainer.GetVariableValue('nfp20_month'), '(CFixedPoint)1')|0].\nRegião: [ScriptContainer.MakeScope.Var('nfp20_region').GetStateRegion.GetName]. O saldo de infraestrutura ficou negativo em dois meses seguidos. Último saldo: [ScriptContainer.GetVariableValue('nfp20_after')|2]. Vale verificar a rede local de transporte e sua carga.\nSeleção: [Localize(ScriptContainer.MakeScope.Var('nfp20_reason').GetFlagName)]. Fato nº [ScriptContainer.GetVariableValue('nfp20_id')|0]."
 NFP20_INFRA_RECOVERY:0 "Continuação: restabelecido o equilíbrio da infraestrutura\nDefinição de país: [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName]. Observação: [ScriptContainer.GetVariableValue('nfp20_year')|0], mês [Add_CFixedPoint(ScriptContainer.GetVariableValue('nfp20_month'), '(CFixedPoint)1')|0].\nRegião: [ScriptContainer.MakeScope.Var('nfp20_region').GetStateRegion.GetName]. Depois do alerta publicado, duas observações seguidas mostram saldo igual ou superior a zero: [ScriptContainer.GetVariableValue('nfp20_before')|2] → [ScriptContainer.GetVariableValue('nfp20_after')|2]. A melhora está confirmada, mas não exclui dificuldades futuras.\nSeleção: [Localize(ScriptContainer.MakeScope.Var('nfp20_reason').GetFlagName)]. Fato nº [ScriptContainer.GetVariableValue('nfp20_id')|0]."
 NFP20_LAW:0 "Entra em vigor uma reforma importante\nDefinição de país: [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName]. Observação: [ScriptContainer.GetVariableValue('nfp20_year')|0], mês [Add_CFixedPoint(ScriptContainer.GetVariableValue('nfp20_month'), '(CFixedPoint)1')|0].\nLei: [Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]. Registrou-se a entrada em vigor. Ainda não se avaliam os efeitos, e o fato não permite afirmar que houve votação no parlamento.\nSeleção: [Localize(ScriptContainer.MakeScope.Var('nfp20_reason').GetFlagName)]. Fato nº [ScriptContainer.GetVariableValue('nfp20_id')|0]."
 NFP20_LITERACY:0 "Um novo marco na alfabetização\nDefinição de país: [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName]. Observação: [ScriptContainer.GetVariableValue('nfp20_year')|0], mês [Add_CFixedPoint(ScriptContainer.GetVariableValue('nfp20_month'), '(CFixedPoint)1')|0].\nParcela alfabetizada: [ScriptContainer.GetVariableValue('nfp20_before')|3] → [ScriptContainer.GetVariableValue('nfp20_after')|3]. O país cruzou o limiar de [ScriptContainer.GetVariableValue('nfp20_extra')|2] da população. A comparação com o registro anterior confirma a mudança, independentemente do valor inicial do país.\nSeleção: [Localize(ScriptContainer.MakeScope.Var('nfp20_reason').GetFlagName)]. Fato nº [ScriptContainer.GetVariableValue('nfp20_id')|0]."
 NFP20_NONE:0 "—"
 NFP20_PRODUCTION:0 "Novidade entre os três maiores produtores\nDefinição de país: [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName]. Observação: [ScriptContainer.GetVariableValue('nfp20_year')|0], mês [Add_CFixedPoint(ScriptContainer.GetVariableValue('nfp20_month'), '(CFixedPoint)1')|0].\nMercadoria: [Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]. Última posição fora dos três primeiros: [ScriptContainer.GetVariableValue('nfp20_before')|0]. Posição atual: [ScriptContainer.GetVariableValue('nfp20_after')|0]. Dois boletins mensais confirmam o ingresso no grupo. Mede-se volume produzido. A rentabilidade e as exportações não foram medidas.\nSeleção: [Localize(ScriptContainer.MakeScope.Var('nfp20_reason').GetFlagName)]. Fato nº [ScriptContainer.GetVariableValue('nfp20_id')|0]."
 NFP20_QUIET:0 "Nesta edição não foi selecionada nenhuma notícia nova para a seção. O jornal não preenche a página repetindo os indicadores de sempre."
 NFP20_RANK:0 "O país mudou de categoria internacional\nDefinição de país: [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName]. Observação: [ScriptContainer.GetVariableValue('nfp20_year')|0], mês [Add_CFixedPoint(ScriptContainer.GetVariableValue('nfp20_month'), '(CFixedPoint)1')|0].\nCategoria anterior: [Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]. Nova categoria: [Localize(ScriptContainer.MakeScope.Var('nfp20_extra_detail').GetFlagName)]. Uma mudança na classificação não significa necessariamente o surgimento de uma nova grande potência.\nSeleção: [Localize(ScriptContainer.MakeScope.Var('nfp20_reason').GetFlagName)]. Fato nº [ScriptContainer.GetVariableValue('nfp20_id')|0]."
 NFP20_RANK_UNKNOWN:0 "fora das categorias listadas"
 NFP20_REASON_PRIORITY:0 "prioridade e antiguidade da pauta"
 NFP20_SHORTAGE:0 "Persiste a escassez no mercado\nDefinição de país: [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName]. Observação: [ScriptContainer.GetVariableValue('nfp20_year')|0], mês [Add_CFixedPoint(ScriptContainer.GetVariableValue('nfp20_month'), '(CFixedPoint)1')|0].\nMercadoria: [Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]. O mercado do leitor registrou diretamente escassez em duas observações mensais seguidas. O sinal difere de um preço alto. Convém verificar a oferta e o consumo no mercado.\nSeleção: [Localize(ScriptContainer.MakeScope.Var('nfp20_reason').GetFlagName)]. Fato nº [ScriptContainer.GetVariableValue('nfp20_id')|0]."
 NFP20_SHORTAGE_RECOVERY:0 "Continuação: o mercado deixou de registrar escassez\nDefinição de país: [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName]. Observação: [ScriptContainer.GetVariableValue('nfp20_year')|0], mês [Add_CFixedPoint(ScriptContainer.GetVariableValue('nfp20_month'), '(CFixedPoint)1')|0].\nMercadoria: [Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]. Depois do alerta publicado, dois boletins mensais não registraram o sinal direto de escassez. O preço ainda pode ser elevado; trata-se de outra medida.\nSeleção: [Localize(ScriptContainer.MakeScope.Var('nfp20_reason').GetFlagName)]. Fato nº [ScriptContainer.GetVariableValue('nfp20_id')|0]."
 NFP20_TECH:0 "O país domina uma tecnologia importante\nDefinição de país: [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName]. Observação: [ScriptContainer.GetVariableValue('nfp20_year')|0], mês [Add_CFixedPoint(ScriptContainer.GetVariableValue('nfp20_month'), '(CFixedPoint)1')|0].\nTecnologia: [Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]. Registrou-se a aquisição do conhecimento pelo país. Isso não estabelece pioneirismo mundial nem adoção em todas as construções.\nSeleção: [Localize(ScriptContainer.MakeScope.Var('nfp20_reason').GetFlagName)]. Fato nº [ScriptContainer.GetVariableValue('nfp20_id')|0]."
 NFP20_WAR_END:0 "A guerra chegou ao fim\nData: [ScriptContainer.GetVariableValue('nfp20_year')|0], mês [Add_CFixedPoint(ScriptContainer.GetVariableValue('nfp20_month'), '(CFixedPoint)1')|0].\nPartes principais, segundo as definições permanentes: [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName] e [ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName]. Registrou-se o encerramento da guerra. Os dados não estabelecem o vencedor, as perdas nem os termos da paz.\nSeleção: [Localize(ScriptContainer.MakeScope.Var('nfp20_reason').GetFlagName)]. Fato nº [ScriptContainer.GetVariableValue('nfp20_id')|0]."
 NFP20_WAR_START:0 "Começou a guerra\nData: [ScriptContainer.GetVariableValue('nfp20_year')|0], mês [Add_CFixedPoint(ScriptContainer.GetVariableValue('nfp20_month'), '(CFixedPoint)1')|0].\nPartes principais, segundo as definições permanentes: [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName] e [ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName]. Registrou-se a passagem da jogada diplomática à guerra. O boletim não avalia os demais participantes nem o desfecho.\nSeleção: [Localize(ScriptContainer.MakeScope.Var('nfp20_reason').GetFlagName)]. Fato nº [ScriptContainer.GetVariableValue('nfp20_id')|0]."
 NFP_ARCHIVE:0 "Arquivo (até 12)"
 NFP_ARCHIVE_ITEM:0 "№ [ScriptContainer.GetVariableValue('nfp_number')|0]"
 NFP_COUNTRY:0 "Leitor: [GetPlayer.GetName]"
 NFP_COVER:0 "Capa"
 NFP_COVER_TEXT:0 "Retrato do país no momento da impressão\n\nPIB: [ScriptContainer.GetVariableValue('nfp_gdp')|0]\nPopulação: [ScriptContainer.GetVariableValue('nfp_population')|0]\nPadrão de vida médio: [ScriptContainer.GetVariableValue('nfp_sol')|2]\nAlfabetização (fração original): [ScriptContainer.GetVariableValue('nfp_literacy')|3]\n\nEscolha uma seção ou vire a página. As seções desta edição já estão definidas. Os valores não são recalculados durante a leitura."
 NFP_ECONOMY:0 "Economia"
 NFP_EVENTS:0 "Acontecimentos"
 NFP_ISSUE_HEADER:0 "Edição nº [ScriptContainer.GetVariableValue('nfp_number')|0] — [ScriptContainer.GetVariableValue('nfp_year')|0], mês [Add_CFixedPoint(ScriptContainer.GetVariableValue('nfp_month'), '(CFixedPoint)1')|0]"
 NFP_ISSUE_META:0 "Origem: [SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp_kind'), '(CFixedPoint)1'), 'NFP_KIND_REGULAR', SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp_kind'), '(CFixedPoint)3'), 'NFP_KIND_URGENT', 'NFP_KIND_OTHER'))] • marcador [ScriptContainer.GetVariableValue('nfp_marker')|0]"
 NFP_KIND_OTHER:0 "impressão manual"
 NFP_KIND_REGULAR:0 "entrega regular"
 NFP_KIND_URGENT:0 "edição extraordinária"
 NFP_LATEST:0 "Última edição"
 NFP_NEXT:0 "Próxima"
 NFP_PREVIOUS:0 "Anterior"
 NFP_READER:0 "Ler o jornal"
 NFP_SETTINGS:0 "Assinatura"
 NFP_SOCIETY:0 "Sociedade"
 NFP_WAR:0 "Guerra"
 je_nfp_subscription:0 "Assinatura do jornal"
 je_nfp_subscription_reason:0 "Use o botão do jornal para escolher se deseja receber edições mensais e extraordinárias. O arquivo guarda até doze edições."
 nfp_open_decision:0 "Abrir o jornal"
 nfp_open_decision_desc:0 "Leia a edição mais recente ou escolha uma edição anterior no arquivo."
