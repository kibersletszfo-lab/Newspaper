l_braz_por:
 NFP30_ACCESS_HOME_1_BODY:0 "Região: [SelectLocalization(And(ScriptContainer.MakeScope.Var('nfp20_problem_state').IsSet, ScriptContainer.MakeScope.Var('nfp20_problem_state').GetState.IsValid), 'NFP40_STATE_LINK', 'NFP40_REGION_FALLBACK')]. O acesso ao mercado ficou abaixo de 90% por dois meses seguidos. Último valor: [Multiply_CFixedPoint(ScriptContainer.GetVariableValue('nfp20_after'), '(CFixedPoint)100')|1]%.\n\nOs dados não estabelecem a causa. Convém examinar a infraestrutura local, as ligações marítimas e outras restrições. Seria cedo para pôr toda a culpa na ferrovia."
 NFP30_ACCESS_HOME_1_LEAD:0 "Um de nossos estados continua com acesso precário ao mercado. Entre as boas notícias da economia, vale abrir espaço para essa dificuldade."
 NFP30_ACCESS_HOME_1_TITLE:0 "Nosso mercado continua longe demais"
 NFP30_ACCESS_HOME_2_BODY:0 "Região: [SelectLocalization(And(ScriptContainer.MakeScope.Var('nfp20_problem_state').IsSet, ScriptContainer.MakeScope.Var('nfp20_problem_state').GetState.IsValid), 'NFP40_STATE_LINK', 'NFP40_REGION_FALLBACK')]. O acesso ao mercado ficou abaixo de 90% por dois meses seguidos. Último valor: [Multiply_CFixedPoint(ScriptContainer.GetVariableValue('nfp20_after'), '(CFixedPoint)100')|1]%.\n\nO índice aponta uma limitação, mas não explica a origem. Antes de escolher remédio, precisamos descobrir onde a ligação falhou."
 NFP30_ACCESS_HOME_2_LEAD:0 "Pelo segundo mês, o acesso precário ao mercado nos leva a examinar a ligação do estado com a economia nacional."
 NFP30_ACCESS_HOME_2_TITLE:0 "Um estado à espera de um caminho seguro para o mercado"
 NFP30_ACCESS_METRICS:0 "Região: [SelectLocalization(And(ScriptContainer.MakeScope.Var('nfp20_problem_state').IsSet, ScriptContainer.MakeScope.Var('nfp20_problem_state').GetState.IsValid), 'NFP40_STATE_LINK', 'NFP40_REGION_FALLBACK')]. O acesso ao mercado ficou abaixo de 90% por dois meses seguidos. Último valor: [Multiply_CFixedPoint(ScriptContainer.GetVariableValue('nfp20_after'), '(CFixedPoint)100')|1]%."
 NFP30_ACCESS_RECOVERY_HOME_1_BODY:0 "Região: [SelectLocalization(And(ScriptContainer.MakeScope.Var('nfp20_problem_state').IsSet, ScriptContainer.MakeScope.Var('nfp20_problem_state').GetState.IsValid), 'NFP40_STATE_LINK', 'NFP40_REGION_FALLBACK')]. No alerta anterior, o acesso ao mercado era de [Multiply_CFixedPoint(ScriptContainer.GetVariableValue('nfp20_before'), '(CFixedPoint)100')|1]%. Agora é de [Multiply_CFixedPoint(ScriptContainer.GetVariableValue('nfp20_after'), '(CFixedPoint)100')|1]%. O índice se manteve em pelo menos 90% por dois meses seguidos.\n\nDá gosto registrar uma melhora sustentada por dois meses. Ainda seria cedo para dar por resolvidas todas as dificuldades locais ou atribuir a mudança a uma causa sem confirmação."
 NFP30_ACCESS_RECOVERY_HOME_1_LEAD:0 "A história do estado com acesso precário ao mercado tomou um rumo favorável."
 NFP30_ACCESS_RECOVERY_HOME_1_TITLE:0 "O estado volta a se aproximar do mercado comum"
 NFP30_ACCESS_RECOVERY_HOME_2_BODY:0 "Região: [SelectLocalization(And(ScriptContainer.MakeScope.Var('nfp20_problem_state').IsSet, ScriptContainer.MakeScope.Var('nfp20_problem_state').GetState.IsValid), 'NFP40_STATE_LINK', 'NFP40_REGION_FALLBACK')]. No alerta anterior, o acesso ao mercado era de [Multiply_CFixedPoint(ScriptContainer.GetVariableValue('nfp20_before'), '(CFixedPoint)100')|1]%. Agora é de [Multiply_CFixedPoint(ScriptContainer.GetVariableValue('nfp20_after'), '(CFixedPoint)100')|1]%. O índice se manteve em pelo menos 90% por dois meses seguidos.\n\nDois meses seguidos justificam certa satisfação. As causas da melhora e a situação de cada empresa merecem exame próprio."
 NFP30_ACCESS_RECOVERY_HOME_2_LEAD:0 "Temos boa notícia sobre uma preocupação destas páginas: melhorou o acesso do estado ao mercado."
 NFP30_ACCESS_RECOVERY_HOME_2_TITLE:0 "O mercado volta a ficar ao alcance"
 NFP30_ACCESS_RECOVERY_METRICS:0 "Região: [SelectLocalization(And(ScriptContainer.MakeScope.Var('nfp20_problem_state').IsSet, ScriptContainer.MakeScope.Var('nfp20_problem_state').GetState.IsValid), 'NFP40_STATE_LINK', 'NFP40_REGION_FALLBACK')]. No alerta anterior, o acesso ao mercado era de [Multiply_CFixedPoint(ScriptContainer.GetVariableValue('nfp20_before'), '(CFixedPoint)100')|1]%. Agora é de [Multiply_CFixedPoint(ScriptContainer.GetVariableValue('nfp20_after'), '(CFixedPoint)100')|1]%. O índice se manteve em pelo menos 90% por dois meses seguidos."
 NFP30_ARTICLE_DETAILS:0 "[SelectLocalization(ScriptContainer.HasVariable('nfp63_schema'), 'NFP63_DETAILS', 'NFP50_EMPTY')]\nInformações da redação\nFato nº [ScriptContainer.GetVariableValue('nfp20_id')|0], episódio [ScriptContainer.GetVariableValue('nfp20_episode')|0].\nSeleção: [Localize(ScriptContainer.MakeScope.Var('nfp20_reason').GetFlagName)]. Prioridade: [ScriptContainer.GetVariableValue('nfp20_priority')|0].\n[Localize(ScriptContainer.MakeScope.Var('nfp30_metrics').GetFlagName)]\nApresentação: [SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp30_domestic'), '(CFixedPoint)1'), 'NFP30_HOME', 'NFP30_AWAY')], variante [ScriptContainer.GetVariableValue('nfp30_variant')|0].\nOs nomes dos países usam definições permanentes. O nome histórico variável não foi registrado.\n[SelectLocalization(ScriptContainer.HasVariable('nfp63_schema'), 'NFP50_EMPTY', SelectLocalization(ScriptContainer.HasVariable('nfp31_reach'), 'NFP30_REACH_LINE', 'NFP30_REACH_OLD'))]"
 NFP30_ARTICLE_META:0 "[ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName] · [Localize(ScriptContainer.MakeScope.Var('nfp30_month').GetFlagName)] de [ScriptContainer.GetVariableValue('nfp20_year')|0] · [Localize(ScriptContainer.MakeScope.Var('nfp30_rubric').GetFlagName)]"
 NFP30_ARTICLE_TEXT:0 "[Localize(ScriptContainer.MakeScope.Var('nfp30_lead').GetFlagName)]\n\n[Localize(ScriptContainer.MakeScope.Var('nfp30_body').GetFlagName)]"
 NFP30_AWAY:0 "acontecimento no exterior"
 NFP30_CONTENTS:0 "Nesta edição"
 NFP30_COVER:0 "Voltar à capa"
 NFP30_DETAILS:0 "Detalhes"
 NFP30_DETAILS_CLOSE:0 "Ocultar detalhes"
 NFP30_DIVERGENCE_HOME_1_BODY:0 "Em três intervalos mensais, o PIB anual projetado passou de [ScriptContainer.GetVariableValue('nfp20_before')|0] para [ScriptContainer.GetVariableValue('nfp20_after')|0]. No mesmo período, o padrão de vida médio caiu [ScriptContainer.GetVariableValue('nfp20_extra')|2] pontos.\n\nUma economia maior ainda não garante conforto em casa. A situação em que vive a população é assunto de interesse nacional, e a razão dessa divergência merece investigação."
 NFP30_DIVERGENCE_HOME_1_LEAD:0 "O crescimento da economia é motivo de orgulho, mas a queda no padrão de vida merece atenção igualmente cuidadosa."
 NFP30_DIVERGENCE_HOME_1_TITLE:0 "A economia cresce. A vida aperta"
 NFP30_DIVERGENCE_HOME_2_BODY:0 "Em três intervalos mensais, o PIB anual projetado passou de [ScriptContainer.GetVariableValue('nfp20_before')|0] para [ScriptContainer.GetVariableValue('nfp20_after')|0]. No mesmo período, o padrão de vida médio caiu [ScriptContainer.GetVariableValue('nfp20_extra')|2] pontos.\n\nO país precisa de conquistas que se sintam também no cotidiano. Essas cifras, sozinhas, não explicam a piora nem apontam um responsável."
 NFP30_DIVERGENCE_HOME_2_LEAD:0 "A economia cresceu enquanto o padrão de vida médio caiu. As duas faces desse quadro merecem a primeira página."
 NFP30_DIVERGENCE_HOME_2_TITLE:0 "Números inquietantes por trás do sucesso econômico"
 NFP30_DIVERGENCE_METRICS:0 "Em três intervalos mensais, o PIB anual projetado passou de [ScriptContainer.GetVariableValue('nfp20_before')|0] para [ScriptContainer.GetVariableValue('nfp20_after')|0]. No mesmo período, o padrão de vida médio caiu [ScriptContainer.GetVariableValue('nfp20_extra')|2] pontos."
 NFP30_EMPTY:0 "Hoje não há novas matérias nas seções escolhidas. As próximas notícias chegarão em uma edição futura."
 NFP30_GDP_LEADER_AWAY_1_BODY:0 "Última posição fora dos dez primeiros: [ScriptContainer.GetVariableValue('nfp20_before')|0]. Posição atual: [ScriptContainer.GetVariableValue('nfp20_after')|0]. O país aparece entre os dez primeiros por dois meses seguidos.\n\nÉ uma mudança da economia mundial que interessa ao leitor. Não prova conforto nas casas nem lucratividade em cada setor."
 NFP30_GDP_LEADER_AWAY_1_LEAD:0 "Há mudança entre as maiores economias: um país estrangeiro se firmou entre os dez maiores PIBs do mundo."
 NFP30_GDP_LEADER_AWAY_1_TITLE:0 "Um novo nome entre as dez maiores economias do mundo"
 NFP30_GDP_LEADER_AWAY_2_BODY:0 "Última posição fora dos dez primeiros: [ScriptContainer.GetVariableValue('nfp20_before')|0]. Posição atual: [ScriptContainer.GetVariableValue('nfp20_after')|0]. O país aparece entre os dez primeiros por dois meses seguidos.\n\nA classificação mede a projeção do PIB anual. Só por ela não se pode dizer o que muda no comércio com nosso país."
 NFP30_GDP_LEADER_AWAY_2_LEAD:0 "Um novo integrante do grupo das dez maiores economias manteve a posição pelo segundo mês seguido."
 NFP30_GDP_LEADER_AWAY_2_TITLE:0 "País estrangeiro se firma entre as maiores economias"
 NFP30_GDP_LEADER_HOME_1_BODY:0 "Última posição fora dos dez primeiros: [ScriptContainer.GetVariableValue('nfp20_before')|0]. Posição atual: [ScriptContainer.GetVariableValue('nfp20_after')|0]. O país aparece entre os dez primeiros por dois meses seguidos.\n\nO êxito merece reconhecimento. Mas o tamanho da economia não mede o padrão de vida nem os lucros das empresas."
 NFP30_GDP_LEADER_HOME_1_LEAD:0 "Nosso país se firmou entre as dez maiores economias pelo PIB anual projetado."
 NFP30_GDP_LEADER_HOME_1_TITLE:0 "Nossa economia entra entre as dez maiores do mundo"
 NFP30_GDP_LEADER_HOME_2_BODY:0 "Última posição fora dos dez primeiros: [ScriptContainer.GetVariableValue('nfp20_before')|0]. Posição atual: [ScriptContainer.GetVariableValue('nfp20_after')|0]. O país aparece entre os dez primeiros por dois meses seguidos.\n\nComemoramos o resultado sem tirar os olhos do bem-estar da população. Medir o tamanho da economia não substitui esse cuidado."
 NFP30_GDP_LEADER_HOME_2_LEAD:0 "Dois meses entre os dez maiores PIBs já permitem falar de uma conquista econômica sustentada."
 NFP30_GDP_LEADER_HOME_2_TITLE:0 "Nosso país conquista um lugar entre os maiores"
 NFP30_GDP_LEADER_METRICS:0 "Última posição fora dos dez primeiros: [ScriptContainer.GetVariableValue('nfp20_before')|0]. Posição atual: [ScriptContainer.GetVariableValue('nfp20_after')|0]. O país aparece entre os dez primeiros por dois meses seguidos."
 NFP30_HOME:0 "acontecimento nacional"
 NFP30_INFRA_HOME_1_BODY:0 "Região: [SelectLocalization(And(ScriptContainer.MakeScope.Var('nfp20_problem_state').IsSet, ScriptContainer.MakeScope.Var('nfp20_problem_state').GetState.IsValid), 'NFP40_STATE_LINK', 'NFP40_REGION_FALLBACK')]. O saldo de infraestrutura ficou negativo por dois meses seguidos. Último valor: [ScriptContainer.GetVariableValue('nfp20_after')|2].\n\nA infraestrutura insuficiente pede um olhar atento às necessidades locais. Não cabe atribuir a ela toda dificuldade do estado nem receitar uma única construção como cura."
 NFP30_INFRA_HOME_1_LEAD:0 "Em um de nossos estados, a infraestrutura insuficiente tornou-se uma dificuldade persistente. Está cada vez mais difícil adiar a questão."
 NFP30_INFRA_HOME_1_TITLE:0 "O estado precisa de uma ligação à altura do país"
 NFP30_INFRA_HOME_2_BODY:0 "Região: [SelectLocalization(And(ScriptContainer.MakeScope.Var('nfp20_problem_state').IsSet, ScriptContainer.MakeScope.Var('nfp20_problem_state').GetState.IsValid), 'NFP40_STATE_LINK', 'NFP40_REGION_FALLBACK')]. O saldo de infraestrutura ficou negativo por dois meses seguidos. Último valor: [ScriptContainer.GetVariableValue('nfp20_after')|2].\n\nA falta se repete. Para escolher o que fazer, é preciso estudar o próprio estado: um número só não basta para prescrever uma obra."
 NFP30_INFRA_HOME_2_LEAD:0 "Em um de nossos estados, as necessidades de infraestrutura voltaram a superar a capacidade disponível."
 NFP30_INFRA_HOME_2_TITLE:0 "A infraestrutura já não pode esperar"
 NFP30_INFRA_METRICS:0 "Região: [SelectLocalization(And(ScriptContainer.MakeScope.Var('nfp20_problem_state').IsSet, ScriptContainer.MakeScope.Var('nfp20_problem_state').GetState.IsValid), 'NFP40_STATE_LINK', 'NFP40_REGION_FALLBACK')]. O saldo de infraestrutura ficou negativo por dois meses seguidos. Último valor: [ScriptContainer.GetVariableValue('nfp20_after')|2]."
 NFP30_INFRA_RECOVERY_HOME_1_BODY:0 "Região: [SelectLocalization(And(ScriptContainer.MakeScope.Var('nfp20_problem_state').IsSet, ScriptContainer.MakeScope.Var('nfp20_problem_state').GetState.IsValid), 'NFP40_STATE_LINK', 'NFP40_REGION_FALLBACK')]. No alerta anterior, o saldo de infraestrutura era [ScriptContainer.GetVariableValue('nfp20_before')|2]. Agora é [ScriptContainer.GetVariableValue('nfp20_after')|2]. As duas últimas observações mensais registraram saldo igual ou superior a zero.\n\nA conquista merece lugar no jornal. Dois boletins favoráveis, é claro, não prometem que a dificuldade nunca mais voltará."
 NFP30_INFRA_RECOVERY_HOME_1_LEAD:0 "Voltamos ao problema da infraestrutura de que já tratamos. Os últimos dados trazem uma melhora."
 NFP30_INFRA_RECOVERY_HOME_1_TITLE:0 "Boas notícias de um estado antes sobrecarregado"
 NFP30_INFRA_RECOVERY_HOME_2_BODY:0 "Região: [SelectLocalization(And(ScriptContainer.MakeScope.Var('nfp20_problem_state').IsSet, ScriptContainer.MakeScope.Var('nfp20_problem_state').GetState.IsValid), 'NFP40_STATE_LINK', 'NFP40_REGION_FALLBACK')]. No alerta anterior, o saldo de infraestrutura era [ScriptContainer.GetVariableValue('nfp20_before')|2]. Agora é [ScriptContainer.GetVariableValue('nfp20_after')|2]. As duas últimas observações mensais registraram saldo igual ou superior a zero.\n\nDuas observações seguidas confirmam a melhora. Os dados disponíveis ainda não revelam quais medidas a produziram."
 NFP30_INFRA_RECOVERY_HOME_2_LEAD:0 "O saldo de infraestrutura se recuperou. Registramos a mudança numa história que o leitor já vinha acompanhando."
 NFP30_INFRA_RECOVERY_HOME_2_TITLE:0 "Um alerta antigo dá lugar a boas notícias"
 NFP30_INFRA_RECOVERY_METRICS:0 "Região: [SelectLocalization(And(ScriptContainer.MakeScope.Var('nfp20_problem_state').IsSet, ScriptContainer.MakeScope.Var('nfp20_problem_state').GetState.IsValid), 'NFP40_STATE_LINK', 'NFP40_REGION_FALLBACK')]. No alerta anterior, o saldo de infraestrutura era [ScriptContainer.GetVariableValue('nfp20_before')|2]. Agora é [ScriptContainer.GetVariableValue('nfp20_after')|2]. As duas últimas observações mensais registraram saldo igual ou superior a zero."
 NFP30_ISSUE_DETAILS:0 "Dados da edição\nMatérias: [ScriptContainer.GetVariableValue('nfp20_article_count')|0].\nHistórico: [ScriptContainer.GetVariableValue('nfp20_history_count')|0] observações, [ScriptContainer.GetVariableValue('nfp20_summary_intervals')|0] intervalos de comparação.\nPIB anual projetado: [ScriptContainer.GetVariableValue('nfp20_summary_before')|0] → [ScriptContainer.GetVariableValue('nfp20_summary_after')|0].\n\n$NFP20_DIAGNOSTICS$\n[SelectLocalization(ScriptContainer.HasVariable('nfp31_rejected_region'), 'NFP30_REACH_REJECTED', 'NFP30_REACH_OLD')]"
 NFP30_ISSUE_HEADER:0 "[ScriptContainer.MakeScope.Var('nfp30_reader_definition').GetCountryDefinition.GetName] · Nº [ScriptContainer.GetVariableValue('nfp_number')|0] · [Localize(ScriptContainer.MakeScope.Var('nfp30_month').GetFlagName)] de [ScriptContainer.GetVariableValue('nfp_year')|0]"
 NFP30_LAW_AWAY_1_BODY:0 "Entrou em vigor a lei «[Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]».\n\nNossos leitores podem acompanhar as mudanças na vida de outros povos. Sabemos por enquanto que a regra entrou em vigor. Seus efeitos ainda estão por avaliar."
 NFP30_LAW_AWAY_1_LEAD:0 "Entrou em vigor uma reforma importante no exterior."
 NFP30_LAW_AWAY_1_TITLE:0 "Nova página na legislação de um país estrangeiro"
 NFP30_LAW_AWAY_2_BODY:0 "Entrou em vigor a lei «[Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]».\n\nO registro não comprova que a reforma tenha sido aprovada por votação parlamentar nem promete um resultado específico. Seus efeitos merecem apuração própria."
 NFP30_LAW_AWAY_2_LEAD:0 "Chega do exterior a notícia da entrada em vigor de uma nova lei."
 NFP30_LAW_AWAY_2_TITLE:0 "País estrangeiro põe em vigor lei importante"
 NFP30_LAW_HOME_1_BODY:0 "Entrou em vigor a lei «[Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]».\n\nNoticiamos a mudança em si. O anúncio ainda não esclarece como se chegou à aprovação nem o que ela mudará na vida das pessoas."
 NFP30_LAW_HOME_1_LEAD:0 "Entrou em vigor uma lei importante em nosso país."
 NFP30_LAW_HOME_1_TITLE:0 "Uma nova lei abre um capítulo em nossa vida"
 NFP30_LAW_HOME_2_BODY:0 "Entrou em vigor a lei «[Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]».\n\nPara avaliar a reforma serão necessários tempo e informações sobre os efeitos. A norma entrou em vigor. Seus resultados prometidos ainda precisam aparecer."
 NFP30_LAW_HOME_2_LEAD:0 "As leis do país mudaram. A nova regra merece a atenção do leitor."
 NFP30_LAW_HOME_2_TITLE:0 "Entra em vigor uma reforma importante no país"
 NFP30_LAW_METRICS:0 "Entrou em vigor a seguinte lei: [Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]."
 NFP30_LEAD_STORY:0 "Matéria principal"
 NFP30_LITERACY_AWAY_1_BODY:0 "A parcela alfabetizada passou de [Multiply_CFixedPoint(ScriptContainer.GetVariableValue('nfp20_before'), '(CFixedPoint)100')|1]% para [Multiply_CFixedPoint(ScriptContainer.GetVariableValue('nfp20_after'), '(CFixedPoint)100')|1]%, ultrapassando o limiar de [Multiply_CFixedPoint(ScriptContainer.GetVariableValue('nfp20_extra'), '(CFixedPoint)100')|1]%.\n\nO êxito no exterior merece atenção. Atingir o marco não explica como funcionam as escolas nem comprova a superioridade de todo o sistema de ensino."
 NFP30_LITERACY_AWAY_1_LEAD:0 "Chega de outro país uma notícia digna de registro sobre o avanço da alfabetização."
 NFP30_LITERACY_AWAY_1_TITLE:0 "Uma conquista do ensino no exterior"
 NFP30_LITERACY_AWAY_2_BODY:0 "A parcela alfabetizada passou de [Multiply_CFixedPoint(ScriptContainer.GetVariableValue('nfp20_before'), '(CFixedPoint)100')|1]% para [Multiply_CFixedPoint(ScriptContainer.GetVariableValue('nfp20_after'), '(CFixedPoint)100')|1]%, ultrapassando o limiar de [Multiply_CFixedPoint(ScriptContainer.GetVariableValue('nfp20_extra'), '(CFixedPoint)100')|1]%.\n\nOs novos dados confirmam o avanço. Suas causas e o que poderíamos aproveitar dessa experiência em casa pedem exame mais atento."
 NFP30_LITERACY_AWAY_2_LEAD:0 "A notícia da alfabetização no exterior acrescenta uma página à história do ensino que acompanhamos neste jornal."
 NFP30_LITERACY_AWAY_2_TITLE:0 "Há mais gente lendo pelo mundo"
 NFP30_LITERACY_HOME_1_BODY:0 "A parcela alfabetizada passou de [Multiply_CFixedPoint(ScriptContainer.GetVariableValue('nfp20_before'), '(CFixedPoint)100')|1]% para [Multiply_CFixedPoint(ScriptContainer.GetVariableValue('nfp20_after'), '(CFixedPoint)100')|1]%, ultrapassando o limiar de [Multiply_CFixedPoint(ScriptContainer.GetVariableValue('nfp20_extra'), '(CFixedPoint)100')|1]%.\n\nA comparação com os dados anteriores confirma a mudança. Um único marco não basta para avaliar a qualidade das escolas ou a igualdade de acesso ao ensino."
 NFP30_LITERACY_HOME_1_LEAD:0 "Alcançamos um novo marco na alfabetização. O país tem do que se orgulhar."
 NFP30_LITERACY_HOME_1_TITLE:0 "O país dá um passo no caminho da educação"
 NFP30_LITERACY_HOME_2_BODY:0 "A parcela alfabetizada passou de [Multiply_CFixedPoint(ScriptContainer.GetVariableValue('nfp20_before'), '(CFixedPoint)100')|1]% para [Multiply_CFixedPoint(ScriptContainer.GetVariableValue('nfp20_after'), '(CFixedPoint)100')|1]%, ultrapassando o limiar de [Multiply_CFixedPoint(ScriptContainer.GetVariableValue('nfp20_extra'), '(CFixedPoint)100')|1]%.\n\nA parcela das pessoas que sabem ler e escrever ultrapassou um limiar importante. Para avaliar as condições em cada região e classe social, serão precisos mais detalhes."
 NFP30_LITERACY_HOME_2_LEAD:0 "Os novos dados da alfabetização dão a esta gazeta motivo para se alegrar com a conquista do país."
 NFP30_LITERACY_HOME_2_TITLE:0 "A educação chega a mais gente"
 NFP30_LITERACY_METRICS:0 "A parcela alfabetizada passou de [Multiply_CFixedPoint(ScriptContainer.GetVariableValue('nfp20_before'), '(CFixedPoint)100')|1]% para [Multiply_CFixedPoint(ScriptContainer.GetVariableValue('nfp20_after'), '(CFixedPoint)100')|1]%, ultrapassando o limiar de [Multiply_CFixedPoint(ScriptContainer.GetVariableValue('nfp20_extra'), '(CFixedPoint)100')|1]%."
