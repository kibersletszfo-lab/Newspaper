 NFP52_SUEZ_1_LEAD:0 "O Canal de Suez está pronto. Em geral, são os viajantes que adaptam a rota ao mapa. Desta vez foi o mapa que teve de ceder ao projeto humano: abriu-se uma passagem entre o Mediterrâneo e o mar Vermelho. Para quem vive do mar, a notícia dificilmente caberá numa nota de rodapé."
 NFP52_SUEZ_1_TITLE:0 "Abre-se a passagem de Suez"
 NFP52_SUEZ_2_BODY:0 "O Canal de Suez está pronto. Em geral, são os viajantes que adaptam a rota ao mapa. Desta vez foi o mapa que teve de ceder ao projeto humano: abriu-se uma passagem entre o Mediterrâneo e o mar Vermelho. Para quem vive do mar, a notícia dificilmente caberá numa nota de rodapé.\n\nA construção do canal chegou ao fim. Uma nova rota liga os dois mares e muda a maneira de calcular os antigos caminhos. Onde a geografia exigia uma volta, há agora uma passagem. Eis um caso em que a conversa sobre encurtar distâncias veio acompanhada da obra correspondente.\n\nComeça agora o trabalho de aproveitar a oportunidade. O comércio e a política mostrarão quem poderá tirar melhor partido dela. O resultado já merece atenção. É bom quando de tanto planejar sai alguma coisa além de outro plano.\n\nA matéria traz o mês em que a redação recebeu a confirmação. O dia exato do acontecimento ainda precisa ser apurado."
 NFP52_SUEZ_2_CONTEXT:0 "Começa agora o trabalho de aproveitar a oportunidade. O comércio e a política mostrarão quem poderá tirar melhor partido dela. O resultado já merece atenção. É bom quando de tanto planejar sai alguma coisa além de outro plano."
