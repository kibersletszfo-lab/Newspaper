 NFP50_LAW_GOV_OPPOSE:0 "Entre os grupos do governo com preferência expressa, os opositores têm maior peso. A lei foi aprovada, mas nem todo exemplar veio acompanhado de estima por ela."
 NFP50_LAW_GOV_RELATIVE_1:0 "Antes mesmo de a lei entrar em vigor, já havia preferências no governo. [Localize(ScriptContainer.MakeScope.Var('nfp50_law_gov_summary').GetFlagName)][SelectLocalization(GreaterThan_CFixedPoint(ScriptContainer.GetVariableValue('nfp50_law_gov_yes_present'), '(CFixedPoint)0'), 'NFP50_LAW_GOV_YES_NAME', 'NFP50_LAW_NO_MOVE')][SelectLocalization(GreaterThan_CFixedPoint(ScriptContainer.GetVariableValue('nfp50_law_gov_no_present'), '(CFixedPoint)0'), 'NFP50_LAW_GOV_NO_NAME', 'NFP50_LAW_NO_MOVE')]"
