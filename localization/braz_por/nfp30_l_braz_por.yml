 NFP52_YUG_2_TITLE:0 "Os eslavos do sul se unem"
 NFP54_DIV_END:0 "E o que tiramos disso? O crescimento da economia merece comemoração. Mas quanto maiores os números, mais fácil perder de vista as pessoas para quem esse crescimento deveria fazer diferença. Ainda é preciso descobrir por que os indicadores seguiram caminhos opostos. Motivo para investigar já temos.\n\nUm bom relatório tem sua utilidade. Sobretudo quando, depois dele, a vida melhora."
 NFP54_DIV_EXPECTED:0 "Acrescente-se que o padrão de vida esperado é [ScriptContainer.GetVariableValue('nfp50_family_expected_sol')|2]. Ao que parece, o governo não esperava por essa. Por mais que admiremos os ganhos da economia, a distância não vai se fechar por conta própria."
 NFP54_DIV_FACT:0 "Em três meses, a projeção de PIB anual passou de [ScriptContainer.GetVariableValue('nfp20_before')|0] para [ScriptContainer.GetVariableValue('nfp20_after')|0]. Um ganho de [ScriptContainer.GetVariableValue('nfp50_family_gdp_growth')|2]%. No mesmo período, o padrão de vida médio caiu [ScriptContainer.GetVariableValue('nfp20_extra')|2] pontos. Duas notícias em linhas vizinhas. A primeira dá vontade de felicitar o país. A segunda esfria um pouco o entusiasmo."
 NFP54_DIV_INTRO:0 "As últimas contas mostram que temos do que nos orgulhar: o PIB cresceu. Uma ótima notícia, diria o leitor. Podemos trocar cumprimentos, admirar os números, cantarolar o hino e virar a página com a sensação do dever cumprido. Mas, antes disso, vale ler mais uma linha. Aquela que diz «padrão de vida»..."
 NFP54_DIV_LIVING:0 "O padrão de vida médio era [ScriptContainer.GetVariableValue('nfp50_family_sol_before')|2] e agora é [ScriptContainer.GetVariableValue('nfp50_family_sol')|2]. É claro que a média dificilmente retrata um jantar de verdade. O capitalista come a carne, o lavrador fica com o feijão e, na média, serviram feijoada. Ainda assim, a queda da média merece atenção. A economia avança e o bem-estar perde terreno. Não é bem o detalhe que se espera encontrar num relatório de comemoração, é?"
 NFP54_DIV_TITLE:0 "Sucesso nas contas. E o que se põe à mesa?"
 NFP55_INF_CONNECTED:0 "Por enquanto, nada de pânico. O acesso ao mercado comum está em [Multiply_CFixedPoint(ScriptContainer.GetVariableValue('nfp50_family_access'), '(CFixedPoint)100')|1]%. Dizer que o estado ficou isolado do país seria um belo exagero. A sobrecarga, por si só, não significa que amanhã o pão e as calças vão sumir das lojas. A notícia é desagradável, mas ainda há boa distância até a catástrofe."
 NFP55_INF_DISCONNECTED:0 "Há mais um motivo de preocupação: o acesso ao mercado comum está em [Multiply_CFixedPoint(ScriptContainer.GetVariableValue('nfp50_family_access'), '(CFixedPoint)100')|1]%. A ligação do estado com o país anda longe de ser completa. Se as prateleiras ficarão vazias, ainda não sabemos. Melhor descobrir o que acontece antes que os moradores comecem a perguntar o que acabará primeiro, a mercadoria ou a paciência."
 NFP55_INF_END:0 "E o que tiramos disso? Vale cuidar do estado agora, antes que a dificuldade ganhe coluna cativa em nosso jornal. Enquanto o governo decide entre construir uma ferrovia, ampliar o porto ou tentar outra providência, acompanharemos a história.\n\nMedir duas vezes antes de cortar é bom conselho. Só falta alguém disposto a #strikethrough cortar#! agir quando acabarem as medições."
 NFP55_INF_FACT:0 "O estado em questão é [SelectLocalization(And(ScriptContainer.MakeScope.Var('nfp20_problem_state').IsSet, ScriptContainer.MakeScope.Var('nfp20_problem_state').GetState.IsValid), 'NFP40_STATE_LINK', 'NFP40_REGION_FALLBACK')]. Há dois meses seguidos chegam notícias pouco animadoras: a infraestrutura está sobrecarregada. No primeiro boletim, ainda havia esperança no próximo. O próximo chegou. A esperança ficou. E o problema também."
 NFP55_INF_INTRO:0 "Uma economia precisa de bastante coisa para prosperar. Impostos mais leves, mercadorias ao alcance do bolso e aquilo de que se precisa chegando ao lugar certo na hora certa. Só que, para isso, é preciso haver folga na infraestrutura. E ela, ao contrário dos nossos desejos, tem limite. Em um dos nossos estados, a necessidade já passou dele."
 NFP55_INF_TITLE:0 "A economia cresceu e a infraestrutura ficou apertada"
 NFP56_ACC_END:0 "E o que tiramos disso? Da capital, vê-se bem o país no mapa. Do estado, talvez se veja melhor naquilo que se consegue comprar e vender. Por ora há uma diferença incômoda entre essas duas vistas.\n\nVeremos se a distância diminui. Seria bom que o mercado comum ficasse mais perto que a próxima explicação de por que ele está tão longe."
 NFP56_ACC_FACT:0 "O estado é [SelectLocalization(And(ScriptContainer.MakeScope.Var('nfp20_problem_state').IsSet, ScriptContainer.MakeScope.Var('nfp20_problem_state').GetState.IsValid), 'NFP40_STATE_LINK', 'NFP40_REGION_FALLBACK')]. Dois boletins mensais seguidos registram dificuldades de acesso ao mercado nacional. No mapa, ele continua fazendo parte do país. Participar plenamente da economia comum já é outra história. A palavra «nacional» até aquece o coração. Só não dá para colocá-la na cesta."
 NFP56_ACC_FREE:0 "O curioso é que a infraestrutura do estado ainda aguenta a carga. Portanto, o conhecido «vamos construir mais alguma coisa» não basta como resposta. Há capacidade livre e falta ligação com o mercado. Convém descobrir onde emperrou o caminho antes de mandar dinheiro e trabalhadores para lá."
 NFP56_ACC_INTRO:0 "É bom poder simplesmente comprar aquilo de que se precisa. Sem calcular distâncias nem estudar desvios: basta ir e comprar. Mas entre «tem no país» e «vende-se aqui» às vezes cabe uma história inteira. Em um dos nossos estados, essa história ainda procura um final feliz."
 NFP56_ACC_OVERLOAD:0 "A explicação talvez seja corriqueira. A infraestrutura do estado está sobrecarregada. Temos uma combinação pouco agradável: a ligação com o mercado é incompleta e a capacidade local não basta. Será que a segunda coisa explica toda a primeira? Ainda é uma pergunta. Motivos para olhar o estado com atenção já temos mais de um."
 NFP56_ACC_SEVERE:0 "Já é difícil falar em «pequenos transtornos». O acesso ao mercado não chega à metade do nível pleno. Ainda não sabemos o que há hoje nas prateleiras. Mas torna-se cada vez mais urgente saber até que ponto o estado pode contar com a economia do país."
 NFP56_ACC_TITLE:0 "Nosso estado, mas será que nosso mercado?"
 NFP57_SUP_BOTH:0 "A mercadoria faz falta tanto ao exército quanto às repartições públicas. Entre os compradores, portanto, há gente com assuntos importantes e dinheiro do Tesouro. Só que a importância do serviço não garante que apareça tudo de que ele precisa. Seria bom acertar o abastecimento enquanto ainda podemos discutir a falta, em vez de improvisar uma saída na pior hora possível."
 NFP57_SUP_CHRONIC:0 "A escassez ameaça virar costume. Talvez seja esse o seu lado mais desagradável: até ouvir «não tem» pode virar rotina. Só que, um dia, o «não» pode deixar de vir dos vendedores para os fregueses e começar a vir da população para o governo. Aí, além de descobrir onde conseguir a mercadoria, será preciso responder a outra pergunta: onde foi parar a confiança?"
 NFP57_SUP_CRITICAL:0 "Desta vez, a escassez em nosso país já é séria demais para ser tratada como um contratempo qualquer do comércio. Podemos nos consolar pensando que, em algum lugar, deve haver mais um pouco. Talvez haja mesmo. A questão é se vai chegar para todos os que precisam."
 NFP57_SUP_DETAILS:0 "$NFP46_METRICS$\nProdução no mercado — [ScriptContainer.GetVariableValue('nfp50_supply_production')|1], consumo — [ScriptContainer.GetVariableValue('nfp50_supply_consumption')|1]; importações — [ScriptContainer.GetVariableValue('nfp50_supply_imports')|1], exportações — [ScriptContainer.GetVariableValue('nfp50_supply_exports')|1]. As importações representam [ScriptContainer.GetVariableValue('nfp50_supply_import_fraction')|1]% da soma da produção com as importações. Este indicador mede o abastecimento do mercado, não a parcela das compras dos habitantes do nosso país; os volumes comerciais, por si só, não determinam a causa da escassez.\nPreço na data do acontecimento — £[ScriptContainer.GetVariableValue('nfp50_supply_price')|1]; diferença em relação ao preço-base — [ScriptContainer.GetVariableValue('nfp50_supply_premium')|1]% (um valor negativo indica preço menor). O preço não mede a disponibilidade da mercadoria para cada comprador.\nObservações mensais consecutivas com o problema: [ScriptContainer.GetVariableValue('nfp50_supply_observations')|0]. Indicador direto de escassez na data do acontecimento: [ScriptContainer.GetVariableValue('nfp46_native_after')|0]; escassez local grave: [ScriptContainer.GetVariableValue('nfp50_supply_critical')|0]."
 NFP57_SUP_END:0 "O que fica desta história? A falta pode ter muitas causas, mas a pergunta de quem compra costuma ser uma só: «Será que vou conseguir o que preciso?»\n\nVoltaremos ao assunto quando houver novidades. De preferência, novidades que nos façam procurar não a mercadoria, mas o lugar onde ela sai mais em conta.\n\nAfinal, discutir o preço é bem melhor quando há o que comprar."
 NFP57_SUP_FACT:0 "Desta vez, o assunto é [ScriptContainer.MakeScope.Var('nfp46_good').GetGoods.GetNameNoIcon]. Há escassez no mercado, e não é a primeira vez que as dificuldades de abastecimento aparecem nos informes mensais. Isso não quer dizer que a mercadoria tenha sumido de toda parte. Mas há compradores suficientes para que a pergunta «onde encontrar?» mereça espaço no jornal. A procura, pelo visto, fez a sua parte. Agora gostaríamos de ver a oferta aparecer."
 NFP57_SUP_GOVERNMENT:0 "As repartições públicas também precisam desta mercadoria. O problema pode estar mais perto dos assuntos cotidianos do país do que sugere uma simples linha no informe comercial. Importância de Estado é uma expressão de respeito. Pena que, sozinha, não produza o que está faltando."
 NFP57_SUP_INTRO:0 "É bom quando uma compra começa pela escolha. O que é melhor, o que custa menos, o que cabe no bolso hoje e o que pode esperar. Pior é escolher entre «não tem» e «procure em outro lugar». Sobretudo quando precisamos da mercadoria, e não de um pretexto para passear ou discutir."
 NFP57_SUP_LONG:0 "Os informes chegam mês após mês, e o abastecimento continua deixando dúvidas. No começo, ainda esperávamos que tudo se resolvesse depressa. Agora essa esperança já tem tempo de serviço. Seria bom que os resultados do governo também tivessem alguma coisa para apresentar. Por enquanto, o tempo passa, a esperança resiste e o problema não sai do lugar."
 NFP57_SUP_MILITARY:0 "Esta mercadoria também tem uso militar. Portanto, o assunto vai além do comércio: o abastecimento do exército merece atenção. De preferência antes, enquanto ainda podemos discutir o problema no jornal, em vez de resolvê-lo às pressas quando chegar a hora de afiar as baionetas. Seria muito bom que, até lá, o necessário já estivesse à mão."
 NFP57_SUP_NO_IMPORT:0 "Não havia registro de fornecimento externo na data do informe. Seria possível cobrir a falta com compras no exterior? A ideia vem quase sozinha. Mas entre «seria bom comprar» e «finalmente chegou» costuma haver algo mais complicado do que uma sugestão de jornal. Ainda assim, seria interessante descobrir o que está no caminho."
 NFP57_SUP_TITLE:0 "Procura não falta. E a mercadoria?"
 NFP57_SUP_TRADE:0 "Há fornecimento externo, mas ele ainda não resolveu a escassez. Dizer «vamos importar», portanto, é mais fácil do que acertar o abastecimento. Uma rota comercial no mapa convence bastante. Seria bom que também houvesse algo para receber na outra ponta. Quanto ajudariam novas compras, e de onde poderiam vir, são perguntas ainda em aberto."
 NFP58_GAP_BOTH:0 "A mercadoria serve ao exército e às repartições públicas. Há, portanto, interesses do Estado por trás dessa questão de comércio. Tomara que sua importância ajude a acertar as entregas a tempo. Importância, sozinha, ainda não produz mercadoria."
 NFP58_GAP_CHRONIC:0 "A história se alonga. Seria de esperar que tanta procura fosse um convite para quem quer produzir e vender. Mas o convite continua sobre a mesa e a oferta não acompanha. Falta capacidade, há entraves no comércio ou o motivo é outro? A disposição para comprar, pelo visto, não basta para fazer um milagre econômico."
 NFP58_GAP_CRITICAL:0 "O país já registra uma falta grave dessa mercadoria em âmbito local. Por trás do quadro geral do comércio está uma pergunta mais urgente: é fácil encontrar aqui o que se precisa? Para quem precisa do produto hoje, conversar sobre as perspectivas do mercado talvez sirva apenas para passar o tempo."
 NFP58_GAP_END:0 "E o que tiramos disso? Muita procura pode ser boa notícia. Há para quem produzir, a quem vender e motivos para ampliar os negócios. Resta transformar a ocasião em resultado, de preferência antes que esperar vire a parte mais demorada da compra.\n\nComprador já temos. Agora falta o que lhe vender."
 NFP58_GAP_FACT:0 "Desta vez, a mercadoria é «[ScriptContainer.MakeScope.Var('nfp46_good').GetGoods.GetNameNoIcon]». A procura supera de longe o que se oferece, e as dificuldades no abastecimento já figuram em mais de um boletim mensal. Seria exagero falar em desaparecimento. Mas abriu-se um espaço incômodo entre «o comprador apareceu» e «o comprador levou o que veio buscar»."
 NFP58_GAP_GOVERNMENT:0 "As repartições públicas também usam o produto. O interesse, portanto, vai além dos negócios particulares. O Tesouro dispõe dos seus recursos, é claro. Mas carimbar um papel ainda não põe mais mercadoria à venda."
 NFP58_GAP_INTRO:0 "Encontrar comprador é metade do negócio. Às vezes, a metade mais difícil: explicar, despertar interesse, convencer alguém a abrir a carteira. Quando os fregueses aparecem em bom número, dá vontade de felicitar o comércio e a economia do país. Antes, porém, convém ver se temos algo a oferecer. E foi aí que a coisa emperrou."
 NFP58_GAP_LONG:0 "De início, ainda se podia esperar uma resposta rápida do comércio. Afinal, quem diz «quero comprar» costuma ser recebido com mais entusiasmo do que quem pede para pagar depois. Passam os meses e a questão persiste. Talvez já tenham aparecido os interessados no lucro. Bom seria que aparecesse também a mercadoria."
 NFP58_GAP_MILITARY:0 "Há também uso militar para essa mercadoria. O abastecimento merece atenção antes que a conversa chegue às necessidades urgentes da tropa. Gostaríamos de chegar lá com alguma folga nas entregas, em vez de chegar apenas com um estoque de explicações."
 NFP58_GAP_NO_IMPORT:0 "Por enquanto, não se registram importações. Surge uma pergunta razoável: se a oferta local é pequena, não seria possível encontrar a mercadoria no exterior? Só perguntar não traz um navio ao porto. Mas o comprador gostaria de saber o que impede uma resposta na prática."
 NFP58_GAP_TITLE:0 "Comprador há. Falta o que vender"
 NFP58_GAP_TRADE:0 "Há entregas vindas de fora, mas a distância entre oferta e procura continua. É bom que a mercadoria chegue. Falta saber se pode chegar em maior quantidade e o que seria preciso para isso. O comércio alegra especialmente quando se pode comprar o resultado, além de apontá-lo no mapa."
 NFP59_REC_BOTH:0 "A mercadoria interessa tanto ao exército quanto às repartições públicas. A notícia pode, portanto, ser bem recebida em mais de um lugar. Um boletim favorável não abastece o país inteiro de uma vez. Mas já há motivo para olhar o mercado com mais calma."
 NFP59_REC_BUY:0 "Também há menos interessados em comprar. Atribuir toda a melhora ao abastecimento seria conveniente demais. Às vezes a fila diminui porque o comércio funciona melhor. Às vezes porque as pessoas vão embora. A mudança, sozinha, não revela o motivo."
 NFP59_REC_DETAILS:0 "$NFP57_SUP_DETAILS$\nObservações mensais consecutivas sem o sinal anterior: [ScriptContainer.GetVariableValue('nfp50_supply_good_observations')|0]. Tipo do alerta anterior: [ScriptContainer.GetVariableValue('nfp46_mode')|0] (1 — escassez direta, 2 — descompasso entre oferta e procura). A comparação das ordens usa o início da série e a data do acontecimento."
 NFP59_REC_END:0 "E o que tiramos disso? Este jornal faz barulho suficiente quando há problemas. Seria estranho receber a melhora em silêncio. Há motivo para alegria, e temos gosto em registrá-lo.\n\nSeguiremos a história para ver se ela não torna ao ponto de partida. É mais agradável dar seguimento a uma boa notícia que ter de desmenti-la."
 NFP59_REC_GAP:0 "Voltamos à mercadoria «[ScriptContainer.MakeScope.Var('nfp46_good').GetGoods.GetNameNoIcon]». Antes, a procura superava em muito o volume oferecido. Dois boletins mensais seguidos já mostram um quadro mais tranquilo. Oferta e procura talvez ainda não tenham apertado as mãos, mas pelo menos deixaram de estar tão longe uma da outra."
 NFP59_REC_GOVERNMENT:0 "As repartições públicas também usam a mercadoria. A melhora merece, portanto, a atenção do Tesouro. Seria bom se, depois de um boletim mais favorável, os afazeres de todo dia também ficassem mais fáceis."
 NFP59_REC_INTRO:0 "Boas notícias às vezes chegam discretamente. Ninguém corta uma fita, profere um discurso solene ou exige que se guarde a data. Simplesmente uma história que nos fazia franzir a testa dá motivo para outra expressão. Foi o que aconteceu com a preocupação comercial de que já tratamos."
 NFP59_REC_MILITARY:0 "O exército também precisa dessa mercadoria e tem motivo para ver com bons olhos um abastecimento mais tranquilo. Não anunciaremos que tudo de que a tropa precisa foi entregue. Mas uma preocupação comercial a menos já é um começo."
 NFP59_REC_NATIVE:0 "Voltamos à mercadoria «[ScriptContainer.MakeScope.Var('nfp46_good').GetGoods.GetNameNoIcon]». Desde o alerta, dois boletins mensais seguidos deixaram de dar o mesmo motivo de preocupação. O mercado já não acusa a escassez anterior, e a oferta se aproximou sensivelmente da procura. Isso não garante que cada freguês encontre o que veio buscar. Mas enfim temos algo a dizer além de «ainda falta»."
 NFP59_REC_NO_IMPORT:0 "No fechamento do boletim não se registrava importação do produto. Logo, não cabe atribuir a melhora simplesmente a mercadorias vindas de fora. O que mudou dentro do mercado é outra questão. A boa notícia não perde o valor por isso, mas merece ser entendida."
 NFP59_REC_SELL:0 "Há outro detalhe animador: oferece-se agora mais mercadoria que no começo desta história. Não foi preciso contar só com a esperança de que os compradores desistissem. Chegou mais produto ao comércio. Quem o fez chegar e de que maneira ainda são perguntas em aberto. A mudança em si já vale o registro."
 NFP59_REC_TITLE:0 "Motivo para respirar com mais alívio"
 NFP59_REC_TRADE:0 "As importações continuam. É bom vê-las ao lado de uma notícia favorável sobre o abastecimento. Ainda é cedo para dar todo o crédito ao comércio, mas seria estranho passar por ele como se a melhora tivesse vindo sozinha."
 NFP59_REC_ZERO_END:0 "Ainda precisamos saber por que deixaram de comprar. Seria cedo para lançar a mudança na coluna das vitórias econômicas.\n\nUma fila vazia dá gosto de ver. Quando se sabe aonde foram os compradores."
 NFP59_REC_ZERO_FACT:0 "Para a mercadoria «[ScriptContainer.MakeScope.Var('nfp46_good').GetGoods.GetNameNoIcon]», o sinal anterior de dificuldade desapareceu. Só que, no último boletim, a procura também não apareceu. Temos silêncio. Se por trás dele o abastecimento melhorou, ainda não sabemos."
 NFP59_REC_ZERO_INTRO:0 "Há um jeito fácil de deixar de notar a falta de uma coisa: parar de procurá-la. Para quem precisa comprar, o consolo é duvidoso. Sugerimos ler a notícia que segue sem chamar a banda para a comemoração."
 NFP59_REC_ZERO_TITLE:0 "Sem procura, sem problema?"
 NFP60_CONS_DOWN:0 "O consumo no mercado diminuiu. O motivo é outra questão. "
 NFP60_CONS_UP:0 "O consumo no mercado aumentou. "
 NFP60_EXP_DOWN:0 "O mercado passou a exportar menos mercadoria. "
 NFP60_EXP_UP:0 "O mercado passou a exportar mais mercadoria. "
 NFP60_IMP_DOWN:0 "Diminuíram as entregas vindas de fora do mercado. "
 NFP60_IMP_UP:0 "O mercado passou a receber mais mercadoria de fora. "
 NFP60_PARTIAL_SUP:0 "Começamos a acompanhar em detalhe a produção e o comércio quando o problema já estava em curso. Só podemos descrever as mudanças posteriores. "
 NFP60_PROD_DOWN:0 "A produção no mercado diminuiu. "
 NFP60_PROD_UP:0 "A produção no mercado aumentou. "
 NFP60_STATE_DETAILS:0 "[Localize(ScriptContainer.MakeScope.Var('nfp60_previous_metrics').GetFlagName)]\nObservação das causas desde o índice mensal [ScriptContainer.GetVariableValue('nfp60_st_start')|0]. Histórico parcial: [ScriptContainer.GetVariableValue('nfp60_st_partial')|0].\nInfraestrutura: [ScriptContainer.GetVariableValue('nfp60_st_cap_before')|2] → [ScriptContainer.GetVariableValue('nfp60_st_cap_after')|2]\nCarga: [ScriptContainer.GetVariableValue('nfp60_st_usage_before')|2] → [ScriptContainer.GetVariableValue('nfp60_st_usage_after')|2]\nAcesso ao mercado: [Multiply_CFixedPoint(ScriptContainer.GetVariableValue('nfp60_st_access_before'), '(CFixedPoint)100')|1]% → [Multiply_CFixedPoint(ScriptContainer.GetVariableValue('nfp60_st_access_after'), '(CFixedPoint)100')|1]%\nNíveis de ferrovia: [ScriptContainer.GetVariableValue('nfp60_st_rail_before')|0] → [ScriptContainer.GetVariableValue('nfp60_st_rail_after')|0]\nNíveis de porto: [ScriptContainer.GetVariableValue('nfp60_st_port_before')|0] → [ScriptContainer.GetVariableValue('nfp60_st_port_after')|0]\nNíveis de centro urbano: [ScriptContainer.GetVariableValue('nfp60_st_urban_before')|0] → [ScriptContainer.GetVariableValue('nfp60_st_urban_after')|0]\nEventos (contadores limitados a 99): rail_built=[ScriptContainer.GetVariableValue('nfp60_st_rail_built')|0]; rail_expanded=[ScriptContainer.GetVariableValue('nfp60_st_rail_expanded')|0]; rail_pm=[ScriptContainer.GetVariableValue('nfp60_st_rail_pm')|0]; port_built=[ScriptContainer.GetVariableValue('nfp60_st_port_built')|0]; port_expanded=[ScriptContainer.GetVariableValue('nfp60_st_port_expanded')|0]; port_pm=[ScriptContainer.GetVariableValue('nfp60_st_port_pm')|0]; urban_built=[ScriptContainer.GetVariableValue('nfp60_st_urban_built')|0]; urban_expanded=[ScriptContainer.GetVariableValue('nfp60_st_urban_expanded')|0]; urban_pm=[ScriptContainer.GetVariableValue('nfp60_st_urban_pm')|0].\nÍndices do primeiro e do último evento: [ScriptContainer.GetVariableValue('nfp60_st_event_first')|0] / [ScriptContainer.GetVariableValue('nfp60_st_event_last')|0]. Registra-se aumento no preenchimento de vagas quando a construção observada passa de menos de 80% para pelo menos 80% de ocupação. Sua contribuição exata para a infraestrutura não foi calculada."
 NFP60_SUP_CAUSES:0 "[SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp60_supply_known'), '(CFixedPoint)1'), 'NFP60_SUP_COMPONENTS', 'NFP60_SUP_UNKNOWN')][SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp60_s_partial'), '(CFixedPoint)1'), 'NFP60_PARTIAL_SUP', 'NFP50_EMPTY')]"
 NFP60_SUP_COMPONENTS:0 "[SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp60_prod_dir'), '(CFixedPoint)1'), 'NFP60_PROD_UP', SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp60_prod_dir'), '(CFixedPoint)-1'), 'NFP60_PROD_DOWN', 'NFP50_EMPTY'))][SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp60_imp_dir'), '(CFixedPoint)1'), 'NFP60_IMP_UP', SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp60_imp_dir'), '(CFixedPoint)-1'), 'NFP60_IMP_DOWN', 'NFP50_EMPTY'))][SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp60_exp_dir'), '(CFixedPoint)1'), 'NFP60_EXP_UP', SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp60_exp_dir'), '(CFixedPoint)-1'), 'NFP60_EXP_DOWN', 'NFP50_EMPTY'))][SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp60_cons_dir'), '(CFixedPoint)1'), 'NFP60_CONS_UP', SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp60_cons_dir'), '(CFixedPoint)-1'), 'NFP60_CONS_DOWN', 'NFP50_EMPTY'))]Essas mudanças coincidiram com o período que acompanhamos. Apontar uma delas como a única salvadora do mercado seria ousadia demais. "
 NFP60_SUP_DETAILS:0 "[Localize(ScriptContainer.MakeScope.Var('nfp60_previous_metrics').GetFlagName)]\nHistórico detalhado do comércio desde o índice mensal [ScriptContainer.GetVariableValue('nfp60_s_start')|0]. Histórico parcial: [ScriptContainer.GetVariableValue('nfp60_s_partial')|0].\nProdução no mercado: [ScriptContainer.GetVariableValue('nfp60_s_prod_before')|2] → [ScriptContainer.GetVariableValue('nfp60_s_prod_after')|2]\nConsumo no mercado: [ScriptContainer.GetVariableValue('nfp60_s_cons_before')|2] → [ScriptContainer.GetVariableValue('nfp60_s_cons_after')|2]\nImportações do mercado: [ScriptContainer.GetVariableValue('nfp60_s_imp_before')|2] → [ScriptContainer.GetVariableValue('nfp60_s_imp_after')|2]\nExportações do mercado: [ScriptContainer.GetVariableValue('nfp60_s_exp_before')|2] → [ScriptContainer.GetVariableValue('nfp60_s_exp_after')|2]\nPreço: [ScriptContainer.GetVariableValue('nfp60_s_price_before')|2] → [ScriptContainer.GetVariableValue('nfp60_s_price_after')|2]. São volumes de todo o mercado e podem incluir produção de outros países."
 NFP60_SUP_UNKNOWN:0 "O motivo do alerta anterior desapareceu. Os dados de produção e comércio ainda não explicam como isso aconteceu. "
 NFP61_CAP_DOWN:0 "Curiosamente, a rede não ganhou capacidade nesse período. Pelo contrário, perdeu. Logo, não cabe explicar a melhora apenas pela expansão da infraestrutura. "
 NFP61_CAP_UP:0 "Durante o período observado, a rede passou a comportar mais movimento. A economia ganhou espaço. Tomara que não o ocupe todo antes de terminarmos a comemoração. "
 NFP61_CAUSES:0 "[SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp60_components_known'), '(CFixedPoint)1'), 'NFP61_COMPONENTS', 'NFP61_UNKNOWN')][SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp60_st_partial'), '(CFixedPoint)1'), 'NFP61_PARTIAL', 'NFP50_EMPTY')]"
 NFP61_COMPONENTS:0 "[SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp60_cap_dir'), '(CFixedPoint)1'), 'NFP61_CAP_UP', SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp60_cap_dir'), '(CFixedPoint)-1'), 'NFP61_CAP_DOWN', 'NFP50_EMPTY'))][SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp60_usage_dir'), '(CFixedPoint)1'), 'NFP61_LOAD_UP', SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp60_usage_dir'), '(CFixedPoint)-1'), 'NFP61_LOAD_DOWN', 'NFP50_EMPTY'))]"
 NFP61_END:0 "E o que tiramos disso? Do estado veio uma boa notícia, e não vamos procurar defeito por força do hábito. A economia ganhou fôlego. Podemos nos alegrar com isso.\n\nAgora veremos quanto tempo dura a folga. Gostaríamos de voltar a falar desse estado pelo que ele produz, em vez de voltar a contar o que a rede deixou de aguentar.\n\nDizem que sempre cabe mais um. Ainda assim, um pouco de espaço faz bem."
 NFP61_EVENTS:0 "[SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp60_rail_work'), '(CFixedPoint)1'), 'NFP61_RAIL_WORK', 'NFP50_EMPTY')][SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp60_port_work'), '(CFixedPoint)1'), 'NFP61_PORT_WORK', 'NFP50_EMPTY')][SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp60_urban_work'), '(CFixedPoint)1'), 'NFP61_URBAN_WORK', 'NFP50_EMPTY')][SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp60_rail_pm_seen'), '(CFixedPoint)1'), 'NFP61_RAIL_PM', 'NFP50_EMPTY')][SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp60_port_pm_seen'), '(CFixedPoint)1'), 'NFP61_PORT_PM', 'NFP50_EMPTY')][SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp60_urban_pm_seen'), '(CFixedPoint)1'), 'NFP61_URBAN_PM', 'NFP50_EMPTY')]$NFP61_PM_END_SELECT$[SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp60_st_rail_staffup'), '(CFixedPoint)1'), 'NFP61_RAIL_STAFF', 'NFP50_EMPTY')][SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp60_st_port_staffup'), '(CFixedPoint)1'), 'NFP61_PORT_STAFF', 'NFP50_EMPTY')]$NFP61_STAFF_END_SELECT$Houve mudanças, como se vê. Ainda não vamos atribuir a uma delas todo o mérito: ocorrer na mesma época e resolver o problema são coisas diferentes."
 NFP61_FACT:0 "Voltamos ao estado de [SelectLocalization(And(ScriptContainer.MakeScope.Var('nfp20_problem_state').IsSet, ScriptContainer.MakeScope.Var('nfp20_problem_state').GetState.IsValid), 'NFP40_STATE_LINK', 'NFP40_REGION_FALLBACK')]. Havíamos contado que sua infraestrutura carregava mais do que podia suportar. Agora os boletins mostram que a capacidade disponível dá conta das necessidades. O problema que já tinha lugar garantido no jornal enfim cedeu espaço a uma boa notícia."
 NFP61_INTRO:0 "É fácil se acostumar ao que vai bem. À economia funcionando, por exemplo, sem que cada nova empresa traga a pergunta: nossa infraestrutura aguenta? Também se pode perder o hábito de reparar no que vai mal. Há sobrecarga, a vida segue como pode, o próximo boletim pouco difere do anterior... Desta vez, porém, difere. E para melhor."
 NFP61_LOAD_DOWN:0 "Ao mesmo tempo, diminuiu a carga sobre a rede. Há dois jeitos de aliviar um aperto: abrir mais espaço ou parar de tentar enfiar tanta coisa nele. O segundo também funciona. Só não explica, por si só, por que agora há menos trabalho para a rede. "
 NFP61_LOAD_UP:0 "A carga sobre a rede também cresceu. A economia, portanto, não saiu do aperto simplesmente por precisar de menos. Há mais trabalho para a infraestrutura, e a sobrecarga anterior mesmo assim desapareceu. "
 NFP61_PARTIAL:0 "Temos registros detalhados de apenas parte dessa história. O começo ficou fora das nossas observações, por isso ainda seria cedo para dar uma explicação definitiva. "
 NFP61_PM_END:0 "Nem toda mudança exige obra nova. Às vezes vale olhar para o uso que se faz do que já está construído. "
 NFP61_PM_END_SELECT:0 "[SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp60_rail_pm_seen'), '(CFixedPoint)1'), 'NFP61_PM_END', 'NFP61_PORT_PM_END_SELECT')]"
 NFP61_PORT_PM:0 "Mudaram os métodos de trabalho no porto. "
 NFP61_PORT_PM_END_SELECT:0 "[SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp60_port_pm_seen'), '(CFixedPoint)1'), 'NFP61_PM_END', 'NFP61_URBAN_PM_END_SELECT')]"
 NFP61_PORT_STAFF:0 "O porto que acompanhamos ocupa hoje uma parcela maior de seus postos de trabalho. "
 NFP61_PORT_STAFF_END_SELECT:0 "[SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp60_st_port_staffup'), '(CFixedPoint)1'), 'NFP61_STAFF_END', 'NFP50_EMPTY')]"
 NFP61_PORT_WORK:0 "Foram concluídas obras no porto. Para um estado que precisava de mais capacidade, é uma mudança que merece registro. "
 NFP61_RAIL_PM:0 "Mudaram os métodos de trabalho na ferrovia. "
 NFP61_RAIL_STAFF:0 "A ferrovia que acompanhamos ocupa hoje uma parcela maior de seus postos de trabalho. "
 NFP61_RAIL_WORK:0 "Durante o período houve conclusão de obras de construção ou ampliação da ferrovia no estado. Pelo menos desta vez a conversa sobre trilhos veio acompanhada dos próprios trilhos. "
 NFP61_REMAINING:0 "Há, porém, outra dificuldade. A ligação do estado com o mercado comum ainda é incompleta. A infraestrutura dá conta da carga atual, mas nem todos os caminhos do comércio estão abertos. Deixamos um problema para trás. Seria pena perder o outro de vista entre os cumprimentos."
 NFP61_STAFF_END:0 "Construir é metade do serviço. É preciso haver quem trabalhe ali. "
 NFP61_STAFF_END_SELECT:0 "[SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp60_st_rail_staffup'), '(CFixedPoint)1'), 'NFP61_STAFF_END', 'NFP61_PORT_STAFF_END_SELECT')]"
 NFP61_TITLE:0 "Onde havia aperto, agora há folga"
 NFP61_UNKNOWN:0 "A melhora está à vista. As informações disponíveis ainda não permitem explicá-la. Seria cômodo apontar logo o culpado pelas dificuldades de ontem e o responsável pelo sucesso de hoje. Comodidade, porém, não é prova. "
 NFP61_URBAN_PM:0 "Mudaram os métodos de trabalho nas atividades urbanas. "
 NFP61_URBAN_PM_END_SELECT:0 "[SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp60_urban_pm_seen'), '(CFixedPoint)1'), 'NFP61_PM_END', 'NFP50_EMPTY')]"
 NFP61_URBAN_WORK:0 "As atividades urbanas também se expandiram. Os grandes transportes se destacam no mapa, mas a vida cotidiana do estado vai além deles. "
 NFP62_CAP_DOWN:0 "A capacidade da infraestrutura, porém, diminuiu. Não cabe dizer que «agora há mais espaço». O acesso ao mercado melhorou, mas há claramente mais nessa história do que uma obra bem-sucedida. "
 NFP62_CAP_UP:0 "A infraestrutura do estado ganhou capacidade nesse período. É uma combinação feliz: há mais espaço na rede e melhor ligação com o mercado. Seria cedo para pôr todo o mérito nessa conta, mas a mudança merece atenção. "
 NFP62_CAUSES:0 "[SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp60_components_known'), '(CFixedPoint)1'), 'NFP62_COMPONENTS', 'NFP62_UNKNOWN')][SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp60_st_partial'), '(CFixedPoint)1'), 'NFP62_PARTIAL', 'NFP50_EMPTY')]"
 NFP62_COMPONENTS:0 "[SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp60_cap_dir'), '(CFixedPoint)1'), 'NFP62_CAP_UP', SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp60_cap_dir'), '(CFixedPoint)-1'), 'NFP62_CAP_DOWN', 'NFP50_EMPTY'))][SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp60_usage_dir'), '(CFixedPoint)1'), 'NFP62_LOAD_UP', SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp60_usage_dir'), '(CFixedPoint)-1'), 'NFP62_LOAD_DOWN', 'NFP50_EMPTY'))]"
 NFP62_END:0 "E o que tiramos disso? Antes o estado era nosso no mapa, enquanto o mercado comum às vezes parecia uma promessa distante. Agora há menos distância entre a promessa e a vida comercial.\n\nVoltaremos ao assunto quando houver novidades. Tomara que da próxima vez seja para contar o que chegou ao mercado, em vez de explicar por que não se consegue chegar a ele."
 NFP62_EVENTS:0 "[SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp60_rail_work'), '(CFixedPoint)1'), 'NFP62_RAIL_WORK', 'NFP50_EMPTY')][SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp60_port_work'), '(CFixedPoint)1'), 'NFP62_PORT_WORK', 'NFP50_EMPTY')][SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp60_urban_work'), '(CFixedPoint)1'), 'NFP62_URBAN_WORK', 'NFP50_EMPTY')][SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp60_rail_pm_seen'), '(CFixedPoint)1'), 'NFP62_RAIL_PM', 'NFP50_EMPTY')][SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp60_port_pm_seen'), '(CFixedPoint)1'), 'NFP62_PORT_PM', 'NFP50_EMPTY')][SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp60_urban_pm_seen'), '(CFixedPoint)1'), 'NFP62_URBAN_PM', 'NFP50_EMPTY')]$NFP62_PM_END_SELECT$[SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp60_st_rail_staffup'), '(CFixedPoint)1'), 'NFP62_RAIL_STAFF', 'NFP50_EMPTY')][SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp60_st_port_staffup'), '(CFixedPoint)1'), 'NFP62_PORT_STAFF', 'NFP50_EMPTY')]$NFP62_STAFF_END_SELECT$Tudo isso ocorreu enquanto acompanhávamos o estado. Ainda não se sabe quais mudanças mais ajudaram. Coincidirem no tempo é motivo para examiná-las de perto, não para distribuir condecorações."
 NFP62_FACT:0 "Voltamos ao estado de [SelectLocalization(And(ScriptContainer.MakeScope.Var('nfp20_problem_state').IsSet, ScriptContainer.MakeScope.Var('nfp20_problem_state').GetState.IsValid), 'NFP40_STATE_LINK', 'NFP40_REGION_FALLBACK')]. Os últimos boletins mostram que as dificuldades de acesso ao mercado comum diminuíram. Ninguém prometeu preços baixos ou prateleiras sortidas em toda loja. Mas o estado já pode participar mais plenamente da economia do país. A palavra «comum» voltou a fazer um pouco mais de sentido."
 NFP62_INTRO:0 "Às vezes vai uma longa distância de «tem no país» até «vende-se aqui». E nem sempre dá para medi-la em quilômetros. No mapa tudo parece próximo: nossas fronteiras, nossa economia comum. Na prática, nem todos conseguem participar dela por inteiro. Já falamos dessa dificuldade. Agora temos motivo para voltar ao assunto com outro ânimo."
 NFP62_LOAD_DOWN:0 "A carga sobre a rede também diminuiu. Talvez tenha ficado mais fácil atender às necessidades de transporte e aos demais compromissos do estado. Por que a carga caiu é outra questão. Ainda seria cedo para chamar essa queda, sem ressalvas, de vitória. "
 NFP62_LOAD_UP:0 "A carga sobre a rede, ao contrário, aumentou. O acesso ao mercado melhorou sem que as necessidades da economia diminuíssem. Há mais trabalho e a dificuldade anterior perdeu força. Razão a mais para descobrir o que tornou isso possível. "
 NFP62_PARTIAL:0 "Começamos a tomar notas detalhadas quando a história já estava em curso. O estado percorreu parte do caminho sem a nossa companhia. Explicar todo o resultado só pelo trecho que vimos seria cômodo demais. "
 NFP62_PM_END:0 "Nem sempre é preciso construir algo novo. Importa tanto o que se construiu quanto a maneira de usá-lo. "
 NFP62_PM_END_SELECT:0 "[SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp60_rail_pm_seen'), '(CFixedPoint)1'), 'NFP62_PM_END', 'NFP62_PORT_PM_END_SELECT')]"
 NFP62_PORT_PM:0 "Mudaram os métodos de trabalho no porto. "
 NFP62_PORT_PM_END_SELECT:0 "[SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp60_port_pm_seen'), '(CFixedPoint)1'), 'NFP62_PM_END', 'NFP62_URBAN_PM_END_SELECT')]"
 NFP62_PORT_STAFF:0 "O porto que acompanhamos ocupa hoje uma parcela maior de seus postos de trabalho. "
 NFP62_PORT_STAFF_END_SELECT:0 "[SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp60_st_port_staffup'), '(CFixedPoint)1'), 'NFP62_STAFF_END', 'NFP50_EMPTY')]"
 NFP62_PORT_WORK:0 "Houve conclusão de obras no porto. Isso interessa a quem procura entender como o estado se liga ao resto do país. Uma obra concluída, sozinha, ainda não conta toda a história dos transportes. "
 NFP62_RAIL_PM:0 "Mudaram os métodos de trabalho na ferrovia. "
 NFP62_RAIL_STAFF:0 "A ferrovia que acompanhamos ocupa hoje uma parcela maior de seus postos de trabalho. "
 NFP62_RAIL_WORK:0 "Durante as observações, foram concluídas obras de construção ou ampliação ferroviária no estado. A antiga questão da ligação com o mercado comum ganhou um elemento bastante concreto: mais capacidade na ferrovia. "
 NFP62_REMAINING:0 "Ainda há uma dificuldade: a infraestrutura do estado continua sobrecarregada. O acesso ao mercado melhorou sem que houvesse folga na rede. Isso não tira o valor da boa notícia. Só seria cedo para encerrar os dois assuntos de uma vez."
 NFP62_STAFF_END:0 "As instalações ainda não aprenderam a trabalhar sozinhas. As pessoas, portanto, têm seu lugar nessa história. "
 NFP62_STAFF_END_SELECT:0 "[SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp60_st_rail_staffup'), '(CFixedPoint)1'), 'NFP62_STAFF_END', 'NFP62_PORT_STAFF_END_SELECT')]"
 NFP62_TITLE:0 "Nosso estado. E agora, nosso mercado também"
 NFP62_UNKNOWN:0 "Os registros sobre a infraestrutura e sua carga ainda não oferecem explicação clara. A melhora está aí, mas ainda não sabemos a quem agradecer. Melhor entender a disputa antes de anunciar o vencedor. "
 NFP62_URBAN_PM:0 "Mudaram os métodos de trabalho nas atividades urbanas. "
 NFP62_URBAN_PM_END_SELECT:0 "[SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp60_urban_pm_seen'), '(CFixedPoint)1'), 'NFP62_PM_END', 'NFP50_EMPTY')]"
 NFP62_URBAN_WORK:0 "As atividades urbanas também se expandiram. Raramente chamam tanta atenção quanto uma locomotiva ou um navio de grande porte, mas o estado não vive apenas de transporte de longa distância. "
 NFP63_ALLY:0 "O país em questão é nosso aliado. Convém conhecer suas possibilidades: os acordos têm mais valor quando se sabe o que acontece na casa do parceiro."
 NFP63_ATT_1:0 " O governo desse país nos vê com hostilidade. Mais vale acompanhar os fatos de olhos abertos: de lá talvez não chegue uma explicação cortês."
 NFP63_ATT_10:0 " Esse país dependente permanece leal a nós. Razão a mais para levar a sério as preocupações de seus habitantes."
 NFP63_ATT_11:0 " Há nesse país dependente o desejo de se livrar da sujeição. Convém ler as notícias de lá com atenção redobrada: a costumeira tranquilidade já não é a melhor conselheira."
 NFP63_ATT_2:0 " Sua atitude para conosco é belicosa. Zombar do que acontece no exterior dá menos trabalho do que lidar depois com as consequências na fronteira."
 NFP63_ATT_3:0 " Aquele país gostaria de nos sujeitar à sua autoridade. Há muitas maneiras de um vizinho oferecer cuidados; esta merece uma boa leitura das letras miúdas."
 NFP63_ATT_4:0 " O país nos observa com cautela. Vale confrontar as suspeitas de ambos os lados com os fatos antes de tomá-las por planos confirmados."
 NFP63_ATT_5:0 " Por enquanto, nosso país pouco desperta a atenção daquele governo. Suas notícias continuam a ter interesse, mas não é preciso descobrir nelas um recado para nós a cada linha."
 NFP63_ATT_6:0 " Há disposição para uma reaproximação conosco. Boa ocasião para acompanhar as mudanças sem precisar desenterrar uma farpa diplomática a cada notícia."
 NFP63_ATT_7:0 " Aquele governo se mostra disposto a colaborar conosco. Seria bom se, junto com a boa vontade, viessem também empreendimentos em comum."
 NFP63_ATT_8:0 " O país nos vê com simpatia. Podemos poupar a alfinetada de praxe. Os fatos conservarão toda a sua força."
 NFP63_ATT_9:0 " Aquele governo se dispõe a nos proteger. É uma atitude amável, embora valha a pena distinguir a proteção oferecida da autonomia que nos restaria."
 NFP63_BAND_NEG1:0 "As relações poderiam ser melhores. Uma boa ironia talvez anime a leitura, mas não explicaria o que se passa por lá."
 NFP63_BAND_NEG2:0 "As relações são frias. Talvez faltem palavras calorosas para a notícia, mas sobram motivos para examiná-la com atenção."
 NFP63_BAND_NEG3:0 "As relações entre os dois países são abertamente hostis. Dificilmente se esperam elogios da nossa redação. A falta de simpatia não muda os fatos."
 NFP63_BAND_POS1:0 "As relações permitem uma conversa tranquila. Podemos olhar para a mudança sem partir do princípio de que há alguma armadilha."
 NFP63_BAND_POS2:0 "Os países se dão bem. Dá gosto ler notícias de lá com interesse e simpatia. Ainda assim, até entre amigos os fatos merecem exame próprio."
 NFP63_BAND_POS3:0 "As relações são particularmente calorosas. Tomara que sobrem motivos para dizer bem do país. E, se a notícia for ruim, que receba de nós ainda mais atenção."
 NFP63_BAND_ZERO:0 "As relações seguem sem grande calor nem hostilidade aberta. Podemos examinar a notícia sem começar por uma querela diplomática."
 NFP63_BLOC:0 "O país pertence ao nosso bloco. Mudanças assim interessam ao círculo de parceiros, por mais distante que seja o lugar dos acontecimentos."
 NFP63_CLOSING:0 "$NFP63_EDITORIAL$\n\n[Localize(ScriptContainer.MakeScope.Var('nfp63_closing').GetFlagName)]"
 NFP63_DETAILS:0 "Seleção da redação: [SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp63_reason'), '(CFixedPoint)0'), 'NFP63_REASON_0', 'NFP50_EMPTY')][SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp63_reason'), '(CFixedPoint)1'), 'NFP63_REASON_1', 'NFP50_EMPTY')][SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp63_reason'), '(CFixedPoint)2'), 'NFP63_REASON_2', 'NFP50_EMPTY')][SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp63_reason'), '(CFixedPoint)3'), 'NFP63_REASON_3', 'NFP50_EMPTY')][SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp63_reason'), '(CFixedPoint)4'), 'NFP63_REASON_4', 'NFP50_EMPTY')][SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp63_reason'), '(CFixedPoint)5'), 'NFP63_REASON_5', 'NFP50_EMPTY')][SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp63_reason'), '(CFixedPoint)6'), 'NFP63_REASON_6', 'NFP50_EMPTY')][SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp63_reason'), '(CFixedPoint)7'), 'NFP63_REASON_7', 'NFP50_EMPTY')].\nCategorias editoriais: leitor [ScriptContainer.GetVariableValue('nfp63_reader_tier')|0], fonte [ScriptContainer.GetVariableValue('nfp63_source_tier')|0], outra parte [ScriptContainer.GetVariableValue('nfp63_second_tier')|0]. Bônus de prioridade [ScriptContainer.GetVariableValue('nfp63_bonus')|0]; novidade da tecnologia [ScriptContainer.GetVariableValue('nfp63_novel')|0]; diferença entre leis [ScriptContainer.GetVariableValue('nfp63_different_law')|0].\nVínculo com a fonte [ScriptContainer.GetVariableValue('nfp63_relation')|0], com a outra parte [ScriptContainer.GetVariableValue('nfp63_second_relation')|0]; relações [ScriptContainer.GetVariableValue('nfp63_friend')|0]. Os critérios e o tom ficaram registrados quando a notícia chegou. O arquivo não consulta a diplomacia atual.\nRelações da fonte com o leitor: [ScriptContainer.GetVariableValue('nfp63_relation_value')|0], faixa [ScriptContainer.GetVariableValue('nfp63_relation_band')|0]; atitude da IA [ScriptContainer.GetVariableValue('nfp63_attitude')|0]. Outra parte: relações [ScriptContainer.GetVariableValue('nfp63_secondary_relation_value')|0], faixa [ScriptContainer.GetVariableValue('nfp63_secondary_relation_band')|0], atitude da IA [ScriptContainer.GetVariableValue('nfp63_secondary_attitude')|0]. Uma atitude igual a zero indica que falta um registro confirmado. Não expressa uma intenção neutra do jogador."
 NFP63_DOMESTIC_REASON:0 "espaço reservado para notícias nacionais"
 NFP63_EDITORIAL:0 "[SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp63_relation'), '(CFixedPoint)1'), 'NFP63_SECOND_TONE', 'NFP63_TONE')]"
 NFP63_NEIGHBOR:0 "O fato ocorre em um país vizinho. Traçar a fronteira no mapa é fácil. As consequências do que acontece do outro lado nem sempre respeitam o traçado."
 NFP63_NEUTRAL:0 "Vale acompanhar o país sem entusiasmo precipitado nem ironia apressada. Uma mudança estrangeira interessa sobretudo pelo que de fato muda."
 NFP63_OVERLORD:0 "A notícia vem do país de que o nosso depende. Seria imprudente lê-la como simples curiosidade estrangeira."
 NFP63_REASON_0:0 "entrega anterior ou especial"
 NFP63_REASON_1:0 "nosso país ou participação direta"
 NFP63_REASON_2:0 "acontecimento de alcance mundial"
 NFP63_REASON_3:0 "mudança estratégica em uma grande potência"
 NFP63_REASON_4:0 "mudança estratégica envolvendo aliado, parceiro de bloco, súdito ou suserano"
 NFP63_REASON_5:0 "mudança estratégica em um país rival"
 NFP63_REASON_6:0 "conflito em um país vizinho"
 NFP63_REASON_7:0 "interesse regional e categoria do país segundo a redação"
 NFP63_RIVAL:0 "Trata-se do nosso rival. Podemos dar de ombros para a notícia. Convencer-nos de que ela perdeu a importância só por causa disso já seria mais difícil."
 NFP63_SECOND_ATTITUDE:0 "[SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp63_secondary_attitude'), '(CFixedPoint)1'), 'NFP63_ATT_1', 'NFP50_EMPTY')][SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp63_secondary_attitude'), '(CFixedPoint)2'), 'NFP63_ATT_2', 'NFP50_EMPTY')][SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp63_secondary_attitude'), '(CFixedPoint)3'), 'NFP63_ATT_3', 'NFP50_EMPTY')][SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp63_secondary_attitude'), '(CFixedPoint)4'), 'NFP63_ATT_4', 'NFP50_EMPTY')][SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp63_secondary_attitude'), '(CFixedPoint)5'), 'NFP63_ATT_5', 'NFP50_EMPTY')][SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp63_secondary_attitude'), '(CFixedPoint)6'), 'NFP63_ATT_6', 'NFP50_EMPTY')][SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp63_secondary_attitude'), '(CFixedPoint)7'), 'NFP63_ATT_7', 'NFP50_EMPTY')][SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp63_secondary_attitude'), '(CFixedPoint)8'), 'NFP63_ATT_8', 'NFP50_EMPTY')][SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp63_secondary_attitude'), '(CFixedPoint)9'), 'NFP63_ATT_9', 'NFP50_EMPTY')][SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp63_secondary_attitude'), '(CFixedPoint)10'), 'NFP63_ATT_10', 'NFP50_EMPTY')][SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp63_secondary_attitude'), '(CFixedPoint)11'), 'NFP63_ATT_11', 'NFP50_EMPTY')]"
 NFP63_SECOND_PARTNER:0 " A outra parte principal tem conosco uma aliança, pertence ao mesmo bloco ou mantém uma relação de dependência. Sua situação também merece atenção."
 NFP63_SECOND_RELATIONS:0 "[SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp63_secondary_relation_band'), '(CFixedPoint)-3'), 'NFP63_BAND_NEG3', 'NFP50_EMPTY')][SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp63_secondary_relation_band'), '(CFixedPoint)-2'), 'NFP63_BAND_NEG2', 'NFP50_EMPTY')][SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp63_secondary_relation_band'), '(CFixedPoint)-1'), 'NFP63_BAND_NEG1', 'NFP50_EMPTY')][SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp63_secondary_relation_band'), '(CFixedPoint)0'), 'NFP63_BAND_ZERO', 'NFP50_EMPTY')][SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp63_secondary_relation_band'), '(CFixedPoint)1'), 'NFP63_BAND_POS1', 'NFP50_EMPTY')][SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp63_secondary_relation_band'), '(CFixedPoint)2'), 'NFP63_BAND_POS2', 'NFP50_EMPTY')][SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp63_secondary_relation_band'), '(CFixedPoint)3'), 'NFP63_BAND_POS3', 'NFP50_EMPTY')]"
 NFP63_SECOND_RIVAL:0 " Entre os protagonistas está um rival nosso. Há, portanto, mais um motivo para acompanhar o desenrolar dos fatos."
 NFP63_SECOND_TONE:0 "Quanto à outra parte, [ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName].\n\n[SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp63_second_relation'), '(CFixedPoint)2'), 'NFP63_SUBJECT', SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp63_second_relation'), '(CFixedPoint)3'), 'NFP63_OVERLORD', SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp63_second_relation'), '(CFixedPoint)4'), 'NFP63_ALLY', SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp63_second_relation'), '(CFixedPoint)5'), 'NFP63_BLOC', SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp63_second_relation'), '(CFixedPoint)6'), 'NFP63_RIVAL', SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp63_second_relation'), '(CFixedPoint)7'), 'NFP63_NEIGHBOR', 'NFP63_NEUTRAL'))))))]\n\n$NFP63_SECOND_RELATIONS$$NFP63_SECOND_ATTITUDE$"
 NFP63_SUBJECT:0 "A notícia vem de um país que depende do nosso. Da capital, é fácil tratar seus assuntos como detalhes distantes. Para quem vive lá, dificilmente parecem tão distantes assim."
 NFP63_TONE:0 "[SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp63_relation'), '(CFixedPoint)2'), 'NFP63_SUBJECT', SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp63_relation'), '(CFixedPoint)3'), 'NFP63_OVERLORD', SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp63_relation'), '(CFixedPoint)4'), 'NFP63_ALLY', SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp63_relation'), '(CFixedPoint)5'), 'NFP63_BLOC', SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp63_relation'), '(CFixedPoint)6'), 'NFP63_RIVAL', SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp63_relation'), '(CFixedPoint)7'), 'NFP63_NEIGHBOR', 'NFP63_NEUTRAL'))))))]\n\n$NFP63_TONE_RELATIONS$$NFP63_TONE_ATTITUDE$[SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp63_second_relation'), '(CFixedPoint)6'), 'NFP63_SECOND_RIVAL', 'NFP50_EMPTY')][SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp63_second_relation'), '(CFixedPoint)2'), 'NFP63_SECOND_PARTNER', 'NFP50_EMPTY')][SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp63_second_relation'), '(CFixedPoint)3'), 'NFP63_SECOND_PARTNER', 'NFP50_EMPTY')][SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp63_second_relation'), '(CFixedPoint)4'), 'NFP63_SECOND_PARTNER', 'NFP50_EMPTY')][SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp63_second_relation'), '(CFixedPoint)5'), 'NFP63_SECOND_PARTNER', 'NFP50_EMPTY')]"
 NFP63_TONE_ATTITUDE:0 "[SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp63_attitude'), '(CFixedPoint)1'), 'NFP63_ATT_1', 'NFP50_EMPTY')][SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp63_attitude'), '(CFixedPoint)2'), 'NFP63_ATT_2', 'NFP50_EMPTY')][SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp63_attitude'), '(CFixedPoint)3'), 'NFP63_ATT_3', 'NFP50_EMPTY')][SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp63_attitude'), '(CFixedPoint)4'), 'NFP63_ATT_4', 'NFP50_EMPTY')][SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp63_attitude'), '(CFixedPoint)5'), 'NFP63_ATT_5', 'NFP50_EMPTY')][SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp63_attitude'), '(CFixedPoint)6'), 'NFP63_ATT_6', 'NFP50_EMPTY')][SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp63_attitude'), '(CFixedPoint)7'), 'NFP63_ATT_7', 'NFP50_EMPTY')][SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp63_attitude'), '(CFixedPoint)8'), 'NFP63_ATT_8', 'NFP50_EMPTY')][SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp63_attitude'), '(CFixedPoint)9'), 'NFP63_ATT_9', 'NFP50_EMPTY')][SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp63_attitude'), '(CFixedPoint)10'), 'NFP63_ATT_10', 'NFP50_EMPTY')][SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp63_attitude'), '(CFixedPoint)11'), 'NFP63_ATT_11', 'NFP50_EMPTY')]"
 NFP63_TONE_RELATIONS:0 "[SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp63_relation_band'), '(CFixedPoint)-3'), 'NFP63_BAND_NEG3', 'NFP50_EMPTY')][SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp63_relation_band'), '(CFixedPoint)-2'), 'NFP63_BAND_NEG2', 'NFP50_EMPTY')][SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp63_relation_band'), '(CFixedPoint)-1'), 'NFP63_BAND_NEG1', 'NFP50_EMPTY')][SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp63_relation_band'), '(CFixedPoint)0'), 'NFP63_BAND_ZERO', 'NFP50_EMPTY')][SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp63_relation_band'), '(CFixedPoint)1'), 'NFP63_BAND_POS1', 'NFP50_EMPTY')][SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp63_relation_band'), '(CFixedPoint)2'), 'NFP63_BAND_POS2', 'NFP50_EMPTY')][SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp63_relation_band'), '(CFixedPoint)3'), 'NFP63_BAND_POS3', 'NFP50_EMPTY')]"
 NFP65_AWAY_HALF:0 "Ao menos metade da população desse país já sabe ler e escrever. O marco merece alegria, embora não abra todos os livros de uma vez nem apague as dificuldades de ontem. A cada dia mais gente pode descobrir o que está escrito sem recorrer a um intermediário. Para o indivíduo, é independência. Para o país, é uma base mais firme para os próximos planos."
 NFP65_AWAY_THREE:0 "A alfabetização chegou a três quartos da população. Já se pode falar de ensino difundido, e não de habilidade reservada a poucos. O quarto restante, porém, não é uma mancha inconveniente no boletim. A média nada diz sobre onde se aprende com mais facilidade ou para quem a escola ainda fica fora de alcance. Reconhecê-lo não diminui a conquista."
 NFP65_AWAY_TITLE:0 "Mais leitores no exterior"
 NFP65_COMPARE_AHEAD:0 "Ainda estamos atrás desse país em alfabetização. A vantagem é deles, e seria cômodo demais dispensá-la com um «mas ao menos nós...». Dá para ter orgulho dos próprios êxitos e reconhecer os dos outros. Dos parabéns até uma boa pergunta vai um passo: o que ajudou a chegar lá e como vão as coisas em casa?"
 NFP65_COMPARE_BEHIND:0 "Nosso país continua na dianteira em alfabetização. É um detalhe agradável, reconhecemos. Mas uma conquista alheia não é convite para nos acomodarmos melhor sobre os louros. A posição superior no boletim de hoje não traz reserva vitalícia. A vantagem é boa. Melhor ainda se não virar lembrança."
 NFP65_COMPARE_EQUAL:0 "Os dois países estão agora próximos em alfabetização. Poderíamos notar com satisfação que não ficamos atrás e virar a página. Mas números parecidos não significam escolas iguais nem acesso idêntico ao ensino. Duas linhas semelhantes podem esconder histórias distintas. Compará-las seria mais interessante que proclamar solenemente um empate."
 NFP65_COMPARE_UNKNOWN:0 "Ainda faltam dados para uma comparação segura com o nosso país. Seria conveniente decidir já quem merece os maiores parabéns e quem precisa se apressar. Mas numa disputa de jornal sem resultado confiável, é fácil dar a vitória a quem a noticia. Registremos o marco sem distribuir colocações."
 NFP65_END_COLD_PARTNER:0 "Os acordos não livraram os dois países das queixas mútuas. Tanto mais vale prestar atenção em algo além de munição para a próxima discussão. O parceiro obteve um resultado na educação. Ninguém exige que passemos a estimá-lo por isso, mas seria útil entender como conseguiu."
 NFP65_END_FRIEND:0 "Podemos felicitar o parceiro sem precisar apertar os dentes durante a gentileza diplomática. Seria bom que depois dos parabéns se conversasse sobre a experiência. Copiar o número alheio para o nosso boletim ficaria mal. Aprender com o que permitiu chegar a ele é outra história."
 NFP65_END_NEUTRAL:0 "Registramos a mudança e ganhamos motivo para comparar. Veremos o que a conquista representa na vida daquele país. Enquanto isso, vale abrir nosso próprio boletim. Às vezes a notícia estrangeira faz mais bem justamente porque nos leva a ler a nacional com outros olhos."
 NFP65_END_OVERLORD:0 "Temos razões especiais para acompanhar o desenvolvimento dessa potência. Seus êxitos não passam para nós por conta própria, assim como a alfabetização não chega com a próxima instrução da capital. Uma boa experiência pode ser aproveitada. O trabalho de instruir nossa população ainda é nosso."
 NFP65_END_REBELLIOUS:0 "As relações com esse súdito estão longe de tranquilas. O crescimento da alfabetização não explica por si só o desejo de independência. Unir as duas notícias numa explicação conveniente seria fácil. Examinar cada uma em seus próprios termos dá mais trabalho, mas ajuda mais a entender o que se passa."
 NFP65_END_RIVAL:0 "Uma conquista dos outros não é uma derrota nossa. Tampouco vai desaparecer depois de uma piada certeira. Melhor felicitar o rival e abrir o nosso boletim. Gostaríamos que o espírito continuasse entre as nossas qualidades, sem virar a principal resposta aos êxitos alheios."
 NFP65_END_SUBJECT:0 "A boa notícia de um súdito merece atenção mesmo sem lembrete sobre os pagamentos devidos ao nosso Tesouro. Seu desenvolvimento vale mais que a vantagem que nos proporciona. Tomara que o marco traga mudanças que os moradores possam apreciar também fora destas páginas."
 NFP65_END_THREAT:0 "Dificilmente se poderiam chamar inofensivas as intenções desse governo para conosco. O avanço da alfabetização, por si só, não é preparação para a guerra. Ainda assim, o desenvolvimento de um país inclinado a nos pressionar merece atenção sem precisar de um toque de corneta. «É só educação» seria consolo um pouco imprudente."
 NFP65_HOME_END:0 "Ganhamos um novo motivo de orgulho. Mais gente pode ler sozinha e, entre essas pessoas e o conhecimento, há um intermediário a menos. Como chegamos ao resultado é assunto para outra matéria. Sem os detalhes, não daremos todo o crédito a uma única medida feliz.\n\nQue a história continue. Um jornal precisa de leitores. Um país precisa de gente capaz de ler mais que jornais."
 NFP65_HOME_EXPECTATIONS:0 "Há no ensino um lado menos cômodo para o governo: as pessoas passam a esperar mais da vida. A alfabetização ajuda a economia, mas não ensina ninguém a se contentar com menos. Curioso encontro de interesses. O país precisa de trabalhadores instruídos e os trabalhadores instruídos querem viver melhor. Os parabéns pelo progresso das letras dificilmente darão a conversa por encerrada."
 NFP65_HOME_HALF:0 "Ao menos metade dos habitantes de nosso país já sabe ler e escrever. A ampliação do público do jornal é só parte da notícia. Com instrução, fica mais fácil aprender novos ofícios. O país também ganha condições de pesquisar e aproveitar descobertas do exterior. As letras começam a formar mais que palavras. Formam possibilidades para a economia."
 NFP65_HOME_INTRO:0 "Ler dá jeito para muita coisa. Decifrar um aviso, abrir um livro, ler uma carta com os próprios olhos. Ou conferir exatamente o que prometeu o último discurso, sem depender de quem só se lembra dos trechos interessantes. Para uma pessoa, é habilidade de todo dia. Para um país, é mudança que merece a primeira página."
 NFP65_HOME_PROFESSION:0 "A educação amplia a escolha de trabalho. Aprender o ofício de engenheiro ou cuidar dos papéis de uma repartição fica mais fácil quando não é preciso pedir a alguém que leia cada linha. As empresas ganham a possibilidade de encontrar gente preparada; as pessoas, a de ir além do salário costumeiro. Não há promessa de emprego novo nem de boa remuneração. Mas há uma porta para a qual antes talvez faltasse a chave."
 NFP65_HOME_SCIENCE:0 "A ciência ganha espaço para trabalhar. Uma alfabetização maior permite aproveitar melhor a capacidade de pesquisa das universidades nas descobertas do país. O conhecimento de fora também se difunde mais depressa. Não basta ouvir que alguém inventou algo útil; é preciso entender como aquilo funciona. Só com gente instruída não se dá um salto científico, é claro. Só com paredes de universidade também não."
 NFP65_HOME_THREE:0 "Três quartos de nossa população já sabem ler e escrever. É uma base considerável para formar especialistas, pesquisar e entender invenções vindas de fora. O quarto restante, porém, também é gente. A beleza do boletim ainda não ensinou essas pessoas a ler."
 NFP65_HOME_TITLE:0 "Mais leitores. E não só para o nosso jornal"
 NFP65_OPEN_ALLY:0 "Nosso aliado, [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName], atingiu um novo marco na alfabetização. É bom receber do parceiro um telegrama para cuja leitura não se precisa desdobrar um mapa militar. Desta vez falamos de gente que pode ler por conta própria. Inclusive, supomos, os nossos compromissos mútuos. Uma habilidade útil aos dois lados."
 NFP65_OPEN_ALLY_BLOC:0 "Nosso aliado e parceiro de bloco, [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName], atingiu um novo marco na alfabetização. No círculo comum há mais gente capaz de ler um jornal, um tratado e as letras miúdas por baixo das promessas. Boa notícia para os parceiros. Mas pertencer ao mesmo bloco não torna nossa a realização alheia. Podemos celebrar juntos. Aprender ainda cabe a cada país em casa."
 NFP65_OPEN_BLOC:0 "Um parceiro de nosso bloco, [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName], atingiu um novo marco na alfabetização. Nem toda notícia do nosso círculo de potências diz respeito a negociações e partilhas de influência. Às vezes o motivo é o ensino. À primeira vista é assunto discreto. Para um país que pretende se desenvolver, pesa bastante. Assinaturas em acordos comuns, sozinhas, não o levarão longe."
 NFP65_OPEN_NEIGHBOR:0 "Nosso vizinho, [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName], atingiu um novo marco na alfabetização. A fronteira continua onde estava; não há necessidade de telegramas alarmados. Mas a vizinhança inclui mais que os marcos de divisa. Às vezes vale ver como andam as coisas do outro lado, sobretudo quando há motivo para comparar os êxitos de lá com os de cá."
 NFP65_OPEN_OTHER:0 "Chega de [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName] a notícia de um novo marco na alfabetização. O noticiário estrangeiro nem sempre precisa começar com guerra, escândalo ou queda de alguém. Desta vez, mais habitantes sabem ler e escrever. Acontecimento sem salva de canhões, mas com efeitos que talvez durem mais que o eco."
 NFP65_OPEN_OVERLORD:0 "Nosso suserano, [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName], atingiu um novo marco na alfabetização. Convém conhecer as mudanças na potência de que dependemos também por outras vias além das instruções enviadas de sua capital. Desta vez a notícia é de educação. Ela não muda por si só as relações entre os países, mas mostra como se desenvolve uma potência com a qual precisamos contar."
 NFP65_OPEN_RIVAL:0 "Nosso rival, [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName], atingiu um novo marco na alfabetização. Poderíamos receber a notícia com uma farpa e encerrar o assunto. Infelizmente para os apreciadores de soluções fáceis, ninguém de lá esqueceria como se lê. Antes de exercitar nosso espírito, vejamos o que aconteceu. Um fato a mais nunca fez mal à sátira de um jornal."
 NFP65_OPEN_SUBJECT:0 "Chega de um país que depende do nosso, [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName], a notícia de um novo marco na alfabetização. É fácil tratar os assuntos de lá como apêndice dos nossos: o que produz, quanto paga, se anda sossegado. Mas lá vivem pessoas, além das linhas do nosso livro-caixa. E mais dessas pessoas já podem ler o que a conta diz."
 NFP66_AWAY_CONTEXT:0 "É um resultado que merece ser levado a sério. O lugar na lista não explica como o país chegou até lá nem como se sai cada ramo de sua economia. Ainda assim, dispensar a mudança como «só uns números» seria cômodo demais. Os números também contam histórias. Especialmente quando por trás deles está uma das maiores economias do mundo."
 NFP66_AWAY_FACT:0 "Antes de entrar entre as dez maiores economias, o país ocupava a posição [ScriptContainer.GetVariableValue('nfp20_before')|0]. Agora ocupa a posição [ScriptContainer.GetVariableValue('nfp20_after')|0], com dois boletins mensais seguidos confirmando sua presença no grupo. A lista compara o tamanho das economias. Se os lugares fossem dados pelo conforto de cada casa, talvez saísse outra classificação."
 NFP66_AWAY_TITLE:0 "Um novo nome entre as dez maiores economias do mundo"
 NFP66_END_COLD_PARTNER:0 "Os acordos não encerraram nossas divergências. Também não tornaram menor a economia do parceiro. Seria mais proveitoso entender a mudança do que procurar outra explicação para afirmar que nada de interessante acontece em um país que nos desagrada."
 NFP66_END_FRIEND:0 "Cabem parabéns ao parceiro. Depois vem a pergunta interessante: no que dará esse êxito econômico e que espaço abrirá para fazer bons negócios em conjunto? Uma fotografia lado a lado na reunião é agradável. Tomara que os benefícios da parceria não terminem no retrato."
 NFP66_END_NEUTRAL:0 "Registramos a mudança e temos uma história para acompanhar. Ainda se verá o que a nova posição representa para os moradores e para as relações com o exterior. Enquanto isso, vale uma olhada também nos nossos boletins. Às vezes, o melhor de uma boa notícia alheia está nas perguntas que ela nos leva a fazer sobre nós mesmos."
 NFP66_END_OVERLORD:0 "O êxito econômico do suserano não passa automaticamente para nós. Ainda assim, precisamos conhecer os recursos da potência de que dependemos. Esperamos que desenvolver o nosso próprio país ocupe tanto espaço nos planos quanto acompanhar as conquistas do outro."
 NFP66_END_REBELLIOUS:0 "As relações com nosso súdito andam pouco tranquilas. Por isso mesmo, sua nova posição econômica merece atenção. Fazer do ingresso entre as dez maiores economias a causa do desejo de independência seria precipitado. Fingir que o tamanho daquela economia nada tem a ver com nossas relações também seria."
 NFP66_END_RIVAL:0 "O lugar de outro país entre os dez maiores não declara a nossa derrota. Mas tampouco uma boa piada bastaria para nos consolar. O rival obteve um resultado de peso. Seria agradável se a nossa próxima resposta viesse num bom boletim próprio, além de numa boa tirada."
 NFP66_END_SUBJECT:0 "Um país dependente tem uma economia própria, e convém enxergá-la. Sua nova posição dá motivo para acompanhar aquele desenvolvimento com outra coisa em mente além do próximo pagamento ao nosso Tesouro. Um êxito desses merece conversa mais ampla que outro extrato do que nos devem."
 NFP66_END_THREAT:0 "As intenções dessa potência para conosco dificilmente se diriam inocentes. Entrar entre as dez maiores economias não ergue um exército nem começa uma guerra por si só. Ignorar o que o país já pode fazer seria, contudo, um descuido. Medir a força alheia depois de uma surpresa desagradável costuma ser tarde demais."
 NFP66_HOME_CONTEXT:0 "A mudança de posição não conta toda a história. Nossa colocação depende tanto do que acontece aqui quanto do que se passa nos outros países. O essencial está no boletim: subimos, e duas observações confirmam o lugar entre os dez primeiros. Tomar isso por prova de êxito em cada ramo da economia seria generosidade demais com um relatório."
 NFP66_HOME_END:0 "E o que tiramos disso? Há motivo para orgulho. Recusá-lo porque ainda temos problemas seria estranho. Resolver que podemos esquecer os problemas seria mais estranho ainda.\n\nEntramos entre os dez primeiros. Tomara que a vida melhor também tenha conseguido passar pela porta."
 NFP66_HOME_FACT:0 "Antes de entrar entre as dez maiores economias, nosso país ocupava a posição [ScriptContainer.GetVariableValue('nfp20_before')|0]. Agora ocupa a posição [ScriptContainer.GetVariableValue('nfp20_after')|0]. Figuramos na lista por dois meses seguidos. Ou seja, não foi preciso retirar os cumprimentos assim que a tinta secou. Já é um bom começo."
 NFP66_HOME_INTRO:0 "Nosso país entrou entre as dez maiores economias do mundo. Boa notícia para quem procura nos boletins internacionais um motivo de orgulho nacional. Desta vez, achou. Podemos endireitar as costas, acertar o colarinho e dar uma olhada mais demorada no resultado. De preferência antes dos discursos."
 NFP66_HOME_LIVING:0 "Para quem mora aqui, uma boa posição na lista ainda não traz conforto extra para casa. É agradável saber que vivemos em uma das maiores economias do mundo. Mas o comerciante ainda pede dinheiro, e dificilmente aceitará nossa colocação no boletim como pagamento. Tomara que o peso econômico do país se perceba também nas coisas que podemos comprar."
 NFP66_HOME_POTENTIAL:0 "Uma economia grande abre possibilidades. Por trás da soma há empresas, trabalho e mercadorias, coisas de que se faz a vida cotidiana. Para o Estado, é uma base sobre a qual fazer planos. Entre «temos os meios» e «soubemos usá-los», porém, costuma haver bastante trabalho de governo. A posição conquistada não o fará em nosso lugar."
 NFP66_HOME_TITLE:0 "Nossa economia entre as dez maiores do mundo"
 NFP66_OPEN_ALLY:0 "Nosso aliado, [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName], entrou entre as dez maiores economias do mundo. O parceiro tem do que se orgulhar na próxima reunião. É bom quando os compromissos comuns vêm acompanhados de uma economia desse porte. A conquista, porém, fica na conta dele. Amizade é amizade, e cada país tem seu livro-caixa."
 NFP66_OPEN_ALLY_BLOC:0 "Nosso aliado e parceiro de bloco, [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName], entrou entre as dez maiores economias do mundo. Eis mais uma ocasião para discursos em nosso círculo. Seria bom se viessem depois negócios de proveito. Um bloco comum pode oferecer mais que uma bela lista de nomes."
 NFP66_OPEN_BLOC:0 "Um parceiro de nosso bloco, [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName], entrou entre as dez maiores economias do mundo. É uma mudança de peso no grupo. O lugar na tabela não põe dinheiro automaticamente no nosso Tesouro. Mas dá motivo para acompanhar melhor um país ao qual nos ligam compromissos comuns."
 NFP66_OPEN_NEIGHBOR:0 "Nosso vizinho, [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName], entrou entre as dez maiores economias do mundo. Do outro lado da fronteira há um novo motivo de orgulho. Os vizinhos têm mesmo o hábito de nos fazer olhar para os nossos próprios assuntos. Às vezes, com declarações ruidosas. Desta vez, com uma posição na tabela econômica."
 NFP66_OPEN_OTHER:0 "[ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName] entrou entre as dez maiores economias do mundo. Um nome novo na lista merece uma olhada mais atenta às mudanças lá fora. Um pronunciamento sonoro raramente basta para medir o peso econômico de um país. A comparação internacional dá um pouco mais de assunto à conversa."
 NFP66_OPEN_OVERLORD:0 "Nosso suserano, [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName], entrou entre as dez maiores economias do mundo. Já tínhamos razões para conhecer seus recursos sem precisar de um lembrete vindo da capital. Agora temos também uma nova colocação nas tabelas internacionais. Para a potência de que dependemos, é um detalhe considerável."
 NFP66_OPEN_RIVAL:0 "Nosso rival, [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName], entrou entre as dez maiores economias do mundo. Talvez demore um pouco encontrar as palavras calorosas para o cumprimento. A falta delas, porém, dificilmente alterará a posição conquistada. Antes de explicar por que o êxito alheio não vale nada, convém ao menos ler o que foi alcançado."
 NFP66_OPEN_SUBJECT:0 "Chega de um país que depende de nós, [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName], a notícia de que sua economia está entre as dez maiores do mundo. Mais um motivo para olhar aquele país com atenção. A conhecida linha sobre a subordinação pode esconder de nós o tamanho da sua economia. A tabela internacional, pelo visto, reparou."
 NFP67_AWAY_FACT:0 "Antes de entrar entre os três primeiros, o país ocupava a posição [ScriptContainer.GetVariableValue('nfp20_before')|0]. Agora está na posição [ScriptContainer.GetVariableValue('nfp20_after')|0]. São dois boletins mensais seguidos entre os maiores produtores."
 NFP67_AWAY_FIRST:0 "Pelo volume produzido, o país encabeça a lista mundial. Não se trata apenas de aparecer entre os líderes: no boletim atual, ninguém está acima."
 NFP67_AWAY_TITLE:0 "Um novo nome entre os três maiores produtores"
 NFP67_AWAY_TOP:0 "A liderança mundial ainda escapa, mas o país conquistou lugar entre os grandes produtores. Desprezar o resultado só porque não veio em primeiro seria uma maneira estranha de nos consolar."
 NFP67_END_COLD_PARTNER:0 "Não faltam queixas entre os países. Nenhuma delas reduz a quantidade produzida. Comparar os resultados talvez seja mais útil que provar mais uma vez que um parceiro incômodo não consegue fazer nada digno de nota."
 NFP67_END_FRIEND:0 "O parceiro merece parabéns. Seria bom se, depois das gentilezas, houvesse lugar para negociações proveitosas a ambos. A amizade entre governos e os negócios das empresas nem sempre andam de mãos dadas. Nem por isso o resultado perde interesse."
 NFP67_END_NEUTRAL:0 "Registramos a mudança e comparamos o nosso resultado. Vale acompanhar o capítulo seguinte. Num ramo em que também somos um grande produtor, uma boa notícia do exterior é um excelente motivo para examinar a situação em casa."
 NFP67_END_OVERLORD:0 "O êxito industrial do suserano não se torna automaticamente nosso. Ainda assim, é útil comparar as possibilidades dos dois países. Gostaríamos de entender nosso lugar no setor pelo resultado do nosso trabalho, além da posição que ocupamos na relação de dependência."
 NFP67_END_RIVAL:0 "Um êxito alheio não nos obriga a conceder derrota no ato. Dá, porém, um bom motivo para olhar nossa própria produção. Tomara que a próxima resposta possa ser vista tanto pelos leitores deste jornal quanto por quem organiza as tabelas de produção."
 NFP67_END_SUBJECT:0 "Um país dependente tem economia própria. A nova posição merece atenção sem que precisemos começar perguntando quanto nosso Tesouro pode extrair dela. E, se há tensão nas relações, tanto menos cabe tratar as possibilidades daquele país como um detalhe sem importância."
 NFP67_END_THREAT:0 "Temos motivo especial para acompanhar as capacidades dessa potência. O volume produzido não revela que uso se dará ao produto nem o que pretendem os produtores. Mas ignorar a força produtiva de um país disposto a nos pressionar seria descuido."
 NFP67_EQUAL:0 "Nossa produção é aproximadamente igual. Não se trata de um líder distante diante do qual só resta suspirar. Os resultados estão próximos, o que torna o próximo capítulo ainda mais interessante. A supremacia nas colunas do jornal pode ser proclamada hoje mesmo. Na produção, ainda precisa ser conquistada."
 NFP67_HOME_END:0 "E o que tiramos disso? Entramos entre os três maiores produtores do mundo. Que se faça mais que carimbar o fato com um belo selo. É mais agradável dar continuidade ao sucesso que viver da lembrança dele.\n\nUm terceiro ou segundo lugar já é conquista. Como razão para parar, porém, deixa a desejar."
 NFP67_HOME_FACT:0 "Antes de entrar no grupo dos três maiores, nosso país ocupava a posição [ScriptContainer.GetVariableValue('nfp20_before')|0]. Agora ocupa a posição [ScriptContainer.GetVariableValue('nfp20_after')|0]. Já figuramos na lista em dois boletins mensais seguidos. Não foi preciso retirar os parabéns na contagem seguinte. Conservar o lugar é assunto para os próximos capítulos."
 NFP67_HOME_FIRST_END:0 "E o que tiramos disso? O primeiro lugar merece parabéns. A produção ainda precisará continuar depois deles. Os louros enfeitam a festa, mas não substituem matéria-prima nem equipamento em funcionamento.\n\nChegamos ao topo da lista. Tomara que conservemos o lugar também fora dos discursos de comemoração."
 NFP67_HOME_FIRST_INTRO:0 "Nosso país se tornou o maior produtor mundial de [Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]. Na tabela atual, não há ninguém acima. Uma linha agradável para o orgulho nacional. Esperamos que os parabéns deixem espaço para quem, trabalhando todos os dias, tornou possível escrevê-la."
 NFP67_HOME_FIRST_TITLE:0 "O primeiro lugar é nosso"
 NFP67_HOME_INTRO:0 "Nosso país entrou entre os três maiores produtores mundiais de [Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]. Dá gosto receber uma notícia em que a economia não venha acompanhada de «voltou a faltar». Desta vez, o motivo é outro. O volume produzido nos põe entre os líderes mundiais. Há do que se orgulhar. Vejamos o que há por trás disso."
 NFP67_HOME_LIMIT:0 "Produzir muito não responde a toda pergunta sobre a economia. A venda deu lucro? Sobrou o suficiente em casa? O trabalho foi bem pago? São outras partes da mesma história. O lugar entre os três primeiros não as verificou por nós. Mas a conquista conserva o valor. Entre os produtores do mundo, o país tem agora um motivo de orgulho bastante concreto."
 NFP67_HOME_TITLE:0 "Nossa produção entre as três maiores do mundo"
 NFP67_HOME_WORK:0 "Por trás do lugar na lista há produção de verdade. A mercadoria não aparece porque o boletim foi bem redigido. As empresas empregam gente, consomem material e resolvem os problemas de todo dia. A tabela internacional registra a obra conjunta. Convém lembrar que ela é feita de jornadas de trabalho que raramente ganham discurso solene."
 NFP67_LESS:0 "Nossa produção é cerca de [ScriptContainer.GetVariableValue('nfp67_output_abs')|0]% menor. Hoje, o outro país produz mais dessa mercadoria. Não estamos comparando lucros nem o bem-estar dos trabalhadores. Há, contudo, uma diferença clara nos resultados que convém reduzir. Será interessante ver nossa resposta para além das explicações de por que não se deveria ter feito a comparação."
 NFP67_MORE:0 "Nossa produção é cerca de [ScriptContainer.GetVariableValue('nfp67_output_abs')|0]% maior. A notícia agrada, sem dúvida. Mas o ingresso de outro país entre os três maiores é motivo para acompanhar o ramo, não para ajeitar os louros com um sorriso condescendente. A vantagem se conserva melhor pelo trabalho que pelo hábito de recordá-la."
 NFP67_OPEN_ALLY:0 "Nosso aliado, [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName], entrou entre os três maiores produtores mundiais de [Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]. Tem aí do que se gabar. E o ramo tampouco nos é indiferente: estamos entre os cinco maiores produtores desse bem. Os parabéns vão, portanto, com certo interesse profissional... E uma pontinha de inveja."
 NFP67_OPEN_ALLY_BLOC:0 "Nosso aliado e parceiro de bloco, [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName], entrou entre os três maiores produtores mundiais de [Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]. Mais um êxito da produção no círculo comum. O bloco, porém, não torna nossas as fábricas de lá. Razão a mais para comparar os resultados dos dois países."
 NFP67_OPEN_BLOC:0 "Um parceiro de nosso bloco, [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName], entrou entre os três maiores produtores mundiais de [Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]. Trata-se de um ramo no qual também ocupamos posição considerável. Há, pois, assunto mais proveitoso que outra troca de garantias sobre a prosperidade comum."
 NFP67_OPEN_NEIGHBOR:0 "Nosso vizinho, [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName], entrou entre os três maiores produtores mundiais de [Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]. Do outro lado da fronteira há um novo motivo de orgulho econômico. E desta vez a mercadoria está entre aquelas de que somos um dos cinco maiores produtores. Há o que comparar, sem disputar quem felicita mais alto."
 NFP67_OPEN_OTHER:0 "O país [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName] entrou entre os três maiores produtores mundiais de [Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]. Está longe de ser um detalhe casual da economia alheia. Nós mesmos figuramos entre os cinco maiores produtores dessa mercadoria, bom motivo para acompanhar o ramo de perto."
 NFP67_OPEN_OVERLORD:0 "Nosso suserano, [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName], entrou entre os três maiores produtores mundiais de [Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]. Também produzimos uma quantidade importante dessa mercadoria. A notícia, portanto, interessa por motivos que vão além da dependência. Temos uma razão bastante concreta para comparar resultados."
 NFP67_OPEN_RIVAL:0 "Nosso rival, [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName], entrou entre os três maiores produtores mundiais de [Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]. Nesse ramo temos interesses e produção próprios. Descartar a notícia com o costumeiro «nada de especial» seria cômodo demais. Vejamos o que alcançaram e como nos saímos na comparação."
 NFP67_OPEN_SUBJECT:0 "Um país que depende de nós, [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName], entrou entre os três maiores produtores mundiais de [Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]. Por trás da velha linha sobre a subordinação é fácil deixar de ver as possibilidades daquele país. O boletim de produção nos convida a recordá-las, e justo em um ramo importante também para a nossa economia."
 NFP67_UNKNOWN:0 "Ainda não é possível comparar os volumes com segurança. Conhecemos as posições, mas não inventaremos o tamanho da diferença. Para discutir nossas possibilidades são necessários números nossos, além da impressão causada pelo resultado de outro país."
 NFP68_AWAY_CONTEXT_DOWN:0 "As possibilidades do país diminuíram, mas seria cedo para riscá-lo das contas. A categoria internacional não substitui o conhecimento da economia, do exército e dos acordos que mantém. Resumir tudo isso num título curto seria cômodo. Também seria fácil errar, especialmente se assentarmos nossos planos sobre esse resumo."
 NFP68_AWAY_CONTEXT_RECOG:0 "O país conquistou uma posição melhor para seguir se desenvolvendo. Ainda veremos se alcança quem antes o olhava de cima. Mas a velha explicação de que seria de algum modo inferior já não basta. Será preciso examinar seus assuntos. Aliás, já antes teria sido um bom começo."
 NFP68_AWAY_CONTEXT_UP:0 "O país ganhou espaço para conduzir sua política. Vale lembrar disso nos nossos planos. A nova posição não traz sozinha um acordo útil nem um confronto indesejado. Mas a ideia que fazíamos dessa potência pode estar ficando atrás do que ela é capaz de fazer hoje."
 NFP68_AWAY_FACT_DOWN:0 "A categoria anterior era «[Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]». A nova é «[Localize(ScriptContainer.MakeScope.Var('nfp20_extra_detail').GetFlagName)]». A queda de posição reduz as possibilidades diplomáticas. Ainda não se pode falar em Tesouro vazio nem em exército incapaz. Uma categoria por si só não basta para essas conclusões. Mas o peso anterior também já não pode entrar nas contas como uma constante."
 NFP68_AWAY_FACT_GP_DOWN:0 "A categoria anterior era «Grande potência». A nova é «[Localize(ScriptContainer.MakeScope.Var('nfp20_extra_detail').GetFlagName)]». O país saiu do círculo mais alto. Seus feitos não sumiram, e menos ainda o próprio país. Ainda assim, seria estranho contar com as possibilidades internacionais de antes como se nada tivesse acontecido."
 NFP68_AWAY_FACT_GP_UP:0 "A categoria anterior era «[Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]». A nova é «Grande potência». O país ingressou no grupo com mais possibilidades diplomáticas. Declará-lo senhor da política mundial seria um cumprimento generoso. Fingir que só mudou o nome seria um presente igualmente generoso ao nosso sossego."
 NFP68_AWAY_FACT_RECOG:0 "A categoria anterior era «[Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]». A nova é «[Localize(ScriptContainer.MakeScope.Var('nfp20_extra_detail').GetFlagName)]». O país entrou no grupo das potências reconhecidas. Mudou mais que o título. Na posição anterior, encontrava condições menos favoráveis em várias áreas. Um obstáculo ficou para trás. O uso que fará da mudança é assunto da próxima história."
 NFP68_AWAY_FACT_UP:0 "A categoria anterior era «[Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]». A nova é «[Localize(ScriptContainer.MakeScope.Var('nfp20_extra_detail').GetFlagName)]». A posição melhorou e as possibilidades diplomáticas cresceram. Isso não significa que toda proposta que saia daquela capital receberá aprovação imediata. Mas há mais influência para sustentar os planos."
 NFP68_AWAY_TITLE_DOWN:0 "O peso do nome, com menos força para sustentá-lo"
 NFP68_AWAY_TITLE_RECOG:0 "Mais um nome entre as potências reconhecidas"
 NFP68_AWAY_TITLE_UP:0 "Apertou-se o espaço entre as potências"
 NFP68_END_COLD_DOWN:0 "Com as relações como andam, seria fácil festejar o revés. Mais difícil é decidir com sensatez o que fazer nos assuntos comuns. Enquanto houver acordos, as possibilidades do parceiro também entram nos nossos planos. Evitemos uma comemoração que o primeiro cálculo do nosso próprio interesse poderia estragar."
 NFP68_END_COLD_UP:0 "Os compromissos entre os países não apagaram as queixas mútuas. Nem por isso as queixas apagam as novas possibilidades do parceiro incômodo. Examiná-las vale mais que inventar razões para desprezar o êxito. Especialmente se depois tivermos de voltar à mesa de negociações com o mesmo país."
 NFP68_END_FRIEND_DOWN:0 "É notícia desagradável para o nosso círculo. Mas uma aliança tem outros usos além de recitar sucessos em conjunto. Vale entender como mudaram os recursos do parceiro e o que isso significa para os planos comuns. O título perdeu um pouco do brilho. Tomara que se ganhe em entendimento."
 NFP68_END_FRIEND_UP:0 "O parceiro merece parabéns. Seria bom que, depois das gentilezas, houvesse espaço para negociações proveitosas a ambos. As novas possibilidades dele não se tornam automaticamente nossas. Ainda assim, a ocasião de buscar vantagem comum merece mais que uma carta elegante."
 NFP68_END_NEUTRAL_DOWN:0 "Mudou o boletim mundial e cabe tomar nota. Sem examinar o que se passou, não culparemos o outro país por supostos erros. Tampouco faz sentido guardar uma imagem antiga só porque é familiar. Os mapas envelhecem até quando as fronteiras ficam no lugar."
 NFP68_END_NEUTRAL_UP:0 "Registramos a mudança. Agora acompanharemos o que vier. O país tem mais motivo para contar com as próprias forças; nós, para conferir as premissas antigas à luz da situação atual. O noticiário internacional presta bom serviço quando ajuda a corrigir nossas contas a tempo."
 NFP68_END_OVERLORD_DOWN:0 "A nova posição merece atenção, sem promessas apressadas. A mudança de categoria, por si só, não põe fim à nossa dependência. Antes de anunciar que se abriram todas as portas, convém saber quais estavam trancadas e o que aconteceu às fechaduras."
 NFP68_END_OVERLORD_UP:0 "O êxito dele não passa automaticamente para nós. Ainda assim, precisamos entender os recursos da potência da qual dependemos. Tomara que acompanhar sua ascensão deixe espaço também para os nossos planos. Um grande nome alheio não traz pronto o futuro do nosso país."
 NFP68_END_REBELLIOUS:0 "As relações com esse súdito já trazem bastante assunto sobre independência. A nova categoria não explica a aspiração nem decide seu desfecho. Mas discutir o futuro do país sem levar em conta o que mudou em suas possibilidades seria um hábito cômodo demais. Sobretudo para nós."
 NFP68_END_RIVAL_DOWN:0 "O revés do rival certamente encontrará por aqui quem o leia com gosto. A redação entende o sentimento. Só não concluiremos desde já que o rival perdeu toda capacidade de agir. A complacência se compra barato. As consequências podem sair bem mais caras."
 NFP68_END_RIVAL_UP:0 "Temos motivo para olhar mais de perto as nossas possibilidades. Um país pouco amistoso obteve um resultado que nenhuma piada desfaz. Gostaríamos de ver nossa resposta também na coluna das conquistas. Ganhar um concurso de tiradas é agradável, mas não acrescenta influência diplomática."
 NFP68_END_SUBJECT_DOWN:0 "O fato de ter perdido a posição anterior não faz das dificuldades do súdito um assunto exclusivamente alheio. É fácil esperar que cumpra fielmente todas as obrigações. De vez em quando vale olhar de que meios dispõe agora para tanto."
 NFP68_END_SUBJECT_UP:0 "Por trás da relação de dependência há um país com desenvolvimento próprio. Suas novas possibilidades merecem interesse além da pergunta sobre quanto mais renderão ao nosso Tesouro. Tomara que nosso conhecimento do país cresça pelo menos tão depressa quanto nossas expectativas."
 NFP68_END_THREAT:0 "Dificilmente se poderiam chamar inofensivas as intenções que aquele governo tem para conosco. As mudanças em seus recursos merecem atenção redobrada. Uma categoria nova não declara guerra, e a perda da antiga não garante a paz. É melhor entender quem temos diante de nós que procurar todas as respostas no título do país."
 NFP68_HOME_CONTEXT_DOWN:0 "Nosso país dispõe de menos possibilidades diplomáticas. Ainda podemos decidir por conta própria, mas é hora de rever a certeza de que todos nos ouvirão de qualquer jeito. Seria bom chamar a atenção pelo que podemos oferecer, além do volume da voz com que recordamos a posição antiga."
 NFP68_HOME_CONTEXT_GP_DOWN:0 "Saímos do círculo das grandes potências. Junto com a posição antiga foi embora parte da capacidade de influir nos assuntos internacionais. Os vizinhos não deixarão todos de responder às cartas amanhã. Mas contar apenas com o peso que o nosso nome já teve seria ingênuo demais. Sobretudo para quem terá de explicar aonde foi esse peso."
 NFP68_HOME_CONTEXT_GP_UP:0 "Entramos entre as grandes potências. Há mais espaço para conduzir nossa diplomacia e mais influência para sustentar as propostas. É bom ter o que pôr por trás das palavras. Agora queremos saber que projetos julgaremos dignos dessas possibilidades. A grandeza fica melhor nos resultados que no tamanho das letras do título."
 NFP68_HOME_CONTEXT_RECOG:0 "A distinção anterior pesava em mais que o orgulho. O país sem reconhecimento encontrava condições piores, inclusive para tomar empréstimos e receber conhecimentos do exterior. Isso mudou. Não se conclui daí que o Tesouro já respire aliviado ou que toda descoberta chegue mais depressa. Mas um obstáculo saiu do caminho. Bom começo."
 NFP68_HOME_CONTEXT_UP:0 "A nova posição abre mais possibilidades diplomáticas para o país. Não entrega sozinha um bom acordo nem transforma todo interlocutor em amigo. Dá, sim, mais espaço para decisões próprias. Tomara que o aproveitemos antes que os discursos de parabéns ocupem o espaço inteiro."
 NFP68_HOME_END_DOWN:0 "E o que tiramos disso? Mais vale reparar na mudança incômoda do que se ofender com o boletim. As causas ainda pedem exame. Encontrá-las será mais útil que provar que nunca gostamos tanto assim da posição anterior.\n\nO título ficou mais modesto. Tomara que os nossos planos não o imitem."
 NFP68_HOME_END_RECOG:0 "E o que tiramos disso? Vale celebrar o reconhecimento. Depois podemos tratar dos motivos pelos quais queríamos uma posição melhor. As possibilidades abertas dão mais gosto quando se faz uso delas.\n\nUma porta se abriu diante de nós. Seria estranho passar o dia discutindo a plaquinha nela pendurada."
 NFP68_HOME_END_UP:0 "E o que tiramos disso? Há motivo para orgulho. Só esperamos que a nova posição ajude a responder às velhas questões, em vez de servir de resposta cômoda para todas elas.\n\nNosso país ganhou peso. Tomara que se perceba também fora da leitura dos seus títulos."
 NFP68_HOME_FACT:0 "Nossa categoria anterior era «[Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]». A nova é «[Localize(ScriptContainer.MakeScope.Var('nfp20_extra_detail').GetFlagName)]». É essa a mudança registrada no último boletim. Ela descreve nossa posição entre as potências. Merece atenção, embora não diga sozinha quais conquistas, ou dificuldades, nos trouxeram até aqui."
 NFP68_HOME_INTRO_DOWN:0 "Nosso país perdeu a posição que ocupava entre as potências. Não é notícia que se queira imprimir ao lado de uma gravura festiva. Podemos declarar, é claro, que nunca demos muita importância às listas estrangeiras. Mas, quando o nosso lugar era mais alto, lembrávamos dele com prazer visivelmente maior."
 NFP68_HOME_INTRO_NEUTRAL:0 "Nosso país passou a outra categoria internacional. O boletim registra uma mudança que merece ser entendida antes dos parabéns ou dos pêsames."
 NFP68_HOME_INTRO_RECOG:0 "Nosso país passou a figurar entre as potências reconhecidas. Não é como se antes ninguém vivesse, trabalhasse ou fizesse planos aqui. Mas nos assuntos internacionais, às vezes existir é pouco. Convém que os outros também consintam em notar. A antiga designação ficou para trás. Vejamos o que muda com ela."
 NFP68_HOME_INTRO_UP:0 "Nosso país subiu um degrau entre as potências. Boa notícia, sobretudo para quem já se cansava de procurar a pátria depois das palavras «e outros». O orgulho nacional ganhou mais um motivo para endireitar os ombros. Esperemos que nossas possibilidades também cresçam um pouco."
 NFP68_HOME_TITLE_DOWN:0 "Título mais modesto. E os negócios do país?"
 NFP68_HOME_TITLE_RECOG:0 "Enfim, reconheceram nossa presença"
 NFP68_HOME_TITLE_UP:0 "Agora terão de contar conosco"
 NFP68_NEUTRAL_CONTEXT:0 "A mudança merece exame próprio. Um nome de categoria pode encobrir circunstâncias diferentes. Ainda não vamos escolher de antemão a explicação mais conveniente."
 NFP68_NEUTRAL_END:0 "Acompanharemos os próximos passos do país. Dirão mais sobre suas possibilidades do que tentar adivinhar a história inteira por uma única linha do boletim."
 NFP68_NEUTRAL_FACT:0 "A categoria anterior era «[Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]». A nova é «[Localize(ScriptContainer.MakeScope.Var('nfp20_extra_detail').GetFlagName)]». Só a diferença entre os nomes não esclarece se o país ficou mais forte ou mais fraco."
 NFP68_NEUTRAL_TITLE:0 "Mudou a posição do país"
 NFP68_OPEN_ALLY:0 "Nosso aliado, [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName], ganhou outra categoria internacional. Isso merece mais atenção que uma troca de lugares numa lista estrangeira. É mais fácil avaliar os planos comuns quando conhecemos os recursos do parceiro. Um tratado de aliança, é claro, não é balança. Mesmo assim, é bom saber quanto pesa o aliado."
 NFP68_OPEN_ALLY_BLOC:0 "Nosso aliado e parceiro de bloco, [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName], tem uma nova posição internacional. Ligam-nos compromissos suficientes para não dispensar a mudança com um «isso é assunto deles». Deles, claro. Mas quando os planos são comuns, as forças do outro logo entram nas nossas contas."
 NFP68_OPEN_BLOC:0 "Um parceiro de nosso bloco de poder, [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName], mudou de posição entre as potências. A companhia é a mesma, mas mudou o peso de um de seus integrantes. Um detalhe considerável para discutir os assuntos comuns. Afinal, um bloco vale por mais que a contagem dos nomes sob a bandeira."
 NFP68_OPEN_NEIGHBOR:0 "Nosso vizinho, [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName], tem uma nova posição internacional. Os marcos da fronteira ficaram no lugar. Há, porém, um motivo para olhar melhor quem está do outro lado. Dizem que vizinho não se escolhe. Felizmente o ditado não proíbe acompanhar seus negócios."
 NFP68_OPEN_OTHER:0 "Chega de [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName] a notícia de uma mudança de posição internacional. Mudou a distribuição de peso entre as potências, e a notícia ganhou lugar nesta edição. A nova categoria, sozinha, não explica o que ocorreu. Mas nos dá um motivo concreto para investigar."
 NFP68_OPEN_OVERLORD:0 "Nosso suserano, [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName], mudou de posição internacional. As obrigações entre as capitais não tornam a notícia nossa. Tampouco ela é de todo alheia. As possibilidades da potência de que dependemos merecem atenção mesmo sem um lembrete especial vindo de lá."
 NFP68_OPEN_RIVAL:0 "Nosso rival, [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName], ocupa hoje outra posição entre as potências. Antes de nos alegrarmos ou lamentarmos, vale ler o que mudou. O título alheio não acrescenta nem tira força do nosso país. Já as possibilidades do país com que disputamos podem ser informação importante para o futuro."
 NFP68_OPEN_SUBJECT:0 "Chega de nosso súdito, [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName], a notícia de uma nova categoria internacional. Por trás da conhecida linha sobre a subordinação, é fácil deixar de ver os recursos daquele país. Sua posição muda mesmo assim. Convém entender o que acontece para além do próximo balanço dos pagamentos."
 NFP69_FACT:0 "No país [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName], a lei «[Localize(ScriptContainer.MakeScope.Var('nfp69_old').GetFlagName)]» deu lugar à lei «[Localize(ScriptContainer.MakeScope.Var('nfp69_new').GetFlagName)]».\n\n[Localize(ScriptContainer.MakeScope.Var('nfp69_topic').GetFlagName)]"
 NFP69_HOME_OPEN:0 "Mudou a lei do nosso país. As regras de ontem deram lugar a outras. Uns talvez esperassem a mudança havia muito tempo; outros terão de rever os planos. Antes de tirar conclusões, vejamos o que diz a nova lei."
 NFP69_LIMIT:0 "As novas regras já foram aprovadas. Agora interessa ver o que muda na vida do país. Publicar o decreto é só parte da história. Voltaremos a ela quando houver algo a contar além das linhas escritas na lei."
 NFP69_OPEN_ALLY:0 "Chega de nosso aliado, [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName], a notícia de uma nova lei. É fácil discutir as regras alheias à distância. Mais útil é ler primeiro o que mudou. Às vezes a leitura também nos deixa com perguntas sobre as nossas."
 NFP69_OPEN_ALLY_BLOC:0 "Chega de nosso aliado e parceiro de bloco, [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName], a notícia de uma nova lei. É fácil discutir as regras alheias à distância. Mais útil é ler primeiro o que mudou. Às vezes a leitura também nos deixa com perguntas sobre as nossas."
 NFP69_OPEN_BLOC:0 "Chega de um parceiro do nosso bloco, [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName], a notícia de uma nova lei. É fácil discutir as regras alheias à distância. Mais útil é ler primeiro o que mudou. Às vezes a leitura também nos deixa com perguntas sobre as nossas."
 NFP69_OPEN_NEIGHBOR:0 "Chega de nosso vizinho, [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName], a notícia de uma nova lei. É fácil discutir as regras alheias à distância. Mais útil é ler primeiro o que mudou. Às vezes a leitura também nos deixa com perguntas sobre as nossas."
 NFP69_OPEN_OTHER:0 "Chega de um país estrangeiro, [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName], a notícia de uma nova lei. É fácil discutir as regras alheias à distância. Mais útil é ler primeiro o que mudou. Às vezes a leitura também nos deixa com perguntas sobre as nossas."
 NFP69_OPEN_OVERLORD:0 "Chega de nosso suserano, [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName], a notícia de uma nova lei. É fácil discutir as regras alheias à distância. Mais útil é ler primeiro o que mudou. Às vezes a leitura também nos deixa com perguntas sobre as nossas."
 NFP69_OPEN_RIVAL:0 "Chega de nosso rival, [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName], a notícia de uma nova lei. É fácil discutir as regras alheias à distância. Mais útil é ler primeiro o que mudou. Às vezes a leitura também nos deixa com perguntas sobre as nossas."
 NFP69_OPEN_SUBJECT:0 "Chega de um país que depende do nosso, [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName], a notícia de uma nova lei. É fácil discutir as regras alheias à distância. Mais útil é ler primeiro o que mudou. Às vezes a leitura também nos deixa com perguntas sobre as nossas."
 NFP69_POLICY_LAW_AFFIRMATIVE_ACTION:0 "A lei concede apoio especial a grupos que por muito tempo ficaram à margem da vida pública. A igualdade passa a incluir meios de superar desigualdades acumuladas. Uma placa dizendo que a entrada é para todos, sozinha, pouco faria."
 NFP69_POLICY_LAW_AGRARIANISM:0 "A política econômica dá preferência à lavoura e às comunidades rurais. Para encontrar o centro das atenções do governo, mais vale procurar no campo que à porta de uma fábrica."
 NFP69_POLICY_LAW_ANARCHY:0 "As comunidades governam a si mesmas e enviam delegados temporários aos conselhos comuns. Sem uma hierarquia permanente de comando, tomar decisões exige chegar a um entendimento entre as comunidades."
 NFP69_POLICY_LAW_ANTI_STRIKE_LAWS:0 "Os trabalhadores podem se organizar, mas as greves e parte das reivindicações coletivas continuam proibidas. A organização tem licença para existir. Para pressionar, dispõe de bem menos instrumentos."
 NFP69_POLICY_LAW_APPOINTED_BUREAUCRATS:0 "O governo nomeia funcionários e lhes paga um salário pelo serviço público. Quem assina a nomeação também é quem lhes cobrará o trabalho."
 NFP69_POLICY_LAW_AUTOCRACY:0 "A autoridade suprema pertence ao chefe de Estado, que não presta contas a outro poder terreno. Ainda não se sabe qual será a próxima disputa, mas já se sabe quem terá a última palavra."
 NFP69_POLICY_LAW_BAKUFU:0 "O xogum governa em nome do imperador e exerce o poder em toda a sua extensão. Uma coisa é o nome que encabeça os documentos, outra é a mão que decide o que escrever neles."
 NFP69_POLICY_LAW_CAESAROPAPISM:0 "A Igreja Ortodoxa conserva seus altares, mas é o Estado que dá a última palavra em seus assuntos. As demais confissões têm menos direitos perante a lei."
 NFP69_POLICY_LAW_CANTON_SYSTEM:0 "O comércio exterior só pode passar por uma região do litoral. A mercadoria estrangeira ganha uma porta estreita, bem ao alcance dos olhos do governo."
 NFP69_POLICY_LAW_CENSORSHIP:0 "A imprensa passa pelo censor e o direito de reunião não é reconhecido. Entre a pena do jornalista e os olhos do leitor, a autoridade pode interromper a viagem de uma frase."
 NFP69_POLICY_LAW_CENSUS_VOTING:0 "Podem votar os homens instruídos que atendem aos requisitos do censo. Para entrar na lista, contam tanto a instrução quanto a posição que se ocupa na sociedade."
 NFP69_POLICY_LAW_CHARITABLE_HEALTH_SYSTEM:0 "O cuidado dos doentes cabe às instituições de caridade, entre elas as religiosas. Como a assistência depende dos recursos de quem se dispõe a ajudar, uma doação pode significar tratamento."
 NFP69_POLICY_LAW_CHIEFDOM:0 "O governo se apoia nos laços de parentesco e em um chefe ou ancião de linhagem distinta. Seu prestígio e o da família fazem as vezes de uma administração capaz de governar grandes territórios."
 NFP69_POLICY_LAW_CHIEFS_DISTRIBUTE_AID:0 "Os chefes distribuem auxílio a parentes em necessidade, instituições religiosas e guerreiros. Quem precisa dos recursos comuns depende das decisões das lideranças do clã."
 NFP69_POLICY_LAW_CHILD_LABOR_ALLOWED:0 "A lei não estabelece restrições específicas aos locais onde crianças podem trabalhar. O trabalho infantil segue fazendo parte da economia, inclusive em ocupações perigosas para a idade."
 NFP69_POLICY_LAW_CLOSED_BORDERS:0 "Fica proibido entrar ou sair do país para mudar de residência. A fronteira barra tanto quem procura vida nova lá fora quanto quem gostaria de se estabelecer aqui."
 NFP69_POLICY_LAW_COLLECTIVIZED_AGRICULTURE:0 "Os agricultores cultivam a terra em coletivos. A parcela passa a ser uma empresa comum, e organizar o trabalho é assunto de todos os que a cultivam."
 NFP69_POLICY_LAW_COLONIAL_ADMINISTRATION:0 "A administração governa o território em nome da metrópole. O Estado local carece de soberania própria e só pode decidir dentro dos poderes que lhe foram concedidos de fora."
 NFP69_POLICY_LAW_COLONIAL_EXPLOITATION:0 "A política colonial privilegia a exploração de recursos naturais e de mão de obra barata. O que orienta o governo é o rendimento das possessões, bem antes da sorte de um lote de colono."
 NFP69_POLICY_LAW_COLONIAL_RESETTLEMENT:0 "As colônias destinam-se sobretudo aos colonos vindos das regiões incorporadas do país. A questão da terra atravessa o oceano: as novas possessões são vistas como lugar para abrir propriedades."
 NFP69_POLICY_LAW_COLONIAL_SLAVERY:0 "A escravidão é permitida nas colônias, mas a pessoa escravizada torna-se livre ao pisar na metrópole. Um mesmo Estado reserva destinos jurídicos diferentes a quem atravessa o próprio território."
 NFP69_POLICY_LAW_COMBINATION_ACTS:0 "A lei proíbe toda associação de trabalhadores. Trabalhar lado a lado é permitido. Organizar-se para defender um interesse comum já é outra história."
 NFP69_POLICY_LAW_COMMAND_ECONOMY:0 "O governo dirige diretamente a maior parte da produção. As grandes decisões econômicas chegam às repartições públicas, de onde sairão os rumos das empresas."
 NFP69_POLICY_LAW_COMMERCIALIZED_AGRICULTURE:0 "A lavoura se organiza como negócio voltado ao mercado, nas mãos de investidores. O campo entra nas mesmas contas de investimento e rendimento que as demais empresas."
 NFP69_POLICY_LAW_COMMUNAL_ADMINISTRATION:0 "As organizações de trabalhadores assumem os assuntos do dia a dia. Na administração central, sentam-se os representantes que elas próprias elegem."
 NFP69_POLICY_LAW_COMPULSORY_PRIMARY_SCHOOL:0 "As crianças devem frequentar a escola primária por alguns anos e não podem trabalhar durante esse período. No horário dos pequenos, a lei reserva às letras o tempo que antes poderia caber ao salário."
 NFP69_POLICY_LAW_CONSUMPTION_BASED_TAXATION:0 "O Tesouro arrecada sobre o consumo de mercadorias, sem um imposto geral sobre renda ou por pessoa. O tributo aparece no balcão e depende do que se escolheu taxar."
 NFP69_POLICY_LAW_COOPERATIVE_OWNERSHIP:0 "Os meios de produção passam à propriedade conjunta dos trabalhadores, que dividem o excedente. O pessoal da oficina passa a ocupar os dois lados da mesa onde se decide o destino da empresa."
 NFP69_POLICY_LAW_CORPORATE_STATE:0 "O Estado promove a cooperação entre corporações reconhecidas e negociações entre as classes. Para falar em nome de um interesse, é preciso pertencer a uma organização com reconhecimento oficial."
 NFP69_POLICY_LAW_CORPORATIZED_UNIONS:0 "Os sindicatos ficam sob controle direto ou indireto do Estado, com a missão de promover a colaboração entre classes. A organização dos trabalhadores deve caber na forma de negociação estabelecida pelo governo."
 NFP69_POLICY_LAW_COUNCIL_REPUBLIC:0 "Os trabalhadores elegem representantes para conselhos locais, que servem de base ao governo. A organização que começa no local de trabalho passa a fazer parte da própria estrutura do poder."
 NFP69_POLICY_LAW_CROWNLAND_DIETS:0 "O governo local cabe a assembleias tradicionais formadas pela aristocracia regional. As famílias nobres discutem os problemas da região. A lista dos convidados já vem pronta."
 NFP69_POLICY_LAW_CULTURAL_EXCLUSION:0 "São aceitas as culturas que têm características em comum com as principais culturas do país. Para as demais, persistem restrições: o Estado ainda pede provas de semelhança."
 NFP69_POLICY_LAW_DEBT_SLAVERY:0 "Quando não consegue pagar, o devedor pode tornar-se propriedade do credor. A cobrança da dívida alcança agora a própria liberdade de quem deve."
 NFP69_POLICY_LAW_DEDICATED_POLICE:0 "Cria-se uma polícia profissional com requisitos comuns de formação. Manter a ordem passa a ser um ofício com treinamento próprio e responsabilidades permanentes."
 NFP69_POLICY_LAW_DIPLOMATIC_NAVY:0 "A prioridade naval são as operações de longo alcance e a presença em diferentes partes do mundo. A diplomacia passa a contar com navios capazes de mostrar a bandeira bem longe do porto de origem."
 NFP69_POLICY_LAW_ELDER_COUNCIL:0 "O direito de governar cabe aos membros mais velhos e respeitados da comunidade. Aqui, idade e prestígio dão peso à voz política, sem depender de uma lista geral de eleitores."
 NFP69_POLICY_LAW_ELECTED_BUREAUCRATS:0 "Os habitantes das regiões elegem seus governadores. A autoridade local deve o cargo a quem ali vive, e não apenas a uma decisão tomada na capital."
 NFP69_POLICY_LAW_ETHNOSTATE:0 "O pleno pertencimento ao país fica reservado a um grupo étnico, e as demais culturas sofrem discriminação. O Estado consulta a ascendência para decidir a quem reconhece todos os direitos."
 NFP69_POLICY_LAW_EXPANDED_LATIFUNDIAS:0 "Os grandes proprietários ganham força: crescem o peso político da aristocracia e o rendimento de seus investimentos, enquanto os camponeses perdem influência. À extensão das propriedades acrescentam-se vantagens na economia e no governo."
 NFP69_POLICY_LAW_EXTRACTION_ECONOMY:0 "A economia colonial se organiza para render lucros à metrópole. O critério que orienta a produção é o benefício de um centro de decisão situado do outro lado da relação colonial."
 NFP69_POLICY_LAW_EXTRAORDINARY_COMMISSION:0 "Uma organização de massa fica encarregada de reprimir a sabotagem e a contrarrevolução. É a ela que caberá tratar das acusações que levarem esses nomes."
 NFP69_POLICY_LAW_FACTORY_COUNCILS:0 "Os conselhos de trabalhadores passam a poder gerir coletivamente as empresas, e os sindicatos ganham força política. A pergunta sobre quem manda na fábrica passa a ser discutida dentro da própria oficina."
 NFP69_POLICY_LAW_FREEDOM_OF_CONSCIENCE:0 "Há mais liberdade para escolher a fé, embora se conserve uma religião oficial e certas crenças continuem discriminadas. A consciência ganha espaço, com exceções que o governo faz questão de guardar."
 NFP69_POLICY_LAW_FREE_TRADE:0 "O livre comércio reduz as barreiras do governo à troca de mercadorias. Quem empreende encontra mais concorrência externa, tanto na hora de vender quanto na de comprar."
 NFP69_POLICY_LAW_FRONTIER_COLONIZATION:0 "A colonização se concentra nas fronteiras contíguas ao país. A expansão dos assentamentos segue a divisa, em vez de sair à procura de qualquer terra distante."
 NFP69_POLICY_LAW_GRADUATED_TAXATION:0 "A tributação dos dividendos pretende transferir uma parcela maior do ônus para quem recebe rendas elevadas. Os lucros do dono do capital passam a merecer um olhar mais atento do Tesouro."
 NFP69_POLICY_LAW_GUARANTEED_LIBERTIES:0 "As autoridades de assuntos internos devem atender às queixas da população. Prisões e vigilância exigem fundamento sólido. O poder do funcionário encontra um limite nos direitos de quem lhe abre a porta."
 NFP69_POLICY_LAW_GUILD_SYSTEM:0 "Para exercer determinados ofícios e atividades comerciais é preciso pertencer a uma guilda reconhecida. Algumas profissões passam a ter porteiro: a vontade de trabalhar, sozinha, não basta."
 NFP69_POLICY_LAW_HEREDITARY_BUREAUCRATS:0 "Os cargos públicos passam dos pais aos filhos junto com as obrigações do serviço. A sucessão familiar chegou até à escrivaninha da repartição."
 NFP69_POLICY_LAW_HINDU_CASTE_CODIFIED:0 "As distinções de casta ficam oficialmente inscritas na lei e restringem as oportunidades sociais e econômicas. O que antes se sustentava pelo costume ganhou também um lugar no código."
 NFP69_POLICY_LAW_HINDU_CASTE_ENFORCED:0 "A lei sustenta a hierarquia de castas e limita a passagem de uma posição social a outra. A origem indica bem mais que o nome dos antepassados: marca até onde o indivíduo pode ir."
 NFP69_POLICY_LAW_HINDU_CASTE_NOT_ENFORCED:0 "A casta deixa de impor limites legais ao avanço social e econômico. A árvore genealógica perde a condição de salvo-conduto oficial, embora um decreto por si só não desfaça os hábitos da sociedade."
 NFP69_POLICY_LAW_HOMESTEADING:0 "Os agricultores tomam posse de lotes e os cultivam com o auxílio de assalariados. Ser dono da própria terra não obriga ninguém a trabalhar sozinho."
 NFP69_POLICY_LAW_INDUSTRY_BANNED:0 "O país rejeita a indústria pesada e a automação em favor do trabalho manual. Antes de provar que dá lucro, a máquina teria de provar que tem o direito de existir."
 NFP69_POLICY_LAW_INTERMEDIATE_EDO_SYSTEM:0 "As restrições de classe se abrandam. Citadinos e camponeses abastados podem comprar o posto de gokenin, samurai de baixa patente. A porta do privilégio se entreabriu, mas a entrada ainda custa dinheiro."
 NFP69_POLICY_LAW_INTERNAL_COLONIZATION:0 "Colonos da cultura dominante serão encaminhados às fronteiras internas. A linha no mapa do país fica onde está. Quem vai morar ao lado já é outra questão."
 NFP69_POLICY_LAW_INTERVENTIONISM:0 "O Estado se reserva o direito de intervir na economia privada para conter excessos e preservar a estabilidade. O empresário tem liberdade para agir, sabendo que o governo pode corrigir o rumo."
 NFP69_POLICY_LAW_ISOLATIONISM:0 "O país procura se abastecer por conta própria e abre mão do comércio exterior habitual. Oferta e demanda deverão se encontrar sobretudo deste lado da fronteira."
 NFP69_POLICY_LAW_JEUNE_ECOLE:0 "A frota privilegia navios pequenos e bem armados, destinados a enfrentar adversários maiores. A aposta está tanto no que o barco carrega quanto no tamanho de seu casco."
 NFP69_POLICY_LAW_LABOUR_SUFFRAGE:0 "O voto agora depende de como se ganha a vida. Quem vive do próprio trabalho pode votar. Quem também recebe renda de propriedade fica de fora."
 NFP69_POLICY_LAW_LAISSEZ_FAIRE:0 "A política econômica aposta na concorrência privada e limita a intervenção do Estado. Cabe mais ao empresário decidir para onde vai o capital."
 NFP69_POLICY_LAW_LANDED_VOTING:0 "Podem votar os proprietários de terras ou de capital. Antes de perguntar o que pensa o cidadão, o sistema quer saber o que ele possui."
 NFP69_POLICY_LAW_LAND_BASED_TAXATION:0 "A arrecadação se apoia nos impostos sobre a terra, cobrados sobretudo dos camponeses. As receitas públicas ficam intimamente ligadas à lavoura e às obrigações de quem nela trabalha."
 NFP69_POLICY_LAW_LATIFUNDIAS:0 "Predominam os grandes domínios rurais e o trabalho sazonal mal remunerado. Para quem vive do salário, a renda depende tanto do senhor da terra quanto do calendário da lavoura."
 NFP69_POLICY_LAW_LAX_EDO_SYSTEM:0 "Pessoas de origem comum passam a ter acesso a cargos e funções antes reservados aos samurais. A lei deixa um pouco mais de espaço entre a origem de uma pessoa e o ofício que ela pode escolher."
 NFP69_POLICY_LAW_LEGACY_SLAVERY:0 "A escravidão existente é mantida, mas sua expansão fica proibida. A lei conserva o cativeiro de quem já estava submetido a ele e fecha o caminho para que se espalhe."
 NFP69_POLICY_LAW_LOCAL_POLICE:0 "A manutenção da ordem cabe às forças policiais locais. Como o serviço está ligado às autoridades da região, é ali que se resolvem, em primeiro lugar, os assuntos de polícia."
 NFP69_POLICY_LAW_MANORIALISM:0 "As terras continuam nas mãos de proprietários hereditários. O arrendatário pode partir, mas, enquanto ocupar a terra, deve ao senhor uma parte de seu trabalho sem remuneração."
 NFP69_POLICY_LAW_MASS_CONSCRIPTION:0 "A convocação em massa de infantaria pode reforçar o exército profissional. A lista de recrutas tem íntima relação com a lista de braços que poderão fazer falta nas oficinas e na lavoura."
 NFP69_POLICY_LAW_MERCANTILISM:0 "O país favorece as exportações e a entrada líquida de recursos na disputa com outras nações. O comércio exterior é visto como meio de fortalecer a economia nessa competição."
 NFP69_POLICY_LAW_MERCHANT_NAVY:0 "A organização naval privilegia o comércio internacional e a proteção das cargas. Para quem presta esse serviço, a questão decisiva é saber se o mercante chegará ao destino com a mercadoria."
 NFP69_POLICY_LAW_MIGRATION_CONTROLS:0 "Só podem migrar os integrantes de culturas e religiões livres de discriminação. A passagem pela fronteira depende de como o Estado classifica a pessoa que deseja atravessá-la."
 NFP69_POLICY_LAW_MILITARIZED_POLICE:0 "A polícia recebe equipamento e treinamento militares. Os meios usados para manter a ordem dentro do país passam a se aproximar dos que empregam as forças armadas."
 NFP69_POLICY_LAW_MILITARY_BUREAUCRATS:0 "A farda agora também cabe na repartição. A maioria dos altos funcionários vem das forças armadas."
 NFP69_POLICY_LAW_MILLET_SYSTEM:0 "O Estado professa o islamismo sunita. Outras comunidades abraâmicas recebem autonomia jurídica e dispensa da convocação militar mediante um tributo religioso. A autonomia da comunidade vem acompanhada de uma conta bem terrena."
 NFP69_POLICY_LAW_MONARCHY:0 "O poder executivo pertence ao monarca, e a dinastia reinante representa a continuidade do Estado. A história de uma família passa assim a fazer parte da organização de todo um país."
 NFP69_POLICY_LAW_MULTICULTURAL:0 "Os direitos civis são concedidos sem discriminação cultural nem superioridade oficial de uma cultura sobre as demais. Ninguém precisa mais apresentar a ascendência cultural certa para pertencer ao país com plenos direitos."
 NFP69_POLICY_LAW_NATIONAL_GUARD:0 "Corpos independentes de cidadãos voluntários ajudam a manter a ordem pública. A segurança interna também passa a contar com moradores dispostos a pegar em armas."
 NFP69_POLICY_LAW_NATIONAL_MILITIA:0 "Milícias locais complementam um pequeno exército regular na defesa do país. Para esses soldados, a casa é tanto a razão de pegar em armas quanto o lugar para o qual esperam voltar."
 NFP69_POLICY_LAW_NATIONAL_SUPREMACY:0 "O Estado dá primazia à sua identidade nacional principal. Aceita também culturas que compartilham herança e língua ou outros costumes. Para as demais, subsiste a barreira legal da diferença."
 NFP69_POLICY_LAW_NEO_ABSOLUTISM:0 "O soberano absoluto conta com uma administração moderna e centralizada. Podem mudar as repartições; a última palavra ainda pertence a uma pessoa só."
 NFP69_POLICY_LAW_NO_COLONIAL_AFFAIRS:0 "O Estado abre mão de fundar colônias pelo processo formal de colonização. As pretensões coloniais já não dispõem desse instrumento para ampliar o território."
 NFP69_POLICY_LAW_NO_HEALTH_SYSTEM:0 "O Tesouro não financia a saúde. Quem precisa de tratamento terá de buscar auxílio em outros recursos e instituições."
 NFP69_POLICY_LAW_NO_HOME_AFFAIRS:0 "Do combate às desordens e rebeliões cuidam o exército e a polícia comuns. Sem uma instituição específica de assuntos internos, o Estado recorre às forças de que já dispõe."
 NFP69_POLICY_LAW_NO_MIGRATION_CONTROLS:0 "O Estado não controla a migração através das fronteiras. Quem decide chegar ou partir não encontra uma proibição especial à mudança de residência."
 NFP69_POLICY_LAW_NO_POLICE:0 "A lei não prevê uma polícia organizada. A manutenção da ordem fica sem uma repartição permanente dedicada a essa função."
 NFP69_POLICY_LAW_NO_SCHOOLS:0 "A educação fica a cargo das famílias, sem um sistema escolar comum. A oportunidade de aprender a ler depende dos meios e da ajuda disponíveis em casa."
 NFP69_POLICY_LAW_NO_SOCIAL_SECURITY:0 "O Estado não assume o sustento de quem não consegue se manter. Nos momentos de aperto, será preciso buscar apoio fora de um sistema público de benefícios."
 NFP69_POLICY_LAW_NO_WOMENS_RIGHTS:0 "As mulheres ficam legalmente sob tutela masculina e têm direitos limitados. Para tomar as próprias decisões, esbarram na dependência que a lei concede ao tutor."
 NFP69_POLICY_LAW_NO_WORKERS_RIGHTS:0 "O Estado não estabelece garantias específicas para os direitos trabalhistas. Falta ao trabalhador essa forma de proteção legal em suas relações de emprego."
 NFP69_POLICY_LAW_OFFICIAL_NATIONALITY:0 "O Estado toma o súdito russo por modelo e espera que os demais povos assimilem sua cultura. Para quem fala outra língua em casa, a distinção chega bem perto da mesa do jantar."
 NFP69_POLICY_LAW_OKHRANA:0 "A polícia secreta vigiará os emigrados e reprimirá a atividade revolucionária. Pelo visto, atravessar a fronteira já não basta para escapar ao seu olhar."
 NFP69_POLICY_LAW_OLD_AGE_PENSION:0 "O Estado assume o sustento dos trabalhadores na velhice. Deixar de trabalhar passa a depender também do amparo coletivo, além das economias próprias e da ajuda da família."
 NFP69_POLICY_LAW_OLIGARCHY:0 "O chefe de Estado divide o poder com um grupo restrito de pessoas influentes que não respondem ao eleitorado. Na conversa sobre o governo cabem várias vozes, mas são poucos os convidados."
 NFP69_POLICY_LAW_ORGANIC_REGULATION:0 "A ordem estatal segue leis orgânicas impostas pelas grandes potências, e os principais boiardos escolhem o chefe de Estado. As regras vêm de fora, e o colégio eleitoral cabe numa sala bastante pequena."
 NFP69_POLICY_LAW_OUTLAWED_DISSENT:0 "Criticar o governo passa a ser ilegal e equivale a traição. Para a pena de um jornalista, o caminho entre uma observação e uma acusação ficou particularmente curto."
 NFP69_POLICY_LAW_PARLIAMENTARY_REPUBLIC:0 "O dirigente da assembleia legislativa assume a chefia de Estado. O mais alto cargo executivo fica ligado ao parlamento, o que dá especial importância a quem tem assento nele."
 NFP69_POLICY_LAW_PEASANT_LEVIES:0 "O exército se apoia na convocação de camponeses para a infantaria, com pouco treinamento. Entre saber conduzir o arado e saber manter a formação ainda há certa distância."
 NFP69_POLICY_LAW_PEASANT_PROPRIETORSHIP:0 "A maior parte das terras agrícolas pertence aos camponeses que as cultivam. As grandes explorações comerciais ficam com uma parcela menor. No centro da lavoura está quem trabalha a própria terra."
 NFP69_POLICY_LAW_PEOPLE_OF_THE_BOOK:0 "A ordem jurídica islâmica concede autonomia legal e dispensa do serviço militar a fiéis de outras religiões abraâmicas, mediante um tributo religioso. A diferença chega ao tribunal da comunidade, ao quartel e ao bolso."
 NFP69_POLICY_LAW_PER_CAPITA_BASED_TAXATION:0 "Ao imposto de renda soma-se um tributo por pessoa que pesa sobretudo sobre os pobres. A mesma quantia ocupa espaços bem diferentes em uma carteira cheia e em uma vazia."
 NFP69_POLICY_LAW_POOR_LAWS:0 "O auxílio aos pobres é organizado por meio de casas de trabalho. Com o sustento, quem delas depende recebe também regras de moradia e de trabalho."
 NFP69_POLICY_LAW_PRESIDENTIAL_REPUBLIC:0 "A república tem um presidente na chefia de Estado e um governo representativo. A presidência ocupa o centro da vida política; quem pode votar continua a depender das leis eleitorais."
 NFP69_POLICY_LAW_PRIVATE_HEALTH_INSURANCE:0 "O tratamento depende de hospitais privados e de seguro de saúde individual. Para ter o atendimento coberto, é preciso poder contratar a cobertura. A saúde também entra na conta dos contratos e das mensalidades."
 NFP69_POLICY_LAW_PRIVATE_SCHOOLS:0 "A educação é oferecida por instituições particulares. A escolha da escola depende das vagas disponíveis e das condições da família para pagar o ensino."
 NFP69_POLICY_LAW_PROFESSIONAL_ARMY:0 "O país mantém um exército permanente de soldados profissionais. A vida militar é seu ofício, e o treinamento faz parte do serviço em vez de se resumir a uma breve lição antes da campanha."
 NFP69_POLICY_LAW_PROFESSIONAL_NAVY:0 "O Estado opta por uma poderosa marinha de guerra permanente para dissuadir os rivais. Um navio de guerra serve de arma e, mesmo parado, de argumento bastante visível."
 NFP69_POLICY_LAW_PROPORTIONAL_TAXATION:0 "Os impostos recaem principalmente sobre a renda, com uma proporção semelhante do que cada um recebe. Para calcular a cobrança, o Tesouro olha para os rendimentos em vez de apenas contar contribuintes por cabeça."
 NFP69_POLICY_LAW_PROTECTED_SPEECH:0 "A liberdade de expressão recebe proteção legal. O debate público ganha espaço, e o jornal tem mais motivo para esperar que a resposta a um argumento seja outro argumento."
 NFP69_POLICY_LAW_PROTECTIONISM:0 "O Estado protege a indústria nacional da concorrência estrangeira por meio de restrições ao comércio. Entre a empresa de casa e o concorrente de fora ergue-se uma barreira de política comercial."
 NFP69_POLICY_LAW_PUBLIC_HEALTH_INSURANCE:0 "O Estado financia a assistência médica para dar aos cidadãos acesso ao tratamento. O custo da doença passa a ter lugar no orçamento público, além da conta de cada paciente."
 NFP69_POLICY_LAW_PUBLIC_SCHOOLS:0 "O Estado assume a responsabilidade por escolas acessíveis ao público, com normas comuns de ensino. Conseguir um lugar para aprender passa a ser também uma obrigação pública."
 NFP69_POLICY_LAW_RACIAL_SEGREGATION:0 "Os direitos de cidadania dependem de uma herança racial comum, e culturas de outras origens sofrem discriminação. A lei traça entre os habitantes uma divisa baseada na ascendência que lhes atribui."
 NFP69_POLICY_LAW_REGULATORY_BODIES:0 "Órgãos públicos recebem a atribuição de limitar a atuação dos empregadores. Nos conflitos de trabalho passa a haver quem fiscalize as regras, além de quem fiscaliza a produção."
 NFP69_POLICY_LAW_RELIGIOUS_SCHOOLS:0 "O ensino escolar fica sob a direção das instituições religiosas. Junto com as primeiras letras chegam professores para os quais a educação tem estreita ligação com a fé."
 NFP69_POLICY_LAW_RESTRICTED_CHILD_LABOR:0 "As crianças ficam proibidas de trabalhar nas fábricas. A lei põe uma barreira concreta entre a infância e o posto de trabalho fabril."
 NFP69_POLICY_LAW_REVOLUTIONARY_GUARD:0 "As milícias operárias passam a formar um só exército. Quem dará as ordens? Os próprios combatentes elegerão os oficiais."
 NFP69_POLICY_LAW_RIGHT_OF_ASSEMBLY:0 "Os cidadãos conquistam o direito de se reunir. A opinião pública ganha um lugar onde discutir questões e apresentar reivindicações em conjunto."
 NFP69_POLICY_LAW_RIGHT_TO_ASSOCIATE:0 "Os trabalhadores podem formar associações e exercer suas atividades sem restrições especiais. Um interesse comum ganha o direito de ter uma organização própria."
 NFP69_POLICY_LAW_SAKOKU:0 "Os contatos com países estrangeiros são severamente limitados, e o comércio só é permitido por certos portos. A fronteira marítima tem poucas portas, cada uma com suas regras para abrir."
 NFP69_POLICY_LAW_SECRET_POLICE:0 "Cria-se um serviço especial para vigiar dissidentes e investigar crimes políticos. O interesse do Estado pelas conversas particulares ganha uma repartição própria."
 NFP69_POLICY_LAW_SERFDOM:0 "O camponês fica preso à terra e deve trabalhar para seu senhor feudal. Mudar de lugar ou de ocupação esbarra na própria condição de servo."
 NFP69_POLICY_LAW_SHINSENGUMI:0 "Uma tropa de espadachins de elite protege os funcionários e patrulha a capital. A segurança das autoridades fica nas mãos de um serviço armado bastante peculiar."
 NFP69_POLICY_LAW_SINGLE_PARTY_STATE:0 "Toda atividade política legal se concentra em um partido. Pode-se discutir o poder, mas só existe um modelo permitido de carteira partidária."
 NFP69_POLICY_LAW_SLAVERY_BANNED:0 "A lei proíbe possuir outra pessoa como propriedade. A liberdade de um ser humano já não pode constar legalmente do inventário de outro."
 NFP69_POLICY_LAW_SLAVE_TRADE:0 "A lei permite adquirir pessoas escravizadas no comércio internacional. A procura por trabalho forçado ganha um mercado externo no qual a própria pessoa é tratada como mercadoria."
 NFP69_POLICY_LAW_SOCIAL_MONARCHY:0 "A monarquia mantém o papel de símbolo nacional, e o Estado faz a mediação entre os grupos corporativos. A coroa paira sobre a mesa à qual se sentam os interesses organizados da sociedade."
 NFP69_POLICY_LAW_STATE_ATHEISM:0 "O Estado segue uma política antirreligiosa, afasta a religião do governo e restringe todos os cultos. A própria fé desperta a desconfiança da autoridade."
 NFP69_POLICY_LAW_STATE_RELIGION:0 "A igreja recebe o estatuto de órgão do Estado, e as minorias religiosas permanecem em situação jurídica desigual. A fé passa a tratar tanto das relações com a autoridade quanto da consciência de cada um."
 NFP69_POLICY_LAW_STRICT_EDO_SYSTEM:0 "A ordem estamental dita ofícios, direitos e até o tipo de moradia permitido. Uma pessoa de origem comum não pode tornar-se samurai por vias legais. O governo se ocupa até do número de portões: poucas ideias de ordem descem a tantos detalhes."
 NFP69_POLICY_LAW_SUBJECTHOOD:0 "Os habitantes são, antes de tudo, súditos do monarca. As questões culturais cabem às respectivas comunidades. A coroa comum pesa mais que a tentativa de construir uma única identidade nacional."
 NFP69_POLICY_LAW_TECHNOCRACY:0 "O governo cabe a um conselho não eleito, formado por pessoas escolhidas pelo conhecimento e pela capacidade. O direito de dirigir o país se justifica pela competência, sem passar pelas urnas."
 NFP69_POLICY_LAW_TENANT_FARMERS:0 "Os lavradores trabalham nas terras de proprietários hereditários, mas podem partir em busca de outro ofício. A terra tem dono, sem que o trabalhador esteja preso à parcela."
 NFP69_POLICY_LAW_TERAKOYA:0 "Uma rede descentralizada de escolas particulares ligadas aos templos ensina as pessoas de origem comum. É nas terakoya locais que a educação se organiza, fora de uma hierarquia escolar estatal."
 NFP69_POLICY_LAW_THEOCRACY:0 "O clero governa segundo sua interpretação dos textos sagrados. O poder estatal encontra fundamento na religião, e a discussão sobre a ordem política se aproxima da discussão sobre a fé."
 NFP69_POLICY_LAW_THIRD_SECTION:0 "A chancelaria imperial conta com uma seção para censura e investigação. Tanto a dissidência política quanto a religiosa estão na mira. Para um jornal, o assunto é de interesse profissional."
 NFP69_POLICY_LAW_TOTAL_SEPARATION:0 "A igreja se separa do governo, e a religião deixa de justificar distinções nos direitos civis. A lei encaminha questões de fé e de cidadania para repartições diferentes."
 NFP69_POLICY_LAW_TRADITIONALISM:0 "A economia se apoia na produção de subsistência pré-industrial, com pouca intervenção do Estado. As formas tradicionais de produzir conservam a primazia sobre o modelo industrial."
 NFP69_POLICY_LAW_UNIVERSAL_SUFFRAGE:0 "Todos os homens adultos recebem igual direito de voto. A riqueza deixa de determinar o peso do voto masculino. O direito das mulheres continua a depender de outra lei."
 NFP69_POLICY_LAW_WAGE_SUBSIDIES:0 "A assistência social passa a incluir a instituição de um salário mínimo. O pagamento do trabalho ganha um piso que o Estado se compromete a sustentar."
 NFP69_POLICY_LAW_WARRIOR_CASTE:0 "O porte de armas e o serviço militar ficam reservados a uma casta guerreira, vedados às pessoas de origem comum. Aqui se verifica a ascendência antes de testar a pontaria."
 NFP69_POLICY_LAW_WEALTH_VOTING:0 "O direito de voto depende da riqueza, e o voto dos mais ricos tem peso maior. A influência política passa a ter uma medida bastante monetária."
 NFP69_POLICY_LAW_WOMENS_SUFFRAGE:0 "As mulheres conquistam o direito de voto. Opinar nas urnas deixa de ser privilégio de um sexo, embora as regras gerais de acesso ainda dependam da legislação eleitoral."
 NFP69_POLICY_LAW_WOMEN_IN_THE_FIELDS:0 "Às mulheres cabe a maior parte do trabalho doméstico e agrícola, o que libera mais homens para a guerra e as incursões. A organização militar da sociedade se sustenta também no trabalho de quem fica."
 NFP69_POLICY_LAW_WOMEN_IN_THE_WORKPLACE:0 "A lei amplia a participação das mulheres no trabalho remunerado. As questões de renda e independência ganham espaço para além da casa."
 NFP69_POLICY_LAW_WOMEN_OWN_PROPERTY:0 "As mulheres passam a poder possuir bens, inclusive por herança. A propriedade pode pertencer à própria mulher, independentemente do homem de quem dependa sua posição."
 NFP69_POLICY_LAW_WORKER_PROTECTIONS:0 "Os trabalhadores recebem garantias legais amplas. Nas condições de emprego passam a valer obrigações que o patrão não pode apagar com uma simples cláusula particular."
 NFP72_BASE_1:0 "O que conhecemos é a posição geral dos grupos quanto à nova regra. Não registramos suas posições antes da aprovação. Sabemos, portanto, até que ponto a lei corresponde às suas ideias. Distribuir agora os votos que teriam dado à mudança seria um exercício jornalístico um tanto ousado."
 NFP72_BASE_2:0 "O que conhecemos é a posição geral dos grupos quanto à nova regra. Não registramos suas posições antes da aprovação. Sabemos, portanto, até que ponto a lei corresponde às suas ideias. Distribuir agora os votos que teriam dado à mudança seria um exercício jornalístico um tanto ousado."
 NFP72_GOV_1:0 "Dentro do governo, a nova lei também tem sua história. [Localize(ScriptContainer.MakeScope.Var('nfp50_law_gov_summary').GetFlagName)] A decisão foi tomada, mas isso não obriga todos os membros do governo a pensar da mesma maneira. [SelectLocalization(GreaterThan_CFixedPoint(ScriptContainer.GetVariableValue('nfp50_law_gov_yes_present'), '(CFixedPoint)0'), 'NFP50_LAW_GOV_YES_NAME', 'NFP50_LAW_NO_MOVE')] [SelectLocalization(GreaterThan_CFixedPoint(ScriptContainer.GetVariableValue('nfp50_law_gov_no_present'), '(CFixedPoint)0'), 'NFP50_LAW_GOV_NO_NAME', 'NFP50_LAW_NO_MOVE')]"
 NFP72_GOV_2:0 "Dentro do governo, a nova lei também tem sua história. [Localize(ScriptContainer.MakeScope.Var('nfp50_law_gov_summary').GetFlagName)] A decisão foi tomada, mas isso não obriga todos os membros do governo a pensar da mesma maneira. [SelectLocalization(GreaterThan_CFixedPoint(ScriptContainer.GetVariableValue('nfp50_law_gov_yes_present'), '(CFixedPoint)0'), 'NFP50_LAW_GOV_YES_NAME', 'NFP50_LAW_NO_MOVE')] [SelectLocalization(GreaterThan_CFixedPoint(ScriptContainer.GetVariableValue('nfp50_law_gov_no_present'), '(CFixedPoint)0'), 'NFP50_LAW_GOV_NO_NAME', 'NFP50_LAW_NO_MOVE')]"
 NFP72_IG_1:0 "Entre os maiores grupos organizados por número de integrantes, o quadro é este. [Localize(ScriptContainer.MakeScope.Var('nfp50_law_ig_1_type').GetFlagName)] — [Localize(ScriptContainer.MakeScope.Var('nfp50_law_ig_1_stance').GetFlagName)]. [SelectLocalization(GreaterThan_CFixedPoint(ScriptContainer.GetVariableValue('nfp50_law_ig_count'), '(CFixedPoint)1'), 'NFP72_SECOND', 'NFP50_LAW_NO_MOVE')] Essas vozes dizem muito sobre a vida política organizada. Já os que vivem fora dessas organizações não estão todos representados aqui."
 NFP72_IG_2:0 "Entre os maiores grupos organizados por número de integrantes, o quadro é este. [Localize(ScriptContainer.MakeScope.Var('nfp50_law_ig_1_type').GetFlagName)] — [Localize(ScriptContainer.MakeScope.Var('nfp50_law_ig_1_stance').GetFlagName)]. [SelectLocalization(GreaterThan_CFixedPoint(ScriptContainer.GetVariableValue('nfp50_law_ig_count'), '(CFixedPoint)1'), 'NFP72_SECOND', 'NFP50_LAW_NO_MOVE')] Essas vozes dizem muito sobre a vida política organizada. Já os que vivem fora dessas organizações não estão todos representados aqui."
 NFP72_MOVES_1:0 "Os movimentos políticos também entram nesta história. [SelectLocalization(GreaterThan_CFixedPoint(ScriptContainer.GetVariableValue('nfp50_law_move_yes_present'), '(CFixedPoint)0'), 'NFP72_MOVE_YES', 'NFP50_LAW_NO_MOVE')] [SelectLocalization(GreaterThan_CFixedPoint(ScriptContainer.GetVariableValue('nfp50_law_move_no_present'), '(CFixedPoint)0'), 'NFP72_MOVE_NO', 'NFP50_LAW_NO_MOVE')] Concordar com a mudança não basta para levar o crédito por ela. Mas já se entende por que a nova ordem agrada mais a uns que a outros."
 NFP72_MOVES_2:0 "Os movimentos políticos também entram nesta história. [SelectLocalization(GreaterThan_CFixedPoint(ScriptContainer.GetVariableValue('nfp50_law_move_yes_present'), '(CFixedPoint)0'), 'NFP72_MOVE_YES', 'NFP50_LAW_NO_MOVE')] [SelectLocalization(GreaterThan_CFixedPoint(ScriptContainer.GetVariableValue('nfp50_law_move_no_present'), '(CFixedPoint)0'), 'NFP72_MOVE_NO', 'NFP50_LAW_NO_MOVE')] Concordar com a mudança não basta para levar o crédito por ela. Mas já se entende por que a nova ordem agrada mais a uns que a outros."
 NFP72_MOVE_NO:0 "Entre os contrários, o movimento que reúne mais apoio é do tipo «[Localize(ScriptContainer.MakeScope.Var('nfp50_law_move_no_type').GetFlagName)]»."
 NFP72_MOVE_YES:0 "Entre os favoráveis, o movimento que reúne mais apoio é do tipo «[Localize(ScriptContainer.MakeScope.Var('nfp50_law_move_yes_type').GetFlagName)]»."
 NFP72_NO_GROUPS_1:0 "Para esta mudança, faltam informações sobre a posição dos grupos organizados. O silêncio do boletim diz até onde vai o nosso conhecimento. Consenso geral já seria outra notícia."
 NFP72_NO_GROUPS_2:0 "Para esta mudança, faltam informações sobre a posição dos grupos organizados. O silêncio do boletim diz até onde vai o nosso conhecimento. Consenso geral já seria outra notícia."
 NFP72_RELATIVE_1:0 "Essas posições foram registradas antes do fim do processo de aprovação e comparam a nova regra com a anterior. Alguns desejavam a troca, outros passariam muito bem sem ela. Na assinatura ao pé do decreto, essa diferença costuma passar despercebida."
 NFP72_RELATIVE_2:0 "Essas posições foram registradas antes do fim do processo de aprovação e comparam a nova regra com a anterior. Alguns desejavam a troca, outros passariam muito bem sem ela. Na assinatura ao pé do decreto, essa diferença costuma passar despercebida."
 NFP72_SECOND:0 "[Localize(ScriptContainer.MakeScope.Var('nfp50_law_ig_2_type').GetFlagName)] — [Localize(ScriptContainer.MakeScope.Var('nfp50_law_ig_2_stance').GetFlagName)]."
 NFP89_DELIVERY:0 "[SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp89_regular'), '(CFixedPoint)1'), 'NFP89_MONTHLY_ON', 'NFP89_MONTHLY_OFF')]\n\n[SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp89_urgent'), '(CFixedPoint)1'), 'NFP89_URGENT_ON', 'NFP89_URGENT_OFF')]"
 NFP89_MONTHLY_OFF:0 "A entrega mensal está desativada. Esta edição de apresentação ficará no arquivo. As edições regulares voltarão quando você optar por recebê-las."
 NFP89_MONTHLY_ON:0 "Você escolheu a entrega mensal. Voltaremos às mudanças de uma edição para outra: uma notícia inquietante raramente conta, sozinha, toda a história."
 NFP89_TECH_END_COLD:0 "Há compromissos entre os países, embora falte calor nas relações. A descoberta não perdeu valor por isso. Convém separar a oportunidade da nossa velha inclinação a ver em cada notícia um motivo de discussão."
 NFP89_TECH_END_FRIEND:0 "A notícia merece parabéns. Seria bom se depois das cortesias houvesse ocasião para uma conversa proveitosa. A boa vontade também gosta de encontrar o que fazer."
 NFP89_TECH_END_NEUTRAL:0 "O país já dispõe do novo conhecimento. O uso que fará dele se verá no trabalho que ainda tem pela frente. E a nós seria mais útil olhar para as nossas possibilidades do que inventar motivos para ignorar as dos outros."
 NFP89_TECH_END_THREAT:0 "As relações dão pouco motivo para parabéns despreocupados. Convém levar em conta o que esse país pode fazer daqui em diante. Mas anunciar toda descoberta como preparação para a guerra seria uma bela maneira de trocar a observação por uma conclusão pronta."
 NFP89_TECH_OPEN_ALLY:0 "Nosso aliado, [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName], dominou a tecnologia «[Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]». Dá gosto receber pelo correio dos aliados outra coisa além de motivos de preocupação. Agora interessa saber que uso farão da descoberta."
 NFP89_TECH_OPEN_BLOC:0 "Um parceiro do nosso bloco, [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName], dominou a tecnologia «[Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]». Há mais uma possibilidade entre nós. A simples filiação ao bloco, contudo, ainda não traz o conhecimento alheio para as nossas oficinas."
 NFP89_TECH_OPEN_NEIGHBOR:0 "Nosso vizinho, [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName], dominou a tecnologia «[Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]». Para uma notícia científica, a distância talvez conte pouco. Para quem trabalha logo deste lado da fronteira, vale reparar no que já se pode fazer do outro."
 NFP89_TECH_OPEN_OTHER:0 "Chega de [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName] uma notícia da ciência. O país dominou a tecnologia «[Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]». Há mais uma linha na lista das descobertas. Vejamos o que ela permite fazer."
 NFP89_TECH_OPEN_OVERLORD:0 "Nosso suserano, [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName], dominou a tecnologia «[Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]». O vínculo entre os países não fez da ciência uma biblioteca de empréstimo livre. Mas é útil saber com que recursos o parceiro agora pode contar."
 NFP89_TECH_OPEN_RIVAL:0 "Nosso rival, [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName], dominou a tecnologia «[Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]». Dar de ombros para a notícia seria fácil. Diminuir as possibilidades do rival com a nossa indiferença já seria outra história."
 NFP89_TECH_OPEN_SUBJECT:0 "Um país que depende do nosso, [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName], dominou a tecnologia «[Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]». A rubrica da subordinação pode acabar escondendo as possibilidades que esse país tem por conta própria. Eis uma boa ocasião para prestar atenção."
 NFP89_URGENT_OFF:0 "As edições extraordinárias estão desativadas. Você pode habilitar na assinatura a entrega de números especiais sobre guerras e grandes acontecimentos mundiais."
 NFP89_URGENT_ON:0 "As edições extraordinárias estão habilitadas. Um início ou fim de guerra ou um grande acontecimento mundial pode chegar às suas mãos antes do fim do mês."
 NFPTEST_PARTY_1:0 "Partido Trabalhista de Teste — [ScriptContainer.GetVariableValue('nfp43_now_1')|2]."
 NFPTEST_PARTY_2:0 "Partido dos Proprietários de Teste — [ScriptContainer.GetVariableValue('nfp43_now_2')|2]."
 NFPTEST_PARTY_3:0 "Partido Liberal de Teste — [ScriptContainer.GetVariableValue('nfp43_now_3')|2]."
