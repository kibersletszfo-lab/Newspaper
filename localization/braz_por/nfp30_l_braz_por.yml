 NFP50_LAW_INTRO_AWAY_1:0 "Mudou uma lei no exterior. É fácil discutir de longe como outros países se organizam. Mas às vezes a notícia nos leva a olhar para casa. Em que fazemos diferente? E a diferença nos agrada?"
 NFP50_LAW_INTRO_AWAY_2:0 "Mudou uma lei no exterior. É fácil discutir de longe como outros países se organizam. Mas às vezes a notícia nos leva a olhar para casa. Em que fazemos diferente? E a diferença nos agrada?"
 NFP50_LAW_INTRO_HOME_1:0 "Mudou uma lei em nosso país. As regras raramente servem igualmente a todos: para um, a porta se abre; a outro, lembram que a chave já não é sua. Vejamos o que mudou e quem recebeu com satisfação a nova linha no código."
 NFP50_LAW_INTRO_HOME_2:0 "Mudou uma lei em nosso país. As regras raramente servem igualmente a todos: para um, a porta se abre; a outro, lembram que a chave já não é sua. Vejamos o que mudou e quem recebeu com satisfação a nova linha no código."
 NFP50_LAW_MEANING_LAW_COMPULSORY_PRIMARY_SCHOOL_1:0 "As crianças devem estudar, e o trabalho infantil sofre restrições. A lei permite ampliar o ensino. Há uma oportunidade muito simples por trás disso: chegar à vida adulta sabendo ler, além de saber trabalhar. Entre a obrigação no papel e um lugar na carteira, contudo, ainda cabem escolas e recursos para mantê-las. A severidade do decreto não ensina as letras."
 NFP50_LAW_MEANING_LAW_COMPULSORY_PRIMARY_SCHOOL_2:0 "As crianças devem estudar, e o trabalho infantil sofre restrições. A lei permite ampliar o ensino. Há uma oportunidade muito simples por trás disso: chegar à vida adulta sabendo ler, além de saber trabalhar. Entre a obrigação no papel e um lugar na carteira, contudo, ainda cabem escolas e recursos para mantê-las. A severidade do decreto não ensina as letras."
 NFP50_LAW_MEANING_LAW_GUARANTEED_LIBERTIES_1:0 "A segurança interna passa a ter limites nas garantias de liberdade. Manter a ordem exige respeitar os direitos dos moradores. Uma novidade particularmente bem-vinda para quem tem opinião incômoda. Muito dependerá de como agirem as autoridades de assuntos internos. Uma bela promessa de liberdade merece uma vida digna fora do papel."
 NFP50_LAW_MEANING_LAW_GUARANTEED_LIBERTIES_2:0 "A segurança interna passa a ter limites nas garantias de liberdade. Manter a ordem exige respeitar os direitos dos moradores. Uma novidade particularmente bem-vinda para quem tem opinião incômoda. Muito dependerá de como agirem as autoridades de assuntos internos. Uma bela promessa de liberdade merece uma vida digna fora do papel."
 NFP50_LAW_MEANING_LAW_PROTECTED_SPEECH_1:0 "A liberdade de expressão ganhou proteção legal. O Estado perde meios de reprimir alguns movimentos políticos e favorecer outros. Para o debate público é importante: fica mais difícil substituir um argumento convincente por uma proibição conveniente. Tomara que o espaço conquistado pelas palavras dê lugar também às ideias."
 NFP50_LAW_MEANING_LAW_PROTECTED_SPEECH_2:0 "A liberdade de expressão ganhou proteção legal. O Estado perde meios de reprimir alguns movimentos políticos e favorecer outros. Para o debate público é importante: fica mais difícil substituir um argumento convincente por uma proibição conveniente. Tomara que o espaço conquistado pelas palavras dê lugar também às ideias."
 NFP50_LAW_MEANING_LAW_SLAVERY_BANNED_1:0 "A escravidão deixou de ser legal. Uma pessoa já não é propriedade de outra, mudança que dificilmente cabe na expressão «correção nos papéis». A liberdade, sozinha, não dá salário nem igualdade social. Mas ao menos já não é permitido dispor de um ser humano como de um móvel da casa."
 NFP50_LAW_MEANING_LAW_SLAVERY_BANNED_2:0 "A escravidão deixou de ser legal. Uma pessoa já não é propriedade de outra, mudança que dificilmente cabe na expressão «correção nos papéis». A liberdade, sozinha, não dá salário nem igualdade social. Mas ao menos já não é permitido dispor de um ser humano como de um móvel da casa."
 NFP50_LAW_MEANING_LAW_WOMENS_SUFFRAGE_1:0 "As mulheres ganharam mais direitos de participar da política. Ficou mais difícil discutir o futuro do país como se a população fosse composta apenas de homens. O exercício desse direito depende também do sistema eleitoral. Mas já há razão para rever ideias antigas sobre quem pode decidir nossos assuntos comuns."
 NFP50_LAW_MEANING_LAW_WOMENS_SUFFRAGE_2:0 "As mulheres ganharam mais direitos de participar da política. Ficou mais difícil discutir o futuro do país como se a população fosse composta apenas de homens. O exercício desse direito depende também do sistema eleitoral. Mas já há razão para rever ideias antigas sobre quem pode decidir nossos assuntos comuns."
 NFP50_LAW_MOVEMENT_BASE_1:0 "Os movimentos políticos também têm suas preferências. [SelectLocalization(GreaterThan_CFixedPoint(ScriptContainer.GetVariableValue('nfp50_law_move_yes_present'), '(CFixedPoint)0'), 'NFP50_LAW_MOVE_YES', 'NFP50_LAW_NO_MOVE')] [SelectLocalization(GreaterThan_CFixedPoint(ScriptContainer.GetVariableValue('nfp50_law_move_no_present'), '(CFixedPoint)0'), 'NFP50_LAW_MOVE_NO', 'NFP50_LAW_NO_MOVE')] As posições mostram quem vê a lei com bons olhos e a quem ela custa engolir. Quem de fato conseguiu aprová-la é outra questão."
 NFP50_LAW_MOVEMENT_BASE_2:0 "Os movimentos políticos também têm suas preferências. [SelectLocalization(GreaterThan_CFixedPoint(ScriptContainer.GetVariableValue('nfp50_law_move_yes_present'), '(CFixedPoint)0'), 'NFP50_LAW_MOVE_YES', 'NFP50_LAW_NO_MOVE')] [SelectLocalization(GreaterThan_CFixedPoint(ScriptContainer.GetVariableValue('nfp50_law_move_no_present'), '(CFixedPoint)0'), 'NFP50_LAW_MOVE_NO', 'NFP50_LAW_NO_MOVE')] As posições mostram quem vê a lei com bons olhos e a quem ela custa engolir. Quem de fato conseguiu aprová-la é outra questão."
 NFP50_LAW_MOVEMENT_RELATIVE_1:0 "Os movimentos políticos também têm suas preferências. [SelectLocalization(GreaterThan_CFixedPoint(ScriptContainer.GetVariableValue('nfp50_law_move_yes_present'), '(CFixedPoint)0'), 'NFP50_LAW_MOVE_YES', 'NFP50_LAW_NO_MOVE')] [SelectLocalization(GreaterThan_CFixedPoint(ScriptContainer.GetVariableValue('nfp50_law_move_no_present'), '(CFixedPoint)0'), 'NFP50_LAW_MOVE_NO', 'NFP50_LAW_NO_MOVE')] As posições mostram quem vê a lei com bons olhos e a quem ela custa engolir. Quem de fato conseguiu aprová-la é outra questão."
 NFP50_LAW_MOVEMENT_RELATIVE_2:0 "Os movimentos políticos também têm suas preferências. [SelectLocalization(GreaterThan_CFixedPoint(ScriptContainer.GetVariableValue('nfp50_law_move_yes_present'), '(CFixedPoint)0'), 'NFP50_LAW_MOVE_YES', 'NFP50_LAW_NO_MOVE')] [SelectLocalization(GreaterThan_CFixedPoint(ScriptContainer.GetVariableValue('nfp50_law_move_no_present'), '(CFixedPoint)0'), 'NFP50_LAW_MOVE_NO', 'NFP50_LAW_NO_MOVE')] As posições mostram quem vê a lei com bons olhos e a quem ela custa engolir. Quem de fato conseguiu aprová-la é outra questão."
