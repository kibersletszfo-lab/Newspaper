 NFP52_GER_2_TITLE:0 "Consumada a unificação alemã"
 NFP52_ITA_1_BODY:0 "A Itália se uniu. Já se podia falar dela como terra, cultura e esperança de um futuro comum. À lista se acrescenta agora um Estado. Para quem buscou a unificação, chegou a hora dos cumprimentos. Com eles vem a pergunta sobre como viver juntos depois dos discursos de cerimônia.\n\nFormou-se o Estado italiano. No mapa político do Mediterrâneo surgiu uma união que entra nos cálculos dos vizinhos. O antigo hábito de considerar as terras italianas uma a uma já não explica a situação atual.\n\nUm governo comum herdou preocupações comuns. Uma bandeira só não põe imediatamente de acordo as estradas, os negócios e os interesses das diversas terras. Mas já existe um Estado a quem cabe a tarefa. A unificação aconteceu. Veremos o conteúdo que lhe darão.\n\nA data da crônica indica o mês em que a notícia chegou à redação. Havendo atraso na comunicação, o fato pode ter ocorrido antes."
