 NFP30_PRICE_FIRST:0 "Ainda faltam dados comparáveis do mês anterior para essas mercadorias. Mostramos somente os últimos preços observados."
 NFP30_PRICE_LEAD_1:0 "Desta vez, abrimos o boletim do mercado. Não houve grande notícia para as páginas, mas mesmo num mês tranquilo os preços merecem atenção. Sobretudo quando a compra sai do nosso bolso."
 NFP30_PRICE_LEAD_2:0 "Desta vez, abrimos o boletim do mercado. Não houve grande notícia para as páginas, mas mesmo num mês tranquilo os preços merecem atenção. Sobretudo quando a compra sai do nosso bolso."
 NFP30_PRICE_MARKET:0 "Mercado: [ScriptContainer.MakeScope.Var('nfp32_market_owner').GetCountryDefinition.GetName]."
 NFP30_PRICE_METHOD:0 "Até seis mercadorias, ordenadas pelas maiores variações entre duas observações mensais consecutivas. A seta liga o preço anterior ao mais recente; entre parênteses vai a variação. Para uma mercadoria observada pela primeira vez, só aparece o preço atual. São preços do mercado, distintos dos preços locais e das médias mensais."
 NFP30_PRICE_METRICS:0 "Boletim de rotina em lugar de uma edição vazia. Linhas: [ScriptContainer.GetVariableValue('nfp32_rows')|0]. Comparações: [ScriptContainer.GetVariableValue('nfp32_comparisons')|0]. O registro é mensal. Edições semanais no mesmo mês usam os mesmos números. Uma troca de mercado ou uma falha nas observações interrompe a comparação. Calculam-se os preços a partir do preço-base da mercadoria e do desvio de preço do mercado no jogo. A tabela e sua ordem ficam registradas na publicação."
 NFP30_PRICE_ROW_EMPTY:0 ""
 NFP30_PRICE_SAME:0 "—"
 NFP30_PRICE_TITLE_1:0 "Quanto custa hoje a compra de todo dia?"
 NFP30_PRICE_TITLE_2:0 "Quanto custa hoje a compra de todo dia?"
 NFP30_PRICE_UNAVAILABLE:0 "Não há preços disponíveis para este boletim. A redação preferiu deixar a tabela em branco a preenchê-la com números inventados."
 NFP30_PRICE_UP:0 "@arrow_up!"
 NFP30_PRODUCTION_AWAY_1_BODY:0 "Mercadoria: [Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]. Última posição fora dos três primeiros: [ScriptContainer.GetVariableValue('nfp20_before')|0]. Posição atual: [ScriptContainer.GetVariableValue('nfp20_after')|0]. Duas observações mensais confirmam um lugar entre os três primeiros.\n\nMuda o quadro da produção mundial. A classificação mede o volume produzido. Lucros, exportações e preços em nosso mercado são outras perguntas."
 NFP30_PRODUCTION_AWAY_1_LEAD:0 "Um país estrangeiro entrou entre os três maiores produtores de uma mercadoria importante e manteve a posição pelo segundo mês."
 NFP30_PRODUCTION_AWAY_1_TITLE:0 "Um novo nome entre os grandes produtores do mundo"
 NFP30_PRODUCTION_AWAY_2_BODY:0 "Mercadoria: [Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]. Última posição fora dos três primeiros: [ScriptContainer.GetVariableValue('nfp20_before')|0]. Posição atual: [ScriptContainer.GetVariableValue('nfp20_after')|0]. Duas observações mensais confirmam um lugar entre os três primeiros.\n\nVolume de produção e influência comercial são coisas distintas. Uma posição nesta lista, sozinha, não comprova a segunda."
 NFP30_PRODUCTION_AWAY_2_LEAD:0 "A produção de uma mercadoria importante no exterior está entre as três maiores do mundo."
 NFP30_PRODUCTION_AWAY_2_TITLE:0 "Um grande produtor firma posição no exterior"
 NFP30_PRODUCTION_HOME_1_BODY:0 "Mercadoria: [Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]. Última posição fora dos três primeiros: [ScriptContainer.GetVariableValue('nfp20_before')|0]. Posição atual: [ScriptContainer.GetVariableValue('nfp20_after')|0]. Duas observações mensais confirmam um lugar entre os três primeiros.\n\nUm resultado expressivo na produção. A comparação mede o que se produz. Rentabilidade, exportações e condições de trabalho exigem dados próprios."
 NFP30_PRODUCTION_HOME_1_LEAD:0 "Nosso país se firmou entre os três maiores produtores de uma mercadoria importante."
 NFP30_PRODUCTION_HOME_1_TITLE:0 "Nossa produção entra entre as três maiores do mundo"
 NFP30_PRODUCTION_HOME_2_BODY:0 "Mercadoria: [Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]. Última posição fora dos três primeiros: [ScriptContainer.GetVariableValue('nfp20_before')|0]. Posição atual: [ScriptContainer.GetVariableValue('nfp20_after')|0]. Duas observações mensais confirmam um lugar entre os três primeiros.\n\nUm lugar de destaque em volume é conquista mensurável. A tabela não diz o que custou chegar lá nem quanto cada família ganhou com isso."
 NFP30_PRODUCTION_HOME_2_LEAD:0 "Dois meses entre os três maiores produtores merecem registro como conquista da produção nacional."
 NFP30_PRODUCTION_HOME_2_TITLE:0 "Produção nacional entre as primeiras do mundo"
 NFP30_PRODUCTION_METRICS:0 "Mercadoria: [Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]. Última posição fora dos três primeiros: [ScriptContainer.GetVariableValue('nfp20_before')|0]. Posição atual: [ScriptContainer.GetVariableValue('nfp20_after')|0]. Duas observações mensais confirmam um lugar entre os três primeiros."
 NFP30_PUBLICATION_KIND:0 "[SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp_kind'), '(CFixedPoint)3'), 'NFP30_URGENT', SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp_kind'), '(CFixedPoint)1'), 'NFP30_REGULAR', 'NFP30_MANUAL'))]"
 NFP30_RANK_AWAY_1_BODY:0 "Categoria anterior: [Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]. Nova categoria: [Localize(ScriptContainer.MakeScope.Var('nfp20_extra_detail').GetFlagName)].\n\nPara nossos leitores, é parte de um mundo em mudança. Passar de categoria nem sempre significa que surgiu uma nova grande potência."
 NFP30_RANK_AWAY_1_LEAD:0 "Um país estrangeiro passou a outra categoria internacional."
 NFP30_RANK_AWAY_1_TITLE:0 "Muda a posição relativa das potências"
 NFP30_RANK_AWAY_2_BODY:0 "Categoria anterior: [Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]. Nova categoria: [Localize(ScriptContainer.MakeScope.Var('nfp20_extra_detail').GetFlagName)].\n\nApresentamos as duas categorias para que o leitor veja a direção da mudança. As causas e consequências merecem exame à parte."
 NFP30_RANK_AWAY_2_LEAD:0 "Chega a notícia de uma mudança de categoria de um país estrangeiro."
 NFP30_RANK_AWAY_2_TITLE:0 "Uma potência estrangeira muda de categoria"
 NFP30_RANK_HOME_1_BODY:0 "Categoria anterior: [Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]. Nova categoria: [Localize(ScriptContainer.MakeScope.Var('nfp20_extra_detail').GetFlagName)].\n\nA mudança merece atenção por si só. Seu sentido se avalia pelas categorias indicadas. Nem toda alteração de posição é uma subida."
 NFP30_RANK_HOME_1_LEAD:0 "Mudou a posição internacional de nosso país. Apresentamos a categoria anterior e a atual."
 NFP30_RANK_HOME_1_TITLE:0 "Mudou nosso lugar entre as potências"
 NFP30_RANK_HOME_2_BODY:0 "Categoria anterior: [Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]. Nova categoria: [Localize(ScriptContainer.MakeScope.Var('nfp20_extra_detail').GetFlagName)].\n\nA redação registra a mudança de posição. O nome da nova categoria, sozinho, não explica a origem nem as consequências diplomáticas da mudança."
 NFP30_RANK_HOME_2_LEAD:0 "Nosso país passou a integrar outra categoria de potências."
 NFP30_RANK_HOME_2_TITLE:0 "O país ganha uma nova posição internacional"
 NFP30_RANK_METRICS:0 "Categoria anterior: [Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]. Nova categoria: [Localize(ScriptContainer.MakeScope.Var('nfp20_extra_detail').GetFlagName)]."
 NFP30_REACH_DOMESTIC:0 "acontecimento no país ou participação nossa como uma das partes principais de uma guerra"
 NFP30_REACH_FROZEN:0 "As regiões das capitais e o indicador de importância mundial foram registrados na observação do fato."
 NFP30_REACH_LINE:0 "Alcance: [Localize(ScriptContainer.MakeScope.Var('nfp31_reach').GetFlagName)]. [SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp31_legacy'), '(CFixedPoint)1'), 'NFP30_REACH_MIGRATED', 'NFP30_REACH_FROZEN')]"
 NFP30_REACH_MIGRATED:0 "Para este fato antigo ainda inédito, as regiões das capitais foram recuperadas na migração. Desconhecem-se o interesse regional e a categoria que as partes tinham na época."
 NFP30_REACH_OLD:0 "Esta edição saiu antes da introdução do filtro regional."
 NFP30_REACH_PRICE_LOCAL:0 "boletim de rotina do mercado do país do leitor"
 NFP30_REACH_REGION:0 "o país do leitor tinha interesse regional de pelo menos 2 tanto na recepção quanto na publicação"
 NFP30_REACH_REJECTED:0 "Filtro regional: [ScriptContainer.GetVariableValue('nfp31_rejected_region')|0] matérias adiadas."
 NFP30_REACH_WORLD:0 "importância mundial: guerra entre duas grandes potências ou aquisição ou perda da categoria de grande potência"
 NFP30_REASON_PRICES:0 "Nenhuma notícia foi selecionada para esta edição. Acrescentou-se o boletim mensal de preços."
 NFP30_REGULAR:0 "Edição regular"
 NFP30_RUBRIC_1:0 "Economia"
 NFP30_RUBRIC_2:0 "Guerra"
 NFP30_RUBRIC_3:0 "Sociedade"
 NFP30_RUBRIC_4:0 "Acontecimentos"
 NFP30_RUBRIC_EMPTY:0 "Esta edição não contém matérias para a seção escolhida. A seção estava desativada ou não havia notícia adequada."
 NFP30_RUBRIC_JUMP:0 "Ir para a primeira matéria desta seção."
 NFP30_SHORTAGE_HOME_1_BODY:0 "Mercadoria: [Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]. Nosso mercado registrou escassez em duas observações mensais seguidas.\n\nA oferta e o consumo da mercadoria merecem atenção. O boletim trata da escassez em si. Um preço elevado é outra questão."
 NFP30_SHORTAGE_HOME_1_LEAD:0 "A falta de mercadoria no mercado deixou de ser notícia isolada. O assunto chega hoje às páginas de economia."
 NFP30_SHORTAGE_HOME_1_TITLE:0 "Falta no mercado uma mercadoria necessária"
 NFP30_SHORTAGE_HOME_2_BODY:0 "Mercadoria: [Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]. Nosso mercado registrou escassez em duas observações mensais seguidas.\n\nA escassez está confirmada. Suas causas seguem por apurar. Os dados não apontam culpados nem prometem resultados para uma obra específica."
 NFP30_SHORTAGE_HOME_2_LEAD:0 "Pelo segundo mês, o mercado registra a falta de uma mercadoria importante. Êxitos em outras áreas não resolvem a questão."
 NFP30_SHORTAGE_HOME_2_TITLE:0 "A escassez merece atenção"
 NFP30_SHORTAGE_METRICS:0 "Mercadoria: [Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]. Nosso mercado registrou escassez em duas observações mensais seguidas."
 NFP30_SHORTAGE_RECOVERY_HOME_1_BODY:0 "Mercadoria: [Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]. Depois do alerta, dois boletins mensais seguidos deixaram de registrar a escassez anterior.\n\nRegistramos a ausência da escassez observada antes. Isso ainda não promete preços baixos. Ser caro e ser difícil de encontrar são coisas distintas."
 NFP30_SHORTAGE_RECOVERY_HOME_1_LEAD:0 "Há boas notícias sobre uma mercadoria cuja falta já apareceu nestas páginas."
 NFP30_SHORTAGE_RECOVERY_HOME_1_TITLE:0 "A escassez anterior perde força"
 NFP30_SHORTAGE_RECOVERY_HOME_2_BODY:0 "Mercadoria: [Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]. Depois do alerta, dois boletins mensais seguidos deixaram de registrar a escassez anterior.\n\nA melhora se manteve por dois meses. Seguiremos distinguindo disponibilidade de preço acessível, que este boletim por si só não comprova."
 NFP30_SHORTAGE_RECOVERY_HOME_2_LEAD:0 "Os dados do mercado trazem a notícia que esperávamos desde o alerta: já não se registra a escassez anterior."
 NFP30_SHORTAGE_RECOVERY_HOME_2_TITLE:0 "Uma boa virada no abastecimento"
 NFP30_SHORTAGE_RECOVERY_METRICS:0 "Mercadoria: [Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]. Depois do alerta, dois boletins mensais seguidos deixaram de registrar a escassez anterior."
 NFP30_TECH_AWAY_1_BODY:0 "O país passou a dominar a tecnologia «[Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]».\n\nAbriram-se novas possibilidades. Uma boa ocasião para olhar nossos próprios negócios. O que já sabemos fazer, e que uso damos a isso? Os parabéns podem esperar o correio. Uma boa ideia para nós mesmos vale guardar desde já."
 NFP30_TECH_AWAY_1_LEAD:0 "Um país estrangeiro dominou uma nova tecnologia. Enquanto líamos os boletins de sempre, lá fora surgiram novas possibilidades. Vale descobrir quais."
 NFP30_TECH_AWAY_1_TITLE:0 "Lá fora, já se pode fazer mais"
 NFP30_TECH_AWAY_2_BODY:0 "O país passou a dominar a tecnologia «[Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]».\n\nAbriram-se novas possibilidades. Uma boa ocasião para olhar nossos próprios negócios. O que já sabemos fazer, e que uso damos a isso? Os parabéns podem esperar o correio. Uma boa ideia para nós mesmos vale guardar desde já."
 NFP30_TECH_AWAY_2_LEAD:0 "Um país estrangeiro dominou uma nova tecnologia. Enquanto líamos os boletins de sempre, lá fora surgiram novas possibilidades. Vale descobrir quais."
 NFP30_TECH_AWAY_2_TITLE:0 "Lá fora, já se pode fazer mais"
 NFP30_TECH_HOME_1_BODY:0 "O país passou a dominar a tecnologia «[Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]».\n\nSabemos mais. Falta dar bom uso ao conhecimento. Há motivo para orgulho e também para trabalho. Gostaríamos de noticiar em seguida o que a descoberta permitiu fazer. Uma lista de possibilidades é agradável; vê-las em uso é melhor."
 NFP30_TECH_HOME_1_LEAD:0 "Nosso país dominou uma nova tecnologia. Boa notícia para quem gostaria de fazer a economia andar com mais que promessas."
 NFP30_TECH_HOME_1_TITLE:0 "Mais conhecimento. Mãos à obra"
 NFP30_TECH_HOME_2_BODY:0 "O país passou a dominar a tecnologia «[Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]».\n\nSabemos mais. Falta dar bom uso ao conhecimento. Há motivo para orgulho e também para trabalho. Gostaríamos de noticiar em seguida o que a descoberta permitiu fazer. Uma lista de possibilidades é agradável; vê-las em uso é melhor."
 NFP30_TECH_HOME_2_LEAD:0 "Nosso país dominou uma nova tecnologia. Boa notícia para quem gostaria de fazer a economia andar com mais que promessas."
 NFP30_TECH_HOME_2_TITLE:0 "Mais conhecimento. Mãos à obra"
