 NFP52_JAP_1_BODY:0 "Restaurou-se o poder imperial no Japão. É curioso como a notícia da volta a uma ordem antiga pode abrir uma página nova. Mudou o equilíbrio entre a corte e o xogunato. Mesmo para quem vive longe, vale perguntar por qual caminho o país pretende seguir.\n\nA restauração imperial se consumou. O centro político do país ocupa uma posição diferente, e daí surge a questão de como se organizará a vida no Japão. A proclamação solene já ocorreu. Os efeitos no cotidiano dependerão das decisões seguintes.\n\nO retorno da autoridade imperial não antecipa todas as mudanças que ainda poderão vir. Caberá ao Japão mostrar o uso que fará da nova ordem. Gostaríamos de julgar a história pelos atos. Em promessas, como se sabe, os títulos solenes raramente ficam devendo.\n\nA data da crônica indica o mês em que a notícia chegou à redação. Havendo atraso na comunicação, o fato pode ter ocorrido antes."
