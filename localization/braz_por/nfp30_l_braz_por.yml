 NFP52_AUS_2_TITLE:0 "Um Estado comum no continente distante"
 NFP52_CAN_1_BODY:0 "O Canadá ganhou um governo comum. Para quem olha de fora, mudou o mapa. Para quem mora nas terras canadenses, surge a oportunidade de resolver mais questões em conjunto. O nome que as unia já não serve só à geografia.\n\nA unificação canadense se concretizou. Há agora um Estado para cuidar das questões comuns dos territórios que o compõem. A relação com o suserano se decide à parte. A união, por si só, não é uma declaração de independência.\n\nResta dar conteúdo às decisões conjuntas. Uma placa nova não encurta as distâncias nem concilia os interesses locais ou os negócios da lavoura. Mas essas questões ao menos ganharam um endereço comum. Seria bom encontrar lá também as respostas.\n\nA data da crônica indica o mês em que a notícia chegou à redação. Havendo atraso na comunicação, o fato pode ter ocorrido antes."
