 NFP52_ARTICLE_META:0 "Crônica mundial · [Localize(ScriptContainer.MakeScope.Var('nfp30_month').GetFlagName)] de [ScriptContainer.GetVariableValue('nfp20_year')|0] · Edição extraordinária"
 NFP52_AUS_1_BODY:0 "Há agora um Estado australiano unificado. Do continente distante chega uma notícia de primeira página. Territórios com governos distintos ganharam uma organização política comum. O nome conhecido dos mapas passa a designar também assuntos a resolver em conjunto.\n\nFormou-se a Austrália. A notícia diz respeito à organização dos territórios australianos. A independência e as obrigações internacionais constituem outra questão. O Estado comum já existe. Sua posição dependerá das decisões que tomar e das relações com as outras potências.\n\nA união permite resolver questões sob um mesmo governo. O trabalho cotidiano mostrará que uso se fará dessa oportunidade. Num continente desse tamanho, preocupações em comum não faltarão. Tomara que os benefícios também possam ser repartidos.\n\nA data da crônica indica o mês em que a notícia chegou à redação. Havendo atraso na comunicação, o fato pode ter ocorrido antes."
