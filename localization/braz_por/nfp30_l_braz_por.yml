 NFP51_RELATION_ALLY:0 "Quando ocorreu o fato, pelo menos uma das duas partes principais era nossa aliada formal. Esse vínculo, por si só, não estabelece nossa participação na jogada nem numa eventual guerra."
 NFP51_RELATION_BLOC:0 "Ao menos um dos lados principais pertencia ao nosso bloco de poder quando ocorreu o fato. Um bloco comum não substitui uma aliança militar nem significa que nosso país entrou na disputa."
 NFP51_RELATION_JOINER:0 "Foi nosso país que aderiu à jogada diplomática. Tomar partido, a esta altura, ainda não significa que a guerra começou."
 NFP51_RELATION_JOINER_ALLY:0 "O país que tomou partido era nosso aliado formal quando ocorreu o fato. Da decisão dele não se pode deduzir a nossa entrada na disputa."
 NFP51_RELATION_JOINER_BLOC:0 "O país que tomou partido pertencia ao nosso bloco de poder. A notícia diz respeito à posição desse país e não obriga todo o bloco a acompanhá-lo."
 NFP51_RELATION_OWN:0 "Nosso país é uma das duas partes principais do confronto. A notícia, portanto, interessa diretamente à nossa diplomacia."
 NFP51_SPECIAL_HINT:0 "Esta edição extraordinária é inteiramente dedicada a um acontecimento."
 NFP51_SPECIAL_LABEL:0 "Edição extraordinária"
 NFP51_START_1_CORE:0 "O confronto diplomático começou neste mês. A iniciativa partiu de [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName], e o alvo inicial foi [ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName]. Questão em disputa: [Localize(ScriptContainer.MakeScope.Var('nfp51_play_label').GetFlagName)]."
 NFP51_START_1_END:0 "Ainda não se chegou à guerra. Os lados podem procurar apoio, ceder ou insistir em suas exigências. Tomara que apareça um argumento convincente antes que só se dê ouvidos ao canhão. Acompanharemos os próximos passos da disputa."
 NFP51_START_1_LEAD:0 "As exigências partiram de [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName]. Do outro lado está [ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName]."
 NFP51_START_1_TITLE:0 "Dos argumentos às exigências"
 NFP51_START_2_CORE:0 "Há um novo confronto no noticiário diplomático. Quem fez as exigências foi [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName], e elas se dirigem a [ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName]. O motivo da disputa é [Localize(ScriptContainer.MakeScope.Var('nfp51_play_label').GetFlagName)]."
 NFP51_START_2_END:0 "Ainda não se chegou à guerra. Os lados podem procurar apoio, ceder ou insistir em suas exigências. Tomara que apareça um argumento convincente antes que só se dê ouvidos ao canhão. Acompanharemos os próximos passos da disputa."
 NFP51_START_2_LEAD:0 "Começou o confronto diplomático entre [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName] e [ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName]."
 NFP51_START_2_TITLE:0 "Dos argumentos às exigências"
 NFP51_START_TIMELINE:0 "Registramos o início desta jogada diplomática em [Localize(Concatenate('NFP30_MONTH_', ToString_int32(FixedPointToInt(ScriptContainer.GetVariableValue('nfp51_start_month')))))] de [ScriptContainer.GetVariableValue('nfp51_start_year')|0]. Os relatos posteriores dizem respeito à mesma crise."
 NFP52_ACW_1_BODY:0 "Começou a guerra civil nos Estados Unidos. Há notícias que dão outro sentido ao nome de um país conhecido. A União americana agora discute seu futuro pelas armas. Por trás das palavras sobre unidade e liberdade de escolher o próprio caminho, há uma pergunta mais difícil: o que as pessoas terão de suportar até que a disputa termine?\n\nOs Estados Unidos entraram em guerra com um Estado americano separatista. O confronto político ultrapassou o ponto em que bastava sentar à mesa para tomar decisões. O futuro da própria União depende agora do desfecho dos combates.\n\nO resto do mundo tem razões para acompanhar essa disputa. Mudou a situação de um país com o qual se negocia, se comercia e se fazem planos. Mas a guerra diz respeito antes de tudo a quem precisa viver no meio dessa divisão. Preferiríamos publicar em breve os termos da paz a nos acostumar com mais um boletim de que a guerra continua.\n\nA data da crônica indica o mês em que a notícia chegou à redação. Havendo atraso na comunicação, o fato pode ter ocorrido antes."
 NFP52_ACW_1_CONTEXT:0 "O resto do mundo tem razões para acompanhar essa disputa. Mudou a situação de um país com o qual se negocia, se comercia e se fazem planos. Mas a guerra diz respeito antes de tudo a quem precisa viver no meio dessa divisão. Preferiríamos publicar em breve os termos da paz a nos acostumar com mais um boletim de que a guerra continua."
 NFP52_ACW_1_FACT:0 "Os Estados Unidos entraram em guerra com um Estado americano separatista. O confronto político ultrapassou o ponto em que bastava sentar à mesa para tomar decisões. O futuro da própria União depende agora do desfecho dos combates."
 NFP52_ACW_1_LEAD:0 "Começou a guerra civil nos Estados Unidos. Há notícias que dão outro sentido ao nome de um país conhecido. A União americana agora discute seu futuro pelas armas. Por trás das palavras sobre unidade e liberdade de escolher o próprio caminho, há uma pergunta mais difícil: o que as pessoas terão de suportar até que a disputa termine?"
 NFP52_ACW_1_TITLE:0 "Os Estados Unidos em guerra consigo mesmos"
 NFP52_ACW_2_BODY:0 "Começou a guerra civil nos Estados Unidos. Há notícias que dão outro sentido ao nome de um país conhecido. A União americana agora discute seu futuro pelas armas. Por trás das palavras sobre unidade e liberdade de escolher o próprio caminho, há uma pergunta mais difícil: o que as pessoas terão de suportar até que a disputa termine?\n\nOs Estados Unidos entraram em guerra com um Estado americano separatista. O confronto político ultrapassou o ponto em que bastava sentar à mesa para tomar decisões. O futuro da própria União depende agora do desfecho dos combates.\n\nO resto do mundo tem razões para acompanhar essa disputa. Mudou a situação de um país com o qual se negocia, se comercia e se fazem planos. Mas a guerra diz respeito antes de tudo a quem precisa viver no meio dessa divisão. Preferiríamos publicar em breve os termos da paz a nos acostumar com mais um boletim de que a guerra continua.\n\nA matéria traz o mês em que a redação recebeu a confirmação. O dia exato do acontecimento ainda precisa ser apurado."
