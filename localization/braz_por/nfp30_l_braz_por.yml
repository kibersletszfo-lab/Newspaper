 NFP43_ELECTION_BASELINE:0 "Comparação com o boletim eleitoral da edição nº [ScriptContainer.GetVariableValue('nfp43_previous_issue')|0]. Nos partidos com dados comparáveis, mostramos o valor anterior, o atual e a variação do índice. Um travessão indica que falta o valor anterior."
 NFP43_ELECTION_BODY_1:0 "A campanha continua e o quadro ainda pode mudar. Eis o ímpeto dos partidos no último levantamento.\n\n[Localize(ScriptContainer.MakeScope.Var('nfp43_row_1').GetFlagName)]\n[Localize(ScriptContainer.MakeScope.Var('nfp43_row_2').GetFlagName)]\n[Localize(ScriptContainer.MakeScope.Var('nfp43_row_3').GetFlagName)]\n[Localize(ScriptContainer.MakeScope.Var('nfp43_row_4').GetFlagName)]\n[Localize(ScriptContainer.MakeScope.Var('nfp43_row_5').GetFlagName)]\n[Localize(ScriptContainer.MakeScope.Var('nfp43_row_6').GetFlagName)]\n\n[SelectLocalization(GreaterThan_CFixedPoint(ScriptContainer.GetVariableValue('nfp43_previous_issue'), '(CFixedPoint)0'), 'NFP43_ELECTION_BASELINE', 'NFP43_ELECTION_FIRST')]\n\nOs números medem o fôlego da campanha. Ainda não se contou um só voto aqui. O ímpeto pesa na disputa, mas não decide o vencedor. Listamos até seis partidos, na ordem dos maiores índices no fechamento desta edição. Os valores são os coeficientes do jogo."
 NFP43_ELECTION_BODY_2:0 "A corrida eleitoral segue em aberto. Vamos comparar o ímpeto das campanhas e deixar a contagem de votos para o dia devido.\n\n[Localize(ScriptContainer.MakeScope.Var('nfp43_row_1').GetFlagName)]\n[Localize(ScriptContainer.MakeScope.Var('nfp43_row_2').GetFlagName)]\n[Localize(ScriptContainer.MakeScope.Var('nfp43_row_3').GetFlagName)]\n[Localize(ScriptContainer.MakeScope.Var('nfp43_row_4').GetFlagName)]\n[Localize(ScriptContainer.MakeScope.Var('nfp43_row_5').GetFlagName)]\n[Localize(ScriptContainer.MakeScope.Var('nfp43_row_6').GetFlagName)]\n\n[SelectLocalization(GreaterThan_CFixedPoint(ScriptContainer.GetVariableValue('nfp43_previous_issue'), '(CFixedPoint)0'), 'NFP43_ELECTION_BASELINE', 'NFP43_ELECTION_FIRST')]\n\nOs números mostram o momento dos partidos, sem prever sua parcela de votos. O ímpeto pesa na disputa, mas não decide o vencedor. Listamos até seis partidos com os maiores índices no fechamento desta edição, usando os coeficientes do jogo."
 NFP43_ELECTION_FIRST:0 "Este é o primeiro boletim publicado sobre esta campanha. O travessão assinala os partidos para os quais ainda não há comparação."
 NFP43_ELECTION_LEAD_1:0 "A campanha está nas ruas. Os partidos procuram ganhar terreno, e a redação acompanha a disputa. Por ora, guardamos os discursos de vitória na gaveta. Falta um pequeno detalhe para publicá-los: o resultado das urnas."
 NFP43_ELECTION_LEAD_2:0 "A campanha está nas ruas. Os partidos procuram ganhar terreno, e a redação acompanha a disputa. Por ora, guardamos os discursos de vitória na gaveta. Falta um pequeno detalhe para publicá-los: o resultado das urnas."
 NFP43_ELECTION_METRICS:0 "Dados do fechamento da edição. Tipo 24, seção Sociedade. A comparação usa o último boletim publicado sobre a mesma campanha. Uma pauta que ficou fora da edição não altera a referência. Uma campanha nova ou um partido que acaba de aparecer começa sem histórico. Os valores e a ordem ficam registrados, mas o nome do partido acompanha o jogo."
