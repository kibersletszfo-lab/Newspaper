 NFP52_CAN_2_TITLE:0 "As terras canadenses ganham um Estado comum"
 NFP52_CHINA_1_BODY:0 "A China perdeu sua antiga unidade política. Onde o mapa mostrava uma grande mancha de uma só cor, há agora vários centros de poder. Para o diplomata, são novos endereços. Para quem precisa atravessar uma fronteira nova para fazer negócio, a primeira pergunta é quais dos acordos de ontem ainda valem.\n\nA autoridade antes unificada se desfez. Governos independentes terão de acertar as relações entre si, enquanto o mundo procura saber com quem negociar. O nome do país continua conhecido de todo leitor. Saber quem fala em nome dele ficou bem mais difícil.\n\nPor trás do novo mapa, a vida continua. As pessoas precisam trabalhar, negociar e entender as regras mesmo enquanto os governos discutem de quem são as regras que valem. Veremos aonde leva a fragmentação. Tomara que a conta não recaia justamente sobre quem menos pôde influir no resultado.\n\nA data da crônica indica o mês em que a notícia chegou à redação. Havendo atraso na comunicação, o fato pode ter ocorrido antes."
