 NFP52_ROM_2_TITLE:0 "Consumada a unificação romena"
 NFP52_SPRING_1_BODY:0 "Por toda a Europa chegam notícias de agitação política. Os acontecimentos já receberam um nome comum: Primavera dos Povos. É uma expressão conveniente, desde que o leitor não imagine que todas essas histórias começam com a mesma queixa e acabarão do mesmo modo.\n\nA Primavera dos Povos tornou-se uma questão europeia. As convulsões políticas ultrapassam as fronteiras de um único país. O quadro geral merece atenção, mas as exigências, os protagonistas e os resultados ainda precisam ser apurados em cada lugar.\n\nPor trás dos grandes nomes há gente que precisa viver em meio à mudança. Voltaremos a essas histórias conforme chegarem notícias de cada país. Será mais útil contar o que de fato mudou do que atribuir a toda a Europa um desfecho que ninguém ainda conhece.\n\nA data da crônica indica o mês em que a notícia chegou à redação. Havendo atraso na comunicação, o fato pode ter ocorrido antes."
