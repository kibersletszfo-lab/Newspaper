 NFP50_SUPPLY_BOTH_1:0 "Tanto as construções do governo quanto as militares usam a mercadoria. Isso aumenta a importância do abastecimento. Os dados não identificam perdas específicas para o serviço público ou o exército."
 NFP50_SUPPLY_BOTH_2:0 "A mercadoria é usada em construções governamentais e militares. Seu abastecimento, portanto, merece atenção. É preciso distinguir esses usos das consequências comprovadas da escassez."
 NFP50_SUPPLY_CRITICAL_1:0 "Há um motivo especial de preocupação. Na data do fato, a gravidade da escassez no mercado e a falta local do produto atendem às condições de um alerta vermelho de escassez em nosso país. Os sinais não revelam quantos moradores ou empresas foram afetados."
 NFP50_SUPPLY_CRITICAL_2:0 "Desta vez a situação exige atenção especial. Na data do fato, o país atende aos critérios do alerta vermelho de escassez. Isso ainda não mede os prejuízos de cada empresa."
 NFP50_SUPPLY_END_1:0 "A redação pede que se investigue a dificuldade sem demora. Para escolher entre produzir mais, recorrer ao comércio ou buscar outra medida, é preciso conhecer as condições locais. Uma conta de jornal não traz uma receita pronta para a economia."
 NFP50_SUPPLY_END_2:0 "Vale examinar logo a situação. Primeiro é preciso descobrir onde o abastecimento emperrou. Os números do jornal ajudam a formular a pergunta, mas a resposta exige olhar a produção e o comércio."
 NFP50_SUPPLY_FOLLOW_1:0 "Voltamos a um caso de abastecimento que já esteve nestas páginas. Um novo levantamento dá motivo para continuar a conversa."
 NFP50_SUPPLY_FOLLOW_2:0 "Este assunto já passou por nossas páginas. Novas informações nos trazem de volta a ele."
 NFP50_SUPPLY_GAP_1:0 "A mercadoria é [ScriptContainer.MakeScope.Var('nfp46_good').GetGoods.GetNameNoIcon]. As ordens de venda correspondem a menos de 80% das ordens de compra. Ordens de compra: [ScriptContainer.GetVariableValue('nfp46_buy_before')|1] → [ScriptContainer.GetVariableValue('nfp46_buy_after')|1]. Ordens de venda: [ScriptContainer.GetVariableValue('nfp46_sell_before')|1] → [ScriptContainer.GetVariableValue('nfp46_sell_after')|1]. À esquerda, o primeiro registro guardado nesta série; à direita, o registro na data do fato. Uma diferença expressiva nas ordens não prova, por si só, que haja penalidade na produção."
 NFP50_SUPPLY_GAP_2:0 "Para «[ScriptContainer.MakeScope.Var('nfp46_good').GetGoods.GetNameNoIcon]», a procura supera bastante a oferta: as ordens de venda somam menos de 80% das de compra. Ordens de compra: [ScriptContainer.GetVariableValue('nfp46_buy_before')|1] → [ScriptContainer.GetVariableValue('nfp46_buy_after')|1]. Ordens de venda: [ScriptContainer.GetVariableValue('nfp46_sell_before')|1] → [ScriptContainer.GetVariableValue('nfp46_sell_after')|1]. À esquerda, o primeiro registro guardado nesta série; à direita, o registro na data do fato. São ordens no mercado, não uma contagem dos produtos que faltaram nas casas."
 NFP50_SUPPLY_GOVERNMENT_1:0 "Construções do governo utilizam a mercadoria. É um uso importante, mas o boletim não identifica repartições específicas nem mede perdas que tenham sofrido."
 NFP50_SUPPLY_GOVERNMENT_2:0 "Uma parte da procura vem de construções do governo. Esse uso não comprova prejuízo a uma repartição em particular."
 NFP50_SUPPLY_INTRO_1:0 "Nosso mercado pede atenção: os últimos boletins confirmam uma dificuldade persistente de abastecimento."
 NFP50_SUPPLY_INTRO_2:0 "O abastecimento nos traz de volta aos boletins do mercado. A redação destaca a mercadoria que enfrenta dificuldades."
 NFP50_SUPPLY_LONG_1:0 "O problema aparece em [ScriptContainer.GetVariableValue('nfp50_supply_observations')|0] observações mensais seguidas. Cada uma registrou um grande descompasso nas ordens ou um sinal direto de escassez. Isso não significa que tenha havido penalidade contínua à produção entre as datas."
 NFP50_SUPPLY_LONG_2:0 "Chegou a [ScriptContainer.GetVariableValue('nfp50_supply_observations')|0] o número de observações mensais seguidas com problemas de abastecimento. O sinal pode ter alternado entre descompasso nas ordens e escassez no mercado. Esses registros não reconstituem a situação dia a dia."
 NFP50_SUPPLY_MILITARY_1:0 "A mercadoria abastece construções militares. Isso justifica atenção, mas não comprova que as tropas já tenham sofrido perdas ou penalidades."
 NFP50_SUPPLY_MILITARY_2:0 "As construções militares utilizam a mercadoria. Registramos a importância do abastecimento sem atribuir ao exército consequências ainda por comprovar."
 NFP50_SUPPLY_NATIVE_1:0 "A mercadoria é [ScriptContainer.MakeScope.Var('nfp46_good').GetGoods.GetNameNoIcon]. Na data do fato, o mercado acusou diretamente a escassez. Ordens de compra: [ScriptContainer.GetVariableValue('nfp46_buy_before')|1] → [ScriptContainer.GetVariableValue('nfp46_buy_after')|1]. Ordens de venda: [ScriptContainer.GetVariableValue('nfp46_sell_before')|1] → [ScriptContainer.GetVariableValue('nfp46_sell_after')|1]. À esquerda, o primeiro registro guardado nesta série; à direita, o registro na data do fato."
 NFP50_SUPPLY_NATIVE_2:0 "O boletim trata de [ScriptContainer.MakeScope.Var('nfp46_good').GetGoods.GetNameNoIcon]. A observação mais recente registra um sinal direto de escassez no mercado. Ordens de compra: [ScriptContainer.GetVariableValue('nfp46_buy_before')|1] → [ScriptContainer.GetVariableValue('nfp46_buy_after')|1]. Ordens de venda: [ScriptContainer.GetVariableValue('nfp46_sell_before')|1] → [ScriptContainer.GetVariableValue('nfp46_sell_after')|1]. À esquerda, o primeiro registro guardado nesta série; à direita, o registro na data do fato."
 NFP50_SUPPLY_NO_IMPORT_1:0 "A observação atual não registra importação da mercadoria pelo mercado. Produção: [ScriptContainer.GetVariableValue('nfp50_supply_production')|1]. Consumo: [ScriptContainer.GetVariableValue('nfp50_supply_consumption')|1]. Exportações: [ScriptContainer.GetVariableValue('nfp50_supply_exports')|1]. A falta de importações não demonstra que faltem oportunidades de comércio."
 NFP50_SUPPLY_NO_IMPORT_2:0 "O mercado não registrou importações da mercadoria na data do fato. Produz [ScriptContainer.GetVariableValue('nfp50_supply_production')|1], consome [ScriptContainer.GetVariableValue('nfp50_supply_consumption')|1] e exporta [ScriptContainer.GetVariableValue('nfp50_supply_exports')|1]. O boletim não avalia a possibilidade de entregas futuras."
 NFP50_SUPPLY_PRICE_1:0 "Preço na data do fato: £[ScriptContainer.GetVariableValue('nfp50_supply_price')|1]. Desvio em relação ao preço-base: [ScriptContainer.GetVariableValue('nfp50_supply_premium')|1]% (valor negativo indica preço menor). O preço não diz se cada comprador consegue obter a mercadoria."
 NFP50_SUPPLY_PRICE_2:0 "Há também a questão do preço. Preço na data do fato: £[ScriptContainer.GetVariableValue('nfp50_supply_price')|1]. Desvio em relação ao preço-base: [ScriptContainer.GetVariableValue('nfp50_supply_premium')|1]% (valor negativo indica preço menor). O preço não diz se cada comprador consegue obter a mercadoria."
 NFP50_SUPPLY_RECOVERY_1:0 "A mercadoria é [ScriptContainer.MakeScope.Var('nfp46_good').GetGoods.GetNameNoIcon]. Em [ScriptContainer.GetVariableValue('nfp50_supply_good_observations')|0] observações mensais seguidas, não houve sinal direto de escassez e a oferta atingiu pelo menos 80% da procura. Ordens de compra: [ScriptContainer.GetVariableValue('nfp46_buy_before')|1] → [ScriptContainer.GetVariableValue('nfp46_buy_after')|1]. Ordens de venda: [ScriptContainer.GetVariableValue('nfp46_sell_before')|1] → [ScriptContainer.GetVariableValue('nfp46_sell_after')|1]. À esquerda, o primeiro registro guardado nesta série; à direita, o registro na data do fato. Ainda pode haver um descompasso abaixo do limiar de alerta."
 NFP50_SUPPLY_RECOVERY_2:0 "Para «[ScriptContainer.MakeScope.Var('nfp46_good').GetGoods.GetNameNoIcon]», já são [ScriptContainer.GetVariableValue('nfp50_supply_good_observations')|0] observações mensais seguidas sem o antigo sinal de escassez nem insuficiência de oferta superior a 20% da procura. Ordens de compra: [ScriptContainer.GetVariableValue('nfp46_buy_before')|1] → [ScriptContainer.GetVariableValue('nfp46_buy_after')|1]. Ordens de venda: [ScriptContainer.GetVariableValue('nfp46_sell_before')|1] → [ScriptContainer.GetVariableValue('nfp46_sell_after')|1]. À esquerda, o primeiro registro guardado nesta série; à direita, o registro na data do fato. Isso não garante equilíbrio perfeito."
 NFP50_SUPPLY_RECOVERY_END_1:0 "Registramos a melhora sem dar o assunto por encerrado para sempre. Indicadores favoráveis no mercado não demonstram, sozinhos, que toda empresa se recuperou ou que todo preço caiu."
 NFP50_SUPPLY_RECOVERY_END_2:0 "É uma boa virada em uma história conhecida. Nas próximas edições continuaremos olhando o mercado. A melhora de agora ainda não é uma promessa de prosperidade duradoura."
 NFP50_SUPPLY_RECOVERY_INTRO_1:0 "Chegaram informações animadoras sobre uma dificuldade no abastecimento que já apareceu nestas páginas."
 NFP50_SUPPLY_RECOVERY_INTRO_2:0 "Voltamos à escassez de que já tratamos. Os novos boletins apontam melhora."
 NFP50_SUPPLY_TRADE_1:0 "Produção no mercado: [ScriptContainer.GetVariableValue('nfp50_supply_production')|1]. Consumo: [ScriptContainer.GetVariableValue('nfp50_supply_consumption')|1]. Importações: [ScriptContainer.GetVariableValue('nfp50_supply_imports')|1]. Exportações: [ScriptContainer.GetVariableValue('nfp50_supply_exports')|1]. As importações representam [ScriptContainer.GetVariableValue('nfp50_supply_import_fraction')|1]% da soma da produção com as importações. É uma medida do abastecimento do mercado, não da parcela das compras dos habitantes do nosso país. O volume de comércio, por si só, não explica a escassez."
 NFP50_SUPPLY_TRADE_2:0 "Por trás das ordens há produção e comércio. Produção no mercado: [ScriptContainer.GetVariableValue('nfp50_supply_production')|1]. Consumo: [ScriptContainer.GetVariableValue('nfp50_supply_consumption')|1]. Importações: [ScriptContainer.GetVariableValue('nfp50_supply_imports')|1]. Exportações: [ScriptContainer.GetVariableValue('nfp50_supply_exports')|1]. As importações representam [ScriptContainer.GetVariableValue('nfp50_supply_import_fraction')|1]% da soma da produção com as importações. É uma medida do abastecimento do mercado, não da parcela das compras dos habitantes do nosso país. O volume de comércio, por si só, não explica a escassez."
