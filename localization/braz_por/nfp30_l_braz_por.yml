 NFP52_FLU_2_TITLE:0 "O mundo diante de uma nova epidemia"
 NFP52_GER_1_BODY:0 "A Alemanha tornou-se um Estado unificado. O nome é velho conhecido dos leitores, mas o mapa político merece outra olhada. A um nome comum corresponde agora um governo comum. Quem montou seus planos sobre a divisão alemã terá de rever coisa mais séria que o atlas.\n\nFormou-se o Estado alemão. A união de suas terras é um fato político com o qual os vizinhos terão de contar. O alcance de suas fronteiras e possibilidades merece exame próprio. Já é tarde, porém, para discutir a Alemanha só como um conjunto de Estados separados.\n\nReunir um país é uma conquista. Fazê-lo funcionar é a tarefa seguinte. Depois das festas vêm as regras comuns, os assuntos econômicos e as relações com os vizinhos. O nome já está no mapa. Agora será interessante ver que feitos passarão a acompanhá-lo.\n\nA data da crônica indica o mês em que a notícia chegou à redação. Havendo atraso na comunicação, o fato pode ter ocorrido antes."
