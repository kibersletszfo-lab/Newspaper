 NFP52_TAIPING_2_TITLE:0 "A crise chinesa ganha um novo governo"
 NFP52_YUG_1_BODY:0 "Surgiu nos Bálcãs um Estado iugoslavo. A ideia de uma organização comum adquiriu forma política. Para uma região tão presente nos cálculos internacionais, a novidade tem peso particular. Há agora um novo Estado a incluir nesses cálculos.\n\nEstá confirmada a formação da Iugoslávia. A união dos eslavos do sul passa a constar do mapa político. As terras que a compõem e as relações com os vizinhos merecem exame. Copiar as suposições de ontem para o boletim de hoje seria uma economia de trabalho bastante duvidosa.\n\nUm nome comum dá início à tarefa de viver em conjunto. Quando a festa terminar, restará conciliar interesses diferentes nos assuntos de todos os dias. Tomara que a união seja útil também a quem não desenha mapas. Dentro dessas fronteiras há gente que precisa viver.\n\nA data da crônica indica o mês em que a notícia chegou à redação. Havendo atraso na comunicação, o fato pode ter ocorrido antes."
 NFP52_YUG_1_CONTEXT:0 "Um nome comum dá início à tarefa de viver em conjunto. Quando a festa terminar, restará conciliar interesses diferentes nos assuntos de todos os dias. Tomara que a união seja útil também a quem não desenha mapas. Dentro dessas fronteiras há gente que precisa viver."
