 NFP52_ETH_1_BODY:0 "O Estado etíope se unificou. Os antigos centros de poder deram lugar a um governo comum. Para quem mora ali, começa uma nova organização da vida pública. Para os vizinhos, há uma mudança a levar em conta.\n\nEstá confirmada a formação da Etiópia. Uma autoridade unificada pode falar pelo novo Estado. A solidez dos laços entre as partes se verá nos próximos anos. A união em si já merece atenção, por mais longe que fique de nossas fronteiras.\n\nGoverno comum tem trabalho comum pela frente. Transformar uma conquista política em instituições duradouras exige pelo menos tanto quanto unir o país. Acompanharemos os próximos passos. Seria bom que a nova posição também trouxesse oportunidades aos habitantes.\n\nA data da crônica indica o mês em que a notícia chegou à redação. Havendo atraso na comunicação, o fato pode ter ocorrido antes."
