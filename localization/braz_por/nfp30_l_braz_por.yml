 NFP51_DETAIL:0 "crise diplomática"
 NFP51_END_1_CORE:0 "Na disputa que [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName] iniciou contra [ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName], quem recuou foi [ScriptContainer.MakeScope.Var('nfp51_actor').GetCountryDefinition.GetName]. O motivo da disputa era [Localize(ScriptContainer.MakeScope.Var('nfp51_play_label').GetFlagName)]."
 NFP51_END_1_END:0 "Esta crise terminou sem guerra. O recuo de um lado não apagou as divergências entre os países. Mas uma disputa que termina antes dos tiros merece uma linha no jornal. Para o cronista, talvez seja um desfecho menos estrondoso. Para quem precisa viver com ele, tanto melhor."
 NFP51_END_1_LEAD:0 "Quem recuou no confronto diplomático foi [ScriptContainer.MakeScope.Var('nfp51_actor').GetCountryDefinition.GetName]."
 NFP51_END_1_TITLE:0 "Houve recuo antes que falassem os canhões"
 NFP51_END_2_CORE:0 "O confronto entre [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName] e [ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName] terminou antes de se tornar guerra. Quem recuou foi [ScriptContainer.MakeScope.Var('nfp51_actor').GetCountryDefinition.GetName]. Estava em disputa a seguinte questão: [Localize(ScriptContainer.MakeScope.Var('nfp51_play_label').GetFlagName)]."
 NFP51_END_2_END:0 "Esta crise terminou sem guerra. O recuo de um lado não apagou as divergências entre os países. Mas uma disputa que termina antes dos tiros merece uma linha no jornal. Para o cronista, talvez seja um desfecho menos estrondoso. Para quem precisa viver com ele, tanto melhor."
 NFP51_END_2_LEAD:0 "Houve um recuo antes que a jogada diplomática virasse guerra. O país que cedeu foi [ScriptContainer.MakeScope.Var('nfp51_actor').GetCountryDefinition.GetName]."
 NFP51_END_2_TITLE:0 "Houve recuo antes que falassem os canhões"
 NFP51_JOIN_1_CORE:0 "Neste mês, [ScriptContainer.MakeScope.Var('nfp51_actor').GetCountryDefinition.GetName] tomou o partido de [ScriptContainer.MakeScope.Var('nfp51_side').GetCountryDefinition.GetName] na disputa diplomática entre [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName] e [ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName]. O motivo da disputa é [Localize(ScriptContainer.MakeScope.Var('nfp51_play_label').GetFlagName)]."
 NFP51_JOIN_1_END:0 "O novo apoio muda as contas dos dois lados. Uma coisa é fazer exigências sozinho; outra é saber quem se dispõe a ficar ao seu lado. Por enquanto, o embate é diplomático. Veremos se a mesa mais cheia facilita um acordo ou se agora há mais gente disposta a bater o pé."
 NFP51_JOIN_1_LEAD:0 "O país que ofereceu apoio foi [ScriptContainer.MakeScope.Var('nfp51_actor').GetCountryDefinition.GetName], e o lado escolhido foi o de [ScriptContainer.MakeScope.Var('nfp51_side').GetCountryDefinition.GetName]."
 NFP51_JOIN_1_TITLE:0 "Apertou-se o espaço à mesa de negociações"
 NFP51_JOIN_2_CORE:0 "A disputa diplomática ganhou um participante: [ScriptContainer.MakeScope.Var('nfp51_actor').GetCountryDefinition.GetName]. O apoio foi para [ScriptContainer.MakeScope.Var('nfp51_side').GetCountryDefinition.GetName]. Os dois protagonistas continuam sendo [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName] e [ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName], e o motivo da disputa é [Localize(ScriptContainer.MakeScope.Var('nfp51_play_label').GetFlagName)]."
 NFP51_JOIN_2_END:0 "O novo apoio muda as contas dos dois lados. Uma coisa é fazer exigências sozinho; outra é saber quem se dispõe a ficar ao seu lado. Por enquanto, o embate é diplomático. Veremos se a mesa mais cheia facilita um acordo ou se agora há mais gente disposta a bater o pé."
 NFP51_JOIN_2_LEAD:0 "O lado de [ScriptContainer.MakeScope.Var('nfp51_side').GetCountryDefinition.GetName] ganhou o apoio de [ScriptContainer.MakeScope.Var('nfp51_actor').GetCountryDefinition.GetName]."
