 NFP30_WAR_END_AWAY_1_BODY:0 "A guerra terminou. Partes principais: [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName] e [ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName].\n\nPara o leitor, é uma virada importante nos assuntos do mundo. O boletim ainda não estabelece quem alcançou seus objetivos nem a que custo."
 NFP30_WAR_END_AWAY_1_LEAD:0 "Chegou a notícia do fim da guerra entre as partes principais citadas nesta matéria."
 NFP30_WAR_END_AWAY_1_TITLE:0 "Termina uma guerra no exterior"
 NFP30_WAR_END_AWAY_2_BODY:0 "A guerra terminou. Partes principais: [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName] e [ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName].\n\nRegistramos o fim da guerra. Para avaliar o resultado, esperaremos informações sobre perdas e condições de paz."
 NFP30_WAR_END_AWAY_2_LEAD:0 "Chegou ao fim o confronto militar entre as partes principais."
 NFP30_WAR_END_AWAY_2_TITLE:0 "Do exterior, o anúncio do fim da guerra"
 NFP30_WAR_END_HOME_1_BODY:0 "A guerra terminou. Partes principais: [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName] e [ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName].\n\nNoticiamos o fim da guerra. A notícia por si só não identifica o vencedor, as perdas ou as condições de paz."
 NFP30_WAR_END_HOME_1_LEAD:0 "Chegou ao fim a guerra de que nosso país participava como uma das partes principais."
 NFP30_WAR_END_HOME_1_TITLE:0 "Terminou a guerra do nosso país"
 NFP30_WAR_END_HOME_2_BODY:0 "A guerra terminou. Partes principais: [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName] e [ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName].\n\nAvaliar o resultado exige conhecer os acordos e a posição dos envolvidos. O simples fim do conflito não basta para proclamar vitória."
 NFP30_WAR_END_HOME_2_LEAD:0 "Acabou a guerra de que nosso país participou. Registramos uma virada importante no noticiário nacional."
 NFP30_WAR_END_HOME_2_TITLE:0 "Chega a notícia do fim da nossa guerra"
 NFP30_WAR_END_METRICS:0 "A guerra terminou. Partes principais: [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName] e [ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName]."
 NFP30_WAR_START_AWAY_1_BODY:0 "A guerra começou. Partes principais: [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName] e [ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName].\n\nAinda faltam informações sobre os demais participantes, o curso da luta e os efeitos para nosso país. O desfecho permanece em aberto."
 NFP30_WAR_START_AWAY_1_LEAD:0 "Uma guerra importante começou no exterior. Conheça as duas partes principais."
 NFP30_WAR_START_AWAY_1_TITLE:0 "Começa uma nova guerra"
 NFP30_WAR_START_AWAY_2_BODY:0 "A guerra começou. Partes principais: [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName] e [ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName].\n\nRegistramos o início da guerra sem nomear de antemão um vencedor. Esta matéria não estabelece a lista completa dos participantes."
 NFP30_WAR_START_AWAY_2_LEAD:0 "Há notícia de um confronto militar entre as potências mencionadas nesta matéria."
 NFP30_WAR_START_AWAY_2_TITLE:0 "Uma nova guerra muda o noticiário mundial"
 NFP30_WAR_START_HOME_1_BODY:0 "A guerra começou. Partes principais: [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName] e [ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName].\n\nAcompanharemos os acontecimentos. Por ora, apresentamos as partes principais. Ainda faltam informações sobre todos os envolvidos e sobre o desfecho."
 NFP30_WAR_START_HOME_1_LEAD:0 "Os assuntos de paz cedem lugar às notícias militares. Nosso país é parte principal de uma nova guerra."
 NFP30_WAR_START_HOME_1_TITLE:0 "Nosso país entrou em guerra"
 NFP30_WAR_START_HOME_2_BODY:0 "A guerra começou. Partes principais: [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName] e [ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName].\n\nO fato interessa a todos os leitores. A redação não pretende adivinhar o desfecho nem trocar informação de confiança por promessas de vitória."
 NFP30_WAR_START_HOME_2_LEAD:0 "Chega a notícia de uma guerra que tem nosso país entre os principais envolvidos."
 NFP30_WAR_START_HOME_2_TITLE:0 "Começou uma guerra com participação de nosso país"
 NFP30_WAR_START_METRICS:0 "Começou a guerra. Partes principais: [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName] e [ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName]."
