 NFP52_CHINA_2_TITLE:0 "Uma potência a menos, muitas perguntas a mais"
 NFP52_COMMUNE_1_BODY:0 "Surgiu uma Comuna em Paris. A divisão política francesa ganhou nome e expressão própria. A disputa pelo poder adquire outra gravidade quando se trava na capital, no coração do Estado até aqui estabelecido.\n\nEstá confirmada a proclamação da Comuna de Paris. O novo nome expressa a pretensão de governar de outra maneira. O desfecho permanece em aberto. Por ora, já é difícil tratar a crise parisiense como mais uma discussão que há de passar depois do próximo discurso.\n\nEm meio aos projetos políticos, convém lembrar a própria cidade. Seus moradores precisam viver e trabalhar enquanto se decide quem os governará e de que maneira. Acompanharemos as notícias da França. Tomara que a próxima página traga mais clareza e menos aflições.\n\nA data da crônica indica o mês em que a notícia chegou à redação. Havendo atraso na comunicação, o fato pode ter ocorrido antes."
