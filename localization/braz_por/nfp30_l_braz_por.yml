 NFP52_METRICS:0 "Acontecimento mundial. Confirmação recebida em [Localize(ScriptContainer.MakeScope.Var('nfp30_month').GetFlagName)] de [ScriptContainer.GetVariableValue('nfp20_year')|0]. Notícia publicada uma só vez, após o início das observações."
 NFP52_PANAMA_1_BODY:0 "O Canal do Panamá está pronto. Uma nova passagem liga o Atlântico e o Pacífico. No papel, a faixa de terra que os separa parece bastante estreita. É de imaginar que os construtores precisaram de algo mais que essa observação consoladora. Por trás do traço no mapa há agora uma obra de verdade.\n\nA construção do canal chegou ao fim. Os caminhos do mar ganharam outra possibilidade, e as antigas contas sobre a viagem entre os dois oceanos merecem revisão. Não é preciso enumerar solenemente todos os ganhos futuros para perceber o tamanho da mudança. Há passagem onde antes não havia.\n\nAo êxito da engenharia seguirão as contas do comércio. Falta usar o novo caminho e converter vantagens possíveis em benefícios concretos. Mas já se pode felicitar os construtores por algo bem palpável. Às vezes, aproximar dois lados do mundo é expressão que se pode tomar ao pé da letra.\n\nA data da crônica indica o mês em que a notícia chegou à redação. Havendo atraso na comunicação, o fato pode ter ocorrido antes."
