 NFP52_ETH_2_TITLE:0 "Muda o mapa do Chifre da África"
 NFP52_FLU_1_BODY:0 "Chegam notícias de uma grande epidemia de gripe. Um boletim assim se lê com outros olhos que um anúncio de êxitos diplomáticos. A doença toca uma esperança muito simples: que as pessoas queridas continuem bem e que amanhã não comece com uma preocupação a mais.\n\nComeçou a epidemia conhecida como gripe espanhola. É preciso acompanhar como a doença se espalha e o que se passa nas regiões atingidas. Virar notícia mundial não quer dizer que a gripe já chegou aqui, mas a distância dos primeiros relatos tampouco traz garantia de segurança.\n\nMais que nunca, fazem falta informações de confiança. Em tempos de apreensão, os boatos logo ocupam o lugar do que ainda se ignora. Aos doentes, pouco socorro prestam. Voltaremos ao assunto à medida que chegarem notícias. Gostaríamos de poder escrever em breve que o perigo diminuiu.\n\nA data da crônica indica o mês em que a notícia chegou à redação. Havendo atraso na comunicação, o fato pode ter ocorrido antes."
