 NFP52_SUEZ_2_LEAD:0 "O Canal de Suez está pronto. Em geral, são os viajantes que adaptam a rota ao mapa. Desta vez foi o mapa que teve de ceder ao projeto humano: abriu-se uma passagem entre o Mediterrâneo e o mar Vermelho. Para quem vive do mar, a notícia dificilmente caberá numa nota de rodapé."
 NFP52_SUEZ_2_TITLE:0 "Concluído o Canal de Suez"
 NFP52_TAIPING_1_BODY:0 "Surgiu na China um Estado Taiping. O confronto ganhou um centro político independente. A questão já vai além do que desagrada aos adversários da velha ordem. Cabe perguntar que poder oferecem em seu lugar.\n\nO Reino Celestial existe como força política distinta. A crise chinesa tomou outra forma, e o relato habitual de mais um distúrbio já não basta. A disputa com a autoridade produziu uma autoridade que reivindica lugar próprio.\n\nPor trás das grandes declarações continua a vida das pessoas. O rumo do confronto e quem afinal exercerá o poder ainda estão em aberto. Acompanharemos a história lembrando que, para os moradores, uma mudança no mapa significa muito mais que uma linha a mais na coluna de notícias do exterior.\n\nA data da crônica indica o mês em que a notícia chegou à redação. Havendo atraso na comunicação, o fato pode ter ocorrido antes."
 NFP52_TAIPING_1_CONTEXT:0 "Por trás das grandes declarações continua a vida das pessoas. O rumo do confronto e quem afinal exercerá o poder ainda estão em aberto. Acompanharemos a história lembrando que, para os moradores, uma mudança no mapa significa muito mais que uma linha a mais na coluna de notícias do exterior."
