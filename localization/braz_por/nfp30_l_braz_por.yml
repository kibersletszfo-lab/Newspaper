 NFP50_LAW_GOV_BASE_1:0 "Vejamos as posições dentro do governo. [Localize(ScriptContainer.MakeScope.Var('nfp50_law_gov_summary').GetFlagName)][SelectLocalization(GreaterThan_CFixedPoint(ScriptContainer.GetVariableValue('nfp50_law_gov_yes_present'), '(CFixedPoint)0'), 'NFP50_LAW_GOV_YES_NAME', 'NFP50_LAW_NO_MOVE')][SelectLocalization(GreaterThan_CFixedPoint(ScriptContainer.GetVariableValue('nfp50_law_gov_no_present'), '(CFixedPoint)0'), 'NFP50_LAW_GOV_NO_NAME', 'NFP50_LAW_NO_MOVE')] Elas dizem respeito à própria lei. Os dados não permitem compará-la com a regra anterior."
 NFP50_LAW_GOV_BASE_2:0 "Vejamos as posições dentro do governo. [Localize(ScriptContainer.MakeScope.Var('nfp50_law_gov_summary').GetFlagName)][SelectLocalization(GreaterThan_CFixedPoint(ScriptContainer.GetVariableValue('nfp50_law_gov_yes_present'), '(CFixedPoint)0'), 'NFP50_LAW_GOV_YES_NAME', 'NFP50_LAW_NO_MOVE')][SelectLocalization(GreaterThan_CFixedPoint(ScriptContainer.GetVariableValue('nfp50_law_gov_no_present'), '(CFixedPoint)0'), 'NFP50_LAW_GOV_NO_NAME', 'NFP50_LAW_NO_MOVE')] Elas dizem respeito à própria lei. Os dados não permitem compará-la com a regra anterior."
 NFP50_LAW_GOV_NEUTRAL:0 "Os grupos no governo não mostram preferência clara. Acontece: muda a lei e a balança política permanece nivelada."
