 NFP52_ROM_1_BODY:0 "A união das terras romenas se tornou realidade política. Questões antes tratadas por governos distintos ganham um centro comum. O nome conhecido da geografia adquire outro peso quando é preciso decidir quem responde pelas decisões.\n\nEstá confirmada a unificação dos principados romenos. O novo arranjo muda a posição das terras reunidas e interessa aos vizinhos. A independência e as fronteiras futuras são questões à parte. Um só acontecimento não responde por toda a história que vem pela frente.\n\nA notícia da união é o começo do trabalho comum. Ainda será preciso conciliar os interesses locais e transformar a nova organização em decisões úteis para quem vive ali. Os mapas já podem ser atualizados. Os resultados levarão mais tempo.\n\nA data da crônica indica o mês em que a notícia chegou à redação. Havendo atraso na comunicação, o fato pode ter ocorrido antes."
