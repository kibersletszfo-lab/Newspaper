 NFP43_ELECTION_TITLE_1:0 "As urnas podem esperar. Agora a disputa é pelo eleitor"
 NFP43_ELECTION_TITLE_2:0 "As urnas podem esperar. Agora a disputa é pelo eleitor"
 NFP43_FRONT_PAGE:0 "Primeira página"
 NFP43_THIS_ISSUE:0 "Nesta edição"
 NFP43_THIS_ISSUE_URGENT:0 "Nesta edição · Urgente"
 NFP43_WELCOME_1_BODY:0 "É bom encontrar o que se procura, chegar ao trabalho e voltar para casa com um salário que dê para viver. Aqui vamos falar de mercadorias, de estradas sobrecarregadas e de regiões que mal conseguem chegar ao mercado comum. E vamos registrar também os dias em que essas dificuldades ficarem para trás.\n\nNúmero grande, sozinho, não enche a cesta. Por isso, quando a economia prosperar, perguntaremos como anda a vida de quem trabalha. E, num mês tranquilo, abriremos o boletim do comércio. Os preços sabem despertar interesse pela economia sem ajuda da redação."
 NFP43_WELCOME_1_LEAD:0 "Bem-vindo à seção de economia. Queremos perceber as dificuldades antes que virem costume."
 NFP43_WELCOME_1_TITLE:0 "A economia começa antes do boletim"
 NFP43_WELCOME_2_BODY:0 "Uma guerra interessa a mais gente do que quem move as bandeirinhas no mapa. Nesta seção acompanharemos o começo e o fim dos conflitos, as alianças e a composição do nosso bloco. Nas crises diplomáticas, veremos quem fez exigências, quem tomou partido e quem preferiu recuar.\n\nSe você habilitar a entrega urgente, as grandes notícias poderão chegar em edição extraordinária. Preferiríamos anunciar mais acordos bem-sucedidos. Mesmo assim, é melhor ler uma notícia ruim a tempo do que ficar sabendo dela pelas consequências."
 NFP43_WELCOME_2_LEAD:0 "A seção de guerra acompanha o início e o fim dos conflitos e as mudanças que afetam a segurança do país."
 NFP43_WELCOME_2_TITLE:0 "Entre o tratado e o canhão"
 NFP43_WELCOME_3_BODY:0 "Quem sabe ler? Como vivem as pessoas? Como andam as eleições? É disso que tratam estas páginas. As mudanças na sociedade às vezes passam mais despercebidas do que uma fronteira nova no mapa. Mais uma razão para investigar o que mudou por trás dos nomes conhecidos.\n\nDurante as eleições, compararemos a campanha de cada partido com o último boletim. Ganhar fôlego não é o mesmo que ganhar votos. A confiança dos candidatos pode até contagiar. A redação espera ter a paciência de aguardar a apuração."
 NFP43_WELCOME_3_LEAD:0 "Aqui há espaço para as conquistas da educação e as mudanças na vida do nosso país."
 NFP43_WELCOME_3_TITLE:0 "Um país também é feito de gente"
 NFP43_WELCOME_4_BODY:0 "Aqui se encontram as leis, o conhecimento e a posição das potências no mundo. Dá gosto celebrar as nossas conquistas. Convém prestar atenção nas dos outros também, sobretudo quando elas nos levam a perguntar por que ainda não chegamos lá.\n\nComece pela capa e escolha a matéria que quiser ler. O arquivo guarda doze edições. Às vezes, nada como reler uma certeza da semana passada depois de já saber o que veio em seguida."
 NFP43_WELCOME_4_LEAD:0 "Nesta seção reunimos mudanças políticas, novas descobertas e notícias importantes do exterior."
 NFP43_WELCOME_4_TITLE:0 "Além do horizonte de costume"
 NFP43_WELCOME_METRICS:0 "Matéria de apresentação. As quatro seções dão uma amostra do jornal; a assinatura determina a entrega das próximas edições. As observações prosseguem sem reiniciar a contagem. Só calculamos a variação quando há um registro anterior comparável."
 NFP43_WELCOME_REACH:0 "apresentação ao leitor do próprio país"
 NFP43_WELCOME_REASON:0 "apresentação do jornal ao confirmar a assinatura"
 NFP45_ARCHIVE_NOTE:0 "Novas edições chegam mensalmente aos assinantes. As edições já lidas permanecem no arquivo."
 NFP47_CONFIRM:0 "Confirmar escolha"
 NFP47_CONFIRM_HINT:0 "Salvar as condições de entrega e voltar à leitura do jornal."
 NFP47_EDITION:0 "Gazeta Nacional"
 NFP47_FOOTNOTE:0 "As condições podem ser alteradas a qualquer momento. As edições arquivadas serão preservadas."
 NFP47_MONTHLY:0 "Edição mensal"
 NFP47_MONTHLY_NOTE:0 "Notícias do país e do mundo, reunidas em uma edição a cada mês."
 NFP47_READER:0 "Assinante: [GetPlayer.GetName]"
 NFP47_REQUEST:0 "Desejo receber as seguintes edições do jornal:"
 NFP47_RETURN:0 "Voltar ao jornal"
 NFP47_RETURN_HINT:0 "Voltar à leitura. As opções de entrega são salvas assim que você as altera."
 NFP47_SECTIONS:0 "Economia · Guerra · Sociedade · Acontecimentos"
 NFP47_TERMS:0 "As modalidades de entrega selecionadas funcionam de forma independente.\nPara suspender o recebimento do jornal, desmarque ambas as opções."
 NFP47_TITLE:0 "FICHA DE ASSINATURA"
 NFP47_URGENT:0 "Edição extraordinária"
 NFP47_URGENT_NOTE:0 "Guerras e acontecimentos mundiais: uma edição especial que pausa o jogo."
 NFP50_EMPTY:0 ""
 NFP50_FAMILY_BODY:0 "[Localize(ScriptContainer.MakeScope.Var('nfp30_body').GetFlagName)]"
 NFP50_FAMILY_DIVERGENCE_FACTS:0 "Em três intervalos mensais, o PIB anual projetado passou de [ScriptContainer.GetVariableValue('nfp20_before')|0] para [ScriptContainer.GetVariableValue('nfp20_after')|0]. No mesmo período, o padrão de vida médio caiu [ScriptContainer.GetVariableValue('nfp20_extra')|2] pontos."
 NFP50_FAMILY_DIVERGENCE_HOME_END_1:0 "Uma economia maior ainda não garante conforto em casa. A situação em que vive a população é assunto de interesse nacional, e a razão dessa divergência merece investigação."
 NFP50_FAMILY_DIVERGENCE_HOME_END_2:0 "O país precisa de conquistas que se sintam também no cotidiano. Essas cifras, sozinhas, não explicam a piora nem apontam um responsável."
 NFP50_FAMILY_ELECTION_AGAIN:0 "Já podemos comparar a campanha com o último boletim. Alguns partidos talvez tenham ganhado fôlego, outros podem tê-lo perdido. Os sinais ao lado dos números mostram essa mudança. A diferença nas urnas ainda terá de esperar as urnas."
 NFP50_FAMILY_ELECTION_BASE:0 "[SelectLocalization(GreaterThan_CFixedPoint(ScriptContainer.GetVariableValue('nfp43_previous_issue'), '(CFixedPoint)0'), 'NFP43_ELECTION_BASELINE', 'NFP43_ELECTION_FIRST')]"
 NFP50_FAMILY_ELECTION_END_1:0 "Antes do dia da votação já há uma boa história para acompanhar. Veremos que rumo toma. Gostaríamos de saber quem vai conquistar os eleitores, mas não cabe a uma coluna de jornal depositar votos por eles."
 NFP50_FAMILY_ELECTION_END_2:0 "Antes do dia da votação já há uma boa história para acompanhar. Veremos que rumo toma. Gostaríamos de saber quem vai conquistar os eleitores, mas não cabe a uma coluna de jornal depositar votos por eles."
 NFP50_FAMILY_ELECTION_FIRST:0 "Começamos aqui a comparação desta campanha. Os próximos boletins mostrarão melhor quem ganha impulso e quem o perde. Por enquanto, conheçamos os partidos e a posição de cada um."
 NFP50_FAMILY_ELECTION_NOTE:0 "A campanha está em curso, e ainda não se contam votos. Os números comparam o ímpeto de até seis partidos na dianteira. Não indicam percentuais do eleitorado. Por mais confiante que pareça hoje um candidato, o dia da eleição ainda virá."
 NFP50_FAMILY_ELECTION_TABLE:0 "[Localize(ScriptContainer.MakeScope.Var('nfp43_row_1').GetFlagName)]\n[Localize(ScriptContainer.MakeScope.Var('nfp43_row_2').GetFlagName)]\n[Localize(ScriptContainer.MakeScope.Var('nfp43_row_3').GetFlagName)]\n[Localize(ScriptContainer.MakeScope.Var('nfp43_row_4').GetFlagName)]\n[Localize(ScriptContainer.MakeScope.Var('nfp43_row_5').GetFlagName)]\n[Localize(ScriptContainer.MakeScope.Var('nfp43_row_6').GetFlagName)]"
 NFP50_FAMILY_EXPECTED:0 "No levantamento, o padrão de vida médio é [ScriptContainer.GetVariableValue('nfp50_family_sol')|2], enquanto o esperado é [ScriptContainer.GetVariableValue('nfp50_family_expected_sol')|2]. O primeiro fica abaixo do segundo. Mais um motivo para olhar de perto como vivem as pessoas."
 NFP50_FAMILY_GAINED_ALLIANCE_1_1:0 "Nosso país tem um aliado formal: [ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName]. Os planos comuns agora contam com o respaldo de um acordo. É agradável ter com quem conversar sobre algo além das nossas divergências. Veremos como a conversa se transforma em ação."
 NFP50_FAMILY_GAINED_ALLIANCE_1_2:0 "Uma aliança merece mais que uma troca de gentilezas. O valor aparecerá nas decisões práticas e nos compromissos cumpridos. O selo no tratado é um bom começo. Esperamos que a cooperação vá além dele."
 NFP50_FAMILY_GAINED_ALLIANCE_2_1:0 "Nosso país tem um aliado formal: [ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName]. Os planos comuns agora contam com o respaldo de um acordo. É agradável ter com quem conversar sobre algo além das nossas divergências. Veremos como a conversa se transforma em ação."
 NFP50_FAMILY_GAINED_ALLIANCE_2_2:0 "Uma aliança merece mais que uma troca de gentilezas. O valor aparecerá nas decisões práticas e nos compromissos cumpridos. O selo no tratado é um bom começo. Esperamos que a cooperação vá além dele."
 NFP50_FAMILY_GAINED_BLOC_1_1:0 "Nosso país e [ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName] agora pertencem ao mesmo bloco de poder. O círculo de parceiros mudou. Deixaremos de lado a adivinhação sobre quem convidou quem. Vale mais perguntar que possibilidades surgem dessa proximidade."
 NFP50_FAMILY_GAINED_BLOC_1_2:0 "Uma bandeira comum não dispensa o trabalho em conjunto. Há o que negociar mesmo sem aliança militar separada. Seria bom se, depois das cortesias, houvesse lugar para negociações úteis aos dois lados."
 NFP50_FAMILY_GAINED_BLOC_2_1:0 "Nosso país e [ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName] agora pertencem ao mesmo bloco de poder. O círculo de parceiros mudou. Deixaremos de lado a adivinhação sobre quem convidou quem. Vale mais perguntar que possibilidades surgem dessa proximidade."
 NFP50_FAMILY_GAINED_BLOC_2_2:0 "Uma bandeira comum não dispensa o trabalho em conjunto. Há o que negociar mesmo sem aliança militar separada. Seria bom se, depois das cortesias, houvesse lugar para negociações úteis aos dois lados."
 NFP50_FAMILY_GROWTH:0 "O PIB anual projetado cresceu [ScriptContainer.GetVariableValue('nfp50_family_gdp_growth')|2]% entre as observações. O dado diz respeito ao tamanho da economia. A renda de cada família merece sua própria conta."
 NFP50_FAMILY_INTRO:0 "[Localize(ScriptContainer.MakeScope.Var('nfp30_lead').GetFlagName)]"
 NFP50_FAMILY_LAW_AWAY_END_1:0 "Nossos leitores podem acompanhar as mudanças na vida de outros povos. Sabemos por enquanto que a regra entrou em vigor. Seus efeitos ainda estão por avaliar."
 NFP50_FAMILY_LAW_AWAY_END_2:0 "O registro não comprova que a reforma tenha sido aprovada por votação parlamentar nem promete um resultado específico. Seus efeitos merecem apuração própria."
 NFP50_FAMILY_LAW_FACTS:0 "Entrou em vigor a seguinte lei: [Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]."
 NFP50_FAMILY_LAW_HOME_END_1:0 "Noticiamos a mudança em si. O anúncio ainda não esclarece como se chegou à aprovação nem o que ela mudará na vida das pessoas."
 NFP50_FAMILY_LAW_HOME_END_2:0 "Para avaliar a reforma serão necessários tempo e informações sobre os efeitos. A norma entrou em vigor. Seus resultados prometidos ainda precisam aparecer."
 NFP50_FAMILY_LOST_ALLIANCE_1_1:0 "A antiga aliança com [ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName] já não existe. É notícia de peso para os planos que contavam com ela. Ainda precisamos entender a razão da mudança, mas não convém seguir contando com o antigo acordo por força do hábito."
 NFP50_FAMILY_LOST_ALLIANCE_1_2:0 "Agora será preciso examinar melhor as nossas próprias possibilidades. Declarar inimigo eterno o antigo aliado seria tão apressado quanto continuar dando sua ajuda por certa. A memória faz bem à diplomacia, sobretudo quando inclui o que mudou."
 NFP50_FAMILY_LOST_ALLIANCE_2_1:0 "A antiga aliança com [ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName] já não existe. É notícia de peso para os planos que contavam com ela. Ainda precisamos entender a razão da mudança, mas não convém seguir contando com o antigo acordo por força do hábito."
 NFP50_FAMILY_LOST_ALLIANCE_2_2:0 "Agora será preciso examinar melhor as nossas próprias possibilidades. Declarar inimigo eterno o antigo aliado seria tão apressado quanto continuar dando sua ajuda por certa. A memória faz bem à diplomacia, sobretudo quando inclui o que mudou."
 NFP50_FAMILY_LOST_BLOC_1_1:0 "Já não compartilhamos com [ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName] a participação em um mesmo bloco. O antigo círculo comum ficou no boletim anterior. Pode ter mudado a posição de qualquer um dos lados ou a própria associação. O resultado tem o mesmo peso para os nossos planos."
 NFP50_FAMILY_LOST_BLOC_1_2:0 "Há menos terreno comum para os nossos cálculos. Tratados separados são outra questão e merecem leitura própria. Seria estranho continuar usando o velho retrato das relações só porque ninguém teve tempo de pendurar o novo na parede."
 NFP50_FAMILY_LOST_BLOC_2_1:0 "Já não compartilhamos com [ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName] a participação em um mesmo bloco. O antigo círculo comum ficou no boletim anterior. Pode ter mudado a posição de qualquer um dos lados ou a própria associação. O resultado tem o mesmo peso para os nossos planos."
 NFP50_FAMILY_LOST_BLOC_2_2:0 "Há menos terreno comum para os nossos cálculos. Tratados separados são outra questão e merecem leitura própria. Seria estranho continuar usando o velho retrato das relações só porque ninguém teve tempo de pendurar o novo na parede."
 NFP50_FAMILY_PRICE_CORE:0 "[SelectLocalization(GreaterThan_CFixedPoint(ScriptContainer.GetVariableValue('nfp32_rows'), '(CFixedPoint)0'), 'NFP30_PRICE_MARKET', 'NFP30_PRICE_UNAVAILABLE')]\n\n[Localize(ScriptContainer.MakeScope.Var('nfp32_row_1').GetFlagName)]\n[Localize(ScriptContainer.MakeScope.Var('nfp32_row_2').GetFlagName)]\n[Localize(ScriptContainer.MakeScope.Var('nfp32_row_3').GetFlagName)]\n[Localize(ScriptContainer.MakeScope.Var('nfp32_row_4').GetFlagName)]\n[Localize(ScriptContainer.MakeScope.Var('nfp32_row_5').GetFlagName)]\n[Localize(ScriptContainer.MakeScope.Var('nfp32_row_6').GetFlagName)]"
 NFP50_FAMILY_PRICE_END_1:0 "Vale acompanhar os preços mesmo sem esperar uma crise vistosa. Esta tabela cobre algumas mercadorias, por isso não calcula toda a despesa da família. Ajuda, porém, a examinar as compras de costume. Às vezes a notícia mais reveladora espera o leitor no balcão."
 NFP50_FAMILY_PRICE_END_2:0 "Vale acompanhar os preços mesmo sem esperar uma crise vistosa. Esta tabela cobre algumas mercadorias, por isso não calcula toda a despesa da família. Ajuda, porém, a examinar as compras de costume. Às vezes a notícia mais reveladora espera o leitor no balcão."
 NFP50_FAMILY_PRICE_NOTE:0 "[SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp32_comparisons'), '(CFixedPoint)0'), 'NFP30_PRICE_FIRST', 'NFP30_PRICE_METHOD')]"
 NFP50_FAMILY_SHORTAGE_FACTS:0 "Mercadoria: [Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]. Nosso mercado registrou escassez em duas observações mensais seguidas."
 NFP50_FAMILY_SHORTAGE_HOME_END_1:0 "A oferta e o consumo da mercadoria merecem atenção. O boletim trata da escassez em si. Um preço elevado é outra questão."
 NFP50_FAMILY_SHORTAGE_HOME_END_2:0 "A escassez está confirmada. Suas causas seguem por apurar. Os dados não apontam culpados nem prometem resultados para uma obra específica."
 NFP50_FAMILY_SHORTAGE_RECOVERY_FACTS:0 "Mercadoria: [Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]. Depois do alerta, dois boletins mensais seguidos deixaram de registrar a escassez anterior."
 NFP50_FAMILY_SHORTAGE_RECOVERY_HOME_END_1:0 "Registramos a ausência da escassez observada antes. Isso ainda não promete preços baixos. Ser caro e ser difícil de encontrar são coisas distintas."
 NFP50_FAMILY_SHORTAGE_RECOVERY_HOME_END_2:0 "A melhora se manteve por dois meses. Seguiremos distinguindo disponibilidade de preço acessível, que este boletim por si só não comprova."
 NFP50_FAMILY_SOL:0 "No mesmo período, o padrão de vida médio passou de [ScriptContainer.GetVariableValue('nfp50_family_sol_before')|2] para [ScriptContainer.GetVariableValue('nfp50_family_sol')|2]. Trata-se de média nacional. A situação varia entre estados e camadas da população."
 NFP50_FAMILY_TECH_ANILINE_1:0 "Já se podem construir fábricas de produtos sintéticos e produzir corantes em escala industrial. Para a indústria têxtil abre-se uma perspectiva interessante: a cor da futura roupa depende cada vez menos da origem da matéria-prima."
 NFP50_FAMILY_TECH_ANILINE_2:0 "Para produzir os corantes serão necessários enxofre e fertilizantes. A tecnologia muda a cadeia de abastecimento, mas não a elimina. Uma bela cor acaba de revelar parentes econômicos que poucos esperariam encontrar."
 NFP50_FAMILY_TECH_ANTIBIOTICS_1:0 "O país pode ampliar os serviços de saúde. O conhecimento médico merece atenção antes de tudo por uma esperança bastante comum: ficar bom. Essa esperança tem agora mais fundamento, embora o atendimento ainda precise de recursos."
 NFP50_FAMILY_TECH_ANTIBIOTICS_2:0 "Os surtos de doença terão menos efeito sobre as colheitas. Eis uma consequência econômica concreta. A doença atrapalha o cotidiano muito além do quarto do paciente. É bom quando o remédio ajuda também quem toca o trabalho de todo dia."
 NFP50_FAMILY_TECH_AWAY_END_1:0 "Abriram-se novas possibilidades. Uma boa ocasião para olhar nossos próprios negócios. O que já sabemos fazer, e que uso damos a isso? Os parabéns podem esperar o correio. Uma boa ideia para nós mesmos vale guardar desde já."
 NFP50_FAMILY_TECH_AWAY_END_2:0 "Abriram-se novas possibilidades. Uma boa ocasião para olhar nossos próprios negócios. O que já sabemos fazer, e que uso damos a isso? Os parabéns podem esperar o correio. Uma boa ideia para nós mesmos vale guardar desde já."
 NFP50_FAMILY_TECH_BESSEMER_PROCESS_1:0 "As siderúrgicas podem empregar o processo Bessemer para obter mais aço. Uma possibilidade útil para uma economia que precisa de metal para outras coisas além de erguer monumentos aos próprios êxitos."
 NFP50_FAMILY_TECH_BESSEMER_PROCESS_2:0 "O novo método consome mais ferro mantendo o mesmo consumo de carvão. O progresso não dispensa o abastecimento. Antes de celebrar o aço que virá, convém providenciar a matéria de que será feito."
 NFP50_FAMILY_TECH_ELECTRICAL_GENERATION_1:0 "Já se podem construir usinas de energia. A economia ganha uma fonte de novas possibilidades. Por enquanto temos um conhecimento que ainda precisa ganhar instalações e abastecimento. Mas os planos para as próximas empresas já podem ser vistos sob outra luz."
 NFP50_FAMILY_TECH_ELECTRICAL_GENERATION_2:0 "As cidades podem passar à iluminação elétrica das ruas. Será preciso dispor de eletricidade no local. A mudança promete ser visível no sentido mais literal. Tomara que depois do discurso sobre um futuro luminoso venha luz também para a rua."
 NFP50_FAMILY_TECH_ELECTRIC_TELEGRAPH_1:0 "O telégrafo elétrico entrou no repertório militar. O país ganhou um novo meio de sustentar o esforço de guerra. O valor da novidade vai além da boa impressão que seu nome possa causar num relatório do quartel."
 NFP50_FAMILY_TECH_ELECTRIC_TELEGRAPH_2:0 "As baixas passarão a pesar menos no cansaço de guerra do país. Trata-se da capacidade de suportar o conflito. O conhecimento não traz os mortos de volta. Esperamos que um avanço útil às forças armadas precise de poucas demonstrações práticas."
 NFP50_FAMILY_TECH_FACTS:0 "O país já domina a tecnologia «[Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]»."
 NFP50_FAMILY_TECH_HOME_END_1:0 "Sabemos mais. Falta dar bom uso ao conhecimento. Há motivo para orgulho e também para trabalho. Gostaríamos de noticiar em seguida o que a descoberta permitiu fazer. Uma lista de possibilidades é agradável; vê-las em uso é melhor."
 NFP50_FAMILY_TECH_HOME_END_2:0 "Sabemos mais. Falta dar bom uso ao conhecimento. Há motivo para orgulho e também para trabalho. Gostaríamos de noticiar em seguida o que a descoberta permitiu fazer. Uma lista de possibilidades é agradável; vê-las em uso é melhor."
 NFP50_FAMILY_TECH_KNOWN:0 "Esse conhecimento já está ao nosso alcance. Agora outro país também pode empregá-lo. Terminou a vantagem de sermos nós a conhecer a técnica. Resta ver quem saberá usá-la melhor. Na economia, isso costuma interessar mais que um concurso de memória."
 NFP50_FAMILY_TECH_QUININE_1:0 "A quinina permite superar a barreira da malária comum à expansão colonial. A malária grave continua sendo um problema à parte. Há mais possibilidades no mapa. Imaginar que um só remédio eliminou todas as dificuldades locais seria otimismo demais."
 NFP50_FAMILY_TECH_QUININE_2:0 "É possível ampliar os serviços de saúde e a administração colonial. Os recursos ainda terão de ser destinados a isso. O remédio ampliou as possibilidades do país. Agora o Tesouro e a administração têm no que pensar."
 NFP50_FAMILY_TECH_RAILWAYS_1:0 "Já é possível construir ferrovias. A distância entre as cidades continuará a mesma. Muda a maneira de vencê-la, com novos meios de transporte. Ainda é preciso assentar os trilhos: um traço na planta funciona um pouco pior para a economia do que uma linha de verdade."
 NFP50_FAMILY_TECH_RAILWAYS_2:0 "As minas agora podem recorrer ao transporte ferroviário. O novo método de produção exige serviços de transporte. Extrair mais é bom. Só seria uma pena descobrir, depois de extrair, que não há como levar o produto embora."
 NFP50_FAMILY_TECH_STEAM_DONKEY_1:0 "É possível mecanizar tarefas auxiliares nas madeireiras e nas minas. O vapor pode assumir parte do trabalho antes feito à mão. A economia ganha outra maneira de dar conta da carga."
 NFP50_FAMILY_TECH_STEAM_DONKEY_2:0 "A mecanização exige motores e emprega menos operários. Para a empresa, poupar trabalho é uma possibilidade atraente. Para as pessoas, o resultado depende também de encontrar outra ocupação. Às vezes é mais fácil arranjar lugar para uma máquina que para uma pessoa."
 NFP50_FAMILY_TECH_STEELWORKING_1:0 "O país já pode construir siderúrgicas. Abre-se caminho para novas possibilidades de produção. O aço na lista dos conhecimentos é o começo da história. Para ter aço que se possa usar, ainda são necessárias empresas e trabalho."
 NFP50_FAMILY_TECH_STEELWORKING_2:0 "As oficinas de ferramentas podem empregar ferro-gusa. Uma ferramenta conhecida ganha outra história de fabricação. Ainda é preciso escolher os métodos e fornecer o material. Saber que eles existem não transforma uma oficina."
 NFP50_FAMILY_TECH_UNKNOWN:0 "Ainda não dominamos esse conhecimento. Nesse campo, o outro país passa a ter uma vantagem. Tomara que saibamos responder a tempo com uma conquista própria. Explicar por que a dos outros não importa tanto até dispensa pesquisa, mas serve para bem menos."
 NFP50_FAMILY_WAR_ALLIANCE_1_1:0 "Nosso aliado, [ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName], está na defesa em uma nova guerra. A iniciativa partiu de [ScriptContainer.MakeScope.Var('nfp20_extra_detail').GetCountryDefinition.GetName]. A notícia toca diretamente nossa diplomacia, pois envolve um país ligado a nós por aliança."
 NFP50_FAMILY_WAR_ALLIANCE_1_2:0 "Os acordos com o aliado precisam agora ser lidos diante de uma guerra de verdade. O anúncio, por si só, não significa que já entramos nela. Mas seria estranho deixá-lo entre as curiosidades do exterior. Não se recorda uma aliança só quando convém trocar cumprimentos."
 NFP50_FAMILY_WAR_ALLIANCE_2_1:0 "Nosso aliado, [ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName], está na defesa em uma nova guerra. A iniciativa partiu de [ScriptContainer.MakeScope.Var('nfp20_extra_detail').GetCountryDefinition.GetName]. A notícia toca diretamente nossa diplomacia, pois envolve um país ligado a nós por aliança."
 NFP50_FAMILY_WAR_ALLIANCE_2_2:0 "Os acordos com o aliado precisam agora ser lidos diante de uma guerra de verdade. O anúncio, por si só, não significa que já entramos nela. Mas seria estranho deixá-lo entre as curiosidades do exterior. Não se recorda uma aliança só quando convém trocar cumprimentos."
 NFP50_FAMILY_WAR_BLOC_1_1:0 "Começou uma guerra contra um membro de nosso bloco, [ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName]. A iniciativa partiu de [ScriptContainer.MakeScope.Var('nfp20_extra_detail').GetCountryDefinition.GetName]. O confronto atinge o círculo em que fazemos planos comuns. Temos bem mais que curiosidade passageira para ler a notícia com atenção."
 NFP50_FAMILY_WAR_BLOC_1_2:0 "Estar no mesmo bloco não transforma toda guerra de um membro em guerra nossa. Torna, porém, o conflito importante para nossos planos. Antes de continuar a fazer contas como se ainda houvesse paz, convém saber o que pode mudar nas possibilidades do parceiro."
 NFP50_FAMILY_WAR_BLOC_2_1:0 "Começou uma guerra contra um membro de nosso bloco, [ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName]. A iniciativa partiu de [ScriptContainer.MakeScope.Var('nfp20_extra_detail').GetCountryDefinition.GetName]. O confronto atinge o círculo em que fazemos planos comuns. Temos bem mais que curiosidade passageira para ler a notícia com atenção."
 NFP50_FAMILY_WAR_BLOC_2_2:0 "Estar no mesmo bloco não transforma toda guerra de um membro em guerra nossa. Torna, porém, o conflito importante para nossos planos. Antes de continuar a fazer contas como se ainda houvesse paz, convém saber o que pode mudar nas possibilidades do parceiro."
 NFP50_FAMILY_WAR_END_AWAY_END_1:0 "A guerra acabou. Examinar seus resultados ainda está por fazer. Os termos de paz dirão melhor quem conseguiu o que queria e quanto pagou por isso. Vale olhar as duas partes com olhos novos. Confiar por hábito nas capacidades que tinham antes seria ingenuidade demais."
 NFP50_FAMILY_WAR_END_AWAY_END_2:0 "A guerra acabou. Examinar seus resultados ainda está por fazer. Os termos de paz dirão melhor quem conseguiu o que queria e quanto pagou por isso. Vale olhar as duas partes com olhos novos. Confiar por hábito nas capacidades que tinham antes seria ingenuidade demais."
 NFP50_FAMILY_WAR_END_CONTEXT:0 "A paz traz outras perguntas. A guerra pode terminar muito antes de se desfazer o nó das consequências. Registremos hoje a boa notícia. O resultado será avaliado à luz das condições do acordo."
 NFP50_FAMILY_WAR_END_FACTS:0 "A guerra terminou. Partes principais: [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName] e [ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName]."
 NFP50_FAMILY_WAR_END_HOME_END_1:0 "Já podemos falar do fim da guerra. Para dar parabéns pela vitória, ainda seria preciso conhecer os termos. Para ter esperança de paz, a notícia de hoje basta. Tomara que o próximo grande esforço do país se dê onde se constroem coisas. A história já oferece ocasiões de sobra para destruí-las."
 NFP50_FAMILY_WAR_END_HOME_END_2:0 "Já podemos falar do fim da guerra. Para dar parabéns pela vitória, ainda seria preciso conhecer os termos. Para ter esperança de paz, a notícia de hoje basta. Tomara que o próximo grande esforço do país se dê onde se constroem coisas. A história já oferece ocasiões de sobra para destruí-las."
 NFP50_FAMILY_WAR_START_AWAY_END_1:0 "As consequências da guerra irão além das duas capitais. Quais delas nos atingirão, o curso da luta mostrará. Por ora, vale mais acompanhar os participantes e suas decisões do que escolher um vencedor pelo tamanho do nome no mapa. Previsões seguras saem com especial facilidade de quem não responde por elas."
 NFP50_FAMILY_WAR_START_AWAY_END_2:0 "As consequências da guerra irão além das duas capitais. Quais delas nos atingirão, o curso da luta mostrará. Por ora, vale mais acompanhar os participantes e suas decisões do que escolher um vencedor pelo tamanho do nome no mapa. Previsões seguras saem com especial facilidade de quem não responde por elas."
 NFP50_FAMILY_WAR_START_CONTEXT:0 "Uma disputa diplomática chegou à guerra. Para os dois lados, falar bem já não basta. Agora serão necessários soldados, recursos e provisões, todos um pouco mais difíceis de reunir que uma frase elegante sobre intenções."
 NFP50_FAMILY_WAR_START_FACTS:0 "Começou a guerra. Partes principais: [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName] e [ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName]."
 NFP50_FAMILY_WAR_START_HOME_END_1:0 "A guerra entrou nos nossos próprios assuntos. Seu início cabe numa linha do jornal. O que vem depois não caberá. Esperamos anunciar a paz em breve. Enquanto isso, leremos com cuidado as notícias da guerra sem transformar esperança em boletim de vitória."
 NFP50_FAMILY_WAR_START_HOME_END_2:0 "A guerra entrou nos nossos próprios assuntos. Seu início cabe numa linha do jornal. O que vem depois não caberá. Esperamos anunciar a paz em breve. Enquanto isso, leremos com cuidado as notícias da guerra sem transformar esperança em boletim de vitória."
 NFP50_FAMILY_WELCOME_1_1:0 "É bom encontrar o que se procura, chegar ao trabalho e voltar para casa com um salário que dê para viver. Aqui vamos falar de mercadorias, de estradas sobrecarregadas e de regiões que mal conseguem chegar ao mercado comum. E vamos registrar também os dias em que essas dificuldades ficarem para trás."
 NFP50_FAMILY_WELCOME_1_2:0 "Número grande, sozinho, não enche a cesta. Por isso, quando a economia prosperar, perguntaremos como anda a vida de quem trabalha. E, num mês tranquilo, abriremos o boletim do comércio. Os preços sabem despertar interesse pela economia sem ajuda da redação."
 NFP50_FAMILY_WELCOME_2_1:0 "Uma guerra interessa a mais gente do que quem move as bandeirinhas no mapa. Nesta seção acompanharemos o começo e o fim dos conflitos, as alianças e a composição do nosso bloco. Nas crises diplomáticas, veremos quem fez exigências, quem tomou partido e quem preferiu recuar."
 NFP50_FAMILY_WELCOME_2_2:0 "Se você habilitar a entrega urgente, as grandes notícias poderão chegar em edição extraordinária. Preferiríamos anunciar mais acordos bem-sucedidos. Mesmo assim, é melhor ler uma notícia ruim a tempo do que ficar sabendo dela pelas consequências."
 NFP50_FAMILY_WELCOME_3_1:0 "Quem sabe ler? Como vivem as pessoas? Como andam as eleições? É disso que tratam estas páginas. As mudanças na sociedade às vezes passam mais despercebidas do que uma fronteira nova no mapa. Mais uma razão para investigar o que mudou por trás dos nomes conhecidos."
 NFP50_FAMILY_WELCOME_3_2:0 "Durante as eleições, compararemos a campanha de cada partido com o último boletim. Ganhar fôlego não é o mesmo que ganhar votos. A confiança dos candidatos pode até contagiar. A redação espera ter a paciência de aguardar a apuração."
 NFP50_FAMILY_WELCOME_4_1:0 "Aqui se encontram as leis, o conhecimento e a posição das potências no mundo. Dá gosto celebrar as nossas conquistas. Convém prestar atenção nas dos outros também, sobretudo quando elas nos levam a perguntar por que ainda não chegamos lá."
 NFP50_FAMILY_WELCOME_4_2:0 "Comece pela capa e escolha a matéria que quiser ler. O arquivo guarda doze edições. Às vezes, nada como reler uma certeza da semana passada depois de já saber o que veio em seguida."
 NFP50_FAMILY_WELCOME_END_1:0 "Estamos apenas nos conhecendo. Voltaremos aos acontecimentos para saber o que mudou. Tomara que o motivo para reler uma antiga notícia preocupante seja, mais vezes, uma boa notícia nova.\n\n$NFP89_DELIVERY$"
 NFP50_FAMILY_WELCOME_END_2:0 "Estamos apenas nos conhecendo. Voltaremos aos acontecimentos para saber o que mudou. Tomara que o motivo para reler uma antiga notícia preocupante seja, mais vezes, uma boa notícia nova.\n\n$NFP89_DELIVERY$"
 NFP50_LAW_APPROVE:0 "apoio"
 NFP50_LAW_END_1:0 "Agora a lei precisa entrar na vida cotidiana. Seus partidários talvez já a chamem de êxito e os adversários, de erro. Interessa mais o que vai aparecer entre esses dois juízos quando as regras entrarem em uso. Dá gosto ler uma boa lei. Viver bem sob ela é ainda melhor."
