 NFP50_LAW_OWN_COMPARE_1:0 "E como seria recebida uma mudança semelhante em casa? Entre os grupos do nosso governo, os favoráveis representam [ScriptContainer.GetVariableValue('nfp50_law_own_yes')|1]% da força política e os contrários, [ScriptContainer.GetVariableValue('nfp50_law_own_no')|1]%. Esta é uma comparação de opiniões sobre a lei. Não é uma reação anunciada à decisão alheia. Lá fora a regra já mudou. Aqui temos ocasião de pensar no que nos agrada nas nossas."
 NFP50_LAW_OWN_COMPARE_2:0 "E como seria recebida uma mudança semelhante em casa? Entre os grupos do nosso governo, os favoráveis representam [ScriptContainer.GetVariableValue('nfp50_law_own_yes')|1]% da força política e os contrários, [ScriptContainer.GetVariableValue('nfp50_law_own_no')|1]%. Esta é uma comparação de opiniões sobre a lei. Não é uma reação anunciada à decisão alheia. Lá fora a regra já mudou. Aqui temos ocasião de pensar no que nos agrada nas nossas."
 NFP50_LAW_OWN_SAME_1:0 "A mesma lei está em vigor aqui. Podemos comparar mais do que promessas. Será interessante ver como outro país se sai sob regras semelhantes. Linhas iguais nos códigos não tornam idêntica a vida dos dois lados da fronteira."
 NFP50_LAW_OWN_SAME_2:0 "A mesma lei está em vigor aqui. Podemos comparar mais do que promessas. Será interessante ver como outro país se sai sob regras semelhantes. Linhas iguais nos códigos não tornam idêntica a vida dos dois lados da fronteira."
