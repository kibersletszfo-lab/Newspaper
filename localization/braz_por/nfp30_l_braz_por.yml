 NFP50_LAW_IG_BASE_2:0 "Os maiores grupos de interesse também têm suas opiniões. $NFP50_LAW_IG_ROW_1$ [SelectLocalization(GreaterThan_CFixedPoint(ScriptContainer.GetVariableValue('nfp50_law_ig_count'), '(CFixedPoint)1'), 'NFP50_LAW_IG_ROW_2', 'NFP50_LAW_NO_SECOND_IG')] Essas são as vozes dos grupos organizados. Uma linha de jornal não fala por todos os habitantes."
