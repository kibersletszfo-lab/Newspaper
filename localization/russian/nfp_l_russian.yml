l_russian:
 NFP20_ACCESS:0 "Устойчиво низкий доступ к рынку\nОпределение страны: [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName]. Наблюдение: [ScriptContainer.GetVariableValue('nfp20_year')|0] г., месяц [Add_CFixedPoint(ScriptContainer.GetVariableValue('nfp20_month'), '(CFixedPoint)1')|0].\nРегион: [ScriptContainer.MakeScope.Var('nfp20_region').GetStateRegion.GetName]. Два месяца подряд доступ ниже 90%; текущая доля: [ScriptContainer.GetVariableValue('nfp20_after')|3]. Причина не установлена: дефицит местной инфраструктуры, морская связь и другие ограничения требуют отдельной проверки.\nОтбор: [Localize(ScriptContainer.MakeScope.Var('nfp20_reason').GetFlagName)]. Факт № [ScriptContainer.GetVariableValue('nfp20_id')|0]."
 NFP20_ACCESS_RECOVERY:0 "Продолжение: доступ к рынку улучшился\nОпределение страны: [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName]. Наблюдение: [ScriptContainer.GetVariableValue('nfp20_year')|0] г., месяц [Add_CFixedPoint(ScriptContainer.GetVariableValue('nfp20_month'), '(CFixedPoint)1')|0].\nРегион: [ScriptContainer.MakeScope.Var('nfp20_region').GetStateRegion.GetName]. После ранее опубликованной проблемы два наблюдения подряд дают доступ не ниже 90%. Доля: [ScriptContainer.GetVariableValue('nfp20_before')|3] → [ScriptContainer.GetVariableValue('nfp20_after')|3].\nОтбор: [Localize(ScriptContainer.MakeScope.Var('nfp20_reason').GetFlagName)]. Факт № [ScriptContainer.GetVariableValue('nfp20_id')|0]."
 NFP20_COVER_TEXT:0 "Редакционная сводка\nМатериалов: [ScriptContainer.GetVariableValue('nfp20_article_count')|0]. Числа и формулировки закреплены за номером.\n\nИстория наблюдений: [ScriptContainer.GetVariableValue('nfp20_history_count')|0] точек; сравнение за [ScriptContainer.GetVariableValue('nfp20_summary_intervals')|0] интервалов (до 12).\nПрогноз годового ВВП: [ScriptContainer.GetVariableValue('nfp20_summary_before')|0] → [ScriptContainer.GetVariableValue('nfp20_summary_after')|0].\n\nЕсли материалов нет, подтверждённых новостей для включённых рубрик пока не накопилось. Старые факты всегда подписаны временем наблюдения."
 NFP20_DIAGNOSTICS:0 "Редакционная диагностика на момент печати\nОсталось в очереди: [ScriptContainer.GetVariableValue('nfp20_queue_remaining')|0]; пропущено из-за переполнения за всё наблюдение: [ScriptContainer.GetVariableValue('nfp20_dropped')|0].\nНе выбрано в этот номер: устаревшая проблема [ScriptContainer.GetVariableValue('nfp20_rejected_obsolete')|0]; рубрика выключена [ScriptContainer.GetVariableValue('nfp20_rejected_rubric')|0]; нет срочности [ScriptContainer.GetVariableValue('nfp20_rejected_urgent')|0]; лимит типа [ScriptContainer.GetVariableValue('nfp20_rejected_cap')|0]; места не хватило [ScriptContainer.GetVariableValue('nfp20_rejected_space')|0]."
 NFP20_DIVERGENCE:0 "Рост экономики расходится с уровнем жизни\nОпределение страны: [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName]. Наблюдение: [ScriptContainer.GetVariableValue('nfp20_year')|0] г., месяц [Add_CFixedPoint(ScriptContainer.GetVariableValue('nfp20_month'), '(CFixedPoint)1')|0].\nЗа три полных месячных интервала прогноз годового ВВП вырос: [ScriptContainer.GetVariableValue('nfp20_before')|0] → [ScriptContainer.GetVariableValue('nfp20_after')|0]. Средний уровень жизни упал на [ScriptContainer.GetVariableValue('nfp20_extra')|2] пункта. Эти данные описывают расхождение, но не устанавливают его причину.\nОтбор: [Localize(ScriptContainer.MakeScope.Var('nfp20_reason').GetFlagName)]. Факт № [ScriptContainer.GetVariableValue('nfp20_id')|0]."
 NFP20_GDP_LEADER:0 "Новая страна в десятке по ВВП\nОпределение страны: [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName]. Наблюдение: [ScriptContainer.GetVariableValue('nfp20_year')|0] г., месяц [Add_CFixedPoint(ScriptContainer.GetVariableValue('nfp20_month'), '(CFixedPoint)1')|0].\nПредыдущая позиция вне десятки: [ScriptContainer.GetVariableValue('nfp20_before')|0]. Текущее место: [ScriptContainer.GetVariableValue('nfp20_after')|0]. Страна держится в топ-10 два месячных наблюдения подряд. Речь о прогнозе годового ВВП, а не прибыли или благосостоянии населения.\nОтбор: [Localize(ScriptContainer.MakeScope.Var('nfp20_reason').GetFlagName)]. Факт № [ScriptContainer.GetVariableValue('nfp20_id')|0]."
 NFP20_INFRA:0 "Инфраструктура под нагрузкой\nОпределение страны: [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName]. Наблюдение: [ScriptContainer.GetVariableValue('nfp20_year')|0] г., месяц [Add_CFixedPoint(ScriptContainer.GetVariableValue('nfp20_month'), '(CFixedPoint)1')|0].\nРегион: [ScriptContainer.MakeScope.Var('nfp20_region').GetStateRegion.GetName]. Отрицательный баланс инфраструктуры отмечен два месяца подряд. Последний баланс: [ScriptContainer.GetVariableValue('nfp20_after')|2]. Это повод проверить местную транспортную сеть и нагрузку.\nОтбор: [Localize(ScriptContainer.MakeScope.Var('nfp20_reason').GetFlagName)]. Факт № [ScriptContainer.GetVariableValue('nfp20_id')|0]."
 NFP20_INFRA_RECOVERY:0 "Продолжение: инфраструктурный баланс восстановился\nОпределение страны: [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName]. Наблюдение: [ScriptContainer.GetVariableValue('nfp20_year')|0] г., месяц [Add_CFixedPoint(ScriptContainer.GetVariableValue('nfp20_month'), '(CFixedPoint)1')|0].\nРегион: [ScriptContainer.MakeScope.Var('nfp20_region').GetStateRegion.GetName]. После опубликованного предупреждения баланс неотрицателен в двух последовательных наблюдениях: [ScriptContainer.GetVariableValue('nfp20_before')|2] → [ScriptContainer.GetVariableValue('nfp20_after')|2]. Это подтверждённое улучшение, а не гарантия отсутствия будущих проблем.\nОтбор: [Localize(ScriptContainer.MakeScope.Var('nfp20_reason').GetFlagName)]. Факт № [ScriptContainer.GetVariableValue('nfp20_id')|0]."
 NFP20_LAW:0 "Значимая реформа вступила в силу\nОпределение страны: [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName]. Наблюдение: [ScriptContainer.GetVariableValue('nfp20_year')|0] г., месяц [Add_CFixedPoint(ScriptContainer.GetVariableValue('nfp20_month'), '(CFixedPoint)1')|0].\nЗакон: [Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]. Зафиксирована активация закона. Газета не утверждает, что он был принят парламентским голосованием, и пока не оценивает последствия.\nОтбор: [Localize(ScriptContainer.MakeScope.Var('nfp20_reason').GetFlagName)]. Факт № [ScriptContainer.GetVariableValue('nfp20_id')|0]."
 NFP20_LITERACY:0 "Пересечён рубеж грамотности\nОпределение страны: [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName]. Наблюдение: [ScriptContainer.GetVariableValue('nfp20_year')|0] г., месяц [Add_CFixedPoint(ScriptContainer.GetVariableValue('nfp20_month'), '(CFixedPoint)1')|0].\nДоля грамотных: [ScriptContainer.GetVariableValue('nfp20_before')|3] → [ScriptContainer.GetVariableValue('nfp20_after')|3]. Пересечён рубеж [ScriptContainer.GetVariableValue('nfp20_extra')|2] (доля населения). Рубеж подтверждён сравнением с предыдущим снимком, а не стартовым состоянием страны.\nОтбор: [Localize(ScriptContainer.MakeScope.Var('nfp20_reason').GetFlagName)]. Факт № [ScriptContainer.GetVariableValue('nfp20_id')|0]."
 NFP20_NONE:0 "—"
 NFP20_PRODUCTION:0 "В тройке производителей появился новый участник\nОпределение страны: [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName]. Наблюдение: [ScriptContainer.GetVariableValue('nfp20_year')|0] г., месяц [Add_CFixedPoint(ScriptContainer.GetVariableValue('nfp20_month'), '(CFixedPoint)1')|0].\nТовар: [Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]. Позиция вне тройки: [ScriptContainer.GetVariableValue('nfp20_before')|0]; сейчас: [ScriptContainer.GetVariableValue('nfp20_after')|0]. Топ-3 подтверждён двумя месячными наблюдениями. Сравнивается объём производства; прибыльность и экспорт не измерялись.\nОтбор: [Localize(ScriptContainer.MakeScope.Var('nfp20_reason').GetFlagName)]. Факт № [ScriptContainer.GetVariableValue('nfp20_id')|0]."
 NFP20_QUIET:0 "Для этой рубрики в данном номере нет новых отобранных материалов. Газета не заполняет страницу повторением текущих показателей."
 NFP20_RANK:0 "Изменился статус страны\nОпределение страны: [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName]. Наблюдение: [ScriptContainer.GetVariableValue('nfp20_year')|0] г., месяц [Add_CFixedPoint(ScriptContainer.GetVariableValue('nfp20_month'), '(CFixedPoint)1')|0].\nПрежний статус: [Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]. Новый: [Localize(ScriptContainer.MakeScope.Var('nfp20_extra_detail').GetFlagName)]. Изменение ранга не всегда означает появление новой великой державы.\nОтбор: [Localize(ScriptContainer.MakeScope.Var('nfp20_reason').GetFlagName)]. Факт № [ScriptContainer.GetVariableValue('nfp20_id')|0]."
 NFP20_RANK_UNKNOWN:0 "вне перечисленных категорий"
 NFP20_REASON_PRIORITY:0 "приоритет темы и давность"
 NFP20_SHORTAGE:0 "Рыночный дефицит сохраняется\nОпределение страны: [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName]. Наблюдение: [ScriptContainer.GetVariableValue('nfp20_year')|0] г., месяц [Add_CFixedPoint(ScriptContainer.GetVariableValue('nfp20_month'), '(CFixedPoint)1')|0].\nТовар: [Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]. Прямой признак дефицита отмечен на рынке читателя два месяца подряд. Это не вывод из высокой цены; проверьте снабжение и потребление рынка.\nОтбор: [Localize(ScriptContainer.MakeScope.Var('nfp20_reason').GetFlagName)]. Факт № [ScriptContainer.GetVariableValue('nfp20_id')|0]."
 NFP20_SHORTAGE_RECOVERY:0 "Продолжение: рыночный дефицит больше не наблюдается\nОпределение страны: [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName]. Наблюдение: [ScriptContainer.GetVariableValue('nfp20_year')|0] г., месяц [Add_CFixedPoint(ScriptContainer.GetVariableValue('nfp20_month'), '(CFixedPoint)1')|0].\nТовар: [Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]. После опубликованного предупреждения прямой признак дефицита отсутствует в двух месячных наблюдениях. Высокая цена может сохраняться; это иной показатель.\nОтбор: [Localize(ScriptContainer.MakeScope.Var('nfp20_reason').GetFlagName)]. Факт № [ScriptContainer.GetVariableValue('nfp20_id')|0]."
 NFP20_TECH:0 "Получена значимая технология\nОпределение страны: [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName]. Наблюдение: [ScriptContainer.GetVariableValue('nfp20_year')|0] г., месяц [Add_CFixedPoint(ScriptContainer.GetVariableValue('nfp20_month'), '(CFixedPoint)1')|0].\nТехнология: [Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]. Зафиксировано получение знания страной. Это не свидетельство мирового первенства и не подтверждение внедрения во всех предприятиях.\nОтбор: [Localize(ScriptContainer.MakeScope.Var('nfp20_reason').GetFlagName)]. Факт № [ScriptContainer.GetVariableValue('nfp20_id')|0]."
 NFP20_WAR_END:0 "Война завершилась\nМомент факта: [ScriptContainer.GetVariableValue('nfp20_year')|0] г., месяц [Add_CFixedPoint(ScriptContainer.GetVariableValue('nfp20_month'), '(CFixedPoint)1')|0].\nГлавные стороны по постоянным определениям: [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName] и [ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName]. Зафиксировано окончание войны. Газета не делает неподтверждённых выводов о победителе, потерях или условиях мира.\nОтбор: [Localize(ScriptContainer.MakeScope.Var('nfp20_reason').GetFlagName)]. Факт № [ScriptContainer.GetVariableValue('nfp20_id')|0]."
 NFP20_WAR_START:0 "Началась война\nМомент факта: [ScriptContainer.GetVariableValue('nfp20_year')|0] г., месяц [Add_CFixedPoint(ScriptContainer.GetVariableValue('nfp20_month'), '(CFixedPoint)1')|0].\nГлавные стороны по постоянным определениям: [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName] и [ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName]. Зафиксирован переход дипломатической игры к войне. Прочие участники и будущий исход здесь не оцениваются.\nОтбор: [Localize(ScriptContainer.MakeScope.Var('nfp20_reason').GetFlagName)]. Факт № [ScriptContainer.GetVariableValue('nfp20_id')|0]."
 NFP_ARCHIVE:0 "Архив (до 12)"
 NFP_ARCHIVE_ITEM:0 "№ [ScriptContainer.GetVariableValue('nfp_number')|0]"
 NFP_COUNTRY:0 "Читатель: [GetPlayer.GetName]"
 NFP_COVER:0 "Обложка"
 NFP_COVER_TEXT:0 "Снимок страны на момент печати\n\nВВП: [ScriptContainer.GetVariableValue('nfp_gdp')|0]\nНаселение: [ScriptContainer.GetVariableValue('nfp_population')|0]\nСредний уровень жизни: [ScriptContainer.GetVariableValue('nfp_sol')|2]\nГрамотность (исходная доля): [ScriptContainer.GetVariableValue('nfp_literacy')|3]\n\nВыберите рубрику или перелистните страницу. Состав рубрик закреплён за этим номером. Значения не пересчитываются при чтении."
 NFP_ECONOMY:0 "Экономика"
 NFP_EVENTS:0 "События"
 NFP_ISSUE_HEADER:0 "Выпуск № [ScriptContainer.GetVariableValue('nfp_number')|0] — [ScriptContainer.GetVariableValue('nfp_year')|0] г., месяц [Add_CFixedPoint(ScriptContainer.GetVariableValue('nfp_month'), '(CFixedPoint)1')|0]"
 NFP_ISSUE_META:0 "Источник: [SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp_kind'), '(CFixedPoint)1'), 'NFP_KIND_REGULAR', SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp_kind'), '(CFixedPoint)3'), 'NFP_KIND_URGENT', 'NFP_KIND_OTHER'))] • маркер [ScriptContainer.GetVariableValue('nfp_marker')|0]"
 NFP_KIND_OTHER:0 "ручная печать"
 NFP_KIND_REGULAR:0 "регулярная доставка"
 NFP_KIND_URGENT:0 "срочный выпуск"
 NFP_LATEST:0 "Последний номер"
 NFP_NEXT:0 "Следующая"
 NFP_PREVIOUS:0 "Предыдущая"
 NFP_READER:0 "Читать газету"
 NFP_SETTINGS:0 "Подписка"
 NFP_SOCIETY:0 "Общество"
 NFP_WAR:0 "Война"
 je_nfp_subscription:0 "Газетная подписка"
 je_nfp_subscription_reason:0 "Настройте получение ежемесячных и срочных выпусков кнопкой газеты. Полученные номера сохраняются в архиве; одновременно доступны до 12 выпусков."
 nfp_open_decision:0 "Открыть газету"
 nfp_open_decision_desc:0 "Прочитайте свежий номер или выберите один из предыдущих выпусков в архиве."
