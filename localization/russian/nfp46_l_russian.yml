l_russian:
 NFP46_GOOD_LABEL:0 "[ScriptContainer.MakeScope.Var('nfp46_good').GetGoods.GetNameNoIcon]"
 NFP46_METRICS:0 "Товар: [ScriptContainer.MakeScope.Var('nfp46_good').GetGoods.GetNameNoIcon]. Заявки на покупку: [ScriptContainer.GetVariableValue('nfp46_buy_before')|1] → [ScriptContainer.GetVariableValue('nfp46_buy_after')|1]; заявки на продажу: [ScriptContainer.GetVariableValue('nfp46_sell_before')|1] → [ScriptContainer.GetVariableValue('nfp46_sell_after')|1]. Разрыв относительно спроса: [ScriptContainer.GetVariableValue('nfp46_gap_before')|1]% → [ScriptContainer.GetVariableValue('nfp46_gap_after')|1]%. Слева — первый сохранённый срез этой серии наблюдений, справа — последнее месячное наблюдение.\nРедакционный порог: предложение ниже 80% спроса в двух последовательных месячных срезах либо прямой признак дефицита игры. Местные услуги, транспорт и электричество требуют отдельного регионального наблюдения."
 NFP46_SHORTAGE_BODY_1:0 "Игра отмечает прямой признак товарного дефицита на нашем рынке. В двух последовательных месячных наблюдениях сохранялась проблема снабжения: прямой признак либо существенный разрыв заявок.\n\nТовар: [ScriptContainer.MakeScope.Var('nfp46_good').GetGoods.GetNameNoIcon]. Заявки на покупку: [ScriptContainer.GetVariableValue('nfp46_buy_before')|1] → [ScriptContainer.GetVariableValue('nfp46_buy_after')|1]; заявки на продажу: [ScriptContainer.GetVariableValue('nfp46_sell_before')|1] → [ScriptContainer.GetVariableValue('nfp46_sell_after')|1]. Разрыв относительно спроса: [ScriptContainer.GetVariableValue('nfp46_gap_before')|1]% → [ScriptContainer.GetVariableValue('nfp46_gap_after')|1]%. Слева — первый сохранённый срез этой серии наблюдений, справа — последнее месячное наблюдение.\n\nЭто сопоставление рыночных заявок, а не измерение недополученного товара населением. Причины разрыва, конкретные постройки и последствия для уровня жизни этими числами не установлены."
 NFP46_SHORTAGE_BODY_2:0 "Последний срез отмечает прямой признак рыночного дефицита. Проблема снабжения наблюдалась два месяца подряд; критерий предыдущего среза мог быть разрывом заявок, поэтому это не утверждение о двух месяцах производственного штрафа.\n\nТовар: [ScriptContainer.MakeScope.Var('nfp46_good').GetGoods.GetNameNoIcon]. Заявки на покупку: [ScriptContainer.GetVariableValue('nfp46_buy_before')|1] → [ScriptContainer.GetVariableValue('nfp46_buy_after')|1]; заявки на продажу: [ScriptContainer.GetVariableValue('nfp46_sell_before')|1] → [ScriptContainer.GetVariableValue('nfp46_sell_after')|1]. Разрыв относительно спроса: [ScriptContainer.GetVariableValue('nfp46_gap_before')|1]% → [ScriptContainer.GetVariableValue('nfp46_gap_after')|1]%. Слева — первый сохранённый срез этой серии наблюдений, справа — последнее месячное наблюдение.\n\nЭто сопоставление рыночных заявок, а не измерение недополученного товара населением. Причины разрыва, конкретные постройки и последствия для уровня жизни этими числами не установлены."
 NFP46_SHORTAGE_LEAD_1:0 "Нехватка товара не исчезла из рыночных наблюдений. Редакция поднимает вопрос снабжения."
 NFP46_SHORTAGE_LEAD_2:0 "На нашем рынке отмечен прямой признак дефицита. Эта проблема заслуживает внимания."
 NFP46_SHORTAGE_RECOVERY_BODY_1:0 "После нашего предупреждения прямой признак дефицита отсутствует два месячных наблюдения подряд; предложение в обоих срезах также составляет не менее 80% спроса. Это не обещание низкой цены и не утверждение о восстановлении каждого предприятия.\n\nТовар: [ScriptContainer.MakeScope.Var('nfp46_good').GetGoods.GetNameNoIcon]. Заявки на покупку: [ScriptContainer.GetVariableValue('nfp46_buy_before')|1] → [ScriptContainer.GetVariableValue('nfp46_buy_after')|1]; заявки на продажу: [ScriptContainer.GetVariableValue('nfp46_sell_before')|1] → [ScriptContainer.GetVariableValue('nfp46_sell_after')|1]. Разрыв относительно спроса: [ScriptContainer.GetVariableValue('nfp46_gap_before')|1]% → [ScriptContainer.GetVariableValue('nfp46_gap_after')|1]%. Слева — первый сохранённый срез этой серии наблюдений, справа — последнее месячное наблюдение.\n\nЭто сопоставление рыночных заявок, а не измерение недополученного товара населением. Причины разрыва, конкретные постройки и последствия для уровня жизни этими числами не установлены."
 NFP46_SHORTAGE_RECOVERY_BODY_2:0 "Два последовательных месячных среза не обнаруживают ни прежнего прямого признака дефицита, ни разрыва заявок свыше редакционного порога. Мы фиксируем изменение наблюдений, сохраняя различие между наличием товара и его ценой.\n\nТовар: [ScriptContainer.MakeScope.Var('nfp46_good').GetGoods.GetNameNoIcon]. Заявки на покупку: [ScriptContainer.GetVariableValue('nfp46_buy_before')|1] → [ScriptContainer.GetVariableValue('nfp46_buy_after')|1]; заявки на продажу: [ScriptContainer.GetVariableValue('nfp46_sell_before')|1] → [ScriptContainer.GetVariableValue('nfp46_sell_after')|1]. Разрыв относительно спроса: [ScriptContainer.GetVariableValue('nfp46_gap_before')|1]% → [ScriptContainer.GetVariableValue('nfp46_gap_after')|1]%. Слева — первый сохранённый срез этой серии наблюдений, справа — последнее месячное наблюдение.\n\nЭто сопоставление рыночных заявок, а не измерение недополученного товара населением. Причины разрыва, конкретные постройки и последствия для уровня жизни этими числами не установлены."
 NFP46_SHORTAGE_RECOVERY_LEAD_1:0 "Продолжаем опубликованную историю снабжения: два наблюдения больше не показывают прежней проблемы."
 NFP46_SHORTAGE_RECOVERY_LEAD_2:0 "В истории рыночного дефицита появились обнадёживающие сведения."
 NFP46_SHORTAGE_RECOVERY_TITLE_1:0 "Прежняя нехватка отступает"
 NFP46_SHORTAGE_RECOVERY_TITLE_2:0 "Снабжение: благоприятный поворот"
 NFP46_SHORTAGE_TITLE_1:0 "Наш рынок: дефицит требует внимания"
 NFP46_SHORTAGE_TITLE_2:0 "Вопрос снабжения остаётся открытым"
 NFP46_SUPPLY_GAP_BODY_1:0 "В последнем месячном срезе заявки на продажу составляют менее 80% заявок на покупку. Проблема отмечалась и месяцем ранее: существенный разрыв заявок либо прямой признак дефицита игры. Редакционный порог дисбаланса не означает автоматически производственного штрафа.\n\nТовар: [ScriptContainer.MakeScope.Var('nfp46_good').GetGoods.GetNameNoIcon]. Заявки на покупку: [ScriptContainer.GetVariableValue('nfp46_buy_before')|1] → [ScriptContainer.GetVariableValue('nfp46_buy_after')|1]; заявки на продажу: [ScriptContainer.GetVariableValue('nfp46_sell_before')|1] → [ScriptContainer.GetVariableValue('nfp46_sell_after')|1]. Разрыв относительно спроса: [ScriptContainer.GetVariableValue('nfp46_gap_before')|1]% → [ScriptContainer.GetVariableValue('nfp46_gap_after')|1]%. Слева — первый сохранённый срез этой серии наблюдений, справа — последнее месячное наблюдение.\n\nЭто сопоставление рыночных заявок, а не измерение недополученного товара населением. Причины разрыва, конкретные постройки и последствия для уровня жизни этими числами не установлены."
 NFP46_SUPPLY_GAP_BODY_2:0 "Два последовательных месячных среза отмечают проблему снабжения. Сейчас предложение ниже 80% спроса; в предыдущем срезе наблюдался такой разрыв либо прямой признак дефицита. Это не вывод о производственном штрафе или о последствиях высокой цены.\n\nТовар: [ScriptContainer.MakeScope.Var('nfp46_good').GetGoods.GetNameNoIcon]. Заявки на покупку: [ScriptContainer.GetVariableValue('nfp46_buy_before')|1] → [ScriptContainer.GetVariableValue('nfp46_buy_after')|1]; заявки на продажу: [ScriptContainer.GetVariableValue('nfp46_sell_before')|1] → [ScriptContainer.GetVariableValue('nfp46_sell_after')|1]. Разрыв относительно спроса: [ScriptContainer.GetVariableValue('nfp46_gap_before')|1]% → [ScriptContainer.GetVariableValue('nfp46_gap_after')|1]%. Слева — первый сохранённый срез этой серии наблюдений, справа — последнее месячное наблюдение.\n\nЭто сопоставление рыночных заявок, а не измерение недополученного товара населением. Причины разрыва, конкретные постройки и последствия для уровня жизни этими числами не установлены."
 NFP46_SUPPLY_GAP_LEAD_1:0 "Наблюдения за снабжением два месяца подряд обнаруживают проблему. В последнем срезе предложение заметно отстаёт от спроса."
 NFP46_SUPPLY_GAP_LEAD_2:0 "Газета обращает внимание на устойчивую проблему снабжения: сейчас предложение существенно ниже спроса."
 NFP46_SUPPLY_GAP_RECOVERY_BODY_1:0 "Два месячных среза подряд предложение составляет не менее 80% заявок на покупку, а прямой признак дефицита не отмечен. Разрыв мог сохраниться ниже этого порога: полного равновесия или низких цен газета не обещает.\n\nТовар: [ScriptContainer.MakeScope.Var('nfp46_good').GetGoods.GetNameNoIcon]. Заявки на покупку: [ScriptContainer.GetVariableValue('nfp46_buy_before')|1] → [ScriptContainer.GetVariableValue('nfp46_buy_after')|1]; заявки на продажу: [ScriptContainer.GetVariableValue('nfp46_sell_before')|1] → [ScriptContainer.GetVariableValue('nfp46_sell_after')|1]. Разрыв относительно спроса: [ScriptContainer.GetVariableValue('nfp46_gap_before')|1]% → [ScriptContainer.GetVariableValue('nfp46_gap_after')|1]%. Слева — первый сохранённый срез этой серии наблюдений, справа — последнее месячное наблюдение.\n\nЭто сопоставление рыночных заявок, а не измерение недополученного товара населением. Причины разрыва, конкретные постройки и последствия для уровня жизни этими числами не установлены."
 NFP46_SUPPLY_GAP_RECOVERY_BODY_2:0 "После нашего предупреждения рынок два месяца подряд остаётся вне редакционного порога проблемы: предложение не ниже 80% спроса, прямой признак дефицита отсутствует. Это ограниченное улучшение показателей, а не готовый вывод о причинах и последствиях.\n\nТовар: [ScriptContainer.MakeScope.Var('nfp46_good').GetGoods.GetNameNoIcon]. Заявки на покупку: [ScriptContainer.GetVariableValue('nfp46_buy_before')|1] → [ScriptContainer.GetVariableValue('nfp46_buy_after')|1]; заявки на продажу: [ScriptContainer.GetVariableValue('nfp46_sell_before')|1] → [ScriptContainer.GetVariableValue('nfp46_sell_after')|1]. Разрыв относительно спроса: [ScriptContainer.GetVariableValue('nfp46_gap_before')|1]% → [ScriptContainer.GetVariableValue('nfp46_gap_after')|1]%. Слева — первый сохранённый срез этой серии наблюдений, справа — последнее месячное наблюдение.\n\nЭто сопоставление рыночных заявок, а не измерение недополученного товара населением. Причины разрыва, конкретные постройки и последствия для уровня жизни этими числами не установлены."
 NFP46_SUPPLY_GAP_RECOVERY_LEAD_1:0 "Возвращаемся к опубликованной проблеме: предложение больше не отстаёт от спроса столь значительно."
 NFP46_SUPPLY_GAP_RECOVERY_LEAD_2:0 "Два наблюдения не подтверждают прежнего существенного разрыва заявок."
 NFP46_SUPPLY_GAP_RECOVERY_TITLE_1:0 "Рыночный разрыв сократился"
 NFP46_SUPPLY_GAP_RECOVERY_TITLE_2:0 "В снабжении появились признаки улучшения"
 NFP46_SUPPLY_GAP_TITLE_1:0 "Спрос опережает предложение"
 NFP46_SUPPLY_GAP_TITLE_2:0 "Рыночный разрыв нельзя оставлять без внимания"
