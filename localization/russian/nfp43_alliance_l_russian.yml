l_russian:
 NFP43_GAINED:0 "Обнаружено новое союзное отношение нашей страны с державой [ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName]."
 NFP43_GAINED_ALLIANCE_1_BODY:0 "Наш круг союзных отношений изменился. Последнее наблюдение подтверждает альянс с державой [ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName].\n\nДля нашей дипломатии это важное известие. Состав договорённостей и решение об участии в конкретном конфликте следует оценивать по действующим условиям альянса."
 NFP43_GAINED_ALLIANCE_1_LEAD:0 "С державой [ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName] теперь действует формальный альянс."
 NFP43_GAINED_ALLIANCE_1_TITLE:0 "У нашей страны новый союзник"
 NFP43_GAINED_ALLIANCE_2_BODY:0 "Прежде эта союзная связь не наблюдалась, а теперь она действует: [ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName] входит в круг наших формальных союзников.\n\nГазета фиксирует изменение дипломатических отношений; содержание обязательств не подменяется обещанием безусловной военной помощи."
 NFP43_GAINED_ALLIANCE_2_LEAD:0 "Редакция отмечает новый альянс нашей страны с державой [ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName]."
 NFP43_GAINED_ALLIANCE_2_TITLE:0 "Союзные связи укрепились"
 NFP43_GAINED_BLOC_1_BODY:0 "Состав нашего общего дипломатического пространства изменился: последнее наблюдение подтверждает совместное участие с державой [ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName] в силовом блоке.\n\nЭто сообщение о составе блока. Оно само по себе не означает заключения двустороннего альянса или обязательства участвовать в любой войне партнёра."
 NFP43_GAINED_BLOC_1_LEAD:0 "Держава [ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName] теперь состоит в одном силовом блоке с нашей страной."
 NFP43_GAINED_BLOC_1_TITLE:0 "В общем блоке появился новый партнёр"
 NFP43_GAINED_BLOC_2_BODY:0 "Между наблюдениями появилась новая общая связь: наша страна и [ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName] состоят в одном блоке. Переместиться при этом могла любая из сторон.\n\nГазета отмечает новый состав отношений, не приписывая его неподтверждённому приглашению или договору о военной помощи."
 NFP43_GAINED_BLOC_2_LEAD:0 "Мы и держава [ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName] теперь участвуем в одном силовом блоке."
 NFP43_GAINED_BLOC_2_TITLE:0 "Круг партнёров по блоку изменился"
 NFP43_GAINED_METRICS:0 "Новая собственная стратегическая связь между наблюдениями. Вид: [SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp20_extra'), '(CFixedPoint)1'), 'NFP43_KIND_ALLIANCE', 'NFP43_KIND_BLOC')]. Первый снимок создаётся молча. Наблюдения — еженедельно и перед печатью; кратковременные изменения между ними могут быть пропущены. Месяц материала — месяц обнаружения, а не установленная дата подписания. Приоритет 160; только своему читателю, без фильтра зарубежной географии."
 NFP43_KIND_ALLIANCE:0 "формальный альянс"
 NFP43_KIND_BLOC:0 "совместное участие в силовом блоке"
 NFP43_LOST:0 "Прежнее союзное отношение нашей страны с державой [ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName] больше не наблюдается."
 NFP43_LOST_ALLIANCE_1_BODY:0 "Наш список союзников изменился: ранее действовавший альянс с державой [ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName] при последнем наблюдении отсутствует.\n\nЭто повод пересмотреть расчёты, опиравшиеся на прежние отношения. Редакции не установлены инициатор и причина прекращения связи."
 NFP43_LOST_ALLIANCE_1_LEAD:0 "Держава [ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName] больше не связана с нами наблюдаемым формальным альянсом."
 NFP43_LOST_ALLIANCE_1_TITLE:0 "Прежний альянс больше не действует"
 NFP43_LOST_ALLIANCE_2_BODY:0 "Прежней союзной связи нашей страны с державой [ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName] больше нет в последнем снимке отношений.\n\nОбстоятельства перемены требуют отдельного рассмотрения: исчезновение государства и дипломатический разрыв нельзя без данных объявлять одной и той же причиной."
 NFP43_LOST_ALLIANCE_2_LEAD:0 "Формальный альянс с державой [ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName] перестал наблюдаться."
 NFP43_LOST_ALLIANCE_2_TITLE:0 "В союзной сети образовался разрыв"
 NFP43_LOST_BLOC_1_BODY:0 "Ранее мы состояли в общем силовом блоке с державой [ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName]. Последний снимок уже не подтверждает эту связь.\n\nИзмениться могло положение любой из сторон, либо сам блок. Редакция фиксирует результат и не объявляет без доказательств, кто именно покинул объединение."
 NFP43_LOST_BLOC_1_LEAD:0 "Держава [ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName] больше не наблюдается в одном силовом блоке с нашей страной."
 NFP43_LOST_BLOC_1_TITLE:0 "Совместное участие в блоке прекратилось"
 NFP43_LOST_BLOC_2_BODY:0 "Совместное членство нашей страны и державы [ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName] перестало наблюдаться. Это изменение относится к нашему непосредственному дипломатическому окружению.\n\nПричина и инициатор перемены здесь не установлены. Двусторонний альянс, если он существует отдельно, этим сообщением не опровергается."
 NFP43_LOST_BLOC_2_LEAD:0 "Прежняя блоковая связь с державой [ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName] больше не подтверждается."
 NFP43_LOST_BLOC_2_TITLE:0 "В составе общего блока произошла перемена"
 NFP43_LOST_METRICS:0 "Собственная стратегическая связь перестала наблюдаться. Вид: [SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp20_extra'), '(CFixedPoint)1'), 'NFP43_KIND_ALLIANCE', 'NFP43_KIND_BLOC')]. Наблюдения — еженедельно и перед печатью. Не установлены инициатор разрыва и точная дата. Исчезновение державы также прекращает связь. Приоритет 170; только своему читателю."
 NFP43_RELATION:0 "союзная связь нашей страны"
 NFP43_WAR:0 "Началась война: [ScriptContainer.MakeScope.Var('nfp20_extra_detail').GetCountryDefinition.GetName] — нападающая сторона; [ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName] — обороняющаяся сторона."
 NFP43_WAR_ALLIANCE_1_BODY:0 "Началась война: [ScriptContainer.MakeScope.Var('nfp20_extra_detail').GetCountryDefinition.GetName] выступает инициатором, [ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName] — целью дипломатической игры. На момент начала войны наша страна связана с обороняющейся державой формальным альянсом.\n\nРедакция выносит это известие на первый план. Сам факт альянса не позволяет газете объявлять, что наша страна уже вступила в конфликт."
 NFP43_WAR_ALLIANCE_1_LEAD:0 "Держава [ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName] стала обороняющейся стороной новой войны."
 NFP43_WAR_ALLIANCE_1_TITLE:0 "Наш союзник оказался под ударом"
 NFP43_WAR_ALLIANCE_2_BODY:0 "Инициатор новой войны — [ScriptContainer.MakeScope.Var('nfp20_extra_detail').GetCountryDefinition.GetName]; обороняющаяся сторона — [ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName]. Союзная связь нашей страны с целью подтверждена в момент события.\n\nЭто непосредственно касается нашего дипломатического положения. Решение об участии и исполнение обязательств не выводятся из одного сообщения о начале войны."
 NFP43_WAR_ALLIANCE_2_LEAD:0 "Зафиксировано начало войны против державы [ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName], с которой действует наш альянс."
 NFP43_WAR_ALLIANCE_2_TITLE:0 "Война коснулась нашего союзника"
 NFP43_WAR_BLOC_1_BODY:0 "Началась война: [ScriptContainer.MakeScope.Var('nfp20_extra_detail').GetCountryDefinition.GetName] — инициатор, [ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName] — обороняющаяся сторона. На момент начала конфликта цель состоит в одном блоке с нашей страной.\n\nИзвестие заслуживает внимания нашего правительства. Совместный блок сам по себе не доказывает существования военного альянса или обязательного вступления в войну."
 NFP43_WAR_BLOC_1_LEAD:0 "Держава [ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName], состоящая с нами в одном силовом блоке, стала целью новой войны."
 NFP43_WAR_BLOC_1_TITLE:0 "Война против партнёра по нашему блоку"
 NFP43_WAR_BLOC_2_BODY:0 "Зафиксировано начало войны между инициатором [ScriptContainer.MakeScope.Var('nfp20_extra_detail').GetCountryDefinition.GetName] и целью [ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName]. Последняя в момент события связана с нашей страной совместным участием в блоке.\n\nГазета сообщает о близком нам дипломатическом событии, не объявляя нашу страну участницей конфликта и не приписывая блоку неподтверждённых обязательств."
 NFP43_WAR_BLOC_2_LEAD:0 "Партнёр по общему силовому блоку [ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName] оказался обороняющейся стороной."
 NFP43_WAR_BLOC_2_TITLE:0 "Наш дипломатический круг затронут войной"
 NFP43_WAR_METRICS:0 "Источник — on_diplo_play_war_start. Зафиксированы инициатор и цель дипломатической игры и действующая на этот момент союзная связь читателя с целью. Инициатор: [ScriptContainer.MakeScope.Var('nfp20_extra_detail').GetCountryDefinition.GetName]. Цель: [ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName]. Приоритет 190; срочный кандидат рубрики «Война». Совместное членство в блоке само по себе не подтверждает обязательство вступить в войну."
