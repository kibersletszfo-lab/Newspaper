 NFP52_AUS_2_TITLE:0 "На далёком материке — общее государство"
 NFP52_CAN_1_BODY:0 "Канада получила общее государственное устройство. Для внешнего наблюдателя это новое положение на карте. Для самих канадских земель — возможность решать больше вопросов сообща. Общее имя теперь связано не только с географией.\n\nКанадское объединение состоялось. Появилось государство, которому предстоит заниматься общими делами вошедших в него территорий. Отношения с сюзереном определяются отдельно: объединение само по себе не является объявлением независимости.\n\nТеперь общие решения предстоит наполнить содержанием. Расстояния, хозяйство и разные местные интересы не исчезают от новой вывески. Зато появился общий адрес для этих вопросов. Хотелось бы, чтобы по нему находились и ответы.\n\nХроника датирована месяцем получения известия редакцией. При задержке связи само событие могло произойти раньше."
 NFP52_CAN_1_CONTEXT:0 "Теперь общие решения предстоит наполнить содержанием. Расстояния, хозяйство и разные местные интересы не исчезают от новой вывески. Зато появился общий адрес для этих вопросов. Хотелось бы, чтобы по нему находились и ответы."
 NFP52_CAN_1_FACT:0 "Канадское объединение состоялось. Появилось государство, которому предстоит заниматься общими делами вошедших в него территорий. Отношения с сюзереном определяются отдельно: объединение само по себе не является объявлением независимости."
