 NFP52_YUG_2_LEAD:0 "На Балканах появилось югославское государство. Идея общего устройства получила политическую форму. Для края, к которому часто обращаются международные расчёты, это событие особого значения: теперь в этих расчётах есть новое государство."
 NFP52_YUG_2_TITLE:0 "Южнославянское объединение состоялось"
 NFP54_DIV_END:0 "Что хочется сказать в конце? Радоваться росту хозяйства можно и нужно. Только за большими числами легко не заметить тех, ради кого этот рост вообще должен иметь значение. Почему показатели разошлись — ещё предстоит выяснить. Но повод заняться этим уже перед нами.\n\nХороший отчёт — дело полезное. Особенно если после него становится лучше жить."
 NFP54_DIV_EXPECTED:0 "Добавим, что ожидаемый уровень жизни составляет [ScriptContainer.GetVariableValue('nfp50_family_expected_sol')|2], и для нашего государства, судя по всему, это неожиданность. И сколько бы мы ни любовались хозяйственными успехами, сам собой разрыв от этого не закроется."
 NFP54_DIV_FACT:0 "За три месяца наблюдений прогноз годового ВВП вырос с [ScriptContainer.GetVariableValue('nfp20_before')|0] до [ScriptContainer.GetVariableValue('nfp20_after')|0]. Прибавка составила [ScriptContainer.GetVariableValue('nfp50_family_gdp_growth')|2]%, но при этом средний уровень жизни за тот же срок снизился на [ScriptContainer.GetVariableValue('nfp20_extra')|2] пункта. Две новости. Две соседние строки. С первой хочется поздравить страну. Со второй — уже не очень."
 NFP54_DIV_INTRO:0 "Последние сводки ясно продемонстрировали, что у нашей страны есть успехи, которыми она может гордиться: ВВП вырос. И ведь, казалось бы, прекрасная новость. Можно поздравить друг друга, любуясь цифрами в информационной сводке, спеть про себя гимн и с чувством исполненного долга перевернуть страницу. Правда, прежде стоит обратить свой взор ещё на одну строку. Ту, где написано «уровень жизни»…"
 NFP54_DIV_LIVING:0 "Раньше средний уровень жизни составлял [ScriptContainer.GetVariableValue('nfp50_family_sol_before')|2], теперь — [ScriptContainer.GetVariableValue('nfp50_family_sol')|2]. Конечно, средняя цифра редко описывает чью-то конкретную жизнь. Тут впору вспомнить старую шутку: капиталисты едят мясо, фермеры — капусту, а в среднем получаем голубцы. Однако снижение среднего уровня — уже повод присмотреться к общей картине. Хозяйство прибавляет, а средний достаток отступает. Не самая приятная подробность для праздничного отчёта, не так ли?"
 NFP54_DIV_TITLE:0 "Успехи хозяйства, или почему цифрами не поужинаешь"
 NFP55_INF_CONNECTED:0 "При этом паниковать пока рано: доступ к общему рынку составляет [Multiply_CFixedPoint(ScriptContainer.GetVariableValue('nfp50_family_access'), '(CFixedPoint)100')|1]%. Объявлять область отрезанной от страны было бы явным преувеличением. Перегруженная инфраструктура ещё не означает, что завтра исчезнут хлеб и штаны. Не самая приятная новость, но до катастрофы ей далеко."
 NFP55_INF_DISCONNECTED:0 "Ещё один повод для беспокойства — доступ к общему рынку: [Multiply_CFixedPoint(ScriptContainer.GetVariableValue('nfp50_family_access'), '(CFixedPoint)100')|1]%. Связь области с ним далека от полной. До пустых прилавков дело дойдёт или нет — пока вопрос. Но хотелось бы разобраться раньше, чем жители начнут гадать, что закончится первым: нужные товары или терпение."
 NFP55_INF_END:0 "Что хочется сказать в конце? Присмотреться к области стоит сейчас, пока новости оттуда не стали привычным фоном нашей газеты. А пока правительство решает, как быть — строить железную дорогу, расширять порт или искать другое решение, — мы будем наблюдать за развитием событий.\n\nСемь раз отмерь — совет хороший. Только хотелось бы, чтобы после кто-то был готов #strikethrough резать#! действовать."
 NFP55_INF_FACT:0 "Речь об области [SelectLocalization(And(ScriptContainer.MakeScope.Var('nfp20_problem_state').IsSet, ScriptContainer.MakeScope.Var('nfp20_problem_state').GetState.IsValid), 'NFP40_STATE_LINK', 'NFP40_REGION_FALLBACK')]. Пару месяцев подряд оттуда приходят нерадужные новости — инфраструктура перегружена. Первую такую весть ещё можно было встретить надеждой на следующую сводку. Следующая пришла. Надежда осталась, проблема — тоже."
 NFP55_INF_INTRO:0 "Для процветания хозяйству нужно немало. Меньше налогов, больше доступных товаров, и чтобы всё необходимое оказывалось в нужном месте в нужное время. Правда, последнее требует свободной инфраструктуры. А она, в отличие от желаний, имеет вполне определённый предел. И в одной из наших областей потребности оказались выше него."
 NFP55_INF_TITLE:0 "В тесноте, да в обиде — кризис инфраструктуры бьёт по хозяйству"
 NFP56_ACC_END:0 "Что хочется сказать в конце? Из столицы страна хорошо видна на карте. Из области её, пожалуй, лучше видно по тому, что удаётся купить и продать. Между этими двумя видами сейчас есть неприятная разница.\n\nБудем следить, удастся ли её сократить. Хотелось бы, чтобы до общего рынка было ближе, чем до очередного объяснения, почему до него далеко."
 NFP56_ACC_FACT:0 "Речь об области [SelectLocalization(And(ScriptContainer.MakeScope.Var('nfp20_problem_state').IsSet, ScriptContainer.MakeScope.Var('nfp20_problem_state').GetState.IsValid), 'NFP40_STATE_LINK', 'NFP40_REGION_FALLBACK')]. Уже две месячные сводки подряд показывают перебои с доступом к национальному рынку. На карте область остаётся частью страны. А вот пользоваться общим хозяйством в полной мере не выходит. От слова «национальный», конечно, приятно на душе. Только в корзину его не положишь."
 NFP56_ACC_FREE:0 "Любопытно, что инфраструктура области пока справляется с нагрузкой. Значит, привычное «давайте что-нибудь достроим» само по себе ещё не ответ. Свободные возможности есть, а полноценной связи с рынком нет. Тут надо понять, где застряло дело, и уже потом отправлять туда деньги и рабочих."
 NFP56_ACC_INTRO:0 "Хорошо, когда нужный товар можно просто купить. Не думать о расстояниях, не изучать обходные пути, а прийти и купить. Впрочем, между «в стране есть» и «у нас продаётся» иногда помещается целая история. И в одной из наших областей у этой истории пока не получается счастливого конца."
 NFP56_ACC_OVERLOAD:0 "Возможно, причина банальна — инфраструктура области перегружена. Получается неприятное соседство: и связь с рынком неполная, и собственных возможностей не хватает. Объясняет ли второе всё остальное? Пока вопрос. Но поводов присмотреться к области теперь точно больше одного."
 NFP56_ACC_SEVERE:0 "А здесь уже трудно отделаться словами «небольшие затруднения»: доступ к рынку не достигает и половины полного уровня. Есть ли что-то на прилавках сейчас — неизвестно. Но вопрос, насколько область может рассчитывать на общее хозяйство, звучит всё настойчивее."
 NFP56_ACC_TITLE:0 "Область своя, да нет…"
 NFP57_SUP_BOTH:0 "Товар нужен и армии, и государственным учреждениям. Получается, среди покупателей хватает людей с важными делами и казёнными деньгами. Однако важность дел ещё не гарантирует, что найдётся всё необходимое. Хотелось бы разобраться со снабжением заранее, пока нехватку приходится обсуждать, а не обходить в самый неподходящий момент."
 NFP57_SUP_CHRONIC:0 "Нехватка рискует стать привычной. А это, пожалуй, самая неприятная её сторона: к слову «нет» тоже можно привыкнуть. Правда, однажды говорить его могут начать уже не продавцы покупателям, а люди — государству. И тогда выяснять, где взять нужное, придётся вместе с другим вопросом: куда делось доверие?"
 NFP57_SUP_CRITICAL:0 "На этот раз нехватка в нашей стране уже настолько серьёзна, что отмахнуться от неё как от обычных торговых затруднений не получится. Утешать себя мыслью, что где-нибудь наверняка найдётся ещё немного, конечно, можно. Может, и найдётся. Вопрос в том, хватит ли всем, кому это нужно."
 NFP57_SUP_DETAILS:0 "$NFP46_METRICS$\nПроизводство на рынке — [ScriptContainer.GetVariableValue('nfp50_supply_production')|1], потребление — [ScriptContainer.GetVariableValue('nfp50_supply_consumption')|1]; импорт — [ScriptContainer.GetVariableValue('nfp50_supply_imports')|1], экспорт — [ScriptContainer.GetVariableValue('nfp50_supply_exports')|1]. Ввоз составляет [ScriptContainer.GetVariableValue('nfp50_supply_import_fraction')|1]% суммы производства и ввоза. Это показатель рыночного снабжения, а не доля покупок жителей нашей страны; торговые объёмы сами по себе не устанавливают причину нехватки.\nЦена на дату события — £[ScriptContainer.GetVariableValue('nfp50_supply_price')|1]; отклонение от базовой цены — [ScriptContainer.GetVariableValue('nfp50_supply_premium')|1]% (минус означает дешевле). Цена не измеряет доступность товара каждому покупателю.\nПоследовательных месячных наблюдений с проблемой: [ScriptContainer.GetVariableValue('nfp50_supply_observations')|0]. Прямой признак дефицита на дату события: [ScriptContainer.GetVariableValue('nfp46_native_after')|0]; тяжёлая местная нехватка: [ScriptContainer.GetVariableValue('nfp50_supply_critical')|0]."
 NFP57_SUP_END:0 "Что хочется сказать в конце? У нехватки могут быть разные причины, а вот вопрос у покупателя обычно один: «Получится ли достать нужное?»\n\nМы вернёмся к этой истории, когда появятся перемены. Желательно такие, после которых искать придётся уже не товар, а место для покупки повыгоднее.\n\nВсё-таки спорить о цене приятнее, когда есть что покупать."
 NFP57_SUP_FACT:0 "На этот раз наша тема — [ScriptContainer.MakeScope.Var('nfp46_good').GetGoods.GetNameNoIcon]. На рынке отмечен дефицит, а затруднения со снабжением появляются в месячных сводках уже не впервые. Конечно, это ещё не означает, что товар исчез повсюду. Но желающих купить достаточно, чтобы вопрос «где взять?» заслуживал отдельной газетной полосы. Спрос, как видим, со своей частью работы справился. Теперь хотелось бы дождаться предложения."
 NFP57_SUP_GOVERNMENT:0 "Этот товар нужен и государственным учреждениям. Так что вопрос может оказаться ближе к повседневным делам страны, чем кажется по одной строчке торговой сводки. Государственная важность — вещь внушительная. Жаль только, нужных товаров сама по себе не производит."
 NFP57_SUP_INTRO:0 "Хорошо, когда покупка начинается с выбора. Что получше, что подешевле, что можно позволить себе сегодня, а что пусть пока полежит. Хуже, когда выбирать приходится между «нет» и «поищите в другом месте». Особенно если нужен товар, а не повод прогуляться или поругаться."
 NFP57_SUP_LONG:0 "Сводки приходят месяц за месяцем, а снабжение всё ещё вызывает вопросы. Поначалу хотелось надеяться, что дело быстро поправится. Теперь у этой надежды появился солидный стаж. Было бы приятно, если бы вместе с ним появились и результаты работы правительства. А то пока время идёт, надежда крепнет, а проблема остаётся на своём месте."
 NFP57_SUP_MILITARY:0 "Есть у этого товара и военное применение. Поэтому история касается не только торговли: снабжение армии тоже заслуживает внимания. Особенно заранее, пока вопрос ещё можно обсуждать на газетной полосе, а не решать впопыхах, когда понадобится точить штыки. Очень хотелось бы, чтобы к тому времени всё необходимое уже нашлось."
 NFP57_SUP_NO_IMPORT:0 "Поставок извне на момент сводки не отмечено. Можно ли было бы восполнить нехватку закупками? Мысль напрашивается сама. Правда, между «хорошо бы купить» и «наконец привезли» обычно лежит кое-что посложнее газетного предложения. Но посмотреть, что именно там мешает, было бы любопытно."
 NFP57_SUP_TITLE:0 "Спрос есть. А товар где?"
 NFP57_SUP_TRADE:0 "Поставки извне есть, но от дефицита они пока не избавили. Значит, сказать «будем завозить» проще, чем закрыть вопрос со снабжением. Торговый путь на карте выглядит убедительно. Хотелось бы, чтобы и в конце этого пути было что получить. Насколько помогут дополнительные закупки и откуда их можно взять — вопрос открытый."
 NFP58_GAP_BOTH:0 "Товар используется и армией, и государственными учреждениями. Поэтому за торговым вопросом стоят вполне государственные интересы. Было бы приятно, если бы важность этих интересов помогла вовремя разобраться со снабжением. Сама по себе она, увы, новых товаров не создаёт."
 NFP58_GAP_CHRONIC:0 "История затянулась. Казалось бы, спрос должен быть хорошим приглашением для тех, кто готов производить и продавать. Но приглашение всё ещё лежит на столе, а предложение за ним не поспевает. Что мешает — нехватка возможностей, трудности торговли или что-то ещё? Пока вопрос. Одного желания купить, как выясняется, для хозяйственного чуда маловато."
 NFP58_GAP_CRITICAL:0 "При этом в нашей стране уже отмечена серьёзная местная нехватка. Значит, за общей торговой картиной есть и более острый вопрос: насколько легко получить нужное здесь? Покупателю, которому товар необходим сейчас, рассуждения о возможностях рынка на будущее помогут разве что скоротать ожидание."
 NFP58_GAP_END:0 "Что хочется сказать в конце? Высокий спрос может стать хорошей новостью для хозяйства. Есть ради кого производить, кому продавать и зачем расширять дело. Только возможность ещё предстоит превратить в результат — желательно прежде, чем ожидание станет главной частью покупки.\n\nЖелающие найдутся. Осталось, чтобы нашлось желаемое."
 NFP58_GAP_FACT:0 "На этот раз речь о товаре «[ScriptContainer.MakeScope.Var('nfp46_good').GetGoods.GetNameNoIcon]». Желающих купить заметно больше, чем выставленного на продажу, и затруднения со снабжением встречаются уже не в первой месячной сводке. Объявлять товар исчезнувшим было бы преувеличением. Но между «покупатель найдётся» и «покупателю достанется» появилась неприятная разница."
 NFP58_GAP_GOVERNMENT:0 "Товар используется и государственными учреждениями. Значит, интерес к нему выходит за пределы частной торговли. У казны, конечно, свои возможности. Но государственная печать на бумаге ещё не делает предложение на рынке больше."
 NFP58_GAP_INTRO:0 "Найти покупателя — половина торгового дела. Иногда самая трудная: объяснить, заинтересовать, убедить расстаться с деньгами. Поэтому, когда желающих хватает, хочется поздравить и торговлю, и хозяйство страны. Правда, прежде стоит убедиться, что этим желающим есть что предложить. А вот здесь у нас возникла заминка."
 NFP58_GAP_LONG:0 "Поначалу можно было надеяться, что торговля быстро подхватит спрос. Всё-таки готовность покупать обычно встречают с большим пониманием, чем просьбу подождать с оплатой. Однако месяцы идут, а вопрос остаётся. Возможно, желающие заработать уже нашлись. Хотелось бы дождаться и товара."
 NFP58_GAP_MILITARY:0 "У товара есть и военное применение. Поэтому спрос здесь заслуживает внимания ещё до того, как разговор зайдёт о срочных нуждах армии. Хотелось бы, чтобы к такому разговору страна подошла с запасом возможностей, а не только с запасом объяснений."
 NFP58_GAP_NO_IMPORT:0 "Поставок извне пока не отмечено. Отсюда вполне понятный вопрос: если своего предложения мало, нельзя ли поискать товар за границей? Конечно, сам по себе этот вопрос ничего не привезёт. Но покупателю было бы интересно узнать, что мешает ответить на него делом."
 NFP58_GAP_TITLE:0 "Покупатель есть — дело за товаром"
 NFP58_GAP_TRADE:0 "Поставки извне есть, но разрыв между спросом и предложением сохраняется. Хорошо, что товар уже поступает. Осталось понять, можно ли получать больше и что для этого потребуется. Торговля ведь особенно радует тогда, когда её результаты можно не только отметить на карте, но и купить."
 NFP59_REC_BOTH:0 "Товар нужен и армии, и государственным учреждениям. Поэтому хорошую новость здесь могут оценить с разных сторон. Правда, одна благоприятная сводка ещё не снабжает всю страну необходимым. Но спокойнее смотреть на рынок теперь есть основания."
 NFP59_REC_BUY:0 "Правда, желающих купить тоже стало меньше. Поэтому записывать всё улучшение исключительно в успехи снабжения было бы слишком удобно. Иногда очередь становится короче потому, что торговля работает лучше. Иногда — потому, что из очереди уходят. По одной этой перемене мы ещё не узнаем, почему."
 NFP59_REC_DETAILS:0 "$NFP57_SUP_DETAILS$\nПоследовательных месячных наблюдений без прежнего сигнала: [ScriptContainer.GetVariableValue('nfp50_supply_good_observations')|0]. Прежний вид предупреждения: [ScriptContainer.GetVariableValue('nfp46_mode')|0] (1 — прямой дефицит, 2 — разрыв спроса и предложения). Сравнение заявок относится к началу серии наблюдений и дате события."
 NFP59_REC_END:0 "Что хочется сказать в конце? О неприятностях газета пишет громко. Было бы странно, если бы улучшение мы встретили молчанием. Повод порадоваться появился, и мы рады это отметить.\n\nБудем следить, чтобы история снова не пошла по знакомому кругу. Всё-таки хорошую новость приятнее продолжать, чем опровергать."
 NFP59_REC_GAP:0 "Возвращаемся к товару «[ScriptContainer.MakeScope.Var('nfp46_good').GetGoods.GetNameNoIcon]». Раньше желающих купить было заметно больше, чем выставленного на продажу. Теперь две месячные сводки подряд показывают более спокойную картину. Спрос и предложение ещё не обязательно сошлись рукопожатием, но хотя бы перестали стоять так далеко друг от друга."
 NFP59_REC_GOVERNMENT:0 "Товар используется и государственными учреждениями. Так что улучшение касается вопроса, за которым казне тоже есть смысл следить. Было бы приятно, если бы вслед за хорошей сводкой проще стало и с повседневными делами."
 NFP59_REC_INTRO:0 "Хорошие новости иногда выглядят довольно скромно. Никто не перерезает ленточку, не произносит торжественную речь и не требует запомнить этот день. Просто в истории, которая раньше заставляла хмуриться, наконец появляется повод для другого выражения лица. Наша прежняя торговая тревога как раз получила такое продолжение."
 NFP59_REC_MILITARY:0 "Этот товар нужен и армии. Поэтому более спокойная картина снабжения радует ещё и с этой стороны. Конечно, объявлять все военные нужды закрытыми мы не станем. Но хотя бы одной торговой тревогой стало меньше — уже неплохое начало."
 NFP59_REC_NATIVE:0 "Возвращаемся к товару «[ScriptContainer.MakeScope.Var('nfp46_good').GetGoods.GetNameNoIcon]». После нашего предупреждения две месячные сводки подряд уже не дают прежнего повода для тревоги. Прямой дефицит на рынке больше не отмечен, а предложение заметно ближе к спросу. Это ещё не обещание, что нужное найдётся у каждого покупателя. Но вместо очередного «всё ещё не хватает» у нас наконец появилась другая новость."
 NFP59_REC_NO_IMPORT:0 "При этом поставок извне на момент сводки не отмечено. Значит, нынешнее улучшение нельзя просто объяснить прибывшим товаром из-за границы. Что изменилось внутри рынка — вопрос отдельный. Хорошая новость от этого хуже не становится, а вот рассмотреть её поближе всё-таки интересно."
 NFP59_REC_SELL:0 "Есть и приятная подробность: на продажу предлагают больше, чем в начале этой истории. Значит, дело не ограничилось надеждой на то, что покупатели как-нибудь передумают. Товара в торговле прибавилось. Кто и за счёт чего обеспечил эту перемену — ещё вопрос, но саму перемену отметить приятно."
 NFP59_REC_TITLE:0 "Есть повод выдохнуть"
 NFP59_REC_TRADE:0 "Поставки извне продолжаются. Приятно видеть их рядом с хорошей новостью о снабжении. Объявлять всю заслугу за торговлей пока рано, но и проходить мимо неё с видом, будто всё получилось само собой, не хочется."
 NFP59_REC_ZERO_END:0 "Почему перестали покупать, ещё предстоит выяснить. Записывать такую перемену в хозяйственные победы мы бы не торопились.\n\nПустая очередь — приятное зрелище. Если знаешь, куда делись покупатели."
 NFP59_REC_ZERO_FACT:0 "По товару «[ScriptContainer.MakeScope.Var('nfp46_good').GetGoods.GetNameNoIcon]» прежний сигнал проблемы больше не появляется, но на момент последней сводки не отмечен и спрос. Получается тишина. А вот стало ли за ней лучше со снабжением — пока неизвестно."
 NFP59_REC_ZERO_INTRO:0 "Есть простой способ перестать замечать нехватку: перестать искать нужное. Правда, для покупателя это сомнительное утешение. Поэтому к следующей новости мы предлагаем отнестись без торжественной музыки."
 NFP59_REC_ZERO_TITLE:0 "Нет спроса — нет проблемы?"
 NFP60_CONS_DOWN:0 "Потребление на рынке снизилось. Почему — это уже отдельный вопрос. "
 NFP60_CONS_UP:0 "Потребление на рынке увеличилось. "
 NFP60_EXP_DOWN:0 "На вывоз уходит меньше товара. "
 NFP60_EXP_UP:0 "На вывоз уходит больше товара. "
 NFP60_IMP_DOWN:0 "Поставки извне на рынок сократились. "
 NFP60_IMP_UP:0 "Извне на рынок поступает больше товара. "
 NFP60_PARTIAL_SUP:0 "Подробное наблюдение за производством и торговлей мы начали уже по ходу этой истории. Здесь видны только перемены с того момента. "
 NFP60_PROD_DOWN:0 "Выпуск товара на рынке сократился. "
 NFP60_PROD_UP:0 "Выпуск товара на рынке вырос. "
 NFP60_STATE_DETAILS:0 "[Localize(ScriptContainer.MakeScope.Var('nfp60_previous_metrics').GetFlagName)]\nНаблюдение причин с месячного индекса [ScriptContainer.GetVariableValue('nfp60_st_start')|0]; неполная история: [ScriptContainer.GetVariableValue('nfp60_st_partial')|0].\nИнфраструктура: [ScriptContainer.GetVariableValue('nfp60_st_cap_before')|2] → [ScriptContainer.GetVariableValue('nfp60_st_cap_after')|2]\nНагрузка: [ScriptContainer.GetVariableValue('nfp60_st_usage_before')|2] → [ScriptContainer.GetVariableValue('nfp60_st_usage_after')|2]\nДоступ к рынку: [Multiply_CFixedPoint(ScriptContainer.GetVariableValue('nfp60_st_access_before'), '(CFixedPoint)100')|1]% → [Multiply_CFixedPoint(ScriptContainer.GetVariableValue('nfp60_st_access_after'), '(CFixedPoint)100')|1]%\nУровни железной дороги: [ScriptContainer.GetVariableValue('nfp60_st_rail_before')|0] → [ScriptContainer.GetVariableValue('nfp60_st_rail_after')|0]\nУровни порта: [ScriptContainer.GetVariableValue('nfp60_st_port_before')|0] → [ScriptContainer.GetVariableValue('nfp60_st_port_after')|0]\nУровни городского центра: [ScriptContainer.GetVariableValue('nfp60_st_urban_before')|0] → [ScriptContainer.GetVariableValue('nfp60_st_urban_after')|0]\nСобытия (счётчики ограничены99): rail_built=[ScriptContainer.GetVariableValue('nfp60_st_rail_built')|0]; rail_expanded=[ScriptContainer.GetVariableValue('nfp60_st_rail_expanded')|0]; rail_pm=[ScriptContainer.GetVariableValue('nfp60_st_rail_pm')|0]; port_built=[ScriptContainer.GetVariableValue('nfp60_st_port_built')|0]; port_expanded=[ScriptContainer.GetVariableValue('nfp60_st_port_expanded')|0]; port_pm=[ScriptContainer.GetVariableValue('nfp60_st_port_pm')|0]; urban_built=[ScriptContainer.GetVariableValue('nfp60_st_urban_built')|0]; urban_expanded=[ScriptContainer.GetVariableValue('nfp60_st_urban_expanded')|0]; urban_pm=[ScriptContainer.GetVariableValue('nfp60_st_urban_pm')|0].\nИндексы первого/последнего события: [ScriptContainer.GetVariableValue('nfp60_st_event_first')|0] / [ScriptContainer.GetVariableValue('nfp60_st_event_last')|0]. Улучшение заполнения рабочих мест фиксируется при переходе наблюдаемого здания от менее80% до не менее80%; точный вклад в инфраструктуру не вычислялся."
 NFP60_SUP_CAUSES:0 "[SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp60_supply_known'), '(CFixedPoint)1'), 'NFP60_SUP_COMPONENTS', 'NFP60_SUP_UNKNOWN')][SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp60_s_partial'), '(CFixedPoint)1'), 'NFP60_PARTIAL_SUP', 'NFP50_EMPTY')]"
 NFP60_SUP_COMPONENTS:0 "[SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp60_prod_dir'), '(CFixedPoint)1'), 'NFP60_PROD_UP', SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp60_prod_dir'), '(CFixedPoint)-1'), 'NFP60_PROD_DOWN', 'NFP50_EMPTY'))][SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp60_imp_dir'), '(CFixedPoint)1'), 'NFP60_IMP_UP', SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp60_imp_dir'), '(CFixedPoint)-1'), 'NFP60_IMP_DOWN', 'NFP50_EMPTY'))][SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp60_exp_dir'), '(CFixedPoint)1'), 'NFP60_EXP_UP', SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp60_exp_dir'), '(CFixedPoint)-1'), 'NFP60_EXP_DOWN', 'NFP50_EMPTY'))][SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp60_cons_dir'), '(CFixedPoint)1'), 'NFP60_CONS_UP', SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp60_cons_dir'), '(CFixedPoint)-1'), 'NFP60_CONS_DOWN', 'NFP50_EMPTY'))]Это перемены за тот же срок, что и наша история снабжения. Выделить среди них единственного спасителя рынка было бы слишком смело. "
 NFP60_SUP_DETAILS:0 "[Localize(ScriptContainer.MakeScope.Var('nfp60_previous_metrics').GetFlagName)]\nПодробная история торговли с месячного индекса [ScriptContainer.GetVariableValue('nfp60_s_start')|0]; неполная история: [ScriptContainer.GetVariableValue('nfp60_s_partial')|0].\nВыпуск на рынке: [ScriptContainer.GetVariableValue('nfp60_s_prod_before')|2] → [ScriptContainer.GetVariableValue('nfp60_s_prod_after')|2]\nПотребление на рынке: [ScriptContainer.GetVariableValue('nfp60_s_cons_before')|2] → [ScriptContainer.GetVariableValue('nfp60_s_cons_after')|2]\nВвоз на рынок: [ScriptContainer.GetVariableValue('nfp60_s_imp_before')|2] → [ScriptContainer.GetVariableValue('nfp60_s_imp_after')|2]\nВывоз с рынка: [ScriptContainer.GetVariableValue('nfp60_s_exp_before')|2] → [ScriptContainer.GetVariableValue('nfp60_s_exp_after')|2]\nЦена: [ScriptContainer.GetVariableValue('nfp60_s_price_before')|2] → [ScriptContainer.GetVariableValue('nfp60_s_price_after')|2]. Это объёмы всего рынка, не обязательно внутреннее производство страны читателя."
 NFP60_SUP_UNKNOWN:0 "Прежняя тревога ушла, но подробные сведения о производстве и торговле пока не объясняют, за счёт чего это произошло. "
 NFP61_CAP_DOWN:0 "Любопытно, что сама сеть за это время вместительнее не стала. Напротив, её возможности сократились. Значит, искать объяснение перемене только в расширении инфраструктуры не приходится. "
 NFP61_CAP_UP:0 "За время наблюдения сама сеть стала вместительнее. Хозяйству прибавили места — теперь важно, чтобы оно не заняло его быстрее, чем мы успеем порадоваться. "
 NFP61_CAUSES:0 "[SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp60_components_known'), '(CFixedPoint)1'), 'NFP61_COMPONENTS', 'NFP61_UNKNOWN')][SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp60_st_partial'), '(CFixedPoint)1'), 'NFP61_PARTIAL', 'NFP50_EMPTY')]"
 NFP61_COMPONENTS:0 "[SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp60_cap_dir'), '(CFixedPoint)1'), 'NFP61_CAP_UP', SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp60_cap_dir'), '(CFixedPoint)-1'), 'NFP61_CAP_DOWN', 'NFP50_EMPTY'))][SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp60_usage_dir'), '(CFixedPoint)1'), 'NFP61_LOAD_UP', SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp60_usage_dir'), '(CFixedPoint)-1'), 'NFP61_LOAD_DOWN', 'NFP50_EMPTY'))]"
 NFP61_END:0 "Что хочется сказать в конце? Из области пришла хорошая новость, и искать в ней подвох только ради привычного недовольства мы не собираемся. Хозяйству стало легче — этому можно порадоваться.\n\nДальше посмотрим, надолго ли хватит перемены. Хотелось бы возвращаться к этой области за новостями о том, что она производит, а не о том, чего опять не выдержала.\n\nВ тесноте, говорят, не в обиде. Но когда посвободнее, то всё-таки приятнее."
 NFP61_EVENTS:0 "[SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp60_rail_work'), '(CFixedPoint)1'), 'NFP61_RAIL_WORK', 'NFP50_EMPTY')][SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp60_port_work'), '(CFixedPoint)1'), 'NFP61_PORT_WORK', 'NFP50_EMPTY')][SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp60_urban_work'), '(CFixedPoint)1'), 'NFP61_URBAN_WORK', 'NFP50_EMPTY')][SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp60_rail_pm_seen'), '(CFixedPoint)1'), 'NFP61_RAIL_PM', 'NFP50_EMPTY')][SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp60_port_pm_seen'), '(CFixedPoint)1'), 'NFP61_PORT_PM', 'NFP50_EMPTY')][SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp60_urban_pm_seen'), '(CFixedPoint)1'), 'NFP61_URBAN_PM', 'NFP50_EMPTY')]$NFP61_PM_END_SELECT$[SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp60_st_rail_staffup'), '(CFixedPoint)1'), 'NFP61_RAIL_STAFF', 'NFP50_EMPTY')][SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp60_st_port_staffup'), '(CFixedPoint)1'), 'NFP61_PORT_STAFF', 'NFP50_EMPTY')]$NFP61_STAFF_END_SELECT$Перемены, как видим, были. Приписывать одной из них весь успех пока не станем: совпасть по времени и решить проблему — всё-таки не одно и то же."
 NFP61_FACT:0 "Речь об области [SelectLocalization(And(ScriptContainer.MakeScope.Var('nfp20_problem_state').IsSet, ScriptContainer.MakeScope.Var('nfp20_problem_state').GetState.IsValid), 'NFP40_STATE_LINK', 'NFP40_REGION_FALLBACK')]. Раньше мы писали, что её инфраструктуре приходится нести больше, чем она может выдержать. Теперь сводки показывают: имеющихся возможностей хватает. Проблема, которой уже успело найтись место в газете, наконец уступила его хорошей новости!"
 NFP61_INTRO:0 "К хорошему быстро привыкают. Например, к тому, что хозяйство работает, а вопрос «выдержит ли всё это наша инфраструктура?» не приходится задавать после строительства нового предприятия. О плохом, впрочем, тоже можно перестать задумываться. Перегрузка есть, дела идут как идут, следующая сводка мало отличается от предыдущей… Но на этот раз отличается. И в приятную сторону."
 NFP61_LOAD_DOWN:0 "При этом нагрузка на сеть уменьшилась. От тесноты ведь можно избавиться двумя способами: добавить места или перестать втискивать в него прежнее количество дел. Второе тоже помогает. Правда, само по себе ещё не объясняет, почему этих дел стало меньше. "
 NFP61_LOAD_UP:0 "При этом нагрузка тоже выросла. То есть хозяйство не просто перестало тесниться за счёт уменьшения собственных потребностей. Работы у сети прибавилось, а прежнего перегруза теперь нет. "
 NFP61_PARTIAL:0 "Правда, подробные сведения у нас есть лишь о части этой истории. Её начало осталось за пределами наблюдения, поэтому и с окончательными объяснениями спешить не будем. "
 NFP61_PM_END:0 "Новых сооружений для перемен требуется не всегда. Иногда стоит присмотреться к тому, как используют уже имеющиеся. "
 NFP61_PM_END_SELECT:0 "[SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp60_rail_pm_seen'), '(CFixedPoint)1'), 'NFP61_PM_END', 'NFP61_PORT_PM_END_SELECT')]"
 NFP61_PORT_PM:0 "В порту меняли способы работы. "
 NFP61_PORT_PM_END_SELECT:0 "[SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp60_port_pm_seen'), '(CFixedPoint)1'), 'NFP61_PM_END', 'NFP61_URBAN_PM_END_SELECT')]"
 NFP61_PORT_STAFF:0 "У наблюдаемого порта теперь лучше заполнены рабочие места. "
 NFP61_PORT_STAFF_END_SELECT:0 "[SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp60_st_port_staffup'), '(CFixedPoint)1'), 'NFP61_STAFF_END', 'NFP50_EMPTY')]"
 NFP61_PORT_WORK:0 "В порту завершались строительные работы. Для области, которой было тесно в собственных возможностях, перемена заслуживает внимания. "
 NFP61_RAIL_PM:0 "На железной дороге меняли способы работы. "
 NFP61_RAIL_STAFF:0 "У наблюдаемой железной дороги теперь лучше заполнены рабочие места. "
 NFP61_RAIL_WORK:0 "За это время в области завершали строительство или расширение железной дороги. Так что разговоры о рельсах здесь хотя бы сопровождались самими рельсами. "
 NFP61_REMAINING:0 "Есть, впрочем, отдельная неприятность: связь области с общим рынком пока остаётся неполной. Инфраструктура справляется с нынешней нагрузкой, но это ещё не значит, что все пути для торговли открыты. Одну проблему удалось оставить позади. Вторую не хотелось бы потерять за поздравлениями."
 NFP61_STAFF_END:0 "Построить — полдела. Было бы кому работать. "
 NFP61_STAFF_END_SELECT:0 "[SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp60_st_rail_staffup'), '(CFixedPoint)1'), 'NFP61_STAFF_END', 'NFP61_PORT_STAFF_END_SELECT')]"
 NFP61_TITLE:0 "Было тесно — стало легче"
 NFP61_UNKNOWN:0 "Хорошую перемену мы видим, а вот объяснить её по имеющимся сведениям пока не получается. Было бы удобно сразу найти виновника прежних неприятностей и автора нынешнего успеха. Но удобство — ещё не доказательство. "
 NFP61_URBAN_PM:0 "В городском хозяйстве меняли способы работы. "
 NFP61_URBAN_PM_END_SELECT:0 "[SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp60_urban_pm_seen'), '(CFixedPoint)1'), 'NFP61_PM_END', 'NFP50_EMPTY')]"
 NFP61_URBAN_WORK:0 "Расширялось и городское хозяйство. Большие перевозки хорошо видны на карте, но повседневная работа области ими не исчерпывается. "
 NFP62_CAP_DOWN:0 "При этом возможности самой инфраструктуры сократились. Значит, объяснение «просто стало больше места» здесь не подходит. Связь с рынком улучшилась, но история явно сложнее одной удачной стройки. "
 NFP62_CAP_UP:0 "За это время инфраструктура области стала вместительнее. Хорошее соседство: и возможностей прибавилось, и связь с рынком улучшилась. Записать весь успех исключительно на этот счёт было бы поспешно, но пройти мимо такой перемены тоже трудно. "
 NFP62_CAUSES:0 "[SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp60_components_known'), '(CFixedPoint)1'), 'NFP62_COMPONENTS', 'NFP62_UNKNOWN')][SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp60_st_partial'), '(CFixedPoint)1'), 'NFP62_PARTIAL', 'NFP50_EMPTY')]"
 NFP62_COMPONENTS:0 "[SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp60_cap_dir'), '(CFixedPoint)1'), 'NFP62_CAP_UP', SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp60_cap_dir'), '(CFixedPoint)-1'), 'NFP62_CAP_DOWN', 'NFP50_EMPTY'))][SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp60_usage_dir'), '(CFixedPoint)1'), 'NFP62_LOAD_UP', SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp60_usage_dir'), '(CFixedPoint)-1'), 'NFP62_LOAD_DOWN', 'NFP50_EMPTY'))]"
 NFP62_END:0 "Что хочется сказать в конце? Раньше область была своей на карте, а общий рынок порой казался чем-то далёким. Теперь между ними стало меньше препятствий. Для хозяйства страны это хорошая перемена. Хотелось бы, чтобы её почувствовали и те, кто просто приходит за покупками.\n\nБудем следить за продолжением. Всё-таки общий рынок приятнее обсуждать за покупками, чем за объяснениями, почему до него опять не добраться."
 NFP62_EVENTS:0 "[SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp60_rail_work'), '(CFixedPoint)1'), 'NFP62_RAIL_WORK', 'NFP50_EMPTY')][SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp60_port_work'), '(CFixedPoint)1'), 'NFP62_PORT_WORK', 'NFP50_EMPTY')][SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp60_urban_work'), '(CFixedPoint)1'), 'NFP62_URBAN_WORK', 'NFP50_EMPTY')][SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp60_rail_pm_seen'), '(CFixedPoint)1'), 'NFP62_RAIL_PM', 'NFP50_EMPTY')][SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp60_port_pm_seen'), '(CFixedPoint)1'), 'NFP62_PORT_PM', 'NFP50_EMPTY')][SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp60_urban_pm_seen'), '(CFixedPoint)1'), 'NFP62_URBAN_PM', 'NFP50_EMPTY')]$NFP62_PM_END_SELECT$[SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp60_st_rail_staffup'), '(CFixedPoint)1'), 'NFP62_RAIL_STAFF', 'NFP50_EMPTY')][SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp60_st_port_staffup'), '(CFixedPoint)1'), 'NFP62_PORT_STAFF', 'NFP50_EMPTY')]$NFP62_STAFF_END_SELECT$Всё это происходило за время, пока мы следили за областью. Какие перемены помогли больше, пока не установлено. Совпадение по времени — повод присмотреться, а не готовая наградная ведомость."
 NFP62_FACT:0 "Речь об области [SelectLocalization(And(ScriptContainer.MakeScope.Var('nfp20_problem_state').IsSet, ScriptContainer.MakeScope.Var('nfp20_problem_state').GetState.IsValid), 'NFP40_STATE_LINK', 'NFP40_REGION_FALLBACK')]. Последние сводки показывают: прежние перебои с доступом к общему рынку отступили. Это ещё не обещание низких цен и богатого выбора в каждой лавке. Но область теперь может гораздо полнее пользоваться хозяйством страны. Слово «общий» снова стало немного ближе к своему значению."
 NFP62_INTRO:0 "Между «в стране есть» и «у нас продаётся» иногда оказывается слишком большое расстояние. Причём измерить его вёрстами получается не всегда. На карте всё рядом, границы свои, хозяйство общее — а пользоваться им в полной мере не выходит. Об этой неприятности мы уже писали. Теперь есть повод вернуться к ней с другим настроением."
 NFP62_LOAD_DOWN:0 "Нагрузка на сеть стала меньше. Возможно, области теперь проще справляться с перевозками и прочими нуждами хозяйства. Правда, почему нагрузка уменьшилась — отдельный вопрос. Объявлять её снижение безусловной победой мы бы не торопились. "
 NFP62_LOAD_UP:0 "Нагрузка на сеть, напротив, выросла. Получается, доступ к рынку улучшился не на фоне уменьшения хозяйственных потребностей. Дел прибавилось, а прежняя проблема отступила. Тем интереснее разобраться, что позволило с ней справиться. "
 NFP62_PARTIAL:0 "Правда, подробно следить за переменами мы начали уже по ходу этой истории. Часть пути область прошла без наших записей. Поэтому объяснять весь результат только тем, что удалось увидеть позднее, было бы слишком удобно. "
 NFP62_PM_END:0 "Перемены бывают и без новой стройки: важно ведь не только то, что построено, но и как этим пользуются. "
 NFP62_PM_END_SELECT:0 "[SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp60_rail_pm_seen'), '(CFixedPoint)1'), 'NFP62_PM_END', 'NFP62_PORT_PM_END_SELECT')]"
 NFP62_PORT_PM:0 "В порту меняли способы работы. "
 NFP62_PORT_PM_END_SELECT:0 "[SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp60_port_pm_seen'), '(CFixedPoint)1'), 'NFP62_PM_END', 'NFP62_URBAN_PM_END_SELECT')]"
 NFP62_PORT_STAFF:0 "У наблюдаемого порта теперь лучше заполнены рабочие места. "
 NFP62_PORT_STAFF_END_SELECT:0 "[SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp60_st_port_staffup'), '(CFixedPoint)1'), 'NFP62_STAFF_END', 'NFP50_EMPTY')]"
 NFP62_PORT_WORK:0 "В порту завершались строительные работы. Для связи области с остальной страной это заслуживает внимания. Хотя сам по себе достроенный порт ещё не рассказывает всей истории перевозок. "
 NFP62_RAIL_PM:0 "На железной дороге меняли способы работы. "
 NFP62_RAIL_STAFF:0 "У наблюдаемой железной дороги теперь лучше заполнены рабочие места. "
 NFP62_RAIL_WORK:0 "За время наблюдения в области завершали строительство или расширение железной дороги. У прежнего вопроса о связи с общим хозяйством появился вполне осязаемый сосед — новые железнодорожные возможности. "
 NFP62_REMAINING:0 "Одна неприятность, впрочем, остаётся: инфраструктура области по-прежнему перегружена. Доступ к рынку улучшился, но свободнее внутри самой сети пока не стало. Хорошую новость это не отменяет. Просто соседнюю проблему вместе с ней закрывать рано."
 NFP62_STAFF_END:0 "Сооружения сами себя обслуживать пока не научились. Так что люди в этой истории — подробность существенная. "
 NFP62_STAFF_END_SELECT:0 "[SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp60_st_rail_staffup'), '(CFixedPoint)1'), 'NFP62_STAFF_END', 'NFP62_PORT_STAFF_END_SELECT')]"
 NFP62_TITLE:0 "Область своя. И рынок тоже"
 NFP62_UNKNOWN:0 "А вот сохранённые сведения об инфраструктуре и нагрузке пока не дают ясного объяснения. Хорошая перемена есть. Готового ответа, кому за неё сказать спасибо, — ещё нет. Не будем назначать победителя раньше, чем разберёмся в соревновании. "
 NFP62_URBAN_PM:0 "В городском хозяйстве меняли способы работы. "
 NFP62_URBAN_PM_END_SELECT:0 "[SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp60_urban_pm_seen'), '(CFixedPoint)1'), 'NFP62_PM_END', 'NFP50_EMPTY')]"
 NFP62_URBAN_WORK:0 "Расширялось и городское хозяйство. Оно редко выглядит столь же внушительно, как паровоз или большой корабль, но область живёт не одними дальними перевозками. "
 NFP63_ALLY:0 "Речь о нашем союзнике. Его возможности заслуживают внимания: общие договорённости приятнее подкреплять пониманием того, что происходит у партнёра."
 NFP63_ATT_1:0 " Правительство этой страны настроено к нам недоброжелательно. Поэтому за происходящим следим без иллюзий: любезное объяснение нам могут и не приготовить."
 NFP63_ATT_10:0 " Эта зависимая страна настроена к нам лояльно. Тем меньше оснований считать её собственные заботы несущественными."
 NFP63_ATT_11:0 " В зависимой стране есть стремление выйти из подчинения. Поэтому её новости стоит читать внимательнее: привычное спокойствие здесь уже не лучший советчик."
 NFP63_ATT_2:0 " В её отношении к нам есть воинственный настрой. Шутить над чужими делами легче, чем потом разбираться с их последствиями у своей границы."
 NFP63_ATT_3:0 " Там стремятся поставить нашу страну в подчинённое положение. Соседская забота бывает разной; эту лучше читать вместе с мелким шрифтом."
 NFP63_ATT_4:0 " К нам относятся настороженно. Взаимные догадки полезнее проверять по событиям, чем выдавать за уже известные планы."
 NFP63_ATT_5:0 " Особого интереса к нашей стране там пока не проявляют. Это не делает их новости бессмысленными, но и скрытое послание нам искать в каждой строке незачем."
 NFP63_ATT_6:0 " Там расположены к примирению с нами. Хорошая возможность следить за переменами без необходимости всякий раз доставать дипломатические колкости."
 NFP63_ATT_7:0 " Правительство этой страны настроено на сотрудничество с нами. Было бы приятно, чтобы за добрым расположением находились и общие дела."
 NFP63_ATT_8:0 " К нам относятся доброжелательно. Можно обойтись без дежурной шпильки — факты от этого своей остроты не потеряют."
 NFP63_ATT_9:0 " Там готовы выступать нашим покровителем. Приятное расположение, хотя меру заботы и самостоятельности лучше всё-таки различать."
 NFP63_BAND_NEG1:0 "Отношения оставляют желать лучшего. Насмешка могла бы скрасить чтение, но заменить объяснение происходящего ей всё-таки не удастся."
 NFP63_BAND_NEG2:0 "Отношения холодные. Тёплых слов для этого известия немного, зато повод внимательно его разобрать есть."
 NFP63_BAND_NEG3:0 "Отношения между странами откровенно враждебные. Комплиментов от нашей редакции здесь вряд ли ждут. Но факты от отсутствия симпатии другими не становятся."
 NFP63_BAND_POS1:0 "Отношения располагают к спокойному разговору. Чужую перемену можно рассмотреть без привычки заранее искать подвох."
 NFP63_BAND_POS2:0 "Отношения между странами хорошие. Приятно читать вести оттуда с доброжелательным интересом — хотя дружба, конечно, не заменяет разбор событий."
 NFP63_BAND_POS3:0 "Отношения между странами особенно тёплые. Хотелось бы, чтобы поводов для доброго слова становилось больше. А если новость неприятная, тем внимательнее стоит в ней разобраться."
 NFP63_BAND_ZERO:0 "Отношения между странами держатся без особого тепла и без открытой вражды. Есть возможность присмотреться к самой новости, не начиная с дипломатической ссоры."
 NFP63_BLOC:0 "Страна входит в один блок с нами. Такие перемены касаются нашего общего окружения, даже если до места событий далеко."
 NFP63_CLOSING:0 "$NFP63_EDITORIAL$\n\n[Localize(ScriptContainer.MakeScope.Var('nfp63_closing').GetFlagName)]"
 NFP63_DETAILS:0 "Редакционный отбор: [SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp63_reason'), '(CFixedPoint)0'), 'NFP63_REASON_0', 'NFP50_EMPTY')][SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp63_reason'), '(CFixedPoint)1'), 'NFP63_REASON_1', 'NFP50_EMPTY')][SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp63_reason'), '(CFixedPoint)2'), 'NFP63_REASON_2', 'NFP50_EMPTY')][SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp63_reason'), '(CFixedPoint)3'), 'NFP63_REASON_3', 'NFP50_EMPTY')][SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp63_reason'), '(CFixedPoint)4'), 'NFP63_REASON_4', 'NFP50_EMPTY')][SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp63_reason'), '(CFixedPoint)5'), 'NFP63_REASON_5', 'NFP50_EMPTY')][SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp63_reason'), '(CFixedPoint)6'), 'NFP63_REASON_6', 'NFP50_EMPTY')][SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp63_reason'), '(CFixedPoint)7'), 'NFP63_REASON_7', 'NFP50_EMPTY')].\nРанги редакции: читатель [ScriptContainer.GetVariableValue('nfp63_reader_tier')|0], источник [ScriptContainer.GetVariableValue('nfp63_source_tier')|0], вторая сторона [ScriptContainer.GetVariableValue('nfp63_second_tier')|0]. Добавка приоритета [ScriptContainer.GetVariableValue('nfp63_bonus')|0]; новизна технологии [ScriptContainer.GetVariableValue('nfp63_novel')|0]; отличие закона [ScriptContainer.GetVariableValue('nfp63_different_law')|0].\nСвязь с источником [ScriptContainer.GetVariableValue('nfp63_relation')|0], со второй стороной [ScriptContainer.GetVariableValue('nfp63_second_relation')|0]; отношения [ScriptContainer.GetVariableValue('nfp63_friend')|0]. Основания и тон сохранены при получении, архив не перечитывает дипломатию.\nЧисленные отношения источника к читателю: [ScriptContainer.GetVariableValue('nfp63_relation_value')|0], ступень [ScriptContainer.GetVariableValue('nfp63_relation_band')|0]; намерение ИИ [ScriptContainer.GetVariableValue('nfp63_attitude')|0]. Вторая сторона: отношения [ScriptContainer.GetVariableValue('nfp63_secondary_relation_value')|0], ступень [ScriptContainer.GetVariableValue('nfp63_secondary_relation_band')|0], намерение ИИ [ScriptContainer.GetVariableValue('nfp63_secondary_attitude')|0]. Ноль намерения означает отсутствие подтверждённого снимка, а не нейтральный замысел игрока."
 NFP63_DOMESTIC_REASON:0 "защищённое место для внутренней новости"
 NFP63_EDITORIAL:0 "[SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp63_relation'), '(CFixedPoint)1'), 'NFP63_SECOND_TONE', 'NFP63_TONE')]"
 NFP63_NEIGHBOR:0 "События происходят у нашего соседа. На карте границу провести нетрудно; последствия чужих перемен соблюдать её обязаны не всегда."
 NFP63_NEUTRAL:0 "За этой страной стоит следить без поспешных восторгов и столь же поспешных насмешек. Чужая перемена интересна прежде всего тем, что она меняет."
 NFP63_OVERLORD:0 "Это известие из страны, от которой зависит наша собственная. Поэтому читать его только как зарубежную диковинку было бы слишком беспечно."
 NFP63_REASON_0:0 "старый или специальный путь доставки"
 NFP63_REASON_1:0 "наша страна или непосредственное участие"
 NFP63_REASON_2:0 "событие мирового масштаба"
 NFP63_REASON_3:0 "стратегическая перемена великой державы"
 NFP63_REASON_4:0 "стратегическая перемена союзника, участника блока, подданного или сюзерена"
 NFP63_REASON_5:0 "стратегическая перемена соперника"
 NFP63_REASON_6:0 "конфликт у непосредственного соседа"
 NFP63_REASON_7:0 "региональный интерес и редакционный ранг страны"
 NFP63_RIVAL:0 "Речь о нашем сопернике. Отмахнуться от происходящего можно. Сделать вид, что оно от этого перестанет иметь значение, — уже труднее."
