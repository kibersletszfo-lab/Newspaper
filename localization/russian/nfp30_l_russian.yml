 NFP50_LAW_OWN_COMPARE_1:0 "А как приняли бы похожую перемену у нас? Среди правительственных групп её сторонникам принадлежит [ScriptContainer.GetVariableValue('nfp50_law_own_yes')|1]% политического веса, противникам — [ScriptContainer.GetVariableValue('nfp50_law_own_no')|1]%. Это сравнение наших взглядов на закон, а не объявленная реакция на чужое решение. За границей уже изменили порядок. У нас пока есть повод подумать, чем устраивает собственный."
 NFP50_LAW_OWN_COMPARE_2:0 "А как приняли бы похожую перемену у нас? Среди правительственных групп её сторонникам принадлежит [ScriptContainer.GetVariableValue('nfp50_law_own_yes')|1]% политического веса, противникам — [ScriptContainer.GetVariableValue('nfp50_law_own_no')|1]%. Это сравнение наших взглядов на закон, а не объявленная реакция на чужое решение. За границей уже изменили порядок. У нас пока есть повод подумать, чем устраивает собственный."
 NFP50_LAW_OWN_SAME_1:0 "Такой закон действует и у нас. Значит, сравнивать можно уже не только обещания. Интересно будет посмотреть, как с похожими правилами справляются в другой стране. Совпадающие строки в законах ещё не делают одинаковой жизнь по обе стороны границы."
 NFP50_LAW_OWN_SAME_2:0 "Такой закон действует и у нас. Значит, сравнивать можно уже не только обещания. Интересно будет посмотреть, как с похожими правилами справляются в другой стране. Совпадающие строки в законах ещё не делают одинаковой жизнь по обе стороны границы."
