 NFP52_PANAMA_1_TITLE:0 "Два океана стали ближе"
 NFP52_PANAMA_2_BODY:0 "Панамский канал достроен. Между Атлантическим и Тихим океанами появился новый проход. На бумаге разделяющая их суша выглядит довольно узкой. Строителям, надо полагать, одной этой утешительной мысли было бы недостаточно. Теперь за линией на карте стоит завершённое сооружение.\n\nСтроительство канала окончено. Океанские маршруты получили новую возможность, а прежние представления о пути между двумя океанами требуют пересмотра. Масштаб перемены понятен и без праздничного подсчёта каждой будущей выгоды: появился проход, которого прежде не было.\n\nТеперь за инженерным достижением последуют хозяйственные расчёты. Новый путь ещё нужно использовать, а его преимущества — превратить в полезные дела. Но повод для поздравлений уже вполне осязаем. Иногда сблизить разные стороны мира удаётся буквально.\n\nДата заметки обозначает месяц, когда редакция получила подтверждение. Она не устанавливает точный день самого события."
