l_russian:
 NFP30_ACCESS_HOME_1_BODY:0 "Регион: [SelectLocalization(And(ScriptContainer.MakeScope.Var('nfp20_problem_state').IsSet, ScriptContainer.MakeScope.Var('nfp20_problem_state').GetState.IsValid), 'NFP40_STATE_LINK', 'NFP40_REGION_FALLBACK')]. Доступ к рынку ниже 90% уже два месяца подряд. Последнее значение — [Multiply_CFixedPoint(ScriptContainer.GetVariableValue('nfp20_after'), '(CFixedPoint)100')|1]%.\n\nПо имеющимся сведениям нельзя установить причину: следует проверить местную инфраструктуру, морскую связь и прочие ограничения. Объявлять виновными одни железные дороги было бы поспешно."
 NFP30_ACCESS_HOME_1_LEAD:0 "Низкий доступ к рынку в нашей области сохраняется. Это затруднение заслуживает внимания наравне с хозяйственными успехами."
 NFP30_ACCESS_HOME_1_TITLE:0 "Наш рынок остаётся слишком далеко"
 NFP30_ACCESS_HOME_2_BODY:0 "Регион: [SelectLocalization(And(ScriptContainer.MakeScope.Var('nfp20_problem_state').IsSet, ScriptContainer.MakeScope.Var('nfp20_problem_state').GetState.IsValid), 'NFP40_STATE_LINK', 'NFP40_REGION_FALLBACK')]. Доступ к рынку ниже 90% уже два месяца подряд. Последнее значение — [Multiply_CFixedPoint(ScriptContainer.GetVariableValue('nfp20_after'), '(CFixedPoint)100')|1]%.\n\nПоказатель указывает на ограниченный доступ, но сам по себе не объясняет его происхождения. Прежде чем выбирать меры, необходимо выяснить, где именно нарушена связь."
 NFP30_ACCESS_HOME_2_LEAD:0 "Повторный месяц слабого доступа к рынку даёт редакции основание вновь поднять вопрос о связи нашей области с общим хозяйством."
 NFP30_ACCESS_HOME_2_TITLE:0 "Область ждёт надёжной связи с рынком"
 NFP30_ACCESS_METRICS:0 "Регион: [SelectLocalization(And(ScriptContainer.MakeScope.Var('nfp20_problem_state').IsSet, ScriptContainer.MakeScope.Var('nfp20_problem_state').GetState.IsValid), 'NFP40_STATE_LINK', 'NFP40_REGION_FALLBACK')]. Доступ к рынку ниже 90% уже два месяца подряд. Последнее значение — [Multiply_CFixedPoint(ScriptContainer.GetVariableValue('nfp20_after'), '(CFixedPoint)100')|1]%."
 NFP30_ACCESS_RECOVERY_HOME_1_BODY:0 "Регион: [SelectLocalization(And(ScriptContainer.MakeScope.Var('nfp20_problem_state').IsSet, ScriptContainer.MakeScope.Var('nfp20_problem_state').GetState.IsValid), 'NFP40_STATE_LINK', 'NFP40_REGION_FALLBACK')]. При прежнем предупреждении доступ к рынку составлял [Multiply_CFixedPoint(ScriptContainer.GetVariableValue('nfp20_before'), '(CFixedPoint)100')|1]%; последнее значение — [Multiply_CFixedPoint(ScriptContainer.GetVariableValue('nfp20_after'), '(CFixedPoint)100')|1]%. Два месяца подряд доступ держится не ниже 90%.\n\nРедакция рада отметить устойчивое за два месяца улучшение. Это не основание объявлять все местные трудности решёнными или приписывать перемену неподтверждённой причине."
 NFP30_ACCESS_RECOVERY_HOME_1_LEAD:0 "История слабой связи нашей области с рынком получила благоприятное продолжение."
 NFP30_ACCESS_RECOVERY_HOME_1_TITLE:0 "Область вновь ближе к общему рынку"
 NFP30_ACCESS_RECOVERY_HOME_2_BODY:0 "Регион: [SelectLocalization(And(ScriptContainer.MakeScope.Var('nfp20_problem_state').IsSet, ScriptContainer.MakeScope.Var('nfp20_problem_state').GetState.IsValid), 'NFP40_STATE_LINK', 'NFP40_REGION_FALLBACK')]. При прежнем предупреждении доступ к рынку составлял [Multiply_CFixedPoint(ScriptContainer.GetVariableValue('nfp20_before'), '(CFixedPoint)100')|1]%; последнее значение — [Multiply_CFixedPoint(ScriptContainer.GetVariableValue('nfp20_after'), '(CFixedPoint)100')|1]%. Два месяца подряд доступ держится не ниже 90%.\n\nДва последовательных месяца дают повод для осторожного удовлетворения. Причины перемены и положение отдельных предприятий требуют самостоятельной проверки."
 NFP30_ACCESS_RECOVERY_HOME_2_LEAD:0 "По вопросу, прежде тревожившему нашу газету, поступили добрые сведения: доступ области к рынку улучшился."
 NFP30_ACCESS_RECOVERY_HOME_2_TITLE:0 "Связь с рынком окрепла"
 NFP30_ACCESS_RECOVERY_METRICS:0 "Регион: [SelectLocalization(And(ScriptContainer.MakeScope.Var('nfp20_problem_state').IsSet, ScriptContainer.MakeScope.Var('nfp20_problem_state').GetState.IsValid), 'NFP40_STATE_LINK', 'NFP40_REGION_FALLBACK')]. При прежнем предупреждении доступ к рынку составлял [Multiply_CFixedPoint(ScriptContainer.GetVariableValue('nfp20_before'), '(CFixedPoint)100')|1]%; последнее значение — [Multiply_CFixedPoint(ScriptContainer.GetVariableValue('nfp20_after'), '(CFixedPoint)100')|1]%. Два месяца подряд доступ держится не ниже 90%."
 NFP30_ARTICLE_DETAILS:0 "[SelectLocalization(ScriptContainer.HasVariable('nfp63_schema'), 'NFP63_DETAILS', 'NFP50_EMPTY')]\nСведения редакции\nФакт № [ScriptContainer.GetVariableValue('nfp20_id')|0]; эпизод [ScriptContainer.GetVariableValue('nfp20_episode')|0].\nОтбор: [Localize(ScriptContainer.MakeScope.Var('nfp20_reason').GetFlagName)]. Приоритет: [ScriptContainer.GetVariableValue('nfp20_priority')|0].\n[Localize(ScriptContainer.MakeScope.Var('nfp30_metrics').GetFlagName)]\nПодача: [SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp30_domestic'), '(CFixedPoint)1'), 'NFP30_HOME', 'NFP30_AWAY')]; вариант [ScriptContainer.GetVariableValue('nfp30_variant')|0].\nНазвания стран основаны на постоянных определениях; динамическое историческое название не записывалось.\n[SelectLocalization(ScriptContainer.HasVariable('nfp63_schema'), 'NFP50_EMPTY', SelectLocalization(ScriptContainer.HasVariable('nfp31_reach'), 'NFP30_REACH_LINE', 'NFP30_REACH_OLD'))]"
 NFP30_ARTICLE_META:0 "[ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName] · [Localize(ScriptContainer.MakeScope.Var('nfp30_month').GetFlagName)], [ScriptContainer.GetVariableValue('nfp20_year')|0] г. · [Localize(ScriptContainer.MakeScope.Var('nfp30_rubric').GetFlagName)]"
 NFP30_ARTICLE_TEXT:0 "[Localize(ScriptContainer.MakeScope.Var('nfp30_lead').GetFlagName)]\n\n[Localize(ScriptContainer.MakeScope.Var('nfp30_body').GetFlagName)]"
 NFP30_AWAY:0 "зарубежное событие"
 NFP30_CONTENTS:0 "В этом номере"
 NFP30_COVER:0 "На обложку"
 NFP30_DETAILS:0 "Подробности"
 NFP30_DETAILS_CLOSE:0 "Скрыть подробности"
 NFP30_DIVERGENCE_HOME_1_BODY:0 "За три месячных интервала прогноз годового ВВП вырос с [ScriptContainer.GetVariableValue('nfp20_before')|0] до [ScriptContainer.GetVariableValue('nfp20_after')|0]. Средний уровень жизни за тот же период снизился на [ScriptContainer.GetVariableValue('nfp20_extra')|2] пункта.\n\nРост общего объёма хозяйства ещё не означает благополучия семей. Редакция считает положение населения вопросом государственной важности; причины расхождения требуют отдельного разбора."
 NFP30_DIVERGENCE_HOME_1_LEAD:0 "Рост хозяйства даёт стране повод для гордости, но падение уровня жизни требует столь же пристального внимания."
 NFP30_DIVERGENCE_HOME_1_TITLE:0 "Экономика растёт. Жить стало тяжелее"
 NFP30_DIVERGENCE_HOME_2_BODY:0 "За три месячных интервала прогноз годового ВВП вырос с [ScriptContainer.GetVariableValue('nfp20_before')|0] до [ScriptContainer.GetVariableValue('nfp20_after')|0]. Средний уровень жизни за тот же период снизился на [ScriptContainer.GetVariableValue('nfp20_extra')|2] пункта.\n\nСтране нужны достижения, ощутимые и в повседневной жизни. Сами эти цифры не объясняют причин ухудшения и не позволяют назначить виновных."
 NFP30_DIVERGENCE_HOME_2_LEAD:0 "Наше хозяйство прибавило, а средний уровень жизни пошёл вниз. Обе стороны этой картины заслуживают первой полосы."
 NFP30_DIVERGENCE_HOME_2_TITLE:0 "За успехами хозяйства — тревожные цифры"
 NFP30_DIVERGENCE_METRICS:0 "За три месячных интервала прогноз годового ВВП вырос с [ScriptContainer.GetVariableValue('nfp20_before')|0] до [ScriptContainer.GetVariableValue('nfp20_after')|0]. Средний уровень жизни за тот же период снизился на [ScriptContainer.GetVariableValue('nfp20_extra')|2] пункта."
 NFP30_EMPTY:0 "Сегодня для выбранных рубрик нет новых материалов. Следующий выпуск принесёт новые известия, когда они появятся."
 NFP30_GDP_LEADER_AWAY_1_BODY:0 "Прежнее место вне первой десятки — [ScriptContainer.GetVariableValue('nfp20_before')|0]; последнее место — [ScriptContainer.GetVariableValue('nfp20_after')|0]. Страна удерживается в десятке два месяца подряд.\n\nДля наших читателей это заметная перемена мировой хозяйственной картины. Она не доказывает ни высокого достатка жителей, ни прибыльности отдельных отраслей."
 NFP30_GDP_LEADER_AWAY_1_LEAD:0 "Состав крупнейших экономик изменился: иностранная страна закрепилась в первой десятке по ВВП."
 NFP30_GDP_LEADER_AWAY_1_TITLE:0 "В мировой хозяйственной десятке — новый участник"
 NFP30_GDP_LEADER_AWAY_2_BODY:0 "Прежнее место вне первой десятки — [ScriptContainer.GetVariableValue('nfp20_before')|0]; последнее место — [ScriptContainer.GetVariableValue('nfp20_after')|0]. Страна удерживается в десятке два месяца подряд.\n\nРейтинг относится к прогнозу годового ВВП. О торговых последствиях для нашей страны эти сведения сами по себе не говорят."
 NFP30_GDP_LEADER_AWAY_2_LEAD:0 "Новый участник первой десятки сохраняет своё положение второй месяц подряд."
 NFP30_GDP_LEADER_AWAY_2_TITLE:0 "Зарубежная экономика укрепилась среди крупнейших"
 NFP30_GDP_LEADER_HOME_1_BODY:0 "Прежнее место вне первой десятки — [ScriptContainer.GetVariableValue('nfp20_before')|0]; последнее место — [ScriptContainer.GetVariableValue('nfp20_after')|0]. Страна удерживается в десятке два месяца подряд.\n\nДостижение заслуживает признания. Место по общему объёму хозяйства, однако, не измеряет уровень жизни жителей и прибыль предприятий."
 NFP30_GDP_LEADER_HOME_1_LEAD:0 "Страна закрепилась среди десяти крупнейших экономик по прогнозу годового ВВП."
 NFP30_GDP_LEADER_HOME_1_TITLE:0 "Наше хозяйство вошло в мировую десятку"
 NFP30_GDP_LEADER_HOME_2_BODY:0 "Прежнее место вне первой десятки — [ScriptContainer.GetVariableValue('nfp20_before')|0]; последнее место — [ScriptContainer.GetVariableValue('nfp20_after')|0]. Страна удерживается в десятке два месяца подряд.\n\nМы приветствуем этот результат и сохраняем внимание к благосостоянию населения: размер экономики не заменяет его оценки."
 NFP30_GDP_LEADER_HOME_2_LEAD:0 "Два месяца в первой десятке по ВВП дают основание говорить о закрепившемся хозяйственном достижении."
 NFP30_GDP_LEADER_HOME_2_TITLE:0 "Место среди крупнейших — за нашей страной"
 NFP30_GDP_LEADER_METRICS:0 "Прежнее место вне первой десятки — [ScriptContainer.GetVariableValue('nfp20_before')|0]; последнее место — [ScriptContainer.GetVariableValue('nfp20_after')|0]. Страна удерживается в десятке два месяца подряд."
 NFP30_HOME:0 "событие своей страны"
 NFP30_INFRA_HOME_1_BODY:0 "Регион: [SelectLocalization(And(ScriptContainer.MakeScope.Var('nfp20_problem_state').IsSet, ScriptContainer.MakeScope.Var('nfp20_problem_state').GetState.IsValid), 'NFP40_STATE_LINK', 'NFP40_REGION_FALLBACK')]. Два месяца подряд баланс инфраструктуры остаётся отрицательным; последнее значение — [ScriptContainer.GetVariableValue('nfp20_after')|2].\n\nДефицит инфраструктуры заслуживает отдельной проверки местных потребностей. Газета не приписывает ему все затруднения области и не объявляет конкретное строительство единственным решением."
 NFP30_INFRA_HOME_1_LEAD:0 "Недостаток инфраструктуры в нашей области оказался устойчивой проблемой. Откладывать внимание к нему всё труднее."
 NFP30_INFRA_HOME_1_TITLE:0 "Области нужна связь, достойная страны"
 NFP30_INFRA_HOME_2_BODY:0 "Регион: [SelectLocalization(And(ScriptContainer.MakeScope.Var('nfp20_problem_state').IsSet, ScriptContainer.MakeScope.Var('nfp20_problem_state').GetState.IsValid), 'NFP40_STATE_LINK', 'NFP40_REGION_FALLBACK')]. Два месяца подряд баланс инфраструктуры остаётся отрицательным; последнее значение — [ScriptContainer.GetVariableValue('nfp20_after')|2].\n\nРедакция обращает внимание на повторяющийся недостаток. Выбор мер требует изучения самой области; одного показателя для готового строительного рецепта мало."
 NFP30_INFRA_HOME_2_LEAD:0 "В одной из наших областей потребность в инфраструктуре вновь превышает имеющиеся возможности."
 NFP30_INFRA_HOME_2_TITLE:0 "Инфраструктурный вопрос нельзя откладывать"
 NFP30_INFRA_METRICS:0 "Регион: [SelectLocalization(And(ScriptContainer.MakeScope.Var('nfp20_problem_state').IsSet, ScriptContainer.MakeScope.Var('nfp20_problem_state').GetState.IsValid), 'NFP40_STATE_LINK', 'NFP40_REGION_FALLBACK')]. Два месяца подряд баланс инфраструктуры остаётся отрицательным; последнее значение — [ScriptContainer.GetVariableValue('nfp20_after')|2]."
 NFP30_INFRA_RECOVERY_HOME_1_BODY:0 "Регион: [SelectLocalization(And(ScriptContainer.MakeScope.Var('nfp20_problem_state').IsSet, ScriptContainer.MakeScope.Var('nfp20_problem_state').GetState.IsValid), 'NFP40_STATE_LINK', 'NFP40_REGION_FALLBACK')]. В момент прежнего предупреждения баланс инфраструктуры составлял [ScriptContainer.GetVariableValue('nfp20_before')|2]; теперь — [ScriptContainer.GetVariableValue('nfp20_after')|2]. Два последних месячных наблюдения дают неотрицательный баланс.\n\nЭто достижение заслуживает места на страницах газеты. Вместе с тем два благоприятных наблюдения не дают обещания, что недостаток никогда не вернётся."
 NFP30_INFRA_RECOVERY_HOME_1_LEAD:0 "Мы возвращаемся к опубликованному инфраструктурному вопросу: последние сведения позволяют сообщить об улучшении."
 NFP30_INFRA_RECOVERY_HOME_1_TITLE:0 "Добрые вести из прежде проблемной области"
 NFP30_INFRA_RECOVERY_HOME_2_BODY:0 "Регион: [SelectLocalization(And(ScriptContainer.MakeScope.Var('nfp20_problem_state').IsSet, ScriptContainer.MakeScope.Var('nfp20_problem_state').GetState.IsValid), 'NFP40_STATE_LINK', 'NFP40_REGION_FALLBACK')]. В момент прежнего предупреждения баланс инфраструктуры составлял [ScriptContainer.GetVariableValue('nfp20_before')|2]; теперь — [ScriptContainer.GetVariableValue('nfp20_after')|2]. Два последних месячных наблюдения дают неотрицательный баланс.\n\nУлучшение подтверждено двумя последовательными наблюдениями. Какие именно меры его обеспечили, имеющиеся данные не устанавливают."
 NFP30_INFRA_RECOVERY_HOME_2_LEAD:0 "В нашей области инфраструктурный баланс восстановился. Редакция отмечает перемену в истории, за которой уже следили читатели."
 NFP30_INFRA_RECOVERY_HOME_2_TITLE:0 "Прежнее предупреждение сменяется доброй вестью"
 NFP30_INFRA_RECOVERY_METRICS:0 "Регион: [SelectLocalization(And(ScriptContainer.MakeScope.Var('nfp20_problem_state').IsSet, ScriptContainer.MakeScope.Var('nfp20_problem_state').GetState.IsValid), 'NFP40_STATE_LINK', 'NFP40_REGION_FALLBACK')]. В момент прежнего предупреждения баланс инфраструктуры составлял [ScriptContainer.GetVariableValue('nfp20_before')|2]; теперь — [ScriptContainer.GetVariableValue('nfp20_after')|2]. Два последних месячных наблюдения дают неотрицательный баланс."
 NFP30_ISSUE_DETAILS:0 "Сведения о выпуске\nМатериалов: [ScriptContainer.GetVariableValue('nfp20_article_count')|0].\nИстория: [ScriptContainer.GetVariableValue('nfp20_history_count')|0] наблюдений, [ScriptContainer.GetVariableValue('nfp20_summary_intervals')|0] интервалов сравнения.\nПрогноз годового ВВП: [ScriptContainer.GetVariableValue('nfp20_summary_before')|0] → [ScriptContainer.GetVariableValue('nfp20_summary_after')|0].\n\n$NFP20_DIAGNOSTICS$\n[SelectLocalization(ScriptContainer.HasVariable('nfp31_rejected_region'), 'NFP30_REACH_REJECTED', 'NFP30_REACH_OLD')]"
 NFP30_ISSUE_HEADER:0 "[ScriptContainer.MakeScope.Var('nfp30_reader_definition').GetCountryDefinition.GetName] · № [ScriptContainer.GetVariableValue('nfp_number')|0] · [Localize(ScriptContainer.MakeScope.Var('nfp30_month').GetFlagName)], [ScriptContainer.GetVariableValue('nfp_year')|0] г."
 NFP30_LAW_AWAY_1_BODY:0 "Вступил в силу закон: [Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)].\n\nНаши читатели получают возможность следить за переменами у других народов. Пока установлен факт действия новой нормы; её последствия ещё предстоит оценить."
 NFP30_LAW_AWAY_1_LEAD:0 "В иностранной стране вступила в силу значимая реформа."
 NFP30_LAW_AWAY_1_TITLE:0 "За рубежом открыта новая правовая страница"
 NFP30_LAW_AWAY_2_BODY:0 "Вступил в силу закон: [Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)].\n\nСведения не позволяют приписать реформу парламентскому голосованию или обещать определённый результат. За её действием следует наблюдать отдельно."
 NFP30_LAW_AWAY_2_LEAD:0 "Из-за рубежа поступило известие о вступлении в силу новой правовой нормы."
 NFP30_LAW_AWAY_2_TITLE:0 "Иностранная страна вводит значимый закон"
 NFP30_LAW_HOME_1_BODY:0 "Вступил в силу закон: [Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)].\n\nРедакция сообщает сам факт перемены. Каким путём она была принята и как скажется на жизни жителей, это известие пока не устанавливает."
 NFP30_LAW_HOME_1_LEAD:0 "В стране вступила в действие значимая правовая норма."
 NFP30_LAW_HOME_1_TITLE:0 "Новый закон — новая страница нашей жизни"
 NFP30_LAW_HOME_2_BODY:0 "Вступил в силу закон: [Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)].\n\nОценка результатов реформы потребует времени и сведений о её действии. Газета не выдаёт вступление закона в силу за уже достигнутый общественный результат."
 NFP30_LAW_HOME_2_LEAD:0 "Правовой порядок нашей страны изменился. Новая норма заслуживает внимания читателей."
 NFP30_LAW_HOME_2_TITLE:0 "В стране вступила в силу значимая реформа"
 NFP30_LAW_METRICS:0 "Вступил в силу закон: [Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]."
 NFP30_LEAD_STORY:0 "Главный материал"
 NFP30_LITERACY_AWAY_1_BODY:0 "Доля грамотных изменилась с [Multiply_CFixedPoint(ScriptContainer.GetVariableValue('nfp20_before'), '(CFixedPoint)100')|1]% до [Multiply_CFixedPoint(ScriptContainer.GetVariableValue('nfp20_after'), '(CFixedPoint)100')|1]%, пересекая рубеж [Multiply_CFixedPoint(ScriptContainer.GetVariableValue('nfp20_extra'), '(CFixedPoint)100')|1]%.\n\nЧужой успех заслуживает внимания наших читателей. Сам рубеж ещё не объясняет устройство школ и не доказывает превосходства всей образовательной системы."
 NFP30_LITERACY_AWAY_1_LEAD:0 "Из другой страны пришла заметная весть о росте грамотности."
 NFP30_LITERACY_AWAY_1_TITLE:0 "За рубежом достигнут рубеж просвещения"
 NFP30_LITERACY_AWAY_2_BODY:0 "Доля грамотных изменилась с [Multiply_CFixedPoint(ScriptContainer.GetVariableValue('nfp20_before'), '(CFixedPoint)100')|1]% до [Multiply_CFixedPoint(ScriptContainer.GetVariableValue('nfp20_after'), '(CFixedPoint)100')|1]%, пересекая рубеж [Multiply_CFixedPoint(ScriptContainer.GetVariableValue('nfp20_extra'), '(CFixedPoint)100')|1]%.\n\nРост доли грамотных подтверждён новыми сведениями. Выводы о причинах и возможности перенести этот опыт на нашу почву требуют отдельного изучения."
 NFP30_LITERACY_AWAY_2_LEAD:0 "Зарубежное известие о грамотности пополняет летопись просвещения, за которой следит наша газета."
 NFP30_LITERACY_AWAY_2_TITLE:0 "В мире становится больше грамотных"
 NFP30_LITERACY_HOME_1_BODY:0 "Доля грамотных изменилась с [Multiply_CFixedPoint(ScriptContainer.GetVariableValue('nfp20_before'), '(CFixedPoint)100')|1]% до [Multiply_CFixedPoint(ScriptContainer.GetVariableValue('nfp20_after'), '(CFixedPoint)100')|1]%, пересекая рубеж [Multiply_CFixedPoint(ScriptContainer.GetVariableValue('nfp20_extra'), '(CFixedPoint)100')|1]%.\n\nПеремена подтверждена сравнением с предыдущими сведениями. Судить по одному рубежу о качестве школ и равенстве доступа к образованию пока рано."
 NFP30_LITERACY_HOME_1_LEAD:0 "Достигнут новый рубеж грамотности. Такой успех достоин национальной гордости."
 NFP30_LITERACY_HOME_1_TITLE:0 "Наша страна делает шаг к просвещению"
 NFP30_LITERACY_HOME_2_BODY:0 "Доля грамотных изменилась с [Multiply_CFixedPoint(ScriptContainer.GetVariableValue('nfp20_before'), '(CFixedPoint)100')|1]% до [Multiply_CFixedPoint(ScriptContainer.GetVariableValue('nfp20_after'), '(CFixedPoint)100')|1]%, пересекая рубеж [Multiply_CFixedPoint(ScriptContainer.GetVariableValue('nfp20_extra'), '(CFixedPoint)100')|1]%.\n\nДоля умеющих читать и писать пересекла важный рубеж. Чтобы оценить положение разных областей и сословий, нужны более подробные сведения."
 NFP30_LITERACY_HOME_2_LEAD:0 "Новые сведения о грамотности дают нашей газете повод приветствовать достижение страны."
 NFP30_LITERACY_HOME_2_TITLE:0 "Просвещение расширяет свои пределы"
 NFP30_LITERACY_METRICS:0 "Доля грамотных изменилась с [Multiply_CFixedPoint(ScriptContainer.GetVariableValue('nfp20_before'), '(CFixedPoint)100')|1]% до [Multiply_CFixedPoint(ScriptContainer.GetVariableValue('nfp20_after'), '(CFixedPoint)100')|1]%, пересекая рубеж [Multiply_CFixedPoint(ScriptContainer.GetVariableValue('nfp20_extra'), '(CFixedPoint)100')|1]%."
