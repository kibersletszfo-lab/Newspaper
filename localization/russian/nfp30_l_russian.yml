 NFP30_PRICE_DOWN:0 "@arrow_down!"
 NFP30_PRICE_FIRST:0 "Для этих товаров ещё нет сопоставимых данных за предыдущий месяц. Указаны только цены последнего наблюдения."
 NFP30_PRICE_LEAD_1:0 "В этот раз заглянем в торговую сводку. Больших известий для полос не нашлось, а цены заслуживают внимания и в тихий месяц. Особенно когда за покупку платишь сам."
 NFP30_PRICE_LEAD_2:0 "В этот раз заглянем в торговую сводку. Больших известий для полос не нашлось, а цены заслуживают внимания и в тихий месяц. Особенно когда за покупку платишь сам."
 NFP30_PRICE_MARKET:0 "Рынок: [ScriptContainer.MakeScope.Var('nfp32_market_owner').GetCountryDefinition.GetName]."
 NFP30_PRICE_METHOD:0 "Показано до шести товаров с наибольшим изменением цены между двумя последовательными месячными наблюдениями. Стрелка ведёт от прежней цены к последней; в скобках — изменение. Для новых товаров указана только последняя цена. Это цены рынка, не местные цены отдельных областей и не средние за месяц."
 NFP30_PRICE_METRICS:0 "Дежурная сводка вместо пустого номера. Строк: [ScriptContainer.GetVariableValue('nfp32_rows')|0]; сопоставлений: [ScriptContainer.GetVariableValue('nfp32_comparisons')|0]. Снимок фиксируется раз в календарный месяц; недельные выпуски в том же месяце используют те же данные. Смена рынка и пропуск наблюдений прерывают сравнение. Цены вычислены из базовой цены товара и игрового отклонения рыночной цены. Таблица и её порядок закреплены при печати."
 NFP30_PRICE_ROW_EMPTY:0 ""
 NFP30_PRICE_SAME:0 "—"
 NFP30_PRICE_TITLE_1:0 "Что нынче стоит привычная покупка?"
 NFP30_PRICE_TITLE_2:0 "Что нынче стоит привычная покупка?"
 NFP30_PRICE_UNAVAILABLE:0 "Доступных цен для этой сводки нет. Заполнять таблицу выдуманными числами редакция не стала."
 NFP30_PRICE_UP:0 "@arrow_up!"
 NFP30_PRODUCTION_AWAY_1_BODY:0 "Товар: [Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]. Прежнее место вне тройки — [ScriptContainer.GetVariableValue('nfp20_before')|0]; последнее — [ScriptContainer.GetVariableValue('nfp20_after')|0]. Пребывание в тройке подтверждено двумя месяцами.\n\nМеняется картина мирового производства. Рейтинг измеряет выпуск, поэтому газета не делает из него выводов о прибыли, экспорте или ценах на нашем рынке."
 NFP30_PRODUCTION_AWAY_1_LEAD:0 "Иностранная страна вошла в тройку по выпуску одного из ключевых товаров и удержала место второй месяц."
 NFP30_PRODUCTION_AWAY_1_TITLE:0 "У мировых производителей появился новый лидер"
 NFP30_PRODUCTION_AWAY_2_BODY:0 "Товар: [Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]. Прежнее место вне тройки — [ScriptContainer.GetVariableValue('nfp20_before')|0]; последнее — [ScriptContainer.GetVariableValue('nfp20_after')|0]. Пребывание в тройке подтверждено двумя месяцами.\n\nЧитателям следует различать объём производства и торговое влияние. Второе не установлено одним местом в этом рейтинге."
 NFP30_PRODUCTION_AWAY_2_LEAD:0 "Зарубежный выпуск одного из важных товаров вышел в мировую тройку."
 NFP30_PRODUCTION_AWAY_2_TITLE:0 "За рубежом укрепились позиции крупного производителя"
 NFP30_PRODUCTION_HOME_1_BODY:0 "Товар: [Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]. Прежнее место вне тройки — [ScriptContainer.GetVariableValue('nfp20_before')|0]; последнее — [ScriptContainer.GetVariableValue('nfp20_after')|0]. Пребывание в тройке подтверждено двумя месяцами.\n\nЭто весомый производственный результат. Сравнивается объём выпуска; прибыльность, экспорт и положение работников требуют своих сведений."
 NFP30_PRODUCTION_HOME_1_LEAD:0 "По одному из ключевых товаров страна закрепилась среди трёх крупнейших производителей."
 NFP30_PRODUCTION_HOME_1_TITLE:0 "Наше производство вошло в мировую тройку"
 NFP30_PRODUCTION_HOME_2_BODY:0 "Товар: [Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]. Прежнее место вне тройки — [ScriptContainer.GetVariableValue('nfp20_before')|0]; последнее — [ScriptContainer.GetVariableValue('nfp20_after')|0]. Пребывание в тройке подтверждено двумя месяцами.\n\nВысокое место по выпуску — измеримый успех. Этот рейтинг не показывает, с какими затратами получен результат и какую пользу он принёс каждой семье."
 NFP30_PRODUCTION_HOME_2_LEAD:0 "Два месяца в тройке производителей дают редакции повод отметить отраслевое достижение страны."
 NFP30_PRODUCTION_HOME_2_TITLE:0 "Отечественный выпуск — среди мировых лидеров"
 NFP30_PRODUCTION_METRICS:0 "Товар: [Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]. Прежнее место вне тройки — [ScriptContainer.GetVariableValue('nfp20_before')|0]; последнее — [ScriptContainer.GetVariableValue('nfp20_after')|0]. Пребывание в тройке подтверждено двумя месяцами."
 NFP30_PUBLICATION_KIND:0 "[SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp_kind'), '(CFixedPoint)3'), 'NFP30_URGENT', SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp_kind'), '(CFixedPoint)1'), 'NFP30_REGULAR', 'NFP30_MANUAL'))]"
 NFP30_RANK_AWAY_1_BODY:0 "Прежний статус — [Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]; новый статус — [Localize(ScriptContainer.MakeScope.Var('nfp20_extra_detail').GetFlagName)].\n\nДля нашего читателя это часть меняющейся мировой картины. Смена категории не обязательно означает появление новой великой державы."
 NFP30_RANK_AWAY_1_LEAD:0 "Одна из иностранных стран получила иной международный статус."
 NFP30_RANK_AWAY_1_TITLE:0 "В кругу держав меняется расстановка"
 NFP30_RANK_AWAY_2_BODY:0 "Прежний статус — [Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]; новый статус — [Localize(ScriptContainer.MakeScope.Var('nfp20_extra_detail').GetFlagName)].\n\nМы приводим оба статуса, чтобы читатель мог оценить направление перемены. Её причины и последствия остаются предметом отдельного рассмотрения."
 NFP30_RANK_AWAY_2_LEAD:0 "Поступило известие о перемене категории одной из стран мира."
 NFP30_RANK_AWAY_2_TITLE:0 "Зарубежная держава сменила статус"
 NFP30_RANK_HOME_1_BODY:0 "Прежний статус — [Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]; новый статус — [Localize(ScriptContainer.MakeScope.Var('nfp20_extra_detail').GetFlagName)].\n\nИзменение заслуживает внимания само по себе. Его направление следует оценивать по указанным категориям; не всякая смена ранга означает возвышение."
 NFP30_RANK_HOME_1_LEAD:0 "Международное положение страны получило новую оценку. Редакция сообщает прежний и новый статус."
 NFP30_RANK_HOME_1_TITLE:0 "Наше место в кругу держав изменилось"
 NFP30_RANK_HOME_2_BODY:0 "Прежний статус — [Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]; новый статус — [Localize(ScriptContainer.MakeScope.Var('nfp20_extra_detail').GetFlagName)].\n\nГазета фиксирует перемену положения. О её причинах и дипломатических последствиях нельзя судить только по названию нового ранга."
 NFP30_RANK_HOME_2_LEAD:0 "В перечне держав наша страна теперь занимает иную категорию."
 NFP30_RANK_HOME_2_TITLE:0 "Страна встречает новый международный статус"
 NFP30_RANK_METRICS:0 "Прежний статус — [Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]; новый статус — [Localize(ScriptContainer.MakeScope.Var('nfp20_extra_detail').GetFlagName)]."
 NFP30_REACH_DOMESTIC:0 "событие нашей страны или нашей стороны в войне"
 NFP30_REACH_FROZEN:0 "Регионы столиц и признак мирового масштаба сохранены при регистрации факта."
 NFP30_REACH_LINE:0 "Охват: [Localize(ScriptContainer.MakeScope.Var('nfp31_reach').GetFlagName)]. [SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp31_legacy'), '(CFixedPoint)1'), 'NFP30_REACH_MIGRATED', 'NFP30_REACH_FROZEN')]"
 NFP30_REACH_MIGRATED:0 "Для старого неопубликованного факта регионы столиц восстановлены при обновлении; прежний интерес и ранги сторон неизвестны."
 NFP30_REACH_OLD:0 "Этот выпуск напечатан до введения регионального фильтра."
 NFP30_REACH_PRICE_LOCAL:0 "дежурный отчёт о рынке страны читателя"
 NFP30_REACH_REGION:0 "региональный интерес страны читателя не ниже 2 при получении и печати"
 NFP30_REACH_REJECTED:0 "Региональный фильтр: отложено [ScriptContainer.GetVariableValue('nfp31_rejected_region')|0] материалов."
 NFP30_REACH_WORLD:0 "мировой масштаб: война двух великих держав или приобретение/утрата статуса великой державы"
 NFP30_REASON_PRICES:0 "В номер не отобрано ни одной новости; добавлен ежемесячный отчёт о ценах."
 NFP30_REGULAR:0 "Очередной выпуск"
 NFP30_RUBRIC_1:0 "Экономика"
 NFP30_RUBRIC_2:0 "Война"
 NFP30_RUBRIC_3:0 "Общество"
 NFP30_RUBRIC_4:0 "События"
 NFP30_RUBRIC_EMPTY:0 "В этом номере нет материалов выбранной рубрики: она была отключена или подходящих новостей не оказалось."
 NFP30_RUBRIC_JUMP:0 "Перейти к первому материалу этой рубрики."
 NFP30_SHORTAGE_HOME_1_BODY:0 "Товар: [Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]. На нашем рынке нехватка отмечена в двух последовательных месячных наблюдениях.\n\nСледует внимательно проверить снабжение и потребление этого товара. Сообщение относится к самой нехватке: высокая цена заслуживает отдельного рассмотрения."
 NFP30_SHORTAGE_HOME_1_LEAD:0 "Нехватка на нашем рынке перестала быть единичным известием. Редакция выносит её в число хозяйственных вопросов дня."
 NFP30_SHORTAGE_HOME_1_TITLE:0 "Рынку недостаёт необходимого товара"
 NFP30_SHORTAGE_HOME_2_BODY:0 "Товар: [Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]. На нашем рынке нехватка отмечена в двух последовательных месячных наблюдениях.\n\nУстановлен факт рыночного дефицита; его причины пока не определены. Назначать ответственных или обещать эффект конкретной постройки на этих сведениях нельзя."
 NFP30_SHORTAGE_HOME_2_LEAD:0 "Два месяца подряд наш рынок сообщает о нехватке одного из ключевых товаров. Успехи других отраслей не снимают этого вопроса."
 NFP30_SHORTAGE_HOME_2_TITLE:0 "Дефицит требует внимания"
 NFP30_SHORTAGE_METRICS:0 "Товар: [Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]. На нашем рынке нехватка отмечена в двух последовательных месячных наблюдениях."
 NFP30_SHORTAGE_RECOVERY_HOME_1_BODY:0 "Товар: [Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]. После нашего предупреждения два месячных наблюдения подряд не обнаруживают прежнего рыночного дефицита.\n\nРедакция отмечает отсутствие прежнего дефицита. Это ещё не обещание низких цен: дороговизна и нехватка — разные вопросы."
 NFP30_SHORTAGE_RECOVERY_HOME_1_LEAD:0 "Есть добрые вести по товару, о нехватке которого мы уже сообщали читателям."
 NFP30_SHORTAGE_RECOVERY_HOME_1_TITLE:0 "Прежняя нехватка отступила"
 NFP30_SHORTAGE_RECOVERY_HOME_2_BODY:0 "Товар: [Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]. После нашего предупреждения два месячных наблюдения подряд не обнаруживают прежнего рыночного дефицита.\n\nБлагоприятное состояние сохраняется два месяца. Газета продолжит различать наличие товара и его доступность по цене; последнее этим сообщением не установлено."
 NFP30_SHORTAGE_RECOVERY_HOME_2_LEAD:0 "Наблюдения за нашим рынком принесли известие, которого ждали после прежнего предупреждения: дефицит больше не отмечается."
 NFP30_SHORTAGE_RECOVERY_HOME_2_TITLE:0 "В истории дефицита — благоприятный поворот"
 NFP30_SHORTAGE_RECOVERY_METRICS:0 "Товар: [Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]. После нашего предупреждения два месячных наблюдения подряд не обнаруживают прежнего рыночного дефицита."
 NFP30_TECH_AWAY_1_BODY:0 "Теперь стране доступна технология [Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)].\n\nЧужие возможности стали шире. Для нас это повод присмотреться к собственным делам: что уже умеем мы и как этим пользуемся? Поздравление может подождать почтового отправления. Полезную мысль для себя лучше оставить сразу."
 NFP30_TECH_AWAY_1_LEAD:0 "За рубежом получили новую технологию. Пока мы читали привычные сводки, у другой страны прибавилось возможностей. Есть повод посмотреть, каких именно."
 NFP30_TECH_AWAY_1_TITLE:0 "За рубежом умеют больше"
 NFP30_TECH_AWAY_2_BODY:0 "Теперь стране доступна технология [Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)].\n\nЧужие возможности стали шире. Для нас это повод присмотреться к собственным делам: что уже умеем мы и как этим пользуемся? Поздравление может подождать почтового отправления. Полезную мысль для себя лучше оставить сразу."
 NFP30_TECH_AWAY_2_LEAD:0 "За рубежом получили новую технологию. Пока мы читали привычные сводки, у другой страны прибавилось возможностей. Есть повод посмотреть, каких именно."
 NFP30_TECH_AWAY_2_TITLE:0 "За рубежом умеют больше"
 NFP30_TECH_HOME_1_BODY:0 "Теперь стране доступна технология [Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)].\n\nЗнать теперь умеем больше — осталось толково этим воспользоваться. Для нашей страны это хороший повод гордиться и одновременно заняться делом. Хотелось бы следующую новость посвятить тому, что получилось благодаря новым знаниям. Перечень возможностей приятен. Их применение всё-таки приятнее."
 NFP30_TECH_HOME_1_LEAD:0 "У нашей страны появилась новая технология. Хорошая новость для тех, кто хотел бы двигать хозяйство не одними обещаниями."
 NFP30_TECH_HOME_1_TITLE:0 "Знаний прибавилось. Теперь за дело"
 NFP30_TECH_HOME_2_BODY:0 "Теперь стране доступна технология [Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)].\n\nЗнать теперь умеем больше — осталось толково этим воспользоваться. Для нашей страны это хороший повод гордиться и одновременно заняться делом. Хотелось бы следующую новость посвятить тому, что получилось благодаря новым знаниям. Перечень возможностей приятен. Их применение всё-таки приятнее."
 NFP30_TECH_HOME_2_LEAD:0 "У нашей страны появилась новая технология. Хорошая новость для тех, кто хотел бы двигать хозяйство не одними обещаниями."
 NFP30_TECH_HOME_2_TITLE:0 "Знаний прибавилось. Теперь за дело"
 NFP30_TECH_METRICS:0 "Страна получила технологическое знание: [Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]."
 NFP30_TITLE:0 "Национальный вестник — 0.5.0"
 NFP30_UNKNOWN_LEAD:0 "Материал из ранее собранных сведений."
 NFP30_UNKNOWN_METRICS:0 "Сохранённые значения: [ScriptContainer.GetVariableValue('nfp20_before')|3] → [ScriptContainer.GetVariableValue('nfp20_after')|3]."
 NFP30_UNKNOWN_TITLE:0 "Сообщение редакции"
 NFP30_URGENT:0 "СРОЧНЫЙ ВЫПУСК"
 NFP30_WAR_END_AWAY_1_BODY:0 "Война завершилась. Главные стороны: [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName] и [ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName].\n\nДля наших читателей это важный поворот мировой повестки. Кто добился своих целей и какой ценой, настоящее сообщение не устанавливает."
 NFP30_WAR_END_AWAY_1_LEAD:0 "Поступило известие об окончании войны между указанными главными сторонами."
 NFP30_WAR_END_AWAY_1_TITLE:0 "Зарубежная война подошла к концу"
 NFP30_WAR_END_AWAY_2_BODY:0 "Война завершилась. Главные стороны: [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName] и [ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName].\n\nГазета фиксирует окончание войны и оставляет оценку её результатов до получения сведений о потерях и мирных условиях."
 NFP30_WAR_END_AWAY_2_LEAD:0 "Военное столкновение главных сторон завершено."
 NFP30_WAR_END_AWAY_2_TITLE:0 "Из-за рубежа пришла весть о завершении войны"
 NFP30_WAR_END_HOME_1_BODY:0 "Война завершилась. Главные стороны: [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName] и [ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName].\n\nГазета сообщает об окончании войны. Это известие ещё не определяет победителя, размеры потерь или содержание мирных условий."
 NFP30_WAR_END_HOME_1_LEAD:0 "Военная история, затронувшая нашу страну как одну из главных сторон, подошла к завершению."
 NFP30_WAR_END_HOME_1_TITLE:0 "Война нашей страны завершилась"
 NFP30_WAR_END_HOME_2_BODY:0 "Война завершилась. Главные стороны: [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName] и [ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName].\n\nЧтобы оценить итоги, нужны сведения о соглашениях и положении сторон. Само прекращение войны не даёт основания объявлять победу."
 NFP30_WAR_END_HOME_2_LEAD:0 "Война с участием нашей страны завершена. Редакция отмечает важную перемену в национальной повестке."
 NFP30_WAR_END_HOME_2_TITLE:0 "Поступила весть об окончании войны"
 NFP30_WAR_END_METRICS:0 "Война завершилась. Главные стороны: [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName] и [ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName]."
 NFP30_WAR_START_AWAY_1_BODY:0 "Началась война. Главные стороны: [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName] и [ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName].\n\nОстальные участники, ход боевых действий и последствия для нашей страны требуют дополнительных сведений. Исход войны пока не известен."
 NFP30_WAR_START_AWAY_1_LEAD:0 "За рубежом началась значимая война. Наша газета сообщает две её главные стороны."
 NFP30_WAR_START_AWAY_1_TITLE:0 "В мире разгорелась новая война"
 NFP30_WAR_START_AWAY_2_BODY:0 "Началась война. Главные стороны: [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName] и [ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName].\n\nМы фиксируем начало войны, не назначая победителя заранее. Полный состав участников в этой заметке не установлен."
 NFP30_WAR_START_AWAY_2_LEAD:0 "Из-за рубежа пришло известие о начале военного столкновения между указанными державами."
 NFP30_WAR_START_AWAY_2_TITLE:0 "Новая война меняет мировую повестку"
 NFP30_WAR_START_HOME_1_BODY:0 "Началась война. Главные стороны: [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName] и [ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName].\n\nРедакция будет следить за развитием событий. Пока мы сообщаем главные стороны; сведений обо всех участниках и будущем исходе это известие не содержит."
 NFP30_WAR_START_HOME_1_LEAD:0 "Мирная повестка уступает место военному известию: страна стала одной из главных сторон начавшейся войны."
 NFP30_WAR_START_HOME_1_TITLE:0 "Наша страна вступила в войну"
 NFP30_WAR_START_HOME_2_BODY:0 "Началась война. Главные стороны: [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName] и [ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName].\n\nСобытие требует внимания всех читателей. Газета не предрешает исход и не заменяет достоверные сведения победными обещаниями."
 NFP30_WAR_START_HOME_2_LEAD:0 "Поступило известие о начале войны, в которой наша страна выступает одной из главных сторон."
 NFP30_WAR_START_HOME_2_TITLE:0 "Началась война с участием нашей страны"
 NFP30_WAR_START_METRICS:0 "Началась война. Главные стороны: [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName] и [ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName]."
 NFP38_BADGE_HINT:0 "Непрочитанных выпусков: [GetPlayer.MakeScope.Var('nfp38_unread_count').GetValue|0]. Нажмите, чтобы открыть газету."
 NFP39_ISSUE_HEADER:0 "№ [ScriptContainer.GetVariableValue('nfp_number')|0] · [Localize(ScriptContainer.MakeScope.Var('nfp30_month').GetFlagName)], [ScriptContainer.GetVariableValue('nfp_year')|0] г."
 NFP40_REGION_FALLBACK:0 "[SelectLocalization(And(Not(ScriptContainer.MakeScope.Var('nfp20_region').GetStateRegion.IsSplitState), ScriptContainer.MakeScope.Var('nfp20_region').GetStateRegion.GetLargestStateInRegion.IsValid), 'NFP40_UNSPLIT_STATE_LINK', 'NFP40_REGION_NAME')]"
 NFP40_REGION_NAME:0 "[ScriptContainer.MakeScope.Var('nfp20_region').GetStateRegion.GetName]"
 NFP40_STATE_LINK:0 "[ScriptContainer.MakeScope.Var('nfp20_problem_state').GetState.GetName]"
 NFP40_UNSPLIT_STATE_LINK:0 "[ScriptContainer.MakeScope.Var('nfp20_region').GetStateRegion.GetLargestStateInRegion.GetName]"
 NFP42_ECONOMY_DISABLED:0 "#strikethrough Экономика#!"
 NFP42_EVENTS_DISABLED:0 "#strikethrough События#!"
 NFP42_MORE:0 "… и ещё больше далее"
 NFP42_MORE_HINT:0 "Открыть следующие материалы этого выпуска"
 NFP42_SOCIETY_DISABLED:0 "#strikethrough Общество#!"
 NFP42_WAR_DISABLED:0 "#strikethrough Война#!"
 NFP43_ELECTION_BASELINE:0 "Сопоставление с выборной сводкой выпуска №[ScriptContainer.GetVariableValue('nfp43_previous_issue')|0]. Для сопоставимых партий: было → стало (изменение коэффициента). Знак «—» означает, что прежнего сопоставимого значения нет."
 NFP43_ELECTION_BODY_1:0 "Кампания продолжается, и положение партий ещё может измениться. Вот зафиксированные редакцией значения мотивации.\n\n[Localize(ScriptContainer.MakeScope.Var('nfp43_row_1').GetFlagName)]\n[Localize(ScriptContainer.MakeScope.Var('nfp43_row_2').GetFlagName)]\n[Localize(ScriptContainer.MakeScope.Var('nfp43_row_3').GetFlagName)]\n[Localize(ScriptContainer.MakeScope.Var('nfp43_row_4').GetFlagName)]\n[Localize(ScriptContainer.MakeScope.Var('nfp43_row_5').GetFlagName)]\n[Localize(ScriptContainer.MakeScope.Var('nfp43_row_6').GetFlagName)]\n\n[SelectLocalization(GreaterThan_CFixedPoint(ScriptContainer.GetVariableValue('nfp43_previous_issue'), '(CFixedPoint)0'), 'NFP43_ELECTION_BASELINE', 'NFP43_ELECTION_FIRST')]\n\nЭто промежуточная сводка мотивации партий, а не итоги выборов и не доли ожидаемых голосов. Мотивация влияет на кампанию, но сама по себе не определяет победителя. Показано не более шести партий с наибольшим значением на момент печати; числа — исходные коэффициенты игры."
 NFP43_ELECTION_BODY_2:0 "Предвыборная борьба остаётся открытой. Сопоставляем мотивацию партий, не выдавая её за подсчитанные бюллетени.\n\n[Localize(ScriptContainer.MakeScope.Var('nfp43_row_1').GetFlagName)]\n[Localize(ScriptContainer.MakeScope.Var('nfp43_row_2').GetFlagName)]\n[Localize(ScriptContainer.MakeScope.Var('nfp43_row_3').GetFlagName)]\n[Localize(ScriptContainer.MakeScope.Var('nfp43_row_4').GetFlagName)]\n[Localize(ScriptContainer.MakeScope.Var('nfp43_row_5').GetFlagName)]\n[Localize(ScriptContainer.MakeScope.Var('nfp43_row_6').GetFlagName)]\n\n[SelectLocalization(GreaterThan_CFixedPoint(ScriptContainer.GetVariableValue('nfp43_previous_issue'), '(CFixedPoint)0'), 'NFP43_ELECTION_BASELINE', 'NFP43_ELECTION_FIRST')]\n\nЭто промежуточная сводка мотивации партий, а не итоги выборов и не доли ожидаемых голосов. Мотивация влияет на кампанию, но сама по себе не определяет победителя. Показано не более шести партий с наибольшим значением на момент печати; числа — исходные коэффициенты игры."
 NFP43_ELECTION_FIRST:0 "Предыдущего опубликованного среза этой кампании ещё нет. Знаком «—» отмечены партии без сопоставимого прежнего значения."
 NFP43_ELECTION_LEAD_1:0 "У нас продолжается избирательная кампания. Партии стараются набрать ход, и редакция следит, как меняются их возможности в этой борьбе. Победных речей пока не печатаем: для них недостаёт одной небольшой подробности — результатов голосования."
 NFP43_ELECTION_LEAD_2:0 "У нас продолжается избирательная кампания. Партии стараются набрать ход, и редакция следит, как меняются их возможности в этой борьбе. Победных речей пока не печатаем: для них недостаёт одной небольшой подробности — результатов голосования."
 NFP43_ELECTION_METRICS:0 "Снимок при печати; тип 24, рубрика «Общество». Сравнение сохраняется только с последней опубликованной выборной сводкой этой же кампании. Пропущенный при отборе кандидат не обновляет базу. Начало новой кампании и впервые увиденная партия не создают выдуманную историю. Значения и порядок заморожены, названия партий могут меняться вместе с игрой."
 NFP43_ELECTION_PARTY_1:0 "[ScriptContainer.MakeScope.Var('nfp43_party_1').GetParty.GetName]"
 NFP43_ELECTION_PARTY_2:0 "[ScriptContainer.MakeScope.Var('nfp43_party_2').GetParty.GetName]"
 NFP43_ELECTION_PARTY_3:0 "[ScriptContainer.MakeScope.Var('nfp43_party_3').GetParty.GetName]"
 NFP43_ELECTION_PARTY_4:0 "[ScriptContainer.MakeScope.Var('nfp43_party_4').GetParty.GetName]"
 NFP43_ELECTION_PARTY_5:0 "[ScriptContainer.MakeScope.Var('nfp43_party_5').GetParty.GetName]"
 NFP43_ELECTION_PARTY_6:0 "[ScriptContainer.MakeScope.Var('nfp43_party_6').GetParty.GetName]"
 NFP43_ELECTION_PARTY_GONE:0 "Название партии больше недоступно"
 NFP43_ELECTION_ROW_COMPARE_1:0 "1. [SelectLocalization(ScriptContainer.MakeScope.Var('nfp43_party_1').IsSet, 'NFP43_ELECTION_PARTY_1', 'NFP43_ELECTION_PARTY_GONE')]: [ScriptContainer.GetVariableValue('nfp43_previous_1')|2] → [ScriptContainer.GetVariableValue('nfp43_now_1')|2] ([ScriptContainer.GetVariableValue('nfp43_delta_1')|+=2])"
