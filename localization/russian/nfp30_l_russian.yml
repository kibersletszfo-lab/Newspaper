 NFP52_CHINA_1_BODY:0 "Китай утратил прежнее государственное единство. Привычное большое пятно на карте теперь скрывает несколько центров власти. Для дипломата это новые адреса. Для человека, которому нужно вести дела по другую сторону новой границы, — вопрос о том, какие прежние договорённости ещё чего-нибудь стоят.\n\nПрежняя единая власть распалась. Самостоятельным правительствам предстоит определять отношения друг с другом, а остальному миру — разбираться, с кем теперь договариваться. Название страны по-прежнему знакомо каждому читателю. Ответ на вопрос, кто говорит от её имени, стал гораздо сложнее.\n\nЗа новой картой остаётся повседневная жизнь. Людям нужны работа, торговля и понятные правила, даже когда власти заняты выяснением, чьи правила главнее. Чем закончится китайская раздробленность, покажет время. Хотелось бы, чтобы платить за эти поиски пришлось не тем, кто меньше всего мог на них повлиять.\n\nХроника датирована месяцем получения известия редакцией. При задержке связи само событие могло произойти раньше."
