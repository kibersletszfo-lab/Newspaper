 NFP52_JAP_2_TITLE:0 "В Японии меняется порядок власти"
 NFP52_METRICS:0 "Мировое событие. Получено: [Localize(ScriptContainer.MakeScope.Var('nfp30_month').GetFlagName)], [ScriptContainer.GetVariableValue('nfp20_year')|0] г. Однократное сообщение после начала наблюдений."
 NFP52_PANAMA_1_BODY:0 "Панамский канал достроен. Между Атлантическим и Тихим океанами появился новый проход. На бумаге разделяющая их суша выглядит довольно узкой. Строителям, надо полагать, одной этой утешительной мысли было бы недостаточно. Теперь за линией на карте стоит завершённое сооружение.\n\nСтроительство канала окончено. Океанские маршруты получили новую возможность, а прежние представления о пути между двумя океанами требуют пересмотра. Масштаб перемены понятен и без праздничного подсчёта каждой будущей выгоды: появился проход, которого прежде не было.\n\nТеперь за инженерным достижением последуют хозяйственные расчёты. Новый путь ещё нужно использовать, а его преимущества — превратить в полезные дела. Но повод для поздравлений уже вполне осязаем. Иногда сблизить разные стороны мира удаётся буквально.\n\nХроника датирована месяцем получения известия редакцией. При задержке связи само событие могло произойти раньше."
 NFP52_PANAMA_1_CONTEXT:0 "Теперь за инженерным достижением последуют хозяйственные расчёты. Новый путь ещё нужно использовать, а его преимущества — превратить в полезные дела. Но повод для поздравлений уже вполне осязаем. Иногда сблизить разные стороны мира удаётся буквально."
