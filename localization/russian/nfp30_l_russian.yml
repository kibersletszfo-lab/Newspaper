 NFP52_ACW_2_BODY:0 "В Соединённых Штатах началась гражданская война. Есть новости, после которых привычное название страны приходится читать иначе. Американский союз теперь спорит о своём будущем оружием. За словами о единстве и праве на собственный путь стоит тяжёлый вопрос: сколько людям придётся пережить, прежде чем спор закончится.\n\nСоединённые Штаты вступили в войну с отделившимся американским государством. Политическое противостояние перешло ту черту, за которой решения принимают уже не только за столом переговоров. Теперь от исхода боевых действий зависит и будущее самого союза.\n\nДля остального мира это больше, чем далёкая американская ссора. Меняется положение страны, с которой торгуют, договариваются и связывают собственные планы. Но прежде всего война касается тех, кому приходится жить внутри этого раскола. Хотелось бы скорее писать об условиях мира, чем привыкать к очередным известиям о продолжении войны.\n\nДата заметки обозначает месяц, когда редакция получила подтверждение. Она не устанавливает точный день самого события."
