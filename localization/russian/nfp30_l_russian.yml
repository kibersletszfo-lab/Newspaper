 NFP52_GER_2_TITLE:0 "Германское объединение состоялось"
 NFP52_ITA_1_BODY:0 "Италия объединилась. О ней можно было говорить как о земле, культуре и надежде на общее будущее. Теперь к этому прибавилось государство. Для тех, кто видел в объединении цель, настало время поздравлений. А вместе с ним — время выяснять, как жить вместе после торжественных речей.\n\nИтальянское государство сформировано. На политической карте Средиземноморья появилось объединение, которое соседям придётся учитывать в собственных расчётах. Прежняя привычка рассматривать итальянские земли по отдельности уже не объясняет нового положения.\n\nОбщая власть получила общие заботы. Одного знамени мало, чтобы дороги, хозяйство и интересы разных земель сразу согласились между собой. Но теперь есть государство, которому предстоит заниматься этими вопросами. Объединение состоялось. Посмотрим, чем его наполнят.\n\nХроника датирована месяцем получения известия редакцией. При задержке связи само событие могло произойти раньше."
