 NFP52_FLU_2_TITLE:0 "Мир перед новой эпидемией"
 NFP52_GER_1_BODY:0 "Германия стала единым государством. Название давно знакомо читателям, а вот политическая карта теперь требует нового взгляда. За общим именем появилась общая власть. Тем, кто привык строить расчёты на германской раздробленности, придётся пересмотреть кое-что посущественнее атласа.\n\nГерманское государство сформировано. Объединение земель стало состоявшимся политическим событием, с которым соседям предстоит считаться. Насколько широки его границы и возможности — отдельный разговор. Но обсуждать Германию исключительно как множество отдельных государств уже поздно.\n\nСобрать страну — достижение, обустроить её — следующая работа. За торжествами остаются вопросы общих правил, хозяйства и отношений с соседями. Новое имя на карте уже есть. Теперь особенно интересно, какие дела будут с ним связывать.\n\nХроника датирована месяцем получения известия редакцией. При задержке связи само событие могло произойти раньше."
