 NFP50_LAW_INTRO_AWAY_1:0 "За рубежом изменили закон. Чужие порядки удобно обсуждать с безопасного расстояния. Но иногда такая новость заставляет присмотреться и к собственным: что у нас устроено иначе и довольны ли мы этим различием?"
 NFP50_LAW_INTRO_AWAY_2:0 "За рубежом изменили закон. Чужие порядки удобно обсуждать с безопасного расстояния. Но иногда такая новость заставляет присмотреться и к собственным: что у нас устроено иначе и довольны ли мы этим различием?"
 NFP50_LAW_INTRO_HOME_1:0 "У нас изменился закон. Правила, по которым живёт страна, редко устраивают всех одинаково: одному открывают дверь, другому напоминают, что ключ теперь не у него. Посмотрим, что именно изменилось и кому новая запись в своде законов пришлась по душе."
 NFP50_LAW_INTRO_HOME_2:0 "У нас изменился закон. Правила, по которым живёт страна, редко устраивают всех одинаково: одному открывают дверь, другому напоминают, что ключ теперь не у него. Посмотрим, что именно изменилось и кому новая запись в своде законов пришлась по душе."
 NFP50_LAW_MEANING_LAW_COMPULSORY_PRIMARY_SCHOOL_1:0 "Детям полагается учиться, а детский труд ограничивается. Закон позволяет расширить школьное дело. За этим стоит вполне понятная возможность: начать взрослую жизнь, умея читать, а не только трудиться. Правда, между обязательной школой на бумаге и местом за партой ещё нужны сами школы и средства на них. Буквы от строгости постановления в голову не переселяются."
 NFP50_LAW_MEANING_LAW_COMPULSORY_PRIMARY_SCHOOL_2:0 "Детям полагается учиться, а детский труд ограничивается. Закон позволяет расширить школьное дело. За этим стоит вполне понятная возможность: начать взрослую жизнь, умея читать, а не только трудиться. Правда, между обязательной школой на бумаге и местом за партой ещё нужны сами школы и средства на них. Буквы от строгости постановления в голову не переселяются."
 NFP50_LAW_MEANING_LAW_GUARANTEED_LIBERTIES_1:0 "Внутреннюю безопасность ограничили гарантиями свобод. Забота о порядке должна считаться с правами жителей. Это особенно приятно помнить тому, чьё мнение отличается от удобного. Многое теперь зависит от работы внутренних органов: красивое обещание свободы заслуживает достойного продолжения за пределами печатного листа."
 NFP50_LAW_MEANING_LAW_GUARANTEED_LIBERTIES_2:0 "Внутреннюю безопасность ограничили гарантиями свобод. Забота о порядке должна считаться с правами жителей. Это особенно приятно помнить тому, чьё мнение отличается от удобного. Многое теперь зависит от работы внутренних органов: красивое обещание свободы заслуживает достойного продолжения за пределами печатного листа."
 NFP50_LAW_MEANING_LAW_PROTECTED_SPEECH_1:0 "Свободное слово получило защиту закона. Государство лишается прежних способов подавлять одни общественные движения и поощрять другие. Для спора это важная перемена: убедительность доводов теперь труднее заменить удобством запрета. Хотелось бы, чтобы от большего простора для слов прибавилось и мыслей."
 NFP50_LAW_MEANING_LAW_PROTECTED_SPEECH_2:0 "Свободное слово получило защиту закона. Государство лишается прежних способов подавлять одни общественные движения и поощрять другие. Для спора это важная перемена: убедительность доводов теперь труднее заменить удобством запрета. Хотелось бы, чтобы от большего простора для слов прибавилось и мыслей."
 NFP50_LAW_MEANING_LAW_SLAVERY_BANNED_1:0 "Рабство больше не считается законным. Человек перестаёт быть чужой собственностью — перемена, которую трудно назвать простой правкой в бумагах. Свобода сама по себе ещё не даёт заработка и равного положения в обществе. Но теперь хотя бы нельзя законно распоряжаться человеком так же, как вещами в собственном доме."
 NFP50_LAW_MEANING_LAW_SLAVERY_BANNED_2:0 "Рабство больше не считается законным. Человек перестаёт быть чужой собственностью — перемена, которую трудно назвать простой правкой в бумагах. Свобода сама по себе ещё не даёт заработка и равного положения в обществе. Но теперь хотя бы нельзя законно распоряжаться человеком так же, как вещами в собственном доме."
 NFP50_LAW_MEANING_LAW_WOMENS_SUFFRAGE_1:0 "Женщины получили больше прав участвовать в политической жизни. Теперь разговор о будущем страны труднее вести так, словно её население состоит только из мужчин. Как именно действует новое право, зависит и от устройства выборов. Но повод пересмотреть привычное представление о том, кто вправе решать общие дела, уже появился."
 NFP50_LAW_MEANING_LAW_WOMENS_SUFFRAGE_2:0 "Женщины получили больше прав участвовать в политической жизни. Теперь разговор о будущем страны труднее вести так, словно её население состоит только из мужчин. Как именно действует новое право, зависит и от устройства выборов. Но повод пересмотреть привычное представление о том, кто вправе решать общие дела, уже появился."
 NFP50_LAW_MOVEMENT_BASE_1:0 "Общественные движения также имеют свои предпочтения. [SelectLocalization(GreaterThan_CFixedPoint(ScriptContainer.GetVariableValue('nfp50_law_move_yes_present'), '(CFixedPoint)0'), 'NFP50_LAW_MOVE_YES', 'NFP50_LAW_NO_MOVE')] [SelectLocalization(GreaterThan_CFixedPoint(ScriptContainer.GetVariableValue('nfp50_law_move_no_present'), '(CFixedPoint)0'), 'NFP50_LAW_MOVE_NO', 'NFP50_LAW_NO_MOVE')] По этим позициям видно, кому закон близок, а кому поперёк горла. Кто именно добился его принятия — отдельный вопрос."
