 NFP52_YUG_1_TITLE:0 "На Балканах образована Югославия"
 NFP52_YUG_2_BODY:0 "На Балканах появилось югославское государство. Идея общего устройства получила политическую форму. Для края, к которому часто обращаются международные расчёты, это событие особого значения: теперь в этих расчётах есть новое государство.\n\nОбразование Югославии подтверждено. Южнославянское объединение стало фактом политической карты. Состав его земель и отношения с соседями требуют внимательного рассмотрения, но прежние представления о положении региона уже нельзя просто перенести в новую сводку.\n\nОбщее имя — начало совместной работы. Разные интересы предстоит согласовывать в повседневных делах, когда торжества закончатся. Хотелось бы, чтобы единство оказалось полезным не только для составителей карт. Людям предстоит жить внутри новых границ, а не любоваться ими с расстояния.\n\nДата заметки обозначает месяц, когда редакция получила подтверждение. Она не устанавливает точный день самого события."
