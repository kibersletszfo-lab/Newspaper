 NFP52_TAIPING_1_TITLE:0 "В Китае возникло государство тайпинов"
 NFP52_TAIPING_2_BODY:0 "В Китае появилось государство тайпинов. Противостояние получило самостоятельный политический центр. Теперь вопрос состоит не только в том, чем недовольны противники прежнего порядка, но и в том, какую власть они предлагают вместо него.\n\nНебесное государство существует как отдельная политическая сила. Китайский кризис приобрёл новую форму, и привычного рассказа об очередных волнениях для его описания уже недостаточно. На месте спора с властью возникла власть, претендующая на собственное место.\n\nЗа большими притязаниями остаётся жизнь людей. Каким окажется дальнейшее противостояние и кто сумеет удержать власть, пока не решено. Будем следить за событиями, помня, что для жителей этих земель перемена на карте означает гораздо больше, чем новую строку в зарубежной хронике.\n\nДата заметки обозначает месяц, когда редакция получила подтверждение. Она не устанавливает точный день самого события."
 NFP52_TAIPING_2_CONTEXT:0 "За большими притязаниями остаётся жизнь людей. Каким окажется дальнейшее противостояние и кто сумеет удержать власть, пока не решено. Будем следить за событиями, помня, что для жителей этих земель перемена на карте означает гораздо больше, чем новую строку в зарубежной хронике."
 NFP52_TAIPING_2_FACT:0 "Небесное государство существует как отдельная политическая сила. Китайский кризис приобрёл новую форму, и привычного рассказа об очередных волнениях для его описания уже недостаточно. На месте спора с властью возникла власть, претендующая на собственное место."
 NFP52_TAIPING_2_LEAD:0 "В Китае появилось государство тайпинов. Противостояние получило самостоятельный политический центр. Теперь вопрос состоит не только в том, чем недовольны противники прежнего порядка, но и в том, какую власть они предлагают вместо него."
 NFP52_TAIPING_2_TITLE:0 "Китайский кризис получил новую власть"
 NFP52_YUG_1_BODY:0 "На Балканах появилось югославское государство. Идея общего устройства получила политическую форму. Для края, к которому часто обращаются международные расчёты, это событие особого значения: теперь в этих расчётах есть новое государство.\n\nОбразование Югославии подтверждено. Южнославянское объединение стало фактом политической карты. Состав его земель и отношения с соседями требуют внимательного рассмотрения, но прежние представления о положении региона уже нельзя просто перенести в новую сводку.\n\nОбщее имя — начало совместной работы. Разные интересы предстоит согласовывать в повседневных делах, когда торжества закончатся. Хотелось бы, чтобы единство оказалось полезным не только для составителей карт. Людям предстоит жить внутри новых границ, а не любоваться ими с расстояния.\n\nХроника датирована месяцем получения известия редакцией. При задержке связи само событие могло произойти раньше."
 NFP52_YUG_1_CONTEXT:0 "Общее имя — начало совместной работы. Разные интересы предстоит согласовывать в повседневных делах, когда торжества закончатся. Хотелось бы, чтобы единство оказалось полезным не только для составителей карт. Людям предстоит жить внутри новых границ, а не любоваться ими с расстояния."
