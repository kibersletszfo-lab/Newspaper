 NFP65_AWAY_HALF:0 "Теперь грамотных в этой стране — не меньше половины. Красивая отметка сама по себе ничего не переворачивает: в день её достижения не открываются разом все книги и не исчезают прежние трудности. Но умение читать становится доступно всё большей части общества. Для человека это возможность самому разобраться в написанном. Для страны — более прочная основа, на которой можно строить дальнейшие планы."
 NFP65_AWAY_THREE:0 "Доля грамотных достигла трёх четвертей населения. Уже достаточно, чтобы говорить о заметном распространении образования, а не об умении узкого круга людей. Правда, оставшаяся четверть — тоже не досадная помарка в отчёте. Хорошая общая цифра не объясняет, насколько легко учиться в разных областях и кому знания по-прежнему даются труднее. Но само достижение от этого меньше не становится."
 NFP65_AWAY_TITLE:0 "За рубежом прибавилось грамотных"
 NFP65_COMPARE_AHEAD:0 "Наша страна по доле грамотных пока отстаёт. По этой части у них есть преимущество, и отмахнуться от него словами «зато у нас…» было бы слишком удобно. Можно гордиться собственными успехами и всё-таки замечать чужие. Тем более что между поздравлением и полезным вопросом расстояние небольшое: что помогло им добиться результата и как обстоят дела у нас?"
 NFP65_COMPARE_BEHIND:0 "Наша страна по доле грамотных пока впереди. Приятная подробность, спорить не будем. Однако чужое достижение — не повод снисходительно поправлять собственные лавры. Из того, что мы оказались выше в нынешней сводке, ещё не следует, что место закреплено за нами навсегда. Хорошо иметь преимущество. Ещё лучше — не превращать его в воспоминание."
 NFP65_COMPARE_EQUAL:0 "По доле грамотных наши страны сейчас стоят рядом. Можно удовлетворённо отметить, что мы не уступаем, и перевернуть страницу. Только равенство общих цифр ещё не означает, что образование устроено одинаково и одинаково доступно всем. За похожей строкой отчёта могут стоять разные истории. Сравнить их было бы интереснее, чем торжественно объявить ничью."
 NFP65_COMPARE_UNKNOWN:0 "Для уверенного сравнения с нашей страной сведений пока недостаточно. Было бы удобно немедленно определить, кого поздравлять особенно громко, а кому советовать поторопиться. Но газетное соревнование без надёжных результатов слишком легко выигрывает тот, кто его описывает. Достигнутый рубеж отметим, а места распределять пока не станем."
 NFP65_END_COLD_PARTNER:0 "Общие договорённости не избавили наши страны от взаимного недовольства. Тем полезнее замечать не только то, что удобно для очередного спора. У партнёра есть результат в образовании. Любить его за это необязательно, а вот понять, что за результатом стоит, было бы небесполезно."
 NFP65_END_FRIEND:0 "Партнёра можно поздравить без дипломатического скрежета зубов. Было бы приятно, если бы вслед за любезностями нашлось место и разговору о полезном опыте. Списывать чужую цифру в свой отчёт нехорошо. Учиться тому, что помогло её получить, — совсем другое дело."
 NFP65_END_NEUTRAL:0 "Перемену отметили, повод для сравнения получили. Дальше было бы интересно узнать, как достигнутый результат скажется на жизни самой страны. А пока заглянем и в собственную сводку: чужие новости иногда особенно полезны тем, что заставляют внимательнее прочесть свои."
 NFP65_END_OVERLORD:0 "За развитием этой державы нам приходится следить особенно внимательно. Её успехи не становятся автоматически нашими, как и её грамотность не появляется у нас вместе с очередным распоряжением. Полезный опыт можно перенимать. Собственную работу над образованием он всё равно не отменяет."
 NFP65_END_REBELLIOUS:0 "Отношения с зависимой страной спокойными не назовёшь. При этом рост грамотности сам по себе ещё не объясняет её стремления к самостоятельности. Смешать два известия в одно удобное объяснение было бы просто. Разобраться в каждом — сложнее, но для понимания происходящего полезнее."
 NFP65_END_RIVAL:0 "Чужое достижение не становится нашим поражением. Но и исчезнуть от удачно подобранной насмешки оно не обязано. Лучше оставить сопернику его поздравления и присмотреться к собственной сводке. Хотелось бы, чтобы остроумие оставалось нашим достоинством, а не главным ответом на чужие успехи."
 NFP65_END_SUBJECT:0 "Хорошую новость из зависимой страны стоит заметить и без напоминания о причитающихся нам выплатах. Её развитие не сводится к пользе для нашей казны. Хотелось бы, чтобы за этой отметкой последовали перемены, которые местные жители смогут оценить не только по прочитанной газете."
 NFP65_END_THREAT:0 "К нашему государству там относятся с намерениями, которые трудно назвать безобидными. Рост грамотности сам по себе не означает подготовки к войне. Но развитие страны, рассчитывающей давить на нас, заслуживает внимания и без военной трубы. Успокоительная мысль «это всего лишь образование» здесь была бы несколько легкомысленной."
 NFP65_HOME_END:0 "Повод гордиться страной появился. Всё больше людей могут прочесть написанное сами. А значит, между ними и знанием становится одним посредником меньше. Как именно сложился нынешний результат — история отдельная. Приписывать весь успех одной удачной мере без подробностей не будем.\n\nПусть эта история продолжается. Газете нужны читатели. Стране — люди, которые умеют читать не только газеты."
 NFP65_HOME_EXPECTATIONS:0 "Есть у образования и неудобная для правительства сторона: ожидания от жизни становятся выше. Грамотность помогает хозяйству развиваться, но не приучает людей довольствоваться меньшим. Получается занятное соседство: стране нужны образованные работники, а образованным работникам хочется лучше жить. Одними поздравлениями с успехами просвещения этот разговор вряд ли закончится."
 NFP65_HOME_HALF:0 "Теперь грамотных в нашей стране — не меньше половины. За этой отметкой стоит не только прибавление читателей газет. Образованному населению проще осваивать новые профессии, а стране — развивать науку и перенимать чужие открытия. Буквы постепенно складываются не только в слова, но и в возможности для хозяйства."
 NFP65_HOME_INTRO:0 "Уметь читать — удобная вещь. Можно самому разобрать объявление, прочесть письмо, заглянуть в книгу. Или узнать, что именно обещают в очередной речи, не полагаясь на пересказ человека, который запомнил только самое интересное. Для одного человека это повседневное умение. Для страны — перемена, которой стоит найти место на первой полосе."
 NFP65_HOME_PROFESSION:0 "Для жителей образование расширяет выбор работы. Освоить профессию инженера или заняться служебными бумагами проще, когда написанное не приходится каждый раз отдавать на чужое прочтение. Для предприятий это возможность находить подготовленных работников, для человека — попробовать выйти за пределы привычного заработка. Не обещание нового места и хорошей зарплаты. Но дверь, к которой прежде могло не быть даже ключа."
 NFP65_HOME_SCIENCE:0 "Наука получает больше простора для работы. Чем выше грамотность, тем больше исследовательских возможностей университетов страна способна использовать для собственных открытий. Чужие знания тоже распространяются быстрее: мало ведь услышать, что где-то придумали полезную вещь, — надо ещё разобраться, как она устроена. Конечно, одних грамотных людей для научного рывка недостаточно. Но и одними университетскими стенами его не обеспечить."
 NFP65_HOME_THREE:0 "Доля грамотных в нашей стране достигла трёх четвертей. Для хозяйства это уже серьёзная опора: больше возможностей готовить специалистов, развивать исследования и разбираться в том, что придумали за границей. Правда, оставшаяся четверть — тоже люди. Красивый отчёт их читать пока не научил."
 NFP65_HOME_TITLE:0 "Читателей прибыло. И дело не только в нашей газете"
 NFP65_OPEN_ALLY:0 "Наш союзник — [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName] — достиг нового рубежа грамотности. Приятно получить от партнёра известие, для которого не приходится разворачивать военную карту. На этот раз речь о людях, способных самостоятельно прочесть написанное. В том числе, надо полагать, и наши взаимные обязательства. Полезное умение для обеих сторон."
 NFP65_OPEN_ALLY_BLOC:0 "Наш союзник и участник общего блока — [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName] — достиг нового рубежа грамотности. В общей компании стало больше людей, способных прочесть газету, договор и мелкий шрифт под обещаниями. Для партнёров это хорошая новость. Правда, общая принадлежность к блоку ещё не делает чужие достижения нашими. Поздравить можно вместе. Учиться всё-таки придётся каждому у себя."
 NFP65_OPEN_BLOC:0 "Участник нашего блока — [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName] — достиг нового рубежа грамотности. Вести из общего круга держав не всегда касаются переговоров и распределения влияния. Иногда поводом становится образование. Новость на первый взгляд негромкая, но для страны, которая рассчитывает на собственное развитие, вполне существенная. Одними подписями под общими соглашениями далеко не уедешь."
 NFP65_OPEN_NEIGHBOR:0 "У нашего соседа — [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName] — достигнут новый рубеж грамотности. По такому случаю граница на карте осталась на месте, и тревожных телеграмм можно не рассылать. Но соседство состоит не только из пограничных столбов. Иногда полезно посмотреть, как идут дела за ними. Особенно когда появляется повод сравнить чужие успехи с собственными."
 NFP65_OPEN_OTHER:0 "Из страны [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName] пришло известие о новом рубеже грамотности. Не всякая зарубежная новость должна начинаться с войны, скандала или чьего-нибудь падения. Здесь повод другой: большая доля населения теперь умеет читать и писать. Событие без торжественного залпа, но с последствиями, которые могут оказаться долговечнее его эха."
 NFP65_OPEN_OVERLORD:0 "Наш сюзерен — [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName] — достиг нового рубежа грамотности. О переменах в стране, от которой зависит наша собственная, полезно знать не только по приходящим распоряжениям. На этот раз известие касается образования. Само по себе оно не меняет наших взаимоотношений, но показывает одну из сторон развития державы, с которой нам приходится считаться."
 NFP65_OPEN_RIVAL:0 "Наш соперник — [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName] — достиг нового рубежа грамотности. Можно было бы встретить известие удачной колкостью и на этом закончить. К сожалению для любителей простых решений, читать после неё там не разучатся. Поэтому прежде, чем упражняться в остроумии, посмотрим, что именно произошло. Для газетной насмешки несколько лишних сведений ещё никому не мешали."
 NFP65_OPEN_SUBJECT:0 "Из зависимой от нас страны — [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName] — пришло известие о новом рубеже грамотности. Её дела легко воспринимать как приложение к собственным: что производит, сколько приносит, насколько спокойно себя ведёт. Только живут там всё-таки люди, а не строки в нашей ведомости. И теперь большая доля этих людей умеет читать то, что в ведомостях написано."
 NFP66_AWAY_CONTEXT:0 "У страны появился заметный результат, с которым приходится считаться. Само место ещё не объясняет, за счёт чего она поднялась и как идут дела в разных отраслях. Но отмахнуться от перемены словами «это всего лишь цифры» было бы слишком удобно. Цифры тоже бывают содержательными. Особенно когда за ними стоит хозяйство, вошедшее в число крупнейших."
 NFP66_AWAY_FACT:0 "Перед вхождением в десятку страна занимала [ScriptContainer.GetVariableValue('nfp20_before')|0]-е место. Теперь — [ScriptContainer.GetVariableValue('nfp20_after')|0]-е. В числе крупнейших она отмечена уже во второй месячной сводке подряд. Это положение в сравнении общего объёма экономик. По достатку отдельной семьи места здесь не распределяют — иначе список мог бы выглядеть совсем иначе."
 NFP66_AWAY_TITLE:0 "В мировой хозяйственной десятке — новый участник"
 NFP66_END_COLD_PARTNER:0 "Общие договорённости не избавили нас от взаимных претензий. Однако чужое хозяйство от этого меньше не становится. Было бы полезнее разобраться в перемене, чем искать очередной способ доказать, что у неудобного партнёра ничего интересного происходить не может."
 NFP66_END_FRIEND:0 "Партнёра можно поздравить. Дальше было бы интересно посмотреть, во что выльется его хозяйственный успех и найдётся ли среди новых возможностей место для полезного сотрудничества. Общие фотографии на встречах — вещь приятная. Хотелось бы, чтобы ими польза партнёрства не ограничивалась."
 NFP66_END_NEUTRAL:0 "Перемену отметили, повод для наблюдения получили. Как новое положение скажется на жизни страны и её делах за рубежом, ещё предстоит увидеть. А пока можно заглянуть и в собственную сводку. Чужие хорошие новости иногда особенно полезны тем, какие вопросы после них хочется задать себе."
 NFP66_END_OVERLORD:0 "Его хозяйственный успех не становится автоматически нашим. При этом понимать возможности державы, от которой мы зависим, необходимо. Хотелось бы, чтобы собственное развитие занимало в наших планах не меньше места, чем наблюдение за её достижениями."
 NFP66_END_REBELLIOUS:0 "Отношения с зависимой страной спокойными не назовёшь. На этом фоне её новое хозяйственное положение заслуживает особого внимания. Объявлять место в десятке причиной стремления к самостоятельности было бы поспешно. Но делать вид, что размер её хозяйства вообще не имеет значения для наших отношений, — тоже."
 NFP66_END_RIVAL:0 "Чужое место в десятке — не повод немедленно объявлять нашу страну проигравшей. Но и успокаивать себя одной удачной насмешкой не хочется. Соперник получил заметный результат. Было бы приятно, если бы следующим нашим ответом стала собственная хорошая сводка, а не только хорошая острота."
 NFP66_END_SUBJECT:0 "За зависимой страной стоит видеть и её собственное хозяйство. Новое место — хороший повод внимательнее посмотреть на её развитие. Не только с вопросом, что ещё можно получить для нашей казны. Большой результат заслуживает разговора немного шире очередной ведомости о причитающемся."
 NFP66_END_THREAT:0 "К нашей стране там относятся с намерениями, которые трудно назвать безобидными. Вхождение в хозяйственную десятку само по себе ещё не строит армию и не начинает войну. Но оставлять без внимания возможности такой державы было бы легкомысленно. Тем более что считать чужие силы после неприятного сюрприза обычно поздновато."
 NFP66_HOME_CONTEXT:0 "Само движение в рейтинге ещё не рассказывает всей истории. Место зависит и от наших дел, и от того, что происходит у остальных. Известно главное: в нынешнем сравнении страна оказалась выше прежнего положения и закрепилась в десятке по двум наблюдениям. Объявлять это доказательством успеха каждой отрасли было бы слишком щедрым подарком для любого отчёта."
 NFP66_HOME_END:0 "Что хочется сказать в конце? Повод гордиться есть. Отказываться от него только потому, что в стране остаются проблемы, было бы странно. Ещё страннее — решить, что теперь о проблемах можно забыть.\n\nВ десятку мы вошли. Хотелось бы, чтобы хорошая жизнь тоже не осталась за дверью."
 NFP66_HOME_FACT:0 "Перед вхождением в десятку наша страна занимала [ScriptContainer.GetVariableValue('nfp20_before')|0]-е место. Теперь — [ScriptContainer.GetVariableValue('nfp20_after')|0]-е. Среди крупнейших мы отмечены уже во второй месячной сводке подряд. То есть поздравление не пришлось отменять сразу после того, как высохли чернила. Для начала неплохо."
 NFP66_HOME_INTRO:0 "Наша страна вошла в десятку крупнейших экономик мира. Приятная новость для тех, кто привык искать в международных сводках повод для национальной гордости. На этот раз повод есть. Можно расправить плечи, поправить воротник и посмотреть на результат поближе. Желательно прежде, чем начнутся торжественные речи."
 NFP66_HOME_LIVING:0 "Для жителей хорошая позиция в списке ещё не означает прибавки к достатку. Приятно знать, что живёшь в одной из крупнейших экономик мира. Но в лавке всё равно спросят деньги, а не место страны в международной сводке. Хотелось бы, чтобы хозяйственный вес ощущался не только в торжественности речей, но и в том, что люди могут себе позволить."
 NFP66_HOME_POTENTIAL:0 "Большое хозяйство даёт стране больше возможностей. За общим объёмом стоят предприятия, работа и товары, из которых складывается повседневная жизнь. Для государства это основа, на которую можно опереться в собственных планах. Правда, между «возможности есть» и «ими сумели воспользоваться» обычно помещается немало правительственной работы. Место в десятке её за нас не выполнит."
 NFP66_HOME_TITLE:0 "В мировой десятке — наше хозяйство"
 NFP66_OPEN_ALLY:0 "Наш союзник — [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName] — вошёл в десятку крупнейших экономик мира. Партнёру есть чем похвастаться на следующей встрече. Приятно, когда к общим договорённостям прилагается заметное хозяйство. Хотя записывать чужой результат в собственные достижения пока не будем: дружба дружбой, а сводка у каждого своя."
 NFP66_OPEN_ALLY_BLOC:0 "Наш союзник и участник общего блока — [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName] — вошёл в мировую хозяйственную десятку. В общей компании появился ещё один повод для торжественных речей. Было бы приятно, если бы за ними нашлось место и полезным делам. Всё-таки общий блок интересен не только тем, насколько внушительно выглядит список его участников."
 NFP66_OPEN_BLOC:0 "Участник нашего блока — [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName] — вошёл в десятку крупнейших экономик мира. Для общего круга держав это заметная перемена. Правда, чужое место в списке не прибавляет автоматически денег нашей казне. Зато даёт повод внимательнее посмотреть, как развивается хозяйство страны, с которой нас связывают общие договорённости."
 NFP66_OPEN_NEIGHBOR:0 "Наш сосед — [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName] — вошёл в десятку крупнейших экономик мира. За пограничными столбами появилось ещё одно основание для гордости. Соседям вообще свойственно время от времени давать повод посмотреть на собственные дела. Иногда громкими заявлениями. На этот раз — местом в хозяйственной сводке."
 NFP66_OPEN_OTHER:0 "Страна [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName] вошла в десятку крупнейших экономик мира. В списке появился новый участник, а вместе с ним — повод присмотреться к переменам за рубежом. Хозяйственный вес страны редко становится понятнее от одного громкого заявления. Международное сравнение даёт для разговора несколько больше оснований."
 NFP66_OPEN_OVERLORD:0 "Наш сюзерен — [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName] — вошёл в десятку крупнейших экономик мира. О хозяйственных возможностях этой державы нам полезно знать без напоминания из её столицы. На этот раз появилось и новое место в международной сводке. Для страны, от которой зависит наша собственная, подробность существенная."
 NFP66_OPEN_RIVAL:0 "Наш соперник — [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName] — вошёл в мировую хозяйственную десятку. Новость, для которой тёплые поздравления у нас найдутся не сразу. Впрочем, отсутствие поздравлений вряд ли изменит результат. Прежде чем объяснять, почему чужое достижение ничего не значит, стоит хотя бы прочесть, чего именно там достигли."
 NFP66_OPEN_SUBJECT:0 "Из зависимой от нас страны — [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName] — пришло известие о вхождении в мировую хозяйственную десятку. К её делам теперь есть дополнительный повод присмотреться. Иногда за привычной строкой о подчинении легко перестать замечать размер самого хозяйства. Международная сводка, как видим, этого не забыла."
 NFP67_AWAY_FACT:0 "Перед вхождением в тройку страна занимала [ScriptContainer.GetVariableValue('nfp20_before')|0]-е место. Теперь — [ScriptContainer.GetVariableValue('nfp20_after')|0]-е. Среди крупнейших производителей она отмечена уже во второй месячной сводке подряд."
 NFP67_AWAY_FIRST:0 "По нынешнему объёму выпуска она возглавляет мировой список. Это уже не просто место среди лидеров — выше в этой сводке никого нет."
 NFP67_AWAY_TITLE:0 "У мировых производителей — новый участник тройки"
 NFP67_AWAY_TOP:0 "До мирового первенства дело пока не дошло, но место среди крупнейших производителей страна получила. Отмахиваться от результата только потому, что он не первый, было бы странным способом самоутешения."
 NFP67_END_COLD_PARTNER:0 "Взаимных претензий у наших стран хватает. Но произведённого товара от них меньше не становится. Возможно, сопоставить результаты было бы полезнее, чем в очередной раз доказывать, что неудобный партнёр ничего заслуживающего внимания сделать не способен."
 NFP67_END_FRIEND:0 "Партнёра можно поздравить. Было бы приятно, если бы вслед за любезностями нашлось место и полезным взаимовыгодным переговорам. Впрочем, между дружбой государств и делами отдельных предприятий не всегда получается поставить знак равенства. Сам результат от этого менее интересным не становится."
 NFP67_END_NEUTRAL:0 "Перемену отметили, собственный результат сопоставили. Теперь будет интересно следить за продолжением. В отрасли, где наша страна сама принадлежит к крупнейшим производителям, чужая хорошая новость — вполне подходящий повод внимательнее посмотреть на свои дела."
 NFP67_END_OVERLORD:0 "Его производственный успех не становится автоматически нашим. При этом сопоставить возможности обеих стран полезно. Собственное место в отрасли хотелось бы понимать по результатам работы, а не только по положению в отношениях подчинения."
 NFP67_END_RIVAL:0 "Чужое достижение не требует от нас немедленно признать поражение. Зато даёт хороший повод посмотреть на собственную отрасль. Хотелось бы, чтобы следующий ответ был заметен не только читателям нашей газеты, но и составителям производственной сводки."
 NFP67_END_SUBJECT:0 "За зависимой страной стоит видеть её собственное хозяйство. Полученное место заслуживает внимания и без вопроса о том, какую пользу можно извлечь для нашей казны. Если же отношения с ней становятся напряжёнными, тем меньше оснований считать её возможности несущественной подробностью."
 NFP67_END_THREAT:0 "За возможностями этой державы нам приходится следить особенно внимательно. Сам по себе выпуск товара ещё не рассказывает, на что его направят и чего захотят добиться. Но оставлять без внимания производственную силу страны, рассчитывающей давить на нас, было бы легкомысленно."
 NFP67_EQUAL:0 "Мы производим примерно столько же. Здесь разговор уже не о далёком лидере, до которого остаётся только вздыхать. Результаты близки, и тем интереснее будет следить за продолжением. Газетное первенство можно объявить хоть сегодня. Производственное всё-таки придётся заслужить."
 NFP67_HOME_END:0 "Что хочется сказать в конце? В мировую тройку мы вошли. Хорошо бы теперь не ограничиться желанием поставить рядом с этим фактом красивую печать. Успех приятнее продолжать, чем вспоминать.\n\nТретье или второе место — уже достижение. Повод остановиться, пожалуй, так себе."
 NFP67_HOME_FACT:0 "Перед вхождением в тройку страна занимала [ScriptContainer.GetVariableValue('nfp20_before')|0]-е место. Теперь — [ScriptContainer.GetVariableValue('nfp20_after')|0]-е. Среди крупнейших производителей мы отмечены уже во второй месячной сводке подряд. То есть речь не о поздравлении, которое пришлось бы забирать обратно при следующем подсчёте. Само нынешнее место, впрочем, ещё предстоит удержать."
 NFP67_HOME_FIRST_END:0 "Что хочется сказать в конце? Первое место заслуживает поздравлений. Только производству после них всё равно придётся работать дальше. Лавры могут украсить торжество, но сырьё и исправное оборудование не заменят.\n\nВозглавить список удалось. Хотелось бы, чтобы удерживать результат получалось не только в праздничной речи."
 NFP67_HOME_FIRST_INTRO:0 "Наша страна стала крупнейшим в мире производителем товара «[Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]». В нынешней сводке по объёму выпуска выше нас никого нет. Приятная строка для национального самолюбия. Правда, хотелось бы, чтобы за поздравлениями не потерялись люди, чья повседневная работа вообще позволила её написать."
 NFP67_HOME_FIRST_TITLE:0 "Первое место — за нами"
 NFP67_HOME_INTRO:0 "Наша страна вошла в тройку крупнейших производителей товара «[Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]». Приятно получить известие, в котором отечественное хозяйство фигурирует не рядом со словами «опять не хватает». На этот раз повод другой: по объёму выпуска мы оказались среди мировых лидеров. Есть чем гордиться. Теперь посмотрим, что именно за этим стоит."
 NFP67_HOME_LIMIT:0 "Большой выпуск ещё не отвечает на все вопросы хозяйства. Удалось ли выгодно продать произведённое, хватает ли товара внутри страны, хорошо ли оплачивается работа — это уже другие стороны той же истории. Место в тройке их за нас не проверило. Но и сам результат от этого хуже не становится: среди производителей у нашей страны появился весомый довод для гордости."
 NFP67_HOME_TITLE:0 "В мировой тройке — наше производство"
 NFP67_HOME_WORK:0 "За местом в списке стоит настоящее производство. Товар не появляется от удачно составленного отчёта. Его выпускают предприятия, на которых работают люди, расходуются материалы и решаются повседневные задачи. Международная сводка отмечает общий результат. Было бы справедливо помнить, что складывается он из множества рабочих дней, которым отдельной торжественной речи обычно не достаётся."
 NFP67_LESS:0 "Наш собственный выпуск примерно на [ScriptContainer.GetVariableValue('nfp67_output_abs')|0]% меньше. По количеству произведённого товара другая страна сейчас впереди. Это не сравнение прибыли или достатка работников, но вполне понятная разница в результатах, которую надо стремиться сократить. Было бы интересно, чем мы сумеем ответить — кроме объяснения, почему сравнивать вообще не следовало."
 NFP67_MORE:0 "Наш собственный выпуск примерно на [ScriptContainer.GetVariableValue('nfp67_output_abs')|0]% больше. Приятно, спорить не будем. Но чужое вхождение в тройку — хороший повод следить за отраслью, а не снисходительно поправлять свои лавры. Преимущество полезнее поддерживать работой, чем напоминаниями о том, что оно у нас есть."
 NFP67_OPEN_ALLY:0 "Наш союзник — [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName] — вошёл в тройку крупнейших производителей товара «[Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]». Партнёру есть чем похвастаться. Для нас это тоже небезразличная отрасль: по этому товару наша страна сама входит в мировую пятёрку. Так что поздравление получается с некоторым профессиональным интересом... И завистью."
 NFP67_OPEN_ALLY_BLOC:0 "Наш союзник и участник общего блока — [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName] — вошёл в тройку крупнейших производителей товара «[Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]». В общей компании появился ещё один производственный успех. Правда, общий блок не делает чужие предприятия нашими. Тем интереснее посмотреть, как теперь выглядят результаты обеих стран."
 NFP67_OPEN_BLOC:0 "Участник нашего блока — [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName] — вошёл в тройку крупнейших производителей товара «[Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]». Новость касается отрасли, в которой мы сами занимаем заметное место. Здесь есть предмет для разговора содержательнее очередного обмена заверениями в общем процветании."
 NFP67_OPEN_NEIGHBOR:0 "Наш сосед — [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName] — вошёл в тройку крупнейших производителей товара «[Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]». За границей появился ещё один повод для хозяйственной гордости. На этот раз он касается товара, по которому наша страна сама входит в мировую пятёрку. Сравнить есть что — и без соревнования в громкости поздравлений."
 NFP67_OPEN_OTHER:0 "Страна [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName] вошла в тройку крупнейших производителей товара «[Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]». Для нас это не случайная подробность чужого хозяйства. Наша страна сама входит в пятёрку производителей этого товара, поэтому за переменами в отрасли есть смысл следить внимательнее."
 NFP67_OPEN_OVERLORD:0 "Наш сюзерен — [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName] — вошёл в тройку крупнейших производителей товара «[Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]». Мы тоже принадлежим к числу заметных производителей этого товара, поэтому известие заслуживает внимания не только из-за наших взаимоотношений. Появился вполне конкретный повод сопоставить результаты."
 NFP67_OPEN_RIVAL:0 "Наш соперник — [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName] — вошёл в тройку крупнейших производителей товара «[Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]». В этой отрасли у нас есть собственные интересы и собственное производство. Поэтому отделаться дежурным «ничего особенного» было бы слишком удобно. Лучше посмотрим, чего достигли они и как на этом фоне выглядим мы."
 NFP67_OPEN_SUBJECT:0 "Зависимая от нас страна — [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName] — вошла в тройку крупнейших производителей товара «[Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]». За привычной строкой о подчинении легко перестать замечать возможности этой страны. Производственная сводка предлагает о них вспомнить. Причём в отрасли, которая важна и нашему хозяйству."
 NFP67_UNKNOWN:0 "Надёжно сопоставить объёмы выпуска пока не получается. Места в списке известны, а вот размер разницы мы придумывать не станем. Для разговора о собственных возможностях нужна своя сводка, а не только впечатление от чужого достижения."
 NFP68_AWAY_CONTEXT_DOWN:0 "Возможностей стало меньше, но списывать страну со счетов рано. Международный статус не заменяет сведений о её хозяйстве, армии и договорённостях. Было бы удобно вместить всё это в одно короткое название. Только удобство здесь легко оборачивается ошибкой — особенно если на ней потом строить собственные расчёты."
 NFP68_AWAY_CONTEXT_RECOG:0 "Страна получила более выгодное положение для дальнейшего развития. Догонит ли она тех, кто раньше смотрел на неё свысока, пока неизвестно. Но привычного объяснения «она неполноценная» теперь недостаточно. Придётся смотреть на её дела. Впрочем, с этого стоило начинать и раньше."
 NFP68_AWAY_CONTEXT_UP:0 "У страны прибавилось возможностей проводить собственную политику. Нам полезно иметь это в виду, составляя свои планы. Новое положение само по себе не обещает ни полезного соглашения, ни неприятного столкновения. Зато прежняя привычка оценивать эту державу может начать отставать от её нынешних возможностей."
 NFP68_AWAY_FACT_DOWN:0 "Прежний статус страны — «[Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]», новый — «[Localize(ScriptContainer.MakeScope.Var('nfp20_extra_detail').GetFlagName)]». Её положение понизилось, вместе с ним сузились дипломатические возможности. Это ещё не рассказ о разорённой казне или беспомощной армии. Таких выводов одна перемена статуса за нас не сделает. Но прежний вес страны больше нельзя принимать как нечто неизменное."
 NFP68_AWAY_FACT_GP_DOWN:0 "Прежний статус страны — «Великая держава», новый — «[Localize(ScriptContainer.MakeScope.Var('nfp20_extra_detail').GetFlagName)]». Из высшего круга она выбыла. Прежние достижения от этого не исчезли, как не исчезла и сама страна. Однако рассчитывать на её международные возможности так, будто ничего не произошло, было бы странно."
 NFP68_AWAY_FACT_GP_UP:0 "Прежний статус страны — «[Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]», новый — «Великая держава». Она вошла в круг государств с наиболее широкими дипломатическими возможностями. Объявлять её хозяином мировой политики было бы щедрым поздравлением. Но делать вид, что изменилось только название, — уже щедрым подарком собственному спокойствию."
 NFP68_AWAY_FACT_RECOG:0 "Прежний статус страны — «[Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]», новый — «[Localize(ScriptContainer.MakeScope.Var('nfp20_extra_detail').GetFlagName)]»: она перешла в число признанных держав. Здесь изменился не только титул. Прежнее положение означало менее выгодные условия для ряда её дел. Теперь одна из преград осталась позади. Насколько удачно там воспользуются переменой — уже следующая история."
 NFP68_AWAY_FACT_UP:0 "Прежний статус страны — «[Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]», новый — «[Localize(ScriptContainer.MakeScope.Var('nfp20_extra_detail').GetFlagName)]». Её положение повысилось, а дипломатических возможностей стало больше. Это ещё не означает, что каждое предложение из её столицы теперь встретят согласием. Однако оснований подкреплять собственные планы влиянием у неё прибавилось."
 NFP68_AWAY_TITLE_DOWN:0 "Прежний вес, а тяжести меньше"
 NFP68_AWAY_TITLE_RECOG:0 "В списке признанных — пополнение"
 NFP68_AWAY_TITLE_UP:0 "В кругу держав стало теснее"
 NFP68_END_COLD_DOWN:0 "Порадоваться чужой неприятности при наших отношениях нетрудно. Труднее после этого толково решить, что делать с общими делами. Пока договорённости связывают нас, перемена в возможностях партнёра касается и наших планов. Здесь хотелось бы обойтись без торжества, которое первым же счётом испортит собственная выгода."
 NFP68_END_COLD_UP:0 "Общие договорённости не избавили нас от взаимных претензий. Но новые возможности неудобного партнёра от этого не исчезают. Присмотреться к ним будет полезнее, чем искать объяснение, почему чужой успех вообще не заслуживает внимания. Особенно если потом с этой страной всё равно придётся договариваться."
 NFP68_END_FRIEND_DOWN:0 "Не самая приятная новость для общего круга. Однако союз нужен не только затем, чтобы вместе перечислять успехи. Сейчас полезнее понять, как изменились возможности партнёра и чего ждать от совместных планов. От прежнего титула осталось меньше. Хотелось бы, чтобы от взаимного понимания стало больше."
 NFP68_END_FRIEND_UP:0 "Партнёра можно поздравить. Было бы приятно, если бы вслед за любезностями нашлось место и полезным взаимовыгодным переговорам. Его новые возможности не становятся нашими автоматически. Но повод поискать общую пользу вполне заслуживает большего, чем красивое письмо."
 NFP68_END_NEUTRAL_DOWN:0 "Мировая сводка стала другой, и нам полезно это заметить. Объяснять перемену чужими ошибками без разбора мы не станем. Но и держаться за прежнее представление о стране только потому, что оно давно знакомо, смысла мало. Карты стареют не только тогда, когда передвигаются границы."
 NFP68_END_NEUTRAL_UP:0 "Перемену отметили. Дальше будем смотреть на дела. Новый статус даёт стране больше оснований рассчитывать на собственные возможности. А нам — повод сверить привычные представления с нынешним положением. Хорошо, когда международные новости помогают вовремя исправить собственный расчёт."
 NFP68_END_OVERLORD_DOWN:0 "Его новое положение заслуживает внимания, но не поспешных обещаний. Прежняя зависимость не исчезает от одной перемены статуса. Прежде чем объявлять, что перед нами открылись все двери, полезно разобраться, какие из них вообще были заперты. И что теперь изменилось у самих замков."
 NFP68_END_OVERLORD_UP:0 "Его успех не становится автоматически нашим. Но понимать возможности державы, от которой мы зависим, необходимо. Хотелось бы, чтобы рядом с наблюдением за её возвышением оставалось место и для собственных планов. Чужое большое имя — ещё не готовое будущее нашей страны."
 NFP68_END_REBELLIOUS:0 "В отношениях с зависимой страной и без того хватает вопросов о самостоятельности. Новый статус не объясняет этих стремлений и сам по себе не предрешает их исхода. Но обсуждать её будущее, не замечая перемен в её возможностях, было бы слишком удобной привычкой. Прежде всего для нас."
 NFP68_END_RIVAL_DOWN:0 "Чужая неудача наверняка найдёт у нас благодарного читателя. Редакция его понимает. Только делать из неё вывод, что соперник больше ни на что не способен, пока не станет. Самоуспокоение — удовольствие доступное. Последствия иногда обходятся дороже."
 NFP68_END_RIVAL_UP:0 "Для нас это повод внимательнее посмотреть на собственные возможности. У недоброжелателя появился результат, который одной насмешкой не отменить. Хотелось бы, чтобы наш ответ тоже нашёл место в сводке достижений. В состязании остроумия победить приятно. Жаль, что дипломатических возможностей за это не прибавляют."
 NFP68_END_SUBJECT_DOWN:0 "Потеря прежнего положения не делает её затруднения исключительно чужим делом. От зависимой страны легко ждать исправного исполнения обязанностей. Полезно иногда посмотреть и на то, с какими возможностями ей теперь приходится их исполнять."
 NFP68_END_SUBJECT_UP:0 "За отношениями подчинения стоит видеть и собственное развитие этой страны. Её новые возможности заслуживают внимания не только с вопросом, что ещё можно получить для нашей казны. Хотелось бы, чтобы понимание её дел росло хотя бы не медленнее наших ожиданий от неё."
 NFP68_END_THREAT:0 "К нашей стране там относятся с намерениями, которые трудно назвать безобидными. Поэтому перемена их возможностей заслуживает отдельного внимания. Новый статус ещё не означает начавшуюся войну, а потеря прежнего не гарантирует спокойствия. Нам полезнее понимать, с кем имеем дело, чем надеяться, что нужный вывод уже написан в названии категории."
 NFP68_HOME_CONTEXT_DOWN:0 "Дипломатических возможностей у страны стало меньше. Не настолько, чтобы считать всякое собственное решение бесполезным. Но достаточно, чтобы присмотреться к своим делам без привычного «с нами всё равно посчитаются». Хотелось бы, чтобы нас замечали благодаря тому, что мы можем предложить, а не только тому, как громко напоминаем о прежнем положении."
 NFP68_HOME_CONTEXT_GP_DOWN:0 "Из круга великих держав мы выбыли. Вместе с прежним положением сузились и возможности страны влиять на международные дела. Это не значит, что завтра всякий сосед перестанет отвечать на наши письма. Но рассчитывать на прежний вес одного только имени теперь было бы слишком наивно. Особенно для тех, кому предстоит объяснять, куда этот вес делся."
 NFP68_HOME_CONTEXT_GP_UP:0 "Мы вошли в круг великих держав. У страны стало больше возможностей вести собственную дипломатическую игру и подкреплять свои предложения влиянием. Хорошо, когда к словам есть что приложить. Теперь особенно интересно, какие дела мы сочтём достойными этих возможностей. Величие ведь приятнее замечать по результатам, чем по размеру букв в собственном титуле."
 NFP68_HOME_CONTEXT_RECOG:0 "Старое различие было не только вопросом самолюбия. Непризнанное положение означало менее выгодные условия, в том числе для заимствований и распространения чужих знаний. Теперь условия изменились. Это ещё не означает, что казна сразу вздохнула свободнее, а каждое открытие добралось до нас быстрее. Но одной преградой стало меньше. Для начала — вполне достойная новость."
 NFP68_HOME_CONTEXT_UP:0 "Новое положение даёт стране больше дипломатических возможностей. Само по себе это ещё не приносит удачного соглашения и не превращает каждого собеседника в доброжелателя. Зато появляется больше пространства для собственных решений. Было бы приятно воспользоваться им прежде, чем всё свободное место займут поздравительные речи."
 NFP68_HOME_END_DOWN:0 "Что хочется сказать в конце? Неприятную перемену лучше заметить, чем обидеться на сводку. Причины ещё предстоит разобрать. Но искать их будет полезнее, чем доказывать, что прежнее положение нам никогда особенно не нравилось.\n\nТитул стал скромнее. Хотелось бы, чтобы наши планы при этом не скромничали."
 NFP68_HOME_END_RECOG:0 "Что хочется сказать в конце? Признание можно отметить. А после — заняться тем, ради чего вообще стоило добиваться более выгодного положения. Открытые возможности особенно приятны, когда ими пользуются.\n\nДверь перед нами открылась. Было бы странно потратить весь день на обсуждение таблички на ней."
 NFP68_HOME_END_UP:0 "Что хочется сказать в конце? Повод для гордости есть. Только хотелось бы, чтобы новое положение помогало решать старые вопросы, а не служило удобным ответом на любой из них.\n\nСтрана стала весомее. Хорошо бы, чтобы это ощущалось не только при перечислении её заслуг."
 NFP68_HOME_FACT:0 "Прежний статус — «[Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]», новый — «[Localize(ScriptContainer.MakeScope.Var('nfp20_extra_detail').GetFlagName)]». Именно такую перемену отметила нынешняя сводка. Это положение страны среди других держав. Оно заслуживает внимания, хотя само по себе ещё не рассказывает, за счёт каких успехов — или неприятностей — мы к нему пришли."
 NFP68_HOME_INTRO_DOWN:0 "Наша страна потеряла прежнее положение среди мировых держав. Не та новость, которую хочется ставить рядом с праздничной гравюрой. Можно, конечно, объявить, что чужие списки нас никогда особенно не занимали. Правда, пока место в них было повыше, вспоминали мы о нём с заметно большим удовольствием."
 NFP68_HOME_INTRO_NEUTRAL:0 "Наша страна получила другую категорию международного статуса. В сводке появилась перемена, к которой стоит присмотреться без поспешных поздравлений или сожалений."
 NFP68_HOME_INTRO_RECOG:0 "Наша страна теперь числится среди признанных держав. Не то чтобы до этого здесь никто не жил, не работал и не строил собственных планов. Просто в международных делах одного существования бывает недостаточно: желательно, чтобы его ещё согласились заметить остальные. Теперь прежняя пометка осталась позади. Посмотрим, что изменится вслед за ней."
 NFP68_HOME_INTRO_UP:0 "Наша страна поднялась на ступень выше среди мировых держав. Приятное известие. Особенно для тех, кому надоело встречать название родины где-то после слов «и другие». Теперь у национального самолюбия появился новый повод расправить плечи. Правда, хотелось бы, чтобы вместе с плечами расправились и наши возможности."
 NFP68_HOME_TITLE_DOWN:0 "Титул стал скромнее. А дела?"
 NFP68_HOME_TITLE_RECOG:0 "Наконец-то заметили"
 NFP68_HOME_TITLE_UP:0 "Теперь с нами придётся считаться"
 NFP68_NEUTRAL_CONTEXT:0 "Перемена требует отдельного разбора. За названием категории могут стоять разные обстоятельства, и подбирать им удобное объяснение заранее мы не станем."
 NFP68_NEUTRAL_END:0 "Будем смотреть на дальнейшие дела страны. Они расскажут о её возможностях больше, чем попытка угадать всю историю по одной строке."
 NFP68_NEUTRAL_FACT:0 "Прежний статус — «[Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]», новый — «[Localize(ScriptContainer.MakeScope.Var('nfp20_extra_detail').GetFlagName)]». Само различие названий ещё не позволяет сказать, что страна стала сильнее или слабее."
 NFP68_NEUTRAL_TITLE:0 "Изменилось положение страны"
 NFP68_OPEN_ALLY:0 "У нашего союзника — страны [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName] — изменился международный статус. Для нас это известие заслуживает большего внимания, чем очередная перестановка в чужом списке. Общие договорённости приятнее оценивать, понимая возможности того, с кем они заключены. Союзный договор, конечно, не весы. Но знать, какой вес имеет партнёр, всё-таки полезно."
 NFP68_OPEN_ALLY_BLOC:0 "Наш союзник и участник общего блока — [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName] — получил новый международный статус. Связей между нами достаточно, чтобы не отмахиваться от такой перемены словами «их дело». Их — безусловно. Но когда вместе строишь планы, чужие возможности довольно быстро становятся частью собственного расчёта."
 NFP68_OPEN_BLOC:0 "У участника нашего блока — страны [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName] — изменилось положение среди держав. Общая компания осталась прежней, а вот вес одного из её участников — уже нет. Для разговоров о совместных делах подробность существенная. Всё-таки блок интересен не только тем, сколько названий помещается под его знаменем."
 NFP68_OPEN_NEIGHBOR:0 "У нашего соседа — страны [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName] — изменился международный статус. Пограничные столбы от этого не передвинулись. Зато появился повод внимательнее посмотреть, кто находится по другую сторону. Соседей не выбирают, говорят нам. Но следить за их делами эта поговорка, к счастью, не запрещает."
 NFP68_OPEN_OTHER:0 "Из страны [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName] пришло известие о перемене её международного положения. Среди мировых держав иначе распределился вес, и эта история заслужила место в нашем выпуске. Само новое название категории ещё не объясняет всей перемены. Но даёт вполне определённый повод посмотреть на неё внимательнее."
 NFP68_OPEN_OVERLORD:0 "У нашего сюзерена — страны [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName] — изменился международный статус. Новость не становится нашей только потому, что между столицами есть обязательства. Но и совсем чужой её не назовёшь. Возможности державы, от которой мы зависим, заслуживают внимания без особого напоминания с её стороны."
 NFP68_OPEN_RIVAL:0 "Наш соперник — [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName] — теперь занимает другое положение среди держав. Тут прежде, чем радоваться или досадовать, стоит прочесть, что именно изменилось. Чужой титул не прибавляет нам сил и не отнимает их. А вот возможности страны, с которой приходится соперничать, могут оказаться важной информацией на будущее."
 NFP68_OPEN_SUBJECT:0 "Из зависимой от нас страны — [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName] — пришло известие о смене международного статуса. За привычной строкой о подчинении легко перестать замечать возможности этой страны. Между тем её положение меняется, и нам полезно понимать, что происходит за пределами очередной ведомости о причитающемся."
 NFP69_FACT:0 "В стране [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName] закон «[Localize(ScriptContainer.MakeScope.Var('nfp69_old').GetFlagName)]» сменился законом «[Localize(ScriptContainer.MakeScope.Var('nfp69_new').GetFlagName)]».\n\n[Localize(ScriptContainer.MakeScope.Var('nfp69_topic').GetFlagName)]"
 NFP69_HOME_OPEN:0 "У нас изменился закон. Прежние правила уступили место новым. Для одних жителей это может стать долгожданной переменой, для других — поводом пересмотреть привычные планы. Посмотрим, что именно теперь написано в законе."
 NFP69_LIMIT:0 "Новые правила уже приняты; теперь интересно, как они скажутся на делах страны. Само постановление — ещё не вся история. Мы вернёмся к ней, когда за строками закона появятся перемены, о которых стоит рассказать."
 NFP69_OPEN_ALLY:0 "От нашего союзника — [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName] — пришла весть о новом законе. Чужие порядки удобнее всего обсуждать издали. Но полезнее сначала прочесть, что изменилось: иногда после этого появляются вопросы и к собственным."
 NFP69_OPEN_ALLY_BLOC:0 "От нашего союзника и участника общего блока — [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName] — пришла весть о новом законе. Чужие порядки удобнее всего обсуждать издали. Но полезнее сначала прочесть, что изменилось: иногда после этого появляются вопросы и к собственным."
 NFP69_OPEN_BLOC:0 "От участника нашего блока — [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName] — пришла весть о новом законе. Чужие порядки удобнее всего обсуждать издали. Но полезнее сначала прочесть, что изменилось: иногда после этого появляются вопросы и к собственным."
 NFP69_OPEN_NEIGHBOR:0 "От нашего соседа — [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName] — пришла весть о новом законе. Чужие порядки удобнее всего обсуждать издали. Но полезнее сначала прочесть, что изменилось: иногда после этого появляются вопросы и к собственным."
 NFP69_OPEN_OTHER:0 "От зарубежной страны — [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName] — пришла весть о новом законе. Чужие порядки удобнее всего обсуждать издали. Но полезнее сначала прочесть, что изменилось: иногда после этого появляются вопросы и к собственным."
 NFP69_OPEN_OVERLORD:0 "От нашего сюзерена — [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName] — пришла весть о новом законе. Чужие порядки удобнее всего обсуждать издали. Но полезнее сначала прочесть, что изменилось: иногда после этого появляются вопросы и к собственным."
 NFP69_OPEN_RIVAL:0 "От нашего соперника — [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName] — пришла весть о новом законе. Чужие порядки удобнее всего обсуждать издали. Но полезнее сначала прочесть, что изменилось: иногда после этого появляются вопросы и к собственным."
 NFP69_OPEN_SUBJECT:0 "От зависимой от нас страны — [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName] — пришла весть о новом законе. Чужие порядки удобнее всего обсуждать издали. Но полезнее сначала прочесть, что изменилось: иногда после этого появляются вопросы и к собственным."
 NFP69_POLICY_LAW_AFFIRMATIVE_ACTION:0 "Закон предусматривает особую поддержку групп, прежде оттеснённых на обочину общественной жизни. Равноправие здесь понимается как помощь в преодолении накопленного неравенства, а не только одинаковая надпись над входом."
 NFP69_POLICY_LAW_AGRARIANISM:0 "Экономический курс отдаёт преимущество сельскому хозяйству и сельским общинам. Центр хозяйственного внимания расположен ближе к полю и деревне, чем к фабричной проходной."
 NFP69_POLICY_LAW_ANARCHY:0 "Местные сообщества управляются самостоятельно и отправляют временных делегатов в общие советы. Решения приходится согласовывать между общинами, поскольку постоянная командная лестница не положена в основу устройства."
 NFP69_POLICY_LAW_ANTI_STRIKE_LAWS:0 "Рабочие объединения допускаются, но забастовки и часть коллективных требований остаются запрещёнными. Организации разрешено существовать, однако некоторые её средства давления отсечены законом."
 NFP69_POLICY_LAW_APPOINTED_BUREAUCRATS:0 "Чиновников назначает власть, предоставляя им жалованье за государственную службу. Получать место и отвечать за работу им предстоит перед теми, кто подписывает назначение."
 NFP69_POLICY_LAW_AUTOCRACY:0 "Верховная власть сосредоточена у главы государства, не подотчётного другим земным властям. Последнее слово в таком устройстве заранее известно, даже когда ещё не известен предмет спора."
 NFP69_POLICY_LAW_BAKUFU:0 "Полнота власти принадлежит сёгуну, правящему от имени императора. Имя на вершине государственного порядка и рука, принимающая решения, здесь обозначают разные роли."
 NFP69_POLICY_LAW_CAESAROPAPISM:0 "У православной церкви остаются алтари, но в государственных делах последнее слово за светской властью. Для верующих других исповеданий закон равноправия не обещает."
 NFP69_POLICY_LAW_CANTON_SYSTEM:0 "Внешняя торговля допускается только через одну прибрежную область. Иностранному товару оставляют узкий вход, за которым государству удобнее следить."
 NFP69_POLICY_LAW_CENSORSHIP:0 "Печать подчинена цензуре, а право на собрания не предоставляется. Прежде чем слово доберётся до читателя, у власти есть возможность остановить его по дороге."
 NFP69_POLICY_LAW_CENSUS_VOTING:0 "К выборам допускают образованных мужчин, отвечающих установленному цензу. Грамотность и общественное положение становятся условиями входа в избирательный круг."
 NFP69_POLICY_LAW_CHARITABLE_HEALTH_SYSTEM:0 "Помощь больным возлагается на благотворительные организации, в том числе религиозные. Лечение зависит от средств тех, кто берётся помогать, поэтому пожертвование здесь имеет самое практическое значение."
 NFP69_POLICY_LAW_CHIEFDOM:0 "Власть строится вокруг родственных связей и вождя либо старейшины из знатного рода. Личный и родовой авторитет здесь заменяют разветвлённый аппарат управления большими областями."
 NFP69_POLICY_LAW_CHIEFS_DISTRIBUTE_AID:0 "Помощь нуждающимся членам рода, религиозным учреждениям и воинам распределяют вожди. Забота о поддержке проходит через родовую власть и её распоряжение общими средствами."
 NFP69_POLICY_LAW_CHILD_LABOR_ALLOWED:0 "Закон не устанавливает специальных ограничений на то, где могут работать дети. Детский труд остаётся частью хозяйства без отдельного запрета на опасные для возраста занятия."
 NFP69_POLICY_LAW_CLOSED_BORDERS:0 "Въезд и выезд для переселения запрещены. Граница становится препятствием и для желающего искать жизнь за рубежом, и для желающего обосноваться внутри страны."
 NFP69_POLICY_LAW_COLLECTIVIZED_AGRICULTURE:0 "Землю обрабатывают совместные коллективы земледельцев. Участок становится общим хозяйственным делом, в котором организация труда касается всей группы."
 NFP69_POLICY_LAW_COLONIAL_ADMINISTRATION:0 "Территорией управляют от имени метрополии, и собственным суверенитетом такое государство не обладает. Местная администрация распоряжается делами в пределах полномочий, полученных извне."
 NFP69_POLICY_LAW_COLONIAL_EXPLOITATION:0 "Колониальная политика ориентирована на природные богатства и дешёвый труд. В её основании лежит хозяйственная выгода от зависимых территорий, а не забота о переселенческом участке."
 NFP69_POLICY_LAW_COLONIAL_RESETTLEMENT:0 "Колонии предназначаются прежде всего для переселенцев из включённых областей страны. Земельный вопрос получает заморское направление: новые владения рассматривают как место для новых хозяйств."
 NFP69_POLICY_LAW_COLONIAL_SLAVERY:0 "Рабство разрешено в колониях, но человек освобождается, ступив на землю метрополии. Одно государство устанавливает две разные правовые участи по разные стороны своей территории."
 NFP69_POLICY_LAW_COMBINATION_ACTS:0 "Любые объединения работников запрещены законом. Работать вместе разрешается, а организоваться для защиты общих интересов — уже нет."
 NFP69_POLICY_LAW_COMMAND_ECONOMY:0 "Правительство непосредственно руководит основной частью производства. Главные хозяйственные решения сходятся в государственном аппарате, которому предстоит определять направления работы предприятий."
 NFP69_POLICY_LAW_COMMERCIALIZED_AGRICULTURE:0 "Сельское хозяйство организуется как рыночный бизнес, принадлежащий капиталу. Поле входит в тот же круг вложений и расчётов доходности, что и другие предприятия."
 NFP69_POLICY_LAW_COMMUNAL_ADMINISTRATION:0 "Повседневными делами заведуют рабочие организации. За общим столом в центре заседают те, кого они сами избрали."
 NFP69_POLICY_LAW_COMPULSORY_PRIMARY_SCHOOL:0 "Дети обязаны несколько лет посещать начальную школу и не могут работать в период этого обучения. В детском расписании закон отводит обязательное место грамоте вместо заработка."
 NFP69_POLICY_LAW_CONSUMPTION_BASED_TAXATION:0 "Казна собирает налоги через потребление товаров, а не через общий подоходный или подушный сбор. Налоговый вопрос возникает у прилавка: важен выбор облагаемых покупок."
 NFP69_POLICY_LAW_COOPERATIVE_OWNERSHIP:0 "Средства производства передаются в совместное владение работников, между которыми распределяется производственный излишек. Трудовой коллектив получает место и по рабочую, и по хозяйскую сторону предприятия."
 NFP69_POLICY_LAW_CORPORATE_STATE:0 "Государство организует сотрудничество официально признанных корпоративных групп и переговоры между общественными классами. Право говорить от имени интересов связано здесь с признанной организацией."
 NFP69_POLICY_LAW_CORPORATIZED_UNIONS:0 "Рабочие объединения находятся под прямым либо косвенным государственным контролем и ориентированы на сотрудничество классов. Организация труда должна вписываться в порядок согласования интересов, установленный властью."
 NFP69_POLICY_LAW_COUNCIL_REPUBLIC:0 "Рабочие выбирают представителей в местные советы, на которых строится государственное управление. Порядок представительства переносит организацию трудовых коллективов в устройство власти."
 NFP69_POLICY_LAW_CROWNLAND_DIETS:0 "Местное управление поручено традиционным собраниям из представителей региональной аристократии. Вопросы области обсуждают её знатные семьи — круг собеседников определён заранее."
 NFP69_POLICY_LAW_CULTURAL_EXCLUSION:0 "Культурное принятие распространяется на тех, у кого есть общие черты с основными культурами страны. Для культур без такой связи сохраняются ограничения: государство всё ещё требует доказательств сходства."
 NFP69_POLICY_LAW_DEBT_SLAVERY:0 "Неспособность расплатиться с долгом позволяет обратить должника в собственность кредитора. Долговое обязательство распространяется уже на свободу самого человека."
 NFP69_POLICY_LAW_DEDICATED_POLICE:0 "Учреждается профессиональная полиция с общими требованиями к подготовке. Охрана порядка становится специальной службой, для которой положены обучение и постоянные обязанности."
 NFP69_POLICY_LAW_DIPLOMATIC_NAVY:0 "Главный упор сделан на дальние крейсерские операции и присутствие в разных частях света. Дипломатия получает морскую службу, способную показывать флаг далеко от домашнего порта."
 NFP69_POLICY_LAW_ELDER_COUNCIL:0 "Право участвовать в управлении закреплено за старейшими и наиболее уважаемыми членами общества. Политический вес здесь связывают с возрастом и авторитетом, а не со всеобщим избирательным списком."
 NFP69_POLICY_LAW_ELECTED_BUREAUCRATS:0 "Местных губернаторов выбирает население областей. У должности появляется избирательный адрес: за местной властью стоит уже не одно решение столицы."
 NFP69_POLICY_LAW_ETHNOSTATE:0 "Гражданская принадлежность замыкается на определённой этнической группе, а чужие культуры подвергаются дискриминации. Право быть полноправным членом государства проверяют по происхождению."
 NFP69_POLICY_LAW_EXPANDED_LATIFUNDIAS:0 "Крупные поместья получают усиленную опору: закон повышает политический вес аристократии и отдачу её вложений, одновременно ослабляя политическое положение крестьян. Размер владения здесь подкрепляется преимуществом в хозяйственных и государственных делах."
 NFP69_POLICY_LAW_EXTRACTION_ECONOMY:0 "Колониальное хозяйство направлено на извлечение прибыли для метрополии. Мерилом устройства производства становится выгода внешнего центра, в чьих интересах оно организовано."
 NFP69_POLICY_LAW_EXTRAORDINARY_COMMISSION:0 "Для борьбы с саботажем и контрреволюцией учреждена особая массовая организация. Именно ей предстоит решать, за кем придут по такому обвинению."
 NFP69_POLICY_LAW_FACTORY_COUNCILS:0 "Рабочим советам открывается путь к коллективному управлению предприятиями, а политическое положение профсоюзов усиливается. Закон переносит вопрос о власти на производстве внутрь самого трудового коллектива."
 NFP69_POLICY_LAW_FREEDOM_OF_CONSCIENCE:0 "Официальная религия сохраняется, но свобода выбора веры расширяется; некоторые верования по-прежнему подвергаются дискриминации. У совести становится больше простора, хотя государство оставляет свои исключения."
 NFP69_POLICY_LAW_FREE_TRADE:0 "Устанавливается свободная торговля с сокращением государственных барьеров для обмена товарами. Предпринимателю открывается больше внешней конкуренции — и как продавцу, и как покупателю."
 NFP69_POLICY_LAW_FRONTIER_COLONIZATION:0 "Колонизационный курс сосредоточен на прилегающих к государству рубежах. Расширение поселений рассматривается как освоение пограничного пространства, а не как поиск любой далёкой земли."
 NFP69_POLICY_LAW_GRADUATED_TAXATION:0 "Обложение дивидендов должно перенести большую часть налогового бремени на состоятельных получателей доходов. Казна внимательнее смотрит на прибыль владельца капитала."
 NFP69_POLICY_LAW_GUARANTEED_LIBERTIES:0 "Органы внутренних дел должны заниматься жалобами и проблемами населения; задержания и слежка требуют веских оснований. Полномочия служащего теперь ограничивает право человека, к которому он явился."
 NFP69_POLICY_LAW_GUILD_SYSTEM:0 "Для ряда ремёсел и торговых занятий необходимо состоять в признанной гильдии. У профессии появляется коллективный привратник: одного желания заняться делом недостаточно."
 NFP69_POLICY_LAW_HEREDITARY_BUREAUCRATS:0 "Чиновничьи должности переходят от родителей к детям вместе со служебными обязанностями. Семейная преемственность добралась и до казённого письменного стола."
 NFP69_POLICY_LAW_HINDU_CASTE_CODIFIED:0 "Кастовые различия официально закреплены и используются для ограничения социальных и хозяйственных возможностей. Старому порядку выдали место в своде законов, где обычай становится формальным правилом."
 NFP69_POLICY_LAW_HINDU_CASTE_ENFORCED:0 "Кастовая иерархия поддерживается законом и ограничивает переход между общественными положениями. Происхождение здесь служит не только записью в родословной, но и границей дозволенного."
 NFP69_POLICY_LAW_HINDU_CASTE_NOT_ENFORCED:0 "Кастовая принадлежность больше не служит законным ограничением социального и хозяйственного продвижения. Родословная перестаёт быть официальным пропуском к возможностям, хотя привычки общества одним постановлением не отменяются."
 NFP69_POLICY_LAW_HOMESTEADING:0 "Фермеры закрепляют за собой участки и обрабатывают их вместе с наёмными работниками. Самостоятельное владение землёй сочетается с наймом: хозяин участка не обязательно трудится один."
 NFP69_POLICY_LAW_INDUSTRY_BANNED:0 "Тяжёлая промышленность и автоматизация отвергаются в пользу хозяйства, основанного на ручном труде. Механизму здесь приходится доказывать не выгодность, а само право на существование."
 NFP69_POLICY_LAW_INTERMEDIATE_EDO_SYSTEM:0 "Сословные ограничения смягчены, а состоятельные горожане и крестьяне могут купить положение гокэнин, самурая низшего ранга. Дверь в привилегированное сословие приоткрыта, хотя вход по-прежнему стоит денег."
 NFP69_POLICY_LAW_INTERNAL_COLONIZATION:0 "Поселенцев господствующей культуры направляют на внутренние окраины. Граница на государственной карте останется прежней, а вот кто будет жить по соседству — вопрос уже иной."
 NFP69_POLICY_LAW_INTERVENTIONISM:0 "Государство оставляет за собой вмешательство в частное хозяйство ради сдерживания его крайностей и поддержания устойчивости. Предпринимательская свобода здесь соседствует с правом власти поправить ход дела."
 NFP69_POLICY_LAW_ISOLATIONISM:0 "Хозяйство ориентируется на внутреннее обеспечение страны при отказе от обычной внешней торговли. Спрос и предложение должны встречаться преимущественно по свою сторону границы."
 NFP69_POLICY_LAW_JEUNE_ECOLE:0 "Флот строится вокруг небольших, хорошо вооружённых кораблей, предназначенных для борьбы с более крупными противниками. Морской расчёт делает ставку на вооружение малого судна, а не только на размеры корпуса."
 NFP69_POLICY_LAW_LABOUR_SUFFRAGE:0 "Право голоса теперь связано с тем, чем человек живёт. Зарабатываешь трудом — получаешь бюллетень. Есть ещё и доход от собственности — правило уже другое."
 NFP69_POLICY_LAW_LAISSEZ_FAIRE:0 "Хозяйственный курс опирается на частную конкуренцию и ограниченное вмешательство государства. Предпринимателю оставляют больше самостоятельности в решении, куда направлять капитал."
 NFP69_POLICY_LAW_LANDED_VOTING:0 "Голосовать могут владельцы земли или капитала. Прежде чем спросить мнение гражданина, установленный порядок интересуется его имуществом."
 NFP69_POLICY_LAW_LAND_BASED_TAXATION:0 "Налоговая система опирается на земельные сборы, прежде всего с крестьян. Государственный доход тесно привязан к сельскому хозяйству и обязанностям людей на земле."
 NFP69_POLICY_LAW_LATIFUNDIAS:0 "Основу земельного порядка составляют крупные поместья с низкооплачиваемым сезонным трудом. Для работника вопрос о заработке связан здесь не только с хозяином земли, но и со временем сельских работ."
 NFP69_POLICY_LAW_LAX_EDO_SYSTEM:0 "Простолюдинам открываются должности и обязанности, прежде закреплённые за самураями. Между происхождением человека и его занятием закон оставляет больше свободного места."
 NFP69_POLICY_LAW_LEGACY_SLAVERY:0 "Существующее рабство сохраняется, но расширять его запрещено. Закон оставляет в силе прежнюю несвободу, одновременно закрывая путь её дальнейшему распространению."
 NFP69_POLICY_LAW_LOCAL_POLICE:0 "Охрана порядка поручена местным полицейским органам. Устройство службы связано с местной властью, поэтому полицейский вопрос решается прежде всего на месте."
 NFP69_POLICY_LAW_MANORIALISM:0 "Земля остаётся у потомственных владельцев, а арендаторы обязаны выполнять для них неоплачиваемую работу, сохраняя свободу передвижения. Уход разрешён, но обязанности на занятой земле по-прежнему включают труд в пользу хозяина."
 NFP69_POLICY_LAW_MASS_CONSCRIPTION:0 "Профессиональную армию разрешается пополнять массовым призывом пехоты. Военные списки при таком устройстве тесно связаны со списками людей, которых могут недосчитаться мастерские и хозяйства."
 NFP69_POLICY_LAW_MERCANTILISM:0 "Торговый курс ориентирован на экспорт и положительный приток средств в соперничестве с другими странами. Внешнюю торговлю рассматривают как средство усиления собственного хозяйства в этом соревновании."
 NFP69_POLICY_LAW_MERCHANT_NAVY:0 "Морская организация ориентирована на международную торговлю и защиту перевозимых грузов. Для такой службы важнейший вопрос — сможет ли торговое судно пройти свой путь с товаром."
 NFP69_POLICY_LAW_MIGRATION_CONTROLS:0 "Переселение разрешается только представителям культур и религий, не подвергающихся дискриминации. Право пересечь границу связано с тем, как государство оценивает принадлежность самого переселенца."
 NFP69_POLICY_LAW_MILITARIZED_POLICE:0 "Полиция получает военное снаряжение и соответствующую подготовку. Служба внутреннего порядка приближается по своим средствам к вооружённым силам."
 NFP69_POLICY_LAW_MILITARY_BUREAUCRATS:0 "Мундир теперь к месту и в канцелярии. Большинство высших чиновников государству поставляет армия."
 NFP69_POLICY_LAW_MILLET_SYSTEM:0 "При государственной суннитской вере другие авраамические общины получают юридическую автономию и освобождение от призыва в обмен на религиозный налог. Общине оставляют собственный порядок, а казна предъявляет за это вполне земной счёт."
 NFP69_POLICY_LAW_MONARCHY:0 "Исполнительная власть принадлежит монарху, а правящая династия олицетворяет государственную преемственность. Семейная история правящего дома становится частью устройства всей страны."
 NFP69_POLICY_LAW_MULTICULTURAL:0 "Гражданские права предоставляются без культурной дискриминации и без официального превосходства одной культуры над другими. Для права принадлежать стране больше не требуется подходящая культурная родословная."
 NFP69_POLICY_LAW_NATIONAL_GUARD:0 "Для охраны общественного порядка предусмотрены самостоятельные добровольческие формирования граждан. Внутренняя безопасность становится обязанностью не только штатных служащих, но и вооружённых добровольцев."
 NFP69_POLICY_LAW_NATIONAL_MILITIA:0 "При небольшой регулярной армии защиту страны должны дополнять местные ополчения. У такого солдата дом остаётся и причиной взяться за оружие, и местом, куда хочется поскорее вернуться."
 NFP69_POLICY_LAW_NATIONAL_SUPREMACY:0 "Государство отдаёт первенство основной национальной идентичности, принимая также культуры с общим наследием и языком либо другими обычаями. Для остальных культур правовой барьер сохраняется: сходство с большинством становится условием допуска."
 NFP69_POLICY_LAW_NEO_ABSOLUTISM:0 "Самодержавный правитель опирается на современный централизованный аппарат управления. Канцелярии могут быть устроены по-новому, но право последнего решения остаётся у одного человека."
 NFP69_POLICY_LAW_NO_COLONIAL_AFFAIRS:0 "Государство отказывается от учреждения колоний в рамках формальной колонизации. Колониальные притязания больше не имеют предусмотренного этим законом механизма расширения."
 NFP69_POLICY_LAW_NO_HEALTH_SYSTEM:0 "Казна не финансирует здравоохранение. Забота о лечении остаётся за пределами государственных расходов — больному приходится искать помощь через другие средства и учреждения."
 NFP69_POLICY_LAW_NO_HOME_AFFAIRS:0 "Подавление беспорядков и мятежей остаётся делом обычной армии и полиции. Отдельного устройства внутренних дел закон не предусматривает — государство полагается на уже имеющиеся силы."
 NFP69_POLICY_LAW_NO_MIGRATION_CONTROLS:0 "Государство не устанавливает контроля над переселением через свои границы. Решение уехать или приехать не требует преодоления особого миграционного запрета."
 NFP69_POLICY_LAW_NO_POLICE:0 "Организованной полицейской службы закон не предусматривает. У общественного порядка нет отдельного постоянного ведомства с этой обязанностью."
 NFP69_POLICY_LAW_NO_SCHOOLS:0 "Обучение оставлено на ответственности семей без общей школьной системы. Возможность освоить грамоту тесно связана с тем, какие средства и помощь найдутся дома."
 NFP69_POLICY_LAW_NO_SOCIAL_SECURITY:0 "Государство не принимает на себя обязанность содержать людей, которые не могут обеспечить себя сами. Поддержку в нужде приходится искать вне государственной системы пособий."
 NFP69_POLICY_LAW_NO_WOMENS_RIGHTS:0 "Женщины юридически находятся под мужской опекой и обладают ограниченными правами. Самостоятельное решение упирается в установленную зависимость от опекуна."
 NFP69_POLICY_LAW_NO_WORKERS_RIGHTS:0 "Государство не закрепляет специальных гарантий трудовых прав. Отношения на работе оставлены без этого слоя законодательной защиты работника."
 NFP69_POLICY_LAW_OFFICIAL_NATIONALITY:0 "Образцовым подданным государство считает русского. От остальных ждут, что они перенимут его культуру. Для семьи, говорящей дома на другом языке, разница вполне ощутима."
 NFP69_POLICY_LAW_OKHRANA:0 "Тайной полиции поручены надзор за эмигрантами и борьба с революционерами. Пересечь границу, выходит, ещё не значит выйти из поля её зрения."
 NFP69_POLICY_LAW_OLD_AGE_PENSION:0 "Государство принимает на себя содержание работников в пожилом возрасте. Возможность прекратить трудиться связывается с общественной поддержкой, а не только с накоплениями человека и помощью его семьи."
 NFP69_POLICY_LAW_OLIGARCHY:0 "Глава государства делит власть с узким кругом влиятельных людей, не отвечающих перед избирателями. Политический разговор допускает несколько голосов, но круг приглашённых остаётся тесным."
 NFP69_POLICY_LAW_ORGANIC_REGULATION:0 "Государственный порядок строится на органических законах, навязанных великими державами, а главу государства выбирают представители боярской верхушки. Местная власть получает правила извне и избирателей из весьма ограниченного круга."
 NFP69_POLICY_LAW_OUTLAWED_DISSENT:0 "Критика правительства объявлена незаконной и приравнена к измене. Для газетного пера это особенно короткая дорога от замечания к обвинению."
 NFP69_POLICY_LAW_PARLIAMENTARY_REPUBLIC:0 "Главой государства становится руководитель законодательного собрания. Высшая исполнительная должность связана с парламентом, поэтому устройство самого представительства приобретает особое значение."
 NFP69_POLICY_LAW_PEASANT_LEVIES:0 "В основу армии положен призыв крестьянской пехоты с самой скромной подготовкой. Между привычкой держать плуг и умением держать строй всё-таки лежит некоторое расстояние."
 NFP69_POLICY_LAW_PEASANT_PROPRIETORSHIP:0 "Большинство сельскохозяйственных земель находится у самостоятельных крестьянских собственников, а крупные коммерческие владения занимают меньшую долю. Хозяйство строится вокруг человека, который работает на своей земле."
 NFP69_POLICY_LAW_PEOPLE_OF_THE_BOOK:0 "Исламский правопорядок признаёт за последователями других авраамических вер юридическую автономию и освобождение от призыва, предусматривая особый религиозный налог. Установленное различие касается и общинного суда, и службы, и кошелька."
 NFP69_POLICY_LAW_PER_CAPITA_BASED_TAXATION:0 "Подоходное обложение сочетается с подушным налогом, особенно тяжёлым для бедных. Одинаковый сбор с человека занимает совсем разное место в большом и маленьком кошельке."
 NFP69_POLICY_LAW_POOR_LAWS:0 "Помощь бедным организуется через работные дома. Вместе с содержанием нуждающийся получает установленный порядок проживания и труда."
 NFP69_POLICY_LAW_PRESIDENTIAL_REPUBLIC:0 "Республиканское устройство предусматривает президента во главе государства и представительную власть. Президентство становится центральной государственной должностью; состав избирателей при этом определяется законами о политических правах."
 NFP69_POLICY_LAW_PRIVATE_HEALTH_INSURANCE:0 "Лечение организовано через частные больницы и индивидуальное медицинское страхование. Доступ к оплачиваемой помощи связан с возможностью приобрести такую защиту — здоровье входит в отношения договора и взносов."
 NFP69_POLICY_LAW_PRIVATE_SCHOOLS:0 "Образование организуется частными учреждениями. Выбор школы оказывается связан с предложением таких заведений и возможностью семьи оплатить обучение."
 NFP69_POLICY_LAW_PROFESSIONAL_ARMY:0 "Страна делает ставку на постоянную армию профессиональных солдат. Военное дело становится их основным занятием, а обучение — частью службы, а не кратким предисловием к походу."
 NFP69_POLICY_LAW_PROFESSIONAL_NAVY:0 "Государство выбирает содержание мощного постоянного военного флота как средство сдерживания соперников. Корабль в таком порядке служит и оружием, и весьма заметным аргументом."
 NFP69_POLICY_LAW_PROPORTIONAL_TAXATION:0 "Налоги строятся преимущественно вокруг доходов с примерно одинаковой долей от заработанного. Казна соразмеряет требование с доходом, а не только считает плательщиков по головам."
 NFP69_POLICY_LAW_PROTECTED_SPEECH:0 "Свобода слова получает правовую защиту. У публичного спора становится больше пространства, а у газеты — больше оснований рассчитывать, что ответом на довод будет другой довод."
 NFP69_POLICY_LAW_PROTECTIONISM:0 "Государство защищает внутреннюю промышленность от внешней конкуренции торговыми ограничениями. Между отечественным предприятием и зарубежным соперником появляется заслон торговой политики."
 NFP69_POLICY_LAW_PUBLIC_HEALTH_INSURANCE:0 "Государство финансирует медицинское страхование, предназначенное для равного доступа граждан к помощи. Расходы на лечение получают общую бюджетную основу вместо исключительно личного счёта."
 NFP69_POLICY_LAW_PUBLIC_SCHOOLS:0 "Государство берёт на себя устройство общедоступной школы с общими образовательными правилами. Учебное место становится предметом публичной ответственности, а не только семейных возможностей."
 NFP69_POLICY_LAW_RACIAL_SEGREGATION:0 "Гражданские права связывают с общим расовым наследием, дискриминируя культуры с иным происхождением. Закон проводит границу между жителями там, где видит различие их наследия."
 NFP69_POLICY_LAW_REGULATORY_BODIES:0 "Государственные органы получают задачу ограничивать действия работодателей. У трудового спора появляется учреждение, призванное следить за правилами, а не только за выпуском продукции."
 NFP69_POLICY_LAW_RELIGIOUS_SCHOOLS:0 "Школьное образование передано в ведение религиозных учреждений. Вместе с грамотой школа получает наставников, для которых обучение связано с вопросами веры."
 NFP69_POLICY_LAW_RESTRICTED_CHILD_LABOR:0 "Детям запрещено работать на фабриках. Закон проводит конкретную границу между возрастом ребёнка и фабричным рабочим местом."
 NFP69_POLICY_LAW_REVOLUTIONARY_GUARD:0 "Рабочие отряды сводят в общую армию. А кто будет командовать, решат сами бойцы на выборах."
 NFP69_POLICY_LAW_RIGHT_OF_ASSEMBLY:0 "Гражданам предоставлено право собираться вместе. Общественное мнение получает место для встречи — возможность обсуждать и предъявлять требования сообща."
 NFP69_POLICY_LAW_RIGHT_TO_ASSOCIATE:0 "Работники могут создавать объединения и вести их деятельность без специальных ограничений. Общий интерес получает право на собственную организацию."
 NFP69_POLICY_LAW_SAKOKU:0 "Контакты с иностранными государствами резко ограничены, а торговля разрешена лишь через определённые порты. Морская граница получает немногочисленные двери, открываемые по особому правилу."
 NFP69_POLICY_LAW_SECRET_POLICE:0 "Создаётся особый аппарат слежки за инакомыслящими и расследования политических преступлений. Государственное внимание к частным разговорам получает собственное ведомство."
 NFP69_POLICY_LAW_SERFDOM:0 "Крестьянин прикреплён к земле и обязан работать на своего феодального хозяина. Возможность сменить место и занятие ограничивается самой принадлежностью к этому порядку."
 NFP69_POLICY_LAW_SHINSENGUMI:0 "Охрана чиновников и патрулирование столицы поручены отряду элитных мечников. У этого порядка вполне определённый облик: безопасность власти доверяют особой вооружённой службе."
 NFP69_POLICY_LAW_SINGLE_PARTY_STATE:0 "Законная политическая деятельность сосредоточена в руках одной партии. Спор о власти получает заранее установленную рамку: партийный билет у неё только одного образца."
 NFP69_POLICY_LAW_SLAVERY_BANNED:0 "Владение человеком как собственностью запрещено. Человеческую свободу больше нельзя законно включить в чужую опись имущества."
 NFP69_POLICY_LAW_SLAVE_TRADE:0 "Закон допускает приобретение рабов через международную торговлю. Спрос на подневольный труд получает внешний рынок, на котором предметом сделки становится человек."
 NFP69_POLICY_LAW_SOCIAL_MONARCHY:0 "Монархия сохраняет роль национального символа, а государство посредничает между корпоративными группами. Корона остаётся над столом переговоров, за которым должны встречаться организованные общественные интересы."
 NFP69_POLICY_LAW_STATE_ATHEISM:0 "Государство проводит антирелигиозную политику и исключает религию из общественного управления, ограничивая все вероисповедания. Теперь сама вера оказывается предметом недоверия со стороны власти."
 NFP69_POLICY_LAW_STATE_RELIGION:0 "Церковь получает положение государственного органа, а религиозные меньшинства остаются в неравном правовом положении. Вера становится вопросом не только совести, но и отношений с властью."
 NFP69_POLICY_LAW_STRICT_EDO_SYSTEM:0 "Сословный порядок строго определяет занятия, права и даже дозволенное устройство жилища; простолюдин не может законно стать самураем. Государство берётся следить за различиями вплоть до числа ворот — весьма обстоятельное представление о порядке."
 NFP69_POLICY_LAW_SUBJECTHOOD:0 "Жителей рассматривают прежде всего как подданных монарха, оставляя культурные вопросы соответствующим общинам. Общая принадлежность к короне здесь важнее попытки выстроить единую национальную идентичность."
 NFP69_POLICY_LAW_TECHNOCRACY:0 "Управление поручается неизбираемому совету людей, отобранных за знания и способности. Право руководить здесь обосновывают компетентностью, а не результатом голосования."
 NFP69_POLICY_LAW_TENANT_FARMERS:0 "Земледельцы работают на землях потомственных владельцев, сохраняя возможность уйти и искать другое занятие. Отношение к земле строится через чужое владение, однако сам работник к участку не прикреплён."
 NFP69_POLICY_LAW_TERAKOYA:0 "Обучение простолюдинов строится на децентрализованной сети частных школ при храмах. Школьная жизнь опирается на местные теракоя, а не на единую государственную лестницу учреждений."
 NFP69_POLICY_LAW_THEOCRACY:0 "Управление находится у духовенства и опирается на толкование священных текстов. Государственная власть получает религиозное обоснование, а спор о порядке оказывается рядом со спором о вере."
 NFP69_POLICY_LAW_THIRD_SECTION:0 "У императорской канцелярии есть особое отделение для цензуры и сыска. В поле его зрения попадают и политические противники, и религиозные инакомыслящие. Для газетчиков здесь есть вполне профессиональный интерес."
 NFP69_POLICY_LAW_TOTAL_SEPARATION:0 "Церковь отделена от государственного управления, а религиозная принадлежность больше не служит основанием дискриминации. Вопрос о вере и вопрос о гражданском положении закон разводит по разным кабинетам."
 NFP69_POLICY_LAW_TRADITIONALISM:0 "Хозяйственный порядок опирается на доиндустриальное натуральное производство при небольшом государственном вмешательстве. Привычные способы хозяйствования сохраняют первенство перед устройством экономики по промышленному образцу."
 NFP69_POLICY_LAW_UNIVERSAL_SUFFRAGE:0 "Право голоса предоставлено всем взрослым мужчинам на равных основаниях. Имущественная разница больше не определяет вес мужского голоса, тогда как положение женщин зависит от отдельного закона."
 NFP69_POLICY_LAW_WAGE_SUBSIDIES:0 "Закон связывает социальную поддержку с установлением минимальной заработной платы через соответствующее учреждение. Оплата труда получает нижнюю границу, которую государство берётся поддерживать."
 NFP69_POLICY_LAW_WARRIOR_CASTE:0 "Ношение оружия и военная служба закреплены за особым воинским сословием, простолюдинов в него не допускают. Здесь происхождение проверяют раньше, чем меткость."
 NFP69_POLICY_LAW_WEALTH_VOTING:0 "Избирательное право зависит от богатства, причём состоятельный голос получает больший вес. У политического влияния появляется вполне денежная мера."
 NFP69_POLICY_LAW_WOMENS_SUFFRAGE:0 "Женщины получают избирательное право. Политическое мнение перестаёт быть привилегией одного пола, хотя общий порядок допуска к выборам по-прежнему задают избирательные законы."
 NFP69_POLICY_LAW_WOMEN_IN_THE_FIELDS:0 "На женщин возлагается основная доля хозяйственного и сельского труда, позволяя большему числу мужчин заниматься войной и набегами. Военное устройство общества здесь опирается на то, кто остаётся вести хозяйство."
 NFP69_POLICY_LAW_WOMEN_IN_THE_WORKPLACE:0 "Закон допускает более широкое участие женщин в оплачиваемом труде. Вопрос о заработке и самостоятельности выходит за пределы домашнего хозяйства."
 NFP69_POLICY_LAW_WOMEN_OWN_PROPERTY:0 "Женщины получают право владеть имуществом, в том числе наследуемым. Собственность может принадлежать самой женщине, а не только мужчине, от которого зависит её положение."
 NFP69_POLICY_LAW_WORKER_PROTECTIONS:0 "Трудящимся предоставляются широкие права, закреплённые законом. Условие найма должно считаться с обязательствами перед работником, которые нельзя просто вычеркнуть из частного соглашения."
 NFP72_BASE_1:0 "Здесь известна общая оценка самой новой нормы. Позиции перед её принятием в наши сведения не попали. Поэтому речь о том, насколько закон близок взглядам групп, а не о том, кто поддержал его замену. Приписывать им задним числом голоса было бы слишком смелой работой для газеты."
 NFP72_BASE_2:0 "Здесь известна общая оценка самой новой нормы. Позиции перед её принятием в наши сведения не попали. Поэтому речь о том, насколько закон близок взглядам групп, а не о том, кто поддержал его замену. Приписывать им задним числом голоса было бы слишком смелой работой для газеты."
 NFP72_GOV_1:0 "В правительстве у нового закона тоже есть своя история. [Localize(ScriptContainer.MakeScope.Var('nfp50_law_gov_summary').GetFlagName)] Решение уже принято, но само по себе оно ещё не превращает всех участников правительства в единомышленников. [SelectLocalization(GreaterThan_CFixedPoint(ScriptContainer.GetVariableValue('nfp50_law_gov_yes_present'), '(CFixedPoint)0'), 'NFP50_LAW_GOV_YES_NAME', 'NFP50_LAW_NO_MOVE')] [SelectLocalization(GreaterThan_CFixedPoint(ScriptContainer.GetVariableValue('nfp50_law_gov_no_present'), '(CFixedPoint)0'), 'NFP50_LAW_GOV_NO_NAME', 'NFP50_LAW_NO_MOVE')]"
 NFP72_GOV_2:0 "В правительстве у нового закона тоже есть своя история. [Localize(ScriptContainer.MakeScope.Var('nfp50_law_gov_summary').GetFlagName)] Решение уже принято, но само по себе оно ещё не превращает всех участников правительства в единомышленников. [SelectLocalization(GreaterThan_CFixedPoint(ScriptContainer.GetVariableValue('nfp50_law_gov_yes_present'), '(CFixedPoint)0'), 'NFP50_LAW_GOV_YES_NAME', 'NFP50_LAW_NO_MOVE')] [SelectLocalization(GreaterThan_CFixedPoint(ScriptContainer.GetVariableValue('nfp50_law_gov_no_present'), '(CFixedPoint)0'), 'NFP50_LAW_GOV_NO_NAME', 'NFP50_LAW_NO_MOVE')]"
 NFP72_IG_1:0 "Среди крупнейших по числу участников организованных групп картина такая. [Localize(ScriptContainer.MakeScope.Var('nfp50_law_ig_1_type').GetFlagName)] — [Localize(ScriptContainer.MakeScope.Var('nfp50_law_ig_1_stance').GetFlagName)]. [SelectLocalization(GreaterThan_CFixedPoint(ScriptContainer.GetVariableValue('nfp50_law_ig_count'), '(CFixedPoint)1'), 'NFP72_SECOND', 'NFP50_LAW_NO_MOVE')] Голоса этих групп многое говорят об организованной политической жизни. Людей за её пределами эта картина, однако, не охватывает."
 NFP72_IG_2:0 "Среди крупнейших по числу участников организованных групп картина такая. [Localize(ScriptContainer.MakeScope.Var('nfp50_law_ig_1_type').GetFlagName)] — [Localize(ScriptContainer.MakeScope.Var('nfp50_law_ig_1_stance').GetFlagName)]. [SelectLocalization(GreaterThan_CFixedPoint(ScriptContainer.GetVariableValue('nfp50_law_ig_count'), '(CFixedPoint)1'), 'NFP72_SECOND', 'NFP50_LAW_NO_MOVE')] Голоса этих групп многое говорят об организованной политической жизни. Людей за её пределами эта картина, однако, не охватывает."
 NFP72_MOVES_1:0 "Общественные движения тоже имеют отношение к этой истории. [SelectLocalization(GreaterThan_CFixedPoint(ScriptContainer.GetVariableValue('nfp50_law_move_yes_present'), '(CFixedPoint)0'), 'NFP72_MOVE_YES', 'NFP50_LAW_NO_MOVE')] [SelectLocalization(GreaterThan_CFixedPoint(ScriptContainer.GetVariableValue('nfp50_law_move_no_present'), '(CFixedPoint)0'), 'NFP72_MOVE_NO', 'NFP50_LAW_NO_MOVE')] Совпадение взглядов ещё не говорит, кто добился перемены. Но понятно, почему одним новый порядок ближе, чем другим."
 NFP72_MOVES_2:0 "Общественные движения тоже имеют отношение к этой истории. [SelectLocalization(GreaterThan_CFixedPoint(ScriptContainer.GetVariableValue('nfp50_law_move_yes_present'), '(CFixedPoint)0'), 'NFP72_MOVE_YES', 'NFP50_LAW_NO_MOVE')] [SelectLocalization(GreaterThan_CFixedPoint(ScriptContainer.GetVariableValue('nfp50_law_move_no_present'), '(CFixedPoint)0'), 'NFP72_MOVE_NO', 'NFP50_LAW_NO_MOVE')] Совпадение взглядов ещё не говорит, кто добился перемены. Но понятно, почему одним новый порядок ближе, чем другим."
 NFP72_MOVE_NO:0 "Среди противников нормы наиболее поддержано движение типа «[Localize(ScriptContainer.MakeScope.Var('nfp50_law_move_no_type').GetFlagName)]»."
 NFP72_MOVE_YES:0 "Среди сторонников нормы наиболее поддержано движение типа «[Localize(ScriptContainer.MakeScope.Var('nfp50_law_move_yes_type').GetFlagName)]»."
 NFP72_NO_GROUPS_1:0 "Для этой перемены нет сведений о позициях организованных групп. Молчание сводки за всеобщее согласие не примем: оно сообщает лишь о границах наших сведений."
 NFP72_NO_GROUPS_2:0 "Для этой перемены нет сведений о позициях организованных групп. Молчание сводки за всеобщее согласие не примем: оно сообщает лишь о границах наших сведений."
 NFP72_RELATIVE_1:0 "Эти позиции зафиксированы перед завершением принятия закона. Сравнивается новая норма с прежней. Для одних такая замена желанна, для других — совсем наоборот; в подписи под постановлением этого различия обычно не видно."
 NFP72_RELATIVE_2:0 "Эти позиции зафиксированы перед завершением принятия закона. Сравнивается новая норма с прежней. Для одних такая замена желанна, для других — совсем наоборот; в подписи под постановлением этого различия обычно не видно."
 NFP72_SECOND:0 "[Localize(ScriptContainer.MakeScope.Var('nfp50_law_ig_2_type').GetFlagName)] — [Localize(ScriptContainer.MakeScope.Var('nfp50_law_ig_2_stance').GetFlagName)]."
 NFP89_DELIVERY:0 "[SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp89_regular'), '(CFixedPoint)1'), 'NFP89_MONTHLY_ON', 'NFP89_MONTHLY_OFF')]\n\n[SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp89_urgent'), '(CFixedPoint)1'), 'NFP89_URGENT_ON', 'NFP89_URGENT_OFF')]"
 NFP89_MONTHLY_OFF:0 "Ежемесячная доставка сейчас отключена. Этот вводный номер останется в архиве; за обычными новостями газета придёт, когда вы снова оформите их получение."
 NFP89_MONTHLY_ON:0 "Вы выбрали ежемесячную доставку. Будем возвращаться к переменам от выпуска к выпуску: одной тревожной сводки для длинной истории обычно маловато."
 NFP89_TECH_END_COLD:0 "Обязательства между странами есть, а тепла в отношениях пока немного. Чужое открытие от этого хуже не стало. Нам остаётся отделять полезную возможность от привычки видеть в каждом известии повод для перепалки."
 NFP89_TECH_END_FRIEND:0 "С такой вестью можно поздравить. Было бы приятно, если бы вслед за любезностями нашлось место и полезным переговорам. Доброму расположению тоже полезно время от времени находить занятие."
 NFP89_TECH_END_NEUTRAL:0 "Новое знание у другой страны уже есть. Что она сумеет из него получить, покажет дальнейшая работа. А нам полезнее присмотреться к собственным возможностям, чем объяснять, почему чужие не заслуживают внимания."
 NFP89_TECH_END_THREAT:0 "Отношения дают мало поводов для беспечного поздравления. Новые возможности этой страны стоит иметь в виду. Но объявлять каждое открытие приготовлением к войне было бы слишком удобной заменой наблюдению."
 NFP89_TECH_OPEN_ALLY:0 "Наш союзник [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName] освоил новое знание — [Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]. Приятно получить от союзной почты что-нибудь кроме очередного повода тревожиться. Теперь интересно, как там распорядятся открытием."
 NFP89_TECH_OPEN_BLOC:0 "Наш партнёр по блоку [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName] освоил новое знание — [Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]. В общем кругу стало одной возможностью больше. Правда, членство в блоке само по себе не переносит чужие знания в наши мастерские."
 NFP89_TECH_OPEN_NEIGHBOR:0 "Наш сосед [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName] освоил новое знание — [Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]. Для научной вести расстояние не самое главное. Для хозяйства по соседству новые возможности за границей всё же заслуживают отдельного внимания."
 NFP89_TECH_OPEN_OTHER:0 "Из страны [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName] пришла научная весть: освоено новое знание — [Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]. Одной строкой в перечне исследований стало больше. Посмотрим, какие возможности за ней стоят."
 NFP89_TECH_OPEN_OVERLORD:0 "Наш сюзерен [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName] освоил новое знание — [Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]. Связь между странами от этого не стала научной библиотекой с открытой выдачей. Но знать о новых возможностях старшего партнёра нам полезно."
 NFP89_TECH_OPEN_RIVAL:0 "Наш соперник [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName] освоил новое знание — [Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]. Отмахнуться от известия было бы нетрудно. Только чужие возможности от нашего равнодушия меньше не станут."
 NFP89_TECH_OPEN_SUBJECT:0 "Зависимая от нас страна [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName] освоила новое знание — [Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]. За привычной строкой о подчинении легко перестать замечать её собственные возможности. На этот раз есть хороший повод присмотреться."
 NFP89_URGENT_OFF:0 "Срочные выпуски отключены. Если захотите получать отдельные номера о войнах и больших мировых событиях, эту доставку можно включить в подписке."
 NFP89_URGENT_ON:0 "Срочные выпуски тоже разрешены. Известие о начале или конце войны и важном мировом событии не будет ждать обычного ежемесячного номера."
