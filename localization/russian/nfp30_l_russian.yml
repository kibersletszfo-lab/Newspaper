 NFP52_ACW_2_TITLE:0 "Союз расколот войной"
 NFP52_ARTICLE_META:0 "Мировая хроника · [Localize(ScriptContainer.MakeScope.Var('nfp30_month').GetFlagName)], [ScriptContainer.GetVariableValue('nfp20_year')|0] г. · Специальный выпуск"
 NFP52_AUS_1_BODY:0 "В Австралии возникло общее государственное объединение. Далёкий материк стал источником новости, которая заслуживает места на первой полосе. Несколько политических образований получили общую государственную форму. Теперь за знакомым географическим именем стоят новые общие дела.\n\nОбразование Австралии состоялось. Это перемена в устройстве австралийских территорий, а не само по себе известие о независимости. Международные обязательства определяются отдельно. Общее государство уже появилось; его дальнейшее положение будет зависеть от собственных решений и отношений с другими державами.\n\nОбъединение даёт возможность договариваться внутри общего устройства. Насколько успешно ею воспользуются, станет видно по повседневной работе. Материк велик, и общих забот на нём хватит. Хорошо бы, чтобы вместе с ними нашлось место и общей пользе.\n\nХроника датирована месяцем получения известия редакцией. При задержке связи само событие могло произойти раньше."
 NFP52_AUS_1_CONTEXT:0 "Объединение даёт возможность договариваться внутри общего устройства. Насколько успешно ею воспользуются, станет видно по повседневной работе. Материк велик, и общих забот на нём хватит. Хорошо бы, чтобы вместе с ними нашлось место и общей пользе."
 NFP52_AUS_1_FACT:0 "Образование Австралии состоялось. Это перемена в устройстве австралийских территорий, а не само по себе известие о независимости. Международные обязательства определяются отдельно. Общее государство уже появилось; его дальнейшее положение будет зависеть от собственных решений и отношений с другими державами."
