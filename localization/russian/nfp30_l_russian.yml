 NFP52_SPRING_2_TITLE:0 "Европа вступила в полосу потрясений"
 NFP52_SUEZ_1_BODY:0 "Суэцкий канал завершён. Обычно человек подстраивает путь под карту. Здесь карту пришлось подстроить под человеческий замысел: между Средиземным и Красным морями появился проход. Для морского сообщения это новость, которую трудно оставить в разделе мелких примечаний.\n\nСтроительство канала окончено. Новый морской путь соединяет два моря и позволяет иначе смотреть на прежние маршруты. Там, где география требовала обхода, теперь есть проход. Наглядный случай, когда разговор о сокращении расстояний сопровождается настоящим сооружением.\n\nДальше начинается работа с новой возможностью. Кому удастся воспользоваться ею выгоднее, покажут торговля и политика. Но сам результат уже заслуживает внимания. Хорошо, когда после долгих планов в мире появляется что-то, кроме ещё одного плана.\n\nХроника датирована месяцем получения известия редакцией. При задержке связи само событие могло произойти раньше."
