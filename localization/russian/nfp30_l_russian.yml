 NFP50_LAW_IG_BASE_1:0 "У крупнейших общественных групп тоже есть свой взгляд. $NFP50_LAW_IG_ROW_1$ [SelectLocalization(GreaterThan_CFixedPoint(ScriptContainer.GetVariableValue('nfp50_law_ig_count'), '(CFixedPoint)1'), 'NFP50_LAW_IG_ROW_2', 'NFP50_LAW_NO_SECOND_IG')] Это голоса организованных групп. Всех жителей одной строкой, конечно, не перескажешь."
 NFP50_LAW_IG_BASE_2:0 "У крупнейших общественных групп тоже есть свой взгляд. $NFP50_LAW_IG_ROW_1$ [SelectLocalization(GreaterThan_CFixedPoint(ScriptContainer.GetVariableValue('nfp50_law_ig_count'), '(CFixedPoint)1'), 'NFP50_LAW_IG_ROW_2', 'NFP50_LAW_NO_SECOND_IG')] Это голоса организованных групп. Всех жителей одной строкой, конечно, не перескажешь."
