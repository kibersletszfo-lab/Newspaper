 NFP51_DETAIL:0 "дипломатический кризис"
 NFP51_END_1_CORE:0 "В противостоянии между инициатором [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName] и целью [ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName] отступила держава [ScriptContainer.MakeScope.Var('nfp51_actor').GetCountryDefinition.GetName]. Предмет противостояния: [Localize(ScriptContainer.MakeScope.Var('nfp51_play_label').GetFlagName)]."
 NFP51_END_1_END:0 "Этот кризис разрешился без войны. Отступление одной стороны не сделало все противоречия между странами исчезнувшими. Но спор, который удалось закончить до боёв, заслуживает отдельной строки. Для газетной хроники развязка менее громкая. Для жизни — возможно, куда приятнее."
 NFP51_END_1_LEAD:0 "Держава [ScriptContainer.MakeScope.Var('nfp51_actor').GetCountryDefinition.GetName] отступила в дипломатическом противостоянии."
 NFP51_END_1_TITLE:0 "Отступили прежде, чем заговорили пушки"
 NFP51_END_2_CORE:0 "Противостояние держав [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName] и [ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName] получило развязку без перехода кризиса в войну: держава [ScriptContainer.MakeScope.Var('nfp51_actor').GetCountryDefinition.GetName] отступила. Предмет спора — [Localize(ScriptContainer.MakeScope.Var('nfp51_play_label').GetFlagName)]."
 NFP51_END_2_END:0 "Этот кризис разрешился без войны. Отступление одной стороны не сделало все противоречия между странами исчезнувшими. Но спор, который удалось закончить до боёв, заслуживает отдельной строки. Для газетной хроники развязка менее громкая. Для жизни — возможно, куда приятнее."
 NFP51_END_2_LEAD:0 "Зафиксировано отступление державы [ScriptContainer.MakeScope.Var('nfp51_actor').GetCountryDefinition.GetName] до перехода игры в войну."
 NFP51_END_2_TITLE:0 "Отступили прежде, чем заговорили пушки"
 NFP51_JOIN_1_CORE:0 "В указанном месяце держава [ScriptContainer.MakeScope.Var('nfp51_actor').GetCountryDefinition.GetName] присоединилась к стороне державы [ScriptContainer.MakeScope.Var('nfp51_side').GetCountryDefinition.GetName] в дипломатическом противостоянии между [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName] и [ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName]. Предмет спора — [Localize(ScriptContainer.MakeScope.Var('nfp51_play_label').GetFlagName)]."
 NFP51_JOIN_1_END:0 "Новая поддержка меняет расчёт сторон. Одно дело предъявлять требования в одиночку, другое — знать, кто готов встать рядом. Пока речь о дипломатическом противостоянии. Посмотрим, поможет ли расширившаяся компания договориться или желающих настоять на своём станет ещё больше."
 NFP51_JOIN_1_LEAD:0 "Держава [ScriptContainer.MakeScope.Var('nfp51_actor').GetCountryDefinition.GetName] поддержала сторону державы [ScriptContainer.MakeScope.Var('nfp51_side').GetCountryDefinition.GetName]."
 NFP51_JOIN_1_TITLE:0 "За столом спора стало теснее"
 NFP51_JOIN_2_CORE:0 "Новый участник дипломатического противостояния — [ScriptContainer.MakeScope.Var('nfp51_actor').GetCountryDefinition.GetName]. Поддержанная сторона — [ScriptContainer.MakeScope.Var('nfp51_side').GetCountryDefinition.GetName]; основные стороны противостояния — [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName] и [ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName]. Предмет спора: [Localize(ScriptContainer.MakeScope.Var('nfp51_play_label').GetFlagName)]."
 NFP51_JOIN_2_END:0 "Новая поддержка меняет расчёт сторон. Одно дело предъявлять требования в одиночку, другое — знать, кто готов встать рядом. Пока речь о дипломатическом противостоянии. Посмотрим, поможет ли расширившаяся компания договориться или желающих настоять на своём станет ещё больше."
 NFP51_JOIN_2_LEAD:0 "К стороне державы [ScriptContainer.MakeScope.Var('nfp51_side').GetCountryDefinition.GetName] присоединилась держава [ScriptContainer.MakeScope.Var('nfp51_actor').GetCountryDefinition.GetName]."
 NFP51_JOIN_2_TITLE:0 "За столом спора стало теснее"
 NFP51_METRICS:0 "Источник: штатные сигналы дипломатической игры 1.15.0. Событие сохранено в момент получения; дата статьи — месяц события. Номер кризиса: [ScriptContainer.GetVariableValue('nfp51_crisis')|0]. Развязка и участие других стран не восстанавливаются из текущего мира. Материал предназначен только для обычного выпуска, без срочной доставки. Прямая страна, формальный союзник и партнёр по блоку различаются в тексте."
 NFP51_PLAY_DP_ANNEX_SUBJECT:0 "присоединение субъекта"
 NFP51_PLAY_DP_ANNEX_WAR:0 "присоединение страны"
