 NFP43_ELECTION_TITLE_1:0 "До урн ещё дойдём. Пока — борьба за избирателя"
 NFP43_ELECTION_TITLE_2:0 "До урн ещё дойдём. Пока — борьба за избирателя"
 NFP43_FRONT_PAGE:0 "Первая полоса"
 NFP43_THIS_ISSUE:0 "В этом выпуске"
 NFP43_THIS_ISSUE_URGENT:0 "В этом выпуске · Срочно"
 NFP43_WELCOME_1_BODY:0 "Хорошо, когда нужное можно купить, доехать до работы и вернуться с заработком, которого хватает на жизнь. Здесь будем говорить о товарах, перегруженных дорогах и областях, которым трудно добраться до общего рынка. И обязательно замечать, когда неприятности заканчиваются.\n\nБольшие числа сами по себе не наполняют корзину. Поэтому рядом с хозяйственными успехами найдётся место вопросу о достатке. А в спокойный месяц заглянем в торговую сводку: цены умеют поддерживать интерес к экономике без помощи редакции."
 NFP43_WELCOME_1_LEAD:0 "Добро пожаловать в экономическую рубрику. Будем замечать трудности раньше, чем они станут привычными."
 NFP43_WELCOME_1_TITLE:0 "Хозяйство начинается не со сводки"
 NFP43_WELCOME_2_BODY:0 "Война касается не только тех, кто отмечает её на карте. В этой рубрике мы будем следить за началом и концом столкновений, союзами и составом нашего блока. В дипломатических кризисах заметим, кто предъявил требования, кто поддержал сторону и кто предпочёл отступить.\n\nВажные известия могут прийти отдельным срочным выпуском, если вы разрешите такую доставку. Хотелось бы чаще сообщать об удачных переговорах. Но и неприятную новость лучше прочесть вовремя, чем узнать о ней из последствий."
 NFP43_WELCOME_2_LEAD:0 "Для военной рубрики важны начало столкновения, его окончание и перемены, затрагивающие безопасность страны."
 NFP43_WELCOME_2_TITLE:0 "Между договором и пушкой"
 NFP43_WELCOME_3_BODY:0 "Умеют ли люди читать, как живут и что происходит во время выборов — вопросы для этой рубрики. За переменами общества порой труднее уследить, чем за новой границей. Тем интереснее посмотреть, что меняется за знакомыми названиями областей.\n\nВо время выборов будем сравнивать ход партийной кампании с предыдущими известиями. Её размах ещё не равен числу голосов. Предвыборная уверенность бывает заразительной; редакция постарается сохранить способность дождаться подсчёта."
 NFP43_WELCOME_3_LEAD:0 "В этой рубрике есть место достижениям просвещения и переменам в жизни нашей страны."
 NFP43_WELCOME_3_TITLE:0 "Страна — это ещё и люди"
 NFP43_WELCOME_4_BODY:0 "Здесь встретятся законы, новые знания и перемены в положении держав. Своими достижениями приятно гордиться. Чужие полезно замечать — в том числе когда они заставляют спросить, почему у нас пока не получилось так же.\n\nНачать знакомство можно с обложки, а дальше перейти к отдельной статье. Старые номера остаются в архиве: там найдётся двенадцать выпусков. Иногда особенно интересно перечитать прежнюю уверенность, уже зная продолжение истории."
 NFP43_WELCOME_4_LEAD:0 "Здесь собираются заметные государственные перемены, новые знания и важные зарубежные известия."
 NFP43_WELCOME_4_TITLE:0 "За пределами привычного"
 NFP43_WELCOME_METRICS:0 "Приветственная статья, а не сообщение о новом событии. Четыре рубрики показаны для знакомства; обычный состав следующих номеров определяется подпиской. Наблюдения продолжаются без сброса. Если прежнего сопоставимого наблюдения нет, изменение не вычисляется."
 NFP43_WELCOME_REACH:0 "вступительный материал для страны читателя"
 NFP43_WELCOME_REASON:0 "знакомство с газетой при подтверждении подписки"
 NFP45_ARCHIVE_NOTE:0 "Новые номера приходят ежемесячно по подписке. Прочитанные выпуски остаются в архиве."
 NFP47_CONFIRM:0 "Подтвердить выбор"
 NFP47_CONFIRM_HINT:0 "Сохранить условия доставки и вернуться к чтению газеты."
 NFP47_EDITION:0 "Национальный вестник"
 NFP47_FOOTNOTE:0 "Условия можно изменить в любое время. Архив выпусков сохраняется."
 NFP47_MONTHLY:0 "Ежемесячный выпуск"
 NFP47_MONTHLY_NOTE:0 "Новости страны и мира — в одном номере каждый месяц."
 NFP47_READER:0 "Подписчик: [GetPlayer.GetName]"
 NFP47_REQUEST:0 "Прошу доставлять следующие выпуски газеты:"
 NFP47_RETURN:0 "Вернуться к газете"
 NFP47_RETURN_HINT:0 "Вернуться к чтению. Отметки доставки сохраняются при их изменении."
 NFP47_SECTIONS:0 "Экономика · Война · Общество · События"
 NFP47_TERMS:0 "Отмеченные виды доставки действуют независимо друг от друга.\nЧтобы приостановить получение газеты, снимите обе отметки."
 NFP47_TITLE:0 "ПОДПИСНОЙ ЛИСТ"
 NFP47_URGENT:0 "Срочный выпуск"
 NFP47_URGENT_NOTE:0 "Войны и мировые события: отдельный номер с паузой."
 NFP50_EMPTY:0 ""
 NFP50_FAMILY_BODY:0 "[Localize(ScriptContainer.MakeScope.Var('nfp30_body').GetFlagName)]"
 NFP50_FAMILY_DIVERGENCE_FACTS:0 "За три месячных интервала прогноз годового ВВП вырос с [ScriptContainer.GetVariableValue('nfp20_before')|0] до [ScriptContainer.GetVariableValue('nfp20_after')|0]. Средний уровень жизни за тот же период снизился на [ScriptContainer.GetVariableValue('nfp20_extra')|2] пункта."
 NFP50_FAMILY_DIVERGENCE_HOME_END_1:0 "Рост общего объёма хозяйства ещё не означает благополучия семей. Редакция считает положение населения вопросом государственной важности; причины расхождения требуют отдельного разбора."
 NFP50_FAMILY_DIVERGENCE_HOME_END_2:0 "Стране нужны достижения, ощутимые и в повседневной жизни. Сами эти цифры не объясняют причин ухудшения и не позволяют назначить виновных."
 NFP50_FAMILY_ELECTION_AGAIN:0 "Теперь можно сравнить нынешнюю кампанию с прошлым сообщением. У одних партий мотивация могла прибавиться, у других — ослабнуть. Знаки рядом с числами показывают именно эту перемену, а не будущую разницу в голосах."
 NFP50_FAMILY_ELECTION_BASE:0 "[SelectLocalization(GreaterThan_CFixedPoint(ScriptContainer.GetVariableValue('nfp43_previous_issue'), '(CFixedPoint)0'), 'NFP43_ELECTION_BASELINE', 'NFP43_ELECTION_FIRST')]"
 NFP50_FAMILY_ELECTION_END_1:0 "До итогов выборов ещё есть история, которую стоит прочесть. Будем следить за её продолжением. Очень хочется узнать, кому достанется поддержка избирателей; пока не станем голосовать за них газетной строкой."
 NFP50_FAMILY_ELECTION_END_2:0 "До итогов выборов ещё есть история, которую стоит прочесть. Будем следить за её продолжением. Очень хочется узнать, кому достанется поддержка избирателей; пока не станем голосовать за них газетной строкой."
 NFP50_FAMILY_ELECTION_FIRST:0 "С этой сводки начинается наше сравнение кампании. Кто набирает ход, а кто его теряет, станет яснее по следующим сообщениям. Пока знакомимся с положением сторон."
 NFP50_FAMILY_ELECTION_NOTE:0 "Здесь показан ход кампании, а не подсчитанные голоса. Числа сравнивают мотивацию шести ведущих партий; считать их процентами избирателей нельзя. До результата ещё предстоит дойти, каким бы уверенным ни казался сегодняшний участник."
 NFP50_FAMILY_ELECTION_TABLE:0 "[Localize(ScriptContainer.MakeScope.Var('nfp43_row_1').GetFlagName)]\n[Localize(ScriptContainer.MakeScope.Var('nfp43_row_2').GetFlagName)]\n[Localize(ScriptContainer.MakeScope.Var('nfp43_row_3').GetFlagName)]\n[Localize(ScriptContainer.MakeScope.Var('nfp43_row_4').GetFlagName)]\n[Localize(ScriptContainer.MakeScope.Var('nfp43_row_5').GetFlagName)]\n[Localize(ScriptContainer.MakeScope.Var('nfp43_row_6').GetFlagName)]"
 NFP50_FAMILY_EXPECTED:0 "На момент сообщения средний уровень жизни — [ScriptContainer.GetVariableValue('nfp50_family_sol')|2], средний ожидаемый — [ScriptContainer.GetVariableValue('nfp50_family_expected_sol')|2]. Первый показатель ниже второго; это ещё одна причина внимательно изучить положение населения."
 NFP50_FAMILY_GAINED_ALLIANCE_1_1:0 "У нашей страны появился формальный союзник — [ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName]. Теперь общие планы опираются на договорённость. Приятно, когда рядом есть тот, с кем можно обсуждать не только разногласия. Осталось посмотреть, насколько удачно удастся договориться о делах."
 NFP50_FAMILY_GAINED_ALLIANCE_1_2:0 "Союз заслуживает большего, чем обмен любезностями. Его польза обнаружится в конкретных решениях и исполнении обязательств. Печать на договоре — хорошее начало. Хотелось бы, чтобы на ней сотрудничество не закончилось."
 NFP50_FAMILY_GAINED_ALLIANCE_2_1:0 "У нашей страны появился формальный союзник — [ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName]. Теперь общие планы опираются на договорённость. Приятно, когда рядом есть тот, с кем можно обсуждать не только разногласия. Осталось посмотреть, насколько удачно удастся договориться о делах."
 NFP50_FAMILY_GAINED_ALLIANCE_2_2:0 "Союз заслуживает большего, чем обмен любезностями. Его польза обнаружится в конкретных решениях и исполнении обязательств. Печать на договоре — хорошее начало. Хотелось бы, чтобы на ней сотрудничество не закончилось."
 NFP50_FAMILY_GAINED_BLOC_1_1:0 "Теперь мы и страна [ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName] состоим в одном блоке. Общий круг стал другим. Не будем гадать, кто кого убедил присоединиться: важнее, какие возможности открывает нынешнее соседство внутри объединения."
 NFP50_FAMILY_GAINED_BLOC_1_2:0 "Общее знамя ещё не заменяет общей работы. Здесь есть о чём договариваться, даже если отдельного военного союза между нами нет. Было бы приятно, если бы вслед за знакомством нашлось место и полезным взаимовыгодным переговорам."
 NFP50_FAMILY_GAINED_BLOC_2_1:0 "Теперь мы и страна [ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName] состоим в одном блоке. Общий круг стал другим. Не будем гадать, кто кого убедил присоединиться: важнее, какие возможности открывает нынешнее соседство внутри объединения."
 NFP50_FAMILY_GAINED_BLOC_2_2:0 "Общее знамя ещё не заменяет общей работы. Здесь есть о чём договариваться, даже если отдельного военного союза между нами нет. Было бы приятно, если бы вслед за знакомством нашлось место и полезным взаимовыгодным переговорам."
 NFP50_FAMILY_GROWTH:0 "Прирост прогноза годового ВВП между указанными наблюдениями составляет [ScriptContainer.GetVariableValue('nfp50_family_gdp_growth')|2]% — речь о размере хозяйства, а не о доходах каждой семьи."
 NFP50_FAMILY_INTRO:0 "[Localize(ScriptContainer.MakeScope.Var('nfp30_lead').GetFlagName)]"
 NFP50_FAMILY_LAW_AWAY_END_1:0 "Наши читатели получают возможность следить за переменами у других народов. Пока установлен факт действия новой нормы; её последствия ещё предстоит оценить."
 NFP50_FAMILY_LAW_AWAY_END_2:0 "Сведения не позволяют приписать реформу парламентскому голосованию или обещать определённый результат. За её действием следует наблюдать отдельно."
 NFP50_FAMILY_LAW_FACTS:0 "Вступил в силу закон: [Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]."
 NFP50_FAMILY_LAW_HOME_END_1:0 "Редакция сообщает сам факт перемены. Каким путём она была принята и как скажется на жизни жителей, это известие пока не устанавливает."
 NFP50_FAMILY_LAW_HOME_END_2:0 "Оценка результатов реформы потребует времени и сведений о её действии. Газета не выдаёт вступление закона в силу за уже достигнутый общественный результат."
 NFP50_FAMILY_LOST_ALLIANCE_1_1:0 "Прежнего альянса со страной [ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName] больше нет. Для планов, в которых этот союз занимал своё место, новость существенная. Причина перемены ещё требует разбора, но рассчитывать на прежнюю договорённость по привычке уже не стоит."
 NFP50_FAMILY_LOST_ALLIANCE_1_2:0 "Теперь придётся внимательнее посмотреть на собственные возможности. Объявлять бывшего союзника вечным врагом столь же поспешно, как продолжать считать его помощь обеспеченной. В дипломатии память полезна. Особенно когда помнишь и о том, что изменилось."
 NFP50_FAMILY_LOST_ALLIANCE_2_1:0 "Прежнего альянса со страной [ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName] больше нет. Для планов, в которых этот союз занимал своё место, новость существенная. Причина перемены ещё требует разбора, но рассчитывать на прежнюю договорённость по привычке уже не стоит."
 NFP50_FAMILY_LOST_ALLIANCE_2_2:0 "Теперь придётся внимательнее посмотреть на собственные возможности. Объявлять бывшего союзника вечным врагом столь же поспешно, как продолжать считать его помощь обеспеченной. В дипломатии память полезна. Особенно когда помнишь и о том, что изменилось."
 NFP50_FAMILY_LOST_BLOC_1_1:0 "Со страной [ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName] нас больше не связывает членство в одном блоке. Прежний общий круг остался в прежней сводке. Измениться могло положение любой стороны или самого объединения; нынешний результат от этого не становится менее важным для наших планов."
 NFP50_FAMILY_LOST_BLOC_1_2:0 "Совместных оснований для расчёта стало меньше. Отдельные договоры между странами — другой вопрос, и их стоит рассмотреть по существу. Было бы странно продолжать пользоваться старой картиной отношений только потому, что новую ещё не успели повесить на стену."
 NFP50_FAMILY_LOST_BLOC_2_1:0 "Со страной [ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName] нас больше не связывает членство в одном блоке. Прежний общий круг остался в прежней сводке. Измениться могло положение любой стороны или самого объединения; нынешний результат от этого не становится менее важным для наших планов."
 NFP50_FAMILY_LOST_BLOC_2_2:0 "Совместных оснований для расчёта стало меньше. Отдельные договоры между странами — другой вопрос, и их стоит рассмотреть по существу. Было бы странно продолжать пользоваться старой картиной отношений только потому, что новую ещё не успели повесить на стену."
 NFP50_FAMILY_PRICE_CORE:0 "[SelectLocalization(GreaterThan_CFixedPoint(ScriptContainer.GetVariableValue('nfp32_rows'), '(CFixedPoint)0'), 'NFP30_PRICE_MARKET', 'NFP30_PRICE_UNAVAILABLE')]\n\n[Localize(ScriptContainer.MakeScope.Var('nfp32_row_1').GetFlagName)]\n[Localize(ScriptContainer.MakeScope.Var('nfp32_row_2').GetFlagName)]\n[Localize(ScriptContainer.MakeScope.Var('nfp32_row_3').GetFlagName)]\n[Localize(ScriptContainer.MakeScope.Var('nfp32_row_4').GetFlagName)]\n[Localize(ScriptContainer.MakeScope.Var('nfp32_row_5').GetFlagName)]\n[Localize(ScriptContainer.MakeScope.Var('nfp32_row_6').GetFlagName)]"
 NFP50_FAMILY_PRICE_END_1:0 "За ценами полезно следить без ожидания громкой неприятности. Здесь лишь отдельные товары, поэтому общий семейный расход по этой таблице не подсчитаешь. Но присмотреться к привычным покупкам она помогает. Иногда самое содержательное известие ждёт читателя у прилавка."
 NFP50_FAMILY_PRICE_END_2:0 "За ценами полезно следить без ожидания громкой неприятности. Здесь лишь отдельные товары, поэтому общий семейный расход по этой таблице не подсчитаешь. Но присмотреться к привычным покупкам она помогает. Иногда самое содержательное известие ждёт читателя у прилавка."
 NFP50_FAMILY_PRICE_NOTE:0 "[SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp32_comparisons'), '(CFixedPoint)0'), 'NFP30_PRICE_FIRST', 'NFP30_PRICE_METHOD')]"
 NFP50_FAMILY_SHORTAGE_FACTS:0 "Товар: [Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]. На нашем рынке нехватка отмечена в двух последовательных месячных наблюдениях."
 NFP50_FAMILY_SHORTAGE_HOME_END_1:0 "Следует внимательно проверить снабжение и потребление этого товара. Сообщение относится к самой нехватке: высокая цена заслуживает отдельного рассмотрения."
 NFP50_FAMILY_SHORTAGE_HOME_END_2:0 "Установлен факт рыночного дефицита; его причины пока не определены. Назначать ответственных или обещать эффект конкретной постройки на этих сведениях нельзя."
 NFP50_FAMILY_SHORTAGE_RECOVERY_FACTS:0 "Товар: [Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]. После нашего предупреждения два месячных наблюдения подряд не обнаруживают прежнего рыночного дефицита."
 NFP50_FAMILY_SHORTAGE_RECOVERY_HOME_END_1:0 "Редакция отмечает отсутствие прежнего дефицита. Это ещё не обещание низких цен: дороговизна и нехватка — разные вопросы."
 NFP50_FAMILY_SHORTAGE_RECOVERY_HOME_END_2:0 "Благоприятное состояние сохраняется два месяца. Газета продолжит различать наличие товара и его доступность по цене; последнее этим сообщением не установлено."
 NFP50_FAMILY_SOL:0 "За тот же период средний уровень жизни изменился с [ScriptContainer.GetVariableValue('nfp50_family_sol_before')|2] до [ScriptContainer.GetVariableValue('nfp50_family_sol')|2]. Это средний показатель страны: положение отдельных сословий и областей может отличаться."
 NFP50_FAMILY_TECH_ANILINE_1:0 "Стало доступно строительство заводов синтетических материалов. Красители теперь можно получать промышленным способом. Для производства тканей это интересная возможность: цвет будущего изделия всё меньше обязан происхождению сырья."
 NFP50_FAMILY_TECH_ANILINE_2:0 "Для выпуска красителей потребуются сера и удобрения. Новая технология меняет цепочку снабжения, а не отменяет её. У красивого цвета, как выясняется, бывают довольно неожиданные хозяйственные родственники."
 NFP50_FAMILY_TECH_ANTIBIOTICS_1:0 "Страна получила возможность расширить здравоохранение. Медицинское знание заслуживает внимания прежде всего потому, что касается самой обычной надежды человека — поправиться. Теперь у этой надежды стало больше оснований, хотя на устройство помощи всё ещё нужны средства."
 NFP50_FAMILY_TECH_ANTIBIOTICS_2:0 "Эпидемии будут слабее сказываться на урожае. Это конкретная хозяйственная польза нового знания. Болезнь умеет нарушать жизнь далеко за пределами больничной комнаты; приятно, когда средство против неё помогает и повседневной работе."
 NFP50_FAMILY_TECH_AWAY_END_1:0 "Чужие возможности стали шире. Для нас это повод присмотреться к собственным делам: что уже умеем мы и как этим пользуемся? Поздравление может подождать почтового отправления. Полезную мысль для себя лучше оставить сразу."
 NFP50_FAMILY_TECH_AWAY_END_2:0 "Чужие возможности стали шире. Для нас это повод присмотреться к собственным делам: что уже умеем мы и как этим пользуемся? Поздравление может подождать почтового отправления. Полезную мысль для себя лучше оставить сразу."
 NFP50_FAMILY_TECH_BESSEMER_PROCESS_1:0 "Сталелитейным заводам стал доступен бессемеровский процесс. Теперь они могут получать больше стали. Для хозяйства, которому металл нужен не только на памятники собственным успехам, возможность полезная."
 NFP50_FAMILY_TECH_BESSEMER_PROCESS_2:0 "Новый способ требует больше железа при прежнем расходе угля. Здесь хорошо видно, что прогресс не освобождает от снабжения. Прежде чем радоваться будущей стали, придётся позаботиться о том, из чего её получать."
 NFP50_FAMILY_TECH_ELECTRICAL_GENERATION_1:0 "Теперь можно строить электростанции. У хозяйства появился новый источник возможностей. Пока это знание, которому ещё предстоит обзавестись сооружениями и снабжением. Но повод посмотреть на будущие предприятия уже другой."
 NFP50_FAMILY_TECH_ELECTRICAL_GENERATION_2:0 "Города смогут перейти на электрическое уличное освещение. Для этого нужно местное электричество. Перемена обещает быть видимой буквально: тем интереснее дождаться, когда за разговорами о светлом будущем появится свет на самой улице."
 NFP50_FAMILY_TECH_ELECTRIC_TELEGRAPH_1:0 "Военные знания пополнились электрическим телеграфом. Для страны это новая возможность иначе справляться с тяжестью войны. Польза известия здесь измеряется не только тем, насколько внушительно выглядит новое слово в военной сводке."
 NFP50_FAMILY_TECH_ELECTRIC_TELEGRAPH_2:0 "Потери будут меньше усиливать утомление страны войной. Речь именно о способности выдерживать её тяжесть; самих погибших это знание не возвращает. Хотелось бы, чтобы полезное военное приобретение не пришлось слишком часто проверять на деле."
 NFP50_FAMILY_TECH_FACTS:0 "Теперь стране доступна технология [Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]."
 NFP50_FAMILY_TECH_HOME_END_1:0 "Знать теперь умеем больше — осталось толково этим воспользоваться. Для нашей страны это хороший повод гордиться и одновременно заняться делом. Хотелось бы следующую новость посвятить тому, что получилось благодаря новым знаниям. Перечень возможностей приятен. Их применение всё-таки приятнее."
 NFP50_FAMILY_TECH_HOME_END_2:0 "Знать теперь умеем больше — осталось толково этим воспользоваться. Для нашей страны это хороший повод гордиться и одновременно заняться делом. Хотелось бы следующую новость посвятить тому, что получилось благодаря новым знаниям. Перечень возможностей приятен. Их применение всё-таки приятнее."
 NFP50_FAMILY_TECH_KNOWN:0 "Мы уже располагаем этим знанием. Теперь им сможет воспользоваться и другая страна. Собственное преимущество в знакомстве с технологией здесь закончилось. Посмотрим, кто лучше распорядится тем, что знает: в хозяйстве это обычно интереснее соревнования в памяти."
 NFP50_FAMILY_TECH_QUININE_1:0 "Хинин позволяет преодолеть препятствие обычной малярии для колониального продвижения. Тяжёлая малярия остаётся отдельной проблемой. На карте стало больше возможностей, но было бы слишком наивно считать, что вместе с одним средством исчезли все местные трудности."
 NFP50_FAMILY_TECH_QUININE_2:0 "Появилась возможность расширить здравоохранение и колониальное управление. Дополнительные средства на них ещё предстоит выделить. Лекарство расширило возможности страны; казначейству и управлению теперь есть над чем подумать."
 NFP50_FAMILY_TECH_RAILWAYS_1:0 "Теперь можно строить железные дороги. Расстояние между городами от этого не сократится. Зато появляется способ преодолевать его с другими возможностями для перевозок. Рельсы предстоит ещё проложить: нарисованная линия в хозяйстве работает хуже настоящей."
 NFP50_FAMILY_TECH_RAILWAYS_2:0 "Шахтам стал доступен железнодорожный транспорт. Для нового способа работы понадобятся транспортные услуги. Добыть больше — полезное дело. Хорошо бы после этого не выяснить, что добытое опять не на чем вывезти."
 NFP50_FAMILY_TECH_STEAM_DONKEY_1:0 "На лесозаготовках и в шахтах можно механизировать вспомогательные работы. Пар способен взять на себя часть труда, для которого прежде требовались рабочие руки. У хозяйства появляется ещё один способ справляться с нагрузкой."
 NFP50_FAMILY_TECH_STEAM_DONKEY_2:0 "Для механизации понадобятся двигатели, а чернорабочих потребуется меньше. Экономия труда — приятная возможность для предприятия. Как перемена сложится для людей, зависит и от того, найдётся ли им другая работа. Машине место подобрать иногда проще, чем человеку."
 NFP50_FAMILY_TECH_STEELWORKING_1:0 "Стране стало доступно строительство сталелитейных заводов. У хозяйства появляется основа для новых производственных возможностей. Сталь в перечне знаний — начало истории; сталь, которой можно воспользоваться, потребует предприятий и работы."
 NFP50_FAMILY_TECH_STEELWORKING_2:0 "Инструментальные мастерские смогут применять чугун. У привычного инструмента появляется другая производственная история. Новые способы работы предстоит выбрать и обеспечить материалами. Одного знакомства с ними мастерской для перемен маловато."
 NFP50_FAMILY_TECH_UNKNOWN:0 "У нас этого знания пока нет. Значит, в этой области другая страна получила преимущество. Хотелось бы со временем ответить собственным результатом. Объяснять, почему чужое достижение не такое уж важное, можно и без исследований, но пользы от этого поменьше."
 NFP50_FAMILY_WAR_ALLIANCE_1_1:0 "Наш союзник — [ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName] — оказался обороняющейся стороной в новой войне. Инициатором выступает [ScriptContainer.MakeScope.Var('nfp20_extra_detail').GetCountryDefinition.GetName]. Для нас это известие с прямым дипломатическим значением: речь идёт о стране, с которой нас связывает альянс."
 NFP50_FAMILY_WAR_ALLIANCE_1_2:0 "Теперь союзные договорённости придётся соотносить с настоящей войной. Само сообщение ещё не означает, что мы уже вступили в неё. Но оставлять такую новость среди далёких зарубежных известий было бы странно. Союз вспоминают не только тогда, когда удобно поздравлять друг друга."
 NFP50_FAMILY_WAR_ALLIANCE_2_1:0 "Наш союзник — [ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName] — оказался обороняющейся стороной в новой войне. Инициатором выступает [ScriptContainer.MakeScope.Var('nfp20_extra_detail').GetCountryDefinition.GetName]. Для нас это известие с прямым дипломатическим значением: речь идёт о стране, с которой нас связывает альянс."
 NFP50_FAMILY_WAR_ALLIANCE_2_2:0 "Теперь союзные договорённости придётся соотносить с настоящей войной. Само сообщение ещё не означает, что мы уже вступили в неё. Но оставлять такую новость среди далёких зарубежных известий было бы странно. Союз вспоминают не только тогда, когда удобно поздравлять друг друга."
 NFP50_FAMILY_WAR_BLOC_1_1:0 "На страну [ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName], участника нашего блока, началась война. Инициатор противостояния — [ScriptContainer.MakeScope.Var('nfp20_extra_detail').GetCountryDefinition.GetName]. Это касается круга, в котором мы строим общие планы. И повод внимательнее прочесть известие здесь куда весомее обычного любопытства."
 NFP50_FAMILY_WAR_BLOC_1_2:0 "Общий блок не превращает всякую войну участника в нашу собственную. Но делает её важной для нашего расчёта. Хотелось бы понимать, как изменятся возможности партнёра, прежде чем строить следующие планы так, словно вокруг по-прежнему спокойно."
 NFP50_FAMILY_WAR_BLOC_2_1:0 "На страну [ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName], участника нашего блока, началась война. Инициатор противостояния — [ScriptContainer.MakeScope.Var('nfp20_extra_detail').GetCountryDefinition.GetName]. Это касается круга, в котором мы строим общие планы. И повод внимательнее прочесть известие здесь куда весомее обычного любопытства."
 NFP50_FAMILY_WAR_BLOC_2_2:0 "Общий блок не превращает всякую войну участника в нашу собственную. Но делает её важной для нашего расчёта. Хотелось бы понимать, как изменятся возможности партнёра, прежде чем строить следующие планы так, словно вокруг по-прежнему спокойно."
 NFP50_FAMILY_WAR_END_AWAY_END_1:0 "Война закончилась, а разбирать её итоги ещё предстоит. Кто получил желаемое и чем за него заплатил, станет яснее из условий мира. Нам же полезно заново присмотреться к обеим сторонам: рассчитывать на их прежние возможности по привычке было бы слишком наивно."
 NFP50_FAMILY_WAR_END_AWAY_END_2:0 "Война закончилась, а разбирать её итоги ещё предстоит. Кто получил желаемое и чем за него заплатил, станет яснее из условий мира. Нам же полезно заново присмотреться к обеим сторонам: рассчитывать на их прежние возможности по привычке было бы слишком наивно."
 NFP50_FAMILY_WAR_END_CONTEXT:0 "Мир ставит перед странами новые вопросы. Можно закончить войну и ещё долго разбираться с тем, что она оставила после себя. Поэтому хорошую весть отметим сейчас, а оценку результата будем сверять с условиями соглашения."
 NFP50_FAMILY_WAR_END_FACTS:0 "Война завершилась. Главные стороны: [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName] и [ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName]."
 NFP50_FAMILY_WAR_END_HOME_END_1:0 "Теперь можно говорить об окончании войны. Для поздравления с победой нужны ещё её условия, а вот для надежды на мирную жизнь этого известия уже достаточно. Хотелось бы, чтобы следующая большая работа страны шла там, где что-нибудь создают. Поводов разрушать история нам и без того предлагает с избытком."
 NFP50_FAMILY_WAR_END_HOME_END_2:0 "Теперь можно говорить об окончании войны. Для поздравления с победой нужны ещё её условия, а вот для надежды на мирную жизнь этого известия уже достаточно. Хотелось бы, чтобы следующая большая работа страны шла там, где что-нибудь создают. Поводов разрушать история нам и без того предлагает с избытком."
 NFP50_FAMILY_WAR_START_AWAY_END_1:0 "У этой войны будут последствия и за пределами двух столиц. Какие из них коснутся нас, покажет её ход. Пока полезнее следить за участниками и их решениями, чем выбирать победителя по размеру названия на карте. Уверенные прогнозы особенно легко даются тем, кому не приходится за них отвечать."
 NFP50_FAMILY_WAR_START_AWAY_END_2:0 "У этой войны будут последствия и за пределами двух столиц. Какие из них коснутся нас, покажет её ход. Пока полезнее следить за участниками и их решениями, чем выбирать победителя по размеру названия на карте. Уверенные прогнозы особенно легко даются тем, кому не приходится за них отвечать."
 NFP50_FAMILY_WAR_START_CONTEXT:0 "Дипломатический спор дошёл до войны. Теперь одних убедительных слов сторонам недостаточно. За ними понадобятся люди, снабжение и силы, которые гораздо труднее собрать, чем удачную фразу для объявления о намерениях."
 NFP50_FAMILY_WAR_START_FACTS:0 "Началась война. Главные стороны: [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName] и [ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName]."
 NFP50_FAMILY_WAR_START_HOME_END_1:0 "Теперь война стала частью наших собственных дел. О её начале можно сообщить одной строкой. Всё, что последует за ней, в одну строку уже не поместится. Хотелось бы поскорее печатать известия о мире; пока будем внимательно читать вести с войны, не торопясь превращать надежду в победную реляцию."
 NFP50_FAMILY_WAR_START_HOME_END_2:0 "Теперь война стала частью наших собственных дел. О её начале можно сообщить одной строкой. Всё, что последует за ней, в одну строку уже не поместится. Хотелось бы поскорее печатать известия о мире; пока будем внимательно читать вести с войны, не торопясь превращать надежду в победную реляцию."
 NFP50_FAMILY_WELCOME_1_1:0 "Хорошо, когда нужное можно купить, доехать до работы и вернуться с заработком, которого хватает на жизнь. Здесь будем говорить о товарах, перегруженных дорогах и областях, которым трудно добраться до общего рынка. И обязательно замечать, когда неприятности заканчиваются."
 NFP50_FAMILY_WELCOME_1_2:0 "Большие числа сами по себе не наполняют корзину. Поэтому рядом с хозяйственными успехами найдётся место вопросу о достатке. А в спокойный месяц заглянем в торговую сводку: цены умеют поддерживать интерес к экономике без помощи редакции."
 NFP50_FAMILY_WELCOME_2_1:0 "Война касается не только тех, кто отмечает её на карте. В этой рубрике мы будем следить за началом и концом столкновений, союзами и составом нашего блока. В дипломатических кризисах заметим, кто предъявил требования, кто поддержал сторону и кто предпочёл отступить."
 NFP50_FAMILY_WELCOME_2_2:0 "Важные известия могут прийти отдельным срочным выпуском, если вы разрешите такую доставку. Хотелось бы чаще сообщать об удачных переговорах. Но и неприятную новость лучше прочесть вовремя, чем узнать о ней из последствий."
 NFP50_FAMILY_WELCOME_3_1:0 "Умеют ли люди читать, как живут и что происходит во время выборов — вопросы для этой рубрики. За переменами общества порой труднее уследить, чем за новой границей. Тем интереснее посмотреть, что меняется за знакомыми названиями областей."
 NFP50_FAMILY_WELCOME_3_2:0 "Во время выборов будем сравнивать ход партийной кампании с предыдущими известиями. Её размах ещё не равен числу голосов. Предвыборная уверенность бывает заразительной; редакция постарается сохранить способность дождаться подсчёта."
 NFP50_FAMILY_WELCOME_4_1:0 "Здесь встретятся законы, новые знания и перемены в положении держав. Своими достижениями приятно гордиться. Чужие полезно замечать — в том числе когда они заставляют спросить, почему у нас пока не получилось так же."
 NFP50_FAMILY_WELCOME_4_2:0 "Начать знакомство можно с обложки, а дальше перейти к отдельной статье. Старые номера остаются в архиве: там найдётся двенадцать выпусков. Иногда особенно интересно перечитать прежнюю уверенность, уже зная продолжение истории."
 NFP50_FAMILY_WELCOME_END_1:0 "На этом знакомство только начинается. Дальше будем возвращаться к событиям и смотреть, что изменилось. Хорошо бы, чтобы поводом перечитать старую тревожную заметку чаще становилась хорошая новая.\n\n$NFP89_DELIVERY$"
 NFP50_FAMILY_WELCOME_END_2:0 "На этом знакомство только начинается. Дальше будем возвращаться к событиям и смотреть, что изменилось. Хорошо бы, чтобы поводом перечитать старую тревожную заметку чаще становилась хорошая новая.\n\n$NFP89_DELIVERY$"
 NFP50_LAW_APPROVE:0 "поддержка"
 NFP50_LAW_END_1:0 "Теперь закону предстоит стать частью повседневной жизни. Сторонники уже могут назвать это успехом, противники — ошибкой. Нам интереснее, что окажется между этими двумя объяснениями, когда новые правила начнут работать. Хороший закон приятно прочесть. Ещё приятнее — хорошо по нему жить."
 NFP50_LAW_END_2:0 "Теперь закону предстоит стать частью повседневной жизни. Сторонники уже могут назвать это успехом, противники — ошибкой. Нам интереснее, что окажется между этими двумя объяснениями, когда новые правила начнут работать. Хороший закон приятно прочесть. Ещё приятнее — хорошо по нему жить."
