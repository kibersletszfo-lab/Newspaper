 NFP52_JAP_1_BODY:0 "В Японии восстановлена власть императора. Слова о возвращении старого порядка здесь открывают новую страницу. Прежнее соотношение сил между императорским двором и сёгунатом изменилось. Далёкая для многих читателей страна дала повод присмотреться к тому, куда она намерена двигаться.\n\nИмператорская реставрация состоялась. Политический центр страны получил иное положение, а вместе с ним возник вопрос о дальнейшем устройстве японской жизни. Торжественное провозглашение уже произошло. Повседневные последствия будут зависеть от решений, которые последуют за ним.\n\nВозвращение власти ещё не делает все будущие перемены свершившимися. Японии предстоит самой показать, как она распорядится новым порядком. Хотелось бы судить об этой истории по делам. У торжественных названий, как известно, недостатка в обещаниях не бывает.\n\nХроника датирована месяцем получения известия редакцией. При задержке связи само событие могло произойти раньше."
