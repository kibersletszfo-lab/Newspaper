 NFP51_RELATION_ALLY:0 "На момент события хотя бы одна из двух главных сторон связана с нашей страной формальным альянсом. Альянс сам по себе не доказывает нашего участия в этой игре или будущей войне."
 NFP51_RELATION_BLOC:0 "На момент события хотя бы одна из главных сторон состоит с нами в одном силовом блоке. Совместный блок не подменяет военный альянс и не означает нашего автоматического участия."
 NFP51_RELATION_JOINER:0 "В этом сообщении наша страна — присоединившаяся участница дипломатической игры. Сам факт участия не означает, что война уже началась."
 NFP51_RELATION_JOINER_ALLY:0 "Присоединившаяся держава на момент события связана с нами формальным альянсом. Из её решения нельзя автоматически вывести вступление нашей страны."
 NFP51_RELATION_JOINER_BLOC:0 "Присоединившаяся держава на момент события состоит с нами в одном силовом блоке. Это известие о её позиции, а не об обязательном участии всего блока."
 NFP51_RELATION_OWN:0 "Наша страна является одной из двух главных сторон этого противостояния. Поэтому известие касается нашей дипломатии непосредственно."
 NFP51_SPECIAL_HINT:0 "Этот специальный выпуск целиком посвящён одному событию."
 NFP51_SPECIAL_LABEL:0 "Экстренный выпуск"
 NFP51_START_1_CORE:0 "В указанном месяце началось дипломатическое противостояние. Инициатор — [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName]; первоначальная цель — [ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName]. Предмет: [Localize(ScriptContainer.MakeScope.Var('nfp51_play_label').GetFlagName)]."
 NFP51_START_1_END:0 "До войны дело ещё не дошло. Стороны могут искать поддержку, уступать или настаивать на своём. Хотелось бы, чтобы убедительный довод нашёлся раньше, чем убедительной сочтут только пушку. Будем следить за продолжением этого спора."
 NFP51_START_1_LEAD:0 "Инициатор требований — [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName]; другая сторона противостояния — [ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName]."
 NFP51_START_1_TITLE:0 "Доводы закончились требованиями"
 NFP51_START_2_CORE:0 "В дипломатической хронике появилось новое противостояние. Держава [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName] выдвинула требования державе [ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName]; предмет спора — [Localize(ScriptContainer.MakeScope.Var('nfp51_play_label').GetFlagName)]."
 NFP51_START_2_END:0 "До войны дело ещё не дошло. Стороны могут искать поддержку, уступать или настаивать на своём. Хотелось бы, чтобы убедительный довод нашёлся раньше, чем убедительной сочтут только пушку. Будем следить за продолжением этого спора."
 NFP51_START_2_LEAD:0 "Зафиксировано начало дипломатического противостояния: [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName] и [ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName]."
 NFP51_START_2_TITLE:0 "Доводы закончились требованиями"
 NFP51_START_TIMELINE:0 "Начало этой дипломатической игры было зафиксировано в месяце [Localize(Concatenate('NFP30_MONTH_', ToString_int32(FixedPointToInt(ScriptContainer.GetVariableValue('nfp51_start_month')))))], [ScriptContainer.GetVariableValue('nfp51_start_year')|0] г. Позднейшие известия относятся к тому же кризису."
 NFP52_ACW_1_BODY:0 "В Соединённых Штатах началась гражданская война. Есть новости, после которых привычное название страны приходится читать иначе. Американский союз теперь спорит о своём будущем оружием. За словами о единстве и праве на собственный путь стоит тяжёлый вопрос: сколько людям придётся пережить, прежде чем спор закончится.\n\nСоединённые Штаты вступили в войну с отделившимся американским государством. Политическое противостояние перешло ту черту, за которой решения принимают уже не только за столом переговоров. Теперь от исхода боевых действий зависит и будущее самого союза.\n\nДля остального мира это больше, чем далёкая американская ссора. Меняется положение страны, с которой торгуют, договариваются и связывают собственные планы. Но прежде всего война касается тех, кому приходится жить внутри этого раскола. Хотелось бы скорее писать об условиях мира, чем привыкать к очередным известиям о продолжении войны.\n\nХроника датирована месяцем получения известия редакцией. При задержке связи само событие могло произойти раньше."
 NFP52_ACW_1_CONTEXT:0 "Для остального мира это больше, чем далёкая американская ссора. Меняется положение страны, с которой торгуют, договариваются и связывают собственные планы. Но прежде всего война касается тех, кому приходится жить внутри этого раскола. Хотелось бы скорее писать об условиях мира, чем привыкать к очередным известиям о продолжении войны."
