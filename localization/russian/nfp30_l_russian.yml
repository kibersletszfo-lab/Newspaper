 NFP50_LAW_MOVEMENT_RELATIVE_1:0 "Общественные движения также имеют свои предпочтения. [SelectLocalization(GreaterThan_CFixedPoint(ScriptContainer.GetVariableValue('nfp50_law_move_yes_present'), '(CFixedPoint)0'), 'NFP50_LAW_MOVE_YES', 'NFP50_LAW_NO_MOVE')] [SelectLocalization(GreaterThan_CFixedPoint(ScriptContainer.GetVariableValue('nfp50_law_move_no_present'), '(CFixedPoint)0'), 'NFP50_LAW_MOVE_NO', 'NFP50_LAW_NO_MOVE')] По этим позициям видно, кому закон близок, а кому поперёк горла. Кто именно добился его принятия — отдельный вопрос."
 NFP50_LAW_MOVEMENT_RELATIVE_2:0 "Общественные движения также имеют свои предпочтения. [SelectLocalization(GreaterThan_CFixedPoint(ScriptContainer.GetVariableValue('nfp50_law_move_yes_present'), '(CFixedPoint)0'), 'NFP50_LAW_MOVE_YES', 'NFP50_LAW_NO_MOVE')] [SelectLocalization(GreaterThan_CFixedPoint(ScriptContainer.GetVariableValue('nfp50_law_move_no_present'), '(CFixedPoint)0'), 'NFP50_LAW_MOVE_NO', 'NFP50_LAW_NO_MOVE')] По этим позициям видно, кому закон близок, а кому поперёк горла. Кто именно добился его принятия — отдельный вопрос."
