 NFP50_LAW_FACT_2:0 "Начал действовать закон «[Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]». Речь о стране [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName]. [SelectLocalization(GreaterThan_CFixedPoint(ScriptContainer.GetVariableValue('nfp50_law_old_known'), '(CFixedPoint)0'), 'NFP50_LAW_OLD', 'NFP50_LAW_NO_OLD')]"
 NFP50_LAW_GOV_BASE_1:0 "Посмотрим, как к закону относятся в правительстве. [Localize(ScriptContainer.MakeScope.Var('nfp50_law_gov_summary').GetFlagName)][SelectLocalization(GreaterThan_CFixedPoint(ScriptContainer.GetVariableValue('nfp50_law_gov_yes_present'), '(CFixedPoint)0'), 'NFP50_LAW_GOV_YES_NAME', 'NFP50_LAW_NO_MOVE')][SelectLocalization(GreaterThan_CFixedPoint(ScriptContainer.GetVariableValue('nfp50_law_gov_no_present'), '(CFixedPoint)0'), 'NFP50_LAW_GOV_NO_NAME', 'NFP50_LAW_NO_MOVE')] Здесь речь об отношении к самому закону; сравнить его с прежним порядком по этим сведениям нельзя."
 NFP50_LAW_GOV_BASE_2:0 "Посмотрим, как к закону относятся в правительстве. [Localize(ScriptContainer.MakeScope.Var('nfp50_law_gov_summary').GetFlagName)][SelectLocalization(GreaterThan_CFixedPoint(ScriptContainer.GetVariableValue('nfp50_law_gov_yes_present'), '(CFixedPoint)0'), 'NFP50_LAW_GOV_YES_NAME', 'NFP50_LAW_NO_MOVE')][SelectLocalization(GreaterThan_CFixedPoint(ScriptContainer.GetVariableValue('nfp50_law_gov_no_present'), '(CFixedPoint)0'), 'NFP50_LAW_GOV_NO_NAME', 'NFP50_LAW_NO_MOVE')] Здесь речь об отношении к самому закону; сравнить его с прежним порядком по этим сведениям нельзя."
 NFP50_LAW_GOV_NEUTRAL:0 "У групп в правительстве нет явного предпочтения. Бывает и так: закон изменился, а чаша политических весов осталась на месте."
 NFP50_LAW_GOV_NO_NAME:0 " Самая влиятельная группа среди противников в правительстве — «[Localize(ScriptContainer.MakeScope.Var('nfp50_law_gov_no_type').GetFlagName)]»."
 NFP50_LAW_GOV_OPPOSE:0 "Среди определившихся правительственных групп перевес у противников. Закон принят, но любовь к нему прилагалась не у всех."
 NFP50_LAW_GOV_RELATIVE_1:0 "Ещё перед принятием закона в правительстве обозначились свои предпочтения. [Localize(ScriptContainer.MakeScope.Var('nfp50_law_gov_summary').GetFlagName)][SelectLocalization(GreaterThan_CFixedPoint(ScriptContainer.GetVariableValue('nfp50_law_gov_yes_present'), '(CFixedPoint)0'), 'NFP50_LAW_GOV_YES_NAME', 'NFP50_LAW_NO_MOVE')][SelectLocalization(GreaterThan_CFixedPoint(ScriptContainer.GetVariableValue('nfp50_law_gov_no_present'), '(CFixedPoint)0'), 'NFP50_LAW_GOV_NO_NAME', 'NFP50_LAW_NO_MOVE')]"
 NFP50_LAW_GOV_RELATIVE_2:0 "Ещё перед принятием закона в правительстве обозначились свои предпочтения. [Localize(ScriptContainer.MakeScope.Var('nfp50_law_gov_summary').GetFlagName)][SelectLocalization(GreaterThan_CFixedPoint(ScriptContainer.GetVariableValue('nfp50_law_gov_yes_present'), '(CFixedPoint)0'), 'NFP50_LAW_GOV_YES_NAME', 'NFP50_LAW_NO_MOVE')][SelectLocalization(GreaterThan_CFixedPoint(ScriptContainer.GetVariableValue('nfp50_law_gov_no_present'), '(CFixedPoint)0'), 'NFP50_LAW_GOV_NO_NAME', 'NFP50_LAW_NO_MOVE')]"
 NFP50_LAW_GOV_SPLIT:0 "В правительстве есть и сторонники, и противники. Общие кабинеты, как видим, ещё не означают общих взглядов."
 NFP50_LAW_GOV_SUPPORT:0 "Среди определившихся правительственных групп перевес у сторонников. Для нового закона это полезная компания."
