 NFP52_ROM_2_TITLE:0 "Румынское объединение состоялось"
 NFP52_SPRING_1_BODY:0 "В Европе началась Весна народов. Политические потрясения складываются в событие, которое уже трудно рассматривать как сугубо внутреннее дело одной страны. Вопросы о власти и будущем общества вышли далеко за пределы спокойного обсуждения.\n\nРеволюционная волна стала фактом европейской жизни. У каждой страны свои обстоятельства и собственное развитие событий. Но прежняя уверенность, что чужие волнения останутся исключительно чужими, теперь требует куда более веских оснований, чем расстояние до границы.\n\nНазвание обещает весну, а исход ещё предстоит пережить. За надеждами на перемены стоят разногласия о том, какими именно они должны быть. Мы будем следить за каждой историей отдельно. Общее название эпохи не делает судьбы людей одинаковыми.\n\nХроника датирована месяцем получения известия редакцией. При задержке связи само событие могло произойти раньше."
