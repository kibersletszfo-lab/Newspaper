 NFP52_PANAMA_2_TITLE:0 "Панамский канал завершён"
 NFP52_ROM_1_BODY:0 "Румынское объединение стало фактом. В европейских делах появился общий центр власти там, где прежде приходилось говорить об отдельных княжествах. Для сторонников объединения это важный результат. Для соседей — повод обновить собственные расчёты.\n\nРумынские княжества получили общую власть. Это существенная перемена, даже если вопросы независимости и дальнейших границ остаются отдельными делами. Не стоит требовать от одного события ответа сразу на всю будущую историю страны.\n\nТеперь объединению предстоит повседневная работа. Общий центр получил возможность заниматься общими заботами, а вместе с ней — ответственность за результат. Хотелось бы, чтобы жизнь людей дала этой новости продолжение, достойное её торжественного начала.\n\nХроника датирована месяцем получения известия редакцией. При задержке связи само событие могло произойти раньше."
