 NFP52_FLU_2_BODY:0 "Получены известия о начале крупной эпидемии гриппа. Такие новости читаются иначе, чем сообщения о дипломатических успехах. Болезнь касается самого простого желания — чтобы близкие оставались здоровы, а завтрашний день не начинался с тревоги за них.\n\nНачалась эпидемия, известная как испанский грипп. Это повод внимательно следить за распространением болезни и положением затронутых стран. Из самого мирового известия ещё не следует, что она уже пришла к нам. Но расстояние до первых сообщений не стоит принимать за обещание безопасности.\n\nСейчас особенно нужны достоверные сведения. В тревожное время легко заполнить неизвестность слухами, только заботы о людях от этого не прибавится. Мы будем возвращаться к теме по мере поступления известий. Хотелось бы как можно скорее сообщить, что опасность отступает.\n\nДата заметки обозначает месяц, когда редакция получила подтверждение. Она не устанавливает точный день самого события."
