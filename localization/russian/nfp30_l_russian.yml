 NFP50_SUPPLY_BOTH_1:0 "Товар используется и государственными, и военными постройками. Его назначение усиливает важность вопроса снабжения; конкретные потери ведомств и армии этими данными не установлены."
 NFP50_SUPPLY_BOTH_2:0 "Государственные и военные постройки используют этот товар. Это повод внимательнее отнестись к снабжению, сохраняя различие между назначением товара и доказанными последствиями нехватки."
 NFP50_SUPPLY_CRITICAL_1:0 "Особая тревога: на дату события сочетание рыночной тяжести дефицита и местной нехватки в нашей стране соответствует красному предупреждению о товарном дефиците. Эти признаки не устанавливают число затронутых жителей и предприятий."
 NFP50_SUPPLY_CRITICAL_2:0 "На этот раз проблема требует особого внимания: на дату события для нашей страны выполнены условия красного предупреждения о товарном дефиците. Степень потерь отдельных предприятий из этих условий не следует."
 NFP50_SUPPLY_END_1:0 "Редакция призывает не откладывать изучение проблемы. Выбор между расширением выпуска, торговлей и другими мерами требует проверки местных условий: сама сводка не даёт готового хозяйственного рецепта."
 NFP50_SUPPLY_END_2:0 "Положение заслуживает скорого внимания. Сначала следует выяснить, где именно ограничено снабжение; газетные числа помогают поставить вопрос, но не заменяют проверки производства и торговли."
 NFP50_SUPPLY_FOLLOW_1:0 "Возвращаемся к ранее опубликованной истории снабжения. Новое наблюдение даёт повод продолжить разговор."
 NFP50_SUPPLY_FOLLOW_2:0 "Этот вопрос уже появлялся на наших страницах. Свежие сведения требуют вернуться к нему."
 NFP50_SUPPLY_GAP_1:0 "Товар — [ScriptContainer.MakeScope.Var('nfp46_good').GetGoods.GetNameNoIcon]. Заявки на продажу составляют менее 80% заявок на покупку. Заявки на покупку: [ScriptContainer.GetVariableValue('nfp46_buy_before')|1] → [ScriptContainer.GetVariableValue('nfp46_buy_after')|1]; на продажу: [ScriptContainer.GetVariableValue('nfp46_sell_before')|1] → [ScriptContainer.GetVariableValue('nfp46_sell_after')|1]. Слева — первый сохранённый срез этой серии, справа — срез на дату события. Существенный разрыв заявок сам по себе не доказывает производственного штрафа."
 NFP50_SUPPLY_GAP_2:0 "Спрос на товар «[ScriptContainer.MakeScope.Var('nfp46_good').GetGoods.GetNameNoIcon]» заметно опережает предложение: заявки на продажу составляют менее 80% заявок на покупку. Заявки на покупку: [ScriptContainer.GetVariableValue('nfp46_buy_before')|1] → [ScriptContainer.GetVariableValue('nfp46_buy_after')|1]; на продажу: [ScriptContainer.GetVariableValue('nfp46_sell_before')|1] → [ScriptContainer.GetVariableValue('nfp46_sell_after')|1]. Слева — первый сохранённый срез этой серии, справа — срез на дату события. Речь о рыночных заявках, а не о количестве товара, недополученного населением."
 NFP50_SUPPLY_GOVERNMENT_1:0 "Товар используется государственными постройками. Это важная сторона его назначения; конкретные учреждения и величину их потерь сводка не устанавливает."
 NFP50_SUPPLY_GOVERNMENT_2:0 "Спрос на товар связан в том числе с государственными постройками. Наличие такого применения не означает установленного ущерба конкретному учреждению."
 NFP50_SUPPLY_INTRO_1:0 "Нашему рынку необходимо внимание: в снабжении обнаружена устойчивая проблема."
 NFP50_SUPPLY_INTRO_2:0 "Снабжение вновь заставляет обратиться к рыночным сводкам. Газета выделяет товар, которого касается проблема."
 NFP50_SUPPLY_LONG_1:0 "Проблема отмечена в [ScriptContainer.GetVariableValue('nfp50_supply_observations')|0] последовательных месячных наблюдениях. В каждом сохранялся существенный разрыв заявок либо прямой признак дефицита; это не утверждение о непрерывном производственном штрафе между датами сводок."
 NFP50_SUPPLY_LONG_2:0 "Это уже [ScriptContainer.GetVariableValue('nfp50_supply_observations')|0]-е подряд месячное наблюдение с проблемой снабжения. Признак мог меняться между разрывом заявок и рыночным дефицитом; ежедневную картину такая летопись не восстанавливает."
 NFP50_SUPPLY_MILITARY_1:0 "Этот товар относится к снабжению военных построек. Такое назначение делает вопрос заслуживающим внимания, но не доказывает, что наши войска уже понесли потери или получили штраф."
 NFP50_SUPPLY_MILITARY_2:0 "Товар используется военными постройками. Газета отмечает значение снабжения, не приписывая ему неустановленных последствий для армии."
 NFP50_SUPPLY_NATIVE_1:0 "Товар — [ScriptContainer.MakeScope.Var('nfp46_good').GetGoods.GetNameNoIcon]. На дату события отмечен прямой признак рыночного дефицита. Заявки на покупку: [ScriptContainer.GetVariableValue('nfp46_buy_before')|1] → [ScriptContainer.GetVariableValue('nfp46_buy_after')|1]; на продажу: [ScriptContainer.GetVariableValue('nfp46_sell_before')|1] → [ScriptContainer.GetVariableValue('nfp46_sell_after')|1]. Слева — первый сохранённый срез этой серии, справа — срез на дату события."
 NFP50_SUPPLY_NATIVE_2:0 "В центре сводки — [ScriptContainer.MakeScope.Var('nfp46_good').GetGoods.GetNameNoIcon]: последний срез отмечает прямой признак дефицита рынка. Заявки на покупку: [ScriptContainer.GetVariableValue('nfp46_buy_before')|1] → [ScriptContainer.GetVariableValue('nfp46_buy_after')|1]; на продажу: [ScriptContainer.GetVariableValue('nfp46_sell_before')|1] → [ScriptContainer.GetVariableValue('nfp46_sell_after')|1]. Слева — первый сохранённый срез этой серии, справа — срез на дату события."
 NFP50_SUPPLY_NO_IMPORT_1:0 "В текущем срезе ввоз этого товара на рынок не отмечен. Производство — [ScriptContainer.GetVariableValue('nfp50_supply_production')|1], потребление — [ScriptContainer.GetVariableValue('nfp50_supply_consumption')|1], вывоз — [ScriptContainer.GetVariableValue('nfp50_supply_exports')|1]. Отсутствие ввоза не доказывает отсутствия торговых возможностей."
 NFP50_SUPPLY_NO_IMPORT_2:0 "Рынок не фиксирует импорта этого товара на дату события. На нём производится [ScriptContainer.GetVariableValue('nfp50_supply_production')|1], потребляется [ScriptContainer.GetVariableValue('nfp50_supply_consumption')|1], вывозится [ScriptContainer.GetVariableValue('nfp50_supply_exports')|1]. Возможность будущих поставок эта сводка не оценивает."
 NFP50_SUPPLY_PRICE_1:0 "Цена на дату события — £[ScriptContainer.GetVariableValue('nfp50_supply_price')|1]; отклонение от базовой цены — [ScriptContainer.GetVariableValue('nfp50_supply_premium')|1]% (минус означает дешевле). Цена не измеряет доступность товара каждому покупателю."
 NFP50_SUPPLY_PRICE_2:0 "У товара есть и ценовая сторона. Цена на дату события — £[ScriptContainer.GetVariableValue('nfp50_supply_price')|1]; отклонение от базовой цены — [ScriptContainer.GetVariableValue('nfp50_supply_premium')|1]% (минус означает дешевле). Цена не измеряет доступность товара каждому покупателю."
 NFP50_SUPPLY_RECOVERY_1:0 "Товар — [ScriptContainer.MakeScope.Var('nfp46_good').GetGoods.GetNameNoIcon]. В [ScriptContainer.GetVariableValue('nfp50_supply_good_observations')|0] последовательных месячных наблюдениях прямой признак дефицита отсутствует, а предложение составляет не менее 80% спроса. Заявки на покупку: [ScriptContainer.GetVariableValue('nfp46_buy_before')|1] → [ScriptContainer.GetVariableValue('nfp46_buy_after')|1]; на продажу: [ScriptContainer.GetVariableValue('nfp46_sell_before')|1] → [ScriptContainer.GetVariableValue('nfp46_sell_after')|1]. Слева — первый сохранённый срез этой серии, справа — срез на дату события. Разрыв ниже этого порога ещё может сохраняться."
 NFP50_SUPPLY_RECOVERY_2:0 "По товару «[ScriptContainer.MakeScope.Var('nfp46_good').GetGoods.GetNameNoIcon]» зафиксировано [ScriptContainer.GetVariableValue('nfp50_supply_good_observations')|0] последовательных месячных среза без прежнего признака дефицита и без разрыва предложений свыше 20% спроса. Заявки на покупку: [ScriptContainer.GetVariableValue('nfp46_buy_before')|1] → [ScriptContainer.GetVariableValue('nfp46_buy_after')|1]; на продажу: [ScriptContainer.GetVariableValue('nfp46_sell_before')|1] → [ScriptContainer.GetVariableValue('nfp46_sell_after')|1]. Слева — первый сохранённый срез этой серии, справа — срез на дату события. Полного равновесия эти условия не обещают."
 NFP50_SUPPLY_RECOVERY_END_1:0 "Газета отмечает улучшение, не объявляя вопрос закрытым навсегда. Благоприятные рыночные показатели сами по себе не доказывают восстановления каждого предприятия или снижения всех цен."
 NFP50_SUPPLY_RECOVERY_END_2:0 "Это полезный поворот в прежней истории. Дальнейшие выпуски сохранят наблюдение за рынком; нынешнее улучшение не следует принимать за обещание окончательного благополучия."
 NFP50_SUPPLY_RECOVERY_INTRO_1:0 "В опубликованной нами истории снабжения появились обнадёживающие сведения."
 NFP50_SUPPLY_RECOVERY_INTRO_2:0 "Возвращаемся к прежней нехватке: новые сводки отмечают улучшение."
 NFP50_SUPPLY_TRADE_1:0 "Производство на рынке — [ScriptContainer.GetVariableValue('nfp50_supply_production')|1], потребление — [ScriptContainer.GetVariableValue('nfp50_supply_consumption')|1]; импорт — [ScriptContainer.GetVariableValue('nfp50_supply_imports')|1], экспорт — [ScriptContainer.GetVariableValue('nfp50_supply_exports')|1]. Ввоз составляет [ScriptContainer.GetVariableValue('nfp50_supply_import_fraction')|1]% суммы производства и ввоза. Это показатель рыночного снабжения, а не доля покупок жителей нашей страны; торговые объёмы сами по себе не устанавливают причину нехватки."
 NFP50_SUPPLY_TRADE_2:0 "За общими заявками стоят и производство, и торговля. Производство на рынке — [ScriptContainer.GetVariableValue('nfp50_supply_production')|1], потребление — [ScriptContainer.GetVariableValue('nfp50_supply_consumption')|1]; импорт — [ScriptContainer.GetVariableValue('nfp50_supply_imports')|1], экспорт — [ScriptContainer.GetVariableValue('nfp50_supply_exports')|1]. Ввоз составляет [ScriptContainer.GetVariableValue('nfp50_supply_import_fraction')|1]% суммы производства и ввоза. Это показатель рыночного снабжения, а не доля покупок жителей нашей страны; торговые объёмы сами по себе не устанавливают причину нехватки."
