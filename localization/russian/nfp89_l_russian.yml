l_russian:
 NFP89_LAW_COLD:0 "Симпатии к этой стране у нас немного. Её закон от этого ни лучше, ни хуже не становится. Посмотрим на то, что он меняет для людей: спорить с чужим правительством удобнее, когда понимаешь предмет спора."
 NFP89_LAW_DEPENDENT:0 "Между нашими странами есть отношения подчинения. Это делает чужое внутреннее устройство ближе к нашим делам, но не превращает местные споры в точную копию наших. Новую норму будем оценивать по её собственному содержанию."
 NFP89_LAW_NEIGHBOR:0 "Соседям такую перемену трудно считать далёкой. Сравнить её с собственными порядками полезно; объявлять чужой закон готовым рецептом для нас было бы поспешно. У соседнего дома могут быть другие стены."
 NFP89_LAW_PARTNER:0 "Перемена произошла у нашего партнёра. Общие планы от этого не исчезают, но страну, с которой их строят, стоит знать не только по подписи под договором. Как новая норма приживётся, ещё увидим."
 NFP89_LAW_THREAT:0 "Отношения с этой страной дают повод насторожиться. Новый закон сам по себе ещё не направлен против нас. Но понимать, как теперь устроена эта страна, полезнее, чем отвечать на каждую её перемену одной насмешкой."
 NFP89_WORLD_ACW_DISTANT:0 "Издалека американскую войну удобно читать как спор двух лагерей. За этим удобством легко потерять главное: страна вступила во внутреннюю вооружённую борьбу, исход которой ещё не известен."
 NFP89_WORLD_ACW_NEIGHBOR:0 "Для соседей американская гражданская война начинается слишком близко, чтобы оставить её в отделе далёких известий. Близость заслуживает внимания, хотя сама по себе ещё не доказывает угрозы нашей границе."
 NFP89_WORLD_ACW_OWN:0 "Когда гражданская война идёт у нас, слово «внутренняя» мало утешает. Американский раскол теперь решается с оружием; кто победит и какой ценой, сегодняшнее известие ещё не сообщает."
 NFP89_WORLD_ACW_PARTNER:0 "Наши американские связи теперь приходится рассматривать на фоне гражданской войны. Прежние договорённости стоит перечитать внимательно: дружба с одной страной не даёт готового ответа на её внутренний раскол."
 NFP89_WORLD_ACW_RIVAL:0 "Неприязнь к американскому правительству не превращает гражданскую войну в безобидное зрелище. Противостояние меняет положение страны, с которой нам приходится считаться; победителя редакция заранее не назначает."
 NFP89_WORLD_AUS_DISTANT:0 "Австралия появилась в известиях как объединённое государство. Оценку того, как оно распорядится своим устройством, оставим будущим выпускам: сегодняшний ещё не располагает такой историей."
 NFP89_WORLD_AUS_NEIGHBOR:0 "Австралийское объединение произошло в близкой для нас части мира. Соседство делает новую политическую обстановку важной, но не объясняет без дальнейших фактов, что она принесёт нашим жителям."
 NFP89_WORLD_AUS_OWN:0 "Австралийское объединение стало собственной новостью наших читателей. Общее государство появилось; насколько удачно оно свяжет повседневные дела разных мест, ещё предстоит увидеть."
 NFP89_WORLD_AUS_PARTNER:0 "Наш австралийский партнёр получил новое общее устройство. Общие планы стоит обсуждать с учётом этой перемены, не приписывая объединению автоматически ни богатства, ни готовых новых обязательств."
 NFP89_WORLD_AUS_RIVAL:0 "С Австралией у нас непростые отношения. Её объединение от этого не превращается в пустую формальность: понять перемену полезнее, чем заранее объявить её незначительной."
 NFP89_WORLD_CAN_DISTANT:0 "Образование Канады меняет североамериканскую карту. Пока наша сводка сообщает именно об этом: рассказ о конкретных хозяйственных последствиях для нас требует других сведений."
 NFP89_WORLD_CAN_NEIGHBOR:0 "Рядом с нами оформилось канадское объединение. Для соседей это перемена близкой политической карты; объявлять вместе с ней новые намерения Канады было бы уже догадкой."
 NFP89_WORLD_CAN_OWN:0 "Канада образовалась, и для наших читателей это собственное новое государственное устройство. Общая карта уже есть; как в нём будут решаться привычные местные вопросы, покажет дальнейшая жизнь."
 NFP89_WORLD_CAN_PARTNER:0 "Канадское объединение затрагивает страну, с которой нас связывают обязательства. Нашим общим расчётам полезна сверка с новым устройством, а не одна лишь замена названия в старых бумагах."
 NFP89_WORLD_CAN_RIVAL:0 "Канадское объединение стоит учитывать и при сложных отношениях. Новое государственное устройство не обязано нравиться нашей редакции, чтобы заслуживать содержательного разбора."
 NFP89_WORLD_CHINA_DISTANT:0 "Даже издалека китайский распад заслуживает отдельной полосы. Но расстояние между большой мировой переменой и переменой на нашем прилавке нельзя заполнить одним газетным предположением."
 NFP89_WORLD_CHINA_NEIGHBOR:0 "Для соседей распад Китая — перемена по другую сторону близкой границы. Прежней карты уже недостаточно, чтобы понимать, чья власть действует рядом; о конкретных последствиях будем судить отдельно."
 NFP89_WORLD_CHINA_OWN:0 "Китайский распад для наших читателей — собственная история. Кто теперь принимает решения и где искать власть, способную их исполнить, важнее красивого объяснения новой карты."
 NFP89_WORLD_CHINA_PARTNER:0 "С Китаем нас связывали общие расчёты. Теперь за привычным названием уже нельзя автоматически видеть прежнее единое государство: прежде чем продолжать разговор, стоит понять, с кем его вести."
 NFP89_WORLD_CHINA_RIVAL:0 "Распад страны, с которой отношения сложны, легко встретить удовлетворением. Только множество новых властей ещё не обещает удобного соседа или более простых переговоров."
 NFP89_WORLD_COMMUNE_DISTANT:0 "О Парижской коммуне будут спорить далеко за пределами Франции. Наш выпуск пока отделяет установленное событие от выводов о том, кому в мире следует ждать его повторения."
 NFP89_WORLD_COMMUNE_NEIGHBOR:0 "Французским соседям известие о Коммуне приходит из близкой столицы. Политическая близость здесь достойна внимания, но сама по себе не сообщает, повторится ли что-либо у нас."
 NFP89_WORLD_COMMUNE_OWN:0 "Парижская коммуна касается устройства власти в нашей собственной стране. За большим политическим названием стоят ещё не законченные события; удобной окончательной развязки у сегодняшнего выпуска нет."
 NFP89_WORLD_COMMUNE_PARTNER:0 "Из Франции, с которой нас связывают обязательства, пришло известие о Коммуне. Теперь прежние дипломатические расчёты приходится сопоставлять с новым вопросом о власти, а не только с привычным названием партнёра."
 NFP89_WORLD_COMMUNE_RIVAL:0 "Сложные отношения с Францией располагают к язвительным комментариям. Но Парижская коммуна требует сначала понять происходящее с властью; удачная колкость этого объяснения не заменит."
 NFP89_WORLD_ETH_DISTANT:0 "Эфиопское объединение заслуживает места в мировой хронике. Как оно скажется на конкретных международных делах, ещё предстоит наблюдать; сама новая карта не содержит всех будущих ответов."
 NFP89_WORLD_ETH_NEIGHBOR:0 "Рядом с нами объединилась Эфиопия. Соседям полезно уточнить новую политическую обстановку, прежде чем продолжать рассуждать о регионе так, словно нынешнего известия не было."
 NFP89_WORLD_ETH_OWN:0 "Эфиопское объединение относится к собственной истории наших читателей. Единое государственное устройствоб уже стало новостью; рассказы о том, как оно наладило жизнь, должны будут опираться на следующие события."
 NFP89_WORLD_ETH_PARTNER:0 "У нашего эфиопского партнёра изменилось государственное устройство. Это повод сверить общие планы с объединением страны, а не считать новое положение лишь другой формой прежних договорённостей."
 NFP89_WORLD_ETH_RIVAL:0 "Даже при непростых отношениях эфиопское объединение нельзя вычеркнуть из расчётов. Устройство страны изменилось; нравится ли нам эта перемена — уже другой вопрос, и факта он не отменяет."
 NFP89_WORLD_FLU_DISTANT:0 "Грипп попал в мировые известия. Это ещё не описание обстановки в каждой стране: где и насколько болезнь затронула людей, нужно устанавливать отдельно, без помощи громкого общего заголовка."
 NFP89_WORLD_FLU_NEIGHBOR:0 "Весть о гриппе пришла от соседей. Близость заслуживает внимания, однако объявлять болезнь уже распространившейся у нас без соответствующих сведений редакция не станет."
 NFP89_WORLD_FLU_OWN:0 "Известие о гриппе относится к стране нашего выпуска. Это повод следить за подтверждёнными сведениями о болезни; сегодняшняя заметка не сообщает ни числа заболевших, ни масштаба её распространения."
 NFP89_WORLD_FLU_PARTNER:0 "Известие о гриппе пришло из государства, с которым нас связывают обязательства. Болезнь заслуживает внимания сама по себе: общая дипломатия не заменяет сведений о том, что происходит со здоровьем людей."
 NFP89_WORLD_FLU_RIVAL:0 "Отношения с правительством могут быть плохими, а известие о гриппе от этого не становится поводом для торжества. Что происходит с болезнью, будем выяснять по сведениям о ней, а не по списку политических симпатий."
 NFP89_WORLD_GER_DISTANT:0 "Германское объединение заметно и за пределами Европы. Но появление общего государства ещё не сообщает, какие именно перемены дойдут до наших собственных дел."
 NFP89_WORLD_GER_NEIGHBOR:0 "Для германских соседей объединение означает, что рядом теперь общее государство. Как оно распорядится этим устройством, ещё увидим; считать каждый следующий шаг заранее решённым редакция не станет."
 NFP89_WORLD_GER_OWN:0 "Германия объединилась, и для наших читателей это перемена собственного государства. Общее имя уже появилось; насколько общими станут дела, покажут следующие годы."
 NFP89_WORLD_GER_PARTNER:0 "У нашего германского партнёра теперь объединённое государство. Общие планы стоит сверить с его новым положением: вчерашние знакомства полезны, но прежнюю политическую карту они не сохраняют."
 NFP89_WORLD_GER_RIVAL:0 "Объединение Германии меняет устройство страны, с которой отношения у нас непростые. Делать вид, будто переменилась только надпись на карте, было бы довольно дорогим способом самоуспокоения."
 NFP89_WORLD_ITA_DISTANT:0 "Италия вышла на мировую полосу с известием об объединении. До рассказа о его пользе или вреде для нашей страны пока недостаёт следующей части истории — конкретных перемен."
 NFP89_WORLD_ITA_NEIGHBOR:0 "Итальянским соседям теперь приходится смотреть на полуостров иначе. Изменилось устройство близкого государства, хотя готовых доказательств его дальнейших намерений одна эта новость не даёт."
 NFP89_WORLD_ITA_OWN:0 "Италия получила общее государство. Для тех, кто живёт в нём, объединение начинается там, где новое имя встречается с привычными местными делами."
 NFP89_WORLD_ITA_PARTNER:0 "С итальянским партнёром мы будем иметь делоб уже в новой политической обстановке. Общий разговор полезно начать с уточнения общих планов, а не с предположения, что объединение ничего в них не меняет."
 NFP89_WORLD_ITA_RIVAL:0 "Сложные отношения с Италией не делают её объединение мелочью. На полуострове сложилось общее государство; неприятное для нас известие не становится менее содержательным от отсутствия поздравлений."
 NFP89_WORLD_JAP_DISTANT:0 "Японская реставрация заслуживает внимания и на расстоянии. Только слово «перемена» не стоит незаметно переводить как «успешное обновление»: последнее ещё потребует собственных свидетельств."
 NFP89_WORLD_JAP_NEIGHBOR:0 "Для соседей Японии реставрация меняет близкую политическую обстановку. Присмотримся к решениям новой власти: по одному её положению нельзя прочесть всю будущую программу."
 NFP89_WORLD_JAP_OWN:0 "Императорская реставрация произошла в нашей стране. Новое положение власти уже стало фактом; приписывать ему все будущие успехи прежде самих успехов было бы поспешно."
 NFP89_WORLD_JAP_PARTNER:0 "У нашего японского партнёра изменилось положение верховной власти. Это повод заново присмотреться к тому, с кем и о чём мы договариваемся, а не объявлять все прежние связи исчезнувшими."
 NFP89_WORLD_JAP_RIVAL:0 "К японской власти у нас могут быть претензии. Однако реставрация — политическая перемена, а не готовое доказательство ни усиления страны, ни её скорого провала."
 NFP89_WORLD_PANAMA_DISTANT:0 "Новый путь через Панаму меняет возможности морского сообщения. Рассказывать вслед за этим об уже полученной нами прибыли было бы приятно, но сегодняшняя сводка таких сведений не содержит."
 NFP89_WORLD_PANAMA_NEIGHBOR:0 "Панамский канал появился в близкой для нас части мира. Два океана теперь соединяет новый проход; какие наши перевозки затронет эта перемена, придётся оценивать отдельно."
 NFP89_WORLD_PANAMA_OWN:0 "Панамский канал завершён в стране, о которой выходит наш номер. Соединить океаны удалось; теперь предстоит увидеть, как новым проходом распорядятся на деле."
 NFP89_WORLD_PANAMA_PARTNER:0 "Наши связи с государством у Панамского канала делают новую стройку особенно интересной. Однако общий дипломатический круг ещё не означает ни бесплатного прохода, ни готовой торговой выгоды."
 NFP89_WORLD_PANAMA_RIVAL:0 "При сложных отношениях с государством у Панамы легко увидеть в канале только чужую удачу. Полезнее разобраться, что новый проход действительно позволяет и на каких условиях им можно пользоваться."
 NFP89_WORLD_ROM_DISTANT:0 "Объединение румынских княжеств меняет политическое устройство региона. Издалека стоит прежде разобраться в самой перемене, а уже затем искать в ней подтверждение любимой общей теории."
 NFP89_WORLD_ROM_NEIGHBOR:0 "Для соседей румынское объединение — перемена рядом, а не только строка европейской хроники. С кем теперь решать общие вопросы, важнее предположений о том, как все они непременно разрешатся."
 NFP89_WORLD_ROM_OWN:0 "Румынское объединение стало переменой собственного государства для наших читателей. Общие решения теперь получили новое устройство; привычные местные вопросы от одного этого не исчезли."
 NFP89_WORLD_ROM_PARTNER:0 "В румынских землях объединилась страна, с которой нас связывают обязательства. Прежние знакомства сохраняют ценность, но общий разговор теперь стоит вести с учётом нового государственного устройства."
 NFP89_WORLD_ROM_RIVAL:0 "С румынским государством у нас сложные отношения. Объединение всё равно меняет предмет дипломатического расчёта: прежнюю картину нельзя сохранить только потому, что новая нам неудобна."
 NFP89_WORLD_SPRING_DISTANT:0 "Под общим названием Весны народов соседствуют разные политические истории. Издалека особенно легко принять их за одну; нашему читателю полезнее сохранить различия, чем получить красивое обобщение вместо фактов."
 NFP89_WORLD_SPRING_NEIGHBOR:0 "Потрясения происходят у соседей. Это делает известие близким, но не даёт права объявлять такую же развязку неизбежной у нас: через границу не переносится готовая политическая судьба."
 NFP89_WORLD_SPRING_OWN:0 "Для наших читателей Весна народов — не только название европейских известий. Собственные политические перемены предстоит понимать по происходящему у нас, а не по удобству общего исторического ярлыка."
 NFP89_WORLD_SPRING_PARTNER:0 "Политические потрясения затронули государство, с которым нас связывают обязательства. Следить за ним стоит внимательнее: прежний общий план не объясняет сам собой, как партнёр пройдёт через перемены."
 NFP89_WORLD_SPRING_RIVAL:0 "Весна народов дошла до страны, с которой отношения у нас сложные. Считать всякое её затруднение нашей выгодой было бы слишком лёгкой арифметикой для столь непростых событий."
 NFP89_WORLD_SUEZ_DISTANT:0 "Суэц сокращает прежний морской обход для тех путей, которым подходит новый проход. Из этого ещё не следует, что подешевеет любой товар у нас: между каналом и прилавком есть своя дорога."
 NFP89_WORLD_SUEZ_NEIGHBOR:0 "Суэцкий канал открылся поблизости от нашей страны. Близкий новый путь заслуживает внимания; пользоваться им выгодно или нет, решит больше обстоятельств, чем расстояние на карте."
 NFP89_WORLD_SUEZ_OWN:0 "Суэцкий канал завершён в стране, к которой относится наш читательский выпуск. Большая стройка стала проходом между морями; хозяйственную отдачу от него ещё предстоит увидеть в делах."
 NFP89_WORLD_SUEZ_PARTNER:0 "С государством у Суэцкого канала нас связывают обязательства. Новый проход стоит учитывать в общих расчётах, но сам факт завершения ещё не обещает нам особых условий пользования."
 NFP89_WORLD_SUEZ_RIVAL:0 "Отношения с государством у Суэца непростые, а канал от этого не становится менее настоящим. Прежде чем считать его чужим преимуществом против нас, стоит посмотреть на действительные условия прохода."
 NFP89_WORLD_TAIPING_DISTANT:0 "Китайское противостояние получило отдельное государство тайпинов. Это меняет состав участников истории, но не позволяет редакции уже сейчас рассказать её окончание."
 NFP89_WORLD_TAIPING_NEIGHBOR:0 "У наших соседей появилась власть тайпинов. Кто и чем будет распоряжаться рядом, заслуживает отдельного внимания; готового ответа обо всех границах влияния сегодняшняя сводка не даёт."
 NFP89_WORLD_TAIPING_OWN:0 "Появление государства тайпинов относится к нашей собственной политической истории. Новая власть уже обозначилась; её место в противостоянии не стоит подменять заранее написанным итогом борьбы."
 NFP89_WORLD_TAIPING_PARTNER:0 "С государством тайпинов нас связывают отношения, которые делают эту новость ближе обычной китайской хроники. Для общих расчётов важно само появление отдельной власти, а не предположение о её неизбежном успехе."
 NFP89_WORLD_TAIPING_RIVAL:0 "В отношениях с государством тайпинов мало простоты. Тем важнее различать появление новой власти и её дальнейшие возможности: первое уже известно, второе ещё не следует из одной новости."
 NFP89_WORLD_YUG_DISTANT:0 "На Балканах появилось новое общее государство. Издалека легко немедленно приписать ему готовую историческую роль; мы начнём с более скромного — установленной перемены на карте."
 NFP89_WORLD_YUG_NEIGHBOR:0 "Для соседей Югославии образование общего государства меняет близкую политическую карту. Какие новые решения последуют, ещё неизвестно; само соседство не позволяет редакции читать чужие планы наперёд."
 NFP89_WORLD_YUG_OWN:0 "Югославия образовалась, и наши читатели стали частью нового общего государства. Общему названию ещё предстоит встретиться с разными местными делами: именно там объединение получит своё повседневное содержание."
 NFP89_WORLD_YUG_PARTNER:0 "Образование Югославии меняет устройство нашего балканского партнёра. Общие планы полезно обсуждать заново по существу: новое государство — повод уточнить расчёт, а не только поздравительный адрес."
 NFP89_WORLD_YUG_RIVAL:0 "С югославским государством у нас непростые отношения. Его появление всё же требует внимания: объяснять балканские дела по прежней карте только из неприязни к новой было бы странным самоутешением."
