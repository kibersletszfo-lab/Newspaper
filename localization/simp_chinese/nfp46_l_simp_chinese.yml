l_simp_chinese:
 NFP46_GOOD_LABEL:0 "[ScriptContainer.MakeScope.Var('nfp46_good').GetGoods.GetNameNoIcon]"
 NFP46_METRICS:0 "商品为[ScriptContainer.MakeScope.Var('nfp46_good').GetGoods.GetNameNoIcon]。求购订单从[ScriptContainer.GetVariableValue('nfp46_buy_before')|1]变为[ScriptContainer.GetVariableValue('nfp46_buy_after')|1]，出售订单从[ScriptContainer.GetVariableValue('nfp46_sell_before')|1]变为[ScriptContainer.GetVariableValue('nfp46_sell_after')|1]。相对需求的缺口为[ScriptContainer.GetVariableValue('nfp46_gap_before')|1]%至[ScriptContainer.GetVariableValue('nfp46_gap_after')|1]%。前项为本轮最早留存的记录，后项为最近的月度观察。\n本报采用的门槛为连续两个月供给低于需求的80%，或出现游戏认定的短缺。地方性的服务、运输与电力须逐地区另作观察。"
 NFP46_SHORTAGE_BODY_1:0 "游戏直接标明我国市场出现商品短缺。连续两个观察月份均存在供货难题：或有短缺标记，或是订单缺口较大。\n\n货品为[ScriptContainer.MakeScope.Var('nfp46_good').GetGoods.GetNameNoIcon]。求购订单从[ScriptContainer.GetVariableValue('nfp46_buy_before')|1]变为[ScriptContainer.GetVariableValue('nfp46_buy_after')|1]，出售订单从[ScriptContainer.GetVariableValue('nfp46_sell_before')|1]变为[ScriptContainer.GetVariableValue('nfp46_sell_after')|1]。相对需求的缺口为[ScriptContainer.GetVariableValue('nfp46_gap_before')|1]%至[ScriptContainer.GetVariableValue('nfp46_gap_after')|1]%。前项是本轮最早留存的记录，后项是最近的月度观察。\n\n比较的是市场订单，并非测量居民实际少买了多少商品。这些数字本身并不能说明缺口的成因、牵涉的具体建筑或生活水平所受影响。"
 NFP46_SHORTAGE_BODY_2:0 "最新记录带有市场短缺标记。供货难题延续了两个月；上月达到的标准也可能只是订单差额，因此不能据此断言生产受罚已有两个月。\n\n货品为[ScriptContainer.MakeScope.Var('nfp46_good').GetGoods.GetNameNoIcon]。求购订单从[ScriptContainer.GetVariableValue('nfp46_buy_before')|1]变为[ScriptContainer.GetVariableValue('nfp46_buy_after')|1]，出售订单从[ScriptContainer.GetVariableValue('nfp46_sell_before')|1]变为[ScriptContainer.GetVariableValue('nfp46_sell_after')|1]。相对需求的缺口为[ScriptContainer.GetVariableValue('nfp46_gap_before')|1]%至[ScriptContainer.GetVariableValue('nfp46_gap_after')|1]%。前项是本轮最早留存的记录，后项是最近的月度观察。\n\n比较的是市场订单，并非测量居民实际少买了多少商品。这些数字本身并不能说明缺口的成因、牵涉的具体建筑或生活水平所受影响。"
 NFP46_SHORTAGE_LEAD_1:0 "市场观察中，这件货品的短缺尚未消失。是时候谈谈供应了。"
 NFP46_SHORTAGE_LEAD_2:0 "我国市场已有明确的短缺信号。此事值得留意。"
 NFP46_SHORTAGE_RECOVERY_BODY_1:0 "本报预警以后，市场连续两个月不再带有短缺标记，两次记录的供给也都至少达到需求的80%。这不足以保证价格低廉，也不表示每一家企业都已恢复。\n\n货品为[ScriptContainer.MakeScope.Var('nfp46_good').GetGoods.GetNameNoIcon]。求购订单从[ScriptContainer.GetVariableValue('nfp46_buy_before')|1]变为[ScriptContainer.GetVariableValue('nfp46_buy_after')|1]，出售订单从[ScriptContainer.GetVariableValue('nfp46_sell_before')|1]变为[ScriptContainer.GetVariableValue('nfp46_sell_after')|1]。相对需求的缺口为[ScriptContainer.GetVariableValue('nfp46_gap_before')|1]%至[ScriptContainer.GetVariableValue('nfp46_gap_after')|1]%。前项是本轮最早留存的记录，后项是最近的月度观察。\n\n比较的是市场订单，并非测量居民实际少买了多少商品。这些数字本身并不能说明缺口的成因、牵涉的具体建筑或生活水平所受影响。"
 NFP46_SHORTAGE_RECOVERY_BODY_2:0 "连续两次月度观察，既未发现先前的短缺标记，订单缺口也未超过本报的门槛。我们记录的是指标的改善；买得到与买得便宜，仍是两件事。\n\n货品为[ScriptContainer.MakeScope.Var('nfp46_good').GetGoods.GetNameNoIcon]。求购订单从[ScriptContainer.GetVariableValue('nfp46_buy_before')|1]变为[ScriptContainer.GetVariableValue('nfp46_buy_after')|1]，出售订单从[ScriptContainer.GetVariableValue('nfp46_sell_before')|1]变为[ScriptContainer.GetVariableValue('nfp46_sell_after')|1]。相对需求的缺口为[ScriptContainer.GetVariableValue('nfp46_gap_before')|1]%至[ScriptContainer.GetVariableValue('nfp46_gap_after')|1]%。前项是本轮最早留存的记录，后项是最近的月度观察。\n\n比较的是市场订单，并非测量居民实际少买了多少商品。这些数字本身并不能说明缺口的成因、牵涉的具体建筑或生活水平所受影响。"
 NFP46_SHORTAGE_RECOVERY_LEAD_1:0 "本报回访先前报道的供货难题：连续两次观察已不见旧有问题。"
 NFP46_SHORTAGE_RECOVERY_LEAD_2:0 "市场短缺有了令人宽心的后续。"
 NFP46_SHORTAGE_RECOVERY_TITLE_1:0 "先前的短缺正在缓和"
 NFP46_SHORTAGE_RECOVERY_TITLE_2:0 "供应出现转机"
 NFP46_SHORTAGE_TITLE_1:0 "我国市场的货品短缺值得关注"
 NFP46_SHORTAGE_TITLE_2:0 "供货难题仍未解决"
 NFP46_SUPPLY_GAP_BODY_1:0 "最新的月度记录显示，出售订单不足求购订单的80%。上月便已见供货问题，或是订单缺口明显，或有游戏的短缺标记。本报采用的失衡门槛，并不自动等同于生产受罚。\n\n货品为[ScriptContainer.MakeScope.Var('nfp46_good').GetGoods.GetNameNoIcon]。求购订单从[ScriptContainer.GetVariableValue('nfp46_buy_before')|1]变为[ScriptContainer.GetVariableValue('nfp46_buy_after')|1]，出售订单从[ScriptContainer.GetVariableValue('nfp46_sell_before')|1]变为[ScriptContainer.GetVariableValue('nfp46_sell_after')|1]。相对需求的缺口为[ScriptContainer.GetVariableValue('nfp46_gap_before')|1]%至[ScriptContainer.GetVariableValue('nfp46_gap_after')|1]%。前项是本轮最早留存的记录，后项是最近的月度观察。\n\n比较的是市场订单，并非测量居民实际少买了多少商品。这些数字本身并不能说明缺口的成因、牵涉的具体建筑或生活水平所受影响。"
 NFP46_SUPPLY_GAP_BODY_2:0 "本报连续两个月记录到供货问题。现时供给低于需求的80%；上月也有同等缺口，或有直接的短缺标记。单据此不能推断有生产惩罚，也不能断言是高价所造成的后果。\n\n货品为[ScriptContainer.MakeScope.Var('nfp46_good').GetGoods.GetNameNoIcon]。求购订单从[ScriptContainer.GetVariableValue('nfp46_buy_before')|1]变为[ScriptContainer.GetVariableValue('nfp46_buy_after')|1]，出售订单从[ScriptContainer.GetVariableValue('nfp46_sell_before')|1]变为[ScriptContainer.GetVariableValue('nfp46_sell_after')|1]。相对需求的缺口为[ScriptContainer.GetVariableValue('nfp46_gap_before')|1]%至[ScriptContainer.GetVariableValue('nfp46_gap_after')|1]%。前项是本轮最早留存的记录，后项是最近的月度观察。\n\n比较的是市场订单，并非测量居民实际少买了多少商品。这些数字本身并不能说明缺口的成因、牵涉的具体建筑或生活水平所受影响。"
 NFP46_SUPPLY_GAP_LEAD_1:0 "连续两月的观察都有供货难题。最新记录表明，供给仍大幅落后于需求。"
 NFP46_SUPPLY_GAP_LEAD_2:0 "供货难题持续已久。眼下可出售的货品明显赶不上求购数量。"
 NFP46_SUPPLY_GAP_RECOVERY_BODY_1:0 "连续两次月度记录中，供给均达到求购订单的80%或以上，且无明确短缺标记。低于此前门槛的差距仍可能存在，本报不许诺供求全然平衡，也不许诺低价。\n\n货品为[ScriptContainer.MakeScope.Var('nfp46_good').GetGoods.GetNameNoIcon]。求购订单从[ScriptContainer.GetVariableValue('nfp46_buy_before')|1]变为[ScriptContainer.GetVariableValue('nfp46_buy_after')|1]，出售订单从[ScriptContainer.GetVariableValue('nfp46_sell_before')|1]变为[ScriptContainer.GetVariableValue('nfp46_sell_after')|1]。相对需求的缺口为[ScriptContainer.GetVariableValue('nfp46_gap_before')|1]%至[ScriptContainer.GetVariableValue('nfp46_gap_after')|1]%。前项是本轮最早留存的记录，后项是最近的月度观察。\n\n比较的是市场订单，并非测量居民实际少买了多少商品。这些数字本身并不能说明缺口的成因、牵涉的具体建筑或生活水平所受影响。"
 NFP46_SUPPLY_GAP_RECOVERY_BODY_2:0 "本报预警以后，市场已连续两个月脱离问题区间：供给不低于需求的80%，也无直接的短缺标记。这只是所见指标的改善，还不能直接说明原因和后果。\n\n货品为[ScriptContainer.MakeScope.Var('nfp46_good').GetGoods.GetNameNoIcon]。求购订单从[ScriptContainer.GetVariableValue('nfp46_buy_before')|1]变为[ScriptContainer.GetVariableValue('nfp46_buy_after')|1]，出售订单从[ScriptContainer.GetVariableValue('nfp46_sell_before')|1]变为[ScriptContainer.GetVariableValue('nfp46_sell_after')|1]。相对需求的缺口为[ScriptContainer.GetVariableValue('nfp46_gap_before')|1]%至[ScriptContainer.GetVariableValue('nfp46_gap_after')|1]%。前项是本轮最早留存的记录，后项是最近的月度观察。\n\n比较的是市场订单，并非测量居民实际少买了多少商品。这些数字本身并不能说明缺口的成因、牵涉的具体建筑或生活水平所受影响。"
 NFP46_SUPPLY_GAP_RECOVERY_LEAD_1:0 "回访先前见报的难题：供给同需求之间，已没有原先那么大的差距。"
 NFP46_SUPPLY_GAP_RECOVERY_LEAD_2:0 "连续两次观察，已看不到先前那样明显的订单缺口。"
 NFP46_SUPPLY_GAP_RECOVERY_TITLE_1:0 "市场的供需缺口缩小了"
 NFP46_SUPPLY_GAP_RECOVERY_TITLE_2:0 "供货出现好转迹象"
 NFP46_SUPPLY_GAP_TITLE_1:0 "需求走在供给前头"
 NFP46_SUPPLY_GAP_TITLE_2:0 "市场缺口值得留心"
