l_simp_chinese:
 NFP43_GAINED:0 "发现我国与[ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName]建立了新的盟友关系。"
 NFP43_GAINED_ALLIANCE_1_BODY:0 "我国的盟友名单有变。最新情况证实，我国已与[ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName]结盟。\n\n这对我国外交是一桩大事。至于双方约定了什么、遇上某一场冲突时要不要参战，须细看现行的盟约条款。"
 NFP43_GAINED_ALLIANCE_1_LEAD:0 "我国与[ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName]已有正式同盟。"
 NFP43_GAINED_ALLIANCE_1_TITLE:0 "我国添了一位盟友"
 NFP43_GAINED_ALLIANCE_2_BODY:0 "此前没有这层同盟关系，如今[ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName]已列入我国正式盟友之中。\n\n本报记下的是外交关系的变化。盟约里的义务是什么，就照条款读；一概承诺出兵相助，可不是一份报道能代签的。"
 NFP43_GAINED_ALLIANCE_2_LEAD:0 "本报获悉，我国与[ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName]建立了新的同盟。"
 NFP43_GAINED_ALLIANCE_2_TITLE:0 "盟友名单添了新名字"
 NFP43_GAINED_BLOC_1_BODY:0 "与我国共处一个外交圈的国家有了变化。最新消息证实，我国如今与[ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName]同属一个国家集团。\n\n这里说的是集团成员的变化。两国是否另外结盟、是否必须参加对方的每一场战争，是另一个问题。"
 NFP43_GAINED_BLOC_1_LEAD:0 "[ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName]现与我国同属一个国家集团。"
 NFP43_GAINED_BLOC_1_TITLE:0 "集团里来了新伙伴"
 NFP43_GAINED_BLOC_2_BODY:0 "再看各国的联系，我国与[ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName]已成为同一集团的成员。可能是其中任何一方改变了所属。\n\n本报记录这个新局面。谁发去邀请、有没有军事互助协定，留待另有确讯时再说。"
 NFP43_GAINED_BLOC_2_LEAD:0 "我国现与[ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName]同属一个国家集团。"
 NFP43_GAINED_BLOC_2_TITLE:0 "集团伙伴的圈子变了"
 NFP43_GAINED_METRICS:0 "两次观察之间新出现的本国战略联系。类型为[SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp20_extra'), '(CFixedPoint)1'), 'NFP43_KIND_ALLIANCE', 'NFP43_KIND_BLOC')]。首次观察只建基准。每周及付印前检查一次，中间的短暂变化可能错过。所署月份为发现月份，签署日期须另考。优先级160，仅向本国读者报道，不按外国地区筛选。"
 NFP43_KIND_ALLIANCE:0 "正式同盟"
 NFP43_KIND_BLOC:0 "同属一个国家集团"
 NFP43_LOST:0 "现已查不到我国与[ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName]先前的盟友关系。"
 NFP43_LOST_ALLIANCE_1_BODY:0 "我国的盟友名单有变。先前与[ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName]的同盟已不在最新记录中。\n\n凡是凭从前的关系做的打算，都值得重新想一想。至于谁提出解盟、为何告终，编辑部手头尚无确讯。"
 NFP43_LOST_ALLIANCE_1_LEAD:0 "现有记录中，我国与[ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName]已无正式同盟。"
 NFP43_LOST_ALLIANCE_1_TITLE:0 "旧日盟约已告终"
 NFP43_LOST_ALLIANCE_2_BODY:0 "最新的外交记录中，已找不到我国与[ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName]先前的同盟。\n\n个中情形仍须另考。一个国家消失与两国断绝往来是两回事，总不能只凭一行消失的记录，就断言发生的是哪一种。"
 NFP43_LOST_ALLIANCE_2_LEAD:0 "现已查不到我国与[ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName]的正式同盟。"
 NFP43_LOST_ALLIANCE_2_TITLE:0 "同盟网断了一线"
 NFP43_LOST_BLOC_1_BODY:0 "我国先前同[ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName]共处一个国家集团，最新记录已不再显示这层联系。\n\n变化可能出在其中任何一方，也可能出在集团本身。本报只记下结果；究竟是谁离开了集团，还不能凭空指认。"
 NFP43_LOST_BLOC_1_LEAD:0 "现已查不到我国与[ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName]同属一个国家集团的记录。"
 NFP43_LOST_BLOC_1_TITLE:0 "两国已不在同一集团"
 NFP43_LOST_BLOC_2_BODY:0 "我国与[ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName]先前同属一个集团的关系已不再出现。这是两国关系可以确认的一处变化。\n\n缘由与发起者尚未查明。若两国另有双边盟约，这条消息也不足以证明盟约失效。"
 NFP43_LOST_BLOC_2_LEAD:0 "我国先前与[ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName]共有的集团联系已无法证实。"
 NFP43_LOST_BLOC_2_TITLE:0 "集团成员的格局有变"
 NFP43_LOST_METRICS:0 "本国的战略联系已不再出现。类型为[SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp20_extra'), '(CFixedPoint)1'), 'NFP43_KIND_ALLIANCE', 'NFP43_KIND_BLOC')]。每周及付印前观察，何人提出解除、确切日期皆未知。国家消失也会终止联系。优先级170，仅向本国读者报道。"
 NFP43_RELATION:0 "我国的盟友关系"
 NFP43_WAR:0 "战端已开。进攻方为[ScriptContainer.MakeScope.Var('nfp20_extra_detail').GetCountryDefinition.GetName]，防守方为[ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName]。"
 NFP43_WAR_ALLIANCE_1_BODY:0 "战争已经开始。此前的外交博弈由[ScriptContainer.MakeScope.Var('nfp20_extra_detail').GetCountryDefinition.GetName]发起，目标为[ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName]。开战之时，我国与防守国有正式同盟。\n\n本报将此事列为要闻。同盟值得我们关心，然而单凭盟约存在，还不能登报宣布我国已经参战。"
 NFP43_WAR_ALLIANCE_1_LEAD:0 "[ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName]成为一场新战争的防守方。"
 NFP43_WAR_ALLIANCE_1_TITLE:0 "盟友遭到攻击"
 NFP43_WAR_ALLIANCE_2_BODY:0 "发起新战事的是[ScriptContainer.MakeScope.Var('nfp20_extra_detail').GetCountryDefinition.GetName]，防守方为[ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName]。事发之时，我国与目标国的同盟已经证实。\n\n我国的外交处境因此与战事直接相关。是否参战、义务如何履行，不能只凭开战的一条消息作答。"
 NFP43_WAR_ALLIANCE_2_LEAD:0 "与我国结盟的[ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName]遭遇战争。"
 NFP43_WAR_ALLIANCE_2_TITLE:0 "战火烧到了盟友那里"
 NFP43_WAR_BLOC_1_BODY:0 "战争爆发。[ScriptContainer.MakeScope.Var('nfp20_extra_detail').GetCountryDefinition.GetName]为发起方，[ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName]为防守方。事发时目标国与我国共处一个集团。\n\n这条消息值得我国政府留心。不过同属一个集团，本身不等于缔结军事同盟，更不能据此认定我国必然参战。"
 NFP43_WAR_BLOC_1_LEAD:0 "与我国同属一集团的[ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName]成为新战争的目标。"
 NFP43_WAR_BLOC_1_TITLE:0 "集团伙伴成为交战目标"
 NFP43_WAR_BLOC_2_BODY:0 "新战事已获证实，发起方为[ScriptContainer.MakeScope.Var('nfp20_extra_detail').GetCountryDefinition.GetName]，目标为[ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName]。战端初启时，目标国与我国同属一个国家集团。\n\n这场外交风波离我们很近。本报报道它，却不会因此把我国列为参战方，或给整个集团添上没有证实的义务。"
 NFP43_WAR_BLOC_2_LEAD:0 "集团伙伴[ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName]成了防守方。"
 NFP43_WAR_BLOC_2_TITLE:0 "战火波及我国的外交圈"
 NFP43_WAR_METRICS:0 "来源为 on_diplo_play_war_start。记录外交博弈发起方、目标，以及事发时读者国与目标国的盟友联系。发起方为[ScriptContainer.MakeScope.Var('nfp20_extra_detail').GetCountryDefinition.GetName]，目标为[ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName]。优先级190，为战争版号外候选。共同加入集团本身不能证明有参战义务。"
