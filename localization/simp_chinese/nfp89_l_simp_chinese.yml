l_simp_chinese:
 NFP89_LAW_COLD:0 "我们对这个国家谈不上有什么好感。它的法律却不会因此就变好或变坏。且看它给当地人的生活带来什么变化；即便要同别国政府争论，也该先弄清争的是什么。"
 NFP89_LAW_DEPENDENT:0 "两国之间尚有宗属关系，彼此的内政因此离得更近。可人家的争论终归不是我国争论的翻版，新规值几分，还是细看条文本身吧。"
 NFP89_LAW_NEIGHBOR:0 "隔壁发生这样的变化，很难算作遥远。拿它和自家规矩对照颇有用处，照方抓药却嫌太早。相邻的两所房子，墙也未必一样。"
 NFP89_LAW_PARTNER:0 "新法出在我们的伙伴那里。共同的打算犹在，不过要了解一起作打算的人，不能只认得条约下面的签名。这条新规如何生根，还有待观察。"
 NFP89_LAW_THREAT:0 "我国与这个国家的关系，使人不得不留一分警惕。新法本身还不能说是冲着我们来的。弄清它如今怎样治理自己，总比逢它有事就还一句讥讽有用。"
 NFP89_WORLD_ACW_DISTANT:0 "隔着千山万水读美国战报，很容易把事情读成两派的口角。然而要紧之处恰在这里：这个国家已经陷入国内的武装斗争，胜负尚未揭晓。"
 NFP89_WORLD_ACW_NEIGHBOR:0 "对邻国来说，美国内战起于近旁，很难塞进远方杂讯的一角。战事离得近，理应留心；但这一个事实还不能证明我国边境正受威胁。"
 NFP89_WORLD_ACW_OWN:0 "内战若打在自己国里，那个“内”字并无多少安慰。美国的分歧如今要靠兵戈裁决。谁将获胜、代价几何，今天的消息还不能告诉我们。"
 NFP89_WORLD_ACW_PARTNER:0 "如今须把我国与美国的联系放在内战之中重新审视。从前商妥的事情，值得仔细重读；同一个国家交好，还不足以回答它内部分裂带来的一切问题。"
 NFP89_WORLD_ACW_RIVAL:0 "对美国政府怀有不快，不会令内战就此变成无伤大雅的热闹。这场斗争正在改变一个我国不得不考虑的国家的处境。本报暂不替任何一方预定胜局。"
 NFP89_WORLD_AUS_DISTANT:0 "澳大利亚如今以统一国家的身份登上报纸。它日后怎样运用这一体制，交给以后的报道来评说。今天的这期，还没法把明天的历史印出来。"
 NFP89_WORLD_AUS_NEIGHBOR:0 "澳大利亚各地就在我们近旁实现联合。身为邻国，新政局自然重要；但它会给我国百姓带来什么，仍须另有依据。"
 NFP89_WORLD_AUS_OWN:0 "对本报读者来说，澳大利亚的联合就是自家的新闻。共同的国家已经出现，能否把各地的日常事务妥善联结起来，仍待往后检验。"
 NFP89_WORLD_AUS_PARTNER:0 "我们的澳大利亚伙伴有了新的共同体制。谈共同计划时值得顾及这一变动，却不可把财富或新的条约义务一概算作统一的赠品。"
 NFP89_WORLD_AUS_RIVAL:0 "我国与澳大利亚关系复杂，但它的统一不会因此只剩下形式。弄清发生了什么，总比先宣布这点变化无关痛痒有用。"
 NFP89_WORLD_CAN_DISTANT:0 "加拿大的成立改变了北美地图。眼下的确讯到此为止。要说这会怎样具体影响我们的买卖，还得有别的消息作凭。"
 NFP89_WORLD_CAN_NEIGHBOR:0 "加拿大的联合就在近旁实现。邻国眼前的政治地图已经改变。若将它连同加拿大的下一步意图一起登报，后半句便只是猜测了。"
 NFP89_WORLD_CAN_OWN:0 "加拿大成立，对本报读者而言，变的是自家的国家体制。各地已有了一张共同的地图；往日那些地方事务，今后如何在这个体制下办理，还得看日常的情形。"
 NFP89_WORLD_CAN_PARTNER:0 "加拿大统一，牵涉到与我国有约的伙伴。以前共同定下的打算，值得拿新体制核对一遍。只在旧文件里换个国名，恐怕还不够。"
 NFP89_WORLD_CAN_RIVAL:0 "即使两国关系不佳，加拿大的统一也值得纳入考虑。编辑部可以不喜欢这个新的国家体制，却仍有必要把它交代清楚。"
 NFP89_WORLD_CHINA_DISTANT:0 "纵使身处远方，中国分裂仍值得一整版报道。不过从举世瞩目的巨变到本国柜台上的变化，其间的距离，不能用报人的猜测填平。"
 NFP89_WORLD_CHINA_NEIGHBOR:0 "对邻国而言，中国分裂就发生在边界的另一边。翻开旧地图，已不足以弄清隔壁是谁执掌权柄。至于具体会受什么影响，要逐项另看。"
 NFP89_WORLD_CHINA_OWN:0 "中国的分裂，就是我国读者自己的历史。眼下是谁发号施令，又哪里有能把政令办到的当局？这比给新地图配一段漂亮的解说要紧得多。"
 NFP89_WORLD_CHINA_PARTNER:0 "我们从前和中国有过共同的打算。如今从这个熟悉的国名背后，已不能想当然地看到昨日那个统一的国家。谈下去以前，得先弄明白同谁谈。"
 NFP89_WORLD_CHINA_RIVAL:0 "一个与我们关系紧张的国家陷入分裂，或许容易使人称快。但多出好些当局，既不保证邻居更好相处，也不保证谈判更省事。"
 NFP89_WORLD_COMMUNE_DISTANT:0 "有关巴黎公社的争论，会远远传出法国国境。本期先说已经发生的事。世界上还有谁会重蹈这条道路，得等另有事实再作推论。"
 NFP89_WORLD_COMMUNE_NEIGHBOR:0 "对法国邻国而言，公社的消息来自近在咫尺的首都。近处的政治风波理应留心，至于我国是否也会重演一遍，那一条国境线还给不出答案。"
 NFP89_WORLD_COMMUNE_OWN:0 "巴黎公社牵涉我国自己的政权格局。这个响亮的政治名号背后，事态还在发展。若想从本期找到一个干净利落的定局，恐怕还早。"
 NFP89_WORLD_COMMUNE_PARTNER:0 "与我国有约的法国传来公社的消息。过去的外交打算如今得连同谁来执政的问题一起考虑。光看条约上那个熟悉的伙伴名称，已经不够。"
 NFP89_WORLD_COMMUNE_RIVAL:0 "同法国的关系不睦，使人容易写下尖刻的评论。但报道巴黎公社，得先弄清权力格局出了什么变化。再漂亮的俏皮话也答不了这个问题。"
 NFP89_WORLD_ETH_DISTANT:0 "埃塞俄比亚统一，值得登上世界纪事。它会怎样影响具体的国际事务，还需继续观察。新地图可以摊开，并非每个答案都已写在上面。"
 NFP89_WORLD_ETH_NEIGHBOR:0 "埃塞俄比亚就在近旁完成统一。做邻居的，应当先弄清新的政治局面，再谈地区事务；不能还照着没有这条新闻的昨天议论。"
 NFP89_WORLD_ETH_OWN:0 "埃塞俄比亚统一是本报读者自己的历史。各地已归于同一国家体制，这是新闻。要说它如何改善了人们的生活，还得等待以后发生的事。"
 NFP89_WORLD_ETH_PARTNER:0 "我们的埃塞俄比亚伙伴改变了国家体制。共同的计划值得随统一重新核对；把今天只当作旧日约定换了一身外衣，恐怕不够。"
 NFP89_WORLD_ETH_RIVAL:0 "两国关系再难处，盘算事情时也划不掉埃塞俄比亚的统一。国家格局已经改变。至于合不合我们的心意，另是一回事，左右不了这个事实。"
 NFP89_WORLD_FLU_DISTANT:0 "流感上了世界新闻。但一个醒目的总标题，还替代不了一国一地的情况。哪里受到波及，百姓受了多大影响，须分别查证。"
 NFP89_WORLD_FLU_NEIGHBOR:0 "邻邦传来流感的消息。地方离得近，当然值得留心；在取得相应消息以前，本报不会宣布疾病已在我国蔓延。"
 NFP89_WORLD_FLU_OWN:0 "流感的消息涉及我国。应当紧盯有凭据的疫情进展；本次来讯并未载明患病人数，也不足以说明疾病已经扩散到何种地步。"
 NFP89_WORLD_FLU_PARTNER:0 "与我国有约的国家传来流感的消息。疾病本身就值得关注。两国在外交上再亲近，也不能代替有关当地人健康状况的实报。"
 NFP89_WORLD_FLU_RIVAL:0 "即使两国政府不和，流感也绝不是一条值得庆贺的消息。探看疫情得翻病情记录，不能翻外交好恶的名单。"
 NFP89_WORLD_GER_DISTANT:0 "德国统一，在欧洲以外也看得见。但一个统一国家出现，尚不能告诉我们，哪些变化将具体落到我国的事务上。"
 NFP89_WORLD_GER_NEIGHBOR:0 "对德国的邻居而言，从前环顾四周看见的各邦，如今已结为一国。它将如何运用这一格局，还有待观察；本报不急着替它安排以下每一步。"
 NFP89_WORLD_GER_OWN:0 "德国统一了。对本报读者而言，变的是自家的国家。大家已经有了一个共同的名字，往后有多少事真能一起办，还要看今后几年。"
 NFP89_WORLD_GER_PARTNER:0 "我们的德国伙伴如今有了统一的国家。值得把共同订下的打算拿来同新局面核对一番。昨天的交情依旧有用，昨天的政治地图却不能因此照用。"
 NFP89_WORLD_GER_RIVAL:0 "德国统一，改变了这个与我国关系并不轻松的国家的格局。硬说地图上变的只有一行字，恐怕是代价颇高的自我宽慰。"
 NFP89_WORLD_ITA_DISTANT:0 "意大利凭统一的消息登上世界版。要说这件事给我国带来何种利弊，还得等故事的下一段：实际出现的那些变化。"
 NFP89_WORLD_ITA_NEIGHBOR:0 "意大利邻邦得换个眼光看待半岛了。近处的国家格局已经改变，至于它接下来打算做什么，单凭今天的消息还猜不出。"
 NFP89_WORLD_ITA_OWN:0 "意大利各地有了共同的国家。住在里面的人所经历的统一，要从这个崭新的国名同熟悉的地方事务相遇之处说起。"
 NFP89_WORLD_ITA_PARTNER:0 "同意大利伙伴打交道，今后要面对新的政局。坐下来谈谈共有的计划，要比假定统一对这些计划毫无影响来得稳妥。"
 NFP89_WORLD_ITA_RIVAL:0 "与意大利的关系欠佳，并不能把它的统一变成一件小事。半岛上已结成一个共同的国家；就算没有我们的贺词，这条新闻也不会少掉一点分量。"
 NFP89_WORLD_JAP_DISTANT:0 "即使隔得很远，日本的王政复古也值得留意。不过把“变了”悄悄读成“更新成功”，中间似乎省去了一道本应由事实作答的题。"
 NFP89_WORLD_JAP_NEIGHBOR:0 "对日本邻邦来说，王政复古让近处的政治格局有了变化。且看新当局将作出什么决定；仅凭今天的地位，尚读不出明天的全部纲领。"
 NFP89_WORLD_JAP_OWN:0 "天皇复位就在我国发生。权力的新格局已成事实；至于将来的成就，还是等它们真的出现，再来评说谁有功劳。"
 NFP89_WORLD_JAP_PARTNER:0 "日本伙伴的最高统治权已有变化。我们值得重新看看往后该同谁商量、能够谈些什么。倒也不必因为这条消息，就宣布旧有的一切联系都已告终。"
 NFP89_WORLD_JAP_RIVAL:0 "我们也许对日本当局颇有意见。不过王政复古首先是一场政治变化，它本身既不能证明日本已经强盛，也不能证明日本快要失败。"
 NFP89_WORLD_PANAMA_DISTANT:0 "巴拿马的新通道改变了海运的可能性。若能接着报道我国已从中得了多少利，自然令人愉快。只是今天的消息里，还没有这笔数。"
 NFP89_WORLD_PANAMA_NEIGHBOR:0 "巴拿马运河就在我国所在地区开通。两洋如今有了新通道；它会实际影响我国的哪些运输，仍须一笔一笔细算。"
 NFP89_WORLD_PANAMA_OWN:0 "巴拿马运河在我国竣工。两洋之间的通道已打通，如今且看人们怎样把这条新路用起来。"
 NFP89_WORLD_PANAMA_PARTNER:0 "我国同巴拿马运河所在国的联系，让这项工程格外值得留心。不过同处一个外交圈，既不等于免收通行费，也不等于贸易好处已经落袋。"
 NFP89_WORLD_PANAMA_RIVAL:0 "与巴拿马当地的国家关系欠佳，容易叫人把运河只看作别人的好运。更有用的，是弄清新通道究竟能做什么，我们又能在怎样的条件下使用。"
 NFP89_WORLD_ROM_DISTANT:0 "罗马尼亚诸公国统一改变了当地政局。身处远方，最好先弄清变化本身，再去看它是否符合某种自己惯用的说法。"
 NFP89_WORLD_ROM_NEIGHBOR:0 "罗马尼亚的邻居看到的是近处的变化，远不止欧洲新闻里的一行字。今后要同谁商量共同的问题，比猜测那些问题必然如何解决更要紧。"
 NFP89_WORLD_ROM_OWN:0 "罗马尼亚统一，是本报读者亲历的国家之变。作共同决定有了新的章法，日常那些地方难题却不会因此自行消失。"
 NFP89_WORLD_ROM_PARTNER:0 "罗马尼亚各地结为一国，我国同这个伙伴有约在身。旧交情仍有价值，不过往后再坐下来谈共同的事，就得把新体制算进去。"
 NFP89_WORLD_ROM_RIVAL:0 "我国与罗马尼亚国家关系欠佳，统一依旧改变了外交所面对的局面。不能只因新局面令人不快，就继续照着旧图作算。"
 NFP89_WORLD_SPRING_DISTANT:0 "民族之春这个共同的名字下面，是各不相同的政治经历。站得远，尤其容易把它们读成一个故事。本报愿替读者守住那些差别，免得只留下一个好听的概括。"
 NFP89_WORLD_SPRING_NEIGHBOR:0 "动荡就在邻国发生，消息自然贴近。然而政治的命运并非装在箱子里就能越境，编辑部还无权宣布我国也必然会有同样的结局。"
 NFP89_WORLD_SPRING_OWN:0 "对我国读者而言，民族之春不只是欧洲消息的一个标题。要弄清本国政治发生了什么，还得看身边的事情，不能拿一个省事的历史名词替代观察。"
 NFP89_WORLD_SPRING_PARTNER:0 "政治动荡波及同我国有约的国家。值得多看看伙伴的处境；两国曾共同作过打算，仍不能说明它会怎样度过今日的风潮。"
 NFP89_WORLD_SPRING_RIVAL:0 "民族之春的风潮到了与我国关系紧张的国家。若把对方遇上的每一桩麻烦都算作我们的好处，这套算法恐怕过于简便，经不起如此复杂的事态。"
 NFP89_WORLD_SUEZ_DISTANT:0 "苏伊士为合适的航线省去了海上绕道。要说我国所有货物从此都将降价，却还太早：从运河到柜台，仍有一段自己的路。"
 NFP89_WORLD_SUEZ_NEIGHBOR:0 "苏伊士运河在我国近旁开通。附近多了一条新路，值得留心；用起来划不划算，却不只由地图上的远近决定。"
 NFP89_WORLD_SUEZ_OWN:0 "苏伊士运河就在我国竣工。往日的大工地，如今成了两海间的通道。它给本国经济带来多少好处，往后的买卖自会提供比贺辞更实在的答卷。"
 NFP89_WORLD_SUEZ_PARTNER:0 "我国同苏伊士运河所在国有约在身。共同的打算里，值得把新河道算进去。但完工的消息本身，并未许给我们格外优厚的通行条件。"
 NFP89_WORLD_SUEZ_RIVAL:0 "我国同苏伊士的当局关系欠佳，运河并不会因此消失。在把它算作对方针对我们的优势之前，且先弄清实际的通行条件。"
 NFP89_WORLD_TAIPING_DISTANT:0 "中国的对峙中出现了独立的太平天国。这改变了局中的参与者，却还不足以让本报提前将故事的结局付印。"
 NFP89_WORLD_TAIPING_NEIGHBOR:0 "邻近地区出现了太平天国的政权。近旁将由谁管、管得多宽，是值得关心的问题。可今天的消息，还没有给每一处势力范围画出明确的线。"
 NFP89_WORLD_TAIPING_OWN:0 "太平天国的出现，是我们自己的政治史。新政权已宣告立足，今后在对峙中处于什么位置，不能拿一篇提前写好的胜负论代替。"
 NFP89_WORLD_TAIPING_PARTNER:0 "我国同太平天国的联系，使这条消息比寻常的中国纪事离我们更近。共同筹划事务，须考虑一个独立政权已经出现；它必将获胜，却并非已知的前提。"
 NFP89_WORLD_TAIPING_RIVAL:0 "我国与太平天国关系复杂，尤其得把新政权已经出现和它往后有多大能耐分开看。前者有了消息，后者不能从同一条新闻里直接读出。"
 NFP89_WORLD_YUG_DISTANT:0 "巴尔干半岛成立了一个共同国家。站在远方，很容易立刻分配给它某种历史角色。本报不妨先从一件朴素的事说起：地图上确已发生变化。"
 NFP89_WORLD_YUG_NEIGHBOR:0 "对南斯拉夫的邻国，共同国家的成立改变了近处的政治格局。新国家下一步会怎样决定，仍属未知；做邻居的便利，还不足以让报人读出别人的心思。"
 NFP89_WORLD_YUG_OWN:0 "南斯拉夫成立，本报读者成了这个新国家的一分子。共同的国名还得同各地不同的事务打交道；统一的日常意义，正是在这些地方才能看见。"
 NFP89_WORLD_YUG_PARTNER:0 "南斯拉夫的成立改变了我国这位巴尔干伙伴的国家体制。除了致上贺词，还值得把共同计划拿出来谈谈实质，核对从前的盘算。"
 NFP89_WORLD_YUG_RIVAL:0 "我国同南斯拉夫的关系并不轻松。这个国家的出现仍值得留心。只因不喜欢新地图，就拿旧地图解释巴尔干事务，未免是种奇特的自我宽慰。"
