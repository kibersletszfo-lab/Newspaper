l_simp_chinese:
 NFP20_ACCESS:0 "市场接入度持续偏低\n国家标识为[ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName]。观察于[ScriptContainer.GetVariableValue('nfp20_year')|0]年第[Add_CFixedPoint(ScriptContainer.GetVariableValue('nfp20_month'), '(CFixedPoint)1')|0]月。\n地区为[ScriptContainer.MakeScope.Var('nfp20_region').GetStateRegion.GetName]。连续两个月接入度低于90%，最近的比例为[ScriptContainer.GetVariableValue('nfp20_after')|3]。成因尚未确定，当地设施、海上联系及其他障碍须分别查验。\n选稿依据为[Localize(ScriptContainer.MakeScope.Var('nfp20_reason').GetFlagName)]。事实编号[ScriptContainer.GetVariableValue('nfp20_id')|0]。"
 NFP20_ACCESS_RECOVERY:0 "后续：市场接入度改善\n国家标识为[ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName]。观察于[ScriptContainer.GetVariableValue('nfp20_year')|0]年第[Add_CFixedPoint(ScriptContainer.GetVariableValue('nfp20_month'), '(CFixedPoint)1')|0]月。\n地区为[ScriptContainer.MakeScope.Var('nfp20_region').GetStateRegion.GetName]。先前的难题见报后，连续两次观察接入度均不低于90%。比例从[ScriptContainer.GetVariableValue('nfp20_before')|3]变为[ScriptContainer.GetVariableValue('nfp20_after')|3]。\n选稿依据为[Localize(ScriptContainer.MakeScope.Var('nfp20_reason').GetFlagName)]。事实编号[ScriptContainer.GetVariableValue('nfp20_id')|0]。"
 NFP20_COVER_TEXT:0 "编辑部简报\n共[ScriptContainer.GetVariableValue('nfp20_article_count')|0]篇，数字和措辞在出刊时留存。\n\n观察历史共[ScriptContainer.GetVariableValue('nfp20_history_count')|0]个时点，比较[ScriptContainer.GetVariableValue('nfp20_summary_intervals')|0]个间隔（最多12个）。\n全年国内生产总值估计为[ScriptContainer.GetVariableValue('nfp20_summary_before')|0] → [ScriptContainer.GetVariableValue('nfp20_summary_after')|0]。\n\n如本期无稿，说明当前启用的版面还未积累到可确认的新闻。旧闻均标明观察时间。"
 NFP20_DIAGNOSTICS:0 "付印时的编务记录\n尚有[ScriptContainer.GetVariableValue('nfp20_queue_remaining')|0]件待审，自观察开始以来因队列已满略过[ScriptContainer.GetVariableValue('nfp20_dropped')|0]件。\n本期未选的理由：问题过时[ScriptContainer.GetVariableValue('nfp20_rejected_obsolete')|0]，版面关闭[ScriptContainer.GetVariableValue('nfp20_rejected_rubric')|0]，不够紧急[ScriptContainer.GetVariableValue('nfp20_rejected_urgent')|0]，同类限额[ScriptContainer.GetVariableValue('nfp20_rejected_cap')|0]，篇幅不足[ScriptContainer.GetVariableValue('nfp20_rejected_space')|0]。"
 NFP20_DIVERGENCE:0 "经济增长与生活水平背道而驰\n国家标识为[ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName]。观察于[ScriptContainer.GetVariableValue('nfp20_year')|0]年第[Add_CFixedPoint(ScriptContainer.GetVariableValue('nfp20_month'), '(CFixedPoint)1')|0]月。\n在三个完整月度间隔内，全年国内生产总值估计从[ScriptContainer.GetVariableValue('nfp20_before')|0]升至[ScriptContainer.GetVariableValue('nfp20_after')|0]。平均生活水平下降[ScriptContainer.GetVariableValue('nfp20_extra')|2]点。两者走势相背，原因须另查。\n选稿依据为[Localize(ScriptContainer.MakeScope.Var('nfp20_reason').GetFlagName)]。事实编号[ScriptContainer.GetVariableValue('nfp20_id')|0]。"
 NFP20_GDP_LEADER:0 "全球经济十强添一成员\n国家标识为[ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName]。观察于[ScriptContainer.GetVariableValue('nfp20_year')|0]年第[Add_CFixedPoint(ScriptContainer.GetVariableValue('nfp20_month'), '(CFixedPoint)1')|0]月。\n先前位列十强之外的第[ScriptContainer.GetVariableValue('nfp20_before')|0]位，现居第[ScriptContainer.GetVariableValue('nfp20_after')|0]。连续两个月处于前十。此处比较全年国内生产总值估计，并非居民福祉或利润。\n选稿依据为[Localize(ScriptContainer.MakeScope.Var('nfp20_reason').GetFlagName)]。事实编号[ScriptContainer.GetVariableValue('nfp20_id')|0]。"
 NFP20_INFRA:0 "基础设施负荷过重\n国家标识为[ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName]。观察于[ScriptContainer.GetVariableValue('nfp20_year')|0]年第[Add_CFixedPoint(ScriptContainer.GetVariableValue('nfp20_month'), '(CFixedPoint)1')|0]月。\n地区为[ScriptContainer.MakeScope.Var('nfp20_region').GetStateRegion.GetName]。连续两个月基础设施余额为负，最近余额为[ScriptContainer.GetVariableValue('nfp20_after')|2]。值得检查当地运输网络及其负担。\n选稿依据为[Localize(ScriptContainer.MakeScope.Var('nfp20_reason').GetFlagName)]。事实编号[ScriptContainer.GetVariableValue('nfp20_id')|0]。"
 NFP20_INFRA_RECOVERY:0 "后续：基础设施恢复平衡\n国家标识为[ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName]。观察于[ScriptContainer.GetVariableValue('nfp20_year')|0]年第[Add_CFixedPoint(ScriptContainer.GetVariableValue('nfp20_month'), '(CFixedPoint)1')|0]月。\n地区为[ScriptContainer.MakeScope.Var('nfp20_region').GetStateRegion.GetName]。先前预警见报后，连续两次余额非负，记录为[ScriptContainer.GetVariableValue('nfp20_before')|2] → [ScriptContainer.GetVariableValue('nfp20_after')|2]。好转已获证实，不能由此保证今后不会再出问题。\n选稿依据为[Localize(ScriptContainer.MakeScope.Var('nfp20_reason').GetFlagName)]。事实编号[ScriptContainer.GetVariableValue('nfp20_id')|0]。"
 NFP20_LAW:0 "重大改革生效\n国家标识为[ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName]。观察于[ScriptContainer.GetVariableValue('nfp20_year')|0]年第[Add_CFixedPoint(ScriptContainer.GetVariableValue('nfp20_month'), '(CFixedPoint)1')|0]月。\n法律为[Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]。已记录该法生效；本报未断言它经议会投票通过，亦未在此评估后果。\n选稿依据为[Localize(ScriptContainer.MakeScope.Var('nfp20_reason').GetFlagName)]。事实编号[ScriptContainer.GetVariableValue('nfp20_id')|0]。"
 NFP20_LITERACY:0 "识字率跨过门槛\n国家标识为[ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName]。观察于[ScriptContainer.GetVariableValue('nfp20_year')|0]年第[Add_CFixedPoint(ScriptContainer.GetVariableValue('nfp20_month'), '(CFixedPoint)1')|0]月。\n识字人口比例从[ScriptContainer.GetVariableValue('nfp20_before')|3]变为[ScriptContainer.GetVariableValue('nfp20_after')|3]，跨过[ScriptContainer.GetVariableValue('nfp20_extra')|2]这一人口比例。该变化与上次观察对照确认，未将开局即有的水平作为新成就。\n选稿依据为[Localize(ScriptContainer.MakeScope.Var('nfp20_reason').GetFlagName)]。事实编号[ScriptContainer.GetVariableValue('nfp20_id')|0]。"
 NFP20_NONE:0 "—"
 NFP20_PRODUCTION:0 "三大生产国出现新面孔\n国家标识为[ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName]。观察于[ScriptContainer.GetVariableValue('nfp20_year')|0]年第[Add_CFixedPoint(ScriptContainer.GetVariableValue('nfp20_month'), '(CFixedPoint)1')|0]月。\n商品为[Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]。先前位列前三之外的第[ScriptContainer.GetVariableValue('nfp20_before')|0]位，现居第[ScriptContainer.GetVariableValue('nfp20_after')|0]。连续两个月处于前三。比较的是产量，未计量利润或出口。\n选稿依据为[Localize(ScriptContainer.MakeScope.Var('nfp20_reason').GetFlagName)]。事实编号[ScriptContainer.GetVariableValue('nfp20_id')|0]。"
 NFP20_QUIET:0 "本版此期没有选入新稿。编辑部不以反复抄录现有指标填充篇幅。"
 NFP20_RANK:0 "国家地位改变\n国家标识为[ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName]。观察于[ScriptContainer.GetVariableValue('nfp20_year')|0]年第[Add_CFixedPoint(ScriptContainer.GetVariableValue('nfp20_month'), '(CFixedPoint)1')|0]月。\n旧地位为[Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]，新地位为[Localize(ScriptContainer.MakeScope.Var('nfp20_extra_detail').GetFlagName)]。地位改变并非每次都意味着出现新列强。\n选稿依据为[Localize(ScriptContainer.MakeScope.Var('nfp20_reason').GetFlagName)]。事实编号[ScriptContainer.GetVariableValue('nfp20_id')|0]。"
 NFP20_RANK_UNKNOWN:0 "属于列举范围之外"
 NFP20_REASON_PRIORITY:0 "题材优先次序及消息时效"
 NFP20_SHORTAGE:0 "市场短缺持续\n国家标识为[ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName]。观察于[ScriptContainer.GetVariableValue('nfp20_year')|0]年第[Add_CFixedPoint(ScriptContainer.GetVariableValue('nfp20_month'), '(CFixedPoint)1')|0]月。\n商品为[Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]。读者所处市场连续两个月带有直接短缺标记。此判断并非由高价推得，可检查市场的供给与消费。\n选稿依据为[Localize(ScriptContainer.MakeScope.Var('nfp20_reason').GetFlagName)]。事实编号[ScriptContainer.GetVariableValue('nfp20_id')|0]。"
 NFP20_SHORTAGE_RECOVERY:0 "后续：市场已无短缺标记\n国家标识为[ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName]。观察于[ScriptContainer.GetVariableValue('nfp20_year')|0]年第[Add_CFixedPoint(ScriptContainer.GetVariableValue('nfp20_month'), '(CFixedPoint)1')|0]月。\n商品为[Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]。预警见报后，连续两次月度观察均无直接短缺标记。价格仍可能偏高，那是另一个指标。\n选稿依据为[Localize(ScriptContainer.MakeScope.Var('nfp20_reason').GetFlagName)]。事实编号[ScriptContainer.GetVariableValue('nfp20_id')|0]。"
 NFP20_TECH:0 "掌握重要技术\n国家标识为[ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName]。观察于[ScriptContainer.GetVariableValue('nfp20_year')|0]年第[Add_CFixedPoint(ScriptContainer.GetVariableValue('nfp20_month'), '(CFixedPoint)1')|0]月。\n技术为[Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]。已记录当地获得这项知识。这并非证明它为世界首创，也并非证明所有企业已投入应用。\n选稿依据为[Localize(ScriptContainer.MakeScope.Var('nfp20_reason').GetFlagName)]。事实编号[ScriptContainer.GetVariableValue('nfp20_id')|0]。"
 NFP20_WAR_END:0 "战争结束\n事件时间为[ScriptContainer.GetVariableValue('nfp20_year')|0]年第[Add_CFixedPoint(ScriptContainer.GetVariableValue('nfp20_month'), '(CFixedPoint)1')|0]月。\n按固定国家标识记录的主要当事方为[ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName]与[ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName]。已确认战争终结，但胜负、损失与和平条款均须另有根据。\n选稿依据为[Localize(ScriptContainer.MakeScope.Var('nfp20_reason').GetFlagName)]。事实编号[ScriptContainer.GetVariableValue('nfp20_id')|0]。"
 NFP20_WAR_START:0 "战争爆发\n事件时间为[ScriptContainer.GetVariableValue('nfp20_year')|0]年第[Add_CFixedPoint(ScriptContainer.GetVariableValue('nfp20_month'), '(CFixedPoint)1')|0]月。\n按固定国家标识记录的主要当事方为[ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName]与[ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName]。已确认外交博弈升级为战争，其他参与者和未来结局不在此评估。\n选稿依据为[Localize(ScriptContainer.MakeScope.Var('nfp20_reason').GetFlagName)]。事实编号[ScriptContainer.GetVariableValue('nfp20_id')|0]。"
 NFP_ARCHIVE:0 "往期报纸（最多12期）"
 NFP_ARCHIVE_ITEM:0 "第 [ScriptContainer.GetVariableValue('nfp_number')|0] 期"
 NFP_COUNTRY:0 "读者：[GetPlayer.GetName]"
 NFP_COVER:0 "头版"
 NFP_COVER_TEXT:0 "付印时的国家概况\n\n国内生产总值：[ScriptContainer.GetVariableValue('nfp_gdp')|0]\n人口：[ScriptContainer.GetVariableValue('nfp_population')|0]\n平均生活水平：[ScriptContainer.GetVariableValue('nfp_sol')|2]\n识字率（原始比例）：[ScriptContainer.GetVariableValue('nfp_literacy')|3]\n\n请选择栏目或翻页。本期栏目已确定，阅读时不会重新计算数值。"
 NFP_ECONOMY:0 "经济"
 NFP_EVENTS:0 "时事"
 NFP_ISSUE_HEADER:0 "第 [ScriptContainer.GetVariableValue('nfp_number')|0] 期——[ScriptContainer.GetVariableValue('nfp_year')|0] 年 [Add_CFixedPoint(ScriptContainer.GetVariableValue('nfp_month'), '(CFixedPoint)1')|0] 月"
 NFP_ISSUE_META:0 "来源：[SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp_kind'), '(CFixedPoint)1'), 'NFP_KIND_REGULAR', SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp_kind'), '(CFixedPoint)3'), 'NFP_KIND_URGENT', 'NFP_KIND_OTHER'))] • 标记 [ScriptContainer.GetVariableValue('nfp_marker')|0]"
