 NFP52_AUS_2_TITLE:0 "远方大陆结成一国"
 NFP52_CAN_1_BODY:0 "加拿大各地有了共同的国家体制。旁观者看见地图上出现了新局面，当地人则多了一个一起办事的机会。加拿大这个名字的含义，从此不止于地理。\n\n加拿大的联合已经实现。一个国家成立了，要负责加盟各地的共同事务。它与宗主国的关系则须另看，联合本身并非独立宣言。\n\n大家一道决策，决策还得有内容。路途遥远、各地生计不同、利益各异，都不会因为换块招牌就消失。好在这些问题如今有了同一个投书处。但愿寄去的时候，也收得到回信。\n\n本报以收到消息的月份记事。传递路上若有耽搁，事情本身可能发生得更早。"
