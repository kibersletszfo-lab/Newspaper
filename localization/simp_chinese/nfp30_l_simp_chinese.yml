 NFP51_DETAIL:0 "外交危机"
 NFP51_END_1_CORE:0 "在[ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName]向[ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName]发起的外交对峙中，[ScriptContainer.MakeScope.Var('nfp51_actor').GetCountryDefinition.GetName]作出了退让。争执的焦点是[Localize(ScriptContainer.MakeScope.Var('nfp51_play_label').GetFlagName)]。"
 NFP51_END_1_END:0 "这场危机终于在开战以前化解。一方退让，并不等于国与国之间的分歧就此消失。不过，能在交火之前结束的争执，总值得报上一笔。新闻读来少了些轰轰烈烈，日子过起来也许反倒舒坦得多。"
 NFP51_END_1_LEAD:0 "[ScriptContainer.MakeScope.Var('nfp51_actor').GetCountryDefinition.GetName]在外交对峙中作出了退让。"
 NFP51_END_1_TITLE:0 "大炮开口以前，有人退了一步"
 NFP51_END_2_CORE:0 "[ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName]与[ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName]之间的对峙已有结果。[ScriptContainer.MakeScope.Var('nfp51_actor').GetCountryDefinition.GetName]作出了退让，危机没有变成战争。争执的焦点是[Localize(ScriptContainer.MakeScope.Var('nfp51_play_label').GetFlagName)]。"
 NFP51_END_2_END:0 "这场危机终于在开战以前化解。一方退让，并不等于国与国之间的分歧就此消失。不过，能在交火之前结束的争执，总值得报上一笔。新闻读来少了些轰轰烈烈，日子过起来也许反倒舒坦得多。"
 NFP51_END_2_LEAD:0 "在外交博弈演变为战争之前，[ScriptContainer.MakeScope.Var('nfp51_actor').GetCountryDefinition.GetName]已经退让。"
 NFP51_END_2_TITLE:0 "大炮开口以前，有人退了一步"
 NFP51_JOIN_1_CORE:0 "本月，[ScriptContainer.MakeScope.Var('nfp51_actor').GetCountryDefinition.GetName]在[ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName]与[ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName]的外交对峙中站到了[ScriptContainer.MakeScope.Var('nfp51_side').GetCountryDefinition.GetName]一边。争执的焦点是[Localize(ScriptContainer.MakeScope.Var('nfp51_play_label').GetFlagName)]。"
 NFP51_JOIN_1_END:0 "多了一方声援，双方的盘算也要跟着改变。独自提出要求是一回事，知道身边有谁愿意站出来，是另一回事。眼下仍是外交对峙。且看人多了是更易谈拢，还是坚持己见的人也更多了。"
 NFP51_JOIN_1_LEAD:0 "[ScriptContainer.MakeScope.Var('nfp51_actor').GetCountryDefinition.GetName]表示支持[ScriptContainer.MakeScope.Var('nfp51_side').GetCountryDefinition.GetName]一方。"
 NFP51_JOIN_1_TITLE:0 "谈判桌边，又添了一把椅子"
 NFP51_JOIN_2_CORE:0 "外交对峙又添了一名参与者：[ScriptContainer.MakeScope.Var('nfp51_actor').GetCountryDefinition.GetName]。它所支持的是[ScriptContainer.MakeScope.Var('nfp51_side').GetCountryDefinition.GetName]，原先的两个主要当事国为[ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName]与[ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName]。争执的焦点是[Localize(ScriptContainer.MakeScope.Var('nfp51_play_label').GetFlagName)]。"
 NFP51_JOIN_2_END:0 "多了一方声援，双方的盘算也要跟着改变。独自提出要求是一回事，知道身边有谁愿意站出来，是另一回事。眼下仍是外交对峙。且看人多了是更易谈拢，还是坚持己见的人也更多了。"
