 NFP61_URBAN_WORK:0 "城市经济也有扩展。大规模运输在地图上容易看得见，但当地每天要办的事，岂止是远途运输。"
 NFP62_CAP_DOWN:0 "这段时间，基础设施本身的承载能力反而缩小了。因此“只是地方更宽了”的解释说不通。市场联系确有改善，但这段故事显然比一项新建成的工程复杂。"
 NFP62_CAP_UP:0 "这段时间，当地基础设施的承载能力提高了。可喜的是，运力多了，市场的联系也好了。现在就把全部功劳记在同一项上未免匆忙，可这两件事同行，也值得留心。"
 NFP62_CAUSES:0 "[SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp60_components_known'), '(CFixedPoint)1'), 'NFP62_COMPONENTS', 'NFP62_UNKNOWN')][SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp60_st_partial'), '(CFixedPoint)1'), 'NFP62_PARTIAL', 'NFP50_EMPTY')]"
 NFP62_COMPONENTS:0 "[SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp60_cap_dir'), '(CFixedPoint)1'), 'NFP62_CAP_UP', SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp60_cap_dir'), '(CFixedPoint)-1'), 'NFP62_CAP_DOWN', 'NFP50_EMPTY'))][SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp60_usage_dir'), '(CFixedPoint)1'), 'NFP62_LOAD_UP', SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp60_usage_dir'), '(CFixedPoint)-1'), 'NFP62_LOAD_DOWN', 'NFP50_EMPTY'))]"
 NFP62_END:0 "末了想说些什么？过去这个地区在地图上属于我国，共同市场有时却显得很远。如今两者之间少了些障碍。对全国经济而言是个好变化，但愿普通人上街买东西时，也能感受到它。\n\n我们会跟着看下去。毕竟，一边买着东西一边谈论共同市场，比一边听人解释它为何又够不着，一边谈论它要愉快多了。"
 NFP62_EVENTS:0 "[SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp60_rail_work'), '(CFixedPoint)1'), 'NFP62_RAIL_WORK', 'NFP50_EMPTY')][SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp60_port_work'), '(CFixedPoint)1'), 'NFP62_PORT_WORK', 'NFP50_EMPTY')][SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp60_urban_work'), '(CFixedPoint)1'), 'NFP62_URBAN_WORK', 'NFP50_EMPTY')][SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp60_rail_pm_seen'), '(CFixedPoint)1'), 'NFP62_RAIL_PM', 'NFP50_EMPTY')][SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp60_port_pm_seen'), '(CFixedPoint)1'), 'NFP62_PORT_PM', 'NFP50_EMPTY')][SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp60_urban_pm_seen'), '(CFixedPoint)1'), 'NFP62_URBAN_PM', 'NFP50_EMPTY')]$NFP62_PM_END_SELECT$[SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp60_st_rail_staffup'), '(CFixedPoint)1'), 'NFP62_RAIL_STAFF', 'NFP50_EMPTY')][SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp60_st_port_staffup'), '(CFixedPoint)1'), 'NFP62_PORT_STAFF', 'NFP50_EMPTY')]$NFP62_STAFF_END_SELECT$这些都是我们留心当地期间发生的事。哪项变化贡献最大，眼下还说不明白。同时出现值得细查，可不能直接拿来排一张功劳榜。"
 NFP62_FACT:0 "说的是[SelectLocalization(And(ScriptContainer.MakeScope.Var('nfp20_problem_state').IsSet, ScriptContainer.MakeScope.Var('nfp20_problem_state').GetState.IsValid), 'NFP40_STATE_LINK', 'NFP40_REGION_FALLBACK')]。最近的记录表明，先前妨碍当地接入共同市场的问题已有所缓解。这还不能许诺每间铺子都货色齐全、价钱便宜。但当地可以更充分地参与全国经济。“共同”二字，终于又靠近了本意。"
 NFP62_INTRO:0 "“国内有”和“本地买得到”之间，有时隔得实在太远。偏偏这种距离未必能用里程来量。在地图上近在咫尺，国界是自家的，经济也是共有的，用起来却总差一截。本报先前报道过这份烦恼，今天总算能换个心情再访。"
 NFP62_LOAD_DOWN:0 "网络的负担减轻了，当地或许因而更易应付运输和其他经济需要。不过它为什么减轻，又是另一个问题。给负担下降一概贴上胜利的标签，本报还想稍等。"
 NFP62_LOAD_UP:0 "网络负担反而增加了。因此，市场接入度的改善，并非发生在经济需求缩小的情况下。要办的事多了，往日的难题却在消退。是什么促成了好转，也就更加值得追问。"
 NFP62_PARTIAL:0 "不过，详细记录是从事情发展途中才开始的，有一段路当地走在我们落笔以前。若拿后来看到的变化解释整个结果，未免过于省事。"
 NFP62_PM_END:0 "改变未必都需要新工程。建成什么固然重要，已有设施究竟怎样使用，也一样值得留心。"
 NFP62_PM_END_SELECT:0 "[SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp60_rail_pm_seen'), '(CFixedPoint)1'), 'NFP62_PM_END', 'NFP62_PORT_PM_END_SELECT')]"
