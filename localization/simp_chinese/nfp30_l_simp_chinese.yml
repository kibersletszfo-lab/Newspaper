 NFP50_LAW_INTRO_AWAY_1:0 "海外改了法律。坐得远，评说人家的规矩很方便。不过，这类消息有时也让人更想端详自家的制度：与人家不同在哪里，我们又满意不满意？"
 NFP50_LAW_INTRO_AWAY_2:0 "海外改了法律。坐得远，评说人家的规矩很方便。不过，这类消息有时也让人更想端详自家的制度：与人家不同在哪里，我们又满意不满意？"
 NFP50_LAW_INTRO_HOME_1:0 "我国改了法律。一国百姓赖以生活的规矩，很少能让所有人一样满意。它为一人开门的同时，或许也提醒另一人，钥匙已不在自己手里。究竟改了哪一条，又有哪些人读了高兴？且往下看。"
 NFP50_LAW_INTRO_HOME_2:0 "我国改了法律。一国百姓赖以生活的规矩，很少能让所有人一样满意。它为一人开门的同时，或许也提醒另一人，钥匙已不在自己手里。究竟改了哪一条，又有哪些人读了高兴？且往下看。"
 NFP50_LAW_MEANING_LAW_COMPULSORY_PRIMARY_SCHOOL_1:0 "孩子须上学，童工受到限制，法律容许扩充学校体系。其中一个再明白不过的机会，是孩子长大时，除了会干活，还能够读书。不过，从纸面上的义务教育到真正坐进课桌之间，还得有学校，也得有办学的经费。条文写得再严，字也不会自己钻进脑袋。"
 NFP50_LAW_MEANING_LAW_COMPULSORY_PRIMARY_SCHOOL_2:0 "孩子须上学，童工受到限制，法律容许扩充学校体系。其中一个再明白不过的机会，是孩子长大时，除了会干活，还能够读书。不过，从纸面上的义务教育到真正坐进课桌之间，还得有学校，也得有办学的经费。条文写得再严，字也不会自己钻进脑袋。"
 NFP50_LAW_MEANING_LAW_GUARANTEED_LIBERTIES_1:0 "保障自由的条款为内政机关画出了界线。维护秩序也须顾及居民的权利。尤其对那些意见不合时宜的人，这一点值得记住。往后许多事要看内政机关怎样办；写在纸上的自由，值得在纸张以外等到相称的下文。"
 NFP50_LAW_MEANING_LAW_GUARANTEED_LIBERTIES_2:0 "保障自由的条款为内政机关画出了界线。维护秩序也须顾及居民的权利。尤其对那些意见不合时宜的人，这一点值得记住。往后许多事要看内政机关怎样办；写在纸上的自由，值得在纸张以外等到相称的下文。"
 NFP50_LAW_MEANING_LAW_PROTECTED_SPEECH_1:0 "自由发言得到法律保护，政府失去了以往压制某些社会运动、扶持另一些运动的手段。对公共争论而言，这是重要变化：要用一道省事的禁令替代一个有说服力的理由，如今更难了。但愿可供说话的空间多了，值得说出的见解也多些。"
 NFP50_LAW_MEANING_LAW_PROTECTED_SPEECH_2:0 "自由发言得到法律保护，政府失去了以往压制某些社会运动、扶持另一些运动的手段。对公共争论而言，这是重要变化：要用一道省事的禁令替代一个有说服力的理由，如今更难了。但愿可供说话的空间多了，值得说出的见解也多些。"
 NFP50_LAW_MEANING_LAW_SLAVERY_BANNED_1:0 "奴隶制已失去法律依据。从此人不能成为他人的财产，这恐怕不能只称作公文上改过一笔。自由本身还不意味着已有工作、在社会中已获平等地位。但至少，没有人还能合法地把另一个人当作家里的什物般处置。"
 NFP50_LAW_MEANING_LAW_SLAVERY_BANNED_2:0 "奴隶制已失去法律依据。从此人不能成为他人的财产，这恐怕不能只称作公文上改过一笔。自由本身还不意味着已有工作、在社会中已获平等地位。但至少，没有人还能合法地把另一个人当作家里的什物般处置。"
