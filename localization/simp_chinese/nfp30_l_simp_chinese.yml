 NFP63_DETAILS:0 "编辑部选稿依据为[SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp63_reason'), '(CFixedPoint)0'), 'NFP63_REASON_0', 'NFP50_EMPTY')][SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp63_reason'), '(CFixedPoint)1'), 'NFP63_REASON_1', 'NFP50_EMPTY')][SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp63_reason'), '(CFixedPoint)2'), 'NFP63_REASON_2', 'NFP50_EMPTY')][SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp63_reason'), '(CFixedPoint)3'), 'NFP63_REASON_3', 'NFP50_EMPTY')][SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp63_reason'), '(CFixedPoint)4'), 'NFP63_REASON_4', 'NFP50_EMPTY')][SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp63_reason'), '(CFixedPoint)5'), 'NFP63_REASON_5', 'NFP50_EMPTY')][SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp63_reason'), '(CFixedPoint)6'), 'NFP63_REASON_6', 'NFP50_EMPTY')][SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp63_reason'), '(CFixedPoint)7'), 'NFP63_REASON_7', 'NFP50_EMPTY')]。\n编辑分级：读者国[ScriptContainer.GetVariableValue('nfp63_reader_tier')|0]，消息来源国[ScriptContainer.GetVariableValue('nfp63_source_tier')|0]，另一方[ScriptContainer.GetVariableValue('nfp63_second_tier')|0]。优先级加值[ScriptContainer.GetVariableValue('nfp63_bonus')|0]，科技新颖性[ScriptContainer.GetVariableValue('nfp63_novel')|0]，法律差异[ScriptContainer.GetVariableValue('nfp63_different_law')|0]。\n同来源国的联系为[ScriptContainer.GetVariableValue('nfp63_relation')|0]，同另一方的联系为[ScriptContainer.GetVariableValue('nfp63_second_relation')|0]，关系为[ScriptContainer.GetVariableValue('nfp63_friend')|0]。收讯时已保存依据和语气，档案不会重新读取当前外交。\n来源国对读者国的关系值为[ScriptContainer.GetVariableValue('nfp63_relation_value')|0]，档次[ScriptContainer.GetVariableValue('nfp63_relation_band')|0]，AI意图[ScriptContainer.GetVariableValue('nfp63_attitude')|0]。另一方的关系值为[ScriptContainer.GetVariableValue('nfp63_secondary_relation_value')|0]，档次[ScriptContainer.GetVariableValue('nfp63_secondary_relation_band')|0]，AI意图[ScriptContainer.GetVariableValue('nfp63_secondary_attitude')|0]。意图为零表示缺少可确认的记录，不代表玩家抱持中立意图。"
