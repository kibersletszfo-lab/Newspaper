 NFP65_AWAY_HALF:0 "如今，该国至少半数人口已经识字。好看的整数不会在当天就翻开所有的书，也不会扫清从前的难处。不过读书写字，确实已逐渐成为更多人掌握的本领。对一个人，这是自己看懂字句的机会；对一个国家，则是为往后的打算多添一分坚实的根基。"
 NFP65_AWAY_THREE:0 "识字人口已达四分之三。到了这一步，教育确实已颇为普及，不再只是少数人的本领。不过剩下的四分之一也并非报表上的一处小瑕疵。一个好看的总数，说明不了各地求学难易，也说明不了谁入门尤其艰辛。只是这些问题，并不会让已取得的成就变小。"
 NFP65_AWAY_TITLE:0 "海外又添了许多读书人"
 NFP65_COMPARE_AHEAD:0 "我国的识字人口比例目前落在后面。在这一项上，人家确有优势。若拿一句“可我们还有……”轻轻带过，未免省事了些。既能为自家的成就自豪，也该能看见别人做成了什么。何况从贺词到一个有用的问题，不过一步之遥：他们靠什么办到，我们又办得怎样？"
 NFP65_COMPARE_BEHIND:0 "我国的识字人口比例目前领先。确是件快事，我们不争论这一点。不过旁人的成就，倒不是让自己得意地扶一扶桂冠的理由。今日报表上我国居前，不意味着这个名次从此永归我国。握有优势固然好，别把它握成一段往事才更好。"
 NFP65_COMPARE_EQUAL:0 "两国目前的识字率很接近。我们可以满意地写下“并未落后”，然后翻页。但总数相等，还不能说明两国办教育的方式相同，所有人也都一样容易读上书。相似的一行数字，背后也许各有故事。弄清它们的分别，恐怕比庄严地宣布平局有意思些。"
 NFP65_COMPARE_UNKNOWN:0 "要同我国作可靠的比较，目前资料还不够。若能立即判定该格外向谁道喜、又该催促谁加把劲，自然方便。只是没有可靠成绩的报纸竞赛，太容易让执笔的人赢走。且先记下这道门槛，不急着给两国排座次。"
 NFP65_END_COLD_PARTNER:0 "两国虽有共同约定，彼此仍有不满。也正因如此，更值得注意那些并非只适合拿来吵架的事情。伙伴在教育上取得了成绩，不必因此就爱上它，弄清这份成绩背后有些什么却颇有用处。"
 NFP65_END_FRIEND:0 "这回可以从容地道一声恭喜，不必在外交笑容里咬紧牙关。但愿寒暄过后，还有地方谈谈值得借鉴的经验。把别人的数字抄进自己的报表，当然不妥；学习他们怎样做出来的，则是另一回事。"
 NFP65_END_NEUTRAL:0 "变化已记下来，也有了比较的缘由。往后还想看看，这份成绩对当地日子究竟有何影响。眼下不妨也翻翻自家的报告：有些海外消息的好处，正是让我们读自己的新闻时更仔细些。"
 NFP65_END_OVERLORD:0 "对这个国家的进展，我们尤其得留神。它的成就不会自动成为我们的，如同它国内的识字率也不会随下一道命令送到这里。有用的经验可以学习，本国办教育的事却仍须自己动手。"
 NFP65_END_REBELLIOUS:0 "我国同属国的关系并不平静。识字人数增加，本身还不能解释它为何追求自主。把这两条消息揉成一个省事的解释不难，分别弄清它们才较费工夫，却也更能帮我们看懂局面。"
 NFP65_END_RIVAL:0 "对方的成果不等于我国的失败，也不会因一句俏皮话就此消失。向对手道过贺，还是看看自家的报表吧。但愿机智始终是我国的一项优点，而非我们应对人家成就的主要办法。"
 NFP65_END_SUBJECT:0 "属国传来好消息，即使不提它应缴的款项也值得一记。当地的发展，不能用对我国国库有多少好处概括。但愿这次迈过门槛之后，百姓能在日子里体会到一些变化，而不只是在读报时看见它。"
 NFP65_END_THREAT:0 "对方对我国怀有难称友善的意图。识字率上升本身不等于在准备战争。不过，一个有意向我国施压的国家正在发展，即使没吹军号，也值得留心。拿“不过是教育罢了”来自我宽慰，恐怕轻率了些。"
 NFP65_HOME_END:0 "我国值得自豪的事又多了一桩。越来越多的人能亲自读懂写下来的东西，也就是说，他们与知识之间少了一位传话人。这份成绩具体如何取得，得另写一段故事。没有细节以前，不宜把功劳全归给一项得当的措施。\n\n但愿这个故事一直写下去。报纸需要读者，国家需要的，是不只会读报纸的人。"
 NFP65_HOME_EXPECTATIONS:0 "教育也有一面让政府未必自在：人们会对自己的生活抱有更高期待。识字有助于经济发展，却不会教人甘于更少。于是出现了一个有意思的局面：国家要有学识的工人，有学识的工人想过更好的日子。这番对话，恐怕不是一篇教育贺辞就能结束。"
 NFP65_HOME_HALF:0 "我国如今已有至少半数人口识字。这份成绩带来的不只是一批新报户。受过教育的人较容易掌握新的职业，国家也较容易发展科学、借鉴他国发现。一个个字慢慢拼起来，不但成了文章，也成了经济发展的机会。"
 NFP65_HOME_INTRO:0 "识字很有用。能自己看懂告示、读一封家书、翻一本书。还可以弄明白演说里究竟许诺了什么，不用靠那个只记住最有趣几句的人来转述。对个人，这是日常的本领；对国家，却是一件当得起头版的变化。"
 NFP65_HOME_PROFESSION:0 "教育给居民更宽的择业余地。若不用碰到字句就拿给旁人念，学习工程技术、处理公务文书自然容易些。企业有机会找到合适的人手，工人有机会试试在老行当之外谋生。这并非许诺一份新职位和优厚薪水。只是从前也许连钥匙都没有的门，如今可以去推一推。"
 NFP65_HOME_SCIENCE:0 "科学研究也多了施展的空间。识字率越高，国家越能利用大学的研究力量作出自己的发现。海外知识也传得更快；听说远方有人造了件有用的东西还不够，总得读得懂它怎样运转。当然，光靠识字的人还不够成就科学飞跃。但光靠大学的几面墙，也同样办不到。"
 NFP65_HOME_THREE:0 "我国识字人口比例已经达到四分之三。这给经济添了相当厚实的根基：培养专业人才、开展研究、弄明白海外的新发明，都有了更多可能。只是余下的四分之一也是人。报表再漂亮，还没有教会他们读书。"
 NFP65_HOME_TITLE:0 "读者多了，好处不只归报馆"
 NFP65_OPEN_ALLY:0 "盟友[ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName]的识字率迈过新的门槛。很高兴收到这样一条伙伴新闻，读它不用先展开军用地图。说的是如今有更多人能够亲自读懂写下的字，想来也包括我们彼此约定的义务。这门本领，对两边都有用。"
 NFP65_OPEN_ALLY_BLOC:0 "盟友兼集团伙伴[ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName]的识字率跨过了新的门槛。共同的圈子里，又多了一批人能读报纸、读条约，连承诺底下那行小字也能读懂。这是伙伴间的好消息。同属一个集团，却不会使对方的成就归到我们名下。庆贺可以一道庆贺，读书仍得各自在自家用功。"
 NFP65_OPEN_BLOC:0 "集团伙伴[ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName]的识字率跨过了新门槛。来自同一外交圈的消息，也并非总在谈判桌和势力范围之间打转。这次是教育。新闻乍读不响亮，对于想好好发展的国家倒很有分量。毕竟，只靠共同协议上的几个签名，是走不了多远的。"
 NFP65_OPEN_NEIGHBOR:0 "邻邦[ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName]跨过识字的新门槛。为此，地图上的界碑一根没动，也不必四处拍发告急电报。不过邻居之间毕竟不只有界碑，有时也值得看看界碑那头日子如何。尤其是这次，正好能把别人的进展同自家比一比。"
 NFP65_OPEN_OTHER:0 "[ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName]传来识字率跨过新门槛的消息。海外新闻未必篇篇要以战争、丑闻或谁人下台开场。这一次是更多人会读会写了。没有礼炮，影响却或许比礼炮的回声久远得多。"
 NFP65_OPEN_OVERLORD:0 "宗主国[ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName]的识字率跨过了新的门槛。了解我国所依附的国家，不必只靠从那里传来的命令。这回的消息关乎教育。它本身不会改变两国的关系，却让我们看见这个不得不考虑的大国又有怎样的一面。"
 NFP65_OPEN_RIVAL:0 "对手[ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName]的识字率跨过了新的门槛。我们尽可以编一句巧妙的挖苦，然后就此收笔。可惜一番讥讽过后，人家识得的字却不会因此忘掉。练习机智以前，不妨先看看究竟发生了什么。即便要在报上挖苦人，手头多几分事实，也从来没有坏处。"
 NFP65_OPEN_SUBJECT:0 "我国的属国[ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName]传来识字率跨过新门槛的消息。人们很容易把它的事务当作自家账册的附录：产些什么、交来多少、是否安分。可住在那里的是人，不是账册上的一行数字。如今，这些人中有更大一部分，已经读得懂账册里写了什么。"
 NFP66_AWAY_CONTEXT:0 "这份成绩值得他国认真对待。一个名次尚不能交代它靠什么上升，也说不尽各行各业的光景。若用“不过是个数字”一句打发，却未免太方便了些。有些数字颇有内容，尤其当它背后站着世界上最大的经济体之一时。"
 NFP66_AWAY_FACT:0 "入围十强以前，该国位列第[ScriptContainer.GetVariableValue('nfp20_before')|0]，如今为第[ScriptContainer.GetVariableValue('nfp20_after')|0]。这已是它连续第二个月跻身前列。这里排的是经济总量，不是谁家百姓过得更宽裕。若按后者排，这张榜恐怕很不一样。"
 NFP66_AWAY_TITLE:0 "世界经济十强添新成员"
 NFP66_END_COLD_PARTNER:0 "两国虽有约在身，相互的意见却未因此消散。不过人家的经济也不会因此缩小。与其设法证明一个不好相处的伙伴家里绝不会有新鲜事，不如先读懂眼前的变化。"
 NFP66_END_FRIEND:0 "值得向伙伴道声恭喜。接下来更想看看，它的经济成绩将带来什么机会，其中有没有适合一起做的事。会面时合影值得留念，伙伴之间的好处若能走出相框，那才更好。"
 NFP66_END_NEUTRAL:0 "变化已有记录，也有了追踪的缘由。新地位会怎样影响该国百姓和对外事务，还待往后见分晓。眼下也不妨翻翻自家的报表。别人的喜讯有时最有用的地方，正在于它让我们想向自己提出哪些问题。"
 NFP66_END_OVERLORD:0 "宗主国的经济胜利并不会自动变成我们的成就。但它有多少实力，作为属国不能心里没数。但愿我们自己的发展，在打算中占的篇幅至少不比旁观它的成就少。"
 NFP66_END_REBELLIOUS:0 "我们与属国的关系说不上平静。正因如此，它新的经济地位尤其值得留心。若说跻身十强就是它追求自主的原因，未免仓促；若说它的经济规模对双方关系毫无影响，也一样。"
 NFP66_END_RIVAL:0 "对手进了十强，不等于我国已输了一场。只是光靠一句漂亮的挖苦来宽慰自己，也不大令人满意。人家交出了一份成绩。希望我国下回能用一份好报表作答，而不只是一个好俏皮话。"
 NFP66_END_SUBJECT:0 "看待属国，值得多看一眼它自己的经济。新排名给了我们了解其发展的好理由，眼光未必只放在我国国库还能从中取走多少。这样的成绩，值得谈得比下一份应缴清册更宽一些。"
 NFP66_END_THREAT:0 "对方对我国的打算，很难称得上没有威胁。经济进了十强，既不会凭空造出军队，也不等于已经开战。但轻忽这样的国家能做些什么，仍不明智。等到意外发生才开始计算人家的实力，通常迟了些。"
 NFP66_HOME_CONTEXT:0 "名次的升降讲不完全部故事。它既随我们自己的表现而动，也受其他国家的处境影响。可以确定的是，我国比先前靠前，并已在两次观察中稳居十强。要是拿这当作各行业都成功的证明，那是送给统计报告的一份过于阔绰的礼物。"
 NFP66_HOME_END:0 "末了想说些什么？自豪是有缘由的。国内还留着难题，难道就不许为这份成绩高兴？同样奇怪的，是觉得如今可以把那些难题统统忘掉。\n\n我们已经挤进十强，但愿好日子也别被关在门外。"
 NFP66_HOME_FACT:0 "进十强以前，我国位列第[ScriptContainer.GetVariableValue('nfp20_before')|0]，如今是第[ScriptContainer.GetVariableValue('nfp20_after')|0]。我国连续第二个月出现在经济规模最大的国家之列。换句话说，贺词上的墨还没干就得撤回的尴尬，总算避免了。这是个不错的开始。"
 NFP66_HOME_INTRO:0 "我国已经跻身世界经济十强。爱在国际报表里找点民族自豪的人，今天有了好消息，而且这回确实有据可依。尽可以挺直腰板，整整衣领，走近些看清这份成绩。最好赶在庆功演说开始之前。"
 NFP66_HOME_LIVING:0 "对居民来说，榜上的好名次还不是钱袋里的一笔进项。知道自己生活在世界最大的经济体之一，自然高兴。只是到了店里，人家伸手要的照旧是钱，不是国家的国际排名。但愿经济分量不仅听得出在演说的声调里，也看得到在人们买得起的东西上。"
 NFP66_HOME_POTENTIAL:0 "一副大的经济家底，给国家留下更多余地。总量背后是工厂、工作和货品，日常生活正由它们构成。政府作打算，也有了可以依靠的基础。只是从“有条件”走到“用好了条件”，中间常有不少公务要做。十强的名次不会替我们办。"
 NFP66_HOME_TITLE:0 "世界经济十强，有了我国一席"
 NFP66_OPEN_ALLY:0 "我国盟友[ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName]跻身世界经济十强。下次会面，伙伴有了值得夸耀的事。共同的约定有雄厚经济作伴，自然可喜。不过暂且不把人家的成绩记进自己的功劳簿：交情归交情，报表各有一本。"
 NFP66_OPEN_ALLY_BLOC:0 "盟友兼集团伙伴[ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName]进入世界经济十强。我们这个圈子又多了一个发表贺辞的理由。但愿贺辞之后，还容得下些有益的实事。一个集团的好处，毕竟不只在于名单看起来多么体面。"
 NFP66_OPEN_BLOC:0 "集团伙伴[ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName]进入世界经济十强。对于同圈的国家，这是项显眼的变化。它的名次不会自动给我国国库添钱，却很值得我们看看，与我国有共同约定的这个国家如今是怎样经营经济的。"
 NFP66_OPEN_NEIGHBOR:0 "邻邦[ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName]进入世界经济十强。界碑那头又添了一桩引以为傲的成绩。邻居时常有办法让我们回头看看自家的事，有时靠响亮的声明，这一次靠的是在经济简报中占下的位置。"
 NFP66_OPEN_OTHER:0 "[ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName]已进入世界经济十强。名单上添了新成员，我们也多了个理由仔细看看国外的变化。一国经济有多重，单凭一声响亮的宣告通常说不明白；把各国放在一起比较，总算给这番讨论添了些实据。"
 NFP66_OPEN_OVERLORD:0 "宗主国[ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName]进入了世界经济十强。这个国家的经济实力，我们本就值得了解，用不着等它的首都来信提醒。如今，国际报表又给了它一个新名次。对我们这个依附于它的国家而言，这一笔颇有分量。"
 NFP66_OPEN_RIVAL:0 "对手[ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName]进入世界经济十强。如此消息，一时恐怕写不出热情的贺辞。不过少一封贺信也不会改变结果。在忙着解释人家的成绩无足轻重以前，不妨先读读它究竟办成了什么。"
 NFP66_OPEN_SUBJECT:0 "属国[ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName]传来跻身世界经济十强的消息。如今值得多留心它国内的事务。习惯了“从属”一词，有时容易忘记它的经济究竟有多大。看来国际报表倒还记得。"
 NFP67_AWAY_FACT:0 "入围前三以前，该国排第[ScriptContainer.GetVariableValue('nfp20_before')|0]，如今已居第[ScriptContainer.GetVariableValue('nfp20_after')|0]。连续两份月报都将它列入世界最大的生产国之中。"
 NFP67_AWAY_FIRST:0 "以眼下的产量衡量，该国已经高居世界榜首。这回不只是名列前茅：这张表上，往上已经找不到别家。"
 NFP67_AWAY_TITLE:0 "全球三大生产国有了新成员"
 NFP67_AWAY_TOP:0 "世界第一虽然尚未拿下，它却已在最大的生产国中占了一席。只因人家还没登顶，就把成绩撇在一边，未免是种奇怪的自我宽慰。"
 NFP67_END_COLD_PARTNER:0 "两国之间的意见确实不少，可再多的意见也不能让人家的产量少掉一分。不妨比比各自办成了什么，总比又花一番工夫证明这个难相处的伙伴绝不可能有值得关注的成果来得有用。"
 NFP67_END_FRIEND:0 "值得向伙伴道一声贺。但愿礼数尽过，两边还能坐下来谈些互惠互利的正事。毕竟，两国的交情同两家企业的买卖，并非时时能画等号，然而这份成绩仍有其看头。"
 NFP67_END_NEUTRAL:0 "变化已记录，自家的成绩也作了比较。接下来如何，很值得留意。我国自己在这个行业也跻身主要生产国，别人的一条好消息，正好给我们一个细看自己的理由。"
 NFP67_END_OVERLORD:0 "宗主国的生产成绩不会自动变成我们的，不过两国的本领倒值得比一比。希望我们了解自己在这一行的份量，是从实际产量上看出来的，不是只从宗属关系里推出来的。"
 NFP67_END_RIVAL:0 "他国的成就，无须我们立刻认输，却给了我国一个检视本行业的好理由。但愿下一次的回应，不只本报读者能看见，编制生产统计的人也看得见。"
 NFP67_END_SUBJECT:0 "看属国也该看它自己的经济。这个名次值得留意，不必凡事都先问我国国库能分几成。若两国关系正趋于紧张，就更不该把它的本领当作无足轻重的细节。"
 NFP67_END_THREAT:0 "这个国家有多大能耐，我国尤其得留心。只看一种商品的产量，当然猜不出它要如何使用、意欲何为。但一个有意向我国施压的国家，生产上具备多少实力，仍不能掉以轻心。"
 NFP67_EQUAL:0 "我国的产量大致相当。这回谈的并非遥不可及、只供叹息的榜首，双方成绩颇为接近，后续也就更值得看。报纸上的冠军今天便能宣布，生产上的冠军，终归得靠劳动赢来。"
 NFP67_HOME_END:0 "末了想说些什么？我们已进世界前三。希望接下来不只想着在这桩成绩旁边盖上一枚好看的印章。胜利，续写起来总比回忆起来痛快。\n\n第二或第三已经是成就。要说这就是停步的理由，恐怕不怎么样。"
 NFP67_HOME_FACT:0 "入围前三以前，我国排第[ScriptContainer.GetVariableValue('nfp20_before')|0]，如今已居第[ScriptContainer.GetVariableValue('nfp20_after')|0]。连续两份月报都把我国列为主要生产国。看来不是下次统计便得收回贺词的那种喜讯。不过眼下的位置，仍须下功夫守住。"
 NFP67_HOME_FIRST_END:0 "末了想说些什么？头名值得祝贺，但贺过以后，生产仍要照常。桂冠可以点缀庆典，却代替不了原料和运转良好的设备。\n\n榜首我们已经登上。但愿再说“守得住”时，不只是在庆功的演说里。"
 NFP67_HOME_FIRST_INTRO:0 "我国已成为“[Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]”的世界最大生产国。按眼下的产量，这份榜上没人排在我国之上。这样的数字，自然让国人引以为傲。只是道贺的时候，也别忘了那行数字是靠谁一天一天干出来的。"
 NFP67_HOME_FIRST_TITLE:0 "头名归我国"
 NFP67_HOME_INTRO:0 "我国已经跻身“[Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]”的世界三大生产国。读到一条国内经济新闻，旁边没有跟着“又短缺了”几个字，颇叫人高兴。这回理由不同：按产量，我国已位居世界前列。值得自豪，且看看这成绩背后是什么。"
 NFP67_HOME_LIMIT:0 "产量大，还回答不了经济上的每一个问题。制成的货物卖得是否划算，国内是否够用，劳动所得是否宽裕，都属同一故事的另外几面。前三的排名并没替我们一并查过。但成绩仍是成绩：我国在生产国间已有一项说得响的骄傲。"
 NFP67_HOME_TITLE:0 "世界三强，有我国生产一席"
 NFP67_HOME_WORK:0 "榜上一个名次，背后是真正的生产。货物不会从一份写得漂亮的报表里自己冒出来。工人操作、消耗原料、解决每天碰到的麻烦，企业由此才有出产。国际简报记下的是总成绩。别忘了它由许多个工作日积成，其中大多数，等不到一场专为它而作的庆功演说。"
 NFP67_LESS:0 "我国产量约低[ScriptContainer.GetVariableValue('nfp67_output_abs')|0]%。论实际生产数量，对方目前领先。这不是在比较利润或工人的生活，却是一段看得明白、值得努力缩小的差距。我国能怎样回应，想来颇有看头——只盼不是一篇长文，专门解释为什么两国压根不该相比。"
 NFP67_MORE:0 "我国产量约高[ScriptContainer.GetVariableValue('nfp67_output_abs')|0]%。可喜，这一点我们没有异议。不过别国跻身前三，更像是留心行业的理由，倒不是让自己得意地扶扶桂冠的时机。优势靠工作来保持，总比反复提醒别人我们有优势有用。"
 NFP67_OPEN_ALLY:0 "盟友[ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName]跻身“[Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]”的世界三大生产国。伙伴的确有值得夸耀的成绩。这一行也关乎我国：我们自己就是全球五大生产国之一。因此这份贺意，多少带着一点同行的关心……和羡慕。"
 NFP67_OPEN_ALLY_BLOC:0 "盟友兼集团伙伴[ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName]跻身“[Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]”的世界三大生产国。共同的圈子又添了一项生产成绩。同一集团不会让外厂变成国厂，但正因如此，更值得把两国生产的实绩摆在一起看看。"
 NFP67_OPEN_BLOC:0 "集团伙伴[ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName]跻身“[Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]”的世界三大生产国。在这个行业，我国也占有显眼的位置。两边谈起此事，应当有比彼此祝愿共同繁荣更实在的话题。"
 NFP67_OPEN_NEIGHBOR:0 "邻国[ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName]跻身“[Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]”的世界三大生产国。国境那头又多了一项经济上的骄傲。我国自己正是这种货品的全球五大生产国之一，两边已有具体的成绩可比，不必比赛谁的贺声更响。"
 NFP67_OPEN_OTHER:0 "[ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName]跻身“[Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]”的世界三大生产国。这并非外国经济中与我国无关的一处小节。我国自己就在这种商品的五大生产国之列，因此行业里的变化值得仔细留意。"
 NFP67_OPEN_OVERLORD:0 "宗主国[ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName]跻身“[Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]”的世界三大生产国。我国也是这种货品的重要产地，因此要留心这条消息，理由并不只在两国的地位关系。如今，倒有一个实实在在的由头来比较两边的成绩了。"
 NFP67_OPEN_RIVAL:0 "我国的对手[ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName]跻身“[Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]”的世界三大生产国。在这一行，我们有自己的利益，也有自己的生产。用一句例行的“不过如此”打发，未免太省事。且先看看对方做到了什么，也看看我们在同一张表上的光景。"
 NFP67_OPEN_SUBJECT:0 "属国[ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName]跻身“[Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]”的世界三大生产国。常看见“从属”那行字，容易忽视这个国家本身的能耐。生产报表如今提醒人们记起它，恰好还是在一个我国经济也十分看重的行业里。"
 NFP67_UNKNOWN:0 "两国的产量眼下还不能可靠相比。排名已知，相差多少本报不愿编造。要谈自家能做什么，得有自家的报表；光凭别人取得成绩给我们留下的印象，并不足数。"
 NFP68_AWAY_CONTEXT_DOWN:0 "余地缩小了，可还不能把这个国家从打算中勾去。国际地位不能替代关于经济、军队和条约的消息。一顶简短的头衔若能把这些说尽，当然省事。偏偏这种省事常会变成错误，尤其是当我们还拿它来制订自己的计划时。"
 NFP68_AWAY_CONTEXT_RECOG:0 "该国如今有了更有利的发展条件。它能否赶上过去那些俯视它的国家，尚未可知。但习惯了的那句“它不够格”，已经不能充当解释了。往后得看它办了些什么。说起来，从前也就该先看这一点。"
 NFP68_AWAY_CONTEXT_UP:0 "该国推行自身政策的余地增加了。我国作打算时，值得把这一点记在心上。新地位本身既不许诺有利的协议，也不预告令人不快的冲突。只是再照旧衡量这位对手，眼光恐怕已落在它实际的能力之后。"
 NFP68_AWAY_FACT_DOWN:0 "先前该国的地位为“[Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]”，如今为“[Localize(ScriptContainer.MakeScope.Var('nfp20_extra_detail').GetFlagName)]”。位次下降，外交上能施展的余地也跟着收窄。这不是说国库已经破产，或军队已经无能为力，单凭地位的变化还不能如此推论。但也不能再把它过去的分量当作恒久不变的数目。"
 NFP68_AWAY_FACT_GP_DOWN:0 "该国以前是“列强”，如今为“[Localize(ScriptContainer.MakeScope.Var('nfp20_extra_detail').GetFlagName)]”，已退出最上层的圈子。以往的建树没有从此抹去，国家本身也没有消失。不过，若照什么都没发生的样子来估计它在国际上的余地，未免有些奇怪。"
 NFP68_AWAY_FACT_GP_UP:0 "该国先前为“[Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]”，如今跻身“列强”，进入外交活动余地最广的国家之列。现在就说世界政局已归它掌握，是一份过于慷慨的贺礼。若佯称只有名称变了，则是给自己的安心送了一份同样慷慨的礼物。"
 NFP68_AWAY_FACT_RECOG:0 "该国先前的地位为“[Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]”，如今为“[Localize(ScriptContainer.MakeScope.Var('nfp20_extra_detail').GetFlagName)]”，已获得国际承认。变化不只在头衔上：旧有地位使它在多项事务上承受较不利的条件，现在有一道障碍已经越过。接下来能否善用这一变化，则是下一段故事。"
 NFP68_AWAY_FACT_UP:0 "该国先前为“[Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]”，如今为“[Localize(ScriptContainer.MakeScope.Var('nfp20_extra_detail').GetFlagName)]”。地位上升，外交上能施展的余地也多了。并非从此首都提出的每件事都能得到赞成，不过它用影响力支持自身计划的凭据，确实比从前多了些。"
 NFP68_AWAY_TITLE_DOWN:0 "昨日之名犹在，今日分量已轻"
 NFP68_AWAY_TITLE_RECOG:0 "获承认国家的名单添了一员"
 NFP68_AWAY_TITLE_UP:0 "列国之间，座次更挤了"
 NFP68_END_COLD_DOWN:0 "以两国的交情，为对方的难处而称快并不太难；难的是高兴以后还能明白共同的事该怎么办。只要双方仍有约在身，伙伴能做些什么的变化就也牵涉我们的打算。最好省下那些连自家头一笔利害账都经不起的欢呼。"
 NFP68_END_COLD_UP:0 "共有的约定并未消除彼此的意见。不过，这个难相处的伙伴新添的余地也没有因此消失。与其寻找人家的成功根本不值得关注的理由，倒不如仔细看看它到底多了什么本领。尤其是往后终究还得同它谈事情。"
 NFP68_END_FRIEND_DOWN:0 "对共同的圈子来说，消息不算令人高兴。但同盟也不是只为一道列举成就才结下的。此时值得弄清伙伴的能力如何改变，共同的计划还可以作何期待。旧头衔的分量少了，但愿两国相知能多一些。"
 NFP68_END_FRIEND_UP:0 "可以向伙伴道贺。但愿寒暄之后，还能谈些有益双方的实事。它新添的能力不会自动归入我国，可寻找共同利益的机会，值得的恐怕不止是一封写得漂亮的贺信。"
 NFP68_END_NEUTRAL_DOWN:0 "世界简报变了模样，我国值得留心。未作细察，我们不急着把变化说成对方的失误。只因旧看法用得熟，就紧抱它不放，也没有多少用处。地图会老，可不只在国界移动的时候。"
 NFP68_END_NEUTRAL_UP:0 "变化已经记下，再往后就看实事。新地位令这个国家有更多凭据依靠本身的能力，我国也有理由拿过去的印象核对眼下的处境。国际新闻若能帮自己及时改正算盘，那就办成了一件好事。"
 NFP68_END_OVERLORD_DOWN:0 "宗主国的新地位值得关心，却不宜匆忙许下什么诺言。头衔一变，从属关系并不随之消失。在欢呼面前所有的门都开了以前，最好先看看哪几道门原是锁住的，如今锁上又起了什么变化。"
 NFP68_END_OVERLORD_UP:0 "宗主国的成就不会自然而然算作我国的。了解我们所依附的国家有多少能力，当然必要；但愿在仰望它的上升时，还有地方安放我国自己的打算。他国再响亮的名字，也不是我国现成的未来。"
 NFP68_END_REBELLIOUS:0 "同属国之间，原本就有许多有关自主的疑问。新地位既不解释它的愿望，也不预定愿望的结果。讨论它的前途时，却对它能力的变化视而不见，未免是种过分省事的习惯。尤其省的是我们的事。"
 NFP68_END_RIVAL_DOWN:0 "我国自然会有人乐于读到对手失意的消息。编辑部理解这份心情，但还不想就此断言对手从此无能为力。给自己找个安心的理由很便宜，后果有时倒昂贵得多。"
 NFP68_END_RIVAL_UP:0 "对我国来说，更值得仔细看一看自己的能力。对头取得了成绩，一句讥讽并不能销账。但愿我国的回答也能列在成就表上。斗嘴斗赢固然愉快，可惜各国不会为此给我国多配几分外交实力。"
 NFP68_END_SUBJECT_DOWN:0 "失去了先前地位，属国的难处仍非全然与我们无关。等着它按时尽义务，再容易不过。有时也值得看看，它如今要靠多少余地来履行这些义务。"
 NFP68_END_SUBJECT_UP:0 "从属关系背后，这个国家也有自己的发展。它新添的可能值得关注，不能只想着我国国库还能多收几分。但愿我们对属国事务的了解，至少也能跟得上我们对它的期待。"
 NFP68_END_THREAT:0 "对方针对我国的意图，实难说全无威胁。因此它能做什么起了变化，尤其值得留心。新地位不等于战争已经开始，失去旧地位也不保证太平。与其盼着一个等级名称已经写尽了答案，不如先弄明白自己在同谁打交道。"
 NFP68_HOME_CONTEXT_DOWN:0 "我国在外交上能施展的余地少了。还没少到凡是自己作主都无济于事的地步，却足以让我们重新看看自己的打算，把那句“人家总归得把我们算在内”先放一放。希望别人留心我国，是因我们有实在的东西可拿出来，而不只因我们提醒别人旧日地位时声音响亮。"
 NFP68_HOME_CONTEXT_GP_DOWN:0 "我国已退出列强行列，影响国际事务的余地随旧地位一并收窄。并非从明天起，邻国便都不再回复我国的信件。不过只凭旧日的国名就指望仍有旧日的分量，未免过于天真。尤其是对那些得要解释这份分量究竟去了哪里的人。"
 NFP68_HOME_CONTEXT_GP_UP:0 "我国进入列强之列，有了更多手段展开自己的外交，并用影响力支持本国的主张。话语背后有东西拿得出来，自然是好事。如今尤其值得问的是，我国会把这样宽广的余地用在哪些值得一办的事务上。衡量伟大，看成绩总比只看头衔上的字印得多大来得痛快。"
 NFP68_HOME_CONTEXT_RECOG:0 "过去的差别不只关乎自尊。未获得承认，使我国在借贷、吸收海外知识等事上承受较为不利的条件。现在条件有变，国库却未必就此松了口气，远方的每一项发现也未必就此更快传到我国。只是路上少了一道障碍。作为开端，这已经是一条相当不错的消息。"
 NFP68_HOME_CONTEXT_UP:0 "新地位给了我国更多外交余地。协议不会因此自己谈成，对坐的人也不会个个成为朋友。好处在于，我国自己作决定的空间更多了。但愿在贺辞把这些地方都占满以前，来得及用上一用。"
 NFP68_HOME_END_DOWN:0 "末了想说些什么？遇上不快的变化，还是正眼看它，比同报表赌气好些。原因仍须查明，寻找它们总比证明“反正我们也从未喜欢过旧地位”更有用。\n\n头衔更谦逊了。但愿我国的打算不必跟着谦逊。"
 NFP68_HOME_END_RECOG:0 "末了想说些什么？获得承认可以道贺。贺过以后，就该着手去办那些曾使我们值得争取更有利地位的事情。门打开，走进去才尤其叫人愉快。\n\n门既已为我们打开，若花整天议论门牌，恐怕有些奇怪。"
 NFP68_HOME_END_UP:0 "末了想说些什么？值得自豪。只愿新地位能帮我们解决旧问题，而非给每道旧问题提供一个方便的搪塞。\n\n国家的分量增加了。但愿不只在列举功绩时才能体会到它。"
 NFP68_HOME_FACT:0 "先前的地位是“[Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]”，如今是“[Localize(ScriptContainer.MakeScope.Var('nfp20_extra_detail').GetFlagName)]”。这便是本期简报所记的变化。它说的是我国在诸国中的位置。值得关注，不过单看这个位置，还说不出我们到底凭哪些成就——或遇上哪些麻烦——才来到这里。"
 NFP68_HOME_INTRO_DOWN:0 "我国在世界诸国中失去了先前的位置。这样的新闻，同欢庆的版画放在一起，未免不大协调。当然可以说别国的排行榜我们从来不在乎。只是从前名次略高的时候，我们提起它，总要愉快得明显一些。"
 NFP68_HOME_INTRO_NEUTRAL:0 "我国的国际地位改归另一类别。简报上这一变化值得仔细看过，先不忙着庆贺或遗憾。"
 NFP68_HOME_INTRO_RECOG:0 "我国如今列入获承认的国家之中。自然，也并不是直到今天，这里才有人生活、劳动和筹划前途。只是在国际事务里，存在有时还不够，最好别人也同意注意到你存在。如今旧标签已经过去，且看往后还会跟来什么变化。"
 NFP68_HOME_INTRO_UP:0 "我国在世界诸国之中又上了一级。可喜，尤其是对那些早就看够祖国名字总排在“以及其他”后面的人而言。民族自尊终于有了挺起胸膛的新理由，但愿同它一同舒展的，还有我们真正的能力。"
 NFP68_HOME_TITLE_DOWN:0 "头衔小了，事情呢？"
 NFP68_HOME_TITLE_RECOG:0 "总算有人注意到了"
 NFP68_HOME_TITLE_UP:0 "如今得把我国算在内了"
 NFP68_NEUTRAL_CONTEXT:0 "此事仍须另行查究。一个类别的名称背后可以有不同的情形，本报暂不替它们挑一个现成的解释。"
 NFP68_NEUTRAL_END:0 "继续看这个国家往后办了什么事吧。实事会比试图从一行字猜出全部故事，更能说明它有几分能力。"
 NFP68_NEUTRAL_FACT:0 "旧地位为“[Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]”，新地位为“[Localize(ScriptContainer.MakeScope.Var('nfp20_extra_detail').GetFlagName)]”。光是两个称谓有所不同，还不足以判断国力增强抑或减弱。"
 NFP68_NEUTRAL_TITLE:0 "国家地位有变"
 NFP68_OPEN_ALLY:0 "盟友[ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName]的国际地位改变了。对于我国，这不只等于别人的名册又调了一次位置。既有共同的约定，伙伴如今还有多大余地，值得仔细看一眼。"
 NFP68_OPEN_ALLY_BLOC:0 "盟友兼集团伙伴[ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName]有了新的国际地位。双方之间的联系，足以叫人别用一句“人家自己的事”将它打发过去。共同打算有多大的天地，也同伙伴能办多大的事有关。"
 NFP68_OPEN_BLOC:0 "集团伙伴[ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName]在各国间的位置改变了。伙伴的圈子仍是原来那个圈子，其中一员的分量却已不同。谈论共同计划时，这一区别值得记住。"
 NFP68_OPEN_NEIGHBOR:0 "邻国[ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName]的国际地位有所变化。边境的界碑没有因此挪动，但值得我们重新看看，界碑那头如今站着怎样的一位邻居。"
 NFP68_OPEN_OTHER:0 "[ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName]传来国际地位变化的消息。世界诸国之间的分量重新分配，这段故事已值得本报留出篇幅。至于新的头衔意味着什么，且看旧的和新的分别是什么。"
 NFP68_OPEN_OVERLORD:0 "宗主国[ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName]的国际地位变了。两国首都之间有约，并不让这条消息就此变成我国自己的事情。然而它也绝非一桩与我们无关的外国轶闻。"
 NFP68_OPEN_RIVAL:0 "对手[ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName]在世界诸国中换了位置。要高兴还是懊恼，最好先读明白具体变了什么。他国的头衔本身不会增加我国的能力，但这个必须与之较量的国家能做些什么，也许是日后相当重要的消息。"
 NFP68_OPEN_SUBJECT:0 "属国[ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName]传来国际地位变化的消息。常看“从属”那一行，很容易把这个国家本身的能力漏掉。如今新的国际地位给了我们一个理由，再仔细打量一次。"
 NFP69_FACT:0 "[ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName]施行了新法，以《[Localize(ScriptContainer.MakeScope.Var('nfp69_new').GetFlagName)]》取代《[Localize(ScriptContainer.MakeScope.Var('nfp69_old').GetFlagName)]》。\n\n[Localize(ScriptContainer.MakeScope.Var('nfp69_topic').GetFlagName)]"
 NFP69_HOME_OPEN:0 "我国的法律改了。对有些人来说，这是盼了许久的一天；对另一些人来说，原先的打算恐怕得重做。且看新法究竟写了些什么。"
 NFP69_LIMIT:0 "新规已立，往后要看的是它怎样改变国人的日子。法令颁下，只是故事的开头。等纸上的条文有了值得报道的后续，我们还会回来。"
 NFP69_OPEN_ALLY:0 "盟友[ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName]传来立法的消息。隔岸议论别人的规矩最是轻松，不妨先读读改了什么。读完之后，也许倒想问问自家的规矩。"
 NFP69_OPEN_ALLY_BLOC:0 "我国的盟友、同一集团的伙伴[ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName]传来立法的消息。隔岸议论别人的规矩最是轻松，不妨先读读改了什么。读完之后，也许倒想问问自家的规矩。"
 NFP69_OPEN_BLOC:0 "同属一个国家集团的[ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName]传来立法的消息。隔岸议论别人的规矩最是轻松，不妨先读读改了什么。读完之后，也许倒想问问自家的规矩。"
 NFP69_OPEN_NEIGHBOR:0 "邻邦[ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName]传来立法的消息。隔岸议论别人的规矩最是轻松，不妨先读读改了什么。读完之后，也许倒想问问自家的规矩。"
 NFP69_OPEN_OTHER:0 "海外传来消息，[ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName]颁布了新法。隔岸议论别人的规矩最是轻松，不妨先读读改了什么。读完之后，也许倒想问问自家的规矩。"
 NFP69_OPEN_OVERLORD:0 "宗主国[ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName]传来立法的消息。隔岸议论别人的规矩最是轻松，不妨先读读改了什么。读完之后，也许倒想问问自家的规矩。"
 NFP69_OPEN_RIVAL:0 "我国的对手[ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName]传来立法的消息。隔岸议论别人的规矩最是轻松，不妨先读读改了什么。读完之后，也许倒想问问自家的规矩。"
 NFP69_OPEN_SUBJECT:0 "我国的属国[ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName]传来立法的消息。隔岸议论别人的规矩最是轻松，不妨先读读改了什么。读完之后，也许倒想问问自家的规矩。"
 NFP69_POLICY_LAW_AFFIRMATIVE_ACTION:0 "昔日被排挤在社会边缘的人群，如今可获特别扶助。所谓平权，除了让众人从同一扇门进出，还得帮那些落在后面的人走到门前。"
 NFP69_POLICY_LAW_AGRARIANISM:0 "经济政策向农业和乡村倾斜。往后人们谈起国家的生计，先看的会是田垄村舍，然后才轮到厂门。"
 NFP69_POLICY_LAW_ANARCHY:0 "各地社区自行治理，推派临时代表赴共同议事会。地方之间遇事须协商，头顶没有一条常设的指挥链替大家拍板。"
 NFP69_POLICY_LAW_ANTI_STRIKE_LAWS:0 "工人可以结社，罢工和一部分集体诉求却仍受禁止。法律准许大家坐到一起，同时收走了他们手里的几样筹码。"
 NFP69_POLICY_LAW_APPOINTED_BUREAUCRATS:0 "官员由当局任命，领取俸禄为国办事。谁签发委任状，他们便须向谁交代任上的成绩。"
 NFP69_POLICY_LAW_AUTOCRACY:0 "国家大权集于元首一身，无须向世上其他权力负责。争论的题目还没定，谁说最后一句话倒已经定了。"
 NFP69_POLICY_LAW_BAKUFU:0 "将军以天皇之名执掌大权。尊位上写着谁的名字，与发号施令的是哪只手，在此各有答案。"
 NFP69_POLICY_LAW_CAESAROPAPISM:0 "东正教会仍掌管祭坛，但教会事务最终由国家说了算。信奉其他宗教的人在法律面前仍受区别对待。"
 NFP69_POLICY_LAW_CANTON_SYSTEM:0 "对外贸易只许经由一个沿海地区。海外货物要进来，都得走这道便于官府看守的窄门。"
 NFP69_POLICY_LAW_CENSORSHIP:0 "报刊须受审查，集会权也未获承认。文字从笔尖到读者手里，中间有人可以叫它停下。"
 NFP69_POLICY_LAW_CENSUS_VOTING:0 "受过教育且达到法定资格的男子方可投票。能否进得了选民的圈子，要看学识，也要看身份。"
 NFP69_POLICY_LAW_CHARITABLE_HEALTH_SYSTEM:0 "病患救济托付给慈善团体，宗教机构也在其列。能医治多少人，有赖于行善者手头的经费；捐款两字，在病床边最为实在。"
 NFP69_POLICY_LAW_CHIEFDOM:0 "政治秩序以血缘为纽带，由望族中的酋长或长老掌权。治理地方靠个人和氏族的威望，省去了层层官署。"
 NFP69_POLICY_LAW_CHIEFS_DISTRIBUTE_AID:0 "由酋长向困顿的族人、宗教机构和战士分配援助。谁能得到多少接济，要经手握公产的氏族首领裁定。"
 NFP69_POLICY_LAW_CHILD_LABOR_ALLOWED:0 "法律没有特别限定儿童能够从事哪些工作。童工仍是生产的一部分，某项差事是否太危险，也没有专为孩子设下的禁令。"
 NFP69_POLICY_LAW_CLOSED_BORDERS:0 "禁止迁入和迁出。想去国外另寻生计的人，和想在国内安家的人，都会被同一道国境拦下。"
 NFP69_POLICY_LAW_COLLECTIVIZED_AGRICULTURE:0 "农民组成集体，共同耕作土地。一块地怎么种、如何分工，由此成了全体的事。"
 NFP69_POLICY_LAW_COLONIAL_ADMINISTRATION:0 "当地政府代表宗主国治理领土，自身不享有主权。地方官能做多少事，取决于外部授予多少权力。"
 NFP69_POLICY_LAW_COLONIAL_EXPLOITATION:0 "殖民政策着眼于自然财富和廉价劳力。首先盘算的是从属地能带来多少收益，移民能分到哪块田倒在其次。"
 NFP69_POLICY_LAW_COLONIAL_RESETTLEMENT:0 "殖民地主要用来安置来自本国已整合地区的移民。土地问题有了一个海外的答案：新的领地，也是新农户的落脚处。"
 NFP69_POLICY_LAW_COLONIAL_SLAVERY:0 "殖民地准许蓄奴，被奴役者踏上宗主国本土便重获自由。同一个国家，脚下的土地不同，法律赋予的命运也不同。"
 NFP69_POLICY_LAW_COMBINATION_ACTS:0 "法律禁止工人的一切结社。并肩劳动可以，为共同利益而联合起来却不行。"
 NFP69_POLICY_LAW_COMMAND_ECONOMY:0 "大部分生产由政府直接指挥。企业向何处发展，要由汇集各方经济决策的国家机关定夺。"
 NFP69_POLICY_LAW_COMMERCIALIZED_AGRICULTURE:0 "农业按市场经营，所有权掌握在资本手中。于是田地也和别的企业一样，要放到投资与回报的账本上衡量。"
 NFP69_POLICY_LAW_COMMUNAL_ADMINISTRATION:0 "日常行政交给工人组织，中央则由这些组织选出的代表主事。"
 NFP69_POLICY_LAW_COMPULSORY_PRIMARY_SCHOOL:0 "儿童须接受若干年初等教育，在校期间不得务工。在孩子的日程里，法律给读书留出了过去可能要用来挣钱的时光。"
 NFP69_POLICY_LAW_CONSUMPTION_BASED_TAXATION:0 "国库从商品消费中征税，取代普遍的所得税或人头税。税的问题到了柜台跟前：要紧的是，买的这件货是否在征税之列。"
 NFP69_POLICY_LAW_COOPERATIVE_OWNERSHIP:0 "生产资料归工人共有，生产所得的盈余由众人分享。于是一家企业的工人，同时也站到了东家的位置。"
 NFP69_POLICY_LAW_CORPORATE_STATE:0 "国家组织各个获官方承认的团体合作，并主持社会阶层之间的协商。能代表谁开口，要先看所属的团体有没有得到承认。"
 NFP69_POLICY_LAW_CORPORATIZED_UNIONS:0 "工人组织由政府直接或间接控制，职责偏重阶层合作。劳工团体的活动，须纳入当局规定的利益协调办法。"
 NFP69_POLICY_LAW_COUNCIL_REPUBLIC:0 "工人选举代表组成地方委员会，国家治理以此为基础。工人如何组织起来，也决定了政权如何组织起来。"
 NFP69_POLICY_LAW_CROWNLAND_DIETS:0 "地方交由本地贵族组成的传统议会治理。地区事务由名门望族商议，席间都坐些什么人，议事以前就定好了。"
 NFP69_POLICY_LAW_CULTURAL_EXCLUSION:0 "与本国主体文化具有共同特征的人群获得接纳。与之缺少联系的文化仍受限制，国家依旧要人拿出相似之处作为凭证。"
 NFP69_POLICY_LAW_DEBT_SLAVERY:0 "无力清偿债务的人可以沦为债权人的财产。这笔债追讨到最后，连欠债人的自由也在账内。"
 NFP69_POLICY_LAW_DEDICATED_POLICE:0 "建立职业警察队伍，施行统一的训练要求。维持治安成了一门专职差事，有专门训练，也有长年的职责。"
 NFP69_POLICY_LAW_DIPLOMATIC_NAVY:0 "海军着重远洋巡航，在世界各地保持存在。外交由此多了一支能驶离母港、到远方展示国旗的力量。"
 NFP69_POLICY_LAW_ELDER_COUNCIL:0 "治理权交给年长且受人尊敬的成员。年岁与威望决定发言的分量，普遍选民名册在这里派不上用场。"
 NFP69_POLICY_LAW_ELECTED_BUREAUCRATS:0 "地方长官由当地居民选举。官位背后从此有了本地选民，首都的一纸任命已不是唯一的依据。"
 NFP69_POLICY_LAW_ETHNOSTATE:0 "公民身份限于指定族群，其他文化遭受歧视。一个人能否成为享有完整权利的国民，先得查问出身。"
 NFP69_POLICY_LAW_EXPANDED_LATIFUNDIAS:0 "大地产获得进一步扶持。贵族的政治分量和投资回报上升，农民的政治处境则转弱。有产之家的优势，既写在田契上，也写进了国事里。"
 NFP69_POLICY_LAW_EXTRACTION_ECONOMY:0 "殖民地生产以向宗主国输送利润为宗旨。产业该如何经营，首先要问获益的海外中心满意与否。"
 NFP69_POLICY_LAW_EXTRAORDINARY_COMMISSION:0 "国家设立群众性机构，专门镇压破坏活动与反革命。一旦有人被冠以这样的罪名，接手的便是这个机构。"
 NFP69_POLICY_LAW_FACTORY_COUNCILS:0 "工人委员会得以集体管理企业，工会的政治地位也随之增强。在工厂里谁说了算，这个问题交到了劳动者自己的手中。"
 NFP69_POLICY_LAW_FREEDOM_OF_CONSCIENCE:0 "保留国教，同时放宽个人选择信仰的自由。部分信仰依然受歧视；良心有了更多余地，当局仍保留着例外。"
 NFP69_POLICY_LAW_FREE_TRADE:0 "推行自由贸易，政府减少商品往来的障碍。商人面对的市场更宽了，外国同行也一样。"
 NFP69_POLICY_LAW_FRONTIER_COLONIZATION:0 "殖民的目光转向紧邻国土的边疆。拓展聚落意味着开垦近处的边地，远方并非随便哪块土地都在打算之中。"
 NFP69_POLICY_LAW_GRADUATED_TAXATION:0 "通过征收股息税，让收入丰厚的资本所有者承担较多税负。国库如今更留心东家从投资中分得的收益。"
 NFP69_POLICY_LAW_GUARANTEED_LIBERTIES:0 "内政机关须处理百姓的申诉，监听和拘捕都要有充分理由。官员走上门来，门里那个人的权利如今也能约束他的职权。"
 NFP69_POLICY_LAW_GUILD_SYSTEM:0 "从事若干手艺和行业，先须加入获承认的行会。想开业的人多了一道集体把守的门，光有志向可进不去。"
 NFP69_POLICY_LAW_HEREDITARY_BUREAUCRATS:0 "官职连同公务由父母传给子女。家传的物件清单里，如今添上了衙门的一张书桌。"
 NFP69_POLICY_LAW_HINDU_CASTE_CODIFIED:0 "种姓差别获得正式承认，并用来限制社会和经济机会。旧规矩进了法典，习俗也便有了条文的分量。"
 NFP69_POLICY_LAW_HINDU_CASTE_ENFORCED:0 "法律维持种姓等级，限制人们改变社会地位。出身不只记在族谱里，也划出了一个人可以走多远的界线。"
 NFP69_POLICY_LAW_HINDU_CASTE_NOT_ENFORCED:0 "种姓不再能依法阻挡一个人在社会和经济上的进取。家谱不再是官方发给机会的通行证，至于世人的习惯，未必一纸法令就能改掉。"
 NFP69_POLICY_LAW_HOMESTEADING:0 "农民取得并耕作自己的土地，也雇用工人帮忙。自己是田主，不等于田里的活就得自己一个人干。"
 NFP69_POLICY_LAW_INDUSTRY_BANNED:0 "国家舍弃重工业和自动化，转而倚重手工劳动。在这里，机器要证明的恐怕不是自己能省多少钱，而是自己有没有资格进门。"
 NFP69_POLICY_LAW_INTERMEDIATE_EDO_SYSTEM:0 "身份等级有所松动，富裕的町人和农民可以买得低级武士御家人的身份。特权阶层的门开了一线，入场却依然要花钱。"
 NFP69_POLICY_LAW_INTERNAL_COLONIZATION:0 "国家鼓励主体文化的居民迁往境内边疆。地图上的国界仍在原处，往后谁会成为邻居却是另一回事。"
 NFP69_POLICY_LAW_INTERVENTIONISM:0 "政府保留干预私人经济的权力，以纠正过度行为、维持稳定。企业家可以自由经营，当局也可以出手调整。"
 NFP69_POLICY_LAW_ISOLATIONISM:0 "经济转向自给，放弃通常的对外贸易。供给和需求要相遇，主要得在国境这一边。"
 NFP69_POLICY_LAW_JEUNE_ECOLE:0 "海军以装备精良的小型舰艇为主，用于对付更大的对手。打海战时，看的不光是船体有多大，还看小船上装了什么武器。"
 NFP69_POLICY_LAW_LABOUR_SUFFRAGE:0 "如今能不能投票，要看靠什么谋生。只靠劳动吃饭的人有选票，另有财产收益的人则没有。"
 NFP69_POLICY_LAW_LAISSEZ_FAIRE:0 "经济政策倚重私人竞争，并限制政府干预。手中的资本往哪里投，企业家有了更大的决定权。"
 NFP69_POLICY_LAW_LANDED_VOTING:0 "只有土地或资本的所有者能够投票。询问一位公民的见解以前，这套制度先打听他有什么家产。"
 NFP69_POLICY_LAW_LAND_BASED_TAXATION:0 "税制以土地税为本，主要由农民承担。国库收入与农业紧紧系在一起，也系在土地上劳作的人所负的义务上。"
 NFP69_POLICY_LAW_LATIFUNDIAS:0 "土地制度以大庄园为基础，雇用低薪季节工。工人能挣多少，既看地主，也看眼下是不是农忙时节。"
 NFP69_POLICY_LAW_LAX_EDO_SYSTEM:0 "平民得以担任往日武士独享的职位，承担往日武士独有的职责。出身与职业之间，法律总算给人多留了一点余地。"
 NFP69_POLICY_LAW_LEGACY_SLAVERY:0 "现有的奴隶制得以保留，继续扩张则属禁止。原已失去自由的人仍受束缚，法律只是关上了把这种处境推向更远的门。"
 NFP69_POLICY_LAW_LOCAL_POLICE:0 "地方警察负责维持治安。警务隶属地方当局，当地出了事，首先要在当地解决。"
 NFP69_POLICY_LAW_MANORIALISM:0 "土地归世袭地主所有，佃户可以自由迁移，却须为地主服无偿劳役。人可以走，留下耕种就得把替主人干活也算进田租里。"
 NFP69_POLICY_LAW_MASS_CONSCRIPTION:0 "职业军队可由大规模征召的步兵补充。兵册上添的名字，或许正是作坊与农家点人时少的那些名字。"
 NFP69_POLICY_LAW_MERCANTILISM:0 "商贸政策鼓励出口，追求在与他国竞争中维持资金净流入。对外贸易成为竞逐各国经济实力的手段。"
 NFP69_POLICY_LAW_MERCHANT_NAVY:0 "海上力量着眼于国际贸易和护送货物。这样的海军最关切的，是商船能否载着货物抵达目的地。"
 NFP69_POLICY_LAW_MIGRATION_CONTROLS:0 "只有文化和宗教均不受歧视的人才获准迁徙。能否跨过国境，要看国家怎样看待迁徙者本人的身份。"
 NFP69_POLICY_LAW_MILITARIZED_POLICE:0 "警察配备军用装备，并接受相应训练。维护国内秩序的力量，在手段上与军队又近了一步。"
 NFP69_POLICY_LAW_MILITARY_BUREAUCRATS:0 "如今穿着军装走进衙门也很合宜。高级官员大多出自军队。"
 NFP69_POLICY_LAW_MILLET_SYSTEM:0 "在逊尼派为国教的前提下，其他亚伯拉罕诸教社群缴纳宗教税，换取司法自治和免服兵役。社群得以照自己的规矩办事，国库则送来一张十分世俗的账单。"
 NFP69_POLICY_LAW_MONARCHY:0 "君主执掌行政权，王朝象征国家权力的延续。于是，王室一家人的历史，也成了整个国家制度的一部分。"
 NFP69_POLICY_LAW_MULTICULTURAL:0 "公民权利不因文化出身而有别，官方不再承认某种文化高人一等。要成为这个国家的一员，无须先交上一份合乎要求的文化家谱。"
 NFP69_POLICY_LAW_NATIONAL_GUARD:0 "由公民自愿组成独立队伍维持公共秩序。治安不只是专职人员的差事，也成了武装志愿者的责任。"
 NFP69_POLICY_LAW_NATIONAL_MILITIA:0 "常备军规模较小，国防还要依靠地方民兵。对这样的士兵来说，家既是拿起武器的缘由，也是恨不得早日回去的地方。"
 NFP69_POLICY_LAW_NATIONAL_SUPREMACY:0 "国家以主体民族身份为先，也接纳拥有共同传承，且语言或其他习俗相通的文化。其余文化仍面临法律障碍：得和多数人相像，方有资格入门。"
 NFP69_POLICY_LAW_NEO_ABSOLUTISM:0 "专制统治者依托现代化的中央集权行政机关治理国家。官署可以办得一新，最后拍板的权力依然只在一个人手中。"
 NFP69_POLICY_LAW_NO_COLONIAL_AFFAIRS:0 "国家放弃以正式殖民制度建立殖民地。想拓展殖民领地的人，从这部法律里再找不到相应的途径。"
 NFP69_POLICY_LAW_NO_HEALTH_SYSTEM:0 "国库不负担医疗卫生开支。生病的人要寻医，只得另找财源与机构帮忙。"
 NFP69_POLICY_LAW_NO_HOME_AFFAIRS:0 "平息骚乱和叛乱的职责仍由普通军队和警察承担。法律没有另设内政机构，当局倚靠手头已有的力量。"
 NFP69_POLICY_LAW_NO_MIGRATION_CONTROLS:0 "国家不对跨境迁移实行管制。要离乡或来此定居，无须再跨过一道专为移民设置的禁令。"
 NFP69_POLICY_LAW_NO_POLICE:0 "法律没有设置有组织的警察队伍。维持公共秩序这项职责，没有专门的常设机关承担。"
 NFP69_POLICY_LAW_NO_SCHOOLS:0 "教育由各家自行负责，没有统一的学校制度。孩子能否识字，很大程度上要看家里拿得出多少钱、找得到谁教。"
 NFP69_POLICY_LAW_NO_SOCIAL_SECURITY:0 "国家不承担供养无力自谋生计者的义务。陷入困顿的人，只得在国家救济体系以外寻找援手。"
 NFP69_POLICY_LAW_NO_WOMENS_RIGHTS:0 "妇女在法律上受男性监护，权利受到限制。个人即便已有打算，也须面对对监护人的法定依附。"
 NFP69_POLICY_LAW_NO_WORKERS_RIGHTS:0 "国家没有为劳动权利订立专门保障。雇工在工作中遇到争议时，就少了这一层法律保护。"
 NFP69_POLICY_LAW_OFFICIAL_NATIONALITY:0 "国家把俄罗斯臣民奉为模范，要求其他民族接受其文化。对家里说着另一种语言的人来说，这条规定可一点也不遥远。"
 NFP69_POLICY_LAW_OKHRANA:0 "秘密警察奉命监视流亡者、镇压革命活动。看来，跨过国界也未必能走出他们的视线。"
 NFP69_POLICY_LAW_OLD_AGE_PENSION:0 "老年劳动者可由公共资金供养。一个人能否歇下手里的活，不再全靠自己的积蓄和儿女的帮衬。"
 NFP69_POLICY_LAW_OLIGARCHY:0 "元首与少数有势力的人分享权力，后者不向选民负责。政坛上可以有几种声音，只是获邀开口的人始终不多。"
 NFP69_POLICY_LAW_ORGANIC_REGULATION:0 "国家依照列强强加的《组织条例》运作，元首由波雅尔贵族上层选出。规矩从境外来，选票落在本地极少数人手里。"
 NFP69_POLICY_LAW_OUTLAWED_DISSENT:0 "批评政府被定为违法，视同叛国。对于报人的一支笔，从提意见走到被控罪，这段路可真短。"
 NFP69_POLICY_LAW_PARLIAMENTARY_REPUBLIC:0 "立法机关的首脑担任国家元首。行政权的最高职位系于议会，议会中究竟有哪些代表便格外要紧。"
 NFP69_POLICY_LAW_PEASANT_LEVIES:0 "军队主要由征召而来、训练十分有限的农民步兵组成。拿惯了犁，并不就等于会列队打仗，两者之间到底还有一段路。"
 NFP69_POLICY_LAW_PEASANT_PROPRIETORSHIP:0 "大部分农田归独立耕作的农户所有，大型商业地产所占甚少。农业的中心，是那个在自家田里干活的人。"
 NFP69_POLICY_LAW_PEOPLE_OF_THE_BOOK:0 "伊斯兰法律赋予其他亚伯拉罕诸教的信徒司法自治和免服兵役的权利，并征收专门的宗教税。这一差别牵涉社区的法庭、军役，也牵涉钱袋。"
 NFP69_POLICY_LAW_PER_CAPITA_BASED_TAXATION:0 "所得税与人头税并征，后者对穷人尤其沉重。同样一笔人头税，落进富人和穷人的账本，分量可大不一样。"
 NFP69_POLICY_LAW_POOR_LAWS:0 "通过济贫院向穷人施以救济。领取供养的同时，受助者也得接受院方规定的居住和劳动安排。"
 NFP69_POLICY_LAW_PRESIDENTIAL_REPUBLIC:0 "共和国由总统担任元首，并设代议机关。总统成为国家要职，哪些人能参与选举，仍须看政治权利方面的法律。"
 NFP69_POLICY_LAW_PRIVATE_HEALTH_INSURANCE:0 "私立医院和个人医疗保险负责诊疗。能否得到有保障的医护，与是否买得起保险相连；健康也成了保费和契约上的事。"
 NFP69_POLICY_LAW_PRIVATE_SCHOOLS:0 "学校由私人开办。孩子能上哪所学校，取决于当地有什么学校，也取决于家里付得起哪一笔学费。"
 NFP69_POLICY_LAW_PROFESSIONAL_ARMY:0 "国家倚重由职业军人组成的常备军。打仗是他们的本业，训练是平日的职责，不必等到行军前才匆匆补课。"
 NFP69_POLICY_LAW_PROFESSIONAL_NAVY:0 "国家维持一支强大的常备海军，借以威慑对手。军舰既是兵器，也是一种远远就能看见的论据。"
 NFP69_POLICY_LAW_PROPORTIONAL_TAXATION:0 "主要按收入征税，纳税者大致交出同一比例的所得。国库开始按收入衡量各人的负担，而非只数人头。"
 NFP69_POLICY_LAW_PROTECTED_SPEECH:0 "言论自由得到法律保护。公共争论有了更大的余地，报纸也更有理由期待，回应一个论点的是另一个论点。"
 NFP69_POLICY_LAW_PROTECTIONISM:0 "国家以贸易限制保护本国产业免受外部竞争。本地厂商与海外同行之间，从此多了一道政策筑起的屏障。"
 NFP69_POLICY_LAW_PUBLIC_HEALTH_INSURANCE:0 "国家出资办理医疗保险，让公民能够平等就医。诊疗费用有了共同的财政来源，不必全记在病人的私人账上。"
 NFP69_POLICY_LAW_PUBLIC_SCHOOLS:0 "国家负责开办面向公众的学校，并制定统一的教育规则。让孩子有学可上，成了公共责任，不再单看家里的条件。"
 NFP69_POLICY_LAW_RACIAL_SEGREGATION:0 "公民权与共同的族裔传承相联系，出身不同的文化群体受到歧视。法律依它所认定的血缘差异，在居民之间划下界线。"
 NFP69_POLICY_LAW_REGULATORY_BODIES:0 "设立机关约束雇主的行为。劳资纠纷从此有了一个去处，那里的职责是看规矩有没有守住，而不只看产量有没有达标。"
 NFP69_POLICY_LAW_RELIGIOUS_SCHOOLS:0 "学校教育交由宗教机构主持。孩子跟着老师识字，也会遇上这些老师看作教育一部分的信仰问题。"
 NFP69_POLICY_LAW_RESTRICTED_CHILD_LABOR:0 "禁止儿童在工厂做工。法律在孩子的年纪与工厂的岗位之间，划出了一条清楚的线。"
 NFP69_POLICY_LAW_REVOLUTIONARY_GUARD:0 "工人民兵将合编为一支军队。谁来指挥？由士兵自己选出军官。"
 NFP69_POLICY_LAW_RIGHT_OF_ASSEMBLY:0 "公民获得集会的权利。民意终于有个可以碰面的地方，人们能够聚在一起议事，也能一同提出要求。"
 NFP69_POLICY_LAW_RIGHT_TO_ASSOCIATE:0 "工人可成立和经营自己的团体，不受特别限制。既然利益是共同的，现在也能有共同的组织。"
 NFP69_POLICY_LAW_SAKOKU:0 "对外交往受到严格约束，贸易只许通过指定口岸。海上边境留下了少数几道门，开门另有规矩。"
 NFP69_POLICY_LAW_SECRET_POLICE:0 "设立专门机关监视异议人士、侦办政治案件。国家对私下谈话的兴趣，终于有了自己的衙门。"
 NFP69_POLICY_LAW_SERFDOM:0 "农民依附土地，必须为封建主人劳动。搬去别处、改换行当的自由，从一开始就受到这种身份的限制。"
 NFP69_POLICY_LAW_SHINSENGUMI:0 "精锐剑士受命保护官员、巡守京城。新秩序的模样一目了然：当权者的安危，交给了一支特别的武装队伍。"
 NFP69_POLICY_LAW_SINGLE_PARTY_STATE:0 "合法政治活动集中在一个政党手中。围绕权力可以怎样争论，范围事先就已定好：入场的党证只有一种。"
 NFP69_POLICY_LAW_SLAVERY_BANNED:0 "法律禁止将人据为财产。从此，一个人的自由不能合法地列在另一个人的财产清单上。"
 NFP69_POLICY_LAW_SLAVE_TRADE:0 "法律允许经由国际贸易购入奴隶。役使劳力的需求接上了海外市场，而买卖的对象，正是人本身。"
 NFP69_POLICY_LAW_SOCIAL_MONARCHY:0 "君主制保留为国家的象征，由政府在各行业团体之间居中协调。代表不同利益的人来到谈判桌边，王冠仍悬在桌上方。"
 NFP69_POLICY_LAW_STATE_ATHEISM:0 "国家施行反宗教政策，排除宗教对公共治理的影响，限制一切信仰。在当局眼里，持有信仰本身就成了可疑之事。"
 NFP69_POLICY_LAW_STATE_RELIGION:0 "教会取得国家机关的地位，少数宗教信徒的法律地位不平等。信仰既是良心的事，也成了人与当局之间的事。"
 NFP69_POLICY_LAW_STRICT_EDO_SYSTEM:0 "身份等级严定各阶层的职业、权利，连住宅规格也受限制。平民不能合法成为武士。一套连宅门开几道也要管的秩序，可谓周详。"
 NFP69_POLICY_LAW_SUBJECTHOOD:0 "居民首先是君主的臣民，各自的文化事务留给所属社群。效忠同一王冠，比塑造统一的民族身份更受重视。"
 NFP69_POLICY_LAW_TECHNOCRACY:0 "政务交给由专长和才干选出的非民选委员会。治理的凭据是本领，无须到票箱里寻找。"
 NFP69_POLICY_LAW_TENANT_FARMERS:0 "农人耕种世袭地主的土地，但有权离开，另寻职业。田归别人，自己却没有被拴在那块田上。"
 NFP69_POLICY_LAW_TERAKOYA:0 "平民在各地私立的寺子屋接受教育。这些依托寺院的乡校各自扎根地方，未结成全国统一的官学体系。"
 NFP69_POLICY_LAW_THEOCRACY:0 "教士以对经典的诠释治理国家。政权的依据来自信仰，讨论国家秩序时，宗教上的争论也就在近旁。"
 NFP69_POLICY_LAW_THIRD_SECTION:0 "帝国办公厅专设部门负责审查与侦缉，政治异见和宗教异端都归它管。对报人来说，这可算是本行的消息。"
 NFP69_POLICY_LAW_TOTAL_SEPARATION:0 "教会与政府分离，宗教归属不再构成歧视的依据。该信什么与享有什么公民地位，自此由法律分开处理。"
 NFP69_POLICY_LAW_TRADITIONALISM:0 "经济秩序以工业化以前的自给生产为本，政府很少干预。与工业经营相比，沿袭已久的生计方式仍居首位。"
 NFP69_POLICY_LAW_UNIVERSAL_SUFFRAGE:0 "所有成年男子享有同等投票权。财产多寡不再决定一张男性选票的分量，妇女的选举权则另有法律规定。"
 NFP69_POLICY_LAW_WAGE_SUBSIDIES:0 "由相应机构设定和维持最低工资，将社会保障与收入底线联系起来。劳动报酬有了国家出面维持的下限。"
 NFP69_POLICY_LAW_WARRIOR_CASTE:0 "携带武器和从军的资格属于专门的武士阶层，平民无从加入。这里先问出身，然后才问准头。"
 NFP69_POLICY_LAW_WEALTH_VOTING:0 "选举权取决于财富，富人的选票分量更重。政治影响力就这样有了一个可以用钱量出的尺度。"
 NFP69_POLICY_LAW_WOMENS_SUFFRAGE:0 "妇女获得投票权。参与政治不再只是一个性别的特权，参加选举的其他条件仍由选举法决定。"
 NFP69_POLICY_LAW_WOMEN_IN_THE_FIELDS:0 "家务与农业劳动主要由妇女承担，更多男子得以从征或参与劫掠。这样的军制能否维持，靠的是出征之后留下经营家业的人。"
 NFP69_POLICY_LAW_WOMEN_IN_THE_WORKPLACE:0 "法律准许更多妇女参加有报酬的工作。挣得收入、靠自己谋生这件事，由此走出了家门。"
 NFP69_POLICY_LAW_WOMEN_OWN_PROPERTY:0 "妇女有权持有财产，也包括继承而来的财产。产业可以写在她自己的名下，不必只归那个决定她处境的男子所有。"
 NFP69_POLICY_LAW_WORKER_PROTECTIONS:0 "劳动者获得广泛且有法律保障的权利。雇用条件须遵守雇主对工人负有的义务，这一笔并非双方签个私约就能勾销。"
 NFP72_BASE_1:0 "这里知道的是各集团对新规本身的总体看法。通过之前它们各自站在哪里，并未收入本报的资料。因此只能谈法律与它们的主张有多合拍，不能断言是谁支持了这次替换。事后替人补填选票，恐怕不是报人该做的事。"
 NFP72_BASE_2:0 "这里知道的是各集团对新规本身的总体看法。通过之前它们各自站在哪里，并未收入本报的资料。因此只能谈法律与它们的主张有多合拍，不能断言是谁支持了这次替换。事后替人补填选票，恐怕不是报人该做的事。"
 NFP72_GOV_1:0 "新法在政府内部也有一段故事。[Localize(ScriptContainer.MakeScope.Var('nfp50_law_gov_summary').GetFlagName)]决定已经作出，却不等于所有执政者的想法都由此一致。[SelectLocalization(GreaterThan_CFixedPoint(ScriptContainer.GetVariableValue('nfp50_law_gov_yes_present'), '(CFixedPoint)0'), 'NFP50_LAW_GOV_YES_NAME', 'NFP50_LAW_NO_MOVE')][SelectLocalization(GreaterThan_CFixedPoint(ScriptContainer.GetVariableValue('nfp50_law_gov_no_present'), '(CFixedPoint)0'), 'NFP50_LAW_GOV_NO_NAME', 'NFP50_LAW_NO_MOVE')]"
 NFP72_GOV_2:0 "新法在政府内部也有一段故事。[Localize(ScriptContainer.MakeScope.Var('nfp50_law_gov_summary').GetFlagName)]决定已经作出，却不等于所有执政者的想法都由此一致。[SelectLocalization(GreaterThan_CFixedPoint(ScriptContainer.GetVariableValue('nfp50_law_gov_yes_present'), '(CFixedPoint)0'), 'NFP50_LAW_GOV_YES_NAME', 'NFP50_LAW_NO_MOVE')][SelectLocalization(GreaterThan_CFixedPoint(ScriptContainer.GetVariableValue('nfp50_law_gov_no_present'), '(CFixedPoint)0'), 'NFP50_LAW_GOV_NO_NAME', 'NFP50_LAW_NO_MOVE')]"
 NFP72_IG_1:0 "在按成员人数计算最大的有组织集团中，情况如下。[Localize(ScriptContainer.MakeScope.Var('nfp50_law_ig_1_type').GetFlagName)]持[Localize(ScriptContainer.MakeScope.Var('nfp50_law_ig_1_stance').GetFlagName)]立场。[SelectLocalization(GreaterThan_CFixedPoint(ScriptContainer.GetVariableValue('nfp50_law_ig_count'), '(CFixedPoint)1'), 'NFP72_SECOND', 'NFP50_LAW_NO_MOVE')]这些集团的声音，能让我们了解有组织的政治生活；至于组织以外的人，这幅图景还照不到。"
 NFP72_IG_2:0 "在按成员人数计算最大的有组织集团中，情况如下。[Localize(ScriptContainer.MakeScope.Var('nfp50_law_ig_1_type').GetFlagName)]持[Localize(ScriptContainer.MakeScope.Var('nfp50_law_ig_1_stance').GetFlagName)]立场。[SelectLocalization(GreaterThan_CFixedPoint(ScriptContainer.GetVariableValue('nfp50_law_ig_count'), '(CFixedPoint)1'), 'NFP72_SECOND', 'NFP50_LAW_NO_MOVE')]这些集团的声音，能让我们了解有组织的政治生活；至于组织以外的人，这幅图景还照不到。"
 NFP72_MOVES_1:0 "社会运动也和这件事有关。[SelectLocalization(GreaterThan_CFixedPoint(ScriptContainer.GetVariableValue('nfp50_law_move_yes_present'), '(CFixedPoint)0'), 'NFP72_MOVE_YES', 'NFP50_LAW_NO_MOVE')][SelectLocalization(GreaterThan_CFixedPoint(ScriptContainer.GetVariableValue('nfp50_law_move_no_present'), '(CFixedPoint)0'), 'NFP72_MOVE_NO', 'NFP50_LAW_NO_MOVE')]主张相合，还不能说明是谁促成了改变。不过，有些人对新规感到亲近，有些人为何难以认同，多少能从中看出缘由。"
 NFP72_MOVES_2:0 "社会运动也和这件事有关。[SelectLocalization(GreaterThan_CFixedPoint(ScriptContainer.GetVariableValue('nfp50_law_move_yes_present'), '(CFixedPoint)0'), 'NFP72_MOVE_YES', 'NFP50_LAW_NO_MOVE')][SelectLocalization(GreaterThan_CFixedPoint(ScriptContainer.GetVariableValue('nfp50_law_move_no_present'), '(CFixedPoint)0'), 'NFP72_MOVE_NO', 'NFP50_LAW_NO_MOVE')]主张相合，还不能说明是谁促成了改变。不过，有些人对新规感到亲近，有些人为何难以认同，多少能从中看出缘由。"
 NFP72_MOVE_NO:0 "在反对新规的运动中，“[Localize(ScriptContainer.MakeScope.Var('nfp50_law_move_no_type').GetFlagName)]”类运动所获支持最多。"
 NFP72_MOVE_YES:0 "在拥护新规的运动中，“[Localize(ScriptContainer.MakeScope.Var('nfp50_law_move_yes_type').GetFlagName)]”类运动所获支持最多。"
 NFP72_NO_GROUPS_1:0 "关于这次变化，本报没有拿到有组织集团的立场记录。简报的沉默可不能算作全体赞成；它说的只是我们知道多少。"
 NFP72_NO_GROUPS_2:0 "关于这次变化，本报没有拿到有组织集团的立场记录。简报的沉默可不能算作全体赞成；它说的只是我们知道多少。"
 NFP72_RELATIVE_1:0 "这些立场记录于法律通过前夕，比较的是新规与旧规。对于某些集团，这是盼望已久的更替；对于另一些，恰恰相反。看法令下面的签名，通常看不出这种分别。"
 NFP72_RELATIVE_2:0 "这些立场记录于法律通过前夕，比较的是新规与旧规。对于某些集团，这是盼望已久的更替；对于另一些，恰恰相反。看法令下面的签名，通常看不出这种分别。"
 NFP72_SECOND:0 "[Localize(ScriptContainer.MakeScope.Var('nfp50_law_ig_2_type').GetFlagName)] — [Localize(ScriptContainer.MakeScope.Var('nfp50_law_ig_2_stance').GetFlagName)]."
 NFP89_DELIVERY:0 "[SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp89_regular'), '(CFixedPoint)1'), 'NFP89_MONTHLY_ON', 'NFP89_MONTHLY_OFF')]\n\n[SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp89_urgent'), '(CFixedPoint)1'), 'NFP89_URGENT_ON', 'NFP89_URGENT_OFF')]"
 NFP89_MONTHLY_OFF:0 "您目前没有订阅月刊。这份导读会保存在档案里；待您重新订阅，报纸就会照常送来。"
 NFP89_MONTHLY_ON:0 "您已订阅月刊。我们会逐期回访事态的变化，毕竟一段长故事，凭一条令人忧心的快讯往往说不清。"
 NFP89_TECH_END_COLD:0 "两国有约在身，交情却称不上温暖。对方的成果并未因此失色。消息中哪些机会有用，哪些只是拌嘴的由头，总可以分开看。"
 NFP89_TECH_END_FRIEND:0 "这条消息值得道声恭喜。但愿客套过后，还能坐下来谈些对双方都有用的事。两相友好，偶尔也该给这份善意找件事做。"
 NFP89_TECH_END_NEUTRAL:0 "别国确已学会这门本领，能用它做些什么，还待往后见分晓。与其忙着解释别人的本领为何不值得看，不如先看清自家能做哪些事。"
 NFP89_TECH_END_THREAT:0 "眼下两国的关系，很难让人毫无顾虑地道贺。对方多了什么本领，值得我们记住。不过，若把每一项发明都说成备战，倒是省去了观察的工夫，只可惜也丢了准头。"
 NFP89_TECH_OPEN_ALLY:0 "盟友[ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName]已经掌握了“[Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]”。盟友来信，总算有一封不必读得提心吊胆。接下来，我们倒想看看他们怎样用上这项发现。"
 NFP89_TECH_OPEN_BLOC:0 "集团伙伴[ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName]已经掌握了“[Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]”。伙伴圈里多了一种本领，是件好事。只是同属一个集团，那门本领可不会自己走进我国的作坊。"
 NFP89_TECH_OPEN_NEIGHBOR:0 "邻邦[ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName]已经掌握了“[Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]”。对一条科学新闻而言，路程未必是最要紧的。可对于就在边境这一头的企业，隔壁有了新本领，总值得多看一眼。"
 NFP89_TECH_OPEN_OTHER:0 "[ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName]传来科技消息：当地已经掌握了“[Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]”。研究目录里添了一行字，且看这行字背后打开了哪些门。"
 NFP89_TECH_OPEN_OVERLORD:0 "宗主国[ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName]已经掌握了“[Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]”。两国的关系并没有因此变成一座任人借阅的科学图书馆。不过，上头的伙伴有了什么新本领，我们值得知道。"
 NFP89_TECH_OPEN_RIVAL:0 "我国的对手[ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName]已经掌握了“[Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]”。把消息往下一页一翻，并不难。难的是对方的本领不会因为我们装作没看见，就少掉一点。"
 NFP89_TECH_OPEN_SUBJECT:0 "我国的属国[ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName]已经掌握了“[Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]”。常看见名册上“从属”两个字，容易忽略它自己已有多少本领。这次正有理由细看。"
 NFP89_URGENT_OFF:0 "您目前不接收号外。如想另收有关战争和世界大事的专刊，可在订阅处开启。"
 NFP89_URGENT_ON:0 "您也选择了接收号外。开战、停战或世界大事一有确讯，不必等到下期月刊才能读到。"
 NFPTEST_PARTY_1:0 "测试工党 — [ScriptContainer.GetVariableValue('nfp43_now_1')|2]."
 NFPTEST_PARTY_2:0 "测试地主党 — [ScriptContainer.GetVariableValue('nfp43_now_2')|2]."
 NFPTEST_PARTY_3:0 "测试自由党 — [ScriptContainer.GetVariableValue('nfp43_now_3')|2]."
