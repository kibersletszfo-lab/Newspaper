 NFP52_SPRING_2_TITLE:0 "欧洲走入动荡时节"
 NFP52_SUEZ_1_BODY:0 "苏伊士运河竣工。通常是人照着地图走路，这次却得让地图照着人的设想重画：地中海和红海之间，出现了一条通道。这样的航运新闻，要塞进边栏的小字里实在勉强。\n\n运河工程已经完工。新航道连通两海，原有航线的里程得重新审视。往日受地形所限必须绕行之处，如今有了通道。人们时常说要拉近世界，这一回，好在身后有实实在在的工程作证。\n\n至此，如何把握新机会的功课才刚开始。谁能从中受益更多，须看贸易和政治的后续。不过，眼前的成果已足以让人停笔一赞。漫长的筹划过后，世上添的总算不只是又一张计划书。\n\n本报以收到消息的月份记事。传递路上若有耽搁，事情本身可能发生得更早。"
