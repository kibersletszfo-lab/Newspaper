 NFP52_SUEZ_2_TITLE:0 "苏伊士运河建成"
 NFP52_TAIPING_1_BODY:0 "中国出现了太平天国。对抗有了自己的政治中心。如今要问的已不止是旧秩序的反对者有何不满，还要看他们准备拿出什么样的政权来代替它。\n\n太平天国作为独立的政治力量，已经出现。中国的危局有了新的形式，用“又一次动乱”来敷衍已不足以说明它。反对原有政权的争执，如今产生了一个自称有权立足的新政权。\n\n宏大的主张背后，依然是百姓自己的日子。对抗将走向何处、谁能掌稳权柄，都还没有定论。本报将继续追踪，也别忘了：对当地居民而言，地图的变化远远不只是海外新闻栏里添了一行字。\n\n本报以收到消息的月份记事。传递路上若有耽搁，事情本身可能发生得更早。"
