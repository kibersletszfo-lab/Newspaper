 NFP43_ELECTION_BASELINE:0 "对照本次竞选在第[ScriptContainer.GetVariableValue('nfp43_previous_issue')|0]期的报道。可比较的政党按“上期 → 本期（变动量）”排列。“—”表示先前没有可供比较的数值。"
 NFP43_ELECTION_BODY_1:0 "竞选还在进行，各党的处境随时可能变化。本报记下了截稿时的竞选势头。\n\n[Localize(ScriptContainer.MakeScope.Var('nfp43_row_1').GetFlagName)]\n[Localize(ScriptContainer.MakeScope.Var('nfp43_row_2').GetFlagName)]\n[Localize(ScriptContainer.MakeScope.Var('nfp43_row_3').GetFlagName)]\n[Localize(ScriptContainer.MakeScope.Var('nfp43_row_4').GetFlagName)]\n[Localize(ScriptContainer.MakeScope.Var('nfp43_row_5').GetFlagName)]\n[Localize(ScriptContainer.MakeScope.Var('nfp43_row_6').GetFlagName)]\n\n[SelectLocalization(GreaterThan_CFixedPoint(ScriptContainer.GetVariableValue('nfp43_previous_issue'), '(CFixedPoint)0'), 'NFP43_ELECTION_BASELINE', 'NFP43_ELECTION_FIRST')]\n\n这是途中抄下的一笔，并非选举结果，也并非预期得票率。势头会给竞选带来影响，却不能单凭这一项判断谁会当选。表中列出截稿时势头最强的至多六个政党，数值为游戏采用的原始系数。"
 NFP43_ELECTION_BODY_2:0 "选战仍未见分晓。今天比较的是各党的势头，尚未开箱的选票先不忙着数。\n\n[Localize(ScriptContainer.MakeScope.Var('nfp43_row_1').GetFlagName)]\n[Localize(ScriptContainer.MakeScope.Var('nfp43_row_2').GetFlagName)]\n[Localize(ScriptContainer.MakeScope.Var('nfp43_row_3').GetFlagName)]\n[Localize(ScriptContainer.MakeScope.Var('nfp43_row_4').GetFlagName)]\n[Localize(ScriptContainer.MakeScope.Var('nfp43_row_5').GetFlagName)]\n[Localize(ScriptContainer.MakeScope.Var('nfp43_row_6').GetFlagName)]\n\n[SelectLocalization(GreaterThan_CFixedPoint(ScriptContainer.GetVariableValue('nfp43_previous_issue'), '(CFixedPoint)0'), 'NFP43_ELECTION_BASELINE', 'NFP43_ELECTION_FIRST')]\n\n这是途中抄下的一笔，并非选举结果，也并非预期得票率。势头会给竞选带来影响，却不能单凭这一项判断谁会当选。表中列出截稿时势头最强的至多六个政党，数值为游戏采用的原始系数。"
 NFP43_ELECTION_FIRST:0 "本报首次刊出本次竞选的记录。政党缺少可比较的前期数值时，以“—”标示。"
 NFP43_ELECTION_LEAD_1:0 "国内竞选仍在进行。各党忙着造势，本报则留心谁的势头正旺、谁又落后了一步。至于胜选演说，就先不刊了：还少个小小的细节，叫作投票结果。"
 NFP43_ELECTION_LEAD_2:0 "国内竞选仍在进行。各党忙着造势，本报则留心谁的势头正旺、谁又落后了一步。至于胜选演说，就先不刊了：还少个小小的细节，叫作投票结果。"
 NFP43_ELECTION_METRICS:0 "付印时记录，类型24，社会版。只与本次竞选最近一次见报的数据比较；选题落选不会更新比较基准。新一轮竞选或新出现的政党均不虚设前期资料。数值和顺序按付印时保留，党名可能随游戏进程改变。"
