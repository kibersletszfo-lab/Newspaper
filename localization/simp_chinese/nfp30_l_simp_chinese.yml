 NFP52_ROM_2_TITLE:0 "罗马尼亚统一告成"
 NFP52_SPRING_1_BODY:0 "欧洲迎来了民族之春。各地的政治动荡汇成了一场已难再看作某一国内政的风潮。有关权力与社会前途的问题，早已走出了平静讨论的范围。\n\n革命的浪潮已成为欧洲的现实。各国情势不同，事态也各有发展。若还相信别国的骚动终究只归别国，那么现如今，只拿距国境的里程作凭据，恐怕已经不够。\n\n名字里带着春天，结局却仍须世人亲历。盼望变革的人并不都认同一种变法。本报将分别追踪各地的消息。时代可以有一个共同的名字，人们的命运却不会因此处处相同。\n\n本报以收到消息的月份记事。传递路上若有耽搁，事情本身可能发生得更早。"
