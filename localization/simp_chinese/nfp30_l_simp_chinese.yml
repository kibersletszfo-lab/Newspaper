 NFP63_NEIGHBOR:0 "这件事发生在我国邻邦。地图上画出一条国界很容易，别国变动的后果却不总是肯照那条线停下。"
 NFP63_NEUTRAL:0 "看待这个国家，倒不必急着捧，也不必急着讥讽。外国的变化之所以值得一读，首先在于它究竟改变了什么。"
 NFP63_OVERLORD:0 "消息来自我国所依附的国家。若只将它当作海外奇闻读一遍，未免太过放心。"
