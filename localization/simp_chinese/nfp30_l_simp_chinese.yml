 NFP50_SUPPLY_BOTH_1:0 "政府和军事建筑都使用这种商品。它的用途让供货问题格外要紧，至于具体哪些机关和部队蒙受了多大损失，本组资料没有说明。"
 NFP50_SUPPLY_BOTH_2:0 "国家机关和军事设施均需使用这种货物。因此供货值得仔细查看；货品有此用途，与已经证实短缺造成某种后果，仍应分开看。"
 NFP50_SUPPLY_CRITICAL_1:0 "需要格外警惕：事发时，市场短缺的严重程度连同我国国内的本地短缺情况，已经符合商品短缺红色警报的条件。这些信号尚不能说明有多少居民或企业受到影响。"
 NFP50_SUPPLY_CRITICAL_2:0 "这一次尤其值得留意。事发之时，我国已满足商品短缺红色警报的条件。个别企业的实际损失大小，却不能从这些条件中直接推得。"
 NFP50_SUPPLY_END_1:0 "本报希望供货问题早日得到调查。是扩大生产、增辟贸易，还是另选办法，要先看当地情形。报上的简讯还开不出一张现成的经济药方。"
 NFP50_SUPPLY_END_2:0 "此事值得尽早留心。先查清供货在哪一环受限，报表的数字能帮人把问题提出来，却不能替代实地查验生产和买卖。"
 NFP50_SUPPLY_FOLLOW_1:0 "先前在本报出现的供货问题有了后续。新近的记录，使我们值得再谈它一谈。"
 NFP50_SUPPLY_FOLLOW_2:0 "这个问题此前已经见报。如今有了新资料，宜再回头看一眼。"
 NFP50_SUPPLY_GAP_1:0 "商品为[ScriptContainer.MakeScope.Var('nfp46_good').GetGoods.GetNameNoIcon]。出售订单不足求购订单的80%。求购订单由[ScriptContainer.GetVariableValue('nfp46_buy_before')|1]变为[ScriptContainer.GetVariableValue('nfp46_buy_after')|1]，出售订单由[ScriptContainer.GetVariableValue('nfp46_sell_before')|1]变为[ScriptContainer.GetVariableValue('nfp46_sell_after')|1]。每组的前项为本轮最早留存的观察，后项为事发时的记录。订单有明显缺口，本身并不足以证明生产受到惩罚。"
 NFP50_SUPPLY_GAP_2:0 "本次货品为“[ScriptContainer.MakeScope.Var('nfp46_good').GetGoods.GetNameNoIcon]”，需求明显领先供给，出售订单不足求购的80%。求购订单由[ScriptContainer.GetVariableValue('nfp46_buy_before')|1]变为[ScriptContainer.GetVariableValue('nfp46_buy_after')|1]，出售订单由[ScriptContainer.GetVariableValue('nfp46_sell_before')|1]变为[ScriptContainer.GetVariableValue('nfp46_sell_after')|1]。每组的前项为本轮最早留存的观察，后项为事发时的记录。这里比较的是市场订单，并非居民实际少买的货物数量。"
 NFP50_SUPPLY_GOVERNMENT_1:0 "政府建筑要用到这种货品，是其用途的重要一面。至于具体哪些机关受到影响、损失几何，这份简报没有说明。"
 NFP50_SUPPLY_GOVERNMENT_2:0 "这种货品的一部分需求来自政府建筑。存在这种用途，并不能证明某一家机构已经确实蒙受损失。"
 NFP50_SUPPLY_INTRO_1:0 "我国市场值得留心：供货方面出现了一桩持续的问题。"
 NFP50_SUPPLY_INTRO_2:0 "供货又让人翻开了市场简报。本报记下此次出现问题的货品。"
 NFP50_SUPPLY_LONG_1:0 "连续[ScriptContainer.GetVariableValue('nfp50_supply_observations')|0]次月度观察均出现了供货问题。每次留有明显的订单缺口或直接短缺标记，不能据此断言在两次记录之间，每天生产都受到惩罚。"
 NFP50_SUPPLY_LONG_2:0 "这已是连续第[ScriptContainer.GetVariableValue('nfp50_supply_observations')|0]个月观察到供货问题。各月可能表现为订单缺口，也可能带有直接的市场短缺标记；这样的月度纪事，复原不了每一天的情形。"
 NFP50_SUPPLY_MILITARY_1:0 "这种商品用于军事建筑的供应，因此值得注意。不过，这不能证明我国军队已经遭受损失或受到惩罚。"
 NFP50_SUPPLY_MILITARY_2:0 "军事设施需要这种货物。本报关心供货对军务的重要性，不为军队编造尚未得到证实的后果。"
 NFP50_SUPPLY_NATIVE_1:0 "商品为[ScriptContainer.MakeScope.Var('nfp46_good').GetGoods.GetNameNoIcon]。事发时，市场显示直接的短缺标记。求购订单由[ScriptContainer.GetVariableValue('nfp46_buy_before')|1]变为[ScriptContainer.GetVariableValue('nfp46_buy_after')|1]，出售订单由[ScriptContainer.GetVariableValue('nfp46_sell_before')|1]变为[ScriptContainer.GetVariableValue('nfp46_sell_after')|1]。每组的前项为本轮最早留存的观察，后项为事发时的记录。"
 NFP50_SUPPLY_NATIVE_2:0 "本期关注的商品为[ScriptContainer.MakeScope.Var('nfp46_good').GetGoods.GetNameNoIcon]。最新记录带有直接的市场短缺标记。求购订单由[ScriptContainer.GetVariableValue('nfp46_buy_before')|1]变为[ScriptContainer.GetVariableValue('nfp46_buy_after')|1]，出售订单由[ScriptContainer.GetVariableValue('nfp46_sell_before')|1]变为[ScriptContainer.GetVariableValue('nfp46_sell_after')|1]。每组的前项为本轮最早留存的观察，后项为事发时的记录。"
 NFP50_SUPPLY_NO_IMPORT_1:0 "眼下没有这种货品运入市场的记录。市场产量为[ScriptContainer.GetVariableValue('nfp50_supply_production')|1]，消费为[ScriptContainer.GetVariableValue('nfp50_supply_consumption')|1]，出口为[ScriptContainer.GetVariableValue('nfp50_supply_exports')|1]。眼前没有进口，并不证明没有贸易的机会。"
 NFP50_SUPPLY_NO_IMPORT_2:0 "事发时的市场记录中没有进口这种货物。市场产量为[ScriptContainer.GetVariableValue('nfp50_supply_production')|1]，消费为[ScriptContainer.GetVariableValue('nfp50_supply_consumption')|1]，出口为[ScriptContainer.GetVariableValue('nfp50_supply_exports')|1]。未来能否取得外来供应，本次简报未作评估。"
 NFP50_SUPPLY_PRICE_1:0 "事发时价格为£[ScriptContainer.GetVariableValue('nfp50_supply_price')|1]，相对基础价格偏差为[ScriptContainer.GetVariableValue('nfp50_supply_premium')|1]%（负值表示较便宜）。仅靠价格本身不能判断每位买主是否能获得这种货品。"
 NFP50_SUPPLY_PRICE_2:0 "还可以从价钱看这件货物。事发时价格为£[ScriptContainer.GetVariableValue('nfp50_supply_price')|1]，相对基础价格偏差为[ScriptContainer.GetVariableValue('nfp50_supply_premium')|1]%（负值表示较便宜）。仅靠价格本身不能判断每位买主是否能获得这种货品。"
 NFP50_SUPPLY_RECOVERY_1:0 "商品为[ScriptContainer.MakeScope.Var('nfp46_good').GetGoods.GetNameNoIcon]。连续[ScriptContainer.GetVariableValue('nfp50_supply_good_observations')|0]次月度观察，既无直接短缺标记，供给也至少占到需求的80%。求购订单为[ScriptContainer.GetVariableValue('nfp46_buy_before')|1] → [ScriptContainer.GetVariableValue('nfp46_buy_after')|1]，出售订单为[ScriptContainer.GetVariableValue('nfp46_sell_before')|1] → [ScriptContainer.GetVariableValue('nfp46_sell_after')|1]。左项为本轮首份留存记录，右项为事发时的观察。低于本报门槛的缺口可能仍然存在。"
 NFP50_SUPPLY_RECOVERY_2:0 "“[ScriptContainer.MakeScope.Var('nfp46_good').GetGoods.GetNameNoIcon]”已连续[ScriptContainer.GetVariableValue('nfp50_supply_good_observations')|0]个月未见原有的短缺标记，供给缺口也未超过需求的20%。求购订单为[ScriptContainer.GetVariableValue('nfp46_buy_before')|1] → [ScriptContainer.GetVariableValue('nfp46_buy_after')|1]，出售订单为[ScriptContainer.GetVariableValue('nfp46_sell_before')|1] → [ScriptContainer.GetVariableValue('nfp46_sell_after')|1]。左项为本轮首份留存记录，右项为事发时的观察。这些条件仍不能保证供求完全平衡。"
 NFP50_SUPPLY_RECOVERY_END_1:0 "我们记录好转，也不宣布可以从此结案。市场指标向好，还不能证明每家企业都已恢复，或每项价格都已回落。"
 NFP50_SUPPLY_RECOVERY_END_2:0 "先前的报道有了一个颇好的转折。后续各期仍将留心市场，别急着把眼下的改善读成永久安稳的保证。"
 NFP50_SUPPLY_RECOVERY_INTRO_1:0 "先前见报的供货问题，传来了令人宽心的消息。"
 NFP50_SUPPLY_RECOVERY_INTRO_2:0 "再访此前的短缺：新近几份行情显示，事情已有好转。"
 NFP50_SUPPLY_TRADE_1:0 "市场产量为[ScriptContainer.GetVariableValue('nfp50_supply_production')|1]，消费为[ScriptContainer.GetVariableValue('nfp50_supply_consumption')|1]，进口为[ScriptContainer.GetVariableValue('nfp50_supply_imports')|1]，出口为[ScriptContainer.GetVariableValue('nfp50_supply_exports')|1]。进口占产量与进口合计的[ScriptContainer.GetVariableValue('nfp50_supply_import_fraction')|1]%。该占比衡量市场供给，并非本国居民所买货品中进口品的比例。贸易量本身也不能说明短缺的原因。"
 NFP50_SUPPLY_TRADE_2:0 "求购与出售订单的背后，还有生产和贸易。市场产量为[ScriptContainer.GetVariableValue('nfp50_supply_production')|1]，消费为[ScriptContainer.GetVariableValue('nfp50_supply_consumption')|1]，进口为[ScriptContainer.GetVariableValue('nfp50_supply_imports')|1]，出口为[ScriptContainer.GetVariableValue('nfp50_supply_exports')|1]。进口占产量与进口合计的[ScriptContainer.GetVariableValue('nfp50_supply_import_fraction')|1]%。该占比衡量市场供给，并非本国居民所买货品中进口品的比例。贸易量本身也不能说明短缺的原因。"
