 NFP30_RUBRIC_4:0 "时事"
 NFP30_RUBRIC_EMPTY:0 "本期所选版面无稿：可能是当时未启用此版，也可能是没有合适的消息。"
 NFP30_RUBRIC_JUMP:0 "前往本期该版面的第一篇报道。"
 NFP30_SHORTAGE_HOME_1_BODY:0 "商品为[Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]。连续两次月度观察中，我国市场均出现短缺。\n\n这件货品的供给和市场消费均值得细查。本次说的是货品不足；价格是否高昂，则应另看。"
 NFP30_SHORTAGE_HOME_1_LEAD:0 "市场短缺已经不止一次见报的程度，本报将它列入今日应当关心的经济事务。"
 NFP30_SHORTAGE_HOME_1_TITLE:0 "市场缺了一样需要的货"
 NFP30_SHORTAGE_HOME_2_BODY:0 "商品为[Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]。连续两次月度观察中，我国市场均出现短缺。\n\n市场短缺已经确认，具体原因尚未查明。凭现有资料还不能指认应由谁负责，也不能保证建起哪一座设施便会见效。"
 NFP30_SHORTAGE_HOME_2_LEAD:0 "连续两个月，我国市场都报出一种重要商品短缺。即使别的行业取得好成绩，这道题也还在。"
 NFP30_SHORTAGE_HOME_2_TITLE:0 "短缺值得留意"
 NFP30_SHORTAGE_METRICS:0 "商品为[Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]。连续两次月度观察中，我国市场均出现短缺。"
 NFP30_SHORTAGE_RECOVERY_HOME_1_BODY:0 "商品为[Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]。自本报预警以来，连续两份月度记录都未发现先前的短缺。\n\n本报记录的是旧有短缺标记消失。这还不是低价的许诺，价钱贵和东西少，是两个不同的问题。"
 NFP30_SHORTAGE_RECOVERY_HOME_1_LEAD:0 "本报先前报道的一种缺货商品传来好消息。"
 NFP30_SHORTAGE_RECOVERY_HOME_1_TITLE:0 "先前的短缺已有所缓解"
 NFP30_SHORTAGE_RECOVERY_HOME_2_BODY:0 "商品为[Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]。自本报预警以来，连续两份月度记录都未发现先前的短缺。\n\n较好的局面已持续两个月。本报仍会分别看待“有没有货”和“买不买得起”，这条消息尚不能确认后者。"
 NFP30_SHORTAGE_RECOVERY_HOME_2_LEAD:0 "先前的预警终于等来了好一些的下文：我国市场上的短缺已不再出现。"
 NFP30_SHORTAGE_RECOVERY_HOME_2_TITLE:0 "短缺的故事迎来转机"
 NFP30_SHORTAGE_RECOVERY_METRICS:0 "商品为[Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]。自本报预警以来，连续两份月度记录都未发现先前的短缺。"
 NFP30_TECH_AWAY_1_BODY:0 "该国如今已掌握“[Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]”。\n\n对方的本领多了一门，我国也值得看看自家已有些什么、用得如何。贺信可以等到邮班再发，有用的念头不妨当场留下。"
 NFP30_TECH_AWAY_1_LEAD:0 "海外掌握了一项新技术。我们读着熟悉的月报时，别国又添了一种可能。值得看看是哪一种。"
 NFP30_TECH_AWAY_1_TITLE:0 "海外又多了一门本领"
 NFP30_TECH_AWAY_2_BODY:0 "该国如今已掌握“[Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]”。\n\n对方的本领多了一门，我国也值得看看自家已有些什么、用得如何。贺信可以等到邮班再发，有用的念头不妨当场留下。"
 NFP30_TECH_AWAY_2_LEAD:0 "海外掌握了一项新技术。我们读着熟悉的月报时，别国又添了一种可能。值得看看是哪一种。"
 NFP30_TECH_AWAY_2_TITLE:0 "海外又多了一门本领"
 NFP30_TECH_HOME_1_BODY:0 "该国如今已掌握“[Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]”。\n\n知道的更多了，还得用得明白。我国既有理由自豪，也有正事可做。本报希望下次能写写靠新知识办成了什么。列一张机会清单固然愉快，真用上它，总归更好。"
