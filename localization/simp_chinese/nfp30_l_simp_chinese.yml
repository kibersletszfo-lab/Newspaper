 NFP52_ITA_2_TITLE:0 "共同的名字有了共同的政权"
 NFP52_JAP_1_BODY:0 "日本天皇重掌政权。说的是恢复旧制，翻开的却是新的一页。朝廷与幕府之间旧有的力量对比已经改变。这个对许多读者而言颇为遥远的国家，如今值得大家看看它将往哪里走。\n\n日本已实现王政复古。国内政治中心的位置变了，日本人往后将怎样生活，也就成了新的问题。隆重的宣告已成往事，日常生活如何改变，还看接下来的一道道决定。\n\n天皇复掌权柄，并不意味着未来的种种变化都已经实现。日本怎样运用新秩序，仍要由日本自己来回答。还是等事情做出来再下判断吧；隆重的名号，从来不缺美好的许诺。\n\n本报以收到消息的月份记事。传递路上若有耽搁，事情本身可能发生得更早。"
