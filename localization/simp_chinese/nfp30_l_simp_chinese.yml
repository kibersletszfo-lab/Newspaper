 NFP50_LAW_OWN_COMPARE_1:0 "若我国作出类似改变，又会获得怎样的对待？在执政各集团中，拥护者占政治力量的[ScriptContainer.GetVariableValue('nfp50_law_own_yes')|1]%，反对者占[ScriptContainer.GetVariableValue('nfp50_law_own_no')|1]%。这是把本国对该法的态度作一次比较，并非哪一方已对外国决定发表了声明。外国已经改变制度，我国眼下有的是想想自家这套规矩究竟好在哪里的机会。"
 NFP50_LAW_OWN_COMPARE_2:0 "若我国作出类似改变，又会获得怎样的对待？在执政各集团中，拥护者占政治力量的[ScriptContainer.GetVariableValue('nfp50_law_own_yes')|1]%，反对者占[ScriptContainer.GetVariableValue('nfp50_law_own_no')|1]%。这是把本国对该法的态度作一次比较，并非哪一方已对外国决定发表了声明。外国已经改变制度，我国眼下有的是想想自家这套规矩究竟好在哪里的机会。"
 NFP50_LAW_OWN_SAME_1:0 "同一项法律在我国也已施行。可以拿来比较的，便不只是承诺。别国怎样运用相似的规矩，值得看看。两部法律写着同样的字句，不等于国境两边的人就会过上同样的生活。"
 NFP50_LAW_OWN_SAME_2:0 "同一项法律在我国也已施行。可以拿来比较的，便不只是承诺。别国怎样运用相似的规矩，值得看看。两部法律写着同样的字句，不等于国境两边的人就会过上同样的生活。"
