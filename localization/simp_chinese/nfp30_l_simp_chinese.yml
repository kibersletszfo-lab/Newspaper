 NFP52_AUS_1_TITLE:0 "澳大利亚实现联合"
 NFP52_AUS_2_BODY:0 "澳大利亚各地已结成一个共同国家。远方大陆传来的这条新闻，值得占上头版。原本分立的政体有了共同的国家形式；那个人人熟悉的地名，如今也意味着许多要一起办的事。\n\n澳大利亚已经成立。澳洲各地的政治组织方式由此改变，独立与否则须另看；国际义务也有单独的依据。共同的国家如今已有了，它以后的地位，要看自身的抉择和与各国的关系。\n\n联合起来，各地便能在同一套制度下商量事情。商量得怎样，且看往后平日里的办事成效。大陆这样大，共同的烦恼总不会少。但愿共同的好处，也能分到一席之地。\n\n所署日期为编辑部收到确讯的月份。事件发生的确切日子须另考。"
 NFP52_AUS_2_CONTEXT:0 "联合起来，各地便能在同一套制度下商量事情。商量得怎样，且看往后平日里的办事成效。大陆这样大，共同的烦恼总不会少。但愿共同的好处，也能分到一席之地。"
