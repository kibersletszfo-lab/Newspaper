 NFP61_PORT_WORK:0 "这段时间，港口有工程完工。对先前连运力都捉襟见肘的地区而言，这项变化值得记上一笔。"
 NFP61_RAIL_PM:0 "铁路调整过运营方式。"
 NFP61_RAIL_STAFF:0 "本报追踪的铁路如今有更多岗位补上了人手。"
 NFP61_RAIL_WORK:0 "在这段时间，当地有铁路新建或扩建工程完工。看来当地谈论铁轨之余，确实也铺了些铁轨。"
 NFP61_REMAINING:0 "不过，另一个不便还在：当地同共同市场的联系仍不完整。设施能担起眼下的负荷，却不等于做买卖的路条条都已畅通。一个难题可以留在昨天，另一个可别被今天的贺声盖过去。"
 NFP61_STAFF_END:0 "建起来只算一半，还得有人来做事。"
 NFP61_STAFF_END_SELECT:0 "[SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp60_st_rail_staffup'), '(CFixedPoint)1'), 'NFP61_STAFF_END', 'NFP61_PORT_STAFF_END_SELECT')]"
 NFP61_TITLE:0 "原先挤得慌，如今松快了"
 NFP61_UNKNOWN:0 "我们看得出好转，却还不能凭现有资料解释成因。若能立刻找出过去该怪谁、眼下该谢谁，倒是很方便。可惜“方便”两字还算不得证据。"
 NFP61_URBAN_PM:0 "城市经济调整过经营方式。"
