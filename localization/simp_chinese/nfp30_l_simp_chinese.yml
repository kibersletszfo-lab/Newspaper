 NFP52_FLU_1_BODY:0 "大规模流感疫情初起的消息传来。这种新闻的读法，与外交捷报很不一样。人们关心的无非是最平常的愿望：但愿身边的人平安，明早醒来仍不必为他们忧心。\n\n名为西班牙流感的疫情已经开始。各国都值得留意疾病如何扩散，以及受影响地区的处境。世界新闻还不能说明疫情已到我国，但第一封来信来自远方，也不等于我们就有了平安的保证。\n\n眼下尤其需要可靠的消息。人一着急，最容易用传闻填补未知，可传闻并不能让病人多得到一点照料。有了确讯，本报还会接着报道。最盼望能早日写下的，是危险已经退去。\n\n本报以收到消息的月份记事。传递路上若有耽搁，事情本身可能发生得更早。"
