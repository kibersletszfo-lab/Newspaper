l_simp_chinese:
 NFP30_ACCESS_HOME_1_BODY:0 "地区为[SelectLocalization(And(ScriptContainer.MakeScope.Var('nfp20_problem_state').IsSet, ScriptContainer.MakeScope.Var('nfp20_problem_state').GetState.IsValid), 'NFP40_STATE_LINK', 'NFP40_REGION_FALLBACK')]。市场接入度连续两个月低于90%，最近为[Multiply_CFixedPoint(ScriptContainer.GetVariableValue('nfp20_after'), '(CFixedPoint)100')|1]%。\n\n现有资料还不能确定原因，要分别检查当地基础设施、海运联系及其他限制。现在就只怪铁路，恐怕太快了些。"
 NFP30_ACCESS_HOME_1_LEAD:0 "本国一处地区接入市场仍有困难。谈起经济成绩时，这份不便也值得同样的关注。"
 NFP30_ACCESS_HOME_1_TITLE:0 "自家的市场还是太远"
 NFP30_ACCESS_HOME_2_BODY:0 "地区为[SelectLocalization(And(ScriptContainer.MakeScope.Var('nfp20_problem_state').IsSet, ScriptContainer.MakeScope.Var('nfp20_problem_state').GetState.IsValid), 'NFP40_STATE_LINK', 'NFP40_REGION_FALLBACK')]。市场接入度连续两个月低于90%，最近为[Multiply_CFixedPoint(ScriptContainer.GetVariableValue('nfp20_after'), '(CFixedPoint)100')|1]%。\n\n这一指标能说明接入受限，却不能独自解释缘由。选择怎样应对以前，须先查清联系究竟在哪一段出了问题。"
 NFP30_ACCESS_HOME_2_LEAD:0 "市场接入连续第二个月偏低，本报有理由重新谈一谈这一地区与全国经济之间的联系。"
 NFP30_ACCESS_HOME_2_TITLE:0 "当地盼着一条通向市场的可靠道路"
 NFP30_ACCESS_METRICS:0 "地区为[SelectLocalization(And(ScriptContainer.MakeScope.Var('nfp20_problem_state').IsSet, ScriptContainer.MakeScope.Var('nfp20_problem_state').GetState.IsValid), 'NFP40_STATE_LINK', 'NFP40_REGION_FALLBACK')]。市场接入度连续两个月低于90%，最近为[Multiply_CFixedPoint(ScriptContainer.GetVariableValue('nfp20_after'), '(CFixedPoint)100')|1]%。"
 NFP30_ACCESS_RECOVERY_HOME_1_BODY:0 "地区为[SelectLocalization(And(ScriptContainer.MakeScope.Var('nfp20_problem_state').IsSet, ScriptContainer.MakeScope.Var('nfp20_problem_state').GetState.IsValid), 'NFP40_STATE_LINK', 'NFP40_REGION_FALLBACK')]。先前预警时，市场接入度为[Multiply_CFixedPoint(ScriptContainer.GetVariableValue('nfp20_before'), '(CFixedPoint)100')|1]%，最近为[Multiply_CFixedPoint(ScriptContainer.GetVariableValue('nfp20_after'), '(CFixedPoint)100')|1]%。连续两个月均不低于90%。\n\n本报欣见这种好转已维持两个月。至于当地所有难题是否已经解决、变化出自何种原因，还须有另外的依据。"
 NFP30_ACCESS_RECOVERY_HOME_1_LEAD:0 "本国一处地区先前同市场联系不畅，如今有了令人宽心的下文。"
 NFP30_ACCESS_RECOVERY_HOME_1_TITLE:0 "当地离共同市场又近了些"
 NFP30_ACCESS_RECOVERY_HOME_2_BODY:0 "地区为[SelectLocalization(And(ScriptContainer.MakeScope.Var('nfp20_problem_state').IsSet, ScriptContainer.MakeScope.Var('nfp20_problem_state').GetState.IsValid), 'NFP40_STATE_LINK', 'NFP40_REGION_FALLBACK')]。先前预警时，市场接入度为[Multiply_CFixedPoint(ScriptContainer.GetVariableValue('nfp20_before'), '(CFixedPoint)100')|1]%，最近为[Multiply_CFixedPoint(ScriptContainer.GetVariableValue('nfp20_after'), '(CFixedPoint)100')|1]%。连续两个月均不低于90%。\n\n连续两个月的改善，值得谨慎地高兴一下。变化的成因和个别企业的处境，还须分别查明。"
 NFP30_ACCESS_RECOVERY_HOME_2_LEAD:0 "先前令本报担心的问题传来好消息：当地的市场接入度提高了。"
 NFP30_ACCESS_RECOVERY_HOME_2_TITLE:0 "与市场的联系有了起色"
 NFP30_ACCESS_RECOVERY_METRICS:0 "地区为[SelectLocalization(And(ScriptContainer.MakeScope.Var('nfp20_problem_state').IsSet, ScriptContainer.MakeScope.Var('nfp20_problem_state').GetState.IsValid), 'NFP40_STATE_LINK', 'NFP40_REGION_FALLBACK')]。先前预警时，市场接入度为[Multiply_CFixedPoint(ScriptContainer.GetVariableValue('nfp20_before'), '(CFixedPoint)100')|1]%，最近为[Multiply_CFixedPoint(ScriptContainer.GetVariableValue('nfp20_after'), '(CFixedPoint)100')|1]%。连续两个月均不低于90%。"
 NFP30_ARTICLE_DETAILS:0 "[SelectLocalization(ScriptContainer.HasVariable('nfp63_schema'), 'NFP63_DETAILS', 'NFP50_EMPTY')]\n编辑部记录\n事实编号[ScriptContainer.GetVariableValue('nfp20_id')|0]，事件阶段[ScriptContainer.GetVariableValue('nfp20_episode')|0]。\n选稿依据为[Localize(ScriptContainer.MakeScope.Var('nfp20_reason').GetFlagName)]，优先级[ScriptContainer.GetVariableValue('nfp20_priority')|0]。\n[Localize(ScriptContainer.MakeScope.Var('nfp30_metrics').GetFlagName)]\n报道角度为[SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp30_domestic'), '(CFixedPoint)1'), 'NFP30_HOME', 'NFP30_AWAY')]，版本[ScriptContainer.GetVariableValue('nfp30_variant')|0]。\n国名按固定国家标识显示，历史动态国名未另行保存。\n[SelectLocalization(ScriptContainer.HasVariable('nfp63_schema'), 'NFP50_EMPTY', SelectLocalization(ScriptContainer.HasVariable('nfp31_reach'), 'NFP30_REACH_LINE', 'NFP30_REACH_OLD'))]"
 NFP30_ARTICLE_META:0 "[ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName] · [ScriptContainer.GetVariableValue('nfp20_year')|0]年[Localize(ScriptContainer.MakeScope.Var('nfp30_month').GetFlagName)] · [Localize(ScriptContainer.MakeScope.Var('nfp30_rubric').GetFlagName)]"
 NFP30_ARTICLE_TEXT:0 "[Localize(ScriptContainer.MakeScope.Var('nfp30_lead').GetFlagName)]\n\n[Localize(ScriptContainer.MakeScope.Var('nfp30_body').GetFlagName)]"
 NFP30_AWAY:0 "国外事件"
 NFP30_CONTENTS:0 "本期要闻"
 NFP30_COVER:0 "返回封面"
 NFP30_DETAILS:0 "详情"
 NFP30_DETAILS_CLOSE:0 "收起详情"
 NFP30_DIVERGENCE_HOME_1_BODY:0 "过去三个整月间，全年国内生产总值估计从[ScriptContainer.GetVariableValue('nfp20_before')|0]升至[ScriptContainer.GetVariableValue('nfp20_after')|0]，同期平均生活水平下降[ScriptContainer.GetVariableValue('nfp20_extra')|2]点。\n\n经济总量上升，家庭生活未必就宽裕。本报以百姓处境为国事；两项指标为何分道扬镳，值得另作探究。"
 NFP30_DIVERGENCE_HOME_1_LEAD:0 "经济增长值得自豪，生活水平的下滑也值得同样仔细地看待。"
 NFP30_DIVERGENCE_HOME_1_TITLE:0 "经济增长，日子反而紧了"
 NFP30_DIVERGENCE_HOME_2_BODY:0 "过去三个整月间，全年国内生产总值估计从[ScriptContainer.GetVariableValue('nfp20_before')|0]升至[ScriptContainer.GetVariableValue('nfp20_after')|0]，同期平均生活水平下降[ScriptContainer.GetVariableValue('nfp20_extra')|2]点。\n\n国家需要的是在日常生活中也感受得到的成就。这些数字本身不能说明生活为何转差，更不能指认应当归咎于谁。"
 NFP30_DIVERGENCE_HOME_2_LEAD:0 "经济壮大了，平均生活水平却往下走。这两面，都配得上头版的位置。"
 NFP30_DIVERGENCE_HOME_2_TITLE:0 "经济喜讯背后的一串忧心数字"
 NFP30_DIVERGENCE_METRICS:0 "过去三个整月间，全年国内生产总值估计从[ScriptContainer.GetVariableValue('nfp20_before')|0]升至[ScriptContainer.GetVariableValue('nfp20_after')|0]，同期平均生活水平下降[ScriptContainer.GetVariableValue('nfp20_extra')|2]点。"
 NFP30_EMPTY:0 "今天所选版面还没有新稿。等有了新消息，下期再为您送来。"
 NFP30_GDP_LEADER_AWAY_1_BODY:0 "该国先前位居十强之外的第[ScriptContainer.GetVariableValue('nfp20_before')|0]名，如今为第[ScriptContainer.GetVariableValue('nfp20_after')|0]名，已连续两个月留在十强之列。\n\n对本报读者来说，世界经济格局有了一处值得留意的变化。不过，这并非证明当地人生活富裕，或所有行业都利润丰厚。"
 NFP30_GDP_LEADER_AWAY_1_LEAD:0 "世界最大经济体的名单发生变化：一个外国经济体已站稳国内生产总值前十。"
 NFP30_GDP_LEADER_AWAY_1_TITLE:0 "世界经济十强添新成员"
 NFP30_GDP_LEADER_AWAY_2_BODY:0 "该国先前位居十强之外的第[ScriptContainer.GetVariableValue('nfp20_before')|0]名，如今为第[ScriptContainer.GetVariableValue('nfp20_after')|0]名，已连续两个月留在十强之列。\n\n排名采用全年国内生产总值估计。单凭这项记录，仍看不出它对我国贸易有何影响。"
 NFP30_GDP_LEADER_AWAY_2_LEAD:0 "刚跻身十强的新成员已连续第二个月守住了名次。"
 NFP30_GDP_LEADER_AWAY_2_TITLE:0 "一国外经济体在十强中站稳脚跟"
 NFP30_GDP_LEADER_HOME_1_BODY:0 "该国先前位居十强之外的第[ScriptContainer.GetVariableValue('nfp20_before')|0]名，如今为第[ScriptContainer.GetVariableValue('nfp20_after')|0]名，已连续两个月留在十强之列。\n\n这份成绩值得承认。按经济总量所得的名次，却不能量出居民的生活水平，也不能说明企业赚了多少钱。"
 NFP30_GDP_LEADER_HOME_1_LEAD:0 "以全年国内生产总值估计衡量，我国已经站稳世界十大经济体之列。"
 NFP30_GDP_LEADER_HOME_1_TITLE:0 "我国经济进入世界十强"
 NFP30_GDP_LEADER_HOME_2_BODY:0 "该国先前位居十强之外的第[ScriptContainer.GetVariableValue('nfp20_before')|0]名，如今为第[ScriptContainer.GetVariableValue('nfp20_after')|0]名，已连续两个月留在十强之列。\n\n本报欣见这份成绩，也会继续留意百姓是否过得宽裕。经济的大小，替不了后一笔账。"
 NFP30_GDP_LEADER_HOME_2_LEAD:0 "国内生产总值连续两个月居于前十，有理由说这项经济成就已有了些根基。"
 NFP30_GDP_LEADER_HOME_2_TITLE:0 "世界经济大国中有我国一席"
 NFP30_GDP_LEADER_METRICS:0 "该国先前位居十强之外的第[ScriptContainer.GetVariableValue('nfp20_before')|0]名，如今为第[ScriptContainer.GetVariableValue('nfp20_after')|0]名，已连续两个月留在十强之列。"
 NFP30_HOME:0 "国内事件"
 NFP30_INFRA_HOME_1_BODY:0 "地区为[SelectLocalization(And(ScriptContainer.MakeScope.Var('nfp20_problem_state').IsSet, ScriptContainer.MakeScope.Var('nfp20_problem_state').GetState.IsValid), 'NFP40_STATE_LINK', 'NFP40_REGION_FALLBACK')]。基础设施余额连续两个月为负，最近为[ScriptContainer.GetVariableValue('nfp20_after')|2]。\n\n基础设施不足值得细查。当地的运输能力和生产负荷都需要看看，单凭负数还开不出一个现成的建设方子。"
 NFP30_INFRA_HOME_1_LEAD:0 "当地基础设施不足，已经成了持续的难题。继续把它搁在一边，越来越难说得过去。"
 NFP30_INFRA_HOME_1_TITLE:0 "当地也盼一条配得上全国经济的通路"
 NFP30_INFRA_HOME_2_BODY:0 "地区为[SelectLocalization(And(ScriptContainer.MakeScope.Var('nfp20_problem_state').IsSet, ScriptContainer.MakeScope.Var('nfp20_problem_state').GetState.IsValid), 'NFP40_STATE_LINK', 'NFP40_REGION_FALLBACK')]。基础设施余额连续两个月为负，最近为[ScriptContainer.GetVariableValue('nfp20_after')|2]。\n\n缺口已不只出现一次。怎样处理，还得了解当地本身；一个指标，开不出一份现成的施工清单。"
 NFP30_INFRA_HOME_2_LEAD:0 "我国一处地区的基础设施需求再次超过了现有能力。"
 NFP30_INFRA_HOME_2_TITLE:0 "基础设施难题不宜再拖"
 NFP30_INFRA_METRICS:0 "地区为[SelectLocalization(And(ScriptContainer.MakeScope.Var('nfp20_problem_state').IsSet, ScriptContainer.MakeScope.Var('nfp20_problem_state').GetState.IsValid), 'NFP40_STATE_LINK', 'NFP40_REGION_FALLBACK')]。基础设施余额连续两个月为负，最近为[ScriptContainer.GetVariableValue('nfp20_after')|2]。"
 NFP30_INFRA_RECOVERY_HOME_1_BODY:0 "地区为[SelectLocalization(And(ScriptContainer.MakeScope.Var('nfp20_problem_state').IsSet, ScriptContainer.MakeScope.Var('nfp20_problem_state').GetState.IsValid), 'NFP40_STATE_LINK', 'NFP40_REGION_FALLBACK')]。先前预警时，基础设施余额为[ScriptContainer.GetVariableValue('nfp20_before')|2]，如今为[ScriptContainer.GetVariableValue('nfp20_after')|2]。最近两次月度记录均为非负。\n\n这项改善值得见报。不过，两次好消息还不足以许诺，运力不足将永远不再回来。"
 NFP30_INFRA_RECOVERY_HOME_1_LEAD:0 "再访先前见报的基础设施难题。最新记录终于让我们可以报道一些好转。"
 NFP30_INFRA_RECOVERY_HOME_1_TITLE:0 "先前吃紧的地区传来喜讯"
 NFP30_INFRA_RECOVERY_HOME_2_BODY:0 "地区为[SelectLocalization(And(ScriptContainer.MakeScope.Var('nfp20_problem_state').IsSet, ScriptContainer.MakeScope.Var('nfp20_problem_state').GetState.IsValid), 'NFP40_STATE_LINK', 'NFP40_REGION_FALLBACK')]。先前预警时，基础设施余额为[ScriptContainer.GetVariableValue('nfp20_before')|2]，如今为[ScriptContainer.GetVariableValue('nfp20_after')|2]。最近两次月度记录均为非负。\n\n连续两次观察证实好转。具体是哪些措施促成了它，现有数据尚不能确定。"
 NFP30_INFRA_RECOVERY_HOME_2_LEAD:0 "本国一处地区的基础设施已恢复平衡。本报记下这个变化，也给一直关心此事的读者一个交代。"
 NFP30_INFRA_RECOVERY_HOME_2_TITLE:0 "旧警讯终于换成了好消息"
 NFP30_INFRA_RECOVERY_METRICS:0 "地区为[SelectLocalization(And(ScriptContainer.MakeScope.Var('nfp20_problem_state').IsSet, ScriptContainer.MakeScope.Var('nfp20_problem_state').GetState.IsValid), 'NFP40_STATE_LINK', 'NFP40_REGION_FALLBACK')]。先前预警时，基础设施余额为[ScriptContainer.GetVariableValue('nfp20_before')|2]，如今为[ScriptContainer.GetVariableValue('nfp20_after')|2]。最近两次月度记录均为非负。"
 NFP30_ISSUE_DETAILS:0 "本期详情\n共[ScriptContainer.GetVariableValue('nfp20_article_count')|0]篇。\n历次记录包括[ScriptContainer.GetVariableValue('nfp20_history_count')|0]次观察、[ScriptContainer.GetVariableValue('nfp20_summary_intervals')|0]个比较间隔。\n全年国内生产总值估计为[ScriptContainer.GetVariableValue('nfp20_summary_before')|0] → [ScriptContainer.GetVariableValue('nfp20_summary_after')|0]。\n\n$NFP20_DIAGNOSTICS$\n[SelectLocalization(ScriptContainer.HasVariable('nfp31_rejected_region'), 'NFP30_REACH_REJECTED', 'NFP30_REACH_OLD')]"
 NFP30_ISSUE_HEADER:0 "[ScriptContainer.MakeScope.Var('nfp30_reader_definition').GetCountryDefinition.GetName] · 第[ScriptContainer.GetVariableValue('nfp_number')|0]期 · [ScriptContainer.GetVariableValue('nfp_year')|0]年[Localize(ScriptContainer.MakeScope.Var('nfp30_month').GetFlagName)]"
 NFP30_LAW_AWAY_1_BODY:0 "新法《[Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]》已经生效。\n\n本报读者得以观察别国生活的变化。目前确认的是新规已施行，它会带来什么影响还有待评估。"
 NFP30_LAW_AWAY_1_LEAD:0 "国外一项重要改革已经生效。"
 NFP30_LAW_AWAY_1_TITLE:0 "海外立法翻开新页"
 NFP30_LAW_AWAY_2_BODY:0 "新法《[Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]》已经生效。\n\n现有消息还不足以断言改革出自议会投票，也不能许诺某种结果。法律的实际效果值得另外观察。"
 NFP30_LAW_AWAY_2_LEAD:0 "海外传来消息，一项新规开始施行。"
 NFP30_LAW_AWAY_2_TITLE:0 "国外施行重要法律"
 NFP30_LAW_HOME_1_BODY:0 "新法《[Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]》已经生效。\n\n编辑部报道的是变化本身。法律经由何种途径通过、将怎样改变人们的生活，这则消息尚未说明。"
 NFP30_LAW_HOME_1_LEAD:0 "我国一项重要法律已经生效。"
 NFP30_LAW_HOME_1_TITLE:0 "新法令，日子的新一页"
 NFP30_LAW_HOME_2_BODY:0 "新法《[Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]》已经生效。\n\n要评估改革成效，需要时间与施行后的消息。本报不会把法律生效写成社会目标已经实现。"
 NFP30_LAW_HOME_2_LEAD:0 "我国的法律秩序出现变化，新规值得读者留心。"
 NFP30_LAW_HOME_2_TITLE:0 "一项重要改革在国内生效"
 NFP30_LAW_METRICS:0 "新法《[Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]》已经生效。"
 NFP30_LEAD_STORY:0 "头条报道"
 NFP30_LITERACY_AWAY_1_BODY:0 "识字人口比例由[Multiply_CFixedPoint(ScriptContainer.GetVariableValue('nfp20_before'), '(CFixedPoint)100')|1]%变为[Multiply_CFixedPoint(ScriptContainer.GetVariableValue('nfp20_after'), '(CFixedPoint)100')|1]%，跨过了[Multiply_CFixedPoint(ScriptContainer.GetVariableValue('nfp20_extra'), '(CFixedPoint)100')|1]%的门槛。\n\n他国的成就值得我国读者关注。仅此门槛并不足以解释当地如何办学，或证明它整套教育制度更优越。"
 NFP30_LITERACY_AWAY_1_LEAD:0 "另一国传来识字人数增长的可观消息。"
 NFP30_LITERACY_AWAY_1_TITLE:0 "海外教育跨过新门槛"
 NFP30_LITERACY_AWAY_2_BODY:0 "识字人口比例由[Multiply_CFixedPoint(ScriptContainer.GetVariableValue('nfp20_before'), '(CFixedPoint)100')|1]%变为[Multiply_CFixedPoint(ScriptContainer.GetVariableValue('nfp20_after'), '(CFixedPoint)100')|1]%，跨过了[Multiply_CFixedPoint(ScriptContainer.GetVariableValue('nfp20_extra'), '(CFixedPoint)100')|1]%的门槛。\n\n这份新记录证实识字人口的比例上升了。成因是什么，哪些经验能在我国使用，仍须另行研究。"
 NFP30_LITERACY_AWAY_2_LEAD:0 "本报跟踪各国教育，本期又添一条海外识字率的消息。"
 NFP30_LITERACY_AWAY_2_TITLE:0 "世上能读书的人多了起来"
 NFP30_LITERACY_HOME_1_BODY:0 "识字人口比例由[Multiply_CFixedPoint(ScriptContainer.GetVariableValue('nfp20_before'), '(CFixedPoint)100')|1]%变为[Multiply_CFixedPoint(ScriptContainer.GetVariableValue('nfp20_after'), '(CFixedPoint)100')|1]%，跨过了[Multiply_CFixedPoint(ScriptContainer.GetVariableValue('nfp20_extra'), '(CFixedPoint)100')|1]%的门槛。\n\n同上次记录相比，变化已经证实。要评说学校质量、就学机会是否平等，仅凭一处门槛还太早。"
 NFP30_LITERACY_HOME_1_LEAD:0 "识字率跨过了新的门槛。这是值得举国自豪的成就。"
 NFP30_LITERACY_HOME_1_TITLE:0 "我国的教育又向前迈了一步"
 NFP30_LITERACY_HOME_2_BODY:0 "识字人口比例由[Multiply_CFixedPoint(ScriptContainer.GetVariableValue('nfp20_before'), '(CFixedPoint)100')|1]%变为[Multiply_CFixedPoint(ScriptContainer.GetVariableValue('nfp20_after'), '(CFixedPoint)100')|1]%，跨过了[Multiply_CFixedPoint(ScriptContainer.GetVariableValue('nfp20_extra'), '(CFixedPoint)100')|1]%的门槛。\n\n会读会写的人口比例跨过一项重要门槛。至于不同地区、不同阶层各自的情形，则需要更细的资料。"
 NFP30_LITERACY_HOME_2_LEAD:0 "最新的识字记录给了本报一个理由，向全国道贺。"
 NFP30_LITERACY_HOME_2_TITLE:0 "知识走进更多人家"
