 NFP52_YUG_2_TITLE:0 "南部斯拉夫统一告成"
 NFP54_DIV_END:0 "末了想说些什么？经济增长，当然值得高兴。只是数字越大，就越容易漏看那些本应从增长中受益的人。两项指标为何背道而驰，还得查下去；该查的理由，眼下已经摆在面前。\n\n一份漂亮的报告是件好事。若报告之后，日子也好过些，那就更好了。"
 NFP54_DIV_EXPECTED:0 "再补一笔：预期生活水平为[ScriptContainer.GetVariableValue('nfp50_family_expected_sol')|2]，而这个“预期”，看来倒颇出我国当局的意料。经济成绩再好看，落差也不会因为我们多欣赏几回就自己合上。"
 NFP54_DIV_FACT:0 "三个月间，全年国内生产总值估计从[ScriptContainer.GetVariableValue('nfp20_before')|0]升至[ScriptContainer.GetVariableValue('nfp20_after')|0]，增长[ScriptContainer.GetVariableValue('nfp50_family_gdp_growth')|2]%。同一时期，平均生活水平却下降了[ScriptContainer.GetVariableValue('nfp20_extra')|2]点。两条消息，在表上挨着两行。头一条想向全国道喜，读到下一条，贺词就有些说不出口。"
 NFP54_DIV_INTRO:0 "最近的报表说得清楚：我国有成绩足以自豪，国内生产总值增长了。看起来确是喜讯。大家尽可以对着这行数字相互道贺，心里哼几句国歌，带着功课已毕的满足翻到下一页。只是翻页以前，不妨看看旁边那一行。写着“生活水平”的那一行……"
 NFP54_DIV_LIVING:0 "从前平均生活水平为[ScriptContainer.GetVariableValue('nfp50_family_sol_before')|2]，如今是[ScriptContainer.GetVariableValue('nfp50_family_sol')|2]。平均数很少能说清某一个人的日子。照老笑话说，富户吃肉，农家吃菜，一平均，家家吃的仿佛都是肉菜饺子。但这个平均数往下走，已经值得我们留心全局了。整个经济在长，平均家境却在退。写进庆功的报告里，总不是最悦目的一笔吧？"
 NFP54_DIV_TITLE:0 "经济成绩不错，数字却不能当饭吃"
 NFP55_INF_CONNECTED:0 "不过，还没到惊慌的时候。共同市场接入度为[Multiply_CFixedPoint(ScriptContainer.GetVariableValue('nfp50_family_access'), '(CFixedPoint)100')|1]%，说当地已经与全国隔绝，显然太夸张。基础设施紧张，未必明天面包和裤子就会从货架上消失。消息不算好，离灾难却还有距离。"
 NFP55_INF_DISCONNECTED:0 "还有一项让人担心：共同市场接入度只有[Multiply_CFixedPoint(ScriptContainer.GetVariableValue('nfp50_family_access'), '(CFixedPoint)100')|1]%。当地同市场的联系远称不上完备。柜台会不会空下来，眼下还说不准。只希望早点弄清缘由，免得居民猜测，先耗尽的究竟是必需品，还是自己的耐心。"
 NFP55_INF_END:0 "末了想说些什么？值得现在就看看这个地区，趁那里的坏消息还没有成了本报的固定背景。政府在修铁路、扩港口或另寻办法之间作选择时，我们会继续追踪事态。\n\n三思而后行，本是好话。三思之后，总得有人肯#strikethrough迈腿#!动手才好。"
 NFP55_INF_FACT:0 "说的是[SelectLocalization(And(ScriptContainer.MakeScope.Var('nfp20_problem_state').IsSet, ScriptContainer.MakeScope.Var('nfp20_problem_state').GetState.IsValid), 'NFP40_STATE_LINK', 'NFP40_REGION_FALLBACK')]。连续两个月，当地传来的消息都不甚乐观：基础设施已不堪重负。头一次还可以把希望寄在下期。下期到了，希望还在，问题也在。"
 NFP55_INF_INTRO:0 "要让经济兴旺，需要的真不少：少些税、多些买得起的货，还得让所需之物在合适的时候出现在合适的地方。偏偏最后这件事，需要基础设施留有余地。人的愿望可以没个尽头，运力却有个实在的上限。国内已有一个地区，需求越过了这条线。"
 NFP55_INF_TITLE:0 "挤得难受：基础设施吃紧，经济也受累"
 NFP56_ACC_END:0 "末了想说些什么？坐在首都，摊开地图便能看见整个国家。住在当地，恐怕要看能够买来什么、卖出什么，才能摸得着这个国家。眼下，这两种看法之间有一道不甚愉快的距离。\n\n本报将继续关注这道距离能否缩短。但愿通往共同市场的路，总比听完下一番“为什么到不了”的解释短些。"
 NFP56_ACC_FACT:0 "说的是[SelectLocalization(And(ScriptContainer.MakeScope.Var('nfp20_problem_state').IsSet, ScriptContainer.MakeScope.Var('nfp20_problem_state').GetState.IsValid), 'NFP40_STATE_LINK', 'NFP40_REGION_FALLBACK')]。连续两份月报都显示，当地接入全国市场仍有障碍。在地图上，它当然还是我国的一部分；只是到了买卖的时候，全国经济的好处却没法十足享用。“全国”二字听着很亲切，可惜不能拎进菜篮里。"
 NFP56_ACC_FREE:0 "有意思的是，当地设施仍然应付得了现有负荷。于是那句常听的“再建些什么吧”，单独拿出来还算不上答案。有余力，却接不全市场。先弄清事情卡在哪里，再往那里派钱派人吧。"
 NFP56_ACC_INTRO:0 "需要的东西能买到，是件好事。不用想路有多远，不用研究该从哪里绕过去，到店里买便是。然而从“国内有”到“本地有售”之间，有时足以写成整段故事。偏巧我国有个地区，这段故事至今没等到一个圆满结局。"
 NFP56_ACC_OVERLOAD:0 "原因也许并不稀奇：当地基础设施负担过重。两桩麻烦偏偏做了邻居，市场联系不完整，自己的设施又显得不够。后者能不能解释前者的全部？仍是疑问。不过值得留意当地的理由，现在显然已不只一个。"
 NFP56_ACC_SEVERE:0 "眼下已很难只说是“一点不便”。市场接入度连完整水平的一半都不到。如今柜台上究竟还有什么，我们不知道。但当地还能在多大程度上指望全国经济，已经越来越值得问一问。"
 NFP56_ACC_TITLE:0 "地区是自家的，市场却……"
 NFP57_SUP_BOTH:0 "军队和政府机关都要用到这件货。买主之中，看来有不少人肩负要事、手握公款。只是事情再要紧，也不保证所需之物会立刻出现。最好趁短缺还可以坐下来讨论，就把供货弄明白，免得到了最不合适的时候才忙着四处找替代品。"
 NFP57_SUP_CHRONIC:0 "短缺有成为习惯的危险。这大概是它最难受的一面：“没有”二字，说多了也会习惯。只是有一天，开口说这句话的也许不再是卖家对买家，而是百姓对国家。到那时，除去哪儿找货，我们还得问：信任又到哪里去了？"
 NFP57_SUP_CRITICAL:0 "这次我国的短缺已经严重到不能当作寻常买卖不便一笑置之。当然，仍可以安慰自己，说别处总该还找得到一点。也许真能找到。问题在于，那一点够不够所有需要它的人用。"
 NFP57_SUP_DETAILS:0 "$NFP46_METRICS$\n市场产量为[ScriptContainer.GetVariableValue('nfp50_supply_production')|1]，消费为[ScriptContainer.GetVariableValue('nfp50_supply_consumption')|1]，进口为[ScriptContainer.GetVariableValue('nfp50_supply_imports')|1]，出口为[ScriptContainer.GetVariableValue('nfp50_supply_exports')|1]。进口占生产与进口合计的[ScriptContainer.GetVariableValue('nfp50_supply_import_fraction')|1]%。这衡量的是市场供给，并非本国居民所购商品的进口占比；单凭贸易量也无法确定短缺原因。\n事发时价格为£[ScriptContainer.GetVariableValue('nfp50_supply_price')|1]，相对基础价格偏差为[ScriptContainer.GetVariableValue('nfp50_supply_premium')|1]%（负值表示较低）。价格本身不能衡量每位买主能否得到商品。\n连续出现问题的月度记录为[ScriptContainer.GetVariableValue('nfp50_supply_observations')|0]次。事发时直接短缺标记为[ScriptContainer.GetVariableValue('nfp46_native_after')|0]，本地严重短缺标记为[ScriptContainer.GetVariableValue('nfp50_supply_critical')|0]。"
 NFP57_SUP_END:0 "末了想说些什么？短缺的缘由可能有好几种，买主的问题通常只有一个：“我到底买不买得到？”\n\n等情况有变，本报会再来探访。最好到那时，需要四处寻找的已不是货品本身，而是哪家卖得更合算。\n\n毕竟，先有东西可买，讨价还价才有趣些。"
 NFP57_SUP_FACT:0 "这回说的是[ScriptContainer.MakeScope.Var('nfp46_good').GetGoods.GetNameNoIcon]。市场已经出现短缺，供货难题在月报里也不是头一次露脸。这当然不是说它已经从各处消失。然而想买的人足够多，“上哪儿找”已经值得本报单辟一栏。需求这一边，看来是把自己的本分做足了。如今只盼供给也能赶到。"
 NFP57_SUP_GOVERNMENT:0 "政府机关也需要这件货。这个问题同国家日常事务的关系，恐怕比贸易表上的一行小字看起来更密切。“事关国计”听着很有分量。可惜它本身并不出产货物。"
 NFP57_SUP_INTRO:0 "上街买东西，如果先要做的是挑选，那自然好。挑好一些的、便宜一些的，看看什么今天付得起，什么不妨再等等。若只能在“没有”和“去别家问问”之间挑，就没那么愉快了。尤其是当你要的是货，并非找个由头多走几步，或同人吵上一架。"
 NFP57_SUP_LONG:0 "月报一份接一份，供货却依旧叫人疑惑。起初还可以盼事情很快好转，如今连这份盼头都有了相当的资历。若政府的工作也能添些实在的成果，自然更好。眼下只有时光在走，希望在长，问题还站在原处。"
 NFP57_SUP_MILITARY:0 "这东西还要用在军中。因此事情并不止于贸易，军需也值得留心。最好趁问题仍能在报纸上从容议一议，别等到要磨刺刀时才急着四处张罗。真希望到了那一天，该有的早已齐备。"
 NFP57_SUP_NO_IMPORT:0 "截稿时未见从外面运来的货。能不能向外采购，以补不足？这个念头几乎是自己冒出来的。只是从“应该买一些”到“终于运来了”，中间往往隔着比报纸上一句建议更复杂的事。究竟卡在哪道关口，倒很值得弄清。"
 NFP57_SUP_TITLE:0 "想买的人有了，货又在哪里？"
 NFP57_SUP_TRADE:0 "外来的货是有的，短缺却还没有消除。说一句“我们会进口”，比真正解决供货容易。画在地图上的商路颇能服人，但愿走到路的尽头也能领到货。多买一些能帮多大忙，又该从哪里买，眼下仍是疑问。"
 NFP58_GAP_BOTH:0 "军队和政府机构都需要这种商品。因此，这桩买卖背后还有国家的正经大事。倘若事情足够重要，能让供应问题早些得到解决，自然再好不过。可惜，光说重要，货物不会自己变出来。"
 NFP58_GAP_CHRONIC:0 "这件事已经拖了很久。按说，旺盛的需求应当是一封请生产者和商人入席的好请帖。如今请帖还在桌上，货物却迟迟赶不上来。是生产能力不足，贸易不畅，还是另有缘故？眼下仍得打个问号。看来，光有买东西的心，还不足以催生经济奇迹。"
 NFP58_GAP_CRITICAL:0 "而且，我国已经出现了严重的本地短缺。这就让市场的大账之外，多了一个更急的问题：在这里，究竟能不能买到所需的东西？急等着用货的人，听一番市场未来潜力的高论，大概也只能借此打发等待的时间。"
 NFP58_GAP_END:0 "说到最后，我们想说什么？需求旺盛，本可以是经济的好消息。有值得生产的东西，有愿意掏钱的买主，也有扩大生意的理由。只是机会还得变成实物——最好赶在等待成了购物的主要内容之前。\n\n想买的人不缺。就看想买的东西何时不缺了。"
 NFP58_GAP_FACT:0 "这次说的是‘[ScriptContainer.MakeScope.Var('nfp46_good').GetGoods.GetNameNoIcon]’。求购的数量明显多于出售的数量，供应上的困难也已不止一次出现在月度消息中。说它已从市场消失，未免夸大。不过，‘不愁没人买’与‘买的人拿得到’之间，确实有了令人不快的距离。"
 NFP58_GAP_GOVERNMENT:0 "政府机构也需要这种商品。因而关心这门买卖的，并非只有私人。国库当然自有办法，但公文盖上官印，市场上的货也不会因此多出一批。"
 NFP58_GAP_INTRO:0 "找到买主，买卖就成了一半。有时还是最难的那一半：讲明好处，勾起兴趣，再说服对方掏钱。因此，一见买主不少，我们便想向商界和本国经济道喜。不过，道喜之前，最好先看看有什么能卖给他们。偏偏问题就出在这里。"
 NFP58_GAP_LONG:0 "起初，还可以盼着商人很快跟上需求。毕竟，愿意付钱的人，通常比请求赊账的人更受欢迎。可月份一页页翻过去，问题依旧。想赚钱的人，也许早已找到了。现在只盼货也能找到。"
 NFP58_GAP_MILITARY:0 "这种商品还有军用用途。所以，不必等军队急需时才来关心这份需求。真到谈起军需的那一天，但愿国家准备的是余力，而不只是一肚子解释。"
 NFP58_GAP_NO_IMPORT:0 "目前尚未见到外来供应。问题自然来了：自己供不够，能否到国外找找？当然，光问一句，运不来一船货。不过买主大概很想知道，究竟是什么妨碍了实际行动。"
 NFP58_GAP_TITLE:0 "买主有了，货呢？"
 NFP58_GAP_TRADE:0 "外来供应已有，但供需之间仍有缺口。有货运来，总是好事。接下来还得弄清，能否多运一些，又需要什么条件。毕竟，贸易最让人高兴的时候，是它的成果不只画在地图上，还能买到手里。"
 NFP59_REC_BOTH:0 "军队和政府机关都要用到这件货，所以这份好消息值得几方面的人一起高兴。一份向好的行情，还不能给全国配齐所需的东西。不过，如今再看市场，总算有了稍微安心的理由。"
 NFP59_REC_BUY:0 "只是想买的人也少了。若把全部改善都记作供货成功，未免太省事。队伍变短，有时是因为生意办得快了，有时只是因为有人离开了队伍。单凭这次变化，我们还不知道他们为何离开。"
 NFP59_REC_DETAILS:0 "$NFP57_SUP_DETAILS$\n连续未出现旧有信号的月度观察为[ScriptContainer.GetVariableValue('nfp50_supply_good_observations')|0]次。原警报类型为[ScriptContainer.GetVariableValue('nfp46_mode')|0]（1为直接短缺，2为供需订单缺口）。订单的比较取自本轮观察的起点与事件当日。"
 NFP59_REC_END:0 "末了想说些什么？遇上麻烦，本报向来写得响亮。若碰到好转就忽然安静下来，未免说不过去。既有理由为它高兴，我们也很乐意把它记下来。\n\n往后仍会留心，但愿这段故事别又绕回老路。续写好消息，总比推翻好消息愉快。"
 NFP59_REC_GAP:0 "再说“[ScriptContainer.MakeScope.Var('nfp46_good').GetGoods.GetNameNoIcon]”。先前想买的明显多于挂牌出售的。如今连续两份月报显出较为平和的局面。供与求未必已经握手言和，至少不再隔着先前那么远的距离。"
 NFP59_REC_GOVERNMENT:0 "政府机关也是买主。因此这份改善关系到的，是国库也有理由关注的一件事。但愿好行情之后，日常公务也能办得更顺手些。"
 NFP59_REC_INTRO:0 "好消息有时模样颇为朴素。没有人剪彩，没有人致辞，也没人要求记牢这一天。只是一段原先让人皱眉的故事，如今终于有了换副神情的理由。先前那桩贸易上的忧虑，恰好等到了这样的下文。"
 NFP59_REC_MILITARY:0 "军队也需要这件商品。因此，从军需一头看，供货趋稳也值得高兴。本报当然不会宣布一切军需均已满足。不过贸易表上少一个警讯，已经是个不错的开端。"
 NFP59_REC_NATIVE:0 "再说“[ScriptContainer.MakeScope.Var('nfp46_good').GetGoods.GetNameNoIcon]”。自本报警示以来，连续两份月报都没有出现原先那样的警讯。市场不再显示直接短缺，供给也已明显靠近需求。这还不能保证每个买主都找得到想要的东西。但在又一句“还是不够”之外，我们终于有了别的消息可报。"
 NFP59_REC_NO_IMPORT:0 "截稿时，也没有来自外部的货运记录。眼下的好转，不能简单说成海外货物终于抵达。市场内部究竟变了什么，是另一道题。好消息不会因此失色，细看它却更有意思。"
 NFP59_REC_SELL:0 "还有一个可喜的细节：如今挂牌出售的货，比故事开头多了。因此事情并非只靠盼着买主改变主意。市场上确有更多货品，究竟是谁用什么办法办到的仍待考，变化本身却值得高兴。"
 NFP59_REC_TITLE:0 "总算能松一口气"
 NFP59_REC_TRADE:0 "外来的货还在运进来。能在供货好转的新闻旁看见这一项，自然愉快。把全部功劳一股脑记在贸易头上还太早，但若作出一副“一切自然而然”的模样，将它略过，也不合适。"
 NFP59_REC_ZERO_END:0 "买主为何不再来，还得查清。把这样的变化直接写成经济胜利，本报不愿太匆忙。\n\n队伍空了，倒是好景象。前提是知道等货的人去了哪儿。"
 NFP59_REC_ZERO_FACT:0 "就“[ScriptContainer.MakeScope.Var('nfp46_good').GetGoods.GetNameNoIcon]”而言，先前的警讯不再出现，但最新记录中也不见需求。眼下是安静了。至于安静背后供货究竟有没有好转，我们还不知道。"
 NFP59_REC_ZERO_INTRO:0 "有个简单的办法可以不再察觉短缺：不再寻找所需的东西。不过对买主来说，这份安慰颇为可疑。因此读下一条新闻时，庆功的乐曲不妨先缓一缓。"
 NFP59_REC_ZERO_TITLE:0 "没了需求，问题就解决了？"
 NFP60_CONS_DOWN:0 "市场消费减少了。为什么减少，仍须另问。"
 NFP60_CONS_UP:0 "市场消费增加了。"
 NFP60_EXP_DOWN:0 "运往外地的货物减少了。"
 NFP60_EXP_UP:0 "运往外地的货物增加了。"
 NFP60_IMP_DOWN:0 "从外部运入市场的货物减少了。"
 NFP60_IMP_UP:0 "从外部运入市场的货物增加了。"
 NFP60_PARTIAL_SUP:0 "生产和贸易的详细记录，是在这段故事中途才开始的。这里能看到的是从那时起发生的变化。"
 NFP60_PROD_DOWN:0 "这种货品在市场内的产量下降了。"
 NFP60_PROD_UP:0 "这种货品在市场内的产量增加了。"
 NFP60_STATE_DETAILS:0 "[Localize(ScriptContainer.MakeScope.Var('nfp60_previous_metrics').GetFlagName)]\n自月序[ScriptContainer.GetVariableValue('nfp60_st_start')|0]起观察成因。记录是否涵盖全程：部分记录标记为[ScriptContainer.GetVariableValue('nfp60_st_partial')|0]。\n基础设施为[ScriptContainer.GetVariableValue('nfp60_st_cap_before')|2] → [ScriptContainer.GetVariableValue('nfp60_st_cap_after')|2]\n负荷为[ScriptContainer.GetVariableValue('nfp60_st_usage_before')|2] → [ScriptContainer.GetVariableValue('nfp60_st_usage_after')|2]\n市场接入度为[Multiply_CFixedPoint(ScriptContainer.GetVariableValue('nfp60_st_access_before'), '(CFixedPoint)100')|1]% → [Multiply_CFixedPoint(ScriptContainer.GetVariableValue('nfp60_st_access_after'), '(CFixedPoint)100')|1]%\n铁路等级为[ScriptContainer.GetVariableValue('nfp60_st_rail_before')|0] → [ScriptContainer.GetVariableValue('nfp60_st_rail_after')|0]\n港口等级为[ScriptContainer.GetVariableValue('nfp60_st_port_before')|0] → [ScriptContainer.GetVariableValue('nfp60_st_port_after')|0]\n城市中心等级为[ScriptContainer.GetVariableValue('nfp60_st_urban_before')|0] → [ScriptContainer.GetVariableValue('nfp60_st_urban_after')|0]\n事件次数（每项最多99）：铁路新建=[ScriptContainer.GetVariableValue('nfp60_st_rail_built')|0]，铁路扩建=[ScriptContainer.GetVariableValue('nfp60_st_rail_expanded')|0]，铁路生产方式变更=[ScriptContainer.GetVariableValue('nfp60_st_rail_pm')|0]，港口新建=[ScriptContainer.GetVariableValue('nfp60_st_port_built')|0]，港口扩建=[ScriptContainer.GetVariableValue('nfp60_st_port_expanded')|0]，港口生产方式变更=[ScriptContainer.GetVariableValue('nfp60_st_port_pm')|0]，城市中心新建=[ScriptContainer.GetVariableValue('nfp60_st_urban_built')|0]，城市中心扩建=[ScriptContainer.GetVariableValue('nfp60_st_urban_expanded')|0]，城市中心生产方式变更=[ScriptContainer.GetVariableValue('nfp60_st_urban_pm')|0]。\n首末次事件月序为[ScriptContainer.GetVariableValue('nfp60_st_event_first')|0] / [ScriptContainer.GetVariableValue('nfp60_st_event_last')|0]。当所观察建筑的岗位填补率由低于80%升至至少80%时，记为用工改善；未计算其对基础设施的确切贡献。"
 NFP60_SUP_CAUSES:0 "[SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp60_supply_known'), '(CFixedPoint)1'), 'NFP60_SUP_COMPONENTS', 'NFP60_SUP_UNKNOWN')][SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp60_s_partial'), '(CFixedPoint)1'), 'NFP60_PARTIAL_SUP', 'NFP50_EMPTY')]"
 NFP60_SUP_COMPONENTS:0 "[SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp60_prod_dir'), '(CFixedPoint)1'), 'NFP60_PROD_UP', SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp60_prod_dir'), '(CFixedPoint)-1'), 'NFP60_PROD_DOWN', 'NFP50_EMPTY'))][SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp60_imp_dir'), '(CFixedPoint)1'), 'NFP60_IMP_UP', SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp60_imp_dir'), '(CFixedPoint)-1'), 'NFP60_IMP_DOWN', 'NFP50_EMPTY'))][SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp60_exp_dir'), '(CFixedPoint)1'), 'NFP60_EXP_UP', SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp60_exp_dir'), '(CFixedPoint)-1'), 'NFP60_EXP_DOWN', 'NFP50_EMPTY'))][SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp60_cons_dir'), '(CFixedPoint)1'), 'NFP60_CONS_UP', SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp60_cons_dir'), '(CFixedPoint)-1'), 'NFP60_CONS_DOWN', 'NFP50_EMPTY'))]这些变化同供货问题出现在同一段时间。若从中挑出一个，称它独自挽救了市场，本报恐怕胆子还不够大。"
 NFP60_SUP_DETAILS:0 "[Localize(ScriptContainer.MakeScope.Var('nfp60_previous_metrics').GetFlagName)]\n自月序[ScriptContainer.GetVariableValue('nfp60_s_start')|0]起记贸易详情，部分记录标记为[ScriptContainer.GetVariableValue('nfp60_s_partial')|0]。\n市场产量为[ScriptContainer.GetVariableValue('nfp60_s_prod_before')|2] → [ScriptContainer.GetVariableValue('nfp60_s_prod_after')|2]\n市场消费为[ScriptContainer.GetVariableValue('nfp60_s_cons_before')|2] → [ScriptContainer.GetVariableValue('nfp60_s_cons_after')|2]\n市场进口为[ScriptContainer.GetVariableValue('nfp60_s_imp_before')|2] → [ScriptContainer.GetVariableValue('nfp60_s_imp_after')|2]\n市场出口为[ScriptContainer.GetVariableValue('nfp60_s_exp_before')|2] → [ScriptContainer.GetVariableValue('nfp60_s_exp_after')|2]\n价格为[ScriptContainer.GetVariableValue('nfp60_s_price_before')|2] → [ScriptContainer.GetVariableValue('nfp60_s_price_after')|2]。以上为整个市场的数值，不一定是读者国的国内产量。"
 NFP60_SUP_UNKNOWN:0 "先前的警讯消退了，但生产与贸易的详细记录，还解释不出是什么促成了这番变化。"
 NFP61_CAP_DOWN:0 "有意思的是，这段时间运输网络没有变得更能容纳货流，承载能力反倒缩小了。因此不能只用基础设施扩张来解释改善。"
 NFP61_CAP_UP:0 "观察期间，运输网络的承载能力确实提高了。经济多了些伸展的地方，只盼它别在我们来得及道贺以前，又把这点余地占满。"
 NFP61_CAUSES:0 "[SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp60_components_known'), '(CFixedPoint)1'), 'NFP61_COMPONENTS', 'NFP61_UNKNOWN')][SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp60_st_partial'), '(CFixedPoint)1'), 'NFP61_PARTIAL', 'NFP50_EMPTY')]"
 NFP61_COMPONENTS:0 "[SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp60_cap_dir'), '(CFixedPoint)1'), 'NFP61_CAP_UP', SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp60_cap_dir'), '(CFixedPoint)-1'), 'NFP61_CAP_DOWN', 'NFP50_EMPTY'))][SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp60_usage_dir'), '(CFixedPoint)1'), 'NFP61_LOAD_UP', SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp60_usage_dir'), '(CFixedPoint)-1'), 'NFP61_LOAD_DOWN', 'NFP50_EMPTY'))]"
 NFP61_END:0 "末了想说些什么？当地传来一个好消息，我们无意只因习惯了抱怨，就非在里面挑出个不是。经济松了口气，我们也值得为它高兴。\n\n接下来，再看这份宽松能维持多久。下次重访此地，我们希望报道的是它又生产了什么，而不是哪样东西又把它压垮了。\n\n都说挤一挤也无妨。不过能宽敞些，到底还是舒服些。"
 NFP61_EVENTS:0 "[SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp60_rail_work'), '(CFixedPoint)1'), 'NFP61_RAIL_WORK', 'NFP50_EMPTY')][SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp60_port_work'), '(CFixedPoint)1'), 'NFP61_PORT_WORK', 'NFP50_EMPTY')][SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp60_urban_work'), '(CFixedPoint)1'), 'NFP61_URBAN_WORK', 'NFP50_EMPTY')][SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp60_rail_pm_seen'), '(CFixedPoint)1'), 'NFP61_RAIL_PM', 'NFP50_EMPTY')][SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp60_port_pm_seen'), '(CFixedPoint)1'), 'NFP61_PORT_PM', 'NFP50_EMPTY')][SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp60_urban_pm_seen'), '(CFixedPoint)1'), 'NFP61_URBAN_PM', 'NFP50_EMPTY')]$NFP61_PM_END_SELECT$[SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp60_st_rail_staffup'), '(CFixedPoint)1'), 'NFP61_RAIL_STAFF', 'NFP50_EMPTY')][SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp60_st_port_staffup'), '(CFixedPoint)1'), 'NFP61_PORT_STAFF', 'NFP50_EMPTY')]$NFP61_STAFF_END_SELECT$看来，变化确实有过。至于把功劳全记在其中某一项名下，且慢：同时发生和真正解决难题，到底是两回事。"
 NFP61_FACT:0 "说的是[SelectLocalization(And(ScriptContainer.MakeScope.Var('nfp20_problem_state').IsSet, ScriptContainer.MakeScope.Var('nfp20_problem_state').GetState.IsValid), 'NFP40_STATE_LINK', 'NFP40_REGION_FALLBACK')]。此前本报写过，当地基础设施背负的担子已经超出了它能承受的分量。如今最新记录显示，现有能力足以应付当前需要。那桩坏事先前已在本报占过一席，如今总算把位置让给了好消息！"
 NFP61_INTRO:0 "好事容易习惯。比如生产照常进行，新开一家企业也不必立刻问：我们的基础设施受得了吗？坏事其实也能习惯。运力吃紧，日子照过，下期的记录同上期几乎一个模样……这一回却有些不同。好在是往好处变了。"
 NFP61_LOAD_DOWN:0 "与此同时，网络的负荷减轻了。要缓解拥挤，可以多挪出些地方，也可以不再往里塞那许多事情。后一个办法也管用。不过，活儿为什么少了，仅凭这一点还不得而知。"
 NFP61_LOAD_UP:0 "与此同时，网络的负荷也增加了。换句话说，并非只靠经济本身少提些要求才腾出地方。要办的事多了，往日的过载却消失了。"
 NFP61_PARTIAL:0 "不过，详细记录只覆盖了这段故事的一部分。开头发生在我们开始追踪以前，眼下还不宜急着作出最后的解释。"
 NFP61_PM_END:0 "要有变化，未必总得建新东西。有时该细看的，是现有的东西怎样运转。"
