 NFP30_URGENT:0 "号外"
 NFP30_WAR_END_AWAY_1_BODY:0 "战争已结束。主要当事方为[ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName]与[ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName]。\n\n对我国读者而言，这是世界新闻的一次重要转折。谁达到了目的、花了多少代价，本则消息尚无从确定。"
 NFP30_WAR_END_AWAY_1_LEAD:0 "传来两主要当事方停战的消息。"
 NFP30_WAR_END_AWAY_1_TITLE:0 "海外战事已告终"
 NFP30_WAR_END_AWAY_2_BODY:0 "战争已结束。主要当事方为[ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName]与[ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName]。\n\n本报先记下战争的终结。待获得损失及议和条件的消息之后，再评说它的结果。"
 NFP30_WAR_END_AWAY_2_LEAD:0 "主要当事方的武装冲突已经结束。"
 NFP30_WAR_END_AWAY_2_TITLE:0 "海外传来停战消息"
 NFP30_WAR_END_HOME_1_BODY:0 "战争已结束。主要当事方为[ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName]与[ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName]。\n\n本报报道的是战争结束。谁是赢家、损失几何、和约如何写成，尚未由这条消息确定。"
 NFP30_WAR_END_HOME_1_LEAD:0 "我国作为主要当事方卷入的战事已经告终。"
 NFP30_WAR_END_HOME_1_TITLE:0 "我国的战争结束了"
 NFP30_WAR_END_HOME_2_BODY:0 "战争已结束。主要当事方为[ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName]与[ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName]。\n\n若要衡量结果，还须看和约与各方的处境。仅是战火止息，尚不足以宣布胜利。"
 NFP30_WAR_END_HOME_2_LEAD:0 "我国参与的战争已经结束。本报为国内事务的这一重要变化留下一笔。"
 NFP30_WAR_END_HOME_2_TITLE:0 "战事告终的消息已至"
 NFP30_WAR_END_METRICS:0 "战争已结束。主要当事方为[ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName]与[ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName]。"
 NFP30_WAR_START_AWAY_1_BODY:0 "战端已开。主要当事方为[ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName]与[ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName]。\n\n其他参与国、战况以及对我国的影响，都得等进一步来讯。战争最终走向何处，仍属未知。"
 NFP30_WAR_START_AWAY_1_LEAD:0 "国外爆发一场重要战争。本报现可报道的是两个主要交战方。"
 NFP30_WAR_START_AWAY_1_TITLE:0 "世界又燃起一场战火"
 NFP30_WAR_START_AWAY_2_BODY:0 "战端已开。主要当事方为[ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName]与[ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName]。\n\n我们记录开战，不提前指派胜者。本则消息尚未列全参与各方。"
 NFP30_WAR_START_AWAY_2_LEAD:0 "海外传来消息，上述国家间已爆发武装冲突。"
 NFP30_WAR_START_AWAY_2_TITLE:0 "新的战争改变世界新闻的日程"
 NFP30_WAR_START_HOME_1_BODY:0 "战端已开。主要当事方为[ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName]与[ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName]。\n\n本报将继续关注事态。目前报道的是主要当事方；参与者的完整名单及日后结局，均不在这份来讯之中。"
 NFP30_WAR_START_HOME_1_LEAD:0 "和平时期的话题暂让位于战报：我国已成新战争的主要当事方之一。"
 NFP30_WAR_START_HOME_1_TITLE:0 "我国进入战争"
 NFP30_WAR_START_HOME_2_BODY:0 "战端已开。主要当事方为[ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName]与[ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName]。\n\n此事值得所有读者关心。本报不会预断结局，也不会拿胜利的许诺冒充确实消息。"
 NFP30_WAR_START_HOME_2_LEAD:0 "战事已起，我国为其中一个主要当事方。"
 NFP30_WAR_START_HOME_2_TITLE:0 "我国卷入新的战争"
