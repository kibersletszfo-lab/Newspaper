 NFP51_RELATION_ALLY:0 "事发时，两个主要当事方中至少有一个与我国订有正式盟约。单凭同盟关系，还不能断言我国已加入这场博弈，或将参加可能爆发的战争。"
 NFP51_RELATION_BLOC:0 "事发时，主要当事方中至少有一个与我国同属一个国家集团。同一集团并非军事盟约，我国也不会因此自动成为参与方。"
 NFP51_RELATION_JOINER:0 "本次消息说的是我国加入了外交博弈。加入博弈是一回事，战争是否已经开始，则是另一回事。"
 NFP51_RELATION_JOINER_ALLY:0 "新加入的一方在事发时是我国的正式盟友。对方表态，并不自动等于我国也加入。"
 NFP51_RELATION_JOINER_BLOC:0 "新加入的一方在事发时是我国的集团伙伴。这条消息表明的是该国的立场，不能据此便把整个集团都列入参与者名单。"
 NFP51_RELATION_OWN:0 "我国正是这次对峙的两个主要当事方之一。这条新闻自然与我国外交直接相关。"
 NFP51_SPECIAL_HINT:0 "本份号外整期报道一件大事。"
 NFP51_SPECIAL_LABEL:0 "号外"
 NFP51_START_1_CORE:0 "本月出现了新的外交对峙。发起方为[ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName]，最初的目标为[ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName]；事情起于[Localize(ScriptContainer.MakeScope.Var('nfp51_play_label').GetFlagName)]。"
 NFP51_START_1_END:0 "双方尚未开战。眼下可以争取支持，可以让步，也可以坚持己见。本报希望，在只剩大炮能说服对方之前，双方还能找到一句有分量的话。此后争执如何发展，我们会接着报道。"
 NFP51_START_1_LEAD:0 "提出要求的是[ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName]，对峙的另一方为[ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName]。"
 NFP51_START_1_TITLE:0 "话说到最后，成了要求"
 NFP51_START_2_CORE:0 "外交纪事又添一场对峙。[ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName]向[ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName]提出要求，两国争的是[Localize(ScriptContainer.MakeScope.Var('nfp51_play_label').GetFlagName)]。"
 NFP51_START_2_END:0 "双方尚未开战。眼下可以争取支持，可以让步，也可以坚持己见。本报希望，在只剩大炮能说服对方之前，双方还能找到一句有分量的话。此后争执如何发展，我们会接着报道。"
 NFP51_START_2_LEAD:0 "[ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName]与[ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName]之间的外交对峙已获证实。"
 NFP51_START_2_TITLE:0 "话说到最后，成了要求"
 NFP51_START_TIMELINE:0 "这场外交博弈始见于[ScriptContainer.GetVariableValue('nfp51_start_year')|0]年[Localize(Concatenate('NFP30_MONTH_', ToString_int32(FixedPointToInt(ScriptContainer.GetVariableValue('nfp51_start_month')))))]的记录。后续消息都属于同一场危机。"
 NFP52_ACW_1_BODY:0 "美国内战爆发。有些新闻一来，连老读者熟悉的国名都得重新咀嚼。如今，美利坚合众国要用武器争论自己的前程。谈统一也好，谈另择道路的权利也好，有个沉重的问题都绕不开：争论结束以前，人们还要经受多少苦难？\n\n美国已经同脱离联邦的美国政权开战。政治对峙越过了一道门槛，事情再也不能只在谈判桌上决断。联邦本身的前途，也将取决于战场的结果。\n\n在世界其他地方看来，这也绝非大洋彼岸的一场口角。各国同美国做生意、订条约、作打算，如今须面对它处境的变化。不过，最先承受分裂之苦的，终究是生活在那里的人。与其一再刊发战事持续的消息，我们更盼着早日报上和平的条件。\n\n本报以收到消息的月份记事。传递路上若有耽搁，事情本身可能发生得更早。"
 NFP52_ACW_1_CONTEXT:0 "在世界其他地方看来，这也绝非大洋彼岸的一场口角。各国同美国做生意、订条约、作打算，如今须面对它处境的变化。不过，最先承受分裂之苦的，终究是生活在那里的人。与其一再刊发战事持续的消息，我们更盼着早日报上和平的条件。"
