 NFP52_CHINA_2_TITLE:0 "少了一个统一的国家，多了好些问题"
 NFP52_COMMUNE_1_BODY:0 "巴黎成立了公社。法国国内的政治分裂有了自己的名字，也有了独立的表达。眼下谁来执政的问题格外尖锐。毕竟争执发生在首都，正处于旧有国家秩序的中心。\n\n巴黎公社宣告成立的消息已获证实。新名字背后，是对另一种执政秩序的主张。这场较量最终走向何方仍待观察。至少有一点清楚：巴黎的危局，已经不是再讲一场演说就能平息的争执。\n\n争论的是政治主张，承受其间波折的却是整座城市。谁来治理巴黎、怎样治理，答案未明，居民仍得生活和工作。本报将继续留意法国来讯。只愿下一页多几分明朗，少几分苦难。\n\n本报以收到消息的月份记事。传递路上若有耽搁，事情本身可能发生得更早。"
