 NFP52_JAP_2_TITLE:0 "日本政局易势"
 NFP52_METRICS:0 "世界大事。消息收到于[ScriptContainer.GetVariableValue('nfp20_year')|0]年[Localize(ScriptContainer.MakeScope.Var('nfp30_month').GetFlagName)]。开始观察后，此事仅报道一次。"
 NFP52_PANAMA_1_BODY:0 "巴拿马运河竣工，大西洋和太平洋之间有了新的通道。摊开地图，隔开两洋的那片土地仿佛颇窄。对修河的人来说，想必光靠这个念头还不够宽慰。如今地图上的一条线，背后已有一整项建成的工程。\n\n运河已经竣工。远洋航行多了一条可选的道路，从一大洋到另一大洋的老路程得重新盘算。即使不急着把将来的每一笔收益都算进贺辞，变化有多大也很明白：原先没有路的地方，如今能通船了。\n\n工程师交了卷，接下来该轮到商人算账了。新航道还得有人去用，也得有人把它的好处变成实事。不过，值得道贺的成果已经摸得着。有时候，要让世界两端更接近，还真能从字面上办到。\n\n本报以收到消息的月份记事。传递路上若有耽搁，事情本身可能发生得更早。"
 NFP52_PANAMA_1_CONTEXT:0 "工程师交了卷，接下来该轮到商人算账了。新航道还得有人去用，也得有人把它的好处变成实事。不过，值得道贺的成果已经摸得着。有时候，要让世界两端更接近，还真能从字面上办到。"
