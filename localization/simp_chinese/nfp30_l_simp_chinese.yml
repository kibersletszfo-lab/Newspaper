 NFP30_PRODUCTION_AWAY_1_BODY:0 "商品为[Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]。入围前三之前排名第[ScriptContainer.GetVariableValue('nfp20_before')|0]，最近为第[ScriptContainer.GetVariableValue('nfp20_after')|0]。连续两个月位居前三。\n\n世界生产的格局有了变化。本表衡量的是产量，据此仍不能推断利润、出口，或我国市场上的价格。"
 NFP30_PRODUCTION_AWAY_1_LEAD:0 "一个外国经济体跻身某种重要商品的三大生产国，并在第二个月守住了名次。"
 NFP30_PRODUCTION_AWAY_1_TITLE:0 "世界主要生产国中出现新面孔"
 NFP30_PRODUCTION_AWAY_2_BODY:0 "商品为[Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]。入围前三之前排名第[ScriptContainer.GetVariableValue('nfp20_before')|0]，最近为第[ScriptContainer.GetVariableValue('nfp20_after')|0]。连续两个月位居前三。\n\n生产数量和贸易影响力宜分开看。在产量榜上占有一席，还不能证明后者也同样显著。"
 NFP30_PRODUCTION_AWAY_2_LEAD:0 "国外一项重要货品的产量进入全球前三。"
 NFP30_PRODUCTION_AWAY_2_TITLE:0 "海外生产大国在榜上站稳了脚跟"
 NFP30_PRODUCTION_HOME_1_BODY:0 "商品为[Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]。入围前三之前排名第[ScriptContainer.GetVariableValue('nfp20_before')|0]，最近为第[ScriptContainer.GetVariableValue('nfp20_after')|0]。连续两个月位居前三。\n\n这是相当可观的生产成绩。所比较的是产量，利润、出口和工人的处境，另需各自的资料。"
 NFP30_PRODUCTION_HOME_1_LEAD:0 "本国在一项重要货品上，已稳居世界三大生产国之列。"
 NFP30_PRODUCTION_HOME_1_TITLE:0 "我国产量进入世界前三"
 NFP30_PRODUCTION_HOME_2_BODY:0 "商品为[Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]。入围前三之前排名第[ScriptContainer.GetVariableValue('nfp20_before')|0]，最近为第[ScriptContainer.GetVariableValue('nfp20_after')|0]。连续两个月位居前三。\n\n产量名次靠前，是可以量得出的成绩。这份榜却未说明取得它须付多少成本，又给每户人家带来了多少好处。"
 NFP30_PRODUCTION_HOME_2_LEAD:0 "连续两个月进入三大生产国，本报有理由为国内这项产业的成就记上一笔。"
 NFP30_PRODUCTION_HOME_2_TITLE:0 "本国生产跻身世界前列"
 NFP30_PRODUCTION_METRICS:0 "商品为[Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]。入围前三之前排名第[ScriptContainer.GetVariableValue('nfp20_before')|0]，最近为第[ScriptContainer.GetVariableValue('nfp20_after')|0]。连续两个月位居前三。"
 NFP30_PUBLICATION_KIND:0 "[SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp_kind'), '(CFixedPoint)3'), 'NFP30_URGENT', SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp_kind'), '(CFixedPoint)1'), 'NFP30_REGULAR', 'NFP30_MANUAL'))]"
 NFP30_RANK_AWAY_1_BODY:0 "先前地位为[Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]，新的地位为[Localize(ScriptContainer.MakeScope.Var('nfp20_extra_detail').GetFlagName)]。\n\n对我国读者而言，这是世界格局变化的一部分。地位改换，不必然意味着出现了一个新的列强。"
 NFP30_RANK_AWAY_1_LEAD:0 "一国的国际地位如今有变。"
 NFP30_RANK_AWAY_1_TITLE:0 "各国之间，座次有变"
 NFP30_RANK_AWAY_2_BODY:0 "先前地位为[Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]，新的地位为[Localize(ScriptContainer.MakeScope.Var('nfp20_extra_detail').GetFlagName)]。\n\n本报并列新旧两项地位，读者可以看清变化的方向。至于起因和后果，须另作考量。"
 NFP30_RANK_AWAY_2_LEAD:0 "海外来讯，一国所属的国际等级发生变化。"
 NFP30_RANK_AWAY_2_TITLE:0 "国外一国更换国际地位"
 NFP30_RANK_HOME_1_BODY:0 "先前地位为[Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]，新的地位为[Localize(ScriptContainer.MakeScope.Var('nfp20_extra_detail').GetFlagName)]。\n\n这件事本身值得关注。升降要看所列的前后类别，换个等级未必总是向上走。"
 NFP30_RANK_HOME_1_LEAD:0 "我国在国际上的位置获得新的评定。本报列出前后两项地位。"
 NFP30_RANK_HOME_1_TITLE:0 "我国在列国之间换了座次"
 NFP30_RANK_HOME_2_BODY:0 "先前地位为[Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]，新的地位为[Localize(ScriptContainer.MakeScope.Var('nfp20_extra_detail').GetFlagName)]。\n\n本报记录的是地位之变。它因何发生、会给外交带来什么后果，不能只凭新头衔来判断。"
 NFP30_RANK_HOME_2_LEAD:0 "在列国的名单里，我国如今归入了另一档。"
 NFP30_RANK_HOME_2_TITLE:0 "我国迎来新的国际地位"
 NFP30_RANK_METRICS:0 "先前地位为[Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]，新的地位为[Localize(ScriptContainer.MakeScope.Var('nfp20_extra_detail').GetFlagName)]。"
 NFP30_REACH_DOMESTIC:0 "本国事件，或本国作为交战方的事件"
 NFP30_REACH_FROZEN:0 "首都所在战略地区和世界级事件标记，均已在记录事实时保存。"
