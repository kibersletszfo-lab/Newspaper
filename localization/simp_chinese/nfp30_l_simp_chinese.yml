 NFP50_FAMILY_WAR_END_AWAY_END_1:0 "战争结束，评说结果的工作却还在后头。谁得到了想要的、又付了多少代价，要从和约里更仔细地读。对我国来说，值得重新打量交战双方；还凭习惯认为两边都和从前一样，未免过于天真。"
 NFP50_FAMILY_WAR_END_AWAY_END_2:0 "战争结束，评说结果的工作却还在后头。谁得到了想要的、又付了多少代价，要从和约里更仔细地读。对我国来说，值得重新打量交战双方；还凭习惯认为两边都和从前一样，未免过于天真。"
 NFP50_FAMILY_WAR_END_CONTEXT:0 "和平也给各国出了新的题目。战争可以今日结束，它留下的事却可能需要很久才理得清。因此，我们今天便记下好消息，至于怎样评说结果，还是拿和约的条款来核对。"
 NFP50_FAMILY_WAR_END_FACTS:0 "战争已结束。主要当事方为[ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName]与[ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName]。"
 NFP50_FAMILY_WAR_END_HOME_END_1:0 "眼下已经可以报道战争结束。若要为胜利道贺，还需知道议和条件；若要对太平日子怀一分希望，这条消息已经够了。但愿国家下一件需要花大力气的事，是去创造些东西。至于毁坏，历史给我们的机会本来就已太多。"
 NFP50_FAMILY_WAR_END_HOME_END_2:0 "眼下已经可以报道战争结束。若要为胜利道贺，还需知道议和条件；若要对太平日子怀一分希望，这条消息已经够了。但愿国家下一件需要花大力气的事，是去创造些东西。至于毁坏，历史给我们的机会本来就已太多。"
 NFP50_FAMILY_WAR_START_AWAY_END_1:0 "这场战争的后果将越出两座首都。哪一些会落到我国头上，还须看战局。眼下值得留心当事各国及其抉择，而不是按地图上的国名印得有多大来挑选赢家。毕竟，最敢打包票的人，往往是不用为预言负责的人。"
 NFP50_FAMILY_WAR_START_AWAY_END_2:0 "这场战争的后果将越出两座首都。哪一些会落到我国头上，还须看战局。眼下值得留心当事各国及其抉择，而不是按地图上的国名印得有多大来挑选赢家。毕竟，最敢打包票的人，往往是不用为预言负责的人。"
 NFP50_FAMILY_WAR_START_CONTEXT:0 "外交争执已经走到战争这一步。光凭有说服力的话，如今已不够用。话语背后须有人、有补给、有力量。这些都比发表意图声明时写出一句漂亮的话难凑得多。"
 NFP50_FAMILY_WAR_START_FACTS:0 "战端已开。主要当事方为[ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName]与[ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName]。"
 NFP50_FAMILY_WAR_START_HOME_END_1:0 "战争如今成了我们自己的事。开战只需一行字便可报道，此后的一切，一行却再也装不下。但愿早日能付印恢复和平的消息；在那之前，且认真读战报，别急着把希望改写成捷报。"
 NFP50_FAMILY_WAR_START_HOME_END_2:0 "战争如今成了我们自己的事。开战只需一行字便可报道，此后的一切，一行却再也装不下。但愿早日能付印恢复和平的消息；在那之前，且认真读战报，别急着把希望改写成捷报。"
 NFP50_FAMILY_WELCOME_1_1:0 "想要的东西买得到，上工的路走得通，回家还有一份足以过日子的收入，这自然是好事。本版关注货品、拥挤的道路，以及难以接入共同市场的地区。等到困难过去，我们也一定记得登一条好消息。"
 NFP50_FAMILY_WELCOME_1_2:0 "数字再大，也不能自己装满菜篮。报道经济成就的旁边，得给百姓的生计留个位置。平静的月份，还可以翻翻行情；物价自有办法让人关心经济，哪里用得着编辑部提醒。"
 NFP50_FAMILY_WELCOME_2_1:0 "战争牵涉的，远不止在地图上做标记的人。本版将关注战事如何开始、怎样结束，以及我国的同盟与集团成员。在外交危机中，谁提出要求、谁站到一方身后、谁选择退让，也都值得一记。"
 NFP50_FAMILY_WELCOME_2_2:0 "若您选择接收号外，重大消息可单独送上门。本报自然更爱报道谈判成功；但就算是坏消息，及时读到也比等到后果临头才知道要好。"
 NFP50_FAMILY_WELCOME_3_1:0 "人们识不识字，日子过得怎样，竞选期间又发生了什么，都归本版留心。社会之变，有时比地图上的新国界更难察觉。正因如此，那些耳熟能详的地名背后发生了什么，才更值得一看。"
 NFP50_FAMILY_WELCOME_3_2:0 "选举期间，我们会把眼下各党的竞选势头与上期报道比一比。声势再大，离票数还差一回开箱。选前的信心很会传染，本报尽量守住等到计票的耐心。"
 NFP50_FAMILY_WELCOME_4_1:0 "各国的新法、新知识和国际地位的变化，都在这里见报。为自己的成就而自豪很愉快，留心别人的成就也有用处。尤其当我们由此想问，为何自家还没办到同样的事。"
 NFP50_FAMILY_WELCOME_4_2:0 "从封面翻起，可以点进每一篇报道。往期会收入档案，最多保留十二期。有时，已经知道后来怎样，再读当初信心十足的判断，尤其有意思。"
 NFP50_FAMILY_WELCOME_END_1:0 "至此，本报与读者才算刚刚相识。往后我们将一次次回到旧事旁，看看有什么变了。但愿将来让人想翻出一篇令人忧心的旧报道的，常常是新来的一条好消息。\n\n$NFP89_DELIVERY$"
 NFP50_FAMILY_WELCOME_END_2:0 "至此，本报与读者才算刚刚相识。往后我们将一次次回到旧事旁，看看有什么变了。但愿将来让人想翻出一篇令人忧心的旧报道的，常常是新来的一条好消息。\n\n$NFP89_DELIVERY$"
