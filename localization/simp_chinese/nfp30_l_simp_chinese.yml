 NFP30_REACH_MIGRATED:0 "较早的未刊事实在更新时重新确定了首都地区，原来的利益和双方等级已无从得知。"
 NFP30_REACH_OLD:0 "此刊付印时，尚未采用按地区筛选新闻的办法。"
 NFP30_REACH_PRICE_LOCAL:0 "读者国市场的例行行情"
 NFP30_REACH_REGION:0 "收讯和付印时，读者国在该地区的利益等级均不低于2"
 NFP30_REACH_REJECTED:0 "按地区筛选后，暂缓刊登[ScriptContainer.GetVariableValue('nfp31_rejected_region')|0]篇。"
 NFP30_REACH_WORLD:0 "世界性事件：两大列强交战，或获得、失去列强地位"
 NFP30_REASON_PRICES:0 "本期没有新闻入选，故增刊本月物价行情。"
 NFP30_REGULAR:0 "本期月刊"
 NFP30_RUBRIC_1:0 "经济"
