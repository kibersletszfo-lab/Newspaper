 NFP52_FLU_2_TITLE:0 "世界面对新的流行病"
 NFP52_GER_1_BODY:0 "德国已经成为统一国家。“德意志”这个名字读者早就熟悉，如今却得把政治地图重新看一遍。共同的名字背后有了共同的政权。那些惯于拿德国的分裂作打算的人，眼下要换的恐怕不只一本地图册。\n\n德意志国家已经建立，各邦统一成为邻国不得不考虑的政治事实。疆域究竟多广、实力到底多强，可以另文细说。至于还想把德国看作一堆互不相干的小国，如今恐怕晚了。\n\n合成一国是成就，把国家治理起来则是下一桩差事。庆典过后，共同的规矩、各地的生计、同邻邦的关系都得有人料理。地图上已有了这个名字。日后，人们又会因哪些事情想起它？\n\n本报以收到消息的月份记事。传递路上若有耽搁，事情本身可能发生得更早。"
