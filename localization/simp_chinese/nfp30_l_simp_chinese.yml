 NFP52_GER_2_TITLE:0 "德国统一告成"
 NFP52_ITA_1_BODY:0 "意大利统一了。从前可以说它是一片土地、一种文化、一个共赴未来的愿望。如今它也成了一个国家。以统一为志的人可以道贺了，贺词讲完，还得一起想想，往后的日子该怎样过。\n\n意大利国家已经建立。在地中海的政治地图上，出现了一个邻国制定计划时不得不考虑的联合体。过去逐一看待意大利各地的老习惯，如今已解释不了新局面。\n\n政权归一，要操心的事也就归到了一处。一面旗帜，没法让各地的道路、生计和利益立刻相合。好在如今有了一个国家，得为这些事想办法。统一已经办到，接下来且看如何充实它。\n\n本报以收到消息的月份记事。传递路上若有耽搁，事情本身可能发生得更早。"
