 NFP50_FAMILY_BODY:0 "[Localize(ScriptContainer.MakeScope.Var('nfp30_body').GetFlagName)]"
 NFP50_FAMILY_DIVERGENCE_FACTS:0 "过去三个整月间，全年国内生产总值估计从[ScriptContainer.GetVariableValue('nfp20_before')|0]升至[ScriptContainer.GetVariableValue('nfp20_after')|0]，同期平均生活水平下降[ScriptContainer.GetVariableValue('nfp20_extra')|2]点。"
 NFP50_FAMILY_DIVERGENCE_HOME_END_1:0 "经济总量上升，家庭生活未必就宽裕。本报以百姓处境为国事；两项指标为何分道扬镳，值得另作探究。"
 NFP50_FAMILY_DIVERGENCE_HOME_END_2:0 "国家需要的是在日常生活中也感受得到的成就。这些数字本身不能说明生活为何转差，更不能指认应当归咎于谁。"
 NFP50_FAMILY_ELECTION_AGAIN:0 "现在可以把这次竞选与上期报道放在一起看了。有的政党可能更有劲，有的可能在失去势头。数字旁的正负号说的就是这份变动，不能拿来当作将来的票差。"
 NFP50_FAMILY_ELECTION_BASE:0 "[SelectLocalization(GreaterThan_CFixedPoint(ScriptContainer.GetVariableValue('nfp43_previous_issue'), '(CFixedPoint)0'), 'NFP43_ELECTION_BASELINE', 'NFP43_ELECTION_FIRST')]"
 NFP50_FAMILY_ELECTION_END_1:0 "开票以前，仍有一段值得读的竞选故事。本报会接着看下去。选民最终支持谁，编辑部也很想知道；但在那以前，不妨把票留给选民自己投。"
 NFP50_FAMILY_ELECTION_END_2:0 "开票以前，仍有一段值得读的竞选故事。本报会接着看下去。选民最终支持谁，编辑部也很想知道；但在那以前，不妨把票留给选民自己投。"
 NFP50_FAMILY_ELECTION_FIRST:0 "本期是本报比较这轮竞选的起点。谁在加紧脚步，谁在放慢下来，下几次报道里才会逐渐明朗。眼下先认清各方的位置。"
 NFP50_FAMILY_ELECTION_NOTE:0 "这里显示的是选战进展，尚未点算选票。数字比较领先的六个政党的竞选势头，不能读成选民百分比。今日的参选者无论表现得多么胸有成竹，离最终结果仍有一段路。"
 NFP50_FAMILY_ELECTION_TABLE:0 "[Localize(ScriptContainer.MakeScope.Var('nfp43_row_1').GetFlagName)]\n[Localize(ScriptContainer.MakeScope.Var('nfp43_row_2').GetFlagName)]\n[Localize(ScriptContainer.MakeScope.Var('nfp43_row_3').GetFlagName)]\n[Localize(ScriptContainer.MakeScope.Var('nfp43_row_4').GetFlagName)]\n[Localize(ScriptContainer.MakeScope.Var('nfp43_row_5').GetFlagName)]\n[Localize(ScriptContainer.MakeScope.Var('nfp43_row_6').GetFlagName)]"
 NFP50_FAMILY_EXPECTED:0 "报道时平均生活水平为[ScriptContainer.GetVariableValue('nfp50_family_sol')|2]，平均预期水平为[ScriptContainer.GetVariableValue('nfp50_family_expected_sol')|2]。实际低于预期，这又给了我们一个仔细看看居民处境的理由。"
 NFP50_FAMILY_GAINED_ALLIANCE_1_1:0 "我国有了正式盟友：[ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName]。从前的共同打算，如今有了约定作凭。身边有人愿意谈些分歧以外的事，当然可喜。接下来且看双方能不能在实事上也谈得拢。"
 NFP50_FAMILY_GAINED_ALLIANCE_1_2:0 "结盟值得的，不只是一轮客套。它有多少用处，要从具体决定和履行义务上看。条约上盖章是个好开头，但愿合作别就此收尾。"
 NFP50_FAMILY_GAINED_ALLIANCE_2_1:0 "我国有了正式盟友：[ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName]。从前的共同打算，如今有了约定作凭。身边有人愿意谈些分歧以外的事，当然可喜。接下来且看双方能不能在实事上也谈得拢。"
 NFP50_FAMILY_GAINED_ALLIANCE_2_2:0 "结盟值得的，不只是一轮客套。它有多少用处，要从具体决定和履行义务上看。条约上盖章是个好开头，但愿合作别就此收尾。"
 NFP50_FAMILY_GAINED_BLOC_1_1:0 "我国与[ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName]如今同属一个国家集团，交往的圈子已有变化。不妨先不猜是谁说服了谁加入，更要紧的是，同处一个集团能让两边一起做成什么。"
 NFP50_FAMILY_GAINED_BLOC_1_2:0 "同一面旗帜还不能代替共同的工作。即便未另外缔结军事同盟，也有值得坐下来谈的事情。但愿相识之后，还有机会商量些有益于双方的正事。"
 NFP50_FAMILY_GAINED_BLOC_2_1:0 "我国与[ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName]如今同属一个国家集团，交往的圈子已有变化。不妨先不猜是谁说服了谁加入，更要紧的是，同处一个集团能让两边一起做成什么。"
 NFP50_FAMILY_GAINED_BLOC_2_2:0 "同一面旗帜还不能代替共同的工作。即便未另外缔结军事同盟，也有值得坐下来谈的事情。但愿相识之后，还有机会商量些有益于双方的正事。"
 NFP50_FAMILY_GROWTH:0 "两次观察之间，全年国内生产总值估计增长了[ScriptContainer.GetVariableValue('nfp50_family_gdp_growth')|2]%。说的是经济的大小，并非每一户人家的收入。"
 NFP50_FAMILY_INTRO:0 "[Localize(ScriptContainer.MakeScope.Var('nfp30_lead').GetFlagName)]"
 NFP50_FAMILY_LAW_AWAY_END_1:0 "本报读者得以观察别国生活的变化。目前确认的是新规已施行，它会带来什么影响还有待评估。"
 NFP50_FAMILY_LAW_AWAY_END_2:0 "现有消息还不足以断言改革出自议会投票，也不能许诺某种结果。法律的实际效果值得另外观察。"
 NFP50_FAMILY_LAW_FACTS:0 "新法《[Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]》已经生效。"
 NFP50_FAMILY_LAW_HOME_END_1:0 "编辑部报道的是变化本身。法律经由何种途径通过、将怎样改变人们的生活，这则消息尚未说明。"
 NFP50_FAMILY_LAW_HOME_END_2:0 "要评估改革成效，需要时间与施行后的消息。本报不会把法律生效写成社会目标已经实现。"
 NFP50_FAMILY_LOST_ALLIANCE_1_1:0 "从前同[ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName]的盟约已不复存在。凡是曾将这一同盟算进来的计划，都值得回头再看。变化的缘由还待细究，旧有约定却已不能凭习惯继续指望。"
 NFP50_FAMILY_LOST_ALLIANCE_1_2:0 "如今有必要更仔细地看看自家的力量。即刻宣布昔日盟友已经成为永远的敌人，同指望它仍必定来援一样仓促。外交需要好记性，尤其要记得哪些事已经变了。"
 NFP50_FAMILY_LOST_ALLIANCE_2_1:0 "从前同[ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName]的盟约已不复存在。凡是曾将这一同盟算进来的计划，都值得回头再看。变化的缘由还待细究，旧有约定却已不能凭习惯继续指望。"
 NFP50_FAMILY_LOST_ALLIANCE_2_2:0 "如今有必要更仔细地看看自家的力量。即刻宣布昔日盟友已经成为永远的敌人，同指望它仍必定来援一样仓促。外交需要好记性，尤其要记得哪些事已经变了。"
 NFP50_FAMILY_LOST_BLOC_1_1:0 "我国与[ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName]如今已不同属一个国家集团，昔日共有的圈子留在了上期简报里。变动的可能是任一方，也可能是集团本身。无论如何，眼下这个结果对我们的打算都有分量。"
 NFP50_FAMILY_LOST_BLOC_1_2:0 "能够一同作盘算的依据少了一项。两国另外订立的条约另当别论，须逐条看其实质。难道只因新图还没来得及挂上墙，就继续拿旧的外交格局指路？"
 NFP50_FAMILY_LOST_BLOC_2_1:0 "我国与[ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName]如今已不同属一个国家集团，昔日共有的圈子留在了上期简报里。变动的可能是任一方，也可能是集团本身。无论如何，眼下这个结果对我们的打算都有分量。"
 NFP50_FAMILY_LOST_BLOC_2_2:0 "能够一同作盘算的依据少了一项。两国另外订立的条约另当别论，须逐条看其实质。难道只因新图还没来得及挂上墙，就继续拿旧的外交格局指路？"
 NFP50_FAMILY_PRICE_CORE:0 "[SelectLocalization(GreaterThan_CFixedPoint(ScriptContainer.GetVariableValue('nfp32_rows'), '(CFixedPoint)0'), 'NFP30_PRICE_MARKET', 'NFP30_PRICE_UNAVAILABLE')]\n\n[Localize(ScriptContainer.MakeScope.Var('nfp32_row_1').GetFlagName)]\n[Localize(ScriptContainer.MakeScope.Var('nfp32_row_2').GetFlagName)]\n[Localize(ScriptContainer.MakeScope.Var('nfp32_row_3').GetFlagName)]\n[Localize(ScriptContainer.MakeScope.Var('nfp32_row_4').GetFlagName)]\n[Localize(ScriptContainer.MakeScope.Var('nfp32_row_5').GetFlagName)]\n[Localize(ScriptContainer.MakeScope.Var('nfp32_row_6').GetFlagName)]"
