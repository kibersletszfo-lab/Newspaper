 NFP43_FRONT_PAGE:0 "头版"
 NFP43_THIS_ISSUE:0 "本期要闻"
 NFP43_THIS_ISSUE_URGENT:0 "本期要闻 · 号外"
 NFP43_WELCOME_1_BODY:0 "想要的东西买得到，上工的路走得通，回家还有一份足以过日子的收入，这自然是好事。本版关注货品、拥挤的道路，以及难以接入共同市场的地区。等到困难过去，我们也一定记得登一条好消息。\n\n数字再大，也不能自己装满菜篮。报道经济成就的旁边，得给百姓的生计留个位置。平静的月份，还可以翻翻行情；物价自有办法让人关心经济，哪里用得着编辑部提醒。"
 NFP43_WELCOME_1_LEAD:0 "欢迎翻开经济版。我们希望趁困难还没有成为习惯，就注意到它。"
 NFP43_WELCOME_1_TITLE:0 "经济的起点，在报表之外"
 NFP43_WELCOME_2_BODY:0 "战争牵涉的，远不止在地图上做标记的人。本版将关注战事如何开始、怎样结束，以及我国的同盟与集团成员。在外交危机中，谁提出要求、谁站到一方身后、谁选择退让，也都值得一记。\n\n若您选择接收号外，重大消息可单独送上门。本报自然更爱报道谈判成功；但就算是坏消息，及时读到也比等到后果临头才知道要好。"
 NFP43_WELCOME_2_LEAD:0 "本版留意战端的开启与终结，也留意动摇国家安全处境的变化。"
 NFP43_WELCOME_2_TITLE:0 "在条约和大炮之间"
 NFP43_WELCOME_3_BODY:0 "人们识不识字，日子过得怎样，竞选期间又发生了什么，都归本版留心。社会之变，有时比地图上的新国界更难察觉。正因如此，那些耳熟能详的地名背后发生了什么，才更值得一看。\n\n选举期间，我们会把眼下各党的竞选势头与上期报道比一比。声势再大，离票数还差一回开箱。选前的信心很会传染，本报尽量守住等到计票的耐心。"
 NFP43_WELCOME_3_LEAD:0 "从教育的成就，到我国百姓生活里的变化，本版都留有篇幅。"
 NFP43_WELCOME_3_TITLE:0 "国家，也就是生活在其中的人"
 NFP43_WELCOME_4_BODY:0 "各国的新法、新知识和国际地位的变化，都在这里见报。为自己的成就而自豪很愉快，留心别人的成就也有用处。尤其当我们由此想问，为何自家还没办到同样的事。\n\n从封面翻起，可以点进每一篇报道。往期会收入档案，最多保留十二期。有时，已经知道后来怎样，再读当初信心十足的判断，尤其有意思。"
 NFP43_WELCOME_4_LEAD:0 "本版收录国家大事、知识进展和重要的国外消息。"
 NFP43_WELCOME_4_TITLE:0 "熟悉的天地之外"
 NFP43_WELCOME_METRICS:0 "订阅导读，不代表新事件。四个版面供读者熟悉，后续各期通常刊载的内容取决于订阅。各项观察继续累计。若无可比的先前记录，则不计算变化。"
