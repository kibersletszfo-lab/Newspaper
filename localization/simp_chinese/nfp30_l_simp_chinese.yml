 NFP50_FAMILY_SHORTAGE_FACTS:0 "商品为[Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]。连续两次月度观察中，我国市场均出现短缺。"
 NFP50_FAMILY_SHORTAGE_HOME_END_1:0 "这件货品的供给和市场消费均值得细查。本次说的是货品不足；价格是否高昂，则应另看。"
 NFP50_FAMILY_SHORTAGE_HOME_END_2:0 "市场短缺已经确认，具体原因尚未查明。凭现有资料还不能指认应由谁负责，也不能保证建起哪一座设施便会见效。"
 NFP50_FAMILY_SHORTAGE_RECOVERY_FACTS:0 "商品为[Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]。自本报预警以来，连续两份月度记录都未发现先前的短缺。"
 NFP50_FAMILY_SHORTAGE_RECOVERY_HOME_END_1:0 "本报记录的是旧有短缺标记消失。这还不是低价的许诺，价钱贵和东西少，是两个不同的问题。"
 NFP50_FAMILY_SHORTAGE_RECOVERY_HOME_END_2:0 "较好的局面已持续两个月。本报仍会分别看待“有没有货”和“买不买得起”，这条消息尚不能确认后者。"
 NFP50_FAMILY_SOL:0 "同期平均生活水平由[ScriptContainer.GetVariableValue('nfp50_family_sol_before')|2]变为[ScriptContainer.GetVariableValue('nfp50_family_sol')|2]。这里是全国的平均数，各阶层、各地区的处境可能不同。"
 NFP50_FAMILY_TECH_ANILINE_1:0 "本国如今可以兴建合成材料厂，用工业方法制造染料。对于纺织业，这是一项新机会：日后布料用什么颜色，不必那么听原料产地的安排。"
 NFP50_FAMILY_TECH_ANILINE_2:0 "制造染料需要硫磺和化肥。新技术改变了供货这一长串环节，并没有把它们变没。那些好看的颜色，原来也有些颇出人意表的产业亲戚。"
 NFP50_FAMILY_TECH_ANTIBIOTICS_1:0 "国家有了扩大医疗卫生服务的机会。医疗知识之所以值得关注，首先因为它关乎百姓一个再平常不过的愿望——好起来。如今这愿望多了一点凭据，至于把医护办起来，经费仍须张罗。"
 NFP50_FAMILY_TECH_ANTIBIOTICS_2:0 "疫情对收成的打击将会减弱。这是新知识实在的经济用处。疾病扰乱生活，影响可以远超病房四壁；对付它的办法也能帮上日常劳作，总令人欣慰。"
 NFP50_FAMILY_TECH_AWAY_END_1:0 "对方的本领多了一门，我国也值得看看自家已有些什么、用得如何。贺信可以等到邮班再发，有用的念头不妨当场留下。"
 NFP50_FAMILY_TECH_AWAY_END_2:0 "对方的本领多了一门，我国也值得看看自家已有些什么、用得如何。贺信可以等到邮班再发，有用的念头不妨当场留下。"
 NFP50_FAMILY_TECH_BESSEMER_PROCESS_1:0 "钢铁厂现在可以采用贝塞麦炼钢法，提高钢的产量。若一个国家用金属并非只为给自己的成功铸纪念像，这当然是个有用的机会。"
 NFP50_FAMILY_TECH_BESSEMER_PROCESS_2:0 "新工艺在煤耗相同的情况下需要更多的铁。技术向前一步，并不免除供货的功课。为将来的钢高兴以前，还得先备齐拿来炼钢的东西。"
 NFP50_FAMILY_TECH_ELECTRICAL_GENERATION_1:0 "如今可以建造发电厂，经济又添了一种动力来源。眼下这仍是一门须配上厂房和供给的知识，但展望日后的企业，目光已可以多看一层。"
 NFP50_FAMILY_TECH_ELECTRICAL_GENERATION_2:0 "城市将有条件改用电力街灯，这得有本地的电可用。变化将是字面上“看得见”的：等人们谈完光明的前途，且看街上何时真的亮起来。"
 NFP50_FAMILY_TECH_ELECTRIC_TELEGRAPH_1:0 "军事知识中增添了电报。这个国家由此多了一种承受战争重负的办法。这条消息的用处，不只在于让军务简报上多一个看起来气派的词。"
 NFP50_FAMILY_TECH_ELECTRIC_TELEGRAPH_2:0 "伤亡对全国厌战程度的影响将有所减轻。这说的是承担重负的能力，失去的人却不会因这门知识回来。只愿这项有用的军中新本领，别有太多机会在实战中验证。"
 NFP50_FAMILY_TECH_FACTS:0 "该国如今已掌握“[Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]”。"
 NFP50_FAMILY_TECH_HOME_END_1:0 "知道的更多了，还得用得明白。我国既有理由自豪，也有正事可做。本报希望下次能写写靠新知识办成了什么。列一张机会清单固然愉快，真用上它，总归更好。"
 NFP50_FAMILY_TECH_HOME_END_2:0 "知道的更多了，还得用得明白。我国既有理由自豪，也有正事可做。本报希望下次能写写靠新知识办成了什么。列一张机会清单固然愉快，真用上它，总归更好。"
 NFP50_FAMILY_TECH_KNOWN:0 "我国已经掌握这项知识，如今另一个国家也可以使用。双方接下来怎样运用所知，比谁记得更多更值得看；对经济而言，实际应用通常比考记性有趣。"
 NFP50_FAMILY_TECH_QUININE_1:0 "奎宁有助于克服普通疟疾对殖民推进的阻碍。重症疟疾仍是另外的难题。地图上有了更多可能，但若说一味药就让当地所有困难都消失，恐怕太过天真。"
 NFP50_FAMILY_TECH_QUININE_2:0 "如今有条件扩大医疗服务和殖民管理，相应的额外经费仍待拨付。药物拓宽了这个国家可以做到的事，轮到国库和各级官署仔细盘算了。"
 NFP50_FAMILY_TECH_RAILWAYS_1:0 "如今可以建设铁路。城市之间的距离不会因此凭空缩短，但跨越这段距离、运输货物有了新的办法。铁轨到底还得铺到地上；画出来的一条线，在经济里可不如真的铁轨好使。"
 NFP50_FAMILY_TECH_RAILWAYS_2:0 "矿井可以采用铁路运输，使用这种方式还得备有运输服务。能多开采一些，自是好事。只愿采出来以后，别又才发觉没有东西能把它运走。"
 NFP50_FAMILY_TECH_STEAM_DONKEY_1:0 "伐木场和矿井可以将辅助作业机械化。过去须靠人手的一部分活计，蒸汽也能接过去。经济又多了一种应付繁重劳动的办法。"
 NFP50_FAMILY_TECH_STEAM_DONKEY_2:0 "机械化需要发动机，所需的普通劳工则减少。对企业而言，节省劳动是好机会。对工人意味着什么，要看还有没有别的工作可做。替机器找个位置，有时比替人找个位置容易。"
 NFP50_FAMILY_TECH_STEELWORKING_1:0 "当地得以兴建钢铁厂，新的生产机会有了根基。钢字写进知识目录，只是开头；要有真正可用的钢，还须厂房、工人和劳动。"
 NFP50_FAMILY_TECH_STEELWORKING_2:0 "工具作坊将能采用铸铁。一件常见的工具，生产的来历也许将有所不同。但作坊还得选用新方法，并准备好材料；只听说过它们，工具不会自己换个造法。"
 NFP50_FAMILY_TECH_UNKNOWN:0 "我国尚未掌握这门知识，因而在此领域，对方已经领先。希望日后能拿我们自己的成果作答。解释他人的发现为何不重要，倒是无须研究也能做到，只是用处小些。"
 NFP50_FAMILY_WAR_ALLIANCE_1_1:0 "盟友[ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName]成为新战争的防守方，发起方为[ScriptContainer.MakeScope.Var('nfp20_extra_detail').GetCountryDefinition.GetName]。这条消息直接牵涉我国外交：卷入战事的，是同我国订立盟约的国家。"
 NFP50_FAMILY_WAR_ALLIANCE_1_2:0 "眼下，要将盟约上的约定同一场真实的战争对照着读。消息本身不表示我国已经参战，却也不宜把它塞进遥远的海外杂闻。同盟不只是在彼此道贺方便的时候才值得想起。"
 NFP50_FAMILY_WAR_ALLIANCE_2_1:0 "盟友[ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName]成为新战争的防守方，发起方为[ScriptContainer.MakeScope.Var('nfp20_extra_detail').GetCountryDefinition.GetName]。这条消息直接牵涉我国外交：卷入战事的，是同我国订立盟约的国家。"
 NFP50_FAMILY_WAR_ALLIANCE_2_2:0 "眼下，要将盟约上的约定同一场真实的战争对照着读。消息本身不表示我国已经参战，却也不宜把它塞进遥远的海外杂闻。同盟不只是在彼此道贺方便的时候才值得想起。"
 NFP50_FAMILY_WAR_BLOC_1_1:0 "我国的集团伙伴[ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName]受到攻击，对峙的发起方为[ScriptContainer.MakeScope.Var('nfp20_extra_detail').GetCountryDefinition.GetName]。这场战事牵涉同我们一道作打算的圈子，有理由用比寻常好奇更认真的目光来读。"
