 NFP52_TAIPING_2_TITLE:0 "中国危局中新政权出现"
 NFP52_YUG_1_BODY:0 "巴尔干半岛出现了南斯拉夫国家。共建一国的想法，已经有了政治形式。各国筹划国际事务时常把目光投到这个地区，如今盘算时，又多了一个国家要算进去。\n\n南斯拉夫成立已获证实，南部斯拉夫人的联合已写上政治地图。哪些土地在其境内，同邻邦如何相处，都值得细看。至少，不能再把过去对巴尔干的判断照抄进今天的报道。\n\n共用一个名字，是共同办事的开端。等到欢庆散去，各地不同的利益还得在平日里慢慢协调。但愿统一有益的不只是绘图的人。百姓得住进新的国境里，可不是站在远处欣赏它。\n\n本报以收到消息的月份记事。传递路上若有耽搁，事情本身可能发生得更早。"
