 NFP52_PANAMA_2_TITLE:0 "巴拿马运河竣工"
 NFP52_ROM_1_BODY:0 "罗马尼亚统一已成事实。欧洲诸国往日须同数个公国分别打交道，如今有了共同的权力中心。对支持统一的人，这是重要的成果；对邻邦，则是该重新盘算的理由。\n\n罗马尼亚诸公国有了共同的政权。独立与日后疆界仍须分别讨论，这一变化本身却已相当重大。毋须让今天的一条新闻，独自回答这个国家今后全部的历史。\n\n庆贺过后，统一的政权也要开门处理日常事务了。共同的中心有了处理共同难题的权力，也就有了对成效负责的义务。但愿人们以后的生活，能给这庄重的开端续上一段相称的下文。\n\n本报以收到消息的月份记事。传递路上若有耽搁，事情本身可能发生得更早。"
