 NFP52_ETH_1_BODY:0 "埃塞俄比亚完成统一。过去权力中心分立的局面，如今有了共同的国家体制。对当地居民，这是新秩序的开端；对邻国，这是今后不得不算进去的变数。\n\n埃塞俄比亚统一的消息已获证实。共同的政权得以代表新国家说话，各地能联结得多么紧密，还待往后的生活检验。但统一本身已成事实，无论它离我国边界有多远，都值得一读。\n\n共同的政权有了共同的差事。把政治上的成就化为稳固的治国之道，未必比统一本身容易。我们将继续关注这份答卷，但愿新的局面能给当地人的生活带来新的出路。\n\n本报以收到消息的月份记事。传递路上若有耽搁，事情本身可能发生得更早。"
