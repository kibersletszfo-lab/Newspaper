 NFP30_PRICE_FIRST:0 "这些货品尚无上月的可比记录。本表仅列最近观察到的价格。"
 NFP30_PRICE_LEAD_1:0 "本期且来看看市面行情。版面虽无重大消息，平静月份的价钱也值得留心。尤其是在柜台前自己掏钱的时候。"
 NFP30_PRICE_LEAD_2:0 "本期且来看看市面行情。版面虽无重大消息，平静月份的价钱也值得留心。尤其是在柜台前自己掏钱的时候。"
 NFP30_PRICE_MARKET:0 "市场：[ScriptContainer.MakeScope.Var('nfp32_market_owner').GetCountryDefinition.GetName]。"
 NFP30_PRICE_METHOD:0 "取连续两个月度记录中价格变动最大的至多六种货品。箭头自上期价格指向最新价格，括号内为变动量。新增货品仅列最新价格。数值为市场价格，并非各地区当地价格或整月均价。"
 NFP30_PRICE_METRICS:0 "本期用例行行情填补空缺，共[ScriptContainer.GetVariableValue('nfp32_rows')|0]行，含[ScriptContainer.GetVariableValue('nfp32_comparisons')|0]项比较。每个日历月记录一次，同月的周刊使用同一记录。更换市场或缺失记录会中断比较。价格由商品基础价格及游戏中的市场价格偏差推得。各行数值与次序在付印时保留。"
