 NFP52_CAN_2_TITLE:0 "加拿大各地共建一国"
 NFP52_CHINA_1_BODY:0 "中国失去了先前的国家统一。地图上那片熟悉的辽阔土地，如今已有多个权力中心。对外交官而言，这是几处新地址。对必须跨过新边界谋生的人来说，则得先问一句：从前谈妥的事情，还有几件算数？\n\n昔日统一的政权已经瓦解。各个政府须决定如何彼此相处，世界各国也须弄清如今该同谁交涉。中国这个名字，读者人人都认得；若问谁能代表它说话，答案便比从前难得多。\n\n新地图的背后，日子还得过。当局忙着分清谁的规矩算数，百姓却仍得有活干、有生意做、有规矩可循。中国的分裂将走向何处，还有待时间分晓。只盼为摸索出路付账的人，并非最无力左右局势的那些人。\n\n本报以收到消息的月份记事。传递路上若有耽搁，事情本身可能发生得更早。"
