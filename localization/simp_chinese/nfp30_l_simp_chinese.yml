 NFP62_PORT_PM_END_SELECT:0 "[SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp60_port_pm_seen'), '(CFixedPoint)1'), 'NFP62_PM_END', 'NFP62_URBAN_PM_END_SELECT')]"
 NFP62_PORT_STAFF:0 "本报追踪的港口如今有更多岗位补上了人手。"
 NFP62_PORT_STAFF_END_SELECT:0 "[SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp60_st_port_staffup'), '(CFixedPoint)1'), 'NFP62_STAFF_END', 'NFP50_EMPTY')]"
 NFP62_PORT_WORK:0 "港口有工程完工。就当地同国内其他地区的联系而言，这一笔值得注意；不过，竣工的港口还说不尽全部的运输故事。"
 NFP62_RAIL_PM:0 "铁路调整过运营方式。"
 NFP62_RAIL_STAFF:0 "本报追踪的铁路如今有更多岗位补上了人手。"
 NFP62_RAIL_WORK:0 "观察期间，当地有铁路新建或扩建工程完工。过去那个“如何接入全国经济”的问题身旁，如今多了一项摸得着的变化：铁路能做的事情更多了。"
 NFP62_REMAINING:0 "不过还有一桩麻烦：当地基础设施仍然过载。市场接入度改善了，网络本身却没有变得更宽松。好消息仍然是好消息，只是相邻的另一个问题，还不宜一并划掉。"
 NFP62_STAFF_END:0 "设施还没学会自行运转。因而，这段故事里能够上工的人，绝不是无关紧要的小节。"
 NFP62_STAFF_END_SELECT:0 "[SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp60_st_rail_staffup'), '(CFixedPoint)1'), 'NFP62_STAFF_END', 'NFP62_PORT_STAFF_END_SELECT')]"
 NFP62_TITLE:0 "地区是自家的，市场也终于是了"
 NFP62_UNKNOWN:0 "但留下的运力和负荷记录，尚不足以给出一个明白的解释。好转确有其事，应该谢谁仍无现成答案。且等看懂了这场竞赛，再宣布谁是赢家。"
 NFP62_URBAN_PM:0 "城市经济调整过经营方式。"
 NFP62_URBAN_PM_END_SELECT:0 "[SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp60_urban_pm_seen'), '(CFixedPoint)1'), 'NFP62_PM_END', 'NFP50_EMPTY')]"
 NFP62_URBAN_WORK:0 "城市经济也在扩展。它未必有一辆机车或一艘大船那样醒目，可当地的日子也不全靠长途运输。"
 NFP63_ALLY:0 "这是盟友的消息。结有盟约，也值得弄清伙伴正在经历什么，彼此知道对方能做些什么，约定才更有着落。"
 NFP63_ATT_1:0 "该国政府对我国抱有敌意。对于那里发生的事，不妨少些幻想；对方未必打算为我们预备一个客气的解释。"
 NFP63_ATT_10:0 "这个属国对我国保持忠诚。它自己的难题，也就更没有理由被我们当作无足轻重。"
 NFP63_ATT_11:0 "属国有摆脱从属的意愿。它的消息因此更值得细读；按惯例姑且放心，在这里恐怕不再是好主意。"
 NFP63_ATT_2:0 "对方对我国显出好战的态度。取笑外国的事容易，等到后果来到边界再收拾，可就难了。"
 NFP63_ATT_3:0 "对方希望使我国居于其下。邻人的关怀也有许多种，这一种，最好别漏读了小字。"
 NFP63_ATT_4:0 "对方对我国抱有戒心。彼此的猜想不妨拿实际行动核对，别抢先当成已经查明的计划。"
 NFP63_ATT_5:0 "对方目前未对我国表现出特别的兴趣。那里的消息仍值得读，却也不必每一行都寻出一句暗中写给我国的话。"
 NFP63_ATT_6:0 "对方有意同我国和解。观察彼方的变化，终于可以不必每次都先从抽屉里拿出外交上的讥刺。"
 NFP63_ATT_7:0 "该国政府愿意同我国合作。但愿这份善意往后还能找到共同可办的事。"
 NFP63_ATT_8:0 "对方对我国态度友好。例行的挖苦可以免了；事实的锋芒，不会因此就磨平。"
 NFP63_ATT_9:0 "对方愿意做我国的保护者。这份善意当然可喜，不过受人照顾到什么程度、又保有多少自主，仍须分清。"
 NFP63_BAND_NEG1:0 "两国关系还有不少改善的余地。一两句讥诮也许能给读者解闷，却不能替我们解释发生了什么。"
 NFP63_BAND_NEG2:0 "两国关系冷淡。面对这条新闻，热情的话不多，可值得细究的理由并不少。"
 NFP63_BAND_NEG3:0 "两国关系已是公然敌对。想来对方也没等着读本报的恭维。可惜我们再缺少好感，事实还是那个事实。"
 NFP63_BAND_POS1:0 "两国关系容得下平静的交谈。看别人的变化，不妨先省去那道惯例：还没细读，就开始找毛病。"
 NFP63_BAND_POS2:0 "两国关系良好。带着善意读到那里的消息，令人愉快；交情归交情，事情的来龙去脉照样得弄清。"
 NFP63_BAND_POS3:0 "两国关系尤其亲睦。但愿值得道贺的事情更多些；若是坏消息，也更值得仔细读来。"
 NFP63_BAND_ZERO:0 "两国既谈不上亲热，也未公开敌对。我们可以先看消息本身，不必把篇幅花在外交辞令上。"
 NFP63_BLOC:0 "该国与我国同属一个国家集团。事情发生的地方纵然很远，也关乎我们共有的外交圈。"
