l_german:
 NFP20_ACCESS:0 "Dauerhaft geringer Marktzugang\nLänderdefinition: [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName]. Beobachtung: [ScriptContainer.GetVariableValue('nfp20_year')|0], Monat [Add_CFixedPoint(ScriptContainer.GetVariableValue('nfp20_month'), '(CFixedPoint)1')|0].\nRegion: [ScriptContainer.MakeScope.Var('nfp20_region').GetStateRegion.GetName]. Der Marktzugang liegt seit zwei Monaten unter 90%; aktueller Anteil: [ScriptContainer.GetVariableValue('nfp20_after')|3]. Die Ursache ist unbekannt: Örtlicher Infrastrukturmangel, Seeverbindungen und andere Beschränkungen müssen gesondert untersucht werden.\nAuswahl: [Localize(ScriptContainer.MakeScope.Var('nfp20_reason').GetFlagName)]. Fakt Nr. [ScriptContainer.GetVariableValue('nfp20_id')|0]."
 NFP20_ACCESS_RECOVERY:0 "Fortsetzung: Der Marktzugang hat sich verbessert\nLänderdefinition: [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName]. Beobachtung: [ScriptContainer.GetVariableValue('nfp20_year')|0], Monat [Add_CFixedPoint(ScriptContainer.GetVariableValue('nfp20_month'), '(CFixedPoint)1')|0].\nRegion: [ScriptContainer.MakeScope.Var('nfp20_region').GetStateRegion.GetName]. Nach dem veröffentlichten Problem zeigen zwei aufeinanderfolgende Beobachtungen mindestens 90% Marktzugang. Anteil: [ScriptContainer.GetVariableValue('nfp20_before')|3] → [ScriptContainer.GetVariableValue('nfp20_after')|3].\nAuswahl: [Localize(ScriptContainer.MakeScope.Var('nfp20_reason').GetFlagName)]. Fakt Nr. [ScriptContainer.GetVariableValue('nfp20_id')|0]."
 NFP20_COVER_TEXT:0 "Redaktionsbericht\nArtikel: [ScriptContainer.GetVariableValue('nfp20_article_count')|0]. Zahlen und Wortlaut bleiben an diese Ausgabe gebunden.\n\nBeobachtungsverlauf: [ScriptContainer.GetVariableValue('nfp20_history_count')|0] Punkte; Vergleich über [ScriptContainer.GetVariableValue('nfp20_summary_intervals')|0] Intervalle (höchstens 12).\nPrognostiziertes jährliches BIP: [ScriptContainer.GetVariableValue('nfp20_summary_before')|0] → [ScriptContainer.GetVariableValue('nfp20_summary_after')|0].\n\nFehlen Artikel, haben sich für die eingeschalteten Ressorts noch keine bestätigten Nachrichten angesammelt. Ältere Fakten tragen stets ihr Beobachtungsdatum."
 NFP20_DIAGNOSTICS:0 "Redaktionsdiagnose bei Veröffentlichung\nNoch in der Warteschlange: [ScriptContainer.GetVariableValue('nfp20_queue_remaining')|0]; insgesamt wegen Überlaufs ausgelassen: [ScriptContainer.GetVariableValue('nfp20_dropped')|0].\nFür diese Ausgabe nicht gewählt: überholtes Problem [ScriptContainer.GetVariableValue('nfp20_rejected_obsolete')|0]; Ressort ausgeschaltet [ScriptContainer.GetVariableValue('nfp20_rejected_rubric')|0]; nicht dringend [ScriptContainer.GetVariableValue('nfp20_rejected_urgent')|0]; Typenlimit [ScriptContainer.GetVariableValue('nfp20_rejected_cap')|0]; zu wenig Platz [ScriptContainer.GetVariableValue('nfp20_rejected_space')|0]."
 NFP20_DIVERGENCE:0 "Wirtschaftswachstum und Lebensstandard laufen auseinander\nLänderdefinition: [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName]. Beobachtung: [ScriptContainer.GetVariableValue('nfp20_year')|0], Monat [Add_CFixedPoint(ScriptContainer.GetVariableValue('nfp20_month'), '(CFixedPoint)1')|0].\nÜber drei vollständige Monatsintervalle stieg das prognostizierte jährliche BIP: [ScriptContainer.GetVariableValue('nfp20_before')|0] → [ScriptContainer.GetVariableValue('nfp20_after')|0]. Der durchschnittliche Lebensstandard sank um [ScriptContainer.GetVariableValue('nfp20_extra')|2] Punkte. Diese Zahlen beschreiben den Unterschied, belegen aber nicht seine Ursache.\nAuswahl: [Localize(ScriptContainer.MakeScope.Var('nfp20_reason').GetFlagName)]. Fakt Nr. [ScriptContainer.GetVariableValue('nfp20_id')|0]."
 NFP20_GDP_LEADER:0 "Ein neues Land unter den ersten zehn nach BIP\nLänderdefinition: [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName]. Beobachtung: [ScriptContainer.GetVariableValue('nfp20_year')|0], Monat [Add_CFixedPoint(ScriptContainer.GetVariableValue('nfp20_month'), '(CFixedPoint)1')|0].\nFrüherer Platz außerhalb der ersten zehn: [ScriptContainer.GetVariableValue('nfp20_before')|0]. Aktueller Rang: [ScriptContainer.GetVariableValue('nfp20_after')|0]. Das Land gehört seit zwei Monatsbeobachtungen zu den ersten zehn. Gemessen wird das prognostizierte jährliche BIP, nicht der Gewinn oder der Wohlstand der Bevölkerung.\nAuswahl: [Localize(ScriptContainer.MakeScope.Var('nfp20_reason').GetFlagName)]. Fakt Nr. [ScriptContainer.GetVariableValue('nfp20_id')|0]."
 NFP20_INFRA:0 "Infrastruktur unter Belastung\nLänderdefinition: [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName]. Beobachtung: [ScriptContainer.GetVariableValue('nfp20_year')|0], Monat [Add_CFixedPoint(ScriptContainer.GetVariableValue('nfp20_month'), '(CFixedPoint)1')|0].\nRegion: [ScriptContainer.MakeScope.Var('nfp20_region').GetStateRegion.GetName]. Die Infrastrukturbilanz ist seit zwei Monaten negativ. Letzte Bilanz: [ScriptContainer.GetVariableValue('nfp20_after')|2]. Das gibt Anlass, das örtliche Verkehrsnetz und seine Belastung zu prüfen.\nAuswahl: [Localize(ScriptContainer.MakeScope.Var('nfp20_reason').GetFlagName)]. Fakt Nr. [ScriptContainer.GetVariableValue('nfp20_id')|0]."
 NFP20_INFRA_RECOVERY:0 "Fortsetzung: Infrastrukturbilanz wiederhergestellt\nLänderdefinition: [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName]. Beobachtung: [ScriptContainer.GetVariableValue('nfp20_year')|0], Monat [Add_CFixedPoint(ScriptContainer.GetVariableValue('nfp20_month'), '(CFixedPoint)1')|0].\nRegion: [ScriptContainer.MakeScope.Var('nfp20_region').GetStateRegion.GetName]. Seit der veröffentlichten Warnung ist die Bilanz in zwei aufeinanderfolgenden Beobachtungen nichtnegativ: [ScriptContainer.GetVariableValue('nfp20_before')|2] → [ScriptContainer.GetVariableValue('nfp20_after')|2]. Eine bestätigte Verbesserung, keine Garantie gegen neue Probleme.\nAuswahl: [Localize(ScriptContainer.MakeScope.Var('nfp20_reason').GetFlagName)]. Fakt Nr. [ScriptContainer.GetVariableValue('nfp20_id')|0]."
 NFP20_LAW:0 "Eine bedeutende Reform tritt in Kraft\nLänderdefinition: [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName]. Beobachtung: [ScriptContainer.GetVariableValue('nfp20_year')|0], Monat [Add_CFixedPoint(ScriptContainer.GetVariableValue('nfp20_month'), '(CFixedPoint)1')|0].\nGesetz: [Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]. Sein Inkrafttreten ist verzeichnet. Die Zeitung behauptet keine parlamentarische Abstimmung und beurteilt noch nicht die Folgen.\nAuswahl: [Localize(ScriptContainer.MakeScope.Var('nfp20_reason').GetFlagName)]. Fakt Nr. [ScriptContainer.GetVariableValue('nfp20_id')|0]."
 NFP20_LITERACY:0 "Eine neue Bildungsschwelle überschritten\nLänderdefinition: [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName]. Beobachtung: [ScriptContainer.GetVariableValue('nfp20_year')|0], Monat [Add_CFixedPoint(ScriptContainer.GetVariableValue('nfp20_month'), '(CFixedPoint)1')|0].\nAnteil der Lese- und Schreibkundigen: [ScriptContainer.GetVariableValue('nfp20_before')|3] → [ScriptContainer.GetVariableValue('nfp20_after')|3]. Die Schwelle von [ScriptContainer.GetVariableValue('nfp20_extra')|2] (Bevölkerungsanteil) wurde überschritten. Der Vergleich mit der früheren Aufnahme bestätigt die Änderung; sie ergibt sich nicht aus der Ausgangslage des Landes.\nAuswahl: [Localize(ScriptContainer.MakeScope.Var('nfp20_reason').GetFlagName)]. Fakt Nr. [ScriptContainer.GetVariableValue('nfp20_id')|0]."
 NFP20_NONE:0 "—"
 NFP20_PRODUCTION:0 "Ein Neuzugang unter den drei größten Produzenten\nLänderdefinition: [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName]. Beobachtung: [ScriptContainer.GetVariableValue('nfp20_year')|0], Monat [Add_CFixedPoint(ScriptContainer.GetVariableValue('nfp20_month'), '(CFixedPoint)1')|0].\nWare: [Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]. Platz außerhalb der ersten drei: [ScriptContainer.GetVariableValue('nfp20_before')|0]; nun: [ScriptContainer.GetVariableValue('nfp20_after')|0]. Zwei Monatsbeobachtungen bestätigen den Platz unter den ersten drei. Verglichen wird die Menge; Rentabilität und Ausfuhren wurden nicht gemessen.\nAuswahl: [Localize(ScriptContainer.MakeScope.Var('nfp20_reason').GetFlagName)]. Fakt Nr. [ScriptContainer.GetVariableValue('nfp20_id')|0]."
 NFP20_QUIET:0 "Für dieses Ressort wurden diesmal keine neuen Artikel ausgewählt. Die Zeitung füllt die Seite nicht durch Wiederholung aktueller Zahlen."
 NFP20_RANK:0 "Der Status des Landes hat sich geändert\nLänderdefinition: [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName]. Beobachtung: [ScriptContainer.GetVariableValue('nfp20_year')|0], Monat [Add_CFixedPoint(ScriptContainer.GetVariableValue('nfp20_month'), '(CFixedPoint)1')|0].\nFrüherer Status: [Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]. Neuer Status: [Localize(ScriptContainer.MakeScope.Var('nfp20_extra_detail').GetFlagName)]. Ein Rangwechsel bedeutet nicht unbedingt das Auftreten einer neuen Großmacht.\nAuswahl: [Localize(ScriptContainer.MakeScope.Var('nfp20_reason').GetFlagName)]. Fakt Nr. [ScriptContainer.GetVariableValue('nfp20_id')|0]."
 NFP20_RANK_UNKNOWN:0 "außerhalb der aufgeführten Kategorien"
 NFP20_REASON_PRIORITY:0 "Themenpriorität und Alter"
 NFP20_SHORTAGE:0 "Der Marktmangel hält an\nLänderdefinition: [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName]. Beobachtung: [ScriptContainer.GetVariableValue('nfp20_year')|0], Monat [Add_CFixedPoint(ScriptContainer.GetVariableValue('nfp20_month'), '(CFixedPoint)1')|0].\nWare: [Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]. Seit zwei Monaten wird auf dem Markt des Lesers ein direkter Mangelindikator verzeichnet. Dies ist kein Schluss aus einem hohen Preis; Versorgung und Verbrauch müssen geprüft werden.\nAuswahl: [Localize(ScriptContainer.MakeScope.Var('nfp20_reason').GetFlagName)]. Fakt Nr. [ScriptContainer.GetVariableValue('nfp20_id')|0]."
 NFP20_SHORTAGE_RECOVERY:0 "Fortsetzung: Der Marktmangel wird nicht mehr beobachtet\nLänderdefinition: [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName]. Beobachtung: [ScriptContainer.GetVariableValue('nfp20_year')|0], Monat [Add_CFixedPoint(ScriptContainer.GetVariableValue('nfp20_month'), '(CFixedPoint)1')|0].\nWare: [Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]. Seit der veröffentlichten Warnung fehlt der direkte Mangelindikator in zwei Monatsbeobachtungen. Ein hoher Preis kann bleiben; das ist eine andere Größe.\nAuswahl: [Localize(ScriptContainer.MakeScope.Var('nfp20_reason').GetFlagName)]. Fakt Nr. [ScriptContainer.GetVariableValue('nfp20_id')|0]."
 NFP20_TECH:0 "Eine bedeutende Technologie erworben\nLänderdefinition: [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName]. Beobachtung: [ScriptContainer.GetVariableValue('nfp20_year')|0], Monat [Add_CFixedPoint(ScriptContainer.GetVariableValue('nfp20_month'), '(CFixedPoint)1')|0].\nTechnologie: [Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]. Der Erwerb dieses Wissens durch das Land ist verzeichnet. Das belegt weder eine Welterstentdeckung noch den Einsatz in jedem Gebäude.\nAuswahl: [Localize(ScriptContainer.MakeScope.Var('nfp20_reason').GetFlagName)]. Fakt Nr. [ScriptContainer.GetVariableValue('nfp20_id')|0]."
 NFP20_WAR_END:0 "Der Krieg ist beendet\nEreignisdatum: [ScriptContainer.GetVariableValue('nfp20_year')|0], Monat [Add_CFixedPoint(ScriptContainer.GetVariableValue('nfp20_month'), '(CFixedPoint)1')|0].\nHauptseiten nach beständigen Definitionen: [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName] und [ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName]. Das Kriegsende ist verzeichnet. Die Zeitung macht keine unbelegten Angaben zu Sieger, Verlusten oder Friedensbedingungen.\nAuswahl: [Localize(ScriptContainer.MakeScope.Var('nfp20_reason').GetFlagName)]. Fakt Nr. [ScriptContainer.GetVariableValue('nfp20_id')|0]."
 NFP20_WAR_START:0 "Der Krieg hat begonnen\nEreignisdatum: [ScriptContainer.GetVariableValue('nfp20_year')|0], Monat [Add_CFixedPoint(ScriptContainer.GetVariableValue('nfp20_month'), '(CFixedPoint)1')|0].\nHauptseiten nach beständigen Definitionen: [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName] und [ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName]. Der Übergang vom diplomatischen Spiel zum Krieg ist verzeichnet. Weitere Teilnehmer und der spätere Ausgang werden hier nicht beurteilt.\nAuswahl: [Localize(ScriptContainer.MakeScope.Var('nfp20_reason').GetFlagName)]. Fakt Nr. [ScriptContainer.GetVariableValue('nfp20_id')|0]."
 NFP_ARCHIVE:0 "Archiv (bis zu 12)"
 NFP_ARCHIVE_ITEM:0 "Nr. [ScriptContainer.GetVariableValue('nfp_number')|0]"
 NFP_COUNTRY:0 "Leser: [GetPlayer.GetName]"
 NFP_COVER:0 "Titelseite"
 NFP_COVER_TEXT:0 "Das Land zum Druckzeitpunkt\n\nBIP: [ScriptContainer.GetVariableValue('nfp_gdp')|0]\nBevölkerung: [ScriptContainer.GetVariableValue('nfp_population')|0]\nDurchschnittlicher Lebensstandard: [ScriptContainer.GetVariableValue('nfp_sol')|2]\nAlphabetisierung (Rohanteil): [ScriptContainer.GetVariableValue('nfp_literacy')|3]\n\nWählen Sie eine Rubrik oder blättern Sie weiter. Die Rubriken und Werte dieser Ausgabe entsprechen dem Stand bei Veröffentlichung und werden beim Lesen nicht neu berechnet."
 NFP_ECONOMY:0 "Wirtschaft"
 NFP_EVENTS:0 "Ereignisse"
 NFP_ISSUE_HEADER:0 "Ausgabe Nr. [ScriptContainer.GetVariableValue('nfp_number')|0] — [ScriptContainer.GetVariableValue('nfp_year')|0], Monat [Add_CFixedPoint(ScriptContainer.GetVariableValue('nfp_month'), '(CFixedPoint)1')|0]"
 NFP_ISSUE_META:0 "Quelle: [SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp_kind'), '(CFixedPoint)1'), 'NFP_KIND_REGULAR', SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp_kind'), '(CFixedPoint)3'), 'NFP_KIND_URGENT', 'NFP_KIND_OTHER'))] • Kennung [ScriptContainer.GetVariableValue('nfp_marker')|0]"
 NFP_KIND_OTHER:0 "manueller Druck"
 NFP_KIND_REGULAR:0 "regelmäßige Zustellung"
 NFP_KIND_URGENT:0 "Eilausgabe"
 NFP_LATEST:0 "Neueste Ausgabe"
 NFP_NEXT:0 "Weiter"
 NFP_PREVIOUS:0 "Zurück"
 NFP_READER:0 "Zeitung lesen"
 NFP_SETTINGS:0 "Abonnement"
 NFP_SOCIETY:0 "Gesellschaft"
 NFP_WAR:0 "Krieg"
 je_nfp_subscription:0 "Zeitungsabonnement"
 je_nfp_subscription_reason:0 "Wählen Sie über die Zeitungsschaltfläche monatliche Zustellung und Eilausgaben. Empfangene Ausgaben bleiben im Archiv, das bis zu zwölf Nummern fasst."
 nfp_open_decision:0 "Zeitung öffnen"
 nfp_open_decision_desc:0 "Lesen Sie die aktuelle Ausgabe oder wählen Sie eine frühere Ausgabe aus dem Archiv."
