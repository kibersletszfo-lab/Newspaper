 NFP52_GER_2_TITLE:0 "Die deutsche Einigung hat stattgefunden"
 NFP52_ITA_1_BODY:0 "Italien hat sich vereinigt. Von einem Land, einer Kultur und der Hoffnung auf eine gemeinsame Zukunft konnte man schon zuvor sprechen. Ein Staat ist nun hinzugekommen. Für die Anhänger der Einigung ist die Zeit der Glückwünsche da. Mit ihr kommt die Frage, wie man nach den Festreden zusammenlebt.\\n\\nDer italienische Staat ist entstanden. Auf der politischen Karte des Mittelmeers steht ein Zusammenschluss, den Nachbarn in ihre Rechnung aufnehmen müssen. Die italienischen Länder wie gewohnt getrennt zu betrachten erklärt die neue Lage nicht mehr.\\n\\nEine gemeinsame Regierung hat gemeinsame Sorgen erhalten. Eine Flagge bringt Verkehrswege, Wirtschaft und Interessen verschiedener Länder nicht sofort in Einklang. Doch nun gibt es einen Staat für diese Fragen. Die Vereinigung hat stattgefunden. Wir werden sehen, welchen Inhalt sie bekommt.\\n\\nDie Chronik trägt den Monat, in dem die Nachricht die Redaktion erreichte. Bei verzögerter Verbindung kann das Ereignis selbst früher stattgefunden haben."
