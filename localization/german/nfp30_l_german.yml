 NFP43_ELECTION_TITLE_2:0 "Zur Wahlurne geht es später. Jetzt wird um Wähler geworben"
 NFP43_FRONT_PAGE:0 "Titelseite"
 NFP43_THIS_ISSUE:0 "In dieser Ausgabe"
 NFP43_THIS_ISSUE_URGENT:0 "In dieser Ausgabe · Eilmeldung"
 NFP43_WELCOME_1_BODY:0 "Gut, wenn man kaufen kann, was man braucht, zur Arbeit kommt und mit einem Verdienst heimkehrt, von dem man leben kann. Hier sprechen wir über Waren, überlastete Verkehrswege und Staaten, die den gemeinsamen Markt schwer erreichen. Und wir achten ausdrücklich darauf, wann die Sorgen enden.\n\nGroße Zahlen füllen keinen Einkaufskorb von selbst. Neben Wirtschaftserfolgen bleibt daher Platz für die Frage nach dem Lebensstandard. In ruhigen Monaten schlagen wir den Handelsbericht auf: Preise halten Wirtschaft auch ohne Hilfe der Redaktion interessant."
 NFP43_WELCOME_1_LEAD:0 "Willkommen im Wirtschaftsressort. Wir wollen Schwierigkeiten bemerken, bevor sie zur Gewohnheit werden."
 NFP43_WELCOME_1_TITLE:0 "Die Wirtschaft beginnt vor dem Bericht"
 NFP43_WELCOME_2_BODY:0 "Krieg geht nicht nur die an, die ihn auf einer Karte markieren. In diesem Ressort verfolgen wir Beginn und Ende von Konflikten, Bündnisse und die Mitgliedschaft unseres Blocks. Bei diplomatischen Krisen vermerken wir, wer Forderungen stellte, wer eine Seite unterstützte und wer lieber zurückwich.\n\nWichtige Nachrichten können in einer eigenen Sonderausgabe eintreffen, wenn Sie diese Zustellung erlauben. Lieber würden wir öfter von erfolgreichen Verhandlungen berichten. Doch schlechte Nachrichten liest man besser rechtzeitig, als sie an ihren Folgen zu erkennen."
 NFP43_WELCOME_2_LEAD:0 "Das Kriegsressort verfolgt Beginn und Ende von Konflikten sowie Änderungen, die die Sicherheit unseres Landes betreffen."
 NFP43_WELCOME_2_TITLE:0 "Zwischen Vertrag und Kanone"
 NFP43_WELCOME_3_BODY:0 "Ob Menschen lesen können, wie sie leben und was bei Wahlen geschieht, gehört in dieses Ressort. Gesellschaftliche Änderungen sind manchmal schwerer zu verfolgen als eine neue Grenze. Umso mehr Grund, hinter vertraute Ländernamen zu schauen.\n\nBei Wahlen vergleichen wir den Verlauf der Parteikampagnen mit früheren Berichten. Wahlkampfstärke ist noch keine Stimmenauszählung. Siegesgewissheit kann anstecken; die Redaktion versucht, weiter auf die Stimmzettel warten zu können."
 NFP43_WELCOME_3_LEAD:0 "Hier haben Bildungserfolge und Änderungen im Leben unseres Landes ihren Platz."
 NFP43_WELCOME_3_TITLE:0 "Ein Land besteht auch aus Menschen"
 NFP43_WELCOME_4_BODY:0 "Hier finden Sie Gesetze, neues Wissen und Änderungen der Stellung von Mächten. Stolz auf eigene Erfolge ist schön. Fremde Erfolge zu bemerken ist nützlich, auch wenn sie uns fragen lassen, warum wir selbst noch nicht so weit sind.\n\nSie können auf der Titelseite beginnen und zu einzelnen Artikeln wechseln. Frühere Ausgaben bleiben im Archiv mit Platz für zwölf Nummern. Alte Gewissheiten lesen sich manchmal besonders interessant, wenn man den weiteren Verlauf kennt."
 NFP43_WELCOME_4_LEAD:0 "Hier sammeln wir bedeutende Änderungen der Staatsordnung, neues Wissen und wichtige Auslandsnachrichten."
 NFP43_WELCOME_4_TITLE:0 "Jenseits des Vertrauten"
 NFP43_WELCOME_METRICS:0 "Einführungsartikel, keine Meldung eines neuen Ereignisses. Alle vier Ressorts werden vorgestellt; der gewöhnliche Inhalt späterer Ausgaben richtet sich nach dem Abonnement. Beobachtungen laufen ohne Rücksetzung weiter. Fehlt eine vergleichbare frühere Beobachtung, wird keine Änderung berechnet."
 NFP43_WELCOME_REACH:0 "Einführungsmaterial für das Leserland"
 NFP43_WELCOME_REASON:0 "Vorstellung der Zeitung nach Bestätigung eines Abonnements"
 NFP45_ARCHIVE_NOTE:0 "Abonnenten erhalten jeden Monat eine neue Ausgabe. Gelesene Ausgaben bleiben im Archiv."
 NFP47_CONFIRM:0 "Auswahl bestätigen"
 NFP47_CONFIRM_HINT:0 "Zustellwünsche speichern und zur Zeitung zurückkehren."
 NFP47_EDITION:0 "Der Nationalbote"
 NFP47_FOOTNOTE:0 "Die Zustellwünsche lassen sich jederzeit ändern. Das Ausgabenarchiv bleibt erhalten."
 NFP47_MONTHLY:0 "Monatsausgabe"
 NFP47_MONTHLY_NOTE:0 "Nachrichten aus dem In- und Ausland – jeden Monat in einer Ausgabe."
 NFP47_READER:0 "Abonnent: [GetPlayer.GetName]"
 NFP47_REQUEST:0 "Ich bitte um Zustellung folgender Ausgaben:"
 NFP47_RETURN:0 "Zurück zur Zeitung"
 NFP47_RETURN_HINT:0 "Zur Zeitung zurückkehren. Änderungen der Zustellwünsche werden sofort gespeichert."
 NFP47_SECTIONS:0 "Wirtschaft · Krieg · Gesellschaft · Ereignisse"
 NFP47_TERMS:0 "Monatsausgaben und Eilausgaben lassen sich unabhängig voneinander bestellen.\nDie Zustellung kann jederzeit beendet werden. Bereits erhaltene Ausgaben bleiben erhalten."
 NFP47_TITLE:0 "Abonnementformular"
 NFP47_URGENT:0 "Eilausgabe"
 NFP47_URGENT_NOTE:0 "Krieg und bedeutende Ereignisse: unverzüglich in einer Sonderausgabe."
 NFP50_EMPTY:0 ""
 NFP50_FAMILY_BODY:0 "[Localize(ScriptContainer.MakeScope.Var('nfp30_body').GetFlagName)]"
 NFP50_FAMILY_DIVERGENCE_FACTS:0 "Über drei Monatsintervalle stieg das prognostizierte jährliche BIP von [ScriptContainer.GetVariableValue('nfp20_before')|0] auf [ScriptContainer.GetVariableValue('nfp20_after')|0]. Der durchschnittliche Lebensstandard sank zugleich um [ScriptContainer.GetVariableValue('nfp20_extra')|2] Punkte."
 NFP50_FAMILY_DIVERGENCE_HOME_END_1:0 "Eine größere Wirtschaft bedeutet noch keine behaglichen Haushalte. Die Lebensverhältnisse verdienen Aufmerksamkeit auf höchster Ebene; warum die Zahlen auseinandergehen, muss eigens untersucht werden."
 NFP50_FAMILY_DIVERGENCE_HOME_END_2:0 "Das Land braucht auch Erfolge, die im Alltag ankommen. Diese Zahlen allein erklären weder die Verschlechterung noch benennen sie Verantwortliche."
 NFP50_FAMILY_ELECTION_AGAIN:0 "Nun können wir den Wahlkampf mit dem früheren Bericht vergleichen. Manche Parteien haben womöglich an Schwung gewonnen, andere verloren. Die Zeichen neben den Zahlen zeigen diese Änderung, keine Vorhersage des Abstands an den Urnen."
 NFP50_FAMILY_ELECTION_BASE:0 "[SelectLocalization(GreaterThan_CFixedPoint(ScriptContainer.GetVariableValue('nfp43_previous_issue'), '(CFixedPoint)0'), 'NFP43_ELECTION_BASELINE', 'NFP43_ELECTION_FIRST')]"
 NFP50_FAMILY_ELECTION_END_1:0 "Auch vor dem Wahltag gibt es eine Geschichte zu verfolgen. Wir werden sehen, wie sie weitergeht. Uns interessiert, wer die Wähler gewinnt; eine Zeitungsspalte sollte ihnen die Stimmabgabe vorerst nicht abnehmen."
 NFP50_FAMILY_ELECTION_END_2:0 "Auch vor dem Wahltag gibt es eine Geschichte zu verfolgen. Wir werden sehen, wie sie weitergeht. Uns interessiert, wer die Wähler gewinnt; eine Zeitungsspalte sollte ihnen die Stimmabgabe vorerst nicht abnehmen."
 NFP50_FAMILY_ELECTION_FIRST:0 "Hier beginnt unser Vergleich des Wahlkampfs. Die nächsten Berichte dürften deutlicher zeigen, wer an Schwung gewinnt und wer ihn verliert. Zunächst lernen wir Parteien und ihre Lage kennen."
 NFP50_FAMILY_ELECTION_NOTE:0 "Dies ist ein laufender Wahlkampf, keine Stimmenauszählung. Die Zahlen vergleichen die Dynamik von bis zu sechs führenden Parteien; es sind keine Wähleranteile in Prozent. Der Wahltag liegt noch vor uns, wie zuversichtlich ein Bewerber heute auch aussieht."
 NFP50_FAMILY_ELECTION_TABLE:0 "[Localize(ScriptContainer.MakeScope.Var('nfp43_row_1').GetFlagName)]\n[Localize(ScriptContainer.MakeScope.Var('nfp43_row_2').GetFlagName)]\n[Localize(ScriptContainer.MakeScope.Var('nfp43_row_3').GetFlagName)]\n[Localize(ScriptContainer.MakeScope.Var('nfp43_row_4').GetFlagName)]\n[Localize(ScriptContainer.MakeScope.Var('nfp43_row_5').GetFlagName)]\n[Localize(ScriptContainer.MakeScope.Var('nfp43_row_6').GetFlagName)]"
 NFP50_FAMILY_EXPECTED:0 "Zum Berichtszeitpunkt beträgt der durchschnittliche Lebensstandard [ScriptContainer.GetVariableValue('nfp50_family_sol')|2], erwartet werden [ScriptContainer.GetVariableValue('nfp50_family_expected_sol')|2]. Der erste Wert liegt unter dem zweiten: ein weiterer Grund, die Lebensverhältnisse genauer anzusehen."
 NFP50_FAMILY_GAINED_ALLIANCE_1_1:0 "Unser Land hat einen förmlichen Verbündeten: [ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName]. Hinter gemeinsamen Plänen steht nun eine Vereinbarung. Gut, jemanden in der Nähe zu haben, mit dem sich mehr als nur Differenzen besprechen lässt. Wir werden sehen, wie gut aus Gesprächen Taten werden."
 NFP50_FAMILY_GAINED_ALLIANCE_1_2:0 "Ein Bündnis verdient mehr als den Austausch von Höflichkeiten. Sein Wert zeigt sich in praktischen Entscheidungen und eingehaltenen Zusagen. Ein Siegel auf dem Vertrag ist ein guter Anfang. Die Zusammenarbeit sollte darüber hinausgehen."
 NFP50_FAMILY_GAINED_ALLIANCE_2_1:0 "Unser Land hat einen förmlichen Verbündeten: [ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName]. Hinter gemeinsamen Plänen steht nun eine Vereinbarung. Gut, jemanden in der Nähe zu haben, mit dem sich mehr als nur Differenzen besprechen lässt. Wir werden sehen, wie gut aus Gesprächen Taten werden."
 NFP50_FAMILY_GAINED_ALLIANCE_2_2:0 "Ein Bündnis verdient mehr als den Austausch von Höflichkeiten. Sein Wert zeigt sich in praktischen Entscheidungen und eingehaltenen Zusagen. Ein Siegel auf dem Vertrag ist ein guter Anfang. Die Zusammenarbeit sollte darüber hinausgehen."
 NFP50_FAMILY_GAINED_BLOC_1_1:0 "Wir und [ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName] gehören nun demselben Machtblock an. Unser gemeinsamer Kreis hat sich verändert. Wer wen zum Beitritt überredet hat, erraten wir nicht; nützlicher ist die Frage, welche Möglichkeiten diese neue Nähe im Verband eröffnet."
 NFP50_FAMILY_GAINED_BLOC_1_2:0 "Ein gemeinsames Banner ersetzt keine gemeinsame Arbeit. Auch ohne eigenes Militärbündnis gibt es hier etwas auszuhandeln. Schön wäre es, wenn auf die Bekanntschaft nützliche Gespräche zum beiderseitigen Vorteil folgten."
 NFP50_FAMILY_GAINED_BLOC_2_1:0 "Wir und [ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName] gehören nun demselben Machtblock an. Unser gemeinsamer Kreis hat sich verändert. Wer wen zum Beitritt überredet hat, erraten wir nicht; nützlicher ist die Frage, welche Möglichkeiten diese neue Nähe im Verband eröffnet."
 NFP50_FAMILY_GAINED_BLOC_2_2:0 "Ein gemeinsames Banner ersetzt keine gemeinsame Arbeit. Auch ohne eigenes Militärbündnis gibt es hier etwas auszuhandeln. Schön wäre es, wenn auf die Bekanntschaft nützliche Gespräche zum beiderseitigen Vorteil folgten."
 NFP50_FAMILY_GROWTH:0 "Das prognostizierte jährliche BIP wuchs zwischen den gezeigten Beobachtungen um [ScriptContainer.GetVariableValue('nfp50_family_gdp_growth')|2]%. Das betrifft die Wirtschaftsgröße, nicht das Einkommen jeder Familie."
 NFP50_FAMILY_INTRO:0 "[Localize(ScriptContainer.MakeScope.Var('nfp30_lead').GetFlagName)]"
 NFP50_FAMILY_LAW_AWAY_END_1:0 "Unsere Leser können Veränderungen im Leben anderer Völker verfolgen. Zunächst wissen wir, dass die neue Regel gilt; ihre Folgen bleiben zu beurteilen."
 NFP50_FAMILY_LAW_AWAY_END_2:0 "Die Angaben belegen weder eine parlamentarische Abstimmung über die Reform noch versprechen sie ein bestimmtes Ergebnis. Ihre Wirkungen verdienen eigene Aufmerksamkeit."
 NFP50_FAMILY_LAW_FACTS:0 "Ein Gesetz ist in Kraft getreten: [Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]."
 NFP50_FAMILY_LAW_HOME_END_1:0 "Wir berichten über die Änderung selbst. Wie sie angenommen wurde und was sie für das Leben bedeutet, geht aus dieser Nachricht noch nicht hervor."
 NFP50_FAMILY_LAW_HOME_END_2:0 "Eine Beurteilung der Reform braucht Zeit und Belege ihrer Wirkungen. Das Inkrafttreten eines Gesetzes bedeutet nicht, dass die versprochenen Ergebnisse schon eingetreten sind."
 NFP50_FAMILY_LOST_ALLIANCE_1_1:0 "Unser früheres Bündnis mit [ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName] besteht nicht mehr. Eine wichtige Nachricht für Pläne, in denen es eine Rolle spielte. Der Grund der Änderung muss noch untersucht werden; mit der alten Vereinbarung sollten wir nicht aus Gewohnheit weiterrechnen."
 NFP50_FAMILY_LOST_ALLIANCE_1_2:0 "Nun müssen wir genauer auf die eigenen Möglichkeiten schauen. Den früheren Verbündeten zum ewigen Feind zu erklären wäre ebenso voreilig, wie seine Hilfe weiter für sicher zu halten. Gedächtnis ist in der Diplomatie nützlich. Besonders, wenn man auch die Änderungen im Kopf behält."
 NFP50_FAMILY_LOST_ALLIANCE_2_1:0 "Unser früheres Bündnis mit [ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName] besteht nicht mehr. Eine wichtige Nachricht für Pläne, in denen es eine Rolle spielte. Der Grund der Änderung muss noch untersucht werden; mit der alten Vereinbarung sollten wir nicht aus Gewohnheit weiterrechnen."
 NFP50_FAMILY_LOST_ALLIANCE_2_2:0 "Nun müssen wir genauer auf die eigenen Möglichkeiten schauen. Den früheren Verbündeten zum ewigen Feind zu erklären wäre ebenso voreilig, wie seine Hilfe weiter für sicher zu halten. Gedächtnis ist in der Diplomatie nützlich. Besonders, wenn man auch die Änderungen im Kopf behält."
 NFP50_FAMILY_LOST_BLOC_1_1:0 "Die Mitgliedschaft im selben Block verbindet uns nicht mehr mit [ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName]. Der frühere gemeinsame Kreis gehört in den früheren Bericht. Geändert haben kann sich die Stellung jeder Seite oder der Verband selbst; für unsere Pläne ist das jetzige Ergebnis deshalb nicht weniger wichtig."
 NFP50_FAMILY_LOST_BLOC_1_2:0 "Für gemeinsame Berechnungen gibt es weniger Grundlagen. Gesonderte Verträge zwischen den Ländern sind eine andere Frage und nach ihrem Inhalt zu prüfen. Das alte Beziehungsbild weiterzuverwenden, nur weil noch niemand das neue aufgehängt hat, wäre seltsam."
 NFP50_FAMILY_LOST_BLOC_2_1:0 "Die Mitgliedschaft im selben Block verbindet uns nicht mehr mit [ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName]. Der frühere gemeinsame Kreis gehört in den früheren Bericht. Geändert haben kann sich die Stellung jeder Seite oder der Verband selbst; für unsere Pläne ist das jetzige Ergebnis deshalb nicht weniger wichtig."
 NFP50_FAMILY_LOST_BLOC_2_2:0 "Für gemeinsame Berechnungen gibt es weniger Grundlagen. Gesonderte Verträge zwischen den Ländern sind eine andere Frage und nach ihrem Inhalt zu prüfen. Das alte Beziehungsbild weiterzuverwenden, nur weil noch niemand das neue aufgehängt hat, wäre seltsam."
 NFP50_FAMILY_PRICE_CORE:0 "[SelectLocalization(GreaterThan_CFixedPoint(ScriptContainer.GetVariableValue('nfp32_rows'), '(CFixedPoint)0'), 'NFP30_PRICE_MARKET', 'NFP30_PRICE_UNAVAILABLE')]\n\n[Localize(ScriptContainer.MakeScope.Var('nfp32_row_1').GetFlagName)]\n[Localize(ScriptContainer.MakeScope.Var('nfp32_row_2').GetFlagName)]\n[Localize(ScriptContainer.MakeScope.Var('nfp32_row_3').GetFlagName)]\n[Localize(ScriptContainer.MakeScope.Var('nfp32_row_4').GetFlagName)]\n[Localize(ScriptContainer.MakeScope.Var('nfp32_row_5').GetFlagName)]\n[Localize(ScriptContainer.MakeScope.Var('nfp32_row_6').GetFlagName)]"
 NFP50_FAMILY_PRICE_END_1:0 "Preise verdienen Beachtung, ohne dass wir auf eine dramatische Schwierigkeit warten. Diese Tabelle betrifft einzelne Waren, berechnet also nicht die gesamten Familienausgaben. Sie hilft aber beim Blick auf vertraute Einkäufe. Manchmal erwarten den Leser die aufschlussreichsten Nachrichten am Ladentisch."
 NFP50_FAMILY_PRICE_END_2:0 "Preise verdienen Beachtung, ohne dass wir auf eine dramatische Schwierigkeit warten. Diese Tabelle betrifft einzelne Waren, berechnet also nicht die gesamten Familienausgaben. Sie hilft aber beim Blick auf vertraute Einkäufe. Manchmal erwarten den Leser die aufschlussreichsten Nachrichten am Ladentisch."
 NFP50_FAMILY_PRICE_NOTE:0 "[SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp32_comparisons'), '(CFixedPoint)0'), 'NFP30_PRICE_FIRST', 'NFP30_PRICE_METHOD')]"
 NFP50_FAMILY_SHORTAGE_FACTS:0 "Ware: [Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]. Zwei aufeinanderfolgende Monatsbeobachtungen verzeichnen einen Mangel auf unserem Markt."
 NFP50_FAMILY_SHORTAGE_HOME_END_1:0 "Versorgung und Verbrauch dieser Ware verdienen einen genauen Blick. Der Bericht betrifft den Mangel selbst; ein hoher Preis ist eine andere Frage."
 NFP50_FAMILY_SHORTAGE_HOME_END_2:0 "Der Marktmangel ist bestätigt, seine Ursachen sind noch nicht geklärt. Diese Tatsachen benennen keine Verantwortlichen und versprechen keinen Erfolg durch ein bestimmtes Gebäude."
 NFP50_FAMILY_SHORTAGE_RECOVERY_FACTS:0 "Ware: [Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]. Nach unserer Warnung zeigen zwei aufeinanderfolgende Monatsbeobachtungen den früheren Marktmangel nicht mehr."
 NFP50_FAMILY_SHORTAGE_RECOVERY_HOME_END_1:0 "Wir halten fest, dass der frühere Mangel nicht mehr auftritt. Das verspricht noch keine niedrigen Preise: Teuerung und Knappheit sind verschiedene Fragen."
 NFP50_FAMILY_SHORTAGE_RECOVERY_HOME_END_2:0 "Die Verbesserung hält seit zwei Monaten an. Die Zeitung unterscheidet weiter zwischen Verfügbarkeit und Bezahlbarkeit; Letztere belegt dieser Bericht nicht."
 NFP50_FAMILY_SOL:0 "Im selben Zeitraum änderte sich der durchschnittliche Lebensstandard von [ScriptContainer.GetVariableValue('nfp50_family_sol_before')|2] auf [ScriptContainer.GetVariableValue('nfp50_family_sol')|2]. Dies ist ein Landesdurchschnitt; die Lage einzelner Schichten und Staaten kann abweichen."
 NFP50_FAMILY_TECH_ANILINE_1:0 "Nun können Chemiewerke gebaut werden. Farbstoffe lassen sich industriell herstellen. Eine interessante Aussicht für die Textilproduktion: Die Farbe künftiger Kleidung hängt immer weniger von der Herkunft ihrer Rohstoffe ab."
 NFP50_FAMILY_TECH_ANILINE_2:0 "Die Farbstoffproduktion benötigt Schwefel und Dünger. Neue Technik verändert die Lieferkette, sie schafft sie nicht ab. Eine schöne Farbe kann offenbar recht unerwartete wirtschaftliche Verwandtschaften haben."
 NFP50_FAMILY_TECH_ANTIBIOTICS_1:0 "Das Land kann die Gesundheitsversorgung ausbauen. Medizinisches Wissen verdient zuerst wegen einer ganz gewöhnlichen Hoffnung Aufmerksamkeit: wieder gesund zu werden. Diese Hoffnung steht nun auf festerem Grund; die Versorgung braucht weiterhin Geld."
 NFP50_FAMILY_TECH_ANTIBIOTICS_2:0 "Krankheitsausbrüche beeinträchtigen Ernten weniger. Ein handfester wirtschaftlicher Nutzen des neuen Wissens. Krankheit stört das Leben weit über das Krankenzimmer hinaus; gut, wenn ein Mittel auch die tägliche Arbeit erleichtert."
 NFP50_FAMILY_TECH_AWAY_END_1:0 "Die Möglichkeiten des Landes sind gewachsen. Grund genug, unsere eigenen Angelegenheiten anzusehen: Was können wir bereits, und wie nutzen wir es? Glückwünsche können auf die Post warten. Einen nützlichen Gedanken für uns sollten wir gleich behalten."
 NFP50_FAMILY_TECH_AWAY_END_2:0 "Die Möglichkeiten des Landes sind gewachsen. Grund genug, unsere eigenen Angelegenheiten anzusehen: Was können wir bereits, und wie nutzen wir es? Glückwünsche können auf die Post warten. Einen nützlichen Gedanken für uns sollten wir gleich behalten."
 NFP50_FAMILY_TECH_BESSEMER_PROCESS_1:0 "Stahlwerke können mit dem Bessemerverfahren nun mehr Stahl gewinnen. Eine nützliche Möglichkeit für eine Wirtschaft, die Metall nicht nur für Denkmäler ihrer eigenen Erfolge braucht."
 NFP50_FAMILY_TECH_BESSEMER_PROCESS_2:0 "Das neue Verfahren braucht bei gleichem Kohleverbrauch mehr Eisen. Fortschritt befreit uns offenbar nicht von der Versorgung. Vor der Feier des künftigen Stahls müssen wir klären, woraus er entstehen soll."
 NFP50_FAMILY_TECH_ELECTRICAL_GENERATION_1:0 "Nun können Kraftwerke gebaut werden. Die Wirtschaft erhält neue Möglichkeiten. Noch ist es Wissen, zu dem Gebäude und Versorgung erst hinzukommen müssen. Doch schon jetzt eröffnet es einen anderen Blick auf künftige Betriebe."
 NFP50_FAMILY_TECH_ELECTRICAL_GENERATION_2:0 "Städte können auf elektrische Straßenbeleuchtung umstellen. Dafür ist örtlicher Strom nötig. Die Änderung verspricht im wörtlichen Sinn sichtbar zu werden: Umso mehr hoffen wir, dass auf Worte von einer hellen Zukunft auch Licht auf der Straße folgt."
 NFP50_FAMILY_TECH_ELECTRIC_TELEGRAPH_1:0 "Das militärische Wissen ist um den elektrischen Telegrafen reicher. Das Land hat ein neues Mittel, die Kriegslast zu tragen. Der Wert der Nachricht bemisst sich nicht nur daran, wie eindrucksvoll der neue Begriff im Militärbericht wirkt."
 NFP50_FAMILY_TECH_ELECTRIC_TELEGRAPH_2:0 "Verluste erhöhen die Kriegsmüdigkeit des Landes weniger. Es geht um das Tragen der Kriegslast; die Toten bringt dieses Wissen nicht zurück. Hoffentlich muss der Nutzen dieser militärischen Neuerung nicht allzu oft praktisch erprobt werden."
 NFP50_FAMILY_TECH_FACTS:0 "Das Land verfügt nun über die Technologie [Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]."
 NFP50_FAMILY_TECH_HOME_END_1:0 "Wir wissen nun mehr; jetzt gilt es, das Wissen gut zu nutzen. Unser Land hat Anlass zum Stolz und zur Arbeit. Die nächste Geschichte sollte davon handeln, was dieses Wissen ermöglicht hat. Eine Liste der Möglichkeiten ist schön. Sie zu nutzen ist schöner."
 NFP50_FAMILY_TECH_HOME_END_2:0 "Wir wissen nun mehr; jetzt gilt es, das Wissen gut zu nutzen. Unser Land hat Anlass zum Stolz und zur Arbeit. Die nächste Geschichte sollte davon handeln, was dieses Wissen ermöglicht hat. Eine Liste der Möglichkeiten ist schön. Sie zu nutzen ist schöner."
 NFP50_FAMILY_TECH_KNOWN:0 "Wir besitzen dieses Wissen bereits. Nun kann auch ein anderes Land es nutzen. Unser Wissensvorsprung endet damit auf diesem Gebiet. Wir werden sehen, wer das Gewusste besser einsetzt: Im Wirtschaftsleben ist das meist interessanter als ein Gedächtniswettbewerb."
 NFP50_FAMILY_TECH_QUININE_1:0 "Chinin überwindet das Hindernis gewöhnlicher Malaria bei der kolonialen Ausdehnung. Schwere Malaria bleibt ein eigenes Problem. Auf der Karte gibt es mehr Möglichkeiten; ein einziges Mittel für die Lösung aller örtlichen Schwierigkeiten zu halten wäre zu naiv."
 NFP50_FAMILY_TECH_QUININE_2:0 "Gesundheitsversorgung und Kolonialverwaltung können ausgebaut werden. Das zusätzliche Geld muss weiterhin bereitgestellt werden. Das Mittel hat die Möglichkeiten des Landes erweitert; Staatskasse und Verwaltung haben nun etwas zu bedenken."
 NFP50_FAMILY_TECH_RAILWAYS_1:0 "Nun können Eisenbahnen gebaut werden. Der Abstand zwischen Städten wird dadurch nicht kleiner. Er lässt sich aber mit neuen Verkehrsmitteln überwinden. Die Schienen müssen erst liegen: Eine gezeichnete Linie im Plan arbeitet schlechter für die Wirtschaft als eine echte."
 NFP50_FAMILY_TECH_RAILWAYS_2:0 "Bergwerke können nun Schienentransport nutzen. Die neue Produktionsmethode benötigt Transportdienstleistungen. Mehr zu fördern ist nützlich. Schön wäre es, nicht erst hinterher festzustellen, dass weiterhin nichts zum Abtransport bereitsteht."
 NFP50_FAMILY_TECH_STEAM_DONKEY_1:0 "Hilfsarbeiten in Holzfällerlagern und Bergwerken lassen sich mechanisieren. Dampf kann einen Teil der Arbeit schultern, die bisher Hände brauchte. Die Wirtschaft gewinnt einen weiteren Weg, ihre Last zu bewältigen."
 NFP50_FAMILY_TECH_STEAM_DONKEY_2:0 "Mechanisierung braucht Motoren und weniger Hilfsarbeiter. Arbeit zu sparen ist für den Betrieb verlockend. Was die Änderung für Menschen bedeutet, hängt auch davon ab, ob andere Arbeit zu finden ist. Einen Platz für eine Maschine findet man manchmal leichter als für einen Menschen."
 NFP50_FAMILY_TECH_STEELWORKING_1:0 "Das Land kann nun Stahlwerke bauen. Die Wirtschaft erhält eine Grundlage für neue Produktionsmöglichkeiten. Stahl auf der Wissensliste beginnt die Geschichte; nutzbarer Stahl braucht Betriebe und Arbeit."
 NFP50_FAMILY_TECH_STEELWORKING_2:0 "Werkzeugfabriken können Roheisen nutzen. Ein vertrautes Werkzeug erhält eine andere Produktionsgeschichte. Neue Methoden müssen erst gewählt und mit Material versorgt werden. Ihre bloße Kenntnis verändert keine Werkstatt."
 NFP50_FAMILY_TECH_UNKNOWN:0 "Wir besitzen dieses Wissen noch nicht. Ein anderes Land hat damit einen Vorsprung auf diesem Gebiet gewonnen. Hoffentlich antworten wir rechtzeitig mit einem eigenen Ergebnis. Warum ein fremder Erfolg nicht so wichtig sei, lässt sich ohne Forschung erklären; nützlich ist das erheblich weniger."
 NFP50_FAMILY_WAR_ALLIANCE_1_1:0 "Unser Verbündeter [ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName] ist die verteidigende Partei eines neuen Krieges. Initiator ist [ScriptContainer.MakeScope.Var('nfp20_extra_detail').GetCountryDefinition.GetName]. Für uns hat die Nachricht unmittelbare diplomatische Bedeutung: Sie betrifft ein Land, das uns durch ein Bündnis verbunden ist."
 NFP50_FAMILY_WAR_ALLIANCE_1_2:0 "Unsere Bündnisvereinbarungen stehen nun neben einem wirklichen Krieg. Die Meldung selbst bedeutet nicht, dass wir bereits beigetreten sind. Solche Nachrichten unter fernem Auslandsgeschehen abzulegen wäre aber seltsam. An ein Bündnis erinnert man sich nicht nur, wenn gegenseitige Glückwünsche bequem sind."
 NFP50_FAMILY_WAR_ALLIANCE_2_1:0 "Unser Verbündeter [ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName] ist die verteidigende Partei eines neuen Krieges. Initiator ist [ScriptContainer.MakeScope.Var('nfp20_extra_detail').GetCountryDefinition.GetName]. Für uns hat die Nachricht unmittelbare diplomatische Bedeutung: Sie betrifft ein Land, das uns durch ein Bündnis verbunden ist."
 NFP50_FAMILY_WAR_ALLIANCE_2_2:0 "Unsere Bündnisvereinbarungen stehen nun neben einem wirklichen Krieg. Die Meldung selbst bedeutet nicht, dass wir bereits beigetreten sind. Solche Nachrichten unter fernem Auslandsgeschehen abzulegen wäre aber seltsam. An ein Bündnis erinnert man sich nicht nur, wenn gegenseitige Glückwünsche bequem sind."
 NFP50_FAMILY_WAR_BLOC_1_1:0 "Gegen [ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName], ein Mitglied unseres Machtblocks, hat ein Krieg begonnen. Initiator ist [ScriptContainer.MakeScope.Var('nfp20_extra_detail').GetCountryDefinition.GetName]. Es geht um den Kreis, in dem wir gemeinsame Pläne machen. Wir haben einen viel stärkeren Grund als flüchtige Neugier, den Bericht genau zu lesen."
 NFP50_FAMILY_WAR_BLOC_1_2:0 "Ein gemeinsamer Block macht nicht jeden Krieg eines Mitglieds zu unserem eigenen. Wichtig für unsere Berechnungen wird der Konflikt dennoch. Wir sollten verstehen, wie sich die Möglichkeiten des Partners ändern könnten, bevor wir weiterplanen, als herrsche überall Frieden."
 NFP50_FAMILY_WAR_BLOC_2_1:0 "Gegen [ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName], ein Mitglied unseres Machtblocks, hat ein Krieg begonnen. Initiator ist [ScriptContainer.MakeScope.Var('nfp20_extra_detail').GetCountryDefinition.GetName]. Es geht um den Kreis, in dem wir gemeinsame Pläne machen. Wir haben einen viel stärkeren Grund als flüchtige Neugier, den Bericht genau zu lesen."
 NFP50_FAMILY_WAR_BLOC_2_2:0 "Ein gemeinsamer Block macht nicht jeden Krieg eines Mitglieds zu unserem eigenen. Wichtig für unsere Berechnungen wird der Konflikt dennoch. Wir sollten verstehen, wie sich die Möglichkeiten des Partners ändern könnten, bevor wir weiterplanen, als herrsche überall Frieden."
 NFP50_FAMILY_WAR_END_AWAY_END_1:0 "Der Krieg ist vorbei; die Prüfung seiner Ergebnisse steht noch aus. Wer das Gewünschte erreicht und welchen Preis dafür gezahlt hat, sollten die Friedensbedingungen deutlicher zeigen. Beide Seiten neu anzusehen wäre nützlich: Aus Gewohnheit mit ihren früheren Möglichkeiten zu rechnen wäre zu naiv."
 NFP50_FAMILY_WAR_END_AWAY_END_2:0 "Der Krieg ist vorbei; die Prüfung seiner Ergebnisse steht noch aus. Wer das Gewünschte erreicht und welchen Preis dafür gezahlt hat, sollten die Friedensbedingungen deutlicher zeigen. Beide Seiten neu anzusehen wäre nützlich: Aus Gewohnheit mit ihren früheren Möglichkeiten zu rechnen wäre zu naiv."
 NFP50_FAMILY_WAR_END_CONTEXT:0 "Der Frieden stellt Länder vor neue Fragen. Ein Krieg kann enden, während seine Folgen noch lange zu entwirren sind. Wir verzeichnen nun die gute Nachricht und messen das Ergebnis an den Vereinbarungen."
 NFP50_FAMILY_WAR_END_FACTS:0 "Der Krieg ist beendet. Hauptparteien: [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName] und [ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName]."
 NFP50_FAMILY_WAR_END_HOME_END_1:0 "Nun können wir vom Kriegsende sprechen. Für Siegesglückwünsche braucht es auch dessen Bedingungen; für Hoffnung auf friedliches Leben reicht diese Nachricht bereits. Die nächste große Anstrengung des Landes sollte dort stattfinden, wo etwas geschaffen wird. Zum Zerstören bietet die Geschichte mehr als genug Anlässe."
 NFP50_FAMILY_WAR_END_HOME_END_2:0 "Nun können wir vom Kriegsende sprechen. Für Siegesglückwünsche braucht es auch dessen Bedingungen; für Hoffnung auf friedliches Leben reicht diese Nachricht bereits. Die nächste große Anstrengung des Landes sollte dort stattfinden, wo etwas geschaffen wird. Zum Zerstören bietet die Geschichte mehr als genug Anlässe."
 NFP50_FAMILY_WAR_START_AWAY_END_1:0 "Die Folgen dieses Krieges reichen über die beiden Hauptstädte hinaus. Welche uns betreffen, zeigt der Verlauf. Zunächst ist es nützlicher, Teilnehmer und Entscheidungen zu verfolgen, als den Sieger nach der Größe eines Namens auf der Karte zu wählen. Sichere Vorhersagen fallen denen besonders leicht, die nicht dafür einstehen müssen."
 NFP50_FAMILY_WAR_START_AWAY_END_2:0 "Die Folgen dieses Krieges reichen über die beiden Hauptstädte hinaus. Welche uns betreffen, zeigt der Verlauf. Zunächst ist es nützlicher, Teilnehmer und Entscheidungen zu verfolgen, als den Sieger nach der Größe eines Namens auf der Karte zu wählen. Sichere Vorhersagen fallen denen besonders leicht, die nicht dafür einstehen müssen."
 NFP50_FAMILY_WAR_START_CONTEXT:0 "Ein diplomatischer Streit ist zum Krieg geworden. Überzeugende Worte allein genügen den Seiten nicht mehr. Dahinter brauchen sie Menschen, Versorgung und Kräfte, die viel schwerer zusammenzubringen sind als eine geschliffene Absichtserklärung."
 NFP50_FAMILY_WAR_START_FACTS:0 "Der Krieg hat begonnen. Hauptparteien: [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName] und [ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName]."
 NFP50_FAMILY_WAR_START_HOME_END_1:0 "Krieg gehört nun zu unseren eigenen Angelegenheiten. Seinen Beginn kann man in einer Zeile melden. Alles Weitere passt nicht hinein. Hoffentlich drucken wir bald Friedensnachrichten; bis dahin lesen wir Kriegsberichte aufmerksam, ohne Hoffnung vorschnell zur Siegesmeldung zu machen."
 NFP50_FAMILY_WAR_START_HOME_END_2:0 "Krieg gehört nun zu unseren eigenen Angelegenheiten. Seinen Beginn kann man in einer Zeile melden. Alles Weitere passt nicht hinein. Hoffentlich drucken wir bald Friedensnachrichten; bis dahin lesen wir Kriegsberichte aufmerksam, ohne Hoffnung vorschnell zur Siegesmeldung zu machen."
 NFP50_FAMILY_WELCOME_1_1:0 "Gut, wenn man kaufen kann, was man braucht, zur Arbeit kommt und mit einem Verdienst heimkehrt, von dem man leben kann. Hier sprechen wir über Waren, überlastete Verkehrswege und Staaten, die den gemeinsamen Markt schwer erreichen. Und wir achten ausdrücklich darauf, wann die Sorgen enden."
 NFP50_FAMILY_WELCOME_1_2:0 "Große Zahlen füllen keinen Einkaufskorb von selbst. Neben Wirtschaftserfolgen bleibt daher Platz für die Frage nach dem Lebensstandard. In ruhigen Monaten schlagen wir den Handelsbericht auf: Preise halten Wirtschaft auch ohne Hilfe der Redaktion interessant."
 NFP50_FAMILY_WELCOME_2_1:0 "Krieg geht nicht nur die an, die ihn auf einer Karte markieren. In diesem Ressort verfolgen wir Beginn und Ende von Konflikten, Bündnisse und die Mitgliedschaft unseres Blocks. Bei diplomatischen Krisen vermerken wir, wer Forderungen stellte, wer eine Seite unterstützte und wer lieber zurückwich."
 NFP50_FAMILY_WELCOME_2_2:0 "Wichtige Nachrichten können in einer eigenen Sonderausgabe eintreffen, wenn Sie diese Zustellung erlauben. Lieber würden wir öfter von erfolgreichen Verhandlungen berichten. Doch schlechte Nachrichten liest man besser rechtzeitig, als sie an ihren Folgen zu erkennen."
 NFP50_FAMILY_WELCOME_3_1:0 "Ob Menschen lesen können, wie sie leben und was bei Wahlen geschieht, gehört in dieses Ressort. Gesellschaftliche Änderungen sind manchmal schwerer zu verfolgen als eine neue Grenze. Umso mehr Grund, hinter vertraute Ländernamen zu schauen."
 NFP50_FAMILY_WELCOME_3_2:0 "Bei Wahlen vergleichen wir den Verlauf der Parteikampagnen mit früheren Berichten. Wahlkampfstärke ist noch keine Stimmenauszählung. Siegesgewissheit kann anstecken; die Redaktion versucht, weiter auf die Stimmzettel warten zu können."
 NFP50_FAMILY_WELCOME_4_1:0 "Hier finden Sie Gesetze, neues Wissen und Änderungen der Stellung von Mächten. Stolz auf eigene Erfolge ist schön. Fremde Erfolge zu bemerken ist nützlich, auch wenn sie uns fragen lassen, warum wir selbst noch nicht so weit sind."
 NFP50_FAMILY_WELCOME_4_2:0 "Sie können auf der Titelseite beginnen und zu einzelnen Artikeln wechseln. Frühere Ausgaben bleiben im Archiv mit Platz für zwölf Nummern. Alte Gewissheiten lesen sich manchmal besonders interessant, wenn man den weiteren Verlauf kennt."
 NFP50_FAMILY_WELCOME_END_1:0 "Unsere Bekanntschaft hat gerade erst begonnen. Wir kommen immer wieder auf Ereignisse zurück und sehen nach, was sich geändert hat. Hoffentlich gibt öfter eine erfreuliche neue Meldung Anlass, eine alte besorgte Notiz nochmals zu lesen.\n\n$NFP89_DELIVERY$"
 NFP50_FAMILY_WELCOME_END_2:0 "Unsere Bekanntschaft hat gerade erst begonnen. Wir kommen immer wieder auf Ereignisse zurück und sehen nach, was sich geändert hat. Hoffentlich gibt öfter eine erfreuliche neue Meldung Anlass, eine alte besorgte Notiz nochmals zu lesen.\n\n$NFP89_DELIVERY$"
 NFP50_LAW_APPROVE:0 "Zustimmung"
 NFP50_LAW_END_1:0 "Nun muss das Gesetz Teil des Alltags werden. Befürworter können es schon als Erfolg bezeichnen, Gegner als Fehler. Uns interessiert eher, was zwischen diesen Erklärungen liegt, wenn die neuen Regeln wirken. Ein gutes Gesetz liest man gern. Gut danach zu leben ist noch schöner."
 NFP50_LAW_END_2:0 "Nun muss das Gesetz Teil des Alltags werden. Befürworter können es schon als Erfolg bezeichnen, Gegner als Fehler. Uns interessiert eher, was zwischen diesen Erklärungen liegt, wenn die neuen Regeln wirken. Ein gutes Gesetz liest man gern. Gut danach zu leben ist noch schöner."
