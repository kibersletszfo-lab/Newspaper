 NFP30_RUBRIC_EMPTY:0 "Diese Ausgabe enthält keine Artikel im gewählten Ressort: Es war ausgeschaltet oder es gab keine passenden Nachrichten."
 NFP30_RUBRIC_JUMP:0 "Zum ersten Artikel dieses Ressorts springen."
 NFP30_SHORTAGE_HOME_1_BODY:0 "Ware: [Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]. Zwei aufeinanderfolgende Monatsbeobachtungen verzeichnen einen Mangel auf unserem Markt.\n\nVersorgung und Verbrauch dieser Ware verdienen einen genauen Blick. Der Bericht betrifft den Mangel selbst; ein hoher Preis ist eine andere Frage."
 NFP30_SHORTAGE_HOME_1_LEAD:0 "Der Mangel auf unserem Markt ist keine vereinzelte Meldung mehr. Er gehört auf die heutigen Wirtschaftsseiten."
 NFP30_SHORTAGE_HOME_1_TITLE:0 "Auf dem Markt fehlt eine benötigte Ware"
 NFP30_SHORTAGE_HOME_2_BODY:0 "Ware: [Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]. Zwei aufeinanderfolgende Monatsbeobachtungen verzeichnen einen Mangel auf unserem Markt.\n\nDer Marktmangel ist bestätigt, seine Ursachen sind noch nicht geklärt. Diese Tatsachen benennen keine Verantwortlichen und versprechen keinen Erfolg durch ein bestimmtes Gebäude."
 NFP30_SHORTAGE_HOME_2_LEAD:0 "Seit zwei Monaten meldet unser Markt den Mangel einer wichtigen Ware. Andere Erfolge lösen diese Frage nicht."
 NFP30_SHORTAGE_HOME_2_TITLE:0 "Der Mangel verdient Aufmerksamkeit"
 NFP30_SHORTAGE_METRICS:0 "Ware: [Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]. Zwei aufeinanderfolgende Monatsbeobachtungen verzeichnen einen Mangel auf unserem Markt."
 NFP30_SHORTAGE_RECOVERY_HOME_1_BODY:0 "Ware: [Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]. Nach unserer Warnung zeigen zwei aufeinanderfolgende Monatsbeobachtungen den früheren Marktmangel nicht mehr.\n\nWir halten fest, dass der frühere Mangel nicht mehr auftritt. Das verspricht noch keine niedrigen Preise: Teuerung und Knappheit sind verschiedene Fragen."
 NFP30_SHORTAGE_RECOVERY_HOME_1_LEAD:0 "Gute Nachrichten zu einer Ware, über deren Mangel wir bereits berichtet haben."
 NFP30_SHORTAGE_RECOVERY_HOME_1_TITLE:0 "Der frühere Mangel lässt nach"
 NFP30_SHORTAGE_RECOVERY_HOME_2_BODY:0 "Ware: [Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]. Nach unserer Warnung zeigen zwei aufeinanderfolgende Monatsbeobachtungen den früheren Marktmangel nicht mehr.\n\nDie Verbesserung hält seit zwei Monaten an. Die Zeitung unterscheidet weiter zwischen Verfügbarkeit und Bezahlbarkeit; Letztere belegt dieser Bericht nicht."
 NFP30_SHORTAGE_RECOVERY_HOME_2_LEAD:0 "Unsere Marktbeobachtungen bringen die erhoffte Nachricht nach der Warnung: Der Mangel wird nicht mehr verzeichnet."
 NFP30_SHORTAGE_RECOVERY_HOME_2_TITLE:0 "Eine erfreuliche Wende beim Warenmangel"
 NFP30_SHORTAGE_RECOVERY_METRICS:0 "Ware: [Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]. Nach unserer Warnung zeigen zwei aufeinanderfolgende Monatsbeobachtungen den früheren Marktmangel nicht mehr."
 NFP30_TECH_AWAY_1_BODY:0 "Das Land verfügt nun über die Technologie [Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)].\n\nDie Möglichkeiten des Landes sind gewachsen. Grund genug, unsere eigenen Angelegenheiten anzusehen: Was können wir bereits, und wie nutzen wir es? Glückwünsche können auf die Post warten. Einen nützlichen Gedanken für uns sollten wir gleich behalten."
 NFP30_TECH_AWAY_1_LEAD:0 "Im Ausland wurde eine neue Technologie erworben. Während wir vertraute Berichte lasen, gewann ein anderes Land neue Möglichkeiten. Sehen wir nach, welche."
 NFP30_TECH_AWAY_1_TITLE:0 "Im Ausland kann man nun mehr"
 NFP30_TECH_AWAY_2_BODY:0 "Das Land verfügt nun über die Technologie [Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)].\n\nDie Möglichkeiten des Landes sind gewachsen. Grund genug, unsere eigenen Angelegenheiten anzusehen: Was können wir bereits, und wie nutzen wir es? Glückwünsche können auf die Post warten. Einen nützlichen Gedanken für uns sollten wir gleich behalten."
 NFP30_TECH_AWAY_2_LEAD:0 "Im Ausland wurde eine neue Technologie erworben. Während wir vertraute Berichte lasen, gewann ein anderes Land neue Möglichkeiten. Sehen wir nach, welche."
 NFP30_TECH_AWAY_2_TITLE:0 "Im Ausland kann man nun mehr"
 NFP30_TECH_HOME_1_BODY:0 "Das Land verfügt nun über die Technologie [Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)].\n\nWir wissen nun mehr; jetzt gilt es, das Wissen gut zu nutzen. Unser Land hat Anlass zum Stolz und zur Arbeit. Die nächste Geschichte sollte davon handeln, was dieses Wissen ermöglicht hat. Eine Liste der Möglichkeiten ist schön. Sie zu nutzen ist schöner."
 NFP30_TECH_HOME_1_LEAD:0 "Unser Land hat eine neue Technologie erworben. Gute Nachrichten für alle, die die Wirtschaft mit mehr als Versprechen voranbringen wollen."
 NFP30_TECH_HOME_1_TITLE:0 "Mehr Wissen. Nun an die Arbeit"
 NFP30_TECH_HOME_2_BODY:0 "Das Land verfügt nun über die Technologie [Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)].\n\nWir wissen nun mehr; jetzt gilt es, das Wissen gut zu nutzen. Unser Land hat Anlass zum Stolz und zur Arbeit. Die nächste Geschichte sollte davon handeln, was dieses Wissen ermöglicht hat. Eine Liste der Möglichkeiten ist schön. Sie zu nutzen ist schöner."
 NFP30_TECH_HOME_2_LEAD:0 "Unser Land hat eine neue Technologie erworben. Gute Nachrichten für alle, die die Wirtschaft mit mehr als Versprechen voranbringen wollen."
 NFP30_TECH_HOME_2_TITLE:0 "Mehr Wissen. Nun an die Arbeit"
