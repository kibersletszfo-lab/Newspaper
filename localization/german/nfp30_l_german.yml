 NFP30_PRICE_FIRST:0 "Für diese Waren fehlen noch vergleichbare Vormonatswerte. Gezeigt werden nur die zuletzt beobachteten Preise."
 NFP30_PRICE_LEAD_1:0 "Diesmal schlagen wir den Marktbericht auf. Große Nachrichten für die Seiten blieben aus; Preise verdienen auch in einem ruhigen Monat Aufmerksamkeit. Besonders, wenn man den Einkauf selbst bezahlt."
 NFP30_PRICE_LEAD_2:0 "Diesmal schlagen wir den Marktbericht auf. Große Nachrichten für die Seiten blieben aus; Preise verdienen auch in einem ruhigen Monat Aufmerksamkeit. Besonders, wenn man den Einkauf selbst bezahlt."
 NFP30_PRICE_MARKET:0 "Markt: [ScriptContainer.MakeScope.Var('nfp32_market_owner').GetCountryDefinition.GetName]."
 NFP30_PRICE_METHOD:0 "Gezeigt werden bis zu sechs Waren mit den größten Preisänderungen zwischen aufeinanderfolgenden Monatsbeobachtungen. Der Pfeil führt vom früheren zum jüngsten Preis, die Änderung steht in Klammern. Neu beobachtete Waren zeigen nur den letzten Preis. Dies sind Marktpreise, keine örtlichen Preise einzelner Staaten oder Monatsdurchschnitte."
 NFP30_PRICE_METRICS:0 "Gewöhnlicher Bericht anstelle einer leeren Ausgabe. Zeilen: [ScriptContainer.GetVariableValue('nfp32_rows')|0]; Vergleiche: [ScriptContainer.GetVariableValue('nfp32_comparisons')|0]. Die Aufnahme erfolgt einmal je Kalendermonat; Wochenausgaben im selben Monat verwenden dieselben Zahlen. Ein Marktwechsel oder eine Beobachtungslücke unterbricht den Vergleich. Preise werden aus dem Grundpreis der Ware und der Marktpreisabweichung im Spiel berechnet. Tabelle und Reihenfolge stehen seit Veröffentlichung fest."
 NFP30_PRICE_ROW_EMPTY:0 ""
 NFP30_PRICE_SAME:0 "—"
 NFP30_PRICE_TITLE_1:0 "Was kostet der tägliche Einkauf heute?"
 NFP30_PRICE_TITLE_2:0 "Was kostet der tägliche Einkauf heute?"
 NFP30_PRICE_UNAVAILABLE:0 "Für diesen Bericht liegen keine Preise vor. Die Redaktion hat die Tabelle nicht mit erfundenen Zahlen gefüllt."
 NFP30_PRICE_UP:0 "@arrow_up!"
 NFP30_PRODUCTION_AWAY_1_BODY:0 "Ware: [Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]. Früherer Platz außerhalb der ersten drei: [ScriptContainer.GetVariableValue('nfp20_before')|0]; zuletzt: [ScriptContainer.GetVariableValue('nfp20_after')|0]. Zwei Monatsbeobachtungen bestätigen den Platz unter den ersten drei.\n\nDas Bild der Weltproduktion verändert sich. Die Rangliste misst die Menge; Gewinne, Ausfuhren oder Preise auf unserem Markt gehen daraus nicht hervor."
 NFP30_PRODUCTION_AWAY_1_LEAD:0 "Ein anderes Land ist bei einer wichtigen Ware unter die drei größten Produzenten aufgerückt und hält seinen Platz im zweiten Monat."
 NFP30_PRODUCTION_AWAY_1_TITLE:0 "Ein neuer Name unter den führenden Produzenten"
 NFP30_PRODUCTION_AWAY_2_BODY:0 "Ware: [Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]. Früherer Platz außerhalb der ersten drei: [ScriptContainer.GetVariableValue('nfp20_before')|0]; zuletzt: [ScriptContainer.GetVariableValue('nfp20_after')|0]. Zwei Monatsbeobachtungen bestätigen den Platz unter den ersten drei.\n\nProduktionsmenge und Handelseinfluss sind verschiedene Dinge. Ein Platz auf dieser Liste allein belegt Letzteren nicht."
 NFP30_PRODUCTION_AWAY_2_LEAD:0 "Die ausländische Produktion einer wichtigen Ware gehört nun zu den drei größten der Welt."
 NFP30_PRODUCTION_AWAY_2_TITLE:0 "Ein großer Produzent stärkt seine Stellung im Ausland"
 NFP30_PRODUCTION_HOME_1_BODY:0 "Ware: [Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]. Früherer Platz außerhalb der ersten drei: [ScriptContainer.GetVariableValue('nfp20_before')|0]; zuletzt: [ScriptContainer.GetVariableValue('nfp20_after')|0]. Zwei Monatsbeobachtungen bestätigen den Platz unter den ersten drei.\n\nEin beachtliches Produktionsergebnis. Der Vergleich misst die Menge; Rentabilität, Ausfuhren und Lebensverhältnisse der Beschäftigten brauchen eigene Belege."
 NFP30_PRODUCTION_HOME_1_LEAD:0 "Unser Land hat sich unter den drei größten Produzenten einer wichtigen Ware etabliert."
 NFP30_PRODUCTION_HOME_1_TITLE:0 "Unsere Produktion erreicht die ersten drei der Welt"
 NFP30_PRODUCTION_HOME_2_BODY:0 "Ware: [Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]. Früherer Platz außerhalb der ersten drei: [ScriptContainer.GetVariableValue('nfp20_before')|0]; zuletzt: [ScriptContainer.GetVariableValue('nfp20_after')|0]. Zwei Monatsbeobachtungen bestätigen den Platz unter den ersten drei.\n\nEin hoher Produktionsrang ist ein messbarer Erfolg. Was er gekostet hat oder wie sehr jede Familie davon profitiert, zeigt diese Liste nicht."
 NFP30_PRODUCTION_HOME_2_LEAD:0 "Zwei Monate unter den drei größten Produzenten geben Anlass, einen heimischen Industrieerfolg festzuhalten."
 NFP30_PRODUCTION_HOME_2_TITLE:0 "Heimische Produktion unter den Weltführenden"
 NFP30_PRODUCTION_METRICS:0 "Ware: [Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]. Früherer Platz außerhalb der ersten drei: [ScriptContainer.GetVariableValue('nfp20_before')|0]; zuletzt: [ScriptContainer.GetVariableValue('nfp20_after')|0]. Zwei Monatsbeobachtungen bestätigen den Platz unter den ersten drei."
 NFP30_PUBLICATION_KIND:0 "[SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp_kind'), '(CFixedPoint)3'), 'NFP30_URGENT', SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp_kind'), '(CFixedPoint)1'), 'NFP30_REGULAR', 'NFP30_MANUAL'))]"
 NFP30_RANK_AWAY_1_BODY:0 "Früherer Status: [Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]; neuer Status: [Localize(ScriptContainer.MakeScope.Var('nfp20_extra_detail').GetFlagName)].\n\nFür unsere Leser gehört dies zum Wandel des Weltbilds. Ein Kategorienwechsel bedeutet nicht unbedingt das Auftreten einer neuen Großmacht."
 NFP30_RANK_AWAY_1_LEAD:0 "Ein anderes Land hat einen anderen internationalen Status erhalten."
 NFP30_RANK_AWAY_1_TITLE:0 "Das Gefüge der Mächte verändert sich"
 NFP30_RANK_AWAY_2_BODY:0 "Früherer Status: [Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]; neuer Status: [Localize(ScriptContainer.MakeScope.Var('nfp20_extra_detail').GetFlagName)].\n\nWir nennen beide Statusstufen, damit Leser die Richtung erkennen können. Ursachen und Folgen brauchen eine eigene Untersuchung."
 NFP30_RANK_AWAY_2_LEAD:0 "Eine Nachricht über den Rangwechsel eines anderen Landes ist eingetroffen."
 NFP30_RANK_AWAY_2_TITLE:0 "Eine fremde Macht wechselt ihren Status"
 NFP30_RANK_HOME_1_BODY:0 "Früherer Status: [Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]; neuer Status: [Localize(ScriptContainer.MakeScope.Var('nfp20_extra_detail').GetFlagName)].\n\nDie Änderung verdient eigene Aufmerksamkeit. Ihre Richtung ergibt sich aus den gezeigten Kategorien; nicht jeder Rangwechsel ist ein Aufstieg."
 NFP30_RANK_HOME_1_LEAD:0 "Die internationale Stellung unseres Landes ist neu bewertet. Wir nennen den früheren und den neuen Status."
 NFP30_RANK_HOME_1_TITLE:0 "Unser Platz unter den Mächten hat sich verändert"
 NFP30_RANK_HOME_2_BODY:0 "Früherer Status: [Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]; neuer Status: [Localize(ScriptContainer.MakeScope.Var('nfp20_extra_detail').GetFlagName)].\n\nDie Zeitung hält eine Änderung der Stellung fest. Der Name des neuen Rangs allein erklärt weder Ursachen noch diplomatische Folgen."
 NFP30_RANK_HOME_2_LEAD:0 "Unser Land gehört nun zu einer anderen Kategorie von Mächten."
 NFP30_RANK_HOME_2_TITLE:0 "Unser Land erhält einen neuen internationalen Status"
 NFP30_RANK_METRICS:0 "Früherer Status: [Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]; neuer Status: [Localize(ScriptContainer.MakeScope.Var('nfp20_extra_detail').GetFlagName)]."
 NFP30_REACH_DOMESTIC:0 "Ereignis in unserem Land oder mit unserer Seite als Hauptpartei eines Krieges"
 NFP30_REACH_FROZEN:0 "Hauptstadtregionen und Kennzeichnung der Weltbedeutung wurden bei Erfassung des Fakts gespeichert."
