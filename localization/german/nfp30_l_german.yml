 NFP52_ARTICLE_META:0 "Weltchronik · [Localize(ScriptContainer.MakeScope.Var('nfp30_month').GetFlagName)], [ScriptContainer.GetVariableValue('nfp20_year')|0] · Sonderausgabe"
 NFP52_AUS_1_BODY:0 "Ein gemeinsamer australischer Staat ist entstanden. Der ferne Kontinent bringt eine Nachricht für die Titelseite. Mehrere politische Gebilde haben eine gemeinsame Staatsordnung erhalten. Ein vertrauter geografischer Name steht nun auch für gemeinsame Angelegenheiten.\\n\\nAustralien ist entstanden. Geändert hat sich die Ordnung der australischen Gebiete; das bedeutet für sich noch keine Unabhängigkeit. Internationale Verpflichtungen sind eine eigene Frage. Der gemeinsame Staat ist da, seine künftige Stellung hängt von Entscheidungen und Beziehungen zu anderen Mächten ab.\\n\\nDie Vereinigung bietet eine Chance, Fragen gemeinsam zu lösen. Der Alltag wird zeigen, wie gut sie genutzt wird. Der Kontinent ist groß und wird genug gemeinsame Sorgen haben. Hoffentlich bleibt auch Platz für gemeinsamen Nutzen.\\n\\nDie Chronik trägt den Monat, in dem die Nachricht die Redaktion erreichte. Bei verzögerter Verbindung kann das Ereignis selbst früher stattgefunden haben."
