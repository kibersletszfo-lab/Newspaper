 NFP52_TAIPING_2_TITLE:0 "Chinas Krise erhält eine neue Regierung"
 NFP52_YUG_1_BODY:0 "Auf dem Balkan ist ein jugoslawischer Staat entstanden. Die Idee einer gemeinsamen Ordnung hat politische Gestalt gewonnen. Für eine Region, die so oft Gegenstand internationaler Berechnungen ist, hat das besondere Bedeutung: Nun muss ein neuer Staat darin berücksichtigt werden.\\n\\nDie Entstehung Jugoslawiens ist bestätigt. Die südslawische Einigung ist nun Tatsache auf der politischen Karte. Seine Teilgebiete und Beziehungen zu Nachbarn verlangen einen genauen Blick; alte Annahmen über die Region lassen sich nicht einfach in den neuen Bericht kopieren.\\n\\nMit dem gemeinsamen Namen beginnt die Arbeit am Zusammenleben. Unterschiedliche Interessen müssen im Alltag ausgeglichen werden, wenn die Feiern enden. Hoffentlich nützt die Einheit mehr als nur den Kartenzeichnern. Innerhalb der neuen Grenzen müssen Menschen leben, statt sie aus der Ferne zu bewundern.\\n\\nDie Chronik trägt den Monat, in dem die Nachricht die Redaktion erreichte. Bei verzögerter Verbindung kann das Ereignis selbst früher stattgefunden haben."
