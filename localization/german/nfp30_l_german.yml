 NFP43_ELECTION_BASELINE:0 "Vergleich mit dem Wahlbericht aus Ausgabe Nr. [ScriptContainer.GetVariableValue('nfp43_previous_issue')|0]. Für vergleichbare Parteien: vorher → jetzt (Veränderung des Koeffizienten). Ein Gedankenstrich bedeutet, dass kein vergleichbarer früherer Wert vorliegt."
 NFP43_ELECTION_BODY_1:0 "Der Wahlkampf geht weiter, und die Lage der Parteien kann sich noch verändern. Hier sind die von der Redaktion festgehaltenen Werte ihrer Dynamik.\n\n[Localize(ScriptContainer.MakeScope.Var('nfp43_row_1').GetFlagName)]\n[Localize(ScriptContainer.MakeScope.Var('nfp43_row_2').GetFlagName)]\n[Localize(ScriptContainer.MakeScope.Var('nfp43_row_3').GetFlagName)]\n[Localize(ScriptContainer.MakeScope.Var('nfp43_row_4').GetFlagName)]\n[Localize(ScriptContainer.MakeScope.Var('nfp43_row_5').GetFlagName)]\n[Localize(ScriptContainer.MakeScope.Var('nfp43_row_6').GetFlagName)]\n\n[SelectLocalization(GreaterThan_CFixedPoint(ScriptContainer.GetVariableValue('nfp43_previous_issue'), '(CFixedPoint)0'), 'NFP43_ELECTION_BASELINE', 'NFP43_ELECTION_FIRST')]\n\nDies ist ein Zwischenbericht über die Dynamik der Parteien, kein Wahlergebnis und keine Prognose der Stimmenanteile. Die Dynamik beeinflusst den Wahlkampf, bestimmt aber für sich allein noch keinen Sieger. Gezeigt werden höchstens sechs Parteien mit den höchsten Werten bei Redaktionsschluss; die Zahlen sind die unveränderten Spielkoeffizienten."
 NFP43_ELECTION_BODY_2:0 "Der Ausgang des Wahlkampfs ist noch offen. Wir vergleichen die Dynamik der Parteien, ohne sie als ausgezählte Stimmzettel auszugeben.\n\n[Localize(ScriptContainer.MakeScope.Var('nfp43_row_1').GetFlagName)]\n[Localize(ScriptContainer.MakeScope.Var('nfp43_row_2').GetFlagName)]\n[Localize(ScriptContainer.MakeScope.Var('nfp43_row_3').GetFlagName)]\n[Localize(ScriptContainer.MakeScope.Var('nfp43_row_4').GetFlagName)]\n[Localize(ScriptContainer.MakeScope.Var('nfp43_row_5').GetFlagName)]\n[Localize(ScriptContainer.MakeScope.Var('nfp43_row_6').GetFlagName)]\n\n[SelectLocalization(GreaterThan_CFixedPoint(ScriptContainer.GetVariableValue('nfp43_previous_issue'), '(CFixedPoint)0'), 'NFP43_ELECTION_BASELINE', 'NFP43_ELECTION_FIRST')]\n\nDies ist ein Zwischenbericht über die Dynamik der Parteien, kein Wahlergebnis und keine Prognose der Stimmenanteile. Die Dynamik beeinflusst den Wahlkampf, bestimmt aber für sich allein noch keinen Sieger. Gezeigt werden höchstens sechs Parteien mit den höchsten Werten bei Redaktionsschluss; die Zahlen sind die unveränderten Spielkoeffizienten."
 NFP43_ELECTION_FIRST:0 "Für diesen Wahlkampf liegt noch kein früherer veröffentlichter Bericht vor. Parteien ohne vergleichbaren früheren Wert sind mit einem Gedankenstrich gekennzeichnet."
 NFP43_ELECTION_LEAD_1:0 "Bei uns läuft der Wahlkampf weiter. Die Parteien versuchen, Schwung zu gewinnen, und die Redaktion verfolgt, wie sich ihre Aussichten verändern. Siegesreden drucken wir noch nicht: Dafür fehlt eine kleine Einzelheit – das Wahlergebnis."
 NFP43_ELECTION_LEAD_2:0 "Bei uns läuft der Wahlkampf weiter. Die Parteien versuchen, Schwung zu gewinnen, und die Redaktion verfolgt, wie sich ihre Aussichten verändern. Siegesreden drucken wir noch nicht: Dafür fehlt eine kleine Einzelheit – das Wahlergebnis."
 NFP43_ELECTION_METRICS:0 "Momentaufnahme bei Redaktionsschluss; Typ24, Rubrik Gesellschaft. Verglichen wird ausschließlich mit dem letzten veröffentlichten Wahlbericht desselben Wahlkampfs. Ein nicht ausgewählter Nachrichtenkandidat verändert die Vergleichsbasis nicht. Ein neuer Wahlkampf und eine erstmals beobachtete Partei erhalten keine erfundene Vorgeschichte. Zahlen und Reihenfolge werden gespeichert; Parteinamen können sich im Spiel weiterhin ändern."
