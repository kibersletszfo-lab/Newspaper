 NFP51_DETAIL:0 "diplomatische Krise"
 NFP51_END_1_CORE:0 "In der Auseinandersetzung zwischen dem Initiator [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName] und dem Ziel [ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName] ist [ScriptContainer.MakeScope.Var('nfp51_actor').GetCountryDefinition.GetName] zurückgewichen. Streitpunkt: [Localize(ScriptContainer.MakeScope.Var('nfp51_play_label').GetFlagName)]."
 NFP51_END_1_END:0 "Diese Krise endete ohne Krieg. Der Rückzug einer Seite hat nicht jeden Streit zwischen den Ländern beseitigt. Eine Einigung vor dem Kampf verdient aber ihre eigene Zeile. Für die Zeitung ein weniger spektakuläres Ende. Für die Menschen, die es erleben müssen, vielleicht ein viel glücklicheres."
 NFP51_END_1_LEAD:0 "[ScriptContainer.MakeScope.Var('nfp51_actor').GetCountryDefinition.GetName] ist in der diplomatischen Auseinandersetzung zurückgewichen."
 NFP51_END_1_TITLE:0 "Zurückgewichen, bevor die Kanonen sprachen"
 NFP51_END_2_CORE:0 "Die Auseinandersetzung zwischen [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName] und [ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName] endete, ohne zum Krieg zu werden: [ScriptContainer.MakeScope.Var('nfp51_actor').GetCountryDefinition.GetName] ist zurückgewichen. Streitpunkt: [Localize(ScriptContainer.MakeScope.Var('nfp51_play_label').GetFlagName)]."
 NFP51_END_2_END:0 "Diese Krise endete ohne Krieg. Der Rückzug einer Seite hat nicht jeden Streit zwischen den Ländern beseitigt. Eine Einigung vor dem Kampf verdient aber ihre eigene Zeile. Für die Zeitung ein weniger spektakuläres Ende. Für die Menschen, die es erleben müssen, vielleicht ein viel glücklicheres."
 NFP51_END_2_LEAD:0 "[ScriptContainer.MakeScope.Var('nfp51_actor').GetCountryDefinition.GetName] wich zurück, bevor das diplomatische Spiel zum Krieg wurde."
 NFP51_END_2_TITLE:0 "Zurückgewichen, bevor die Kanonen sprachen"
 NFP51_JOIN_1_CORE:0 "Im Berichtsmonat trat [ScriptContainer.MakeScope.Var('nfp51_actor').GetCountryDefinition.GetName] auf die Seite von [ScriptContainer.MakeScope.Var('nfp51_side').GetCountryDefinition.GetName] in der diplomatischen Auseinandersetzung zwischen [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName] und [ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName]. Streitpunkt: [Localize(ScriptContainer.MakeScope.Var('nfp51_play_label').GetFlagName)]."
 NFP51_JOIN_1_END:0 "Neue Unterstützung verändert die Rechnung beider Seiten. Allein Forderungen stellen ist das eine; zu wissen, wer neben einem steht, etwas anderes. Noch ist es eine diplomatische Auseinandersetzung. Wir werden sehen, ob die größere Runde eine Einigung erleichtert oder nur mehr Menschen zusammenbringt, die ihren Willen durchsetzen wollen."
 NFP51_JOIN_1_LEAD:0 "[ScriptContainer.MakeScope.Var('nfp51_actor').GetCountryDefinition.GetName] hat die Seite von [ScriptContainer.MakeScope.Var('nfp51_side').GetCountryDefinition.GetName] unterstützt."
 NFP51_JOIN_1_TITLE:0 "Am Streittisch wird es voller"
 NFP51_JOIN_2_CORE:0 "Die diplomatische Auseinandersetzung hat einen neuen Teilnehmer: [ScriptContainer.MakeScope.Var('nfp51_actor').GetCountryDefinition.GetName]. Das Land unterstützt [ScriptContainer.MakeScope.Var('nfp51_side').GetCountryDefinition.GetName]; die Hauptparteien sind [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName] und [ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName]. Streitpunkt: [Localize(ScriptContainer.MakeScope.Var('nfp51_play_label').GetFlagName)]."
 NFP51_JOIN_2_END:0 "Neue Unterstützung verändert die Rechnung beider Seiten. Allein Forderungen stellen ist das eine; zu wissen, wer neben einem steht, etwas anderes. Noch ist es eine diplomatische Auseinandersetzung. Wir werden sehen, ob die größere Runde eine Einigung erleichtert oder nur mehr Menschen zusammenbringt, die ihren Willen durchsetzen wollen."
 NFP51_JOIN_2_LEAD:0 "[ScriptContainer.MakeScope.Var('nfp51_side').GetCountryDefinition.GetName] ist auf die Seite von [ScriptContainer.MakeScope.Var('nfp51_actor').GetCountryDefinition.GetName] getreten."
 NFP51_JOIN_2_TITLE:0 "Am Streittisch wird es voller"
 NFP51_METRICS:0 "Quelle: ursprüngliche Signale diplomatischer Spiele in 1.15.0. Das Ereignis wurde bei Eingang gespeichert; der Artikel trägt den Ereignismonat. Krisennummer: [ScriptContainer.GetVariableValue('nfp51_crisis')|0]. Ausgang und Beteiligung weiterer Länder werden nicht aus der aktuellen Welt rekonstruiert. Dieses Material ist nur für reguläre Ausgaben ohne Eilzustellung vorgesehen. Der Text unterscheidet unmittelbare Beteiligung, förmliche Verbündete und Machtblockpartner."
