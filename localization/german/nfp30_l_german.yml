 NFP52_ITA_2_TITLE:0 "Ein gemeinsamer Name erhält eine gemeinsame Regierung"
 NFP52_JAP_1_BODY:0 "In Japan wurde die kaiserliche Herrschaft wiederhergestellt. Die Rede von der Rückkehr zur alten Ordnung öffnet hier eine neue Seite. Das frühere Verhältnis zwischen Kaiserhof und Shogunat hat sich verändert. Ein für viele Leser fernes Land gibt Anlass zu fragen, wohin es nun gehen will.\\n\\nDie kaiserliche Restauration hat stattgefunden. Das politische Zentrum des Landes hat eine andere Stellung; damit stellt sich die Frage nach der künftigen Ordnung des japanischen Lebens. Die feierliche Verkündung ist erfolgt. Die Alltagsfolgen hängen von den nächsten Entscheidungen ab.\\n\\nDie Wiederherstellung der Macht macht nicht jede künftige Änderung zur vollendeten Tatsache. Japan muss zeigen, wie es die neue Ordnung nutzt. Wir möchten diese Geschichte an Taten beurteilen. Feierlichen Titeln fehlt es bekanntlich selten an Versprechen.\\n\\nDie Chronik trägt den Monat, in dem die Nachricht die Redaktion erreichte. Bei verzögerter Verbindung kann das Ereignis selbst früher stattgefunden haben."
