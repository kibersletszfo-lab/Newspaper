 NFP50_LAW_GOV_YES_NAME:0 " Die einflussreichste Gruppe unter den Befürwortern in der Regierung ist „[Localize(ScriptContainer.MakeScope.Var('nfp50_law_gov_yes_type').GetFlagName)]“."
