 NFP52_TAIPING_1_BODY:0 "In China ist ein Taiping-Staat entstanden. Die Auseinandersetzung hat ein eigenständiges politisches Zentrum erhalten. Nun geht es nicht nur darum, was Gegnern der alten Ordnung missfällt, sondern auch darum, welche Regierung sie an ihre Stelle setzen wollen.\\n\\nDas Himmlische Reich besteht als eigenständige politische Kraft. Chinas Krise hat eine neue Form angenommen; der vertraute Bericht über eine weitere Unruhe genügt nicht mehr. Aus einem Streit mit der Obrigkeit ist eine Obrigkeit geworden, die einen eigenen Platz beansprucht.\\n\\nHinter großen Ansprüchen bleibt das Leben der Menschen. Verlauf der Auseinandersetzung und künftige Machthaber stehen noch nicht fest. Wir verfolgen die Ereignisse und behalten im Kopf: Für die Einwohner bedeutet eine Änderung auf der Karte weit mehr als eine neue Zeile in der Auslandsspalte.\\n\\nDie Chronik trägt den Monat, in dem die Nachricht die Redaktion erreichte. Bei verzögerter Verbindung kann das Ereignis selbst früher stattgefunden haben."
