 NFP52_JAP_2_TITLE:0 "Japans Staatsordnung verändert sich"
 NFP52_METRICS:0 "Weltereignis. Eingang: [Localize(ScriptContainer.MakeScope.Var('nfp30_month').GetFlagName)], [ScriptContainer.GetVariableValue('nfp20_year')|0]. Einmalige Meldung nach Beobachtungsbeginn."
 NFP52_PANAMA_1_BODY:0 "Der Panamakanal ist fertiggestellt. Eine neue Durchfahrt verbindet Atlantik und Pazifik. Auf dem Papier sieht das Land dazwischen recht schmal aus. Den Erbauern dürfte mehr als diese beruhigende Beobachtung abverlangt worden sein. Hinter der Linie auf der Karte steht nun ein fertiges Bauwerk.\\n\\nDer Kanalbau ist abgeschlossen. Seerouten erhalten eine neue Möglichkeit; alte Vorstellungen von der Reise zwischen beiden Ozeanen müssen überprüft werden. Das Ausmaß der Änderung ist ohne feierliche Liste aller künftigen Vorteile klar: Wo keine Durchfahrt war, besteht nun eine.\\n\\nAuf die Ingenieursleistung folgen nun wirtschaftliche Berechnungen. Der neue Weg muss genutzt, sein Vorteil praktisch umgesetzt werden. Der Anlass zu Glückwünschen ist bereits greifbar. Verschiedene Seiten der Welt näherzubringen gelingt manchmal ganz wörtlich.\\n\\nDie Chronik trägt den Monat, in dem die Nachricht die Redaktion erreichte. Bei verzögerter Verbindung kann das Ereignis selbst früher stattgefunden haben."
