 NFP51_RELATION_ALLY:0 "Zum Ereigniszeitpunkt war mindestens eine Hauptpartei förmlich mit unserem Land verbündet. Ein Bündnis allein belegt weder unsere Beteiligung an diesem diplomatischen Spiel noch an einem künftigen Krieg."
 NFP51_RELATION_BLOC:0 "Zum Ereigniszeitpunkt gehörte mindestens eine Hauptpartei zu unserem Machtblock. Derselbe Block ist kein Militärbündnis und bedeutet keine automatische Teilnahme."
 NFP51_RELATION_JOINER:0 "In diesem Bericht ist unser Land der neue Teilnehmer am diplomatischen Spiel. Beteiligung allein bedeutet nicht, dass der Krieg begonnen hat."
 NFP51_RELATION_JOINER_ALLY:0 "Das beitretende Land war zum Ereigniszeitpunkt förmlich mit uns verbündet. Seine Entscheidung bedeutet nicht automatisch den Beitritt unseres Landes."
 NFP51_RELATION_JOINER_BLOC:0 "Das beitretende Land gehörte zum Ereigniszeitpunkt zu unserem Machtblock. Gemeldet wird seine Position, keine erzwungene Teilnahme des ganzen Blocks."
 NFP51_RELATION_OWN:0 "Unser Land ist eine der beiden Hauptparteien dieser Auseinandersetzung. Die Nachricht betrifft unsere Diplomatie somit unmittelbar."
 NFP51_SPECIAL_HINT:0 "Diese Sonderausgabe ist vollständig einem einzigen Ereignis gewidmet."
 NFP51_SPECIAL_LABEL:0 "Sonderausgabe"
 NFP51_START_1_CORE:0 "Im Berichtsmonat begann eine diplomatische Auseinandersetzung. Initiator ist [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName]; ursprüngliches Ziel ist [ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName]. Streitpunkt: [Localize(ScriptContainer.MakeScope.Var('nfp51_play_label').GetFlagName)]."
 NFP51_START_1_END:0 "Noch hat kein Krieg begonnen. Die Seiten können Unterstützung suchen, nachgeben oder standhalten. Hoffentlich findet sich ein überzeugendes Argument, bevor eine Kanone zum einzig überzeugenden erklärt wird. Wir verfolgen die Entwicklung dieses Streits."
 NFP51_START_1_LEAD:0 "Die Forderungen kommen von [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName]; die andere Partei ist [ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName]."
