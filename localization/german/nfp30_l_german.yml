 NFP50_LAW_OWN_COMPARE_1:0 "Und wie käme eine ähnliche Änderung bei uns an? Unter den Regierungsgruppen entfallen [ScriptContainer.GetVariableValue('nfp50_law_own_yes')|1]% des politischen Gewichts auf Befürworter und [ScriptContainer.GetVariableValue('nfp50_law_own_no')|1]% auf Gegner. Das vergleicht unsere Ansichten zum Gesetz, keine erklärte Reaktion auf eine fremde Entscheidung. Im Ausland ist die Ordnung bereits geändert. Wir haben vorerst Anlass zu überlegen, was uns an der eigenen gefällt."
 NFP50_LAW_OWN_COMPARE_2:0 "Und wie käme eine ähnliche Änderung bei uns an? Unter den Regierungsgruppen entfallen [ScriptContainer.GetVariableValue('nfp50_law_own_yes')|1]% des politischen Gewichts auf Befürworter und [ScriptContainer.GetVariableValue('nfp50_law_own_no')|1]% auf Gegner. Das vergleicht unsere Ansichten zum Gesetz, keine erklärte Reaktion auf eine fremde Entscheidung. Im Ausland ist die Ordnung bereits geändert. Wir haben vorerst Anlass zu überlegen, was uns an der eigenen gefällt."
 NFP50_LAW_OWN_SAME_1:0 "Dieses Gesetz gilt auch bei uns. Vergleichen lassen sich also bereits mehr als Versprechen. Interessant wird, wie ein anderes Land mit ähnlichen Regeln zurechtkommt. Gleiche Zeilen im Gesetzbuch machen das Leben auf beiden Seiten der Grenze noch nicht gleich."
 NFP50_LAW_OWN_SAME_2:0 "Dieses Gesetz gilt auch bei uns. Vergleichen lassen sich also bereits mehr als Versprechen. Interessant wird, wie ein anderes Land mit ähnlichen Regeln zurechtkommt. Gleiche Zeilen im Gesetzbuch machen das Leben auf beiden Seiten der Grenze noch nicht gleich."
