 NFP52_CAN_1_BODY:0 "Kanada hat eine gemeinsame Staatsordnung erhalten. Für Außenstehende verändert sich damit seine Stellung auf der Karte. Für die kanadischen Länder selbst eröffnet sich die Chance, mehr Fragen zusammen zu lösen. Ihr gemeinsamer Name ist nun mehr als Geografie.\\n\\nDie kanadische Vereinigung hat stattgefunden. Ein Staat ist entstanden, der die gemeinsamen Angelegenheiten seiner Gebiete regelt. Die Beziehungen zum Oberherrn werden gesondert bestimmt: Vereinigung ist für sich keine Unabhängigkeitserklärung.\\n\\nGemeinsame Entscheidungen müssen nun mit Inhalt gefüllt werden. Entfernungen, Wirtschaftsfragen und unterschiedliche örtliche Interessen verschwinden nicht unter einem neuen Schild. Doch für diese Fragen gibt es nun eine gemeinsame Adresse. Hoffentlich finden sich dort auch Antworten.\\n\\nDie Chronik trägt den Monat, in dem die Nachricht die Redaktion erreichte. Bei verzögerter Verbindung kann das Ereignis selbst früher stattgefunden haben."
