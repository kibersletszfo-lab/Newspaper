 NFP50_LAW_INTRO_AWAY_1:0 "Im Ausland wurde ein Gesetz geändert. Über fremde Verhältnisse lässt sich aus sicherer Entfernung bequem reden. Manchmal lässt eine solche Nachricht aber auch auf die eigenen schauen: Was ist bei uns anders, und sind wir mit dem Unterschied zufrieden?"
 NFP50_LAW_INTRO_AWAY_2:0 "Im Ausland wurde ein Gesetz geändert. Über fremde Verhältnisse lässt sich aus sicherer Entfernung bequem reden. Manchmal lässt eine solche Nachricht aber auch auf die eigenen schauen: Was ist bei uns anders, und sind wir mit dem Unterschied zufrieden?"
 NFP50_LAW_INTRO_HOME_1:0 "Bei uns hat sich ein Gesetz geändert. Die Regeln des Landes gefallen selten allen gleichermaßen: Einem öffnen sie eine Tür, einen anderen erinnern sie daran, dass der Schlüssel nun nicht mehr ihm gehört. Sehen wir, was genau anders wurde und wem der neue Eintrag im Gesetzbuch zusagt."
 NFP50_LAW_INTRO_HOME_2:0 "Bei uns hat sich ein Gesetz geändert. Die Regeln des Landes gefallen selten allen gleichermaßen: Einem öffnen sie eine Tür, einen anderen erinnern sie daran, dass der Schlüssel nun nicht mehr ihm gehört. Sehen wir, was genau anders wurde und wem der neue Eintrag im Gesetzbuch zusagt."
 NFP50_LAW_MEANING_LAW_COMPULSORY_PRIMARY_SCHOOL_1:0 "Kinder sollen lernen, Kinderarbeit wird begrenzt. Das Gesetz erlaubt einen Ausbau des Schulwesens. Dahinter steht eine verständliche Möglichkeit: Das Erwachsenenleben lesekundig zu beginnen, nicht bloß arbeitsfähig. Zwischen der Schulpflicht auf dem Papier und einem Platz am Pult braucht es allerdings Schulen und Geld. Von der Strenge einer Verordnung wandern Buchstaben nicht in den Kopf."
 NFP50_LAW_MEANING_LAW_COMPULSORY_PRIMARY_SCHOOL_2:0 "Kinder sollen lernen, Kinderarbeit wird begrenzt. Das Gesetz erlaubt einen Ausbau des Schulwesens. Dahinter steht eine verständliche Möglichkeit: Das Erwachsenenleben lesekundig zu beginnen, nicht bloß arbeitsfähig. Zwischen der Schulpflicht auf dem Papier und einem Platz am Pult braucht es allerdings Schulen und Geld. Von der Strenge einer Verordnung wandern Buchstaben nicht in den Kopf."
 NFP50_LAW_MEANING_LAW_GUARANTEED_LIBERTIES_1:0 "Garantierte Freiheiten begrenzen die innere Sicherheit. Die Sorge um Ordnung muss die Rechte der Einwohner berücksichtigen. Besonders angenehm für den, dessen Meinung unbequem ist. Viel hängt nun von den Innenbehörden ab: Ein schönes Freiheitsversprechen verdient eine würdige Fortsetzung jenseits des bedruckten Blatts."
 NFP50_LAW_MEANING_LAW_GUARANTEED_LIBERTIES_2:0 "Garantierte Freiheiten begrenzen die innere Sicherheit. Die Sorge um Ordnung muss die Rechte der Einwohner berücksichtigen. Besonders angenehm für den, dessen Meinung unbequem ist. Viel hängt nun von den Innenbehörden ab: Ein schönes Freiheitsversprechen verdient eine würdige Fortsetzung jenseits des bedruckten Blatts."
 NFP50_LAW_MEANING_LAW_PROTECTED_SPEECH_1:0 "Das freie Wort erhält gesetzlichen Schutz. Der Staat verliert frühere Mittel, manche politische Bewegungen zu unterdrücken und andere zu fördern. Für die Debatte ist das wichtig: Überzeugende Argumente lassen sich schwerer durch bequeme Verbote ersetzen. Hoffentlich wächst mit dem Raum für Worte auch der für Gedanken."
 NFP50_LAW_MEANING_LAW_PROTECTED_SPEECH_2:0 "Das freie Wort erhält gesetzlichen Schutz. Der Staat verliert frühere Mittel, manche politische Bewegungen zu unterdrücken und andere zu fördern. Für die Debatte ist das wichtig: Überzeugende Argumente lassen sich schwerer durch bequeme Verbote ersetzen. Hoffentlich wächst mit dem Raum für Worte auch der für Gedanken."
 NFP50_LAW_MEANING_LAW_SLAVERY_BANNED_1:0 "Sklaverei gilt nicht mehr als rechtmäßig. Ein Mensch ist nicht länger fremdes Eigentum; kaum eine bloße Korrektur im Papierwerk. Freiheit allein verschafft noch keinen Verdienst und keine gesellschaftliche Gleichstellung. Doch wenigstens darf niemand mehr rechtmäßig über Menschen wie über die Dinge im eigenen Haus verfügen."
 NFP50_LAW_MEANING_LAW_SLAVERY_BANNED_2:0 "Sklaverei gilt nicht mehr als rechtmäßig. Ein Mensch ist nicht länger fremdes Eigentum; kaum eine bloße Korrektur im Papierwerk. Freiheit allein verschafft noch keinen Verdienst und keine gesellschaftliche Gleichstellung. Doch wenigstens darf niemand mehr rechtmäßig über Menschen wie über die Dinge im eigenen Haus verfügen."
 NFP50_LAW_MEANING_LAW_WOMENS_SUFFRAGE_1:0 "Frauen haben mehr Rechte zur politischen Teilnahme erhalten. Über die Zukunft des Landes lässt sich nun schwerer sprechen, als bestünde die Bevölkerung nur aus Männern. Wie das neue Recht wirkt, hängt auch von der Wahlordnung ab. Ein Anlass, vertraute Vorstellungen darüber zu prüfen, wer über gemeinsame Angelegenheiten entscheiden darf, ist bereits da."
 NFP50_LAW_MEANING_LAW_WOMENS_SUFFRAGE_2:0 "Frauen haben mehr Rechte zur politischen Teilnahme erhalten. Über die Zukunft des Landes lässt sich nun schwerer sprechen, als bestünde die Bevölkerung nur aus Männern. Wie das neue Recht wirkt, hängt auch von der Wahlordnung ab. Ein Anlass, vertraute Vorstellungen darüber zu prüfen, wer über gemeinsame Angelegenheiten entscheiden darf, ist bereits da."
