 NFP52_ETH_2_TITLE:0 "Am Horn von Afrika ändert sich die Karte"
 NFP52_FLU_1_BODY:0 "Berichte über eine große Grippeepidemie sind eingetroffen. Solche Nachrichten lesen sich anders als Meldungen diplomatischer Erfolge. Krankheit berührt die einfachste Hoffnung: dass die Menschen, die uns nahestehen, gesund bleiben und der nächste Morgen nicht mit Sorge um sie beginnt.\\n\\nDie als Spanische Grippe bekannte Epidemie hat begonnen. Anlass, ihre Ausbreitung und die Lage betroffener Länder zu verfolgen. Die Nachricht eines Weltereignisses bedeutet nicht, dass es uns bereits erreicht hat. Entfernung von den ersten Meldungen sollte aber nicht mit einem Sicherheitsversprechen verwechselt werden.\\n\\nVerlässliche Angaben sind jetzt besonders nötig. In unruhigen Zeiten füllen Gerüchte leicht die Lücken unseres Wissens; besser versorgt wird davon niemand. Wir kehren zum Thema zurück, sobald Nachrichten eintreffen. Hoffentlich können wir bald melden, dass die Gefahr nachlässt.\\n\\nDie Chronik trägt den Monat, in dem die Nachricht die Redaktion erreichte. Bei verzögerter Verbindung kann das Ereignis selbst früher stattgefunden haben."
