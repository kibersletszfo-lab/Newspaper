l_german:
 NFP30_ACCESS_HOME_1_BODY:0 "Region: [SelectLocalization(And(ScriptContainer.MakeScope.Var('nfp20_problem_state').IsSet, ScriptContainer.MakeScope.Var('nfp20_problem_state').GetState.IsValid), 'NFP40_STATE_LINK', 'NFP40_REGION_FALLBACK')]. Der Marktzugang liegt seit zwei Monaten unter 90%. Letzter Wert: [Multiply_CFixedPoint(ScriptContainer.GetVariableValue('nfp20_after'), '(CFixedPoint)100')|1]%.\n\nDie vorhandenen Angaben belegen die Ursache nicht. Örtliche Infrastruktur, Seeverbindungen und andere Beschränkungen müssen geprüft werden. Allein die Eisenbahn verantwortlich zu machen wäre voreilig."
 NFP30_ACCESS_HOME_1_LEAD:0 "In einem unserer Staaten hält der schlechte Marktzugang an. Diese Schwierigkeit verdient neben unseren wirtschaftlichen Erfolgen Aufmerksamkeit."
 NFP30_ACCESS_HOME_1_TITLE:0 "Unser Markt bleibt zu weit entfernt"
 NFP30_ACCESS_HOME_2_BODY:0 "Region: [SelectLocalization(And(ScriptContainer.MakeScope.Var('nfp20_problem_state').IsSet, ScriptContainer.MakeScope.Var('nfp20_problem_state').GetState.IsValid), 'NFP40_STATE_LINK', 'NFP40_REGION_FALLBACK')]. Der Marktzugang liegt seit zwei Monaten unter 90%. Letzter Wert: [Multiply_CFixedPoint(ScriptContainer.GetVariableValue('nfp20_after'), '(CFixedPoint)100')|1]%.\n\nDie Zahl zeigt den eingeschränkten Zugang, erklärt aber nicht seinen Ursprung. Bevor wir ein Mittel wählen, müssen wir herausfinden, wo die Verbindung abgerissen ist."
 NFP30_ACCESS_HOME_2_LEAD:0 "Ein zweiter Monat mit schlechtem Marktzugang gibt Anlass, die Verbindung unseres Staates zur heimischen Wirtschaft erneut anzusprechen."
 NFP30_ACCESS_HOME_2_TITLE:0 "Ein Staat wartet auf einen verlässlichen Weg zum Markt"
 NFP30_ACCESS_METRICS:0 "Region: [SelectLocalization(And(ScriptContainer.MakeScope.Var('nfp20_problem_state').IsSet, ScriptContainer.MakeScope.Var('nfp20_problem_state').GetState.IsValid), 'NFP40_STATE_LINK', 'NFP40_REGION_FALLBACK')]. Der Marktzugang liegt seit zwei Monaten unter 90%. Letzter Wert: [Multiply_CFixedPoint(ScriptContainer.GetVariableValue('nfp20_after'), '(CFixedPoint)100')|1]%."
 NFP30_ACCESS_RECOVERY_HOME_1_BODY:0 "Region: [SelectLocalization(And(ScriptContainer.MakeScope.Var('nfp20_problem_state').IsSet, ScriptContainer.MakeScope.Var('nfp20_problem_state').GetState.IsValid), 'NFP40_STATE_LINK', 'NFP40_REGION_FALLBACK')]. Bei der früheren Warnung betrug der Marktzugang [Multiply_CFixedPoint(ScriptContainer.GetVariableValue('nfp20_before'), '(CFixedPoint)100')|1]%, zuletzt [Multiply_CFixedPoint(ScriptContainer.GetVariableValue('nfp20_after'), '(CFixedPoint)100')|1]%. Seit zwei Monaten liegt er bei mindestens 90%.\n\nWir freuen uns über eine Verbesserung, die zwei Monate angehalten hat. Das erlaubt weder, jedes örtliche Problem für gelöst zu erklären, noch die Änderung einer unbestätigten Ursache zuzuschreiben."
 NFP30_ACCESS_RECOVERY_HOME_1_LEAD:0 "Die Geschichte der schlechten Marktverbindung unseres Staates nimmt eine erfreuliche Wendung."
 NFP30_ACCESS_RECOVERY_HOME_1_TITLE:0 "Der Staat rückt dem gemeinsamen Markt wieder näher"
 NFP30_ACCESS_RECOVERY_HOME_2_BODY:0 "Region: [SelectLocalization(And(ScriptContainer.MakeScope.Var('nfp20_problem_state').IsSet, ScriptContainer.MakeScope.Var('nfp20_problem_state').GetState.IsValid), 'NFP40_STATE_LINK', 'NFP40_REGION_FALLBACK')]. Bei der früheren Warnung betrug der Marktzugang [Multiply_CFixedPoint(ScriptContainer.GetVariableValue('nfp20_before'), '(CFixedPoint)100')|1]%, zuletzt [Multiply_CFixedPoint(ScriptContainer.GetVariableValue('nfp20_after'), '(CFixedPoint)100')|1]%. Seit zwei Monaten liegt er bei mindestens 90%.\n\nZwei aufeinanderfolgende Monate geben Anlass zu vorsichtiger Zufriedenheit. Ursachen der Änderung und Lage einzelner Betriebe müssen gesondert untersucht werden."
 NFP30_ACCESS_RECOVERY_HOME_2_LEAD:0 "Gute Nachrichten zu einer Sorge dieser Zeitung: Der Marktzugang des Staates hat sich verbessert."
 NFP30_ACCESS_RECOVERY_HOME_2_TITLE:0 "Die Verbindung zum Markt wird stärker"
 NFP30_ACCESS_RECOVERY_METRICS:0 "Region: [SelectLocalization(And(ScriptContainer.MakeScope.Var('nfp20_problem_state').IsSet, ScriptContainer.MakeScope.Var('nfp20_problem_state').GetState.IsValid), 'NFP40_STATE_LINK', 'NFP40_REGION_FALLBACK')]. Bei der früheren Warnung betrug der Marktzugang [Multiply_CFixedPoint(ScriptContainer.GetVariableValue('nfp20_before'), '(CFixedPoint)100')|1]%, zuletzt [Multiply_CFixedPoint(ScriptContainer.GetVariableValue('nfp20_after'), '(CFixedPoint)100')|1]%. Seit zwei Monaten liegt er bei mindestens 90%."
 NFP30_ARTICLE_DETAILS:0 "[SelectLocalization(ScriptContainer.HasVariable('nfp63_schema'), 'NFP63_DETAILS', 'NFP50_EMPTY')]\nRedaktionelle Angaben\nFakt Nr. [ScriptContainer.GetVariableValue('nfp20_id')|0]; Episode [ScriptContainer.GetVariableValue('nfp20_episode')|0].\nAuswahl: [Localize(ScriptContainer.MakeScope.Var('nfp20_reason').GetFlagName)]. Priorität: [ScriptContainer.GetVariableValue('nfp20_priority')|0].\n[Localize(ScriptContainer.MakeScope.Var('nfp30_metrics').GetFlagName)]\nDarstellung: [SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp30_domestic'), '(CFixedPoint)1'), 'NFP30_HOME', 'NFP30_AWAY')]; Variante [ScriptContainer.GetVariableValue('nfp30_variant')|0].\nLändernamen verwenden beständige Definitionen; der dynamische historische Name wurde nicht gespeichert.\n[SelectLocalization(ScriptContainer.HasVariable('nfp63_schema'), 'NFP50_EMPTY', SelectLocalization(ScriptContainer.HasVariable('nfp31_reach'), 'NFP30_REACH_LINE', 'NFP30_REACH_OLD'))]"
 NFP30_ARTICLE_META:0 "[ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName] · [Localize(ScriptContainer.MakeScope.Var('nfp30_month').GetFlagName)], [ScriptContainer.GetVariableValue('nfp20_year')|0] · [Localize(ScriptContainer.MakeScope.Var('nfp30_rubric').GetFlagName)]"
 NFP30_ARTICLE_TEXT:0 "[Localize(ScriptContainer.MakeScope.Var('nfp30_lead').GetFlagName)]\n\n[Localize(ScriptContainer.MakeScope.Var('nfp30_body').GetFlagName)]"
 NFP30_AWAY:0 "Ereignis im Ausland"
 NFP30_CONTENTS:0 "In dieser Ausgabe"
 NFP30_COVER:0 "Zur Titelseite"
 NFP30_DETAILS:0 "Einzelheiten"
 NFP30_DETAILS_CLOSE:0 "Einzelheiten schließen"
 NFP30_DIVERGENCE_HOME_1_BODY:0 "Über drei Monatsintervalle stieg das prognostizierte jährliche BIP von [ScriptContainer.GetVariableValue('nfp20_before')|0] auf [ScriptContainer.GetVariableValue('nfp20_after')|0]. Der durchschnittliche Lebensstandard sank zugleich um [ScriptContainer.GetVariableValue('nfp20_extra')|2] Punkte.\n\nEine größere Wirtschaft bedeutet noch keine behaglichen Haushalte. Die Lebensverhältnisse verdienen Aufmerksamkeit auf höchster Ebene; warum die Zahlen auseinandergehen, muss eigens untersucht werden."
 NFP30_DIVERGENCE_HOME_1_LEAD:0 "Wirtschaftswachstum gibt unserem Land Anlass zum Stolz; sinkender Lebensstandard verdient ebenso genaue Aufmerksamkeit."
 NFP30_DIVERGENCE_HOME_1_TITLE:0 "Die Wirtschaft wächst. Das Leben wird schwerer"
 NFP30_DIVERGENCE_HOME_2_BODY:0 "Über drei Monatsintervalle stieg das prognostizierte jährliche BIP von [ScriptContainer.GetVariableValue('nfp20_before')|0] auf [ScriptContainer.GetVariableValue('nfp20_after')|0]. Der durchschnittliche Lebensstandard sank zugleich um [ScriptContainer.GetVariableValue('nfp20_extra')|2] Punkte.\n\nDas Land braucht auch Erfolge, die im Alltag ankommen. Diese Zahlen allein erklären weder die Verschlechterung noch benennen sie Verantwortliche."
 NFP30_DIVERGENCE_HOME_2_LEAD:0 "Unsere Wirtschaft ist gewachsen, der durchschnittliche Lebensstandard gefallen. Beide Seiten gehören auf die Titelseite."
 NFP30_DIVERGENCE_HOME_2_TITLE:0 "Beunruhigende Zahlen hinter dem Wirtschaftserfolg"
 NFP30_DIVERGENCE_METRICS:0 "Über drei Monatsintervalle stieg das prognostizierte jährliche BIP von [ScriptContainer.GetVariableValue('nfp20_before')|0] auf [ScriptContainer.GetVariableValue('nfp20_after')|0]. Der durchschnittliche Lebensstandard sank zugleich um [ScriptContainer.GetVariableValue('nfp20_extra')|2] Punkte."
 NFP30_EMPTY:0 "Heute gibt es keine neuen Artikel für die gewählten Ressorts. Eine spätere Ausgabe bringt frische Nachrichten, sobald sie vorliegen."
 NFP30_GDP_LEADER_AWAY_1_BODY:0 "Früherer Platz außerhalb der ersten zehn: [ScriptContainer.GetVariableValue('nfp20_before')|0]; aktueller Rang: [ScriptContainer.GetVariableValue('nfp20_after')|0]. Das Land gehört seit zwei Monaten zu den ersten zehn.\n\nFür unsere Leser ist das eine bemerkenswerte Änderung der Weltwirtschaft. Sie beweist weder angenehme Lebensverhältnisse noch rentable einzelne Branchen."
 NFP30_GDP_LEADER_AWAY_1_LEAD:0 "Die Reihen der größten Volkswirtschaften verändern sich: Ein anderes Land hat sich unter den ersten zehn nach BIP etabliert."
 NFP30_GDP_LEADER_AWAY_1_TITLE:0 "Ein neuer Name unter den zehn größten Volkswirtschaften"
 NFP30_GDP_LEADER_AWAY_2_BODY:0 "Früherer Platz außerhalb der ersten zehn: [ScriptContainer.GetVariableValue('nfp20_before')|0]; aktueller Rang: [ScriptContainer.GetVariableValue('nfp20_after')|0]. Das Land gehört seit zwei Monaten zu den ersten zehn.\n\nDie Rangliste misst das prognostizierte jährliche BIP. Über Handelsfolgen für unser Land sagen diese Zahlen allein nichts."
 NFP30_GDP_LEADER_AWAY_2_LEAD:0 "Ein Neuzugang unter den ersten zehn hält seinen Platz im zweiten Monat in Folge."
 NFP30_GDP_LEADER_AWAY_2_TITLE:0 "Eine fremde Wirtschaft behauptet ihren Platz unter den größten"
 NFP30_GDP_LEADER_HOME_1_BODY:0 "Früherer Platz außerhalb der ersten zehn: [ScriptContainer.GetVariableValue('nfp20_before')|0]; aktueller Rang: [ScriptContainer.GetVariableValue('nfp20_after')|0]. Das Land gehört seit zwei Monaten zu den ersten zehn.\n\nDer Erfolg verdient Anerkennung. Ein Rang nach der gesamten Wirtschaftsgröße misst allerdings weder Lebensstandard noch Unternehmensgewinne."
 NFP30_GDP_LEADER_HOME_1_LEAD:0 "Unser Land hat sich nach prognostiziertem jährlichem BIP unter den zehn größten Volkswirtschaften etabliert."
 NFP30_GDP_LEADER_HOME_1_TITLE:0 "Unsere Wirtschaft gehört zu den ersten zehn"
 NFP30_GDP_LEADER_HOME_2_BODY:0 "Früherer Platz außerhalb der ersten zehn: [ScriptContainer.GetVariableValue('nfp20_before')|0]; aktueller Rang: [ScriptContainer.GetVariableValue('nfp20_after')|0]. Das Land gehört seit zwei Monaten zu den ersten zehn.\n\nWir begrüßen das Ergebnis und behalten den Wohlstand der Bevölkerung im Blick: Wirtschaftsgröße ersetzt dessen Beurteilung nicht."
 NFP30_GDP_LEADER_HOME_2_LEAD:0 "Zwei Monate unter den ersten zehn nach BIP sprechen für einen beständigen wirtschaftlichen Erfolg."
 NFP30_GDP_LEADER_HOME_2_TITLE:0 "Unser Land nimmt seinen Platz unter den größten ein"
 NFP30_GDP_LEADER_METRICS:0 "Früherer Platz außerhalb der ersten zehn: [ScriptContainer.GetVariableValue('nfp20_before')|0]; aktueller Rang: [ScriptContainer.GetVariableValue('nfp20_after')|0]. Das Land gehört seit zwei Monaten zu den ersten zehn."
 NFP30_HOME:0 "Ereignis im Inland"
 NFP30_INFRA_HOME_1_BODY:0 "Region: [SelectLocalization(And(ScriptContainer.MakeScope.Var('nfp20_problem_state').IsSet, ScriptContainer.MakeScope.Var('nfp20_problem_state').GetState.IsValid), 'NFP40_STATE_LINK', 'NFP40_REGION_FALLBACK')]. Die Infrastrukturbilanz ist seit zwei Monaten negativ; letzter Wert: [ScriptContainer.GetVariableValue('nfp20_after')|2].\n\nDer Infrastrukturmangel verlangt einen genaueren Blick auf den örtlichen Bedarf. Wir schreiben ihm nicht jede Schwierigkeit im Staat zu und erklären kein einzelnes Gebäude zur einzigen Antwort."
 NFP30_INFRA_HOME_1_LEAD:0 "Unzureichende Infrastruktur ist in einem unserer Staaten zum Dauerproblem geworden. Aufmerksamkeit lässt sich immer schwerer aufschieben."
 NFP30_INFRA_HOME_1_TITLE:0 "Der Staat braucht eine Verbindung, die zum Land passt"
 NFP30_INFRA_HOME_2_BODY:0 "Region: [SelectLocalization(And(ScriptContainer.MakeScope.Var('nfp20_problem_state').IsSet, ScriptContainer.MakeScope.Var('nfp20_problem_state').GetState.IsValid), 'NFP40_STATE_LINK', 'NFP40_REGION_FALLBACK')]. Die Infrastrukturbilanz ist seit zwei Monaten negativ; letzter Wert: [ScriptContainer.GetVariableValue('nfp20_after')|2].\n\nWir machen auf einen wiederkehrenden Engpass aufmerksam. Die Wahl eines Mittels verlangt einen Blick auf den Staat selbst; eine Zahl genügt nicht als fertiger Bauplan."
 NFP30_INFRA_HOME_2_LEAD:0 "In einem unserer Staaten übersteigt der Infrastrukturbedarf erneut die vorhandenen Möglichkeiten."
 NFP30_INFRA_HOME_2_TITLE:0 "Die Infrastruktur kann nicht weiter warten"
 NFP30_INFRA_METRICS:0 "Region: [SelectLocalization(And(ScriptContainer.MakeScope.Var('nfp20_problem_state').IsSet, ScriptContainer.MakeScope.Var('nfp20_problem_state').GetState.IsValid), 'NFP40_STATE_LINK', 'NFP40_REGION_FALLBACK')]. Die Infrastrukturbilanz ist seit zwei Monaten negativ; letzter Wert: [ScriptContainer.GetVariableValue('nfp20_after')|2]."
 NFP30_INFRA_RECOVERY_HOME_1_BODY:0 "Region: [SelectLocalization(And(ScriptContainer.MakeScope.Var('nfp20_problem_state').IsSet, ScriptContainer.MakeScope.Var('nfp20_problem_state').GetState.IsValid), 'NFP40_STATE_LINK', 'NFP40_REGION_FALLBACK')]. Bei der früheren Warnung betrug die Infrastrukturbilanz [ScriptContainer.GetVariableValue('nfp20_before')|2], nun [ScriptContainer.GetVariableValue('nfp20_after')|2]. Die beiden letzten Monatsbeobachtungen zeigen eine nichtnegative Bilanz.\n\nDieser Erfolg verdient einen Platz in der Zeitung. Zwei günstige Beobachtungen versprechen allerdings nicht, dass der Mangel nie zurückkehrt."
 NFP30_INFRA_RECOVERY_HOME_1_LEAD:0 "Wir kehren zum früheren Infrastrukturproblem zurück: Die jüngsten Angaben erlauben uns, eine Verbesserung zu melden."
 NFP30_INFRA_RECOVERY_HOME_1_TITLE:0 "Gute Nachrichten aus einem früheren Sorgenstaat"
 NFP30_INFRA_RECOVERY_HOME_2_BODY:0 "Region: [SelectLocalization(And(ScriptContainer.MakeScope.Var('nfp20_problem_state').IsSet, ScriptContainer.MakeScope.Var('nfp20_problem_state').GetState.IsValid), 'NFP40_STATE_LINK', 'NFP40_REGION_FALLBACK')]. Bei der früheren Warnung betrug die Infrastrukturbilanz [ScriptContainer.GetVariableValue('nfp20_before')|2], nun [ScriptContainer.GetVariableValue('nfp20_after')|2]. Die beiden letzten Monatsbeobachtungen zeigen eine nichtnegative Bilanz.\n\nZwei aufeinanderfolgende Beobachtungen bestätigen die Verbesserung. Welche Maßnahmen sie herbeigeführt haben, lässt sich aus den vorhandenen Angaben nicht feststellen."
 NFP30_INFRA_RECOVERY_HOME_2_LEAD:0 "Die Infrastrukturbilanz unseres Staates hat sich erholt. Eine Änderung in einer Geschichte, die unsere Leser bereits verfolgen."
 NFP30_INFRA_RECOVERY_HOME_2_TITLE:0 "Eine frühere Warnung weicht guten Nachrichten"
 NFP30_INFRA_RECOVERY_METRICS:0 "Region: [SelectLocalization(And(ScriptContainer.MakeScope.Var('nfp20_problem_state').IsSet, ScriptContainer.MakeScope.Var('nfp20_problem_state').GetState.IsValid), 'NFP40_STATE_LINK', 'NFP40_REGION_FALLBACK')]. Bei der früheren Warnung betrug die Infrastrukturbilanz [ScriptContainer.GetVariableValue('nfp20_before')|2], nun [ScriptContainer.GetVariableValue('nfp20_after')|2]. Die beiden letzten Monatsbeobachtungen zeigen eine nichtnegative Bilanz."
 NFP30_ISSUE_DETAILS:0 "Angaben zur Ausgabe\nArtikel: [ScriptContainer.GetVariableValue('nfp20_article_count')|0].\nVerlauf: [ScriptContainer.GetVariableValue('nfp20_history_count')|0] Beobachtungen, [ScriptContainer.GetVariableValue('nfp20_summary_intervals')|0] Vergleichsintervalle.\nPrognostiziertes jährliches BIP: [ScriptContainer.GetVariableValue('nfp20_summary_before')|0] → [ScriptContainer.GetVariableValue('nfp20_summary_after')|0].\n\n$NFP20_DIAGNOSTICS$\n[SelectLocalization(ScriptContainer.HasVariable('nfp31_rejected_region'), 'NFP30_REACH_REJECTED', 'NFP30_REACH_OLD')]"
 NFP30_ISSUE_HEADER:0 "[ScriptContainer.MakeScope.Var('nfp30_reader_definition').GetCountryDefinition.GetName] · Nr. [ScriptContainer.GetVariableValue('nfp_number')|0] · [Localize(ScriptContainer.MakeScope.Var('nfp30_month').GetFlagName)], [ScriptContainer.GetVariableValue('nfp_year')|0]"
 NFP30_LAW_AWAY_1_BODY:0 "Ein Gesetz ist in Kraft getreten: [Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)].\n\nUnsere Leser können Veränderungen im Leben anderer Völker verfolgen. Zunächst wissen wir, dass die neue Regel gilt; ihre Folgen bleiben zu beurteilen."
 NFP30_LAW_AWAY_1_LEAD:0 "In einem anderen Land ist eine bedeutende Reform in Kraft getreten."
 NFP30_LAW_AWAY_1_TITLE:0 "Im Ausland beginnt ein neues Gesetzeskapitel"
 NFP30_LAW_AWAY_2_BODY:0 "Ein Gesetz ist in Kraft getreten: [Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)].\n\nDie Angaben belegen weder eine parlamentarische Abstimmung über die Reform noch versprechen sie ein bestimmtes Ergebnis. Ihre Wirkungen verdienen eigene Aufmerksamkeit."
 NFP30_LAW_AWAY_2_LEAD:0 "Aus dem Ausland wird das Inkrafttreten eines neuen Gesetzes gemeldet."
 NFP30_LAW_AWAY_2_TITLE:0 "Ein anderes Land führt ein bedeutendes Gesetz ein"
 NFP30_LAW_HOME_1_BODY:0 "Ein Gesetz ist in Kraft getreten: [Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)].\n\nWir berichten über die Änderung selbst. Wie sie angenommen wurde und was sie für das Leben bedeutet, geht aus dieser Nachricht noch nicht hervor."
 NFP30_LAW_HOME_1_LEAD:0 "In unserem Land ist ein bedeutendes Gesetz in Kraft getreten."
 NFP30_LAW_HOME_1_TITLE:0 "Ein neues Gesetz, ein neues Kapitel unseres Lebens"
 NFP30_LAW_HOME_2_BODY:0 "Ein Gesetz ist in Kraft getreten: [Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)].\n\nEine Beurteilung der Reform braucht Zeit und Belege ihrer Wirkungen. Das Inkrafttreten eines Gesetzes bedeutet nicht, dass die versprochenen Ergebnisse schon eingetreten sind."
 NFP30_LAW_HOME_2_LEAD:0 "Unsere Gesetze haben sich geändert. Die neue Regel verdient die Aufmerksamkeit der Leser."
 NFP30_LAW_HOME_2_TITLE:0 "Eine bedeutende Reform tritt bei uns in Kraft"
 NFP30_LAW_METRICS:0 "Ein Gesetz ist in Kraft getreten: [Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]."
 NFP30_LEAD_STORY:0 "Aufmacher"
 NFP30_LITERACY_AWAY_1_BODY:0 "Der Anteil der Lese- und Schreibkundigen stieg von [Multiply_CFixedPoint(ScriptContainer.GetVariableValue('nfp20_before'), '(CFixedPoint)100')|1]% auf [Multiply_CFixedPoint(ScriptContainer.GetVariableValue('nfp20_after'), '(CFixedPoint)100')|1]% und überschritt die Schwelle von [Multiply_CFixedPoint(ScriptContainer.GetVariableValue('nfp20_extra'), '(CFixedPoint)100')|1]%.\n\nDieser ausländische Erfolg verdient die Aufmerksamkeit unserer Leser. Die Schwelle allein erklärt weder die Arbeit der Schulen noch beweist sie die Überlegenheit des gesamten Bildungswesens."
 NFP30_LITERACY_AWAY_1_LEAD:0 "Aus einem anderen Land kommen bemerkenswerte Nachrichten über wachsende Lese- und Schreibkenntnisse."
 NFP30_LITERACY_AWAY_1_TITLE:0 "Ein Bildungsmeilenstein im Ausland"
 NFP30_LITERACY_AWAY_2_BODY:0 "Der Anteil der Lese- und Schreibkundigen stieg von [Multiply_CFixedPoint(ScriptContainer.GetVariableValue('nfp20_before'), '(CFixedPoint)100')|1]% auf [Multiply_CFixedPoint(ScriptContainer.GetVariableValue('nfp20_after'), '(CFixedPoint)100')|1]% und überschritt die Schwelle von [Multiply_CFixedPoint(ScriptContainer.GetVariableValue('nfp20_extra'), '(CFixedPoint)100')|1]%.\n\nNeue Angaben bestätigen den Anstieg. Seine Ursachen und mögliche Lehren für uns zu Hause verlangen eine genauere Untersuchung."
 NFP30_LITERACY_AWAY_2_LEAD:0 "Ausländische Bildungsnachrichten ergänzen die Chronik der Aufklärung, die unsere Zeitung verfolgt."
 NFP30_LITERACY_AWAY_2_TITLE:0 "Mehr Menschen auf der Welt können lesen"
 NFP30_LITERACY_HOME_1_BODY:0 "Der Anteil der Lese- und Schreibkundigen stieg von [Multiply_CFixedPoint(ScriptContainer.GetVariableValue('nfp20_before'), '(CFixedPoint)100')|1]% auf [Multiply_CFixedPoint(ScriptContainer.GetVariableValue('nfp20_after'), '(CFixedPoint)100')|1]% und überschritt die Schwelle von [Multiply_CFixedPoint(ScriptContainer.GetVariableValue('nfp20_extra'), '(CFixedPoint)100')|1]%.\n\nDer Vergleich mit früheren Angaben bestätigt die Änderung. Eine Schwelle genügt nicht, um Schulqualität oder gleichen Bildungszugang zu beurteilen."
 NFP30_LITERACY_HOME_1_LEAD:0 "Eine neue Schwelle der Alphabetisierung ist erreicht. Der Erfolg verdient nationalen Stolz."
 NFP30_LITERACY_HOME_1_TITLE:0 "Unser Land macht einen Schritt zur Bildung"
 NFP30_LITERACY_HOME_2_BODY:0 "Der Anteil der Lese- und Schreibkundigen stieg von [Multiply_CFixedPoint(ScriptContainer.GetVariableValue('nfp20_before'), '(CFixedPoint)100')|1]% auf [Multiply_CFixedPoint(ScriptContainer.GetVariableValue('nfp20_after'), '(CFixedPoint)100')|1]% und überschritt die Schwelle von [Multiply_CFixedPoint(ScriptContainer.GetVariableValue('nfp20_extra'), '(CFixedPoint)100')|1]%.\n\nDer Anteil der Menschen, die lesen und schreiben können, hat eine wichtige Schwelle überschritten. Für ein Urteil über verschiedene Regionen und Schichten braucht es genauere Angaben."
 NFP30_LITERACY_HOME_2_LEAD:0 "Neue Bildungszahlen geben dieser Zeitung Anlass, den Erfolg unseres Landes zu begrüßen."
 NFP30_LITERACY_HOME_2_TITLE:0 "Bildung gewinnt an Reichweite"
 NFP30_LITERACY_METRICS:0 "Der Anteil der Lese- und Schreibkundigen stieg von [Multiply_CFixedPoint(ScriptContainer.GetVariableValue('nfp20_before'), '(CFixedPoint)100')|1]% auf [Multiply_CFixedPoint(ScriptContainer.GetVariableValue('nfp20_after'), '(CFixedPoint)100')|1]% und überschritt die Schwelle von [Multiply_CFixedPoint(ScriptContainer.GetVariableValue('nfp20_extra'), '(CFixedPoint)100')|1]%."
