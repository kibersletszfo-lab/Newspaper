 NFP52_CHINA_1_BODY:0 "China hat seine frühere politische Einheit verloren. Hinter der vertrauten großen Fläche auf der Karte stehen nun mehrere Machtzentren. Für Diplomaten bedeutet das neue Adressen. Wer jenseits einer neuen Grenze Geschäfte macht, fragt sich, was frühere Vereinbarungen noch wert sind.\\n\\nDie frühere einheitliche Herrschaft ist zerfallen. Selbstständige Regierungen müssen ihre Beziehungen zueinander bestimmen, während die übrige Welt klärt, mit wem sie verhandeln soll. Den Namen des Landes kennt weiter jeder Leser. Wer in seinem Namen spricht, ist erheblich schwerer zu beantworten.\\n\\nHinter der neuen Karte geht das tägliche Leben weiter. Menschen brauchen Arbeit, Handel und verständliche Regeln, selbst wenn die Machthaber gerade klären, wessen Regeln vorgehen. Wohin Chinas Zerfall führt, wird sich zeigen. Hoffentlich zahlen nicht gerade jene den Preis der Suche, die am wenigsten Einfluss darauf haben.\\n\\nDie Chronik trägt den Monat, in dem die Nachricht die Redaktion erreichte. Bei verzögerter Verbindung kann das Ereignis selbst früher stattgefunden haben."
