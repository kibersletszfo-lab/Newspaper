 NFP30_REACH_MIGRATED:0 "Bei einem älteren unveröffentlichten Fakt wurden die Hauptstadtregionen bei der Umstellung rekonstruiert; frühere Interessen und Ränge der Parteien sind unbekannt."
 NFP30_REACH_OLD:0 "Diese Ausgabe erschien vor Einführung des Regionalfilters."
 NFP30_REACH_PRICE_LOCAL:0 "gewöhnlicher Bericht über den Markt des Leserlandes"
 NFP30_REACH_REGION:0 "Das Leserland besaß bei Eingang und Veröffentlichung ein Regionalinteresse von mindestens 2"
 NFP30_REACH_REJECTED:0 "Regionalfilter: [ScriptContainer.GetVariableValue('nfp31_rejected_region')|0] Artikel zurückgestellt."
 NFP30_REACH_WORLD:0 "Weltbedeutung: Krieg zwischen zwei Großmächten oder Gewinn bzw. Verlust des Großmachtstatus"
 NFP30_REASON_PRICES:0 "Für diese Ausgabe wurden keine Nachrichten ausgewählt; ein monatlicher Preisbericht wurde ergänzt."
