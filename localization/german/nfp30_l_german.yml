 NFP52_ETH_1_BODY:0 "Der äthiopische Staat hat sich vereinigt. Einzelne Machtzentren sind einem gemeinsamen Staat gewichen. Für die Einwohner beginnt eine neue Ordnung der Angelegenheiten, für Nachbarn eine Änderung, mit der sie rechnen müssen.\\n\\nDie Entstehung Äthiopiens ist bestätigt. Eine gemeinsame Obrigkeit kann nun für den neuen Staat sprechen. Wie fest seine Teile verbunden sind, wird sich in den kommenden Jahren zeigen. Die Vereinigung selbst hat stattgefunden und verdient Aufmerksamkeit, wie weit sie auch von unseren Grenzen entfernt liegt.\\n\\nEine gemeinsame Regierung hat nun gemeinsame Arbeit. Aus einem politischen Erfolg dauerhafte Verhältnisse für das Land zu machen ist keine kleinere Aufgabe als die Einigung selbst. Wir verfolgen den weiteren Weg. Hoffentlich eröffnet die neue Stellung auch den Einwohnern neue Möglichkeiten.\\n\\nDie Chronik trägt den Monat, in dem die Nachricht die Redaktion erreichte. Bei verzögerter Verbindung kann das Ereignis selbst früher stattgefunden haben."
