 NFP52_FLU_2_TITLE:0 "Die Welt steht vor einer neuen Epidemie"
 NFP52_GER_1_BODY:0 "Deutschland ist ein vereinigter Staat geworden. Den Namen kennen Leser längst, doch die politische Karte braucht nun einen neuen Blick. Zum gemeinsamen Namen ist eine gemeinsame Regierung gekommen. Wer seine Pläne auf deutsche Zersplitterung baute, muss mehr als einen Atlas überarbeiten.\\n\\nDer deutsche Staat ist entstanden. Die Einigung seiner Länder ist eine politische Tatsache, mit der Nachbarn rechnen müssen. Umfang seiner Grenzen und Möglichkeiten sind eine andere Frage. Deutschland nur als Ansammlung einzelner Staaten zu besprechen ist aber bereits überholt.\\n\\nEin Land zusammenzubringen ist ein Erfolg; es zum Funktionieren zu bringen die nächste Aufgabe. Hinter den Feiern warten gemeinsame Regeln, Wirtschaftsfragen und Beziehungen zu Nachbarn. Der neue Name steht schon auf der Karte. Nun wird besonders interessant, welche Taten man mit ihm verbinden wird.\\n\\nDie Chronik trägt den Monat, in dem die Nachricht die Redaktion erreichte. Bei verzögerter Verbindung kann das Ereignis selbst früher stattgefunden haben."
