 NFP52_ROM_2_TITLE:0 "Die rumänische Vereinigung hat stattgefunden"
 NFP52_SPRING_1_BODY:0 "In Europa hat der Völkerfrühling begonnen. Politische Erschütterungen sind zu einem Ereignis geworden, das sich nicht mehr als rein innere Angelegenheit eines einzelnen Landes betrachten lässt. Machtfragen und die Zukunft der Gesellschaft reichen weit über ruhige Gespräche hinaus.\\n\\nEine revolutionäre Welle gehört nun zum europäischen Leben. Jedes Land hat eigene Umstände und Ereignisverläufe. Die alte Gewissheit, fremde Schwierigkeiten blieben ausschließlich fremd, braucht inzwischen aber festeren Grund als den Abstand zur Grenze.\\n\\nDer Name verspricht Frühling; der Ausgang muss erst erlebt werden. Hinter Veränderungshoffnungen stehen Meinungsverschiedenheiten darüber, wie die Änderungen aussehen sollen. Wir verfolgen jede Geschichte für sich. Ein gemeinsamer Name für eine Zeit macht menschliche Schicksale nicht gleich.\\n\\nDie Chronik trägt den Monat, in dem die Nachricht die Redaktion erreichte. Bei verzögerter Verbindung kann das Ereignis selbst früher stattgefunden haben."
