 NFP52_ROM_1_BODY:0 "Die rumänische Vereinigung ist nun Tatsache. In Europa gibt es ein gemeinsames Machtzentrum, wo zuvor getrennte Fürstentümer waren. Für Befürworter der Union ist das ein wichtiges Ergebnis. Für Nachbarn ein Anlass, eigene Berechnungen zu aktualisieren.\\n\\nDie rumänischen Fürstentümer haben eine gemeinsame Regierung erhalten. Eine erhebliche Änderung, auch wenn Unabhängigkeit und künftige Grenzen eigene Fragen bleiben. Ein einzelnes Ereignis muss nicht für die ganze künftige Geschichte des Landes antworten.\\n\\nDie Vereinigung steht nun vor der Alltagsarbeit. Das gemeinsame Zentrum kann gemeinsame Sorgen angehen und muss für das Ergebnis einstehen. Hoffentlich gibt das Leben der Menschen dieser Nachricht eine Fortsetzung, die ihrem feierlichen Beginn würdig ist.\\n\\nDie Chronik trägt den Monat, in dem die Nachricht die Redaktion erreichte. Bei verzögerter Verbindung kann das Ereignis selbst früher stattgefunden haben."
