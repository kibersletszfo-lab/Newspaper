 NFP50_LAW_GOV_BASE_1:0 "Sehen wir auf die Haltung innerhalb der Regierung. [Localize(ScriptContainer.MakeScope.Var('nfp50_law_gov_summary').GetFlagName)][SelectLocalization(GreaterThan_CFixedPoint(ScriptContainer.GetVariableValue('nfp50_law_gov_yes_present'), '(CFixedPoint)0'), 'NFP50_LAW_GOV_YES_NAME', 'NFP50_LAW_NO_MOVE')][SelectLocalization(GreaterThan_CFixedPoint(ScriptContainer.GetVariableValue('nfp50_law_gov_no_present'), '(CFixedPoint)0'), 'NFP50_LAW_GOV_NO_NAME', 'NFP50_LAW_NO_MOVE')] Hier geht es um das Gesetz selbst; ein Vergleich mit der früheren Ordnung ist anhand dieser Angaben nicht möglich."
 NFP50_LAW_GOV_BASE_2:0 "Sehen wir auf die Haltung innerhalb der Regierung. [Localize(ScriptContainer.MakeScope.Var('nfp50_law_gov_summary').GetFlagName)][SelectLocalization(GreaterThan_CFixedPoint(ScriptContainer.GetVariableValue('nfp50_law_gov_yes_present'), '(CFixedPoint)0'), 'NFP50_LAW_GOV_YES_NAME', 'NFP50_LAW_NO_MOVE')][SelectLocalization(GreaterThan_CFixedPoint(ScriptContainer.GetVariableValue('nfp50_law_gov_no_present'), '(CFixedPoint)0'), 'NFP50_LAW_GOV_NO_NAME', 'NFP50_LAW_NO_MOVE')] Hier geht es um das Gesetz selbst; ein Vergleich mit der früheren Ordnung ist anhand dieser Angaben nicht möglich."
 NFP50_LAW_GOV_NEUTRAL:0 "Die Gruppen in der Regierung haben keine klare Präferenz. Auch das kommt vor: Das Gesetz hat sich geändert, die politische Waage bleibt stehen."
 NFP50_LAW_GOV_NO_NAME:0 " Die einflussreichste Gruppe unter den Gegnern in der Regierung ist „[Localize(ScriptContainer.MakeScope.Var('nfp50_law_gov_no_type').GetFlagName)]“."
 NFP50_LAW_GOV_OPPOSE:0 "Unter den Regierungsgruppen mit klarer Position überwiegen die Gegner. Das Gesetz ist angenommen; Liebe dazu lag nicht jedem Exemplar bei."
 NFP50_LAW_GOV_RELATIVE_1:0 "Schon vor der Gesetzesannahme zeigten sich in der Regierung eigene Vorlieben. [Localize(ScriptContainer.MakeScope.Var('nfp50_law_gov_summary').GetFlagName)][SelectLocalization(GreaterThan_CFixedPoint(ScriptContainer.GetVariableValue('nfp50_law_gov_yes_present'), '(CFixedPoint)0'), 'NFP50_LAW_GOV_YES_NAME', 'NFP50_LAW_NO_MOVE')][SelectLocalization(GreaterThan_CFixedPoint(ScriptContainer.GetVariableValue('nfp50_law_gov_no_present'), '(CFixedPoint)0'), 'NFP50_LAW_GOV_NO_NAME', 'NFP50_LAW_NO_MOVE')]"
 NFP50_LAW_GOV_RELATIVE_2:0 "Schon vor der Gesetzesannahme zeigten sich in der Regierung eigene Vorlieben. [Localize(ScriptContainer.MakeScope.Var('nfp50_law_gov_summary').GetFlagName)][SelectLocalization(GreaterThan_CFixedPoint(ScriptContainer.GetVariableValue('nfp50_law_gov_yes_present'), '(CFixedPoint)0'), 'NFP50_LAW_GOV_YES_NAME', 'NFP50_LAW_NO_MOVE')][SelectLocalization(GreaterThan_CFixedPoint(ScriptContainer.GetVariableValue('nfp50_law_gov_no_present'), '(CFixedPoint)0'), 'NFP50_LAW_GOV_NO_NAME', 'NFP50_LAW_NO_MOVE')]"
 NFP50_LAW_GOV_SPLIT:0 "In der Regierung sitzen Befürworter und Gegner. Gemeinsame Amtszimmer bedeuten offenbar noch keine gemeinsamen Ansichten."
