 NFP52_CHINA_2_TITLE:0 "Eine Macht weniger, viele Fragen mehr"
 NFP52_COMMUNE_1_BODY:0 "In Paris ist eine Kommune entstanden. Frankreichs politische Spaltung hat einen Namen und eine eigenständige Gestalt erhalten. Die Machtfrage stellt sich nun besonders scharf: Es geht um die Hauptstadt, das Zentrum der bestehenden Staatsordnung.\\n\\nDie Ausrufung der Pariser Kommune ist bestätigt. Hinter dem neuen Namen steht der Anspruch auf eine andere Staatsordnung. Wie die Auseinandersetzung ausgeht, bleibt abzuwarten. Vorerst lässt sich die Pariser Krise nicht mehr als weiterer Streit behandeln, der sich nach der nächsten Rede legt.\\n\\nHinter konkurrierenden politischen Vorstellungen sollte man die Stadt selbst sehen. Menschen müssen leben und arbeiten, während geklärt wird, wer sie wie regieren soll. Wir verfolgen die Nachrichten aus Frankreich. Hoffentlich bringt die nächste Seite dieser Geschichte mehr Klarheit und weniger Sorgen.\\n\\nDie Chronik trägt den Monat, in dem die Nachricht die Redaktion erreichte. Bei verzögerter Verbindung kann das Ereignis selbst früher stattgefunden haben."
