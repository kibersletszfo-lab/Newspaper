 NFP50_SUPPLY_BOTH_1:0 "Staatliche und militärische Gebäude verwenden diese Ware. Ihr Zweck erhöht die Bedeutung der Versorgung; konkrete Verluste von Behörden und Armee belegen diese Angaben nicht."
 NFP50_SUPPLY_BOTH_2:0 "Staatliche und militärische Gebäude benötigen diese Ware. Grund, die Versorgung genauer zu betrachten, ohne Verwendungszweck und nachgewiesene Mangelfolgen zu verwechseln."
 NFP50_SUPPLY_CRITICAL_1:0 "Besondere Sorge: Zum Ereignisdatum entspricht die Verbindung von Marktmangelschwere und örtlichem Mangel in unserem Land einer roten Warenmangelwarnung. Die Zahl betroffener Einwohner und Betriebe geht daraus nicht hervor."
 NFP50_SUPPLY_CRITICAL_2:0 "Diesmal verdient das Problem besondere Aufmerksamkeit: Zum Ereignisdatum erfüllt unser Land die Bedingungen einer roten Warenmangelwarnung. Das Ausmaß der Verluste einzelner Betriebe ergibt sich daraus nicht."
 NFP50_SUPPLY_END_1:0 "Die Redaktion ruft dazu auf, die Untersuchung nicht aufzuschieben. Die Wahl zwischen mehr Produktion, Handel und anderen Mitteln verlangt eine Prüfung örtlicher Bedingungen: Der Bericht allein bietet kein fertiges Wirtschaftsrezept."
 NFP50_SUPPLY_END_2:0 "Die Lage verdient baldige Aufmerksamkeit. Zunächst muss geklärt werden, wo die Versorgung begrenzt ist; Zeitungszahlen helfen, die Frage zu stellen, ersetzen aber nicht die Prüfung von Produktion und Handel."
 NFP50_SUPPLY_FOLLOW_1:0 "Wir kehren zu einer bereits veröffentlichten Versorgungsgeschichte zurück. Eine neue Beobachtung gibt Anlass, das Gespräch fortzusetzen."
 NFP50_SUPPLY_FOLLOW_2:0 "Diese Frage stand bereits auf unseren Seiten. Frische Angaben verlangen eine Rückkehr dazu."
 NFP50_SUPPLY_GAP_1:0 "Ware: [ScriptContainer.MakeScope.Var('nfp46_good').GetGoods.GetNameNoIcon]. Verkaufsaufträge betragen weniger als 80% der Kaufaufträge. Kaufaufträge: [ScriptContainer.GetVariableValue('nfp46_buy_before')|1] → [ScriptContainer.GetVariableValue('nfp46_buy_after')|1]; Verkaufsaufträge: [ScriptContainer.GetVariableValue('nfp46_sell_before')|1] → [ScriptContainer.GetVariableValue('nfp46_sell_after')|1]. Links steht die erste gespeicherte Aufnahme dieser Reihe, rechts die zum Ereignisdatum. Ein erheblicher Auftragsabstand allein beweist keinen Produktionsmalus."
 NFP50_SUPPLY_GAP_2:0 "Die Nachfrage nach „[ScriptContainer.MakeScope.Var('nfp46_good').GetGoods.GetNameNoIcon]“ liegt deutlich über dem Angebot: Verkaufsaufträge betragen weniger als 80% der Kaufaufträge. Kaufaufträge: [ScriptContainer.GetVariableValue('nfp46_buy_before')|1] → [ScriptContainer.GetVariableValue('nfp46_buy_after')|1]; Verkaufsaufträge: [ScriptContainer.GetVariableValue('nfp46_sell_before')|1] → [ScriptContainer.GetVariableValue('nfp46_sell_after')|1]. Links steht die erste gespeicherte Aufnahme dieser Reihe, rechts die zum Ereignisdatum. Es geht um Marktaufträge, nicht um die Warenmenge, die der Bevölkerung fehlt."
 NFP50_SUPPLY_GOVERNMENT_1:0 "Staatliche Gebäude verwenden die Ware. Eine wichtige Seite ihrer Nutzung; konkrete Einrichtungen und deren Verluste belegt der Bericht nicht."
 NFP50_SUPPLY_GOVERNMENT_2:0 "Die Nachfrage nach der Ware hängt unter anderem mit staatlichen Gebäuden zusammen. Diese Verwendung bedeutet noch keinen nachgewiesenen Schaden an einer bestimmten Einrichtung."
 NFP50_SUPPLY_INTRO_1:0 "Unser Markt braucht Aufmerksamkeit: Ein anhaltendes Versorgungsproblem wurde festgestellt."
 NFP50_SUPPLY_INTRO_2:0 "Die Versorgung führt uns erneut zu den Marktberichten. Die Zeitung hebt die betroffene Ware hervor."
 NFP50_SUPPLY_LONG_1:0 "Das Problem wurde in [ScriptContainer.GetVariableValue('nfp50_supply_observations')|0] aufeinanderfolgenden Monatsbeobachtungen verzeichnet. Jede zeigte einen erheblichen Auftragsabstand oder einen direkten Mangelindikator; ein ununterbrochener Produktionsmalus zwischen den Berichtsdaten wird damit nicht behauptet."
 NFP50_SUPPLY_LONG_2:0 "Die Zahl aufeinanderfolgender Monatsbeobachtungen mit Versorgungsproblem hat [ScriptContainer.GetVariableValue('nfp50_supply_observations')|0] erreicht. Das Zeichen kann zwischen Auftragsabstand und Marktmangel gewechselt haben; den täglichen Verlauf stellt diese Chronik nicht wieder her."
 NFP50_SUPPLY_MILITARY_1:0 "Diese Ware versorgt militärische Gebäude. Das macht die Frage wichtig, beweist aber nicht, dass unsere Truppen bereits Verluste oder einen Malus erlitten haben."
 NFP50_SUPPLY_MILITARY_2:0 "Militärische Gebäude verwenden diese Ware. Die Zeitung vermerkt die Bedeutung der Versorgung, ohne ihr unbelegte Folgen für die Armee zuzuschreiben."
 NFP50_SUPPLY_NATIVE_1:0 "Ware: [ScriptContainer.MakeScope.Var('nfp46_good').GetGoods.GetNameNoIcon]. Zum Ereignisdatum wurde ein direkter Marktmangelindikator verzeichnet. Kaufaufträge: [ScriptContainer.GetVariableValue('nfp46_buy_before')|1] → [ScriptContainer.GetVariableValue('nfp46_buy_after')|1]; Verkaufsaufträge: [ScriptContainer.GetVariableValue('nfp46_sell_before')|1] → [ScriptContainer.GetVariableValue('nfp46_sell_after')|1]. Links steht die erste gespeicherte Aufnahme dieser Reihe, rechts die zum Ereignisdatum."
 NFP50_SUPPLY_NATIVE_2:0 "Im Mittelpunkt steht [ScriptContainer.MakeScope.Var('nfp46_good').GetGoods.GetNameNoIcon]: Die letzte Aufnahme zeigt einen direkten Marktmangelindikator. Kaufaufträge: [ScriptContainer.GetVariableValue('nfp46_buy_before')|1] → [ScriptContainer.GetVariableValue('nfp46_buy_after')|1]; Verkaufsaufträge: [ScriptContainer.GetVariableValue('nfp46_sell_before')|1] → [ScriptContainer.GetVariableValue('nfp46_sell_after')|1]. Links steht die erste gespeicherte Aufnahme dieser Reihe, rechts die zum Ereignisdatum."
 NFP50_SUPPLY_NO_IMPORT_1:0 "Die aktuelle Aufnahme verzeichnet keine Einfuhr dieser Ware in den Markt. Produktion: [ScriptContainer.GetVariableValue('nfp50_supply_production')|1]; Verbrauch: [ScriptContainer.GetVariableValue('nfp50_supply_consumption')|1]; Ausfuhr: [ScriptContainer.GetVariableValue('nfp50_supply_exports')|1]. Fehlende Einfuhr beweist nicht, dass Handelsmöglichkeiten fehlen."
 NFP50_SUPPLY_NO_IMPORT_2:0 "Zum Ereignisdatum verzeichnet der Markt keine Einfuhr dieser Ware. Produziert werden [ScriptContainer.GetVariableValue('nfp50_supply_production')|1], verbraucht [ScriptContainer.GetVariableValue('nfp50_supply_consumption')|1], ausgeführt [ScriptContainer.GetVariableValue('nfp50_supply_exports')|1]. Möglichkeiten künftiger Lieferungen beurteilt dieser Bericht nicht."
 NFP50_SUPPLY_PRICE_1:0 "Preis zum Ereignisdatum: £[ScriptContainer.GetVariableValue('nfp50_supply_price')|1]; Abweichung vom Grundpreis: [ScriptContainer.GetVariableValue('nfp50_supply_premium')|1]% (Minus bedeutet günstiger). Der Preis misst nicht die Verfügbarkeit für jeden Käufer."
 NFP50_SUPPLY_PRICE_2:0 "Die Ware hat auch eine Preisseite. Preis zum Ereignisdatum: £[ScriptContainer.GetVariableValue('nfp50_supply_price')|1]; Abweichung vom Grundpreis: [ScriptContainer.GetVariableValue('nfp50_supply_premium')|1]% (Minus bedeutet günstiger). Der Preis misst nicht die Verfügbarkeit für jeden Käufer."
 NFP50_SUPPLY_RECOVERY_1:0 "Ware: [ScriptContainer.MakeScope.Var('nfp46_good').GetGoods.GetNameNoIcon]. In [ScriptContainer.GetVariableValue('nfp50_supply_good_observations')|0] aufeinanderfolgenden Monatsbeobachtungen fehlt der direkte Mangelindikator, und das Angebot beträgt mindestens 80% der Nachfrage. Kaufaufträge: [ScriptContainer.GetVariableValue('nfp46_buy_before')|1] → [ScriptContainer.GetVariableValue('nfp46_buy_after')|1]; Verkaufsaufträge: [ScriptContainer.GetVariableValue('nfp46_sell_before')|1] → [ScriptContainer.GetVariableValue('nfp46_sell_after')|1]. Links steht die erste gespeicherte Aufnahme dieser Reihe, rechts die zum Ereignisdatum. Ein Abstand unter dieser Schwelle kann bleiben."
 NFP50_SUPPLY_RECOVERY_2:0 "Für „[ScriptContainer.MakeScope.Var('nfp46_good').GetGoods.GetNameNoIcon]“ zeigen [ScriptContainer.GetVariableValue('nfp50_supply_good_observations')|0] aufeinanderfolgende Monatsaufnahmen weder den früheren Mangelindikator noch eine Angebotslücke über 20% der Nachfrage. Kaufaufträge: [ScriptContainer.GetVariableValue('nfp46_buy_before')|1] → [ScriptContainer.GetVariableValue('nfp46_buy_after')|1]; Verkaufsaufträge: [ScriptContainer.GetVariableValue('nfp46_sell_before')|1] → [ScriptContainer.GetVariableValue('nfp46_sell_after')|1]. Links steht die erste gespeicherte Aufnahme dieser Reihe, rechts die zum Ereignisdatum. Vollständiges Gleichgewicht versprechen diese Bedingungen nicht."
 NFP50_SUPPLY_RECOVERY_END_1:0 "Die Zeitung verzeichnet eine Verbesserung, ohne die Frage für immer zu schließen. Günstige Marktzahlen allein beweisen weder die Erholung jedes Betriebs noch das Sinken aller Preise."
 NFP50_SUPPLY_RECOVERY_END_2:0 "Eine erfreuliche Wende in einer alten Geschichte. Künftige Ausgaben beobachten den Markt weiter; die jetzige Verbesserung ist kein Versprechen dauerhaften Wohlergehens."
 NFP50_SUPPLY_RECOVERY_INTRO_1:0 "In unserer veröffentlichten Versorgungsgeschichte sind ermutigende Angaben eingetroffen."
 NFP50_SUPPLY_RECOVERY_INTRO_2:0 "Wir kehren zum früheren Mangel zurück: Neue Berichte zeigen eine Verbesserung."
 NFP50_SUPPLY_TRADE_1:0 "Marktproduktion: [ScriptContainer.GetVariableValue('nfp50_supply_production')|1]; Verbrauch: [ScriptContainer.GetVariableValue('nfp50_supply_consumption')|1]; Einfuhr: [ScriptContainer.GetVariableValue('nfp50_supply_imports')|1]; Ausfuhr: [ScriptContainer.GetVariableValue('nfp50_supply_exports')|1]. Die Einfuhr beträgt [ScriptContainer.GetVariableValue('nfp50_supply_import_fraction')|1]% der Summe aus Produktion und Einfuhr. Das misst die Marktversorgung, nicht den Einkaufsanteil der Einwohner unseres Landes; Handelsmengen allein belegen keine Mangelursache."
 NFP50_SUPPLY_TRADE_2:0 "Hinter den Gesamtaufträgen stehen Produktion und Handel. Marktproduktion: [ScriptContainer.GetVariableValue('nfp50_supply_production')|1]; Verbrauch: [ScriptContainer.GetVariableValue('nfp50_supply_consumption')|1]; Einfuhr: [ScriptContainer.GetVariableValue('nfp50_supply_imports')|1]; Ausfuhr: [ScriptContainer.GetVariableValue('nfp50_supply_exports')|1]. Die Einfuhr beträgt [ScriptContainer.GetVariableValue('nfp50_supply_import_fraction')|1]% der Summe aus Produktion und Einfuhr. Das misst die Marktversorgung, nicht den Einkaufsanteil der Einwohner unseres Landes; Handelsmengen allein belegen keine Mangelursache."
