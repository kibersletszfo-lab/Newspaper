 NFP65_AWAY_HALF:0 "Mindestens die Hälfte der Menschen in diesem Land kann jetzt lesen und schreiben. Eine runde Marke stellt für sich genommen freilich nicht alles auf den Kopf. An dem Tag schlagen sich nicht sämtliche Bücher von selbst auf, und die alten Schwierigkeiten verschwinden auch nicht. Doch ein immer größerer Teil der Gesellschaft kann nun selbst lesen. Für den Einzelnen heißt das, ohne fremde Hilfe zu verstehen, was geschrieben steht. Für das Land heißt es, auf einer festeren Grundlage planen zu können."
 NFP65_AWAY_THREE:0 "Der Anteil der Lese- und Schreibkundigen hat drei Viertel der Bevölkerung erreicht. Da lässt sich schon von einer breiten Verbreitung der Bildung sprechen und nicht mehr bloß von der Fertigkeit eines kleinen Kreises. Das verbliebene Viertel ist allerdings auch kein lästiger Tintenklecks im Bericht. Eine schöne Gesamtzahl sagt wenig darüber, wo der Schulbesuch leichtfällt und wer noch immer schwerer an Wissen gelangt. Die erreichte Leistung wird dadurch nicht geringer."
 NFP65_AWAY_TITLE:0 "Im Ausland wächst die Zahl der Lesekundigen"
 NFP65_COMPARE_AHEAD:0 "Unser Land liegt beim Anteil der Lese- und Schreibkundigen noch zurück. Darin haben sie einen Vorsprung. Ihn mit einem „Dafür haben wir aber ...“ abzutun wäre allzu bequem. Man kann auf die eigenen Erfolge stolz sein und fremde dennoch sehen. Zumal vom Glückwunsch zur nützlichen Frage kein weiter Weg ist: Was hat ihnen zu diesem Ergebnis verholfen, und wie stehen die Dinge bei uns?"
 NFP65_COMPARE_BEHIND:0 "Beim Anteil der Lese- und Schreibkundigen liegt unser Land noch vorn. Eine erfreuliche Einzelheit, das wollen wir gern einräumen. Doch der fremde Erfolg ist kein Anlass, sich gönnerhaft den eigenen Lorbeer zurechtzurücken. Der bessere Platz in der heutigen Übersicht ist uns nicht auf ewig zugesichert. Ein Vorsprung ist schön. Noch schöner ist es, wenn man ihn nicht zur Erinnerung werden lässt."
 NFP65_COMPARE_EQUAL:0 "Beim Anteil der Lese- und Schreibkundigen stehen unsere Länder derzeit nebeneinander. Wir könnten zufrieden vermerken, dass wir nicht zurückliegen, und umblättern. Nur bedeuten gleiche Gesamtzahlen weder gleiche Schulen noch gleichen Zugang zur Bildung für alle. Hinter ähnlichen Berichtszeilen können verschiedene Geschichten stehen. Sie zu vergleichen wäre interessanter, als feierlich ein Unentschieden auszurufen."
 NFP65_COMPARE_UNKNOWN:0 "Für einen verlässlichen Vergleich mit unserem Land reichen die Angaben noch nicht aus. Bequem wäre es, sofort zu wissen, wem besonders laut zu gratulieren ist und wem man zur Eile raten sollte. Aber ein Zeitungswettbewerb ohne sichere Ergebnisse wird zu leicht von dem gewonnen, der ihn beschreibt. Halten wir den erreichten Stand fest und verzichten wir vorerst auf die Platzvergabe."
 NFP65_END_COLD_PARTNER:0 "Die gemeinsamen Vereinbarungen haben den gegenseitigen Unmut unserer Länder nicht ausgeräumt. Umso nützlicher ist es, einmal etwas anderes zu bemerken als das, was sich für den nächsten Streit eignet. Der Partner hat in der Bildung etwas erreicht. Man muss ihn deswegen nicht lieben. Zu verstehen, was hinter dem Ergebnis steht, wäre aber keineswegs unnütz."
 NFP65_END_FRIEND:0 "Diesmal können wir unserem Partner ohne diplomatisches Zähneknirschen gratulieren. Schön wäre es, wenn nach den Höflichkeiten noch Zeit für ein Gespräch über gute Erfahrungen bliebe. Eine fremde Zahl in den eigenen Bericht abzuschreiben gehört sich nicht. Von dem zu lernen, was sie möglich machte, ist eine andere Sache."
 NFP65_END_NEUTRAL:0 "Die Veränderung ist vermerkt, ein Anlass zum Vergleich ist da. Nun würde uns interessieren, wie sich das Ergebnis im Leben des Landes selbst niederschlägt. Derweil werfen wir einen Blick in den eigenen Bericht. Fremde Nachrichten sind manchmal gerade deshalb so nützlich, weil sie uns die eigenen genauer lesen lassen."
 NFP65_END_OVERLORD:0 "Die Entwicklung dieser Macht müssen wir besonders aufmerksam verfolgen. Ihre Erfolge werden nicht von selbst zu unseren, so wenig wie ihre Bildung mit der nächsten Anordnung bei uns einzieht. Nützliche Erfahrungen kann man übernehmen. Die eigene Arbeit an der Bildung ersparen sie uns dennoch nicht."
 NFP65_END_REBELLIOUS:0 "Das Verhältnis zu diesem abhängigen Land lässt sich kaum ruhig nennen. Die wachsende Zahl der Lesekundigen allein erklärt sein Streben nach Selbstständigkeit freilich nicht. Zwei Nachrichten zu einer bequemen Erklärung zu verrühren wäre einfach. Beide einzeln zu verstehen ist schwieriger, hilft aber mehr, wenn man wissen will, was vor sich geht."
 NFP65_END_RIVAL:0 "Ein fremder Erfolg ist noch keine eigene Niederlage. Er muss aber auch nicht vor einem wohlgesetzten Spottwort verschwinden. Überlassen wir dem Rivalen seine Glückwünsche und schauen wir in den eigenen Bericht. Unser Witz möge eine unserer Stärken bleiben, nicht die Hauptantwort auf fremde Erfolge."
 NFP65_END_SUBJECT:0 "Eine gute Nachricht aus einem abhängigen Land verdient Beachtung auch ohne den Hinweis auf die uns geschuldeten Zahlungen. Seine Entwicklung erschöpft sich nicht in ihrem Nutzen für unsere Kasse. Der erreichten Marke mögen Veränderungen folgen, die die Einwohner noch auf andere Weise würdigen können als durch das Lesen einer Zeitung."
 NFP65_END_THREAT:0 "Man verfolgt dort unserem Staat gegenüber Absichten, die sich kaum harmlos nennen lassen. Ein wachsender Anteil Lesekundiger bedeutet noch keine Kriegsvorbereitung. Aber die Entwicklung eines Landes, das uns unter Druck setzen möchte, verdient auch ohne Trompetensignal Beachtung. Der beruhigende Gedanke „Es geht doch bloß um Bildung“ wäre hier wohl etwas leichtfertig."
 NFP65_HOME_END:0 "Es gibt einen Grund, auf unser Land stolz zu sein. Immer mehr Menschen können Geschriebenes selbst lesen. Zwischen ihnen und dem Wissen steht damit ein Vermittler weniger. Wie das heutige Ergebnis genau zustande kam, ist eine eigene Geschichte. Ohne Näheres wollen wir nicht den ganzen Erfolg einer einzigen glücklichen Maßnahme zuschreiben.\n\nMöge die Geschichte weitergehen. Eine Zeitung braucht Leser. Ein Land braucht Menschen, die mehr lesen können als Zeitungen."
 NFP65_HOME_EXPECTATIONS:0 "Bildung hat auch eine für die Regierung unbequeme Seite. Die Ansprüche ans Leben steigen. Lesen und Schreiben helfen der Wirtschaft voran, gewöhnen die Menschen aber nicht daran, sich mit weniger zu begnügen. Ein interessantes Nebeneinander: Das Land braucht gebildete Arbeitskräfte, und die gebildeten Arbeitskräfte möchten besser leben. Mit Glückwünschen zu den Fortschritten der Bildung dürfte diese Unterhaltung kaum beendet sein."
 NFP65_HOME_HALF:0 "Mindestens die Hälfte der Menschen in unserem Land kann jetzt lesen und schreiben. Hinter dieser Marke steckt mehr als eine Vermehrung der Zeitungsleserschaft. Einer gebildeten Bevölkerung fällt es leichter, neue Berufe zu ergreifen, und dem Land fällt es leichter, Wissenschaft zu betreiben und fremde Entdeckungen zu übernehmen. Aus Buchstaben werden allmählich nicht nur Wörter, sondern auch Möglichkeiten für die Wirtschaft."
 NFP65_HOME_INTRO:0 "Lesen zu können ist praktisch. Man kann eine Bekanntmachung entziffern, einen Brief lesen, in ein Buch schauen. Oder selbst nachlesen, was in der letzten Rede versprochen wurde, statt auf die Nacherzählung eines Menschen angewiesen zu sein, der sich nur das Interessanteste gemerkt hat. Für einen Menschen ist das eine Fertigkeit des Alltags. Für ein Land ist es eine Veränderung, die einen Platz auf der ersten Seite verdient."
 NFP65_HOME_PROFESSION:0 "Bildung erweitert für die Menschen die Berufswahl. Ingenieur zu werden oder sich mit Amtsakten zu beschäftigen fällt leichter, wenn man Geschriebenes nicht jedes Mal einem anderen zum Vorlesen reichen muss. Betriebe können ausgebildete Leute finden, und der Einzelne kann versuchen, über den gewohnten Verdienst hinauszukommen. Keine Garantie für eine Stelle oder einen guten Lohn. Aber eine Tür, für die es vorher womöglich nicht einmal einen Schlüssel gab."
 NFP65_HOME_SCIENCE:0 "Auch die Wissenschaft gewinnt Spielraum. Je mehr Menschen lesen können, desto mehr von den Forschungsmöglichkeiten seiner Universitäten vermag das Land für eigene Entdeckungen zu nutzen. Wissen aus dem Ausland verbreitet sich ebenfalls schneller. Es genügt ja nicht zu hören, dass irgendwo etwas Nützliches erfunden wurde. Man muss auch verstehen, wie es funktioniert. Lesekundige allein machen noch keinen wissenschaftlichen Durchbruch. Universitätsmauern allein allerdings ebenso wenig."
 NFP65_HOME_THREE:0 "Drei Viertel unserer Bevölkerung können jetzt lesen und schreiben. Für die Wirtschaft ist das eine bedeutsame Grundlage: Fachleute auszubilden, Forschung zu betreiben und zu verstehen, was anderswo erfunden wurde, ist leichter geworden. Das übrige Viertel besteht freilich ebenfalls aus Menschen. Ein schöner Bericht hat ihnen das Lesen noch nicht beigebracht."
 NFP65_HOME_TITLE:0 "Die Leserschaft wächst. Und nicht nur unsere Zeitung hat etwas davon"
 NFP65_OPEN_ALLY:0 "Unser Bündnispartner [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName] hat bei der Alphabetisierung eine neue Marke erreicht. Schön, einmal eine Nachricht vom Partner zu bekommen, für die man keine Kriegskarte ausbreiten muss. Diesmal geht es um Menschen, die Geschriebenes selbst lesen können. Darunter, darf man annehmen, auch unsere gegenseitigen Verpflichtungen. Für beide Seiten eine nützliche Kunst."
 NFP65_OPEN_ALLY_BLOC:0 "Unser Verbündeter und Partner im selben Machtblock, [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName], hat eine neue Marke bei der Alphabetisierung überschritten. Im gemeinsamen Kreis gibt es mehr Menschen, die eine Zeitung lesen können, einen Vertrag und das Kleingedruckte unter den Versprechen. Das ist für Partner eine gute Nachricht. Freilich macht die gemeinsame Blockzugehörigkeit die fremde Leistung noch nicht zur eigenen. Gratulieren können wir zusammen. Lernen muss man doch im eigenen Land."
 NFP65_OPEN_BLOC:0 "Unser Blockpartner [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName] hat eine neue Marke bei der Alphabetisierung erreicht. Nachrichten aus dem gemeinsamen Kreis der Mächte müssen nicht immer von Verhandlungen und der Verteilung von Einfluss handeln. Diesmal ist Bildung der Anlass. Auf den ersten Blick eine leise Meldung, für ein Land, das auf seine Entwicklung setzt, jedoch von Gewicht. Unterschriften unter gemeinsame Vereinbarungen tragen allein nicht sehr weit."
 NFP65_OPEN_NEIGHBOR:0 "Unser Nachbar [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName] hat bei der Alphabetisierung eine neue Marke erreicht. Die Grenze ist auf der Karte geblieben, wo sie war, und besorgte Telegramme müssen deshalb nicht verschickt werden. Doch Nachbarschaft besteht aus mehr als Grenzpfählen. Manchmal lohnt ein Blick auf das, was dahinter geschieht. Besonders wenn sich eine Gelegenheit bietet, fremde Erfolge mit den eigenen zu vergleichen."
 NFP65_OPEN_OTHER:0 "Aus [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName] erreicht uns die Nachricht von einer neuen Marke bei der Alphabetisierung. Nicht jede Auslandsnachricht muss mit einem Krieg, einem Skandal oder dem Sturz irgendeines Großen beginnen. Hier ist der Anlass ein anderer: Ein größerer Teil der Bevölkerung kann nun lesen und schreiben. Ein Ereignis ohne Ehrensalve, dessen Folgen womöglich länger anhalten als deren Echo."
 NFP65_OPEN_OVERLORD:0 "Unser Oberherr [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName] hat bei der Alphabetisierung eine neue Marke erreicht. Über Veränderungen bei der Macht, von der unser eigenes Land abhängt, sollte man auch anders als durch eingehende Anordnungen unterrichtet sein. Diesmal geht es um Bildung. Das ändert für sich genommen nichts an unseren Beziehungen, zeigt aber eine Seite der Entwicklung dieser Macht, mit der wir rechnen müssen."
 NFP65_OPEN_RIVAL:0 "Unser Rivale [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName] hat eine neue Marke bei der Alphabetisierung erreicht. Man könnte die Meldung mit einer scharfen Bemerkung begrüßen und es dabei bewenden lassen. Zum Leidwesen der Freunde einfacher Lösungen verlernen die Leute dort davon das Lesen nicht. Schauen wir also zunächst, was tatsächlich geschehen ist, und üben wir uns danach im Witz. Ein paar zusätzliche Kenntnisse haben selbst dem Zeitungsspott noch selten geschadet."
 NFP65_OPEN_SUBJECT:0 "Aus dem von uns abhängigen Land [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName] kommt die Nachricht, dass eine neue Marke bei der Alphabetisierung erreicht wurde. Seine Angelegenheiten werden leicht als Anhang der unseren gelesen: Was produziert es, was bringt es ein, wie ruhig verhält es sich? Nur leben dort Menschen und keine Zeilen in unserer Abrechnung. Und ein größerer Teil von ihnen kann jetzt selbst lesen, was in solchen Abrechnungen steht."
 NFP66_AWAY_CONTEXT:0 "Das Land hat ein Ergebnis vorzuweisen, mit dem man rechnen muss. Der Platz allein verrät noch nicht, wodurch es aufgestiegen ist und wie es um die einzelnen Wirtschaftszweige steht. Die Veränderung mit einem „Das sind bloß Zahlen“ abzutun wäre aber allzu bequem. Auch Zahlen können einiges zu sagen haben. Besonders dann, wenn hinter ihnen eine der größten Volkswirtschaften steht."
 NFP66_AWAY_FACT:0 "Vor dem Einzug unter die ersten zehn lag das Land auf Platz [ScriptContainer.GetVariableValue('nfp20_before')|0], nun auf Platz [ScriptContainer.GetVariableValue('nfp20_after')|0]. Bereits der zweite Monatsbericht in Folge zählt es zu den Größten. Verglichen wird hier das Gesamtvolumen der Volkswirtschaften. Nach dem Wohlstand einzelner Familien werden die Plätze nicht vergeben. Dann sähe die Liste womöglich ganz anders aus."
 NFP66_AWAY_TITLE:0 "Ein neuer Name unter den zehn größten Volkswirtschaften"
 NFP66_END_COLD_PARTNER:0 "Unsere gemeinsamen Vereinbarungen haben den gegenseitigen Unmut nicht ausgeräumt. Die Wirtschaft des Partners wird davon allerdings nicht kleiner. Es wäre wohl nützlicher, die Veränderung zu verstehen, als ein weiteres Mal beweisen zu wollen, dass bei einem unbequemen Partner nichts Interessantes geschehen kann."
 NFP66_END_FRIEND:0 "Dem Partner darf man gratulieren. Interessant wird nun, was aus seinem wirtschaftlichen Erfolg erwächst und ob unter den neuen Möglichkeiten Raum für eine nützliche Zusammenarbeit ist. Ein gemeinsames Bild bei einem Treffen ist ja ganz schön. Noch schöner wäre es, wenn sich der Nutzen der Partnerschaft nicht darin erschöpfte."
 NFP66_END_NEUTRAL:0 "Die Veränderung ist vermerkt, einen Grund zum weiteren Beobachten haben wir. Wie sich die neue Stellung im Leben des Landes und in seinen Geschäften mit dem Ausland niederschlägt, wird man sehen. Derweil könnten wir einen Blick in unsere eigene Übersicht werfen. Gute Nachrichten von anderswo sind mitunter gerade wegen der Fragen nützlich, die man sich hinterher selbst stellen möchte."
 NFP66_END_OVERLORD:0 "Sein wirtschaftlicher Erfolg wird nicht von allein zu unserem. Zugleich müssen wir wissen, über welche Möglichkeiten die Macht verfügt, von der wir abhängen. Es wäre zu wünschen, dass die eigene Entwicklung in unseren Plänen mindestens so viel Platz einnimmt wie die Beobachtung ihrer Erfolge."
 NFP66_END_REBELLIOUS:0 "Ruhig kann man das Verhältnis zu diesem abhängigen Land kaum nennen. Gerade deshalb verdient seine neue wirtschaftliche Stellung Beachtung. Den Platz unter den ersten zehn zur Ursache seines Strebens nach Selbstständigkeit zu erklären wäre voreilig. So zu tun, als spiele die Größe seiner Wirtschaft für unsere Beziehungen überhaupt keine Rolle, wäre es ebenso."
 NFP66_END_RIVAL:0 "Ein fremder Platz unter den ersten zehn ist kein Grund, unser eigenes Land sogleich zum Verlierer zu erklären. Mit einem gelungenen Spottwort allein möchten wir uns freilich auch nicht beruhigen. Unser Rivale hat etwas vorzuweisen. Es wäre erfreulich, wenn unsere nächste Antwort aus einem guten eigenen Bericht bestünde und nicht nur aus einem guten Witz."
 NFP66_END_SUBJECT:0 "Auch bei einem abhängigen Land sollte man seine eigene Wirtschaft sehen. Der neue Rang ist ein guter Anlass, seine Entwicklung genauer zu betrachten. Dabei muss die erste Frage nicht immer lauten, was sich noch für unsere Staatskasse herausholen lässt. Ein großes Ergebnis verdient ein etwas weiteres Gespräch als die nächste Aufstellung fälliger Zahlungen."
 NFP66_END_THREAT:0 "Man hegt unserem Land gegenüber Absichten, die sich schwerlich harmlos nennen lassen. Ein Platz unter den größten Wirtschaften baut für sich genommen noch keine Armee und beginnt keinen Krieg. Die Möglichkeiten einer solchen Macht zu übersehen wäre dennoch leichtfertig. Fremde Kräfte erst nach einer unangenehmen Überraschung zu zählen ist meist ein wenig spät."
 NFP66_HOME_CONTEXT:0 "Die Bewegung in der Rangliste erzählt noch nicht die ganze Geschichte. Der Platz hängt von unseren Geschäften ebenso ab wie von denen der übrigen Länder. Das Wesentliche steht fest: Im jetzigen Vergleich steht unser Land höher als zuvor und hat sich in zwei Beobachtungen unter den ersten zehn gehalten. Darin den Erfolg eines jeden Wirtschaftszweigs zu sehen wäre ein großzügiges Geschenk an jeden Rechenschaftsbericht."
 NFP66_HOME_END:0 "Was bleibt zum Schluss? Es gibt Grund zum Stolz. Ihn bloß deshalb zu leugnen, weil im Land Probleme bleiben, wäre seltsam. Noch seltsamer wäre es zu meinen, man dürfe die Probleme jetzt vergessen.\n\nUnter die ersten zehn sind wir gekommen. Wir hoffen, dass das gute Leben nicht vor der Tür geblieben ist."
 NFP66_HOME_FACT:0 "Vor dem Einzug unter die ersten zehn belegte unser Land Platz [ScriptContainer.GetVariableValue('nfp20_before')|0], jetzt steht es auf Platz [ScriptContainer.GetVariableValue('nfp20_after')|0]. Bereits im zweiten Monatsbericht in Folge zählen wir zu den Größten. Die Glückwünsche mussten also nicht zurückgezogen werden, sobald die Tinte trocken war. Für den Anfang gar nicht schlecht."
 NFP66_HOME_INTRO:0 "Unser Land gehört jetzt zu den zehn größten Volkswirtschaften der Welt. Eine erfreuliche Nachricht für alle, die in internationalen Übersichten gern nach einem Anlass für Nationalstolz suchen. Diesmal ist einer da. Wir dürfen die Schultern straffen, den Kragen richten und uns das Ergebnis näher ansehen. Am besten noch vor den Festreden."
 NFP66_HOME_LIVING:0 "Ein guter Platz in der Liste bedeutet für die Einwohner noch keinen Zuwachs an Wohlstand. Es ist schön zu wissen, dass man in einer der größten Volkswirtschaften der Welt lebt. Im Laden wird man trotzdem nach Geld gefragt und nicht nach dem Platz des Landes im internationalen Bericht. Der wirtschaftliche Rang sollte sich nicht nur im feierlichen Ton der Reden zeigen, sondern auch darin, was sich die Leute leisten können."
 NFP66_HOME_POTENTIAL:0 "Eine große Wirtschaft eröffnet dem Land mehr Möglichkeiten. Hinter dem Gesamtvolumen stehen Betriebe, Arbeit und Waren, aus denen sich der Alltag zusammensetzt. Darauf kann der Staat seine Pläne stützen. Zwischen „Wir haben die Möglichkeit“ und „Wir haben sie genutzt“ liegt freilich gewöhnlich einiges an Regierungsarbeit. Der Platz unter den ersten zehn erledigt sie nicht für uns."
 NFP66_HOME_TITLE:0 "Unsere Wirtschaft zählt zu den zehn größten der Welt"
 NFP66_OPEN_ALLY:0 "Unser Bündnispartner [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName] ist unter die zehn größten Volkswirtschaften der Welt aufgestiegen. Beim nächsten Treffen hat der Partner etwas vorzuweisen. Schön, wenn hinter gemeinsamen Vereinbarungen auch eine ansehnliche Wirtschaft steht. Das fremde Ergebnis wollen wir allerdings noch nicht zu den eigenen Leistungen zählen. Bei aller Freundschaft hat jedes Land seine eigene Bilanz."
 NFP66_OPEN_ALLY_BLOC:0 "Unser Verbündeter und Partner im selben Machtblock, [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName], zählt jetzt zu den zehn größten Volkswirtschaften der Welt. Im gemeinsamen Kreis gibt es damit einen Anlass mehr für Festreden. Schön wäre es, wenn danach auch nützliche Geschäfte auf die Tagesordnung kämen. Ein Machtblock ist schließlich nicht nur danach zu beurteilen, wie eindrucksvoll sich seine Mitgliederliste ausnimmt."
 NFP66_OPEN_BLOC:0 "Unser Blockpartner [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName] gehört jetzt zu den zehn größten Volkswirtschaften der Welt. Für den gemeinsamen Kreis der Mächte ist das eine bemerkenswerte Veränderung. Der fremde Rang bringt zwar nicht von selbst Geld in unsere Staatskasse. Er gibt aber Anlass, die Wirtschaft eines Landes genauer zu betrachten, mit dem uns Vereinbarungen verbinden."
 NFP66_OPEN_NEIGHBOR:0 "Unser Nachbar [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName] ist unter die zehn größten Volkswirtschaften der Welt aufgestiegen. Jenseits der Grenzpfähle gibt es einen Anlass mehr zum Stolz. Nachbarn haben überhaupt die Eigenschaft, uns ab und an einen Blick auf die eigenen Angelegenheiten nahezulegen. Zuweilen mit lauten Erklärungen. Diesmal mit einem Platz in der Wirtschaftsübersicht."
 NFP66_OPEN_OTHER:0 "[ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName] ist unter die zehn größten Volkswirtschaften der Welt aufgestiegen. Ein neues Land steht in der Liste, und wir haben einen Grund mehr, über die Grenzen zu schauen. Wie schwer eine Volkswirtschaft wiegt, wird selten durch eine lautstarke Erklärung deutlicher. Der internationale Vergleich liefert für dieses Gespräch etwas mehr Stoff."
 NFP66_OPEN_OVERLORD:0 "Unser Oberherr [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName] zählt nun zu den zehn größten Volkswirtschaften der Welt. Über die wirtschaftlichen Möglichkeiten dieser Macht sollten wir uns auch ohne Erinnerung aus ihrer Hauptstadt im Klaren sein. Diesmal ist ein neuer Platz in der internationalen Übersicht hinzugekommen. Für ein Land in unserer abhängigen Stellung ist das kein unwesentlicher Umstand."
 NFP66_OPEN_RIVAL:0 "Unser Rivale [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName] ist unter die zehn größten Volkswirtschaften der Welt aufgestiegen. Warme Glückwünsche werden sich dafür bei uns wohl nicht auf Anhieb finden. Das Ergebnis dürfte sich durch ihr Ausbleiben allerdings kaum ändern. Bevor wir erklären, weshalb ein fremder Erfolg nichts bedeutet, sollten wir wenigstens lesen, was dort eigentlich erreicht wurde."
 NFP66_OPEN_SUBJECT:0 "Aus dem von uns abhängigen Land [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName] kommt die Nachricht vom Einzug unter die zehn größten Volkswirtschaften der Welt. Ein Grund mehr, seine Angelegenheiten genauer zu betrachten. Hinter dem vertrauten Vermerk über die Abhängigkeit vergisst man leicht die Größe der Wirtschaft selbst. Die internationale Übersicht hat sie, wie man sieht, nicht vergessen."
 NFP67_AWAY_FACT:0 "Vor dem Einzug unter die ersten drei stand das Land auf Platz [ScriptContainer.GetVariableValue('nfp20_before')|0], nun steht es auf Platz [ScriptContainer.GetVariableValue('nfp20_after')|0]. Dies ist bereits der zweite Monatsbericht in Folge, der es zu den größten Erzeugern zählt."
 NFP67_AWAY_FIRST:0 "Nach der gegenwärtigen Produktionsmenge führt das Land die Weltrangliste an. Es ist also nicht nur ein Platz unter den führenden Erzeugern. Weiter oben steht in dieser Übersicht niemand mehr."
 NFP67_AWAY_TITLE:0 "Ein neuer Name unter den drei größten Erzeugern der Welt"
 NFP67_AWAY_TOP:0 "Zum ersten Platz auf der Welt hat es noch nicht gereicht. Einen Platz unter den größten Erzeugern hat das Land aber erreicht. Das Ergebnis nur deshalb abzutun, weil es kein erster Platz ist, wäre eine etwas seltsame Art, sich selbst zu trösten."
 NFP67_END_COLD_PARTNER:0 "Gegenseitige Beschwerden haben unsere Länder zur Genüge. Die Ware, die dort hergestellt wird, wird davon allerdings nicht weniger. Vielleicht wäre es nützlicher, die Ergebnisse zu vergleichen, als erneut beweisen zu wollen, dass einem unbequemen Partner nichts gelingen kann, was der Beachtung wert wäre."
 NFP67_END_FRIEND:0 "Dem Partner kann man gratulieren. Es wäre schön, wenn auf die Höflichkeiten auch nützliche Verhandlungen zum beiderseitigen Vorteil folgten. Zwischen der Freundschaft von Staaten und den Geschäften einzelner Betriebe steht freilich nicht immer ein Gleichheitszeichen. Das Ergebnis selbst wird dadurch nicht weniger interessant."
 NFP67_END_NEUTRAL:0 "Die Veränderung ist festgehalten und das eigene Ergebnis zum Vergleich herangezogen. Nun darf man auf die Fortsetzung gespannt sein. In einer Branche, in der unser Land selbst zu den größten Erzeugern gehört, ist eine gute Nachricht von anderswo ein passender Anlass, die eigenen Geschäfte genauer zu betrachten."
 NFP67_END_OVERLORD:0 "Sein Produktionserfolg wird nicht von allein zu unserem. Ein Vergleich der Möglichkeiten beider Länder ist dennoch nützlich. Den eigenen Rang in der Branche würden wir gern am Ergebnis unserer Arbeit ablesen und nicht allein an der Stellung im Abhängigkeitsverhältnis."
 NFP67_END_RIVAL:0 "Ein fremder Erfolg verlangt von uns kein sofortiges Eingeständnis einer Niederlage. Er gibt uns aber einen guten Grund, die eigene Branche anzusehen. Schön wäre es, wenn die nächste Antwort nicht nur den Lesern unserer Zeitung, sondern auch den Verfassern der Produktionsübersicht auffiele."
 NFP67_END_SUBJECT:0 "Auch hinter einem abhängigen Land sollte man seine eigene Wirtschaft sehen. Der erreichte Platz verdient Beachtung, ohne dass wir gleich fragen müssten, was für unsere Kasse herausspringt. Sollten die Beziehungen zu ihm gespannt sein, gibt es umso weniger Anlass, seine Möglichkeiten für eine Nebensache zu halten."
 NFP67_END_THREAT:0 "Die Möglichkeiten dieser Macht müssen wir besonders aufmerksam verfolgen. Die Menge einer Ware verrät für sich genommen noch nicht, wofür sie eingesetzt und was damit erreicht werden soll. Doch die Produktionskraft eines Landes zu übersehen, das uns unter Druck setzen möchte, wäre leichtfertig."
 NFP67_EQUAL:0 "Wir produzieren ungefähr ebenso viel. Hier geht es also nicht um einen fernen Spitzenreiter, dem man nur hinterherseufzen kann. Die Ergebnisse liegen nah beieinander. Umso interessanter dürfte die Fortsetzung werden. Auf dem Papier ließe sich die Meisterschaft noch heute ausrufen. In der Produktion wird man sie sich doch verdienen müssen."
 NFP67_HOME_END:0 "Was bleibt zum Schluss? Unter den ersten drei der Welt sind wir angekommen. Schön wäre es, wenn wir uns nicht damit begnügten, einen hübschen Stempel neben diese Tatsache zu setzen. Einen Erfolg schreibt man lieber fort, als sich an ihn zu erinnern.\n\nEin dritter oder zweiter Platz ist schon eine Leistung. Ein Grund aufzuhören? Wohl eher ein mäßiger."
 NFP67_HOME_FACT:0 "Vor dem Einzug unter die ersten drei lag unser Land auf Platz [ScriptContainer.GetVariableValue('nfp20_before')|0], nun auf Platz [ScriptContainer.GetVariableValue('nfp20_after')|0]. Bereits im zweiten Monatsbericht in Folge werden wir unter den größten Erzeugern geführt. Es sind also keine Glückwünsche, die man gleich bei der nächsten Zählung wieder zurücknehmen müsste. Den Platz, den wir jetzt haben, gilt es freilich noch zu halten."
 NFP67_HOME_FIRST_END:0 "Was bleibt zum Schluss? Der erste Platz verdient Glückwünsche. Nur wird die Produktion auch nach den Glückwünschen weiterarbeiten müssen. Lorbeer schmückt ein Fest recht gut, ersetzt aber weder Rohstoffe noch eine funktionierende Maschine.\n\nDie Spitze haben wir erreicht. Hoffentlich gelingt es uns, sie auch außerhalb der Festrede zu halten."
 NFP67_HOME_FIRST_INTRO:0 "Bei der Ware „[Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]“ ist unser Land zum größten Erzeuger der Welt geworden. Nach der produzierten Menge steht in der gegenwärtigen Übersicht niemand vor uns. Das schmeichelt dem Nationalstolz. Nur sollten inmitten der Glückwünsche die Menschen nicht verloren gehen, deren tägliche Arbeit es überhaupt erst ermöglicht hat, diese Zeile zu schreiben."
 NFP67_HOME_FIRST_TITLE:0 "Der erste Platz gehört uns"
 NFP67_HOME_INTRO:0 "Bei der Ware „[Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]“ ist unser Land unter die drei größten Erzeuger der Welt aufgestiegen. Schön, eine Meldung zu lesen, in der von der heimischen Wirtschaft einmal ohne die Worte „schon wieder zu wenig“ die Rede ist. Der Anlass ist diesmal ein anderer: Nach der Produktionsmenge zählen wir zur Weltspitze. Darauf dürfen wir stolz sein. Nun wollen wir sehen, was eigentlich dahintersteckt."
 NFP67_HOME_LIMIT:0 "Eine große Menge beantwortet noch nicht jede wirtschaftliche Frage. Ließ sich die Ware gewinnbringend verkaufen, reicht sie im Land aus, wird die Arbeit gut bezahlt? Das sind andere Seiten derselben Geschichte. Der Platz unter den ersten drei hat sie nicht für uns geprüft. Doch schmälert das den Erfolg selbst nicht: Unter den Erzeugern hat unser Land einen handfesten Grund zum Stolz gewonnen."
 NFP67_HOME_TITLE:0 "Unsere Produktion zählt zu den ersten drei der Welt"
 NFP67_HOME_WORK:0 "Hinter dem Platz in der Liste steht wirkliche Produktion. Eine Ware entsteht nicht aus einem gut formulierten Bericht. Betriebe stellen sie her, Menschen arbeiten dort, verbrauchen Material und lösen die gewöhnlichen Aufgaben des Tages. Die internationale Übersicht hält das Gesamtergebnis fest. Man sollte darüber nicht vergessen, dass es aus vielen Arbeitstagen besteht, für die es im Einzelnen selten eine Festrede gibt."
 NFP67_LESS:0 "Unsere eigene Produktion liegt ungefähr [ScriptContainer.GetVariableValue('nfp67_output_abs')|0]% niedriger. Bei der hergestellten Menge liegt das andere Land gegenwärtig vorn. Das ist kein Vergleich der Gewinne oder des Wohlstands der Beschäftigten, aber ein verständlicher Unterschied in den Ergebnissen, den wir zu verringern suchen sollten. Interessant wäre, was wir darauf erwidern können – außer einer Erklärung, weshalb man überhaupt nicht hätte vergleichen sollen."
 NFP67_MORE:0 "Unsere eigene Produktion liegt ungefähr [ScriptContainer.GetVariableValue('nfp67_output_abs')|0]% höher. Erfreulich, das wollen wir gern einräumen. Der fremde Einzug unter die ersten drei ist aber ein guter Grund, die Branche zu beobachten, statt sich gönnerhaft den eigenen Lorbeer zurechtzurücken. Ein Vorsprung wird besser durch Arbeit erhalten als durch Erinnerungen daran, dass man ihn besitzt."
 NFP67_OPEN_ALLY:0 "Unser Bündnispartner [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName] gehört bei der Ware „[Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]“ nun zu den drei größten Erzeugern der Welt. Er hat etwas vorzuweisen. Auch uns geht die Branche etwas an, denn bei dieser Ware zählt unser Land selbst zu den ersten fünf. Wir gratulieren also mit einigem fachlichen Interesse ... und mit ein wenig Neid."
 NFP67_OPEN_ALLY_BLOC:0 "Unser Verbündeter und Partner im selben Machtblock, [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName], ist bei der Ware „[Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]“ unter die drei größten Erzeuger aufgestiegen. Der gemeinsame Kreis hat einen Produktionserfolg mehr vorzuweisen. Ein gemeinsamer Block macht fremde Betriebe freilich nicht zu unseren. Umso interessanter ist es, die Ergebnisse beider Länder nebeneinanderzuhalten."
 NFP67_OPEN_BLOC:0 "Unser Blockpartner [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName] gehört bei der Ware „[Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]“ nun zu den drei größten Erzeugern der Welt. Die Nachricht betrifft eine Branche, in der wir selbst einen ansehnlichen Platz einnehmen. Hier gäbe es Gesprächsstoff, der etwas gehaltvoller ist als der nächste Austausch gegenseitiger Versicherungen künftiger Blüte."
 NFP67_OPEN_NEIGHBOR:0 "Unser Nachbar [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName] zählt bei der Ware „[Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]“ nun zu den drei größten Erzeugern. Jenseits der Grenze gibt es einen weiteren Grund für wirtschaftlichen Stolz. Diesmal betrifft er eine Ware, bei der unser Land selbst zu den ersten fünf der Welt gehört. Etwas zu vergleichen gibt es also auch ohne einen Wettstreit in der Lautstärke der Glückwünsche."
 NFP67_OPEN_OTHER:0 "[ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName] ist bei der Ware „[Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]“ unter die drei größten Erzeuger aufgestiegen. Für uns ist das keine beliebige Einzelheit aus einer fremden Wirtschaft. Unser Land gehört bei dieser Ware selbst zu den ersten fünf, hat also guten Grund, die Veränderungen in der Branche genauer zu verfolgen."
 NFP67_OPEN_OVERLORD:0 "Unser Oberherr [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName] gehört bei der Ware „[Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]“ jetzt zu den drei größten Erzeugern. Auch wir zählen zu den bedeutenden Herstellern dieser Ware. Die Meldung verdient damit aus mehr als nur diplomatischen Gründen Aufmerksamkeit. Es gibt einen sehr greifbaren Anlass, die Ergebnisse zu vergleichen."
 NFP67_OPEN_RIVAL:0 "Unser Rivale [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName] gehört bei der Ware „[Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]“ nun zu den drei größten Erzeugern. In dieser Branche haben wir eigene Interessen und eine eigene Produktion. Mit einem gewohnheitsmäßigen „Nichts Besonderes“ wäre es daher etwas zu leicht getan. Sehen wir lieber nach, was dort erreicht wurde und wie wir daneben aussehen."
 NFP67_OPEN_SUBJECT:0 "Das von uns abhängige Land [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName] ist bei der Ware „[Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]“ unter die drei größten Erzeuger aufgestiegen. Hinter der vertrauten Zeile über die Abhängigkeit verliert man die Möglichkeiten dieses Landes leicht aus dem Blick. Die Produktionsübersicht bringt sie in Erinnerung, und das ausgerechnet in einer Branche, die auch für unsere Wirtschaft wichtig ist."
 NFP67_UNKNOWN:0 "Die Produktionsmengen lassen sich noch nicht verlässlich miteinander vergleichen. Die Plätze in der Liste sind bekannt, die Größe des Abstands wollen wir jedoch nicht erfinden. Wer über die eigenen Möglichkeiten reden möchte, braucht einen eigenen Bericht und nicht nur einen Eindruck vom fremden Erfolg."
 NFP68_AWAY_CONTEXT_DOWN:0 "Die Möglichkeiten sind geringer geworden. Das Land abzuschreiben wäre jedoch verfrüht. Sein internationaler Rang ersetzt keine Auskunft über seine Wirtschaft, seine Armee und seine Vereinbarungen. Es wäre bequem, all das in einer kurzen Bezeichnung unterzubringen. Nur wird Bequemlichkeit hier leicht zum Irrtum, besonders wenn man darauf die eigenen Pläne baut."
 NFP68_AWAY_CONTEXT_RECOG:0 "Das Land steht für seine weitere Entwicklung günstiger da. Ob es diejenigen einholen wird, die bisher auf es herabgesehen haben, ist offen. Die gewohnte Erklärung, es sei „eben nicht ganz vollwertig“, reicht nun jedenfalls nicht mehr aus. Man wird auf seine Taten schauen müssen. Damit anzufangen hätte freilich auch früher nicht geschadet."
 NFP68_AWAY_CONTEXT_UP:0 "Das Land hat mehr Spielraum gewonnen, seine eigene Politik zu verfolgen. Das sollten wir im Hinterkopf behalten, wenn wir unsere Pläne machen. Die neue Stellung verheißt für sich allein weder ein nützliches Abkommen noch einen unangenehmen Zusammenstoß. Unsere gewohnte Einschätzung dieser Macht könnte aber hinter ihren heutigen Möglichkeiten zurückbleiben."
 NFP68_AWAY_FACT_DOWN:0 "Zuvor führte das Land den Rang „[Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]“, nun lautet er „[Localize(ScriptContainer.MakeScope.Var('nfp20_extra_detail').GetFlagName)]“. Seine Stellung ist gesunken und damit sein diplomatischer Spielraum geschrumpft. Von einer leeren Staatskasse oder einer hilflosen Armee ist damit noch nicht die Rede. Solche Schlüsse nimmt uns ein Rangwechsel nicht ab. Doch das bisherige Gewicht des Landes lässt sich nicht länger als unveränderlich betrachten."
 NFP68_AWAY_FACT_GP_DOWN:0 "Der frühere Rang des Landes war „Großmacht“, der neue lautet „[Localize(ScriptContainer.MakeScope.Var('nfp20_extra_detail').GetFlagName)]“. Aus dem obersten Kreis ist es ausgeschieden. Seine bisherigen Leistungen sind damit ebenso wenig verschwunden wie das Land selbst. Mit seinen internationalen Möglichkeiten zu rechnen, als sei nichts geschehen, wäre jedoch seltsam."
 NFP68_AWAY_FACT_GP_UP:0 "Der frühere Rang des Landes war „[Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]“, der neue lautet „Großmacht“. Es gehört nun zu den Staaten mit dem weitesten diplomatischen Spielraum. Es schon zum Herrn der Weltpolitik zu erklären wäre ein großzügiger Glückwunsch. So zu tun, als habe sich nur ein Name geändert, wäre allerdings ein großzügiges Geschenk an die eigene Seelenruhe."
 NFP68_AWAY_FACT_RECOG:0 "Früher lautete der Rang des Landes „[Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]“, jetzt lautet er „[Localize(ScriptContainer.MakeScope.Var('nfp20_extra_detail').GetFlagName)]“. Es zählt nun zu den anerkannten Mächten. Geändert hat sich mehr als der Titel. Unter der alten Stellung galten für eine Reihe von Angelegenheiten ungünstigere Bedingungen. Eine Hürde liegt jetzt hinter ihm. Wie geschickt es den Wandel nutzt, wird die nächste Geschichte zeigen."
 NFP68_AWAY_FACT_UP:0 "Der frühere Rang lautete „[Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]“, der neue lautet „[Localize(ScriptContainer.MakeScope.Var('nfp20_extra_detail').GetFlagName)]“. Das Land ist aufgestiegen und hat mehr diplomatische Möglichkeiten gewonnen. Nun wird nicht gleich jeder Vorschlag aus seiner Hauptstadt auf Zustimmung treffen. Es hat aber mehr Mittel, die eigenen Pläne mit Einfluss zu untermauern."
 NFP68_AWAY_TITLE_DOWN:0 "Der alte Name hat weniger Gewicht"
 NFP68_AWAY_TITLE_RECOG:0 "Unter den anerkannten Mächten gibt es Zuwachs"
 NFP68_AWAY_TITLE_UP:0 "Im Kreis der Mächte wird es enger"
 NFP68_END_COLD_DOWN:0 "Bei unseren Beziehungen fällt es nicht schwer, sich über fremdes Missgeschick zu freuen. Schwieriger ist es, hinterher vernünftig zu entscheiden, was aus den gemeinsamen Geschäften werden soll. Solange uns Vereinbarungen verbinden, betrifft der veränderte Spielraum des Partners auch unsere Pläne. Verzichten wir lieber auf einen Triumph, den schon die erste Rechnung im eigenen Interesse verderben könnte."
 NFP68_END_COLD_UP:0 "Die gemeinsamen Vereinbarungen haben unsere gegenseitigen Beschwerden nicht beseitigt. Die neuen Möglichkeiten des unbequemen Partners verschwinden dadurch aber auch nicht. Es ist nützlicher, sie näher anzusehen, als eine Erklärung dafür zu suchen, weshalb ein fremder Erfolg gar keine Aufmerksamkeit verdiene. Besonders dann, wenn man mit diesem Land ohnehin wieder verhandeln muss."
 NFP68_END_FRIEND_DOWN:0 "Für den gemeinsamen Kreis ist das nicht die erfreulichste Nachricht. Ein Bündnis besteht aber nicht allein dazu, gemeinsam Erfolge aufzuzählen. Jetzt ist es nützlicher zu verstehen, was der Partner noch vermag und was von den gemeinsamen Plänen zu erwarten ist. Vom alten Titel ist weniger geblieben. Vom gegenseitigen Verständnis dürfte es gern mehr werden."
 NFP68_END_FRIEND_UP:0 "Dem Partner darf man gratulieren. Schön wäre es, wenn den Höflichkeiten auch nützliche Verhandlungen zum beiderseitigen Vorteil folgten. Seine neuen Möglichkeiten werden nicht ohne Weiteres zu unseren. Doch die Gelegenheit, nach einem gemeinsamen Vorteil zu suchen, verdient mehr als einen wohlgesetzten Brief."
 NFP68_END_NEUTRAL_DOWN:0 "Die internationale Übersicht sieht anders aus, und wir tun gut daran, es zu bemerken. Den Wandel ohne nähere Prüfung mit fremden Fehlern erklären wollen wir nicht. Am alten Bild eines Landes nur deshalb festzuhalten, weil es uns vertraut ist, hätte aber auch wenig Sinn. Karten veralten nicht nur, wenn Grenzen wandern."
 NFP68_END_NEUTRAL_UP:0 "Die Veränderung ist vermerkt. Nun werden wir auf die Taten schauen. Der neue Rang gibt dem Land mehr Anlass, auf die eigenen Möglichkeiten zu zählen, und uns einen Grund, die gewohnte Vorstellung mit der jetzigen Lage abzugleichen. Gut, wenn eine Auslandsnachricht hilft, den eigenen Ansatz rechtzeitig zu berichtigen."
 NFP68_END_OVERLORD_DOWN:0 "Seine neue Stellung verdient Aufmerksamkeit, aber keine voreiligen Versprechen. Das bisherige Abhängigkeitsverhältnis verschwindet nicht allein durch einen Rangwechsel. Bevor man ausruft, nun stünden uns alle Türen offen, sollte man sich fragen, welche überhaupt verschlossen waren. Und was sich jetzt an ihren Schlössern geändert hat."
 NFP68_END_OVERLORD_UP:0 "Sein Erfolg wird nicht von selbst zu unserem. Wir müssen die Möglichkeiten der Macht, von der wir abhängen, aber verstehen. Hoffentlich bleibt neben der Beobachtung ihres Aufstiegs noch Platz für die eigenen Pläne. Der große Name eines anderen ist noch keine fertige Zukunft für unser Land."
 NFP68_END_REBELLIOUS:0 "Im Verhältnis zu dem abhängigen Land gibt es schon genug Fragen nach der Selbstständigkeit. Der neue Rang erklärt dieses Streben nicht und entscheidet seinen Ausgang auch nicht vorweg. Über die Zukunft des Landes zu sprechen, ohne die Veränderung seiner Möglichkeiten zu beachten, wäre aber eine ziemlich bequeme Gewohnheit. Vor allem für uns."
 NFP68_END_RIVAL_DOWN:0 "Das fremde Missgeschick wird bei uns gewiss dankbare Leser finden. Die Redaktion hat dafür Verständnis. Sie wird daraus aber nicht folgern, der Rivale sei nun zu nichts mehr imstande. Selbstberuhigung ist ein erschwingliches Vergnügen. Die Folgen kosten manchmal mehr."
 NFP68_END_RIVAL_UP:0 "Für uns ist das ein Anlass, die eigenen Möglichkeiten genauer anzusehen. Ein wenig wohlgesinntes Land hat etwas erreicht, das sich mit einem Spottwort nicht rückgängig machen lässt. Es wäre schön, wenn auch unsere Antwort eines Tages in der Übersicht der Erfolge stünde. Einen Wettstreit im Witz zu gewinnen ist erfreulich. Schade nur, dass dafür niemand zusätzlichen diplomatischen Spielraum verleiht."
 NFP68_END_SUBJECT_DOWN:0 "Der Verlust der bisherigen Stellung macht die Schwierigkeiten des Landes nicht zu einer ausschließlich fremden Angelegenheit. Von einem abhängigen Land lässt sich leicht verlangen, dass es seine Pflichten gewissenhaft erfüllt. Manchmal lohnt ein Blick darauf, mit welchen Mitteln es ihnen jetzt nachkommen muss."
 NFP68_END_SUBJECT_UP:0 "Neben dem Abhängigkeitsverhältnis sollte man die eigene Entwicklung dieses Landes sehen. Seine neuen Möglichkeiten verdienen mehr als nur die Frage, was noch für unsere Staatskasse abfällt. Es wäre schön, wenn unser Verständnis seiner Angelegenheiten wenigstens so schnell wüchse wie unsere Erwartungen an das Land."
 NFP68_END_THREAT:0 "Man hegt unserem Land gegenüber Absichten, die sich kaum harmlos nennen lassen. Deshalb verdient der veränderte Handlungsspielraum dort besondere Aufmerksamkeit. Ein neuer Rang bedeutet noch keinen Krieg, der Verlust des alten garantiert keine Ruhe. Nützlicher ist es zu verstehen, mit wem wir es zu tun haben, als zu hoffen, der nötige Schluss stünde schon in der Bezeichnung der Kategorie."
 NFP68_HOME_CONTEXT_DOWN:0 "Unser diplomatischer Spielraum ist kleiner geworden. Nicht so klein, dass jede eigene Entscheidung sinnlos wäre. Aber klein genug, um unsere Geschäfte ohne das gewohnte „Man wird mit uns ohnehin rechnen“ anzusehen. Lieber würden wir durch das auffallen, was wir anbieten können, als nur durch die Lautstärke, mit der wir an unsere frühere Stellung erinnern."
 NFP68_HOME_CONTEXT_GP_DOWN:0 "Wir sind aus dem Kreis der Großmächte ausgeschieden. Mit dem früheren Rang sind auch unsere Möglichkeiten geschrumpft, auf internationale Angelegenheiten Einfluss zu nehmen. Kein Grund anzunehmen, morgen würde kein Nachbar mehr unsere Briefe beantworten. Allein auf das frühere Gewicht unseres Namens zu vertrauen wäre jetzt aber allzu naiv. Besonders für jene, die erklären müssen, wo dieses Gewicht geblieben ist."
 NFP68_HOME_CONTEXT_GP_UP:0 "Wir sind in den Kreis der Großmächte eingetreten. Das Land kann seine eigene Diplomatie mit größerem Spielraum betreiben und seine Vorschläge mit Einfluss untermauern. Gut, wenn hinter den Worten etwas steht. Nun interessiert uns besonders, welche Vorhaben wir dieser Möglichkeiten für würdig erachten. Größe erkennt man schließlich lieber an den Ergebnissen als an der Schriftgröße des eigenen Titels."
 NFP68_HOME_CONTEXT_RECOG:0 "Der frühere Unterschied war mehr als eine Frage der Eitelkeit. Der nicht anerkannte Status brachte ungünstigere Bedingungen mit sich, etwa bei der Kreditaufnahme und bei der Verbreitung fremden Wissens. Diese Bedingungen haben sich geändert. Die Staatskasse atmet deshalb nicht auf der Stelle freier, und nicht jede Entdeckung erreicht uns plötzlich schneller. Aber eine Hürde ist gefallen. Für den Anfang eine durchaus würdige Nachricht."
 NFP68_HOME_CONTEXT_UP:0 "Die neue Stellung verschafft dem Land mehr diplomatischen Spielraum. Sie bringt für sich genommen noch kein gelungenes Abkommen hervor und verwandelt nicht jeden Gesprächspartner in einen Freund. Für eigene Entscheidungen ist jetzt aber mehr Platz. Schön wäre es, ihn zu nutzen, bevor die Glückwunschreden den ganzen freien Raum füllen."
 NFP68_HOME_END_DOWN:0 "Was bleibt zum Schluss? Eine unerfreuliche Veränderung nimmt man besser zur Kenntnis, als dem Bericht zu grollen. Ihre Gründe gilt es noch zu klären. Sie zu suchen dürfte nützlicher sein als beweisen zu wollen, dass uns die frühere Stellung eigentlich nie besonders gefallen habe.\n\nDer Titel ist bescheidener geworden. Unsere Pläne müssen es hoffentlich nicht auch werden."
 NFP68_HOME_END_RECOG:0 "Was bleibt zum Schluss? Die Anerkennung darf man feiern. Anschließend könnte man sich jener Dinge annehmen, derentwegen sich eine günstigere Stellung überhaupt zu erstreben lohnte. Offene Möglichkeiten sind besonders erfreulich, wenn man sie nutzt.\n\nDie Tür steht uns offen. Es wäre seltsam, den ganzen Tag über das Schild daran zu reden."
 NFP68_HOME_END_UP:0 "Was bleibt zum Schluss? Es gibt Grund zum Stolz. Nur wäre zu wünschen, dass die neue Stellung hilft, alte Fragen zu lösen, statt als bequeme Antwort auf jede von ihnen zu dienen.\n\nUnser Land hat an Gewicht gewonnen. Schön wäre es, wenn das auch außerhalb der Aufzählung seiner Verdienste zu spüren wäre."
 NFP68_HOME_FACT:0 "Der frühere Rang lautete „[Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]“, der neue lautet „[Localize(ScriptContainer.MakeScope.Var('nfp20_extra_detail').GetFlagName)]“. Genau diese Veränderung verzeichnet unsere jetzige Übersicht. Es geht um die Stellung des Landes unter den übrigen Mächten. Sie verdient Beachtung, verrät für sich genommen aber noch nicht, welchen Erfolgen oder welchen Schwierigkeiten wir sie verdanken."
 NFP68_HOME_INTRO_DOWN:0 "Unser Land hat seine frühere Stellung unter den Mächten der Welt eingebüßt. Das ist keine Meldung, die man gern neben einen festlichen Stich setzen würde. Wir könnten natürlich verkünden, dass fremde Listen uns ohnehin nie sonderlich beschäftigt hätten. Als wir dort noch weiter oben standen, haben wir uns freilich merklich lieber daran erinnert."
 NFP68_HOME_INTRO_NEUTRAL:0 "Unserem Land wird nun eine andere internationale Kategorie zugeordnet. Eine Veränderung steht im Bericht, die wir genauer betrachten sollten, ohne vorschnell zu gratulieren oder zu bedauern."
 NFP68_HOME_INTRO_RECOG:0 "Unser Land zählt jetzt zu den anerkannten Mächten. Nicht dass vorher hier niemand gelebt, gearbeitet oder eigene Pläne gemacht hätte. In internationalen Angelegenheiten genügt es nur manchmal nicht, zu bestehen. Die anderen sollten sich möglichst auch bereitfinden, es zu bemerken. Der alte Vermerk liegt nun hinter uns. Sehen wir, was sich mit ihm noch verändert."
 NFP68_HOME_INTRO_UP:0 "Unser Land ist unter den Mächten der Welt eine Stufe aufgestiegen. Eine erfreuliche Nachricht, zumal für diejenigen, die es müde waren, die Heimat erst irgendwo hinter den Worten „und andere“ zu finden. Der Nationalstolz hat einen neuen Grund, die Schultern zu straffen. Hoffentlich gewinnen außer den Schultern auch unsere Möglichkeiten etwas an Breite."
 NFP68_HOME_TITLE_DOWN:0 "Der Titel ist bescheidener geworden. Und die Taten?"
 NFP68_HOME_TITLE_RECOG:0 "Endlich hat man uns bemerkt"
 NFP68_HOME_TITLE_UP:0 "Nun wird man mit uns rechnen müssen"
 NFP68_NEUTRAL_CONTEXT:0 "Die Veränderung bedarf einer eigenen Betrachtung. Hinter einer Kategoriebezeichnung können sehr verschiedene Umstände stehen. Eine bequeme Erklärung dafür wollen wir nicht im Voraus aussuchen."
 NFP68_NEUTRAL_END:0 "Schauen wir auf die weiteren Taten des Landes. Sie werden über seine Möglichkeiten mehr verraten als der Versuch, aus einer einzigen Zeile die ganze Geschichte zu erraten."
 NFP68_NEUTRAL_FACT:0 "Der frühere Rang war „[Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]“, der neue ist „[Localize(ScriptContainer.MakeScope.Var('nfp20_extra_detail').GetFlagName)]“. Allein die verschiedenen Bezeichnungen verraten noch nicht, ob das Land stärker oder schwächer geworden ist."
 NFP68_NEUTRAL_TITLE:0 "Die Stellung des Landes hat sich geändert"
 NFP68_OPEN_ALLY:0 "Bei unserem Bündnispartner [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName] hat sich der internationale Rang geändert. Das verdient für uns mehr Beachtung als die nächste Umstellung in einer fremden Liste. Gemeinsame Vereinbarungen machen die Möglichkeiten des Partners zu einem Teil unserer eigenen Überlegungen."
 NFP68_OPEN_ALLY_BLOC:0 "Unser Verbündeter und Partner im selben Machtblock, [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName], führt einen neuen internationalen Rang. Uns verbindet genug, um die Veränderung nicht mit den Worten „Ihre Sache“ abzutun. Wie weit gemeinsame Pläne tragen, hängt schließlich auch davon ab, was die Beteiligten vermögen."
 NFP68_OPEN_BLOC:0 "Unser Blockpartner [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName] nimmt unter den Mächten einen anderen Platz ein. Der Kreis ist derselbe geblieben, das Gewicht eines seiner Mitglieder aber nicht. Für Gespräche über gemeinsame Angelegenheiten ist das ein erheblicher Unterschied. Ein Block ist schließlich mehr als die Zahl der Namen, die unter sein Banner passen."
 NFP68_OPEN_NEIGHBOR:0 "Bei unserem Nachbarn [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName] hat sich der internationale Rang geändert. Die Grenzpfähle sind deshalb nicht verrückt worden. Dafür gibt es einen Anlass, genauer hinzusehen, wer jenseits dieser Pfähle steht und welche Möglichkeiten das Land nun besitzt."
 NFP68_OPEN_OTHER:0 "Aus [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName] kommt die Nachricht von einem Wandel seiner internationalen Stellung. Unter den Mächten der Welt ist das Gewicht anders verteilt, und diese Geschichte hat sich einen Platz in unserer Ausgabe verdient. Der neue Titel allein erklärt die Veränderung nicht. Er gibt aber allen Grund, genauer hinzusehen."
 NFP68_OPEN_OVERLORD:0 "Bei unserem Oberherrn [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName] hat sich der internationale Rang geändert. Eine Nachricht wird nicht deshalb zu unserer eigenen, weil es zwischen den Hauptstädten Verpflichtungen gibt. Ganz fremd ist sie uns aber ebenso wenig. Die Möglichkeiten dieser Macht spielen auch in unseren eigenen Überlegungen eine Rolle."
 NFP68_OPEN_RIVAL:0 "Unser Rivale [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName] nimmt unter den Mächten jetzt einen anderen Platz ein. Bevor wir uns freuen oder ärgern, sollten wir lesen, was sich eigentlich geändert hat. Sein Titel vermehrt unsere Mittel nicht. Was aber das Land vermag, mit dem wir im Wettbewerb stehen, könnte für die Zukunft eine wichtige Auskunft sein."
 NFP68_OPEN_SUBJECT:0 "Aus dem von uns abhängigen Land [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName] erreicht uns die Nachricht von einem Wechsel des internationalen Rangs. Hinter der vertrauten Zeile über die Abhängigkeit gerät leicht aus dem Blick, was das Land selbst vermag. Inzwischen ändert sich seine Stellung. Es liegt in unserem Interesse zu verstehen, was sich hinter dem vertrauten Vermerk tut."
 NFP69_FACT:0 "In [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName] wurde „[Localize(ScriptContainer.MakeScope.Var('nfp69_old').GetFlagName)]“ durch „[Localize(ScriptContainer.MakeScope.Var('nfp69_new').GetFlagName)]“ ersetzt.\n\n[Localize(ScriptContainer.MakeScope.Var('nfp69_topic').GetFlagName)]"
 NFP69_HOME_OPEN:0 "Bei uns hat sich ein Gesetz geändert. Die alten Regeln weichen neuen. Für manche ist das lange ersehnt, für andere ein Anlass, vertraute Pläne zu überdenken. Sehen wir nach, was nun tatsächlich im Gesetz steht."
 NFP69_LIMIT:0 "Die neuen Regeln sind beschlossen; nun stellt sich die Frage, was sie für das Land bedeuten. Der Erlass ist noch nicht die ganze Geschichte. Wir kommen darauf zurück, wenn hinter der Gesetzessprache berichtenswerte Veränderungen sichtbar werden."
 NFP69_OPEN_ALLY:0 "Die Nachricht von einem neuen Gesetz kommt von unserem Verbündeten — [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName]. Über fremde Verhältnisse spricht es sich aus der Ferne leicht. Nützlicher ist es, zunächst die Änderung zu lesen: Manchmal wirft sie Fragen zu unseren eigenen Verhältnissen auf."
 NFP69_OPEN_ALLY_BLOC:0 "Die Nachricht von einem neuen Gesetz kommt von unserem Verbündeten und Machtblockpartner — [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName]. Über fremde Verhältnisse spricht es sich aus der Ferne leicht. Nützlicher ist es, zunächst die Änderung zu lesen: Manchmal wirft sie Fragen zu unseren eigenen Verhältnissen auf."
 NFP69_OPEN_BLOC:0 "Die Nachricht von einem neuen Gesetz kommt von unserem Machtblockpartner — [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName]. Über fremde Verhältnisse spricht es sich aus der Ferne leicht. Nützlicher ist es, zunächst die Änderung zu lesen: Manchmal wirft sie Fragen zu unseren eigenen Verhältnissen auf."
 NFP69_OPEN_NEIGHBOR:0 "Die Nachricht von einem neuen Gesetz kommt von unserem Nachbarn — [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName]. Über fremde Verhältnisse spricht es sich aus der Ferne leicht. Nützlicher ist es, zunächst die Änderung zu lesen: Manchmal wirft sie Fragen zu unseren eigenen Verhältnissen auf."
 NFP69_OPEN_OTHER:0 "Die Nachricht von einem neuen Gesetz kommt von einem anderen Land — [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName]. Über fremde Verhältnisse spricht es sich aus der Ferne leicht. Nützlicher ist es, zunächst die Änderung zu lesen: Manchmal wirft sie Fragen zu unseren eigenen Verhältnissen auf."
 NFP69_OPEN_OVERLORD:0 "Die Nachricht von einem neuen Gesetz kommt von unserem Oberherrn — [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName]. Über fremde Verhältnisse spricht es sich aus der Ferne leicht. Nützlicher ist es, zunächst die Änderung zu lesen: Manchmal wirft sie Fragen zu unseren eigenen Verhältnissen auf."
 NFP69_OPEN_RIVAL:0 "Die Nachricht von einem neuen Gesetz kommt von unserem Rivalen — [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName]. Über fremde Verhältnisse spricht es sich aus der Ferne leicht. Nützlicher ist es, zunächst die Änderung zu lesen: Manchmal wirft sie Fragen zu unseren eigenen Verhältnissen auf."
 NFP69_OPEN_SUBJECT:0 "Die Nachricht von einem neuen Gesetz kommt von unserem Untertanen — [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName]. Über fremde Verhältnisse spricht es sich aus der Ferne leicht. Nützlicher ist es, zunächst die Änderung zu lesen: Manchmal wirft sie Fragen zu unseren eigenen Verhältnissen auf."
 NFP69_POLICY_LAW_AFFIRMATIVE_ACTION:0 "Das Gesetz unterstützt gezielt Gruppen, die bisher am Rand des öffentlichen Lebens standen. Gleichberechtigung heißt hier, angesammelte Nachteile abzubauen, statt nur dasselbe Willkommensschild über jede Tür zu hängen."
 NFP69_POLICY_LAW_AGRARIANISM:0 "Die Wirtschaftspolitik begünstigt Landwirtschaft und ländliche Gemeinden. Ihr Mittelpunkt liegt näher am Feld und Dorf als am Fabriktor."
 NFP69_POLICY_LAW_ANARCHY:0 "Örtliche Gemeinschaften verwalten sich selbst und entsenden vorübergehend Delegierte in gemeinsame Räte. Entscheidungen müssen zwischen den Gemeinden abgestimmt werden; eine dauerhafte Befehlskette bildet nicht das Fundament dieser Ordnung."
 NFP69_POLICY_LAW_ANTI_STRIKE_LAWS:0 "Arbeiter dürfen Vereinigungen gründen, doch Streiks und manche gemeinsamen Forderungen bleiben verboten. Die Organisation darf bestehen; einige ihrer Druckmittel hat das Gesetz ihr genommen."
 NFP69_POLICY_LAW_APPOINTED_BUREAUCRATS:0 "Beamte werden von der Obrigkeit ernannt und für ihren Staatsdienst bezahlt. Über ihre Stellen und ihre Arbeit urteilen diejenigen, die die Ernennungen unterschreiben."
 NFP69_POLICY_LAW_AUTOCRACY:0 "Die höchste Macht liegt beim Staatsoberhaupt, das keiner anderen weltlichen Gewalt Rechenschaft schuldet. Wer das letzte Wort hat, steht hier schon fest, bevor der Streit überhaupt beginnt."
 NFP69_POLICY_LAW_BAKUFU:0 "Die gesamte Macht gehört dem Shogun, der im Namen des Kaisers regiert. Der Name an der Staatsspitze und die Hand, die entscheidet, gehören zu verschiedenen Ämtern."
 NFP69_POLICY_LAW_CAESAROPAPISM:0 "Die orthodoxe Kirche behält ihre Altäre, doch in ihren Angelegenheiten hat der Staat das letzte Wort. Andere Glaubensrichtungen sind vor dem Gesetz schlechter gestellt."
 NFP69_POLICY_LAW_CANTON_SYSTEM:0 "Außenhandel ist nur über einen einzigen Küstenstaat erlaubt. Einfuhrwaren erhalten einen schmalen Eingang, den die Behörden leichter überwachen können."
 NFP69_POLICY_LAW_CENSORSHIP:0 "Die Presse unterliegt der Zensur, Versammlungsfreiheit wird nicht gewährt. Bevor ein Wort seinen Leser erreicht, kann die Obrigkeit es unterwegs aufhalten."
 NFP69_POLICY_LAW_CENSUS_VOTING:0 "Gebildete Männer, die die vorgeschriebenen Voraussetzungen erfüllen, dürfen wählen. Bildung und gesellschaftliche Stellung entscheiden über den Zugang zur Wählerschaft."
 NFP69_POLICY_LAW_CHARITABLE_HEALTH_SYSTEM:0 "Die Versorgung Kranker übernehmen wohltätige, auch religiöse Einrichtungen. Behandlung hängt von den Mitteln der Hilfsbereiten ab; Spenden erhalten damit eine sehr praktische Bedeutung."
 NFP69_POLICY_LAW_CHIEFDOM:0 "Die Herrschaft beruht auf Verwandtschaft und einem Häuptling oder Ältesten aus einer angesehenen Familie. Persönlicher und familiärer Rang treten an die Stelle einer weit verzweigten Verwaltung großer Gebiete."
 NFP69_POLICY_LAW_CHIEFS_DISTRIBUTE_AID:0 "Häuptlinge verteilen Hilfe an bedürftige Mitglieder der Sippe, religiöse Einrichtungen und Krieger. Unterstützung läuft über die Autorität der Sippe und ihre Verfügung über gemeinsame Mittel."
 NFP69_POLICY_LAW_CHILD_LABOR_ALLOWED:0 "Das Gesetz schränkt die Arbeitsorte von Kindern nicht besonders ein. Kinderarbeit bleibt Teil der Wirtschaft, ohne gesondertes Verbot altersgefährlicher Tätigkeiten."
 NFP69_POLICY_LAW_CLOSED_BORDERS:0 "Ein- und Auswanderung sind verboten. Die Grenze sperrt sowohl denen den Weg, die anderswo leben möchten, als auch denen, die hier eine neue Heimat suchen."
 NFP69_POLICY_LAW_COLLECTIVIZED_AGRICULTURE:0 "Bäuerliche Kollektive bewirtschaften das Land. Das Feld wird zur gemeinsamen Sache, die Arbeitsorganisation zur Angelegenheit der ganzen Gruppe."
 NFP69_POLICY_LAW_COLONIAL_ADMINISTRATION:0 "Das Gebiet wird im Auftrag der Kolonialmacht regiert und besitzt keine eigene Souveränität. Die örtliche Verwaltung handelt innerhalb der Befugnisse, die ihr aus dem Ausland eingeräumt werden."
 NFP69_POLICY_LAW_COLONIAL_EXPLOITATION:0 "Rohstoffe und billige Arbeitskräfte stehen im Mittelpunkt der Kolonialpolitik. Grundlage ist der wirtschaftliche Ertrag abhängiger Gebiete, nicht ein Stück Land für den Siedler."
 NFP69_POLICY_LAW_COLONIAL_RESETTLEMENT:0 "Kolonien sind vor allem für Siedler aus den eingegliederten Staaten des Landes bestimmt. Die Landfrage bekommt eine überseeische Richtung: Neue Besitzungen gelten als Platz für neue Höfe."
 NFP69_POLICY_LAW_COLONIAL_SLAVERY:0 "In den Kolonien ist Sklaverei erlaubt; wer als versklavter Mensch das Mutterland betritt, wird jedoch frei. Ein Staat weist Menschen in verschiedenen Teilen seines Gebiets zwei unterschiedliche rechtliche Schicksale zu."
 NFP69_POLICY_LAW_COMBINATION_ACTS:0 "Sämtliche Arbeitervereinigungen sind gesetzlich verboten. Gemeinsam arbeiten darf man, sich zur Verteidigung gemeinsamer Interessen zusammenschließen nicht."
 NFP69_POLICY_LAW_COMMAND_ECONOMY:0 "Die Regierung lenkt den größten Teil der Produktion unmittelbar. Die wichtigsten wirtschaftlichen Entscheidungen laufen bei der Staatsverwaltung zusammen, die den Kurs der Betriebe bestimmen muss."
 NFP69_POLICY_LAW_COMMERCIALIZED_AGRICULTURE:0 "Landwirtschaft wird als Marktgeschäft im Eigentum des Kapitals organisiert. Das Feld gehört damit zur selben Welt der Investitionen und Ertragsrechnungen wie andere Unternehmen."
 NFP69_POLICY_LAW_COMMUNAL_ADMINISTRATION:0 "Die laufenden Geschäfte übernehmen Arbeiterorganisationen. In der Zentrale sitzen Vertreter, die sie selbst gewählt haben."
 NFP69_POLICY_LAW_COMPULSORY_PRIMARY_SCHOOL:0 "Kinder müssen mehrere Jahre die Grundschule besuchen und dürfen während dieser Ausbildung nicht arbeiten. Lesen und Schreiben bekommen einen Pflichtplatz im Stundenplan der Kindheit, anstelle des Verdienstes."
 NFP69_POLICY_LAW_CONSUMPTION_BASED_TAXATION:0 "Die Staatskasse erhebt Abgaben auf den Warenverbrauch statt einer allgemeinen Einkommens- oder Kopfsteuer. Die Steuerfrage stellt sich am Ladentisch: Es kommt darauf an, welche Einkäufe belastet werden."
 NFP69_POLICY_LAW_COOPERATIVE_OWNERSHIP:0 "Die Produktionsmittel gehen in das gemeinsame Eigentum der Arbeiter über, die den Überschuss teilen. Die Belegschaft steht nun auf beiden Seiten des Betriebs: bei der Arbeit und beim Eigentum."
 NFP69_POLICY_LAW_CORPORATE_STATE:0 "Der Staat organisiert die Zusammenarbeit amtlich anerkannter Körperschaften und Verhandlungen zwischen den gesellschaftlichen Klassen. Für ein Interesse sprechen darf, wer einer anerkannten Organisation angehört."
 NFP69_POLICY_LAW_CORPORATIZED_UNIONS:0 "Arbeitervereinigungen geraten unter unmittelbare oder mittelbare Staatskontrolle und werden auf die Zusammenarbeit der Klassen ausgerichtet. Organisierte Arbeit muss sich in die staatliche Ordnung des Interessenausgleichs einfügen."
 NFP69_POLICY_LAW_COUNCIL_REPUBLIC:0 "Arbeiter wählen Vertreter in örtliche Räte, die die Grundlage der Regierung bilden. Die Organisation der Arbeiterschaft wird damit Teil der politischen Machtordnung."
 NFP69_POLICY_LAW_CROWNLAND_DIETS:0 "Traditionelle Versammlungen des regionalen Adels übernehmen die örtliche Regierung. Staatsgeschäfte werden von den Adelsfamilien besprochen; der Kreis der Redner steht vorher fest."
 NFP69_POLICY_LAW_CULTURAL_EXCLUSION:0 "Kulturelle Anerkennung gilt denen, die Merkmale mit den Hauptkulturen des Landes teilen. Kulturen ohne solche Verbindungen bleiben eingeschränkt: Der Staat verlangt weiterhin einen Nachweis der Ähnlichkeit."
 NFP69_POLICY_LAW_DEBT_SLAVERY:0 "Wer Schulden nicht zurückzahlen kann, darf zum Eigentum des Gläubigers werden. Die Verpflichtung reicht nun bis an die persönliche Freiheit."
 NFP69_POLICY_LAW_DEDICATED_POLICE:0 "Eine Berufspolizei mit einheitlichen Ausbildungsanforderungen entsteht. Die Wahrung der Ordnung wird zum eigenen Dienst mit Schulung und dauerhaften Aufgaben."
 NFP69_POLICY_LAW_DIPLOMATIC_NAVY:0 "Lange Kreuzfahrten und weltweite Präsenz stehen im Vordergrund. Die Diplomatie erhält eine Marine, die fern vom Heimathafen Flagge zeigen kann."
 NFP69_POLICY_LAW_ELDER_COUNCIL:0 "An der Regierung dürfen nur die ältesten und angesehensten Mitglieder der Gesellschaft mitwirken. Politisches Gewicht richtet sich nach Alter und Ansehen statt nach einem allgemeinen Wählerverzeichnis."
 NFP69_POLICY_LAW_ELECTED_BUREAUCRATS:0 "Die Einwohner der Staaten wählen ihre örtlichen Verwalter. Das Amt muss sich nun vor Wählern verantworten: Örtliche Macht beruht auf mehr als einer Entscheidung aus der Hauptstadt."
 NFP69_POLICY_LAW_ETHNOSTATE:0 "Bürgerrechte bleiben einer bestimmten Volksgruppe vorbehalten; andere Kulturen werden diskriminiert. Abstammung entscheidet über die volle Zugehörigkeit zum Staat."
 NFP69_POLICY_LAW_EXPANDED_LATIFUNDIAS:0 "Großgüter erhalten stärkere Unterstützung: Das Gesetz erhöht das politische Gewicht und die Investitionserträge der Aristokratie und schwächt die politische Stellung der Bauern. Zur Größe des Besitzes kommen Vorteile in Geschäft und Regierung."
 NFP69_POLICY_LAW_EXTRACTION_ECONOMY:0 "Die Kolonialwirtschaft ist auf Gewinne für die Kolonialmacht ausgerichtet. Die Produktion dient einem auswärtigen Zentrum; dessen Nutzen wird zum Maßstab des Systems."
 NFP69_POLICY_LAW_EXTRAORDINARY_COMMISSION:0 "Eine Massenorganisation soll Sabotage und Gegenrevolution bekämpfen. Bei einem solchen Vorwurf wird sich künftig diese Stelle des Falls annehmen."
 NFP69_POLICY_LAW_FACTORY_COUNCILS:0 "Arbeiterräte erhalten einen Weg zur gemeinsamen Leitung von Betrieben, Gewerkschaften gewinnen politische Stärke. Die Frage nach der Macht am Arbeitsplatz gelangt damit in die Belegschaft selbst."
 NFP69_POLICY_LAW_FREEDOM_OF_CONSCIENCE:0 "Eine offizielle Religion bleibt bestehen, doch die freie Wahl des Glaubens wird erweitert; manche Bekenntnisse bleiben diskriminiert. Das Gewissen erhält mehr Raum, der Staat behält seine Ausnahmen."
 NFP69_POLICY_LAW_FREE_TRADE:0 "Freihandel wird eingeführt, staatliche Hindernisse für den Warenaustausch werden abgebaut. Betriebe begegnen beim Kaufen wie beim Verkaufen stärkerer ausländischer Konkurrenz."
 NFP69_POLICY_LAW_FRONTIER_COLONIZATION:0 "Die Kolonialpolitik konzentriert sich auf angrenzende Gebiete. Besiedelt wird das benachbarte Grenzland, statt nach jedem verfügbaren fernen Land zu greifen."
 NFP69_POLICY_LAW_GRADUATED_TAXATION:0 "Steuern auf Dividenden sollen einen größeren Teil der Last auf wohlhabende Einkommensbezieher verlagern. Die Staatskasse interessiert sich stärker für die Erträge der Kapitaleigentümer."
 NFP69_POLICY_LAW_GUARANTEED_LIBERTIES:0 "Die Behörden für innere Angelegenheiten müssen Beschwerden und Probleme der Bevölkerung angehen; Haft und Überwachung verlangen gewichtige Gründe. Die Befugnisse des Beamten enden nun an den Rechten des Menschen, an dessen Tür er klopft."
 NFP69_POLICY_LAW_GUILD_SYSTEM:0 "Bestimmte Handwerke und Gewerbe dürfen nur Mitglieder einer anerkannten Zunft ausüben. Der Beruf erhält einen gemeinsamen Torwächter: Einsteigen zu wollen genügt nicht mehr."
 NFP69_POLICY_LAW_HEREDITARY_BUREAUCRATS:0 "Beamtenstellen gehen samt Pflichten von den Eltern auf die Kinder über. Die Familiennachfolge hat den Amtsschreibtisch erreicht."
 NFP69_POLICY_LAW_HINDU_CASTE_CODIFIED:0 "Kastenunterschiede werden amtlich festgeschrieben und begrenzen gesellschaftliche wie wirtschaftliche Möglichkeiten. Die alte Ordnung erhält einen Platz im Gesetzbuch; aus Brauch wird eine förmliche Regel."
 NFP69_POLICY_LAW_HINDU_CASTE_ENFORCED:0 "Die Kastenhierarchie wird gesetzlich durchgesetzt und schränkt den Wechsel zwischen gesellschaftlichen Stellungen ein. Geburt ist nicht bloß ein Eintrag in der Familiengeschichte, sondern markiert die Grenzen des Erlaubten."
 NFP69_POLICY_LAW_HINDU_CASTE_NOT_ENFORCED:0 "Die Kastenzugehörigkeit darf gesellschaftlichen und wirtschaftlichen Aufstieg nicht mehr gesetzlich begrenzen. Abstammung ist nicht länger der amtliche Pass zu Möglichkeiten; gesellschaftliche Gewohnheiten schafft ein Erlass allein allerdings nicht ab."
 NFP69_POLICY_LAW_HOMESTEADING:0 "Bauern besitzen eigene Parzellen und bewirtschaften sie zusammen mit Lohnarbeitern. Selbstständiges Eigentum und bezahlte Arbeit bestehen nebeneinander: Der Besitzer muss nicht allein arbeiten."
 NFP69_POLICY_LAW_INDUSTRY_BANNED:0 "Schwerindustrie und Automatisierung werden zugunsten einer Wirtschaft aus Handarbeit abgelehnt. Eine Maschine muss nicht ihre Rentabilität rechtfertigen, sondern ihr Daseinsrecht."
 NFP69_POLICY_LAW_INTERMEDIATE_EDO_SYSTEM:0 "Gesellschaftliche Schranken werden gelockert; wohlhabende Bürger und Bauern können den Rang eines Gokenin, eines niederen Samurai, kaufen. Die Tür zum privilegierten Stand steht einen Spalt offen, der Eintritt kostet weiterhin Geld."
 NFP69_POLICY_LAW_INTERNAL_COLONIZATION:0 "Siedler der vorherrschenden Kultur sollen an die innere Peripherie ziehen. Die Landesgrenze bleibt auf der Karte, wo sie ist. Wer künftig nebenan wohnt, ist eine andere Frage."
 NFP69_POLICY_LAW_INTERVENTIONISM:0 "Der Staat darf in private Unternehmen eingreifen, um Auswüchse zu begrenzen und Stabilität zu sichern. Neben der unternehmerischen Freiheit steht das Recht der Obrigkeit, den Kurs zu korrigieren."
 NFP69_POLICY_LAW_ISOLATIONISM:0 "Die Wirtschaft strebt nach innerer Selbstversorgung und verzichtet auf gewöhnlichen Außenhandel. Angebot und Nachfrage müssen einander weitgehend diesseits der Grenze finden."
 NFP69_POLICY_LAW_JEUNE_ECOLE:0 "Die Flotte setzt auf kleine, schwer bewaffnete Schiffe gegen größere Gegner. Das Marinekonzept vertraut der Bewaffnung des kleinen Schiffs statt allein der Größe des Rumpfs."
 NFP69_POLICY_LAW_LABOUR_SUFFRAGE:0 "Das Stimmrecht hängt nun am Lebensunterhalt. Wer von eigener Arbeit lebt, darf wählen. Wer daneben Einkünfte aus Besitz hat, fällt unter eine andere Regel."
 NFP69_POLICY_LAW_LAISSEZ_FAIRE:0 "Privater Wettbewerb und begrenzte Staatseingriffe bestimmen die Wirtschaftspolitik. Unternehmen dürfen freier entscheiden, wohin ihr Kapital fließt."
 NFP69_POLICY_LAW_LANDED_VOTING:0 "Eigentümer von Land oder Kapital dürfen wählen. Bevor das System nach einer Meinung fragt, erkundigt es sich nach dem Besitz."
 NFP69_POLICY_LAW_LAND_BASED_TAXATION:0 "Das Steuersystem beruht auf Landabgaben, die vor allem Bauern zahlen. Staatseinnahmen sind eng an die Landwirtschaft und die Pflichten der Menschen gebunden, die das Land bearbeiten."
 NFP69_POLICY_LAW_LATIFUNDIAS:0 "Große Güter mit schlecht bezahlten Saisonarbeitern bilden die Grundlage des Landbesitzes. Der Verdienst hängt nicht nur vom Grundherrn ab, sondern auch von der Jahreszeit."
 NFP69_POLICY_LAW_LAX_EDO_SYSTEM:0 "Gemeine erhalten Zugang zu Ämtern und Aufgaben, die bisher Samurai vorbehalten waren. Das Gesetz lässt mehr Raum zwischen Geburt und Beruf."
 NFP69_POLICY_LAW_LEGACY_SLAVERY:0 "Bestehende Sklaverei bleibt erhalten, ihre Ausweitung ist verboten. Das Gesetz bewahrt die alte Unfreiheit, versperrt ihr aber den Weg zu weiterer Verbreitung."
 NFP69_POLICY_LAW_LOCAL_POLICE:0 "Die öffentliche Ordnung wird örtlichen Polizeikräften anvertraut. Der Dienst ist an die örtliche Obrigkeit gebunden; Polizeiarbeit bleibt vor allem eine lokale Angelegenheit."
 NFP69_POLICY_LAW_MANORIALISM:0 "Das Land bleibt bei erblichen Eigentümern; Pächter schulden ihnen unbezahlte Arbeit, dürfen aber fortziehen. Gehen können sie; solange sie das Land nutzen, gehört Arbeit für den Besitzer zu ihren Pflichten."
 NFP69_POLICY_LAW_MASS_CONSCRIPTION:0 "Eine Berufsarmee kann durch massenhafte Einberufung von Infanterie verstärkt werden. Die Militärlisten rücken damit nahe an die Listen jener Menschen, die Werkstätten und Höfen fehlen könnten."
 NFP69_POLICY_LAW_MERCANTILISM:0 "Die Handelspolitik fördert Ausfuhren und einen positiven Geldzufluss im Wettbewerb mit anderen Ländern. Außenhandel soll die heimische Wirtschaft in diesem Wettstreit stärken."
 NFP69_POLICY_LAW_MERCHANT_NAVY:0 "Die Marine richtet sich nach Welthandel und Ladungsschutz. Ihre Kernfrage lautet, ob ein Handelsschiff seine Reise mitsamt Waren beenden kann."
 NFP69_POLICY_LAW_MIGRATION_CONTROLS:0 "Ein- und Auswanderung sind nur Angehörigen nicht diskriminierter Kulturen und Religionen erlaubt. Das Recht auf den Grenzübertritt hängt davon ab, wie der Staat die Identität des Menschen beurteilt."
 NFP69_POLICY_LAW_MILITARIZED_POLICE:0 "Die Polizei erhält militärische Ausrüstung und Ausbildung. Mit ihren Mitteln nähert sich der Dienst für die innere Ordnung den Streitkräften an."
 NFP69_POLICY_LAW_MILITARY_BUREAUCRATS:0 "Die Uniform passt jetzt auch in die Amtsstube. Die meisten hohen Beamten kommen aus dem Militär."
 NFP69_POLICY_LAW_MILLET_SYSTEM:0 "Bei sunnitischem Islam als Staatsreligion erhalten andere abrahamitische Gemeinden rechtliche Selbstständigkeit und Befreiung vom Wehrdienst gegen eine Religionssteuer. Die Gemeinden behalten ihre Ordnung, die Staatskasse stellt eine ausgesprochen weltliche Rechnung."
 NFP69_POLICY_LAW_MONARCHY:0 "Die ausführende Gewalt gehört dem Monarchen; die Dynastie verkörpert die staatliche Kontinuität. Die Familiengeschichte des Herrscherhauses wird Teil der Verfassung des ganzen Landes."
 NFP69_POLICY_LAW_MULTICULTURAL:0 "Bürgerrechte gelten ohne kulturelle Diskriminierung oder amtlichen Vorrang einer Kultur vor anderen. Zur Zugehörigkeit zum Land braucht es nicht mehr den passenden kulturellen Stammbaum."
 NFP69_POLICY_LAW_NATIONAL_GUARD:0 "Unabhängige freiwillige Bürgerformationen sollen die öffentliche Ordnung wahren. Innere Sicherheit wird damit nicht nur Sache dauerhafter Behörden, sondern auch bewaffneter Freiwilliger."
 NFP69_POLICY_LAW_NATIONAL_MILITIA:0 "Eine kleine reguläre Armee wird zur Landesverteidigung durch örtliche Milizen ergänzt. Für diese Soldaten ist die Heimat zugleich der Grund, zur Waffe zu greifen, und der Ort, an den sie bald zurückkehren möchten."
 NFP69_POLICY_LAW_NATIONAL_SUPREMACY:0 "Der Staat bevorzugt seine nationale Hauptidentität und erkennt auch Kulturen mit gemeinsamem Erbe sowie gemeinsamer Sprache oder anderen Bräuchen an. Für die übrigen bleiben rechtliche Schranken: Ähnlichkeit mit der Mehrheit wird zur Eintrittsbedingung."
 NFP69_POLICY_LAW_NEO_ABSOLUTISM:0 "Ein selbstherrlicher Regent stützt sich auf eine moderne Zentralverwaltung. Die Amtsstuben mögen neu geordnet sein; die letzte Entscheidung gehört weiterhin einem Einzelnen."
 NFP69_POLICY_LAW_NO_COLONIAL_AFFAIRS:0 "Der Staat verzichtet auf die Gründung von Kolonien durch förmliche Kolonisierung. Kolonialen Ambitionen fehlt damit der Ausweitungsmechanismus dieser Politik."
 NFP69_POLICY_LAW_NO_HEALTH_SYSTEM:0 "Die Staatskasse finanziert keine Gesundheitsversorgung. Behandlung gehört nicht zu den öffentlichen Ausgaben; Kranke müssen andere Wege und Einrichtungen für Hilfe suchen."
 NFP69_POLICY_LAW_NO_HOME_AFFAIRS:0 "Unruhen und Aufstände zu unterdrücken bleibt Aufgabe von regulärer Armee und Polizei. Ein eigenes Innenressort sieht das Gesetz nicht vor; der Staat vertraut auf vorhandene Kräfte."
 NFP69_POLICY_LAW_NO_MIGRATION_CONTROLS:0 "Der Staat kontrolliert die Ein- und Auswanderung über seine Grenzen nicht. Wer fortziehen oder ankommen will, muss kein besonderes Migrationsverbot überwinden."
 NFP69_POLICY_LAW_NO_POLICE:0 "Das Gesetz sieht keinen organisierten Polizeidienst vor. Für die öffentliche Ordnung besteht keine eigene dauerhafte Einrichtung."
 NFP69_POLICY_LAW_NO_SCHOOLS:0 "Bildung bleibt den Familien überlassen, ein gemeinsames Schulsystem fehlt. Lesenlernen hängt stark vom Geld und der Hilfe ab, die zu Hause verfügbar sind."
 NFP69_POLICY_LAW_NO_SOCIAL_SECURITY:0 "Der Staat verpflichtet sich nicht zum Unterhalt derer, die sich nicht selbst versorgen können. Bedürftige müssen Hilfe außerhalb eines öffentlichen Unterstützungssystems suchen."
 NFP69_POLICY_LAW_NO_WOMENS_RIGHTS:0 "Frauen unterstehen rechtlich männlicher Vormundschaft und haben eingeschränkte Rechte. Selbstständige Entscheidungen stoßen an ihre festgeschriebene Abhängigkeit vom Vormund."
 NFP69_POLICY_LAW_NO_WORKERS_RIGHTS:0 "Der Staat schafft keine besonderen Garantien für Arbeitsrechte. Dem Arbeitsverhältnis fehlt diese gesetzliche Schutzschicht für Beschäftigte."
 NFP69_POLICY_LAW_OFFICIAL_NATIONALITY:0 "Als Muster gilt dem Staat der russische Untertan. Von anderen Völkern erwartet er Anpassung. Für eine Familie, die zu Hause eine andere Sprache spricht, ist das eine sehr persönliche Angelegenheit."
 NFP69_POLICY_LAW_OKHRANA:0 "Die Geheimpolizei überwacht Auswanderer und geht gegen revolutionäre Aktivitäten vor. Wer die Grenze überschreitet, entzieht sich damit also noch nicht ihrem Blick."
 NFP69_POLICY_LAW_OLD_AGE_PENSION:0 "Der Staat übernimmt die Unterstützung von Arbeitern im Alter. Der Ruhestand wird zur öffentlichen Aufgabe statt allein zur Frage von Ersparnissen und Familienhilfe."
 NFP69_POLICY_LAW_OLIGARCHY:0 "Das Staatsoberhaupt teilt die Macht mit einem engen Kreis einflussreicher Personen, die keinen Wählern verantwortlich sind. Im politischen Gespräch gibt es mehrere Stimmen, die Gästeliste bleibt kurz."
 NFP69_POLICY_LAW_ORGANIC_REGULATION:0 "Die Regierung folgt den von Großmächten auferlegten organischen Statuten; Vertreter der Bojarenelite wählen das Staatsoberhaupt. Die Regeln kommen von außen, die Wähler aus einem sehr engen Kreis."
 NFP69_POLICY_LAW_OUTLAWED_DISSENT:0 "Regierungskritik ist verboten und gilt als Verrat. Für die Zeitungsfeder ist das ein besonders kurzer Weg von der Beobachtung zur Anklage."
 NFP69_POLICY_LAW_PARLIAMENTARY_REPUBLIC:0 "Der Vorsitzende der Volksvertretung wird Staatsoberhaupt. Das höchste ausführende Amt ist an das Parlament gebunden; die Ordnung der Vertretung wird besonders wichtig."
 NFP69_POLICY_LAW_PEASANT_LEVIES:0 "Das Heer beruht auf bäuerlichem Fußvolk mit sehr geringer Ausbildung. Zwischen einen Pflug führen und eine Formation halten liegt schließlich ein gewisser Abstand."
 NFP69_POLICY_LAW_PEASANT_PROPRIETORSHIP:0 "Der größte Teil des Ackerlands gehört selbstständigen bäuerlichen Eigentümern, große kommerzielle Güter nehmen weniger Raum ein. Im Mittelpunkt stehen Menschen, die eigenes Land bearbeiten."
 NFP69_POLICY_LAW_PEOPLE_OF_THE_BOOK:0 "Die islamische Rechtsordnung gewährt anderen abrahamitischen Glaubensgemeinschaften rechtliche Selbstständigkeit und Befreiung vom Wehrdienst gegen eine besondere Religionssteuer. Die Unterscheidung betrifft Gemeindegericht, Militärdienst und Geldbeutel."
 NFP69_POLICY_LAW_PER_CAPITA_BASED_TAXATION:0 "Zur Einkommensteuer tritt eine Kopfsteuer, die Arme besonders stark belastet. Derselbe Betrag je Person wiegt in einem großen Geldbeutel anders als in einem kleinen."
 NFP69_POLICY_LAW_POOR_LAWS:0 "Armenhilfe wird über Arbeitshäuser organisiert. Mit dem Unterhalt erhält der Bedürftige auch vorgeschriebene Lebens- und Arbeitsbedingungen."
 NFP69_POLICY_LAW_PRESIDENTIAL_REPUBLIC:0 "Die Republik besitzt einen Präsidenten als Staatsoberhaupt und eine repräsentative Regierung. Das Präsidentenamt wird zur zentralen Staatsstelle; wer wählen darf, regeln die politischen Rechte gesondert."
 NFP69_POLICY_LAW_PRIVATE_HEALTH_INSURANCE:0 "Behandlung wird über private Krankenhäuser und persönliche Krankenversicherungen organisiert. Zugang zur bezahlten Versorgung hängt davon ab, ob man diesen Schutz erwerben kann: Gesundheit wird zur Frage von Verträgen und Beiträgen."
 NFP69_POLICY_LAW_PRIVATE_SCHOOLS:0 "Private Einrichtungen übernehmen die Bildung. Die Schulwahl hängt vom vorhandenen Angebot und davon ab, ob die Familie das Schulgeld bezahlen kann."
 NFP69_POLICY_LAW_PROFESSIONAL_ARMY:0 "Das Land vertraut auf ein stehendes Heer aus Berufssoldaten. Soldatsein wird zum Hauptberuf, Ausbildung zum Teil des Dienstes statt zu einer kurzen Einleitung vor dem Feldzug."
 NFP69_POLICY_LAW_PROFESSIONAL_NAVY:0 "Der Staat unterhält eine starke ständige Flotte zur Abschreckung von Rivalen. Das Schiff ist hier zugleich Waffe und ein recht auffälliges Argument."
 NFP69_POLICY_LAW_PROPORTIONAL_TAXATION:0 "Steuern beruhen hauptsächlich auf Einkommen und beanspruchen ungefähr denselben Anteil des Verdienstes. Die Staatskasse bemisst ihre Forderung am Einkommen, statt bloß Köpfe zu zählen."
 NFP69_POLICY_LAW_PROTECTED_SPEECH:0 "Die freie Rede erhält gesetzlichen Schutz. Öffentliche Debatten bekommen mehr Raum; eine Zeitung darf eher erwarten, dass man auf ein Argument mit einem anderen antwortet."
 NFP69_POLICY_LAW_PROTECTIONISM:0 "Handelsbeschränkungen schützen die heimische Industrie vor ausländischer Konkurrenz. Die Handelspolitik errichtet eine Schranke zwischen dem Produzenten im Land und dem Rivalen jenseits der Grenze."
 NFP69_POLICY_LAW_PUBLIC_HEALTH_INSURANCE:0 "Der Staat finanziert eine Krankenversicherung für gleichen Zugang zur Versorgung. Behandlungskosten erhalten eine gemeinsame Haushaltsgrundlage, statt ganz auf der einzelnen Rechnung zu lasten."
 NFP69_POLICY_LAW_PUBLIC_SCHOOLS:0 "Der Staat übernimmt zugängliche Schulbildung nach gemeinsamen Bildungsregeln. Ein Platz im Klassenzimmer wird zur öffentlichen Verantwortung statt allein zur Frage der Familienmittel."
 NFP69_POLICY_LAW_RACIAL_SEGREGATION:0 "Bürgerrechte hängen von gemeinsamem rassischem Erbe ab; Kulturen anderer Abstammung werden diskriminiert. Das Gesetz zieht Grenzen zwischen Einwohnern, wo es Unterschiede ihrer Herkunft sieht."
 NFP69_POLICY_LAW_REGULATORY_BODIES:0 "Staatliche Stellen sollen das Handeln von Arbeitgebern begrenzen. Im Arbeitsstreit gibt es eine Einrichtung, die auf die Regeln achten soll, nicht nur auf Produktionszahlen."
 NFP69_POLICY_LAW_RELIGIOUS_SCHOOLS:0 "Religiöse Einrichtungen übernehmen die Schulen. Neben den Buchstaben erhält das Klassenzimmer Lehrer, für die Lernen mit Glaubensfragen verbunden ist."
 NFP69_POLICY_LAW_RESTRICTED_CHILD_LABOR:0 "Kinder dürfen nicht in Fabriken arbeiten. Das Gesetz zieht eine klare Grenze zwischen Kindesalter und Fabrikhalle."
 NFP69_POLICY_LAW_REVOLUTIONARY_GUARD:0 "Die Arbeitermilizen bilden eine gemeinsame Armee. Wer die Befehle gibt, entscheiden die Soldaten bei der Offizierswahl."
 NFP69_POLICY_LAW_RIGHT_OF_ASSEMBLY:0 "Bürger erhalten das Recht, sich zu versammeln. Die öffentliche Meinung bekommt einen Treffpunkt: eine Gelegenheit, gemeinsam zu beraten und Forderungen zu stellen."
 NFP69_POLICY_LAW_RIGHT_TO_ASSOCIATE:0 "Arbeiter dürfen Organisationen bilden und ohne besondere Beschränkungen tätig sein. Das gemeinsame Interesse erhält das Recht auf eine eigene Vereinigung."
 NFP69_POLICY_LAW_SAKOKU:0 "Kontakte zu fremden Staaten werden stark eingeschränkt, Handel ist nur über bestimmte Häfen erlaubt. Die Seegrenze hat wenige Türen, für die besondere Öffnungsregeln gelten."
 NFP69_POLICY_LAW_SECRET_POLICE:0 "Ein besonderer Apparat überwacht Andersdenkende und untersucht politische Straftaten. Die staatliche Aufmerksamkeit für private Gespräche erhält eine eigene Abteilung."
 NFP69_POLICY_LAW_SERFDOM:0 "Bauern sind an den Boden gebunden und ihrem Feudalherrn zur Arbeit verpflichtet. Ihre Stellung in dieser Ordnung beschränkt den Wechsel von Wohnort und Beruf."
 NFP69_POLICY_LAW_SHINSENGUMI:0 "Eine Eliteeinheit von Schwertkämpfern schützt Beamte und patrouilliert in der Hauptstadt. Die Ordnung hat eine klare Gestalt: Die Sicherheit der Obrigkeit wird einem besonderen bewaffneten Dienst übertragen."
 NFP69_POLICY_LAW_SINGLE_PARTY_STATE:0 "Legale politische Tätigkeit liegt in der Hand einer einzigen Partei. Der Streit um die Macht erhält einen vorgeschriebenen Rahmen: Nur ein Parteibuch wird zugelassen."
 NFP69_POLICY_LAW_SLAVERY_BANNED:0 "Es ist verboten, einen anderen Menschen als Eigentum zu besitzen. Menschliche Freiheit darf nicht mehr rechtmäßig in fremden Bestandslisten stehen."
 NFP69_POLICY_LAW_SLAVE_TRADE:0 "Das Gesetz erlaubt den Kauf versklavter Menschen im internationalen Handel. Die Nachfrage nach Zwangsarbeit erhält einen Außenmarkt, auf dem ein Mensch Gegenstand des Geschäfts ist."
 NFP69_POLICY_LAW_SOCIAL_MONARCHY:0 "Die Monarchie bleibt nationales Symbol, während der Staat zwischen Körperschaften vermittelt. Die Krone steht über dem Verhandlungstisch, an dem organisierte gesellschaftliche Interessen zusammenfinden sollen."
 NFP69_POLICY_LAW_STATE_ATHEISM:0 "Der Staat betreibt eine religionsfeindliche Politik, schließt Religion aus der Staatsführung aus und beschränkt sämtliche Glaubensrichtungen. Der Glaube selbst wird zum Gegenstand amtlichen Misstrauens."
 NFP69_POLICY_LAW_STATE_RELIGION:0 "Die Kirche wird zum Staatsorgan, religiöse Minderheiten bleiben rechtlich benachteiligt. Glaube betrifft damit nicht nur das Gewissen, sondern auch das Verhältnis zur Obrigkeit."
 NFP69_POLICY_LAW_STRICT_EDO_SYSTEM:0 "Die Ständeordnung bestimmt streng Beruf, Rechte und sogar die zulässige Gestaltung der Wohnung; ein Gemeiner darf kein Samurai werden. Der Staat überwacht Unterschiede bis zur Zahl der Tore: eine bemerkenswert gründliche Vorstellung von Ordnung."
 NFP69_POLICY_LAW_SUBJECTHOOD:0 "Die Einwohner gelten vor allem als Untertanen des Monarchen; kulturelle Fragen bleiben ihren Gemeinschaften überlassen. Gemeinsame Treue zur Krone wiegt hier schwerer als der Versuch, eine einheitliche nationale Identität zu schaffen."
 NFP69_POLICY_LAW_TECHNOCRACY:0 "Ein nicht gewählter Rat regiert, dessen Mitglieder nach Wissen und Fähigkeiten ausgewählt werden. Das Recht zu herrschen wird mit Sachkunde statt mit einem Wahlergebnis begründet."
 NFP69_POLICY_LAW_TENANT_FARMERS:0 "Bauern arbeiten auf dem Land erblicher Eigentümer, dürfen aber fortziehen und einen anderen Beruf suchen. Ihr Verhältnis zum Boden läuft über fremdes Eigentum; sie selbst sind nicht an die Parzelle gebunden."
 NFP69_POLICY_LAW_TERAKOYA:0 "Gemeine lernen in einem dezentralen Netz privater Tempelschulen. Das Schulleben beruht auf örtlichen Terakoya statt auf einer einheitlichen staatlichen Hierarchie."
 NFP69_POLICY_LAW_THEOCRACY:0 "Die Geistlichkeit regiert durch Auslegung heiliger Schriften. Staatliche Macht besitzt ein religiöses Fundament; der Streit über die öffentliche Ordnung liegt nahe am Streit über den Glauben."
 NFP69_POLICY_LAW_THIRD_SECTION:0 "Die kaiserliche Kanzlei hat eine eigene Abteilung für Zensur und Ermittlungen. Sie überwacht politische wie religiöse Abweichler. Für eine Zeitung ist das durchaus eine Berufsangelegenheit."
 NFP69_POLICY_LAW_TOTAL_SEPARATION:0 "Kirche und Regierung werden getrennt; Religionszugehörigkeit ist kein Grund mehr für Diskriminierung. Glaubensfragen und Bürgerrechte schickt das Gesetz an verschiedene Schreibtische."
 NFP69_POLICY_LAW_TRADITIONALISM:0 "Vorindustrielle Selbstversorgung mit geringen Staatseingriffen bestimmt das Wirtschaftsleben. Vertraute Erwerbsformen behalten Vorrang vor einer industriellen Ordnung."
 NFP69_POLICY_LAW_UNIVERSAL_SUFFRAGE:0 "Alle erwachsenen Männer erhalten das gleiche Wahlrecht. Vermögen bestimmt nicht mehr das Gewicht ihrer Stimme; die Stellung der Frauen regelt weiterhin ein eigenes Gesetz."
 NFP69_POLICY_LAW_WAGE_SUBSIDIES:0 "Das Gesetz verbindet soziale Absicherung mit einem Mindestlohn, den die zuständige Einrichtung umsetzt. Der Lohn erhält eine Untergrenze, deren Stützung der Staat übernimmt."
 NFP69_POLICY_LAW_WARRIOR_CASTE:0 "Waffen und Militärdienst bleiben einem eigenen Kriegerstand vorbehalten, der Gemeinen verschlossen ist. Vor der Treffsicherheit wird die Abstammung geprüft."
 NFP69_POLICY_LAW_WEALTH_VOTING:0 "Das Wahlrecht richtet sich nach dem Vermögen, Stimmen Wohlhabender wiegen schwerer. Politischer Einfluss erhält ein deutlich finanzielles Maß."
 NFP69_POLICY_LAW_WOMENS_SUFFRAGE:0 "Frauen erhalten das Wahlrecht. Politische Mitsprache ist nicht länger das Vorrecht eines Geschlechts; die allgemeinen Wahlvoraussetzungen bestimmen weiterhin die Wahlgesetze."
 NFP69_POLICY_LAW_WOMEN_IN_THE_FIELDS:0 "Frauen tragen die Hauptlast wirtschaftlicher und landwirtschaftlicher Arbeit, damit mehr Männer Krieg und Raubzügen nachgehen können. Die militärische Ordnung beruht darauf, wer zurückbleibt und die Wirtschaft am Laufen hält."
 NFP69_POLICY_LAW_WOMEN_IN_THE_WORKPLACE:0 "Das Gesetz eröffnet Frauen eine größere Rolle in bezahlter Beschäftigung. Verdienst und Selbstständigkeit reichen damit über den Haushalt hinaus."
 NFP69_POLICY_LAW_WOMEN_OWN_PROPERTY:0 "Frauen dürfen Eigentum besitzen, auch geerbtes. Besitz kann der Frau selbst gehören, statt allein dem Mann, von dem ihre Stellung abhängt."
 NFP69_POLICY_LAW_WORKER_PROTECTIONS:0 "Arbeiter erhalten umfassende gesetzlich gesicherte Rechte. Arbeitsbedingungen müssen Pflichten gegenüber Beschäftigten berücksichtigen, die sich nicht einfach aus einem privaten Vertrag streichen lassen."
 NFP72_BASE_1:0 "Hier wissen wir, wie die Gruppen zum neuen Gesetz selbst stehen. Ihre Positionen vor dessen Annahme wurden nicht festgehalten. Das zeigt, wie gut das Gesetz zu ihren Ansichten passt, nicht, wer den Austausch des alten unterstützte. Stimmen nachträglich zu vergeben wäre recht abenteuerlicher Journalismus."
 NFP72_BASE_2:0 "Hier wissen wir, wie die Gruppen zum neuen Gesetz selbst stehen. Ihre Positionen vor dessen Annahme wurden nicht festgehalten. Das zeigt, wie gut das Gesetz zu ihren Ansichten passt, nicht, wer den Austausch des alten unterstützte. Stimmen nachträglich zu vergeben wäre recht abenteuerlicher Journalismus."
 NFP72_GOV_1:0 "Auch innerhalb der Regierung hat das neue Gesetz seine eigene Geschichte. [Localize(ScriptContainer.MakeScope.Var('nfp50_law_gov_summary').GetFlagName)] Die Entscheidung ist gefallen, doch damit denkt noch nicht jedes Regierungsmitglied gleich. [SelectLocalization(GreaterThan_CFixedPoint(ScriptContainer.GetVariableValue('nfp50_law_gov_yes_present'), '(CFixedPoint)0'), 'NFP50_LAW_GOV_YES_NAME', 'NFP50_LAW_NO_MOVE')] [SelectLocalization(GreaterThan_CFixedPoint(ScriptContainer.GetVariableValue('nfp50_law_gov_no_present'), '(CFixedPoint)0'), 'NFP50_LAW_GOV_NO_NAME', 'NFP50_LAW_NO_MOVE')]"
 NFP72_GOV_2:0 "Auch innerhalb der Regierung hat das neue Gesetz seine eigene Geschichte. [Localize(ScriptContainer.MakeScope.Var('nfp50_law_gov_summary').GetFlagName)] Die Entscheidung ist gefallen, doch damit denkt noch nicht jedes Regierungsmitglied gleich. [SelectLocalization(GreaterThan_CFixedPoint(ScriptContainer.GetVariableValue('nfp50_law_gov_yes_present'), '(CFixedPoint)0'), 'NFP50_LAW_GOV_YES_NAME', 'NFP50_LAW_NO_MOVE')] [SelectLocalization(GreaterThan_CFixedPoint(ScriptContainer.GetVariableValue('nfp50_law_gov_no_present'), '(CFixedPoint)0'), 'NFP50_LAW_GOV_NO_NAME', 'NFP50_LAW_NO_MOVE')]"
 NFP72_IG_1:0 "Bei den nach Mitgliederzahl größten organisierten Gruppen sieht es so aus. [Localize(ScriptContainer.MakeScope.Var('nfp50_law_ig_1_type').GetFlagName)] — [Localize(ScriptContainer.MakeScope.Var('nfp50_law_ig_1_stance').GetFlagName)]. [SelectLocalization(GreaterThan_CFixedPoint(ScriptContainer.GetVariableValue('nfp50_law_ig_count'), '(CFixedPoint)1'), 'NFP72_SECOND', 'NFP50_LAW_NO_MOVE')] Diese Stimmen sagen viel über das organisierte politische Leben. Für alle Menschen außerhalb davon sprechen sie jedoch nicht."
 NFP72_IG_2:0 "Bei den nach Mitgliederzahl größten organisierten Gruppen sieht es so aus. [Localize(ScriptContainer.MakeScope.Var('nfp50_law_ig_1_type').GetFlagName)] — [Localize(ScriptContainer.MakeScope.Var('nfp50_law_ig_1_stance').GetFlagName)]. [SelectLocalization(GreaterThan_CFixedPoint(ScriptContainer.GetVariableValue('nfp50_law_ig_count'), '(CFixedPoint)1'), 'NFP72_SECOND', 'NFP50_LAW_NO_MOVE')] Diese Stimmen sagen viel über das organisierte politische Leben. Für alle Menschen außerhalb davon sprechen sie jedoch nicht."
 NFP72_MOVES_1:0 "Auch politische Bewegungen gehören zu dieser Geschichte. [SelectLocalization(GreaterThan_CFixedPoint(ScriptContainer.GetVariableValue('nfp50_law_move_yes_present'), '(CFixedPoint)0'), 'NFP72_MOVE_YES', 'NFP50_LAW_NO_MOVE')] [SelectLocalization(GreaterThan_CFixedPoint(ScriptContainer.GetVariableValue('nfp50_law_move_no_present'), '(CFixedPoint)0'), 'NFP72_MOVE_NO', 'NFP50_LAW_NO_MOVE')] Zustimmung zum neuen Gesetz belegt nicht, wer die Änderung herbeigeführt hat. Sie erklärt aber besser, warum die neue Ordnung manchen mehr zusagt als anderen."
 NFP72_MOVES_2:0 "Auch politische Bewegungen gehören zu dieser Geschichte. [SelectLocalization(GreaterThan_CFixedPoint(ScriptContainer.GetVariableValue('nfp50_law_move_yes_present'), '(CFixedPoint)0'), 'NFP72_MOVE_YES', 'NFP50_LAW_NO_MOVE')] [SelectLocalization(GreaterThan_CFixedPoint(ScriptContainer.GetVariableValue('nfp50_law_move_no_present'), '(CFixedPoint)0'), 'NFP72_MOVE_NO', 'NFP50_LAW_NO_MOVE')] Zustimmung zum neuen Gesetz belegt nicht, wer die Änderung herbeigeführt hat. Sie erklärt aber besser, warum die neue Ordnung manchen mehr zusagt als anderen."
 NFP72_MOVE_NO:0 "Unter den Gegnern des Gesetzes hat die Bewegung vom Typ „[Localize(ScriptContainer.MakeScope.Var('nfp50_law_move_no_type').GetFlagName)]“ die stärkste Unterstützung."
 NFP72_MOVE_YES:0 "Unter den Befürwortern des Gesetzes hat die Bewegung vom Typ „[Localize(ScriptContainer.MakeScope.Var('nfp50_law_move_yes_type').GetFlagName)]“ die stärkste Unterstützung."
 NFP72_NO_GROUPS_1:0 "Uns fehlen Angaben zu den Positionen organisierter Gruppen zu dieser Änderung. Einen stillen Bericht halten wir nicht für allgemeine Zustimmung: Er zeigt nur die Grenze unseres Wissens."
 NFP72_NO_GROUPS_2:0 "Uns fehlen Angaben zu den Positionen organisierter Gruppen zu dieser Änderung. Einen stillen Bericht halten wir nicht für allgemeine Zustimmung: Er zeigt nur die Grenze unseres Wissens."
 NFP72_RELATIVE_1:0 "Diese Positionen wurden vor Abschluss der Gesetzesannahme festgehalten. Sie vergleichen die neue Regel mit der alten. Manche begrüßen den Austausch, andere sehen es ganz anders. Die Unterschrift unter einem Erlass verrät diesen Unterschied selten."
 NFP72_RELATIVE_2:0 "Diese Positionen wurden vor Abschluss der Gesetzesannahme festgehalten. Sie vergleichen die neue Regel mit der alten. Manche begrüßen den Austausch, andere sehen es ganz anders. Die Unterschrift unter einem Erlass verrät diesen Unterschied selten."
 NFP72_SECOND:0 "[Localize(ScriptContainer.MakeScope.Var('nfp50_law_ig_2_type').GetFlagName)] — [Localize(ScriptContainer.MakeScope.Var('nfp50_law_ig_2_stance').GetFlagName)]."
 NFP89_DELIVERY:0 "[SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp89_regular'), '(CFixedPoint)1'), 'NFP89_MONTHLY_ON', 'NFP89_MONTHLY_OFF')]\n\n[SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp89_urgent'), '(CFixedPoint)1'), 'NFP89_URGENT_ON', 'NFP89_URGENT_OFF')]"
 NFP89_MONTHLY_OFF:0 "Die monatliche Zustellung ist derzeit ausgeschaltet. Diese Einführungsausgabe bleibt im Archiv; reguläre Nachrichten treffen ein, wenn Sie sie wieder erhalten möchten."
 NFP89_MONTHLY_ON:0 "Sie haben monatliche Zustellung gewählt. Wir kommen von Ausgabe zu Ausgabe auf Entwicklungen zurück: Ein einzelner besorgniserregender Bericht erzählt selten die ganze Geschichte."
 NFP89_TECH_END_COLD:0 "Uns verbinden Verpflichtungen, derzeit aber wenig Herzlichkeit. Die Entdeckung wird dadurch nicht kleiner. Eine nützliche Gelegenheit bleibt zu bedenken, wenn wir nicht jeden Bericht in einen neuen Streit verwandeln."
 NFP89_TECH_END_FRIEND:0 "Zu dieser Nachricht lohnt es, Glückwünsche zu schicken. Schön wäre es, wenn auf Höflichkeiten nützliche Gespräche folgten. Gutem Willen tut eine praktische Aufgabe gut."
 NFP89_TECH_END_NEUTRAL:0 "Das andere Land besitzt dieses Wissen nun. Was daraus wird, hängt von der weiteren Arbeit ab. Wir sollten lieber die eigenen Möglichkeiten prüfen, als fremde kleinzureden."
 NFP89_TECH_END_THREAT:0 "Unsere Beziehungen lassen wenig Raum für sorglose Glückwünsche. Die neuen Möglichkeiten des Landes verdienen Aufmerksamkeit. Jede Entdeckung zur Kriegsvorbereitung zu erklären wäre allerdings ein bequemer Ersatz fürs Beobachten."
 NFP89_TECH_OPEN_ALLY:0 "Unser Verbündeter [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName] hat eine neue Technologie erworben: [Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]. Gut, vom Verbündeten einmal etwas anderes als einen neuen Anlass zur Sorge zu bekommen. Nun stellt sich die Frage, wie er die Entdeckung nutzt."
 NFP89_TECH_OPEN_BLOC:0 "Unser Machtblockpartner [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName] hat eine neue Technologie erworben: [Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]. Unser gemeinsamer Kreis gewinnt eine weitere Möglichkeit. Die Blockmitgliedschaft allein bringt das Wissen allerdings nicht in unsere eigenen Werkstätten."
 NFP89_TECH_OPEN_NEIGHBOR:0 "Unser Nachbar [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName] hat eine neue Technologie erworben: [Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]. Für eine wissenschaftliche Entdeckung zählen Entfernungen wenig. Für die benachbarte Wirtschaft verdienen neue Möglichkeiten jenseits der Grenze dennoch Aufmerksamkeit."
 NFP89_TECH_OPEN_OTHER:0 "Eine wissenschaftliche Neuigkeit kommt aus [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName]: [Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]. Die Liste seiner Entdeckungen hat einen Eintrag mehr. Sehen wir nach, welche Möglichkeiten dahinterstehen."
 NFP89_TECH_OPEN_OVERLORD:0 "Unser Oberherr [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName] hat eine neue Technologie erworben: [Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]. Unsere Verbindung ist damit nicht plötzlich zur Leihbibliothek wissenschaftlichen Wissens geworden. Seine neuen Möglichkeiten sind für uns trotzdem wichtig."
 NFP89_TECH_OPEN_RIVAL:0 "Unser Rivale [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName] hat eine neue Technologie erworben: [Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]. Die Nachricht abzutun wäre leicht. Unsere Gleichgültigkeit würde seine neuen Möglichkeiten kaum schmälern."
 NFP89_TECH_OPEN_SUBJECT:0 "Unser Untertan [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName] hat eine neue Technologie erworben: [Localize(ScriptContainer.MakeScope.Var('nfp20_detail').GetFlagName)]. Hinter der vertrauten Zeile über Abhängigkeit übersieht man leicht die eigenen Möglichkeiten des Landes. Ein nützlicher Anlass, nochmals hinzusehen."
