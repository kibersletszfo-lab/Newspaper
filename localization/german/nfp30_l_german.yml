 NFP52_SPRING_2_TITLE:0 "Europa tritt in eine Zeit der Umbrüche"
 NFP52_SUEZ_1_BODY:0 "Der Suezkanal ist fertiggestellt. Gewöhnlich passen Menschen ihren Weg der Karte an. Hier musste die Karte einem menschlichen Plan weichen: Zwischen Mittelmeer und Rotem Meer ist eine Durchfahrt offen. Für Seeverbindungen ist das eine Nachricht, die schwer in eine Fußnote passt.\\n\\nDer Kanalbau ist abgeschlossen. Ein neuer Seeweg verbindet beide Meere und verändert den Blick auf frühere Routen. Wo die Geografie einen Umweg verlangte, gibt es nun eine Durchfahrt. Ein anschaulicher Fall, in dem Worte von kürzeren Wegen mit einem wirklichen Bauwerk einhergehen.\\n\\nNun beginnt die Arbeit mit der neuen Möglichkeit. Handel und Politik werden zeigen, wer sie am besten nutzt. Das Ergebnis selbst verdient bereits Aufmerksamkeit. Gut, wenn langes Planen etwas anderes hervorbringt als einen weiteren Plan.\\n\\nDie Chronik trägt den Monat, in dem die Nachricht die Redaktion erreichte. Bei verzögerter Verbindung kann das Ereignis selbst früher stattgefunden haben."
