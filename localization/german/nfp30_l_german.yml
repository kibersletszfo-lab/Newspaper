 NFP51_START_TIMELINE:0 "Dieses diplomatische Spiel begann im Monat [Localize(Concatenate('NFP30_MONTH_', ToString_int32(FixedPointToInt(ScriptContainer.GetVariableValue('nfp51_start_month')))))] des Jahres [ScriptContainer.GetVariableValue('nfp51_start_year')|0]. Spätere Berichte betreffen dieselbe Krise."
 NFP52_ACW_1_BODY:0 "In den Vereinigten Staaten hat ein Bürgerkrieg begonnen. Manche Nachrichten lassen einen vertrauten Ländernamen anders lesen. Die amerikanische Union streitet nun mit Waffen über ihre Zukunft. Hinter Worten von Einheit und dem Recht auf einen eigenen Weg steht eine schwierigere Frage: Was werden Menschen ertragen, bevor der Streit endet?\\n\\nDie Vereinigten Staaten sind in einen Krieg gegen einen abgespaltenen amerikanischen Staat eingetreten. Die politische Auseinandersetzung hat die Grenze überschritten, hinter der Entscheidungen nicht mehr nur am Verhandlungstisch fallen. Die Zukunft der Union selbst hängt nun vom Ausgang der Kämpfe ab.\\n\\nFür die übrige Welt ist das mehr als ein ferner amerikanischer Streit. Die Lage eines Landes verändert sich, mit dem andere Handel treiben, verhandeln und planen. Vor allem betrifft der Krieg aber jene, die in dieser Teilung leben müssen. Lieber würden wir bald über Friedensbedingungen berichten, als uns an neue Meldungen über den fortdauernden Krieg zu gewöhnen.\\n\\nDie Chronik trägt den Monat, in dem die Nachricht die Redaktion erreichte. Bei verzögerter Verbindung kann das Ereignis selbst früher stattgefunden haben."
