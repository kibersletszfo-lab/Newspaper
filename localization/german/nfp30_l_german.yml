 NFP30_UNKNOWN_TITLE:0 "Aus der Redaktion"
 NFP30_URGENT:0 "EILAUSGABE"
 NFP30_WAR_END_AWAY_1_BODY:0 "Der Krieg ist beendet. Hauptparteien: [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName] und [ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName].\n\nFür unsere Leser ist das eine wichtige Wende im Weltgeschehen. Wer seine Ziele erreicht hat und zu welchem Preis, geht aus diesem Bericht nicht hervor."
 NFP30_WAR_END_AWAY_1_LEAD:0 "Der Krieg zwischen den hier genannten Hauptparteien ist nach eingetroffener Nachricht beendet."
 NFP30_WAR_END_AWAY_1_TITLE:0 "Ein fremder Krieg geht zu Ende"
 NFP30_WAR_END_AWAY_2_BODY:0 "Der Krieg ist beendet. Hauptparteien: [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName] und [ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName].\n\nDie Zeitung verzeichnet das Kriegsende und wartet mit dem Urteil über die Ergebnisse, bis Angaben zu Verlusten und Friedensbedingungen vorliegen."
 NFP30_WAR_END_AWAY_2_LEAD:0 "Die militärische Auseinandersetzung der Hauptparteien ist beendet."
 NFP30_WAR_END_AWAY_2_TITLE:0 "Auslandsnachrichten: Ein Krieg ist beendet"
 NFP30_WAR_END_HOME_1_BODY:0 "Der Krieg ist beendet. Hauptparteien: [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName] und [ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName].\n\nWir berichten vom Ende des Krieges. Diese Nachricht allein nennt weder Sieger noch Verluste oder Friedensbedingungen."
 NFP30_WAR_END_HOME_1_LEAD:0 "Der Krieg, an dem unser Land als Hauptpartei beteiligt war, ist zu Ende."
 NFP30_WAR_END_HOME_1_TITLE:0 "Der Krieg unseres Landes ist beendet"
 NFP30_WAR_END_HOME_2_BODY:0 "Der Krieg ist beendet. Hauptparteien: [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName] und [ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName].\n\nZur Beurteilung des Ergebnisses brauchen wir Angaben zu Vereinbarungen und zur Lage der Parteien. Das Kriegsende allein erlaubt keine Siegesmeldung."
 NFP30_WAR_END_HOME_2_LEAD:0 "Der Krieg unseres Landes ist vorbei. Wir verzeichnen eine wichtige Änderung der heimischen Nachrichtenlage."
 NFP30_WAR_END_HOME_2_TITLE:0 "Die Nachricht vom Kriegsende ist eingetroffen"
 NFP30_WAR_END_METRICS:0 "Der Krieg ist beendet. Hauptparteien: [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName] und [ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName]."
 NFP30_WAR_START_AWAY_1_BODY:0 "Der Krieg hat begonnen. Hauptparteien: [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName] und [ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName].\n\nZu weiteren Beteiligten, Kampfverlauf und Folgen für unser Land braucht es mehr Angaben. Der Ausgang ist noch unbekannt."
 NFP30_WAR_START_AWAY_1_LEAD:0 "Im Ausland hat ein bedeutender Krieg begonnen. Wir nennen die beiden Hauptparteien."
 NFP30_WAR_START_AWAY_1_TITLE:0 "Ein neuer Krieg bricht aus"
 NFP30_WAR_START_AWAY_2_BODY:0 "Der Krieg hat begonnen. Hauptparteien: [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName] und [ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName].\n\nWir verzeichnen den Kriegsbeginn, ohne vorher den Sieger zu bestimmen. Die vollständige Teilnehmerliste geht aus diesem Artikel nicht hervor."
 NFP30_WAR_START_AWAY_2_LEAD:0 "Die Nachricht einer militärischen Auseinandersetzung zwischen den hier genannten Mächten ist eingetroffen."
 NFP30_WAR_START_AWAY_2_TITLE:0 "Ein neuer Krieg verändert die Weltnachrichten"
 NFP30_WAR_START_HOME_1_BODY:0 "Der Krieg hat begonnen. Hauptparteien: [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName] und [ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName].\n\nWir verfolgen die Entwicklung. Zunächst nennen wir die Hauptparteien; Angaben zu jedem Teilnehmer oder zum späteren Ausgang enthält diese Nachricht nicht."
 NFP30_WAR_START_HOME_1_LEAD:0 "Kriegsnachrichten verdrängen Friedensgeschäfte: Unser Land ist Hauptpartei eines neuen Krieges."
 NFP30_WAR_START_HOME_1_TITLE:0 "Unser Land ist in einen Krieg eingetreten"
 NFP30_WAR_START_HOME_2_BODY:0 "Der Krieg hat begonnen. Hauptparteien: [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName] und [ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName].\n\nDas Ereignis verdient die Aufmerksamkeit jedes Lesers. Die Zeitung wird den Ausgang nicht vorwegnehmen oder verlässliche Angaben durch Siegesversprechen ersetzen."
 NFP30_WAR_START_HOME_2_LEAD:0 "Die Nachricht eines Krieges ist eingetroffen, an dem unser Land als Hauptpartei beteiligt ist."
 NFP30_WAR_START_HOME_2_TITLE:0 "Ein Krieg mit unserem Land hat begonnen"
 NFP30_WAR_START_METRICS:0 "Der Krieg hat begonnen. Hauptparteien: [ScriptContainer.MakeScope.Var('nfp20_source_definition').GetCountryDefinition.GetName] und [ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName]."
