 NFP52_YUG_2_TITLE:0 "Die südslawische Einigung hat stattgefunden"
 NFP54_DIV_END:0 "Was bleibt zum Schluss? Über Wirtschaftswachstum darf und soll man sich freuen. Nur übersieht man hinter großen Zahlen leicht jene, denen dieses Wachstum überhaupt etwas bringen sollte. Warum die Werte auseinandergehen, bleibt zu klären. Einen Anlass, sich darum zu kümmern, haben wir bereits.\n\nEin guter Bericht ist eine nützliche Sache. Besonders, wenn es sich danach besser leben lässt."
 NFP54_DIV_EXPECTED:0 "Hinzu kommt ein erwarteter Lebensstandard von [ScriptContainer.GetVariableValue('nfp50_family_expected_sol')|2] – offenbar kommt das für unseren Staat unerwartet. Wie lange wir die wirtschaftlichen Erfolge auch bewundern: Die Lücke schließt sich davon nicht von selbst."
 NFP54_DIV_FACT:0 "In drei Monaten ist das vorausberechnete jährliche BIP von [ScriptContainer.GetVariableValue('nfp20_before')|0] auf [ScriptContainer.GetVariableValue('nfp20_after')|0] gestiegen. Das entspricht einem Zuwachs von [ScriptContainer.GetVariableValue('nfp50_family_gdp_growth')|2]%. Gleichzeitig sank der durchschnittliche Lebensstandard um [ScriptContainer.GetVariableValue('nfp20_extra')|2] Punkte. Zwei Nachrichten. Zwei benachbarte Zeilen. Zur ersten möchte man dem Land gratulieren. Zur zweiten schon weniger."
 NFP54_DIV_INTRO:0 "Die jüngsten Berichte zeigen deutlich, dass unser Land auf einen Erfolg stolz sein darf: Das BIP ist gestiegen. Eigentlich eine wunderbare Nachricht. Man könnte einander gratulieren, die Zahlen bewundern, leise die Hymne summen und zufrieden umblättern. Vorher lohnt sich allerdings noch ein Blick auf eine andere Zeile. Die mit der Überschrift „Lebensstandard“…"
 NFP54_DIV_LIVING:0 "Der durchschnittliche Lebensstandard lag zuvor bei [ScriptContainer.GetVariableValue('nfp50_family_sol_before')|2], jetzt beträgt er [ScriptContainer.GetVariableValue('nfp50_family_sol')|2]. Natürlich beschreibt ein Durchschnitt selten das Leben eines bestimmten Menschen. Isst der Kapitalist einen Braten und der Bauer nichts, sieht das durchschnittliche Abendessen durchaus ordentlich aus. Sinkt aber der Durchschnitt, lohnt sich ein Blick auf das Gesamtbild. Die Wirtschaft legt zu, der durchschnittliche Wohlstand geht zurück. Für einen Festbericht keine besonders erfreuliche Einzelheit, oder?"
 NFP54_DIV_TITLE:0 "Wirtschaftlicher Erfolg – nur satt machen Zahlen nicht"
 NFP55_INF_CONNECTED:0 "Zur Panik besteht vorerst kein Anlass. Der Marktzugang liegt bei [Multiply_CFixedPoint(ScriptContainer.GetVariableValue('nfp50_family_access'), '(CFixedPoint)100')|1]%. Von einer abgeschnittenen Region zu sprechen wäre eine gehörige Übertreibung. Eine überlastete Infrastruktur bedeutet noch nicht, dass morgen Brot und Hosen aus den Läden verschwinden. Erfreulich ist die Nachricht nicht. Von einer Katastrophe ist sie weit entfernt."
 NFP55_INF_DISCONNECTED:0 "Ein weiterer Grund zur Sorge ist der Marktzugang von [Multiply_CFixedPoint(ScriptContainer.GetVariableValue('nfp50_family_access'), '(CFixedPoint)100')|1]%. Die Verbindung zum gemeinsamen Markt ist alles andere als vollständig. Ob es zu leeren Ladentischen kommt, ist noch offen. Doch wüssten wir gern früher Bescheid, als die Einwohner zu raten beginnen, was zuerst ausgehen wird: die nötigen Waren oder die Geduld."
 NFP55_INF_END:0 "Was bleibt zum Schluss? Man sollte sich die Region jetzt ansehen, bevor ihre Schwierigkeiten in unserer Zeitung zur gewohnten Kulisse werden. Während die Regierung überlegt, ob sie eine Eisenbahn bauen, einen Hafen erweitern oder einen anderen Weg einschlagen soll, werden wir die Sache weiterverfolgen.\n\nZweimal messen, einmal schneiden – ein guter Rat. Man wünscht sich nur, dass am Ende jemand bereit ist, zur #strikethrough Schere#! Tat zu schreiten."
 NFP55_INF_FACT:0 "Es geht um die Region [SelectLocalization(And(ScriptContainer.MakeScope.Var('nfp20_problem_state').IsSet, ScriptContainer.MakeScope.Var('nfp20_problem_state').GetState.IsValid), 'NFP40_STATE_LINK', 'NFP40_REGION_FALLBACK')]. Zwei Monate in Folge kamen von dort wenig erfreuliche Nachrichten. Die Infrastruktur ist überlastet. Bei der ersten Meldung konnte man die Hoffnung noch auf den nächsten Bericht setzen. Der nächste Bericht ist da. Die Hoffnung ist geblieben, das Problem auch."
 NFP55_INF_INTRO:0 "Zum Gedeihen braucht die Wirtschaft einiges. Niedrigere Steuern, mehr erschwingliche Waren und die Gewissheit, dass das Nötige zur rechten Zeit am rechten Ort ankommt. Letzteres setzt allerdings freie Infrastruktur voraus. Und die hat, anders als unsere Wünsche, eine recht bestimmte Grenze. In einer unserer Regionen liegt der Bedarf inzwischen darüber."
 NFP55_INF_TITLE:0 "Wenn es eng wird: Die Infrastruktur bremst die Wirtschaft"
 NFP56_ACC_END:0 "Was bleibt zum Schluss? Von der Hauptstadt aus ist das Land auf der Karte gut zu sehen. Von der Region aus sieht man es womöglich besser an dem, was man kaufen und verkaufen kann. Zwischen diesen beiden Ansichten klafft derzeit eine unerfreuliche Lücke.\n\nWir werden verfolgen, ob sie sich schließen lässt. Es wäre schön, wenn der Weg zum gemeinsamen Markt kürzer würde als die nächste Erklärung, weshalb er so weit ist."
 NFP56_ACC_FACT:0 "Es geht um die Region [SelectLocalization(And(ScriptContainer.MakeScope.Var('nfp20_problem_state').IsSet, ScriptContainer.MakeScope.Var('nfp20_problem_state').GetState.IsValid), 'NFP40_STATE_LINK', 'NFP40_REGION_FALLBACK')]. Zwei Monatsberichte in Folge zeigen Schwierigkeiten beim Zugang zum nationalen Markt. Auf der Karte bleibt die Region ein Teil des Landes. Die gemeinsame Wirtschaft lässt sich nur nicht in vollem Umfang nutzen. Das Wort „national“ mag das Herz erwärmen. In den Einkaufskorb legen lässt es sich nicht."
 NFP56_ACC_FREE:0 "Merkwürdig ist, dass die Infrastruktur der Region die Last noch bewältigt. Mit dem vertrauten „Bauen wir eben noch etwas“ ist es also nicht getan. Es gibt freie Kapazität, aber keine vollwertige Marktanbindung. Man müsste erst herausfinden, wo die Sache stockt, bevor man Geld und Arbeiter dorthin schickt."
 NFP56_ACC_INTRO:0 "Schön ist es, wenn man die benötigte Ware einfach kaufen kann. Nicht erst Entfernungen berechnen und Umwege studieren, sondern hingehen und kaufen. Zwischen „im Land vorhanden“ und „bei uns erhältlich“ passt allerdings mitunter eine ganze Geschichte. In einer unserer Regionen fehlt dieser Geschichte noch das glückliche Ende."
 NFP56_ACC_OVERLOAD:0 "Vielleicht ist die Erklärung ganz alltäglich: Die Infrastruktur der Region ist überlastet. Ein unerfreuliches Zusammentreffen. Die Verbindung zum Markt ist unvollständig, und die eigenen Kapazitäten reichen ebenfalls nicht. Erklärt das zweite das ganze erste? Das bleibt offen. Gründe, genauer hinzusehen, gibt es nun jedenfalls mehr als einen."
 NFP56_ACC_SEVERE:0 "Hier wird es schwer, sich mit den Worten „kleinere Schwierigkeiten“ zu begnügen. Der Marktzugang erreicht nicht einmal die Hälfte des vollen Werts. Was heute auf den Ladentischen liegt, wissen wir nicht. Doch die Frage, wie sehr sich die Region auf die gemeinsame Wirtschaft verlassen kann, stellt sich immer dringlicher."
 NFP56_ACC_TITLE:0 "Unser Land – und doch so fern ..."
 NFP57_SUP_BOTH:0 "Die Ware wird von der Armee ebenso gebraucht wie von staatlichen Einrichtungen. Unter den Käufern sind demnach etliche mit wichtigen Aufgaben und Geld aus der Staatskasse. Die Wichtigkeit der Aufgabe garantiert nur leider nicht, dass sich das Benötigte auch findet. Besser wäre es, die Versorgung zu klären, solange man über den Mangel noch in Ruhe sprechen kann und nicht im unpassendsten Augenblick einen Ausweg suchen muss."
 NFP57_SUP_CHRONIC:0 "Der Mangel droht zur Gewohnheit zu werden. Das ist vielleicht seine unangenehmste Seite: Auch an das Wort „Nein“ kann man sich gewöhnen. Nur könnten es eines Tages nicht mehr die Verkäufer zu den Kunden sagen, sondern die Menschen zum Staat. Dann müsste man neben der Ware auch noch etwas anderes suchen. Wo ist das Vertrauen geblieben?"
 NFP57_SUP_CRITICAL:0 "Diesmal ist der Mangel in unserem Land so ernst, dass er sich kaum als bloße Schwierigkeit des Handels abtun lässt. Man kann sich natürlich damit trösten, dass sich irgendwo gewiss noch ein Rest finden wird. Vielleicht findet er sich sogar. Nur ob er für alle reicht, die ihn brauchen?"
 NFP57_SUP_DETAILS:0 "$NFP46_METRICS$\nProduktion auf dem Markt: [ScriptContainer.GetVariableValue('nfp50_supply_production')|1], Verbrauch: [ScriptContainer.GetVariableValue('nfp50_supply_consumption')|1], Einfuhr: [ScriptContainer.GetVariableValue('nfp50_supply_imports')|1], Ausfuhr: [ScriptContainer.GetVariableValue('nfp50_supply_exports')|1]. Die Einfuhr macht [ScriptContainer.GetVariableValue('nfp50_supply_import_fraction')|1]% der Summe aus Produktion und Einfuhr aus. Das beschreibt die Versorgung des Marktes, nicht den Anteil an den Einkäufen unserer Einwohner. Das Handelsvolumen allein erklärt den Mangel nicht.\nPreis zum Zeitpunkt der Meldung: £[ScriptContainer.GetVariableValue('nfp50_supply_price')|1]. Abweichung vom Grundpreis: [ScriptContainer.GetVariableValue('nfp50_supply_premium')|1]% (ein Minus bedeutet günstiger). Der Preis verrät nicht, ob jeder Käufer an die Ware herankommt.\nAufeinanderfolgende monatliche Beobachtungen mit Versorgungsproblemen: [ScriptContainer.GetVariableValue('nfp50_supply_observations')|0]. Direktes Zeichen einer Marktknappheit beim Ereignis: [ScriptContainer.GetVariableValue('nfp46_native_after')|0]. Schwerer örtlicher Mangel: [ScriptContainer.GetVariableValue('nfp50_supply_critical')|0]."
 NFP57_SUP_END:0 "Was bleibt zum Schluss? Ein Mangel kann ganz verschiedene Gründe haben. Der Käufer hat meist nur eine Frage: „Bekomme ich, was ich brauche?“\n\nWir kommen auf diese Geschichte zurück, wenn sich etwas ändert. Am liebsten wäre uns eine Veränderung, nach der man nicht mehr die Ware suchen muss, sondern bloß das Geschäft mit dem besseren Preis.\n\nÜber den Preis lässt sich doch viel angenehmer streiten, wenn es etwas zu kaufen gibt."
 NFP57_SUP_FACT:0 "Diesmal geht es um [ScriptContainer.MakeScope.Var('nfp46_good').GetGoods.GetNameNoIcon]. Auf dem Markt ist eine Knappheit verzeichnet, und die Schwierigkeiten mit der Versorgung tauchen nicht zum ersten Mal im Monatsbericht auf. Das heißt natürlich nicht, dass die Ware überall verschwunden wäre. Aber es gibt genug Kaufwillige, damit die Frage „Woher nehmen?“ eine eigene Zeitungsseite verdient. Die Nachfrage hat ihren Teil der Arbeit offenbar erledigt. Nun hätten wir gern noch das Angebot."
 NFP57_SUP_GOVERNMENT:0 "Auch staatliche Einrichtungen brauchen diese Ware. Die Sache könnte den täglichen Angelegenheiten des Landes also näher liegen, als eine einzelne Zeile im Handelsbericht vermuten lässt. Staatliche Bedeutung ist etwas Eindrucksvolles. Schade nur, dass sie selbst keine Waren herstellt."
 NFP57_SUP_INTRO:0 "Schön ist es, wenn ein Einkauf mit einer Wahl beginnt. Was ist besser, was günstiger, was kann ich mir heute leisten, und was bleibt vorerst liegen? Weniger schön, wenn die Wahl zwischen „Haben wir nicht“ und „Versuchen Sie es anderswo“ besteht. Besonders wenn man eine Ware braucht und keinen Anlass für einen Spaziergang oder einen Streit."
 NFP57_SUP_LONG:0 "Monat für Monat kommt der Bericht, und die Versorgung gibt noch immer Rätsel auf. Anfangs durfte man hoffen, dass es sich rasch bessern würde. Diese Hoffnung kann inzwischen eine beachtliche Dienstzeit vorweisen. Es wäre schön, wenn sich nun auch Ergebnisse der Regierungsarbeit vorweisen ließen. Bislang vergeht die Zeit, die Hoffnung hält sich, und das Problem rührt sich nicht vom Fleck."
 NFP57_SUP_MILITARY:0 "Die Ware hat auch eine militärische Verwendung. Es geht also nicht nur um den Handel, sondern ebenso um die Versorgung der Armee. Am besten kümmert man sich rechtzeitig darum, solange die Frage noch auf einer Zeitungsseite erörtert werden kann und nicht in aller Eile, weil es plötzlich gilt, die Bajonette zu schärfen. Hoffentlich findet sich bis dahin alles Nötige."
 NFP57_SUP_NO_IMPORT:0 "Zum Zeitpunkt des Berichts sind keine Lieferungen von außen verzeichnet. Ließe sich der Mangel durch Einkäufe im Ausland beheben? Der Gedanke drängt sich auf. Zwischen „Das sollten wir kaufen“ und „Endlich ist es eingetroffen“ liegt meist etwas mehr als ein Vorschlag in der Zeitung. Was genau im Wege steht, wüsste man freilich gern."
 NFP57_SUP_TITLE:0 "Die Nachfrage ist da. Wo bleibt die Ware?"
 NFP57_SUP_TRADE:0 "Lieferungen von außen gibt es, den Mangel haben sie bisher nicht behoben. „Wir werden einführen“ ist offenbar leichter gesagt als die Versorgung gesichert. Auf der Karte nimmt sich eine Handelsroute überzeugend aus. Schön wäre es, wenn an ihrem Ende auch etwas zu bekommen wäre. Wie viel weitere Einkäufe helfen und woher sie kommen könnten, bleibt offen."
 NFP58_GAP_BOTH:0 "Die Ware wird sowohl von der Armee als auch von staatlichen Einrichtungen gebraucht. Hinter der Handelsfrage steht also ein handfestes Staatsinteresse. Es wäre erfreulich, wenn seine Bedeutung dazu beitrüge, die Versorgung rechtzeitig zu klären. Leider bringt ein wichtiges Anliegen allein noch keine neuen Waren hervor."
 NFP58_GAP_CHRONIC:0 "Die Geschichte zieht sich hin. Eigentlich ist rege Nachfrage eine freundliche Einladung an jeden, der etwas herstellen und verkaufen möchte. Nun liegt die Einladung schon eine Weile auf dem Tisch, nur das Angebot kommt nicht hinterher. Fehlt es an Kapazitäten, stockt der Handel, oder liegt es an etwas anderem? Das ist noch offen. Der bloße Wunsch, etwas zu kaufen, reicht für ein Wirtschaftswunder offenbar nicht aus."
 NFP58_GAP_CRITICAL:0 "In unserem Land wurde inzwischen auch ein erheblicher örtlicher Mangel festgestellt. Hinter dem allgemeinen Marktbild steckt damit eine dringlichere Frage. Wie gut ist das Benötigte hier zu bekommen? Wer die Ware jetzt braucht, kann sich mit Betrachtungen über die künftigen Möglichkeiten des Marktes allenfalls die Wartezeit vertreiben."
 NFP58_GAP_END:0 "Was bleibt zum Schluss? Große Nachfrage kann eine gute Nachricht für die Wirtschaft sein. Es gibt jemanden, für den sich die Herstellung lohnt, jemanden, der kauft, und einen Grund, den Betrieb zu erweitern. Nur muss aus der Gelegenheit noch etwas werden. Möglichst bevor das Warten den größten Teil des Einkaufs ausmacht.\n\nAn Kaufwilligen fehlt es nicht. Fehlt nur noch, was sie kaufen wollen."
 NFP58_GAP_FACT:0 "Diesmal geht es um die Ware „[ScriptContainer.MakeScope.Var('nfp46_good').GetGoods.GetNameNoIcon]“. Es wird deutlich mehr nachgefragt als zum Verkauf angeboten, und die Versorgung bereitet nicht erst seit diesem Monatsbericht Schwierigkeiten. Von einer verschwundenen Ware zu sprechen wäre übertrieben. Aber zwischen „Es wird sich schon ein Käufer finden“ und „Der Käufer bekommt auch etwas“ ist ein unangenehmer Abstand entstanden."
 NFP58_GAP_GOVERNMENT:0 "Auch staatliche Einrichtungen brauchen diese Ware. Es handelt sich also nicht allein um die Geschäfte privater Käufer. Der Staatskasse stehen gewiss eigene Mittel zu Gebote. Ein amtlicher Stempel auf einem Schreiben bringt allerdings noch keine neue Lieferung auf den Markt."
 NFP58_GAP_INTRO:0 "Einen Käufer zu finden ist die halbe Miete. Manchmal sogar die schwierigere Hälfte: Man muss erklären, Interesse wecken und jemanden dazu bewegen, sich von seinem Geld zu trennen. Gibt es genug Kaufwillige, möchte man Handel und Land also schon beglückwünschen. Nur sollte man vorher nachsehen, was man ihnen anbieten kann. Und gerade da ist uns etwas dazwischengekommen."
 NFP58_GAP_LONG:0 "Anfangs durfte man hoffen, dass die Händler bald zur Nachfrage aufschließen würden. Wer zahlen will, ist schließlich meist willkommener als jemand, der um Kredit bittet. Inzwischen blättern wir einen Monat nach dem anderen um, und das Problem steht noch immer da. Wer verdienen möchte, hat sich wohl längst gefunden. Jetzt wäre es schön, wenn sich auch die Ware fände."
 NFP58_GAP_MILITARY:0 "Die Ware hat auch eine militärische Verwendung. Man muss also nicht erst auf einen dringenden Bedarf der Truppe warten, um sich mit der Versorgung zu beschäftigen. Wenn es wirklich um Nachschub geht, hätte das Land besser etwas auf Lager als nur eine ganze Sammlung guter Erklärungen."
 NFP58_GAP_NO_IMPORT:0 "Zum Zeitpunkt des Berichts sind keine Lieferungen von außen verzeichnet. Wenn das eigene Angebot nicht ausreicht, ließe sich die Ware vielleicht anderswo einkaufen? Der Gedanke liegt nahe. Eine Schiffsladung kommt von dieser Frage allein natürlich nicht an. Was auf dem Weg tatsächlich im Wege steht, wäre freilich interessant zu erfahren."
 NFP58_GAP_TITLE:0 "Käufer gibt es. Jetzt fehlt die Ware"
 NFP58_GAP_TRADE:0 "Lieferungen von außen gibt es, doch der Abstand zwischen Angebot und Nachfrage bleibt. Gut, dass die Ware bereits ankommt. Nun fragt sich, ob sich mehr beschaffen lässt und was es dafür braucht. Am erfreulichsten ist Handel doch, wenn sein Ergebnis nicht nur auf der Karte zu sehen, sondern auch zu kaufen ist."
 NFP59_REC_BOTH:0 "Die Ware wird von der Armee und von staatlichen Einrichtungen gebraucht. Die gute Nachricht dürfte also an mehr als einer Stelle willkommen sein. Ein günstiger Bericht versorgt freilich noch nicht das ganze Land mit allem Nötigen. Aber es gibt einen Grund, dem Markt etwas gelassener zuzusehen."
 NFP59_REC_BUY:0 "Allerdings gibt es auch weniger Kaufwillige. Die ganze Besserung der Versorgung gutzuschreiben wäre deshalb etwas bequem. Manchmal wird eine Schlange kürzer, weil der Handel besser läuft. Manchmal wird sie kürzer, weil Menschen gehen. Warum sie gegangen sind, wissen wir aus dieser einen Veränderung noch nicht."
 NFP59_REC_DETAILS:0 "$NFP57_SUP_DETAILS$\nAufeinanderfolgende monatliche Beobachtungen ohne das frühere Warnsignal: [ScriptContainer.GetVariableValue('nfp50_supply_good_observations')|0]. Ursprüngliche Warnung: [ScriptContainer.GetVariableValue('nfp46_mode')|0] (1 – unmittelbare Knappheit, 2 – Lücke zwischen Nachfrage und Angebot). Verglichen werden die Aufträge zu Beginn der Beobachtungsreihe und am Tag der Meldung."
 NFP59_REC_END:0 "Was bleibt zum Schluss? Wenn etwas schiefläuft, schreibt die Zeitung deutlich genug darüber. Da wäre es seltsam, eine Besserung mit Schweigen zu begrüßen. Es gibt Anlass zur Freude, und wir freuen uns, ihn vermelden zu können.\n\nWir werden darauf achten, ob die Geschichte wieder in alte Bahnen gerät. Eine gute Nachricht schreibt man doch lieber fort, als sie zu widerrufen."
 NFP59_REC_GAP:0 "Kommen wir auf die Ware „[ScriptContainer.MakeScope.Var('nfp46_good').GetGoods.GetNameNoIcon]“ zurück. Früher wollten deutlich mehr Menschen kaufen, als zum Verkauf angeboten wurde. Nun zeigen zwei Monatsberichte in Folge ein ruhigeres Bild. Angebot und Nachfrage haben sich vielleicht noch nicht die Hand gereicht, aber sie stehen einander immerhin nicht mehr so fern."
 NFP59_REC_GOVERNMENT:0 "Auch staatliche Einrichtungen verwenden die Ware. Die Besserung betrifft also eine Frage, die auch für die Staatskasse Aufmerksamkeit verdient. Es wäre erfreulich, wenn nach dem günstigeren Bericht auch die alltägliche Arbeit etwas leichter von der Hand ginge."
 NFP59_REC_INTRO:0 "Gute Nachrichten kommen manchmal erstaunlich bescheiden daher. Niemand durchschneidet ein Band, hält eine Festrede oder verlangt, dass wir uns den Tag ins Gedächtnis schreiben. Es gibt einfach in einer Geschichte, die uns bisher die Stirn runzeln ließ, endlich Grund für einen anderen Gesichtsausdruck. Unsere frühere Sorge um den Handel hat gerade eine solche Fortsetzung bekommen."
 NFP59_REC_MILITARY:0 "Auch die Armee braucht diese Ware. Das ruhigere Versorgungsbild ist also noch aus einem weiteren Grund erfreulich. Wir werden gewiss nicht sämtliche militärischen Bedürfnisse für gedeckt erklären. Doch wenigstens eine Sorge im Handelsbericht weniger ist schon ein guter Anfang."
 NFP59_REC_NATIVE:0 "Kommen wir auf die Ware „[ScriptContainer.MakeScope.Var('nfp46_good').GetGoods.GetNameNoIcon]“ zurück. Nach unserer Warnung geben zwei Monatsberichte in Folge nicht mehr den früheren Anlass zur Sorge. Auf dem Markt ist keine unmittelbare Knappheit mehr verzeichnet, und das Angebot liegt deutlich näher an der Nachfrage. Niemand kann daraus versprechen, dass jeder Käufer das Benötigte bekommt. Aber statt eines weiteren „Es reicht noch immer nicht“ haben wir endlich eine andere Nachricht."
 NFP59_REC_NO_IMPORT:0 "Gleichzeitig sind zum Zeitpunkt des Berichts keine Lieferungen von außen verzeichnet. Man kann die Besserung also nicht einfach einer Lieferung aus dem Ausland zuschreiben. Was sich innerhalb des Marktes geändert hat, ist eine eigene Frage. Die gute Nachricht wird dadurch nicht schlechter. Nur umso interessanter wäre es, genauer hinzuschauen."
 NFP59_REC_SELL:0 "Ein erfreuliches Detail gibt es: Es wird mehr zum Verkauf angeboten als zu Beginn dieser Geschichte. Man hat also nicht bloß darauf hoffen müssen, dass die Käufer es sich anders überlegen. Im Handel ist mehr Ware zu haben. Wer diese Veränderung wie zustande gebracht hat, bleibt zu klären. Die Veränderung selbst zu vermelden ist schon erfreulich."
 NFP59_REC_TITLE:0 "Grund zum Aufatmen"
 NFP59_REC_TRADE:0 "Die Lieferungen von außen gehen weiter. Schön, sie neben einer guten Nachricht zur Versorgung verzeichnen zu können. Dem Handel das ganze Verdienst zuzuschreiben wäre verfrüht. An ihm vorbeizusehen, als hätte sich alles von selbst ergeben, möchten wir aber auch nicht."
 NFP59_REC_ZERO_END:0 "Warum nicht mehr gekauft wird, gilt es erst herauszufinden. Dies als wirtschaftlichen Sieg zu verbuchen, damit würden wir uns lieber nicht beeilen.\n\nEine verschwundene Warteschlange ist ein schöner Anblick. Wenn man weiß, wo die Käufer geblieben sind."
 NFP59_REC_ZERO_FACT:0 "Bei der Ware „[ScriptContainer.MakeScope.Var('nfp46_good').GetGoods.GetNameNoIcon]“ erscheint das frühere Warnsignal nicht mehr. Im letzten Bericht ist allerdings auch keine Nachfrage verzeichnet. Es ist also still geworden. Ob die Versorgung hinter dieser Stille besser geworden ist, wissen wir noch nicht."
 NFP59_REC_ZERO_INTRO:0 "Es gibt ein einfaches Mittel, einen Mangel nicht mehr zu bemerken: Man hört auf, das Benötigte zu suchen. Für den Käufer ist das allerdings ein zweifelhafter Trost. Wir empfehlen daher, die folgende Nachricht ohne Festmusik zu lesen."
 NFP59_REC_ZERO_TITLE:0 "Keine Nachfrage, kein Problem?"
 NFP60_CONS_DOWN:0 "Der Verbrauch auf dem Markt ist gesunken. Weshalb, ist eine eigene Frage. "
 NFP60_CONS_UP:0 "Der Verbrauch auf dem Markt ist gestiegen. "
 NFP60_EXP_DOWN:0 "Es wird weniger von der Ware ausgeführt. "
 NFP60_EXP_UP:0 "Es wird mehr von der Ware ausgeführt. "
 NFP60_IMP_DOWN:0 "Die Lieferungen von außen auf den Markt sind zurückgegangen. "
 NFP60_IMP_UP:0 "Auf dem Markt trifft mehr Ware von außen ein. "
 NFP60_PARTIAL_SUP:0 "Produktion und Handel haben wir erst im Verlauf dieser Geschichte eingehend zu beobachten begonnen. Hier sind nur die Veränderungen seit diesem Zeitpunkt zu sehen. "
 NFP60_PROD_DOWN:0 "Auf dem Markt wird weniger von der Ware produziert. "
 NFP60_PROD_UP:0 "Auf dem Markt wird mehr von der Ware produziert. "
 NFP60_STATE_DETAILS:0 "[Localize(ScriptContainer.MakeScope.Var('nfp60_previous_metrics').GetFlagName)]\nUrsachenbeobachtung ab Monatsindex [ScriptContainer.GetVariableValue('nfp60_st_start')|0]. Unvollständige Reihe: [ScriptContainer.GetVariableValue('nfp60_st_partial')|0].\nInfrastruktur: [ScriptContainer.GetVariableValue('nfp60_st_cap_before')|2] → [ScriptContainer.GetVariableValue('nfp60_st_cap_after')|2]\nBelastung: [ScriptContainer.GetVariableValue('nfp60_st_usage_before')|2] → [ScriptContainer.GetVariableValue('nfp60_st_usage_after')|2]\nMarktzugang: [Multiply_CFixedPoint(ScriptContainer.GetVariableValue('nfp60_st_access_before'), '(CFixedPoint)100')|1]% → [Multiply_CFixedPoint(ScriptContainer.GetVariableValue('nfp60_st_access_after'), '(CFixedPoint)100')|1]%\nEisenbahnstufen: [ScriptContainer.GetVariableValue('nfp60_st_rail_before')|0] → [ScriptContainer.GetVariableValue('nfp60_st_rail_after')|0]\nHafenstufen: [ScriptContainer.GetVariableValue('nfp60_st_port_before')|0] → [ScriptContainer.GetVariableValue('nfp60_st_port_after')|0]\nStufen des Stadtzentrums: [ScriptContainer.GetVariableValue('nfp60_st_urban_before')|0] → [ScriptContainer.GetVariableValue('nfp60_st_urban_after')|0]\nEreignisse (Zähler jeweils bis 99): Bahnbau=[ScriptContainer.GetVariableValue('nfp60_st_rail_built')|0], Bahnausbau=[ScriptContainer.GetVariableValue('nfp60_st_rail_expanded')|0], Bahnbetriebsweise=[ScriptContainer.GetVariableValue('nfp60_st_rail_pm')|0], Hafenbau=[ScriptContainer.GetVariableValue('nfp60_st_port_built')|0], Hafenausbau=[ScriptContainer.GetVariableValue('nfp60_st_port_expanded')|0], Hafenbetriebsweise=[ScriptContainer.GetVariableValue('nfp60_st_port_pm')|0], Stadtzentrumsbau=[ScriptContainer.GetVariableValue('nfp60_st_urban_built')|0], Stadtzentrumsausbau=[ScriptContainer.GetVariableValue('nfp60_st_urban_expanded')|0], Stadtzentrumsbetriebsweise=[ScriptContainer.GetVariableValue('nfp60_st_urban_pm')|0].\nIndex des ersten und letzten Ereignisses: [ScriptContainer.GetVariableValue('nfp60_st_event_first')|0] / [ScriptContainer.GetVariableValue('nfp60_st_event_last')|0]. Eine verbesserte Stellenbesetzung wird verzeichnet, wenn das beobachtete Gebäude von unter 80% auf mindestens 80% besetzte Stellen steigt. Der genaue Beitrag zur Infrastruktur wurde nicht berechnet."
 NFP60_SUP_CAUSES:0 "[SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp60_supply_known'), '(CFixedPoint)1'), 'NFP60_SUP_COMPONENTS', 'NFP60_SUP_UNKNOWN')][SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp60_s_partial'), '(CFixedPoint)1'), 'NFP60_PARTIAL_SUP', 'NFP50_EMPTY')]"
 NFP60_SUP_COMPONENTS:0 "[SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp60_prod_dir'), '(CFixedPoint)1'), 'NFP60_PROD_UP', SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp60_prod_dir'), '(CFixedPoint)-1'), 'NFP60_PROD_DOWN', 'NFP50_EMPTY'))][SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp60_imp_dir'), '(CFixedPoint)1'), 'NFP60_IMP_UP', SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp60_imp_dir'), '(CFixedPoint)-1'), 'NFP60_IMP_DOWN', 'NFP50_EMPTY'))][SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp60_exp_dir'), '(CFixedPoint)1'), 'NFP60_EXP_UP', SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp60_exp_dir'), '(CFixedPoint)-1'), 'NFP60_EXP_DOWN', 'NFP50_EMPTY'))][SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp60_cons_dir'), '(CFixedPoint)1'), 'NFP60_CONS_UP', SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp60_cons_dir'), '(CFixedPoint)-1'), 'NFP60_CONS_DOWN', 'NFP50_EMPTY'))]Diese Veränderungen fielen in denselben Zeitraum wie unsere Versorgungsgeschichte. Darunter einen einzigen Retter des Marktes herauszugreifen wäre wohl etwas kühn. "
 NFP60_SUP_DETAILS:0 "[Localize(ScriptContainer.MakeScope.Var('nfp60_previous_metrics').GetFlagName)]\nAusführliche Handelsbeobachtung ab Monatsindex [ScriptContainer.GetVariableValue('nfp60_s_start')|0]. Unvollständige Reihe: [ScriptContainer.GetVariableValue('nfp60_s_partial')|0].\nProduktion auf dem Markt: [ScriptContainer.GetVariableValue('nfp60_s_prod_before')|2] → [ScriptContainer.GetVariableValue('nfp60_s_prod_after')|2]\nVerbrauch auf dem Markt: [ScriptContainer.GetVariableValue('nfp60_s_cons_before')|2] → [ScriptContainer.GetVariableValue('nfp60_s_cons_after')|2]\nEinfuhr auf den Markt: [ScriptContainer.GetVariableValue('nfp60_s_imp_before')|2] → [ScriptContainer.GetVariableValue('nfp60_s_imp_after')|2]\nAusfuhr aus dem Markt: [ScriptContainer.GetVariableValue('nfp60_s_exp_before')|2] → [ScriptContainer.GetVariableValue('nfp60_s_exp_after')|2]\nPreis: [ScriptContainer.GetVariableValue('nfp60_s_price_before')|2] → [ScriptContainer.GetVariableValue('nfp60_s_price_after')|2]. Dies sind Mengen des gesamten Marktes, nicht unbedingt die inländische Produktion des Leserlandes."
 NFP60_SUP_UNKNOWN:0 "Der frühere Anlass zur Sorge ist verschwunden. Unsere ausführlichen Angaben zu Produktion und Handel erklären aber noch nicht, wodurch das gelungen ist. "
 NFP61_CAP_DOWN:0 "Interessant ist, dass das Netz in dieser Zeit keineswegs leistungsfähiger geworden ist. Im Gegenteil, seine Kapazität nahm ab. Allein im Ausbau der Infrastruktur lässt sich die Erklärung für die Wende also kaum finden. "
 NFP61_CAP_UP:0 "Im Beobachtungszeitraum hat die Kapazität des Netzes zugenommen. Die Wirtschaft hat mehr Platz bekommen. Nun wäre es schön, wenn sie ihn nicht schneller belegt, als wir uns darüber freuen können. "
 NFP61_CAUSES:0 "[SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp60_components_known'), '(CFixedPoint)1'), 'NFP61_COMPONENTS', 'NFP61_UNKNOWN')][SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp60_st_partial'), '(CFixedPoint)1'), 'NFP61_PARTIAL', 'NFP50_EMPTY')]"
 NFP61_COMPONENTS:0 "[SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp60_cap_dir'), '(CFixedPoint)1'), 'NFP61_CAP_UP', SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp60_cap_dir'), '(CFixedPoint)-1'), 'NFP61_CAP_DOWN', 'NFP50_EMPTY'))][SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp60_usage_dir'), '(CFixedPoint)1'), 'NFP61_LOAD_UP', SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp60_usage_dir'), '(CFixedPoint)-1'), 'NFP61_LOAD_DOWN', 'NFP50_EMPTY'))]"
 NFP61_END:0 "Was bleibt zum Schluss? Aus der Region ist eine gute Nachricht gekommen. Wir wollen nicht aus alter Gewohnheit einen Haken suchen, bloß damit wir noch etwas zu klagen haben. Die Wirtschaft hat es leichter. Darüber darf man sich freuen.\n\nNun wird sich zeigen, wie lange die Besserung trägt. Gern würden wir wieder über die Region berichten, weil sie etwas herstellt, und nicht, weil sie wieder etwas nicht ausgehalten hat.\n\n„Platz ist in der kleinsten Hütte“, heißt es. Ein wenig mehr davon ist trotzdem angenehmer."
 NFP61_EVENTS:0 "[SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp60_rail_work'), '(CFixedPoint)1'), 'NFP61_RAIL_WORK', 'NFP50_EMPTY')][SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp60_port_work'), '(CFixedPoint)1'), 'NFP61_PORT_WORK', 'NFP50_EMPTY')][SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp60_urban_work'), '(CFixedPoint)1'), 'NFP61_URBAN_WORK', 'NFP50_EMPTY')][SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp60_rail_pm_seen'), '(CFixedPoint)1'), 'NFP61_RAIL_PM', 'NFP50_EMPTY')][SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp60_port_pm_seen'), '(CFixedPoint)1'), 'NFP61_PORT_PM', 'NFP50_EMPTY')][SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp60_urban_pm_seen'), '(CFixedPoint)1'), 'NFP61_URBAN_PM', 'NFP50_EMPTY')]$NFP61_PM_END_SELECT$[SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp60_st_rail_staffup'), '(CFixedPoint)1'), 'NFP61_RAIL_STAFF', 'NFP50_EMPTY')][SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp60_st_port_staffup'), '(CFixedPoint)1'), 'NFP61_PORT_STAFF', 'NFP50_EMPTY')]$NFP61_STAFF_END_SELECT$Verändert hat sich also einiges. Einer einzigen dieser Veränderungen den ganzen Erfolg zuzuschreiben wäre verfrüht. Zur selben Zeit geschehen und ein Problem lösen sind doch zwei verschiedene Dinge."
 NFP61_FACT:0 "Es geht um die Region [SelectLocalization(And(ScriptContainer.MakeScope.Var('nfp20_problem_state').IsSet, ScriptContainer.MakeScope.Var('nfp20_problem_state').GetState.IsValid), 'NFP40_STATE_LINK', 'NFP40_REGION_FALLBACK')]. Wir hatten berichtet, dass ihre Infrastruktur mehr tragen sollte, als sie zu tragen vermochte. Jetzt zeigen die Meldungen: Die vorhandenen Kapazitäten reichen. Ein Problem, das bei uns schon seinen Platz in der Zeitung hatte, hat ihn endlich einer guten Nachricht überlassen!"
 NFP61_INTRO:0 "An Gutes gewöhnt man sich rasch. Etwa daran, dass die Wirtschaft läuft und man nicht nach jedem neuen Betrieb fragen muss, ob unsere Infrastruktur das alles noch aushält. An Schlechtes kann man sich freilich ebenso gewöhnen. Das Netz ist überlastet, die Geschäfte gehen ihren Gang, der nächste Bericht sieht aus wie der vorige ... Diesmal aber sieht er anders aus. Und zwar besser."
 NFP61_LOAD_DOWN:0 "Zugleich ist die Belastung des Netzes gesunken. Gegen Gedränge gibt es ja zwei Mittel: mehr Platz schaffen oder weniger hineindrängen. Auch das zweite hilft. Weshalb es nun weniger zu bewältigen gibt, ist damit allerdings noch nicht erklärt. "
 NFP61_LOAD_UP:0 "Zugleich hat die Belastung sogar zugenommen. Die Wirtschaft hat sich also nicht einfach dadurch Platz verschafft, dass sie weniger vom Netz braucht. Es gibt mehr Arbeit, und die frühere Überlastung ist dennoch verschwunden. "
 NFP61_PARTIAL:0 "Ausführliche Nachrichten liegen uns allerdings nur über einen Teil dieser Geschichte vor. Ihr Anfang liegt vor unserer Beobachtung. Mit einer abschließenden Erklärung wollen wir uns deshalb nicht beeilen. "
 NFP61_PM_END:0 "Für eine Veränderung braucht es nicht immer neue Bauten. Manchmal lohnt ein Blick darauf, wie das Vorhandene genutzt wird. "
 NFP61_PM_END_SELECT:0 "[SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp60_rail_pm_seen'), '(CFixedPoint)1'), 'NFP61_PM_END', 'NFP61_PORT_PM_END_SELECT')]"
 NFP61_PORT_PM:0 "Im Hafen wurde die Arbeitsweise geändert. "
 NFP61_PORT_PM_END_SELECT:0 "[SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp60_port_pm_seen'), '(CFixedPoint)1'), 'NFP61_PM_END', 'NFP61_URBAN_PM_END_SELECT')]"
 NFP61_PORT_STAFF:0 "Im beobachteten Hafen ist inzwischen ein größerer Teil der Stellen besetzt. "
 NFP61_PORT_STAFF_END_SELECT:0 "[SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp60_st_port_staffup'), '(CFixedPoint)1'), 'NFP61_STAFF_END', 'NFP50_EMPTY')]"
 NFP61_PORT_WORK:0 "Am Hafen wurden Bauarbeiten abgeschlossen. Für eine Region, deren Bedarf die eigenen Möglichkeiten überstieg, verdient das Beachtung. "
 NFP61_RAIL_PM:0 "Bei der Eisenbahn wurde die Arbeitsweise geändert. "
 NFP61_RAIL_STAFF:0 "Bei der beobachteten Eisenbahn ist inzwischen ein größerer Teil der Stellen besetzt. "
 NFP61_RAIL_WORK:0 "Während dieser Zeit wurde in der Region eine Eisenbahn fertiggestellt oder ausgebaut. Wer hier von Schienen gesprochen hat, kann immerhin auf Schienen zeigen. "
 NFP61_REMAINING:0 "Eine andere Schwierigkeit bleibt allerdings bestehen. Die Region ist noch nicht vollständig an den gemeinsamen Markt angebunden. Die Infrastruktur bewältigt die gegenwärtige Last, aber deshalb sind noch nicht alle Handelswege offen. Ein Problem liegt hinter uns. Das zweite sollte in den Glückwünschen nicht untergehen."
 NFP61_STAFF_END:0 "Gebaut ist erst die halbe Sache. Jemand muss dort auch arbeiten. "
 NFP61_STAFF_END_SELECT:0 "[SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp60_st_rail_staffup'), '(CFixedPoint)1'), 'NFP61_STAFF_END', 'NFP61_PORT_STAFF_END_SELECT')]"
 NFP61_TITLE:0 "Es war eng. Nun lässt sich wieder atmen"
 NFP61_UNKNOWN:0 "Die erfreuliche Veränderung ist sichtbar. Erklären lässt sie sich mit den vorliegenden Angaben noch nicht. Wie bequem wäre es, sofort einen Schuldigen für die früheren Schwierigkeiten und einen Urheber des jetzigen Erfolgs zu benennen. Nur ist Bequemlichkeit kein Beweis. "
 NFP61_URBAN_PM:0 "In der städtischen Wirtschaft wurde die Arbeitsweise geändert. "
 NFP61_URBAN_PM_END_SELECT:0 "[SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp60_urban_pm_seen'), '(CFixedPoint)1'), 'NFP61_PM_END', 'NFP50_EMPTY')]"
 NFP61_URBAN_WORK:0 "Auch die städtische Wirtschaft wurde ausgebaut. Große Verkehrswege fallen auf der Karte ins Auge. Die alltägliche Arbeit der Region erschöpft sich aber nicht im Fernverkehr. "
 NFP62_CAP_DOWN:0 "Die Kapazität der Infrastruktur hat sich dabei verringert. Die Erklärung „Es ist einfach mehr Platz“ greift hier also nicht. Die Marktanbindung hat sich gebessert, doch die Geschichte ist offenbar verwickelter als die eines gelungenen Bauvorhabens. "
 NFP62_CAP_UP:0 "Inzwischen kann die Infrastruktur der Region mehr bewältigen. Ein erfreuliches Zusammentreffen: mehr Kapazität und eine bessere Marktanbindung. Den ganzen Erfolg allein dem ersten Umstand zuzuschreiben wäre voreilig. Ihn zu übergehen wäre allerdings ebenso merkwürdig. "
 NFP62_CAUSES:0 "[SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp60_components_known'), '(CFixedPoint)1'), 'NFP62_COMPONENTS', 'NFP62_UNKNOWN')][SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp60_st_partial'), '(CFixedPoint)1'), 'NFP62_PARTIAL', 'NFP50_EMPTY')]"
 NFP62_COMPONENTS:0 "[SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp60_cap_dir'), '(CFixedPoint)1'), 'NFP62_CAP_UP', SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp60_cap_dir'), '(CFixedPoint)-1'), 'NFP62_CAP_DOWN', 'NFP50_EMPTY'))][SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp60_usage_dir'), '(CFixedPoint)1'), 'NFP62_LOAD_UP', SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp60_usage_dir'), '(CFixedPoint)-1'), 'NFP62_LOAD_DOWN', 'NFP50_EMPTY'))]"
 NFP62_END:0 "Was bleibt zum Schluss? Früher war die Region auf der Karte unsere eigene, und doch schien der gemeinsame Markt mitunter weit entfernt. Jetzt stehen ihm weniger Hindernisse im Weg. Für die Wirtschaft des Landes ist das erfreulich. Schön wäre es, wenn auch diejenigen etwas davon merken, die einfach nur einkaufen gehen.\n\nWir bleiben an der Geschichte. Über den gemeinsamen Markt redet es sich doch angenehmer beim Einkauf als angesichts einer Erklärung, warum er schon wieder nicht zu erreichen ist."
 NFP62_EVENTS:0 "[SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp60_rail_work'), '(CFixedPoint)1'), 'NFP62_RAIL_WORK', 'NFP50_EMPTY')][SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp60_port_work'), '(CFixedPoint)1'), 'NFP62_PORT_WORK', 'NFP50_EMPTY')][SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp60_urban_work'), '(CFixedPoint)1'), 'NFP62_URBAN_WORK', 'NFP50_EMPTY')][SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp60_rail_pm_seen'), '(CFixedPoint)1'), 'NFP62_RAIL_PM', 'NFP50_EMPTY')][SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp60_port_pm_seen'), '(CFixedPoint)1'), 'NFP62_PORT_PM', 'NFP50_EMPTY')][SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp60_urban_pm_seen'), '(CFixedPoint)1'), 'NFP62_URBAN_PM', 'NFP50_EMPTY')]$NFP62_PM_END_SELECT$[SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp60_st_rail_staffup'), '(CFixedPoint)1'), 'NFP62_RAIL_STAFF', 'NFP50_EMPTY')][SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp60_st_port_staffup'), '(CFixedPoint)1'), 'NFP62_PORT_STAFF', 'NFP50_EMPTY')]$NFP62_STAFF_END_SELECT$All das geschah, während wir die Region beobachteten. Welche Veränderung am meisten geholfen hat, steht noch nicht fest. Zeitliches Zusammentreffen ist ein Anlass zum Nachsehen und noch keine fertige Liste für die Ordensverleihung."
 NFP62_FACT:0 "Es geht um die Region [SelectLocalization(And(ScriptContainer.MakeScope.Var('nfp20_problem_state').IsSet, ScriptContainer.MakeScope.Var('nfp20_problem_state').GetState.IsValid), 'NFP40_STATE_LINK', 'NFP40_REGION_FALLBACK')]. Die jüngsten Berichte zeigen, dass die früheren Schwierigkeiten beim Zugang zum gemeinsamen Markt nachlassen. Damit sind weder niedrige Preise noch eine reiche Auswahl in jedem Laden versprochen. Aber die Region kann die Wirtschaft des Landes jetzt viel besser nutzen. Das Wort „gemeinsam“ ist seiner Bedeutung wieder ein wenig näher gerückt."
 NFP62_INTRO:0 "Zwischen „im Land vorhanden“ und „bei uns erhältlich“ liegt manchmal ein allzu großer Abstand. In Meilen lässt er sich nicht immer messen. Auf der Karte liegt alles beieinander: eigene Grenzen, gemeinsame Wirtschaft – nur in vollem Umfang nutzen lässt sie sich nicht. Von diesem Ärger hatten wir schon berichtet. Nun haben wir einen Grund, in besserer Stimmung darauf zurückzukommen."
 NFP62_LOAD_DOWN:0 "Das Netz wird weniger belastet. Vielleicht fallen der Region Transporte und andere wirtschaftliche Aufgaben deshalb leichter. Warum die Belastung abgenommen hat, ist jedoch eine eigene Frage. Einen uneingeschränkten Sieg würden wir daraus noch nicht machen. "
 NFP62_LOAD_UP:0 "Die Belastung des Netzes ist dagegen gestiegen. Der Marktzugang hat sich also nicht etwa vor dem Hintergrund gesunkener wirtschaftlicher Bedürfnisse verbessert. Es gibt mehr zu tun, und das frühere Problem ist dennoch zurückgegangen. Umso interessanter ist die Frage, wie das gelungen ist. "
 NFP62_PARTIAL:0 "Eingehend verfolgen wir die Veränderungen allerdings erst seit dem Verlauf dieser Geschichte. Einen Teil des Weges hat die Region ohne unsere Aufzeichnungen zurückgelegt. Den ganzen Erfolg nur mit dem später Beobachteten erklären zu wollen wäre deshalb etwas zu bequem. "
 NFP62_PM_END:0 "Auch ohne Neubau kann sich etwas ändern. Es zählt schließlich nicht nur, was gebaut wurde, sondern auch, wie es genutzt wird. "
 NFP62_PM_END_SELECT:0 "[SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp60_rail_pm_seen'), '(CFixedPoint)1'), 'NFP62_PM_END', 'NFP62_PORT_PM_END_SELECT')]"
 NFP62_PORT_PM:0 "Im Hafen wurde die Arbeitsweise geändert. "
 NFP62_PORT_PM_END_SELECT:0 "[SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp60_port_pm_seen'), '(CFixedPoint)1'), 'NFP62_PM_END', 'NFP62_URBAN_PM_END_SELECT')]"
 NFP62_PORT_STAFF:0 "Im beobachteten Hafen ist inzwischen ein größerer Teil der Stellen besetzt. "
 NFP62_PORT_STAFF_END_SELECT:0 "[SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp60_st_port_staffup'), '(CFixedPoint)1'), 'NFP62_STAFF_END', 'NFP50_EMPTY')]"
 NFP62_PORT_WORK:0 "Im Hafen wurden Bauarbeiten abgeschlossen. Für die Verbindung der Region mit dem übrigen Land verdient das Beachtung. Ein fertiggestellter Hafen erzählt allerdings noch nicht die ganze Geschichte des Verkehrs. "
 NFP62_RAIL_PM:0 "Bei der Eisenbahn wurde die Arbeitsweise geändert. "
 NFP62_RAIL_STAFF:0 "Bei der beobachteten Eisenbahn ist inzwischen ein größerer Teil der Stellen besetzt. "
 NFP62_RAIL_WORK:0 "Während unserer Beobachtung wurde in der Region eine Eisenbahn fertiggestellt oder erweitert. Die frühere Frage nach der Anbindung an die gemeinsame Wirtschaft hat damit einen greifbaren Begleiter bekommen: neue Möglichkeiten auf der Schiene. "
 NFP62_REMAINING:0 "Eine Schwierigkeit bleibt jedoch: Die Infrastruktur der Region ist noch immer überlastet. Der Marktzugang hat sich verbessert, innerhalb des Netzes ist es aber noch nicht geräumiger geworden. Das schmälert die gute Nachricht nicht. Nur sollten wir das benachbarte Problem nicht mit ihr zu den Akten legen."
 NFP62_STAFF_END:0 "Anlagen haben noch nicht gelernt, sich selbst zu unterhalten. Die Menschen sind in dieser Geschichte also ein ziemlich wesentlicher Umstand. "
 NFP62_STAFF_END_SELECT:0 "[SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp60_st_rail_staffup'), '(CFixedPoint)1'), 'NFP62_STAFF_END', 'NFP62_PORT_STAFF_END_SELECT')]"
 NFP62_TITLE:0 "Die Region gehört zu uns. Der Markt nun auch wieder"
 NFP62_UNKNOWN:0 "Die gespeicherten Angaben zu Infrastruktur und Belastung liefern bisher keine schlüssige Erklärung. Die gute Veränderung ist da. Wem dafür zu danken ist, wissen wir noch nicht. Wir wollen den Sieger nicht bestimmen, bevor wir den Wettbewerb verstanden haben. "
 NFP62_URBAN_PM:0 "In der städtischen Wirtschaft wurde die Arbeitsweise geändert. "
 NFP62_URBAN_PM_END_SELECT:0 "[SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp60_urban_pm_seen'), '(CFixedPoint)1'), 'NFP62_PM_END', 'NFP50_EMPTY')]"
 NFP62_URBAN_WORK:0 "Auch die städtische Wirtschaft wurde erweitert. Sie sieht selten so eindrucksvoll aus wie eine Lokomotive oder ein großes Schiff, doch die Region lebt nicht allein vom Fernverkehr. "
 NFP63_ALLY:0 "Es geht um unseren Verbündeten. Seine Möglichkeiten verdienen Aufmerksamkeit: Gemeinsame Vereinbarungen sind mehr wert, wenn wir verstehen, was beim Partner geschieht."
 NFP63_ATT_1:0 " Diese Regierung begegnet uns feindselig. Wir verfolgen die Ereignisse daher ohne Illusionen: Eine höfliche Erklärung ist nicht unbedingt zu erwarten."
 NFP63_ATT_10:0 " Dieses Untertanenland ist uns treu. Umso weniger Grund, seine eigenen Sorgen für unbedeutend zu halten."
 NFP63_ATT_11:0 " Dieses Untertanenland will sich unserer Herrschaft entziehen. Seine Nachrichten verdienen daher genaueres Lesen: Vertraute Versicherungen sind kein verlässlicher Wegweiser mehr."
 NFP63_ATT_2:0 " Ihre Haltung uns gegenüber ist kriegerisch. Über fremde Angelegenheiten zu spotten ist leichter, als mit ihren Folgen an der eigenen Grenze umzugehen."
 NFP63_ATT_3:0 " Man möchte unser Land unter die eigene Kontrolle bringen. Nachbarschaftliche Fürsorge hat viele Formen; bei dieser lohnt ein Blick aufs Kleingedruckte."
 NFP63_ATT_4:0 " Man betrachtet uns mit Vorsicht. Gegenseitigen Verdacht sollte man an Ereignissen prüfen, statt ihn als feststehenden Plan auszugeben."
 NFP63_ATT_5:0 " Derzeit zeigt man wenig besonderes Interesse an unserem Land. Das macht die Nachrichten nicht bedeutungslos; hinter jeder Zeile muss sich aber auch keine Botschaft an uns verbergen."
 NFP63_ATT_6:0 " Man ist zur Aussöhnung geneigt. Eine willkommene Gelegenheit, Ereignisse zu verfolgen, ohne jedes Mal nach einer diplomatischen Spitze zu greifen."
 NFP63_ATT_7:0 " Diese Regierung ist zur Zusammenarbeit mit uns geneigt. Schön wäre es, hinter dem guten Willen gemeinsame Vorhaben zu finden."
 NFP63_ATT_8:0 " Man ist uns wohlgesinnt. Auf den gewohnten Seitenhieb können wir verzichten: Die Tatsachen verlieren dadurch nichts von ihrer Schärfe."
 NFP63_ATT_9:0 " Man möchte als unser Beschützer auftreten. Eine angenehme Haltung, wobei Fürsorge und Kontrolle weiterhin zu unterscheiden sind."
 NFP63_BAND_NEG1:0 "Die Beziehungen lassen zu wünschen übrig. Ein Witz kann die Lektüre beleben, das Geschehen erklärt er nicht."
 NFP63_BAND_NEG2:0 "Die Beziehungen sind kühl. Warme Worte für diese Nachricht sind rar, Gründe zum genauen Hinsehen nicht."
 NFP63_BAND_NEG3:0 "Zwischen unseren Ländern herrscht offene Feindschaft. Komplimente wird kaum jemand von dieser Zeitung erwarten. Fehlende Sympathie ändert jedoch keine Tatsachen."
 NFP63_BAND_POS1:0 "Die Beziehungen erlauben ein ruhiges Gespräch. Eine Änderung im Ausland lässt sich betrachten, ohne zuerst einen Haken vermuten zu müssen."
 NFP63_BAND_POS2:0 "Die Beziehungen zwischen unseren Ländern sind gut. Nachrichten von dort mit freundlichem Interesse zu lesen ist angenehm; die Prüfung der Ereignisse ersetzt Freundschaft nicht."
 NFP63_BAND_POS3:0 "Die Beziehungen zwischen unseren Ländern sind besonders herzlich. Hoffentlich finden sich weitere Anlässe für ein gutes Wort. Und sind die Nachrichten unerfreulich, verdienen sie umso mehr Aufmerksamkeit."
 NFP63_BAND_ZERO:0 "Die Beziehungen zeigen weder besondere Wärme noch offene Feindschaft. Wir können die Nachricht selbst betrachten, ohne mit einem diplomatischen Streit zu beginnen."
 NFP63_BLOC:0 "Dieses Land gehört zu unserem Machtblock. Solche Änderungen betreffen unser gemeinsames Umfeld, selbst wenn die Ereignisse weit entfernt sind."
 NFP63_CLOSING:0 "$NFP63_EDITORIAL$\n\n[Localize(ScriptContainer.MakeScope.Var('nfp63_closing').GetFlagName)]"
 NFP63_DETAILS:0 "Redaktionelle Auswahl: [SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp63_reason'), '(CFixedPoint)0'), 'NFP63_REASON_0', 'NFP50_EMPTY')][SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp63_reason'), '(CFixedPoint)1'), 'NFP63_REASON_1', 'NFP50_EMPTY')][SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp63_reason'), '(CFixedPoint)2'), 'NFP63_REASON_2', 'NFP50_EMPTY')][SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp63_reason'), '(CFixedPoint)3'), 'NFP63_REASON_3', 'NFP50_EMPTY')][SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp63_reason'), '(CFixedPoint)4'), 'NFP63_REASON_4', 'NFP50_EMPTY')][SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp63_reason'), '(CFixedPoint)5'), 'NFP63_REASON_5', 'NFP50_EMPTY')][SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp63_reason'), '(CFixedPoint)6'), 'NFP63_REASON_6', 'NFP50_EMPTY')][SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp63_reason'), '(CFixedPoint)7'), 'NFP63_REASON_7', 'NFP50_EMPTY')].\nRedaktionelle Stufen: Leser [ScriptContainer.GetVariableValue('nfp63_reader_tier')|0], Quelle [ScriptContainer.GetVariableValue('nfp63_source_tier')|0], andere Partei [ScriptContainer.GetVariableValue('nfp63_second_tier')|0]. Prioritätsbonus [ScriptContainer.GetVariableValue('nfp63_bonus')|0]; Technologieneuheit [ScriptContainer.GetVariableValue('nfp63_novel')|0]; Gesetzesunterschied [ScriptContainer.GetVariableValue('nfp63_different_law')|0].\nVerbindung zur Quelle [ScriptContainer.GetVariableValue('nfp63_relation')|0], zur anderen Partei [ScriptContainer.GetVariableValue('nfp63_second_relation')|0]; Beziehungen [ScriptContainer.GetVariableValue('nfp63_friend')|0]. Auswahlgrund und Ton wurden bei Eingang gespeichert; das Archiv liest die aktuelle Diplomatie nicht erneut.\nBeziehungen der Quelle zum Leser als Zahlenwert: [ScriptContainer.GetVariableValue('nfp63_relation_value')|0], Stufe [ScriptContainer.GetVariableValue('nfp63_relation_band')|0]; KI-Haltung [ScriptContainer.GetVariableValue('nfp63_attitude')|0]. Andere Partei: Beziehungen [ScriptContainer.GetVariableValue('nfp63_secondary_relation_value')|0], Stufe [ScriptContainer.GetVariableValue('nfp63_secondary_relation_band')|0], KI-Haltung [ScriptContainer.GetVariableValue('nfp63_secondary_attitude')|0]. Haltung null bedeutet, dass keine verifizierte Aufnahme vorliegt, nicht neutrale Absichten des Spielers."
