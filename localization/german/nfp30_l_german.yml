 NFP63_NEIGHBOR:0 "Die Ereignisse spielen sich in einem Nachbarland ab. Eine Grenze ist auf der Karte leicht gezogen; die Folgen fremder Veränderungen halten sich nicht immer daran."
 NFP63_NEUTRAL:0 "Dieses Land verdient Aufmerksamkeit ohne voreiligen Beifall oder ebenso voreiligen Spott. Eine Änderung im Ausland zählt zuerst durch das, was sie verändert."
 NFP63_OVERLORD:0 "Die Nachricht kommt aus dem Land, von dem unser eigenes abhängt. Sie bloß als ausländische Kuriosität zu behandeln wäre recht sorglos."
 NFP63_REASON_0:0 "älterer oder besonderer Zustellungsweg"
