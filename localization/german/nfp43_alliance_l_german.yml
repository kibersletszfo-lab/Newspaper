l_german:
 NFP43_GAINED:0 "Unser Land hat eine neue Bündnisverbindung zu [ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName]."
 NFP43_GAINED_ALLIANCE_1_BODY:0 "Unser Kreis der Verbündeten hat sich verändert. Die jüngste Beobachtung bestätigt ein Bündnis mit [ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName].\n\nFür unsere Diplomatie ist das wichtig. Umfang der Vereinbarung und Teilnahme an einem bestimmten Konflikt müssen anhand der aktuellen Bündnisbedingungen beurteilt werden."
 NFP43_GAINED_ALLIANCE_1_LEAD:0 "Ein förmliches Bündnis mit [ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName] ist nun in Kraft."
 NFP43_GAINED_ALLIANCE_1_TITLE:0 "Unser Land hat einen neuen Verbündeten"
 NFP43_GAINED_ALLIANCE_2_BODY:0 "Dieses Bündnis wurde zuvor nicht beobachtet; nun gilt es. [ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName] gehört zu unseren förmlichen Verbündeten.\n\nDie Zeitung verzeichnet eine Änderung diplomatischer Beziehungen. Sie ersetzt die tatsächlichen Pflichten nicht durch ein Versprechen bedingungsloser Militärhilfe."
 NFP43_GAINED_ALLIANCE_2_LEAD:0 "Die Redaktion verzeichnet ein neues Bündnis zwischen unserem Land und [ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName]."
 NFP43_GAINED_ALLIANCE_2_TITLE:0 "Unser Bündnisnetz wächst"
 NFP43_GAINED_BLOC_1_BODY:0 "Unser gemeinsames diplomatisches Umfeld hat sich verändert: Die jüngste Beobachtung bestätigt, dass wir und [ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName] demselben Machtblock angehören.\n\nGemeldet wird die Blockzugehörigkeit. Sie bedeutet allein weder ein bilaterales Bündnis noch die Pflicht, an jedem Krieg des Partners teilzunehmen."
 NFP43_GAINED_BLOC_1_LEAD:0 "[ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName] gehört nun demselben Machtblock wie unser Land an."
 NFP43_GAINED_BLOC_1_TITLE:0 "Ein neuer Partner in unserem Machtblock"
 NFP43_GAINED_BLOC_2_BODY:0 "Zwischen den Beobachtungen entstand eine neue gemeinsame Verbindung: Unser Land und [ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName] gehören demselben Block an. Die Zugehörigkeit kann sich auf jeder Seite geändert haben.\n\nDie Zeitung verzeichnet die neue Beziehung, ohne sie einer unbestätigten Einladung oder einem Militärhilfevertrag zuzuschreiben."
 NFP43_GAINED_BLOC_2_LEAD:0 "Wir und [ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName] gehören nun demselben Machtblock an."
 NFP43_GAINED_BLOC_2_TITLE:0 "Unser Kreis der Blockpartner hat sich verändert"
 NFP43_GAINED_METRICS:0 "Neue strategische Verbindung unseres Landes zwischen Beobachtungen. Typ: [SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp20_extra'), '(CFixedPoint)1'), 'NFP43_KIND_ALLIANCE', 'NFP43_KIND_BLOC')]. Die erste Aufnahme erfolgt ohne Meldung. Geprüft wird wöchentlich und vor dem Druck; kurzlebige Änderungen dazwischen können unbemerkt bleiben. Artikelmonat ist der Erkennungsmonat, kein belegtes Unterzeichnungsdatum. Priorität 160; nur für heimische Leser, ohne ausländischen Geografiefilter."
 NFP43_KIND_ALLIANCE:0 "förmliches Bündnis"
 NFP43_KIND_BLOC:0 "gemeinsame Machtblockzugehörigkeit"
 NFP43_LOST:0 "Unsere frühere Bündnisverbindung mit [ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName] wird nicht mehr beobachtet."
 NFP43_LOST_ALLIANCE_1_BODY:0 "Unsere Liste der Verbündeten hat sich geändert: Das zuvor geltende Bündnis mit [ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName] fehlt in der jüngsten Beobachtung.\n\nAnlass, Pläne zu überdenken, die auf der früheren Beziehung beruhten. Wer die Verbindung beendete und warum, hat die Redaktion nicht festgestellt."
 NFP43_LOST_ALLIANCE_1_LEAD:0 "[ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName] ist uns nicht mehr durch ein beobachtetes förmliches Bündnis verbunden."
 NFP43_LOST_ALLIANCE_1_TITLE:0 "Das frühere Bündnis gilt nicht mehr"
 NFP43_LOST_ALLIANCE_2_BODY:0 "Unser früheres Bündnis mit [ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName] fehlt in der jüngsten Aufnahme der Beziehungen.\n\nDie Umstände müssen gesondert untersucht werden: Ohne Belege lassen sich das Verschwinden eines Landes und ein diplomatischer Bruch nicht als dieselbe Ursache behandeln."
 NFP43_LOST_ALLIANCE_2_LEAD:0 "Das förmliche Bündnis mit [ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName] wird nicht mehr beobachtet."
 NFP43_LOST_ALLIANCE_2_TITLE:0 "Eine Lücke im Bündnisnetz"
 NFP43_LOST_BLOC_1_BODY:0 "Früher teilten wir einen Machtblock mit [ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName]. Die jüngste Aufnahme bestätigt diese Verbindung nicht mehr.\n\nGeändert haben kann sich die Stellung jedes Landes oder der Block selbst. Die Redaktion verzeichnet das Ergebnis, ohne unbelegt zu behaupten, wer austrat."
 NFP43_LOST_BLOC_1_LEAD:0 "[ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName] wird nicht mehr im selben Machtblock wie unser Land beobachtet."
 NFP43_LOST_BLOC_1_TITLE:0 "Die gemeinsame Blockzugehörigkeit ist beendet"
 NFP43_LOST_BLOC_2_BODY:0 "Unser Land und [ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName] werden nicht mehr als Mitglieder desselben Blocks beobachtet. Diese Änderung betrifft unser unmittelbares diplomatisches Umfeld.\n\nUrsache und Initiator wurden hier nicht festgestellt. Diese Meldung widerspricht keinem gesondert bestehenden bilateralen Bündnis."
 NFP43_LOST_BLOC_2_LEAD:0 "Unsere frühere Blockverbindung mit [ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName] wird nicht mehr bestätigt."
 NFP43_LOST_BLOC_2_TITLE:0 "Eine Änderung in unserem gemeinsamen Block"
 NFP43_LOST_METRICS:0 "Eine strategische Verbindung unseres Landes wird nicht mehr beobachtet. Typ: [SelectLocalization(EqualTo_CFixedPoint(ScriptContainer.GetVariableValue('nfp20_extra'), '(CFixedPoint)1'), 'NFP43_KIND_ALLIANCE', 'NFP43_KIND_BLOC')]. Geprüft wird wöchentlich und vor dem Druck. Verantwortliche Seite und genaues Datum sind nicht festgestellt. Auch das Verschwinden eines Landes beendet die Verbindung. Priorität 170; nur für heimische Leser."
 NFP43_RELATION:0 "Bündnisverbindung unseres Landes"
 NFP43_WAR:0 "Der Krieg hat begonnen: [ScriptContainer.MakeScope.Var('nfp20_extra_detail').GetCountryDefinition.GetName] ist die angreifende, [ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName] die verteidigende Seite."
 NFP43_WAR_ALLIANCE_1_BODY:0 "Der Krieg hat begonnen: [ScriptContainer.MakeScope.Var('nfp20_extra_detail').GetCountryDefinition.GetName] ist Initiator, [ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName] Ziel des diplomatischen Spiels. Bei Kriegsausbruch war unser Land förmlich mit der verteidigenden Macht verbündet.\n\nDie Redaktion hebt diese Nachricht hervor. Ein Bündnis allein erlaubt nicht die Meldung, unser Land sei bereits in den Konflikt eingetreten."
 NFP43_WAR_ALLIANCE_1_LEAD:0 "[ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName] ist zur verteidigenden Seite eines neuen Krieges geworden."
 NFP43_WAR_ALLIANCE_1_TITLE:0 "Unser Verbündeter wird angegriffen"
 NFP43_WAR_ALLIANCE_2_BODY:0 "Initiator des neuen Krieges ist [ScriptContainer.MakeScope.Var('nfp20_extra_detail').GetCountryDefinition.GetName]; die verteidigende Seite ist [ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName]. Unsere Bündnisverbindung mit dem Ziel war zum Ereigniszeitpunkt bestätigt.\n\nDas betrifft unsere diplomatische Stellung unmittelbar. Teilnahme und Erfüllung von Pflichten ergeben sich nicht aus einer einzigen Meldung über den Kriegsbeginn."
 NFP43_WAR_ALLIANCE_2_LEAD:0 "Gegen [ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName], mit dem unser Bündnis gilt, hat ein Krieg begonnen."
 NFP43_WAR_ALLIANCE_2_TITLE:0 "Der Krieg erreicht unseren Verbündeten"
 NFP43_WAR_BLOC_1_BODY:0 "Der Krieg hat begonnen: [ScriptContainer.MakeScope.Var('nfp20_extra_detail').GetCountryDefinition.GetName] ist Initiator, [ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName] die verteidigende Seite. Bei Kriegsausbruch gehörte das Ziel zu unserem Machtblock.\n\nDie Nachricht verdient die Aufmerksamkeit unserer Regierung. Derselbe Block belegt allein weder ein Militärbündnis noch eine Pflicht zum Kriegseintritt."
 NFP43_WAR_BLOC_1_LEAD:0 "[ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName], ein Mitglied unseres Machtblocks, ist Ziel eines neuen Krieges geworden."
 NFP43_WAR_BLOC_1_TITLE:0 "Krieg gegen unseren Blockpartner"
 NFP43_WAR_BLOC_2_BODY:0 "Zwischen Initiator [ScriptContainer.MakeScope.Var('nfp20_extra_detail').GetCountryDefinition.GetName] und Ziel [ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName] hat ein Krieg begonnen. Zum Ereigniszeitpunkt teilte Letzteres die Machtblockzugehörigkeit mit unserem Land.\n\nDie Zeitung berichtet über ein diplomatisches Ereignis in unserem Umfeld, ohne unser Land zum Teilnehmer zu erklären oder dem Block unbestätigte Pflichten zuzuschreiben."
 NFP43_WAR_BLOC_2_LEAD:0 "Unser Machtblockpartner [ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName] ist nun die verteidigende Seite."
 NFP43_WAR_BLOC_2_TITLE:0 "Der Krieg berührt unseren diplomatischen Kreis"
 NFP43_WAR_METRICS:0 "Quelle: on_diplo_play_war_start. Erfasst Initiator und Ziel des diplomatischen Spiels sowie die damalige Bündnisverbindung des Lesers mit dem Ziel. Initiator: [ScriptContainer.MakeScope.Var('nfp20_extra_detail').GetCountryDefinition.GetName]. Ziel: [ScriptContainer.MakeScope.Var('nfp20_secondary').GetCountryDefinition.GetName]. Priorität 190; Eilkandidat für das Kriegsressort. Gemeinsame Machtblockzugehörigkeit bestätigt allein keine Pflicht zum Kriegseintritt."
