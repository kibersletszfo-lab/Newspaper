l_german:
 NFP46_GOOD_LABEL:0 "[ScriptContainer.MakeScope.Var('nfp46_good').GetGoods.GetNameNoIcon]"
 NFP46_METRICS:0 "Ware: [ScriptContainer.MakeScope.Var('nfp46_good').GetGoods.GetNameNoIcon]. Kaufaufträge: [ScriptContainer.GetVariableValue('nfp46_buy_before')|1] → [ScriptContainer.GetVariableValue('nfp46_buy_after')|1]; Verkaufsaufträge: [ScriptContainer.GetVariableValue('nfp46_sell_before')|1] → [ScriptContainer.GetVariableValue('nfp46_sell_after')|1]. Abstand zur Nachfrage: [ScriptContainer.GetVariableValue('nfp46_gap_before')|1]% → [ScriptContainer.GetVariableValue('nfp46_gap_after')|1]%. Links steht die erste gespeicherte Aufnahme dieser Reihe, rechts die jüngste Monatsbeobachtung.\nRedaktionelle Schwelle: Angebot unter 80% der Nachfrage in zwei aufeinanderfolgenden Monatsaufnahmen oder direkter Mangelindikator des Spiels. Örtliche Dienstleistungen, Transport und Strom benötigen eine gesonderte Regionalbeobachtung."
 NFP46_SHORTAGE_BODY_1:0 "Das Spiel kennzeichnet unmittelbar einen Warenmangel auf unserem Markt. In zwei aufeinanderfolgenden Monatsbeobachtungen bestand ein Versorgungsproblem: entweder ein direkter Mangelindikator oder ein erheblicher Auftragsabstand.\n\nWare: [ScriptContainer.MakeScope.Var('nfp46_good').GetGoods.GetNameNoIcon]. Kaufaufträge: [ScriptContainer.GetVariableValue('nfp46_buy_before')|1] → [ScriptContainer.GetVariableValue('nfp46_buy_after')|1]; Verkaufsaufträge: [ScriptContainer.GetVariableValue('nfp46_sell_before')|1] → [ScriptContainer.GetVariableValue('nfp46_sell_after')|1]. Abstand zur Nachfrage: [ScriptContainer.GetVariableValue('nfp46_gap_before')|1]% → [ScriptContainer.GetVariableValue('nfp46_gap_after')|1]%. Links steht die erste gespeicherte Aufnahme dieser Reihe, rechts die jüngste Monatsbeobachtung.\n\nVerglichen werden Marktaufträge, nicht die Warenmenge, die Menschen fehlt. Diese Zahlen belegen weder Ursachen des Abstands noch bestimmte Bauvorhaben oder Folgen für den Lebensstandard."
 NFP46_SHORTAGE_BODY_2:0 "Die jüngste Aufnahme kennzeichnet unmittelbar einen Marktmangel. Seit zwei Monaten wird ein Versorgungsproblem beobachtet; die frühere Aufnahme kann durch den Auftragsabstand gezählt haben. Zwei Monate Produktionsmalus sind damit nicht belegt.\n\nWare: [ScriptContainer.MakeScope.Var('nfp46_good').GetGoods.GetNameNoIcon]. Kaufaufträge: [ScriptContainer.GetVariableValue('nfp46_buy_before')|1] → [ScriptContainer.GetVariableValue('nfp46_buy_after')|1]; Verkaufsaufträge: [ScriptContainer.GetVariableValue('nfp46_sell_before')|1] → [ScriptContainer.GetVariableValue('nfp46_sell_after')|1]. Abstand zur Nachfrage: [ScriptContainer.GetVariableValue('nfp46_gap_before')|1]% → [ScriptContainer.GetVariableValue('nfp46_gap_after')|1]%. Links steht die erste gespeicherte Aufnahme dieser Reihe, rechts die jüngste Monatsbeobachtung.\n\nVerglichen werden Marktaufträge, nicht die Warenmenge, die Menschen fehlt. Diese Zahlen belegen weder Ursachen des Abstands noch bestimmte Bauvorhaben oder Folgen für den Lebensstandard."
 NFP46_SHORTAGE_LEAD_1:0 "Der Warenmangel ist aus unseren Marktbeobachtungen nicht verschwunden. Wir greifen die Versorgungsfrage auf."
 NFP46_SHORTAGE_LEAD_2:0 "Auf unserem Markt ist ein direkter Mangelindikator erschienen. Das Problem verdient Aufmerksamkeit."
 NFP46_SHORTAGE_RECOVERY_BODY_1:0 "Nach unserer Warnung fehlt der direkte Mangelindikator in zwei aufeinanderfolgenden Monatsbeobachtungen; das Angebot beträgt in beiden Aufnahmen außerdem mindestens 80% der Nachfrage. Das verspricht weder niedrige Preise noch die Erholung jedes Betriebs.\n\nWare: [ScriptContainer.MakeScope.Var('nfp46_good').GetGoods.GetNameNoIcon]. Kaufaufträge: [ScriptContainer.GetVariableValue('nfp46_buy_before')|1] → [ScriptContainer.GetVariableValue('nfp46_buy_after')|1]; Verkaufsaufträge: [ScriptContainer.GetVariableValue('nfp46_sell_before')|1] → [ScriptContainer.GetVariableValue('nfp46_sell_after')|1]. Abstand zur Nachfrage: [ScriptContainer.GetVariableValue('nfp46_gap_before')|1]% → [ScriptContainer.GetVariableValue('nfp46_gap_after')|1]%. Links steht die erste gespeicherte Aufnahme dieser Reihe, rechts die jüngste Monatsbeobachtung.\n\nVerglichen werden Marktaufträge, nicht die Warenmenge, die Menschen fehlt. Diese Zahlen belegen weder Ursachen des Abstands noch bestimmte Bauvorhaben oder Folgen für den Lebensstandard."
 NFP46_SHORTAGE_RECOVERY_BODY_2:0 "Zwei aufeinanderfolgende Monatsaufnahmen zeigen weder den früheren direkten Mangelindikator noch einen Auftragsabstand über der redaktionellen Schwelle. Wir verzeichnen die Änderung und unterscheiden Verfügbarkeit und Preis.\n\nWare: [ScriptContainer.MakeScope.Var('nfp46_good').GetGoods.GetNameNoIcon]. Kaufaufträge: [ScriptContainer.GetVariableValue('nfp46_buy_before')|1] → [ScriptContainer.GetVariableValue('nfp46_buy_after')|1]; Verkaufsaufträge: [ScriptContainer.GetVariableValue('nfp46_sell_before')|1] → [ScriptContainer.GetVariableValue('nfp46_sell_after')|1]. Abstand zur Nachfrage: [ScriptContainer.GetVariableValue('nfp46_gap_before')|1]% → [ScriptContainer.GetVariableValue('nfp46_gap_after')|1]%. Links steht die erste gespeicherte Aufnahme dieser Reihe, rechts die jüngste Monatsbeobachtung.\n\nVerglichen werden Marktaufträge, nicht die Warenmenge, die Menschen fehlt. Diese Zahlen belegen weder Ursachen des Abstands noch bestimmte Bauvorhaben oder Folgen für den Lebensstandard."
 NFP46_SHORTAGE_RECOVERY_LEAD_1:0 "Wir kehren zu einer veröffentlichten Versorgungsgeschichte zurück: Zwei Beobachtungen zeigen das frühere Problem nicht mehr."
 NFP46_SHORTAGE_RECOVERY_LEAD_2:0 "Ermutigende Nachrichten in der Geschichte des Marktmangels."
 NFP46_SHORTAGE_RECOVERY_TITLE_1:0 "Der frühere Mangel lässt nach"
 NFP46_SHORTAGE_RECOVERY_TITLE_2:0 "Eine erfreuliche Wende in der Versorgung"
 NFP46_SHORTAGE_TITLE_1:0 "Unser Markt: Der Mangel verdient Aufmerksamkeit"
 NFP46_SHORTAGE_TITLE_2:0 "Die Versorgungsfrage bleibt offen"
 NFP46_SUPPLY_GAP_BODY_1:0 "In der jüngsten Monatsaufnahme betragen Verkaufsaufträge weniger als 80% der Kaufaufträge. Auch im Vormonat war ein Problem verzeichnet: ein erheblicher Auftragsabstand oder der direkte Mangelindikator des Spiels. Die redaktionelle Ungleichgewichtsschwelle bedeutet nicht automatisch einen Produktionsmalus.\n\nWare: [ScriptContainer.MakeScope.Var('nfp46_good').GetGoods.GetNameNoIcon]. Kaufaufträge: [ScriptContainer.GetVariableValue('nfp46_buy_before')|1] → [ScriptContainer.GetVariableValue('nfp46_buy_after')|1]; Verkaufsaufträge: [ScriptContainer.GetVariableValue('nfp46_sell_before')|1] → [ScriptContainer.GetVariableValue('nfp46_sell_after')|1]. Abstand zur Nachfrage: [ScriptContainer.GetVariableValue('nfp46_gap_before')|1]% → [ScriptContainer.GetVariableValue('nfp46_gap_after')|1]%. Links steht die erste gespeicherte Aufnahme dieser Reihe, rechts die jüngste Monatsbeobachtung.\n\nVerglichen werden Marktaufträge, nicht die Warenmenge, die Menschen fehlt. Diese Zahlen belegen weder Ursachen des Abstands noch bestimmte Bauvorhaben oder Folgen für den Lebensstandard."
 NFP46_SUPPLY_GAP_BODY_2:0 "Zwei aufeinanderfolgende Monatsaufnahmen verzeichnen ein Versorgungsproblem. Das Angebot liegt nun unter 80% der Nachfrage; zuvor bestand entweder ein solcher Abstand oder ein direkter Mangelindikator. Über Produktionsmali oder Folgen hoher Preise wird damit nichts behauptet.\n\nWare: [ScriptContainer.MakeScope.Var('nfp46_good').GetGoods.GetNameNoIcon]. Kaufaufträge: [ScriptContainer.GetVariableValue('nfp46_buy_before')|1] → [ScriptContainer.GetVariableValue('nfp46_buy_after')|1]; Verkaufsaufträge: [ScriptContainer.GetVariableValue('nfp46_sell_before')|1] → [ScriptContainer.GetVariableValue('nfp46_sell_after')|1]. Abstand zur Nachfrage: [ScriptContainer.GetVariableValue('nfp46_gap_before')|1]% → [ScriptContainer.GetVariableValue('nfp46_gap_after')|1]%. Links steht die erste gespeicherte Aufnahme dieser Reihe, rechts die jüngste Monatsbeobachtung.\n\nVerglichen werden Marktaufträge, nicht die Warenmenge, die Menschen fehlt. Diese Zahlen belegen weder Ursachen des Abstands noch bestimmte Bauvorhaben oder Folgen für den Lebensstandard."
 NFP46_SUPPLY_GAP_LEAD_1:0 "Seit zwei Monaten zeigen Versorgungsbeobachtungen ein Problem. In der jüngsten Aufnahme liegt das Angebot deutlich unter der Nachfrage."
 NFP46_SUPPLY_GAP_LEAD_2:0 "Wir machen auf ein anhaltendes Versorgungsproblem aufmerksam: Das Angebot liegt nun deutlich unter der Nachfrage."
 NFP46_SUPPLY_GAP_RECOVERY_BODY_1:0 "Seit zwei Monatsaufnahmen beträgt das Angebot mindestens 80% der Kaufaufträge, und kein direkter Mangelindikator wird verzeichnet. Unter dieser Schwelle kann ein Abstand bleiben: Die Zeitung verspricht weder vollständiges Gleichgewicht noch niedrige Preise.\n\nWare: [ScriptContainer.MakeScope.Var('nfp46_good').GetGoods.GetNameNoIcon]. Kaufaufträge: [ScriptContainer.GetVariableValue('nfp46_buy_before')|1] → [ScriptContainer.GetVariableValue('nfp46_buy_after')|1]; Verkaufsaufträge: [ScriptContainer.GetVariableValue('nfp46_sell_before')|1] → [ScriptContainer.GetVariableValue('nfp46_sell_after')|1]. Abstand zur Nachfrage: [ScriptContainer.GetVariableValue('nfp46_gap_before')|1]% → [ScriptContainer.GetVariableValue('nfp46_gap_after')|1]%. Links steht die erste gespeicherte Aufnahme dieser Reihe, rechts die jüngste Monatsbeobachtung.\n\nVerglichen werden Marktaufträge, nicht die Warenmenge, die Menschen fehlt. Diese Zahlen belegen weder Ursachen des Abstands noch bestimmte Bauvorhaben oder Folgen für den Lebensstandard."
 NFP46_SUPPLY_GAP_RECOVERY_BODY_2:0 "Nach unserer Warnung liegt der Markt seit zwei Monaten außerhalb der redaktionellen Problemschwelle: Das Angebot beträgt mindestens 80% der Nachfrage, der direkte Mangelindikator fehlt. Eine begrenzte Verbesserung der Kennzahlen, keine fertige Erklärung von Ursachen und Folgen.\n\nWare: [ScriptContainer.MakeScope.Var('nfp46_good').GetGoods.GetNameNoIcon]. Kaufaufträge: [ScriptContainer.GetVariableValue('nfp46_buy_before')|1] → [ScriptContainer.GetVariableValue('nfp46_buy_after')|1]; Verkaufsaufträge: [ScriptContainer.GetVariableValue('nfp46_sell_before')|1] → [ScriptContainer.GetVariableValue('nfp46_sell_after')|1]. Abstand zur Nachfrage: [ScriptContainer.GetVariableValue('nfp46_gap_before')|1]% → [ScriptContainer.GetVariableValue('nfp46_gap_after')|1]%. Links steht die erste gespeicherte Aufnahme dieser Reihe, rechts die jüngste Monatsbeobachtung.\n\nVerglichen werden Marktaufträge, nicht die Warenmenge, die Menschen fehlt. Diese Zahlen belegen weder Ursachen des Abstands noch bestimmte Bauvorhaben oder Folgen für den Lebensstandard."
 NFP46_SUPPLY_GAP_RECOVERY_LEAD_1:0 "Zurück zum veröffentlichten Problem: Das Angebot bleibt nicht mehr so weit hinter der Nachfrage zurück."
 NFP46_SUPPLY_GAP_RECOVERY_LEAD_2:0 "Zwei Beobachtungen bestätigen den früheren erheblichen Auftragsabstand nicht mehr."
 NFP46_SUPPLY_GAP_RECOVERY_TITLE_1:0 "Der Abstand auf dem Markt ist kleiner geworden"
 NFP46_SUPPLY_GAP_RECOVERY_TITLE_2:0 "Zeichen besserer Versorgung"
 NFP46_SUPPLY_GAP_TITLE_1:0 "Die Nachfrage überholt das Angebot"
 NFP46_SUPPLY_GAP_TITLE_2:0 "Der Marktabstand lässt sich nicht übersehen"
