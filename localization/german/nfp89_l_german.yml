l_german:
 NFP89_LAW_COLD:0 "Unsere Zuneigung zu diesem Land hält sich in Grenzen. Sein Gesetz wird dadurch weder besser noch schlechter. Schauen wir lieber, was sich für die Menschen ändert. Mit einer fremden Regierung streitet es sich leichter, wenn man den Gegenstand des Streits versteht."
 NFP89_LAW_DEPENDENT:0 "Zwischen unseren Ländern besteht ein Abhängigkeitsverhältnis. Die innere Ordnung des anderen Landes liegt unseren Angelegenheiten also recht nah. Seine örtlichen Auseinandersetzungen werden damit aber nicht zum genauen Abbild der unsrigen. Beurteilen wir die neue Regel nach ihrem eigenen Inhalt."
 NFP89_LAW_NEIGHBOR:0 "Als Nachbar kann man eine solche Veränderung schwerlich für eine ferne Angelegenheit halten. Ein Vergleich mit der eigenen Ordnung mag nützlich sein. Das fremde Gesetz schon als fertiges Rezept für uns zu lesen wäre voreilig. Das Haus nebenan kann andere Wände haben."
 NFP89_LAW_PARTNER:0 "Die Veränderung ist bei unserem Partner eingetreten. Unsere gemeinsamen Pläne verschwinden dadurch nicht. Doch ein Land, mit dem man Pläne macht, sollte man nicht nur an der Unterschrift unter einem Vertrag kennen. Wie die neue Vorschrift sich im Alltag bewährt, wird sich zeigen."
 NFP89_LAW_THREAT:0 "Unsere Beziehungen zu diesem Land geben Anlass zur Vorsicht. Das neue Gesetz richtet sich für sich genommen noch nicht gegen uns. Zu verstehen, wie das Land nun regiert wird, dürfte aber nützlicher sein, als jede Veränderung dort mit einem Spottwort zu quittieren."
 NFP89_WORLD_ACW_DISTANT:0 "Aus der Ferne lässt sich der amerikanische Krieg bequem als Streit zweier Lager lesen. Bei dieser bequemen Deutung geht das Wichtigste leicht verloren. Ein Land ist in einen inneren bewaffneten Kampf eingetreten, dessen Ausgang noch unbekannt ist."
 NFP89_WORLD_ACW_NEIGHBOR:0 "Für die Nachbarn Amerikas beginnt dieser Bürgerkrieg zu nah, um ihn unter die fernen Nachrichten einzureihen. Die Nähe verdient Aufmerksamkeit. Für sich genommen beweist sie noch keine Gefahr für unsere Grenze."
 NFP89_WORLD_ACW_OWN:0 "Wenn im eigenen Land Bürgerkrieg herrscht, liegt in dem Wort „innerer Konflikt“ wenig Trost. Über Amerikas Spaltung entscheiden jetzt Waffen. Wer siegen und was es kosten wird, steht in der heutigen Nachricht noch nicht."
 NFP89_WORLD_ACW_PARTNER:0 "Unsere Verbindungen zu Amerika müssen wir jetzt vor dem Hintergrund des Bürgerkriegs betrachten. Die bisherigen Vereinbarungen verdienen eine sorgfältige Lektüre. Die Freundschaft mit einem Land gibt noch keine fertige Antwort auf seine innere Spaltung."
 NFP89_WORLD_ACW_RIVAL:0 "Die Abneigung gegen die amerikanische Regierung macht aus dem Bürgerkrieg kein harmloses Schauspiel. Der Konflikt verändert die Lage eines Landes, mit dem wir rechnen müssen. Einen Sieger bestimmt die Redaktion nicht im Voraus."
 NFP89_WORLD_AUS_DISTANT:0 "Australien erscheint nun als geeinter Staat in den Nachrichten. Wie es mit seiner neuen Ordnung umgeht, wollen wir in späteren Ausgaben beurteilen. Die heutige verfügt noch nicht über diese Geschichte."
 NFP89_WORLD_AUS_NEIGHBOR:0 "Der australische Zusammenschluss ist in einer uns nahen Weltgegend zustande gekommen. Die Nachbarschaft macht die neue politische Lage wichtig, verrät aber ohne weitere Tatsachen noch nicht, was sie den Menschen bei uns bringt."
 NFP89_WORLD_AUS_OWN:0 "Der australische Zusammenschluss ist eine Nachricht aus dem eigenen Land unserer Leser. Der gemeinsame Staat ist da. Wie gut er die alltäglichen Angelegenheiten verschiedener Orte miteinander verbindet, wird sich erst zeigen."
 NFP89_WORLD_AUS_PARTNER:0 "Unser australischer Partner hat eine neue gemeinsame staatliche Ordnung erhalten. Gemeinsame Vorhaben sollten wir unter diesen neuen Umständen besprechen. Weder Reichtum noch fertige neue Verpflichtungen lassen sich der Einigung ohne Weiteres zuschreiben."
 NFP89_WORLD_AUS_RIVAL:0 "Mit Australien unterhalten wir schwierige Beziehungen. Seine Einigung wird dadurch nicht zur leeren Förmlichkeit. Die Veränderung zu verstehen ist nützlicher, als sie im Voraus für unbedeutend zu erklären."
 NFP89_WORLD_CAN_DISTANT:0 "Die Entstehung Kanadas verändert die nordamerikanische Karte. Vorerst meldet unser Bericht eben dies. Für eine Darstellung der konkreten wirtschaftlichen Folgen in unserem Land wären weitere Angaben nötig."
 NFP89_WORLD_CAN_NEIGHBOR:0 "In unserer Nachbarschaft hat sich Kanada zusammengeschlossen. Für uns ändert sich damit die politische Karte in der Nähe. Kanada zugleich neue Absichten zuzuschreiben wäre bereits eine Vermutung."
 NFP89_WORLD_CAN_OWN:0 "Kanada ist entstanden, und für unsere Leser ist das die neue staatliche Ordnung ihres eigenen Landes. Eine gemeinsame Karte gibt es bereits. Wie die gewohnten örtlichen Fragen darin gelöst werden, wird der Alltag zeigen."
 NFP89_WORLD_CAN_PARTNER:0 "Die kanadische Einigung betrifft ein Land, dem wir durch Verpflichtungen verbunden sind. Unsere gemeinsamen Pläne sollten mit der neuen Ordnung abgeglichen werden. Nur den Namen in den alten Papieren auszutauschen wird kaum genügen."
 NFP89_WORLD_CAN_RIVAL:0 "Auch bei schwierigen Beziehungen sollte man die kanadische Einigung in Rechnung stellen. Eine neue staatliche Ordnung muss der Redaktion nicht gefallen, um eine gründliche Betrachtung zu verdienen."
 NFP89_WORLD_CHINA_DISTANT:0 "Selbst aus der Ferne verdient Chinas Zerfall eine eigene Seite. Zwischen einer großen Veränderung in der Welt und einer Veränderung an unserem Ladentisch liegt allerdings ein Abstand, den eine Zeitungsvermutung allein nicht überbrückt."
 NFP89_WORLD_CHINA_NEIGHBOR:0 "Für seine Nachbarn ist Chinas Zerfall eine Veränderung gleich jenseits der Grenze. Die alte Karte reicht nicht mehr aus, um zu wissen, wer dort die Macht ausübt. Die konkreten Folgen werden wir gesondert betrachten müssen."
 NFP89_WORLD_CHINA_OWN:0 "Der Zerfall Chinas ist für unsere Leser die eigene Geschichte. Wer jetzt entscheidet und wo man eine Obrigkeit findet, die diese Entscheidungen auch durchsetzen kann, ist wichtiger als eine schöne Erklärung der neuen Karte."
 NFP89_WORLD_CHINA_PARTNER:0 "Mit China verbanden uns gemeinsame Überlegungen. Hinter dem vertrauten Namen lässt sich jetzt nicht mehr wie selbstverständlich der bisherige einheitliche Staat vermuten. Bevor wir das Gespräch fortsetzen, sollten wir wissen, mit wem wir es führen."
 NFP89_WORLD_CHINA_RIVAL:0 "Den Zerfall eines Landes, mit dem uns schwierige Beziehungen verbinden, kann man leicht mit Genugtuung aufnehmen. Nur verspricht eine Vielzahl neuer Regierungen weder einen bequemeren Nachbarn noch einfachere Verhandlungen."
 NFP89_WORLD_COMMUNE_DISTANT:0 "Über die Pariser Kommune wird man weit über Frankreich hinaus streiten. Unsere Ausgabe unterscheidet vorerst zwischen dem gesicherten Ereignis und Schlüssen darüber, wer anderswo mit einer Wiederholung zu rechnen hat."
 NFP89_WORLD_COMMUNE_NEIGHBOR:0 "Frankreichs Nachbarn erreicht die Nachricht von der Kommune aus einer nahen Hauptstadt. Die politische Nähe verdient Aufmerksamkeit, verrät aber für sich genommen noch nicht, ob sich etwas Vergleichbares auch bei uns wiederholen wird."
 NFP89_WORLD_COMMUNE_OWN:0 "Die Pariser Kommune betrifft die Ordnung der Macht im eigenen Land. Hinter dem großen politischen Namen stehen Ereignisse, die noch nicht abgeschlossen sind. Mit einem bequemen endgültigen Ausgang kann die heutige Ausgabe nicht dienen."
 NFP89_WORLD_COMMUNE_PARTNER:0 "Aus Frankreich, dem wir durch Verpflichtungen verbunden sind, kommt die Nachricht von der Kommune. Die bisherigen diplomatischen Überlegungen müssen sich jetzt an einer neuen Frage nach der Macht messen lassen und nicht nur am vertrauten Namen des Partners."
 NFP89_WORLD_COMMUNE_RIVAL:0 "Schwierige Beziehungen zu Frankreich legen eine spitze Bemerkung nahe. Bei der Pariser Kommune gilt es aber zunächst zu verstehen, was sich an der Macht verändert. Ein guter Hieb mit der Feder ersetzt diese Erklärung nicht."
 NFP89_WORLD_ETH_DISTANT:0 "Die äthiopische Einigung verdient ihren Platz in der Weltchronik. Wie sie sich auf konkrete internationale Angelegenheiten auswirkt, bleibt zu beobachten. Die neue Karte allein enthält nicht alle künftigen Antworten."
 NFP89_WORLD_ETH_NEIGHBOR:0 "In unserer Nachbarschaft hat sich Äthiopien geeint. Für die Nachbarn ist es nützlich, sich die neue politische Lage zu vergegenwärtigen, bevor sie weiter über die Region reden, als hätte es die heutige Nachricht nicht gegeben."
 NFP89_WORLD_ETH_OWN:0 "Die äthiopische Einigung gehört zur eigenen Geschichte unserer Leser. Die gemeinsame staatliche Ordnung ist bereits eine Nachricht. Berichte darüber, wie sie das Leben verbessert hat, werden sich auf die nächsten Ereignisse stützen müssen."
 NFP89_WORLD_ETH_PARTNER:0 "Bei unserem äthiopischen Partner hat sich die staatliche Ordnung geändert. Das ist ein Anlass, gemeinsame Pläne mit der Einigung des Landes abzugleichen. In der neuen Lage nur eine andere Form der bisherigen Vereinbarungen zu sehen wäre zu einfach."
 NFP89_WORLD_ETH_RIVAL:0 "Auch bei schwierigen Beziehungen lässt sich die äthiopische Einigung nicht aus der Rechnung streichen. Die Ordnung des Landes hat sich geändert. Ob uns das gefällt, ist eine andere Frage und hebt die Tatsache nicht auf."
 NFP89_WORLD_FLU_DISTANT:0 "Die Grippe hat die Weltnachrichten erreicht. Damit ist noch nicht die Lage in jedem einzelnen Land beschrieben. Wo und wie sehr die Krankheit die Menschen betrifft, muss sich im Einzelnen zeigen, ohne Hilfe einer großen gemeinsamen Schlagzeile."
 NFP89_WORLD_FLU_NEIGHBOR:0 "Die Nachricht von der Grippe erreicht uns aus der Nachbarschaft. Die Nähe verdient Beachtung. Ohne entsprechende Angaben wird die Redaktion dennoch nicht behaupten, die Krankheit habe sich schon bei uns verbreitet."
 NFP89_WORLD_FLU_OWN:0 "Die Nachricht von der Grippe betrifft das Land unserer Leser. Das gibt Anlass, gesicherte Angaben zur Krankheit zu verfolgen. Die heutige Meldung nennt weder eine Zahl der Erkrankten noch das Ausmaß der Verbreitung."
 NFP89_WORLD_FLU_PARTNER:0 "Aus einem Staat, mit dem uns Verpflichtungen verbinden, kommt die Nachricht von der Grippe. Die Krankheit verdient für sich genommen Aufmerksamkeit. Gemeinsame Diplomatie ersetzt keine Auskunft darüber, wie es um die Gesundheit der Menschen steht."
 NFP89_WORLD_FLU_RIVAL:0 "Das Verhältnis zur Regierung mag schlecht sein. Die Nachricht von der Grippe wird deshalb nicht zum Anlass für Jubel. Wie es um die Krankheit steht, wollen wir aus Meldungen über sie erfahren, nicht aus einer Liste politischer Sympathien."
 NFP89_WORLD_GER_DISTANT:0 "Die deutsche Einigung ist auch jenseits Europas zu bemerken. Das Entstehen eines gemeinsamen Staates sagt für sich genommen aber noch nicht, welche Veränderungen bis in unsere eigenen Angelegenheiten reichen werden."
 NFP89_WORLD_GER_NEIGHBOR:0 "Für Deutschlands Nachbarn bedeutet die Einigung, dass neben ihnen jetzt ein gemeinsamer Staat liegt. Wie er mit der neuen Ordnung umgeht, werden wir sehen. Die Redaktion betrachtet nicht jeden seiner nächsten Schritte von vornherein als beschlossene Sache."
 NFP89_WORLD_GER_OWN:0 "Deutschland hat sich geeint. Für unsere Leser hat sich damit der eigene Staat verändert. Der gemeinsame Name ist da. Wie gemeinsam auch die Angelegenheiten werden, zeigen die nächsten Jahre."
 NFP89_WORLD_GER_PARTNER:0 "Unser deutscher Partner verfügt nun über einen geeinten Staat. Die gemeinsamen Pläne sollten mit seiner neuen Stellung abgeglichen werden. Die Bekanntschaften von gestern bleiben nützlich, aber sie erhalten die politische Karte von gestern nicht."
 NFP89_WORLD_GER_RIVAL:0 "Die Einigung Deutschlands verändert den Aufbau eines Landes, mit dem unsere Beziehungen nicht einfach sind. So zu tun, als hätte sich lediglich die Aufschrift auf der Karte geändert, wäre eine recht kostspielige Art, sich zu beruhigen."
 NFP89_WORLD_ITA_DISTANT:0 "Italien ist mit der Meldung seiner Einigung auf die Weltseite gelangt. Um von ihrem Nutzen oder Schaden für unser Land zu erzählen, fehlt allerdings noch der nächste Teil der Geschichte: die konkreten Veränderungen."
 NFP89_WORLD_ITA_NEIGHBOR:0 "Italiens Nachbarn müssen die Halbinsel jetzt anders betrachten. Die staatliche Ordnung in ihrer Nähe hat sich geändert. Einen fertigen Beweis für die künftigen Absichten dieses Staates liefert die Nachricht allein noch nicht."
 NFP89_WORLD_ITA_OWN:0 "Italien hat einen gemeinsamen Staat erhalten. Für die Menschen, die in ihm leben, beginnt die Einigung dort, wo der neue Name auf die vertrauten Angelegenheiten vor Ort trifft."
 NFP89_WORLD_ITA_PARTNER:0 "Mit unserem italienischen Partner werden wir es in einer neuen politischen Lage zu tun haben. Das nächste Gespräch sollte mit einer Prüfung der gemeinsamen Pläne beginnen. Die Annahme, dass sich durch die Einigung nichts an ihnen ändere, wäre ein schwacher Ersatz."
 NFP89_WORLD_ITA_RIVAL:0 "Unsere schwierigen Beziehungen zu Italien machen seine Einigung nicht zur Nebensache. Auf der Halbinsel ist ein gemeinsamer Staat entstanden. Die Nachricht mag uns wenig gelegen kommen, aber an Gehalt verliert sie durch das Ausbleiben unserer Glückwünsche nicht."
 NFP89_WORLD_JAP_DISTANT:0 "Die Restauration in Japan verdient auch aus der Ferne Beachtung. Nur sollte man das Wort „Veränderung“ nicht beiläufig mit „gelungene Erneuerung“ übersetzen. Für Letzteres werden eigene Belege nötig sein."
 NFP89_WORLD_JAP_NEIGHBOR:0 "Für Japans Nachbarn hat die Restauration das politische Umfeld verändert. Achten wir auf die Entscheidungen der neuen Führung. Aus ihrer bloßen Stellung lässt sich noch nicht ihr gesamtes künftiges Programm ablesen."
 NFP89_WORLD_JAP_OWN:0 "Die kaiserliche Herrschaft ist in unserem eigenen Land wiederhergestellt worden. Die neue Stellung der Staatsgewalt ist eine Tatsache. Ihr schon jetzt die künftigen Erfolge zuzuschreiben, bevor es diese Erfolge gibt, wäre voreilig."
 NFP89_WORLD_JAP_PARTNER:0 "Bei unserem japanischen Partner hat sich die Stellung der obersten Gewalt geändert. Wir sollten genauer hinsehen, mit wem wir künftig worüber verhandeln. Alle bisherigen Verbindungen deshalb für erloschen zu erklären wäre verfrüht."
 NFP89_WORLD_JAP_RIVAL:0 "An der japanischen Regierung mögen wir manches auszusetzen haben. Die Restauration ist jedoch zunächst eine politische Veränderung. Sie beweist für sich allein weder eine Stärkung des Landes noch sein baldiges Scheitern."
 NFP89_WORLD_PANAMA_DISTANT:0 "Der neue Weg durch Panama verändert die Möglichkeiten des Seeverkehrs. Es wäre angenehm, gleich anschließend von schon erzielten Gewinnen für unser Land zu berichten. Nur enthält die heutige Meldung dazu keine Angaben."
 NFP89_WORLD_PANAMA_NEIGHBOR:0 "Der Panamakanal liegt in einer uns nahen Weltgegend. Zwei Ozeane verbindet jetzt eine neue Durchfahrt. Welche unserer Transporte das betrifft, werden wir eigens prüfen müssen."
 NFP89_WORLD_PANAMA_OWN:0 "Der Panamakanal ist im Land unserer Leser fertiggestellt. Die Verbindung der Ozeane ist gelungen. Nun wird sich zeigen, wie die neue Durchfahrt tatsächlich genutzt wird."
 NFP89_WORLD_PANAMA_PARTNER:0 "Unsere Verbindungen zu dem Staat am Panamakanal verleihen diesem Bauwerk besonderes Interesse. Ein gemeinsamer diplomatischer Kreis bedeutet freilich weder freie Durchfahrt noch einen schon gesicherten Handelsgewinn."
 NFP89_WORLD_PANAMA_RIVAL:0 "Bei schwierigen Beziehungen zum Staat am Panamakanal fällt es leicht, in dem Kanal bloß ein fremdes Glück zu sehen. Nützlicher wäre zu klären, was die Durchfahrt tatsächlich ermöglicht und zu welchen Bedingungen sie genutzt werden kann."
 NFP89_WORLD_ROM_DISTANT:0 "Die Einigung der rumänischen Fürstentümer verändert die politische Ordnung der Region. Aus der Ferne sollte man zunächst die Veränderung selbst verstehen, bevor man in ihr die Bestätigung einer liebgewonnenen allgemeinen Theorie sucht."
 NFP89_WORLD_ROM_NEIGHBOR:0 "Für die Nachbarn Rumäniens ist die Einigung eine Veränderung vor der eigenen Tür und nicht nur eine Zeile in der europäischen Chronik. Mit wem die gemeinsamen Angelegenheiten jetzt zu regeln sind, ist wichtiger als Vermutungen darüber, wie sie zweifellos enden müssten."
 NFP89_WORLD_ROM_OWN:0 "Die rumänische Einigung ist für unsere Leser eine Veränderung des eigenen Staates. Für gemeinsame Entscheidungen gibt es jetzt eine neue Ordnung. Die gewohnten Fragen vor Ort sind deshalb noch nicht verschwunden."
 NFP89_WORLD_ROM_PARTNER:0 "In den rumänischen Landen hat sich ein Staat geeint, dem wir durch Verpflichtungen verbunden sind. Die bisherigen Bekanntschaften bleiben wertvoll. Das gemeinsame Gespräch sollte jetzt allerdings die neue staatliche Ordnung berücksichtigen."
 NFP89_WORLD_ROM_RIVAL:0 "Zum rumänischen Staat haben wir schwierige Beziehungen. Die Einigung verändert dennoch die Grundlage unserer diplomatischen Überlegungen. Am alten Bild können wir nicht allein deshalb festhalten, weil uns das neue unbequem ist."
 NFP89_WORLD_SPRING_DISTANT:0 "Unter dem gemeinsamen Namen Völkerfrühling stehen unterschiedliche politische Geschichten nebeneinander. Aus der Ferne ist es besonders leicht, sie für eine einzige zu halten. Unseren Lesern ist mehr damit gedient, die Unterschiede zu sehen, als statt Tatsachen eine schöne Verallgemeinerung zu erhalten."
 NFP89_WORLD_SPRING_NEIGHBOR:0 "Die Erschütterungen geschehen bei unseren Nachbarn. Das macht die Meldung nah, gibt uns aber noch nicht das Recht, denselben Ausgang bei uns für unvermeidlich zu erklären. Eine fertige politische Zukunft kommt nicht einfach über die Grenze."
 NFP89_WORLD_SPRING_OWN:0 "Für unsere Leser ist der Völkerfrühling mehr als ein Titel europäischer Nachrichten. Die eigenen politischen Veränderungen gilt es daran zu verstehen, was hier geschieht, und nicht an der Bequemlichkeit einer gemeinsamen historischen Bezeichnung."
 NFP89_WORLD_SPRING_PARTNER:0 "Die politischen Erschütterungen betreffen einen Staat, dem wir durch Verpflichtungen verbunden sind. Wir sollten ihn aufmerksamer verfolgen. Ein bisheriger gemeinsamer Plan erklärt nicht von selbst, wie der Partner durch die Veränderungen kommen wird."
 NFP89_WORLD_SPRING_RIVAL:0 "Der Völkerfrühling hat ein Land erreicht, zu dem unsere Beziehungen schwierig sind. Jede seiner Schwierigkeiten als unseren Gewinn zu zählen wäre für derart verwickelte Ereignisse eine etwas zu einfache Rechnung."
 NFP89_WORLD_SUEZ_DISTANT:0 "Der Suezkanal verkürzt den bisherigen Seeweg dort, wo die neue Passage zur Route passt. Daraus folgt noch nicht, dass bei uns jede Ware billiger wird. Zwischen Kanal und Ladentisch liegt ein eigener Weg."
 NFP89_WORLD_SUEZ_NEIGHBOR:0 "Der Suezkanal ist in der Nähe unseres Landes eröffnet worden. Der neue Weg verdient wegen seiner Nähe Beachtung. Ob sich seine Nutzung lohnt, hängt allerdings von mehr Umständen ab als der Entfernung auf der Karte."
 NFP89_WORLD_SUEZ_OWN:0 "Der Suezkanal ist im Land unserer Leser fertiggestellt worden. Aus der großen Baustelle wurde eine Durchfahrt zwischen zwei Meeren. Welchen wirtschaftlichen Ertrag sie bringt, muss sich noch im praktischen Gebrauch erweisen."
 NFP89_WORLD_SUEZ_PARTNER:0 "Mit dem Staat am Suezkanal verbinden uns Verpflichtungen. Die neue Durchfahrt gehört in unsere gemeinsamen Überlegungen. Ihre Fertigstellung allein verspricht uns aber noch keine besonderen Bedingungen für die Nutzung."
 NFP89_WORLD_SUEZ_RIVAL:0 "Unsere Beziehungen zum Staat am Suezkanal sind schwierig. Der Kanal wird darum nicht weniger wirklich. Bevor wir in ihm einen gegen uns gerichteten Vorteil sehen, sollten wir die tatsächlichen Bedingungen für die Durchfahrt betrachten."
 NFP89_WORLD_TAIPING_DISTANT:0 "Im chinesischen Konflikt ist mit dem Taiping-Staat eine eigene politische Macht hinzugekommen. Das verändert den Kreis der Beteiligten, erlaubt der Redaktion aber noch nicht, den Ausgang der Geschichte zu erzählen."
 NFP89_WORLD_TAIPING_NEIGHBOR:0 "In unserer Nachbarschaft ist die Herrschaft der Taiping entstanden. Wer dort künftig worüber bestimmen kann, verdient besondere Aufmerksamkeit. Über sämtliche Einflussgrenzen gibt die heutige Nachricht noch keine fertige Auskunft."
 NFP89_WORLD_TAIPING_OWN:0 "Die Entstehung des Taiping-Staates gehört zu unserer eigenen politischen Geschichte. Eine neue Macht ist in Erscheinung getreten. Ihre Stellung in der Auseinandersetzung lässt sich nicht durch ein im Voraus geschriebenes Ende des Kampfes ersetzen."
 NFP89_WORLD_TAIPING_PARTNER:0 "Uns verbinden mit dem Taiping-Staat Beziehungen, die diese Nachricht näher rücken als eine gewöhnliche Meldung aus China. Für unsere gemeinsamen Überlegungen zählt, dass eine eigene Staatsgewalt entstanden ist, nicht die Vermutung, ihr sei der Erfolg bereits sicher."
 NFP89_WORLD_TAIPING_RIVAL:0 "Die Beziehungen zum Taiping-Staat sind alles andere als einfach. Umso wichtiger ist es, das Entstehen einer neuen Macht von ihren künftigen Möglichkeiten zu unterscheiden. Ersteres ist bekannt. Letztere folgen noch nicht aus dieser einen Meldung."
 NFP89_WORLD_YUG_DISTANT:0 "Auf dem Balkan ist ein neuer gemeinsamer Staat entstanden. Aus der Ferne lässt sich ihm leicht sofort eine fertige historische Rolle zuweisen. Wir beginnen mit etwas Bescheidenerem: der festgestellten Veränderung auf der Karte."
 NFP89_WORLD_YUG_NEIGHBOR:0 "Für Jugoslawiens Nachbarn verändert der gemeinsame Staat die politische Karte vor der eigenen Tür. Welche Entscheidungen folgen werden, ist noch nicht bekannt. Aus der Nachbarschaft allein kann die Redaktion keine fremden Pläne im Voraus lesen."
 NFP89_WORLD_YUG_OWN:0 "Jugoslawien ist entstanden, und unsere Leser gehören zu einem neuen gemeinsamen Staat. Der gemeinsame Name wird auf recht verschiedene örtliche Angelegenheiten treffen. Eben dort erhält die Einigung ihren alltäglichen Inhalt."
 NFP89_WORLD_YUG_PARTNER:0 "Die Bildung Jugoslawiens verändert die Ordnung unseres Partners auf dem Balkan. Die gemeinsamen Pläne verdienen es, in der Sache neu besprochen zu werden. Der neue Staat ist ein Anlass, die Rechnung zu überprüfen, und nicht bloß eine Adresse für Glückwünsche."
 NFP89_WORLD_YUG_RIVAL:0 "Zum jugoslawischen Staat unterhalten wir schwierige Beziehungen. Seine Entstehung verdient dennoch Aufmerksamkeit. Balkanische Angelegenheiten nur aus Abneigung gegen die neue Karte weiter anhand der alten zu erklären wäre ein eigenartiger Selbsttrost."
